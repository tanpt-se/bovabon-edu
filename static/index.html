<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bovabon Edu</title>
  <meta name="description" content="Bovabon Edu: lộ trình lập trình và tiếng Anh IT, câu hỏi theo module và bài code chấm tự động.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/SourceSans3VF-Upright.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/app.css">
  <script>
    try { var t = localStorage.getItem('bovabon.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <button class="skip-link" id="skip-link" type="button" aria-controls="view">Bỏ qua điều hướng, tới nội dung</button>
  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-hidden="true" inert>
      <a class="brand" href="#/">
        <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M9 8h8.5a5 5 0 0 1 1.6 9.7A5.2 5.2 0 0 1 17.8 24H9z" fill="none" stroke="var(--on-accent)" stroke-width="2.6" stroke-linejoin="round"/><path d="M9 16h8" stroke="var(--on-accent)" stroke-width="2.6"/></svg>
        <span><b>Bovabon</b> Edu</span>
      </a>
      <button class="btn ghost sm" id="menu-close" type="button" hidden style="display:none"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons.svg#tabler-x"></use></svg><span>Đóng menu</span></button>
      <div class="area-switch" id="area-switch" role="group" aria-label="Khu vực học">
        <button type="button" data-area="dev" aria-pressed="true"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons.svg#tabler-code"></use></svg><span>Lập trình</span></button>
        <button type="button" data-area="english" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons.svg#tabler-language"></use></svg><span>Tiếng Anh</span></button>
      </div>
      <nav class="nav" id="nav">
        <a href="#/" data-route="home"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons.svg#tabler-layout-dashboard"></use></svg>Tổng quan</a>
        <div class="nav-label">Danh mục</div>
        <div id="nav-tracks"></div>
        <div class="nav-label">Luyện tập</div>
        <a href="#/code" data-route="code"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons.svg#tabler-code"></use></svg>Code Lab</a>
        <a href="#/exam" data-route="exam"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons.svg#tabler-clock"></use></svg>Thi thử</a>
        <a href="#/review" data-route="review"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons.svg#tabler-rotate-clockwise"></use></svg>Ôn câu sai</a>
        <a href="#/bank" data-route="bank"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons.svg#tabler-list-details"></use></svg>Kho câu hỏi</a>
        <div class="nav-label">Cá nhân</div>
        <a href="#/progress" data-route="progress"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons.svg#tabler-chart-bar"></use></svg>Tiến độ</a>
        <a href="#/settings" data-route="settings"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons.svg#tabler-adjustments-horizontal"></use></svg>Cài đặt</a>
      </nav>
      <div class="sidebar-foot">
        <button class="btn ghost sm theme-toggle" id="theme-toggle" type="button" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons.svg#tabler-moon"></use></svg><span>Đổi tông nền</span></button>
        <button class="btn ghost sm lang-toggle" id="lang-toggle" type="button" aria-label="Ngôn ngữ"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons.svg#tabler-language"></use></svg><span id="lang-label" data-no-i18n>English</span></button>
        <p class="muted tiny">Không cần đăng nhập; tiến độ lưu trên trình duyệt này.</p>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="btn ghost icon" id="menu-btn" type="button" aria-label="Mở menu" aria-expanded="false" aria-controls="sidebar"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/icons.svg#tabler-menu-2"></use></svg></button>
        <div class="crumbs" id="crumbs"></div>
        <div class="top-stats" id="top-stats"></div>
      </header>
      <main id="view" class="view" tabindex="-1"><div class="loading">Đang tải kho dữ liệu…</div></main>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
