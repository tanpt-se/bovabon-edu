# Danh mục học (hiển thị trên sidebar / trang chủ) → các mục con (module) bên trong.
#
# Mỗi danh mục gom module từ một hay nhiều file lộ trình (data/*.toml), ví dụ "Python" gồm
# Flask, FastAPI và Django. Bấm vào danh mục là học / luyện / thi được toàn bộ mục con.
#
# - Thứ tự trong file = thứ tự hiển thị; `group` nhóm danh mục trên sidebar.
# - `modules` = id module theo đúng thứ tự mục con. Mỗi module chỉ thuộc 1 danh mục,
#   và mọi module trong 1 danh mục phải cùng `area` (dev | english).
# - Module chưa được xếp vào đâu sẽ tự rơi vào danh mục trùng id với lộ trình của nó
#   (hoặc một danh mục mới lấy tên lộ trình) — nhớ xếp lại vào đây khi thêm lộ trình mới.

