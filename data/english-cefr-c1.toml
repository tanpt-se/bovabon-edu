[[questions]]
id = "cefr-c1-x010"
module = "cefr-c1-grammar-plus"
type = "essay"
difficulty = 3
prompt = "Write two sentences for a report. Use a noun form of assess and a correctly controlled participle clause beginning with Having reviewed."
keywords = [["assessment", "assess"], ["having reviewed"], ["evidence", "findings", "data"]]
min_keywords = 2
model_answer = '''Having reviewed the evidence, the panel commissioned an independent assessment of the risks.'''
explanation = "Câu mẫu dùng cụm phân từ cùng chủ thể với mệnh đề chính và danh từ *assessment* theo sau bởi *of*."

[[questions]]
id = "cefr-c1-x011"
module = "cefr-c1-register"
type = "single"
difficulty = 1
prompt = "The sample includes only twelve participants. Choose the most appropriately hedged conclusion."
options = ["The results may indicate a useful trend, but the sample is small.", "The results undoubtedly prove the treatment works for everyone.", "The treatment always works because twelve people took part.", "The sample proves that no further research is needed."]
answer = [0]
explanation = "Kết luận cần giới hạn theo cỡ mẫu nhỏ; *may indicate* không khẳng định quá mức."

[[questions]]
id = "cefr-c1-x012"
module = "cefr-c1-register"
type = "multiple"
difficulty = 2
prompt = "Select the linkers used with the correct logical relationship."
options = ["The trial was small; nevertheless, the pattern is worth investigating.", "Demand fell; consequently, the team reduced its forecast.", "The method is expensive; similarly, it may be impractical.", "The sample was narrow; therefore, the conclusion should be treated cautiously.", "The result was uncertain; moreover, it proves the policy works."]
answer = [0, 1, 3]
explanation = "*Nevertheless* signals contrast; *consequently* and *therefore* introduce results or conclusions. *Similarly* does not express consequence, and uncertainty does not prove a claim."

[[questions]]
id = "cefr-c1-x013"
module = "cefr-c1-register"
type = "single"
difficulty = 2
prompt = "Which revision makes the reference of this clearer? The survey was limited to one region. This affected the results."
options = ["The survey was limited to one region. This sampling limitation affected the results.", "The survey was limited to one region. This was affected.", "The survey was limited to one region. They affected the results.", "The survey was limited to one region. It was affected by this."]
answer = [0]
explanation = "Cụm danh từ *this sampling limitation* nêu rõ *this* đang tóm tắt ý nào; các lựa chọn khác mơ hồ hoặc sai quy chiếu."

[[questions]]
id = "cefr-c1-x014"
module = "cefr-c1-register"
type = "fill"
difficulty = 2
prompt = "Choose a linker showing contrast: The revised model is easier to explain; {{blank}}, it requires more data."
blanks = [["nevertheless", "however"]]
explanation = "Hai vế tương phản: mô hình dễ giải thích hơn nhưng cần nhiều dữ liệu hơn; dùng *nevertheless* hoặc *however*."

[[questions]]
id = "cefr-c1-x015"
module = "cefr-c1-register"
type = "fill"
difficulty = 2
prompt = "Complete the parallel sentence with an appropriate substitute: The first group tested the revised form, and the second group {{blank}} a week later."
blanks = [["did so"]]
explanation = "*Did so* thay cho hành động *tested the revised form*, tránh lặp mà vẫn rõ."

[[questions]]
id = "cefr-c1-x016"
module = "cefr-c1-register"
type = "single"
difficulty = 3
prompt = "The data are consistent across three independent trials. Which sentence is the best calibrated summary?"
options = ["The data strongly support the conclusion across three independent trials.", "The data may possibly perhaps support the conclusion.", "The data unquestionably prove the conclusion in every setting.", "The data are sort of indicating the conclusion."]
answer = [0]
explanation = "Ba thử nghiệm độc lập hỗ trợ cách khẳng định mạnh vừa phải. *Prove in every setting* vượt quá phạm vi dữ liệu."

[[questions]]
id = "cefr-c1-x017"
module = "cefr-c1-register"
type = "multiple"
difficulty = 3
prompt = "Select the sentences in which the reference remains clear without repeating the full noun phrase."
options = ["The second proposal is less costly; it also takes less time to implement.", "The report and the dataset were reviewed; the latter contained several errors.", "The two teams submitted different models; this was more accurate.", "The policy changed twice, which confused several applicants.", "The panel reviewed the proposal and the budget; it was incomplete."]
answer = [0, 1, 3]
explanation = "Ở câu 3, *this* không chỉ rõ mô hình nào; ở câu 5, *it* có thể chỉ proposal hoặc budget. Các đáp án đúng có quy chiếu đủ rõ."

[[questions]]
id = "cefr-c1-x018"
module = "cefr-c1-register"
type = "single"
difficulty = 2
prompt = "Choose the linker that shows a result: The revised process reduced duplicate checks, ______ staff could complete reviews sooner."
options = ["so", "whereas", "nevertheless", "provided that"]
answer = [0]
explanation = "*So* nối kết quả với nguyên nhân. Các từ còn lại lần lượt thể hiện tương phản, nhượng bộ hoặc điều kiện."

[[questions]]
