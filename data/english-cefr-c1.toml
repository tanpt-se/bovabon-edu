  "More evidence would be needed to assess long-term retention.",
  "The author rejects the pilot as a failure."
]
answer = [0, 1, 3]
explanation = "Câu đầu ghi nhận phản hồi tích cực; số phòng ban ít và thiếu dữ liệu dài hạn giới hạn kết luận. Văn bản không cho biết tác động toàn tổ chức hay gọi pilot là thất bại."

[[questions]]
id = "cefr-c1-036"
module = "cefr-c1-reading-writing"
type = "fill"
difficulty = 1
prompt = "Complete the contrast between two sources: *Lee's survey highlights flexible hours, {{blank}} Tran's interviews emphasise team support.*"
blanks = [["whereas"]]
explanation = "*Whereas* đặt hai phát hiện tương phản cạnh nhau trong cùng một câu."

[[questions]]
id = "cefr-c1-037"
module = "cefr-c1-reading-writing"
type = "fill"
difficulty = 2
prompt = "Complete the synthesis sentence: *{{blank}}, the two studies suggest that flexibility may help retention, but it is not the only factor.*"
blanks = [["Taken together"]]
explanation = "*Taken together* báo hiệu người viết đang rút ra nhận xét khi xem nhiều nguồn như một tổng thể."

[[questions]]
id = "cefr-c1-038"
module = "cefr-c1-reading-writing"
type = "fill"
