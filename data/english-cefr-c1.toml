[[questions]]
id = "cefr-c1-x008"
module = "cefr-c1-grammar-plus"
type = "multiple"
difficulty = 2
prompt = "Which revisions make the sentence more concise without changing its meaning? Original: Because the supplier was late, the launch was delayed."
