[[questions]]
id = "cefr-c1-x002"
module = "cefr-c1-grammar-plus"
type = "multiple"
difficulty = 2
prompt = "Select the sentences with a correctly attached reduced clause."
options = ["Applicants meeting all three criteria will be interviewed.", "The data collected during the trial were anonymised.", "Having reviewed the figures, the report was sent by Lee.", "The proposals submitted yesterday are being evaluated.", "Walking through the gallery, the paintings looked unusually bright."]
answer = [0, 1, 3]
explanation = "Cụm V-ing/V3 phải bổ nghĩa cho danh từ phù hợp. Ở câu 3, Lee mới là người xem số liệu; câu 4 khiến tranh có vẻ như đang đi bộ."

[[questions]]
id = "cefr-c1-x003"
module = "cefr-c1-grammar-plus"
type = "single"
difficulty = 2
prompt = "Which sentence avoids a dangling participle?"
options = ["Having checked the calculations, Maya sent the revised estimate.", "Having checked the calculations, the revised estimate was sent.", "While reviewing the draft, several errors became obvious.", "After reading the appendix, the main finding seemed less convincing."]
answer = [0]
