model_answer = '''I see your point about keeping the client informed. I'm not sure the current deadline leaves enough time for a reliable review, and we both want to avoid sending incomplete figures. Could we share a brief update today and agree on a final date after the review?'''
explanation = "Câu mẫu ghi nhận ý kiến, nêu dè dặt có căn cứ, nhắc mục tiêu chung và đề xuất bước tiếp theo."

[[modules]]
id = "cefr-c1-reading-writing"
title = "C1 · Đọc hiểu và viết học thuật"
description = "Đọc hàm ý và giọng điệu, tổ chức proposal/report/essay, tóm tắt và tổng hợp nhiều nguồn."
lesson = '''
### Đọc điều văn bản hàm ý
Khi đọc văn bản dài, tách **điều được nói trực tiếp** khỏi **điều có thể suy ra**. Tìm luận điểm, bằng chứng, giới hạn, từ chỉ mức độ và quan hệ giữa các đoạn. *The pilot's results are encouraging, although the sample remains small* vừa ghi nhận tín hiệu tích cực vừa giới hạn mức kết luận. Từ *although* cho thấy tác giả không muốn người đọc xem kết quả ban đầu là bằng chứng dứt khoát. Một câu như *The committee was thanked for its patience* sau khi nhắc nhiều lần bị trễ có thể gợi ý sự chậm trễ gây bất tiện, nhưng cần dựa vào ngữ cảnh thay vì đoán thêm cảm xúc.

| Dấu hiệu | Cách đọc có căn cứ |
|---|---|
| *may, appears, preliminary* | kết luận còn dè dặt |
| *however, despite this* | có giới hạn hoặc ý đối lập quan trọng |
| *only, still, even* | có thể nhấn mạnh sự khác kỳ vọng |
| đánh giá mạnh như *unacceptable* | quan điểm phê phán rõ hơn |

Giọng điệu (tone) có thể là *measured* (chừng mực), *cautiously optimistic* (lạc quan dè dặt), *critical* (phê bình) hoặc *skeptical* (hoài nghi). Chủ đề tiêu cực không tự động có nghĩa là giọng giận dữ. Hãy trích dấu hiệu từ ngữ và cấu trúc để giải thích suy luận.

### Tổ chức proposal, report và essay
| Văn bản | Khung thường dùng | Trọng tâm |
|---|---|---|
| **Proposal** | vấn đề → mục tiêu → phương án → nguồn lực/lịch → cách đánh giá | thuyết phục người đọc chọn hành động |
| **Report** | phạm vi → phát hiện → phân tích → kết luận/khuyến nghị | trình bày kết quả có thể kiểm tra |
| **Academic essay** | luận điểm → các đoạn có luận cứ → phản biện/giới hạn → kết luận | phát triển một lập luận mạch lạc |

### Tóm tắt và tổng hợp nguồn
Tóm tắt rút ý chính của một nguồn bằng lời của mình, giữ đúng mức độ chắc chắn và không thêm nhận xét riêng. Tổng hợp (synthesis) đặt các nguồn cạnh nhau: chúng cùng kết luận ở điểm nào, khác nhau vì mẫu/phương pháp/bối cảnh nào, và khi đọc chung ta có thể nói gì. Ví dụ: *Lee's survey links flexible hours with retention, whereas Tran's interviews highlight the role of team support. Taken together, the studies suggest that flexibility may help, but it is not the only factor.* Ghi rõ ý của nguồn, diễn đạt lại chính xác và trích dẫn theo yêu cầu; không ghép các câu gần giống để thành paraphrase giả. Mẹo: **claim → evidence → limit → implication**. Người Việt hay dịch từng chữ, liệt kê từng nguồn mà không kết nối, hoặc dùng *therefore* dù bằng chứng chỉ cho thấy khả năng; hãy kiểm tra liên kết và mức độ khẳng định ở mỗi đoạn.

### Đọc phản biện và tổng hợp nguồn
Tách luận điểm, bằng chứng và kết luận; nhận ra modal hoặc từ hạn định cho biết mức độ chắc chắn. Một khảo sát tự nguyện có thể thiên lệch; dữ liệu quan sát không tự chứng minh nhân quả. Khi tóm tắt, giữ cả caveat quan trọng và không làm phát hiện mạnh hơn nguồn. Tổng hợp nhiều nguồn bằng cách nêu điểm đồng thuận, khác biệt và giới hạn; diễn đạt lại bằng cấu trúc của mình, đồng thời ghi nhận nguồn. Proposal và báo cáo nên đưa quyết định, bằng chứng, rủi ro và bước tiếp theo lên trước chi tiết phụ.
'''

