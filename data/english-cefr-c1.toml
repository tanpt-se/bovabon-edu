blanks = [["suggest"]]
explanation = "*Suggest* phù hợp với bằng chứng còn hạn chế; *prove* sẽ khẳng định quá mức."

[[questions]]
id = "cefr-c1-040"
module = "cefr-c1-reading-writing"
type = "essay"
difficulty = 3
prompt = "Write three or four sentences synthesising two short findings: one survey links flexible hours with retention, while interviews identify team support as another factor. Compare the sources, state a cautious overall implication, and do not claim that either factor guarantees retention."
keywords = [["survey", "questionnaire"], ["interviews", "interview"], ["whereas", "while", "although"], ["may", "might", "suggest"], ["team support", "support"]]
min_keywords = 4
model_answer = '''The survey links flexible hours with higher retention, whereas the interviews highlight the importance of team support. Taken together, the findings suggest that flexible hours may help, but their effect could depend on the wider working environment. Neither source shows that one change guarantees retention.'''
explanation = "Câu mẫu đặt hai nguồn cạnh nhau, tổng hợp điểm khác biệt và giữ kết luận ở mức dè dặt."

[[modules]]
id = "cefr-c1-register"
title = "C1 · Văn phong và đối tượng đọc"
description = "Chọn register, kiểm soát mật độ danh hoá, mức độ chắc chắn, từ nối và độ rõ theo người đọc."
lesson = '''
### Chọn văn phong theo người đọc và mục đích
Register là mức độ trang trọng và cách diễn đạt phù hợp với người đọc, quan hệ và kênh giao tiếp. Email cho khách hàng thường cần lời yêu cầu rõ, lịch sự và ít tiếng lóng; tin nhắn nội bộ có thể ngắn, thân thiện, dùng contraction nếu đó là quy ước nhóm. Trang trọng không đồng nghĩa với dài hoặc dùng từ hiếm: *Could you confirm the revised date?* thường tốt hơn một câu vòng vo nhiều tầng. Hãy tự hỏi: người đọc cần biết gì, cần làm gì, và họ có quen thuật ngữ này không?

### Danh hoá và độ rõ
`gr-c1` đã giới thiệu cách tạo danh từ từ động từ; ở đây trọng tâm là chọn mức danh hoá theo tác dụng. Danh hoá giúp gom thông tin trong báo cáo (*The review identified three risks* → *The review's identification of three risks…*) nhưng chuỗi danh từ dài có thể che khuất ai làm gì. Trong status update, câu có chủ thể và động từ thường rõ hơn: *The new process should reduce delays* thay vì *The implementation of the new process will result in the reduction of delays*. Dùng danh hoá khi muốn đặt một sự kiện làm chủ đề hoặc giữ cấu trúc báo cáo gọn; dùng động từ khi cần nêu tác nhân và hành động.

### Hedging, boosting và từ nối
Hedging/boosting đã có ở `gr-c1`; thực hành ở đây là cân mức khẳng định với độ tin cậy của bằng chứng và nhu cầu người đọc. Dữ liệu sơ bộ thường hợp với *suggests, may, appears to*; bằng chứng lặp lại và nhất quán có thể hỗ trợ *strongly indicates*. Tránh cả khẳng định tuyệt đối thiếu căn cứ (*proves beyond doubt*) lẫn dè dặt chồng lớp (*may perhaps possibly suggest*).

| Quan hệ | Từ nối | Ví dụ |
|---|---|---|
| thêm thông tin | **furthermore, in addition** | *The plan is affordable. Furthermore, it can start next month.* |
| tương phản/nhượng bộ | **however, nevertheless, by contrast** | *The sample is small. Nevertheless, the pattern is consistent.* |
| kết quả | **therefore, consequently** | *Costs fell; consequently, the team extended the trial.* |
| ví dụ | **for instance** | *Several teams changed their process; for instance, the support group added a review step.* |

Không dùng nhiều từ nối đầu câu như danh sách, và không coi chúng là từ thay thế lẫn nhau: *therefore* báo kết quả, còn *however* báo tương phản. Đọc lại để kiểm tra mạch ý, câu chủ động/bị động, thuật ngữ và mức trang trọng nhất quán. Người Việt hay dịch sát câu khẩu ngữ, dùng từ nối quá dày hoặc làm câu trang trọng thành khó đọc; mẹo là viết bản rõ trước, rồi chỉ chỉnh register ở những chỗ người đọc thực sự cần.
'''

[[questions]]
id = "cefr-c1-041"
module = "cefr-c1-register"
type = "single"
difficulty = 1
prompt = "You are writing to an external client who needs to send revised figures today. Which request is clear and professionally neutral?"
options = ["Could you send the revised figures by 3 p.m. today so we can include them in the report?", "Hey, chuck those numbers over whenever.", "Send the stuff now, okay?", "It would be most agreeable if the numerical materials were perhaps transmitted at some point."]
answer = [0]
explanation = "Câu đúng nêu yêu cầu, hạn chót và lý do bằng giọng lịch sự, rõ ràng. Các lựa chọn khác quá thân mật, cộc lốc hoặc vòng vo."

[[questions]]
id = "cefr-c1-042"
module = "cefr-c1-register"
type = "single"
difficulty = 2
prompt = "You are sending a brief message to a familiar teammate. Which sentence sounds friendly and still professional?"
options = ["Could you look over the draft when you have a moment?", "Would you be so gracious as to undertake a comprehensive examination of the aforementioned draft?", "Yo, do the draft thing.", "You are hereby instructed to inspect the document."]
answer = [0]
explanation = "Câu đầu ngắn, thân thiện và vẫn phù hợp trao đổi công việc. Văn phong tốt không nhất thiết phải tối đa hoá độ trang trọng."

[[questions]]
id = "cefr-c1-043"
module = "cefr-c1-register"
type = "single"
difficulty = 2
prompt = "A short status update needs to be easy to scan. Which sentence is clearest?"
