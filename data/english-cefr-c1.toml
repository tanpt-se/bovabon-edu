answer = [0]
explanation = "Câu đúng nêu yêu cầu, hạn chót và lý do bằng giọng lịch sự, rõ ràng. Các lựa chọn khác quá thân mật, cộc lốc hoặc vòng vo."

[[questions]]
id = "cefr-c1-042"
module = "cefr-c1-register"
type = "single"
difficulty = 2
prompt = "You are sending a brief message to a familiar teammate. Which sentence sounds friendly and still professional?"
options = ["Could you look over the draft when you have a moment?", "Would you be so gracious as to undertake a comprehensive examination of the aforementioned draft?", "Yo, do the draft thing.", "You are hereby instructed to inspect the document."]
answer = [0]
explanation = "Câu đầu ngắn, thân thiện và vẫn phù hợp trao đổi công việc. Văn phong tốt không nhất thiết phải tối đa hoá độ trang trọng."

[[questions]]
id = "cefr-c1-043"
module = "cefr-c1-register"
type = "single"
difficulty = 2
prompt = "A short status update needs to be easy to scan. Which sentence is clearest?"
options = ["The new process should reduce delays.", "The implementation of the new process will result in the reduction of delays.", "A reduction in delay-related outcomes is anticipated through implementation.", "The process, being new, is of a reducing nature regarding delays."]
answer = [0]
explanation = "Câu chủ động với động từ cụ thể diễn đạt cùng ý ngắn và rõ; chuỗi danh hoá khiến các lựa chọn còn lại nặng nề."

[[questions]]
id = "cefr-c1-044"
module = "cefr-c1-register"
type = "single"
difficulty = 3
prompt = "Choose the connector that correctly signals a contrast: *The first trial was costly. ______, it reduced waiting times enough to justify a second trial.*"
options = ["Nevertheless", "Consequently", "For instance", "Furthermore"]
answer = [0]
explanation = "Câu sau đưa ra điểm tích cực bất chấp chi phí, nên *Nevertheless* diễn đạt quan hệ nhượng bộ/tương phản."

[[questions]]
id = "cefr-c1-045"
module = "cefr-c1-register"
type = "single"
difficulty = 2
prompt = "Twenty independent trials have produced consistent results. Which sentence gives a confident but measured summary?"
options = ["The results strongly indicate that the treatment is effective.", "The results may perhaps possibly suggest that the treatment could work.", "The results prove beyond any doubt that the treatment always works.", "The results might have no relation to the treatment at all."]
answer = [0]
explanation = "*Strongly indicate* phản ánh bằng chứng nhất quán mà không biến kết quả nghiên cứu thành khẳng định tuyệt đối."

[[questions]]
id = "cefr-c1-046"
module = "cefr-c1-register"
type = "multiple"
difficulty = 2
prompt = "Select the sentences in which the connector accurately signals the relationship between ideas."
options = [
  "The trial reduced waiting times; consequently, the clinic kept it.",
  "The plan is affordable. Furthermore, it can start next month.",
  "The sample was small. Nevertheless, the pattern was consistent.",
  "The proposal is useful. For instance, the team approved it.",
  "The test passed; however, the team recorded the result."
]
answer = [0, 1, 2]
explanation = "*Consequently* nêu kết quả, *furthermore* bổ sung ý và *nevertheless* cho biết điều xảy ra bất chấp giới hạn. *For instance* cần đưa ví dụ; *however* cần tạo tương phản."

[[questions]]
id = "cefr-c1-047"
module = "cefr-c1-register"
type = "multiple"
difficulty = 3
prompt = "Choose clear, professional wording for an external project update."
options = [
  "We have completed the initial review; the full findings will follow on Friday.",
  "The aforementioned analytical undertaking was executed in relation to the initial review.",
  "The update did not address the issue; we recommend adding a test before release.",
  "FYI, it totally blew up.",
  "You folks messed it up, so fix it."
]
answer = [0, 2]
explanation = "Hai câu đúng truyền đạt tình trạng và hành động đề nghị trực tiếp bằng giọng chuyên nghiệp. Câu 2 quá nặng danh hoá; câu 4–5 quá thân mật hoặc đổ lỗi."

[[questions]]
id = "cefr-c1-048"
module = "cefr-c1-register"
type = "fill"
difficulty = 1
prompt = "Complete the contrast. The deadline is tight. {{blank}}, we can submit a complete draft by Thursday."
blanks = [["Nevertheless", "Even so", "Nonetheless", "Still"]]
explanation = "*Nevertheless* và *Even so* đều nêu kết quả tích cực bất chấp thời hạn gấp."

[[questions]]
id = "cefr-c1-049"
module = "cefr-c1-register"
type = "fill"
difficulty = 2
prompt = "Replace the informal phrase *sort out* with a suitable formal verb: *We need to {{blank}} the issue before the next review.*"
blanks = [["resolve", "address"]]
