id = "cefr-c1-032"
module = "cefr-c1-reading-writing"
type = "single"
difficulty = 2
prompt = "A report says, *The committee was thanked for its patience after three postponed reviews.* Which inference is best supported?"
options = ["The repeated postponements may have caused inconvenience.", "The committee approved every proposal.", "The committee was responsible for the delays.", "The author is definitely furious."]
answer = [0]
explanation = "Các lần hoãn và lời cảm ơn vì sự kiên nhẫn gợi ý sự bất tiện, nhưng không chứng minh ai gây ra chậm trễ hay tác giả đang tức giận."

[[questions]]
id = "cefr-c1-033"
module = "cefr-c1-reading-writing"
type = "single"
difficulty = 3
prompt = "A technical report has compared three options and found that one is safer but more expensive. What should its recommendation section do?"
options = ["State the preferred action and explain how it balances safety, cost, and the report's evidence.", "Repeat every result without explaining what action to take.", "Introduce a new option that was not assessed.", "Use personal criticism to make the decision sound urgent."]
answer = [0]
explanation = "Khuyến nghị cần nối phát hiện với hành động, nêu căn cứ và đánh đổi để người đọc ra quyết định."

[[questions]]
id = "cefr-c1-034"
module = "cefr-c1-reading-writing"
