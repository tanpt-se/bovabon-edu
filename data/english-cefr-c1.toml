prompt = "Summarise the claim and one limitation: A survey of 40 volunteers found high satisfaction with a new service. No non-users were surveyed."
keywords = [["volunteers", "40"], ["satisfaction", "satisfied"], ["non-users", "not surveyed", "not included"]]
min_keywords = 2
model_answer = '''The 40 volunteers reported high satisfaction, but non-users were not surveyed, so the result may not represent the wider population.'''
explanation = "Câu mẫu tóm tắt phát hiện, nhắc đến giới hạn mẫu và tránh khái quát quá mức."

[[questions]]
id = "cefr-c1-x031"
module = "cefr-c1-reading-writing"
type = "single"
difficulty = 1
prompt = "A proposal must recommend a trial while acknowledging uncertainty. Which opening is best suited to a formal proposal?"
options = ["We recommend a six-month trial, subject to a review of costs and outcomes.", "This idea is obviously amazing and should happen now.", "Everyone knows the trial will solve the problem.", "We did some stuff and thought you might like it."]
answer = [0]
explanation = "Câu 1 nêu khuyến nghị rõ, giới hạn điều kiện và giữ register trang trọng."

[[questions]]
id = "cefr-c1-x032"
module = "cefr-c1-reading-writing"
type = "multiple"
difficulty = 2
prompt = "Which revisions paraphrase the source without strengthening its claim? Source: The data may point to a seasonal increase."
options = ["The figures suggest that demand could rise at certain times of year.", "The data prove that demand rises every year.", "A seasonal increase is one possible interpretation of the figures.", "The data guarantee a permanent rise in demand.", "The figures may indicate a seasonal pattern."]
answer = [0, 2, 4]
explanation = "Ba câu giữ mức dè dặt và tính khả dĩ của nguồn; *prove* và *guarantee* làm kết luận mạnh hơn."

[[questions]]
id = "cefr-c1-x033"
module = "cefr-c1-reading-writing"
type = "single"
difficulty = 2
prompt = "Choose the best topic sentence for a paragraph comparing two options by cost and implementation risk."
options = ["The choice depends on both the initial cost and the risk of implementation.", "Option A costs less.", "There are many things that might be considered.", "In conclusion, this paragraph will discuss options."]
answer = [0]
explanation = "Câu chủ đề cần nêu trục so sánh mà đoạn sẽ phát triển, không chỉ nêu một dữ kiện hoặc báo trước nội dung chung chung."

[[questions]]
id = "cefr-c1-x034"
module = "cefr-c1-reading-writing"
type = "single"
difficulty = 3
prompt = "Which sentence reports an observation without presenting it as proven causation?"
options = ["The team observed lower error rates after the checklist was introduced.", "The checklist caused every error rate to fall.", "The checklist proves all teams will improve.", "The error rates fell because the checklist was perfect."]
answer = [0]
explanation = "Câu 1 tường thuật thời điểm quan sát mà không tuyên bố quan hệ nhân quả chưa được chứng minh."

[[questions]]
id = "cefr-c1-x035"
module = "cefr-c1-reading-writing"
type = "fill"
difficulty = 2
prompt = "Complete the sentence with a reporting verb that attributes the view to the authors: The authors {{blank}} that the sample should be expanded."
blanks = [["argue", "recommend", "suggest"]]
explanation = "Các động từ này quy nhận định/đề xuất cho tác giả; không nên dùng *prove* khi nguồn chỉ đưa ra lập luận."

[[questions]]
id = "cefr-c1-x036"
module = "cefr-c1-reading-writing"
type = "multiple"
difficulty = 3
prompt = "A source says that the trial lasted six weeks and included three clinics. Which details may be omitted from a one-sentence summary if the main point is feasibility?"
options = ["A minor procedural example unrelated to feasibility.", "The fact that three clinics participated, if scale is central to the claim.", "A repeated explanation already stated in the previous paragraph.", "The six-week duration, if it defines the trial's scope.", "A caveat that changes how broadly the finding can be applied."]
answer = [0, 2]
explanation = "Có thể lược ví dụ phụ và ý đã lặp. Quy mô, thời lượng hoặc caveat cần giữ nếu chúng giới hạn ý nghĩa kết quả."

[[questions]]
id = "cefr-c1-x037"
module = "cefr-c1-reading-writing"
type = "single"
difficulty = 2
prompt = "Which sentence uses parallel structure in a recommendation?"
options = ["The team should shorten the form, clarify the instructions, and publish a status update.", "The team should shorten the form, instructions should be clearer, and a status update.", "The team should shorten the form, clarifying instructions, and publish a status update.", "The team should shorten, clarification, and publishing the form."]
answer = [0]
explanation = "Ba động từ nguyên mẫu song song sau *should* giúp danh sách khuyến nghị cân đối."

[[questions]]
id = "cefr-c1-x038"
module = "cefr-c1-reading-writing"
type = "fill"
difficulty = 3
prompt = "Complete the sentence with a connector that introduces a limitation: The survey was conducted in one city; {{blank}}, its findings may not generalise nationally."
blanks = [["therefore", "consequently", "as a result"]]
explanation = "Kết quả khảo sát một thành phố dẫn đến giới hạn khái quát; các từ nối này diễn đạt hệ quả."

[[questions]]
id = "cefr-c1-x039"
module = "cefr-c1-reading-writing"
type = "single"
difficulty = 1
prompt = "A report is addressed to senior managers who need a decision, not a technical history. What should the executive summary foreground?"
options = ["The decision needed, key evidence, major risk, and recommended next step.", "Every implementation detail in chronological order.", "A full glossary before the recommendation.", "The writer's personal reaction to the project."]
answer = [0]
explanation = "Executive summary phục vụ quyết định: nêu bằng chứng, rủi ro và hành động cần chọn trước chi tiết nền."

[[questions]]
id = "cefr-c1-x040"
module = "cefr-c1-reading-writing"
type = "essay"
difficulty = 3
prompt = "Write a two-sentence synthesis of two reports: Report A found faster completion in one department; Report B found no change in two other departments. Avoid claiming a universal effect."
keywords = [["one department", "a department"], ["two other departments", "two departments"], ["mixed", "different", "varied"], ["no universal", "not general", "may depend"]]
min_keywords = 2
model_answer = '''The reports show mixed results: completion was faster in one department, while two others reported no change. The effect may depend on local conditions rather than applying universally.'''
explanation = "Câu mẫu tổng hợp điểm khác nhau giữa hai nguồn và giới hạn kết luận theo bối cảnh."

[[questions]]
id = "cefr-c1-x041"
module = "cefr-c1-functions"
type = "single"
difficulty = 1
prompt = "A colleague presents a cost estimate that omits support staff. Which response disagrees diplomatically and focuses on the evidence?"
options = ["The estimate is useful; could we include support time before comparing the options?", "That is careless and you clearly did not think.", "Your estimate is wrong in every possible way.", "I disagree, so we should stop the discussion."]
answer = [0]
explanation = "Câu 1 ghi nhận phần hữu ích, nêu thiếu sót cụ thể và mời cùng xem xét dữ liệu."

[[questions]]
id = "cefr-c1-x042"
module = "cefr-c1-functions"
type = "multiple"
difficulty = 2
prompt = "Choose the phrases that help a meeting reach a clear decision."
options = ["Could we confirm which option meets the deadline?", "Let me summarise the points we agree on.", "We have discussed enough; everyone must accept my view.", "Who can take responsibility for the next step?", "That is not what I meant, so let us ignore the concern."]
answer = [0, 1, 3]
explanation = "Câu 1 làm rõ tiêu chí, câu 2 tóm tắt đồng thuận, câu 4 xác định người phụ trách. Các lựa chọn khác ép buộc hoặc gạt bỏ ý kiến."

[[questions]]
id = "cefr-c1-x043"
module = "cefr-c1-functions"
type = "single"
difficulty = 2
prompt = "A non-specialist asks what a confidence interval means. Which explanation is most helpful?"
options = ["It is a range estimated from the sample using a method with stated long-run coverage; this one interval is not a guarantee.", "It guarantees that the true value lies in this exact range.", "It is a score for how confident the researcher feels.", "It means the data have no uncertainty."]
answer = [0]
explanation = "Khoảng tin cậy được tính từ mẫu theo một phương pháp có đặc tính bao phủ dài hạn; một khoảng cụ thể không bảo đảm chắc chắn chứa giá trị thật."

[[questions]]
id = "cefr-c1-x044"
module = "cefr-c1-functions"
type = "single"
difficulty = 3
prompt = "You are summarising a technical risk for a client who must decide whether to delay launch. Which version preserves the key implication?"
options = ["A rare fault could expose a small number of records; delaying launch would allow one more access-control review.", "The system is complicated and has many technical details.", "The team has discussed access control several times.", "There may be a problem, but no action is needed."]
answer = [0]
explanation = "Bản tóm tắt cần giữ xác suất, tác động và lựa chọn có liên quan đến quyết định của khách hàng."

[[questions]]
id = "cefr-c1-x045"
module = "cefr-c1-functions"
type = "fill"
difficulty = 2
prompt = "Invite a colleague to clarify a concern in a tactful way: Could you {{blank}} on the risk you mentioned?"
blanks = [["expand", "elaborate"]]
explanation = "*Expand on* hoặc *elaborate on* mời người nói giải thích thêm mà không phủ nhận ý kiến."

[[questions]]
id = "cefr-c1-x046"
module = "cefr-c1-functions"
type = "multiple"
difficulty = 3
prompt = "A bilingual colleague is relaying a policy to a team with limited English. Which actions support accurate mediation?"
options = ["Explain the key obligation in plain language.", "Keep the original uncertainty and conditions.", "Add a stronger deadline to make the policy sound clearer.", "Check whether the team needs an example.", "Translate every sentence literally even when the structure is confusing."]
answer = [0, 1, 3]
explanation = "Mediation cần làm rõ cho người nghe, giữ điều kiện và mức độ chắc chắn, rồi kiểm tra nhu cầu. Không tự thêm yêu cầu mới hoặc bám dịch từng chữ."

[[questions]]
id = "cefr-c1-x047"
module = "cefr-c1-functions"
type = "single"
difficulty = 2
prompt = "In an online meeting, two people speak at once and a decision is unclear. What is the best facilitator response?"
options = ["Let me pause us and restate the two options; then we can confirm the decision in the chat.", "The loudest view wins, so let us move on.", "I will choose for everyone without summarising.", "There is no need to record the decision."]
answer = [0]
explanation = "Câu 1 điều tiết lượt nói, tóm tắt lựa chọn và ghi lại quyết định trong kênh chung."

[[questions]]
id = "cefr-c1-x048"
module = "cefr-c1-functions"
type = "fill"
difficulty = 3
prompt = "Complete the diplomatic disagreement: I take your point; {{blank}}, the figures cover only the first quarter."
blanks = [["however", "nevertheless", "still"]]
explanation = "Từ nối tạo chuyển ý nhẹ sau khi công nhận quan điểm; mệnh đề sau nêu giới hạn của dữ liệu."

[[questions]]
id = "cefr-c1-x049"
module = "cefr-c1-functions"
type = "single"
difficulty = 1
prompt = "A participant uses the term capacity ambiguously. Which question checks the intended meaning?"
options = ["When you say capacity, do you mean available staff time or system load?", "Why are you using that word?", "Capacity is obvious to everyone.", "Could you speak more confidently?"]
answer = [0]
explanation = "Câu hỏi nêu hai cách hiểu có thể có, giúp làm rõ thuật ngữ mà không quy lỗi cho người nói."

[[questions]]
id = "cefr-c1-x050"
module = "cefr-c1-functions"
type = "essay"
difficulty = 3
prompt = "Write two sentences relaying a cautious finding to a non-specialist. Include a qualifier and one practical implication without overstating causation."
keywords = [["may", "might", "could", "suggests"], ["do not prove", "does not prove", "cannot establish causation"], ["practical", "next step", "monitor", "review"]]
min_keywords = 2
model_answer = '''The early results may suggest a reduction in delays, although they do not prove that the new process caused it. A practical next step is to monitor the outcome for another month.'''
explanation = "Câu mẫu giữ mức độ dè dặt của kết quả và nêu bước tiếp theo có thể thực hiện."

[[questions]]
id = "cefr-c1-x051"
module = "cefr-c1-vocab"
type = "single"
difficulty = 2
prompt = "A report says that a policy reduced costs in one small trial but needs replication. Which reporting verb best preserves the authors' cautious position? The authors ______ that the policy may reduce costs."
options = ["suggest", "guarantee", "prove", "deny"]
answer = [0]
explanation = "*Suggest* giữ mức dè dặt; *prove* và *guarantee* mạnh hơn dữ liệu, còn *deny* mang nghĩa phủ nhận."

[[questions]]
id = "cefr-c1-x052"
module = "cefr-c1-vocab"
type = "multiple"
difficulty = 2
prompt = "Select the natural academic and professional collocations."
options = ["address a concern", "conduct research", "make an evidence", "draw on data", "do a recommendation"]
answer = [0, 1, 3]
explanation = "Các cụm tự nhiên là *address a concern, conduct research,* và *draw on data*. Dùng *evidence* không đếm được; thường nói *make a recommendation*."

[[questions]]
id = "cefr-c1-x053"
module = "cefr-c1-vocab"
type = "single"
difficulty = 2
prompt = "Choose the verb that means to present a point as a reasoned position, rather than simply report it: The researchers ______ that the longer trial is necessary."
options = ["argue", "mention", "occur", "arise"]
answer = [0]
explanation = "*Argue that* nêu và bảo vệ một luận điểm; *mention* chỉ nhắc đến, còn *occur/arise* không phù hợp cấu trúc."

[[questions]]
id = "cefr-c1-x054"
module = "cefr-c1-vocab"
type = "fill"
difficulty = 1
prompt = "Use the noun form of *interpret*: The authors offer a cautious {{blank}} of the results."
blanks = [["interpretation"]]
explanation = "Danh từ của *interpret* là *interpretation*; cụm *an interpretation of the results* tự nhiên."

[[questions]]
id = "cefr-c1-x055"
module = "cefr-c1-vocab"
type = "single"
difficulty = 3
prompt = "A new audit has revealed a previously unnoticed weakness, but the team has not assessed its full impact. Which phrase is the most accurate?"
options = ["The audit has shed light on a potential weakness.", "The audit has put the weakness to bed.", "The audit has moved the goalposts.", "The audit has reached a consensus."]
answer = [0]
explanation = "*Shed light on* nghĩa là làm sáng tỏ; *potential* giữ đúng việc tác động chưa được đánh giá đầy đủ."

[[questions]]
id = "cefr-c1-x056"
module = "cefr-c1-vocab"
type = "fill"
difficulty = 2
prompt = "Complete the word family: The findings were useful, but their practical {{blank}} remains uncertain. (apply)"
blanks = [["application"]]
explanation = "Danh từ phù hợp là *application*: *practical application*."

[[questions]]
id = "cefr-c1-x057"
module = "cefr-c1-vocab"
type = "single"
difficulty = 3
prompt = "Which adjective means that a result seems contrary to what one would expect?"
options = ["counterintuitive", "counterproductive", "counterfeit", "counterbalanced"]
answer = [0]
explanation = "*Counterintuitive* mô tả điều trái với trực giác; *counterproductive* là gây tác dụng ngược."

[[questions]]
id = "cefr-c1-x058"
module = "cefr-c1-vocab"
type = "multiple"
difficulty = 3
prompt = "Which sentences use the reporting verbs with a suitable meaning?"
options = ["The authors maintain that the policy should be reviewed.", "The spokesperson asserted that no records had been lost.", "The analyst proved that the pattern might be seasonal.", "The report interpreted that the cost had increased.", "The committee acknowledged that the sample was small."]
answer = [0, 1, 4]
explanation = "*Maintain, assert,* và *acknowledge* dùng phù hợp. *Proved* mâu thuẫn với *might*; *interpret* thường cần tân ngữ hoặc cấu trúc *interpret X as Y*."

[[questions]]
id = "cefr-c1-x059"
module = "cefr-c1-vocab"
type = "single"
difficulty = 2
prompt = "A manager wants to praise a careful analyst without implying that the analyst is slow. Which adjective is most suitable?"
options = ["thorough", "pedantic", "fussy", "laborious"]
answer = [0]
explanation = "*Thorough* khen sự kỹ lưỡng; các từ còn lại thường gợi ý quá câu nệ, khó tính hoặc tốn công."

[[questions]]
id = "cefr-c1-x060"
module = "cefr-c1-vocab"
type = "essay"
difficulty = 3
prompt = "Write one formal sentence reporting a cautious claim about a small study. Use a reporting verb and a word that limits certainty."
keywords = [["suggest", "argue", "maintain", "report"], ["may", "might", "could", "appears"], ["small study", "limited sample", "small sample"]]
min_keywords = 2
model_answer = '''The authors suggest that the intervention may be useful, although their small study requires replication.'''
explanation = "Câu mẫu quy nhận nhận định cho tác giả, giới hạn độ chắc chắn và nêu hạn chế về quy mô."

[[questions]]
id = "cefr-c1-x061"
module = "cefr-c1-grammar-plus"
type = "fill"
difficulty = 2
prompt = "Complete the sentence with a linker meaning “if not”: Submit the figures by noon; {{blank}}, the review will move to Monday."
blanks = [["otherwise"]]
explanation = "*Otherwise* introduces the alternative result if the requested action is not completed."

[[questions]]
id = "cefr-c1-x062"
module = "cefr-c1-grammar-plus"
type = "single"
difficulty = 2
prompt = "Choose the sentence that uses *unless* correctly for a future condition."
options = ["Unless the analyst submits the figures by noon, the review will move to Monday.", "Unless the analyst will submit the figures by noon, the review will move to Monday.", "Unless the analyst submitted the figures by noon, the review will move to Monday.", "Unless the analyst does not submit the figures by noon, the review will move to Monday."]
answer = [0]
explanation = "Sau *unless* dùng hiện tại đơn để nói điều kiện tương lai. Câu 2 đặt *will* không phù hợp ở mệnh đề điều kiện; câu 3 lệch mốc thời gian; câu 4 đảo ngược điều kiện dự định."

[[questions]]
id = "cefr-c1-x063"
module = "cefr-c1-grammar-plus"
type = "fill"
difficulty = 3
prompt = "Complete the formal request with conditional inversion: {{blank}} further evidence, please contact the author. (If you should need)"
blanks = [["Should you need"]]
explanation = "Đưa *should* lên trước chủ ngữ tạo đảo ngữ điều kiện trang trọng: *Should you need…*; động từ theo sau vẫn ở dạng nguyên mẫu."

[[questions]]
id = "cefr-c1-x064"
module = "cefr-c1-grammar-plus"
type = "multiple"
difficulty = 3
prompt = "Select the sentences that use the cleft patterns accurately and preserve the intended emphasis."
options = ["What I need is a clearer account of the sampling method.", "It was not until the second review that the team noticed the missing records.", "What I need is the reviewers to explain the sampling method.", "It was not until the second review when the team noticed the missing records."]
answer = [0, 1]
explanation = "Câu 1 dùng *What-clause + be* để đặt điều cần thiết vào trọng tâm; câu 2 dùng đúng mẫu *It was not until… that…*. Câu 3 thiếu *for* trước cụm người thực hiện; câu 4 dùng sai từ nối của mẫu cleft."

[[questions]]
id = "cefr-c1-x065"
module = "cefr-c1-grammar-plus"
type = "single"
difficulty = 3
prompt = "Choose the formal relative clause with the correct preposition and pronoun: The analyst, ______ the report was prepared, was later thanked by the panel."
options = ["by whom", "for which", "whom by", "by who"]
answer = [0]
explanation = "*By whom* giữ giới từ ở trước đại từ quan hệ chỉ người và phù hợp với nghĩa bị động của *the report was prepared by the analyst*."

[[questions]]
id = "cefr-c1-x066"
module = "cefr-c1-reading-writing"
type = "single"
difficulty = 3
prompt = '''
Read the report extract:

A regional university introduced a protected two-hour meeting-free block on Wednesday in four departments. Operations staff had proposed the change after an internal review found that recurring meetings often interrupted work requiring sustained attention. The progress report compared calendar records from the six weeks before the change with records from the six-week pilot. During the pilot, staff logged 18% fewer internal meetings in that time block, and the median time to complete two recurring administrative tasks fell from 42 to 36 minutes.

An optional survey received 51 responses from 88 invited staff; 39 respondents said they had more time for focused work. The report cautions that no department was randomly assigned and there was no comparison group. Two departments also had fewer active projects during the pilot, while one introduced a task-tracking template at the same time. Staff on rotating support shifts said the protected block was harder to use because urgent requests continued.

The authors describe the pattern as promising rather than causal. They recommend a longer trial with comparable departments, fixed task definitions, and a separate analysis by shift type. They also note that survey respondents may not represent the whole workforce.

Which conclusion is best supported by the report?
'''
options = ["The pilot is associated with modest improvements, but its design cannot show that the meeting-free block caused them.", "The meeting-free block caused every department to become more productive.", "The optional survey represents all 88 staff because 51 people replied.", "The report proves that rotating support shifts received no benefit."]
answer = [0]
explanation = "Báo cáo đo được một số thay đổi trong giai đoạn thử nghiệm nhưng không có nhóm so sánh, phân bổ ngẫu nhiên hay mẫu khảo sát đầy đủ; vì vậy chưa thể kết luận quan hệ nhân quả hoặc khái quát cho mọi nhân viên."

[[questions]]
id = "cefr-c1-x067"
module = "cefr-c1-reading-writing"
type = "essay"
difficulty = 3
prompt = '''
Read the report extract:

A regional university introduced a protected two-hour meeting-free block on Wednesday in four departments. Operations staff had proposed the change after an internal review found that recurring meetings often interrupted work requiring sustained attention. The progress report compared calendar records from the six weeks before the change with records from the six-week pilot. During the pilot, staff logged 18% fewer internal meetings in that time block, and the median time to complete two recurring administrative tasks fell from 42 to 36 minutes.

An optional survey received 51 responses from 88 invited staff; 39 respondents said they had more time for focused work. The report cautions that no department was randomly assigned and there was no comparison group. Two departments also had fewer active projects during the pilot, while one introduced a task-tracking template at the same time. Staff on rotating support shifts said the protected block was harder to use because urgent requests continued.

The authors describe the pattern as promising rather than causal. They recommend a longer trial with comparable departments, fixed task definitions, and a separate analysis by shift type. They also note that survey respondents may not represent the whole workforce.

Write a three-sentence synthesis for university leaders. Report the change in meeting frequency and task time, mention the survey/design limitation without implying causation, and recommend a next step.
'''
keywords = [["18% fewer meetings", "meetings fell by 18%", "fewer internal meetings"], ["42 to 36 minutes", "fell from 42 to 36", "task time fell six minutes", "completion time decreased"], ["51 of 88", "51 respondents", "39 respondents"], ["no comparison group", "no control group", "not randomly assigned"], ["longer trial", "longer pilot", "comparable departments"]]
min_keywords = 5
model_answer = "During the six-week pilot, staff logged 18% fewer meetings in the protected block, while median task time fell from 42 to 36 minutes. Only 51 of 88 invited staff responded to the optional survey, and there was no comparison group, so the report does not establish that the block caused the changes. A longer trial across comparable departments, with results analysed by shift type, would provide stronger evidence."
explanation = "Câu mẫu giữ đúng hai chỉ số, nêu giới hạn của khảo sát và thiết kế, không biến tương quan thành nguyên nhân, rồi đề xuất thử nghiệm tiếp theo."
