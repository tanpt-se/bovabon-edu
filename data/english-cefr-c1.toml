[[questions]]
id = "cefr-c1-x009"
module = "cefr-c1-grammar-plus"
type = "fill"
difficulty = 2
prompt = "Complete the noun phrase with the correct preposition: The proposal for a six-month trial remains under {{blank}}."
blanks = [["consideration"]]
