type = "single"
difficulty = 2
prompt = "Read: No additional funding was required, the director noted, before adding that the project had used staff time from another department. What does the qualification imply?"
options = ["The project had a cost that was not described as additional funding.", "The project used no resources at all.", "The director confirms the project was free.", "Another department had no staff."]
answer = [0]
explanation = "Câu sau bổ sung nguồn lực nhân sự; *no additional funding* không đồng nghĩa với không có chi phí nguồn lực."

[[questions]]
