blanks = [["Notwithstanding"]]
explanation = "*Notwithstanding + cụm danh từ* có nghĩa là mặc dù; ở đây theo sau là *the limited sample*."

[[questions]]
id = "cefr-c1-x020"
module = "cefr-c1-register"
type = "essay"
difficulty = 3
prompt = "Write two or three sentences summarising a small study. Include one cautious claim and a contrast linker."
keywords = [["may indicate", "appears to", "suggests"], ["however", "nevertheless", "although"], ["small sample", "limited sample"]]
min_keywords = 2
model_answer = '''The findings may indicate a useful pattern, although the study used a small sample. Nevertheless, the result warrants a larger trial.'''
explanation = "Câu mẫu giới hạn mức khẳng định theo mẫu nhỏ và dùng từ nối tương phản để chuyển sang đề xuất tiếp theo."

[[questions]]
id = "cefr-c1-x021"
module = "cefr-c1-reading-writing"
type = "single"
difficulty = 1
prompt = "Read the excerpt: The pilot was run in two urban clinics. Attendance improved during the first month, although the team did not compare the result with a control group. What is the most defensible conclusion?"
options = ["The pilot suggests a possible improvement, but it cannot establish the cause.", "The pilot proves the programme works in every clinic.", "The control group showed no improvement.", "Attendance improved because the programme was used."]
answer = [0]
explanation = "Đoạn văn nêu cải thiện nhưng không có nhóm đối chứng; chưa thể kết luận chương trình là nguyên nhân."

[[questions]]
id = "cefr-c1-x022"
module = "cefr-c1-reading-writing"
type = "multiple"
difficulty = 2
prompt = "A report states: The policy was popular among respondents who completed the optional online survey. Which limitations are reasonable to note?"
options = ["People with strong views may have been more likely to respond.", "The respondents necessarily represent the whole population.", "The survey may have missed people with limited internet access.", "The policy was unpopular among all non-respondents.", "The wording does not say how many people were invited."]
answer = [0, 2, 4]
explanation = "Khảo sát tự nguyện có thể thiên lệch người trả lời; khả năng tiếp cận mạng và số người được mời chưa rõ. Không thể suy luận thay cho người không phản hồi."

[[questions]]
id = "cefr-c1-x023"
module = "cefr-c1-reading-writing"
type = "single"
difficulty = 2
prompt = "Read: The authors describe the result as promising, but they call for a longer trial before recommending wider use. What is their stance?"
options = ["Cautiously positive but not yet conclusive.", "Strongly opposed to any future use.", "Certain that the intervention is effective.", "Indifferent to the quality of the evidence."]
answer = [0]
explanation = "*Promising* thể hiện đánh giá tích cực, còn lời kêu gọi thử nghiệm dài hơn cho thấy kết luận vẫn dè dặt."

[[questions]]
id = "cefr-c1-x024"
module = "cefr-c1-reading-writing"
type = "single"
difficulty = 3
prompt = "Read: The company attributes the rise to its redesign. The survey, however, was conducted after the launch and included no questions about users who left. Which inference is best supported?"
options = ["The redesign may have contributed, but the survey cannot isolate its effect.", "The redesign caused the rise because it came first.", "Users who left were satisfied with the redesign.", "The survey proves the redesign had no effect."]
answer = [0]
explanation = "Khảo sát sau khi ra mắt và thiếu câu hỏi cho người rời đi không thể tách riêng tác động của redesign khỏi các yếu tố khác."

[[questions]]
id = "cefr-c1-x025"
module = "cefr-c1-reading-writing"
type = "fill"
difficulty = 2
prompt = "The writer says the evidence is suggestive rather than conclusive. Complete the cautious summary: The evidence {{blank}} support the proposal."
blanks = [["may", "might", "could"]]
explanation = "Modal *may/might/could* diễn đạt khả năng nhưng giữ mức độ chắc chắn thấp hơn khẳng định trực tiếp."

[[questions]]
id = "cefr-c1-x026"
module = "cefr-c1-reading-writing"
type = "multiple"
difficulty = 3
prompt = "An editorial reports that three experienced reviewers raised concerns about the sample. Which statements accurately distinguish source report from author endorsement?"
options = ["The reviewers raised concerns, according to the editorial.", "The editorial proves that the study is invalid.", "The concerns may affect how confidently the findings can be generalised.", "The author necessarily agrees with every reviewer.", "The editorial reports a criticism; its own position must be inferred from the surrounding argument."]
answer = [0, 2, 4]
explanation = "Bài đọc báo cáo lời phê bình; cần phân biệt người được trích dẫn với lập trường của tác giả và mức ảnh hưởng đến khả năng khái quát."

[[questions]]
id = "cefr-c1-x027"
