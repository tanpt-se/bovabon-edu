id = "english-cefr-c1"
title = "Tiếng Anh C1 · Cao cấp"
icon = "C1"
color = "#16a34a"
group = "Tiếng Anh"
area = "english"
description = "Luyện năng lực C1 trong giao tiếp học thuật và nghề nghiệp: ngữ pháp mở rộng, từ vựng theo sắc thái, lập luận, đọc hàm ý và điều chỉnh văn phong."

[[modules]]
id = "cefr-c1-grammar-plus"
title = "C1 · Ngữ pháp mở rộng"
description = "Modal suy luận và thái độ, điều kiện biến thể, fronting và mệnh đề quan hệ có giới từ."
lesson = '''
### Modal suy luận và thái độ
| Mẫu | Ý nghĩa thường gặp | Ví dụ |
|---|---|---|
| **be bound to + V** | gần như chắc chắn sẽ xảy ra | *With three teams involved, the launch is bound to take longer.* |
| **may well + V** | có khả năng thực sự; nhận định có căn cứ nhưng chưa chắc chắn | *The new policy may well improve staff retention.* |
| **might as well + V** | chọn làm việc hợp lý nhất khi phương án tốt hơn không còn | *The train is delayed, so we might as well get a coffee.* |

Đừng đồng nhất *be bound to* với nghĩa “bị buộc phải” trong *be bound by a contract*: theo sau bởi động từ nguyên mẫu, *is bound to happen* thường dự đoán điều rất dễ xảy ra. *Might as well* không phải cách nói xác suất thấp; nó thường hàm ý “đằng nào cũng vậy / đây là lựa chọn thực tế nhất”.

### Điều kiện linh hoạt và điều kiện đảo
| Mẫu | Cách dùng | Ví dụ |
|---|---|---|
| **but for + noun phrase** | nêu yếu tố đã ngăn kết quả khác xảy ra | *But for Maya's warning, we would have missed the deadline.* |
| **provided (that) + clause** | đặt điều kiện rõ ràng, thường trong quy định hoặc thoả thuận | *You may quote the report provided that you name the source.* |
| **supposing (that) + clause** | đưa ra giả định để cân nhắc hệ quả | *Supposing the supplier says no, what is our next option?* |

Đảo ngữ điều kiện với *Had / Were / Should* đã được học trong `gr-c1`; ở đây chỉ cần nhận ra nó có thể cùng diễn đạt giả định trang trọng: *Had the team known about the delay, it would have changed the schedule.* Không dùng *would* ngay trong mệnh đề điều kiện. Nhớ dấu phẩy khi mệnh đề điều kiện đứng đầu câu.

### Fronting và relative clause có giới từ
Fronting đưa thông tin cần nhấn lên đầu, thường tạo nhịp trang trọng trong báo cáo: *At the centre of the proposal is a six-month trial.* Khi cụm chỉ nơi chốn đứng đầu, đôi khi động từ đứng trước chủ ngữ; không phải mọi trạng từ đầu câu đều bắt buộc đảo. Mệnh đề quan hệ trang trọng có thể giữ giới từ trước đại từ: *the colleague to whom I sent the draft*; với người dùng *whom*, với vật dùng *which*: *the framework on which the decision depends*. Trong hội thoại, giới từ thường đứng cuối: *the colleague I sent the draft to*. Tránh thêm đại từ tân ngữ lần nữa (*to whom I sent it to*). Mẹo nhớ: chọn cấu trúc theo mức trang trọng, kiểm tra giới từ đi với động từ, rồi đọc lại để chắc câu vẫn dễ hiểu.

**Lỗi người Việt hay gặp:** dịch *bound* thành “bắt buộc” trong mọi trường hợp; dùng *will* sau *provided that* khi nói điều kiện tương lai; nhầm *might as well* với *may well*; viết *to who* trong mệnh đề trang trọng; hoặc đảo mọi câu sau cụm trạng ngữ. Hãy học cả cụm và xem quan hệ nghĩa trước khi chọn dạng.

### Danh hoá và mệnh đề rút gọn
Danh hoá nén thông tin trong báo cáo: *the team implemented the change* → *the implementation of the change*. Giữ động từ khi câu danh từ hoá làm mờ người thực hiện. Mệnh đề phân từ có thể rút gọn khi chủ thể ngầm trùng với chủ ngữ chính: *Having reviewed the evidence, the panel revised its conclusion.* Dạng V3 thường mang nghĩa bị động: *the documents submitted yesterday*. Tránh dangling modifier và cụm danh từ quá dài; nếu quan hệ nghĩa không rõ, viết mệnh đề đầy đủ.
'''

[[questions]]
id = "cefr-c1-001"
module = "cefr-c1-grammar-plus"
type = "single"
difficulty = 1
prompt = "The budget is approved and the venue is booked, so the launch ______ go ahead on Friday."
options = ["is bound to", "is binding to", "might as well", "has bound to"]
answer = [0]
explanation = "*Be bound to + động từ nguyên mẫu* dự đoán một việc gần như chắc chắn xảy ra. *Might as well* nói về lựa chọn thực tế nhất, không phải mức độ chắc chắn."

[[questions]]
id = "cefr-c1-002"
module = "cefr-c1-grammar-plus"
type = "single"
difficulty = 2
prompt = "The figures are preliminary, but they ______ indicate that demand is rising."
options = ["may well", "is bound to", "might as well", "may to"]
answer = [0]
explanation = "*May well* nêu khả năng đáng kể nhưng vẫn để ngỏ kết luận. *Is bound to* khẳng định mạnh hơn và không hợp chủ ngữ số nhiều *they*."

[[questions]]
id = "cefr-c1-003"
module = "cefr-c1-grammar-plus"
type = "single"
difficulty = 2
prompt = "The next train leaves in five minutes and the current one has been cancelled. We ______ take the next train."
options = ["might as well", "may well", "are bound to", "might better"]
answer = [0]
explanation = "Không còn lựa chọn tốt hơn nên *might as well* diễn đạt quyết định thực tế. *May well* thiên về dự đoán khả năng."

[[questions]]
id = "cefr-c1-004"
module = "cefr-c1-grammar-plus"
type = "single"
difficulty = 2
prompt = "You may use the figures in your presentation, provided that you ______ the original report."
options = ["cite", "will cite", "cited", "would cite"]
answer = [0]
explanation = "Sau *provided that*, dùng hiện tại đơn để nêu điều kiện cho tương lai; không cần *will* trong mệnh đề điều kiện."

[[questions]]
id = "cefr-c1-005"
module = "cefr-c1-grammar-plus"
type = "single"
difficulty = 3
prompt = "Choose the formal relative clause: *The consultant ______ we sent the revised proposal replied this morning.*"
options = ["to whom", "to who", "which", "to whom to"]
answer = [0]
explanation = "Trong mệnh đề quan hệ trang trọng, giới từ có thể đứng trước *whom* khi quy chiếu người: *the consultant to whom we sent…*."

[[questions]]
id = "cefr-c1-006"
module = "cefr-c1-grammar-plus"
type = "multiple"
difficulty = 2
prompt = "Select the sentences with natural fronting and word order."
options = [
  "At the centre of the proposal is a six-month trial.",
  "In the appendix you will find the full data table.",
  "Particularly useful is the short summary at the end.",
  "In the final section explains the author the limitations.",
  "On the agenda are a review of costs and a staffing update."
]
answer = [0, 1, 2, 4]
explanation = "Các câu đúng đưa cụm quan trọng lên đầu; với cụm chỉ vị trí, động từ có thể đứng trước chủ ngữ. Câu 4 thiếu chủ ngữ đúng chỗ và xếp trật tự từ không tự nhiên."

[[questions]]
id = "cefr-c1-007"
module = "cefr-c1-grammar-plus"
type = "multiple"
difficulty = 3
prompt = "Select the formal relative clauses that are grammatically correct."
options = [
  "The issue to which the report refers remains unresolved.",
  "The colleague with whom I discussed the proposal sent a summary.",
  "The policy on which our decision depends has changed.",
  "The client to who we spoke requested an update.",
  "The framework in which we relied needs revision."
]
answer = [0, 1, 2]
explanation = "Dùng *to which*, *with whom* và *on which* theo đúng giới từ của *refer to, discuss with, depend on*. Với *rely*, giới từ là *on*, không phải *in*."

[[questions]]
id = "cefr-c1-008"
module = "cefr-c1-grammar-plus"
type = "fill"
difficulty = 1
prompt = "Complete the counterfactual sentence: *{{blank}} the storm, the outdoor event would have gone ahead.*"
blanks = [["But for"]]
explanation = "*But for + cụm danh từ* nghĩa là “nếu không vì”; phần sau thường nêu kết quả giả định."

[[questions]]
id = "cefr-c1-009"
module = "cefr-c1-grammar-plus"
type = "fill"
difficulty = 2
prompt = "Complete the condition: *You can share the summary {{blank}} you remove all personal details.*"
blanks = [["provided that", "provided"]]
explanation = "*Provided (that)* đặt ra điều kiện; *that* có thể được lược bỏ mà nghĩa vẫn rõ."

[[questions]]
id = "cefr-c1-010"
module = "cefr-c1-grammar-plus"
type = "essay"
difficulty = 3
prompt = "Write two or three sentences advising a colleague about a delayed launch. Include a realistic condition and a prediction or practical alternative."
keywords = [["provided that", "as long as", "on condition that", "providing that", "unless"], ["may well", "bound to", "likely to", "could well"], ["might as well", "alternatively", "in the meantime"]]
min_keywords = 2
model_answer = '''Provided that the final review is complete by Thursday, we may well launch on Friday. If it is not, we might as well move the launch to Monday and give the support team time to prepare.'''
explanation = "Câu trả lời mẫu nêu một điều kiện rõ ràng, dự đoán có chừng mực và phương án dự phòng phù hợp với tình huống nghề nghiệp."

[[modules]]
id = "cefr-c1-vocab"
title = "C1 · Từ vựng học thuật và nghề nghiệp"
description = "AWL trong ngữ cảnh, sắc thái động từ lập luận, collocation và ẩn dụ/thành ngữ thông dụng."
lesson = '''
### Từ học thuật theo họ và ngữ cảnh
Academic Word List (AWL) gồm những từ thường gặp trong văn bản học thuật thuộc nhiều lĩnh vực, không phải một danh sách từ “cao siêu” cần nhồi riêng. Học chúng trong câu và chú ý từ loại: *assess* (đánh giá) → *assessment*; *analyse* → *analysis*; *establish* (thiết lập/xác lập); *indicate* (cho thấy); *interpret* (diễn giải); *relevant* (liên quan); *require* (đòi hỏi). Một từ quen có thể mang nghĩa chuyên biệt: *significant* có thể là “đáng kể/quan trọng”, nhưng trong thống kê chỉ nên gọi kết quả là *statistically significant* khi phép kiểm định hỗ trợ cách gọi đó.

### Claim, assert và maintain
| Động từ | Sắc thái thường gặp | Ví dụ |
|---|---|---|
| **claim** | nêu điều được cho là đúng; bản thân từ này không xác nhận bằng chứng | *The company claims that the update reduces energy use.* |
| **assert** | khẳng định mạnh, dứt khoát; thường cần bằng chứng hoặc phản hồi | *The spokesperson asserted that no customer data had been lost.* |
| **maintain** | tiếp tục bảo vệ một quan điểm, nhất là khi có tranh luận | *The authors maintain that longer trials are necessary.* |

Đây là khác biệt về cách trình bày, không phải thang đo chắc chắn cố định: hãy xem ai nói, bằng chứng nào được đưa ra và văn bản có đang phản biện hay không. Tránh dùng *prove* khi dữ liệu chỉ gợi ý một khả năng.

### Collocation và ẩn dụ
Ghi nhớ cả cụm: *conduct research*, *assess the impact*, *draw on evidence*, *address a concern*, *raise an issue*, *reach a consensus*, *meet a requirement*, *set priorities*, *deliver a presentation*. Không dịch từng chữ theo tiếng Việt: thường nói *conduct research*, không phải *make research*; *address a concern*, không phải *answer a concern*.

| Cụm | Nghĩa trong ngữ cảnh | Ví dụ |
|---|---|---|
| **shed light on** | giúp làm rõ | *The interviews shed light on why staff left.* |
| **the tip of the iceberg** | phần nhỏ nhìn thấy của vấn đề lớn hơn | *The late invoices may be the tip of the iceberg.* |
| **move the goalposts** | thay đổi tiêu chí khi người khác đã làm theo yêu cầu cũ | *The client moved the goalposts after approval.* |
| **be on the same page** | cùng hiểu hoặc đồng thuận về kế hoạch | *Let's confirm that we are on the same page.* |

Ẩn dụ và idioms tự nhiên trong trao đổi nghề nghiệp, nhưng có thể quá thân mật trong bài luận hoặc proposal. Mẹo: học cụm cùng ví dụ, kiểm tra register, rồi dùng cách diễn đạt trực tiếp nếu sắc thái chưa chắc chắn. Người Việt thường đặt sai giới từ, nhầm từ loại, hoặc giữ nguyên hình ảnh ẩn dụ khi dịch; hãy đọc collocation như một đơn vị.
'''

[[questions]]
id = "cefr-c1-011"
module = "cefr-c1-vocab"
type = "single"
difficulty = 1
prompt = "A news report is describing a company's position without judging whether the evidence is strong. Which verb is the most neutral choice?"
options = ["claims", "proves", "admits", "guarantees"]
answer = [0]
explanation = "*Claim* tường thuật điều một bên nói là đúng nhưng tự nó không xác nhận điều đó đã được chứng minh. *Prove* và *guarantee* khẳng định mạnh hơn."

[[questions]]
id = "cefr-c1-012"
module = "cefr-c1-vocab"
type = "single"
difficulty = 2
prompt = "After the results were challenged, the authors continued to defend their position. Choose the best verb: *The authors ______ that further trials are needed.*"
options = ["maintain", "borrow", "achieve", "attend"]
answer = [0]
explanation = "*Maintain that* diễn tả việc tiếp tục giữ và bảo vệ một nhận định, phù hợp khi ý kiến đang được tranh luận."

[[questions]]
id = "cefr-c1-013"
module = "cefr-c1-vocab"
type = "single"
difficulty = 2
prompt = "Which verb best fits a firm, public statement by a spokesperson? *The spokesperson ______ that no customer data had been lost.*"
options = ["asserted", "interpreted", "assessed", "conducted"]
answer = [0]
explanation = "*Assert* là khẳng định dứt khoát, trang trọng. *Interpret* là diễn giải; *assess* là đánh giá; *conduct* cần danh từ như *research*."

[[questions]]
id = "cefr-c1-014"
module = "cefr-c1-vocab"
type = "single"
difficulty = 3
prompt = "The interviews helped explain why experienced staff were leaving. Which phrase completes the sentence? *The interviews ______ the reasons for staff turnover.*"
options = ["shed light on", "moved the goalposts", "reached a consensus", "met a deadline"]
answer = [0]
explanation = "*Shed light on* nghĩa là giúp làm rõ một vấn đề. Các lựa chọn còn lại lần lượt nói về đổi tiêu chí, đạt đồng thuận và hoàn thành đúng hạn."

[[questions]]
id = "cefr-c1-015"
module = "cefr-c1-vocab"
type = "single"
difficulty = 2
prompt = "A client keeps adding new acceptance criteria after each version meets the previous ones. Which idiom describes this behaviour?"
options = ["moving the goalposts", "being on the same page", "shedding light on the issue", "drawing on evidence"]
answer = [0]
explanation = "*Move the goalposts* là thay đổi tiêu chí sau khi bên kia đã cố đáp ứng các yêu cầu trước đó."

[[questions]]
id = "cefr-c1-016"
module = "cefr-c1-vocab"
type = "multiple"
difficulty = 2
prompt = "Select the natural academic or professional collocations."
options = [
  "conduct research",
  "draw on evidence",
  "address a concern",
  "make a research",
  "answer a concern"
]
answer = [0, 1, 2]
explanation = "Các cụm tự nhiên là *conduct research*, *draw on evidence* và *address a concern*. Tránh dịch trực tiếp *make research* hoặc *answer a concern*."

[[questions]]
id = "cefr-c1-017"
module = "cefr-c1-vocab"
type = "fill"
difficulty = 1
prompt = "Complete the sentence with the verb meaning “evaluate”: *Before choosing a supplier, we need to {{blank}} the reliability of each service.*"
blanks = [["assess"]]
explanation = "*Assess* nghĩa là đánh giá có cân nhắc. Danh từ cùng họ là *assessment*."

[[questions]]
id = "cefr-c1-018"
module = "cefr-c1-vocab"
type = "fill"
difficulty = 2
prompt = "Complete the collocation: *The report {{blank}} evidence from three independent studies.*"
blanks = [["draws on", "draws upon", "cites"]]
explanation = "*Draw on/upon evidence* nghĩa là sử dụng bằng chứng làm cơ sở cho phân tích."

[[questions]]
id = "cefr-c1-019"
module = "cefr-c1-vocab"
type = "fill"
difficulty = 3
prompt = "Complete the idiom meaning “help make a situation clearer”: *The survey results may {{blank}} why new staff leave within a year.*"
blanks = [["shed light on", "throw light on", "cast light on"]]
explanation = "Cụm cố định là *shed light on + vấn đề/câu hỏi*."

[[questions]]
id = "cefr-c1-020"
module = "cefr-c1-vocab"
type = "essay"
difficulty = 3
prompt = "Write a short summary of two studies that reach different conclusions. Report one position neutrally, describe what the other authors continue to argue, and avoid claiming that either study proves more than its evidence supports."
keywords = [["claim", "claims"], ["maintain", "maintains"], ["evidence"], ["suggest", "indicate"]]
min_keywords = 3
model_answer = '''One study claims that remote work improves retention, while its evidence comes from a small sample. The second team maintains that the effect depends on job type and indicates that larger trials are needed. Neither study proves that one policy works for every organisation.'''
explanation = "Câu mẫu dùng *claim* để tường thuật, *maintain* để nêu lập trường được giữ vững, và giới hạn mức khẳng định theo bằng chứng."

[[modules]]
id = "cefr-c1-functions"
title = "C1 · Lập luận và tương tác nghề nghiệp"
description = "Tranh luận có cấu trúc, bất đồng ngoại giao, điều phối họp và phản hồi xây dựng."
lesson = '''
### Trình bày một lập luận có cấu trúc
Một lập luận dễ theo dõi thường có luận điểm, lý do, bằng chứng hoặc ví dụ, sự thừa nhận giới hạn, rồi kết luận hay đề xuất. Có thể mở bằng *The main reason I support this option is…*, đưa bằng chứng bằng *For example…*, và thừa nhận ý trái chiều bằng *Although the initial cost is higher…*. Sau đó giải thích vì sao luận điểm chính vẫn hợp lý. Đừng dùng nhiều từ nối nếu quan hệ giữa các ý đã rõ; mỗi câu cần có chức năng.

### Bất đồng lịch sự và nói giảm
| Mục đích | Cách nói tự nhiên | Tác dụng |
|---|---|---|
| công nhận ý kiến | *I see your point about the cost.* | cho thấy đã lắng nghe |
| nêu dè dặt | *I'm not sure that the current figures support that conclusion.* | tập trung vào bằng chứng |
| đề nghị xem lại | *Could we also consider the effect on support staff?* | mở rộng thảo luận mà không công kích |
| hiệu chỉnh quan điểm | *That may be true in the short term; however…* | công nhận một phần rồi bổ sung |

Nói giảm nên làm rõ mức độ chắc chắn, không biến thông điệp thành mơ hồ. Phê bình luận điểm hoặc quy trình, không gán tính cách cho người nói. Tránh dịch nguyên xi “Tôi không đồng ý” thành lời mở đầu sắc lạnh nếu mục tiêu là cùng giải quyết vấn đề.

### Điều phối cuộc họp và phản hồi xây dựng
Người điều phối nêu mục tiêu, mời ý kiến, quản lý thời gian và kết thúc bằng quyết định, người phụ trách cùng hạn chót. Cụm hữu ích: *Shall we turn to the budget?*, *We haven't heard from Minh yet; would you like to add anything?*, *Let me summarise the decision before we move on.* Khi ý kiến lệch chủ đề, nhắc lại mục tiêu rồi ghi nhận việc cần bàn sau; không cắt lời để áp đặt kết luận.

Phản hồi tốt mô tả hành vi quan sát được, tác động, rồi đề xuất bước tiếp theo: *The report is clear, and adding a short summary of the risks would help the client make a decision.* Tránh đánh giá chung như *Your work is careless*. Khi bất đồng, nhắc lại mối quan tâm của bên kia, hỏi điều gì sẽ thuyết phục họ, rồi đề nghị cách kiểm tra chung. Mẹo nhớ: **listen → clarify → respond → agree next step**. Người Việt thường lặp *I think* ở mọi câu hoặc dùng câu hỏi nghe như chất vấn; hãy chọn một cụm mở đầu phù hợp và kết thúc bằng đề xuất cụ thể.

### Điều phối, bất đồng và mediation
Trong họp, làm rõ tiêu chí, mời ý kiến, tóm tắt điểm đồng thuận, rồi chốt người phụ trách và thời hạn. Bất đồng ngoại giao tập trung vào lập luận: *I see the rationale; could we also consider the implementation risk?* Mediation giúp người nghe hiểu khái niệm hoặc văn bản: giải thích thuật ngữ, giữ nguyên điều kiện và mức độ chắc chắn, không dịch máy móc hay tự thêm kết luận. Trong cuộc họp trực tuyến, xác nhận quyết định bằng văn bản để giảm hiểu lầm.
'''

