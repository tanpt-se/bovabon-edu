[[questions]]
id = "rn-049"
module = "rn-lists"
type = "code"
difficulty = 3
title = "Paginator chống gọi trùng"
prompt = '''
Viết `createPaginator(fetchPage)` cho infinite scroll. `fetchPage(page)` trả về Promise `{ items, hasMore }` (page bắt đầu từ **1**).

Trả về object:
- `items` — mảng tất cả item đã tải (khử trùng lặp theo `id`, giữ bản xuất hiện **đầu tiên**)
- `loading`, `hasMore` (ban đầu `false`, `true`)
- `loadMore()` → Promise: nếu đang `loading` hoặc `!hasMore` thì **không gọi** `fetchPage` (trả về Promise resolve ngay). Ngược lại tải trang kế tiếp.
- Nếu `fetchPage` lỗi: `loading = false`, `error = lỗi`, **không tăng trang** (lần sau gọi lại đúng trang đó).
- `refresh()` → reset về trang 1, xoá items rồi tải lại.
'''
starter = '''
function createPaginator(fetchPage) {
  const p = {
    items: [],
    loading: false,
    hasMore: true,
    error: null,
    loadMore() {
      // TODO
    },
    refresh() {
      // TODO
    },
  };
  return p;
}
'''
solution = '''
function createPaginator(fetchPage) {
  let page = 0;
  const p = {
    items: [],
    loading: false,
    hasMore: true,
    error: null,
    loadMore() {
      if (p.loading || !p.hasMore) return Promise.resolve();
      p.loading = true;
      p.error = null;
      const next = page + 1;
      return fetchPage(next).then(
        (res) => {
          const seen = new Set(p.items.map((i) => i.id));
          p.items = p.items.concat(res.items.filter((i) => !seen.has(i.id) && seen.add(i.id)));
          p.hasMore = res.hasMore;
          page = next;
          p.loading = false;
        },
        (err) => {
          p.error = err;
          p.loading = false;
        }
      );
    },
    refresh() {
      page = 0;
      p.items = [];
      p.hasMore = true;
      p.loading = false;
      return p.loadMore();
    },
  };
  return p;
}
'''
tests = '''
function fakeApi(pages) {
  const fn = jest.fn((page) => Promise.resolve(pages[page - 1]));
  return fn;
}
test('tải trang đầu', async () => {
  const api = fakeApi([{ items: [{ id: 1 }, { id: 2 }], hasMore: true }]);
  const p = createPaginator(api);
  await p.loadMore();
  expect(p.items).toEqual([{ id: 1 }, { id: 2 }]);
  expect(api).toHaveBeenCalledWith(1);
});
test('không gọi trùng khi đang loading', async () => {
  const api = fakeApi([{ items: [{ id: 1 }], hasMore: true }, { items: [{ id: 2 }], hasMore: false }]);
  const p = createPaginator(api);
  const a = p.loadMore();
  p.loadMore();
  p.loadMore();
  expect(p.loading).toBe(true);
  await a;
  expect(api).toHaveBeenCalledTimes(1);
});
test('dừng khi hết dữ liệu + khử trùng id', async () => {
  const api = fakeApi([{ items: [{ id: 1 }, { id: 2 }], hasMore: true }, { items: [{ id: 2, dup: true }, { id: 3 }], hasMore: false }]);
  const p = createPaginator(api);
  await p.loadMore();
  await p.loadMore();
  await p.loadMore();
  expect(api).toHaveBeenCalledTimes(2);
  expect(p.items).toEqual([{ id: 1 }, { id: 2 }, { id: 3 }]);
  expect(p.hasMore).toBe(false);
});
test('lỗi không tăng trang', async () => {
  let fail = true;
  const api = jest.fn((page) => fail ? Promise.reject(new Error('net')) : Promise.resolve({ items: [{ id: page }], hasMore: true }));
  const p = createPaginator(api);
  await p.loadMore();
  expect(p.error.message).toBe('net');
  expect(p.loading).toBe(false);
  fail = false;
  await p.loadMore();
  expect(api.mock.calls[1]).toEqual([1]);
  expect(p.items).toEqual([{ id: 1 }]);
});
test('refresh', async () => {
  const api = fakeApi([{ items: [{ id: 1 }], hasMore: true }, { items: [{ id: 2 }], hasMore: true }]);
  const p = createPaginator(api);
  await p.loadMore();
  await p.loadMore();
  await p.refresh();
  expect(p.items).toEqual([{ id: 1 }]);
  expect(api.mock.calls[2]).toEqual([1]);
});
'''
hints = ["Giữ biến `page` trong closure, chỉ tăng khi fetch thành công.", "Dùng `Set` các id đã có để lọc trùng."]
explanation = "Đây là logic cốt lõi bên dưới `onEndReached` mà phỏng vấn RN rất hay hỏi."

