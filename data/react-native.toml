[[questions]]
id = "rn-xc08"
module = "rn-animation-gesture"
type = "code"
difficulty = 3
lang = "javascript"
title = "Mô phỏng Animated.interpolate"
prompt = '''
Viết `interpolate(value, inputRange, outputRange, extrapolate = 'extend')` cho các range tăng nghiêm ngặt có cùng độ dài từ 2 trở lên.
- Nội suy tuyến tính giữa hai điểm liền kề.
- `clamp` kẹp value về hai đầu input range; `extend` kéo dài tuyến tính bằng đoạn đầu/cuối.
- Giữ được output range tăng hoặc giảm.
'''
starter = '''
function interpolate(value, inputRange, outputRange, extrapolate = 'extend') {
  return outputRange[0];
}
'''
solution = '''
function interpolate(value, inputRange, outputRange, extrapolate = 'extend') {
  if (inputRange.length < 2 || inputRange.length !== outputRange.length) throw new RangeError('invalid range');
  for (let i = 1; i < inputRange.length; i++) {
    if (inputRange[i] <= inputRange[i - 1]) throw new RangeError('input range must increase');
  }
  if (extrapolate !== 'clamp' && extrapolate !== 'extend') throw new RangeError('invalid extrapolation');
  const first = inputRange[0];
  const last = inputRange[inputRange.length - 1];
  const x = extrapolate === 'clamp' ? Math.max(first, Math.min(last, value)) : value;
  let index = inputRange.length - 2;
  if (x <= first) index = 0;
  else {
    for (let i = 0; i < inputRange.length - 1; i++) {
      if (x <= inputRange[i + 1]) { index = i; break; }
    }
  }
  const progress = (x - inputRange[index]) / (inputRange[index + 1] - inputRange[index]);
  return outputRange[index] + progress * (outputRange[index + 1] - outputRange[index]);
}
'''
tests = '''
test('nội suy giữa hai mốc', () => {
  expect(interpolate(5, [0, 10], [0, 100])).toBe(50);
});
test('nội suy từng đoạn', () => {
  expect(interpolate(15, [0, 10, 20], [0, 100, 150])).toBe(125);
});
test('clamp ngoài hai đầu', () => {
  expect(interpolate(-5, [0, 10], [20, 40], 'clamp')).toBe(20);
  expect(interpolate(15, [0, 10], [20, 40], 'clamp')).toBe(40);
});
test('extend tuyến tính ngoài range', () => {
  expect(interpolate(15, [0, 10], [0, 20], 'extend')).toBe(30);
  expect(interpolate(-5, [0, 10], [20, 0], 'extend')).toBe(30);
});
test('output range giảm vẫn nội suy đúng', () => {
  expect(interpolate(5, [0, 10], [1, 0])).toBe(0.5);
});
'''
hints = ["Tìm đoạn input chứa value; giá trị ngoài range dùng đoạn đầu hoặc cuối.", "Clamp input trước khi tìm đoạn nếu extrapolate là `clamp`."]
explanation = "Đây là mô phỏng số học của phép nội suy, không tạo animation hay truy cập UI thread."
sources = ["react_native/animated#interpolation-1"]

[[questions]]
id = "rn-xc09"
module = "rn-animation-gesture"
type = "code"
difficulty = 2
lang = "javascript"
title = "Throttle sự kiện cuộn"
prompt = '''
Viết `throttleLeading(fn, wait, now = () => Date.now())`:
- Gọi `fn` ngay ở lần gọi đầu tiên.
- Các lần gọi tiếp theo trong khoảng nhỏ hơn `wait` bị bỏ qua.
- Khi đủ `wait`, gọi lại với đối số mới nhất của lần được chấp nhận.
- Không có trailing call tự chạy bằng timer.
'''
starter = '''
function throttleLeading(fn, wait, now = () => Date.now()) {
  return (...args) => fn(...args);
}
'''
solution = '''
function throttleLeading(fn, wait, now = () => Date.now()) {
  let lastCall = null;
  return (...args) => {
    const time = now();
    if (lastCall !== null && time - lastCall < wait) return undefined;
    lastCall = time;
    return fn(...args);
  };
}
'''
tests = '''
test('gọi ngay lần đầu', () => {
  const fn = jest.fn();
  throttleLeading(fn, 100, () => 0)('first');
  expect(fn).toHaveBeenCalledWith('first');
});
test('bỏ lần gọi trong khoảng wait', () => {
  let time = 0;
  const fn = jest.fn();
  const throttled = throttleLeading(fn, 100, () => time);
  throttled(1);
  time = 99;
  throttled(2);
  expect(fn).toHaveBeenCalledTimes(1);
});
test('gọi lại khi đủ wait', () => {
  let time = 10;
  const fn = jest.fn();
  const throttled = throttleLeading(fn, 100, () => time);
  throttled('a');
  time = 110;
  throttled('b');
  expect(fn).toHaveBeenCalledTimes(2);
  expect(fn).toHaveBeenCalledWith('b');
});
test('không tạo trailing call', () => {
  const fn = jest.fn();
  const throttled = throttleLeading(fn, 100, () => 0);
  throttled(1);
  throttled(2);
  expect(fn).toHaveBeenCalledTimes(1);
});
'''
hints = ["Lưu timestamp của lần được chấp nhận gần nhất.", "Đề bài không yêu cầu trailing timer."]
explanation = "Throttle hữu ích cho callback cuộn; chọn chu kỳ dựa trên công việc thực tế và giữ UI cập nhật đủ mượt."
sources = ["react_native/flatlist", "react_native/performance"]

[[questions]]
id = "rn-xc10"
module = "rn-data-offline"
type = "code"
difficulty = 3
lang = "javascript"
title = "Hàng đợi offline có retry"
prompt = '''
Viết `createOfflineQueue(send, baseDelay = 100, maxRetries = 2)` trả object có `enqueue(value)`, `setOnline(value)` và getter `pending`.
- Mỗi job được gửi tuần tự; mặc định online.
- Khi offline, giữ job cho tới khi online trở lại.
- Khi `send` lỗi, retry tối đa `maxRetries` lần với delay `baseDelay * 2 ** retryIndex`.
- Sau lần thử cuối cùng, reject Promise của job và bỏ job khỏi queue.
- `pending` trả danh sách value hiện có; dùng timer giả để kiểm thử backoff.
'''
starter = '''
function createOfflineQueue(send, baseDelay = 100, maxRetries = 2) {
  return {
    enqueue(value) { return send(value); },
    setOnline(value) {},
    get pending() { return []; },
  };
}
'''
solution = '''
function createOfflineQueue(send, baseDelay = 100, maxRetries = 2) {
  const jobs = [];
  let online = true;
  let processing = false;
  const process = async () => {
    if (processing || !online) return;
    processing = true;
    while (jobs.length && online) {
      const job = jobs[0];
      try {
        await send(job.value);
        jobs.shift();
        job.resolve();
      } catch (error) {
        if (job.retries >= maxRetries) {
          jobs.shift();
          job.reject(error);
        } else {
          const delay = baseDelay * (2 ** job.retries);
          job.retries += 1;
          await new Promise((resolve) => setTimeout(resolve, delay));
        }
      }
    }
    processing = false;
  };
  return {
    enqueue(value) {
      const promise = new Promise((resolve, reject) => jobs.push({ value, retries: 0, resolve, reject }));
      process();
      return promise;
    },
    setOnline(value) {
      online = Boolean(value);
      if (online) process();
    },
    get pending() { return jobs.map((job) => job.value); },
  };
}
'''
tests = '''
test('offline giữ job tới khi có mạng', async () => {
  const send = jest.fn(async (value) => value);
  const queue = createOfflineQueue(send);
  queue.setOnline(false);
  const done = queue.enqueue('a');
  await Promise.resolve();
  expect(send).toHaveBeenCalledTimes(0);
  expect(queue.pending).toEqual(['a']);
  queue.setOnline(true);
  await done;
  expect(send).toHaveBeenCalledWith('a');
  expect(queue.pending).toEqual([]);
});
test('retry sau backoff và resolve khi thành công', async () => {
  let attempts = 0;
  const send = jest.fn(() => {
    attempts += 1;
    return attempts === 1 ? Promise.reject(new Error('offline')) : Promise.resolve();
  });
  const queue = createOfflineQueue(send, 100, 1);
  const done = queue.enqueue('job');
  await Promise.resolve();
  await Promise.resolve();
  expect(send).toHaveBeenCalledTimes(1);
  jest.advanceTimersByTime(99);
  await Promise.resolve();
  expect(send).toHaveBeenCalledTimes(1);
  jest.advanceTimersByTime(1);
  await Promise.resolve();
  await Promise.resolve();
  await done;
  expect(send).toHaveBeenCalledTimes(2);
  expect(queue.pending).toEqual([]);
});
test('xử lý tuần tự theo thứ tự enqueue', async () => {
  const order = [];
  const queue = createOfflineQueue(async (value) => { order.push(value); });
  await Promise.all([queue.enqueue(1), queue.enqueue(2)]);
  expect(order).toEqual([1, 2]);
});
test('hết retry thì reject và bỏ job', async () => {
  const queue = createOfflineQueue(async () => { throw new Error('failed'); }, 10, 0);
  let message = '';
  await queue.enqueue('bad').catch((error) => { message = error.message; });
  expect(message).toBe('failed');
  expect(queue.pending).toEqual([]);
});
'''
hints = ["Giữ một cờ `processing` để chỉ có một worker xử lý queue.", "Tăng retryIndex sau khi tính delay; Promise timer phải được advance trong test."]
explanation = "Queue mô phỏng gửi tuần tự và backoff; ứng dụng thật còn cần persistence, idempotency key và chính sách merge."
sources = ["react_native/appstate"]

[[questions]]
id = "rn-xc11"
module = "rn-data-offline"
type = "code"
difficulty = 3
lang = "javascript"
title = "Phân tích deep link"
prompt = '''
Viết `parseDeepLink(url, routes)` cho URL dạng `scheme://path?query` và `routes` dạng `{ 'course/:id': 'Course' }`.
- Bỏ scheme và dấu `/` thừa đầu/cuối; số đoạn path phải khớp.
- `:param` là tham số path; query decode percent-encoding và đổi `+` thành khoảng trắng.
- Trả `{ screen, params }`; path param ghi đè query param cùng tên; query key lặp lấy giá trị cuối.
- Route tĩnh khớp chính xác; route đầu tiên khớp được chọn; không khớp trả `null`.
- Không dùng `URL` hoặc `URLSearchParams`.
'''
starter = '''
function parseDeepLink(url, routes) {
  return null;
}
'''
solution = '''
function parseDeepLink(url, routes) {
  const rest = url.replace(/^[a-z][a-z0-9+.-]*:\/\//i, '');
  const queryIndex = rest.indexOf('?');
  const pathText = queryIndex < 0 ? rest : rest.slice(0, queryIndex);
  const queryText = queryIndex < 0 ? '' : rest.slice(queryIndex + 1);
  const path = pathText.split('/').filter(Boolean).map(decodeURIComponent);
  const query = {};
  for (const pair of queryText.split('&')) {
    if (!pair) continue;
    const parts = pair.split('=');
    const key = decodeURIComponent(parts[0].replace(/\+/g, ' '));
    const value = decodeURIComponent((parts[1] || '').replace(/\+/g, ' '));
    query[key] = value;
  }
  for (const pattern of Object.keys(routes)) {
    const pieces = pattern.split('/').filter(Boolean);
    if (pieces.length !== path.length) continue;
    const params = {};
    let matches = true;
    for (let i = 0; i < pieces.length; i++) {
      if (pieces[i].startsWith(':')) params[pieces[i].slice(1)] = path[i];
      else if (pieces[i] !== path[i]) { matches = false; break; }
    }
    if (matches) return { screen: routes[pattern], params: { ...query, ...params } };
  }
  return null;
}
'''
tests = '''
const routes = { 'home': 'Home', 'course/:id': 'Course', 'course/:id/lesson/:lessonId': 'Lesson' };
test('path parameters and query', () => {
  expect(parseDeepLink('bovabon://course/rn?ref=mail', routes)).toEqual({ screen: 'Course', params: { id: 'rn', ref: 'mail' } });
});
test('decodes plus and percent encoding', () => {
  expect(parseDeepLink('bovabon://course/react%20native?q=hello+world', routes).params).toEqual({ id: 'react native', q: 'hello world' });
});
test('path parameter overrides query and repeated key keeps last', () => {
  expect(parseDeepLink('bovabon://course/path?id=query&tag=a&tag=b', routes).params).toEqual({ id: 'path', tag: 'b' });
});
test('exact route length and static segments', () => {
  expect(parseDeepLink('bovabon:///home/', routes)).toEqual({ screen: 'Home', params: {} });
  expect(parseDeepLink('bovabon://home/extra', routes)).toBeNull();
  expect(parseDeepLink('bovabon://settings', routes)).toBeNull();
});
test('universal link uses remaining path', () => {
  expect(parseDeepLink('https://course/rn', routes).screen).toBe('Course');
});
'''
hints = ["Tách path/query bằng vị trí dấu `?`.", "So sánh segment tĩnh; segment bắt đầu bằng `:` được lưu vào params."]
explanation = "Link ngoài là đầu vào không tin cậy; sau khi parse vẫn cần kiểm tra quyền và giá trị route params."
sources = ["react_native/linking"]

[[questions]]
id = "rn-xc12"
module = "rn-release"
type = "code"
difficulty = 2
lang = "javascript"
title = "Liệt kê điều kiện còn thiếu trước release"
prompt = '''
Viết `releaseBlockers(checks)` nhận object boolean. Kiểm tra theo đúng thứ tự:
`buildPassed`, `signingReady`, `permissionsReviewed`, `privacyDisclosureReady`, `crashSymbolsUploaded`, `storeNotesReady`.
Trả mảng tên các khóa có giá trị khác `true`; không sửa object đầu vào.
'''
starter = '''
function releaseBlockers(checks) {
  return [];
}
'''
solution = '''
function releaseBlockers(checks) {
  const required = ['buildPassed', 'signingReady', 'permissionsReviewed', 'privacyDisclosureReady', 'crashSymbolsUploaded', 'storeNotesReady'];
  return required.filter((key) => checks[key] !== true);
}
'''
tests = '''
test('không có blocker khi đủ điều kiện', () => {
  const all = { buildPassed: true, signingReady: true, permissionsReviewed: true, privacyDisclosureReady: true, crashSymbolsUploaded: true, storeNotesReady: true };
  expect(releaseBlockers(all)).toEqual([]);
});
test('trả đúng khóa thiếu theo thứ tự quy định', () => {
  expect(releaseBlockers({ buildPassed: true, signingReady: false, permissionsReviewed: true })).toEqual(['signingReady', 'privacyDisclosureReady', 'crashSymbolsUploaded', 'storeNotesReady']);
});
test('chỉ true mới đạt', () => {
  expect(releaseBlockers({ buildPassed: 1, signingReady: null })).toEqual(['buildPassed', 'signingReady', 'permissionsReviewed', 'privacyDisclosureReady', 'crashSymbolsUploaded', 'storeNotesReady']);
});
test('không mutate input', () => {
  const checks = { buildPassed: true };
  releaseBlockers(checks);
  expect(checks).toEqual({ buildPassed: true });
});
'''
hints = ["Giữ danh sách khóa bắt buộc theo thứ tự prompt.", "Dùng điều kiện `!== true` để xử lý cả thiếu key và giá trị sai kiểu."]
explanation = "Danh sách blocker giúp checklist release có thứ tự ổn định; nhóm vẫn cần review kết quả và chịu trách nhiệm phát hành."
