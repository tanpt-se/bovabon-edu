[[questions]]
id = "rn-dd05"
module = "rn-navigation"
type = "code"
difficulty = 2
title = "Phân tích deep link"
prompt = '''
Ứng dụng nhận deep link qua `Linking`. Viết `parseDeepLink(url, routes)`:

- `url` dạng `scheme://path?query` (vd. `bovabon://course/react/lesson/3?ref=mail`); **bỏ qua** scheme, dấu `/` thừa ở đầu/cuối
- `routes` là object `{ "<pattern>": "<ScreenName>" }`, pattern dùng `:param` (vd. `"course/:courseId/lesson/:lessonId"`)
- Trả về `{ screen, params }` của route **đầu tiên** khớp (số đoạn phải bằng nhau); `params` gồm tham số path và query (giá trị đã `decodeURIComponent`, `+` → khoảng trắng)
- Không khớp route nào → `null`
- (Không dùng `URL`/`URLSearchParams` — môi trường chạy test không có)
'''
starter = '''
function parseDeepLink(url, routes) {
  return null;
}
'''
solution = '''
function parseDeepLink(url, routes) {
  const noScheme = url.replace(/^[a-z][a-z0-9+.-]*:\/\//i, '');
  const [pathPart, query = ''] = noScheme.split('?');
  const segs = pathPart.split('/').filter(Boolean);
  const params = {};
  for (const kv of query.split('&')) {
    if (!kv) continue;
    const [k, v = ''] = kv.split('=');
    params[decodeURIComponent(k)] = decodeURIComponent(v.replace(/\+/g, ' '));
  }
  for (const pattern of Object.keys(routes)) {
    const ps = pattern.split('/').filter(Boolean);
    if (ps.length !== segs.length) continue;
    const found = {};
    let ok = true;
    for (let i = 0; i < ps.length; i++) {
      if (ps[i].startsWith(':')) found[ps[i].slice(1)] = decodeURIComponent(segs[i]);
      else if (ps[i] !== segs[i]) { ok = false; break; }
    }
    if (ok) return { screen: routes[pattern], params: { ...params, ...found } };
  }
  return null;
}
'''
tests = '''
const routes = {
  'home': 'Home',
  'course/:courseId': 'Course',
  'course/:courseId/lesson/:lessonId': 'Lesson',
};
test('route có tham số + query', () => {
  expect(parseDeepLink('bovabon://course/react/lesson/3?ref=mail', routes)).toEqual({
    screen: 'Lesson', params: { courseId: 'react', lessonId: '3', ref: 'mail' },
  });
});
test('route tĩnh, có / thừa', () => {
  expect(parseDeepLink('bovabon:///home/', routes)).toEqual({ screen: 'Home', params: {} });
});
test('giải mã giá trị', () => {
  const r = parseDeepLink('bovabon://course/react%20native?q=hello+world', routes);
  expect(r.params).toEqual({ courseId: 'react native', q: 'hello world' });
});
test('không khớp', () => {
  expect(parseDeepLink('bovabon://settings', routes)).toBeNull();
  expect(parseDeepLink('bovabon://course/a/b', routes)).toBeNull();
});
test('https universal link', () => {
  expect(parseDeepLink('https://course/go', routes).screen).toBe('Course');
});
'''
hints = ["Tách scheme bằng regex `^[a-z][a-z0-9+.-]*://`.", "So sánh từng đoạn: đoạn bắt đầu bằng `:` là tham số."]
explanation = "React Navigation làm việc này qua cấu hình `linking`; hiểu cơ chế giúp debug deep link nhanh hơn. Luôn kiểm tra/validate tham số nhận từ link."
sources = ["react_native/linking"]

