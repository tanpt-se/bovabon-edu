[[questions]]
id = "rn-065"
module = "rn-navigation"
type = "code"
difficulty = 3
title = "Stack navigation reducer"
prompt = '''
Mô phỏng state của Stack Navigator. State: `{ routes: [{ name, params }], index }` (index = màn hình đang hiển thị = phần tử cuối).

Viết `stackReducer(state, action)` (bất biến) hỗ trợ:
- `{ type: 'PUSH', name, params }` → thêm route mới
- `{ type: 'NAVIGATE', name, params }` → nếu đã có route cùng `name` trong stack thì **pop về** route đó (và cập nhật params nếu có truyền), ngược lại giống PUSH
- `{ type: 'POP', count = 1 }` → bỏ `count` route trên cùng, nhưng **luôn giữ ít nhất 1**
- `{ type: 'POP_TO_TOP' }` → chỉ giữ route đầu
- `{ type: 'REPLACE', name, params }` → thay route trên cùng
- `{ type: 'RESET', name, params }` → thay stack bằng một route duy nhất
- action khác → trả về state cũ
'''
starter = '''
function stackReducer(state, action) {
  // TODO
  return state;
}
'''
solution = '''
function stackReducer(state, action) {
  const make = (routes) => ({ routes, index: routes.length - 1 });
  switch (action.type) {
    case 'PUSH':
      return make([...state.routes, { name: action.name, params: action.params }]);
    case 'NAVIGATE': {
      let i = -1;
      for (let k = state.routes.length - 1; k >= 0; k--) if (state.routes[k].name === action.name) { i = k; break; }
      if (i === -1) return make([...state.routes, { name: action.name, params: action.params }]);
      const routes = state.routes.slice(0, i + 1);
      if (action.params !== undefined) routes[i] = { ...routes[i], params: action.params };
      return make(routes);
    }
    case 'POP': {
      const count = action.count === undefined ? 1 : action.count;
      return make(state.routes.slice(0, Math.max(1, state.routes.length - count)));
    }
    case 'POP_TO_TOP':
      return make(state.routes.slice(0, 1));
    case 'REPLACE':
      return make([...state.routes.slice(0, -1), { name: action.name, params: action.params }]);
    case 'RESET':
      return make([{ name: action.name, params: action.params }]);
    default:
      return state;
  }
}
'''
tests = '''
const home = { routes: [{ name: 'Home', params: undefined }], index: 0 };
test('PUSH', () => {
  const s = stackReducer(home, { type: 'PUSH', name: 'Detail', params: { id: 1 } });
  expect(s.routes.map(r => r.name)).toEqual(['Home', 'Detail']);
  expect(s.index).toBe(1);
  expect(home.routes).toHaveLength(1);
});
test('NAVIGATE tới route đã có thì pop về', () => {
  let s = stackReducer(home, { type: 'PUSH', name: 'List' });
  s = stackReducer(s, { type: 'PUSH', name: 'Detail' });
  s = stackReducer(s, { type: 'NAVIGATE', name: 'List', params: { page: 2 } });
  expect(s.routes.map(r => r.name)).toEqual(['Home', 'List']);
  expect(s.routes[1].params).toEqual({ page: 2 });
  expect(s.index).toBe(1);
});
test('NAVIGATE tới route mới thì push', () => {
  const s = stackReducer(home, { type: 'NAVIGATE', name: 'Settings' });
  expect(s.routes.map(r => r.name)).toEqual(['Home', 'Settings']);
});
test('POP giữ ít nhất 1', () => {
  let s = stackReducer(home, { type: 'PUSH', name: 'A' });
  s = stackReducer(s, { type: 'POP', count: 5 });
  expect(s.routes.map(r => r.name)).toEqual(['Home']);
  expect(s.index).toBe(0);
});
test('POP mặc định 1', () => {
  let s = stackReducer(home, { type: 'PUSH', name: 'A' });
  s = stackReducer(s, { type: 'PUSH', name: 'B' });
  expect(stackReducer(s, { type: 'POP' }).routes.map(r => r.name)).toEqual(['Home', 'A']);
});
test('POP_TO_TOP', () => {
  let s = stackReducer(home, { type: 'PUSH', name: 'A' });
  s = stackReducer(s, { type: 'PUSH', name: 'B' });
  expect(stackReducer(s, { type: 'POP_TO_TOP' })).toEqual(home);
});
test('REPLACE', () => {
  let s = stackReducer(home, { type: 'PUSH', name: 'Login' });
  s = stackReducer(s, { type: 'REPLACE', name: 'Main' });
  expect(s.routes.map(r => r.name)).toEqual(['Home', 'Main']);
});
test('RESET thay stack bằng route mới', () => {
  const state = stackReducer({ routes: [{ name: 'Home' }, { name: 'Detail' }], index: 1 }, { type: 'RESET', name: 'Login' });
  expect(state.routes).toEqual([{ name: 'Login', params: undefined }]);
  expect(state.index).toBe(0);
});
test('action lạ trả về state cũ', () => {
  expect(stackReducer(home, { type: 'X' })).toBe(home);
});
'''
hints = ["Viết helper `make(routes)` tính `index = routes.length - 1`.", "NAVIGATE: tìm từ cuối stack lên."]
explanation = "React Navigation thực sự dùng router dạng reducer như vậy (`StackRouter.getStateForAction`)."

