[[questions]]
id = "rn-026"
module = "rn-styling"
type = "code"
difficulty = 2
title = "Cài đặt StyleSheet.flatten"
prompt = '''
Viết `flattenStyle(style)` mô phỏng `StyleSheet.flatten`:
- `style` có thể là object, mảng (lồng nhiều cấp), hoặc falsy (`null`, `undefined`, `false`)
- Gộp theo thứ tự, phần tử sau ghi đè phần tử trước
- Luôn trả về **object mới** (không mutate input); input falsy → `{}`
'''
starter = '''
function flattenStyle(style) {
  // TODO
}
'''
solution = '''
function flattenStyle(style) {
  if (!style) return {};
  if (!Array.isArray(style)) return { ...style };
  return style.reduce((acc, s) => Object.assign(acc, flattenStyle(s)), {});
}
'''
tests = '''
test('object đơn', () => {
  const s = { color: 'red' };
  const r = flattenStyle(s);
  expect(r).toEqual({ color: 'red' });
  expect(r).not.toBe(s);
});
test('mảng ghi đè theo thứ tự', () => {
  expect(flattenStyle([{ color: 'red', margin: 4 }, { color: 'blue' }])).toEqual({ color: 'blue', margin: 4 });
});
test('bỏ qua falsy', () => {
  expect(flattenStyle([{ a: 1 }, false, null, undefined, { b: 2 }])).toEqual({ a: 1, b: 2 });
});
test('mảng lồng nhau', () => {
  expect(flattenStyle([{ a: 1 }, [{ a: 2 }, [{ b: 3 }]], { c: 4 }])).toEqual({ a: 2, b: 3, c: 4 });
});
test('input falsy', () => {
  expect(flattenStyle(null)).toEqual({});
});
test('không mutate', () => {
  const first = { a: 1 };
  flattenStyle([first, { a: 2 }]);
  expect(first.a).toBe(1);
});
'''
hints = ["Đệ quy: flatten từng phần tử rồi `Object.assign` vào accumulator mới."]
explanation = "Hiểu cơ chế merge giúp bạn chủ động khi viết component nhận prop `style` từ ngoài: `style={[styles.base, props.style]}`."

[[questions]]
id = "rn-027"
module = "rn-styling"
type = "code"
difficulty = 2
title = "Platform.select"
prompt = '''
Viết `createPlatform(os)` trả về object `{ OS, select(spec) }` mô phỏng `Platform` của RN.

`select(spec)` trả về:
1. `spec[os]` nếu khoá đó tồn tại (dù giá trị là falsy)
2. nếu `os` là `'ios'` hoặc `'android'` và có khoá `native` → `spec.native`
3. ngược lại `spec.default` (có thể là `undefined`)
'''
starter = '''
function createPlatform(os) {
  return {
    OS: os,
    select(spec) {
      // TODO
    },
  };
}
'''
solution = '''
function createPlatform(os) {
  return {
    OS: os,
    select(spec) {
      if (Object.prototype.hasOwnProperty.call(spec, os)) return spec[os];
      if ((os === 'ios' || os === 'android') && Object.prototype.hasOwnProperty.call(spec, 'native')) return spec.native;
      return spec.default;
    },
  };
}
'''
tests = '''
test('chọn đúng OS', () => {
  expect(createPlatform('ios').select({ ios: 1, android: 2 })).toBe(1);
  expect(createPlatform('android').select({ ios: 1, android: 2 })).toBe(2);
});
test('fallback native', () => {
  expect(createPlatform('android').select({ ios: 1, native: 'n', default: 'd' })).toBe('n');
});
test('web không dùng native', () => {
  expect(createPlatform('web').select({ native: 'n', default: 'd' })).toBe('d');
});
test('giá trị falsy vẫn được chọn', () => {
  expect(createPlatform('ios').select({ ios: 0, default: 5 })).toBe(0);
});
test('không có gì → undefined', () => {
  expect(createPlatform('windows').select({ ios: 1 })).toBeUndefined();
});
test('dùng với style', () => {
  const P = createPlatform('android');
  expect(P.select({ ios: { shadowOpacity: 0.2 }, android: { elevation: 4 } })).toEqual({ elevation: 4 });
});
'''
hints = ["Dùng `hasOwnProperty` thay vì kiểm tra truthy để không bỏ sót giá trị `0`/`false`."]
explanation = "Platform.select giúp viết code đa nền tảng gọn gàng ngay trong StyleSheet."

[[questions]]
id = "rn-028"
module = "rn-styling"
type = "code"
difficulty = 2
title = "Responsive scale"
prompt = '''
Thiết kế Figma dựa trên màn hình chuẩn **375 × 812**. Viết hàm `createScaler(width, height)` trả về:
- `scale(size)` = `size * width / 375`
- `verticalScale(size)` = `size * height / 812`
- `moderateScale(size, factor = 0.5)` = `size + (scale(size) - size) * factor`

Kết quả làm tròn tới **2 chữ số thập phân** (`Math.round(x * 100) / 100`).
'''
starter = '''
function createScaler(width, height) {
  // TODO
}
'''
solution = '''
function createScaler(width, height) {
  const r = (x) => Math.round(x * 100) / 100;
  const raw = (size) => (size * width) / 375;
  return {
    scale: (size) => r(raw(size)),
    verticalScale: (size) => r((size * height) / 812),
    moderateScale: (size, factor = 0.5) => r(size + (raw(size) - size) * factor),
  };
}
'''
tests = '''
const s = createScaler(750, 1624);
test('scale', () => expect(s.scale(10)).toBe(20));
test('verticalScale', () => expect(s.verticalScale(10)).toBe(20));
test('moderateScale mặc định 0.5', () => expect(s.moderateScale(10)).toBe(15));
test('moderateScale factor tuỳ chỉnh', () => expect(s.moderateScale(10, 0.25)).toBe(12.5));
test('màn hình chuẩn giữ nguyên', () => {
  const b = createScaler(375, 812);
  expect(b.scale(14)).toBe(14);
  expect(b.moderateScale(14)).toBe(14);
});
test('làm tròn 2 chữ số', () => expect(createScaler(390, 844).scale(13)).toBe(13.52));
'''
hints = ["`moderateScale` dùng giá trị scale **chưa làm tròn** rồi mới làm tròn kết quả cuối."]
explanation = "moderateScale giúp font/padding không phình quá to trên tablet."

