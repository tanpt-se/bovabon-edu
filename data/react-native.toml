difficulty = 2
lang = "javascript"
title = "Gộp các trang danh sách không trùng ID"
prompt = '''
Viết `mergeById(existing, incoming)` trả mảng mới gồm item cũ rồi item mới chưa có `id`.
- Nếu ID xuất hiện nhiều lần, giữ lần xuất hiện đầu tiên.
- Hỗ trợ ID là `0` hoặc chuỗi rỗng.
- Không mutate hai mảng đầu vào.
'''
starter = '''
function mergeById(existing, incoming) {
  return existing.concat(incoming);
}
'''
solution = '''
function mergeById(existing, incoming) {
  const seen = new Set();
  const result = [];
  for (const item of existing.concat(incoming)) {
    if (seen.has(item.id)) continue;
    seen.add(item.id);
    result.push(item);
  }
  return result;
}
'''
tests = '''
test('giữ thứ tự và loại ID trùng', () => {
  expect(mergeById([{ id: 1 }, { id: 2 }], [{ id: 2, newer: true }, { id: 3 }])).toEqual([{ id: 1 }, { id: 2 }, { id: 3 }]);
});
test('hỗ trợ id falsy', () => {
  expect(mergeById([{ id: 0 }], [{ id: 0, duplicate: true }, { id: '' }])).toEqual([{ id: 0 }, { id: '' }]);
});
test('mảng kết quả mới', () => {
  const oldItems = [{ id: 1 }];
  const result = mergeById(oldItems, []);
  expect(result).not.toBe(oldItems);
  expect(oldItems).toEqual([{ id: 1 }]);
});
test('hai mảng rỗng', () => {
  expect(mergeById([], [])).toEqual([]);
});
'''
hints = ["Dùng Set để lưu các ID đã gặp.", "Không dùng điều kiện truthy cho ID vì 0 vẫn hợp lệ."]
explanation = "Khử trùng theo ID giúp pagination/offline sync không tạo row lặp."
