[[questions]]
id = "rn-xc01"
module = "rn-styling"
type = "code"
difficulty = 2
lang = "javascript"
title = "Gộp mảng StyleSheet lồng nhau"
prompt = '''
Viết `flattenStyle(style)` để mô phỏng `StyleSheet.flatten` cho object style:
- Nhận object, mảng lồng nhau hoặc giá trị falsy (`null`, `undefined`, `false`).
- Gộp theo thứ tự duyệt; thuộc tính ở style sau ghi đè style trước.
- Trả object mới và không mutate bất kỳ input nào; đầu vào falsy trả `{}`.
'''
starter = '''
function flattenStyle(style) {
  return {};
}
'''
solution = '''
function flattenStyle(style) {
  const result = {};
  const apply = (value) => {
    if (!value) return;
    if (Array.isArray(value)) {
      for (const item of value) apply(item);
    } else if (typeof value === 'object') {
      Object.assign(result, value);
    }
  };
  apply(style);
  return result;
}
'''
tests = '''
test('object đơn và object kết quả mới', () => {
  const style = { color: 'red' };
  const result = flattenStyle(style);
  expect(result).toEqual({ color: 'red' });
  expect(result).not.toBe(style);
});
test('style sau ghi đè', () => {
  expect(flattenStyle([{ color: 'red', padding: 4 }, { color: 'blue' }])).toEqual({ color: 'blue', padding: 4 });
});
test('mảng lồng sâu và falsy', () => {
  expect(flattenStyle([{ a: 1 }, [false, [{ a: 2 }, null]], undefined, { b: 3 }])).toEqual({ a: 2, b: 3 });
});
test('đầu vào falsy', () => {
  expect(flattenStyle(false)).toEqual({});
  expect(flattenStyle(null)).toEqual({});
});
test('không mutate object lồng', () => {
  const base = { a: 1 };
  flattenStyle([base, [{ a: 2 }]]);
  expect(base).toEqual({ a: 1 });
});
'''
hints = ["Duyệt đệ quy từng phần tử mảng.", "Dùng một accumulator mới và bỏ qua giá trị falsy."]
explanation = "Mảng style cho phép ghép base style với override theo điều kiện mà không sửa object dùng chung."
sources = ["react_native/stylesheet#flatten"]

[[questions]]
id = "rn-xc02"
module = "rn-styling"
type = "code"
difficulty = 2
lang = "javascript"
title = "Mô phỏng Platform.select"
prompt = '''
Viết `createPlatform(os)` trả về `{ OS, select(spec) }`:
1. Trả `spec[os]` nếu khóa OS tồn tại, kể cả giá trị `false`, `0` hoặc `undefined`.
2. Nếu `os` là `ios` hoặc `android`, dùng `spec.native` khi có khóa đó.
3. Nếu không, trả `spec.default` (có thể là `undefined`).
'''
starter = '''
function createPlatform(os) {
  return { OS: os, select: (spec) => spec.default };
}
'''
solution = '''
function createPlatform(os) {
  return {
    OS: os,
    select(spec) {
      if (Object.prototype.hasOwnProperty.call(spec, os)) return spec[os];
      if ((os === 'ios' || os === 'android') && Object.prototype.hasOwnProperty.call(spec, 'native')) return spec.native;
      return spec.default;
    },
  };
}
'''
tests = '''
test('ưu tiên key đúng nền tảng', () => {
  expect(createPlatform('ios').select({ ios: 'i', android: 'a', default: 'd' })).toBe('i');
  expect(createPlatform('android').select({ ios: 'i', android: 'a', default: 'd' })).toBe('a');
});
test('native chỉ là fallback cho mobile native', () => {
  expect(createPlatform('ios').select({ native: 'n', default: 'd' })).toBe('n');
  expect(createPlatform('web').select({ native: 'n', default: 'd' })).toBe('d');
});
test('giá trị falsy vẫn là giá trị có chủ đích', () => {
  expect(createPlatform('ios').select({ ios: false, native: true })).toBe(false);
  expect(createPlatform('android').select({ android: 0, default: 2 })).toBe(0);
});
test('fallback default hoặc undefined', () => {
  expect(createPlatform('web').select({ default: 'web' })).toBe('web');
  expect(createPlatform('other').select({ ios: 'i' })).toBeUndefined();
});
'''
hints = ["Kiểm tra khóa bằng `hasOwnProperty`, không kiểm tra truthy.", "Thứ tự ưu tiên là OS cụ thể, native trên iOS/Android, rồi default."]
explanation = "Mô phỏng này giúp kiểm tra fallback đa nền tảng mà không cần runtime native."
sources = ["react_native/platform#select"]

[[questions]]
id = "rn-xc03"
module = "rn-lists"
type = "code"
difficulty = 3
lang = "javascript"
title = "Ước lượng vùng FlatList đang giữ"
prompt = '''
Viết `getRenderRange(itemCount, itemHeight, viewportHeight, scrollOffset, windowSize)` trả `{ start, end }` với `end` inclusive:
- Các item hiển thị bắt đầu tại `floor(scrollOffset / itemHeight)` và kết thúc tại `ceil((scrollOffset + viewportHeight) / itemHeight) - 1`.
- `windowSize` là số viewport được giữ tổng cộng, phân bố phần dư đều hai phía; mỗi phía thêm `floor(((windowSize - 1) * viewportHeight) / (2 * itemHeight))` item.
- Kẹp offset trong khoảng cuộn hợp lệ và index trong `[0, itemCount - 1]`.
- Danh sách rỗng trả `{ start: 0, end: -1 }`.
'''
starter = '''
function getRenderRange(itemCount, itemHeight, viewportHeight, scrollOffset, windowSize) {
  return { start: 0, end: -1 };
}
'''
solution = '''
function getRenderRange(itemCount, itemHeight, viewportHeight, scrollOffset, windowSize) {
  if (itemCount <= 0) return { start: 0, end: -1 };
  const maxOffset = Math.max(0, itemCount * itemHeight - viewportHeight);
  const offset = Math.max(0, Math.min(scrollOffset, maxOffset));
  const firstVisible = Math.floor(offset / itemHeight);
  const lastVisible = Math.min(itemCount - 1, Math.ceil((offset + viewportHeight) / itemHeight) - 1);
  const extra = Math.floor(((Math.max(1, windowSize) - 1) * viewportHeight) / (2 * itemHeight));
  return {
    start: Math.max(0, firstVisible - extra),
    end: Math.min(itemCount - 1, lastVisible + extra),
  };
}
'''
tests = '''
test('windowSize một chỉ giữ phần đang thấy', () => {
  expect(getRenderRange(20, 50, 200, 0, 1)).toEqual({ start: 0, end: 3 });
});
test('mở rộng hai phía theo viewport', () => {
  expect(getRenderRange(100, 50, 200, 400, 3)).toEqual({ start: 4, end: 15 });
});
test('cuối danh sách không vượt item cuối', () => {
  expect(getRenderRange(10, 50, 200, 10000, 3)).toEqual({ start: 2, end: 9 });
});
test('danh sách rỗng', () => {
  expect(getRenderRange(0, 50, 200, 0, 5)).toEqual({ start: 0, end: -1 });
});
test('offset âm được kẹp về đầu', () => {
  expect(getRenderRange(10, 50, 100, -50, 1)).toEqual({ start: 0, end: 1 });
});
'''
hints = ["Tính visible range trước, sau đó cộng overscan mỗi phía.", "Kẹp scroll offset theo tổng chiều cao trừ viewport."]
explanation = "Đây là mô hình toán học đơn giản của vùng render; FlatList thực còn chịu ảnh hưởng batching và đo layout."
sources = ["react_native/optimizing-flatlist-configuration"]

