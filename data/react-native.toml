[[modules]]
id = "rn-core"
sources = ["react_native/pressable", "react_native/platform"]
title = "Core Components & Layout"
description = "View, Text, Image, Pressable, ScrollView; Flexbox mặc định trên React Native."
lesson = '''
### Core components
| RN | Tương đương web |
|---|---|
| `View` | `div` |
| `Text` | `span`/`p` — **mọi chuỗi phải nằm trong `<Text>`** |
| `Image` | `img` (ảnh mạng cần `width`/`height`) |
| `TextInput` | `input` |
| `ScrollView` | div cuộn — render **toàn bộ** con |
| `Pressable` | nút bấm hiện đại (thay `TouchableOpacity`) |
| `SafeAreaView` | tránh tai thỏ / thanh điều hướng (dùng `react-native-safe-area-context`) |

### Flexbox trong RN khác web
- `flexDirection` mặc định là **`column`** (web: `row`).
- `alignContent` mặc định `flex-start`, `flexShrink` mặc định `0`.
- `flex: 1` = chiếm hết không gian còn lại (chỉ nhận **một số**).
- Đơn vị là **density-independent pixels (dp)**, không có `px`, `em`, `rem`.
- Không có cascade CSS: style **không kế thừa**, trừ text lồng trong `<Text>`.


### Tương tác và vùng an toàn
| Trường hợp | Cách làm |
|---|---|
| Chạm/nút | Dùng `Pressable`, hỗ trợ trạng thái pressed/disabled và vùng chạm phù hợp |
| Nội dung bàn phím | Dùng `KeyboardAvoidingView` hoặc scroll container có xử lý bàn phím theo nền tảng |
| Tai thỏ/thanh hệ thống | Dùng safe-area-context để tính vùng hiển thị an toàn |

Ví dụ: `<Pressable onPress={save}><Text>Lưu</Text></Pressable>` — phần chữ vẫn nằm trong `Text`.

Lỗi hay gặp: render chuỗi trực tiếp trong `View`, dùng `ScrollView` cho hàng nghìn item, hoặc quên kích thước ảnh URL. So với web, RN dùng `View`/`Text` native thay `div`/`span`, không nhận text node tự do và không có DOM event.
'''

[[modules]]
id = "rn-styling"
sources = ["react_native/flexbox", "react_native/stylesheet", "react_native/usewindowdimensions"]
title = "Styling & Responsive"
description = "StyleSheet, mảng style, Platform, Dimensions/useWindowDimensions, PixelRatio, dark mode."
lesson = '''
### Ý chính
- `StyleSheet.create({...})` — khai báo style, validate trong dev. `style` nhận **mảng**: phần tử sau ghi đè phần tử trước, giá trị falsy bị bỏ qua.
- `StyleSheet.flatten(style)` gộp mảng style thành 1 object.
- `StyleSheet.hairlineWidth`, `StyleSheet.absoluteFill`.
- **Platform**: `Platform.OS` (`'ios' | 'android' | 'web'…`), `Platform.select({ ios, android, native, default })`, file `Button.ios.tsx` / `Button.android.tsx`.
- **Kích thước**: ưu tiên hook `useWindowDimensions()` (tự cập nhật khi xoay màn hình) thay vì `Dimensions.get('window')`.
- `PixelRatio.get()`, `PixelRatio.roundToNearestPixel()`.
- Dark mode: `useColorScheme()` trả về `'light' | 'dark' | null`.


### Chọn style theo trạng thái và thiết bị
| Nhu cầu | Mẫu dùng |
|---|---|
| Base + trạng thái | `style={[styles.button, pressed && styles.pressed]}` |
| Kích thước đổi khi xoay | `useWindowDimensions()` trong component |
| Khác biệt nền tảng nhỏ | `Platform.select({ ios: ..., android: ..., default: ... })` |

Ví dụ: `const wide = width >= 600;` rồi chọn layout theo `wide`; hook sẽ cập nhật khi cửa sổ đổi.

Lỗi hay gặp: mong style kế thừa từ `View` cha, dùng `px`/`rem`, hoặc tạo style object mới liên tục trong render mà không có lý do. Trên web CSS có cascade, selector và media query; RN ghép object style có thứ tự, dùng đơn vị dp và logic JavaScript cho responsive.
'''

[[modules]]
id = "rn-lists"
sources = ["react_native/flatlist", "react_native/optimizing-flatlist-configuration", "react_native/sectionlist"]
title = "Danh sách & Hiệu năng"
description = "FlatList, SectionList, virtualization, getItemLayout, pagination, re-render, Hermes."
lesson = '''
### FlatList
- **Virtualized**: chỉ render các item gần viewport (`windowSize`, `initialNumToRender`, `maxToRenderPerBatch`).
- `keyExtractor` trả về key duy nhất (mặc định dùng `item.key` rồi đến index).
- `getItemLayout` (item có chiều cao cố định) → bỏ qua đo đạc, `scrollToIndex` chính xác.
- `onEndReached` + `onEndReachedThreshold` để phân trang (infinite scroll).
- `extraData` để FlatList (PureComponent) render lại khi dữ liệu ngoài `data` thay đổi.
- Item nên được `React.memo`, `renderItem` ổn định (`useCallback`).
- Danh sách rất lớn: cân nhắc **FlashList** (Shopify) tái sử dụng view (recycling).

### Hiệu năng chung
- Giữ JS thread rảnh: tránh tính toán nặng trong render; animation dùng **Reanimated** (chạy trên UI thread) hoặc `useNativeDriver: true`.
- **Hermes**: JS engine tối ưu cho RN — bytecode biên dịch trước, khởi động nhanh, ít RAM.
- Xoá `console.log` ở bản release.


### Chọn component và cấu hình
| Component | Dùng khi | Ghi chú |
|---|---|---|
| `ScrollView` | Nội dung nhỏ, số phần tử giới hạn | Render toàn bộ con |
| `FlatList` | Danh sách dài, tải theo lô | Virtualization, key ổn định |
| `SectionList` | Danh sách nhóm có header | `sections` giữ dữ liệu theo nhóm |
| FlashList | Danh sách lớn cần recycling | Thư viện ngoài, kiểm tra yêu cầu phiên bản |

Ví dụ: `keyExtractor={(item) => String(item.id)}`; nếu row phụ thuộc state ngoài `data`, truyền giá trị đó qua `extraData`.

Lỗi hay gặp: key là index khi danh sách đổi thứ tự, `getItemLayout` không tính separator, hoặc `renderItem` tạo props mới khiến memo không hiệu quả. Web thường virtualize DOM node; FlatList quản lý native view và cần đo trên thiết bị thật.
'''

[[modules]]
id = "rn-navigation"
sources = ["react_native/linking"]
title = "Điều hướng"
description = "React Navigation: stack, tab, drawer, params, deep link; Expo Router."
lesson = '''
### React Navigation
- `NavigationContainer` bọc toàn app (Expo Router tự làm việc này).
- **Native Stack** (`@react-navigation/native-stack`) dùng `UINavigationController`/`Fragment` gốc → mượt hơn JS stack.
- `navigation.navigate('Profile', { id })` — nếu màn hình đã có trong stack thì quay về nó; `push` luôn thêm mới; `goBack`, `popToTop`, `replace`.
- Đọc params: `route.params` hoặc `useRoute()`; dùng `useNavigation()` trong component con.
- Màn hình trong stack **không unmount** khi push màn khác → dùng `useFocusEffect` để chạy logic khi màn hình được focus.
- **Deep linking**: cấu hình `linking` (prefix + map path → screen).
- **Expo Router**: file-based routing (`app/(tabs)/index.tsx`, `app/user/[id].tsx`), xây trên React Navigation.


### Stack và URL ngoài app
| Thao tác | Ý nghĩa |
|---|---|
| `navigate(name)` | Đi tới route, có thể quay về route cùng tên đã có |
| `push(name)` | Luôn thêm một instance mới vào stack |
| `replace(name)` | Thay route hiện tại |
| `reset(state)` | Thay toàn bộ navigation state |

Ví dụ: route `app/user/[id].tsx` nhận `id` từ URL; chỉ truyền ID/giá trị tuần tự hóa qua params, rồi tải dữ liệu trong screen.

Lỗi hay gặp: nghĩ màn hình dưới stack đã unmount, điều hướng bằng callback truyền trong params, hoặc chỉ xử lý URL lúc app đang mở. Web thường gắn route với browser history; RN cần cấu hình linking/prefix và xử lý cả URL khởi chạy lẫn URL đến sau đó.
'''

[[modules]]
id = "rn-native"
sources = ["react_native/appstate", "react_native/accessibility", "react_native/performance"]
title = "Kiến trúc, Native & Dữ liệu"
description = "New Architecture (JSI, Fabric, TurboModules), bridge, Expo, lưu trữ, quyền, build & phát hành."
lesson = '''
### Kiến trúc
- **Old architecture**: JS ↔ Native qua **Bridge** bất đồng bộ, serialize JSON → nghẽn khi nhiều message.
- **New Architecture** (mặc định từ RN 0.76):
  - **JSI** (JavaScript Interface): C++ API cho JS giữ tham chiếu & gọi trực tiếp đối tượng native, đồng bộ được.
  - **Fabric**: renderer mới, hỗ trợ concurrent React, đo layout đồng bộ.
  - **TurboModules**: native module lazy-load, type-safe qua **Codegen**.
- **Yoga**: engine layout Flexbox viết bằng C++.

### Dữ liệu & bảo mật
- `AsyncStorage`: key-value **không mã hoá**, bất đồng bộ. Token/secret → `expo-secure-store` / Keychain / Keystore.
- **MMKV**: key-value đồng bộ, rất nhanh (dựa trên JSI).
- Quyền (camera, vị trí): khai báo trong `Info.plist` / `AndroidManifest.xml`, xin lúc runtime.

### Expo
- Expo SDK + **EAS Build/Submit/Update**; **development build** thay cho Expo Go khi cần native module riêng; **config plugins** để chỉnh native mà không eject.
- **OTA update** (EAS Update) chỉ cập nhật được JS & asset, không cập nhật native code.


### Runtime, dữ liệu và phát hành
| Nhu cầu | Lựa chọn |
|---|---|
| Cache không nhạy cảm | AsyncStorage hoặc MMKV theo yêu cầu đồng bộ/hiệu năng |
| Token | SecureStore/Keychain/Keystore wrapper |
| Trạng thái app | `AppState` để tạm dừng polling hoặc làm mới khi active |
| Native module mới | Development build và config plugin/prebuild phù hợp |

Ví dụ: khi app trở lại `active`, kiểm tra thời điểm sync cuối rồi làm mới dữ liệu; không phụ thuộc tác vụ JS chạy liên tục ở background.

Lỗi hay gặp: lưu token trong AsyncStorage, giả định OTA thay được native code, hoặc xin permission mà không có nhánh từ chối. Trên web, localStorage và service worker có vòng đời/quyền khác; RN dùng secure storage và khả năng nền do iOS/Android quản lý.
'''

[[modules]]
id = "rn-architecture"
title = "New Architecture & Luồng thực thi"
description = "JSI, Fabric, TurboModules, Codegen, Hermes, bridgeless và tương tác giữa JS thread với UI thread."
sources = ["react_native/new-architecture-intro", "react_native/new-architecture-app-intro", "react_native/hermes"]
lesson = '''
### Các mảnh ghép
| Thành phần | Vai trò |
|---|---|
| JSI | Giao diện C++ để JavaScript tương tác với đối tượng native mà không phải serialize mọi lời gọi qua Bridge cũ |
| Fabric | Renderer mới, phối hợp React với cây giao diện native |
| TurboModules | Nạp native module theo nhu cầu; Codegen tạo phần kết nối từ spec có kiểu |
| Hermes | JavaScript engine thường được đóng gói mặc định với ứng dụng RN |
| Bridgeless | Chạy New Architecture mà không phụ thuộc Bridge legacy |

JS thread xử lý React, JavaScript và sự kiện; UI thread/native xử lý hiển thị, layout native và tương tác khung hình. JSI giảm chi phí qua lại nhưng không làm mọi JavaScript tự chạy trên UI thread. Hermes cũng không thay Metro: Metro vẫn đóng gói ứng dụng trong quá trình phát triển.

Ví dụ: spec native module được Codegen xử lý ở bước build; ứng dụng gọi module khi cần thay vì khởi tạo mọi module lúc mở app.

Lỗi hay gặp: suy ra JSI làm lời gọi đồng bộ luôn an toàn; chạy vòng lặp nặng trên JS thread; nhầm Fabric là JS engine; hoặc tin rằng bridgeless khiến mọi thư viện cũ tự tương thích. Trên web, JavaScript thường cập nhật DOM; RN gửi thay đổi qua renderer tới native view.
'''

[[modules]]
id = "rn-expo"
title = "Expo SDK & Quy trình phát triển"
description = "Expo SDK, Expo Router, config plugin, prebuild, development build, EAS Build và EAS Update."
sources = ["react_native/linking", "react_native/platform-specific-code"]
lesson = '''
### Chọn môi trường và quy trình
| Công cụ | Dùng khi |
|---|---|
| Expo Go | Thử ứng dụng với tập native module đã đóng gói sẵn |
| Development build | Cần native module hoặc cấu hình riêng trong app development |
| Prebuild | Sinh thư mục native từ app config và config plugin |
| EAS Build | Tạo artifact iOS/Android trên máy cục bộ hoặc hạ tầng EAS |
| EAS Update | Phân phối thay đổi JavaScript và asset tương thích với runtime đã cài |

Expo SDK ghép phiên bản Expo modules với một nền React Native tương thích; nâng cấp SDK theo hướng dẫn phiên bản thay vì tự nâng từng phần tùy ý. Expo Router ánh xạ file trong thư mục `app` thành route, route động dùng tên như `[id].tsx`, còn `_layout.tsx` định nghĩa layout/stack.

Ví dụ: một thư viện native tùy biến cần development build; config plugin khai báo thay đổi native để `npx expo prebuild` có thể tạo lại project native nhất quán.

Lỗi hay gặp: sửa trực tiếp thư mục native đã sinh rồi mất thay đổi khi prebuild; nghĩ Expo Go chứa mọi native module; hoặc phát OTA có native runtime không khớp. Trên web, router thường gắn với URL/history của trình duyệt; Expo Router vẫn điều hướng trong app native và cần cấu hình deep link cho liên kết ngoài.
'''

[[modules]]
id = "rn-perf"
title = "Tối ưu danh sách & Profiling"
description = "Virtualization, cấu hình FlatList, FlashList, kiểm soát render lại và đo hiệu năng đúng môi trường."
sources = ["react_native/flatlist", "react_native/optimizing-flatlist-configuration", "react_native/performance", "react_native/profile-hermes"]
lesson = '''
### Điều chỉnh theo phép đo
| Cách làm | Tác dụng | Đánh đổi |
|---|---|---|
| `keyExtractor` ổn định | Giữ đúng danh tính item khi dữ liệu đổi | Không dùng index nếu danh sách có chèn/xóa/sắp xếp |
| `getItemLayout` | Bỏ đo động khi chiều cao item cố định | Offset sai nếu item/header/separator không được tính đủ |
| `windowSize` | Quy định vùng viewport được giữ render quanh vùng nhìn thấy | Lớn hơn dùng thêm bộ nhớ; nhỏ hơn có thể lộ vùng trống khi cuộn nhanh |
| `removeClippedSubviews` | Gỡ view ngoài vùng hiển thị ở một số nền tảng | Có thể gây lỗi hiển thị với layout/transform nhất định |
| FlashList | Thư viện bên thứ ba dùng tái sử dụng view | Cần kiểm tra yêu cầu phiên bản và New Architecture của phiên bản đang chọn |

Ví dụ: row có chiều cao cố định 56 dp và separator 1 dp thì `getItemLayout` dùng `length: 56` và `offset: index * 57`. `React.memo` hữu ích khi props ổn định; `useCallback` chỉ giúp khi tham chiếu hàm là nguyên nhân khiến con render lại.

Lỗi hay gặp: bật mọi prop tối ưu cùng lúc, tạo object/hàm mới cho từng item, dùng index làm key, hoặc đo trong development rồi kết luận hiệu năng release. Dùng React DevTools/Profiler và Hermes sampling profiler để tìm nguyên nhân trước khi đổi cấu hình. Khác với web list virtualization, RN tạo native views; không dựa vào DOM profiler hay API trình duyệt.
'''

[[modules]]
id = "rn-animation-gesture"
title = "Animation & Gesture"
description = "Animated, native driver, Reanimated worklet/shared value và React Native Gesture Handler."
sources = ["react_native/animated", "react_native/gesture-responder-system"]
lesson = '''
### Chọn công cụ theo chuyển động
| Công cụ | Thích hợp cho |
|---|---|
| `Animated` | Chuyển động khai báo trong React Native; `useNativeDriver` phù hợp với opacity/transform |
| Reanimated | Tính toán worklet và cập nhật shared value gần UI runtime |
| Gesture Handler | Nhận biết pan, tap, pinch và phối hợp gesture bằng native handler |
| Layout animation | Chuyển động gắn với thay đổi layout khi hỗ trợ trên cấu hình mục tiêu |

Ví dụ Animated: `Animated.timing(progress, { toValue: 1, duration: 220, useNativeDriver: true })`. Native driver không áp dụng cho thuộc tính cần tính lại layout như `height` hay `padding`. Trong Reanimated, shared value lưu trạng thái chuyển động; worklet có thể tính frame mà không cần gọi JavaScript mỗi khung hình.

Lỗi hay gặp: đọc/ghi state React liên tục trong mỗi frame; đánh dấu worklet nhưng gọi API chỉ có trên JS runtime; hoặc để gesture cạnh tranh mà không định nghĩa quan hệ ưu tiên. Trên web, animation thường gắn với CSS/WAAPI và pointer event; RN dùng native view/gesture handler nên không có DOM.
'''

[[modules]]
id = "rn-data-offline"
title = "Dữ liệu Offline & Liên kết"
description = "Lưu trữ cục bộ, token an toàn, trạng thái mạng, đồng bộ hàng đợi, push notification và deep link."
sources = ["react_native/appstate", "react_native/linking"]
lesson = '''
### Lưu trữ và đồng bộ
| Nhu cầu | Lựa chọn | Lưu ý |
|---|---|---|
| Cache không nhạy cảm | AsyncStorage hoặc MMKV | AsyncStorage bất đồng bộ; AsyncStorage không mã hóa dữ liệu |
| Token/secret | SecureStore hoặc Keychain/Keystore wrapper | Không ghi token vào log hay bundle; xử lý trường hợp không đọc được |
| Trạng thái kết nối | NetInfo | `isConnected` và `isInternetReachable` có thể khác nhau hoặc chưa biết |
| Thay đổi offline | Hàng đợi local có retry | Dùng idempotency key và quy tắc xử lý xung đột khi gửi lại |
| Push/deep link | Handler notification và Linking | Payload đến từ bên ngoài, phải kiểm tra trước khi điều hướng |

Ví dụ: khi offline, ghi thao tác cùng ID ổn định vào hàng đợi; khi mạng trở lại, gửi tuần tự, retry với exponential backoff và bỏ thao tác đã được server xác nhận. Push notification có thể bị trì hoãn hoặc không đến, vì vậy dữ liệu quan trọng phải đồng bộ lại từ server.

Lỗi hay gặp: xem tín hiệu Wi-Fi là chắc chắn có Internet; retry vô hạn không giới hạn; lưu token trong AsyncStorage; hoặc chỉ xử lý URL khi app đang mở. Trên web, localStorage/service worker có vòng đời và quyền khác; không dùng các API đó trong ứng dụng RN.
'''

[[modules]]
id = "rn-release"
title = "Quyền, Bảo mật & Phát hành"
description = "Permission, khác biệt nền tảng, ký ứng dụng, OTA update, crash reporting và quy trình store review."
sources = ["react_native/platform-specific-code", "react_native/platform", "react_native/performance"]
lesson = '''
### Checklist phát hành
| Hạng mục | Kiểm tra |
|---|---|
| Permission | Khai báo lý do đúng với tính năng; xin quyền đúng thời điểm; có nhánh từ chối |
| Platform | Dùng `Platform.select` hoặc file theo nền tảng cho khác biệt thực sự |
| Ký ứng dụng | Giữ keystore/certificate và thông tin ký ngoài repository, có sao lưu kiểm soát |
| OTA | Chỉ phát JS/asset tới runtime tương thích; native change cần binary mới |
| Crash reporting | Upload symbol phù hợp và loại token/PII khỏi breadcrumb, payload |
| Store review | Khai báo quyền, privacy và hành vi ứng dụng khớp với bản phát hành |

Ví dụ: thay đổi JavaScript có thể phát qua EAS Update nếu `runtimeVersion` khớp build; thêm native module hoặc đổi permission manifest cần build và phân phối binary mới. Phát theo channel/nhóm nhỏ để phát hiện lỗi trước khi mở rộng.

Lỗi hay gặp: đưa signing secret vào app config được commit; xin quyền quá sớm; phát OTA vượt qua kiểm duyệt store hoặc vượt runtime; và coi crash log là dữ liệu vô hại. Trên web, TLS/certificate của máy chủ khác với ký binary iOS/Android; permission prompt cũng do nền tảng mobile quản lý.
'''

