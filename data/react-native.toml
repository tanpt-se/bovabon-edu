[[questions]]
id = "rn-xc13"
module = "rn-release"
type = "code"
difficulty = 3
lang = "javascript"
title = "Ẩn dữ liệu nhạy cảm khỏi crash payload"
prompt = '''
Viết `redactCrashPayload(value)` cho dữ liệu JSON-like gồm object, array và primitive:
- Đệ quy tạo cấu trúc mới, không mutate input.
- Với key không phân biệt hoa thường `token`, `accessToken`, `refreshToken`, `password`, `email`, thay value bằng chuỗi `[REDACTED]`.
- Các key khác giữ nguyên và tiếp tục xử lý lồng nhau.
- Input là dữ liệu không có vòng tham chiếu.
'''
starter = '''
function redactCrashPayload(value) {
  return value;
}
'''
solution = '''
function redactCrashPayload(value) {
  const sensitive = new Set(['token', 'accesstoken', 'refreshtoken', 'password', 'email']);
  if (Array.isArray(value)) return value.map(redactCrashPayload);
  if (value && typeof value === 'object') {
    const result = {};
    for (const [key, item] of Object.entries(value)) {
      result[key] = sensitive.has(key.toLowerCase()) ? '[REDACTED]' : redactCrashPayload(item);
    }
    return result;
  }
  return value;
}
'''
tests = '''
test('ẩn key nhạy cảm không phân biệt hoa thường', () => {
  expect(redactCrashPayload({ token: 'a', accessToken: 'b', PASSWORD: 'c', email: 'd' })).toEqual({ token: '[REDACTED]', accessToken: '[REDACTED]', PASSWORD: '[REDACTED]', email: '[REDACTED]' });
});
test('đệ quy qua object và array', () => {
  expect(redactCrashPayload({ user: [{ email: 'a@b', name: 'An' }] })).toEqual({ user: [{ email: '[REDACTED]', name: 'An' }] });
});
test('giữ nguyên primitive và key thường', () => {
  expect(redactCrashPayload({ message: 'failed', count: 2, enabled: false })).toEqual({ message: 'failed', count: 2, enabled: false });
});
test('không mutate object đầu vào', () => {
  const input = { nested: { token: 'secret' } };
  const result = redactCrashPayload(input);
  expect(result).not.toBe(input);
  expect(result.nested).not.toBe(input.nested);
  expect(input.nested.token).toBe('secret');
});
test('array kết quả là array mới', () => {
  const input = [{ refreshToken: 'secret' }];
  const result = redactCrashPayload(input);
  expect(result).not.toBe(input);
  expect(result[0].refreshToken).toBe('[REDACTED]');
});
'''
hints = ["Phân nhánh array trước object.", "Khi tạo object mới, chỉ thay value của key nhạy cảm; đệ quy các key còn lại."]
explanation = "Redaction giảm nguy cơ lộ bí mật trong crash report; hệ thống thực tế cần danh sách dữ liệu nhạy cảm theo schema."
sources = ["react_native/performance"]
