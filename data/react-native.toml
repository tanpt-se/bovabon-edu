[[questions]]
id = "rn-088"
module = "rn-native"
type = "code"
difficulty = 3
title = "Cache có hạn dùng trên AsyncStorage"
prompt = '''
Viết `createCache(storage, ttlMs)` — `storage` có API giống AsyncStorage: `getItem(key)`, `setItem(key, value)`, `removeItem(key)` đều trả về **Promise**, chỉ lưu **chuỗi**.

Trả về:
- `set(key, value)` → lưu `JSON.stringify({ value, expires: Date.now() + ttlMs })`
- `get(key)` → Promise trả về `value` nếu còn hạn; nếu không có / hết hạn (`Date.now() >= expires`) thì trả về `null` (và xoá key khi hết hạn); JSON hỏng → `null`

`Date.now()` được điều khiển bằng fake timers (`jest.advanceTimersByTime`).
'''
starter = '''
function createCache(storage, ttlMs) {
  return {
    async set(key, value) {
      // TODO
    },
    async get(key) {
      // TODO
    },
  };
}
'''
solution = '''
function createCache(storage, ttlMs) {
  return {
    async set(key, value) {
      await storage.setItem(key, JSON.stringify({ value, expires: Date.now() + ttlMs }));
    },
    async get(key) {
      const raw = await storage.getItem(key);
      if (raw == null) return null;
      let entry;
      try { entry = JSON.parse(raw); } catch (e) { return null; }
      if (!entry || typeof entry.expires !== 'number') return null;
      if (Date.now() >= entry.expires) {
        await storage.removeItem(key);
        return null;
      }
      return entry.value;
    },
  };
}
'''
tests = '''
function memoryStorage() {
  const m = new Map();
  return {
    m,
    getItem: jest.fn(async (k) => (m.has(k) ? m.get(k) : null)),
    setItem: jest.fn(async (k, v) => { if (typeof v !== 'string') throw new Error('chỉ lưu chuỗi'); m.set(k, v); }),
    removeItem: jest.fn(async (k) => { m.delete(k); }),
  };
}
test('set rồi get', async () => {
  const st = memoryStorage();
  const c = createCache(st, 1000);
  await c.set('user', { id: 1 });
  expect(await c.get('user')).toEqual({ id: 1 });
});
test('không có key → null', async () => {
  const c = createCache(memoryStorage(), 1000);
  expect(await c.get('nope')).toBeNull();
});
test('hết hạn → null và xoá key', async () => {
  const st = memoryStorage();
  const c = createCache(st, 1000);
  await c.set('k', 'v');
  jest.advanceTimersByTime(999);
  expect(await c.get('k')).toBe('v');
  jest.advanceTimersByTime(1);
  expect(await c.get('k')).toBeNull();
  expect(st.removeItem).toHaveBeenCalledWith('k');
  expect(st.m.has('k')).toBe(false);
});
test('JSON hỏng → null', async () => {
  const st = memoryStorage();
  st.m.set('bad', '{oops');
  expect(await createCache(st, 10).get('bad')).toBeNull();
});
test('lưu được giá trị falsy', async () => {
  const c = createCache(memoryStorage(), 100);
  await c.set('zero', 0);
  expect(await c.get('zero')).toBe(0);
});
'''
hints = ["`JSON.parse` có thể ném lỗi — bọc try/catch.", "Phân biệt 'không có key' (`null`) với giá trị `0`/`false` đã lưu."]
explanation = "Pattern cache-with-TTL hay dùng để lưu response API offline-first."

