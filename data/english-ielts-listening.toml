# ─────────────────────────────────────────────────────────────
[[modules]]
id = "il-format-numbers-spelling"
title = "Định dạng bài thi, số & chính tả"
description = "Cấu trúc 4 phần Listening, cách ghi số, ngày tháng, giờ, giá tiền, đánh vần tên và mã bưu chính; lỗi chính tả hay mất điểm."
lesson = '''
**Lộ trình gợi ý:** xong CEFR B1 → học song song CEFR B2 + Ngữ pháp IELTS + Từ vựng IELTS → **Reading và Listening** (hai kỹ năng tăng điểm nhanh nhất nhờ chiến lược) → Writing → Speaking.

**Giới hạn của app:** app chỉ có chữ, không có audio. Ở đây bạn luyện Listening qua *transcript* (có đánh dấu người nói): học cách nhận bẫy, số, chính tả và signpost. Để lên band 6.5 thật sự, bạn vẫn phải luyện thêm với audio thật (xem mục "Tự luyện ngoài app").

### Định dạng bài thi
| Phần | Nội dung | Dạng câu hay gặp |
|---|---|---|
| 1 | Hội thoại đời sống 2 người (đặt phòng, đăng ký) | Form / note completion |
| 2 | Độc thoại đời sống (thông báo, giới thiệu địa điểm) | Map / plan labelling, MCQ |
| 3 | Thảo luận học thuật 2–4 người | MCQ, matching, completion |
| 4 | Bài giảng học thuật một người nói | Note / summary completion |

Tổng 40 câu, khoảng 30 phút, **chỉ nghe một lần**. Bạn có 10 phút cuối để chép đáp án vào answer sheet; khi chép phải đúng chính tả, đúng giới hạn số từ.

### Chiến lược theo bước
1. **Đọc trước câu hỏi** trong thời gian được cho: gạch chân từ khoá, đoán loại từ cần điền (số, tên, danh từ, tính từ).
2. **Theo thứ tự**: đáp án luôn xuất hiện theo thứ tự câu hỏi.
3. **Viết ngay** khi nghe, đừng đợi; ghi tắt rồi sửa lại.
4. **Chú ý giới hạn số từ** (*NO MORE THAN TWO WORDS AND/OR A NUMBER*): thừa một từ là sai.

### Số, ngày, giờ, tiền
| Dạng | Cách nghe | Cách viết |
|---|---|---|
| 13 / 30 | thir**teen** (nhấn cuối) / **thir**ty (nhấn đầu) | 13 / 30 |
| 15 / 50 | fif**teen** / **fif**ty | 15 / 50 |
| Ngày | *the fifteenth of March* / *March the fifteenth* | 15 March hoặc March 15 |
| Giờ | *quarter past nine, half past two, ten to eight* | 9.15, 2.30, 7.50 |
| Tiền | *two hundred and fifty pounds, four ninety-nine* | £250, £4.99 |
| Số điện thoại | *double five* = 55, *oh/zero* = 0 | 07755 ... |
| Mã bưu chính | đọc từng ký tự | CB4 2LT |

### Đánh vần tên
Giữ chuẩn bảng chữ cái: A (ây), E (i), I (ai), G (ji), J (jây), R (a), W (đắp-bồ-liu). Hay nhầm: **B/P/V**, **M/N**, **S/F**, **G/J**, **E/I**. Khi nghe *double L* thì viết LL.

### Lỗi hay gặp của người Việt
- Viết ~~informations~~, ~~advices~~: danh từ không đếm được.
- Bỏ *-s* ở danh từ số nhiều khi đáp án yêu cầu (*two tickets*).
- Sai chính tả những từ dễ: *Wednesday, February, accommodation, necessary, library, environment*.
- Nhầm 13/30, 15/50 và nhầm ngày–tháng (*3/4* là 3 tháng 4 ở Anh).
- Chép thừa từ vượt giới hạn, hoặc quên đơn vị khi đề đã in sẵn đơn vị.

### Quản lý thời gian
Không dừng lại ở một câu bỏ lỡ: bỏ qua, nghe tiếp câu sau. Sau cùng, điền mọi ô trống: sai không bị trừ điểm.

### Tự luyện ngoài app
- Mỗi ngày nghe 10–15 phút audio tiếng Anh giọng Anh/Úc/Mỹ/Canada rồi **chép chính tả** từng câu (dictation).
- Luyện riêng số và chữ cái: nhờ bạn đọc số điện thoại, mã đặt chỗ; hoặc tự thu âm rồi nghe lại và viết.
- Làm một đề Listening đầy đủ mỗi tuần, chấm bằng đáp án chính thức, ghi lại lỗi theo nhóm (chính tả, số, bẫy, số từ).
- Nghe với phụ đề tiếng Anh *sau* khi đã làm bài để so sánh chỗ bỏ lỡ.
'''

# ─────────────────────────────────────────────────────────────
[[modules]]
id = "il-section1-forms"
title = "Phần 1: Form & note completion"
description = "Phần 1: hội thoại đời sống, điền form (đặt phòng, đăng ký); nhận ra thông tin bị sửa, mã, địa chỉ, giá."
lesson = '''
Phần 1 là phần **dễ nhất** nhưng cũng là phần dễ mất điểm vì chính tả và bẫy. Hai người nói chuyện (khách và nhân viên), một người hỏi, một người trả lời, người hỏi sẽ *lặp lại để xác nhận*.

### Chiến lược theo bước
1. Trong thời gian đọc đề, nhìn **cả form**: ô nào cần số, tên riêng, danh từ, ngày. Dự đoán dạng đáp án.
2. Nghe **câu hỏi của nhân viên**: *Could I have your name? What's your postcode?*. Câu hỏi cho biết ô nào sắp được trả lời.
3. Khi khách đưa thông tin, **đừng chốt ngay**. Hãy chờ xem có sửa/lặp xác nhận không: đáp án cuối cùng thường là phiên bản được xác nhận.
4. Ghi đáp án rồi chuyển ngay sang ô kế tiếp.

### Mẫu câu báo hiệu thông tin quan trọng
| Chức năng | Mẫu câu |
|---|---|
| Hỏi thông tin | *Could I take your…? / What's the best number to reach you on?* |
| Xác nhận | *So that's… / Let me just check that…* |
| Sửa lại | *Sorry, I meant… / Actually, it's… / No, not … but …* |
| Chốt | *That's all booked. / Right, so I've put you down for…* |

### Các loại thông tin hay gặp
- **Tên và địa chỉ:** họ thường được đánh vần; số nhà đọc như số (*forty-two*); tên đường có *Road/Street/Lane*.
- **Giờ, ngày, thời lượng:** nghe kỹ *half past, quarter to*; *a fortnight* = 2 tuần.
- **Giá tiền:** *£12.50* đọc *twelve fifty*; phân biệt giá thường và giá giảm.
- **Mã:** gồm chữ và số, đọc từng ký tự; *double* và *triple* hay xuất hiện.

### Ví dụ phân tích
> Staff: What date would you like to start? Customer: The third of May, no wait, the fifth, because the flat isn't free until then.

Đáp án là **5 May**, không phải 3 May. Từ báo hiệu: *no wait*. Luôn chờ hết câu.

### Lỗi hay gặp của người Việt
- Viết đáp án ngay khi nghe số đầu tiên, mất câu sửa sau đó.
- Quên rằng form đã in sẵn đơn vị (*£* hoặc *minutes*), viết thừa lại thành sai.
- Viết sai chính tả tên đã được đánh vần (nghe được nhưng lười đối chiếu).
- Sai số ít/số nhiều khi ô trống yêu cầu (*two bedrooms*).

### Mẹo thời gian
Phần 1 thường là phần đạt điểm tối đa. Mục tiêu 9–10/10 câu: nếu sai nhiều ở đây thì ôn lại số, ngày và chính tả trước.

### Tự luyện ngoài app
- Tìm hội thoại đặt phòng, thuê xe, đăng ký khoá học bằng audio thật (có thể tự soạn kịch bản rồi nhờ bạn đọc), nghe và điền form tương tự.
- Sau khi làm bài, tô màu các chỗ người nói tự sửa (*sorry, I mean…*) để nhận ra mẫu.
- Thu âm giọng mình đọc form có số/tên rồi nghe lại để quen cách nói của người bản xứ.
'''

# ─────────────────────────────────────────────────────────────
[[modules]]
id = "il-section2-maps-plans"
title = "Phần 2: Map & plan labelling"
description = "Phần 2: độc thoại đời sống; từ chỉ hướng và vị trí, tả lộ trình, gắn nhãn bản đồ và sơ đồ mặt bằng."
lesson = '''
Phần 2 là một người nói liên tục (hướng dẫn tham quan, thông báo sự kiện), thường kèm **bản đồ hoặc sơ đồ mặt bằng** cần gắn nhãn A–H, hoặc MCQ. Trọng tâm: nghe **từ chỉ vị trí và hướng** rồi định vị trên hình.

### Chiến lược theo bước
1. Trước khi nghe, **xác định mốc cố định** trên bản đồ: cổng vào (*entrance*), con sông, đường chính, toà nhà lớn. Xác định hướng bắc nếu có la bàn.
2. Nghe người nói đi **theo một lộ trình**: thường từ cổng vào, theo thứ tự câu hỏi.
3. Mỗi khi người nói nêu địa điểm, hãy tìm *mốc + hướng*: *next to the café, opposite the gate*.
4. Nếu lạc, quay về mốc gần nhất; đừng đoán theo tên khu vực.

### Bảng từ chỉ vị trí & hướng
| Ý | Từ / cụm |
|---|---|
| bên cạnh | *next to, beside, alongside* |
| đối diện | *opposite, facing, across from* |
| ở giữa | *between A and B, in the middle of* |
| phía sau / trước | *behind, at the back of / in front of* |
| rẽ | *turn left/right, take the second turning* |
| đi thẳng | *go straight on, carry on, continue past* |
| góc | *on the corner of, at the junction* |
| hướng la bàn | *to the north/south/east/west of, in the north-east corner* |
| gần/xa | *close to, a short walk from, at the far end* |

### Phân biệt dễ nhầm
- **opposite** (đối diện, bên kia đường) ≠ **next to** (bên cạnh).
- **past** (đi ngang qua) ≠ **to** (đến nơi). *Go past the library* nghĩa là *không* dừng ở thư viện.
- **first turning on the left** = ngã rẽ đầu tiên bên trái; không tính các lối nhỏ trước khi thấy đường thật.
- **left/right** tính theo hướng người đang đi, không theo hướng nhìn tờ giấy.

### Ví dụ phân tích
> *Go through the main gate and the shop is on your right, just before the fountain.*

Tìm vị trí: cửa hàng ở **bên phải** lối đi, **trước** đài phun nước. Nếu trên bản đồ có hai ô bên phải, chọn ô gần cổng hơn.

### Lỗi hay gặp
- Nhầm trái/phải khi người nói đang đi, hoặc nhầm "đi qua" và "đến".
- Dừng quá lâu ở một ô, mất câu kế tiếp.
- Không đọc nhãn của các ô có sẵn tên (người nói sẽ nhắc tên chứ không đọc chữ cái).

### Mẹo thời gian
Gạch bằng bút chì lộ trình đã nghe. Nếu ô đã dùng thì thường không dùng lại (trừ khi đề nói được lặp).

### Tự luyện ngoài app
- Mở một bản đồ khu bạn sống, tự mô tả đường đi bằng tiếng Anh rồi thu âm; nhờ bạn vẽ lại theo bản thu.
- Nghe bài hướng dẫn tham quan (bảo tàng, khuôn viên trường) bằng tiếng Anh và vẽ sơ đồ dựa trên lời mô tả.
- Học thuộc nhóm từ chỉ hướng bằng cách luyện câu: *The library is opposite the sports hall, between the café and the car park.*
'''

# ─────────────────────────────────────────────────────────────
[[modules]]
id = "il-section3-discussion"
title = "Phần 3: Thảo luận nhiều người"
description = "Phần 3: thảo luận học thuật 2–4 người; phân biệt người nói, đồng ý / không đồng ý, MCQ và matching."
lesson = '''
Phần 3 là cuộc thảo luận giữa sinh viên và giảng viên về một dự án, bài tập hoặc nghiên cứu. Khó hơn Phần 1–2 vì **nhiều người nói, ý kiến thay đổi, và đáp án nằm ở thái độ chứ không chỉ ở thông tin**.

### Chiến lược theo bước
1. Đọc câu hỏi **và các phương án** của MCQ: gạch từ khoá khác biệt giữa các phương án.
2. Khi nghe, ghi **ai nói gì** (ký hiệu tên viết tắt) và **thái độ**: đồng ý, phản đối, do dự.
3. Phương án đúng thường là **ý cuối cùng** sau khi cả nhóm bàn xong. Ý đầu tiên thường là mồi.
4. Với matching (ghép người – ý kiến), ghi tên rồi đối chiếu ý được nêu.

### Ngôn ngữ ý kiến
| Chức năng | Mẫu câu |
|---|---|
| Đồng ý | *Exactly. / That's a good point. / I couldn't agree more.* |
| Đồng ý một phần | *Yes, but… / I see what you mean, however…* |
| Phản đối | *I'm not so sure. / I don't think that would work.* |
| Gợi ý | *Why don't we…? / What about…? / Maybe we should…* |
| Chốt quyết định | *OK, so we'll go with… / Right, let's do that.* |

### Phân biệt thái độ
- *I'd quite like to try…* = muốn thử, chưa chắc chắn; *I'm convinced that…* = rất chắc.
- *It might be worth…* = gợi ý nhẹ; *We have to…* = bắt buộc.
- *It seems a bit risky* = lo ngại; *I'm a little worried about…* = lo ngại, đáp án thường là **vấn đề**.

### Ví dụ phân tích
> *Mia: I think we should use a survey. Tom: It would take too long. Mia: True. How about interviews? Tom: Yes, that's more realistic.*

Đáp án cho "nhóm quyết định dùng gì" là **interviews**. *survey* là mồi bị Tom bác bỏ.

### Lỗi hay gặp
- Chọn phương án nghe thấy đầu tiên mà không đợi kết luận.
- Nhầm người nói (nhất là hai giọng cùng giới) dẫn đến sai matching.
- Chọn phương án có đúng từ trong bài nhưng sai ý (distractor "đúng từ, sai nghĩa").
- Không đọc kỹ từ phủ định (*not, hardly, rather than*).

### Mẹo thời gian
Phần 3 hay chứa 2 câu *multiple* (chọn 2–3 phương án). Cả hai có thể được nhắc xen kẽ trong bài; tick nháp rồi chốt khi nghe hết.

### Tự luyện ngoài app
- Nghe podcast/thảo luận học thuật ngắn (2–3 người) và tự tóm tắt: ai muốn gì, cuối cùng quyết định gì.
- Xem lại transcript sau khi nghe, tô màu từ báo hiệu đồng ý/phản đối.
- Tự đóng vai: ghi âm một đoạn bạn thảo luận bài tập với bạn học, đọc lại để bắt chước kiểu nhượng bộ (*Yes, but…*).
'''

# ─────────────────────────────────────────────────────────────
[[modules]]
id = "il-section4-lecture"
title = "Phần 4: Bài giảng học thuật"
description = "Phần 4: bài giảng một người nói; note/summary completion, từ vựng học thuật, nhận cấu trúc bài giảng."
lesson = '''
Phần 4 là bài giảng học thuật không có nghỉ giữa chừng, thường điền **note, bảng hoặc sơ đồ** theo đúng thứ tự bài nói. Đây là phần khó nhất vì từ vựng học thuật và tốc độ liên tục.

### Chiến lược theo bước
1. Đọc đề: tiêu đề bài, tiêu đề từng nhóm note cho biết **cấu trúc** bài giảng. Dự đoán loại từ.
2. Nghe **mở đầu**: người giảng thường nêu chủ đề và cấu trúc (*Today I'll cover three areas…*).
3. Dùng từ khoá của đề để định vị, nhưng nhớ đề thường **paraphrase** từ trong bài.
4. Viết ngay đáp án; nếu nghe được cụm *key term* nhưng chưa chắc chính tả, đoán theo âm rồi sửa lại ở cuối.

### Từ vựng học thuật hay gặp
| Nhóm | Từ |
|---|---|
| Nghiên cứu | *survey, sample, hypothesis, findings, data, evidence* |
| Nguyên nhân | *factor, cause, trigger, contribute to, result in* |
| Giải pháp | *strategy, approach, method, tackle, address* |
| Mức độ | *significant, marginal, substantial, negligible* |
| Chủ đề thường gặp | *ecology, urban planning, marine biology, psychology, history of technology* |

### Nhận biết cấu trúc bài giảng
- *Firstly / Secondly / Finally* → đáp án theo từng ý.
- *There are three main types…* → điền danh sách.
- *The most important point is…* → ý quan trọng nhất.
- *To sum up…* → tóm tắt: thường lặp lại đáp án.

### Ví dụ phân tích
> *The experiment involved placing sensors on the riverbed to monitor the temperature of the water over a period of two years.*

Đề: *Sensors were placed on the ____ to measure temperature.* Đáp án: **riverbed**. Cụm *placing sensors on* ↔ *were placed on*.

### Lỗi hay gặp
- Bị cuốn vào từ khó (tên khoa học) mà quên đáp án chỉ cần là từ phổ thông.
- Sai chính tả từ học thuật (*environment, phenomenon, behaviour*).
- Điền sai dạng số ít/số nhiều hoặc dạng từ không hợp ngữ pháp của chỗ trống.
- Mất thứ tự: bỏ lỡ một chỗ rồi lúng túng, bỏ luôn chỗ kế tiếp.

### Mẹo thời gian
Nếu lỡ một ô, **chuyển ngay** sang ô sau. Đáp án luôn theo thứ tự.

### Tự luyện ngoài app
- Nghe bài giảng ngắn (10–15 phút) về khoa học phổ thông bằng tiếng Anh, vừa nghe vừa ghi note theo cấu trúc, sau đó tự tóm tắt bằng lời.
- Luyện *shadowing* một đoạn 30 giây: nghe và nhắc lại ngay, để quen tốc độ.
- Lập sổ từ học thuật; mỗi từ ghi cả phát âm và một collocation.
'''

# ─────────────────────────────────────────────────────────────
[[modules]]
id = "il-distractors-signposting"
title = "Bẫy sửa thông tin & signpost"
description = "Nhận bẫy sửa thông tin (Actually, sorry — it's…), từ khoá đảo, bẫy gần giống; dùng signpost để định vị đáp án."
lesson = '''
IELTS Listening không chỉ kiểm tra bạn có nghe được không, mà kiểm tra bạn có **nghe đến hết thông tin hay không**. Người nói thường nêu một giá trị rồi *sửa lại*, hoặc nêu nhiều lựa chọn rồi chọn một. Module này gom hai kỹ năng: nhận **bẫy** và dùng **signpost**.

### Các loại bẫy thường gặp
| Loại bẫy | Ví dụ | Cách xử lý |
|---|---|---|
| Sửa thông tin | *It's on the 12th — sorry, the 21st.* | Lấy giá trị **sau** khi sửa |
| Phủ định | *Not the red one, the green one.* | Loại thứ bị phủ định |
| Nhiều lựa chọn | *We could meet at 3, or 4, but 4 is better.* | Lấy lựa chọn được **chốt** |
| Đúng từ, sai ý | Đề: *free*; bài: *free of charge for members only* | Đọc điều kiện đi kèm |
| Số gần giống | *fifteen / fifty*, *thirteen / thirty* | Nghe trọng âm |
| Liệt kê rồi loại | *Two options were considered, but only one was kept.* | Chọn cái được giữ |

### Mẫu câu sửa thông tin
*Actually… / Sorry, I mean… / No, wait… / Let me correct that… / Hang on, it's…* Gặp những cụm này, giá trị trước đó thường **không** phải đáp án.

### Signpost (từ báo hiệu)
| Chức năng | Ví dụ | Ý nghĩa với đáp án |
|---|---|---|
| Mở đầu | *Let me start with…* | Bắt đầu ý đầu tiên |
| Chuyển ý | *Moving on to… / Turning to…* | Câu hỏi kế tiếp sắp tới |
| Đối lập | *However, / On the other hand,* | Thông tin quan trọng thường sau từ này |
| Quan trọng | *The main reason is… / Above all…* | Đáp án thường ở đây |
| Kết luận | *In conclusion / To sum up* | Tóm tắt: đối chiếu đáp án |

### Ví dụ phân tích
> *The workshop begins at ten. Actually, sorry, that's for the morning group. Yours starts at eleven thirty.*

Đáp án **11.30**. *ten* là mồi; *Actually, sorry* là dấu hiệu sửa.

### Lỗi hay gặp
- Ghi đáp án ngay từ thông tin đầu và không sửa lại.
- Chỉ nghe từ khoá giống đề mà quên đọc ngữ cảnh.
- Nhầm đối tượng: thông tin nói về nhóm khác (*the morning group*) chứ không phải nhóm trong câu hỏi.
- Bỏ qua từ chỉ mức độ (*only, mostly, at least*).

### Mẹo thời gian
Dùng signpost như cột mốc: khi nghe *Moving on to…*, kết thúc câu hiện tại và nhìn sang câu kế.

### Tự luyện ngoài app
- Khi nghe audio, đánh dấu mỗi lần người nói sửa lời, rồi ghi lại cách họ báo hiệu.
- Tự viết 5 đoạn hội thoại ngắn có bẫy sửa thông tin, nhờ người khác đọc, và làm lại như đề thi.
- Sau mỗi đề, ghi riêng các câu sai do "nghe đúng nhưng chọn sai phiên bản" để biết mình hay dính bẫy nào.
'''


