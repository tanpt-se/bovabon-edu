module = "il-section3-discussion"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "**Transcript**\nMaria: I think the field trips were the most valuable part of the course.\nJack: I suppose so, but they took up a huge amount of time we could have spent on our dissertations.\n\nThái độ của Jack về các chuyến thực địa là gì?"
options = ["Đồng ý một phần nhưng có e ngại", "Hoàn toàn đồng ý", "Hoàn toàn phản đối", "Không có ý kiến"]
answer = [0]
explanation = "*I suppose so* = thừa nhận ở mức độ nào đó, *but they took up a huge amount of time* = có e ngại. Dạng câu hỏi thái độ trong Phần 3 hay dùng cấu trúc *I suppose / I see what you mean, but…*."

[[questions]]
id = "il-050"
module = "il-section3-discussion"
type = "fill"
difficulty = 2
tags = ["band:6.5"]
prompt = "**Matching** — Hai sinh viên nhận xét gì về mỗi nguồn tài liệu?\nA. rất hữu ích  B. lỗi thời  C. quá chuyên sâu\n\n**Transcript**\nAna: The Harris book was published in 1985, so most of the figures are out of date.\nTom: Whereas the government website gave us exactly the data we needed.\nAna: And that journal article — I couldn't follow half of it, it's written for specialists.\n\nHarris book = {{blank}}; Government website = {{blank}}; Journal article = {{blank}}"
blanks = [["b"], ["a"], ["c"]]
explanation = "Harris book: *out of date* → **B**. Government website: *exactly the data we needed* → **A**. Journal article: *written for specialists* → **C**. Matching luôn dùng paraphrase, không lặp nguyên từ trong phương án."

[[questions]]
id = "il-051"
module = "il-section3-discussion"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "**Transcript**\nTom: We assumed older people would use the app the least.\nAna: Yes, but in fact it was the 18-to-25 group who used it least. The over-60s were the second most active group.\n\nĐiều gì khiến hai sinh viên bất ngờ về kết quả?"
options = ["Nhóm 18–25 tuổi dùng ứng dụng ít nhất", "Người trên 60 tuổi dùng ít nhất", "Người trên 60 tuổi dùng nhiều nhất", "Mọi nhóm tuổi dùng như nhau"]
answer = [0]
explanation = "*We assumed…* là giả định ban đầu (bẫy). *but in fact it was the 18-to-25 group who used it least* là kết quả thực tế. Người trên 60 tuổi đứng **thứ hai**, không phải nhiều nhất."

[[questions]]
id = "il-052"
module = "il-section3-discussion"
type = "single"
difficulty = 3
tags = ["band:7"]
prompt = "**Transcript**\nTutor: It's not that your conclusion is wrong as such. It's more that it goes rather further than your data can really support. With twenty participants, you can suggest a pattern, but not claim a general rule.\n\nGiảng viên phê bình chủ yếu điều gì?"
options = ["Kết luận khẳng định mạnh hơn mức dữ liệu cho phép", "Kết luận sai hoàn toàn", "Số liệu bị tính sai", "Bài thiếu tài liệu tham khảo"]
answer = [0]
explanation = "*It's not that … wrong* loại phương án \"sai hoàn toàn\". Ý chính: *goes further than your data can support* → kết luận vượt quá bằng chứng. Band 7 đòi hỏi phân biệt phê bình mức độ (overstate) với phê bình đúng/sai."

[[questions]]
id = "il-053"
module = "il-section3-discussion"
type = "multiple"
difficulty = 3
tags = ["band:7"]
prompt = "**Transcript**\nAna: Why did we drop the original idea of studying local cafés?\nTom: Well, the owners we contacted weren't keen on being observed. And honestly, it would have meant a lot of travel.\nAna: Mm, though I wouldn't say travel was the deciding factor. The real issue was that our tutor felt the topic was too narrow for a dissertation.\nTom: True. Money was never a problem, though.\n\nChọn **HAI** lý do được cả hai đồng ý là khiến họ đổi đề tài."
options = ["Chủ quán không muốn bị quan sát", "Giảng viên cho rằng đề tài quá hẹp", "Phải di chuyển nhiều", "Thiếu kinh phí"]
answer = [0, 1]
explanation = "Tom nêu *owners weren't keen* (Ana không phản bác). Ana nêu *tutor felt the topic was too narrow* và Tom xác nhận *True*. Việc di chuyển bị Ana hạ mức (*wouldn't say travel was the deciding factor*), tiền thì *never a problem*."

[[questions]]
id = "il-054"
module = "il-section3-discussion"
type = "single"
difficulty = 3
tags = ["band:7"]
prompt = "**Transcript**\nJack: I'd rather present the findings as a poster.\nMaria: A video might be more engaging, actually.\nJack: Maybe, but editing would take ages. What if we did slides with a short clip embedded?\nMaria: That sounds like a reasonable compromise. Let's do that.\n\nNhóm quyết định trình bày theo hình thức nào?"
options = ["Slide có chèn một đoạn video ngắn", "Poster", "Video hoàn chỉnh", "Báo cáo viết"]
answer = [0]
explanation = "Poster (Jack) và video (Maria) đều chỉ là đề xuất ban đầu. Quyết định cuối là phương án dung hoà: *slides with a short clip embedded* → *That sounds like a reasonable compromise. Let's do that*."

[[questions]]
id = "il-055"
module = "il-section3-discussion"
type = "fill"
difficulty = 3
tags = ["band:7"]
prompt = "**Matching** — Ai đưa ra ý kiến nào? Ghi **A** (Anna), **B** (Ben) hoặc **C** (cả hai).\n\n**Transcript**\nAnna: I found the group work frustrating — some people did almost nothing.\nBen: Same here. Although I'd say the lectures were the weakest part; they were far too fast.\nAnna: Really? I thought the pace was fine. But I agree the reading list was far too long.\nBen: Mm, I didn't mind it, actually.\n\nLàm nhóm gây bực bội = {{blank}}; Bài giảng quá nhanh = {{blank}}; Danh sách đọc quá dài = {{blank}}"
blanks = [["c"], ["b"], ["a"]]
explanation = "Làm nhóm: Anna nêu, Ben *Same here* → **C**. Bài giảng nhanh: chỉ Ben (Anna *thought the pace was fine*) → **B**. Danh sách đọc: Anna nói quá dài, Ben *didn't mind it* → **A**. Từ *agree* của Anna ở câu cuối là đồng ý về ý của chính cô, không phải với Ben."

[[questions]]
id = "il-056"
module = "il-section4-lecture"
type = "fill"
difficulty = 1
tags = ["band:5.5"]
prompt = "**Transcript (bài giảng)**\nLecturer: Bees are responsible for pollinating roughly one third of the crops that we eat, which is why their decline is such a concern.\n\nNotes: Bees pollinate about one {{blank}} of food crops. (ONE WORD)"
blanks = [["third"]]
explanation = "Căn cứ: *roughly one third of the crops*. *roughly* ≈ *about* trong note. Chú ý chính tả **third**."

[[questions]]
