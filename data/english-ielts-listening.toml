type = "fill"
difficulty = 1
tags = ["band:5.5"]
prompt = "**Transcript (bài giảng)**\nLecturer: The earliest pots found at the site were made of clay, which was plentiful along the river and easy to shape by hand.\n\nNotes: Material of earliest pots: {{blank}} (ONE WORD)"
blanks = [["clay"]]
explanation = "Căn cứ: *made of clay*. Phần sau (*plentiful … easy to shape*) là lý do, không phải đáp án."

[[questions]]
id = "il-059"
module = "il-section4-lecture"
type = "fill"
difficulty = 2
tags = ["band:6.5"]
prompt = "**Transcript (bài giảng)**\nLecturer: The process, known as desalination, removes salt from seawater so that it can be used for drinking or farming.\n\nNotes: Process that removes salt from seawater: {{blank}} (ONE WORD)"
blanks = [["desalination"]]
explanation = "Căn cứ: *known as desalination*. Từ học thuật dài cần viết đúng chính tả: d-e-s-a-l-i-n-a-t-i-o-n."

[[questions]]
id = "il-060"
module = "il-section4-lecture"
type = "fill"
difficulty = 2
tags = ["band:6.5"]
prompt = "**Transcript (bài giảng)**\nLecturer: The technology is reliable and the water quality is excellent. The main drawback, however, is the amount of energy it consumes.\n\nNotes: Main disadvantage: high {{blank}} consumption (ONE WORD)"
blanks = [["energy"]]
explanation = "*drawback* = *disadvantage*; *the amount of energy it consumes* = *energy consumption*. Đáp án **energy**. Hai ưu điểm trước *however* không phải đáp án."

[[questions]]
id = "il-061"
module = "il-section4-lecture"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "Giảng viên nói: *There has been a significant decline in the number of native bird species.* Câu nào trong đề là paraphrase đúng?"
options = ["The number of native bird species has fallen considerably.", "The number of native bird species has slightly increased.", "Native bird species have remained stable.", "Native bird species have disappeared completely."]
answer = [0]
explanation = "*significant decline* = *fallen considerably*. *disappeared completely* quá mạnh so với *decline*; hai phương án còn lại sai hướng."

[[questions]]
id = "il-062"
module = "il-section4-lecture"
type = "fill"
difficulty = 2
tags = ["band:6.5"]
prompt = "**Transcript (bài giảng)**\nLecturer: The technique was first brought to Britain by the Romans in the second century, although it only became widespread much later.\n\nNotes: Introduced by the {{blank}} in the {{blank}} century"
blanks = [["romans", "the romans"], ["second", "2nd"]]
explanation = "Căn cứ: *by the Romans in the second century*. Thế kỷ có thể viết *second* hoặc *2nd*. Mệnh đề *only became widespread much later* là thông tin phụ."

[[questions]]
id = "il-063"
module = "il-section4-lecture"
type = "fill"
difficulty = 2
tags = ["band:6.5"]
prompt = "**Transcript (bài giảng)**\nLecturer: The study was large by any standard — the final dataset included just over four and a half thousand participants from twelve countries.\n\nNotes: Number of participants: just over {{blank}}"
blanks = [["4500", "4,500", "four thousand five hundred"]]
explanation = "*four and a half thousand* = **4,500**. *twelve countries* là số khác (bẫy số). Hãy luyện đổi nhanh các cách nói số lớn như *half a million*, *a quarter of a million*."

[[questions]]
id = "il-064"
module = "il-section4-lecture"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "Trong bài giảng, câu *To illustrate this, let's consider the case of a small fishing town in Norway* có chức năng gì?"
options = ["Đưa ví dụ minh hoạ cho ý vừa nêu", "Chuyển sang chủ đề hoàn toàn mới", "Tóm tắt bài giảng", "Đưa ra ý kiến trái chiều"]
answer = [0]
explanation = "*To illustrate this* báo hiệu ví dụ cho luận điểm trước. Trong Phần 4, phần ví dụ thường chứa đáp án note completion (tên địa điểm, số liệu)."

[[questions]]
id = "il-065"
module = "il-section4-lecture"
type = "fill"
difficulty = 3
tags = ["band:7"]
prompt = "**Transcript (bài giảng)**\nLecturer: You might expect them to have smoked the fish, as other coastal communities did. But wood was scarce on the island, so instead the settlers depended almost entirely on salt.\n\nNotes: Early settlers relied on {{blank}} to preserve fish. (ONE WORD)"
blanks = [["salt"]]
explanation = "*smoked* là bẫy: được nhắc nhưng bị loại (*But wood was scarce*). *depended almost entirely on* = *relied on* → **salt**. Band 7 cần nhận ra paraphrase và loại phương án bị phủ định."

[[questions]]
id = "il-066"
module = "il-section4-lecture"
type = "fill"
difficulty = 3
tags = ["band:7"]
prompt = "**Transcript (bài giảng)**\nLecturer: The theory attracted a great deal of attention at first. Critics, however, pointed out that there simply wasn't enough evidence to back it up, and by the 1950s it had largely been abandoned.\n\nNotes: Theory rejected because of a lack of {{blank}} (ONE WORD)"
blanks = [["evidence"]]
explanation = "*wasn't enough evidence* = *lack of evidence*; *largely been abandoned* = *rejected*. Đáp án **evidence**. *attention* là từ xuất hiện trước nhưng không đúng nghĩa."

[[questions]]
id = "il-067"
module = "il-section4-lecture"
type = "single"
difficulty = 3
tags = ["band:7"]
prompt = "**Transcript (bài giảng)**\nLecturer: Many textbooks still attribute the collapse to drought. While drought certainly played a part, I'd argue the evidence points far more strongly towards over-farming of the land.\n\nQuan điểm của giảng viên là gì?"
options = ["Canh tác quá mức là nguyên nhân chính, hạn hán chỉ góp phần", "Hạn hán là nguyên nhân chính", "Hạn hán không liên quan gì", "Chưa thể xác định nguyên nhân"]
answer = [0]
explanation = "*Many textbooks…* là quan điểm của người khác. *While drought certainly played a part* → hạn hán có góp phần (loại \"không liên quan\"). *I'd argue … far more strongly towards over-farming* → quan điểm riêng của giảng viên."

[[questions]]
id = "il-068"
module = "il-section4-lecture"
type = "fill"
difficulty = 3
tags = ["band:7"]
prompt = "**Transcript (bài giảng)**\nLecturer: It's often assumed that the bridge failed because of flooding. In reality, the floods merely exposed the problem; what actually brought it down was corrosion of the steel cables, which had gone unnoticed for years.\n\nNotes: Real cause of bridge failure: {{blank}} of the steel cables (ONE WORD)"
blanks = [["corrosion"]]
explanation = "*flooding* là giả định phổ biến (bẫy), *merely exposed the problem*. *what actually brought it down was corrosion* → **corrosion**. Signal *In reality / what actually…* báo hiệu đáp án thật."

[[questions]]
id = "il-069"
module = "il-distractors-signposting"
type = "fill"
difficulty = 1
tags = ["band:5.5"]
prompt = "**Transcript**\nReceptionist: You're in room two-one-four. Oh, sorry — I've read that wrong. It's two-four-one.\n\nSố phòng: {{blank}}"
blanks = [["241"]]
explanation = "Bẫy sửa thông tin: 214 bị đính chính bằng *Oh, sorry — I've read that wrong*. Đáp án là con số sau cùng: **241**."

[[questions]]
id = "il-070"
module = "il-distractors-signposting"
type = "single"
difficulty = 1
tags = ["band:5.5"]
prompt = "Khi người nói dùng *Moving on to…*, điều đó thường báo hiệu gì?"
options = ["Chuyển sang nội dung/phần tiếp theo", "Sửa lại thông tin vừa nói", "Đưa ra ví dụ", "Kết thúc bài nói"]
answer = [0]
explanation = "*Moving on to…* là signpost chuyển ý. Khi nghe, hãy chuyển mắt sang nhóm câu hỏi tiếp theo trên đề."

[[questions]]
id = "il-071"
module = "il-distractors-signposting"
type = "fill"
difficulty = 1
tags = ["band:5.5"]
prompt = "**Transcript**\nAmy: Shall we meet on Tuesday?\nBen: Oh, wait, I've got a lecture all day Tuesday. How about Thursday?\nAmy: Thursday's fine.\n\nNgày gặp: {{blank}}"
blanks = [["thursday"]]
explanation = "*Tuesday* bị loại (*I've got a lecture*). Ngày được cả hai đồng ý: **Thursday**."

[[questions]]
id = "il-072"
module = "il-distractors-signposting"
type = "fill"
difficulty = 2
tags = ["band:6.5"]
prompt = "**Transcript**\nAgent: A standard ticket is twenty-five pounds, but as you're a student you get five pounds off.\nCaller: Great, I'll take one.\n\nGiá vé người gọi phải trả: £{{blank}}"
blanks = [["20", "20.00", "twenty"]]
explanation = "Không có con số 20 được nói trực tiếp: 25 − 5 = **20**. Đề IELTS đôi khi yêu cầu suy ra từ giảm giá hoặc thay đổi số lượng."

[[questions]]
id = "il-073"
module = "il-distractors-signposting"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "Signpost nào báo hiệu người nói sắp **tổng kết** bài nói?"
options = ["To sum up,…", "Another point worth mentioning is…", "For instance,…", "Let me start by…"]
answer = [0]
explanation = "*To sum up* = tóm lại. *Another point…* thêm ý, *For instance* đưa ví dụ, *Let me start by…* mở đầu."

[[questions]]
id = "il-074"
module = "il-distractors-signposting"
type = "fill"
difficulty = 2
tags = ["band:6.5"]
prompt = "**Transcript**\nOfficer: And your surname?\nCaller: Smith — S, M, I… no, sorry, it's with a Y. S, M, Y, T, H.\n\nHọ của người gọi: {{blank}}"
blanks = [["smyth"]]
explanation = "Người gọi tự sửa giữa lúc đánh vần: *no, sorry, it's with a Y* → **Smyth**. Đừng viết *Smith* chỉ vì nghe được từ đó đầu tiên."

[[questions]]
id = "il-075"
module = "il-distractors-signposting"
type = "multiple"
difficulty = 2
tags = ["band:6.5"]
prompt = "Chọn **mọi** cụm từ thường báo hiệu người nói đang **sửa lại** thông tin."
options = ["Actually, …", "Sorry, I mean…", "…or rather…", "For example, …"]
answer = [0, 1, 2]
explanation = "*Actually*, *Sorry, I mean* và *or rather* đều dùng để đính chính. *For example* chỉ đưa ví dụ."

[[questions]]
id = "il-076"
module = "il-distractors-signposting"
type = "fill"
difficulty = 2
tags = ["band:6.5"]
prompt = "**Transcript**\nGuide: The tour was originally going to start at nine, but because of the roadworks we're now starting half an hour later.\n\nGiờ bắt đầu tour: {{blank}}"
blanks = [["9.30", "9:30", "9.30am", "9:30am", "9.30 am", "9:30 am", "half past nine"]]
explanation = "*originally … at nine* là thông tin cũ. *half an hour later* → **9.30**. Gặp *originally / was going to*, hãy chờ thông tin mới."

[[questions]]
id = "il-077"
module = "il-distractors-signposting"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "**Transcript**\nLucy: We thought about taking the bus, but it takes ages. The train's quicker, but it's really expensive at that time of day. So in the end we've decided to cycle — it's only six miles.\n\nHọ sẽ đi bằng phương tiện gì?"
options = ["Xe đạp", "Xe buýt", "Tàu hoả", "Ô tô"]
answer = [0]
explanation = "Xe buýt và tàu hoả đều được nhắc rồi bị loại (*takes ages*, *really expensive*). *in the end we've decided to cycle* → **xe đạp**. Cụm *in the end / so we've decided* báo hiệu kết luận."

[[questions]]
id = "il-078"
module = "il-distractors-signposting"
type = "fill"
difficulty = 2
tags = ["band:6.5"]
prompt = "**Transcript**\nOrganiser: We were expecting twelve people on the course, but three have dropped out, and then someone new signed up this morning.\n\nSố người tham gia hiện tại: {{blank}}"
blanks = [["10", "ten"]]
explanation = "12 − 3 + 1 = **10**. *twelve* là con số được nhắc rõ nhất nhưng đã thay đổi hai lần."

[[questions]]
id = "il-079"
module = "il-distractors-signposting"
type = "single"
difficulty = 3
tags = ["band:7"]
prompt = "**Transcript**\nLecturer: The new system has reduced waiting times dramatically. That said, patient satisfaction hasn't improved as much as expected.\n\n*That said* có chức năng gì và câu hỏi về \"sự hài lòng của bệnh nhân\" nên chọn ý nào?"
options = ["Báo hiệu ý tương phản; sự hài lòng tăng ít hơn kỳ vọng", "Báo hiệu ví dụ; sự hài lòng tăng mạnh", "Báo hiệu kết luận; sự hài lòng giảm mạnh", "Báo hiệu bổ sung; sự hài lòng tăng như kỳ vọng"]
answer = [0]
explanation = "*That said* = *however*, mở ra ý tương phản với câu trước. *hasn't improved as much as expected* → có cải thiện nhưng ít hơn kỳ vọng, không phải giảm."

[[questions]]
id = "il-080"
module = "il-distractors-signposting"
type = "fill"
difficulty = 3
tags = ["band:7"]
prompt = "**Transcript**\nCoordinator: The deadline was the fifteenth, then it was pushed back to the twenty-second because of the holiday. But the department has now decided to go back to the original date after all.\n\nHạn nộp (ghi ngày trong tháng, ví dụ: 3rd): {{blank}}"
blanks = [["15th", "15", "the 15th", "fifteenth", "the fifteenth"]]
explanation = "Có hai lần đổi: 15 → 22 → quay lại *the original date* = **15th**. Bẫy là chọn con số được nói gần nhất (22nd)."

[[questions]]
id = "il-081"
module = "il-distractors-signposting"
type = "single"
difficulty = 3
tags = ["band:7"]
prompt = "**Transcript**\nLecturer: There are three main factors: cost, safety and public opinion. I'll come back to public opinion at the end, as it's the most complex. So, first, let's look at safety, since it's closely linked to cost.\n\nGiảng viên sẽ nói về yếu tố nào **ngay tiếp theo**?"
options = ["Safety", "Cost", "Public opinion", "Cả ba cùng lúc"]
answer = [0]
explanation = "Thứ tự liệt kê (cost, safety, public opinion) không phải thứ tự trình bày. *I'll come back to public opinion at the end* và *first, let's look at safety* → **safety** trước. Signpost giúp dự đoán câu hỏi nào sắp được trả lời."

[[questions]]
id = "il-082"
module = "il-distractors-signposting"
type = "multiple"
difficulty = 3
tags = ["band:7"]
prompt = "**Transcript**\nClerk: So that's a double room for three nights from the 4th.\nGuest: Actually, could we make it a twin room? And it'll be four nights, not three.\nClerk: Of course. Still from the 4th?\nGuest: Yes. Oh, and breakfast — we'd like it after all.\n\nChọn **mọi** thông tin đúng về đặt phòng cuối cùng."
options = ["Phòng twin", "4 đêm", "Nhận phòng ngày 4", "Không có bữa sáng"]
answer = [0, 1, 2]
explanation = "Khách sửa *double* → **twin** và *three nights* → **four nights**; ngày *from the 4th* được giữ nguyên. *we'd like it after all* → có bữa sáng, nên \"không có bữa sáng\" sai."
