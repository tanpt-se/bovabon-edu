type = "single"
difficulty = 1
tags = ["band:5.5"]
prompt = "**Transcript (bài giảng)**\nLecturer: In today's session I'll be looking at the history of urban gardens, focusing in particular on how they were used during times of food shortage.\n\nTrọng tâm chính của bài giảng là gì?"
options = ["Vai trò của vườn đô thị khi thiếu lương thực", "Cách thiết kế một khu vườn", "Các loại cây trồng phổ biến", "Chi phí xây vườn đô thị"]
answer = [0]
explanation = "Câu mở đầu Phần 4 thường nêu chủ đề: *focusing in particular on how they were used during times of food shortage*. Đó là trọng tâm bài giảng."

[[questions]]
id = "il-058"
