prompt = "**Transcript**\nMaria: The main problem with our survey was that hardly anyone replied — we got about fifteen responses.\nJack: And some of the questions were confusing. People didn't know what 'regularly' meant.\nMaria: At least it didn't cost us anything to run online.\n\nChọn **HAI** vấn đề mà hai sinh viên gặp với khảo sát."
options = ["Tỉ lệ phản hồi thấp", "Một số câu hỏi không rõ nghĩa", "Chi phí thực hiện cao", "Khảo sát quá dài"]
answer = [0, 1]
explanation = "*hardly anyone replied* → tỉ lệ phản hồi thấp; *some of the questions were confusing* → câu hỏi không rõ. Chi phí được nhắc nhưng theo hướng ngược lại (*didn't cost us anything*), còn độ dài không được nhắc."

[[questions]]
id = "il-047"
module = "il-section3-discussion"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "**Transcript**\nTutor: Your literature review is very thorough, and the introduction reads well. If I had to pick one area, though, it's the methodology — you haven't explained why you chose such a small sample.\n\nTheo giảng viên, phần nào cần cải thiện nhất?"
options = ["Phương pháp nghiên cứu", "Tổng quan tài liệu", "Phần mở đầu", "Kết luận"]
answer = [0]
explanation = "Giảng viên khen *literature review* và *introduction* trước, rồi chuyển ý bằng *though*: *it's the methodology*. Từ *though / but / however* thường báo hiệu thông tin đáp án."

[[questions]]
id = "il-048"
module = "il-section3-discussion"
type = "fill"
difficulty = 2
tags = ["band:6.5"]
prompt = "**Transcript**\nJack: Shall we meet in the library café?\nMaria: It's always packed at lunchtime. Let's book a seminar room on the second floor instead — they're free for students.\nJack: Good idea.\n\nĐịa điểm gặp nhóm (NO MORE THAN TWO WORDS): {{blank}}"
blanks = [["seminar room"]]
explanation = "*library café* bị bác (*always packed*). Câu chốt: *book a seminar room … instead* → **seminar room**. Viết *a seminar room* là 3 từ, vượt giới hạn TWO WORDS."

[[questions]]
