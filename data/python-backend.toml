[[questions]]
id = "py-044"
module = "py-async"
type = "essay"
difficulty = 3
prompt = "Khi nào nên khai báo endpoint FastAPI là `async def` và khi nào là `def`?"
keywords = [
  ["await", "thư viện async", "httpx", "asyncpg", "async driver"],
  ["blocking", "chặn", "đồng bộ", "requests", "time.sleep"],
  ["threadpool", "thread"],
  ["event loop"],
]
min_keywords = 3
model_answer = '''
- Dùng **`async def`** khi bên trong chỉ gọi thư viện **hỗ trợ async** và `await` chúng (httpx.AsyncClient, asyncpg, motor…). Các request chia sẻ **event loop** nên phục vụ được rất nhiều kết nối I/O.
- Dùng **`def`** khi phải gọi thư viện **blocking/đồng bộ** (requests, driver DB đồng bộ, SDK cũ): FastAPI tự chạy hàm `def` trong **threadpool** để không chặn event loop.
- Tuyệt đối không gọi code blocking trong `async def`. Code nặng CPU nên đưa sang process/worker riêng.
'''
explanation = "Nếu không chắc, dùng `def` an toàn hơn."
sources = ["fastapi/async/index"]

