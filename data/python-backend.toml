[[questions]]
id = "python-backend-dvc02"
module = "python-backend-dv-fastapi-deps"
type = "code"
difficulty = 3
tags = ["level:senior"]
lang = "python"
title = "Override registry có phạm vi"
prompt = '''Viết context manager override_scope(registry, replacements). Khi vào with, cập nhật registry bằng replacements. Khi thoát, luôn khôi phục giá trị ban đầu của các khóa đã có và xóa các khóa mới được thêm, kể cả khi khối with phát sinh exception. Hỗ trợ phạm vi lồng nhau. Chỉ dùng thư viện chuẩn.'''
starter = '''from contextlib import contextmanager

@contextmanager
def override_scope(registry, replacements):
    yield registry
'''
solution = '''from contextlib import contextmanager

@contextmanager
def override_scope(registry, replacements):
    missing = object()
    previous = {key: registry.get(key, missing) for key in replacements}
    registry.update(replacements)
    try:
        yield registry
    finally:
        for key, value in previous.items():
            if value is missing:
                registry.pop(key, None)
            else:
                registry[key] = value
'''
tests = '''
registry = {"db": "real", "cache": None}

@test("override chỉ có hiệu lực bên trong with")
def _():
    with override_scope(registry, {"db": "fake"}):
        expect(registry["db"]).to_be("fake")
    expect(registry["db"]).to_be("real")

@test("khóa mới được dọn sau khi thoát")
def _():
    with override_scope(registry, {"auth": "test-user"}):
        expect(registry["auth"]).to_be("test-user")
    expect("auth" in registry).to_be_false()

@test("khôi phục cả khi có exception")
def _():
    try:
        with override_scope(registry, {"db": "broken", "new": 1}):
            raise RuntimeError("failed request")
    except RuntimeError:
        pass
    expect(registry).to_equal({"db": "real", "cache": None})

@test("phạm vi lồng nhau khôi phục về override bên ngoài")
def _():
    with override_scope(registry, {"db": "outer"}):
        with override_scope(registry, {"db": "inner"}):
            expect(registry["db"]).to_be("inner")
        expect(registry["db"]).to_be("outer")
    expect(registry["db"]).to_be("real")

@test("giữ nguyên giá trị None")
def _():
    with override_scope(registry, {"cache": "fake"}):
        expect(registry["cache"]).to_be("fake")
    expect(registry["cache"]).to_be_none()
'''
hints = ["Lưu lại giá trị cũ của từng khóa; dùng sentinel riêng để phân biệt khóa vắng với giá trị None.", "Khôi phục trong finally để xử lý cả khi khối with thất bại."]
explanation = "Test override là trạng thái tạm thời của app; context manager giúp đảm bảo registry được dọn kể cả khi request hoặc assertion ném lỗi."
sources = ["fastapi/advanced/testing-dependencies/index"]

[[modules]]
id = "python-backend-dv-sqlite"
title = "SQLite: truy vấn an toàn & giao dịch"
description = "Bind tham số, quản lý connection và bảo đảm cập nhật dữ liệu nguyên tử."
sources = ["python~3.14/library/sqlite3#how-to-guides", "python~3.14/library/sqlite3#sqlite3.Connection.execute", "python~3.14/library/sqlite3#sqlite3.Connection.commit", "python~3.14/library/sqlite3#sqlite3.Connection.rollback", "python~3.14/library/sqlite3#sqlite3.Connection.in_transaction"]
lesson = '''
### Dùng SQLite an toàn trong ứng dụng Python

sqlite3 là thư viện chuẩn để lưu trữ dữ liệu quan hệ trong một file hoặc database tạm trong bộ nhớ. Một Connection giữ kết nối và ranh giới giao dịch; execute() chạy câu SQL, còn Cursor cho phép đọc kết quả. Với web app, thường tạo connection theo phạm vi request và đóng nó khi request kết thúc, thay vì chia sẻ một cursor toàn cục.

| Nhu cầu | Cách làm | Tránh |
|---|---|---|
| Đưa giá trị vào SQL | Placeholder ? và tuple tham số | Nối chuỗi từ input |
| Nhiều thay đổi cùng logic | Một transaction | Commit sau từng câu liên quan |
| Hoàn tất thành công | commit hoặc context manager | Bỏ thay đổi chưa commit |
| Có lỗi giữa chừng | rollback transaction | Để dữ liệu ở trạng thái nửa cập nhật |

Ví dụ truy vấn có tham số:

~~~python
row = connection.execute(
    "SELECT id, email FROM users WHERE email = ?",
    (email,),
).fetchone()
~~~

Placeholder chỉ dành cho **giá trị**, không thay tên bảng hay tên cột. Nếu cần chọn cột, hãy dùng danh sách cho phép cố định thay vì đưa chuỗi tùy ý vào SQL. Không dùng f-string để ghép input vào câu truy vấn vì có thể tạo SQL injection.

Transaction giúp nhiều câu lệnh cùng thành công hoặc cùng bị hủy. Chuyển tiền là ví dụ: trừ tài khoản nguồn rồi cộng tài khoản đích; nếu tài khoản đích không tồn tại, thay đổi trừ tiền phải rollback. Với connection context manager, lỗi trong khối khiến giao dịch rollback và thoát bình thường thì commit khi transaction đang mở; context manager không tự đóng connection. Chọn rõ autocommit/transaction mode trong cấu hình connection để tránh phụ thuộc vào mặc định legacy.

SQLite có kiểu lưu trữ linh hoạt hơn nhiều database server, nên ứng dụng nên kiểm tra dữ liệu đầu vào và dùng integer cho tiền theo đơn vị nhỏ nhất thay vì float. Bật foreign key enforcement cho từng connection nếu schema dựa vào khóa ngoại. Lỗi thường gặp là quên commit, gọi commit quá sớm làm một thao tác nhiều bước không còn nguyên tử, dùng một connection đồng thời không đúng cách, và nuốt sqlite3.Error khiến không biết giao dịch thất bại.
'''

