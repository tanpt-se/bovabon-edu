[[questions]]
id = "python-backend-lvc01"
module = "py-fastapi"
type = "code"
difficulty = 1
tags = ["level:junior", "pagination"]
lang = "python"
title = "Phân trang danh sách"
prompt = '''Viết paginate(items, page, size) cho endpoint danh sách. page bắt đầu từ 1.

Trả về dict {"items": <phần tử của trang>, "page": page, "total_pages": <số trang>}.
- total_pages = số trang cần để chứa hết items (danh sách rỗng → 0).
- page lớn hơn total_pages → items là danh sách rỗng.
- page < 1 hoặc size < 1 → ném ValueError.'''
starter = '''def paginate(items, page, size):
    return {"items": items, "page": page, "total_pages": 1}
'''
solution = '''def paginate(items, page, size):
    if page < 1 or size < 1:
        raise ValueError("page và size phải >= 1")
    start = (page - 1) * size
    return {
        "items": items[start:start + size],
        "page": page,
        "total_pages": (len(items) + size - 1) // size,
    }
'''
tests = '''
@test("trang đầu")
def _():
    expect(paginate(list(range(10)), 1, 3)).to_equal({"items": [0, 1, 2], "page": 1, "total_pages": 4})

@test("trang cuối thiếu phần tử")
def _():
    expect(paginate(list(range(10)), 4, 3)).to_equal({"items": [9], "page": 4, "total_pages": 4})

@test("trang vượt quá")
def _():
    expect(paginate([1, 2], 5, 2)["items"]).to_equal([])

@test("danh sách rỗng")
def _():
    expect(paginate([], 1, 10)).to_equal({"items": [], "page": 1, "total_pages": 0})

@test("tham số không hợp lệ")
def _():
    expect(lambda: paginate([1], 0, 10)).to_raise(ValueError)
    expect(lambda: paginate([1], 1, 0)).to_raise(ValueError)
'''
hints = ["Vị trí bắt đầu là (page - 1) * size; slicing ngoài phạm vi trả list rỗng.", "Làm tròn lên phép chia: (n + size - 1) // size."]
explanation = "Slicing của Python không lỗi khi vượt phạm vi nên trang vượt quá tự trả rỗng; validate page/size ở biên để endpoint trả 422/400 thay vì kết quả lạ."
sources = ["fastapi/tutorial/query-params/index"]
