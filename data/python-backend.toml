module = "py-async"
type = "code"
lang = "python"
difficulty = 3
title = "gather có giới hạn đồng thời"
prompt = '''
Viết `async def gather_limited(funcs, limit)`:
- `funcs`: list các hàm **không tham số trả về coroutine** (vd. `lambda: fetch(i)`)
- Chạy đồng thời nhưng **tối đa `limit`** coroutine cùng lúc (dùng `asyncio.Semaphore`)
- Trả về list kết quả **đúng thứ tự** đầu vào
- Nếu có lỗi → ném lỗi đó ra (giống `asyncio.gather` mặc định)
'''
starter = '''
import asyncio


async def gather_limited(funcs, limit):
    return [await f() for f in funcs]
'''
solution = '''
import asyncio


async def gather_limited(funcs, limit):
    sem = asyncio.Semaphore(max(1, limit))

    async def run(f):
        async with sem:
            return await f()

    return await asyncio.gather(*(run(f) for f in funcs))
'''
tests = '''
import asyncio
import time

def make_tracker():
    state = {"cur": 0, "peak": 0}
    def job(i, delay=0.02):
        async def _():
            state["cur"] += 1
            state["peak"] = max(state["peak"], state["cur"])
            await asyncio.sleep(delay)
            state["cur"] -= 1
            return i * 10
        return _
    return state, job

@test("kết quả đúng thứ tự")
async def _():
    state, job = make_tracker()
    res = await gather_limited([job(i, 0.03 - i * 0.005) for i in range(5)], 5)
    expect(res).to_equal([0, 10, 20, 30, 40])

@test("không vượt quá limit")
async def _():
    state, job = make_tracker()
    await gather_limited([job(i) for i in range(10)], 3)
    expect(state["peak"]).to_be(3)

@test("chạy đồng thời thật (nhanh hơn tuần tự)")
async def _():
    state, job = make_tracker()
    t = time.perf_counter()
    await gather_limited([job(i, 0.05) for i in range(6)], 6)
    expect(time.perf_counter() - t < 0.2).to_be_true()

@test("lỗi được ném ra")
async def _():
    async def boom():
        raise ValueError("boom")
    try:
        await gather_limited([boom], 2)
    except ValueError as e:
        expect(str(e)).to_be("boom")
        return
    raise AssertionError("phải ném ValueError")
'''
