[[questions]]
id = "python-backend-dvc03"
module = "python-backend-dv-sqlite"
type = "code"
difficulty = 3
tags = ["level:senior"]
lang = "python"
title = "Chuyển tiền nguyên tử"
prompt = '''Viết transfer(connection, source_id, target_id, amount) cho bảng accounts(id INTEGER PRIMARY KEY, balance INTEGER NOT NULL). amount là số cent nguyên dương và hai id phải khác nhau. Trả về True nếu chuyển thành công. Trả về False nếu amount không hợp lệ, nguồn không tồn tại hoặc không đủ tiền, hay đích không tồn tại. Nếu bất kỳ bước cập nhật nào thất bại, không được để lại thay đổi một phần. Dùng placeholder cho mọi giá trị SQL.'''
starter = '''import sqlite3

def transfer(connection, source_id, target_id, amount):
    return False
'''
solution = '''import sqlite3

class _TransferAbort(Exception):
    pass

def transfer(connection, source_id, target_id, amount):
    if type(amount) is not int or amount <= 0 or source_id == target_id:
        return False
    try:
        with connection:
            debit = connection.execute(
                "UPDATE accounts SET balance = balance - ? WHERE id = ? AND balance >= ?",
                (amount, source_id, amount),
            )
            if debit.rowcount != 1:
                raise _TransferAbort
            credit = connection.execute(
                "UPDATE accounts SET balance = balance + ? WHERE id = ?",
                (amount, target_id),
            )
            if credit.rowcount != 1:
                raise _TransferAbort
    except _TransferAbort:
        return False
    return True
'''
tests = '''
import sqlite3

def _make_accounts():
    connection = sqlite3.connect(":memory:")
    connection.execute("CREATE TABLE accounts (id INTEGER PRIMARY KEY, balance INTEGER NOT NULL)")
    connection.executemany("INSERT INTO accounts(id, balance) VALUES (?, ?)", [(1, 1000), (2, 300)])
    connection.commit()
    return connection

def _balances(connection):
    return dict(connection.execute("SELECT id, balance FROM accounts").fetchall())

@test("chuyển thành công cập nhật cả hai tài khoản")
def _():
    connection = _make_accounts()
    expect(transfer(connection, 1, 2, 250)).to_be_true()
    expect(_balances(connection)).to_equal({1: 750, 2: 550})

@test("không đủ tiền không đổi số dư")
def _():
    connection = _make_accounts()
    expect(transfer(connection, 1, 2, 5000)).to_be_false()
    expect(_balances(connection)).to_equal({1: 1000, 2: 300})

@test("đích không tồn tại rollback bước trừ")
def _():
    connection = _make_accounts()
    expect(transfer(connection, 1, 9, 100)).to_be_false()
    expect(_balances(connection)).to_equal({1: 1000, 2: 300})

@test("nguồn không tồn tại")
def _():
    connection = _make_accounts()
    expect(transfer(connection, 8, 2, 100)).to_be_false()
    expect(_balances(connection)).to_equal({1: 1000, 2: 300})

@test("amount phải là số nguyên dương")
def _():
    connection = _make_accounts()
    expect(transfer(connection, 1, 2, 0)).to_be_false()
    expect(transfer(connection, 1, 2, -1)).to_be_false()
    expect(transfer(connection, 1, 2, True)).to_be_false()
    expect(_balances(connection)).to_equal({1: 1000, 2: 300})

@test("không chuyển vào cùng tài khoản")
def _():
    connection = _make_accounts()
    expect(transfer(connection, 1, 1, 100)).to_be_false()
    expect(_balances(connection)).to_equal({1: 1000, 2: 300})
'''
hints = ["Dùng UPDATE có điều kiện balance >= amount và kiểm tra rowcount.", "Nếu cập nhật nguồn hoặc đích không đúng một dòng, ném exception bên trong with để SQLite rollback."]
explanation = "Hai UPDATE trong cùng transaction bảo đảm thao tác atomic; parameter binding giữ input tách khỏi cú pháp SQL."
sources = ["python~3.14/library/sqlite3#sqlite3.Connection.execute", "python~3.14/library/sqlite3#sqlite3.Connection.rollback"]

# ------------------------------------------------------------ LEVEL: TECH LEAD
[[modules]]
id = "python-backend-lead"
title = "Góc nhìn Tech Lead"
description = "Chọn framework & mô hình sync/async, cấu trúc dự án lớn, migration DB không downtime, scaling worker, hàng đợi tác vụ, observability, rollout an toàn, quy chuẩn review cho team Python backend."
sources = ["fastapi/deployment/concepts/index", "fastapi/deployment/server-workers/index", "fastapi/tutorial/bigger-applications/index", "fastapi/advanced/settings/index", "flask/deploying/index", "flask/patterns/celery/index"]
lesson = '''
### Vai trò của Tech Lead trong dự án Python backend
Senior trả lời "làm thế nào cho đúng"; Lead trả lời "**nên làm gì, với team này, trong ràng buộc này**". Mọi quyết định cần nêu rõ: bối cảnh (người, thời gian, tải, chi phí), các phương án, tiêu chí so sánh, rủi ro và cách lùi lại (rollback).

### Khung ra quyết định nhanh
1. **Ràng buộc trước, công nghệ sau**: team quen gì, deadline, SLO (vd. p95 < 300 ms), ngân sách hạ tầng.
2. **Liệt kê ≥ 2 phương án**, luôn có phương án "giữ nguyên + cải tiến nhỏ".
3. **Chấm theo tiêu chí** (bảng dưới), ghi rõ con số là ước lượng hay đo được.
4. **Thử nhỏ trước** (spike, canary, feature flag), đặt điểm dừng nếu chỉ số xấu đi.
5. **Ghi ADR** để người sau hiểu vì sao.

| Tiêu chí | Flask (WSGI) | FastAPI (ASGI) | Django |
|---|---|---|---|
| Đường cong học của team | thấp | trung bình (async, Pydantic) | trung bình |
| I/O đồng thời cao, WebSocket | kém (cần gevent/ASGI riêng) | tốt | trung bình (ASGI + channels) |
| Admin/CRUD nội bộ có sẵn | không | không | rất tốt |
| Hợp đồng API (OpenAPI) | thêm extension | sinh tự động | thêm DRF/ninja |
| Rủi ro lớn nhất | tự lắp ghép, thiếu chuẩn | gọi code blocking trong `async def` | ORM nặng, khó tách service |

### Số liệu tham khảo (ước lượng, phải đo lại trên hệ thống thật)
- Worker Gunicorn/Uvicorn: khởi điểm ~1 process mỗi vCPU (sync worker có thể 2×vCPU + 1), rồi chỉnh theo bộ nhớ và load test.
- Sync worker bị chặn bởi I/O: throughput ≈ số worker ÷ thời gian chờ trung bình mỗi request.
- Pool kết nối DB: tổng `pool_size × số process × số instance` phải nhỏ hơn `max_connections` của DB.

### Migration DB không downtime (expand → migrate → contract)
1. **Expand**: thêm cột/bảng mới dạng nullable, không khoá bảng lâu.
2. **Migrate**: code ghi cả cũ lẫn mới; backfill theo lô nhỏ, có thể dừng/tiếp tục.
3. **Contract**: khi mọi bản deploy đã đọc cột mới, thêm ràng buộc NOT NULL, rồi xoá cột cũ ở bản phát hành sau.
Mỗi bước phải tương thích với cả phiên bản code đang chạy song song khi rolling deploy.

### Checklist review PR backend (đưa vào template)
- [ ] Endpoint có schema vào/ra rõ ràng (`response_model`), không lộ field nhạy cảm.
- [ ] Không gọi thư viện blocking trong `async def`; gọi ra ngoài luôn có **timeout**.
- [ ] Có test cho nhánh lỗi (4xx) chứ không chỉ happy path.
- [ ] Log có cấu trúc kèm `request_id`, không log mật khẩu/token.
- [ ] Migration tương thích ngược, có kế hoạch rollback.
- [ ] Tác vụ chạy nền quan trọng đi qua hàng đợi bền, có retry và idempotency.

### ADR mẫu (rút gọn)
> **ADR-007: Tách tính năng chat realtime sang service ASGI riêng**
> *Bối cảnh*: monolith Flask 4 năm tuổi, team 5 người, cần WebSocket trong 1 quý.
> *Quyết định*: giữ Flask cho phần còn lại; viết service chat bằng FastAPI, dùng chung auth qua JWT, đứng sau cùng reverse proxy.
> *Hệ quả*: thêm 1 pipeline deploy và dashboard; tránh viết lại toàn bộ; xem lại sau 6 tháng.

### Anti-pattern ở quy mô team
- **Viết lại toàn bộ (big-bang rewrite)** chỉ vì framework mới nhanh hơn trên benchmark.
- Business logic nhét trong route handler → không test được, không tái sử dụng cho worker/CLI.
- Biến global ở module dùng làm cache/state → mỗi worker process thấy một bản khác nhau.
- Mỗi người tự đặt cách đọc cấu hình, tự chọn thư viện HTTP → onboarding chậm, lỗi khó đoán.
- Alert trên từng exception thay vì trên SLO → team "mù" vì quá nhiều cảnh báo.
- Sửa thay junior mà không giải thích, không biến bài học thành lint rule hay guideline.
'''

