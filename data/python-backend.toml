[[questions]]
id = "python-backend-dvc03"
module = "python-backend-dv-sqlite"
type = "code"
difficulty = 3
lang = "python"
title = "Chuyển tiền nguyên tử"
prompt = '''Viết transfer(connection, source_id, target_id, amount) cho bảng accounts(id INTEGER PRIMARY KEY, balance INTEGER NOT NULL). amount là số cent nguyên dương và hai id phải khác nhau. Trả về True nếu chuyển thành công. Trả về False nếu amount không hợp lệ, nguồn không tồn tại hoặc không đủ tiền, hay đích không tồn tại. Nếu bất kỳ bước cập nhật nào thất bại, không được để lại thay đổi một phần. Dùng placeholder cho mọi giá trị SQL.'''
starter = '''import sqlite3

def transfer(connection, source_id, target_id, amount):
    return False
'''
solution = '''import sqlite3

class _TransferAbort(Exception):
    pass

def transfer(connection, source_id, target_id, amount):
    if type(amount) is not int or amount <= 0 or source_id == target_id:
        return False
    try:
        with connection:
            debit = connection.execute(
                "UPDATE accounts SET balance = balance - ? WHERE id = ? AND balance >= ?",
                (amount, source_id, amount),
            )
            if debit.rowcount != 1:
                raise _TransferAbort
            credit = connection.execute(
                "UPDATE accounts SET balance = balance + ? WHERE id = ?",
                (amount, target_id),
            )
            if credit.rowcount != 1:
                raise _TransferAbort
    except _TransferAbort:
        return False
    return True
'''
tests = '''
import sqlite3

def _make_accounts():
    connection = sqlite3.connect(":memory:")
    connection.execute("CREATE TABLE accounts (id INTEGER PRIMARY KEY, balance INTEGER NOT NULL)")
    connection.executemany("INSERT INTO accounts(id, balance) VALUES (?, ?)", [(1, 1000), (2, 300)])
    connection.commit()
    return connection

def _balances(connection):
    return dict(connection.execute("SELECT id, balance FROM accounts").fetchall())

@test("chuyển thành công cập nhật cả hai tài khoản")
def _():
    connection = _make_accounts()
    expect(transfer(connection, 1, 2, 250)).to_be_true()
    expect(_balances(connection)).to_equal({1: 750, 2: 550})

@test("không đủ tiền không đổi số dư")
def _():
    connection = _make_accounts()
    expect(transfer(connection, 1, 2, 5000)).to_be_false()
    expect(_balances(connection)).to_equal({1: 1000, 2: 300})

@test("đích không tồn tại rollback bước trừ")
def _():
    connection = _make_accounts()
    expect(transfer(connection, 1, 9, 100)).to_be_false()
    expect(_balances(connection)).to_equal({1: 1000, 2: 300})

@test("nguồn không tồn tại")
def _():
    connection = _make_accounts()
    expect(transfer(connection, 8, 2, 100)).to_be_false()
    expect(_balances(connection)).to_equal({1: 1000, 2: 300})

@test("amount phải là số nguyên dương")
def _():
    connection = _make_accounts()
    expect(transfer(connection, 1, 2, 0)).to_be_false()
    expect(transfer(connection, 1, 2, -1)).to_be_false()
    expect(transfer(connection, 1, 2, True)).to_be_false()
    expect(_balances(connection)).to_equal({1: 1000, 2: 300})

@test("không chuyển vào cùng tài khoản")
def _():
    connection = _make_accounts()
    expect(transfer(connection, 1, 1, 100)).to_be_false()
    expect(_balances(connection)).to_equal({1: 1000, 2: 300})
'''
hints = ["Dùng UPDATE có điều kiện balance >= amount và kiểm tra rowcount.", "Nếu cập nhật nguồn hoặc đích không đúng một dòng, ném exception bên trong with để SQLite rollback."]
