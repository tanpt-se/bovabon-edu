prompt = "Endpoint `async def` phải tính hash perceptual cho ảnh tải lên (thuần Python, ~800 ms CPU). Cách nào không chặn event loop và thực sự dùng được nhiều core trên CPython có GIL?"
options = [
  "Gọi trực tiếp hàm trong `async def`",
  "`await asyncio.to_thread(compute, data)`",
  "`await loop.run_in_executor(process_pool, compute, data)` với `ProcessPoolExecutor` tạo sẵn (hoặc đẩy sang worker queue)",
  "Thêm `await asyncio.sleep(0)` giữa các bước tính",
]
