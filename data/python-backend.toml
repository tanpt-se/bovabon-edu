[[questions]]
id = "py-027"
module = "py-fastapi"
type = "code"
lang = "python"
difficulty = 2
title = "Validate dữ liệu kiểu Pydantic"
prompt = '''
Không dùng thư viện, viết `validate(schema, data)` trả về `(clean, errors)`:

- `schema`: dict `field -> (type, required, default)`; `type` là `int`, `float`, `str` hoặc `bool`
- Thiếu field bắt buộc → lỗi `{"loc": field, "msg": "field required"}`
- Thiếu field không bắt buộc → dùng `default`
- Ép kiểu "lax" giống Pydantic: `"42"` → `int` 42, `"3.5"` → float; `int` nhận số nguyên hoặc chuỗi số; `bool` nhận `True/False` hoặc chuỗi `"true"/"false"`; ép thất bại → `{"loc": field, "msg": "invalid <tên kiểu>"}` (vd. `invalid int`)
- Field thừa trong `data` bị bỏ qua
- Có lỗi thì `clean` là `None`; `errors` là list theo thứ tự field trong schema
'''
starter = '''
def validate(schema, data):
    # TODO
    return data, []
'''
solution = '''
def _coerce(tp, v):
    if tp is bool:
        if isinstance(v, bool):
            return v
        if isinstance(v, str) and v.lower() in ("true", "false"):
            return v.lower() == "true"
        raise ValueError
    if tp is int:
        if isinstance(v, bool):
            raise ValueError
        if isinstance(v, int):
            return v
        if isinstance(v, float) and v.is_integer():
            return int(v)
        if isinstance(v, str) and v.strip().lstrip("-").isdigit():
            return int(v)
        raise ValueError
    if tp is float:
        if isinstance(v, bool):
            raise ValueError
        return float(v)
    if tp is str:
        if isinstance(v, str):
            return v
        raise ValueError
    raise ValueError


def validate(schema, data):
    clean, errors = {}, []
    for field, (tp, required, default) in schema.items():
        if field not in data:
            if required:
                errors.append({"loc": field, "msg": "field required"})
            else:
                clean[field] = default
            continue
        try:
            clean[field] = _coerce(tp, data[field])
        except (ValueError, TypeError):
            errors.append({"loc": field, "msg": "invalid " + tp.__name__})
    return (None, errors) if errors else (clean, [])
'''
tests = '''
SCHEMA = {
    "name": (str, True, None),
    "age": (int, True, None),
    "score": (float, False, 0.0),
    "active": (bool, False, True),
}

@test("dữ liệu hợp lệ + default")
def _():
    clean, errs = validate(SCHEMA, {"name": "An", "age": 20})
    expect(errs).to_equal([])
    expect(clean).to_equal({"name": "An", "age": 20, "score": 0.0, "active": True})

@test("ép kiểu lax từ chuỗi")
def _():
    clean, errs = validate(SCHEMA, {"name": "B", "age": "42", "score": "3.5", "active": "false"})
    expect(errs).to_equal([])
    expect(clean["age"]).to_be(42)
    expect(clean["score"]).to_be(3.5)
    expect(clean["active"]).to_be(False)

@test("thiếu field bắt buộc")
def _():
    clean, errs = validate(SCHEMA, {"name": "C"})
    expect(clean).to_be_none()
    expect(errs).to_equal([{"loc": "age", "msg": "field required"}])

@test("sai kiểu")
def _():
    clean, errs = validate(SCHEMA, {"name": 5, "age": "abc"})
    expect(clean).to_be_none()
    expect(errs).to_equal([{"loc": "name", "msg": "invalid str"}, {"loc": "age", "msg": "invalid int"}])

@test("bỏ field thừa")
def _():
    clean, _e = validate(SCHEMA, {"name": "D", "age": 1, "is_admin": True})
    expect("is_admin" in clean).to_be_false()
'''
hints = ["Tách hàm `_coerce(tp, value)` ném `ValueError` khi không ép được.", "Cẩn thận: `bool` là subclass của `int` trong Python."]
explanation = "Pydantic v2 làm điều này (nhanh hơn nhiều, bằng Rust core) và FastAPI chuyển `errors` thành response 422."
sources = ["fastapi/tutorial/body/index"]

[[questions]]
id = "py-028"
module = "py-fastapi"
type = "code"
lang = "python"
difficulty = 3
title = "Mini Dependency Injection (Depends)"
prompt = '''
Mô phỏng hệ thống `Depends` của FastAPI:

- Lớp `Depends(dependency)` lưu hàm phụ thuộc
- `solve(func, overrides=None)` gọi `func`, với mỗi tham số có default là `Depends(dep)`:
  - giải quyết **đệ quy** `dep` (dep cũng có thể có `Depends`)
  - nếu `dep` có trong `overrides` (dict) → dùng hàm thay thế (giống `app.dependency_overrides` khi test)
  - **cache trong một lần solve**: cùng một dependency chỉ được gọi 1 lần
- Tham số không phải Depends dùng giá trị default bình thường
- Trả về kết quả của `func`

Gợi ý: `inspect.signature(func).parameters`.
'''
starter = '''
class Depends:
    def __init__(self, dependency):
        self.dependency = dependency


def solve(func, overrides=None):
    return func()
'''
solution = '''
import inspect


class Depends:
    def __init__(self, dependency):
        self.dependency = dependency


def solve(func, overrides=None, _cache=None):
    overrides = overrides or {}
    cache = {} if _cache is None else _cache
    kwargs = {}
    for name, p in inspect.signature(func).parameters.items():
        d = p.default
        if isinstance(d, Depends):
            dep = overrides.get(d.dependency, d.dependency)
            if dep not in cache:
                cache[dep] = solve(dep, overrides, cache)
            kwargs[name] = cache[dep]
    return func(**kwargs)
'''
tests = '''
calls = []

def get_settings():
    calls.append("settings")
    return {"db_url": "sqlite://"}

def get_db(settings=Depends(get_settings)):
    calls.append("db")
    return "DB(" + settings["db_url"] + ")"

def get_user(db=Depends(get_db), settings=Depends(get_settings)):
    return {"name": "an", "db": db}

def endpoint(user=Depends(get_user), limit=10):
    return {"user": user["name"], "db": user["db"], "limit": limit}

@test("giải quyết đệ quy")
def _():
    calls.clear()
    expect(solve(endpoint)).to_equal({"user": "an", "db": "DB(sqlite://)", "limit": 10})

@test("cache trong một lần solve")
def _():
    calls.clear()
    solve(endpoint)
    expect(calls.count("settings")).to_be(1)
    expect(calls.count("db")).to_be(1)

@test("mỗi lần solve là request mới")
def _():
    calls.clear()
    solve(endpoint)
    solve(endpoint)
    expect(calls.count("settings")).to_be(2)

@test("dependency_overrides khi test")
def _():
    fake = lambda: "FAKE_DB"
    expect(solve(endpoint, overrides={get_db: fake})["db"]).to_be("FAKE_DB")

@test("override dependency lồng sâu")
def _():
    r = solve(endpoint, overrides={get_settings: lambda: {"db_url": "pg://test"}})
    expect(r["db"]).to_be("DB(pg://test)")
'''
hints = ["Duyệt `inspect.signature(func).parameters.items()` và kiểm tra `isinstance(p.default, Depends)`.", "Truyền chung một dict cache cho các lần gọi đệ quy."]
explanation = "Đây chính là cách FastAPI xây \"dependency graph\" cho mỗi request; `app.dependency_overrides` cực hữu ích khi test."
sources = ["fastapi/tutorial/security/index", "fastapi/tutorial/testing/index"]

