[[questions]]
id = "python-backend-lvc04"
module = "python-backend-lead"
type = "code"
difficulty = 3
tags = ["level:lead", "release"]
lang = "python"
title = "Rollout theo phần trăm"
prompt = '''Bạn chuẩn hoá cách rollout tính năng cho cả team. Viết in_rollout(flag, user_id, percent) trả về True nếu user thuộc nhóm được bật tính năng.

Yêu cầu:
- percent là số nguyên 0..100; ngoài khoảng (hoặc không phải int) thì ném ValueError.
- Kết quả **ổn định** giữa các process và các lần khởi động lại: dùng hashlib (vd. sha256 của "flag:user_id"), không dùng hash() có salt ngẫu nhiên.
- **Đơn điệu**: user đã ở trong nhóm 10% thì vẫn ở trong nhóm khi tăng lên 30%.
- Mỗi flag chia nhóm độc lập (cùng user có thể vào flag này nhưng không vào flag khác).
- 0% không ai được bật, 100% mọi người được bật.'''
starter = '''import hashlib

def in_rollout(flag, user_id, percent):
    return False
'''
solution = '''import hashlib

def in_rollout(flag, user_id, percent):
    if type(percent) is not int or not 0 <= percent <= 100:
        raise ValueError("percent phải là số nguyên 0..100")
    digest = hashlib.sha256(f"{flag}:{user_id}".encode("utf-8")).hexdigest()
    bucket = int(digest[:8], 16) % 100
    return bucket < percent
'''
tests = '''
@test("0% và 100%")
def _():
    users = range(500)
    expect(any(in_rollout("new-ui", u, 0) for u in users)).to_be_false()
    expect(all(in_rollout("new-ui", u, 100) for u in users)).to_be_true()

@test("kết quả ổn định khi gọi lại")
def _():
    first = [in_rollout("search-v2", u, 37) for u in range(300)]
    second = [in_rollout("search-v2", u, 37) for u in range(300)]
    expect(first).to_equal(second)

@test("đơn điệu khi tăng phần trăm")
def _():
    for u in range(1000):
        if in_rollout("checkout", u, 10):
            expect(in_rollout("checkout", u, 30)).to_be_true()

@test("tỉ lệ xấp xỉ phần trăm yêu cầu")
def _():
    hits = sum(1 for u in range(4000) if in_rollout("pricing", u, 20))
    expect(600 <= hits <= 1000).to_be_true()

@test("các flag chia nhóm độc lập")
def _():
    a = [in_rollout("flag-a", u, 50) for u in range(400)]
    b = [in_rollout("flag-b", u, 50) for u in range(400)]
    expect(a == b).to_be_false()

@test("percent không hợp lệ")
def _():
    expect(lambda: in_rollout("x", 1, -1)).to_raise(ValueError)
    expect(lambda: in_rollout("x", 1, 101)).to_raise(ValueError)
    expect(lambda: in_rollout("x", 1, 12.5)).to_raise(ValueError)
'''
hints = ["Băm chuỗi f\"{flag}:{user_id}\" bằng hashlib.sha256 rồi lấy một phần hexdigest làm số nguyên.", "Đưa số đó về bucket 0..99 bằng % 100; user được bật khi bucket < percent — điều kiện này tự nhiên đơn điệu."]
explanation = "Bucket cố định cho mỗi cặp (flag, user) làm rollout ổn định và đơn điệu; đưa flag vào chuỗi băm để các thử nghiệm không luôn rơi vào cùng một nhóm người dùng."
sources = ["python~3.14/library/hashlib"]

