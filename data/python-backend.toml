[[questions]]
id = "python-backend-lvc02"
module = "py-security"
type = "code"
difficulty = 2
tags = ["level:middle", "auth"]
lang = "python"
title = "Tách bearer token từ header"
prompt = '''Viết parse_bearer(header) nhận giá trị header Authorization (có thể là None) và trả về token, hoặc None nếu không hợp lệ.

- Hợp lệ khi có đúng hai phần cách nhau bởi khoảng trắng: scheme "Bearer" (không phân biệt hoa thường) và token không rỗng.
- Bỏ khoảng trắng thừa ở đầu/cuối.
- Scheme khác (vd. "Basic"), thiếu token, hoặc có nhiều hơn hai phần → None.'''
starter = '''def parse_bearer(header):
    return header
'''
solution = '''def parse_bearer(header):
    if not header:
        return None
    parts = header.split()
    if len(parts) != 2 or parts[0].lower() != "bearer":
        return None
    return parts[1]
'''
tests = '''
@test("header hợp lệ")
def _():
    expect(parse_bearer("Bearer abc.def.ghi")).to_be("abc.def.ghi")

@test("scheme không phân biệt hoa thường và bỏ khoảng trắng thừa")
def _():
    expect(parse_bearer("  bearer   tok123  ")).to_be("tok123")
    expect(parse_bearer("BEARER x")).to_be("x")

@test("thiếu header hoặc thiếu token")
def _():
    expect(parse_bearer(None)).to_be_none()
    expect(parse_bearer("")).to_be_none()
    expect(parse_bearer("Bearer")).to_be_none()
    expect(parse_bearer("Bearer   ")).to_be_none()

@test("scheme khác")
def _():
    expect(parse_bearer("Basic dXNlcjpwYXNz")).to_be_none()

@test("quá nhiều phần")
def _():
    expect(parse_bearer("Bearer a b")).to_be_none()
'''
hints = ["str.split() không tham số tách theo mọi khoảng trắng và bỏ phần rỗng.", "Kiểm tra len(parts) == 2 và parts[0].lower() == 'bearer'."]
explanation = "Parse header ở biên hệ thống phải chặt: chấp nhận đúng một dạng, mọi dạng khác trả None để dependency trả 401."
sources = ["fastapi/tutorial/security/index"]

