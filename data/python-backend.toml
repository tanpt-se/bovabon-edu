[[questions]]
id = "py-007"
module = "py-flask"
type = "code"
lang = "python"
difficulty = 3
tags = ["level:senior"]
title = "Route matcher kiểu Flask"
prompt = '''
Viết `match_route(rule, path)` mô phỏng cách Flask khớp URL:

- `rule` gồm đoạn tĩnh và biến `<name>` hoặc `<converter:name>` với converter `string` (mặc định, không chứa `/`), `int` (chữ số), `path` (cho phép `/`, chỉ ở cuối)
- Khớp → trả về `dict` các biến (int đã chuyển sang `int`); không khớp → `None`
- Khớp toàn bộ path (không thừa/thiếu)

```python
match_route("/users/<int:id>", "/users/42")  # {"id": 42}
match_route("/files/<path:p>", "/files/a/b.txt")  # {"p": "a/b.txt"}
```
'''
starter = '''
def match_route(rule, path):
    # TODO
    return None
'''
solution = '''
import re

_CONV = {"string": r"[^/]+", "int": r"\d+", "path": r".+"}
_VAR = re.compile(r"<(?:(\w+):)?(\w+)>")


def match_route(rule, path):
    pattern, types, pos = "", {}, 0
    for m in _VAR.finditer(rule):
        pattern += re.escape(rule[pos:m.start()])
        conv, name = m.group(1) or "string", m.group(2)
        types[name] = conv
        pattern += f"(?P<{name}>{_CONV[conv]})"
        pos = m.end()
    pattern += re.escape(rule[pos:])
    found = re.fullmatch(pattern, path)
    if not found:
        return None
    return {k: int(v) if types[k] == "int" else v for k, v in found.groupdict().items()}
'''
tests = '''
@test("biến string mặc định")
def _():
    expect(match_route("/hello/<name>", "/hello/an")).to_equal({"name": "an"})

@test("int converter chuyển kiểu")
def _():
    r = match_route("/users/<int:id>", "/users/42")
    expect(r).to_equal({"id": 42})
    expect(type(r["id"])).to_be(int)

@test("int không khớp chữ")
def _():
    expect(match_route("/users/<int:id>", "/users/abc")).to_be_none()

@test("string không chứa /")
def _():
    expect(match_route("/hello/<name>", "/hello/a/b")).to_be_none()

@test("path converter")
def _():
    expect(match_route("/files/<path:p>", "/files/a/b.txt")).to_equal({"p": "a/b.txt"})

@test("nhiều biến")
def _():
    expect(match_route("/posts/<int:pid>/comments/<cid>", "/posts/7/comments/x9")).to_equal({"pid": 7, "cid": "x9"})

@test("đoạn tĩnh phải khớp toàn bộ")
def _():
    expect(match_route("/about", "/about")).to_equal({})
    expect(match_route("/about", "/about/team")).to_be_none()
    expect(match_route("/a.b", "/axb")).to_be_none()
'''
hints = ["Chuyển rule thành regex với named group `(?P<name>...)` rồi dùng `re.fullmatch`.", "Nhớ `re.escape` cho phần tĩnh (dấu `.` trong `/a.b`)."]
explanation = "Werkzeug (nền của Flask) biên dịch rule thành regex tương tự và cache lại."
sources = ["flask/quickstart/index"]

