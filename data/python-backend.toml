[[modules]]
id = "python-backend-dv-flask-structure"
title = "Flask: cấu trúc ứng dụng & kiểm thử"
description = "Blueprint, application factory, cấu hình theo môi trường và test client."
sources = ["flask/patterns/appfactories/index", "flask/api/index#flask.Blueprint", "flask/testing/index", "flask/config/index", "flask/deploying/index"]
lesson = '''
### Chia ứng dụng Flask theo trách nhiệm

Khi một ứng dụng lớn dần, gom mọi route vào một file khiến import, cấu hình và kiểm thử khó kiểm soát. **Blueprint** nhóm route và hook theo một phần chức năng; Blueprint chưa phải app độc lập và chỉ hoạt động sau khi được đăng ký vào một Flask application. Khi đăng ký, có thể thêm **url_prefix** để tạo không gian URL rõ ràng.

| Thành phần | Vai trò | Ví dụ |
|---|---|---|
| Application factory | Tạo app mới và áp cấu hình mỗi lần gọi | create_app(test_config) |
| Blueprint | Nhóm route theo chức năng | users, admin |
| Test client | Gửi request giả lập qua app | client.get("/health") |
| Config TESTING | Bật hành vi phù hợp cho test | app.config.update(TESTING=True) |

Ví dụ tổ chức:

~~~python
from flask import Blueprint, Flask

api = Blueprint("api", __name__)

@api.get("/health")
def health():
    return {"ok": True}

def create_app(config=None):
    app = Flask(__name__)
    app.config.from_mapping(SECRET_KEY="replace-in-deployment")
    if config:
        app.config.update(config)
    app.register_blueprint(api, url_prefix="/api")
    return app
~~~

Trong test, gọi factory với cấu hình riêng, sau đó dùng app.test_client() để chạy qua routing và middleware của Flask mà không mở cổng mạng. Mỗi test có thể tạo app mới để tránh cấu hình hoặc trạng thái toàn cục rò sang test khác. Kiểm tra status, header và JSON response; dùng session_transaction() khi cần chuẩn bị session.

Lỗi hay gặp là import module route trước khi factory cấu hình xong rồi tạo app toàn cục, làm test khó cô lập; quên đăng ký Blueprint khiến route trả 404; và dùng app.run() như server production. Factory giúp tạo app nhất quán, còn server production phải là WSGI server được cấu hình riêng. Không đặt secret thật trong mã nguồn hay cấu hình test.
'''

