[[modules]]
id = "python-backend-dv-fastapi-deps"
title = "FastAPI: dependency lifecycle & kiểm thử"
description = "Dependency graph, cleanup bằng yield, cache theo request và dependency overrides."
sources = ["fastapi/tutorial/dependencies/index", "fastapi/tutorial/dependencies/sub-dependencies/index", "fastapi/tutorial/dependencies/dependencies-with-yield/index", "fastapi/tutorial/testing/index", "fastapi/advanced/testing-dependencies/index"]
lesson = '''
### Dependency như một ranh giới có thể thay thế

FastAPI dùng **Depends** để khai báo dependency ngay trong chữ ký endpoint. Dependency có thể nhận dependency con, vì vậy framework xây một đồ thị giải quyết theo thứ tự trước khi gọi endpoint. Đây là nơi phù hợp để cung cấp người dùng đã xác thực, cấu hình, session database hoặc logic dùng chung mà không gắn chặt route vào cách tạo tài nguyên.

| Cách viết | Tác dụng | Khi dùng |
|---|---|---|
| Hàm dependency thường | Tạo hoặc trả một giá trị | Cấu hình, quyền truy cập |
| Dependency có yield | Cấp tài nguyên rồi dọn dẹp | Session DB, file, lock |
| Sub-dependency | Tái sử dụng dependency khác | User phụ thuộc token |
| dependency_overrides | Thay dependency khi test | Fake DB hoặc user |

Ví dụ một resource cần đóng kể cả khi endpoint có lỗi:

~~~python
def get_connection():
    connection = open_connection()
    try:
        yield connection
    finally:
        connection.close()

@app.get("/items")
def list_items(connection = Depends(get_connection)):
    return query_items(connection)
~~~

FastAPI chạy phần trước yield để chuẩn bị tài nguyên và phần finally để dọn dẹp theo vòng đời dependency. Dependency được tái sử dụng trong một request thường được cache, nên cùng dependency được tham chiếu từ nhiều nhánh không nhất thiết tạo nhiều kết nối. Khi cần hành vi khác, có thể tắt cache bằng use_cache=False; không nên dựa vào cache để chia sẻ trạng thái giữa các request.

Khi test, TestClient gửi request qua app, còn app.dependency_overrides ánh xạ hàm dependency gốc sang hàm thay thế. Cách này giúp test không gọi database thật, không cần token thật và có thể dựng dữ liệu xác định. Sau test phải khôi phục hoặc xóa override để test tiếp theo không bị ảnh hưởng. Lỗi hay gặp là override sai object dependency, quên dọn override, hoặc mở resource nhưng không đặt thao tác đóng trong finally. Chỉ dùng dependency để chia sẻ logic có ranh giới rõ; middleware phù hợp hơn với hành vi áp dụng rộng cho hầu hết request như ghi nhận thời lượng.
'''

