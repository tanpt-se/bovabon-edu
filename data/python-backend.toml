[[questions]]
id = "python-backend-lvc03"
module = "py-async"
type = "code"
difficulty = 3
tags = ["level:senior", "resilience"]
lang = "python"
title = "Retry với exponential backoff"
prompt = '''Viết retry(fn, attempts, base_delay, sleep, retry_on=(Exception,)) gọi fn() và trả về kết quả.

- Nếu fn() ném exception thuộc retry_on và còn lượt, gọi sleep(base_delay * 2**i) (i là chỉ số lần thử vừa thất bại, bắt đầu từ 0) rồi thử lại.
- Exception không thuộc retry_on được ném ra ngay, không sleep.
- Hết lượt thì ném lại exception cuối cùng (không sleep sau lần thử cuối).
- attempts < 1 thì ném ValueError.
- sleep được truyền vào để test không phải chờ thật.'''
starter = '''def retry(fn, attempts, base_delay, sleep, retry_on=(Exception,)):
    return fn()
'''
solution = '''def retry(fn, attempts, base_delay, sleep, retry_on=(Exception,)):
    if attempts < 1:
        raise ValueError("attempts phải >= 1")
    for i in range(attempts):
        try:
            return fn()
        except retry_on:
            if i == attempts - 1:
                raise
            sleep(base_delay * (2 ** i))
'''
tests = '''
def _flaky(n_fail, exc=ConnectionError):
    state = {"calls": 0}
    def fn():
        state["calls"] += 1
        if state["calls"] <= n_fail:
            raise exc("boom")
        return "ok"
    return fn, state

@test("thành công ngay không sleep")
def _():
    fn, state = _flaky(0)
    delays = []
    expect(retry(fn, 3, 0.1, delays.append)).to_be("ok")
    expect(state["calls"]).to_be(1)
    expect(delays).to_equal([])

@test("thành công ở lần thứ ba với backoff tăng gấp đôi")
def _():
    fn, state = _flaky(2)
    delays = []
    expect(retry(fn, 5, 0.5, delays.append)).to_be("ok")
    expect(state["calls"]).to_be(3)
    expect(delays).to_equal([0.5, 1.0])

@test("hết lượt thì ném lại lỗi cuối")
def _():
    fn, state = _flaky(10)
    delays = []
    expect(lambda: retry(fn, 3, 1, delays.append)).to_raise(ConnectionError)
    expect(state["calls"]).to_be(3)
    expect(delays).to_equal([1, 2])

@test("lỗi không nằm trong retry_on ném ngay")
def _():
    fn, state = _flaky(1, exc=KeyError)
    delays = []
    expect(lambda: retry(fn, 3, 1, delays.append, retry_on=(ConnectionError,))).to_raise(KeyError)
    expect(state["calls"]).to_be(1)
    expect(delays).to_equal([])

@test("attempts không hợp lệ")
def _():
    fn, _state = _flaky(0)
    expect(lambda: retry(fn, 0, 1, lambda s: None)).to_raise(ValueError)
'''
hints = ["Dùng vòng for i in range(attempts) với try/except retry_on.", "Ở lần thử cuối dùng raise trơn để ném lại đúng exception, các lần trước thì sleep(base_delay * 2 ** i)."]
explanation = "Backoff tăng dần giảm áp lực lên dịch vụ đang lỗi; chỉ retry lỗi tạm thời (retry_on) và truyền sleep vào để test nhanh, xác định. Trong production nên thêm jitter ngẫu nhiên và chỉ retry thao tác idempotent."
sources = ["python~3.14/library/random#random.uniform", "python~3.14/library/time#time.monotonic"]

