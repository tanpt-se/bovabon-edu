[[questions]]
id = "py-064"
module = "py-security"
type = "code"
lang = "python"
difficulty = 3
title = "Ký & xác minh JWT HS256"
prompt = '''
Chỉ dùng thư viện chuẩn (`hmac`, `hashlib`, `base64`, `json`), viết:

- `b64url(data: bytes) -> str` — base64url **bỏ dấu `=`**
- `sign(payload: dict, secret: str) -> str` — header `{"alg":"HS256","typ":"JWT"}`, JSON compact (`separators=(",", ":")`), chữ ký HMAC-SHA256 của `"<header>.<payload>"`
- `verify(token: str, secret: str, now: int) -> dict` — trả payload nếu hợp lệ; ngược lại `raise ValueError` với message:
  - `"malformed"` nếu không đủ 3 phần
  - `"bad algorithm"` nếu header `alg` khác `HS256`
  - `"bad signature"` nếu sai chữ ký (dùng `hmac.compare_digest`)
  - `"expired"` nếu có `exp` và `now >= exp`
'''
starter = '''
def b64url(data):
    pass


def sign(payload, secret):
    pass


def verify(token, secret, now):
    pass
'''
solution = '''
import base64
import hashlib
import hmac
import json


def b64url(data):
    return base64.urlsafe_b64encode(data).rstrip(b"=").decode()


def _b64decode(s):
    return base64.urlsafe_b64decode(s + "=" * (-len(s) % 4))


def _json(obj):
    return json.dumps(obj, separators=(",", ":")).encode()


def _sig(msg, secret):
    return b64url(hmac.new(secret.encode(), msg.encode(), hashlib.sha256).digest())


def sign(payload, secret):
    head = b64url(_json({"alg": "HS256", "typ": "JWT"}))
    body = b64url(_json(payload))
    return f"{head}.{body}.{_sig(head + '.' + body, secret)}"


def verify(token, secret, now):
    parts = token.split(".")
    if len(parts) != 3:
        raise ValueError("malformed")
    head, body, sig = parts
    try:
        header = json.loads(_b64decode(head))
        payload = json.loads(_b64decode(body))
    except Exception:
        raise ValueError("malformed")
    if header.get("alg") != "HS256":
        raise ValueError("bad algorithm")
    if not hmac.compare_digest(_sig(head + "." + body, secret), sig):
        raise ValueError("bad signature")
    if "exp" in payload and now >= payload["exp"]:
        raise ValueError("expired")
    return payload
'''
tests = '''
import base64, json

SECRET = "bovabon-secret"

@test("b64url bỏ padding")
def _():
    expect(b64url(b"hi")).to_be("aGk")
    expect(b64url(bytes([251, 255]))).to_be("-_8")

@test("token chuẩn JWT (khớp vector tham chiếu)")
def _():
    tok = sign({"sub": "1", "name": "An"}, "k")
    expect(tok).to_be("eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwibmFtZSI6IkFuIn0.oNgyD6to0RzgTJdbn4JMlL1vC7R61JJM2XO1r4Htrlk")

@test("sign rồi verify")
def _():
    tok = sign({"sub": "42", "exp": 2000}, SECRET)
    expect(verify(tok, SECRET, now=1000)).to_equal({"sub": "42", "exp": 2000})

@test("sai secret → bad signature")
def _():
    tok = sign({"sub": "1"}, SECRET)
    expect(lambda: verify(tok, "other", now=0)).to_raise(ValueError, "bad signature")

@test("sửa payload → bad signature")
def _():
    h, p, s = sign({"role": "user"}, SECRET).split(".")
    forged = base64.urlsafe_b64encode(b'{"role":"admin"}').rstrip(b"=").decode()
    expect(lambda: verify(f"{h}.{forged}.{s}", SECRET, now=0)).to_raise(ValueError, "bad signature")

@test("hết hạn")
def _():
    tok = sign({"exp": 100}, SECRET)
    expect(lambda: verify(tok, SECRET, now=100)).to_raise(ValueError, "expired")

@test("alg none bị từ chối")
def _():
    h = base64.urlsafe_b64encode(b'{"alg":"none"}').rstrip(b"=").decode()
    p = base64.urlsafe_b64encode(b'{"sub":"1"}').rstrip(b"=").decode()
    expect(lambda: verify(f"{h}.{p}.", SECRET, now=0)).to_raise(ValueError, "bad algorithm")

@test("malformed")
def _():
    expect(lambda: verify("abc", SECRET, now=0)).to_raise(ValueError, "malformed")
'''
