id = "python-backend"
title = "Python: Flask & FastAPI"
icon = "🐍"
color = "#22c55e"
group = "Backend"
docs = ["flask", "fastapi", "python~3.14"]
description = "Flask (app/request context, blueprint, factory), FastAPI (path/query/body, Pydantic, Depends, async), async Python và bảo mật API."

[[modules]]
id = "py-flask"
title = "Flask"
description = "Route, request/app context, g, session, blueprint, application factory, testing."
sources = ["flask/quickstart/index", "flask/appcontext/index", "flask/reqcontext/index", "flask/patterns/appfactories/index"]
lesson = '''
### Ý chính
- `@app.route("/users/<int:user_id>", methods=["GET", "POST"])` — converter `int`, `float`, `path`, `uuid`.
- **Request context**: `request`, `session` chỉ dùng được trong lúc xử lý request.
- **Application context**: `current_app`, `g` (lưu tạm theo request, vd. kết nối DB). Ngoài request (CLI, test) cần `with app.app_context():`.
- `session` là **signed cookie** (cần `SECRET_KEY`) — người dùng đọc được nội dung nhưng không sửa được.
- **Blueprint** chia app theo module; **application factory** `create_app(config)` giúp test & nhiều cấu hình.
- Trả về dict → Flask tự `jsonify`. `abort(404)`, `@app.errorhandler(404)`.
- Hook: `before_request`, `after_request`, `teardown_appcontext`.
- Test: `app.test_client()`.
- Production: chạy bằng WSGI server (gunicorn, waitress), không dùng `app.run()`.
'''

[[modules]]
id = "py-fastapi"
title = "FastAPI"
description = "Path/query/body params, Pydantic model, response_model, Depends, HTTPException, middleware, BackgroundTasks."
sources = ["fastapi/tutorial/path-params/index", "fastapi/tutorial/query-params/index", "fastapi/tutorial/body/index", "fastapi/tutorial/response-model/index", "fastapi/tutorial/handling-errors/index"]
lesson = '''
### Ý chính
- FastAPI dựa trên **Starlette** (ASGI) + **Pydantic** (validate dữ liệu) và **type hints**.
- Tham số hàm: có trong path → **path param**; kiểu đơn (`int`, `str`) không có trong path → **query param**; kiểu Pydantic model → **request body**.
- Dữ liệu sai kiểu → tự trả **422 Unprocessable Entity** kèm chi tiết.
- `response_model=UserOut` lọc field trả về (không lộ `password`).
- `Depends(get_db)` — **dependency injection**: tái sử dụng logic (DB session, auth, phân trang); dependency có `yield` để dọn dẹp.
- `raise HTTPException(status_code=404, detail="...")`.
- Tự sinh tài liệu OpenAPI tại `/docs` (Swagger UI) và `/redoc`.
- `BackgroundTasks` chạy việc nhẹ sau khi trả response; việc nặng dùng queue (Celery, RQ, Arq).
- Test: `TestClient(app)` (dựa trên httpx).
'''

[[modules]]
id = "py-async"
title = "Async Python & hiệu năng"
description = "async/await, event loop, def vs async def trong FastAPI, asyncio.gather, Semaphore, WSGI vs ASGI."
sources = ["fastapi/async/index", "flask/async-await/index"]
lesson = '''
### Ý chính
- **WSGI** (Flask, Django cổ điển): đồng bộ, mỗi request một worker/thread. **ASGI** (FastAPI, Starlette): bất đồng bộ, hỗ trợ WebSocket.
- `async def` endpoint chạy **trên event loop** — tuyệt đối không gọi I/O blocking (`requests`, `time.sleep`, driver DB đồng bộ) trong đó.
- Endpoint `def` thường → FastAPI chạy trong **threadpool**, nên dùng được thư viện blocking.
- `await asyncio.gather(*coros)` chạy đồng thời; `asyncio.Semaphore(n)` giới hạn số tác vụ cùng lúc; `asyncio.wait_for(coro, timeout)`.
- CPU-bound (xử lý ảnh, ML) → process pool / worker riêng vì **GIL** (trừ bản free-threaded 3.13+).
- Uvicorn/Gunicorn với nhiều worker process để tận dụng nhiều CPU.
'''

[[modules]]
id = "py-security"
title = "Auth & Bảo mật API"
description = "Hash mật khẩu, JWT, OAuth2 password flow, CORS, rate limit, secret."
sources = ["fastapi/tutorial/security/index", "fastapi/tutorial/cors/index", "flask/web-security/index"]
lesson = '''
### Ý chính
- Mật khẩu: **hash có salt & chậm** (`bcrypt`, `argon2`) — không MD5/SHA1, không lưu plaintext.
- **JWT** = `base64url(header).base64url(payload).signature`. Payload **không mã hoá**, chỉ được **ký** (HMAC/RSA) → không đặt dữ liệu nhạy cảm. Kiểm tra `exp`, thuật toán, chữ ký.
- So sánh chữ ký/token bằng `hmac.compare_digest` (chống timing attack).
- FastAPI: `OAuth2PasswordBearer(tokenUrl="token")` + `Depends(get_current_user)`.
- **CORS**: `CORSMiddleware(allow_origins=[...])` — không dùng `*` khi `allow_credentials=True`.
- Secret lấy từ biến môi trường, không commit vào git.
'''

