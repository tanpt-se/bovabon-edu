[[modules]]
id = "react-basics"
sources = ["react/learn/rendering-lists", "react/learn/keeping-components-pure"]
title = "JSX & Component"
description = "JSX biên dịch thành gì, component function, props, children, render có điều kiện, list & key."
lesson = '''
### JSX, component và danh sách
JSX mô tả React element; runtime mới chuyển JSX thành lời gọi `jsx(...)`, còn runtime classic dùng `React.createElement(...)`. Component là hàm viết hoa nhận props và trả về element. Props chỉ đọc; dùng Fragment khi cần nhiều node mà không thêm DOM.

| Tình huống | Cách làm | Vì sao |
|---|---|---|
| Danh sách có thể đổi thứ tự | `key={item.id}` | React giữ đúng identity và state của từng hàng |
| Điều kiện theo số lượng | `items.length > 0 && <List />` | `0 && ...` hiển thị số 0 |
| Thuộc tính DOM | `className`, `htmlFor`, `onClick` | Tên theo API React DOM |

```jsx
function TodoList({ items }) {
  return <ul>{items.map(item => <li key={item.id}>{item.text}</li>)}</ul>;
}
```

### Lỗi hay gặp
- Dùng `key={index}` cho danh sách có chèn, xoá hoặc sắp xếp, làm state của hàng gắn nhầm item.
- Viết component chữ thường hoặc sửa trực tiếp props.
- Dùng `condition && node` khi condition có thể là `0`.

### Checklist phỏng vấn
- JSX tạo DOM node ngay lập tức hay mô tả element?
- `key` duy nhất trong phạm vi nào, và vì sao không phải prop thông thường?
- Khi nào Fragment dạng `<>` không đủ vì cần `key`?
'''

[[modules]]
id = "react-state"
sources = ["react/learn/preserving-and-resetting-state", "react/reference/react/usereducer", "react/reference/react/usestate"]
title = "State, Props & Event"
description = "useState, cập nhật bất biến, batching, lifting state up, controlled vs uncontrolled."
lesson = '''
### State là snapshot
`useState` trả giá trị của lần render hiện tại. Gọi setter xếp lịch render mới, không sửa biến đang nằm trong closure. Nếu giá trị mới phụ thuộc giá trị trước, dùng updater function; state object và array cần được thay bằng giá trị mới.

| Cập nhật | Ví dụ | Lưu ý |
|---|---|---|
| Giá trị độc lập | `setOpen(true)` | Có thể truyền giá trị trực tiếp |
| Dựa trên state cũ | `setCount(c => c + 1)` | An toàn khi có nhiều cập nhật trong cùng event |
| Object/array | `setUser(u => ({ ...u, name }))` | Không mutate object cũ |
| Nhiều nơi dùng chung | Đưa state lên cha chung | Giữ một nguồn dữ liệu chuẩn |

```jsx
function addItem(item) {
  setItems(current => [...current, item]);
}
```

React 18+ tự động batching nhiều cập nhật trong cùng lượt xử lý. `useState(() => expensive())` dùng lazy initializer, tránh gọi phép tính khởi tạo lại ở mỗi render.

### Lỗi hay gặp
- Gọi `setCount(count + 1)` nhiều lần trong một handler và nghĩ mỗi lần đọc snapshot mới.
- Sửa `items.push(item)` rồi truyền lại cùng mảng.
- Lưu cùng một dữ liệu ở cả cha và con khiến hai bản có thể lệch nhau.
- Dùng controlled input (`value`) mà quên cập nhật state trong `onChange`.

### Checklist phỏng vấn
- Vì sao setter không đổi biến state ngay trong handler hiện tại?
- Khi nào chọn state cục bộ, lifting state up, controlled hay uncontrolled?
- Làm sao cập nhật một phần tử trong array mà không mutate?
'''

[[modules]]
id = "react-hooks"
sources = ["react/reference/react/useeffect", "react/learn/you-might-not-need-an-effect", "react/reference/react/useref", "react/reference/react/useid", "react/reference/react/usesyncexternalstore", "react/learn/synchronizing-with-effects", "react/reference/rules/rules-of-hooks"]
title = "Hooks"
description = "useEffect, useRef, useMemo, useCallback, useReducer, useContext, custom hooks và Rules of Hooks."
lesson = '''
### Rules of Hooks
1. Chỉ gọi hook **ở top-level** (không trong if/for/hàm lồng).
2. Chỉ gọi hook trong **function component** hoặc **custom hook** (tên bắt đầu bằng `use`).

### Chọn hook theo mục đích
| Hook | Dùng khi | Không dùng để |
|---|---|---|
| `useEffect` | Đồng bộ subscription, timer hoặc hệ thống bên ngoài | Tính dữ liệu có thể suy ra trong render |
| `useRef` | Giữ mutable value không cần render lại | Lưu dữ liệu UI cần hiển thị |
| `useMemo` / `useCallback` | Cache giá trị / hàm khi có lý do đo được | Thay thế tính đúng đắn của code |
| `useReducer` | Nhiều action cập nhật cùng state | Gom mọi state vào một object |
| `useContext` | Đọc dữ liệu chung qua cây component | Thay mọi dạng state management |

```jsx
useEffect(() => {
  const connection = connect(roomId);
  return () => connection.disconnect();
}, [roomId]);
```

Effect không truyền deps chạy sau mỗi render; `[]` mô tả không có reactive dependency. Cleanup chạy trước lần setup tiếp theo và khi unmount. Strict Mode thêm một chu kỳ setup-cleanup trong development để làm lộ cleanup thiếu.

### Lỗi hay gặp
- Gọi hook trong nhánh điều kiện khiến thứ tự hook thay đổi.
- Bỏ dependency khiến callback đọc state cũ.
- Dùng effect để đồng bộ hai state có thể được tính trực tiếp từ nhau.
- Thêm memoization trước khi đo vấn đề render.

### Checklist phỏng vấn
- Mỗi dependency của effect đến từ đâu?
- Cleanup cần đảo ngược tài nguyên nào mà setup đã tạo?
- Có thể tính giá trị trong render hoặc xử lý trong event handler thay vì effect không?

Các bài code trong module dùng MiniReact có `useState`, `useEffect`, `useRef`, `useMemo`, `useCallback`, `useReducer`, `renderHook` và `act`.
'''

[[modules]]
id = "react-perf"
sources = ["react/reference/react/usememo", "react/reference/react/usetransition", "react/reference/react/usedeferredvalue", "react/reference/react/memo", "react/reference/react/lazy", "react/reference/react/suspense", "react/reference/react/profiler"]
title = "Rendering & Hiệu năng"
description = "Reconciliation, key, React.memo, tránh render thừa, code splitting, concurrent features."
lesson = '''
### Render và tối ưu
Component có thể render lại khi state hoặc context nó đọc đổi, hoặc khi cha render. Render lại không đồng nghĩa DOM bị thay toàn bộ; React so sánh cây element rồi commit khác biệt cần thiết.

| Công cụ | Tác dụng | Cân nhắc |
|---|---|---|
| `React.memo` | Bỏ qua render khi props so sánh nông không đổi | Object/function mới vẫn làm props khác |
| `useMemo` | Cache kết quả tính toán | Chỉ thêm khi phép tính hoặc identity có ý nghĩa |
| `useCallback` | Giữ identity của function | Thường đi cùng component đã memo |
| `useTransition` | Đánh dấu cập nhật không khẩn cấp | Không làm tác vụ CPU nặng tự chạy nền |
| `lazy` + `Suspense` | Tải component khi cần | Chọn boundary và fallback phù hợp |

```jsx
const visible = useMemo(
  () => todos.filter(todo => todo.title.includes(query)),
  [todos, query]
);
```

Key ổn định giúp reconciliation giữ đúng identity sau reorder. Dùng Profiler và đo luồng người dùng trước khi tối ưu; React Compiler có thể tự memo hóa trong cấu hình tương thích.

### Lỗi hay gặp
- Kỳ vọng `React.memo` chặn cập nhật từ context hoặc state nội bộ.
- Tạo dependency object mới mỗi render làm cache vô hiệu.
- Dùng index làm key trong danh sách có thể đổi thứ tự.
- Bọc mọi callback bằng `useCallback` mà không có lợi ích đo được.

### Checklist phỏng vấn
- Render nào thực sự tốn thời gian theo Profiler?
- Identity nào thay đổi và có khiến component con render không cần thiết?
- Có thể chia nhỏ component/state hoặc tải code trễ trước khi memo hóa không?
'''

[[modules]]
id = "react-patterns"
sources = ["react/reference/react/suspense", "react/reference/react/usecontext", "react/reference/react-dom/createportal", "react/reference/react/useoptimistic", "react/reference/react/useactionstate", "react/reference/react/component", "react/reference/react/usesyncexternalstore"]
title = "Pattern & Hệ sinh thái"
description = "Context, composition, error boundary, Suspense, Server Components, form, testing."
lesson = '''
### Pattern và ranh giới
| Pattern | Dùng khi | Điểm cần nhớ |
|---|---|---|
| Composition với `children` | Tách khung giao diện khỏi nội dung | Thường linh hoạt hơn nhiều prop boolean |
| Context | Theme, locale hoặc dữ liệu chia sẻ theo cây | Consumer đọc context render lại khi value đổi |
| Error Boundary | Khôi phục UI khi render con ném lỗi | Không bắt lỗi event handler thông thường |
| Portal | Modal hoặc tooltip cần thoát vùng overflow | Event React vẫn nổi bọt theo cây React |
| Suspense / `lazy` | Tải code hoặc dữ liệu có hỗ trợ Suspense | Đặt boundary theo vùng có fallback hữu ích |

```jsx
function Panel({ title, children }) {
  return <section><h2>{title}</h2>{children}</section>;
}
```

React 19 bổ sung Actions, `useActionState`, `useOptimistic`, `use(promise)`, và cho phép `ref` là prop. Server Components và Client Components có ranh giới module; `'use client'` tạo client boundary, còn `'use server'` đánh dấu Server Function.

### Lỗi hay gặp
- Dùng context cho mọi dữ liệu khiến nhiều consumer render lại cùng lúc.
- Mong Error Boundary bắt lỗi trong callback click hoặc promise bất kỳ.
- Giả định portal tách event khỏi cây React.
- Viết kiểm thử chi tiết cấu trúc DOM thay vì truy vấn theo role và tên truy cập được.

### Checklist phỏng vấn
- Vì sao composition thường thay cho prop flag hoặc kế thừa?
- Error Boundary bao phủ loại lỗi nào, và lỗi nào cần xử lý riêng?
- Modal portal cần quản lý focus, đóng bằng Escape và trạng thái truy cập ra sao?
'''

[[modules]]
id = "react-19"
title = "React 19: Actions & Compiler"
description = "Actions, các hook mới, ref prop, document metadata, use() và React Compiler."
sources = ["react/reference/react/useactionstate", "react/reference/react/useoptimistic", "react/reference/react-dom/hooks/useformstatus", "react/reference/react/use", "react/reference/react-compiler/configuration", "react/reference/react-dom/components/title", "react/reference/react-dom/components/meta", "react/reference/react/forwardref", "react/reference/react/useref", "react/reference/react/suspense"]
lesson = '''
### API React 19
| API | Vai trò | Ghi nhớ |
|---|---|---|
| `useActionState` | Gắn action với state kết quả và trạng thái pending | Action nhận state trước đó cùng input |
| `useOptimistic` | Hiển thị kết quả tạm khi action đang xử lý | UI cuối cùng vẫn cần phản ánh kết quả chuẩn |
| `useFormStatus` | Đọc trạng thái form cha trong component con | Hook phải nằm dưới `<form>` |
| `use(value)` | Đọc Promise hoặc Context trong render | Promise pending có thể kích hoạt Suspense |

```jsx
function SubmitButton() {
  const { pending } = useFormStatus();
  return <button disabled={pending}>{pending ? 'Saving' : 'Save'}</button>;
}
```

React 19 cho phép truyền `ref` như prop cho function component; `forwardRef` vẫn gặp trong code cũ. React DOM có thể hoist `<title>` và một số `<meta>` từ component lên document. React Compiler có thể tự memo hóa code phù hợp, nhưng cần bật và cấu hình compiler trong build.

### Lỗi hay gặp
- Gọi `useFormStatus` ngay trong component sở hữu `<form>` thay vì component con.
- Tạo Promise mới mỗi lần render rồi truyền vào `use()`.
- Nghĩ `useOptimistic` thay thế việc lưu kết quả server thành công.
- Mặc định mọi project đều bật React Compiler.

### Checklist phỏng vấn
- Action nhận những đối số nào và pending state đến từ đâu?
- Khi nào optimistic state cần rollback?
- Khác biệt giữa `use()` và một hook thông thường là gì?
'''

[[modules]]
id = "react-server"
title = "Server Components & Streaming"
description = "Ranh giới server/client, directives, Suspense, streaming và hydration."
sources = ["react/reference/rsc/server-components", "react/reference/rsc/use-client", "react/reference/rsc/use-server", "react/reference/react/suspense", "react/reference/react-dom/client/hydrateroot", "react/reference/react-dom/server/rendertopipeablestream"]
lesson = '''
### Chọn nơi chạy component
| Loại | Có thể dùng state/effect? | JavaScript gửi xuống browser? |
|---|---|---|
| Server Component | Không dùng client hooks | Không gửi implementation component |
| Client Component | Có, qua `'use client'` boundary | Có |
| Server Function | Thực thi ở server khi được gọi | Client nhận tham chiếu để gọi |

`'use client'` đặt ở đầu module và tạo ranh giới cho các import phía client. Props đi qua ranh giới cần tuần tự hóa được. `'use server'` đánh dấu Server Function; nó không biến component thành Server Component.

```jsx
// Server Component
export default async function Page() {
  const user = await loadUser();
  return <Profile name={user.name} />;
}
```

Suspense cho phép framework stream phần đã sẵn sàng trong khi phần chậm hiển thị fallback. Hydration gắn event và state client vào HTML đã render; output ban đầu của server và client cần khớp.

### Lỗi hay gặp
- Import API browser hoặc gọi `useState` trong Server Component.
- Đưa callback/function thông thường qua props server-client.
- Dùng `'use server'` như thể nó tương đương `'use client'`.
- Render `Date.now()`, random hoặc dữ liệu browser khác nhau ngay lần render đầu.

### Checklist phỏng vấn
- Ranh giới `'use client'` lan qua những module import nào?
- Suspense giúp streaming ở điểm nào trong cây?
- Hydration mismatch xuất phát từ đâu và kiểm tra theo thứ tự nào?
'''

[[modules]]
id = "react-effects"
title = "Effects & Synchronization"
description = "Tránh effect thừa, cleanup, fetch an toàn, Strict Mode, layout effect và Effect Event."
sources = ["react/reference/react/useeffect", "react/learn/you-might-not-need-an-effect", "react/reference/react/strictmode", "react/reference/react/uselayouteffect", "react/reference/react/useeffectevent"]
lesson = '''
### Có thật sự cần Effect?
| Nhu cầu | Cách ưu tiên |
|---|---|
| Tính giá trị từ props/state | Tính trực tiếp trong render, memo nếu cần |
| Phản hồi thao tác người dùng | Xử lý trong event handler |
| Đồng bộ với hệ thống ngoài React | `useEffect` và cleanup |
| Đo layout trước paint | `useLayoutEffect`, dùng tiết kiệm |

```jsx
useEffect(() => {
  const controller = new AbortController();
  loadUser(userId, { signal: controller.signal });
  return () => controller.abort();
}, [userId]);
```

Cleanup chạy trước khi effect đồng bộ lại với dependency mới và khi component rời cây. Strict Mode trong development chạy thêm setup-cleanup để phát hiện vòng đời không đối xứng. `useEffectEvent` cho phép effect gọi logic cần đọc giá trị mới nhất mà không đăng ký lại tài nguyên chỉ vì giá trị đó đổi.

### Lỗi hay gặp
- Dùng effect để copy props vào state rồi phải đồng bộ hai nguồn dữ liệu.
- Bỏ cleanup khiến timer hoặc subscription cũ tiếp tục hoạt động.
- Chỉ bỏ qua kết quả fetch cũ nhưng không hủy request khi có thể hủy.
- Dùng `useLayoutEffect` cho công việc không cần hoàn tất trước paint.

### Checklist phỏng vấn
- Effect đang đồng bộ với hệ thống bên ngoài nào?
- Cleanup có hủy đúng tài nguyên của lần setup tương ứng không?
- Có thể đưa logic vào render hoặc event handler không?
'''

[[modules]]
id = "react-forms-a11y"
title = "Forms & Accessibility"
description = "Controlled forms, validation, focus, ARIA và modal qua portal."
sources = ["react/reference/react-dom/components/form", "react/reference/react-dom/components/input", "react/reference/react-dom/createportal"]
lesson = '''
### Form có thể sử dụng được
| Kiểu input | Giá trị ban đầu | Ai giữ giá trị? |
|---|---|---|
| Controlled | `value` / `checked` | React state qua `onChange` |
| Uncontrolled | `defaultValue` / `defaultChecked` | DOM, đọc khi cần qua ref/FormData |

```jsx
<label htmlFor="email">Email</label>
<input id="email" value={email} onChange={event => setEmail(event.target.value)} aria-invalid={Boolean(error)} aria-describedby="email-error" />
<p id="email-error">{error}</p>
```

Validation cần gắn thông báo với field; sau submit thất bại, đưa focus tới field đầu tiên có lỗi. Dùng label thật, giữ thao tác bàn phím và trạng thái lỗi có thể nhận biết bằng công nghệ hỗ trợ. Portal phù hợp cho modal, nhưng modal vẫn phải quản lý focus vào/ra, Escape, tên accessible và khóa tương tác nền.

### Lỗi hay gặp
- Dùng placeholder thay label hoặc chỉ đổi màu để biểu thị lỗi.
- Đặt `aria-invalid` nhưng không liên kết thông báo bằng `aria-describedby`.
- Hiển thị lỗi sau submit nhưng giữ focus ở nút gửi.
- Tạo modal portal nhưng không giữ và trả focus cho nút mở modal.

### Checklist phỏng vấn
- Field có accessible name và trạng thái lỗi như thế nào?
- Controlled và uncontrolled khác nhau ở nơi giữ dữ liệu nào?
- Sau submit lỗi, người dùng bàn phím sẽ được đưa tới đâu?
'''

[[modules]]
id = "react-testing-arch"
title = "Testing & Component Architecture"
description = "Truy vấn theo role, tổ chức module, state colocation, context/store, error boundary và lazy loading."
sources = ["react/reference/react/act", "react/reference/react/createcontext", "react/reference/react/lazy", "react/reference/react/suspense"]
lesson = '''
### Tổ chức và kiểm thử
| Bài toán | Hướng chọn | Trade-off |
|---|---|---|
| Kiểm thử giao diện | Query theo role và accessible name | Gần với cách người dùng tìm điều khiển |
| State chỉ dùng trong một vùng | Đặt gần component sở hữu vùng đó | Giảm phụ thuộc và render lan rộng |
| Dữ liệu chia sẻ trong một cây | Context | Provider value đổi làm consumer cập nhật |
| Subscription lớn, cập nhật chọn lọc | Store có selector | Thêm khái niệm và cơ chế subscription |

```jsx
const Page = lazy(() => import('./Page'));
<Suspense fallback={<p>Loading</p>}><Page /></Suspense>
```

Testing Library thường ưu tiên `getByRole('button', { name: 'Save' })`; dùng `findByRole` cho xuất hiện bất đồng bộ. Error Boundary phục hồi vùng render lỗi; `lazy` tách chunk và cần Suspense boundary. Đặt state gần nơi dùng giúp giới hạn số component phụ thuộc, rồi chỉ nâng lên khi nhiều vùng thật sự cần cùng dữ liệu.

### Lỗi hay gặp
- Query theo class hoặc cấu trúc DOM dễ vỡ thay vì role/name.
- Đẩy mọi state lên root hoặc đưa mọi thứ vào context từ đầu.
- Nghĩ context tự cung cấp subscription theo từng field.
- Thiếu fallback khi component lazy đang tải.

### Checklist phỏng vấn
- State này có thể đặt thấp hơn mà vẫn phục vụ mọi consumer không?
- Test kiểm tra hành vi người dùng hay chi tiết implementation?
- Khi nào context đủ dùng và khi nào cần external store có selector?
'''

[[modules]]
id = "react-dv-rules"
title = "Rules of React & Linting"
description = "Purity khi render, Rules of Hooks, cập nhật bất biến và các cảnh báo từ eslint-plugin-react-hooks."
sources = ["react/reference/rules", "react/reference/rules/components-and-hooks-must-be-pure", "react/reference/rules/rules-of-hooks", "react/reference/eslint-plugin-react-hooks/lints/immutability", "react/reference/eslint-plugin-react-hooks/lints/exhaustive-deps", "react/reference/eslint-plugin-react-hooks/lints/set-state-in-render"]
lesson = '''
### Vì sao React cần các quy tắc này?
React cần component và hook có thể được gọi lại an toàn. Trong lúc render, cùng props, state và context nên tạo cùng kết quả; render không nên sửa dữ liệu bên ngoài, đăng ký listener hay khởi chạy công việc có tác dụng phụ. React có thể render lại, tạm dừng hoặc thử lại một nhánh, nên việc render thuần giúp giao diện không phụ thuộc số lần hàm được gọi.

| Quy tắc | Cách làm phù hợp | Dấu hiệu vi phạm |
|---|---|---|
| Component thuần | Tính JSX từ props/state; xử lý thao tác trong event | `Date.now()` làm nội dung đổi giữa các lần render |
| Gọi Hook đúng thứ tự | Gọi ở đầu function component/custom hook | Hook nằm trong `if`, vòng lặp hoặc callback thường |
| Bất biến | Tạo array/object mới khi cập nhật | `push`, `sort` hoặc gán field lên props/state |
| Dependency đầy đủ | Khai báo giá trị reactive mà Effect/Callback đọc | Closure dùng giá trị cũ hoặc lint báo thiếu deps |

```jsx
function addTodo(todos, todo) {
  return [...todos, todo];
}

function TodoCount({ todos }) {
  return <p>{todos.length} items</p>;
}
```

`eslint-plugin-react-hooks` kiểm tra Rules of Hooks, dependency, tính bất biến và một số mẫu cập nhật state nguy hiểm. Hãy xử lý chẩn đoán thay vì tắt lint hàng loạt; các quy tắc này cũng giúp React Compiler phân tích code đáng tin cậy hơn.

### Lỗi hay gặp
- Gọi component bằng `Child(props)` thay vì để React gọi `<Child />`.
- Gọi `useState` chỉ khi một điều kiện đúng, làm thứ tự hook thay đổi giữa các render.
- Sửa trực tiếp `props.items` bằng `sort()` rồi dùng lại mảng.
- Bỏ dependency để ép Effect không chạy lại, khiến callback dùng dữ liệu cũ.
- Gọi setter trong render để “sửa” dữ liệu; việc đó có thể tạo vòng lặp render.
'''

[[modules]]
id = "react-dv-compiler"
title = "React Compiler"
description = "Phân tích component ở build time, memoization tự động, directives và cách áp dụng tăng dần."
sources = ["react/learn/react-compiler", "react/learn/react-compiler/introduction", "react/learn/react-compiler/incremental-adoption", "react/reference/react-compiler/configuration", "react/reference/react-compiler/directives", "react/learn/react-compiler/debugging"]
lesson = '''
### Compiler làm gì?
React Compiler phân tích component và custom Hook ở build time rồi có thể tạo cache cho các giá trị hoặc component có thể tái sử dụng. Đây không phải hook chạy lúc render: code vẫn phải đúng khi chưa được tối ưu, và người viết không gọi một API compiler trong component. Mục tiêu là giảm những phép tính hoặc render lặp lại mà không đổi kết quả giao diện.

| Thành phần | Vai trò | Cách nghĩ an toàn |
|---|---|---|
| Compiler trong build | Phân tích code và thêm memoization khi đủ điều kiện | Không giả định mọi component đều được tối ưu |
| `eslint-plugin-react-hooks` | Báo các mẫu cản trở phân tích hoặc sai quy tắc | Sửa lỗi theo nguyên nhân, không tắt lint hàng loạt |
| Cấu hình/gating | Chọn phạm vi và cách đưa compiler vào ứng dụng | Có thể triển khai từng phần và theo dõi kết quả |
| Directives | Điều khiển việc compile ở phạm vi được hỗ trợ | Chỉ dùng khi có lý do cụ thể và hiểu cấu hình |

```jsx
function ProductList({ products, query }) {
  const normalized = query.trim().toLowerCase();
  const visible = products.filter(product => product.name.toLowerCase().includes(normalized));
  return <List items={visible} />;
}
```

Hàm trên chỉ đọc đầu vào và tính kết quả; đây là dạng code dễ phân tích hơn so với việc sửa props hoặc đọc giá trị thay đổi ngầm. Dự án vẫn có thể giữ `useMemo`/`useCallback` ở nơi đã đo được lợi ích hoặc nơi identity là một phần của tích hợp hiện tại. Hãy dùng cấu hình và lint của dự án để biết code nào được compiler nhận diện.

### Lỗi hay gặp
- Nghĩ compiler tự bật chỉ vì dự án dùng React 19; cần tích hợp đúng vào build.
- Xem memoization là cơ chế đảm bảo tính đúng đắn thay vì tối ưu có thể được bỏ qua.
- Cố ép compile code có mutation hoặc side effect trong render thay vì làm code thuần.
- Xóa toàn bộ memo thủ công mà chưa kiểm tra cấu hình, profiler và hành vi ứng dụng.
- Bỏ qua chẩn đoán compiler/lint nên không biết một phần code đã bị bỏ qua.
'''

[[modules]]
id = "react-dv-ssr"
title = "SSR, Streaming & Hydration"
description = "Chọn server rendering API, stream HTML và nối React vào markup đã render mà không gây mismatch."
sources = ["react/reference/react-dom/server/rendertostring", "react/reference/react-dom/server/rendertopipeablestream", "react/reference/react-dom/server/rendertoreadablestream", "react/reference/react-dom/static/prerender", "react/reference/react-dom/client/hydrateroot", "react/reference/react-dom/client/createroot"]
lesson = '''
### HTML server và React trên trình duyệt
Server rendering tạo HTML ban đầu để trình duyệt có nội dung sớm. Với HTML có thể tương tác, client gọi `hydrateRoot` để React gắn event và tiếp tục quản lý cây hiện có. Nếu trang được dựng hoàn toàn ở client trong một container trống, dùng `createRoot`. Hydration mong markup ban đầu phía client khớp với HTML server; hai phía không được tự chọn giá trị khác nhau cho lần render đầu.

| API | Mục đích | Đặc điểm chính |
|---|---|---|
| `renderToString` | Tạo HTML dạng string | Không stream; hạn chế hơn với Suspense |
| `renderToPipeableStream` | Server runtime có Node stream | Gửi shell và nội dung theo luồng |
| `renderToReadableStream` | Runtime hỗ trợ Web Streams | Cũng hỗ trợ streaming qua `ReadableStream` |
| `prerender` | Tạo HTML tĩnh chờ dữ liệu sẵn sàng | Trả Promise khi các vùng Suspense đã hoàn tất |
| `hydrateRoot` | Hydrate markup server đã có | HTML đầu tiên của client cần khớp server |
| `createRoot` | Render ứng dụng client vào container | Không dùng để hydrate markup server |

Với streaming, server có thể gửi phần vỏ trang khi sẵn sàng rồi gửi tiếp các vùng chậm qua Suspense. Chọn API theo môi trường stream của server và cách framework quản lý script/response. Static prerender hữu ích khi muốn chờ dữ liệu hoàn tất trước khi phát HTML.

### Lỗi hay gặp
- Gọi `createRoot` trên container đã có HTML server, làm bỏ qua quy trình hydrate.
- Dùng `Date.now()`, random, dữ liệu browser hoặc locale khác nhau trong markup ban đầu.
- Cho rằng `renderToString` cũng stream hoặc xử lý mọi Suspense giống các API streaming.
- Dập mismatch bằng `suppressHydrationWarning` thay vì tìm đầu vào server/client lệch nhau.
- Gọi `hydrateRoot` nhiều lần cho cùng một root thay vì giữ root đã tạo.

### Gỡ lỗi theo thứ tự
So sánh props và dữ liệu đầu vào của server với lần render đầu trên client; kiểm tra timezone/locale, giá trị ngẫu nhiên và điều kiện phụ thuộc `window`; kiểm tra cấu trúc HTML sau khi browser parse; sau đó dùng callback lỗi phục hồi của root để thu thập chẩn đoán phù hợp.
'''

