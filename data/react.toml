[[questions]]
id = "react-xc01"
module = "react-basics"
type = "code"
difficulty = 2
lang = "javascript"
title = "useSelection"
prompt = '''
Implement `useSelection(initialIds = [])`, returning `{ selected, isSelected, toggle, clear }`.
- Start with a copy of `initialIds`.
- `toggle(id)` adds an unselected id or removes a selected id without mutating the previous array.
- `isSelected(id)` returns a boolean, and `clear()` empties the selection.
'''
starter = '''
function useSelection(initialIds = []) {
  const [selected, setSelected] = useState([]);
  return { selected, isSelected: () => false, toggle: () => {}, clear: () => setSelected([]) };
}
'''
solution = '''
function useSelection(initialIds = []) {
  const [selected, setSelected] = useState(() => [...initialIds]);
  const isSelected = (id) => selected.includes(id);
  const toggle = (id) => setSelected(current => current.includes(id)
    ? current.filter(value => value !== id)
    : [...current, id]);
  const clear = () => setSelected([]);
  return { selected, isSelected, toggle, clear };
}
'''
tests = '''
test('copies initial ids', () => {
  const ids = ['a', 'b'];
  const { result } = renderHook(() => useSelection(ids));
  expect(result.current.selected).toEqual(['a', 'b']);
  expect(result.current.selected).not.toBe(ids);
});
test('adds an unselected id', () => {
  const { result } = renderHook(() => useSelection(['a']));
  act(() => result.current.toggle('b'));
  expect(result.current.selected).toEqual(['a', 'b']);
});
test('removes a selected id', () => {
  const { result } = renderHook(() => useSelection(['a', 'b']));
  act(() => result.current.toggle('a'));
  expect(result.current.selected).toEqual(['b']);
});
test('reports selection and clears it', () => {
  const { result } = renderHook(() => useSelection(['a']));
  expect(result.current.isSelected('a')).toBe(true);
  expect(result.current.isSelected('b')).toBe(false);
  act(() => result.current.clear());
  expect(result.current.selected).toEqual([]);
});
'''
hints = ["Use a functional state update to avoid reading a stale selection.", "Return a new array from both toggle branches."]
explanation = "State cục bộ có identity riêng cho từng component. Cập nhật bất biến giúp React nhận ra thay đổi và giữ logic selection dễ kiểm thử."

[[questions]]
id = "react-xc02"
module = "react-state"
type = "code"
difficulty = 3
lang = "javascript"
title = "Task reducer"
prompt = '''
Implement `taskReducer(state, action)` and `useTaskList(initialTodos = [])`. State has `{ todos, filter }`; each todo has `{ id, text, done }`.
Support actions `{type:'add', todo}`, `{type:'toggle', id}`, `{type:'remove', id}`, `{type:'clearDone'}`, and `{type:'setFilter', filter}`. Never mutate the existing state or array. The hook returns the `[state, dispatch]` tuple from `useReducer`.
'''
starter = '''
function taskReducer(state, action) {
  return state;
}
function useTaskList(initialTodos = []) {
  return useReducer(taskReducer, { todos: initialTodos, filter: 'all' });
}
'''
solution = '''
function taskReducer(state, action) {
  switch (action.type) {
    case 'add':
      return { ...state, todos: [...state.todos, { ...action.todo }] };
    case 'toggle':
      return { ...state, todos: state.todos.map(todo => todo.id === action.id ? { ...todo, done: !todo.done } : todo) };
    case 'remove':
      return { ...state, todos: state.todos.filter(todo => todo.id !== action.id) };
    case 'clearDone':
      return { ...state, todos: state.todos.filter(todo => !todo.done) };
    case 'setFilter':
      return { ...state, filter: action.filter };
    default:
      return state;
  }
}
function useTaskList(initialTodos = []) {
  const initialState = { todos: initialTodos.map(todo => ({ ...todo })), filter: 'all' };
  return useReducer(taskReducer, initialState);
}
'''
tests = '''
test('adds without mutating the old state', () => {
  const initial = { todos: [], filter: 'all' };
  const next = taskReducer(initial, { type: 'add', todo: { id: 1, text: 'Read', done: false } });
  expect(next.todos).toHaveLength(1);
  expect(initial.todos).toHaveLength(0);
});
test('toggles only the matching todo', () => {
  const state = { todos: [{ id: 1, text: 'A', done: false }, { id: 2, text: 'B', done: false }], filter: 'all' };
  const next = taskReducer(state, { type: 'toggle', id: 2 });
  expect(next.todos[0].done).toBe(false);
  expect(next.todos[1].done).toBe(true);
});
test('removes by id', () => {
  const state = { todos: [{ id: 1 }, { id: 2 }], filter: 'all' };
  expect(taskReducer(state, { type: 'remove', id: 1 }).todos).toEqual([{ id: 2 }]);
});
test('clears only completed todos', () => {
  const state = { todos: [{ id: 1, done: true }, { id: 2, done: false }], filter: 'all' };
  expect(taskReducer(state, { type: 'clearDone' }).todos).toEqual([{ id: 2, done: false }]);
});
test('updates filter and preserves it for todo actions', () => {
  const state = { todos: [], filter: 'all' };
  const filtered = taskReducer(state, { type: 'setFilter', filter: 'active' });
  expect(filtered.filter).toBe('active');
  expect(taskReducer(filtered, { type: 'add', todo: { id: 3 } }).filter).toBe('active');
});
test('hook initializes a copied list', () => {
  const todos = [{ id: 1, text: 'A', done: false }];
  const { result } = renderHook(() => useTaskList(todos));
  expect(result.current[0].todos).toEqual(todos);
  expect(result.current[0].todos).not.toBe(todos);
});
'''
hints = ["Handle each action in a switch and return a new outer state object.", "Use `map` for an id update and `filter` for removal."]
explanation = "Reducer gom các chuyển trạng thái liên quan thành một nơi, còn action diễn tả ý định. Mọi nhánh giữ state cũ bất biến."

[[questions]]
id = "react-xc03"
module = "react-hooks"
type = "code"
difficulty = 2
lang = "javascript"
title = "useDebouncedValue"
prompt = '''
Implement `useDebouncedValue(value, delay)`. It returns the initial value immediately, then updates to the latest value only after it has stayed unchanged for `delay` milliseconds. Clear an earlier timer when value or delay changes, and clean it up on unmount.
'''
starter = '''
function useDebouncedValue(value, delay) {
  return value;
}
'''
solution = '''
function useDebouncedValue(value, delay) {
  const [debounced, setDebounced] = useState(value);
  useEffect(() => {
    const timer = setTimeout(() => setDebounced(value), delay);
    return () => clearTimeout(timer);
  }, [value, delay]);
  return debounced;
}
'''
tests = '''
test('returns the initial value immediately', () => {
  const { result } = renderHook(props => useDebouncedValue(props.value, props.delay), { initialProps: { value: 'a', delay: 100 } });
  expect(result.current).toBe('a');
});
test('updates after the delay', () => {
  const { result, rerender } = renderHook(props => useDebouncedValue(props.value, props.delay), { initialProps: { value: 'a', delay: 100 } });
  rerender({ value: 'b', delay: 100 });
  act(() => jest.advanceTimersByTime(99));
  expect(result.current).toBe('a');
  act(() => jest.advanceTimersByTime(1));
  expect(result.current).toBe('b');
});
test('a newer value restarts the timer', () => {
  const { result, rerender } = renderHook(props => useDebouncedValue(props.value, props.delay), { initialProps: { value: 1, delay: 100 } });
  rerender({ value: 2, delay: 100 });
  act(() => jest.advanceTimersByTime(50));
  rerender({ value: 3, delay: 100 });
  act(() => jest.advanceTimersByTime(50));
  expect(result.current).toBe(1);
  act(() => jest.advanceTimersByTime(50));
  expect(result.current).toBe(3);
});
test('unmount clears the pending timer', () => {
  const { result, rerender, unmount } = renderHook(props => useDebouncedValue(props.value, props.delay), { initialProps: { value: 'old', delay: 50 } });
  rerender({ value: 'new', delay: 50 });
  unmount();
  act(() => jest.advanceTimersByTime(100));
  expect(result.current).toBe('old');
});
'''
hints = ["Schedule one timeout in the effect and return `clearTimeout` as cleanup.", "Both `value` and `delay` are reactive dependencies."]
explanation = "Cleanup hủy timer cũ trước khi effect chạy lại, bảo đảm chỉ giá trị mới nhất được công bố sau khoảng chờ."

[[questions]]
id = "react-xc04"
module = "react-perf"
type = "code"
difficulty = 2
lang = "javascript"
title = "Memoized todo selector"
prompt = '''
Implement `useVisibleTodos(todos, filter)` for filters `all`, `active`, and `completed`. Return the matching array and memoize it so the same `todos` reference and `filter` reuse the same result reference.
'''
starter = '''
function useVisibleTodos(todos, filter) {
  return todos;
}
'''
solution = '''
function useVisibleTodos(todos, filter) {
  return useMemo(() => {
    if (filter === 'active') return todos.filter(todo => !todo.completed);
    if (filter === 'completed') return todos.filter(todo => todo.completed);
    return todos;
  }, [todos, filter]);
}
'''
tests = '''
test('all returns every todo', () => {
  const todos = [{ completed: false }, { completed: true }];
  const { result } = renderHook(() => useVisibleTodos(todos, 'all'));
  expect(result.current).toBe(todos);
});
test('active filters completed todos out', () => {
  const todos = [{ id: 1, completed: false }, { id: 2, completed: true }];
  const { result } = renderHook(() => useVisibleTodos(todos, 'active'));
  expect(result.current).toEqual([{ id: 1, completed: false }]);
});
test('completed keeps completed todos', () => {
  const todos = [{ id: 1, completed: false }, { id: 2, completed: true }];
  const { result } = renderHook(() => useVisibleTodos(todos, 'completed'));
  expect(result.current).toEqual([{ id: 2, completed: true }]);
});
test('same dependencies reuse the result', () => {
  const todos = [{ completed: false }];
  const { result, rerender } = renderHook(() => useVisibleTodos(todos, 'active'));
  const first = result.current;
  rerender();
  expect(result.current).toBe(first);
});
test('new filter recalculates the result', () => {
  const todos = [{ completed: false }, { completed: true }];
  const { result, rerender } = renderHook(filter => useVisibleTodos(todos, filter), { initialProps: 'active' });
  const first = result.current;
  rerender('completed');
  expect(result.current).not.toBe(first);
  expect(result.current).toEqual([{ completed: true }]);
});
'''
hints = ["Use `useMemo` with both input references in the dependency list.", "Do not use memoization as the source of truth for todo state."]
explanation = "Selector memoization avoids repeating a derived calculation when its actual inputs are unchanged; it is a performance aid, not state storage."

[[questions]]
id = "react-xc05"
module = "react-patterns"
type = "code"
difficulty = 3
lang = "javascript"
title = "Memoized context selector"
prompt = '''
Implement `createContextSelector(selector)`, returning a function that accepts a context value and caches the selected result. If the same context object is passed again, do not call `selector` again. If a new context object produces the identical selected value by `Object.is`, preserve the selected value reference. Each created selector must keep its own cache.
'''
starter = '''
function createContextSelector(selector) {
  return value => selector(value);
}
'''
solution = '''
function createContextSelector(selector) {
  let initialized = false;
  let previousContext;
  let previousSelection;
  return (contextValue) => {
    if (initialized && Object.is(contextValue, previousContext)) return previousSelection;
    const selection = selector(contextValue);
    if (initialized && Object.is(selection, previousSelection)) {
      previousContext = contextValue;
      return previousSelection;
    }
    initialized = true;
    previousContext = contextValue;
    previousSelection = selection;
    return selection;
  };
}
'''
tests = '''
test('selects the requested value', () => {
  const selectUser = createContextSelector(value => value.user);
  const user = { id: 1 };
  expect(selectUser({ user })).toBe(user);
});
test('same context reference reuses selection without recomputing', () => {
  const selector = jest.fn(value => value.count);
  const selectCount = createContextSelector(selector);
  const context = { count: 2 };
  const first = selectCount(context);
  expect(selectCount(context)).toBe(first);
  expect(selector).toHaveBeenCalledTimes(1);
});
test('changed context with same selected value preserves result', () => {
  const user = { id: 7 };
  const selectUser = createContextSelector(value => value.user);
  const first = selectUser({ user, theme: 'light' });
  const next = selectUser({ user, theme: 'dark' });
  expect(next).toBe(first);
});
test('changed selected value returns new selection', () => {
  const selectCount = createContextSelector(value => value.count);
  expect(selectCount({ count: 1 })).toBe(1);
  expect(selectCount({ count: 2 })).toBe(2);
});
test('each selector owns a separate cache', () => {
  const first = createContextSelector(value => value.a);
  const second = createContextSelector(value => value.b);
  const context = { a: 1, b: 2 };
  expect(first(context)).toBe(1);
  expect(second(context)).toBe(2);
});
'''
hints = ["Keep one previous input and selected result in the returned closure.", "This cache stabilizes a value; by itself it does not prevent a `useContext` consumer from rendering."]
explanation = "Selector này giữ referential stability cho kết quả được chọn. Để bỏ qua cập nhật subscription theo field, ứng dụng cần cơ chế subscription chọn lọc; memo selector đơn lẻ không chặn render do Context."

[[questions]]
id = "react-xc06"
module = "react-perf"
type = "code"
difficulty = 2
lang = "javascript"
title = "Virtual list range"
prompt = '''
Implement `getVisibleRange(total, itemHeight, scrollTop, viewportHeight, overscan = 0)`. Return `{ start, end }`, where `end` is exclusive. Clamp the range to `[0, total]`, allow negative `scrollTop` by treating it as zero, and include `overscan` rows on each side. Assume numeric inputs are finite, `total` and `overscan` are nonnegative integers, and `itemHeight` is positive.
'''
starter = '''
function getVisibleRange(total, itemHeight, scrollTop, viewportHeight, overscan = 0) {
  return { start: 0, end: total };
}
'''
solution = '''
function getVisibleRange(total, itemHeight, scrollTop, viewportHeight, overscan = 0) {
  const top = Math.max(0, scrollTop);
  const start = Math.min(total, Math.max(0, Math.floor(top / itemHeight) - overscan));
  const end = Math.min(total, Math.ceil((top + viewportHeight) / itemHeight) + overscan);
  return { start, end: Math.max(start, end) };
}
'''
tests = '''
test('covers visible rows at the top', () => {
  expect(getVisibleRange(100, 20, 0, 60)).toEqual({ start: 0, end: 3 });
});
test('adds overscan before and after', () => {
  expect(getVisibleRange(100, 20, 100, 40, 2)).toEqual({ start: 3, end: 9 });
});
test('clamps a negative scroll position', () => {
  expect(getVisibleRange(10, 10, -50, 20)).toEqual({ start: 0, end: 2 });
});
test('clamps the end at the item count', () => {
  expect(getVisibleRange(8, 10, 70, 50, 2)).toEqual({ start: 5, end: 8 });
});
test('handles an empty list and zero viewport', () => {
  expect(getVisibleRange(0, 10, 0, 20)).toEqual({ start: 0, end: 0 });
  expect(getVisibleRange(10, 10, 30, 0)).toEqual({ start: 3, end: 3 });
});
'''
hints = ["Use `floor` for the first row and `ceil` for the exclusive end.", "Clamp both values and keep `end` at least `start`."]
explanation = "Virtualization chỉ render phần hàng giao với viewport cộng overscan. Dùng end exclusive giúp truyền range trực tiếp vào `slice(start, end)`."

[[questions]]
id = "react-xc07"
module = "react-19"
type = "code"
difficulty = 3
lang = "javascript"
title = "Optimistic list state"
prompt = '''
Implement a small hook simulation `useOptimisticList(initialItems = [])`. It returns `{ items, addOptimistic, commit, rollback }`.
- `addOptimistic(tempItem)` appends a temporary item to the visible list.
- `commit(tempId, savedItem)` removes that temporary item and appends the server item to the canonical list.
- `rollback(tempId)` removes that temporary item without changing canonical items.
Use `useReducer`; do not mutate arrays. This exercise models the state transitions, not React's `useOptimistic` API itself.
'''
starter = '''
function useOptimisticList(initialItems = []) {
  return { items: initialItems, addOptimistic: () => {}, commit: () => {}, rollback: () => {} };
}
'''
solution = '''
function optimisticListReducer(state, action) {
  switch (action.type) {
    case 'add':
      return { ...state, pending: [...state.pending, action.item] };
    case 'commit':
      return {
        base: [...state.base, action.savedItem],
        pending: state.pending.filter(item => item.id !== action.tempId),
      };
    case 'rollback':
      return { ...state, pending: state.pending.filter(item => item.id !== action.tempId) };
    default:
      return state;
  }
}
function useOptimisticList(initialItems = []) {
  const [state, dispatch] = useReducer(optimisticListReducer, {
    base: initialItems.map(item => ({ ...item })),
    pending: [],
  });
  return {
    items: [...state.base, ...state.pending],
    addOptimistic: (item) => dispatch({ type: 'add', item }),
    commit: (tempId, savedItem) => dispatch({ type: 'commit', tempId, savedItem }),
    rollback: (tempId) => dispatch({ type: 'rollback', tempId }),
  };
}
'''
tests = '''
test('starts with a copy of canonical items', () => {
  const items = [{ id: 1, text: 'Saved' }];
  const { result } = renderHook(() => useOptimisticList(items));
  expect(result.current.items).toEqual(items);
  expect(result.current.items).not.toBe(items);
});
test('shows an optimistic item immediately', () => {
  const { result } = renderHook(() => useOptimisticList([{ id: 1 }]));
  act(() => result.current.addOptimistic({ id: 'tmp-1', text: 'Sending' }));
  expect(result.current.items).toEqual([{ id: 1 }, { id: 'tmp-1', text: 'Sending' }]);
});
test('commit replaces the temporary item with the saved item', () => {
  const { result } = renderHook(() => useOptimisticList([{ id: 1 }]));
  act(() => result.current.addOptimistic({ id: 'tmp-1', text: 'Draft' }));
  act(() => result.current.commit('tmp-1', { id: 2, text: 'Saved' }));
  expect(result.current.items).toEqual([{ id: 1 }, { id: 2, text: 'Saved' }]);
});
test('rollback removes the temporary item only', () => {
  const { result } = renderHook(() => useOptimisticList([{ id: 1 }]));
  act(() => result.current.addOptimistic({ id: 'tmp-1' }));
  act(() => result.current.rollback('tmp-1'));
  expect(result.current.items).toEqual([{ id: 1 }]);
});
test('rollback of an unknown id preserves visible items', () => {
  const { result } = renderHook(() => useOptimisticList([{ id: 1 }]));
  act(() => result.current.rollback('missing'));
  expect(result.current.items).toEqual([{ id: 1 }]);
});
'''
hints = ["Keep canonical items and temporary items in separate reducer fields.", "On commit, append the server value and remove the matching temporary id."]
explanation = "Tách state chuẩn khỏi phần hiển thị tạm giúp commit và rollback rõ ràng; ứng dụng thật thường dùng trực tiếp `useOptimistic` trong action/transition."

[[questions]]
id = "react-xc08"
module = "react-19"
type = "code"
difficulty = 2
lang = "javascript"
title = "Profile action reducer"
prompt = '''
Implement `saveProfile(previousState, fields)` as the state action passed to `useActionState`.
- Trim `fields.name`.
- If the name is missing or blank, preserve the previous name and return error `'Name is required'`.
- Otherwise return the trimmed name and an empty error string.
- Never mutate `previousState`.
The state shape is `{ name, error }`.
'''
starter = '''
function saveProfile(previousState, fields) {
  return previousState;
}
'''
solution = '''
function saveProfile(previousState, fields) {
  const name = typeof fields.name === 'string' ? fields.name.trim() : '';
  if (!name) return { ...previousState, error: 'Name is required' };
  return { ...previousState, name, error: '' };
}
'''
tests = '''
test('trims a valid name and clears an old error', () => {
  expect(saveProfile({ name: 'Old', error: 'Previous' }, { name: '  Linh  ' })).toEqual({ name: 'Linh', error: '' });
});
test('blank name preserves previous name and returns error', () => {
  expect(saveProfile({ name: 'Old', error: '' }, { name: '   ' })).toEqual({ name: 'Old', error: 'Name is required' });
});
test('missing name is invalid', () => {
  expect(saveProfile({ name: 'Old', error: '' }, {})).toEqual({ name: 'Old', error: 'Name is required' });
});
test('does not mutate previous state', () => {
  const previous = { name: 'Old', error: '' };
  saveProfile(previous, { name: 'New' });
  expect(previous).toEqual({ name: 'Old', error: '' });
});
test('keeps unrelated state fields', () => {
  expect(saveProfile({ name: 'Old', error: '', version: 2 }, { name: 'New' }).version).toBe(2);
});
'''
hints = ["Treat the action as a pure transition from previous state plus submitted fields.", "Spread previous state in both branches so extra fields survive."]
explanation = "Action nhận state trước đó và dữ liệu submit, rồi trả state mới để `useActionState` công bố; validation server vẫn cần thiết trong ứng dụng thật."

[[questions]]
id = "react-xc09"
module = "react-server"
type = "code"
difficulty = 3
lang = "javascript"
title = "Suspense resource reader"
prompt = '''
Implement `createResource(promise)` returning `{ read }` for a Suspense-style resource.
- While pending, `read()` throws the same pending promise.
- After fulfillment, `read()` returns the value.
- After rejection, `read()` throws the rejection error.
Do not create a new Promise from `read()`.
'''
starter = '''
function createResource(promise) {
  return { read: () => undefined };
}
'''
solution = '''
function createResource(promise) {
  let status = 'pending';
  let result;
  const pending = Promise.resolve(promise).then(
    value => { status = 'success'; result = value; },
    error => { status = 'error'; result = error; }
  );
  return {
    read() {
      if (status === 'pending') throw pending;
      if (status === 'error') throw result;
      return result;
    },
  };
}
'''
tests = '''
test('throws the same pending promise while unresolved', () => {
  const resource = createResource(new Promise(() => {}));
  let first;
  let second;
  try { resource.read(); } catch (error) { first = error; }
  try { resource.read(); } catch (error) { second = error; }
  expect(first).toBeInstanceOf(Promise);
  expect(second).toBe(first);
});
test('returns the resolved value', async () => {
  let resolve;
  const resource = createResource(new Promise(r => { resolve = r; }));
  resolve(42);
  await Promise.resolve();
  await Promise.resolve();
  expect(resource.read()).toBe(42);
});
test('throws a rejected error after settlement', async () => {
  const error = new Error('failed');
  const resource = createResource(Promise.reject(error));
  await Promise.resolve();
  await Promise.resolve();
  expect(() => resource.read()).toThrow('failed');
});
test('keeps a fulfilled value stable across reads', async () => {
  const value = { id: 1 };
  const resource = createResource(Promise.resolve(value));
  await Promise.resolve();
  await Promise.resolve();
  expect(resource.read()).toBe(value);
  expect(resource.read()).toBe(value);
});
'''
hints = ["Store status and result in the resource closure.", "Attach both fulfillment and rejection handlers so the resource can later return or throw the settled result."]
explanation = "Suspense-compatible readers throw a stable thenable while pending and later either return data or throw the stored error. Framework data APIs usually manage this protocol for applications."

[[questions]]
id = "react-xc10"
module = "react-effects"
type = "code"
difficulty = 3
lang = "javascript"
title = "useFetch with cancellation and race guard"
prompt = '''
Implement `useFetch(key, fetcher)` returning `{ status, data, error }` with initial pending state. Call `fetcher(key, signal)` in an effect; it returns a Promise. `signal` is a small test-harness token with writable `aborted` and `onabort` fields; call `onabort` during cleanup to cancel a timer-backed request. Ignore any completion from an old key or after unmount, even if the fetcher cannot cancel. Dependencies are `[key, fetcher]`; callers keep `fetcher` stable.
'''
starter = '''
function useFetch(key, fetcher) {
  const [state] = useState({ status: 'pending', data: undefined, error: undefined });
  return state;
}
'''
solution = '''
function useFetch(key, fetcher) {
  const [state, setState] = useState({ status: 'pending', data: undefined, error: undefined });
  useEffect(() => {
    let ignore = false;
    const signal = { aborted: false, onabort: null };
    setState({ status: 'pending', data: undefined, error: undefined });
    let request;
    try {
      request = fetcher(key, signal);
    } catch (error) {
      request = Promise.reject(error);
    }
    Promise.resolve(request).then(
      data => {
        if (!ignore && !signal.aborted) setState({ status: 'success', data, error: undefined });
      },
      error => {
        if (!ignore && !signal.aborted) setState({ status: 'error', data: undefined, error });
      }
    );
    return () => {
      ignore = true;
      signal.aborted = true;
      if (typeof signal.onabort === 'function') signal.onabort();
    };
  }, [key, fetcher]);
  return state;
}
'''
tests = '''
test('starts pending and resolves a timer-backed request', async () => {
  const fetcher = (key) => new Promise(resolve => setTimeout(() => resolve('data-' + key), 20));
  const { result } = renderHook(props => useFetch(props.key, props.fetcher), { initialProps: { key: 'a', fetcher } });
  expect(result.current.status).toBe('pending');
  await Promise.resolve();
  act(() => jest.advanceTimersByTime(20));
  await Promise.resolve();
  await Promise.resolve();
  expect(result.current).toEqual({ status: 'success', data: 'data-a', error: undefined });
});
test('cleanup aborts the timer-backed request', async () => {
  const signals = [];
  const fetcher = (key, currentSignal) => new Promise(resolve => {
    signals.push(currentSignal);
    const timer = setTimeout(() => resolve(key), 100);
    currentSignal.onabort = () => clearTimeout(timer);
  });
  const { rerender } = renderHook(props => useFetch(props.key, props.fetcher), { initialProps: { key: 'a', fetcher } });
  rerender({ key: 'b', fetcher });
  expect(signals[0].aborted).toBe(true);
});
test('a stale non-cancellable result cannot overwrite the latest key', async () => {
  const resolvers = {};
  const fetcher = key => new Promise(resolve => { resolvers[key] = resolve; });
  const { result, rerender } = renderHook(props => useFetch(props.key, props.fetcher), { initialProps: { key: 'old', fetcher } });
  await Promise.resolve();
  rerender({ key: 'new', fetcher });
  await Promise.resolve();
  resolvers.new('new-data');
  await Promise.resolve();
  await Promise.resolve();
  resolvers.old('old-data');
  await Promise.resolve();
  await Promise.resolve();
  expect(result.current.data).toBe('new-data');
});
test('stores a request error', async () => {
  const error = new Error('offline');
  const fetcher = () => Promise.reject(error);
  const { result } = renderHook(() => useFetch('a', fetcher));
  await Promise.resolve();
  await Promise.resolve();
  expect(result.current.status).toBe('error');
  expect(result.current.error).toBe(error);
});
test('cleanup on unmount marks the request aborted', async () => {
  let signal;
  const fetcher = (key, currentSignal) => {
    signal = currentSignal;
    return new Promise(() => {});
  };
  const { unmount } = renderHook(() => useFetch('a', fetcher));
  await Promise.resolve();
  unmount();
  expect(signal.aborted).toBe(true);
});
'''
hints = ["Create a fresh cancellation token per effect setup and mark it aborted in cleanup.", "Guard both resolve and reject paths with the cleanup flag.", "Resolve the newest request first in a race test, then resolve the stale one."]
explanation = "Cleanup hủy thao tác có hỗ trợ token; cờ `ignore` vẫn chặn completion cũ nếu transport không hủy được. Trong ứng dụng thật dùng `AbortController`/signal chuẩn cùng kiểm tra ownership của request."

[[questions]]
id = "react-xc11"
module = "react-effects"
type = "code"
difficulty = 3
lang = "javascript"
title = "useThrottledValue"
prompt = '''
Implement `useThrottledValue(value, delay)`. Return the first value immediately. For later value changes, publish immediately when at least `delay` milliseconds passed since the last publication; otherwise publish the latest value when the remaining interval expires. Clear a pending timer when inputs change or the hook unmounts.
'''
starter = '''
function useThrottledValue(value, delay) {
  return value;
}
'''
solution = '''
function useThrottledValue(value, delay) {
  const [throttled, setThrottled] = useState(value);
  const latest = useRef(value);
  const previous = useRef({ value, delay });
  const lastPublished = useRef(Date.now());
  latest.current = value;
  useEffect(() => {
    if (Object.is(previous.current.value, value) && previous.current.delay === delay) return;
    previous.current = { value, delay };
    const remaining = delay - (Date.now() - lastPublished.current);
    if (remaining <= 0) {
      lastPublished.current = Date.now();
      setThrottled(value);
      return;
    }
    const timer = setTimeout(() => {
      lastPublished.current = Date.now();
      setThrottled(latest.current);
    }, remaining);
    return () => clearTimeout(timer);
  }, [value, delay]);
  return throttled;
}
'''
tests = '''
test('returns the first value immediately', () => {
  const { result } = renderHook(() => useThrottledValue('first', 100));
  expect(result.current).toBe('first');
});
test('publishes a later value after the remaining interval', () => {
  const { result, rerender } = renderHook(value => useThrottledValue(value, 100), { initialProps: 0 });
  rerender(1);
  expect(result.current).toBe(0);
  act(() => jest.advanceTimersByTime(100));
  expect(result.current).toBe(1);
});
test('publishes the latest value after repeated changes', () => {
  const { result, rerender } = renderHook(value => useThrottledValue(value, 100), { initialProps: 'a' });
  rerender('b');
  act(() => jest.advanceTimersByTime(40));
  rerender('c');
  act(() => jest.advanceTimersByTime(60));
  expect(result.current).toBe('c');
});
test('publishes immediately after the throttle window has passed', () => {
  const { result, rerender } = renderHook(value => useThrottledValue(value, 100), { initialProps: 0 });
  act(() => jest.advanceTimersByTime(100));
  rerender(2);
  expect(result.current).toBe(2);
});
test('unmount cancels a trailing timer', () => {
  const { result, rerender, unmount } = renderHook(value => useThrottledValue(value, 100), { initialProps: 'a' });
  rerender('b');
  unmount();
  act(() => jest.advanceTimersByTime(100));
  expect(result.current).toBe('a');
});
'''
hints = ["Track the last publication time in a ref and the newest value in another ref.", "A cleanup should clear the timeout; the timeout callback should read the latest ref."]
explanation = "Hook phát giá trị đầu ngay, sau đó giới hạn tần suất cập nhật nhưng vẫn giữ giá trị cuối cùng trong khoảng chờ."

[[questions]]
id = "react-xc12"
module = "react-effects"
type = "code"
difficulty = 2
lang = "javascript"
title = "useIntervalCounter cleanup"
prompt = '''
Implement `useIntervalCounter(delay)`, returning a count that starts at zero and increases by one on each interval tick. Restart the interval when `delay` changes and clear it on unmount. Use a functional state update so ticks never use a stale count.
'''
starter = '''
function useIntervalCounter(delay) {
  const [count] = useState(0);
  return count;
}
'''
solution = '''
function useIntervalCounter(delay) {
  const [count, setCount] = useState(0);
  useEffect(() => {
    const timer = setInterval(() => setCount(value => value + 1), delay);
    return () => clearInterval(timer);
  }, [delay]);
  return count;
}
'''
tests = '''
test('starts at zero', () => {
  const { result } = renderHook(() => useIntervalCounter(100));
  expect(result.current).toBe(0);
});
test('increments once per interval tick', () => {
  const { result } = renderHook(() => useIntervalCounter(100));
  act(() => jest.advanceTimersByTime(350));
  expect(result.current).toBe(3);
});
test('uses functional updates for repeated ticks', () => {
  const { result } = renderHook(() => useIntervalCounter(25));
  act(() => jest.advanceTimersByTime(100));
  expect(result.current).toBe(4);
});
test('restarts when delay changes', () => {
  const { result, rerender } = renderHook(delay => useIntervalCounter(delay), { initialProps: 100 });
  act(() => jest.advanceTimersByTime(100));
  expect(result.current).toBe(1);
  rerender(50);
  act(() => jest.advanceTimersByTime(100));
  expect(result.current).toBe(3);
});
test('unmount clears the interval', () => {
  const { result, unmount } = renderHook(() => useIntervalCounter(50));
  unmount();
  act(() => jest.advanceTimersByTime(200));
  expect(result.current).toBe(0);
});
'''
hints = ["Return `clearInterval(timer)` from the effect.", "Use `setCount(current => current + 1)` inside the interval callback."]
explanation = "Cleanup đối xứng với setup, còn functional updater đọc state mới nhất mà không phải đăng ký lại interval mỗi tick."

[[questions]]
id = "react-xc13"
module = "react-forms-a11y"
type = "code"
difficulty = 3
lang = "javascript"
title = "useFormValidation"
prompt = '''
Implement `useFormValidation(initialValues, validateValues)`, returning `{ values, errors, setValue, validate, reset }`.
- `validateValues(values)` returns an object whose keys map to nonempty error strings.
- Before the first `validate()`, expose no errors.
- `validate()` reveals current errors and returns `true` only when there are none.
- `setValue(name, value)` updates one field immutably; visible errors must reflect the current values.
- `reset()` restores a copy of the initial values and hides errors.
'''
starter = '''
function useFormValidation(initialValues, validateValues) {
  const [values] = useState(initialValues);
  return { values, errors: {}, setValue: () => {}, validate: () => true, reset: () => {} };
}
'''
solution = '''
function useFormValidation(initialValues, validateValues) {
  const [values, setValues] = useState(() => ({ ...initialValues }));
  const [showErrors, setShowErrors] = useState(false);
  const errors = showErrors ? validateValues(values) : {};
  const setValue = (name, value) => setValues(current => ({ ...current, [name]: value }));
  const validate = () => {
    setShowErrors(true);
    return Object.keys(validateValues(values)).length === 0;
  };
  const reset = () => {
    setValues({ ...initialValues });
    setShowErrors(false);
  };
  return { values, errors, setValue, validate, reset };
}
'''
tests = '''
const validateAccount = values => ({
  ...(!values.email.includes('@') ? { email: 'Enter a valid email' } : {}),
  ...(values.password.length < 8 ? { password: 'Use at least 8 characters' } : {}),
});
test('hides errors before validation', () => {
  const { result } = renderHook(() => useFormValidation({ email: '', password: '' }, validateAccount));
  expect(result.current.errors).toEqual({});
});
test('reveals all current errors and returns false', () => {
  const { result } = renderHook(() => useFormValidation({ email: '', password: '' }, validateAccount));
  let valid;
  act(() => { valid = result.current.validate(); });
  expect(valid).toBe(false);
  expect(result.current.errors).toEqual({ email: 'Enter a valid email', password: 'Use at least 8 characters' });
});
test('updates a field immutably and recalculates visible errors', () => {
  const { result } = renderHook(() => useFormValidation({ email: '', password: '' }, validateAccount));
  act(() => result.current.validate());
  act(() => result.current.setValue('email', 'a@example.test'));
  expect(result.current.values.email).toBe('a@example.test');
  expect(result.current.errors.email).toBeUndefined();
  expect(result.current.errors.password).toBe('Use at least 8 characters');
});
test('returns true when every field is valid', () => {
  const { result } = renderHook(() => useFormValidation({ email: 'a@example.test', password: '12345678' }, validateAccount));
  let valid;
  act(() => { valid = result.current.validate(); });
  expect(valid).toBe(true);
  expect(result.current.errors).toEqual({});
});
test('reset restores values and hides errors', () => {
  const { result } = renderHook(() => useFormValidation({ email: 'a@example.test', password: '12345678' }, validateAccount));
  act(() => result.current.setValue('email', 'bad'));
  act(() => result.current.validate());
  act(() => result.current.reset());
  expect(result.current.values.email).toBe('a@example.test');
  expect(result.current.errors).toEqual({});
});
'''
hints = ["Keep a `showErrors` flag and derive the error object from the current values.", "Use a functional update when changing one field."]
explanation = "Errors are derived from the current values instead of copied into separate state, preventing stale validation messages after edits."

[[questions]]
id = "react-xc14"
module = "react-forms-a11y"
type = "code"
difficulty = 2
lang = "javascript"
title = "First invalid field"
prompt = '''
Implement `firstInvalidField(errors, fieldOrder)`. Return the first field in `fieldOrder` whose error is a nonblank string. Ignore errors for fields not in the order and return `null` when no ordered field has an error. The caller can use the result to focus the first invalid input after submit.
'''
starter = '''
function firstInvalidField(errors, fieldOrder) {
  return null;
}
'''
solution = '''
function firstInvalidField(errors, fieldOrder) {
  for (const field of fieldOrder) {
    if (typeof errors[field] === 'string' && errors[field].trim() !== '') return field;
  }
  return null;
}
'''
tests = '''
test('returns the first invalid field in visual order', () => {
  expect(firstInvalidField({ password: 'Required', email: 'Invalid' }, ['email', 'password'])).toBe('email');
});
test('skips blank error strings', () => {
  expect(firstInvalidField({ email: '  ', password: 'Required' }, ['email', 'password'])).toBe('password');
});
test('ignores errors outside the field order', () => {
  expect(firstInvalidField({ hidden: 'Invalid' }, ['email', 'password'])).toBeNull();
});
test('returns null when there are no errors', () => {
  expect(firstInvalidField({}, ['email', 'password'])).toBeNull();
});
test('preserves exact field key', () => {
  expect(firstInvalidField({ 'account-name': 'Required' }, ['account-name'])).toBe('account-name');
});
'''
hints = ["Walk `fieldOrder`, not the keys of the error object.", "Treat whitespace-only strings as empty."]
explanation = "Thứ tự field thường theo thứ tự người dùng nhìn thấy. Kết quả có thể dùng để gọi focus sau submit; việc focus DOM cần thực hiện trong component."

[[questions]]
id = "react-xc15"
module = "react-testing-arch"
type = "code"
difficulty = 3
lang = "javascript"
title = "Undo and redo history hook"
prompt = '''
Implement `useHistory(initialValue)`, returning `{ present, canUndo, canRedo, set, undo, redo, reset }`.
- `set(next)` pushes the current value to history and clears the redo stack; setting the same value by `Object.is` does nothing.
- `undo()` and `redo()` move one value between stacks and do nothing at their boundaries.
- `reset(next)` clears both stacks and sets the current value.
Use `useReducer` and do not mutate history arrays.
'''
starter = '''
function useHistory(initialValue) {
  return { present: initialValue, canUndo: false, canRedo: false, set: () => {}, undo: () => {}, redo: () => {}, reset: () => {} };
}
'''
solution = '''
function historyReducer(state, action) {
  switch (action.type) {
    case 'set':
      if (Object.is(state.present, action.value)) return state;
      return { past: [...state.past, state.present], present: action.value, future: [] };
    case 'undo':
      if (state.past.length === 0) return state;
      return {
        past: state.past.slice(0, -1),
        present: state.past[state.past.length - 1],
        future: [state.present, ...state.future],
      };
    case 'redo':
      if (state.future.length === 0) return state;
      return {
        past: [...state.past, state.present],
        present: state.future[0],
        future: state.future.slice(1),
      };
    case 'reset':
      return { past: [], present: action.value, future: [] };
    default:
      return state;
  }
}
function useHistory(initialValue) {
  const [state, dispatch] = useReducer(historyReducer, { past: [], present: initialValue, future: [] });
  return {
    present: state.present,
    canUndo: state.past.length > 0,
    canRedo: state.future.length > 0,
    set: value => dispatch({ type: 'set', value }),
    undo: () => dispatch({ type: 'undo' }),
    redo: () => dispatch({ type: 'redo' }),
    reset: value => dispatch({ type: 'reset', value }),
  };
}
'''
tests = '''
test('set records the previous value', () => {
  const { result } = renderHook(() => useHistory('a'));
  act(() => result.current.set('b'));
  expect(result.current.present).toBe('b');
  expect(result.current.canUndo).toBe(true);
  expect(result.current.canRedo).toBe(false);
});
test('undo moves the current value to redo history', () => {
  const { result } = renderHook(() => useHistory(1));
  act(() => result.current.set(2));
  act(() => result.current.undo());
  expect(result.current.present).toBe(1);
  expect(result.current.canRedo).toBe(true);
});
test('redo restores the next value', () => {
  const { result } = renderHook(() => useHistory(1));
  act(() => result.current.set(2));
  act(() => result.current.undo());
  act(() => result.current.redo());
  expect(result.current.present).toBe(2);
  expect(result.current.canRedo).toBe(false);
});
test('new edit after undo clears redo history', () => {
  const { result } = renderHook(() => useHistory(1));
  act(() => result.current.set(2));
  act(() => result.current.undo());
  act(() => result.current.set(3));
  expect(result.current.present).toBe(3);
  expect(result.current.canRedo).toBe(false);
});
test('setting the identical value creates no history entry', () => {
  const { result } = renderHook(() => useHistory(1));
  act(() => result.current.set(1));
  expect(result.current.canUndo).toBe(false);
});
test('undo and redo are safe at boundaries; reset clears both', () => {
  const { result } = renderHook(() => useHistory('a'));
  act(() => result.current.undo());
  act(() => result.current.set('b'));
  act(() => result.current.reset('fresh'));
  act(() => result.current.redo());
  expect(result.current.present).toBe('fresh');
  expect(result.current.canUndo).toBe(false);
  expect(result.current.canRedo).toBe(false);
});
'''
hints = ["Store `past`, `present`, and `future` in one reducer state.", "A new edit after undo must discard the old future branch."]
explanation = "History là state transition phù hợp với reducer. Test riêng hook bằng renderHook/act để xác nhận hành vi undo-redo và giới hạn lịch sử."

