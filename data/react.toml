[[questions]]
id = "rx-dd06"
module = "react-hooks"
type = "code"
difficulty = 3
title = "Store ngoài cho useSyncExternalStore"
prompt = '''
`useSyncExternalStore(subscribe, getSnapshot)` cần một store có 2 hàm ổn định. Viết `createStore(initial)` trả về:

- `getSnapshot()` → state hiện tại (**cùng tham chiếu** nếu state không đổi)
- `setState(next)` — `next` là object **hoặc** hàm `(prev) => object`; **gộp nông** vào state cũ thành object mới. Nếu mọi key mới đều `Object.is` bằng giá trị cũ → **không** đổi tham chiếu & **không** thông báo
- `subscribe(listener)` → trả về hàm huỷ đăng ký; mỗi lần state đổi gọi mọi listener (không tham số)
- `select(selector)` → hàm `() => selector(getSnapshot())`
'''
starter = '''
function createStore(initial) {
  let state = initial;
  return {
    getSnapshot: () => state,
    setState: (next) => { state = next; },
    subscribe: () => () => {},
    select: (selector) => () => selector(state),
  };
}
'''
solution = '''
function createStore(initial) {
  let state = initial;
  const listeners = new Set();
  return {
    getSnapshot: () => state,
    setState(next) {
      const patch = typeof next === 'function' ? next(state) : next;
      const changed = Object.keys(patch).some((k) => !Object.is(patch[k], state[k]));
      if (!changed) return;
      state = { ...state, ...patch };
      listeners.forEach((l) => l());
    },
    subscribe(listener) {
      listeners.add(listener);
      return () => listeners.delete(listener);
    },
    select: (selector) => () => selector(state),
  };
}
'''
tests = '''
test('gộp nông & đổi tham chiếu', () => {
  const s = createStore({ count: 0, name: 'An' });
  const before = s.getSnapshot();
  s.setState({ count: 1 });
  expect(s.getSnapshot()).toEqual({ count: 1, name: 'An' });
  expect(s.getSnapshot()).not.toBe(before);
  expect(before).toEqual({ count: 0, name: 'An' });
});
test('setState nhận hàm updater', () => {
  const s = createStore({ count: 1 });
  s.setState((p) => ({ count: p.count + 10 }));
  expect(s.getSnapshot().count).toBe(11);
});
test('subscribe / unsubscribe', () => {
  const s = createStore({ n: 0 });
  const l = jest.fn();
  const off = s.subscribe(l);
  s.setState({ n: 1 });
  s.setState({ n: 2 });
  off();
  s.setState({ n: 3 });
  expect(l).toHaveBeenCalledTimes(2);
});
test('không đổi → giữ snapshot & không thông báo', () => {
  const s = createStore({ n: 1, tags: [] });
  const l = jest.fn();
  s.subscribe(l);
  const snap = s.getSnapshot();
  s.setState({ n: 1 });
  s.setState((p) => ({ tags: p.tags }));
  expect(s.getSnapshot()).toBe(snap);
  expect(l).not.toHaveBeenCalled();
});
test('select đọc state mới nhất', () => {
  const s = createStore({ items: [1, 2] });
  const count = s.select((st) => st.items.length);
  s.setState((p) => ({ items: p.items.concat(3) }));
  expect(count()).toBe(3);
});
'''
hints = ["Dùng `Set` để lưu listener; hàm huỷ chỉ cần `delete`.", "So sánh từng key bằng `Object.is` trước khi tạo object mới."]
explanation = "Snapshot phải **bất biến và ổn định**: nếu `getSnapshot` trả object mới mỗi lần gọi, `useSyncExternalStore` sẽ render vô hạn."
sources = ["react/reference/react/usesyncexternalstore"]

