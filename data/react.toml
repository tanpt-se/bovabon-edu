[[questions]]
id = "react-012"
module = "react-basics"
type = "code"
difficulty = 3
title = "Mini createElement & renderToString"
prompt = '''
Hiểu JSX bằng cách tự viết nó! Hãy cài đặt:

1. `h(type, props, ...children)` — trả về object `{ type, props }` trong đó `props.children` là **mảng đã được làm phẳng**, bỏ các giá trị `null`, `undefined`, `false`, `true`.
   `props` có thể là `null`.
2. `renderToString(node)`:
   - chuỗi/số → text (escape `&`, `<`, `>`)
   - `type` là chuỗi → `<type attr="v">children</type>`; prop `className` xuất ra `class`; bỏ qua `children` và các prop có giá trị là hàm
   - `type` là hàm → gọi `type(props)` rồi render kết quả (function component)
'''
starter = '''
function h(type, props, ...children) {
  // TODO
}

function renderToString(node) {
  // TODO
}
'''
solution = '''
function h(type, props, ...children) {
  const flat = children.flat(Infinity).filter(c => c !== null && c !== undefined && c !== false && c !== true);
  return { type, props: { ...(props || {}), children: flat } };
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderToString(node) {
  if (typeof node === 'string' || typeof node === 'number') return escapeHtml(node);
  if (Array.isArray(node)) return node.map(renderToString).join('');
  if (node === null || node === undefined || typeof node === 'boolean') return '';
  if (typeof node.type === 'function') return renderToString(node.type(node.props));
  const attrs = Object.entries(node.props)
    .filter(([k, v]) => k !== 'children' && typeof v !== 'function' && v !== undefined)
    .map(([k, v]) => ` ${k === 'className' ? 'class' : k}="${v}"`)
    .join('');
  const inner = (node.props.children || []).map(renderToString).join('');
  return `<${node.type}${attrs}>${inner}</${node.type}>`;
}
'''
tests = '''
describe('h()', () => {
  test('tạo element cơ bản', () => {
    expect(h('div', { id: 'a' }, 'hi')).toEqual({ type: 'div', props: { id: 'a', children: ['hi'] } });
  });
  test('props null', () => {
    expect(h('p', null)).toEqual({ type: 'p', props: { children: [] } });
  });
  test('làm phẳng children và bỏ giá trị rỗng', () => {
    const el = h('ul', null, [h('li', null, 'a'), [h('li', null, 'b')]], null, false, true, 0);
    expect(el.props.children.length).toBe(3);
    expect(el.props.children[2]).toBe(0);
  });
});
describe('renderToString()', () => {
  test('render thẻ lồng nhau + className', () => {
    expect(renderToString(h('div', { className: 'box' }, h('b', null, 'x'), 'y'))).toBe('<div class="box"><b>x</b>y</div>');
  });
  test('escape text', () => {
    expect(renderToString(h('p', null, '<a> & b'))).toBe('<p>&lt;a&gt; &amp; b</p>');
  });
  test('bỏ qua event handler', () => {
    expect(renderToString(h('button', { onClick: () => {} }, 'Go'))).toBe('<button>Go</button>');
  });
  test('function component nhận props + children', () => {
    const Card = (props) => h('section', { className: 'card' }, h('h2', null, props.title), props.children);
    expect(renderToString(h(Card, { title: 'T' }, 'body'))).toBe('<section class="card"><h2>T</h2>body</section>');
  });
  test('render số', () => {
    expect(renderToString(h('span', null, 0))).toBe('<span>0</span>');
  });
});
'''
hints = [
  "`children.flat(Infinity)` làm phẳng mọi cấp mảng.",
  "Trong renderToString, xử lý theo thứ tự: primitive → mảng → function component → thẻ chuỗi.",
]
explanation = "Đây chính là bản chất của JSX: chỉ là lời gọi hàm tạo object mô tả cây UI; renderer (react-dom, react-native) mới biến object đó thành giao diện thật."

# ============================================================ STATE
[[questions]]
id = "react-020"
module = "react-state"
type = "single"
difficulty = 2
prompt = '''
Sau khi click 1 lần, `count` hiển thị bao nhiêu? (ban đầu 0)

```jsx
function Counter() {
  const [count, setCount] = useState(0);
  const onClick = () => {
    setCount(count + 1);
    setCount(count + 1);
    setCount(count + 1);
  };
  return <button onClick={onClick}>{count}</button>;
}
```
'''
