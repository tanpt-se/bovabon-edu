model_answer = '''
Effect dùng để **đồng bộ với hệ thống bên ngoài** (DOM API, network, subscription). Những trường hợp không cần:

1. **Dữ liệu suy ra từ props/state** (lọc, tổng, ghép chuỗi): tính trực tiếp khi render; nếu nặng thì `useMemo`. Dùng effect + `setState` gây **render thừa** và dễ lệch dữ liệu.
2. **Phản hồi hành động người dùng** (gửi form, mua hàng, hiện toast): đặt trong **event handler**, vì ta biết chính xác sự kiện nào xảy ra.
