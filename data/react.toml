[[questions]]
id = "react-068"
module = "react-perf"
type = "code"
difficulty = 2
title = "shallowEqual cho React.memo"
prompt = '''
`React.memo` mặc định so sánh props bằng **shallow equal**. Hãy tự cài đặt `shallowEqual(a, b)`:
- Trả `true` nếu `Object.is(a, b)`
- Nếu một trong hai không phải object (hoặc là null) → `false`
- Cùng số key và với mọi key: `Object.is(a[key], b[key])`
'''
starter = '''
function shallowEqual(a, b) {
  // TODO
}
'''
solution = '''
function shallowEqual(a, b) {
  if (Object.is(a, b)) return true;
  if (typeof a !== 'object' || a === null || typeof b !== 'object' || b === null) return false;
  const ka = Object.keys(a), kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  return ka.every(k => Object.prototype.hasOwnProperty.call(b, k) && Object.is(a[k], b[k]));
}
'''
tests = '''
test('cùng tham chiếu', () => { const o = {}; expect(shallowEqual(o, o)).toBe(true); });
test('props bằng nhau ở mức nông', () => {
  const fn = () => {};
  expect(shallowEqual({ a: 1, b: 'x', fn }, { a: 1, b: 'x', fn })).toBe(true);
});
test('object lồng nhau khác tham chiếu → false', () => {
  expect(shallowEqual({ style: { color: 'red' } }, { style: { color: 'red' } })).toBe(false);
});
test('số lượng key khác', () => {
  expect(shallowEqual({ a: 1 }, { a: 1, b: 2 })).toBe(false);
});
test('key khác tên cùng số lượng', () => {
  expect(shallowEqual({ a: undefined }, { b: undefined })).toBe(false);
});
test('NaN và primitive', () => {
  expect(shallowEqual({ n: NaN }, { n: NaN })).toBe(true);
  expect(shallowEqual(1, 1)).toBe(true);
  expect(shallowEqual(null, {})).toBe(false);
});
'''
hints = ["`Object.is` khác `===` ở `NaN` và `+0/-0`.", "Nhớ kiểm tra key có thật sự tồn tại trong `b` (`hasOwnProperty`)."]
explanation = "Hiểu shallowEqual giúp biết vì sao object/hàm inline phá vỡ `React.memo`."

