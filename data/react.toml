[[questions]]
id = "react-029"
module = "react-state"
type = "code"
difficulty = 2
title = "todoReducer bất biến"
prompt = '''
Viết reducer `todoReducer(state, action)` quản lý danh sách todo **không mutate** state cũ.

State: mảng `{ id, text, done }`. Các action:
- `{ type: 'added', id, text }` → thêm todo `done: false` vào **cuối**
- `{ type: 'toggled', id }` → đảo `done`
- `{ type: 'deleted', id }` → xoá
- `{ type: 'cleared' }` → xoá các todo đã `done`
- action lạ → `throw new Error('Unknown action: ' + type)`
'''
starter = '''
function todoReducer(state, action) {
  switch (action.type) {
    // TODO
  }
}
'''
solution = '''
function todoReducer(state, action) {
  switch (action.type) {
    case 'added':
      return [...state, { id: action.id, text: action.text, done: false }];
    case 'toggled':
      return state.map(t => (t.id === action.id ? { ...t, done: !t.done } : t));
    case 'deleted':
      return state.filter(t => t.id !== action.id);
    case 'cleared':
      return state.filter(t => !t.done);
    default:
      throw new Error('Unknown action: ' + action.type);
  }
}
'''
tests = '''
const s0 = Object.freeze([Object.freeze({ id: 1, text: 'Học hooks', done: false })]);
test('added thêm vào cuối', () => {
  const s = todoReducer(s0, { type: 'added', id: 2, text: 'Ôn RN' });
  expect(s).toEqual([{ id: 1, text: 'Học hooks', done: false }, { id: 2, text: 'Ôn RN', done: false }]);
});
test('toggled tạo object mới, không mutate', () => {
  const s = todoReducer(s0, { type: 'toggled', id: 1 });
  expect(s[0].done).toBe(true);
  expect(s0[0].done).toBe(false);
  expect(s).not.toBe(s0);
});
test('deleted', () => {
  expect(todoReducer(s0, { type: 'deleted', id: 1 })).toEqual([]);
});
test('cleared bỏ todo đã xong', () => {
  const s = [{ id: 1, text: 'a', done: true }, { id: 2, text: 'b', done: false }];
  expect(todoReducer(s, { type: 'cleared' })).toEqual([{ id: 2, text: 'b', done: false }]);
});
test('action lạ ném lỗi', () => {
  expect(() => todoReducer(s0, { type: 'xyz' })).toThrow('Unknown action: xyz');
});
test('dùng được với useReducer', () => {
  const { result } = renderHook(() => useReducer(todoReducer, []));
  act(() => result.current[1]({ type: 'added', id: 7, text: 'x' }));
  expect(result.current[0]).toHaveLength(1);
});
'''
hints = ["`map` để đổi một phần tử, `filter` để xoá, spread để thêm.", "State được `Object.freeze` — mutate sẽ không có tác dụng hoặc lỗi."]
explanation = "Reducer phải là hàm thuần (pure): cùng input → cùng output, không side effect, không mutate."

