[[questions]]
id = "react-dvc01"
module = "react-dv-rules"
type = "code"
difficulty = 2
lang = "javascript"
title = "Cập nhật todo bất biến"
prompt = '''Viết `updateTodo(todos, id, patch)` trả về một **array mới**. Với todo có `id` trùng khớp, tạo object mới bằng cách gộp các field của `patch` lên todo cũ. Giữ nguyên thứ tự; không sửa array hoặc object đầu vào. Các todo không khớp phải giữ nguyên identity. Nếu không có id khớp, vẫn trả về array mới với các phần tử cũ.'''
starter = '''function updateTodo(todos, id, patch) {
  return todos;
}'''
solution = '''function updateTodo(todos, id, patch) {
  return todos.map(todo => todo.id === id ? { ...todo, ...patch } : todo);
}'''
tests = '''test('tạo bản cập nhật cho todo khớp id', () => {
  const todos = [{ id: 1, title: 'A', done: false }];
  expect(updateTodo(todos, 1, { done: true })).toEqual([{ id: 1, title: 'A', done: true }]);
});
test('không mutate mảng hoặc object gốc', () => {
  const todo = { id: 1, title: 'A', done: false };
  const todos = [todo];
  const result = updateTodo(todos, 1, { title: 'B' });
  expect(todos[0].title).toBe('A');
  expect(result).not.toBe(todos);
  expect(result[0]).not.toBe(todo);
});
test('giữ identity của todo không khớp', () => {
  const first = { id: 1, title: 'A' };
  const second = { id: 2, title: 'B' };
  const result = updateTodo([first, second], 1, { title: 'X' });
  expect(result[1]).toBe(second);
});
test('giữ nguyên thứ tự và dữ liệu khi không tìm thấy id', () => {
  const todos = [{ id: 2 }, { id: 1 }];
  const result = updateTodo(todos, 9, { done: true });
  expect(result).toEqual(todos);
  expect(result).not.toBe(todos);
});
test('array rỗng trả về array rỗng mới', () => {
  const todos = [];
  const result = updateTodo(todos, 1, { done: true });
  expect(result).toEqual([]);
  expect(result).not.toBe(todos);
});'''
hints = ["Dùng `map` để giữ thứ tự và tạo array mới.", "Chỉ tạo object mới cho phần tử khớp id; các phần tử còn lại trả lại object cũ."]
explanation = "Cập nhật bất biến giúp React nhận identity mới ở phần thay đổi mà không làm hỏng snapshot dữ liệu đã được component khác sử dụng."
sources = ["react/reference/eslint-plugin-react-hooks/lints/immutability"]

