[[questions]]
id = "react-049"
module = "react-hooks"
type = "essay"
difficulty = 3
prompt = "Giải thích **stale closure** trong React hooks và nêu cách khắc phục."
keywords = [
  ["closure"],
  ["giá trị cũ", "cũ", "stale", "lần render trước", "snapshot"],
  ["updater", "prev =>", "c =>", "hàm cập nhật", "functional update"],
  ["deps", "dependency", "phụ thuộc"],
  ["ref", "useRef"],
]
min_keywords = 3
model_answer = '''
Mỗi lần render tạo ra các hàm mới "đóng" (closure) trên **giá trị props/state của lần render đó**. Nếu một callback được tạo ở lần render cũ (ví dụ trong `setInterval` với deps `[]`, hoặc `useCallback` thiếu deps) thì nó sẽ mãi đọc **giá trị cũ** → stale closure.

Cách khắc phục:
- Dùng **functional updater** `setX(prev => ...)` để không phụ thuộc giá trị trong closure.
- Khai báo đầy đủ **dependencies** (eslint `react-hooks/exhaustive-deps`).
- Lưu giá trị mới nhất vào **useRef** và đọc `ref.current` trong callback.
'''
explanation = "Đây là lỗi phổ biến nhất khi dùng timer, subscription, event listener trong hooks."

[[questions]]
id = "react-050"
module = "react-hooks"
type = "code"
difficulty = 1
title = "Custom hook useToggle"
prompt = '''
Viết custom hook `useToggle(initial = false)` trả về mảng `[value, toggle, setValue]`:
- `toggle()` đảo giá trị
- `setValue(v)` đặt giá trị trực tiếp
- `toggle` phải **giữ nguyên tham chiếu** giữa các lần render (dùng `useCallback`)

> Môi trường có sẵn `useState`, `useCallback`… (MiniReact) và `renderHook`, `act` để test.
'''
starter = '''
function useToggle(initial = false) {
  // TODO
}
'''
solution = '''
function useToggle(initial = false) {
  const [value, setValue] = useState(initial);
  const toggle = useCallback(() => setValue(v => !v), []);
  return [value, toggle, setValue];
}
'''
tests = '''
test('giá trị mặc định là false', () => {
  const { result } = renderHook(() => useToggle());
  expect(result.current[0]).toBe(false);
});
test('nhận giá trị khởi tạo', () => {
  const { result } = renderHook(() => useToggle(true));
  expect(result.current[0]).toBe(true);
});
test('toggle đảo giá trị', () => {
  const { result } = renderHook(() => useToggle());
  act(() => result.current[1]());
  expect(result.current[0]).toBe(true);
  act(() => result.current[1]());
  expect(result.current[0]).toBe(false);
});
test('toggle 2 lần trong cùng act', () => {
  const { result } = renderHook(() => useToggle());
  act(() => { result.current[1](); result.current[1](); });
  expect(result.current[0]).toBe(false);
});
test('setValue đặt trực tiếp', () => {
  const { result } = renderHook(() => useToggle());
  act(() => result.current[2](true));
  expect(result.current[0]).toBe(true);
});
test('toggle giữ nguyên tham chiếu', () => {
  const { result } = renderHook(() => useToggle());
  const first = result.current[1];
  act(() => result.current[1]());
  expect(result.current[1]).toBe(first);
});
'''
hints = ["Dùng functional update `setValue(v => !v)` để toggle 2 lần liên tiếp vẫn đúng.", "`useCallback(fn, [])` giữ tham chiếu ổn định."]
explanation = "Functional update giúp toggle không phụ thuộc closure, và vì vậy deps của `useCallback` có thể rỗng."

[[questions]]
id = "react-051"
module = "react-hooks"
type = "code"
difficulty = 2
title = "useCounter có min/max"
prompt = '''
Viết `useCounter(initial = 0, { min = -Infinity, max = Infinity, step = 1 } = {})` trả về object:
`{ count, increment, decrement, reset, set }`
- `increment/decrement` thay đổi theo `step` nhưng **kẹp (clamp)** trong `[min, max]`
- `set(n)` cũng phải clamp
- `reset()` về giá trị `initial` (đã clamp)
'''
starter = '''
function useCounter(initial = 0, options = {}) {
  // TODO
}
'''
solution = '''
function useCounter(initial = 0, { min = -Infinity, max = Infinity, step = 1 } = {}) {
  const clamp = (n) => Math.min(max, Math.max(min, n));
  const [count, setCount] = useState(() => clamp(initial));
  return {
    count,
    increment: () => setCount(c => clamp(c + step)),
    decrement: () => setCount(c => clamp(c - step)),
    reset: () => setCount(clamp(initial)),
    set: (n) => setCount(clamp(n)),
  };
}
'''
tests = '''
test('tăng/giảm cơ bản', () => {
  const { result } = renderHook(() => useCounter(5));
  act(() => result.current.increment());
  expect(result.current.count).toBe(6);
  act(() => { result.current.decrement(); result.current.decrement(); });
  expect(result.current.count).toBe(4);
});
test('step', () => {
  const { result } = renderHook(() => useCounter(0, { step: 5 }));
  act(() => result.current.increment());
  expect(result.current.count).toBe(5);
});
test('không vượt max', () => {
  const { result } = renderHook(() => useCounter(9, { max: 10 }));
  act(() => { result.current.increment(); result.current.increment(); });
  expect(result.current.count).toBe(10);
});
test('không thấp hơn min', () => {
  const { result } = renderHook(() => useCounter(1, { min: 0 }));
  act(() => { result.current.decrement(); result.current.decrement(); });
  expect(result.current.count).toBe(0);
});
test('set có clamp', () => {
  const { result } = renderHook(() => useCounter(0, { min: 0, max: 100 }));
  act(() => result.current.set(500));
  expect(result.current.count).toBe(100);
});
test('reset', () => {
  const { result } = renderHook(() => useCounter(3));
  act(() => result.current.increment());
  act(() => result.current.reset());
  expect(result.current.count).toBe(3);
});
test('initial nằm ngoài khoảng sẽ bị clamp', () => {
  const { result } = renderHook(() => useCounter(50, { max: 10 }));
  expect(result.current.count).toBe(10);
});
'''
hints = ["Viết hàm `clamp(n) = Math.min(max, Math.max(min, n))`."]
explanation = "Custom hook đóng gói logic có state để tái sử dụng — mỗi component dùng hook có state riêng."

[[questions]]
id = "react-052"
module = "react-hooks"
type = "code"
difficulty = 2
title = "usePrevious"
prompt = '''
Viết hook `usePrevious(value)` trả về giá trị của `value` ở **lần render trước** (lần đầu trả về `undefined`).

Gợi ý kinh điển: `useRef` + `useEffect`.
'''
starter = '''
function usePrevious(value) {
  // TODO
}
'''
solution = '''
function usePrevious(value) {
  const ref = useRef(undefined);
  useEffect(() => {
    ref.current = value;
  }, [value]);
  return ref.current;
}
'''
tests = '''
test('lần đầu là undefined', () => {
  const { result } = renderHook((p) => usePrevious(p), { initialProps: 1 });
  expect(result.current).toBeUndefined();
});
test('trả về giá trị trước', () => {
  const h = renderHook((p) => usePrevious(p), { initialProps: 1 });
  h.rerender(2);
  expect(h.result.current).toBe(1);
  h.rerender(3);
  expect(h.result.current).toBe(2);
});
test('hoạt động với object', () => {
  const a = { x: 1 }, b = { x: 2 };
  const h = renderHook((p) => usePrevious(p), { initialProps: a });
  h.rerender(b);
  expect(h.result.current).toBe(a);
});
test('giữ giá trị falsy ở lần render trước', () => {
  const h = renderHook((p) => usePrevious(p), { initialProps: 0 });
  h.rerender(false);
  expect(h.result.current).toBe(0);
});
'''
hints = ["Effect chạy **sau** render, nên lúc render `ref.current` vẫn là giá trị cũ."]
explanation = "Lưu ý: với deps `[value]`, nếu render lại mà value không đổi thì previous vẫn là giá trị trước lần thay đổi gần nhất."

[[questions]]
id = "react-053"
module = "react-hooks"
type = "code"
difficulty = 3
title = "useDebouncedValue"
prompt = '''
Viết hook `useDebouncedValue(value, delay)` trả về giá trị chỉ cập nhật sau khi `value` **ngừng thay đổi** `delay` ms (dùng cho ô tìm kiếm).

- Lần render đầu trả về `value` ban đầu.
- Mỗi khi `value` đổi: huỷ timer cũ (cleanup) và đặt timer mới.

Môi trường dùng **fake timers**: test gọi `jest.advanceTimersByTime(ms)`.
'''
starter = '''
function useDebouncedValue(value, delay) {
  // TODO
}
'''
solution = '''
function useDebouncedValue(value, delay) {
  const [debounced, setDebounced] = useState(value);
  useEffect(() => {
    const id = setTimeout(() => setDebounced(value), delay);
    return () => clearTimeout(id);
  }, [value, delay]);
  return debounced;
}
'''
tests = '''
test('giá trị ban đầu', () => {
  const { result } = renderHook((v) => useDebouncedValue(v, 300), { initialProps: 'a' });
  expect(result.current).toBe('a');
});
test('chỉ cập nhật sau delay', () => {
  const h = renderHook((v) => useDebouncedValue(v, 300), { initialProps: 'a' });
  h.rerender('ab');
  jest.advanceTimersByTime(299);
  expect(h.result.current).toBe('a');
  jest.advanceTimersByTime(1);
  expect(h.result.current).toBe('ab');
});
test('gõ liên tục thì reset timer', () => {
  const h = renderHook((v) => useDebouncedValue(v, 300), { initialProps: 'r' });
  h.rerender('re');
  jest.advanceTimersByTime(200);
  h.rerender('rea');
  jest.advanceTimersByTime(200);
  h.rerender('reac');
  jest.advanceTimersByTime(200);
  expect(h.result.current).toBe('r');
  jest.advanceTimersByTime(100);
  expect(h.result.current).toBe('reac');
});
test('unmount huỷ timer', () => {
  const h = renderHook((v) => useDebouncedValue(v, 100), { initialProps: 1 });
  h.rerender(2);
  h.unmount();
  jest.advanceTimersByTime(500);
  expect(h.result.current).toBe(1);
});
'''
hints = ["Cleanup của effect là nơi gọi `clearTimeout`.", "Deps của effect: `[value, delay]`."]
explanation = "Pattern debounce bằng effect + cleanup: mỗi lần value đổi, cleanup huỷ timer cũ trước khi effect mới đặt timer mới."

[[questions]]
id = "react-054"
module = "react-hooks"
type = "code"
difficulty = 3
title = "useAsync — trạng thái tải dữ liệu"
prompt = '''
Viết hook `useAsync(asyncFn, deps)` gọi `asyncFn()` trong effect và trả về `{ status, data, error }`:
- ban đầu: `status: 'pending'`, `data: undefined`, `error: undefined`
- thành công: `status: 'success'`, `data: kết quả`
- thất bại: `status: 'error'`, `error: lỗi`
- Nếu deps đổi / unmount trước khi promise xong thì **bỏ qua** kết quả cũ (tránh race condition) — dùng cờ `ignore` trong cleanup.
'''
starter = '''
function useAsync(asyncFn, deps) {
  // TODO
}
'''
solution = '''
function useAsync(asyncFn, deps) {
  const [state, setState] = useState({ status: 'pending', data: undefined, error: undefined });
  useEffect(() => {
    let ignore = false;
    setState({ status: 'pending', data: undefined, error: undefined });
    asyncFn().then(
      data => { if (!ignore) setState({ status: 'success', data, error: undefined }); },
      error => { if (!ignore) setState({ status: 'error', data: undefined, error }); }
    );
    return () => { ignore = true; };
  }, deps);
  return state;
}
'''
tests = '''
test('pending rồi success', async () => {
  const { result } = renderHook(() => useAsync(() => Promise.resolve(42), []));
  expect(result.current.status).toBe('pending');
  await Promise.resolve(); await Promise.resolve();
  expect(result.current.status).toBe('success');
  expect(result.current.data).toBe(42);
});
test('error', async () => {
  const err = new Error('boom');
  const { result } = renderHook(() => useAsync(() => Promise.reject(err), []));
  await Promise.resolve(); await Promise.resolve();
  expect(result.current.status).toBe('error');
  expect(result.current.error).toBe(err);
});
test('bỏ qua kết quả cũ khi deps đổi (race condition)', async () => {
  let resolvers = [];
  const fetcher = (id) => () => new Promise(r => resolvers.push(() => r('user-' + id)));
  const h = renderHook((id) => useAsync(fetcher(id), [id]), { initialProps: 1 });
  h.rerender(2);
  resolvers[1]();
  await Promise.resolve(); await Promise.resolve();
  resolvers[0]();
  await Promise.resolve(); await Promise.resolve();
  expect(h.result.current.data).toBe('user-2');
});
test('success giữ đủ trường trạng thái', async () => {
  const { result } = renderHook(() => useAsync(() => Promise.resolve('ready'), []));
  await Promise.resolve(); await Promise.resolve();
  expect(result.current).toEqual({ status: 'success', data: 'ready', error: undefined });
});
'''
hints = ["`let ignore = false;` trong effect, cleanup đặt `ignore = true`.", "Kiểm tra `if (!ignore)` trước khi setState."]
explanation = "Đây là pattern chính thức trong tài liệu React để fetch trong effect mà không bị race condition. Thực tế nên dùng TanStack Query / SWR / framework data loader."

