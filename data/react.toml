[[questions]]
id = "react-088"
module = "react-patterns"
type = "code"
difficulty = 2
title = "classNames (cx) utility"
prompt = '''
Viết hàm `cx(...args)` giống thư viện `clsx` dùng để ghép className có điều kiện:
- chuỗi/số khác rỗng được giữ lại
- object: lấy các key có giá trị truthy
- mảng: xử lý đệ quy
- bỏ qua falsy (`false`, `null`, `undefined`, `0`, `''`)
- Kết quả nối bằng một khoảng trắng
'''
starter = '''
function cx(...args) {
  // TODO
}
'''
solution = '''
function cx(...args) {
  const out = [];
  for (const a of args) {
    if (!a) continue;
    if (typeof a === 'string' || typeof a === 'number') out.push(String(a));
    else if (Array.isArray(a)) { const s = cx(...a); if (s) out.push(s); }
    else if (typeof a === 'object') for (const k of Object.keys(a)) if (a[k]) out.push(k);
  }
  return out.join(' ');
}
'''
tests = '''
test('chuỗi', () => expect(cx('btn', 'primary')).toBe('btn primary'));
test('object điều kiện', () => expect(cx('btn', { active: true, disabled: false })).toBe('btn active'));
test('bỏ falsy', () => expect(cx(null, undefined, false, 0, '', 'a')).toBe('a'));
test('mảng lồng nhau', () => expect(cx(['a', ['b', { c: 1 }]], 'd')).toBe('a b c d'));
test('rỗng', () => expect(cx()).toBe(''));
test('số', () => expect(cx(1, 'x')).toBe('1 x'));
'''
hints = ["Đệ quy cho mảng: `cx(...a)`."]
explanation = "Utility nhỏ nhưng rất phổ biến trong React + Tailwind."

