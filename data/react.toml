[[questions]]
id = "react-dvc02"
module = "react-dv-compiler"
type = "code"
difficulty = 2
lang = "javascript"
title = "Selector sản phẩm thuần"
prompt = '''Viết `filterProducts(products, query)` trả về các sản phẩm có `name` chứa query, không phân biệt hoa thường. Bỏ khoảng trắng ở đầu/cuối query, giữ nguyên thứ tự đầu vào và không sửa array hoặc object sản phẩm. Query rỗng phải trả về tất cả sản phẩm.'''
starter = '''function filterProducts(products, query) {
  return products;
}'''
solution = '''function filterProducts(products, query) {
  const normalized = query.trim().toLowerCase();
  return products.filter(product => product.name.toLowerCase().includes(normalized));
}'''
tests = '''test('lọc không phân biệt hoa thường', () => {
  const products = [{ name: 'React Book' }, { name: 'Rust Guide' }];
  expect(filterProducts(products, 'REACT')).toEqual([{ name: 'React Book' }]);
});
test('bỏ khoảng trắng quanh query', () => {
  expect(filterProducts([{ name: 'React Course' }], '  course ')).toHaveLength(1);
});
test('query rỗng trả về mọi sản phẩm theo thứ tự', () => {
  const products = [{ name: 'B' }, { name: 'A' }];
  expect(filterProducts(products, '  ')).toEqual(products);
});
test('không có kết quả trả về array rỗng', () => {
  expect(filterProducts([{ name: 'React' }], 'python')).toEqual([]);
});
test('không sửa đầu vào và giữ identity của item được chọn', () => {
  const product = { name: 'React' };
  const products = [product];
  const result = filterProducts(products, 're');
  expect(products).toHaveLength(1);
  expect(result).not.toBe(products);
  expect(result[0]).toBe(product);
});'''
hints = ["Chuẩn hóa query một lần bằng `trim()` và `toLowerCase()`.", "Dùng `filter` thay vì sort hoặc sửa mảng đầu vào."]
