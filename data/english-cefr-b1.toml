module = "cefr-b1-vocab"
type = "single"
difficulty = 1
prompt = "Duy has an important meeting with a company because he wants to ______ a job there."
options = ["apply for", "borrow", "save", "share"]
answer = [0]
explanation = "Ta nói *apply for a job* khi ứng tuyển việc làm. *Borrow* là mượn, *save* là tiết kiệm, *share* là chia sẻ."

