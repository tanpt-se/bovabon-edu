id = "cefr-b1-008"
module = "cefr-b1-grammar-plus"
type = "fill"
difficulty = 1
prompt = '''
Điền dạng tương lai phù hợp:

1. The film {{blank}} (start) at 6.30 according to the programme.
2. We {{blank}} (have) dinner with our cousins tomorrow; the table is booked.
3. I think you {{blank}} (like) this book.
'''
blanks = [["starts"], ["are having", "'re having"], ["will like", "'ll like"]]
explanation = "Lịch cố định dùng hiện tại đơn; sắp xếp cá nhân dùng hiện tại tiếp diễn; dự đoán nêu ý kiến thường dùng *will*."

[[questions]]
id = "cefr-b1-009"
module = "cefr-b1-grammar-plus"
type = "fill"
difficulty = 2
prompt = '''
Điền một cụm phù hợp vào mỗi chỗ trống:

1. The box is {{blank}} heavy that I can't lift it. (so/such)
2. It was {{blank}} a funny story that we all laughed. (so/such)
3. The soup is too hot {{blank}} eat now. (to/for)
4. Mia is old {{blank}} to travel alone. (enough/too)
5. I left early {{blank}} catch the first bus. (mục đích)
'''
blanks = [["so"], ["such"], ["to"], ["enough"], ["to", "in order to"]]
explanation = "*So* đứng trước tính từ; *such* đứng trước cụm danh từ; *too + adjective + to V*; *adjective + enough + to V*. Dùng *to/in order to + V* để nêu mục đích."

[[questions]]
id = "cefr-b1-010"
module = "cefr-b1-grammar-plus"
type = "fill"
difficulty = 3
prompt = '''
Hoàn thành các câu hỏi lịch sự và câu hỏi đuôi:

1. Could you tell me where the post office {{blank}}? (is)
2. You haven't met our new teacher, {{blank}}? (have)
3. Do you know {{blank}} the shop is open on Sundays? (if/whether)
4. My grandfather {{blank}} live by the sea, but now he lives in Hanoi. (từng)
5. I am used to {{blank}} up early, so mornings are easy for me. (get)
6. She is {{blank}} engineer at a local hospital. (an)
'''
blanks = [["is"], ["have you"], ["if", "whether"], ["used to"], ["getting"], ["an"]]
explanation = "Câu hỏi gián tiếp giữ trật tự câu kể; mệnh đề chính phủ định *haven't met* cần đuôi khẳng định *have you?*. *Used to + V* nói thói quen cũ, còn *be used to + V-ing* nói đã quen. Dùng *an* trước âm nguyên âm trong *engineer*."

[[questions]]
id = "cefr-b1-011"
module = "cefr-b1-grammar-plus"
type = "essay"
difficulty = 2
prompt = '''
Bạn đang ở một thị trấn lạ. Viết **hai câu tiếng Anh** để hỏi lịch sự đường đến bảo tàng và hỏi xem nó có mở cửa vào thứ Hai không. Dùng câu hỏi gián tiếp.
'''
keywords = [["could you tell me", "could you show me"], ["where the museum is", "how to get to the museum"], ["if it is open", "whether it is open"], ["on monday"]]
min_keywords = 3
model_answer = '''Could you tell me where the museum is? Do you know if it is open on Monday?'''
explanation = "Câu hỏi gián tiếp giúp yêu cầu lịch sự hơn; sau cụm mở đầu dùng trật tự câu kể, kể cả khi có từ để hỏi."

[[modules]]
id = "cefr-b1-vocab"
title = "Từ vựng theo chủ đề B1"
description = "Từ vựng về công việc, học tập, truyền thông, môi trường và tiền bạc; collocation thông dụng và cấu tạo từ cơ bản."
lesson = '''
### Từ vựng theo chủ đề quen thuộc
| Chủ đề | Từ/cụm từ | Ví dụ |
|---|---|---|
| Công việc | apply for a job, CV, salary, colleague, interview | *I have an interview on Friday.* |
| Giáo dục | course, subject, exam, improve, take notes | *She takes notes during the lesson.* |
| Truyền thông | news, headline, online, post, share | *I read the news online every morning.* |
| Môi trường | recycle, waste, pollution, public transport, save energy | *We take the bus to reduce air pollution.* |
| Tiền bạc | price, cost, spend, save, borrow, lend | *I'm saving money for a new laptop.* |
| Sức khỏe & lối sống | exercise, sleep, healthy, habit | *A short walk is a healthy habit.* |
| Du lịch & văn hóa | ticket, local food, museum, festival | *We tried local food at the festival.* |
| Quan hệ | invite, get on with, apologize, each other | *I get on well with my colleagues.* |

Chú ý các cặp dễ nhầm: *borrow* = nhận/tạm mượn từ ai; *lend* = cho ai mượn. *Salary* thường là khoản lương định kỳ; *price* là giá của món hàng; *cost* là số tiền cần trả. Dùng *apply for a job* (ứng tuyển việc làm) và *apply to a company* (nộp đơn cho công ty).

### Collocation với make, do, take, have, get
| Động từ | Cụm thường gặp | Ví dụ |
|---|---|---|
| make | a decision, a mistake, progress | *We made a decision together.* |
| do | homework, housework, a course | *He does his homework after dinner.* |
| take | notes, a photo, a break | *Please take notes of the new words.* |
| have | a meeting, a lesson, a good time | *They have a meeting at noon.* |
| get | a job, a message, better | *I hope you get a job soon.* |

Học cả cụm thay vì dịch từng từ; lỗi thường gặp là *make homework* hoặc *do a decision*. Với *have/get*, để ý collocation và ngữ cảnh thay vì chọn theo một bản dịch tiếng Việt duy nhất.

### Tiền tố và hậu tố
Tiền tố thường đổi nghĩa; hậu tố thường đổi loại từ hoặc tạo danh từ/tính từ.
| Phần thêm | Ví dụ | Gợi ý |
|---|---|---|
| un- | unhappy, unusual | không / trái nghĩa |
| dis- | disagree, dislike | không / ngược lại |
| -ful | useful, careful | có đặc điểm đó |
| -less | careless, useless | thiếu / không có |
| -ment | employment, development | thường tạo danh từ |
| -tion | education, information | thường tạo danh từ |

Ví dụ: *use → useful → useless*; *employ → employment*. Không phải từ nào cũng ghép được với mọi tiền tố/hậu tố. Khi điền dạng từ, xác định vị trí cần danh từ, tính từ hay động từ trước, rồi kiểm tra chính tả và nghĩa trong câu.

### Mở rộng từ vựng theo cụm
Học từ mới cùng với từ đi kèm và giới từ: *apply for a position, be responsible for a task, take part in a workshop, make progress, pay attention to details*. Một từ có thể đổi sắc thái theo ngữ cảnh: *salary* là khoản lương cố định, *wage* thường tính theo giờ/ca, còn *income* là thu nhập nói chung. Phrasal verb cũng đổi nghĩa theo tân ngữ và tình huống: *look up a word* là tra từ; *look after a child* là chăm sóc.
Tiền tố và hậu tố giúp đoán nghĩa nhưng cần kiểm tra loại từ: *employ → employment / employer / employee*; *use → useful / useless*. Khi đọc, đoán từ trong câu rồi kiểm tra bằng cấu trúc và ngữ cảnh. Khi viết, ưu tiên collocation tự nhiên hơn một từ hiếm; chẳng hạn *make a decision*, không phải *do a decision*. Ghi lại cả câu ví dụ để nhớ cách dùng.
'''

