explanation = "Câu hỏi gián tiếp giúp yêu cầu lịch sự hơn; sau cụm mở đầu dùng trật tự câu kể, kể cả khi có từ để hỏi."

[[modules]]
id = "cefr-b1-vocab"
title = "Từ vựng theo chủ đề B1"
description = "Từ vựng về công việc, học tập, truyền thông, môi trường và tiền bạc; collocation thông dụng và cấu tạo từ cơ bản."
lesson = '''
### Từ vựng theo chủ đề quen thuộc
| Chủ đề | Từ/cụm từ | Ví dụ |
|---|---|---|
| Công việc | apply for a job, CV, salary, colleague, interview | *I have an interview on Friday.* |
| Giáo dục | course, subject, exam, improve, take notes | *She takes notes during the lesson.* |
| Truyền thông | news, headline, online, post, share | *I read the news online every morning.* |
| Môi trường | recycle, waste, pollution, public transport, save energy | *We take the bus to reduce air pollution.* |
| Tiền bạc | price, cost, spend, save, borrow, lend | *I'm saving money for a new laptop.* |
| Sức khỏe & lối sống | exercise, sleep, healthy, habit | *A short walk is a healthy habit.* |
| Du lịch & văn hóa | ticket, local food, museum, festival | *We tried local food at the festival.* |
| Quan hệ | invite, get on with, apologize, each other | *I get on well with my colleagues.* |

Chú ý các cặp dễ nhầm: *borrow* = nhận/tạm mượn từ ai; *lend* = cho ai mượn. *Salary* thường là khoản lương định kỳ; *price* là giá của món hàng; *cost* là số tiền cần trả. Dùng *apply for a job* (ứng tuyển việc làm) và *apply to a company* (nộp đơn cho công ty).

### Collocation với make, do, take, have, get
| Động từ | Cụm thường gặp | Ví dụ |
|---|---|---|
| make | a decision, a mistake, progress | *We made a decision together.* |
| do | homework, housework, a course | *He does his homework after dinner.* |
| take | notes, a photo, a break | *Please take notes of the new words.* |
| have | a meeting, a lesson, a good time | *They have a meeting at noon.* |
| get | a job, a message, better | *I hope you get a job soon.* |

Học cả cụm thay vì dịch từng từ; lỗi thường gặp là *make homework* hoặc *do a decision*. Với *have/get*, để ý collocation và ngữ cảnh thay vì chọn theo một bản dịch tiếng Việt duy nhất.

### Tiền tố và hậu tố
Tiền tố thường đổi nghĩa; hậu tố thường đổi loại từ hoặc tạo danh từ/tính từ.
| Phần thêm | Ví dụ | Gợi ý |
|---|---|---|
| un- | unhappy, unusual | không / trái nghĩa |
| dis- | disagree, dislike | không / ngược lại |
| -ful | useful, careful | có đặc điểm đó |
| -less | careless, useless | thiếu / không có |
| -ment | employment, development | thường tạo danh từ |
| -tion | education, information | thường tạo danh từ |

Ví dụ: *use → useful → useless*; *employ → employment*. Không phải từ nào cũng ghép được với mọi tiền tố/hậu tố. Khi điền dạng từ, xác định vị trí cần danh từ, tính từ hay động từ trước, rồi kiểm tra chính tả và nghĩa trong câu.
'''

[[questions]]
