type = "single"
difficulty = 1
prompt = "I want to learn Spanish, so I signed up for an evening ______."
options = ["course", "salary", "headline", "waste"]
answer = [0]
explanation = "*Course* là khóa học; những lựa chọn còn lại lần lượt liên quan đến lương, tin tức và rác thải."

[[questions]]
id = "cefr-b1-014"
module = "cefr-b1-vocab"
type = "single"
difficulty = 2
prompt = "A short title at the top of a news story is called a ______."
options = ["colleague", "headline", "price", "subject"]
answer = [1]
explanation = "*Headline* là dòng tiêu đề của bài báo hoặc tin tức."

[[questions]]
id = "cefr-b1-015"
module = "cefr-b1-vocab"
type = "single"
difficulty = 2
prompt = "Which action can help reduce air pollution in a busy city?"
options = ["Taking public transport", "Buying more plastic bags", "Leaving lights on all day", "Throwing bottles into rivers"]
answer = [0]
explanation = "Đi phương tiện công cộng có thể giảm số xe cá nhân và khí thải. Các lựa chọn còn lại làm tăng rác hoặc lãng phí năng lượng."

[[questions]]
id = "cefr-b1-016"
module = "cefr-b1-vocab"
type = "single"
difficulty = 1
prompt = "I put a little money aside each month because I want to ______ for a holiday."
options = ["save", "spend", "lend", "cost"]
answer = [0]
explanation = "Để dành tiền cho một mục tiêu là *save for*. *Spend* là tiêu, *lend* là cho mượn, còn *cost* nói giá tiền."

[[questions]]
id = "cefr-b1-017"
module = "cefr-b1-vocab"
type = "multiple"
difficulty = 2
prompt = "Chọn các cụm động từ–danh từ tự nhiên thường gặp trong bối cảnh học tập."
options = ["do homework", "make a decision", "take notes", "make housework", "do progress"]
answer = [0, 1, 2]
explanation = "Các cụm đúng là *do homework*, *make a decision* và *take notes*. Ta nói *do housework* và *make progress*."

[[questions]]
id = "cefr-b1-018"
module = "cefr-b1-vocab"
type = "multiple"
difficulty = 3
prompt = "Chọn các câu có dạng từ đúng và nghĩa phù hợp."
options = ["The new app is useful for learning vocabulary.", "The workers discussed their employment plans.", "It was careless to leave your bag on the bus.", "I felt unhope after I lost the job.", "The school gave us a lot of inform about the course."]
answer = [0, 1, 2]
explanation = "*Useful*, *employment* và *careless* là dạng từ đúng. Cần dùng danh từ *hope* (hoặc *hopeless* theo nghĩa khác) và *information*, không phải *unhope/inform*."

[[questions]]
id = "cefr-b1-019"
module = "cefr-b1-vocab"
type = "fill"
difficulty = 1
prompt = '''
Điền make, do, take, have hoặc get vào mỗi chỗ trống:

