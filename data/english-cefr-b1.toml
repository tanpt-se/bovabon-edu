[[questions]]
id = "cefr-b1-009"
module = "cefr-b1-grammar-plus"
type = "fill"
difficulty = 2
prompt = '''
Điền một cụm phù hợp vào mỗi chỗ trống:

1. The box is {{blank}} heavy that I can't lift it. (so/such)
2. It was {{blank}} a funny story that we all laughed. (so/such)
3. The soup is too hot {{blank}} eat now. (to/for)
4. Mia is old {{blank}} to travel alone. (enough/too)
5. I left early {{blank}} catch the first bus. (mục đích)
'''
blanks = [["so"], ["such"], ["to"], ["enough"], ["to", "in order to"]]
explanation = "*So* đứng trước tính từ; *such* đứng trước cụm danh từ; *too + adjective + to V*; *adjective + enough + to V*. Dùng *to/in order to + V* để nêu mục đích."

[[questions]]
id = "cefr-b1-010"
module = "cefr-b1-grammar-plus"
type = "fill"
difficulty = 3
prompt = '''
Hoàn thành các câu hỏi lịch sự và câu hỏi đuôi:

1. Could you tell me where the post office {{blank}}? (is)
2. You haven't met our new teacher, {{blank}}? (have)
3. Do you know {{blank}} the shop is open on Sundays? (if/whether)
4. My grandfather {{blank}} live by the sea, but now he lives in Hanoi. (từng)
5. I am used to {{blank}} up early, so mornings are easy for me. (get)
6. She is {{blank}} engineer at a local hospital. (an)
'''
blanks = [["is"], ["have you"], ["if", "whether"], ["used to"], ["getting"], ["an"]]
explanation = "Câu hỏi gián tiếp giữ trật tự câu kể; mệnh đề chính phủ định *haven't met* cần đuôi khẳng định *have you?*. *Used to + V* nói thói quen cũ, còn *be used to + V-ing* nói đã quen. Dùng *an* trước âm nguyên âm trong *engineer*."

[[questions]]
id = "cefr-b1-011"
module = "cefr-b1-grammar-plus"
type = "essay"
difficulty = 2
prompt = '''
Bạn đang ở một thị trấn lạ. Viết **hai câu tiếng Anh** để hỏi lịch sự đường đến bảo tàng và hỏi xem nó có mở cửa vào thứ Hai không. Dùng câu hỏi gián tiếp.
