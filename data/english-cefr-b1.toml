id = "cefr-b1-037"
module = "cefr-b1-reading-writing"
type = "single"
difficulty = 2
prompt = "You are writing a formal email to a course manager whose name is Ms Green. Which opening is most suitable?"
options = ["Dear Ms Green,", "Hey Green!", "Hi mate,", "Dear my teacher friend,"]
answer = [0]
explanation = "*Dear Ms Green,* là lời chào phù hợp trong email trang trọng gửi người nhận đã biết tên."

[[questions]]
id = "cefr-b1-038"
module = "cefr-b1-reading-writing"
type = "single"
difficulty = 3
prompt = "Which sentence is the clearest topic sentence for a paragraph about the benefits of walking to work?"
options = ["Walking to work can improve health and save money.", "Yesterday, I saw a red car near my house.", "Firstly, because the weather was nice.", "In addition, my shoes are new."]
answer = [0]
explanation = "Câu chủ đề nêu rõ ý chính mà các câu sau có thể giải thích bằng lý do hoặc ví dụ."

[[questions]]
id = "cefr-b1-039"
module = "cefr-b1-reading-writing"
type = "multiple"
difficulty = 2
prompt = "Chọn các câu phù hợp với một email trang trọng hỏi thông tin về khóa học."
options = ["Dear Mr Lee,", "Could you please send me the course dates?", "I am writing to ask about your evening class.", "Hey, send me the dates now!", "See ya, Mr Lee!"]
answer = [0, 1, 2]
explanation = "Lời chào và cách nêu yêu cầu lịch sự phù hợp với email trang trọng. Các câu còn lại quá suồng sã hoặc mang tính mệnh lệnh."

[[questions]]
id = "cefr-b1-040"
module = "cefr-b1-reading-writing"
type = "fill"
difficulty = 1
prompt = '''
Điền từ nối phù hợp:

{{blank}}, I would like to describe the problem with my new phone. (thứ nhất)
It is light and easy to use. {{blank}}, the battery lasts all day. (thêm vào đó)
The camera is good. {{blank}}, the screen is difficult to read outside. (tuy nhiên)
'''
blanks = [["firstly", "first"], ["in addition"], ["however"]]
explanation = "*Firstly/first* mở ý đầu, *in addition* bổ sung thông tin, còn *however* báo hiệu ý tương phản."

[[questions]]
id = "cefr-b1-041"
module = "cefr-b1-reading-writing"
type = "fill"
difficulty = 2
prompt = '''
Hoàn thành đoạn kết email trang trọng gửi **Mr Lee**:

I look forward to hearing from you.
{{blank}},
Mai Tran
'''
blanks = [["yours sincerely"]]
explanation = "Khi biết tên người nhận và mở đầu bằng *Dear Mr Lee*, cách kết thư trang trọng thường dùng là *Yours sincerely*."

[[questions]]
id = "cefr-b1-042"
module = "cefr-b1-reading-writing"
type = "fill"
difficulty = 2
prompt = '''
Điền **however** hoặc **in addition**:

The library is close to my house. {{blank}}, it has a quiet room where I can study.
The room is comfortable. {{blank}}, it can be noisy after school.
'''
blanks = [["in addition"], ["however"]]
explanation = "Ý thứ nhất bổ sung lợi ích nên dùng *in addition*; ý thứ hai nêu điểm trái ngược nên dùng *however*."

[[questions]]
id = "cefr-b1-043"
module = "cefr-b1-reading-writing"
type = "fill"
difficulty = 3
prompt = '''
Đọc đoạn văn rồi điền thông tin:

“Our town opened a small weekend market in May. Local farmers sell fruit there, and visitors can buy bread from a family bakery. The market closes at 2 p.m.”

1. The market opened in {{blank}}.
2. Visitors can buy bread from a family {{blank}}.
'''
blanks = [["may"], ["bakery"]]
explanation = "Quét lại văn bản để tìm chi tiết cụ thể; giữ đúng từ và thông tin được nêu trong bài."

[[questions]]
id = "cefr-b1-044"
module = "cefr-b1-reading-writing"
type = "essay"
difficulty = 2
prompt = '''
Viết **một đoạn văn 4–5 câu tiếng Anh** nêu ý kiến về việc học sinh đi xe buýt đến trường. Mở đầu bằng câu chủ đề, đưa ra hai lý do và dùng ít nhất hai từ nối trong số *Firstly, In addition, However, Finally*.
'''
keywords = [["bus", "public transport"], ["firstly", "first"], ["in addition", "also"], ["however", "but"], ["because", "so"]]
min_keywords = 4
model_answer = '''Students should take the bus to school when possible. Firstly, it can save money for families. In addition, fewer cars near the school can make the air cleaner. However, buses may be crowded in the morning. I think the bus is still a good choice because it helps the whole community.'''
explanation = "Đoạn văn có câu chủ đề, lý do và từ nối; các ý liên kết để người đọc theo dõi quan điểm."

[[questions]]
id = "cefr-b1-x001"
module = "cefr-b1-grammar-plus"
type = "single"
difficulty = 1
prompt = "If you heat ice, it {{blank}} into water."
options = ["melts", "will melt", "would melt", "is melting"]
answer = [0]
explanation = "Đây là quy luật chung nên dùng hiện tại đơn ở cả hai mệnh đề điều kiện loại 0."

[[questions]]
id = "cefr-b1-x002"
module = "cefr-b1-grammar-plus"
type = "single"
difficulty = 2
prompt = "The old library {{blank}} last year after the roof was damaged."
options = ["repaired", "was repaired", "has repaired", "is repairing"]
answer = [1]
explanation = "Bị động quá khứ có dạng was/were + V3; library là vật được sửa."

[[questions]]
id = "cefr-b1-x003"
module = "cefr-b1-grammar-plus"
type = "single"
difficulty = 2
prompt = "“I work in Bristol,” Ben said. Ben said that he {{blank}} in Bristol."
options = ["works", "worked", "has worked", "will work"]
answer = [1]
explanation = "Trong lời tường thuật quá khứ, hiện tại đơn thường lùi về quá khứ đơn."

[[questions]]
id = "cefr-b1-x004"
module = "cefr-b1-grammar-plus"
type = "single"
difficulty = 1
prompt = "The woman {{blank}} teaches our evening class is from Leeds."
options = ["which", "where", "who", "whose"]
answer = [2]
explanation = "Dùng who cho người làm chủ ngữ của mệnh đề quan hệ."

[[questions]]
id = "cefr-b1-x005"
module = "cefr-b1-grammar-plus"
type = "single"
difficulty = 2
prompt = "Our neighbours suggested {{blank}} the meeting to Friday afternoon."
options = ["to move", "moving", "move", "moved"]
answer = [1]
explanation = "Sau suggest dùng V-ing, không dùng to V."

[[questions]]
id = "cefr-b1-x006"
module = "cefr-b1-grammar-plus"
type = "multiple"
difficulty = 2
prompt = "Select the sentences that use conditionals correctly."
options = ["If you press this button, the screen lights up.", "If it rains tomorrow, we will take a taxi.", "If I would have more time, I would visit you.", "If she lived closer, she would walk to work.", "If the train will be late, call me."]
answer = [0, 1, 3]
explanation = "Điều kiện loại 0/1/2 có cấu trúc đúng ở các lựa chọn được chọn; không dùng would ngay sau if."

[[questions]]
id = "cefr-b1-x007"
module = "cefr-b1-grammar-plus"
type = "multiple"
difficulty = 3
prompt = "Which sentences use a passive or a relative clause correctly?"
options = ["The tickets were checked at the entrance.", "This is the café where we met.", "The parcel delivered yesterday by the post office.", "My aunt, which lives in York, is a nurse.", "The room was cleaned before the guests arrived."]
answer = [0, 1, 4]
explanation = "Câu bị động cần be + V3; mệnh đề quan hệ phải có đại từ phù hợp và trật tự đúng."

[[questions]]
id = "cefr-b1-x008"
module = "cefr-b1-grammar-plus"
type = "multiple"
difficulty = 3
prompt = "Select the sentences with correct verb patterns, reflexives or phrasal verbs."
options = ["He avoids driving at night.", "Mina introduced herself to the new class.", "Please turn off it before you leave.", "We looked after our neighbour’s dog.", "They decided taking the earlier bus."]
answer = [0, 1, 3]
explanation = "Các đáp án đúng dùng V-ing sau avoid, đại từ phản thân đúng chủ thể hoặc phrasal verb tự nhiên."

[[questions]]
id = "cefr-b1-x009"
module = "cefr-b1-grammar-plus"
type = "fill"
difficulty = 2
prompt = "Complete the conditional sentences.\n\n1. If you {{blank}} (mix) red and blue, you get purple.\n2. If I {{blank}} (have) a car, I would visit more often.\n3. If the weather is clear tomorrow, we {{blank}} (go) hiking."
blanks = [["mix"], ["had"], ["will go", "'ll go"]]
explanation = "Loại 0 dùng hiện tại đơn; loại 2 dùng quá khứ đơn trong mệnh đề if; loại 1 dùng will ở mệnh đề kết quả."

[[questions]]
id = "cefr-b1-x010"
module = "cefr-b1-grammar-plus"
type = "fill"
difficulty = 2
prompt = "Complete the reported and relative clauses.\n\n1. “I am busy,” Lan said. Lan said she {{blank}} busy.\n2. The film {{blank}} we watched was based on a true story.\n3. “We live here,” they said. They said they {{blank}} there."
blanks = [["was"], ["that", "which"], ["lived"]]
explanation = "Lời tường thuật thường lùi hiện tại đơn về quá khứ; that/which có thể chỉ vật; live lùi thành lived."

[[questions]]
id = "cefr-b1-x011"
module = "cefr-b1-grammar-plus"
type = "fill"
difficulty = 2
prompt = "Complete each sentence with a purpose or result structure.\n\n1. I left home early {{blank}} catch the first bus.\n2. The room was {{blank}} noisy that we moved outside.\n3. She spoke slowly {{blank}} everyone could follow the instructions."
blanks = [["to"], ["so"], ["so that"]]
explanation = "Dùng to + động từ để nói mục đích; so + tính từ + that diễn đạt kết quả; so that đi với mệnh đề."

[[questions]]
id = "cefr-b1-x012"
module = "cefr-b1-grammar-plus"
type = "fill"
difficulty = 3
prompt = "Complete the sentences with an article, quantifier or question form.\n\n1. We need {{blank}} information before we can decide. (a little / a few)\n2. Could you tell me when the office {{blank}}? (close)\n3. You have met the new manager, {{blank}}? (tag)"
blanks = [["a little"], ["closes"], ["haven't you"]]
explanation = "Information không đếm được; mệnh đề gián tiếp dùng trật tự câu kể; câu chính khẳng định với have dùng đuôi phủ định haven't you."

[[questions]]
id = "cefr-b1-x013"
module = "cefr-b1-grammar-plus"
type = "fill"
difficulty = 2
prompt = "Complete the sentences with the correct form.\n\n1. I am used to {{blank}} (work) with a small team.\n2. She repaired the chair by {{blank}} (she).\n3. The children helped {{blank}} when they could not reach the top shelf. (each other / themselves)"
blanks = [["working"], ["herself"], ["each other"]]
explanation = "Be used to đi với danh từ/V-ing; by herself nhấn mạnh tự làm; hành động tương hỗ dùng each other."

[[questions]]
id = "cefr-b1-x014"
module = "cefr-b1-grammar-plus"
type = "essay"
difficulty = 3
prompt = "Write three or four connected sentences about a habit you changed. Include one used-to contrast, one relative clause and one conditional sentence."
keywords = [["used to"], ["who", "that", "which"], ["if"]]
min_keywords = 3
model_answer = "I used to leave every task until Friday, but now I plan the week on Monday. My colleague, who is very organised, showed me a simple checklist. If I follow it, I finish important work earlier. The checklist is reviewed every month."
explanation = "Tự luận này chỉ kiểm tra các cấu trúc mục tiêu có xuất hiện; không nên xem điểm từ khóa là đánh giá toàn diện độ chính xác."

[[questions]]
id = "cefr-b1-x015"
module = "cefr-b1-vocab"
type = "single"
difficulty = 1
prompt = "Everyone on the project must {{blank}} in a short safety workshop before Monday."
options = ["take part", "make part", "do part", "have part"]
answer = [0]
explanation = "Take part in là collocation tự nhiên để nói tham gia một hoạt động."

[[questions]]
id = "cefr-b1-x016"
module = "cefr-b1-vocab"
type = "single"
difficulty = 1
prompt = "The team needs to {{blank}} a decision before the booking closes."
options = ["make", "do", "take", "get"]
answer = [0]
explanation = "Make a decision là collocation chuẩn."

[[questions]]
id = "cefr-b1-x017"
module = "cefr-b1-vocab"
type = "single"
difficulty = 1
prompt = "Our new assistant is responsible {{blank}} updating the customer list."
options = ["for", "to", "with", "about"]
answer = [0]
explanation = "Responsible đi với giới từ for."

[[questions]]
id = "cefr-b1-x018"
module = "cefr-b1-vocab"
type = "single"
difficulty = 2
prompt = "The manager had to {{blank}} the interview until next week because she was ill."
options = ["put off", "look after", "find out", "take up"]
answer = [0]
explanation = "Put off có nghĩa là hoãn lại."

[[questions]]
id = "cefr-b1-x019"
module = "cefr-b1-vocab"
type = "single"
difficulty = 2
prompt = "The report gives a clear {{blank}} of why the bus route changed."
options = ["explain", "explanation", "explaining", "explained"]
answer = [1]
explanation = "Explanation là danh từ cần thiết sau a clear."

[[questions]]
id = "cefr-b1-x020"
module = "cefr-b1-vocab"
type = "multiple"
difficulty = 2
prompt = "Select the sentences with natural B1 collocations."
options = ["She has made good progress in reading.", "Please pay attention to the final date.", "He did a mistake in the form.", "Nora took responsibility for the delay.", "We took a photo of the old bridge."]
answer = [0, 1, 3, 4]
explanation = "Make progress, pay attention, take responsibility và take a photo đều tự nhiên; do a mistake không đúng collocation."

[[questions]]
id = "cefr-b1-x021"
module = "cefr-b1-vocab"
type = "multiple"
difficulty = 2
prompt = "Choose the sentences that use phrasal verbs naturally."
options = ["Could you look after my bag for a moment?", "We ran out of milk, so I went to the shop.", "She gave up the bus at the next stop.", "They carried on working after lunch.", "I looked the meaning up in a dictionary."]
answer = [0, 1, 3, 4]
explanation = "Look after, run out of, carry on và look up đều đúng trong ngữ cảnh; give up a bus không có nghĩa lên/xuống xe."

[[questions]]
id = "cefr-b1-x022"
module = "cefr-b1-vocab"
type = "multiple"
difficulty = 3
prompt = "Select the sentences with correct word forms and meanings."
options = ["The guide is reliable and easy to follow.", "We need more information before choosing.", "She gave a carefully explanation.", "Their employment began after the training course.", "The team completed the work successfully."]
answer = [0, 1, 3, 4]
explanation = "Reliable là tính từ sau is; information là danh từ không đếm được; carefully bổ nghĩa cho động từ; employment là danh từ."

[[questions]]
id = "cefr-b1-x023"
module = "cefr-b1-vocab"
type = "fill"
difficulty = 2
prompt = "Complete the collocations with make, do, take, have or get.\n\n1. The researchers will {{blank}} a survey this week.\n2. Please {{blank}} attention to the warning sign.\n3. I hope to {{blank}} the chance to study abroad.\n4. We need to {{blank}} ready before the visitors arrive."
blanks = [["do"], ["pay"], ["have"], ["get"]]
explanation = "Các cụm tự nhiên là do a survey, pay attention, have the chance và get ready."

[[questions]]
id = "cefr-b1-x024"
module = "cefr-b1-vocab"
type = "fill"
difficulty = 3
prompt = "Complete each sentence with the correct form of the word in brackets.\n\n1. The new employee showed great {{blank}} (confident).\n2. This website is {{blank}} useful for beginners. (particular)\n3. We need more {{blank}} about the evening course. (inform)"
blanks = [["confidence"], ["particularly"], ["information"]]
explanation = "Sau great cần danh từ confidence; trạng từ particularly bổ nghĩa useful; information là danh từ không đếm được."

[[questions]]
id = "cefr-b1-x025"
module = "cefr-b1-vocab"
type = "fill"
difficulty = 2
prompt = "Complete the phrasal verbs.\n\n1. I need to {{blank}} up the train times before we leave.\n2. The meeting was put {{blank}} until Thursday.\n3. The team carried {{blank}} with the project after the delay."
blanks = [["look"], ["off"], ["on"]]
explanation = "Look up là tra cứu; put off là hoãn; carry on là tiếp tục."

[[questions]]
id = "cefr-b1-x026"
module = "cefr-b1-vocab"
type = "fill"
difficulty = 2
prompt = "Complete each sentence with a word that matches the meaning.\n\n1. Money you receive for your work is your {{blank}}. (general term)\n2. A person who applies for a job is an {{blank}}.\n3. When prices rise, the cost of living may become less {{blank}}. (affordable)"
blanks = [["income"], ["applicant"], ["affordable"]]
explanation = "Income là thu nhập; applicant là người nộp đơn; affordable nói về mức giá có thể chi trả."

[[questions]]
id = "cefr-b1-x027"
module = "cefr-b1-vocab"
type = "fill"
difficulty = 2
prompt = "Complete the collocations with the correct preposition.\n\n1. The result depends {{blank}} how much time we have.\n2. My brother is interested {{blank}} wildlife photography.\n3. She succeeded {{blank}} finding a cheaper ticket."
blanks = [["on"], ["in"], ["in"]]
explanation = "Depend on, interested in và succeed in là các kết hợp từ cố định."

[[questions]]
id = "cefr-b1-x028"
module = "cefr-b1-vocab"
type = "essay"
difficulty = 2
prompt = "Write three sentences about a skill you have developed. Include one collocation such as make progress or take responsibility, and one phrasal verb such as find out or carry on."
keywords = [["make progress", "take responsibility"], ["find out", "carry on"]]
min_keywords = 2
model_answer = "I made progress in English by reading a short article every day. When I find out that a phrase is unfamiliar, I write it in my notebook. I now take responsibility for reviewing my notes each week."
explanation = "Bài mẫu bao gồm collocation và phrasal verb được yêu cầu; nhóm từ khóa chỉ xác nhận ý có mặt."

[[questions]]
id = "cefr-b1-x029"
module = "cefr-b1-functions"
type = "single"
difficulty = 2
prompt = "A colleague says, “The schedule is impossible.” Which reply shows empathy and asks for useful detail?"
options = ["That is not my problem.", "I can see why that feels difficult. Which deadline is causing the most pressure?", "You should have planned better.", "The schedule is perfect, so stop worrying."]
answer = [1]
explanation = "Câu đúng công nhận khó khăn và hỏi thông tin cần thiết để xử lý."

[[questions]]
id = "cefr-b1-x030"
module = "cefr-b1-functions"
type = "single"
difficulty = 1
prompt = "You need to interrupt politely during a meeting. What can you say?"
options = ["Be quiet for a moment.", "May I add one point before we move on?", "You are wrong again.", "I will speak now."]
answer = [1]
explanation = "May I add something? là cách xin lượt nói lịch sự."

[[questions]]
id = "cefr-b1-x031"
module = "cefr-b1-functions"
type = "single"
difficulty = 2
prompt = "A customer says the parcel has not arrived. Which response is most helpful?"
options = ["You must have lost it.", "I’m sorry it hasn’t arrived. I’ll check the tracking information now.", "Wait and see.", "The delivery company is always late."]
answer = [1]
explanation = "Phản hồi hữu ích xác nhận vấn đề và nêu bước kiểm tra tiếp theo."

[[questions]]
id = "cefr-b1-x032"
module = "cefr-b1-functions"
type = "single"
difficulty = 1
prompt = "A friend invites you to a concert, but you are working that evening. Choose a natural refusal."
options = ["No. That sounds bad.", "Thanks for asking, but I’m working that evening. Could we meet next week instead?", "I do not want to answer.", "You should choose a different concert."]
answer = [1]
explanation = "Câu trả lời cảm ơn lời mời, từ chối ngắn gọn và có thể đề xuất dịp khác."

[[questions]]
id = "cefr-b1-x033"
module = "cefr-b1-functions"
type = "single"
difficulty = 1
prompt = "You did not understand a detail in an online meeting. What is the clearest request?"
options = ["Could you clarify what you mean by “shared access”?", "Why are you speaking like that?", "I heard everything.", "Let us ignore that detail."]
answer = [0]
explanation = "Yêu cầu người nói nhắc lại hoặc làm rõ một điểm cụ thể giúp tránh đoán sai."

[[questions]]
id = "cefr-b1-x034"
module = "cefr-b1-functions"
type = "multiple"
difficulty = 2
prompt = "Select the responses that handle a complaint constructively."
options = ["I’m sorry the room was not ready. I’ll contact reception now.", "You probably arrived too early.", "I understand why the delay was frustrating. When did you check in?", "That is not a real problem.", "Let me confirm the booking and update you in ten minutes."]
answer = [0, 2, 4]
explanation = "Các đáp án đúng xin lỗi hoặc ghi nhận, hỏi chi tiết và đề nghị hành động; đổ lỗi hay gạt đi không giúp giải quyết."

[[questions]]
id = "cefr-b1-x035"
module = "cefr-b1-functions"
type = "multiple"
difficulty = 2
prompt = "Which phrases support clear, respectful online interaction?"
options = ["Could you clarify what “urgent” means in this case?", "That is a stupid suggestion.", "I agree with the goal, although I see one risk.", "Let me summarise what we have agreed so far.", "Nobody asked for your opinion."]
answer = [0, 2, 3]
explanation = "Nhắc lại ý, hỏi người khác bổ sung và diễn đạt lại trung lập giúp cuộc trao đổi hợp tác."

[[questions]]
id = "cefr-b1-x036"
module = "cefr-b1-functions"
type = "multiple"
difficulty = 3
prompt = "A colleague has misunderstood a meeting time. Select the actions that could mediate the disagreement fairly."
options = ["Ask each person to explain what time they understood.", "Say that the more senior colleague must be right.", "Restate both accounts without blaming either person.", "Check the written invitation together.", "Tell them to stop discussing it."]
answer = [0, 2, 3]
explanation = "Người trung gian kiểm tra lịch, nghe cả hai bên và tóm tắt điểm đã thống nhất; không tự chọn phe."

[[questions]]
id = "cefr-b1-x037"
module = "cefr-b1-functions"
type = "fill"
difficulty = 2
prompt = "Complete the polite requests.\n\n1. Could you {{blank}} me through to the course office?\n2. Would you mind {{blank}} that last point again?\n3. Could you tell me {{blank}} the meeting starts?"
blanks = [["put"], ["repeating"], ["when"]]
explanation = "Put someone through, mind + V-ing, và câu hỏi gián tiếp với when là các mẫu đúng."

[[questions]]
id = "cefr-b1-x038"
module = "cefr-b1-functions"
type = "fill"
difficulty = 1
prompt = "Complete the invitation and responses.\n\n1. Would you like {{blank}} us for lunch on Friday?\n2. Thanks for inviting me, but I {{blank}} already made plans.\n3. I’d love to come. What time should I {{blank}} there?"
blanks = [["to join"], ["have"], ["be"]]
explanation = "Would like đi với to V; hiện tại hoàn thành dùng have; be there là mẫu tự nhiên."

[[questions]]
id = "cefr-b1-x039"
module = "cefr-b1-functions"
type = "fill"
difficulty = 2
prompt = "Complete the suggestions and clarification phrases.\n\n1. How about {{blank}} the call until everyone is available? (move)\n2. I see your point. {{blank}}, could we check the cost first?\n3. When you say “flexible”, do you {{blank}} we can change the date?"
blanks = [["moving"], ["however"], ["mean"]]
explanation = "How about đi với V-ing; however báo hiệu ý tương phản; mean hỏi nghĩa của từ."

[[questions]]
id = "cefr-b1-x040"
module = "cefr-b1-functions"
type = "fill"
difficulty = 1
prompt = "Complete the neutral summary.\n\nA: “I need the room by 9:00.”\nB: “I can open it at 8:30.”\n\nSo, you need the room by {{blank}}, and it can be opened at {{blank}}."
blanks = [["9:00", "nine"], ["8:30", "half past eight"]]
explanation = "Tóm tắt cần giữ nguyên hai mốc thời gian, không thêm kết luận mới."

[[questions]]
id = "cefr-b1-x041"
module = "cefr-b1-functions"
type = "essay"
difficulty = 2
prompt = "Write a short reply in a team chat. A colleague says a training link does not work. Acknowledge the problem, ask one clarifying question and offer a next step."
keywords = [["sorry", "understand"], ["which browser", "what browser"], ["send", "check", "share"]]
min_keywords = 3
model_answer = "I’m sorry the training link is not working. Which browser are you using? Please send me a screenshot, and I’ll check the access settings."
explanation = "Bài mẫu có lời ghi nhận, câu hỏi làm rõ và bước xử lý; từ khóa không đánh giá độ lịch sự hay ngữ pháp tổng thể."

[[questions]]
id = "cefr-b1-x042"
module = "cefr-b1-reading-writing"
type = "single"
difficulty = 1
prompt = "Read the notice: “The library will close at 4 p.m. on Thursday for electrical work. Books can be returned in the outside box.” What should visitors do if they need to return a book after 4 p.m.?"
options = ["Use the outside return box.", "Wait inside until the library reopens.", "Return it to the electrical team.", "Take the book to the town hall."]
answer = [0]
explanation = "Thông báo nói hộp trả sách bên ngoài vẫn dùng được sau giờ đóng cửa."

[[questions]]
id = "cefr-b1-x043"
module = "cefr-b1-reading-writing"
type = "single"
difficulty = 1
prompt = "Read the email: “Could you send the final attendee list by noon? We need it to print name badges before the workshop.” Why does the writer need the list?"
options = ["To book a larger room.", "To print name badges before the workshop.", "To cancel the event.", "To update the website."]
answer = [1]
explanation = "Câu thứ hai nêu trực tiếp mục đích: in thẻ tên trước buổi workshop."

[[questions]]
id = "cefr-b1-x044"
module = "cefr-b1-reading-writing"
type = "single"
difficulty = 2
prompt = "A review says, “The app is easy to use, although it takes a long time to load on older phones.” What is the reviewer’s overall view?"
options = ["Completely negative.", "Balanced, with a strength and a limitation.", "Uncertain about what the app does.", "Only focused on the price."]
answer = [1]
explanation = "Người viết nêu một ưu điểm và một hạn chế, nên đánh giá cân bằng."

[[questions]]
id = "cefr-b1-x045"
module = "cefr-b1-reading-writing"
type = "single"
difficulty = 2
prompt = "Which sentence is a fact rather than an opinion?"
options = ["The course has six evening sessions.", "The course is the most enjoyable in town.", "The teacher is probably too strict.", "Evening classes are always better."]
answer = [0]
explanation = "“The course has six evening sessions” là thông tin có thể kiểm tra; các lựa chọn kia đánh giá chủ quan."

[[questions]]
id = "cefr-b1-x046"
module = "cefr-b1-reading-writing"
type = "single"
difficulty = 2
prompt = "Choose the best order for a short paragraph about joining a new class."
options = ["I met two helpful classmates. I joined a cooking class last month. Now I feel more confident in the kitchen.", "I joined a cooking class last month. I met two helpful classmates there. Now I feel more confident in the kitchen.", "Now I feel more confident. I met two classmates. I joined a class.", "I met two classmates. Now I joined a class last month. I feel cooking."]
answer = [1]
explanation = "Câu mở nêu chủ đề, câu sau kể trải nghiệm cụ thể, câu cuối đưa cảm nhận hoặc kết quả."

[[questions]]
id = "cefr-b1-x047"
module = "cefr-b1-reading-writing"
type = "multiple"
difficulty = 1
prompt = "Read the message: “The evening course starts on 12 September, meets every Tuesday, and costs £90. Students should bring a notebook. The first lesson is in Room 4.” Select all details stated in the message."
options = ["It starts on 12 September.", "It meets every Tuesday.", "It costs £90.", "It lasts for twelve weeks.", "The first lesson is in Room 4."]
answer = [0, 1, 2, 4]
explanation = "Các đáp án được chọn là chi tiết xuất hiện trong thông báo; số buổi không được nêu."

[[questions]]
id = "cefr-b1-x048"
module = "cefr-b1-reading-writing"
type = "multiple"
difficulty = 2
prompt = "Select the sentences suitable for a polite formal email asking about a course."
options = ["Dear Ms Ahmed,", "Hey, tell me the price now.", "Could you please let me know whether places are still available?", "Send the timetable today.", "I look forward to hearing from you."]
answer = [0, 2, 4]
explanation = "Câu phù hợp dùng lời chào, câu hỏi lịch sự và lời kết; slang và mệnh lệnh quá trực tiếp không phù hợp."

[[questions]]
id = "cefr-b1-x049"
module = "cefr-b1-reading-writing"
type = "multiple"
difficulty = 2
prompt = "Read the paragraph: “The town opened a weekend market in May. Local farmers sell fruit there, and a family bakery offers fresh bread. The market closes at 2 p.m.” Which statements are supported?"
options = ["The market opened in May.", "Farmers sell fruit there.", "A family bakery sells bread.", "The market closes at 5 p.m.", "The market is open every weekday."]
answer = [0, 1, 2]
explanation = "Chỉ chọn dữ kiện có trong đoạn; không suy ra chợ mở hàng ngày hay bán rau."

[[questions]]
id = "cefr-b1-x050"
module = "cefr-b1-reading-writing"
type = "fill"
difficulty = 2
prompt = "Complete the email with linking words.\n\n{{blank}} (firstly), I would like to ask about the evening course. I work until six. {{blank}} (therefore), I need to know whether the class begins later. {{blank}} (in addition), please send me the fee information."
blanks = [["firstly"], ["therefore"], ["in addition"]]
explanation = "Firstly mở ý đầu; therefore nêu kết quả từ lịch làm việc; in addition thêm yêu cầu."

[[questions]]
id = "cefr-b1-x051"
module = "cefr-b1-reading-writing"
type = "fill"
difficulty = 1
prompt = "Complete the formal email closing.\n\nDear Mr Lee,\nThank you for explaining the application process. I will send the completed form tomorrow.\nYours {{blank}},\nMai Tran"
blanks = [["sincerely"]]
explanation = "Khi biết tên người nhận và mở đầu Dear Mr Lee, có thể kết bằng Yours sincerely."

[[questions]]
id = "cefr-b1-x052"
module = "cefr-b1-reading-writing"
type = "fill"
difficulty = 1
prompt = "Complete the summary using details from the notice.\n\n“On Saturday, the museum opens at 10 a.m. The guided tour begins at 11:30 and lasts one hour. Visitors should book online.”\n\nThe museum opens at {{blank}}. The tour starts at {{blank}} and lasts {{blank}}."
blanks = [["10 a.m.", "10am", "ten a.m."], ["11:30", "11.30", "half past eleven"], ["one hour", "60 minutes"]]
explanation = "Summary giữ đúng ba chi tiết chính được nêu."

[[questions]]
id = "cefr-b1-x053"
module = "cefr-b1-reading-writing"
type = "fill"
difficulty = 1
prompt = "Complete the instructions for a new online class.\n\n{{blank}} (first), open the invitation email. {{blank}} (then), select the meeting link. {{blank}} (finally), check that your microphone is muted."
blanks = [["first"], ["then"], ["finally"]]
explanation = "Các từ nối sắp xếp các bước theo trình tự, không đổi thứ tự hành động."

[[questions]]
id = "cefr-b1-x054"
module = "cefr-b1-reading-writing"
type = "fill"
difficulty = 2
prompt = "Rewrite the information in a neutral summary.\n\n“Some students prefer online lessons because they save travel time. Others prefer the classroom because they can ask questions immediately.”\n\nThe text describes two views: some students value the time saved by online lessons, while others prefer {{blank}} interaction."
blanks = [["face-to-face", "in-person"]]
explanation = "Tóm tắt giữ hai quan điểm và dùng từ bao quát thay cho lặp lại cả câu."

[[questions]]
id = "cefr-b1-x055"
module = "cefr-b1-reading-writing"
type = "essay"
difficulty = 2
prompt = "Write a short email to a course organiser (about 60–80 words). Explain which session you want to join, give one reason, and ask one polite question about preparation."
keywords = [["session", "class"], ["because", "reason"], ["could you", "would you"]]
min_keywords = 3
model_answer = "Dear Course Organiser, I would like to join the Tuesday session because it fits my work schedule. Could you tell me whether I need to bring any materials? Thank you for your help. Kind regards, Mai."
explanation = "Tự luận được so khớp ý chính qua từ khóa; cần người dạy xem thêm độ phù hợp register, độ rõ và ngữ pháp."
