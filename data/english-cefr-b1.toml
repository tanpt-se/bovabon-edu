2. We {{blank}} a meeting every Monday morning.
3. She wants to {{blank}} a job in education.
'''
blanks = [["do"], ["have"], ["get"]]
explanation = "Học các kết hợp cố định: *do homework*, *have a meeting*, *get a job*."

[[questions]]
id = "cefr-b1-020"
module = "cefr-b1-vocab"
type = "fill"
difficulty = 2
prompt = '''
Tạo từ đúng từ từ trong ngoặc:

1. This website is very {{blank}}; it helps me practise English. (use)
2. The company offers jobs in teaching and {{blank}}. (employ)
3. Please be {{blank}} when you cross this busy road. (care)
'''
blanks = [["useful"], ["employment"], ["careful"]]
explanation = "Sau *very* và *be* cần tính từ *useful/careful*; sau *in* trong cụm này cần danh từ *employment*."

[[questions]]
id = "cefr-b1-021"
module = "cefr-b1-vocab"
type = "fill"
difficulty = 2
prompt = '''
Điền một từ phù hợp với nghĩa trong ngoặc:

1. The money you receive regularly for your work is your {{blank}}. (tiền lương)
2. I need to {{blank}} a book from the library and return it next week. (mượn)
3. We sort glass and paper so that we can {{blank}} them. (tái chế)
'''
blanks = [["salary"], ["borrow"], ["recycle"]]
explanation = "*Salary* là tiền lương; người mượn *borrows* còn người cho mượn *lends*; *recycle* là tái chế."

[[questions]]
id = "cefr-b1-022"
module = "cefr-b1-vocab"
type = "essay"
difficulty = 2
prompt = '''
Viết **ba câu tiếng Anh** đề xuất cách làm cho trường học thân thiện với môi trường hơn. Nêu một hành động giảm rác và một cách đi lại hoặc tiết kiệm năng lượng.
'''
keywords = [["recycle", "recycling"], ["waste", "rubbish"], ["public transport", "bus", "walk", "cycle"], ["save energy", "turn off the lights"]]
min_keywords = 3
model_answer = '''Our school should recycle paper and bottles to reduce waste. Students can take public transport or cycle to school. We can also save energy by turning off the lights when we leave a room.'''
explanation = "Câu trả lời nêu hành động cụ thể và dùng từ vựng môi trường ở mức B1 như *recycle*, *waste* và *public transport*."

[[modules]]
id = "cefr-b1-functions"
title = "Chức năng giao tiếp B1"
description = "Nêu ý kiến, phản hồi lịch sự, đưa lời khuyên, xử lý phàn nàn, kể chuyện và nói về kế hoạch."
lesson = '''
### Nêu ý kiến và phản hồi
| Mục đích | Cách nói tự nhiên | Ví dụ |
|---|---|---|
| Hỏi ý kiến | *What do you think about…?* | *What do you think about online classes?* |
| Nêu ý kiến | *In my opinion,… / I think…* | *In my opinion, the bus is more convenient.* |
| Đồng ý | *I agree. / That's a good point.* | *I agree; it saves time.* |
| Không đồng ý nhẹ nhàng | *I see what you mean, but… / I'm not sure I agree.* | *I see what you mean, but the train is cheaper.* |

Để trao đổi thân thiện, hãy ghi nhận ý của người kia rồi nêu lý do ngắn. Tránh chỉ nói *You are wrong*; có thể dùng *I'm not sure I agree because…* hoặc *I see your point, but…*.

### Khuyên và phàn nàn
Khuyên bằng *You should + V*, *You could + V* hoặc *Why don't you + V?*: *You should speak to your teacher.* Không thêm *to* sau *should*. Khi phàn nàn, nêu vấn đề cụ thể, giữ giọng bình tĩnh, rồi đề nghị cách giải quyết: *Excuse me, the room is very noisy. Could I change rooms, please?* Tránh lời buộc tội hoặc mệnh lệnh trực tiếp nếu muốn nhân viên dễ hỗ trợ. Nếu nhận phàn nàn, có thể xin lỗi, xác nhận vấn đề và đề xuất bước tiếp theo: *I'm sorry about that. I'll ask someone to check it.*

### Kể chuyện có trình tự
Dùng từ nối để người nghe theo kịp: *At first / First* mở đầu; *then / after that / a little later* đưa sự kiện tiếp theo; *because / so* giải thích nguyên nhân hoặc kết quả; *in the end / finally* kết thúc. Ví dụ: *First, we missed the bus. Then, we called a taxi. In the end, we arrived before the show started.* Không cần lặp *and then* ở mọi câu; thay đổi từ nối giúp câu chuyện rõ hơn.

### Kế hoạch, hoài bão và yêu cầu làm rõ
Nói kế hoạch gần bằng *I'm planning to…*, *I'd like to…*; nói mục tiêu bằng *I hope to…* hoặc *My goal is to…*: *I'm planning to take an English course because I want to work in tourism.* Khi chưa hiểu, hỏi lịch sự: *Could you explain what you mean?*, *Could you say that again, please?*, *Do you mean…?* Có thể nhắc lại phần đã hiểu trước khi hỏi. Lỗi hay gặp của người Việt là dịch nguyên mẫu *explain me*; động từ *explain* thường theo sau bằng nội dung (*explain the rule to me*) hoặc mệnh đề (*explain what you mean*).

Khi cần xin lỗi, nói rõ việc mình làm và thêm lời giải thích ngắn: *I'm sorry I'm late. The bus was delayed.* Có thể thuyết phục nhẹ bằng ý kiến kèm lợi ích cụ thể: *I think we should take the train because it is cheaper.* Mục tiêu là giúp người nghe hiểu lý do, không gây áp lực.
'''

