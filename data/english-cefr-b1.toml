id = "english-cefr-b1"
title = "Tiếng Anh B1 · Trung cấp"
icon = "B1"
color = "#16a34a"
group = "Tiếng Anh"
area = "english"
description = "Luyện tiếng Anh B1 qua ngữ pháp bổ sung, từ vựng chủ đề quen thuộc, giao tiếp và đọc–viết thực tế."

[[modules]]
id = "cefr-b1-grammar-plus"
title = "Ngữ pháp B1 mở rộng"
description = "Dạng tương lai, modal, mệnh đề kết quả/mục đích, câu hỏi gián tiếp và đuôi, mạo từ, lượng từ và be used to."
lesson = '''
### Chọn dạng tương lai theo ý nghĩa
| Dạng | Dùng khi | Ví dụ |
|---|---|---|
| will + V | quyết định ngay, lời hứa hoặc dự đoán theo ý kiến | *I'll help you. I think it will be busy.* |
| be going to + V | dự định đã có hoặc dự đoán có dấu hiệu hiện tại | *We're going to save money. Look at those clouds!* |
| hiện tại tiếp diễn | kế hoạch cá nhân đã sắp xếp | *I'm meeting Lan at six.* |
| hiện tại đơn | lịch trình cố định | *The bus leaves at 7.20.* |

### Modal: nghĩa vụ, cho phép, khả năng
| Cấu trúc | Nghĩa | Ví dụ |
|---|---|---|
| need to + V | cần làm | *You need to bring your ID.* |
| needn't + V | không cần làm | *You needn't print the form.* |
| be allowed to + V | được phép | *Visitors are allowed to take photos.* |
| may + V | có thể / xin phép lịch sự | *It may rain. May I sit here?* |
| be able to + V | có khả năng, dùng được ở nhiều thì | *She was able to finish on time.* |

Đừng nhầm *needn't* (không cần) với *mustn't* (bị cấm). Sau modal dùng động từ nguyên mẫu không *to*; riêng *need to* và *be allowed to* có *to*.

### Kết quả, mức độ và mục đích
*so + tính từ/trạng từ + that*: *The room was so noisy that I couldn't sleep.* · *such + (a/an) + tính từ + danh từ + that*: *It was such a useful lesson that I took notes.* Dùng *too + tính từ + to V* khi quá mức để làm gì (*too tired to walk*); dùng *tính từ + enough + to V* khi đủ khả năng (*old enough to travel alone*). Nói mục đích bằng *to / in order to + V* hoặc *so that + chủ ngữ + động từ*: *I left early to catch the bus.* / *I spoke slowly so that everyone could understand.*

### Câu hỏi lịch sự, câu hỏi đuôi
Trong câu hỏi gián tiếp, dùng trật tự câu kể sau từ để hỏi: *Could you tell me where the bank is?* Không nói *where is the bank* ở giữa câu. Câu hỏi có/không thường dùng *if/whether*: *Do you know if the shop is open?* Câu hỏi đuôi đổi cực tính: câu khẳng định thường theo sau bởi đuôi phủ định (*You live nearby, don't you?*); câu phủ định theo sau bởi đuôi khẳng định (*She isn't busy, is she?*). Chọn trợ động từ khớp với động từ chính.

### Mạo từ và từ chỉ lượng
Dùng *a/an* khi nói một danh từ đếm được số ít chưa xác định (*an interview*), *the* khi người nghe biết rõ đối tượng hoặc vật là duy nhất trong ngữ cảnh (*the interview at 2 p.m.*). Nói chung với danh từ số nhiều/không đếm được thường bỏ mạo từ: *Books are useful; Water is important.* *Go to school* nói về việc học; *go to the school* là tới địa điểm trường cụ thể. *Both* = cả hai; *either* = một trong hai; *neither* = không bên nào. Với danh từ số nhiều: *Both options are fine.* *Neither answer is correct.*

### used to và be used to
*used to + V* nói thói quen/trạng thái trong quá khứ nay đã đổi: *I used to cycle to work.* *be used to + danh từ/V-ing* nói đã quen: *I'm used to cycling in the rain.* Mẹo: sau *be used to*, chữ *to* là giới từ nên theo sau bằng danh từ hoặc V-ing. Lỗi thường gặp là viết *I'm used to cycle* hoặc dùng *will* ngay sau *if* trong câu điều kiện; hãy nhìn cấu trúc và ý nghĩa trước khi chọn dạng.

### Một số cấu trúc B1 khác
Đại từ phản thân (*myself, yourself, himself, herself, ourselves, themselves*) nhấn mạnh người tự làm việc đó: *I made the cake myself.* Dùng *each other* khi hai hay nhiều người làm việc qua lại: *The classmates help each other.* Với phrasal verb, một số cụm tách được: *turn off the light / turn the light off / turn it off*; một số cụm không tách: *look after a child* (không nói *look a child after*). Ghi nhớ cả cụm và vị trí đại từ. Để diễn đạt tương phản, *although + mệnh đề* có thể đứng đầu câu (*Although it was late, we stayed.*), *but* nối hai ý trong một câu, còn *however* thường mở câu tiếp theo (*It was late. However, we stayed.*). Không ghép *although…but* hoặc *but, however* trong cùng một cấu trúc.
'''

