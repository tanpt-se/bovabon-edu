[[modules]]
id = "cefr-b1-reading-writing"
title = "Đọc và viết B1"
description = "Đọc blog, tin ngắn, bài đánh giá; viết email theo văn phong phù hợp và đoạn văn mạch lạc."
lesson = '''
### Đọc văn bản ngắn có mục đích
Blog cá nhân thường kể trải nghiệm và cảm nhận; tin ngắn ưu tiên sự kiện chính, ai/làm gì/ở đâu/khi nào; bài đánh giá nêu nhận xét và lý do, đôi khi kết thúc bằng lời khuyên. Trước khi đọc kỹ, xem tiêu đề và câu đầu để đoán chủ đề. Khi làm câu hỏi chi tiết, tìm lại từ khóa trong bài và đọc cả câu xung quanh; đừng chọn đáp án chỉ vì nó lặp lại một từ giống bài. Phân biệt thông tin được nói rõ với suy luận đơn giản từ chi tiết.

### Email thân mật và trang trọng
| Phần | Thân mật | Trang trọng |
|---|---|---|
| Lời chào | *Hi Anna,* | *Dear Ms Brown,* |
| Mở đầu | *How are you?* | *I am writing to ask about…* |
| Yêu cầu | *Can you send me…?* | *Could you please send me…?* |
| Kết thư | *See you soon,* | *Yours sincerely,* |

Email cần đúng mục đích, đủ thông tin và ngắt đoạn rõ. Dùng lời chào/kết thư phù hợp với người nhận. Với email công việc đơn giản, tránh viết tắt quá thân mật; *I'm* có thể dùng trong trao đổi thân mật, còn *I am* thường hợp với thư trang trọng hơn. Không dịch nguyên cụm *I want to know* khi cần nhờ lịch sự; dùng *Could you please tell me…?*.

### Đoạn văn có câu chủ đề
Câu chủ đề nêu ý chính; các câu sau đưa lý do hoặc ví dụ; câu cuối có thể tóm tắt. Dùng từ nối đúng quan hệ nghĩa: *Firstly* mở lý do đầu tiên; *In addition* thêm ý; *However* báo hiệu tương phản; *For example* đưa ví dụ; *Finally* khép lại. Ví dụ: *Public transport is useful for students. Firstly, it is cheaper than driving. In addition, students can read on the bus. However, buses can be crowded at busy times.* Tránh đặt *but* và *however* cùng lúc trong một cấu trúc (*but, however*); mỗi từ nối cần liên kết hai ý có quan hệ phù hợp.

Ở B1, người học có thể viết email trang trọng hoặc thân mật khoảng **100–150 từ**, kể một câu chuyện ngắn, viết blog/đánh giá hoặc đoạn nêu quan điểm có lý do. Hãy chia nội dung thành đoạn nhỏ khi chuyển ý; chọn câu chủ đề trước rồi thêm hai lý do hay ví dụ. Trong email mời, cảm ơn hoặc xin lỗi, nêu mục đích ngay đầu thư và kết thúc phù hợp với người nhận.

### Kiểm tra trước khi gửi
Đọc lại để xem người nhận có hiểu mục đích ngay không, mỗi đoạn có tập trung vào một ý không, và đại từ/từ nối có liên kết rõ không. Kiểm tra câu chủ đề, viết hoa đầu câu và tên riêng, dấu chấm/phẩy, thì động từ và chính tả. Bài viết B1 nên rõ ràng, liên kết bằng một số từ nối quen thuộc; không cần cố dùng từ dài hoặc câu quá phức tạp. Khi viết đánh giá, nêu điều thích/không thích kèm lý do cụ thể thay vì chỉ viết *It was good*.

### Đọc có mục đích, viết và tóm tắt
Trước khi đọc, xác định mình cần tìm ý chính, chi tiết hay thái độ của người viết. Đọc tiêu đề và câu đầu để nắm chủ đề; quét tên riêng, ngày giờ và số liệu để tìm dữ kiện; sau đó đọc quanh từ khóa để suy ra nghĩa. Phân biệt thông tin được nêu trực tiếp với suy luận hợp lý và ý kiến cá nhân.
Một email B1 thường có lời chào phù hợp, mục đích ngay đầu thư, các chi tiết theo thứ tự và lời kết lịch sự. Đoạn văn nên có câu chủ đề, phần giải thích hoặc ví dụ và câu nối sang ý tiếp theo. Khi tóm tắt, giữ lại người, việc, thời gian và kết quả quan trọng; bỏ ví dụ phụ và không thêm ý mình. Với hướng dẫn cho người khác, dùng *first, then, finally* để trình bày lại quy trình rõ ràng. Bài viết tự luận trong ứng dụng chỉ được so khớp từ khóa nên không thay thế phản hồi của giáo viên về ngữ pháp, mạch lạc và register.
'''

