[[questions]]
id = "cefr-b1-007"
module = "cefr-b1-grammar-plus"
type = "multiple"
difficulty = 3
prompt = "Chọn các câu đúng về modal, mạo từ và either/neither/both."
options = ["Visitors are allowed to use the garden.", "You mustn't wear a uniform; it is optional. (ý: không bắt buộc)", "Both answers are possible.", "Neither of the two rooms is available.", "She is an engineer at a local hospital.", "You can either take the bus or walk to the station.", "She may to arrive late because of traffic."]
answer = [0, 2, 3, 4, 5]
explanation = "*Be allowed to* diễn tả được phép; *both* đi với danh từ số nhiều; *neither* thường đi với động từ số ít; *either...or* nối hai lựa chọn. *Mustn't* là bị cấm và sau *may* không dùng *to*."

