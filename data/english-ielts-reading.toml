> The town's market has been held every Thursday for over 300 years. Farmers bring fruit, cheese and bread from nearby villages, and visitors often arrive early to find the best produce. The market is also a place where neighbours meet and talk.
'''
options = ["A long-established weekly market", "Problems of town farmers", "How to bake bread", "A new shopping centre"]
answer = [0]
explanation = '''
Ý chính: chợ họp hàng tuần từ hơn 300 năm. Các lựa chọn khác không được bàn.
'''

[[questions]]
id = "ir-050"
module = "ir-matching-headings"
type = "single"
difficulty = 1
tags = ["band:5.5", "headings"]
prompt = '''
Choose the heading that best summarises the main idea of the paragraph.

> When the factory closed, hundreds of workers lost their jobs. The local council set up a training centre where they could learn new skills such as welding and computer repair. Within two years, more than half of them had found new work.
'''
options = ["The decline of heavy industry worldwide", "Help for workers after a closure", "Why computers are replacing welders", "A factory's new owners"]
answer = [1]
explanation = '''
Đoạn nói về trung tâm đào tạo và kết quả tìm việc: *help for workers*. Lựa chọn 1 quá rộng.
'''

[[questions]]
id = "ir-051"
module = "ir-matching-headings"
type = "single"
difficulty = 1
tags = ["band:5.5", "headings"]
prompt = '''
Choose the heading that best summarises the main idea of the paragraph.

> Coral reefs cover less than one per cent of the ocean floor, yet they support about a quarter of all marine species. Fish use the reefs for food and shelter, and the structures also protect coasts from strong waves.
'''
options = ["The importance of coral reefs", "How fish find food", "The size of the ocean", "Dangers of strong waves"]
answer = [0]
explanation = '''
Ý chính là tầm quan trọng của rạn san hô (đa dạng loài và bảo vệ bờ biển).
'''

[[questions]]
id = "ir-052"
module = "ir-matching-headings"
type = "single"
difficulty = 2
tags = ["band:6.5", "headings"]
prompt = '''
Choose the heading that best summarises the main idea of the paragraph.

> Early weather forecasts relied on local observation: sailors noted the colour of the sky and farmers watched animal behaviour. Telegraph networks in the nineteenth century changed this, allowing observations from distant places to be gathered in a single office within hours.
'''
options = ["How animals predict storms", "The role of communication technology in making forecasts possible over larger areas", "Why sailors distrusted farmers", "Problems with the colour of the sky"]
answer = [1]
explanation = '''
Đoạn đối lập quan sát cục bộ với mạng điện báo giúp thu thập dữ liệu từ xa. Heading 1 chỉ là một chi tiết nhỏ.
'''

[[questions]]
id = "ir-053"
module = "ir-matching-headings"
type = "single"
difficulty = 2
tags = ["band:6.5", "headings"]
prompt = '''
Choose the heading that best summarises the main idea of the paragraph.

> Supporters of a four-day working week say that it would raise morale and cut absenteeism. Critics reply that many services, such as hospitals, could not simply close for an extra day. The result has been a series of small trials rather than any large-scale change.
'''
options = ["A proven success of the shorter week", "Debate and cautious experimentation over a shorter working week", "The history of weekends", "Why hospitals pay higher wages"]
answer = [1]
explanation = '''
Có ý ủng hộ, phản đối và kết quả là thử nghiệm nhỏ: *debate and cautious experimentation*. Lựa chọn 1 sai vì bài không nói đã chứng minh thành công.
'''

[[questions]]
id = "ir-054"
module = "ir-matching-headings"
type = "single"
difficulty = 2
tags = ["band:6.5", "headings"]
prompt = '''
Choose the heading that best summarises the main idea of the paragraph.

> A sudden rise in the price of rice in 2008 led to protests in several countries. Analysts identified a combination of causes: poor harvests, rising fuel costs and restrictions on exports imposed by some governments in an attempt to protect domestic supplies.
'''
options = ["The multiple causes of a food price crisis", "How rice is grown", "The success of export restrictions", "Protests as a way to reduce prices"]
answer = [0]
explanation = '''
Ý chính: nhiều nguyên nhân gây khủng hoảng giá gạo. Lựa chọn 3 trái bài (hạn chế xuất khẩu là một nguyên nhân chứ không phải thành công).
'''

[[questions]]
id = "ir-055"
module = "ir-matching-headings"
type = "single"
difficulty = 2
tags = ["band:6.5", "headings"]
prompt = '''
Choose the heading that best summarises the main idea of the paragraph.

> Although the museum's collection is small, its curators have found imaginative ways of attracting visitors. Evening events combine music with exhibitions, and school groups are invited to help design new displays. Attendance has risen by a third in two years.
'''
options = ["Reasons why museums close", "Creative approaches that increased visitor numbers", "The disadvantages of small collections", "A decline in school visits"]
answer = [1]
explanation = '''
Các ví dụ (sự kiện buổi tối, học sinh tham gia) minh hoạ cho *creative approaches*; kết quả tăng lượng khách.
'''

[[questions]]
id = "ir-056"
module = "ir-matching-headings"
type = "single"
difficulty = 2
tags = ["band:6.5", "headings"]
prompt = '''
Choose the heading that best summarises the main idea of the paragraph.

> The first printed maps of the region were drawn by sailors, not surveyors, so the coastlines were reasonably accurate while the interior was left blank or filled with imagined mountains. Later expeditions gradually corrected these mistakes.
'''
options = ["Why coastlines are difficult to map", "Strengths and weaknesses of early maps and their later correction", "The life of a sailor", "The invention of the compass"]
answer = [1]
explanation = '''
Đoạn so sánh phần ven biển chính xác với phần nội địa sai và việc sửa dần: heading 2 bao quát.
'''

[[questions]]
id = "ir-057"
module = "ir-matching-headings"
type = "single"
difficulty = 2
tags = ["band:6.5", "headings"]
prompt = '''
Choose the heading that best summarises the main idea of the paragraph.

> Some researchers argue that bilingual children have better attention control. A recent review, however, found that many studies were too small to be reliable and that results varied between laboratories. The authors concluded that the benefit, if it exists, is modest.
'''
options = ["A confirmed advantage for bilingual children", "Doubts about the evidence for a bilingual advantage", "How children learn two languages", "Why laboratories differ in size"]
answer = [1]
explanation = '''
Ý chính của đoạn là nghi ngờ về bằng chứng. Heading 1 sai vì tác giả không kết luận được lợi ích chắc chắn.
'''

[[questions]]
id = "ir-058"
module = "ir-matching-headings"
type = "single"
difficulty = 3
tags = ["band:7", "headings"]
prompt = '''
Choose the heading that best summarises the main idea of the paragraph.

> The proposal was less a plan than a wish. It listed laudable aims, such as cleaner air and shorter commutes, but said nothing about how they might be financed or who would be responsible for delivering them. Consequently, most experts treated it as a statement of intent rather than a strategy.
'''
options = ["The strengths of an ambitious transport scheme", "The lack of practical detail in an otherwise well-meaning proposal", "Why commuters prefer cleaner air", "A comparison between two financing models"]
answer = [1]
explanation = '''
Câu đầu *less a plan than a wish* và *said nothing about how* là ý chính: thiếu chi tiết thực hiện dù mục tiêu tốt. Heading 1 và 4 sai hướng hoặc không có trong bài.
'''

[[questions]]
id = "ir-059"
module = "ir-matching-headings"
type = "single"
difficulty = 3
tags = ["band:7", "headings"]
prompt = '''
Choose the heading that best summarises the main idea of the paragraph.

> Critics often assume that nostalgia is simply a longing for a vanished past. Recent work suggests a different picture: people who feel nostalgic tend to report more optimism about the future, apparently because recalling meaningful moments strengthens their sense of identity.
'''
options = ["The harmful effects of looking backwards", "A reassessment of nostalgia's psychological role", "Why optimism fades with age", "The decline of traditional memories"]
answer = [1]
explanation = '''
Đoạn bác bỏ quan niệm thông thường và đưa ra cách nhìn khác: *reassessment*. Heading 1 trái ngược với bài.
'''

[[questions]]
id = "ir-060"
module = "ir-matching-headings"
type = "single"
difficulty = 3
tags = ["band:7", "headings"]
prompt = '''
Choose the heading that best summarises the main idea of the paragraph.

> Whereas early critics blamed the novel for encouraging idleness, later ones worried that it corrupted young people's morals. Each generation, it seems, locates the danger of a new form of entertainment in whichever social anxiety is most pressing at the time.
'''
options = ["The changing nature of objections to a popular medium", "The moral value of novels", "The disappearance of idleness", "Why young people avoid reading"]
answer = [0]
explanation = '''
Đoạn so sánh các lời chỉ trích khác nhau theo thời gian. Heading 2 không đúng vì bài không đánh giá giá trị đạo đức của tiểu thuyết.
'''

[[questions]]
id = "ir-061"
module = "ir-matching-information-features"
type = "fill"
difficulty = 1
tags = ["band:5.5", "matching-info"]
prompt = '''
Which paragraph contains the following information? Write the correct letter. You may use any letter more than once. (Điền một chữ cái in thường.)

**The school library**

**A** The school library was built in 1985 and has room for about 200 students. Last year it received a grant to buy new computers.

**B** Opening hours are from 8 a.m. to 5 p.m. on weekdays. Students can borrow up to five books for two weeks.

**C** A group of students called the Book Club meets on Wednesdays. They choose a story to read together and discuss it.

**D** If a book is lost, the student must pay for a replacement. Teachers may also ask the librarian to prepare special collections for their lessons.

1. a rule about what happens when a book is lost {{blank}}
2. the number of books a student may borrow {{blank}}
3. money received to pay for equipment {{blank}}
4. a regular activity for a group of students {{blank}}
'''
blanks = [["d"], ["b"], ["a"], ["c"]]
explanation = '''
1. D: "If a book is lost, the student must pay for a replacement".
2. B: "borrow up to five books".
3. A: "received a grant to buy new computers" (grant = money, computers = equipment).
4. C: "Book Club meets on Wednesdays".
'''

[[questions]]
id = "ir-062"
module = "ir-matching-information-features"
type = "fill"
difficulty = 2
tags = ["band:6.5", "matching-info"]
prompt = '''
Which paragraph contains the following information? Write the correct letter. You may use any letter more than once. (Điền một chữ cái in thường.)

**Cooling the city**

**A** Cities are often several degrees warmer than the surrounding countryside, a phenomenon known as the urban heat island effect. Dark roads and roofs absorb sunlight during the day and release it slowly after dark, so night-time temperatures remain high.

**B** Vegetation helps to counter this. Trees provide shade, and plants cool the air as water evaporates from their leaves. A study of one coastal city found that streets with tree cover were on average four degrees cooler at midday than those without.

**C** Planners have also experimented with pale roofing materials that reflect more sunlight. These are cheaper to install than green roofs, but they do little to improve air quality, and their effectiveness falls as dust accumulates on the surface.

**D** The health consequences are serious. During heatwaves, elderly residents of the hottest districts are most at risk, partly because many older buildings lack air conditioning and partly because lower-income households cannot afford the running costs.

**E** Some researchers argue that the problem should be tackled at the level of the whole city rather than building by building. They recommend maps of local temperatures, which would help officials decide where to plant trees or change materials first.

1. a comparison of two cooling methods in terms of cost {{blank}}
2. reasons why older people are particularly vulnerable {{blank}}
3. a suggestion about how to decide which areas to treat first {{blank}}
4. an explanation of why heat remains after sunset {{blank}}
5. a figure comparing temperatures on different streets {{blank}}
'''
blanks = [["c"], ["d"], ["e"], ["a"], ["b"]]
explanation = '''
1. C: pale roofing "cheaper to install than green roofs".
2. D: nhiều toà nhà cũ thiếu điều hoà và hộ thu nhập thấp không đủ tiền chạy máy.
3. E: "maps of local temperatures, which would help officials decide where… first".
4. A: bề mặt hấp thụ nắng ban ngày và tỏa chậm sau khi trời tối.
5. B: "four degrees cooler at midday" so sánh phố có/không có cây.
'''

[[questions]]
id = "ir-063"
module = "ir-matching-information-features"
type = "fill"
difficulty = 3
tags = ["band:7", "matching-features"]
prompt = '''
Look at the following statements and the list of researchers. Match each statement with the correct researcher: **A** Dr Almeida, **B** Dr Brandt or **C** Dr Cheung. You may use any letter more than once. (Điền chữ cái in thường.)

> Dr Almeida believes that the most effective way to reduce plastic waste is to redesign packaging so that fewer materials are mixed together. Dr Brandt, by contrast, doubts that design alone will help unless consumers are given a financial incentive to return used items. Dr Cheung takes a middle position: she argues that neither approach will succeed without legislation setting minimum standards for recycled content, though she accepts that both would make a contribution. All three agree that the scale of the problem has been underestimated.

1. Money paid to consumers is essential. {{blank}}
2. Legal minimum standards are needed whatever else is done. {{blank}}
3. Packaging should use fewer mixed materials. {{blank}}
4. Both of the other proposals would be of some value. {{blank}}
5. Better design on its own would probably not be enough. {{blank}}
'''
blanks = [["b"], ["c"], ["a"], ["c"], ["b"]]
explanation = '''
1. B: "consumers are given a financial incentive".
2. C: "neither approach will succeed without legislation".
3. A: "redesign packaging so that fewer materials are mixed".
4. C: "she accepts that both would make a contribution".
5. B: "doubts that design alone will help". Lưu ý Cheung cũng nói cần luật, nhưng *design alone* là quan điểm đối lập trực tiếp của Brandt với Almeida.
'''

[[questions]]
id = "ir-064"
module = "ir-matching-information-features"
type = "fill"
difficulty = 2
tags = ["band:6.5", "sentence-endings"]
prompt = '''
Complete each sentence with the correct ending, **A–F**, below. (Điền chữ cái in thường.)

> The ferry service across the lake was suspended in 2019 after an inspection found cracks in the hull of the larger boat. The operators initially planned to repair it, but the cost proved higher than a replacement. A new vessel has been ordered, although delivery will not be possible until next summer. In the meantime, a bus service links the two shores, which adds forty minutes to the journey.

1. The ferry service was suspended because {{blank}}
2. The operators decided against repairing the old boat because {{blank}}
3. Passengers cannot yet use the new ferry because {{blank}}
4. The bus is less convenient than the ferry because {{blank}}

**A** it takes longer than crossing the lake by water.
**B** the replacement vessel has not yet been delivered.
**C** a fault was discovered in the structure of the larger boat.
**D** the repair would have been more expensive than buying a new one.
**E** passengers prefer to travel by bus.
**F** the inspection took place in the summer.
'''
blanks = [["c"], ["d"], ["b"], ["a"]]
explanation = '''
1. C: "cracks in the hull" = a fault in the structure.
2. D: "the cost proved higher than a replacement".
3. B: "delivery will not be possible until next summer".
4. A: "adds forty minutes to the journey". E và F không có căn cứ trong bài.
'''

[[questions]]
id = "ir-065"
module = "ir-matching-information-features"
type = "single"
difficulty = 1
tags = ["band:5.5", "matching-features"]
prompt = '''
Which person holds the view in the statement?

> Anna prefers to study in the morning, while Ben works best late at night. Carla studies whenever she has free time.

**Statement:** This person works best late at night.
'''
options = ["Anna", "Ben", "Carla"]
answer = [1]
explanation = '''
*Works best late at night* khớp với Ben. Anna thích buổi sáng, Carla học khi rảnh.
'''

[[questions]]
id = "ir-066"
module = "ir-matching-information-features"
type = "single"
difficulty = 1
tags = ["band:5.5", "matching-features"]
prompt = '''
Which person holds the view in the statement?

> Mr Tran says the park should stay open until 10 p.m. Ms Hall thinks it should close at dusk for safety reasons. Mr Ito has no strong opinion.

**Statement:** This person believes closing early would improve safety.
'''
options = ["Mr Tran", "Ms Hall", "Mr Ito"]
answer = [1]
explanation = '''
Ms Hall: close at dusk *for safety reasons*.
'''

[[questions]]
id = "ir-067"
module = "ir-matching-information-features"
type = "single"
difficulty = 1
tags = ["band:5.5", "sentence-endings"]
prompt = '''
Choose the ending that completes the sentence according to the text.

> Heavy rain fell all morning, and the pitch was too wet to use. The players went home.

**Sentence:** The match was cancelled because
'''
options = ["the players were tired.", "the pitch was unsuitable after the rain.", "the referee was ill.", "the stadium was full."]
answer = [1]
explanation = '''
*Too wet to use* = unsuitable. Các lựa chọn khác không có trong bài.
'''

[[questions]]
id = "ir-068"
module = "ir-matching-information-features"
type = "single"
difficulty = 1
tags = ["band:5.5", "sentence-endings"]
prompt = '''
Choose the ending that completes the sentence according to the text.

> The restaurant is popular, so you should book a table at least a week ahead. It is closed on Mondays.

**Sentence:** You should book early because
'''
options = ["the restaurant is closed every day.", "the restaurant is often full.", "tables are very small.", "it is cheaper to book early."]
answer = [1]
explanation = '''
*Popular* là lý do cần đặt trước; không có thông tin về giá hoặc kích thước bàn.
'''

[[questions]]
id = "ir-069"
module = "ir-matching-information-features"
type = "single"
difficulty = 2
tags = ["band:6.5", "matching-features"]
prompt = '''
Which person holds the view in the statement?

> Professor Lim argues that language learning apps work best as a supplement to classroom teaching. Ms Ortega believes that apps can replace teachers entirely for motivated adults. Mr Dube is more sceptical: he says no technology can provide the feedback that a human teacher gives.

**Statement:** Technology cannot give the kind of feedback people need.
'''
options = ["Professor Lim", "Ms Ortega", "Mr Dube"]
answer = [2]
explanation = '''
Mr Dube: no technology can provide the feedback a teacher gives. Lim chỉ nói app là phần bổ trợ, Ortega ủng hộ thay thế.
'''

[[questions]]
id = "ir-070"
module = "ir-matching-information-features"
type = "single"
difficulty = 2
tags = ["band:6.5", "matching-features"]
prompt = '''
Which person holds the view in the statement?

> Dr Silva suggests that the glacier's retreat began earlier than previously thought. Dr Park accepts the later date but argues that the rate of retreat has been exaggerated. Dr Mensah dismisses the whole debate as dependent on unreliable data.

**Statement:** This researcher questions how fast the glacier has retreated.
'''
options = ["Dr Silva", "Dr Park", "Dr Mensah"]
answer = [1]
explanation = '''
Dr Park: the rate of retreat has been exaggerated. Silva nói về thời điểm, Mensah nghi ngờ dữ liệu.
'''

[[questions]]
id = "ir-071"
module = "ir-matching-information-features"
type = "single"
difficulty = 2
tags = ["band:6.5", "sentence-endings"]
prompt = '''
Choose the ending that completes the sentence according to the text.

> Heavy investment in the new port was expected to attract industry, but the road leading to it remained narrow and unpaved. As a result, large trucks could not reach the docks.

**Sentence:** Industry did not move to the port because
'''
options = ["the investment was too small.", "the access road was inadequate for heavy vehicles.", "the docks were too crowded.", "the trucks were unpaved."]
answer = [1]
explanation = '''
*Narrow and unpaved* road → trucks could not reach the docks. Lựa chọn 1 sai vì bài nói đầu tư lớn; lựa chọn 4 sai ngữ nghĩa.
'''

[[questions]]
id = "ir-072"
module = "ir-matching-information-features"
type = "single"
difficulty = 2
tags = ["band:6.5", "sentence-endings"]
prompt = '''
Choose the ending that completes the sentence according to the text.

> Regular exercise improves mood, but researchers note that people who are already happy may simply be more inclined to exercise, so the direction of cause is unclear.

**Sentence:** The researchers are cautious about claiming that exercise improves mood because
'''
options = ["people dislike exercising.", "happiness may lead to more exercise rather than the reverse.", "exercise damages mood in some people.", "studies are too expensive."]
answer = [1]
explanation = '''
*Direction of cause is unclear*: hạnh phúc có thể dẫn đến tập luyện. Không có thông tin về ba lựa chọn còn lại.
'''

[[questions]]
id = "ir-073"
module = "ir-matching-information-features"
type = "single"
difficulty = 2
tags = ["band:6.5", "matching-info"]
prompt = '''
Trong dạng **matching information**, nhận định nào về cách làm là đúng?
'''
options = ["Các câu hỏi luôn theo thứ tự của bài", "Một đoạn có thể chứa nhiều đáp án hoặc không chứa đáp án nào", "Chỉ cần thấy một từ khoá trùng là đủ", "Mỗi đoạn chỉ được dùng một lần"]
answer = [1]
explanation = '''
Thứ tự câu hỏi thường không theo bài, đoạn có thể được dùng lại hoặc không dùng (nếu đề không nói khác). Phải kiểm tra toàn bộ ý, không chỉ từ khoá.
'''

[[questions]]
id = "ir-074"
module = "ir-matching-information-features"
type = "single"
difficulty = 3
tags = ["band:7", "matching-features"]
prompt = '''
Which researcher accepts that a shift has occurred but disputes its scale?

> Dr Evans first predicted the shift in 2005, but Dr Nair has argued that the evidence for it was circumstantial. Dr Okafor, who analysed newer data, maintains that the shift is real yet smaller than Dr Evans suggested.
'''
options = ["Dr Evans", "Dr Nair", "Dr Okafor"]
answer = [2]
explanation = '''
Dr Okafor: *real yet smaller than suggested*. Dr Nair nghi ngờ bằng chứng chứ chưa nói shift có thật; Dr Evans là người dự đoán.
'''

[[questions]]
id = "ir-075"
module = "ir-matching-information-features"
type = "single"
difficulty = 3
tags = ["band:7", "matching-features"]
prompt = '''
Which statement best matches the third report?

> The committee's first report praised the policy's ambition. A second, written two years later, conceded that its goals had been only partly met. The third expressed outright disappointment, though it did not recommend abandoning the policy.
'''
options = ["It supported the policy without reservation.", "It criticised the results strongly but did not call for the policy to end.", "It recommended ending the policy.", "It repeated the second report's conclusions."]
