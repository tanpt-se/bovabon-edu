[[questions]]
id = "ir-111"
module = "ir-full-passages"
type = "single"
difficulty = 2
tags = ["band:6.5", "full-passage", "matching-headings"]
prompt = '''
Passage 1, Questions 1–5 (time the whole passage: 20 minutes). Choose the correct heading for **paragraph C**.

> **Reading Passage 1 – The Quiet Return of the Night Train** (fictional text for practice)
>
> **A** For much of the late twentieth century, the overnight sleeper train appeared to be a relic. Budget airlines could carry a passenger between two capitals in ninety minutes for less than the price of a restaurant meal, and rail operators, facing ageing carriages and falling demand, quietly withdrew one route after another. By the early 2010s, a traveller hoping to cross a continent while asleep had only a handful of options, most of them slow, expensive and poorly advertised.
>
> **B** The revival that followed was not driven by nostalgia alone. Surveys carried out by the Continental Travel Observatory found that the share of respondents who said they would "seriously consider" a night train for journeys of 800 to 1,500 kilometres rose from 14 per cent in 2012 to 37 per cent a decade later. The researchers attributed much of this shift to growing concern about the carbon cost of short flights, but they also noted a less obvious factor: the time spent travelling to and from airports, passing through security and waiting at gates had steadily lengthened, making the total door-to-door time of a flight far less attractive than its advertised duration suggested.
>
> **C** Operators who responded to this demand quickly discovered that running a night train is a peculiarly difficult business. Unlike a daytime service, where a single carriage can make several return journeys in a day, a sleeper carriage typically completes only one journey every twenty-four hours. Each berth is therefore occupied by just one paying passenger per day, and the revenue it generates must cover the cost of a vehicle that is far more expensive to build than an ordinary seat carriage. In addition, trains crossing borders must pay track-access charges to every national network they use, and these fees are calculated in different ways in different countries.
>
> **D** Several companies have experimented with ways around these constraints. One approach has been to design carriages that can be converted from sleeping compartments into seating during the day, allowing a vehicle to earn money on a second, shorter service. Another has been to introduce "capsule" berths, modelled on compact hotels, which fit more passengers into the same space while still offering a degree of privacy that a reclining seat cannot. Neither solution is universally popular: converting carriages requires staff time at each end of the route, and some passengers find capsules claustrophobic.
>
> **E** Public policy has also played a part. A number of governments have begun to treat night trains as part of their climate strategy, offering subsidies for new rolling stock or reducing track-access charges for overnight services. Critics argue that such support is difficult to justify when the number of passengers carried is small compared with commuter railways, which serve millions of people every week. Supporters reply that the relevant comparison is not with commuter trains but with the flights that night trains replace; measured against the emissions avoided, they claim, the subsidy per tonne of carbon is modest.
>
> **F** What is less often discussed is the experience of the passengers themselves. Interviews with frequent users suggest that the appeal of the night train lies partly in what one traveller called "arriving with the day already in your hands": boarding in the evening, sleeping, and stepping out in a city centre in the morning without the cost of a hotel night. Yet the same interviews reveal recurring complaints about unreliable heating, noisy couplings during shunting, and the difficulty of booking a journey that involves more than one operator. For many passengers, the practical obstacles of purchasing a ticket appear to be a greater deterrent than the price itself.
>
> **G** Whether the revival will last remains uncertain. Analysts at the Observatory caution that demand measured in surveys does not always translate into tickets sold, and that a single winter of cancellations could undo years of goodwill. Their most recent report concludes that the future of the night train depends less on new technology than on unglamorous improvements: shared booking systems, harmonised track charges and dependable maintenance. In other words, the sleeper train will survive not because it is romantic, but if it becomes ordinary.
'''
options = ["Why a sleeping berth earns so little each day", "Passengers return to the railways", "Redesigning the interior of a carriage", "Governments disagree about climate targets"]
answer = [0]
explanation = '''
Ý chính của đoạn C là khó khăn kinh tế: *a sleeper carriage typically completes only one journey every twenty-four hours… each berth is therefore occupied by just one paying passenger per day*, cộng thêm phí track-access. Heading 2 là ý đoạn B, heading 3 là đoạn D (*converted… capsule berths*), heading 4 chỉ là từ khoá *climate* lấy từ đoạn E và không đúng ý nào.
'''

