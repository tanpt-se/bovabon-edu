> **C** Operators who responded to this demand quickly discovered that running a night train is a peculiarly difficult business. Unlike a daytime service, where a single carriage can make several return journeys in a day, a sleeper carriage typically completes only one journey every twenty-four hours. Each berth is therefore occupied by just one paying passenger per day, and the revenue it generates must cover the cost of a vehicle that is far more expensive to build than an ordinary seat carriage. In addition, trains crossing borders must pay track-access charges to every national network they use, and these fees are calculated in different ways in different countries.
>
> **D** Several companies have experimented with ways around these constraints. One approach has been to design carriages that can be converted from sleeping compartments into seating during the day, allowing a vehicle to earn money on a second, shorter service. Another has been to introduce "capsule" berths, modelled on compact hotels, which fit more passengers into the same space while still offering a degree of privacy that a reclining seat cannot. Neither solution is universally popular: converting carriages requires staff time at each end of the route, and some passengers find capsules claustrophobic.
>
> **E** Public policy has also played a part. A number of governments have begun to treat night trains as part of their climate strategy, offering subsidies for new rolling stock or reducing track-access charges for overnight services. Critics argue that such support is difficult to justify when the number of passengers carried is small compared with commuter railways, which serve millions of people every week. Supporters reply that the relevant comparison is not with commuter trains but with the flights that night trains replace; measured against the emissions avoided, they claim, the subsidy per tonne of carbon is modest.
>
> **F** What is less often discussed is the experience of the passengers themselves. Interviews with frequent users suggest that the appeal of the night train lies partly in what one traveller called "arriving with the day already in your hands": boarding in the evening, sleeping, and stepping out in a city centre in the morning without the cost of a hotel night. Yet the same interviews reveal recurring complaints about unreliable heating, noisy couplings during shunting, and the difficulty of booking a journey that involves more than one operator. For many passengers, the practical obstacles of purchasing a ticket appear to be a greater deterrent than the price itself.
>
> **G** Whether the revival will last remains uncertain. Analysts at the Observatory caution that demand measured in surveys does not always translate into tickets sold, and that a single winter of cancellations could undo years of goodwill. Their most recent report concludes that the future of the night train depends less on new technology than on unglamorous improvements: shared booking systems, harmonised track charges and dependable maintenance. In other words, the sleeper train will survive not because it is romantic, but if it becomes ordinary.
'''
options = ["Night trains should advertise their romantic image more effectively", "The long-term success of night trains depends on reliable everyday operation rather than their appeal as an experience", "Night trains will survive only if new technology makes them as fast as flights", "Passengers no longer find night trains special, so demand will soon fall"]
answer = [1]
explanation = '''
Câu cuối tóm lại kết luận của báo cáo trong đoạn G: tương lai phụ thuộc *less on new technology than on unglamorous improvements: shared booking systems, harmonised track charges and dependable maintenance*. *Ordinary* = vận hành bình thường, đáng tin cậy. Phương án 1 đi ngược ý (*not because it is romantic*); 3 trái với *less on new technology*; 4 hiểu sai *ordinary* thành 'mất sức hút' và thêm dự đoán không có trong bài.
'''

[[questions]]
id = "ir-116"
module = "ir-full-passages"
type = "single"
difficulty = 2
tags = ["band:6.5", "full-passage", "matching-information"]
prompt = '''
Reading Passage 2 has six paragraphs, A–F. Which paragraph contains the following information?

**Information:** an example of a cooling measure that had a disadvantage in a different season

> **Reading Passage 2 – Cooling the City** (fictional text for practice)
>
> **A** On a still summer afternoon, the centre of a large city can be several degrees warmer than the farmland that surrounds it. This phenomenon, known as the urban heat island, has been recognised for more than a century, but it has only recently moved from the pages of climate journals into the agendas of city councils. The reason is partly demographic: more than half of the world's population now lives in urban areas, and heatwaves are becoming both more frequent and more intense. It is also political, since a single severe heatwave can now fill hospital wards and dominate local news for weeks.
>
> **B** The causes of the effect are well understood. Asphalt, concrete and dark roofing materials absorb sunlight during the day and release it slowly at night, so that cities cool down far less after sunset than the countryside does. Tall buildings trap heat between them and reduce the wind that might otherwise carry it away, while air-conditioning units, vehicles and industry add heat of their own. Crucially, the lack of vegetation means that cities lose the cooling that plants provide when water evaporates from their leaves.
>
> **C** Of the many remedies proposed, the simplest is to change the colour of surfaces. Light-coloured or "cool" roofs reflect a greater proportion of incoming sunlight, and a trial in the city of Marrowfield found that painting the roofs of 400 low-rise buildings white reduced the indoor temperature of top-floor flats by an average of 2.1°C on the hottest days. The same trial, however, recorded an unexpected side effect: in winter, residents of the treated buildings used slightly more energy for heating, as their roofs now absorbed less of the weak winter sun.
>
> **D** Trees offer benefits that paint cannot. Besides shading pavements and walls, they cool the air through evaporation, absorb some pollutants and, according to several studies, improve the mental well-being of people who live near them. But trees are slow to establish, and in dense neighbourhoods there is often no room for them; underground pipes and cables restrict where roots can grow. Planners in Marrowfield estimated that a newly planted street tree takes around fifteen years to deliver its full cooling effect, a timescale that sits uneasily with the electoral cycles of local politicians.
>
> **E** Perhaps the most contested question is who benefits. Researchers mapping surface temperatures across Marrowfield found that the hottest districts were also those with the lowest household incomes, a pattern they attributed to decades of decisions that placed parks in wealthier areas and industry in poorer ones. When the city launched its tree-planting scheme, early plantings were concentrated in neighbourhoods whose residents had been most active in requesting them, which tended to be the cooler, more affluent ones. Only after a revision of the scheme, which allocated trees according to measured temperature rather than requests, did planting reach the districts that needed it most.
>
> **F** None of these measures, on its own, will make a city comfortable during an extreme heatwave. Experts increasingly argue that heat should be managed in the way cities already manage floods: by combining long-term changes to the physical environment with short-term emergency plans, such as public cooling centres and checks on elderly residents living alone. The aim is not to eliminate urban heat, which is impossible, but to reduce the number of people for whom a hot week becomes a medical emergency.
'''
options = ["Paragraph A", "Paragraph B", "Paragraph C", "Paragraph D", "Paragraph E", "Paragraph F"]
answer = [2]
explanation = '''
Đoạn C: sơn mái trắng làm mát vào mùa hè, nhưng *in winter, residents of the treated buildings used slightly more energy for heating* — đó là *a disadvantage in a different season*. Đoạn D cũng nêu nhược điểm của cây (chậm, thiếu chỗ) nhưng không liên quan đến mùa.
'''

