description = "Luyện IELTS Academic Reading mức band 6.5: chiến lược đọc nhanh, nhận diện paraphrase, các dạng câu hỏi chính và bài đọc dài luyện theo thời gian."

[[modules]]
id = "ir-strategy-paraphrase"
title = "Chiến lược đọc và nhận diện paraphrase"
description = "Skim, scan, phân bổ thời gian 20 phút mỗi bài và cách nhận ra cùng một ý được diễn đạt bằng từ khác."
lesson = '''
### Lộ trình học gợi ý
Học lộ trình này sau khi xong khoảng CEFR B1, song song với B2 và Ngữ pháp/Từ vựng IELTS. Reading và Listening là hai kỹ năng tăng điểm nhanh nhất nhờ chiến lược. **Lưu ý:** app chỉ có chữ; các bài đọc ở đây do chúng tôi tự soạn để luyện kỹ thuật, bạn nên luyện thêm với đề giấy/bản máy thật để quen áp lực thời gian. Mục tiêu band 6.5 tương đương khoảng 27–29/40 câu đúng (con số tham khảo, thay đổi theo đề).

### Cấu trúc bài thi
Academic Reading có 3 bài đọc dài, tổng 40 câu, **60 phút** và không có thời gian chép đáp án riêng. Độ khó tăng dần: bài 3 thường dày thông tin và có nhiều câu hỏi suy luận nhất. Một sai lầm phổ biến là dành 30 phút cho bài 1 vì muốn "đọc hiểu hết".

### Quy trình 5 bước cho mỗi bài (20 phút)
1. **Đọc tiêu đề và liếc đoạn đầu (30 giây)** để biết chủ đề và giọng văn.
2. **Đọc chỉ dẫn và câu hỏi trước**, gạch chân từ khoá (danh từ riêng, số, từ chuyên ngành). Chú ý giới hạn từ (NO MORE THAN TWO WORDS).
3. **Skim** từng đoạn: đọc câu chủ đề (thường câu 1–2), ghi nhanh ý chính bên lề.
4. **Scan** tìm từ khoá hoặc paraphrase của nó, rồi **đọc kỹ** vài câu quanh vị trí đó để quyết định đáp án.
5. **Chuyển đáp án sang phiếu ngay** và đánh dấu câu bỏ lại để quay lại sau.

### Skim và scan khác nhau thế nào
| Kỹ thuật | Mục tiêu | Dùng khi |
|---|---|---|
| Skim | nắm ý chính đoạn | matching headings, tìm khung bài |
| Scan | tìm một chi tiết cụ thể | số, tên riêng, ngày, completion |
| Đọc kỹ | chọn đáp án chính xác | TRUE/FALSE/NOT GIVEN, MCQ |

### Paraphrase: kỹ năng cốt lõi
Đề hầu như không lặp nguyên từ trong câu hỏi. Các kiểu paraphrase thường gặp:
| Kiểu | Văn bản | Câu hỏi |
|---|---|---|
| Từ đồng nghĩa | *a rapid increase* | *a quick rise* |
| Đổi loại từ | *The decision was criticised* | *There was criticism of the decision* |
| Đổi cấu trúc | *Few people attended* | *Attendance was low* |
| Khái quát hoá | *cars, buses and trains* | *forms of transport* |
| Phủ định kép | *not uncommon* | *fairly frequent* |
Từ khoá dễ bị paraphrase là động từ và tính từ; **số, tên riêng và thuật ngữ** thường giữ nguyên nên là điểm neo tốt nhất khi scan.

### Lỗi hay gặp
- Chọn đáp án chỉ vì **trùng từ** với câu hỏi; bẫy thường đặt đúng từ nhưng sai ý.
- Dịch từng chữ sang tiếng Việt khiến chậm; hãy đọc theo cụm ý.
- Dừng quá lâu vì một từ lạ: đoán nghĩa theo ngữ cảnh hoặc bỏ qua.
- Dùng kiến thức nền thay vì thông tin trong bài.

### Quản lý thời gian
Bài 1: 17–18 phút, bài 2: 20 phút, bài 3: 22–23 phút. Nếu một câu mất quá 1 phút, ghi dấu hỏi và đi tiếp. Dành ~2 phút cuối để điền đoán các câu còn trống, vì không bị trừ điểm khi sai.
'''

[[modules]]
id = "ir-tfng-ynng"
title = "TRUE/FALSE/NOT GIVEN và YES/NO/NOT GIVEN"
description = "So sánh từng phần của nhận định với văn bản, phân biệt FALSE và NOT GIVEN, cảnh giác từ chỉ mức độ."
lesson = '''
### Hai dạng, một logic
| Dạng | Hỏi về | Đáp án |
|---|---|---|
| TRUE / FALSE / NOT GIVEN | **thông tin/sự kiện** trong bài | TRUE: bài nói đúng như vậy; FALSE: bài nói điều trái ngược; NOT GIVEN: bài không đề cập đủ để kết luận |
| YES / NO / NOT GIVEN | **ý kiến/quan điểm của tác giả** | YES: khớp ý tác giả; NO: mâu thuẫn ý tác giả; NOT GIVEN: không rõ tác giả nghĩ gì |
Các câu hỏi xuất hiện **theo thứ tự** của bài, nên bạn có thể đi một lượt từ trên xuống.

### Quy trình kiểm tra
1. Chia nhận định thành các phần: chủ thể, hành động, số liệu, mức độ, thời gian, nguyên nhân.
2. Tìm đoạn chứa chủ thể (bằng từ khoá hoặc paraphrase).
3. So từng phần với văn bản:
   - Mọi phần khớp → **TRUE**.
   - Có phần **trái ngược** văn bản → **FALSE**.
   - Có phần mà văn bản **không nhắc** → **NOT GIVEN**.
4. Không dùng kiến thức bên ngoài để quyết định.

### Phân biệt FALSE và NOT GIVEN
**Văn bản:** *The library opens at 9 a.m. on weekdays.*
- *The library opens at 8 a.m. on weekdays.* → **FALSE** (giờ khác hẳn).
- *The library opens at 9 a.m. on Sundays.* → **NOT GIVEN** (bài không nói về Chủ nhật).
- *The library is open on weekday mornings.* → **TRUE** (paraphrase).
Mẹo: FALSE cần một câu trong bài **nói ngược lại** và bạn trích dẫn được; nếu bạn phải "đoán" thì nhiều khả năng là NOT GIVEN.

### Từ chỉ mức độ và bẫy
| Từ trong nhận định | Bẫy thường gặp |
|---|---|
| all, every, always, never | bài chỉ nói *most*, *often* → FALSE |
| some, a few | bài nói *none* → FALSE; bài không đề cập số lượng → có thể NOT GIVEN |
| only, solely | bài nêu thêm yếu tố khác → FALSE |
| may, might, could | bài nói chắc chắn hay bài chỉ giả định cần so kỹ |
| the first, the largest | bài không so sánh → NOT GIVEN |
| because, as a result | bài chỉ nêu hai sự việc, không nói nhân quả → NOT GIVEN |

### Lỗi hay gặp
- Nhầm NOT GIVEN với FALSE vì "bài không nói vậy" — hãy kiểm tra có câu **trái ngược** không.
- Chọn TRUE vì phần đầu khớp nhưng bỏ qua phần sau (số liệu, nguyên nhân).
- Dùng hiểu biết cá nhân ("thực tế thì…").
- Với YES/NO, nhầm ý của tác giả với ý của **người khác được trích** trong bài.

### Thời gian
Mỗi nhận định không quá 1 phút. Nếu sau khi đọc kỹ đoạn liên quan vẫn không tìm được căn cứ, đáp án thường là NOT GIVEN.
'''

[[modules]]
id = "ir-matching-headings"
title = "Matching headings"
description = "Tìm ý chính của đoạn, phân biệt ý chính với chi tiết, loại heading nhiễu."
lesson = '''
### Dạng bài
Bạn được cho danh sách heading đánh số La Mã (i, ii, iii…) nhiều hơn số đoạn, và phải ghép mỗi đoạn (A, B, C…) với heading phù hợp nhất. Có heading thừa, và **mỗi heading dùng một lần**. Dạng này tốn thời gian, nên thường làm **sau** các dạng khác trong cùng bài, hoặc làm trước nếu bạn đã skim bài.

### Quy trình
1. Đọc nhanh danh sách heading, gạch chân từ khoá của từng heading.
2. Đọc **câu đầu và câu cuối** của đoạn; câu chủ đề thường ở đó. Với đoạn dài, đọc thêm câu ngay sau chỗ có từ nối đổi hướng (*However, Yet, In contrast*).
3. Tự tóm tắt đoạn bằng vài từ trước khi nhìn heading.
4. Chọn heading **bao quát cả đoạn**, không chỉ một chi tiết.
5. Loại dần: gạch heading đã dùng; heading còn lại ghép cho đoạn khó.

### Ý chính và chi tiết
| Dấu hiệu | Ý chính | Chi tiết |
|---|---|---|
| Vị trí | thường đầu hoặc cuối đoạn | ở giữa |
| Chức năng | khái quát, nêu luận điểm | ví dụ, số liệu, tên riêng |
| Từ nối | *therefore, overall* | *for instance, such as* |
Heading đúng thường **khái quát hơn** văn bản và dùng paraphrase; heading nhiễu thường lặp từ trong đoạn nhưng chỉ phản ánh một chi tiết hoặc nói quá phạm vi.

### Các loại heading nhiễu
- **Đúng từ, sai ý:** lặp từ khoá nhưng nói điều bài không bàn.
- **Quá hẹp:** chỉ một ví dụ trong đoạn.
- **Quá rộng:** cả bài chứ không phải đoạn này.
- **Đảo quan hệ:** đoạn nói về *tác động của A lên B* nhưng heading nói *tác động của B lên A*.

### Lỗi hay gặp
- Ghép theo từ giống nhau thay vì theo ý.
- Đọc toàn bộ đoạn từng chữ nên mất thời gian: chỉ cần đủ để nắm ý chính.
- Quên rằng đoạn có thể mở đầu bằng một câu dẫn nhập, ý chính nằm ở câu sau.
- Chọn heading cho đoạn A từ nội dung của đoạn B vì hai đoạn có chủ đề gần nhau.

### Mẹo thời gian
Dành tối đa 5–6 phút cho 5–6 đoạn. Làm các đoạn dễ trước để loại bớt heading, rồi quay lại đoạn khó. Đáp án dạng fill nhập số La Mã chữ thường (*iv*).
'''

[[modules]]
id = "ir-matching-information-features"
title = "Matching information, features và sentence endings"
description = "Tìm đoạn chứa thông tin, ghép nhận định với người/đối tượng, và ghép nửa câu."
lesson = '''
### Ba dạng ghép
| Dạng | Nhiệm vụ | Đặc điểm |
|---|---|---|
| Matching information | Tìm **đoạn** (A–G) chứa thông tin được nêu | thông tin theo thứ tự **không** trùng thứ tự bài; một đoạn có thể được dùng nhiều lần hoặc không dùng |
| Matching features | Ghép nhận định với **người, tổ chức, thời kỳ, loại** | thường theo thứ tự bài khi nhắc đến nhân vật; có thể dùng một lựa chọn nhiều lần |
| Matching sentence endings | Ghép **nửa đầu câu** với phần kết trong danh sách | các phần kết nhiều hơn số câu; phải đúng ngữ pháp và ý |

### Matching information
1. Gạch chân từ khoá trong từng mệnh đề. Mệnh đề thường là một ý rất cụ thể, ví dụ *a comparison between two methods*, *an example of a failed attempt*, *the reason for a delay*.
2. Vì thứ tự không theo bài, hãy **skim** để biết mỗi đoạn nói về gì rồi quay lại scan.
3. Tìm **chức năng** của thông tin (ví dụ, so sánh, nguyên nhân, định nghĩa, cảnh báo), không chỉ từ khoá.
4. Kiểm tra chắc chắn: đoạn phải chứa **toàn bộ** ý trong mệnh đề.

### Matching features
- Bài thường nêu tên người/tổ chức kèm lời nói hoặc quan điểm. Khoanh tên trong bài, rồi đọc câu có tên đó.
- Phân biệt người **nêu ý kiến** với người **bị phản đối**.
- Đừng nhầm hai người có quan điểm gần nhau: tìm điểm khác biệt (mức độ, lý do).

### Matching sentence endings
1. Đọc nửa câu đầu, dự đoán loại phần kết (nguyên nhân? kết quả? đối lập?).
2. Loại phương án sai **ngữ pháp** (ví dụ phần mở đầu bằng *because of* cần danh từ/cụm danh từ).
3. Tìm vị trí trong bài, so với paraphrase.
4. Các phần kết thường nhiễu bằng cách đúng một nửa hoặc đảo nhân quả.

### Lỗi hay gặp
- Chỉ khớp từ khoá với một chi tiết nhỏ trong đoạn mà bỏ qua ý chính của mệnh đề.
- Quên rằng đoạn có thể dùng lại.
- Gán quan điểm cho nhầm người vì bài viết lẫn lộn các tên.
- Chọn phần kết đúng ngữ pháp nhưng trái nội dung.

### Thời gian
Matching information có thể mất 1,5–2 phút mỗi câu; nếu sau khi đã skim mà không thấy, chuyển sang câu tiếp theo. Với matching features, đánh dấu tên người ngay trong bài để quay lại nhanh.
'''

[[modules]]
id = "ir-completion"
title = "Completion: câu, tóm tắt, ghi chú, bảng và sơ đồ"
description = "Điền từ vào chỗ trống theo giới hạn số từ, đoán loại từ, nhận paraphrase xung quanh chỗ trống."
lesson = '''
### Các dạng completion
Sentence, summary, note, table, flow-chart và diagram completion đều yêu cầu điền một số từ **lấy từ bài đọc** vào chỗ trống. Một số dạng summary có hộp từ để chọn (khi đó từ có thể được paraphrase).

### Luật giới hạn từ
| Chỉ dẫn | Nghĩa | Ví dụ hợp lệ |
|---|---|---|
| ONE WORD ONLY | đúng một từ | *rainfall* |
| NO MORE THAN TWO WORDS | một hoặc hai từ | *solar power* |
| ONE WORD AND/OR A NUMBER | một từ, một số, hoặc cả hai | *1990* / *group 3* |
Từ gạch nối (*long-term*) thường tính **một** từ. Số viết bằng chữ hay chữ số đều có thể được chấp nhận, nhưng hãy chép đúng như bài. Viết sai chính tả hoặc vượt giới hạn là mất điểm.

### Quy trình
1. Đọc câu/ô có chỗ trống để **dự đoán loại từ**: danh từ, động từ, tính từ, số.
2. Xác định **từ khoá còn lại** trong câu (nhất là số và tên riêng) để scan.
3. Tìm vị trí trong bài, đọc cả câu quanh đó; paraphrase thường biến đổi từ khoá.
4. Chép từ **đúng dạng trong bài**; kiểm tra câu sau khi điền có đúng ngữ pháp (a/an, số ít/số nhiều, thì).
5. Kiểm tra giới hạn số từ.

### Dự đoán qua ngữ pháp
| Trước chỗ trống | Thường cần |
|---|---|
| a / an / the | danh từ hoặc tính từ + danh từ (*an* → âm đầu nguyên âm) |
| is / was | tính từ, danh từ hoặc V-ing |
| to | động từ nguyên mẫu |
| of / in / by | danh từ, V-ing |
| số lượng (*several*) | danh từ số nhiều |

### Flow-chart và table
- Thứ tự các ô trong flow-chart đi theo **thứ tự bài** — dùng từ chỉ trình tự (*first, then, finally*).
- Với bảng, xác định cột và hàng để biết loại thông tin (tên, địa điểm, số).
- Với diagram, dùng nhãn kèm theo để định vị đoạn văn mô tả.

### Lỗi hay gặp
- Điền từ đúng nghĩa nhưng **sai dạng** (*grow* thay vì *growth*).
- Thêm mạo từ khiến vượt giới hạn.
- Chép từ trong câu hỏi thay vì từ trong bài.
- Điền ý "nghe hợp lý" mà không có trong bài.

### Thời gian
Completion thường nhanh vì có chi tiết cụ thể; scan theo từ khoá và số. Nếu bài có hộp từ, loại trước các từ chắc chắn không hợp loại từ.
'''

[[modules]]
id = "ir-mcq-short-answer"
title = "Multiple choice và short answer"
description = "Chọn một hoặc nhiều đáp án, loại trừ phương án nhiễu, trả lời ngắn theo giới hạn từ."
lesson = '''
### Multiple choice một đáp án
Câu hỏi thường bám theo thứ tự bài. Phương án nhiễu thường:
- **đúng từ, sai ý:** dùng từ trong bài nhưng nói điều khác;
- **đúng nhưng không trả lời câu hỏi:** là thông tin có trong bài nhưng không phải điều được hỏi;
- **quá tuyệt đối:** dùng *always*, *all*, *only* trong khi bài nói *often*, *most*;
- **suy luận quá đà:** đi xa hơn điều bài khẳng định.

### Multiple choice nhiều đáp án
Câu hỏi nói rõ chọn *TWO* hay *THREE* đáp án. Các đáp án đúng thường nằm trong cùng một đoạn nhưng **không theo thứ tự**. Đọc kỹ đoạn rồi gạch từng phương án; phải chọn đúng cả tập thì mới được điểm cho câu (mỗi đáp án đúng có thể được tính riêng tuỳ đề, nhưng đừng trông chờ vào đó).

### Quy trình loại trừ
1. Đọc **câu hỏi** (stem) trước, không đọc ngay các phương án, rồi tự dự đoán đáp án.
2. Tìm đoạn liên quan từ từ khoá trong câu hỏi.
3. Với từng phương án, tự hỏi: *Bài có nói đúng ý này không?* Nếu chỉ có một nửa ý đúng thì là nhiễu.
4. Chọn phương án có paraphrase khớp nhất, không chọn vì chữ giống.
5. Câu hỏi về **mục đích của tác giả** hoặc **ý chính** cần cân nhắc toàn đoạn/bài.

### Short answer
Trả lời câu hỏi (*What*, *Which*, *How many*, *Who*) bằng một cụm ngắn **lấy từ bài** trong giới hạn từ. Kiểm tra loại từ cần: câu hỏi *How many…* cần số; *Who…* cần tên/nhóm người.
| Câu hỏi | Dạng đáp án |
|---|---|
| What material was used? | danh từ chỉ chất liệu |
| How long did it take? | số + đơn vị |
| Which group benefited? | cụm danh từ chỉ nhóm |

### Lỗi hay gặp
- Chọn đáp án ngay khi thấy từ quen mà chưa đọc hết câu.
- Bỏ sót chỉ dẫn *TWO* / *THREE*.
- Điền short answer là cả cụm dài vượt giới hạn.
- Chọn phương án đúng với kiến thức bên ngoài nhưng không có trong bài.

### Thời gian
MCQ khó thường nằm cuối bài 3; nếu đã quá thời gian, hãy loại hai phương án rõ ràng sai rồi chọn một trong hai còn lại. Không bỏ trống câu nào.
'''

[[modules]]
id = "ir-full-passages"
title = "Bài đọc đầy đủ luyện theo thời gian"
description = "Bốn bài đọc 700–900 từ, mỗi bài ba bộ câu hỏi thuộc nhiều dạng. Luyện hoàn thành trọn bài trong 20 phút."
lesson = '''
### Cách luyện với bài đọc dài
Mỗi bài trong phần này là một bài đọc đầy đủ (700–900 từ), tự soạn và **hư cấu**: các nghiên cứu, tổ chức và con số trong đó chỉ phục vụ luyện tập, không phải thông tin thật. Mỗi bài có ba bộ câu hỏi liền nhau, dùng chung một bài đọc nhưng mỗi bộ gồm một dạng câu hỏi khác nhau. Hãy tính giờ **20 phút cho cả ba bộ**.

### Quy trình làm trọn bài
| Phút | Việc cần làm |
|---|---|
| 0–2 | Đọc tiêu đề, skim các đoạn, đọc chỉ dẫn và gạch từ khoá của cả ba bộ câu hỏi |
| 2–6 | Làm bộ matching/headings (cần ý chính từng đoạn) |
| 6–13 | Làm TRUE/FALSE/NOT GIVEN và completion theo thứ tự bài |
| 13–18 | Làm MCQ và các câu còn lại |
| 18–20 | Rà soát câu bỏ trống, kiểm tra giới hạn số từ và chính tả |

### Thứ tự các bộ câu hỏi
Trong đề thật, thứ tự xuất hiện của các bộ câu hỏi trên trang không nhất thiết là thứ tự làm tối ưu. Quy tắc chung: làm trước các dạng yêu cầu bạn skim cả bài (headings), sau đó là các dạng scan chi tiết (completion, TFNG), cuối cùng là MCQ khó hoặc dạng nhiều đáp án.

### Sau khi làm xong: tự phân tích lỗi
Với mỗi câu sai, ghi lại nguyên nhân vào một bảng riêng:
| Nguyên nhân | Cách khắc phục |
|---|---|
| Không nhận ra paraphrase | ghi cặp từ vào sổ từ vựng |
| Nhầm FALSE/NOT GIVEN | trích câu trái ngược trước khi chọn FALSE |
| Sai giới hạn số từ | gạch chỉ dẫn trước khi điền |
| Hết thời gian | tập đặt mốc phút cho từng bộ |

### Lỗi hay gặp ở bài dài
- Đọc kỹ toàn bộ bài trước khi nhìn câu hỏi, mất 8–10 phút.
- Không đánh dấu vị trí đáp án nên khó rà soát lại.
- Dồn thời gian cho vài câu khó và bỏ trống các câu dễ ở cuối.
- Quên chuyển đáp án sang phiếu trả lời (trong thi giấy không có thời gian chép thêm).

### Mục tiêu
Khi làm đủ bốn bài, bạn nên đạt từ 70% câu đúng mỗi bài trong 20 phút trước khi thử các đề tổng hợp 60 phút. Nếu chưa đạt, quay lại module dạng câu bạn sai nhiều nhất.
'''

[[questions]]
id = "ir-001"
module = "ir-strategy-paraphrase"
type = "single"
difficulty = 1
tags = ["band:5.5", "timing"]
prompt = '''
Bạn có 60 phút cho 3 bài đọc Academic Reading. Cách phân bổ thời gian nào hợp lý nhất?
'''
options = ["Dành 40 phút cho bài 1 để chắc chắn đúng hết", "Khoảng 17–18 phút bài 1, 20 phút bài 2, 22–23 phút bài 3", "Chia đúng 30 phút cho bài 1 và 2 rồi bỏ bài 3", "Đọc kỹ cả ba bài trước rồi mới trả lời"]
answer = [1]
explanation = '''
Bài thi không có thời gian chép đáp án riêng và bài 3 thường khó nhất, nên bài 1 làm nhanh hơn để dành thời gian cho bài sau. Dành quá nhiều thời gian cho bài đầu là sai lầm phổ biến.
'''

[[questions]]
id = "ir-002"
module = "ir-strategy-paraphrase"
type = "single"
difficulty = 1
tags = ["band:5.5", "skim-scan"]
prompt = '''
Trước khi đọc kỹ đoạn văn, bước nào nên làm đầu tiên theo quy trình khuyến nghị?
'''
options = ["Dịch toàn bộ bài sang tiếng Việt", "Đọc tiêu đề, liếc đoạn đầu và đọc chỉ dẫn cùng câu hỏi", "Điền đáp án ngay vào phiếu từ trí nhớ", "Đọc lại bài hai lần"]
answer = [1]
explanation = '''
Biết chủ đề và biết mình cần tìm gì giúp skim/scan hiệu quả. Dịch cả bài hoặc đọc đi đọc lại làm mất thời gian.
'''

[[questions]]
id = "ir-003"
module = "ir-strategy-paraphrase"
type = "single"
difficulty = 1
tags = ["band:5.5", "skim-scan"]
prompt = '''
Kỹ thuật nào phù hợp nhất để tìm một **năm** hoặc **tên riêng** trong bài?
'''
options = ["Skim", "Scan", "Đọc kỹ từng chữ toàn bài", "Dịch nghĩa"]
answer = [1]
explanation = '''
Scan là đọc lướt tìm một chi tiết cụ thể như số, ngày, tên riêng. Skim dùng để nắm ý chính.
'''

[[questions]]
id = "ir-004"
module = "ir-strategy-paraphrase"
type = "single"
difficulty = 1
tags = ["band:5.5", "paraphrase"]
prompt = '''
Văn bản: *Prices rose sharply in 2015.* Câu nào paraphrase tốt nhất?
'''
options = ["Costs increased rapidly in 2015.", "Prices were stable in 2015.", "Prices fell slightly in 2015.", "Costs were mentioned in 2015."]
answer = [0]
explanation = '''
*Rose sharply* = *increased rapidly*; *prices* = *costs*. Hai lựa chọn kế tiếp nói ngược; lựa chọn cuối chỉ nhắc chung, không có ý tăng.
'''

[[questions]]
id = "ir-005"
module = "ir-strategy-paraphrase"
type = "single"
difficulty = 1
tags = ["band:5.5", "paraphrase"]
prompt = '''
Văn bản: *Many students find the course difficult.* Câu nào có cùng nghĩa?
'''
options = ["A large number of learners think the course is hard.", "Few learners enjoy the course.", "The course has many students.", "Students are difficult."]
answer = [0]
explanation = '''
*Many students* = *a large number of learners*, *difficult* = *hard*. Lựa chọn 2 đổi sang ý khác (ít người thích), lựa chọn 3 chỉ giữ từ khoá.
'''

[[questions]]
id = "ir-006"
module = "ir-strategy-paraphrase"
type = "fill"
difficulty = 1
tags = ["band:5.5", "paraphrase"]
prompt = '''
Điền từ đồng nghĩa với từ gạch chân bằng một từ tiếng Anh (chữ thường): *The company aims to reduce waste.* → *The company wants to {{blank}} waste.* (một từ bắt đầu bằng *c*, nghĩa là cắt giảm)
'''
blanks = [["cut"]]
explanation = '''
*Reduce* thường được paraphrase bằng *cut* (cắt giảm). Trong Reading, động từ thường là thứ bị thay đổi nhiều nhất, còn danh từ *waste* giữ nguyên.
'''

[[questions]]
id = "ir-007"
module = "ir-strategy-paraphrase"
type = "single"
difficulty = 1
tags = ["band:5.5", "skim-scan"]
prompt = '''
Từ nào thường **giữ nguyên** khi câu hỏi paraphrase văn bản, nên là điểm neo tốt khi scan?
'''
options = ["Động từ chỉ hành động", "Tính từ chỉ mức độ", "Số, tên riêng và thuật ngữ chuyên ngành", "Trạng từ"]
answer = [2]
explanation = '''
Số liệu, tên riêng và thuật ngữ khó thay bằng từ khác nên thường giữ nguyên; động từ, tính từ dễ bị paraphrase.
'''

[[questions]]
id = "ir-008"
module = "ir-strategy-paraphrase"
type = "single"
difficulty = 2
tags = ["band:6.5", "paraphrase"]
prompt = '''
Văn bản: *The decision was widely criticised.* Câu nào thể hiện đổi loại từ (word form)?
'''
options = ["The decision was disliked by a few people.", "There was widespread criticism of the decision.", "The decision was praised.", "Nobody understood the decision."]
answer = [1]
explanation = '''
*Criticised* (động từ) → *criticism* (danh từ); *widely* → *widespread*. Lựa chọn 1 giảm mức độ (*a few*), nên không tương đương.
'''

[[questions]]
id = "ir-009"
module = "ir-strategy-paraphrase"
type = "single"
difficulty = 2
tags = ["band:6.5", "paraphrase"]
prompt = '''
Văn bản: *Few residents attended the meeting.* Paraphrase nào đúng?
'''
options = ["Attendance at the meeting was low.", "Residents were interested in the meeting.", "The meeting was cancelled.", "Many people attended the meeting."]
answer = [0]
explanation = '''
*Few residents attended* → *attendance was low* (đổi cấu trúc: động từ thành danh từ + tính từ). Hai lựa chọn còn lại trái nghĩa hoặc thêm thông tin không có.
'''

[[questions]]
id = "ir-010"
module = "ir-strategy-paraphrase"
type = "single"
difficulty = 2
tags = ["band:6.5", "paraphrase"]
prompt = '''
Văn bản: *Cars, buses and trains all contributed to the rise in emissions.* Câu hỏi: *Various forms of transport led to higher emissions.* Kiểu paraphrase nào được dùng?
'''
options = ["Phủ định kép", "Khái quát hoá (cars, buses, trains → forms of transport)", "Đổi thì của động từ", "Đảo chủ ngữ và tân ngữ"]
answer = [1]
explanation = '''
Danh sách cụ thể được gộp thành nhóm khái quát *forms of transport*; *contributed to the rise* → *led to higher*.
'''

[[questions]]
id = "ir-011"
module = "ir-strategy-paraphrase"
type = "single"
difficulty = 2
tags = ["band:6.5", "paraphrase"]
prompt = '''
Văn bản: *It is not uncommon for apprentices to change employers.* Ý nào đúng?
'''
options = ["Apprentices never change employers.", "It is fairly frequent for apprentices to change employers.", "Apprentices rarely change employers.", "Employers do not accept apprentices."]
answer = [1]
explanation = '''
*Not uncommon* là phủ định kép, nghĩa là khá thường xảy ra. Hai lựa chọn khác nói *never/rarely* ngược nghĩa.
'''

[[questions]]
id = "ir-012"
module = "ir-strategy-paraphrase"
type = "single"
difficulty = 2
tags = ["band:6.5", "timing"]
prompt = '''
Bạn nên bỏ lại và quay về sau một câu hỏi khi nào?
'''
options = ["Khi đã tìm được đáp án", "Khi mất khoảng 1 phút mà vẫn chưa xác định được căn cứ", "Khi câu hỏi có số", "Không bao giờ"]
answer = [1]
explanation = '''
Tiết kiệm thời gian cho câu dễ hơn: ghi dấu hỏi, đi tiếp, rồi quay lại nếu còn giờ. Không bỏ trống phiếu vì sai không bị trừ điểm.
'''

[[questions]]
id = "ir-013"
module = "ir-strategy-paraphrase"
type = "multiple"
difficulty = 2
tags = ["band:6.5", "paraphrase"]
prompt = '''
Chọn **hai** kiểu paraphrase xuất hiện giữa cặp câu sau. Văn bản: *Sales increased sharply after the advertising campaign.* Câu hỏi: *There was a sharp rise in sales following the campaign.*
'''
options = ["Từ đồng nghĩa (after → following)", "Đổi loại từ (increased → a rise)", "Phủ định kép", "Đảo ngược nghĩa"]
answer = [0, 1]
explanation = '''
*After* → *following* là đồng nghĩa; động từ *increased* → danh từ *a rise*. Không có phủ định nào và nghĩa giữ nguyên.
'''

[[questions]]
id = "ir-014"
module = "ir-strategy-paraphrase"
type = "single"
difficulty = 2
tags = ["band:6.5", "trap"]
prompt = '''
Câu hỏi nào cho thấy **sai lầm** khi làm bài?
'''
options = ["Gạch chân giới hạn số từ trước khi điền", "Chọn đáp án chỉ vì từ trong lựa chọn giống hệt từ trong bài", "Chuyển đáp án sang phiếu sau mỗi bộ câu hỏi", "Dự đoán loại từ cần điền"]
answer = [1]
explanation = '''
Bẫy phổ biến của IELTS là đáp án nhiễu dùng đúng từ trong bài nhưng sai ý; phải kiểm tra bằng paraphrase và ngữ cảnh.
'''

[[questions]]
id = "ir-015"
module = "ir-strategy-paraphrase"
type = "single"
difficulty = 3
tags = ["band:7", "paraphrase"]
prompt = '''
Văn bản: *The scheme, though initially popular, ultimately failed to attract sustained investment.* Câu nào là paraphrase gần nhất?
'''
options = ["The programme lost investor support despite its early appeal.", "The programme was never popular with the public.", "Investors continued to fund the scheme.", "The scheme succeeded because of its popularity."]
answer = [0]
explanation = '''
*Scheme* → *programme*, *initially popular* → *early appeal*, *failed to attract sustained investment* → *lost investor support*. Các lựa chọn khác trái ngược hoặc bỏ phần nhượng bộ *though initially popular*.
'''

[[questions]]
id = "ir-016"
module = "ir-strategy-paraphrase"
type = "single"
difficulty = 3
tags = ["band:7", "paraphrase"]
prompt = '''
Văn bản: *Rarely did the committee reach a unanimous verdict.* Câu nào giữ nguyên nghĩa?
'''
options = ["The committee was usually in complete agreement.", "Complete agreement among the committee was uncommon.", "The committee never made decisions.", "Unanimous verdicts were typical."]
answer = [1]
explanation = '''
*Rarely* = *uncommon*, *unanimous verdict* = *complete agreement*. *Never* ở lựa chọn 3 quá tuyệt đối.
'''

[[questions]]
id = "ir-017"
module = "ir-strategy-paraphrase"
type = "single"
difficulty = 3
tags = ["band:7", "paraphrase", "trap"]
prompt = '''
Văn bản: *Researchers attributed the decline in bee numbers chiefly to habitat loss.* Câu nào đúng?
'''
options = ["Habitat loss was seen as the main cause of fewer bees.", "Habitat loss was the only reason bees declined.", "Fewer bees caused habitat loss.", "Researchers could not explain the decline in bees."]
answer = [0]
explanation = '''
*Attributed… chiefly to* = *seen as the main cause*. Lựa chọn 2 quá tuyệt đối (*only*), lựa chọn 3 đảo nhân quả.
'''

[[questions]]
id = "ir-018"
module = "ir-strategy-paraphrase"
type = "single"
difficulty = 3
tags = ["band:7", "trap"]
prompt = '''
Trong một đoạn có hai câu gần giống câu hỏi, một câu ở đầu đoạn và một câu ở cuối đoạn có từ *However*. Vì sao nên đọc kỹ cả câu có *However*?
'''
options = ["Vì *However* luôn báo hiệu đáp án đúng", "Vì thông tin có thể đổi hướng, làm câu đầu không còn đúng cho nhận định", "Vì câu có *However* không bao giờ quan trọng", "Vì *However* là từ khoá của mọi đề"]
answer = [1]
explanation = '''
Từ nối đối lập thường giới thiệu ý chính hoặc sửa lại ý trước. Nếu chỉ dựa vào câu đầu, bạn dễ trả lời sai.
'''

[[questions]]
id = "ir-019"
module = "ir-tfng-ynng"
type = "fill"
difficulty = 1
tags = ["band:5.5", "tfng"]
prompt = '''
Do the following statements agree with the information in the passage? Write **TRUE** if the statement agrees, **FALSE** if it contradicts, **NOT GIVEN** if there is no information. (Điền `true`, `false` hoặc `not given`.)

**The Riverside Community Garden**

The Riverside Community Garden was opened in 2018 on a piece of land that had been empty for ten years. It has forty plots, and each plot is rented by a local family for a small yearly fee. Volunteers meet every Saturday morning to repair paths and water the shared fruit trees. Most of the vegetables are grown for personal use, although a small market stall sells extra tomatoes and herbs once a month. The garden has no electricity supply, so a rainwater tank is used for watering. Last year, a primary school began to visit the garden to teach children about plants.

1. The garden was built on land that had been unused for a decade. {{blank}}
2. Families do not pay to use a plot. {{blank}}
3. Volunteers also water the trees on Wednesdays. {{blank}}
4. The market stall sells vegetables every week. {{blank}}
5. Rainwater is collected for watering. {{blank}}
6. The primary school pays the garden for each visit. {{blank}}
'''
blanks = [["true", "t"], ["false", "f"], ["not given", "ng"], ["false", "f"], ["true", "t"], ["not given", "ng"]]
explanation = '''
1. TRUE: "empty for ten years" = unused for a decade.
2. FALSE: "rented… for a small yearly fee" nên gia đình có trả phí.
3. NOT GIVEN: bài chỉ nói tình nguyện viên họp mỗi sáng thứ Bảy, không nhắc thứ Tư.
4. FALSE: "once a month", không phải mỗi tuần.
5. TRUE: "a rainwater tank is used for watering".
6. NOT GIVEN: bài không nói về chuyện trả tiền cho các chuyến thăm.
'''

[[questions]]
id = "ir-020"
module = "ir-tfng-ynng"
type = "fill"
difficulty = 2
tags = ["band:6.5", "tfng"]
prompt = '''
Do the following statements agree with the information in the passage? Write **TRUE** if the statement agrees, **FALSE** if it contradicts, **NOT GIVEN** if there is no information. (Điền `true`, `false` hoặc `not given`.)

**Harnessing the tides**

Interest in tidal energy has grown because tides are far more predictable than wind or sunlight. Engineers can calculate the height of the sea years in advance, which makes it easier for grid operators to plan supply. However, building turbines on the sea floor is expensive, and salt water corrodes equipment quickly. A pilot project in a narrow channel, funded by a regional government, installed four turbines in 2016. Two were removed after eighteen months because of damage, but the remaining pair has produced electricity continuously since then. Local fishermen initially objected, fearing that the turbines would harm fish, but monitoring so far has recorded no significant change in fish numbers near the site. Supporters argue that costs will fall as designs improve, whereas critics say that the technology will remain too costly to compete with offshore wind.

1. Tidal energy is easier to forecast than wind energy. {{blank}}
2. All four turbines of the pilot project are still operating. {{blank}}
3. The pilot project was paid for by the national government. {{blank}}
4. Monitoring has confirmed the fishermen's fears about fish. {{blank}}
5. The turbines were installed before 2017. {{blank}}
6. The pilot channel is in northern Europe. {{blank}}
'''
blanks = [["true", "t"], ["false", "f"], ["false", "f"], ["false", "f"], ["true", "t"], ["not given", "ng"]]
explanation = '''
1. TRUE: "tides are far more predictable than wind or sunlight".
2. FALSE: "Two were removed… the remaining pair" nên chỉ còn hai.
3. FALSE: "funded by a regional government", không phải chính phủ quốc gia.
4. FALSE: "no significant change in fish numbers".
5. TRUE: lắp năm 2016, tức trước 2017.
6. NOT GIVEN: bài không nêu vị trí địa lý của kênh.
'''

[[questions]]
id = "ir-021"
module = "ir-tfng-ynng"
type = "fill"
difficulty = 2
tags = ["band:6.5", "tfng"]
prompt = '''
Do the following statements agree with the information in the passage? Write **TRUE** if the statement agrees, **FALSE** if it contradicts, **NOT GIVEN** if there is no information. (Điền `true`, `false` hoặc `not given`.)

**Reading for pleasure**

A survey of 600 adults in a mid-sized city, carried out by the local library network, found that people who read for pleasure at least twice a week were more likely to report feeling relaxed at the end of the day. The finding does not prove that reading causes relaxation: the survey authors noted that people with less stressful jobs may simply have more time to read. Printed books remained more popular than e-books among respondents over fifty, but the difference almost disappeared among those under thirty. Surprisingly, the share of respondents who borrowed books from the library was higher among the young than the old. The authors recommended that libraries expand their digital lending, although they accepted that the survey only covered one city.

1. The survey included 600 respondents. {{blank}}
2. The authors state that reading causes relaxation. {{blank}}
3. Among those under thirty, printed books were far more popular than e-books. {{blank}}
4. Younger respondents were more likely to borrow from the library than older ones. {{blank}}
5. Libraries have already expanded their digital lending. {{blank}}
6. The survey was carried out by a national university. {{blank}}
'''
blanks = [["true", "t"], ["false", "f"], ["false", "f"], ["true", "t"], ["not given", "ng"], ["false", "f"]]
explanation = '''
1. TRUE: "A survey of 600 adults".
2. FALSE: "does not prove that reading causes relaxation".
3. FALSE: "the difference almost disappeared among those under thirty".
4. TRUE: "the share… who borrowed… was higher among the young than the old".
5. NOT GIVEN: tác giả chỉ *khuyến nghị* (recommended), bài không nói thư viện đã làm.
6. FALSE: "carried out by the local library network".
'''

[[questions]]
id = "ir-022"
module = "ir-tfng-ynng"
type = "fill"
difficulty = 3
tags = ["band:7", "tfng"]
prompt = '''
Do the following statements agree with the information in the passage? Write **TRUE** if the statement agrees, **FALSE** if it contradicts, **NOT GIVEN** if there is no information. (Điền `true`, `false` hoặc `not given`.)

**Sleep and memory**

Sleep researchers have long suspected that the brain consolidates memories during rest, but the mechanism remains disputed. A research team at a university laboratory asked 48 volunteers to learn a list of word pairs in the evening. Half were allowed to sleep for eight hours; the others stayed awake until morning. At a retest the following day, the sleepers recalled on average a third more word pairs. The team cautioned that the two groups had been retested at different clock times, which could have influenced the results, and that a sample of 48 was small. Some members of the team believed that deep sleep was the key stage, but their data did not allow them to rule out a role for dreaming sleep. A follow-up with a larger sample is planned, though no funding has yet been confirmed.

1. Researchers agree on how the brain consolidates memories. {{blank}}
2. The volunteers were split into two groups. {{blank}}
3. The volunteers who slept recalled more word pairs than those who did not. {{blank}}
4. Both groups were retested at the same clock time. {{blank}}
5. The team demonstrated that deep sleep is the key stage for memory. {{blank}}
6. All of the volunteers were university students. {{blank}}
'''
blanks = [["false", "f"], ["true", "t"], ["true", "t"], ["false", "f"], ["false", "f"], ["not given", "ng"]]
explanation = '''
1. FALSE: "the mechanism remains disputed".
2. TRUE: "Half were allowed to sleep… the others stayed awake".
3. TRUE: "the sleepers recalled on average a third more word pairs".
4. FALSE: "retested at different clock times".
5. FALSE: họ chỉ *believed* (tin rằng) và dữ liệu không loại trừ giấc mơ; chưa "demonstrated".
6. NOT GIVEN: bài không nói tình nguyện viên là ai.
'''

[[questions]]
id = "ir-023"
module = "ir-tfng-ynng"
type = "fill"
difficulty = 2
tags = ["band:6.5", "ynng"]
prompt = '''
Do the following statements agree with the views of the writer? Write **YES**, **NO** or **NOT GIVEN**. (Điền `yes`, `no` hoặc `not given`.)

**Working from home**

It is often claimed that working from home makes employees more productive. I am not convinced that the evidence is as clear as enthusiasts suggest. Most studies rely on workers describing their own output, and people tend to rate their own performance generously. That said, I do accept that commuting time saved is a genuine benefit, and many employees would be reluctant to give it up. What worries me more is the effect on junior staff, who learn much of their craft by watching colleagues at work. A video call is a poor substitute for sitting beside an experienced person. Companies should therefore not abandon offices altogether. A better approach, in my view, would be a flexible arrangement under which new employees spend most of the week in the workplace. Whether such a policy would be popular is a separate question that I cannot answer here.

1. The writer believes the evidence for higher productivity at home is conclusive. {{blank}}
2. The writer suggests that self-reported studies may exaggerate performance. {{blank}}
3. The writer denies that saving commuting time has any value. {{blank}}
4. The writer is concerned about how new employees learn. {{blank}}
5. The writer thinks most junior staff would prefer to work from home. {{blank}}
6. The writer recommends closing offices completely. {{blank}}
'''
blanks = [["no", "n"], ["yes", "y"], ["no", "n"], ["yes", "y"], ["not given", "ng"], ["no", "n"]]
explanation = '''
1. NO: "I am not convinced that the evidence is as clear".
2. YES: "people tend to rate their own performance generously".
3. NO: "I do accept that commuting time saved is a genuine benefit".
4. YES: "What worries me more is the effect on junior staff".
5. NOT GIVEN: tác giả không nói nhân viên mới thích gì (câu cuối còn nói không trả lời được về mức độ được ưa chuộng).
6. NO: "Companies should therefore not abandon offices altogether".
'''

[[questions]]
id = "ir-024"
module = "ir-tfng-ynng"
type = "fill"
difficulty = 3
tags = ["band:7", "ynng"]
prompt = '''
Do the following statements agree with the views of the writer? Write **YES**, **NO** or **NOT GIVEN**. (Điền `yes`, `no` hoặc `not given`.)

**Standardised testing**

Defenders of standardised testing argue that it offers the only fair way to compare pupils from different schools. There is something in this, since teachers' own marks vary in generosity. Yet the case is weaker than it looks. A test measures a narrow range of skills, and once results determine a school's funding, teaching tends to narrow to match it. I would not go so far as to call tests worthless; they can flag pupils who are falling behind at an early stage. But used as the main measure of a school's quality, they distort what they are meant to measure. Some commentators predict that tests will be replaced by continuous assessment within a decade. I find that unlikely, given how attractive simple numbers are to politicians.

1. The writer accepts that teachers' marks can vary in generosity. {{blank}}
2. The writer believes tests are completely worthless. {{blank}}
3. The writer thinks that linking results to funding can change how teachers teach. {{blank}}
4. The writer expects continuous assessment to replace tests within ten years. {{blank}}
5. The writer says politicians designed most current tests. {{blank}}
6. The writer claims that tests can help identify pupils who are falling behind. {{blank}}
'''
blanks = [["yes", "y"], ["no", "n"], ["yes", "y"], ["no", "n"], ["not given", "ng"], ["yes", "y"]]
explanation = '''
1. YES: "There is something in this, since teachers' own marks vary in generosity".
2. NO: "I would not go so far as to call tests worthless".
3. YES: "once results determine a school's funding, teaching tends to narrow".
4. NO: "I find that unlikely".
5. NOT GIVEN: bài chỉ nói chính trị gia thích số liệu đơn giản, không nói ai thiết kế bài thi.
6. YES: "they can flag pupils who are falling behind".
'''

