prompt = '''
Choose the correct letter.

What is the writer's overall attitude towards monetary valuation of nature?

> The notion that natural systems provide services to humanity (pollination, water purification, flood control) has transformed conservation policy. By assigning monetary value to what was once taken for granted, economists hoped to persuade governments that protecting nature is not a luxury. Yet the approach has attracted criticism. Some ecologists argue that reducing a wetland to a figure on a balance sheet invites the conclusion that it can be traded for an equivalent sum elsewhere, ignoring its irreplaceable character. Others point out that valuations depend on assumptions about future human needs, which are inherently uncertain. Defenders respond that the alternative is not a world in which nature is treated as priceless, but one in which it is treated as worthless, because decisions that do not count an asset's value tend to destroy it. Perhaps the most constructive view is that monetary valuation is a communication tool, useful for making a case in the language of policymakers, but dangerous when mistaken for a complete account of what nature is worth.
'''
options = ["Strongly opposed", "Unreservedly enthusiastic", "Appreciative of its usefulness but aware of its limits", "Indifferent"]
answer = [2]
explanation = '''
Câu cuối: valuation là *communication tool*, hữu ích nhưng *dangerous when mistaken for a complete account*. Do đó quan điểm cân bằng, không hoàn toàn phản đối hay ủng hộ.
'''

