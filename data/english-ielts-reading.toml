[[questions]]
id = "ir-045"
module = "ir-matching-headings"
type = "fill"
difficulty = 1
tags = ["band:5.5"]
prompt = '''
The passage has paragraphs **A–D**. Choose the correct heading for each paragraph from the list of headings below. There are more headings than paragraphs. (Điền số La Mã chữ thường, ví dụ `iv`.)

**Cycling in the city**

**A** When the city of Marlow built its first separated bike lanes in 2015, many drivers were angry. They said the lanes would take away road space and cause traffic jams. Local newspapers carried letters of complaint for months.

**B** Gradually, however, opinions began to change. Traffic counts showed that car journey times had hardly changed, while the number of cyclists had tripled. Shops on the cycle routes reported that customers arrived more often, even if they spent less each time.

**C** Safety was another concern. Early lanes were poorly lit and often blocked by parked vehicles. After the council introduced fines and installed street lights, the number of accidents involving cyclists fell by almost half.

**D** Today the council plans to extend the network to the suburbs. Officials hope that a quarter of all short trips will be made by bicycle by 2030, and they are asking residents to suggest routes.

**List of headings**
i. A change in public attitude supported by evidence
ii. Anger at the arrival of the new lanes
iii. Making the routes safer
iv. The history of the bicycle
v. Plans to grow the network
vi. Why shops lost customers

Paragraph A: {{blank}}
Paragraph B: {{blank}}
Paragraph C: {{blank}}
Paragraph D: {{blank}}
'''
blanks = [["ii"], ["i"], ["iii"], ["v"]]
explanation = '''
- **A → ii**: "many drivers were angry… letters of complaint".
- **B → i**: "opinions began to change" + số liệu (traffic counts) làm bằng chứng.
- **C → iii**: đèn đường, phạt xe đỗ, tai nạn giảm gần một nửa.
- **D → v**: "plans to extend the network".
- Heading nhiễu: iv không có trong bài; vi sai vì B nói cửa hàng có *khách đến thường xuyên hơn*.
'''

[[questions]]
id = "ir-046"
module = "ir-matching-headings"
type = "fill"
difficulty = 2
tags = ["band:6.5"]
prompt = '''
The passage has paragraphs **A–E**. Choose the correct heading for each paragraph from the list of headings below. There are more headings than paragraphs. (Điền số La Mã chữ thường, ví dụ `iv`.)

**Beavers return to the valley**

**A** For about four hundred years, beavers were absent from the river valleys of the region, having been hunted for their fur and for a gland used in perfumes. By the early twentieth century, none remained. Their dams, which had once slowed the flow of water, gradually disappeared.

**B** In 2009 a conservation charity released two families into a fenced wetland. Within three years the animals had built a series of dams, and the pools behind them were colonised by frogs, dragonflies and water birds that had been scarce in the area.

**C** Not everyone was pleased. Farmers downstream worried that flooding would damage their fields, and anglers feared that the dams would block migrating fish. The charity responded by installing devices that control the depth of water behind each dam.

**D** Researchers measured the water leaving the wetland during storms and found that the peak flow was lower than in a similar stream without beavers. The ponds appear to hold back rainwater and release it slowly, which may reduce flood risk in the towns lower in the valley.

**E** Several regional authorities are now considering similar releases. Yet scientists caution that beavers cannot be introduced everywhere; steep, narrow valleys are unsuitable, and long-term monitoring is needed before the animals' effect on other species is fully understood.

**List of headings**
i. Evidence that dams may help to control floods
ii. The loss of a once-common animal
iii. The economic value of beaver fur
iv. Rapid ecological benefits at a trial site
v. Why wider release requires caution
vi. Concerns from neighbouring land users and a practical response
vii. A rise in angling success
viii. How beavers build their homes

Paragraph A: {{blank}}
Paragraph B: {{blank}}
Paragraph C: {{blank}}
Paragraph D: {{blank}}
Paragraph E: {{blank}}
'''
blanks = [["ii"], ["iv"], ["vi"], ["i"], ["v"]]
explanation = '''
- **A → ii**: hải ly biến mất khỏi vùng trong nhiều thế kỷ. iii sai vì lông chỉ là *lý do săn*, không phải ý chính.
- **B → iv**: thả thử nghiệm, ba năm sau hệ sinh thái giàu hơn.
- **C → vi**: nông dân/ngư dân lo ngại + hiệu quả của thiết bị kiểm soát mực nước. vii không có trong bài.
- **D → i**: đo lưu lượng đỉnh thấp hơn → bằng chứng giảm lũ.
- **E → v**: *scientists caution*, thung lũng dốc không phù hợp. viii không được bàn tới.
'''

[[questions]]
id = "ir-047"
module = "ir-matching-headings"
type = "fill"
difficulty = 3
tags = ["band:7"]
prompt = '''
The passage has paragraphs **A–E**. Choose the correct heading for each paragraph from the list of headings below. There are more headings than paragraphs. (Điền số La Mã chữ thường, ví dụ `iv`.)

**The attention economy**

**A** Modern media platforms compete not for money directly but for minutes of attention, which can later be sold to advertisers. This reversal, where users are the product rather than the customer, shapes everything from the design of notifications to the length of videos.

**B** Some psychologists claim that constant interruption erodes the capacity for sustained thought. Others, however, point out that earlier generations voiced similar fears about newspapers and television, and that the evidence for lasting cognitive damage is thin.

**C** In response, a small industry has emerged selling devices and applications that block distractions. The irony, noted by several commentators, is that these products are often marketed through the very platforms they are designed to limit.

**D** Regulators have started to take notice. Proposals include banning features that automatically play the next video and requiring services to let users set daily limits. Industry groups reply that such rules would be difficult to enforce and could reduce choice.

**E** Ultimately, the most durable change may come from users themselves. Surveys of young people suggest growing scepticism towards platforms, and a minority already choose simpler phones. Whether this represents a trend or a fashion remains to be seen.

**List of headings**
i. Official attempts to curb manipulative design, and the industry's reservations
ii. A market for solutions with an ironic twist
iii. Disagreement over the mental costs of distraction
iv. Shifts in consumer behaviour of uncertain significance
v. A business model built on capturing time
vi. The invention of the printing press
vii. Why television remains the most popular medium
viii. Teenagers' favourite apps

Paragraph A: {{blank}}
Paragraph B: {{blank}}
Paragraph C: {{blank}}
Paragraph D: {{blank}}
Paragraph E: {{blank}}
'''
blanks = [["v"], ["iii"], ["ii"], ["i"], ["iv"]]
explanation = '''
- **A → v**: "compete… for minutes of attention… users are the product" = mô hình kinh doanh dựa trên việc chiếm thời gian.
- **B → iii**: một số nhà tâm lý lo ngại, người khác phản biện → *disagreement*.
- **C → ii**: sản phẩm chặn xao nhãng nhưng quảng bá qua chính các nền tảng → *ironic twist*.
- **D → i**: quy định cấm tự phát video + phản hồi của ngành.
- **E → iv**: người dùng tự thay đổi, nhưng "trend or a fashion remains to be seen" → *uncertain significance*.
- vi, vii, viii là heading nhiễu, chỉ nhắc lại từ liên quan (television, young people) nhưng không phải ý chính.
'''

[[questions]]
id = "ir-048"
module = "ir-matching-headings"
type = "single"
difficulty = 1
tags = ["band:5.5", "headings"]
prompt = '''
Choose the heading that best summarises the main idea of the paragraph.

> Many people think that learning a language is only about memorising words. In fact, listening to native speakers, practising speaking and reading regularly are just as important. A balanced routine helps learners remember vocabulary for longer.
'''
options = ["The history of language teaching", "Why vocabulary lists are useless", "Several habits that support language learning", "Problems with listening to native speakers"]
answer = [2]
explanation = '''
Đoạn nói học ngôn ngữ không chỉ nhớ từ mà cần nghe, nói, đọc; ý chính là *các thói quen hỗ trợ*. Lựa chọn 2 quá mạnh (*useless*), lựa chọn 4 trái ý.
'''

[[questions]]
id = "ir-049"
module = "ir-matching-headings"
type = "single"
difficulty = 1
tags = ["band:5.5", "headings"]
prompt = '''
