[[questions]]
id = "typescript-dvc01"
module = "typescript-dv-objects-functions"
type = "code"
lang = "javascript"
difficulty = 2
title = "Chọn thuộc tính own theo danh sách"
prompt = '''
Viết hàm pickOwnProperties(source, keys) trả về object mới chỉ gồm các key được yêu cầu mà source thật sự sở hữu trực tiếp.
- Bỏ qua key không tồn tại hoặc chỉ được kế thừa từ prototype.
- Giữ nguyên mọi giá trị hiện có, kể cả false, 0, null hoặc undefined.
- Không sửa source và giữ đúng giá trị cho từng key được chọn.
'''
starter = '''
function pickOwnProperties(source, keys) {
  return {};
}
'''
solution = '''
function pickOwnProperties(source, keys) {
  const result = {};
  for (const key of keys) {
    if (Object.prototype.hasOwnProperty.call(source, key)) {
      result[key] = source[key];
    }
  }
  return result;
}
'''
tests = '''
test('chỉ sao chép các key được yêu cầu', () => {
  expect(pickOwnProperties({ id: 2, name: 'Ada', active: true }, ['name', 'active'])).toEqual({ name: 'Ada', active: true });
});
test('bỏ qua key không tồn tại', () => {
  expect(pickOwnProperties({ id: 2 }, ['missing'])).toEqual({});
});
test('giữ các giá trị falsy và null', () => {
  expect(pickOwnProperties({ enabled: false, count: 0, note: null }, ['enabled', 'count', 'note'])).toEqual({ enabled: false, count: 0, note: null });
});
test('không lấy thuộc tính kế thừa', () => {
  const source = Object.create({ inherited: 4 });
  source.own = 5;
  expect(pickOwnProperties(source, ['inherited', 'own'])).toEqual({ own: 5 });
});
test('không sửa object nguồn và vẫn giữ undefined có mặt', () => {
  const source = { value: undefined };
  const result = pickOwnProperties(source, ['value']);
  expect(Object.prototype.hasOwnProperty.call(result, 'value')).toBe(true);
  expect(Object.prototype.hasOwnProperty.call(source, 'value')).toBe(true);
});
'''
hints = ["Dùng hasOwnProperty.call để kiểm tra key trực tiếp trên object.", "Đừng dùng điều kiện truthy vì false, 0 và null vẫn là giá trị cần giữ."]
explanation = "Bài tập kiểm tra thao tác object theo tập key và phân biệt thuộc tính tồn tại với giá trị truthy."
sources = ["typescript/docs/handbook/2/objects"]

[[modules]]
id = "typescript-dv-classes"
title = "Classes, kế thừa & đóng gói"
description = "Thiết kế class TypeScript, hợp đồng interface, inheritance và phạm vi truy cập."
sources = ["typescript/docs/handbook/2/classes", "typescript/docs/handbook/classes", "typescript/docs/handbook/2/objects"]
lesson = '''
### Class có cả kiểu instance và giá trị runtime
Khai báo class tạo constructor dùng lúc runtime, đồng thời tạo kiểu mô tả instance. TypeScript kiểm tra thành viên, tham số và kiểu trả về của phương thức trước khi phát JavaScript. Một class có thể implements nhiều interface để kiểm tra hợp đồng cấu trúc; implements không tự thêm method, field hay kiểm tra object khi chương trình chạy. extends dùng kế thừa implementation và trạng thái từ class cha, nên constructor lớp con phải khởi tạo lớp cha theo quy tắc của JavaScript.

| Thành viên / từ khóa | Ý nghĩa chính | Có bảo vệ lúc runtime? |
|---|---|---|
| public | Thành viên truy cập công khai; đây là mặc định | Không |
| private của TypeScript | Hạn chế truy cập trong kiểm tra tĩnh | Không |
| #field | Private field của JavaScript | Có |
| protected | Dùng trong class và lớp con theo kiểm tra tĩnh | Không |
| abstract | Đặt hợp đồng hoặc implementation cơ sở | Class abstract không thể khởi tạo trực tiếp |
| override | Yêu cầu thành viên tương ứng tồn tại ở lớp cha | Chủ yếu là kiểm tra tĩnh |

Class cũng có thể khai báo static member ở constructor thay vì instance, accessor để kiểm soát đọc/ghi, và parameter property để khai báo đồng thời tham số constructor với field. readonly chặn gán qua kiểu sau khi khởi tạo theo quy tắc TypeScript, nhưng không tạo bất biến runtime. Tùy chọn noImplicitOverride giúp phát hiện trường hợp lớp con vô tình lệch tên phương thức định ghi đè.

Ví dụ:
~~~ts
interface Clock { now(): number }
class SystemClock implements Clock {
  now(): number { return Date.now(); }
}
~~~

Lỗi thường gặp là nghĩ implements tạo code, coi private của TypeScript như private field của JavaScript, hoặc truy cập static member từ instance. Khi cần đóng gói thực sự trước JavaScript thuần, dùng #field; khi chỉ cần giới hạn API trong dự án TypeScript, private có thể đủ. Kế thừa sâu làm tăng liên kết, nên interface và composition thường dễ thay thế hơn nếu không cần chia sẻ implementation.
'''

