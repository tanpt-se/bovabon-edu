id = "typescript"
title = "TypeScript chuyên sâu"
icon = "🔷"
color = "#3178c6"
group = "Frontend"
docs = ["typescript"]
description = "Đọc hiểu hệ thống kiểu TypeScript, thiết kế kiểu an toàn và tích hợp TypeScript vào dự án JavaScript thực tế."

[[modules]]
id = "ts-types"
title = "Hệ thống kiểu cơ bản & suy luận"
description = "Kiểu nguyên thủy, literal, any, unknown, never, suy luận và tương thích cấu trúc."
sources = ["typescript/docs/handbook/2/everyday-types", "typescript/docs/handbook/type-inference", "typescript/docs/handbook/type-compatibility"]
lesson = '''
### Kiểu được suy luận từ cách dùng
TypeScript phân tích giá trị khởi tạo, biểu thức và ngữ cảnh để suy ra kiểu; không cần chú thích mọi biến. let status = "ready" thường được mở rộng thành string, còn const status = "ready" có thể giữ kiểu literal "ready". Chú thích kiểu hữu ích ở ranh giới dữ liệu và chữ ký hàm, còn suy luận tốt giúp tránh lặp lại thông tin.

| Kiểu | Dùng khi |
|---|---|
| unknown | Nhận dữ liệu chưa tin cậy; phải thu hẹp trước khi dùng |
| any | Tắt kiểm tra kiểu tại vị trí đó; lan truyền rủi ro sang nơi gọi |
| never | Không có giá trị nào hợp lệ, hoặc nhánh không thể tới |
| void | Hàm không cung cấp giá trị trả về hữu ích |

Kiểu đối tượng theo cấu trúc: hai giá trị tương thích nếu chúng có các thành viên cần thiết với kiểu tương thích, không cần cùng tên khai báo. Ví dụ: type Point = { x: number; y: number }; một object có đủ x và y có thể gán cho Point. Lỗi hay gặp: ép kiểu bằng as để im lặng bỏ qua lỗi; assertion chỉ ảnh hưởng kiểm tra tĩnh, không xác thực dữ liệu lúc chạy.
'''

[[modules]]
id = "ts-narrowing"
title = "Narrowing & type guard"
description = "Control-flow analysis, typeof, in, instanceof, predicate, assertion function và exhaustive switch."
sources = ["typescript/docs/handbook/2/narrowing", "typescript/docs/handbook/2/functions#never"]
lesson = '''
### Thu hẹp kiểu theo luồng điều khiển
Một biến khai báo là union chỉ dùng được các thao tác an toàn cho mọi thành viên. Câu lệnh if, switch, typeof, instanceof, phép kiểm tra in, so sánh literal và phép gán có thể thu hẹp tập kiểu ở từng nhánh. Type predicate dạng value is T mô tả một hàm boolean cho compiler; assertion function dạng asserts value is T báo rằng hàm ném lỗi nếu điều kiện không đúng.

| Cách kiểm tra | Tín hiệu thu hẹp |
|---|---|
| typeof x === "string" | primitive |
| "id" in x | thuộc tính của union object |
| x instanceof Date | instance của class |
| x.kind === "saved" | discriminant literal |

Với discriminated union, dùng switch trên trường chung như kind. Gán biến ở nhánh cuối cho never giúp compiler báo khi union có thành viên mới chưa được xử lý. Lỗi thường gặp là chỉ kiểm tra if (x) rồi cho rằng đã loại mọi giá trị rỗng: chuỗi rỗng, số 0 và false vẫn cần được xử lý theo đúng miền dữ liệu.
'''

[[modules]]
id = "ts-generics"
title = "Generics & ràng buộc"
description = "Tham số kiểu, suy luận đối số, extends, keyof, indexed access và quan hệ giữa input-output."
sources = ["typescript/docs/handbook/2/generics", "typescript/docs/handbook/2/keyof-types", "typescript/docs/handbook/2/indexed-access-types"]
lesson = '''
### Giữ mối quan hệ giữa các kiểu
Generic biểu diễn một kiểu chưa biết nhưng có quan hệ ổn định giữa đầu vào và đầu ra. Hàm identity<T>(value: T): T trả lại đúng kiểu đầu vào; compiler thường suy luận T từ đối số nên caller không phải chỉ định tường minh. Dùng extends để giới hạn những thao tác generic được phép thực hiện, chẳng hạn T extends { id: string }.

| Cú pháp | Ý nghĩa |
|---|---|
| keyof T | union các key hợp lệ của T |
| T[K] | kiểu giá trị ở key K |
| K extends keyof T | đảm bảo key truy cập thuộc T |
| T extends Constraint | giới hạn kiểu generic theo cấu trúc |

Mẫu getProperty<T, K extends keyof T>(value: T, key: K): T[K] nối kiểu key với kiểu giá trị trả về. Lỗi hay gặp là ràng buộc generic quá rộng rồi bên trong dùng thuộc tính chưa được đảm bảo; cách sửa là ràng buộc tối thiểu đủ cho thao tác cần thiết, không thay generic bằng any.
'''

[[modules]]
id = "ts-type-programming"
title = "Utility, mapped, conditional & template literal types"
description = "Biến đổi kiểu có hệ thống bằng utility types, mapped types, điều kiện và chuỗi literal."
sources = ["typescript/docs/handbook/utility-types", "typescript/docs/handbook/2/mapped-types", "typescript/docs/handbook/2/conditional-types", "typescript/docs/handbook/2/template-literal-types"]
lesson = '''
### Biến đổi kiểu ở thời điểm biên dịch
Utility types dựng sẵn như Partial<T>, Required<T>, Readonly<T>, Pick<T, K>, Omit<T, K>, Record<K, V> và ReturnType<F> giúp mô tả kiểu dẫn xuất mà không sao chép cấu trúc. Mapped type lặp qua các key, có thể thêm/bỏ modifier như readonly hoặc ?; conditional type chọn nhánh theo quan hệ T extends U.

| Công cụ | Ví dụ công dụng |
|---|---|
| Pick với các key id và name | chỉ giữ vài thuộc tính |
| Omit<User, "secret"> | loại thuộc tính khỏi kiểu |
| T extends U ? A : B | chọn kiểu theo điều kiện |
| Template literal type | tạo tên kiểu chuỗi từ union |

Conditional type phân phối qua union khi kiểu bên trái extends là type parameter thuần; bọc hai phía trong tuple để kiểm tra cả union như một khối. Các kiểu trên bị xóa khi biên dịch thành JavaScript, vì vậy Readonly<T> không tự đóng băng object lúc chạy. Lỗi thường gặp là nhầm bảo đảm tĩnh với validation hay immutability runtime.
'''

[[modules]]
id = "ts-project"
title = "tsconfig, module, khai báo & tích hợp dự án"
description = "Compiler options, strictness, module resolution, declaration files và ranh giới JS/TS."
sources = ["typescript/tsconfig", "typescript/docs/handbook/tsconfig-json", "typescript/docs/handbook/modules/reference", "typescript/docs/handbook/declaration-files/introduction", "typescript/docs/handbook/integrating-with-build-tools"]
lesson = '''
### Đặt TypeScript trong dự án
tsconfig.json xác định tập file, mục tiêu JavaScript, module, cách phân giải import và mức kiểm tra. strict: true bật nhóm kiểm tra nghiêm ngặt; thay đổi từng option cần cân nhắc môi trường chạy và bundler. module mô tả dạng module đầu ra, còn moduleResolution phải khớp môi trường như Node.js hoặc bundler. Một file có import/export được xử lý như module; file không có chúng có thể thuộc global script scope.

| Tệp / option | Vai trò |
|---|---|
| tsconfig.json | cấu hình compiler và phạm vi dự án |
| *.d.ts | mô tả kiểu cho JavaScript hoặc package không có kiểu |
| declaration | phát sinh declaration cho thư viện |
| import type | import chỉ dùng ở vị trí kiểu |

.d.ts không chứa implementation runtime; khai báo phải phản ánh API thật để tránh lời hứa kiểu sai. TypeScript kiểm tra tĩnh nhưng không kiểm tra JSON, response mạng hay input người dùng lúc chạy. Lỗi hay gặp là nghĩ paths tự sửa đường dẫn runtime, hoặc nghĩ khai báo kiểu đã xác thực dữ liệu; bundler/runtime vẫn cần cấu hình tương ứng và dữ liệu ngoài cần validator.
'''

