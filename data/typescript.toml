[[questions]]
id = "ts-015"
module = "ts-narrowing"
type = "code"
lang = "javascript"
difficulty = 2
title = "Exhaustive switch cho event"
prompt = '''
Viết describeEvent(event) theo mô hình discriminated union:
- { type: 'created', id: number } trả về Created #<id>
- { type: 'renamed', oldName: string, newName: string } trả về Renamed <oldName> -> <newName>
- { type: 'deleted', id: number } trả về Deleted #<id>
- type lạ phải ném Error với message Unexpected event type: <type>
Dùng switch và một helper assertNever để thể hiện nhánh exhaustive. JavaScript không có kiểm tra never lúc biên dịch, nên helper kiểm tra lỗi lúc chạy.
'''
starter = '''
function describeEvent(event) {
  return event.type;
}
'''
solution = '''
function assertNever(value) {
  const kind = value && typeof value === 'object' ? value.type : value;
  throw new Error('Unexpected event type: ' + String(kind));
}

function describeEvent(event) {
  switch (event.type) {
    case 'created':
      return 'Created #' + event.id;
    case 'renamed':
      return 'Renamed ' + event.oldName + ' -> ' + event.newName;
    case 'deleted':
      return 'Deleted #' + event.id;
    default:
      return assertNever(event);
  }
}
'''
