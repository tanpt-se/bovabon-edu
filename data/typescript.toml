[[questions]]
id = "ts-008"
module = "ts-types"
type = "code"
lang = "javascript"
difficulty = 1
title = "Runtime guard & assertion"
prompt = '''
Viết hai hàm JavaScript:
- isNonEmptyString(value) trả về true khi value là chuỗi có ít nhất một ký tự không phải khoảng trắng.
- assertNonEmptyString(value) trả lại chính chuỗi ban đầu nếu hợp lệ; nếu không, ném TypeError có message là Expected non-empty string.
Đây là phần runtime tương ứng với type guard và assertion function trong TypeScript; không dùng cú pháp TypeScript.
'''
starter = '''
function isNonEmptyString(value) {
  return typeof value === 'string';
}

function assertNonEmptyString(value) {
  return value;
}
'''
solution = '''
function isNonEmptyString(value) {
  return typeof value === 'string' && value.trim().length > 0;
}

function assertNonEmptyString(value) {
  if (!isNonEmptyString(value)) throw new TypeError('Expected non-empty string');
  return value;
}
'''
tests = '''
test('chấp nhận chuỗi có nội dung', () => {
  expect(isNonEmptyString(' TypeScript ')).toBe(true);
});
test('từ chối chuỗi rỗng và chỉ có khoảng trắng', () => {
  expect(isNonEmptyString('')).toBe(false);
  expect(isNonEmptyString('   ')).toBe(false);
});
test('từ chối giá trị không phải chuỗi', () => {
  expect(isNonEmptyString(12)).toBe(false);
  expect(isNonEmptyString(null)).toBe(false);
});
test('assert trả lại nguyên chuỗi ban đầu', () => {
  expect(assertNonEmptyString(' x ')).toBe(' x ');
});
test('assert ném TypeError với giá trị sai', () => {
  expect(() => assertNonEmptyString('  ')).toThrow('Expected non-empty string');
});
'''
hints = ["Kiểm tra typeof trước khi gọi trim.", "Assertion cần ném lỗi khi predicate trả false."]
explanation = "Type guard thu hẹp kiểu sau kiểm tra; assertion function biến điều kiện sai thành lỗi runtime."

