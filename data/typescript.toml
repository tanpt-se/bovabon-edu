[[questions]]
id = "ts-021"
module = "ts-generics"
type = "code"
lang = "javascript"
difficulty = 2
title = "Result<T, E> helpers"
prompt = '''
Triển khai các helper JavaScript cho kiểu Result:
- ok(value) tạo { ok: true, value }
- err(error) tạo { ok: false, error }
- mapResult(result, fn) áp dụng fn chỉ khi thành công, giữ nguyên lỗi nếu thất bại
- flatMapResult(result, fn) trả nguyên result lỗi hoặc trả trực tiếp kết quả Result do fn tạo
- unwrapOr(result, fallback) trả value khi thành công, fallback khi lỗi
'''
starter = '''
function ok(value) { return { ok: true, value }; }
function err(error) { return { ok: false, error }; }
function mapResult(result, fn) { return result; }
function flatMapResult(result, fn) { return result; }
function unwrapOr(result, fallback) { return fallback; }
'''
solution = '''
function ok(value) {
  return { ok: true, value };
}

function err(error) {
  return { ok: false, error };
}

function mapResult(result, fn) {
  return result.ok ? ok(fn(result.value)) : result;
}

function flatMapResult(result, fn) {
  return result.ok ? fn(result.value) : result;
}

function unwrapOr(result, fallback) {
  return result.ok ? result.value : fallback;
}
'''
tests = '''
test('tạo hai nhánh kết quả', () => {
  expect(ok(3)).toEqual({ ok: true, value: 3 });
  expect(err('bad')).toEqual({ ok: false, error: 'bad' });
});
test('map chỉ đổi value của nhánh thành công', () => {
  expect(mapResult(ok(2), (x) => x * 3)).toEqual(ok(6));
});
test('map giữ nguyên nhánh lỗi', () => {
  const failure = err('network');
  expect(mapResult(failure, (x) => x * 2)).toBe(failure);
});
test('flatMap trả Result tiếp theo', () => {
  expect(flatMapResult(ok(2), (x) => ok(String(x)))).toEqual(ok('2'));
});
test('unwrapOr chọn value hoặc fallback', () => {
  expect(unwrapOr(ok('yes'), 'no')).toBe('yes');
  expect(unwrapOr(err('x'), 'no')).toBe('no');
});
'''
hints = ["Phân nhánh dựa trên result.ok.", "Khi lỗi, giữ nguyên object Result để giữ cả kiểu lỗi."]
explanation = "Discriminated union Result<T, E> giúp biểu diễn thành công và lỗi mà không dùng giá trị giả."

