[[questions]]
id = "ts-028"
module = "ts-type-programming"
type = "code"
lang = "javascript"
difficulty = 2
title = "Deep freeze runtime"
prompt = '''
Viết deepFreeze(value) để đệ quy Object.freeze mọi object và array nằm trong cây object, rồi trả lại chính value. Bỏ qua primitive và null. Hàm phải an toàn với tham chiếu vòng, không lặp vô hạn, và không thay đổi cấu trúc dữ liệu.
'''
starter = '''
function deepFreeze(value) {
  return Object.freeze(value);
}
'''
solution = '''
function deepFreeze(value, seen) {
  if (value === null || (typeof value !== 'object' && typeof value !== 'function')) return value;
  const visited = seen || new Set();
  if (visited.has(value)) return value;
  visited.add(value);
  for (const key of Object.keys(value)) deepFreeze(value[key], visited);
  return Object.freeze(value);
}
'''
tests = '''
test('đóng băng object lồng nhau và array', () => {
  const value = { child: { items: [1, 2] } };
  expect(deepFreeze(value)).toBe(value);
  expect(Object.isFrozen(value)).toBe(true);
  expect(Object.isFrozen(value.child)).toBe(true);
  expect(Object.isFrozen(value.child.items)).toBe(true);
});
test('bỏ qua primitive và null', () => {
  expect(deepFreeze(4)).toBe(4);
  expect(deepFreeze(null)).toBeNull();
});
test('xử lý object có tham chiếu vòng', () => {
  const value = {};
  value.self = value;
  expect(deepFreeze(value)).toBe(value);
  expect(Object.isFrozen(value)).toBe(true);
});
test('không thay đổi nội dung object', () => {
  const value = { a: 1, nested: { b: 2 } };
  deepFreeze(value);
  expect(value.nested.b).toBe(2);
});
'''
hints = ["Theo dõi object đã thăm để dừng vòng lặp.", "Freeze các thuộc tính con trước khi freeze object cha."]
explanation = "Readonly<T> chỉ tác động type checker; deep freeze là hành vi runtime riêng."

[[questions]]
id = "ts-029"
module = "ts-type-programming"
type = "code"
lang = "javascript"
difficulty = 2
title = "Pick & omit runtime"
prompt = '''
Viết pick(object, keys) và omit(object, keys):
- Chỉ xét thuộc tính own enumerable dạng string.
- pick trả object mới chỉ có các key được yêu cầu và thật sự có trên object.
- omit trả object mới giữ các key không nằm trong danh sách loại bỏ.
- Không sửa object nguồn và không lấy thuộc tính kế thừa.
'''
starter = '''
function pick(object, keys) { return {}; }
function omit(object, keys) { return {}; }
'''
solution = '''
function pick(object, keys) {
  const result = {};
  for (const key of keys) {
    if (Object.prototype.hasOwnProperty.call(object, key) && Object.prototype.propertyIsEnumerable.call(object, key)) {
      result[key] = object[key];
    }
  }
  return result;
}

function omit(object, keys) {
  const result = {};
  const excluded = new Set(keys);
  for (const key of Object.keys(object)) {
    if (!excluded.has(key)) result[key] = object[key];
  }
  return result;
}
'''
tests = '''
test('pick chỉ chọn key tồn tại', () => {
  expect(pick({ id: 1, name: 'Ada' }, ['name', 'missing'])).toEqual({ name: 'Ada' });
});
test('omit loại key được chỉ định', () => {
  expect(omit({ id: 1, name: 'Ada', secret: 'x' }, ['secret'])).toEqual({ id: 1, name: 'Ada' });
});
test('bỏ qua thuộc tính kế thừa', () => {
  const source = Object.create({ inherited: 2 });
  source.own = 1;
  expect(pick(source, ['inherited', 'own'])).toEqual({ own: 1 });
  expect(omit(source, [])).toEqual({ own: 1 });
});
test('không sửa object nguồn', () => {
  const source = { a: 1, b: 2 };
  pick(source, ['a']);
  omit(source, ['b']);
  expect(source).toEqual({ a: 1, b: 2 });
});
'''
hints = ["Object.keys chỉ liệt kê own enumerable string keys.", "Dùng Set để tra nhanh tập key cần loại trong omit."]
explanation = "Pick<T, K> và Omit<T, K> chỉ biến đổi kiểu; hai helper này tạo object mới ở runtime."

