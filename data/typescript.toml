[[questions]]
id = "ts-038"
module = "ts-project"
type = "code"
lang = "javascript"
difficulty = 3
title = "Validator schema tối giản"
prompt = '''
Triển khai API JavaScript sau để mô phỏng runtime validation:
- schema.string(), schema.number(), schema.optional(inner), schema.array(inner), schema.object(shape)
- parse(schema, value) trả { success: true, data } nếu hợp lệ; nếu sai trả { success: false, error: { issues } }
- Mỗi issue có { path, message }; path là array key/index từ gốc. Message lần lượt là Expected string, Expected number, Expected array, hoặc Expected object.
- number chỉ hợp lệ nếu typeof là number và Number.isFinite(value) đúng. Object từ chối null và array, chỉ trả các key khai báo trong shape. Thiếu field bắt buộc là lỗi tại path của field; optional cho phép undefined và key optional bị thiếu không xuất hiện trong data.
- Array phải kiểm tra từng phần tử và tích lũy mọi lỗi.
'''
starter = '''
const schema = {
  string: () => ({ kind: 'string' }),
  number: () => ({ kind: 'number' }),
  optional: (inner) => ({ kind: 'optional', inner }),
  array: (inner) => ({ kind: 'array', inner }),
  object: (shape) => ({ kind: 'object', shape }),
};

function parse(schemaValue, value) {
  return { success: true, data: value };
}
'''
solution = '''
const schema = {
  string: () => ({ kind: 'string' }),
  number: () => ({ kind: 'number' }),
  optional: (inner) => ({ kind: 'optional', inner }),
  array: (inner) => ({ kind: 'array', inner }),
  object: (shape) => ({ kind: 'object', shape }),
};

function validate(schemaValue, value, path, issues) {
  if (schemaValue.kind === 'optional' && value === undefined) return undefined;
  if (schemaValue.kind === 'string') {
    if (typeof value !== 'string') issues.push({ path: path.slice(), message: 'Expected string' });
    return value;
  }
  if (schemaValue.kind === 'number') {
    if (typeof value !== 'number' || !Number.isFinite(value)) issues.push({ path: path.slice(), message: 'Expected number' });
    return value;
  }
  if (schemaValue.kind === 'array') {
    if (!Array.isArray(value)) {
      issues.push({ path: path.slice(), message: 'Expected array' });
      return value;
    }
    return value.map((item, index) => validate(schemaValue.inner, item, path.concat(index), issues));
  }
  if (schemaValue.kind === 'object') {
    if (value === null || typeof value !== 'object' || Array.isArray(value)) {
      issues.push({ path: path.slice(), message: 'Expected object' });
      return value;
    }
    const output = {};
    for (const key of Object.keys(schemaValue.shape)) {
      const fieldSchema = schemaValue.shape[key];
      if (!Object.prototype.hasOwnProperty.call(value, key) && fieldSchema.kind === 'optional') continue;
      output[key] = validate(fieldSchema, value[key], path.concat(key), issues);
    }
    return output;
  }
  throw new Error('Unknown schema kind');
}

function parse(schemaValue, value) {
  const issues = [];
  const data = validate(schemaValue, value, [], issues);
  if (issues.length > 0) return { success: false, error: { issues } };
  return { success: true, data };
}
'''
tests = '''
const profileSchema = schema.object({
  name: schema.string(),
  age: schema.number(),
  nickname: schema.optional(schema.string()),
  tags: schema.array(schema.string()),
});

test('parse object hợp lệ và bỏ qua field optional bị thiếu', () => {
  expect(parse(profileSchema, { name: 'Ada', age: 36, tags: ['math'] })).toEqual({
    success: true,
    data: { name: 'Ada', age: 36, tags: ['math'] },
  });
});
test('trả path cho lỗi field và phần tử array', () => {
  const result = parse(profileSchema, { name: 8, age: 36, tags: ['ok', false] });
  expect(result.success).toBe(false);
  expect(result.error.issues).toEqual([
    { path: ['name'], message: 'Expected string' },
    { path: ['tags', 1], message: 'Expected string' },
  ]);
});
test('tích lũy nhiều lỗi và báo field bắt buộc bị thiếu', () => {
  const result = parse(profileSchema, { age: Infinity, tags: 'x' });
  expect(result.error.issues).toEqual([
    { path: ['name'], message: 'Expected string' },
    { path: ['age'], message: 'Expected number' },
    { path: ['tags'], message: 'Expected array' },
  ]);
});
test('kiểm tra object lồng nhau và đường dẫn nhiều cấp', () => {
  const nested = schema.object({ user: schema.object({ name: schema.string() }) });
  const result = parse(nested, { user: { name: null } });
  expect(result.error.issues[0]).toEqual({ path: ['user', 'name'], message: 'Expected string' });
});
test('từ chối null và array ở vị trí object', () => {
  expect(parse(schema.object({}), null).error.issues[0]).toEqual({ path: [], message: 'Expected object' });
  expect(parse(schema.object({}), []).error.issues[0].message).toBe('Expected object');
});
