[[questions]]
id = "typescript-dvc02"
module = "typescript-dv-classes"
type = "code"
lang = "javascript"
difficulty = 2
title = "Counter có trạng thái riêng"
prompt = '''
Viết class Counter bằng JavaScript với private field #value:
- constructor(initial = 0) nhận số nguyên không âm, nếu sai thì ném RangeError có message Initial value must be a non-negative integer.
- getter value trả trạng thái hiện tại.
- increment(amount = 1) chỉ nhận số nguyên dương, nếu sai thì ném RangeError có message Increment must be a positive integer; nếu đúng thì cộng vào trạng thái.
- reset() đưa trạng thái về 0.
'''
starter = '''
class Counter {
  constructor(initial = 0) {
    this._value = initial;
  }
  get value() {
    return this._value;
  }
  increment(amount = 1) {
    this._value += amount;
  }
  reset() {
    this._value = 0;
  }
}
'''
solution = '''
class Counter {
  #value;
  constructor(initial = 0) {
    if (!Number.isInteger(initial) || initial < 0) {
      throw new RangeError('Initial value must be a non-negative integer');
    }
    this.#value = initial;
  }
  get value() {
    return this.#value;
  }
  increment(amount = 1) {
    if (!Number.isInteger(amount) || amount <= 0) {
      throw new RangeError('Increment must be a positive integer');
    }
    this.#value += amount;
  }
  reset() {
    this.#value = 0;
  }
}
'''
tests = '''
test('mặc định bắt đầu từ 0', () => {
  expect(new Counter().value).toBe(0);
});
test('nhận giá trị khởi tạo hợp lệ', () => {
  expect(new Counter(4).value).toBe(4);
});
test('cộng số nguyên dương vào trạng thái', () => {
  const counter = new Counter(2);
  counter.increment(3);
  expect(counter.value).toBe(5);
});
test('từ chối giá trị khởi tạo không hợp lệ', () => {
  expect(() => new Counter(-1)).toThrow('Initial value must be a non-negative integer');
  expect(() => new Counter(1.5)).toThrow('Initial value must be a non-negative integer');
});
test('từ chối increment không phải số nguyên dương', () => {
  expect(() => new Counter().increment(0)).toThrow('Increment must be a positive integer');
  expect(() => new Counter().increment(-2)).toThrow('Increment must be a positive integer');
});
test('reset đưa trạng thái về 0', () => {
  const counter = new Counter(8);
  counter.reset();
  expect(counter.value).toBe(0);
});
'''
hints = ["Lưu trạng thái trong #value và chỉ đọc qua getter.", "Kiểm tra Number.isInteger cùng cận dưới trước khi cập nhật."]
explanation = "Private field của JavaScript giữ invariant ở runtime; class cũng gom trạng thái và hành vi liên quan."
sources = ["typescript/docs/handbook/2/classes"]

[[modules]]
id = "typescript-dv-declarations"
title = "Declaration Files & khai báo thư viện"
description = "Đọc, viết và phát hành kiểu cho JavaScript hoặc package chưa có type."
sources = ["typescript/docs/handbook/declaration-files/introduction", "typescript/docs/handbook/declaration-files/by-example", "typescript/docs/handbook/declaration-files/templates", "typescript/docs/handbook/declaration-files/do-s-and-don-ts", "typescript/docs/handbook/declaration-files/publishing", "typescript/docs/handbook/declaration-files/consumption"]
lesson = '''
### Mô tả API runtime mà không viết lại implementation
Declaration file có đuôi .d.ts, cung cấp thông tin kiểu để compiler hiểu JavaScript sẵn có, package bên ngoài hoặc API được phát hành. Các khai báo như declare function, declare class và declare module không tạo implementation JavaScript. Vì thế một khai báo đúng cú pháp nhưng sai với API thật vẫn có thể làm người dùng viết code lỗi mà compiler không phát hiện.

| Nhu cầu | Cách khai báo thường dùng | Phạm vi |
|---|---|---|
| Mô tả package có module | Export các hàm, class hoặc kiểu của module | Caller import từ module |
| Mô tả package JS chưa có type | Ambient module với đúng module specifier | Import tên package đó |
| Mô tả biến global | Khai báo trong script declaration phù hợp | Toàn cục của project |
| Bổ sung API đã có | Module augmentation hoặc declare global | Mở rộng declaration hiện hữu |
| Phát hành type cùng thư viện | Sinh hoặc đóng gói declaration khớp entry point | Người dùng package |

File declaration không có import/export ở top level thường được xem như script và khai báo có thể nằm trong global scope. Khi file có import hoặc export, nó trở thành module; nếu cần bổ sung global từ module, dùng declare global. Module augmentation phải nhắm đúng module mà người dùng import, không tạo implementation mới và không thể thêm tùy ý mọi loại khai báo.

Ví dụ mô tả một thư viện JavaScript không có type:
~~~ts
declare module "legacy-format" {
  export function formatDate(value: Date): string;
}
~~~

Khi phát hành package, declaration cần khớp chính xác tên export, tham số, overload và giá trị trả về trong JavaScript. Cấu hình package và module resolution cũng phải cho compiler tìm thấy declaration ở entry point thực tế. Với JavaScript của chính dự án, có thể dùng tsc declaration emit để sinh type thay vì duy trì bản viết tay.

Lỗi thường gặp là khai báo any quá rộng để dập lỗi, trộn global declaration vào module sai phạm vi, hoặc copy một API tưởng tượng không tồn tại trong runtime. Nên kiểm tra mã nguồn hoặc tài liệu API thật, thử type declaration trong một consumer nhỏ, và cập nhật cùng lúc khi implementation đổi. Declaration không thay cho validation dữ liệu nhận từ mạng hay người dùng.
'''

