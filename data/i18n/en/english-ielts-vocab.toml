[questions.iv-017]
prompt = '''Write **two English sentences** expressing the same idea: "More and more people are losing their jobs because machines are replacing their work." The first sentence uses the word *unemployment*; the second paraphrases it by switching to the adjective *unemployed* or the verb *replace*.'''
explanation = '''Sentence 1 uses the noun *unemployment*; sentence 2 changes the word class (*unemployed*) and uses a linker. Self-check: (1) both sentences share the idea but have different structures; (2) correct word classes; (3) no copying of the prompt's wording; (4) a clear cause–effect link.'''

