[modules.iv-paraphrase-word-formation]
title = "Word families & paraphrasing"
description = "Word families (economy / economic / economical), paraphrasing with synonyms, changing word class and sentence structure; spotting paraphrase in Reading and Listening."
lesson = '''
**Suggested path:** after CEFR B1 → study CEFR B2 + IELTS Grammar + IELTS Vocabulary in parallel → Reading/Listening → Writing → Speaking. This module is the foundation: most IELTS questions do not repeat the words of the text, they *paraphrase* them. Writing/Speaking examiners also score Lexical Resource on your ability to express the same idea in several ways.

### Three main ways to paraphrase
| Method | Original | Paraphrase |
|---|---|---|
| Synonym / equivalent phrase | *increase* | *rise, go up, climb, grow* |
| Change the word class (word formation) | *Many people are unemployed.* | *Unemployment affects many people.* |
| Change the sentence structure | *Young people spend more time online than before.* | *Time spent online by young people has grown.* |

Changing the word class or the structure is usually safer than swapping word by word, because synonyms rarely match 100% in nuance and collocation.

### Common word families
| Noun | Verb | Adjective | Adverb |
|---|---|---|---|
| economy / economics | economise | economic / economical | economically |
| employment / employer / employee | employ | employed / unemployed | — |
| decision | decide | decisive / decided | decisively |
| analysis | analyse | analytical | analytically |
| reliance | rely (on) | reliable / reliant | reliably |
| strength | strengthen | strong | strongly |
| beneficiary / benefit | benefit | beneficial | beneficially |

### Confusing pairs (same root, different meaning)
- **economic** (related to the economy: *economic growth*) vs **economical** (saving money: *an economical car*).
- **historic** (important in history: *a historic victory*) vs **historical** (about the past: *historical records*).
- **sensible** (wise, reasonable) vs **sensitive** (easily affected or upset).
- **affect** (verb: to influence) vs **effect** (noun: a result): *Noise affects sleep* / *Noise has a negative effect on sleep.*
- **rise** (go up by itself, no object) vs **raise** (make something go up, takes an object): *Prices rose* / *The government raised taxes.*

### Paraphrase in Reading / Listening
Question: *The number of students studying abroad has risen sharply.* The passage may say: *There has been a dramatic growth in overseas enrolment.* Matching pairs: *number of students studying abroad* ↔ *overseas enrolment*; *risen sharply* ↔ *dramatic growth*. Look for **chunks of meaning** rather than hunting for identical words.

### Useful phrases for Task 2 / Speaking
- *a growing number of people* instead of *many people*;
- *play a key role in* / *have a significant impact on*;
- *the majority of* / *a minority of*;
- *This is largely due to…*

### Common mistakes made by Vietnamese learners
- Wrong word class: ~~The economic of Vietnam~~ → *The economy of Vietnam*; ~~He is success~~ → *He is successful*.
- Swapping in a synonym but breaking the collocation: ~~make a research~~ → *conduct research*.
- Writing ~~informations, advices, researches~~ (these are uncountable).
- Over-paraphrasing so that the meaning changes: *some* ≠ *most*, *may* ≠ *will*.

### Study tip
For every new word, note its word family and one collocation. When doing Reading, underline the paraphrase pairs between the question and the passage and keep your own table.
'''

[modules.iv-education]
title = "Education"
description = "Lifelong learning, online learning, exams, schools and universities; collocations and phrases for Task 2 / Speaking."
lesson = '''
Education comes up very often in Task 2 (free university, online learning, exams, compulsory subjects) and in Speaking Part 1/3. Master the word groups below so you stop repeating *study* and *school*.

### Core collocations
| Type | Phrase | Example |
|---|---|---|
| V + N | pursue / gain / obtain a degree | *She obtained a degree in nursing.* |
| V + N | sit / take / pass / fail an exam | *Students sit an exam* (AmE: *take*). |
| V + N | acquire / develop / master a skill | *Pupils develop critical thinking skills.* |
| V + N | enrol on / in a course (AmE *enroll in*) | *He enrolled in an evening course.* |
| Adj + N | compulsory / mandatory education | *Education is compulsory until sixteen.* |
| Adj + N | higher / tertiary / vocational education | *Vocational training fits practical careers.* |
| Adj + N | academic performance / achievement | *Class size can affect academic performance.* |
| N + N | tuition fees, student debt, scholarship | *Tuition fees put pressure on families.* |

### Confusing pairs
- **teach** (teach someone / a subject) vs **learn**; **lecturer** (university) vs **teacher** (school).
- **graduate from** a university — not ~~graduate university~~.
- **a course** (a programme of study) vs **a subject** (e.g. maths); **tuition** (teaching / fees for teaching) vs **fee** (a charge in general).
- **cheat** (be dishonest in a test) vs **plagiarise** (copy someone else's writing).
- **homework** is uncountable; say *a piece of homework*, not *~~homeworks~~*.

### Phrases for Task 2
- *Education should equip students with the skills needed in the workplace.*
- *Rote learning (memorising without understanding) fails to encourage independent thinking.*
- *Lifelong learning enables adults to adapt to a changing job market.*
- *Online courses offer flexibility, but they lack face-to-face interaction.*
- *Exams put pressure on students and may encourage memorisation rather than understanding.*

### Phrases for Speaking Part 3
- *I'd say the biggest advantage of studying online is flexibility.*
- *In my experience, group projects teach teamwork better than lectures.*

### Common mistakes
- ~~The education~~ when speaking in general → *Education is important.*
- ~~Study abroad is useful~~ → *Studying abroad is useful.*
- ~~make an exam~~ (which means to write/set an exam) when you mean *do an exam*: use *take / sit an exam*.
- ~~learn knowledge~~ → *gain knowledge*.

### Tip
For an education question, prepare 3 groups of ideas: benefits for learners, social/economic impact, and drawbacks. Attach 2–3 of the collocations above to each group.
'''

[modules.iv-work-economy]
title = "Work & the economy"
description = "Jobs, unemployment, automation, income, consumption; collocations, confusing pairs and phrases for Task 2."
lesson = '''
Work and the economy often appear in questions about remote working, automation taking jobs, income inequality and overconsumption. The vocabulary below helps you speak precisely instead of only using *job* and *money*.

### Core collocations
| Type | Phrase | Example |
|---|---|---|
| V + N | create / generate jobs | *New factories create jobs.* |
| V + N | earn a living / a salary | *She earns a living as a freelancer.* |
| V + N | climb the career ladder | *Many graduates hope to climb the career ladder quickly.* |
| V + N | make a profit / a loss | *The firm made a profit of ten per cent.* |
| Adj + N | full-time / part-time / temporary job | *Temporary jobs offer little security.* |
| Adj + N | job security, work–life balance | *Work–life balance matters more to younger staff.* |
| Adj + N | the cost of living, disposable income | *A rising cost of living reduces disposable income.* |
| N + N | labour market, workforce, unemployment rate | *The unemployment rate fell to five per cent.* |

### Confusing pairs
- **salary** (paid monthly/yearly, usually office staff) vs **wage** (paid hourly/weekly, often manual work); **income** is total earnings.
- **job** (countable) vs **work** (uncountable): *a job* but *some work*, ~~a work~~.
- **earn** (get money by working) vs **win**; **employ** (hire) vs **employee** (the person hired).
- **economic** vs **economical** (see the word-family module); **customer** (buys from a shop or business) vs **consumer** (anyone who buys and uses goods).
- **lend** (give for a time) vs **borrow** (take for a time); **rise** vs **raise**.

### Phrases for Task 2
- *Automation may replace repetitive jobs, yet it also creates demand for new skills.*
- *Remote work gives employees greater flexibility but can blur the boundary between work and home.*
- *The gap between the rich and the poor has widened in recent decades.*
- *Consumer spending drives economic growth.*
- *Governments should invest in retraining programmes for displaced workers.*

### Phrases for Speaking
- *I'd like to work in a field where I can use my creativity.*
- *Nowadays, people tend to switch careers more often than their parents did.*

### Common mistakes
- ~~I have many works~~ → *I have a lot of work.*
- ~~The unemployment people~~ → *unemployed people* (adjective) / *the unemployed*.
- ~~increase the salary~~ when it goes up by itself: *Salaries rise*; *Employers raise salaries*.
- ~~economy growth~~ → *economic growth*.

### Tip
Link each issue to **cause – effect – solution** with collocations: *high unemployment → social unrest → job-creation schemes.*
'''

[modules.iv-technology-media]
title = "Technology & media"
description = "Technology, AI, social media, privacy, fake news; collocations and phrases for Task 2 / Speaking."
lesson = '''
Technology and media are a core Task 2 topic: children and phones, social media, AI in the classroom, data privacy. For IT learners the technical words are easy, but academic collocations are where marks are lost.

### Core collocations
| Type | Phrase | Example |
|---|---|---|
| V + N | rely on / depend on technology | *Many students rely on search engines.* |
| V + N | raise / spread awareness | *Campaigns raise awareness of online scams.* |
| V + N | spread misinformation | *Fake accounts spread misinformation quickly.* |
| V + N | protect / invade privacy | *Some apps invade users' privacy.* |
| Adj + N | cutting-edge / state-of-the-art technology | *Hospitals use cutting-edge technology.* |
| Adj + N | digital literacy, screen time | *Parents limit children's screen time.* |
| Adj + N | online harassment, data breach | *A data breach exposed millions of records.* |
| N + N | social media platform, news outlet, search engine | *News outlets compete for clicks.* |

### Confusing pairs
- **invent** (create something that never existed) vs **discover** (find something that already exists); **innovation** (new ideas/methods) vs **invention** (a new device).
- **download** vs **upload**; **online** (adjective/adverb, no *the* needed).
- **fake news** (uncountable) vs **a hoax** (a single trick); **information** (uncountable).
- **device** (noun: a piece of equipment) vs **devise** (verb: to think up).
- **addicted to** + N/V-ing — *to* is a preposition here.

### Phrases for Task 2
- *Social media has transformed the way people communicate, for better and for worse.*
- *The rise of artificial intelligence raises ethical concerns about bias and accountability.*
- *Governments should regulate how companies collect and store personal data.*
- *People tend to trust headlines without checking their sources.*
- *Technology can bridge the gap between urban and rural schools.*

### Phrases for Speaking
- *I spend quite a lot of time on my phone, mostly for messaging and watching videos.*
- *On the plus side… / On the downside…*

### Common mistakes
- ~~informations~~, ~~softwares~~ → *information*, *software* (uncountable).
- ~~The technology is developing~~ when speaking in general → *Technology is developing rapidly.*
- ~~use the social media~~ → *use social media*.
- ~~depend of~~ → *depend on*.

### Tip
Learn verbs of **impact** as well: *transform, revolutionise, undermine, enhance, facilitate, hinder* — they work for any technology question.
'''

[modules.iv-environment-energy]
title = "Environment & energy"
description = "Climate change, renewable energy, waste, biodiversity; collocations and phrases for Task 2 / Speaking."
lesson = '''
The environment is a classic topic: climate change, pollution, single-use plastic, clean energy, wildlife conservation. Questions often ask *who is responsible* (individuals or governments) and *which solutions work*.

### Core collocations
| Type | Phrase | Example |
|---|---|---|
| V + N | tackle / combat climate change | *Countries must combat climate change together.* |
| V + N | reduce / cut carbon emissions | *Taxes can cut carbon emissions.* |
| V + N | protect / preserve biodiversity | *Reserves preserve biodiversity.* |
| V + N | dispose of waste | *Factories must dispose of waste safely.* |
| Adj + N | renewable energy / fossil fuels | *Solar power is a renewable energy source.* |
| Adj + N | single-use plastic, greenhouse gas | *Single-use plastic pollutes oceans.* |
| Adj + N | endangered species, natural habitat | *Deforestation destroys natural habitats.* |
| N + N | global warming, carbon footprint, recycling scheme | *Flying increases your carbon footprint.* |

### Confusing pairs
- **weather** (day-to-day conditions) vs **climate** (long-term patterns); **climate change** (not ~~climate changing~~).
- **environment** (the natural world, usually with *the*) vs **surroundings** (the area around you).
- **waste** (rubbish / wasting something, uncountable) vs **rubbish** / **litter**; **pollute** (verb) vs **pollution** (noun, uncountable).
- **endangered** (at risk of dying out) vs **extinct** (already died out).
- **lose** vs **loose**; **affect** vs **effect** (*effects on the environment*).

### Phrases for Task 2
- *Individuals should reduce their carbon footprint, but real change requires government action.*
- *Switching to renewable energy is essential to curb greenhouse gas emissions.*
- *Heavy fines would deter companies from polluting rivers.*
- *Recycling schemes are only effective if people sort waste correctly.*
- *If current trends continue, many species will face extinction.*

### Phrases for Speaking
- *Where I live, air pollution is a serious problem, especially during rush hour.*
- *I try to be eco-friendly by bringing my own bag.*

### Common mistakes
- ~~the global warming~~ → *global warming* (no article).
- ~~pollutions~~ → *pollution* is usually uncountable (or *types of pollution*).
- ~~protect from the nature~~ → *protect nature*; ~~do harm to environment~~ → *harm the environment*.
- ~~the fossil fuel~~ → *fossil fuels* (plural).

### Tip
Cause–effect chains in this topic are fairly fixed: *deforestation → loss of habitat → declining biodiversity*. Learn them as chains so you can write body paragraphs quickly.
'''

[modules.iv-health-lifestyle]
title = "Health & lifestyle"
description = "Health, diet, sport, public health, ageing populations; collocations and phrases for Task 2 / Speaking."
lesson = '''
Common questions: childhood obesity, fast food, the elderly, health-care costs, physical activity. Use precise words such as *obesity, sedentary lifestyle, life expectancy* instead of *fat, lazy, old*.

### Core collocations
| Type | Phrase | Example |
|---|---|---|
| V + N | maintain / adopt a healthy lifestyle | *Adopting a healthy lifestyle lowers risk.* |
| V + N | suffer from / develop a disease | *Many adults suffer from stress.* |
| V + N | take regular exercise | *Take regular exercise to stay fit.* |
| V + N | tackle obesity | *Schools can help tackle obesity.* |
| Adj + N | balanced diet, sedentary lifestyle | *A sedentary lifestyle harms the heart.* |
| Adj + N | processed food, life expectancy | *Life expectancy has risen worldwide.* |
| Adj + N | public health, mental health | *Public health campaigns reduce smoking.* |
| N + N | health care system, ageing population | *An ageing population strains health care.* |

### Confusing pairs
- **healthy** (in good health / good for you) vs **healthful** (good for your health, rare); **health** (noun).
- **sick** (unwell, general) / **ill** (unwell, after a verb) / **disease** (a specific illness); **a sick person** but *she is ill*.
- **diet** (what you usually eat) vs **go on a diet** (eat less to lose weight); **nutrition** (the process of getting nourishment).
- **cure** (make someone well) vs **treat** (give medical care); **prevent** (stop it happening).
- **elderly** (old, polite) — use *the elderly*, not ~~elders~~ in this sense.

### Phrases for Task 2
- *Governments should encourage people to take regular exercise by building more sports facilities.*
- *Fast food is high in fat and sugar, which contributes to obesity.*
- *An ageing population puts pressure on pension systems and health care.*
- *Prevention is better than cure, so public health campaigns deserve more funding.*
- *Mental health problems are often overlooked.*

### Phrases for Speaking
- *I try to eat a balanced diet, although I do sometimes grab fast food.*
- *I'm not much of a gym person, but I enjoy cycling.*

### Common mistakes
- ~~do sport~~ in general → *play sport(s)* / *do exercise* / *take exercise*.
- ~~The health of people is~~ is possible, but *people's health* is more natural.
- ~~advices~~, ~~medicines for health~~ → *advice* (uncountable).
- ~~suffer a disease~~ → *suffer from a disease*.

### Tip
For a "prevention or cure" question, prepare the pair *prevention* ↔ *treatment* and a cost example (*cost the state less in the long term*).
'''

[modules.iv-society-urban]
title = "Society & cities"
description = "Urbanisation, housing, transport, crime and the law; collocations and phrases for Task 2 / Speaking."
lesson = '''
Cities, housing, public transport and crime form a familiar group of social questions. You need vocabulary to describe *problems* (congestion, overcrowding) and *policy solutions* (invest in, impose, enforce).

### Core collocations
| Type | Phrase | Example |
|---|---|---|
| V + N | ease / reduce traffic congestion | *Metro lines ease traffic congestion.* |
| V + N | commit a crime | *Young offenders commit minor crimes.* |
| V + N | impose a penalty / a fine | *Courts impose heavy fines.* |
| V + N | enforce a law | *Police enforce the law.* |
| Adj + N | affordable housing, public transport | *Affordable housing is scarce.* |
| Adj + N | rural-to-urban migration, urban sprawl | *Urban sprawl swallows farmland.* |
| Adj + N | juvenile delinquency, community service | *Community service can replace prison.* |
| N + N | crime rate, living standards, city centre | *The crime rate has fallen.* |

### Confusing pairs
- **crime** (crime in general / a type of offence) vs **criminal** (the offender, or an adjective); *a crime* but *crime is rising*.
- **steal** (take a *thing*) vs **rob** (take from a *person/place*): *steal a phone*, *rob a bank*.
- **the police** always takes a plural verb: *The police are…*
- **rent** (pay/charge for using property) vs **lease**; **tenant** vs **landlord**.
- **commute** (travel to work daily) vs **travel**; **traffic** (uncountable).

### Phrases for Task 2
- *Rapid urbanisation puts enormous pressure on housing and public services.*
- *Investing in public transport is more effective than building more roads.*
- *Stricter punishments may deter crime, but addressing poverty tackles its root causes.*
- *Many young people move to cities in search of better job prospects.*
- *Community policing builds trust between residents and the authorities.*

### Phrases for Speaking
- *My hometown has changed a lot; it's become much busier and more crowded.*
- *The main drawback of living in a big city is the cost of housing.*

### Common mistakes
- ~~There are many traffics~~ → *There is heavy traffic.*
- ~~The police is~~ → *The police are*.
- ~~in the city centre there have~~ → *there are*.
- ~~make a crime~~ → *commit a crime*.

### Tip
Remember two policy verbs: **impose** (a penalty or tax) and **introduce** (a new law). Try writing 2 solution sentences for each social problem.
'''

[modules.iv-globalisation-culture]
title = "Globalisation & culture"
description = "Globalisation, tourism, culture, language, migration; collocations and phrases for Task 2 / Speaking."
lesson = '''
This topic revolves around loss of cultural identity, mass tourism, global languages and migration. Extra marks come from using precise opposite pairs (*preserve* ↔ *erode*, *immigrant* ↔ *emigrant*).

### Core collocations
| Type | Phrase | Example |
|---|---|---|
| V + N | preserve / erode cultural identity | *Festivals preserve cultural identity.* |
| V + N | promote / boost tourism | *Heritage sites boost tourism.* |
| V + N | broaden / widen one's horizons | *Travel broadens your horizons.* |
| V + N | integrate into society | *Newcomers integrate into society faster with language support.* |
| Adj + N | cultural heritage, traditional customs | *Traditional customs are fading.* |
| Adj + N | mass tourism, cultural diversity | *Mass tourism damages fragile sites.* |
| Adj + N | foreign investment, global market | *Foreign investment creates jobs.* |
| N + N | language barrier, brain drain, culture shock | *Culture shock is common among new students.* |

### Confusing pairs
- **immigrant** (someone who comes into a country) / **emigrant** (someone who leaves) / **migrant** (general); **immigrate to** / **emigrate from**.
- **foreigner** (can sound distant) vs **expatriate / expat** (someone living abroad); **tourist** vs **traveller**.
- **custom** (a tradition in a society) vs **habit** (a personal routine); **culture** vs **civilisation**.
- **globalisation** (noun) vs **globalised** (adjective); **native language** / **mother tongue**.
- **trip** (a short visit) / **journey** (the act of travelling from A to B) / **travel** (uncountable).

### Phrases for Task 2
- *Globalisation has made goods cheaper, yet it has also threatened local industries.*
- *Younger generations are drifting away from traditional customs.*
- *English acts as a lingua franca in international business.*
- *Countries should protect their cultural heritage while remaining open to outside influences.*
- *Migration can fill labour shortages but may strain public services.*

### Phrases for Speaking
- *If I could visit anywhere, I'd love to experience a completely different culture.*
- *I'd say my country is quite proud of its traditions.*

### Common mistakes
- ~~travel abroad is~~ → *travelling abroad is*.
- ~~informations about the culture~~ → *information*.
- ~~immigrate from~~ when you mean coming in: *immigrate to*; *emigrate from*.
- ~~the tourists number~~ → *the number of tourists*.

### Tip
Culture questions usually have two sides: **economic benefits** (tourism revenue) and **cultural costs** (loss of identity). Prepare 2 sentences for each side.
'''

[modules.iv-government-science]
title = "Public policy & science"
description = "Public policy, taxes, budgets, scientific research, space exploration; collocations and phrases for Task 2."
lesson = '''
This group covers "who should pay" questions (government or individuals), taxes, research funding and space exploration. The vocabulary is fairly formal — just right for lifting Lexical Resource to band 6.5–7.

### Core collocations
| Type | Phrase | Example |
|---|---|---|
| V + N | allocate / spend funding / a budget | *The state allocates funding to schools.* |
| V + N | levy / impose / raise taxes | *Governments levy taxes on tobacco.* |
| V + N | implement a policy / a scheme | *The city implemented a recycling scheme.* |
| V + N | conduct / carry out research | *Scientists conduct research.* |
| Adj + N | public spending, government subsidy | *A subsidy lowers the cost of solar panels.* |
| Adj + N | scientific breakthrough, ethical issues | *The breakthrough raised ethical issues.* |
| Adj + N | long-term benefits, short-term gains | *Research brings long-term benefits.* |
| N + N | tax revenue, research funding, space exploration | *Tax revenue pays for hospitals.* |

### Confusing pairs
- **research** (uncountable) vs **study / experiment** (countable): *a study*, ~~a research~~.
- **invent / discover / explore**; **experiment** (a scientific test) vs **experience** (what you have lived through / know-how).
- **tax** (compulsory payment to the state) vs **fee / fine** (a charge / a penalty); **budget** (planned spending) vs **funds**.
- **law** (law in general) vs **regulation** (a specific rule); **government** vs **authorities**.
- **theory** vs **hypothesis** (an idea to be tested); **evidence** (uncountable).

### Phrases for Task 2
- *Public money should be spent on basic needs such as health care before space exploration.*
- *Taxing sugary drinks could discourage unhealthy consumption.*
- *Scientific research often takes decades to produce practical benefits.*
- *Governments should offer subsidies to encourage private companies to invest in clean technology.*
- *Critics argue that space programmes divert resources from urgent problems on Earth.*

### Phrases for Speaking
- *I think the government should invest more in public libraries.*
- *To be honest, I'm not sure it's worth spending that much on space missions.*

### Common mistakes
- ~~do a research~~ → *conduct research* / *do some research*.
- ~~The government should to~~ → *should + bare infinitive*.
- ~~spend for education~~ → *spend money on education*.
- ~~pay the tax to the government~~ is acceptable, but people usually say *pay taxes*.

### Tip
For "government or individuals" questions, prepare a frame: *responsibility lies with… / it is the government's role to… / individuals also have a duty to…*
'''

[modules.iv-academic-linking]
title = "Linking words & academic vocabulary"
description = "Academic linking words by function (addition, contrast, cause and effect, examples, conclusion) and general academic vocabulary: analyse, significant, factor, ..."
lesson = '''
Linking words make a paragraph coherent (Coherence & Cohesion), but using them wrongly or too often lowers your score. Choose linkers by **function** and pay attention to their **position and punctuation**.

### Linking words by function
| Function | Words / phrases | Grammar note | Example |
|---|---|---|---|
| Addition | in addition, moreover, furthermore | start of sentence, followed by a comma | *In addition, rents are rising.* |
| Contrast | however, nevertheless, on the other hand | start of sentence, comma | *However, costs are high.* |
| Concession | although, while, even though | followed by a clause, **do not** add *but* | *Although it is cheap, it is unsafe.* |
| Result | therefore, as a result, consequently | start of sentence, comma | *As a result, prices fell.* |
| Reason | because, since, due to, owing to | *due to / owing to* + N | *Owing to the storm, flights stopped.* |
| Example | for instance, for example, such as | *such as* + N, not at the start of a sentence | *Cities such as Hanoi are crowded.* |
| Conclusion | in conclusion, to sum up, overall | start of the final paragraph | *Overall, the benefits outweigh the costs.* |

### General academic vocabulary
| Word | Meaning / use | Example |
|---|---|---|
| analyse (BrE) | examine in detail | *Researchers analyse the data.* |
| significant | large or important | *a significant increase* |
| factor | something that influences a result | *a key factor in success* |
| contribute to | help cause | *Diet contributes to health.* |
| outweigh | be greater than | *Benefits outweigh drawbacks.* |
| consequence | a (usually bad) result | *serious consequences* |
| undermine | weaken gradually | *Fake news undermines trust.* |
| demonstrate / indicate | show | *The data indicate a decline.* |

### Confusing pairs
- **although / though / despite / in spite of**: *Although it rained* (clause) vs *Despite the rain* (noun).
- **however** (starts a new sentence, followed by a comma) vs **but** (joins two clauses; do not put a comma before *however* to join clauses).
- **whereas / while** show contrast between two halves of a sentence; **in contrast** starts a sentence.
- **lead to** (cause) vs **result from** (be caused by — the opposite direction).

### Common mistakes
- ~~Although it is expensive, but people buy it~~ → remove *but*.
- ~~Despite of~~ → *despite* / *in spite of*.
- ~~Firstly, Secondly, Thirdly~~ repeated mechanically in every paragraph.
- ~~For example, such as~~ used side by side.
- A comma joining two independent sentences (*comma splice*): ~~It is cheap, however it is unsafe.~~ → use a semicolon or a full stop.

### Tip
Each Task 2 paragraph needs only 2–3 carefully chosen linkers; the rest comes from **reference** (*this trend, such measures*). Don't stuff *moreover/furthermore* into every sentence.
'''

[questions.iv-001]
explanation = '''The subject must be a noun: *Unemployment*. *Unemployed* is an adjective (describing people without work); the other two options do not exist.'''

[questions.iv-002]
explanation = '''*rise* ≈ *increase*. *reduced* and *dropped* mean "went down"; *remained* means "stayed the same".'''

[questions.iv-003]
prompt = '''Fill in the correct form of the word in brackets: Vietnam's {{blank}} (economy) has grown quickly in recent years.'''
explanation = '''After the possessive *Vietnam's* you need a noun: *economy*. Don't confuse it with the adjective *economic*.'''

[questions.iv-004]
explanation = '''*information* is an uncountable noun: no *-s*, no *a/many*; use *a lot of / much*.'''

[questions.iv-005]
explanation = '''*economical* = saving money, not wasteful. *economic* = related to the economy (*economic growth*). This word-family pair is very often confused.'''

[questions.iv-006]
explanation = '''*cannot find work* → *unemployment*: the verb phrase is turned into a noun (word formation). The other sentences change the meaning.'''

[questions.iv-007]
explanation = '''*number of students studying abroad* ↔ *overseas enrolment*; *risen sharply* ↔ *dramatic growth*. Look for phrases with the same meaning instead of waiting for identical words.'''

