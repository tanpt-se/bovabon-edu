prompt = '''Fill in one suitable word: Heavy traffic can {{blank}} (affect/effect) people's health.'''
explanation = '''A *verb* is needed: *affect* (to influence). *effect* is a noun (*have an effect on*).'''

[questions.iv-009]
prompt = '''Choose **all** pairs that are good paraphrases (the meaning stays the same).'''
explanation = '''The first two pairs keep the meaning. *some* ≠ *most* and *may* ≠ *will* (different degrees of certainty).'''

[questions.iv-010]
prompt = '''Fill in the correct form: Many people are {{blank}} (rely) on smartphones for daily tasks. Which form of *rely* is correct?'''
