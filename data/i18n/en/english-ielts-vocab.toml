explanation = '''Structure change: *Young people spend more time online* → *Time spent online by young people has grown* (nominalisation). The other options reverse or change the meaning.'''

[questions.iv-014]
explanation = '''*historic* = important in history (*a historic moment*). *historical* = about or belonging to the past (*historical records*). Option 4 is the wrong word class.'''

[questions.iv-015]
prompt = '''Choose **all** sentences that correctly paraphrase: "Pollution affects children's health."'''
