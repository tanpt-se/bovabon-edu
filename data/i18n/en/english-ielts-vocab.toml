explanation = '''*due to / owing to + N*: because of. *in order to* expresses purpose.'''

[questions.iv-162]
explanation = '''*whereas / while* contrast two halves within one sentence.'''

[questions.iv-163]
prompt = '''Fill in one word: The benefits of online learning {{blank}} the drawbacks, so it should be encouraged. (more important than)'''
explanation = '''*outweigh* = be greater or more important than.'''

[questions.iv-164]
prompt = '''Choose **all** sentences that use linking words correctly.'''
explanation = '''Sentence 3 places two linkers with opposite functions side by side, which makes no sense.'''

[questions.iv-165]
prompt = '''Fill in one word: The data {{blank}} a steady decline in sales. (show; formal)'''
explanation = '''*indicate / show / suggest / reveal / demonstrate* are all formal.'''

[questions.iv-166]
explanation = '''*lead to* is followed by the result. Option 3 reverses cause and effect; sentence 2 is illogical.'''

[questions.iv-167]
explanation = '''*This trend* uses reference instead of repetition, creating natural cohesion.'''

[questions.iv-168]
explanation = '''Use a semicolon or full stop before *nevertheless*; a single comma joining two independent clauses is a comma splice.'''

[questions.iv-169]
prompt = '''Choose **all** sentences that use academic words correctly.'''
explanation = '''Sentence 3 uses the wrong word class: the verb is *analyse*; *analysis* is the noun.'''

[questions.iv-170]
prompt = '''Fill in two words: Rents are rising; {{blank}}, many students cannot afford a flat. Despite this, demand {{blank}} high. (result; stays at that level)'''
explanation = '''A result linker *consequently / as a result / therefore* and *demand remains high*.'''

[questions.iv-171]
prompt = '''Write **2–3 English sentences** using one contrast linker and one cause–effect linker to discuss the cost of studying abroad. Use at least two of: *however / although / as a result / therefore / consequently*.'''
explanation = '''Contrast (*however*) and cause–effect (*so*). Checklist: (1) a semicolon before *however*; (2) no *although … but*; (3) subject–verb agreement; (4) use *tuition fees*.'''
