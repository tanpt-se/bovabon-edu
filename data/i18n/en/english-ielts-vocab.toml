explanation = '''*graduate from + institution*: to finish a degree there. Don't say ~~graduate university~~.'''

[questions.iv-019]
explanation = '''*homework* is uncountable: no *-s*; use *a lot of / some*, and count it with *a piece of homework*.'''

[questions.iv-020]
explanation = '''*take / sit an exam*: to do an exam. Don't use ~~make an exam~~ (which means to write/set one).'''

[questions.iv-021]
explanation = '''*lecturer* = a university teacher. A *pupil* is a young school student, a *scholarship* is a study award, *tuition* is teaching or the fee for it.'''

[questions.iv-022]
