[modules.api-http]
title = "HTTP Fundamentals"
description = "Methods, safety and idempotency, status codes, key headers, HTTP/2, and HTTP/3."
lesson = '''
### Methods
| Method | Safe | Idempotent | Use |
|---|---|---|---|
| GET | ✓ | ✓ | Read |
| HEAD | ✓ | ✓ | Like GET, but without a body |
| PUT | ✗ | ✓ | Replace the whole resource |
| DELETE | ✗ | ✓ | Delete |
| POST | ✗ | ✗ | Create or perform an action |
| PATCH | ✗ | Not guaranteed | Partially update |

### Status codes
- **2xx**: 200 OK, 201 Created (with a `Location` header), 204 No Content
- **3xx**: 301/308 permanent redirect, 302/307 temporary redirect, **304 Not Modified**
- **4xx**: 400 Bad Request, **401** unauthenticated, **403** forbidden, 404, 405, 409 Conflict, 422 invalid data, **429** Too Many Requests
- **5xx**: 500, 502 Bad Gateway, 503 Service Unavailable, 504 Gateway Timeout

HTTP/2 multiplexes multiple requests over one connection and compresses headers with HPACK. HTTP/3 runs over **QUIC** (UDP), avoiding TCP head-of-line blocking.
'''

[questions.api-001]
prompt = "A user is signed in but does not have permission to delete someone else's post. Which status should the API return?"
explanation = "401 means the user is unauthenticated or the token is invalid. 403 means the user is known but not allowed to perform the action. (A server may return 404 to avoid revealing that the resource exists.)"

[questions.api-002]
prompt = "Which method is **idempotent** but **not safe**?"
explanation = "Repeated PUT requests have the same effect as one request, but PUT changes server state, so it is not safe."

[questions.api-003]
prompt = "After `POST /orders` succeeds, the standard response should be:"
options = ["200 with an empty body", "201 Created, a `Location: /orders/123` header, and usually the newly created resource in the body", "204 No Content", "302 redirect"]
explanation = "`Location` points to the newly created resource."

[questions.api-004]
prompt = "What is the difference between 502 Bad Gateway and 504 Gateway Timeout?"
options = ["They mean the same thing", "502: the proxy/gateway received an **invalid response** from the upstream; 504: the upstream **did not respond in time**", "502 is a client error", "504 is a DNS error"]
explanation = "These errors commonly occur when Nginx or a load balancer sits in front of an application server."

[questions.api-005]
prompt = "What are the advantages of HTTP/2 over HTTP/1.1?"
options = ["Multiplex multiple requests in parallel over one TCP connection", "Header compression (HPACK)", "Binary format (binary framing)", "Runs over UDP", "Does not require TLS in every browser"]
explanation = "Only HTTP/3 runs over QUIC (UDP). Browsers support HTTP/2 over TLS."

[questions.api-006]
prompt = '''
Complete the status code table:

- Too many requests: **{{blank}}** Too Many Requests
- Version conflict / duplicate data: **{{blank}}** Conflict
- Resource unchanged after revalidation: **{{blank}}** Not Modified
'''
explanation = "Knowing common status codes helps clients respond correctly (retry, refetch, or display an error)."

[modules.api-rest]
title = "REST API Design"
description = "Resources and URLs, versioning, pagination, filtering and sorting, idempotency keys, and error formats."
lesson = '''
### Principles
- Use **plural nouns** for resource URLs: `GET /users/42/orders`, not `/getUserOrders`.
- Use methods for actions and status codes with the right semantics.
- **Versioning**: use `/v1/...` or a header; avoid breaking existing clients (add fields only).
- **Pagination**: offset/limit is simple, but can be slow and shift as data changes; **cursor** pagination is stable and efficient for large datasets.
- Filter and sort with query parameters, for example `?status=paid&sort=-created_at`.
- Use an **Idempotency-Key** for important POST requests such as payments: the server stores the result by key, so a retry returns the same result.
- Use a consistent error format, such as **RFC 9457 Problem Details** (`application/problem+json`: `type`, `title`, `status`, `detail`).
- Document the API with **OpenAPI**.
'''

[questions.api-020]
prompt = "Which URL follows REST conventions for retrieving the orders of user 42?"
options = ["`GET /getOrders?userId=42`", "`GET /users/42/orders`", "`POST /orders/list`", "`GET /user/42/getOrders`"]
explanation = "Represent resources with plural nouns and express their relationships with nested paths (no more than two levels deep)."

[questions.api-021]
prompt = "Why is cursor-based pagination better than offset/limit for a large, frequently changing feed?"
options = ["Cursors are easier to implement", "A large offset makes the database scan/skip many rows (slow) and can **duplicate or omit** items when data is inserted/deleted between requests; a cursor uses a position (e.g. the last `id`/`created_at`) for stable pagination and can use an index", "A cursor lets you jump to any page", "Offset pagination does not support sorting"]
explanation = "Trade-off: cursor pagination does not support arbitrary page jumps."

[questions.api-022]
prompt = "What is the purpose of the `Idempotency-Key` header in `POST /payments`?"
options = ["Authenticate the user", "Let the client retry safely: the server remembers the result for the key and does not create a duplicate payment", "Compress the request", "Choose the API version"]
explanation = "Stripe, Adyen, and other providers use this pattern."

[questions.api-023]
prompt = "Which changes are **breaking changes** for existing API clients?"
options = ["Adding a new field to the response", "Renaming `user_name` to `username`", "Making a previously optional parameter required", "Adding a new endpoint", "Changing the type of `id` from a number to a string"]
explanation = "Backward-compatible changes include adding fields, endpoints, or optional parameters."

[questions.api-024]
prompt = "Design a consistent error format for a REST API. Name its components and explain why they are useful."
keywords = [["status", "http status"], ["code", "error code", "type"], ["message", "detail", "title"], ["field", "errors", "validation details", "field-level errors"], ["request id", "trace", "correlation"], ["problem details", "rfc 9457", "rfc 7807"]]
model_answer = '''
Use the **RFC 9457 Problem Details** standard (`application/problem+json`):

```json
{
  "type": "https://api.bovabon.edu/errors/validation",
  "title": "Invalid data",
  "status": 422,
  "detail": "Email already exists",
  "code": "EMAIL_TAKEN",
  "errors": [{ "field": "email", "message": "is already in use" }],
  "requestId": "req_8f2a…"
}
```
- **status** matches the HTTP status; **code/type** stay stable so clients can handle errors programmatically without relying on message text.
- **title/detail** are reader-friendly and can be localized.
- **Field-level errors** help with form validation.
- **requestId/traceId** make log searches easier. Do not expose stack traces or internal information.
'''
explanation = "A consistent format lets the frontend use one shared error handler."

[questions.api-025]
title = "Cursor Pagination"
prompt = '''
Implement `paginate(items, { limit = 10, cursor = null })` for an `items` array **already sorted by ascending `id`** (where `id` is a number):
- `cursor` is the **base64** encoding of JSON `{"id": <last id on the previous page>}` (use `btoa`/`atob`).
- Return `{ data, nextCursor }`: `data` contains at most `limit` items with `id > id in cursor`; `nextCursor` is a cursor for the last item in `data` if **more items remain**, otherwise `null`.
- An invalid cursor must `throw new Error('invalid cursor')`.
- Clamp `limit` to `[1, 100]`.
'''
hints = ["Filter with `id > after`, then use `slice(0, limit)`.", "More items remain when the number of items after the cursor is greater than `limit`."]
explanation = "In SQL, use `WHERE id > $after ORDER BY id LIMIT $n + 1` (fetch one extra row to tell whether another page exists)."

[questions.api-026]
title = "Idempotency-Key Middleware"
prompt = '''
Implement `withIdempotency(handler)` to return an `async (req) => response` function:
- `req = { method, headers, body }`; header names are case-insensitive: `idempotency-key`.
- Apply it only to `POST` requests with a key; pass other requests directly to `handler`.
- For the first request with a key, call `handler(req)`, store `{ bodyHash: JSON.stringify(req.body), response }`, and return the response.
- A retry with the same key and body must return the **stored response** without calling the handler again.
- The same key with a **different body** must return `{ status: 422, body: { error: 'idempotency key reused with different payload' } }`.
- If the first request for that key is **still processing**, return `{ status: 409, body: { error: 'request in progress' } }`.
- If the handler throws, do **not** store the key, so the client can retry.
'''
hints = ["Set `pending: true` before `await handler` to detect concurrent requests.", "Normalize header names to lowercase."]
explanation = "In production, store keys in Redis or a database with a TTL (e.g. 24 hours) and an atomic lock such as `SET NX`."

[modules.api-caching]
title = "Caching & Performance"
description = "Cache-Control, ETag/If-None-Match, CDNs, compression, and rate-limit headers."
lesson = '''
### Key ideas
- `Cache-Control: max-age=60` (browser), `s-maxage` (CDN/shared cache), `private` (browser only), `no-cache` (must revalidate), `no-store` (do not store), `stale-while-revalidate`.
- **ETag** with `If-None-Match` → the server returns **304** with no body when the resource is unchanged. `Last-Modified` with `If-Modified-Since` works similarly.
- Strong vs. weak ETags (`W/"..."`).
- `Vary: Accept-Encoding, Authorization` tells caches to distinguish variants.
- Compress with `br`/`gzip` using `Accept-Encoding`/`Content-Encoding`.
- For rate limiting, return 429 with `Retry-After`.
'''

[questions.api-040]
prompt = "The client sends `If-None-Match: \"abc\"`, and the current ETag on the server is still `\"abc\"`. What does the server return?"
options = ["200 with the full body", "304 Not Modified, with no body", "204 No Content", "412 Precondition Failed"]
explanation = "This saves bandwidth; the client uses its cached copy. 412 is used with `If-Match` during updates (optimistic locking)."

[questions.api-041]
prompt = "A response contains private user data (`/me`). Which `Cache-Control` value should it use so the CDN does **not** cache it?"
options = ["`public, max-age=3600`", "`private, max-age=60` (or `no-store` for sensitive data)", "`s-maxage=3600`", "`immutable`"]
explanation = "`private` allows caching only in that user's browser."

[questions.api-042]
prompt = '''
Cache a hashed asset filename (`app.3f9a1c.js`) forever:

```
Cache-Control: public, max-age={{blank}}, {{blank}}
```
'''
explanation = "One year; `immutable` tells the browser it does not need to revalidate the asset, even on reload."

[questions.api-043]
title = "Conditional GET with ETag"
prompt = '''
Implement:
1. `etagOf(body)` — generate a **strong ETag** in the form `"<hash>"` (including the quotation marks) from `JSON.stringify(body)` using the 32-bit FNV-1a hash, formatted as 8 hexadecimal characters and zero-padded:
   `h = 0x811c9dc5`; for each character code `c`: `h ^= c; h = Math.imul(h, 0x01000193) >>> 0`
2. `conditionalGet(req, body)` returns a response:
   - If the case-insensitive `If-None-Match` header contains the current ETag (comma-separated list, weak form `W/"..."` accepted, or `*`), return `{ status: 304, headers: { ETag } }`.
   - Otherwise return `{ status: 200, headers: { ETag, 'Cache-Control': 'no-cache' }, body }`.
'''
hints = ["`Math.imul` multiplies as a 32-bit integer; `>>> 0` converts the result to an unsigned number.", "Remove the `W/` prefix before comparing (GET uses weak comparison)."]
explanation = "Express generates a weak ETag for `res.send`; for a large API, consider deriving the ETag from a version or `updated_at` value instead of hashing the entire body."

[modules.api-auth]
title = "Authentication, Authorization & Security"
description = "Session cookies vs. tokens, JWT, OAuth 2.0/OIDC, PKCE, CORS, CSRF, and the OWASP API Top 10."
lesson = '''
### Key ideas
- **Authentication** (who you are) ≠ **Authorization** (what you are allowed to do).
- **Session cookie**: the server stores the session; use cookie attributes `HttpOnly; Secure; SameSite`. Sessions are easy to revoke.
- **JWT access token** with a short lifetime + **refresh token** (rotate it and store it securely). JWTs are hard to revoke before they expire.
- **OAuth 2.0** delegates access; use **Authorization Code + PKCE** for SPAs/mobile apps and Client Credentials for service-to-service access. **OIDC** adds an `id_token` for authentication.
- **CORS** is enforced by browsers; a preflight `OPTIONS` request is sent for requests with certain headers or methods.
- **OWASP API Top 10**: BOLA (Broken Object Level Authorization — always check resource ownership!), broken authentication, excessive data exposure, missing rate limits, SSRF, and more.
- Always use HTTPS with `Strict-Transport-Security`.
'''

[questions.api-060]
prompt = "The currently recommended OAuth 2.0 flow for SPAs and mobile apps is:"
explanation = "Implicit and Password grants are discouraged (OAuth 2.1). Client Credentials is for machine-to-machine use."

[questions.api-061]
prompt = "`GET /api/invoices/1002` returns someone else's invoice just because the ID was changed. What vulnerability is this?"
explanation = "This is vulnerability #1 in the OWASP API Security Top 10. Always verify that a resource belongs to the current user (for example, `WHERE id = ? AND owner_id = ?`)."

[questions.api-062]
prompt = "Which request makes a browser send a preflight `OPTIONS` request before calling an API on another origin?"
options = ["A `GET` request with no custom headers", "A `POST` with `Content-Type: application/json` or an `Authorization` header", "`<img src>`", "A form `POST` with `application/x-www-form-urlencoded` and no additional headers"]
explanation = "A “simple request” is limited to GET/HEAD/POST with certain content types and headers."

[questions.api-063]
prompt = "Which cookie attributes help protect a session cookie?"
options = ["`HttpOnly`", "`Secure`", "`SameSite=Lax`", "`Domain=.com`", "A reasonable `Max-Age`"]
explanation = "An overly broad `Domain` causes the cookie to be sent to more subdomains than necessary."

[questions.api-064]
prompt = '''
Send an access token using the OAuth 2.0 Bearer standard:

```
{{blank}}: Bearer eyJhbGciOi...
```
'''
explanation = "RFC 6750. Do not put tokens in a query string, where they may be logged."

[questions.api-065]
prompt = "Compare authentication with a **session cookie** and a **JWT (stateless token)**."
keywords = [["stateless", "no server-side session", "without server-side state"], ["revoke", "revocation", "logout", "blacklist"], ["cookie", "session cookie"], ["refresh", "refresh token"], ["scale", "scaling", "multiple servers", "microservices"], ["xss", "csrf", "httponly"]]
model_answer = '''
- **Session cookie**: the server stores the session in a database or Redis, while the client keeps the session ID in an `HttpOnly` cookie. Sessions are easy to **revoke** by deleting them, but servers need a shared store when **scaling** across multiple instances. Protect against **CSRF** with SameSite and/or a CSRF token.
- **JWT**: **stateless**; a server only needs to verify the signature, which can suit microservices, mobile apps, and third-party APIs. The drawback is that it is hard to **revoke** before expiry. Use short-lived access tokens with rotating **refresh tokens** (which can be stored server-side for revocation). The payload is readable, and storing tokens in localStorage can expose them to **XSS**.
- For a web app on one domain, a session cookie is often the simplest and safest choice; APIs serving many kinds of clients may use tokens.
'''
explanation = "There is no universally best choice; understanding the trade-offs is what matters."

[questions.api-066]
title = "CORS Validation"
prompt = '''
Implement `corsHeaders(req, { origins, methods, credentials })` to return response headers (or `{}` when access is not allowed):
- `req = { method, headers }` (lowercase headers: `origin`, `access-control-request-method`).
- If the origin is not in `origins` (an array; `'*'` means any origin), return `{}`.
- For an allowed origin, always include `Access-Control-Allow-Origin` and `Vary: 'Origin'`.
  - If `credentials` is true, use the **origin itself** as the value (never `*`) and add `Access-Control-Allow-Credentials: 'true'`.
  - If `credentials` is false and `origins` contains `'*'`, use `'*'`; otherwise use the origin.
- For a preflight (`method === 'OPTIONS'` and `access-control-request-method` is present), return `{}` if the requested method is not in `methods`; otherwise add `Access-Control-Allow-Methods: methods.join(', ')`.
'''
hints = ["Check the origin first, then handle preflight requests.", "Set `Vary: Origin` so caches do not mix responses for different origins."]
explanation = "Understanding CORS makes “blocked by CORS policy” errors easier to debug. Remember that CORS is not an authentication mechanism."

[modules.api-styles]
title = "REST, GraphQL, gRPC & Realtime"
description = "Compare API styles, WebSocket, SSE, webhooks, and message queues."
lesson = '''
| | REST | GraphQL | gRPC |
|---|---|---|---|
| Transport | HTTP + JSON | HTTP (often one POST endpoint) | HTTP/2 + Protobuf |
| Advantages | Simple, works well with HTTP caching | Clients select fields and can combine resources | Fast, type-safe, supports streaming |
| Drawbacks | Over-fetching/under-fetching | Harder to cache; N+1 (use DataLoader) | Hard to call directly from a browser |

### Realtime
- **Polling** is simple but consumes resources.
- **SSE** (Server-Sent Events) is a one-way stream from server to client over HTTP and reconnects automatically.
- **WebSocket** is full-duplex and supports communication in both directions.
- A **webhook** is a server making a callback to your URL when an event occurs. Verify its HMAC signature, handle events idempotently, and return 2xx quickly.
'''

[questions.api-080]
prompt = "The **N+1 query** problem in GraphQL is commonly solved with:"
options = ["Increasing the timeout", "DataLoader — batching and caching loads by key within a request", "Using REST", "Adding an index"]
explanation = "If each `post.author` resolver makes its own database call, that creates N+1 queries. DataLoader batches them into one query such as `WHERE id IN (...)`."

[questions.api-081]
prompt = "A dashboard only needs the server to **push** price updates one way to the browser. What is the simplest suitable choice?"
options = ["Long polling every 100 ms", "Server-Sent Events (EventSource)", "gRPC streaming from the browser", "Webhook"]
explanation = "SSE uses regular HTTP, reconnects automatically, and supports `Last-Event-ID`. Use WebSocket when you need frequent communication in both directions."

[questions.api-082]
prompt = "What are best practices when **receiving a webhook** from a third party such as Stripe or GitHub?"
options = ["Verify the HMAC signature in the header using a secret", "Return 2xx quickly and put heavy processing on a queue", "Handle events idempotently by event ID (webhooks may be delivered more than once)", "Trust every request sent to the webhook URL", "Check the timestamp to prevent replay"]
explanation = "A webhook URL is public and anyone can call it, so signature verification is required."

[questions.api-083]
prompt = '''
Open a WebSocket connection and send a message from the browser:

```js
const ws = new {{blank}}('wss://chat.bovabon.edu/room/1');
ws.addEventListener('open', () => ws.{{blank}}(JSON.stringify({ text: 'Xin chào' })));
```
'''
explanation = "Use `wss://` (TLS) in production; add a reconnect strategy and heartbeat."

[questions.api-084]
prompt = "When should you choose GraphQL over REST, and vice versa?"
keywords = [["over-fetching", "under-fetching", "fetching too much", "fetching too little", "select fields"], ["multiple clients", "mobile", "multiple screens", "frontend"], ["cache", "http cache", "cdn"], ["simple", "public api", "common"], ["schema", "type system", "types"]]
model_answer = '''
**GraphQL** is a good fit when there are **multiple clients** (web, mobile) with different data needs, or a screen needs to combine nested resources. Clients select the fields they need, avoiding **over-fetching** and **under-fetching**. GraphQL also provides a strongly typed **schema** and introspection.

**REST** is a good fit for a **simple/CRUD** API or a **public API** for third parties, when you want to use **HTTP caching/CDNs**, upload files, or keep operations simple. GraphQL needs additional safeguards and work, including solving N+1 queries with DataLoader, limiting query depth/complexity, and handling client-side caching.
'''
explanation = "Many systems use both: REST for public APIs and webhooks, and GraphQL as a BFF for frontends."

[modules.web-api-dv-representations]
title = "Content Negotiation & Range Requests"
description = "Choose a representation format, handle byte ranges, and resume large downloads."
lesson = '''
### Choosing a representation and downloading part of a resource

A resource can have multiple representations. The client uses `Accept` to describe which formats it can receive; the server uses `Content-Type` to describe the actual response body. A request body has its own `Content-Type`, so these two headers are not interchangeable. If the server does not support the request media type, it commonly returns `415 Unsupported Media Type`. If it cannot produce any representation the client accepts, it may return `406 Not Acceptable`. When the response varies by `Accept`, a cache needs to know about the variant through `Vary: Accept`.

| Situation | Header / status | Meaning |
|---|---|---|
| Client chooses JSON | `Accept: application/json` | Desired format |
| Server returns JSON | `Content-Type: application/json` | Actual body format |
| Partial download | `Range: bytes=100-199` | Request a byte range |
| Server honors the range | `206 Partial Content` | The body contains only the selected portion |
| Range cannot be satisfied | `416 Range Not Satisfiable` | No bytes in the requested range are valid |

Ranges are useful for video, large files, and resuming a download after a connection drops. A `206` response commonly includes `Content-Range: bytes 100-199/1000`, where the denominator is the total representation length. `Accept-Ranges: bytes` advertises support. `If-Range` lets a client send a range only while its validator still matches; if the content has changed, the server sends the full representation with `200` so the client does not combine parts from different versions.

For example, a client requests `Range: bytes=0-99`; the server returns `206`, `Content-Range: bytes 0-99/1000`, and the first 100 bytes. Common mistakes include confusing `406` (no acceptable response representation) with `415` (unsupported request body), returning `200` with only a partial body, or failing to limit the number and size of ranges, which can waste resources. For frequently changing data, check the validator before joining downloaded pieces.
'''

[questions.web-api-dv001]
prompt = "The client sends `Accept: application/json`, and the server returns JSON. Which description of the two headers is correct?"
options = ["Request `Content-Type`, response `Accept`", "Request `Accept`, response `Content-Type`", "Both headers describe the response format", "Both headers describe the request format"]
explanation = "`Accept` states which response type the client wants; `Content-Type` describes the actual media type of a request or response body."

[questions.web-api-dv002]
prompt = "A client sends a `POST` with `Content-Type: application/xml`, but the endpoint only accepts JSON. What is the most appropriate status?"
options = ["406 Not Acceptable", "415 Unsupported Media Type", "416 Range Not Satisfiable", "304 Not Modified"]
explanation = "415 means the server does not support the request body's media type; 406 concerns a response representation that does not satisfy `Accept`."

[questions.web-api-dv003]
prompt = "An endpoint creates a JSON or XML response depending on `Accept`. Choose the correct behaviors."
options = ["The response records the selected media type in `Content-Type`", "It may return `406` if no response format is acceptable", "A cache needs `Vary: Accept` when a cacheable response changes based on this header", "`Content-Length` replaces `Content-Type`", "Every request must include both `Accept` and `Content-Type`"]
explanation = "`Content-Type` describes the representation returned; `Vary` lets caches distinguish responses based on `Accept`."

[questions.web-api-dv004]
prompt = '''
The file is 1000 bytes long; the server successfully serves `Range: bytes=100-199`:

- Status: **{{blank}}**
- `Content-Range: bytes 100-199/{{blank}}`
- Body `Content-Length`: **{{blank}}**
'''
explanation = "A byte range includes both endpoints, so bytes 100–199 make a 100-byte segment."

[questions.web-api-dv005]
prompt = "The client sends `Range` with `If-Range`, but the current validator no longer matches because the file changed. What should the server do?"
options = ["Return `206` with part of the new file", "Ignore the range and return the full new representation with `200`", "Return `304` even though the body changed", "Combine bytes from the old and new files"]
explanation = "If the `If-Range` validator no longer matches, returning the full new version prevents the client from combining ranges from different representations."

[questions.web-api-dv006]
prompt = "A 100-byte file receives `Range: bytes=100-120`. If the server does not ignore this header, what is the appropriate status?"
options = ["200 OK", "206 Partial Content", "304 Not Modified", "416 Range Not Satisfiable"]
explanation = "The highest byte offset is 99, so a range starting at 100 does not overlap the representation."

[questions.web-api-dv007]
prompt = "In an interview, explain how to design an endpoint that supports JSON/XML and resumable large-file downloads. Describe how the client and server negotiate the format, the important status codes/headers, and one risk to control."
keywords = [["accept", "content negotiation"], ["content-type"], ["406", "not acceptable"], ["415", "unsupported media type"], ["range", "206", "content-range"], ["if-range", "validator"], ["vary"]]
model_answer = '''
The client sends `Accept` to choose a response format; the server uses `Content-Type` to identify the actual format and may return `406 Not Acceptable` if none of the available formats is suitable. `415 Unsupported Media Type` applies when the server does not accept the request body type. If a cacheable representation varies by `Accept`, use `Vary: Accept`. For a large file, the client sends `Range` and the server returns `206 Partial Content` with `Content-Range`. `If-Range` can use a validator to prevent combining chunks from different file versions. The server should validate and limit ranges to prevent excessive resource use.
'''
explanation = "A strong answer distinguishes the request and response directions and matches each status to the right situation."

[questions.web-api-dvc01]
title = "Single Byte Range Response"
prompt = '''
Implement `rangeResponse(data, rangeHeader)` for ASCII data in the string `data` and at most one byte range:
- If there is no header, the unit is not `bytes`, the syntax is invalid, or multiple ranges are present, ignore the header and return `{ status: 200, headers: { 'Accept-Ranges': 'bytes', 'Content-Length': '<length>' }, body: data }`.
- Accept `bytes=start-end`, `bytes=start-`, and `bytes=-suffixLength`; both range endpoints are inclusive.
- For a valid range, return `206`, with the selected bytes in the body, `Content-Range: bytes start-end/total`, and the correct body length in `Content-Length`. If `end` exceeds the end of the string, clamp it to the final byte.
- If a valid range selects no bytes (for example, `start` is beyond the data length or the suffix is zero), return `416`, `Content-Range: bytes */total`, `Content-Length: '0'`, and an empty body.
- Always include `Accept-Ranges: bytes`. Since the data is ASCII, each character corresponds to one byte.
'''
hints = ["Handle suffix ranges separately from start/end ranges; remember that both endpoints are inclusive.", "For invalid syntax, return the full response; for a valid but unsatisfiable range, return 416."]
explanation = "Byte ranges are often used for media and resumable downloads; in production, limit the number of ranges and the total processing cost."

[modules.web-api-dv-framing]
title = "Message Framing & Connections"
description = "How HTTP determines body boundaries, reuses connections, and differs across protocol versions."
lesson = '''
### Message framing and connection lifecycle

HTTP/1.1 sends messages over a TCP byte stream, so both ends must agree on where the body ends. `Content-Length` specifies the number of body octets; `Transfer-Encoding: chunked` allows the sender to transmit chunks when the total length is not known in advance. If a request has ambiguous framing, for example conflicting `Content-Length` and `Transfer-Encoding` headers, a reverse proxy and application may disagree about the request boundary. This is a reason to reject and normalize requests at the trust boundary; do not write a simple HTTP parser yourself.

| Version | Transport | Multiplexing unit | Key point |
|---|---|---|---|
| HTTP/1.1 | TCP | One request/response at a time, in order | Connections are often reused; body framing must be unambiguous |
| HTTP/2 | TCP | Multiple streams on one connection | Binary framing, HPACK; TCP packet loss can stall progress across streams |
| HTTP/3 | QUIC over UDP | Multiple QUIC streams | QPACK; packet loss in one stream does not necessarily block another |

HTTP/1.1 requires `Host` so the server can select the target authority. A connection can normally serve multiple requests if the previous body has been fully read and no instruction closes the connection. `Connection: close` prevents reuse; HTTP/1.0 needs a separate keep-alive mechanism. Do not decide whether to pool a connection from the status code alone: if the body has not been fully read, its remaining bytes could be mistaken for the next response.

A common misconception is that HTTP/2 uses UDP or HTTP/3 is simply faster HTTP/2. HTTP/2 still inherits TCP's ordered byte stream; HTTP/3 uses QUIC to isolate stream progress more effectively, but it still has bandwidth and congestion-control limits. For proxies, prefer an up-to-date server/library, limit header and body sizes, and inspect end-to-end protocol logs rather than inferring the protocol version from an application header.
'''

[questions.web-api-dv008]
prompt = "In HTTP/1.1, what does `Content-Length: 120` indicate?"
options = ["The total number of headers in the message", "The number of octets in the message body", "The maximum connection timeout", "The number of requests allowed on the connection"]
explanation = "`Content-Length` gives the body length in octets, not the number of Unicode characters or the length of the entire message."

[questions.web-api-dv009]
prompt = "An HTTP/1.1 server uses one IP address to serve multiple domains. Which request information helps it select the destination authority?"
options = ["`Accept-Language`", "`Host`", "`Referer`", "`Content-Encoding`"]
explanation = "`Host` carries the request authority in HTTP/1.1; the server uses it to route to the appropriate virtual host."

[questions.web-api-dv010]
prompt = "Choose the correct descriptions of HTTP/2 and HTTP/3."
options = ["HTTP/2 multiplexes multiple streams over one TCP connection", "HTTP/2 uses HPACK for header compression", "HTTP/3 uses QUIC", "HTTP/2 uses UDP as its transport", "HTTP/3 eliminates the need for congestion control"]
explanation = "HTTP/2 runs over TCP; HTTP/3 runs over QUIC/UDP but still uses congestion control."

[questions.web-api-dv011]
prompt = "In HTTP/1.1, when a server streams a body without knowing its total length in advance, the common transfer coding is `{{blank}}`."
explanation = "Chunked framing ends with a zero-length chunk and may then be followed by trailers."

[questions.web-api-dv012]
prompt = "How can TCP packet loss on an HTTP/2 connection affect its multiplexed streams?"
options = ["Only the stream with an errored response is affected", "Bytes after the lost packet may have to wait for TCP retransmission, slowing multiple streams on the connection", "HTTP/2 automatically switches to QUIC", "There is no effect because each stream uses its own TCP connection"]
explanation = "Multiplexing happens at the HTTP/2 layer; underneath it is still one ordered TCP byte stream."

[questions.web-api-dv013]
prompt = "A reverse proxy detects conflicting message-framing information in a request. What is the safe action at the trust boundary?"
options = ["Forward it unchanged and let the application choose how to interpret it", "Reject the ambiguous request and close the connection according to server policy", "Trust only whichever header appears last", "Remove the body but leave the framing headers unchanged"]
explanation = "All hops must agree on message boundaries. Rejecting ambiguous framing avoids different interpretations by the proxy and upstream."

[questions.web-api-dv014]
prompt = "Explain the practical differences between HTTP/1.1, HTTP/2, and HTTP/3 when serving many concurrent requests. If a user reports that HTTP/2 requests all slow down during packet loss, how would you explain and investigate it?"
keywords = [["http/2", "http2"], ["tcp"], ["multiplex", "stream"], ["http/3", "http3", "quic"], ["head-of-line", "hol", "packet loss"], ["qpack", "hpack"]]
model_answer = '''
HTTP/1.1 commonly processes responses in order on a connection, while HTTP/2 multiplexes multiple streams over one TCP connection and compresses headers with HPACK. Because TCP still delivers bytes in order, packet loss can slow data across multiple streams, even though each stream is independent at the HTTP layer. HTTP/3 uses QUIC to isolate stream progress better when another stream loses a packet; QUIC still performs congestion control, and HTTP/3 uses QPACK. To investigate, measure handshakes, retransmissions, per-stream timing, and the actual protocol version at the client, proxy, and upstream.
'''
explanation = "A strong interview answer distinguishes HTTP-layer multiplexing from TCP transport ordering and describes how to observe the behavior in practice."

[questions.web-api-dvc02]
title = "Deciding Whether to Reuse an HTTP/1.x Connection"
prompt = '''
Implement `canReuseHttp1(version, connectionHeader, responseComplete)`:
- `version` is `'1.0'` or `'1.1'`; return `false` for any other value.
- A connection can be reused only after the response body has been fully read (`responseComplete === true`).
- For HTTP/1.1, keep the connection alive by default unless the `Connection` token list contains `close`.
- For HTTP/1.0, reuse the connection only when the token list contains `keep-alive` and does not contain `close`.
- `connectionHeader` may be missing. Tokens are comma-separated, trimmed, and case-insensitive. Match whole tokens, not substrings.
'''
hints = ["Split `Connection` into comma-separated tokens, trim them, and lowercase them.", "Check for `close` before applying HTTP/1.1's default reuse rule."]
explanation = "Do not return a connection to the pool until its body is fully consumed, because remaining bytes may belong to the current response."

[modules.web-api-dv-csp]
title = "CSP & Browser Security Headers"
description = "Reduce browser content attack surface with CSP and defensive headers."
lesson = '''
### Content Security Policy

Content Security Policy (CSP) is a defense layer enforced by the browser based on a policy sent in a response header. CSP can limit where a page loads scripts, images, styles, network connections, and frames. It can reduce the impact of some injection bugs, but it does not replace output encoding, input validation, or fixing XSS in the application.

| Directive | Scope | Remember |
|---|---|---|
| `default-src` | Fallback for some fetch directives that are not specified separately | It does not replace `base-uri`, `form-action`, or `frame-ancestors` |
| `script-src` | Accepted script sources, nonces, or hashes | Avoid broadly allowing inline scripts with `'unsafe-inline'` |
| `connect-src` | Connections initiated by the page, such as fetch/XHR/WebSocket | Restrict the endpoints page code can call |
| `frame-ancestors` | Sites allowed to embed this page | `'none'` disallows embedding; this differs from `frame-src` |

An initial policy might be: `default-src 'none'; script-src 'self' 'nonce-<random-per-response>'; connect-src 'self' https://api.example; img-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'`. A nonce must be hard to guess, newly generated for every response, and attached only to scripts trusted by the server. A hash works for static inline scripts with stable content. Do not enable `'unsafe-inline'` just to silence policy errors.

When rolling out CSP on a legacy application, start with `Content-Security-Policy-Report-Only` and configure reporting to observe violations; this policy reports but does not block. After cleaning up legitimate script and connection sources, gradually move to enforcing `Content-Security-Policy`. Common mistakes include assuming `default-src` restricts every behavior, confusing `frame-src` (which frames the page loads) with `frame-ancestors` (who may embed the page), or treating CSP as CORS: CORS controls whether a browser lets a page read a cross-origin response, while CSP limits page behavior and resources.

Other headers address separate concerns: `Strict-Transport-Security` tells a browser to use HTTPS after receiving a secure policy; `X-Content-Type-Options: nosniff` prevents some MIME-type guessing. Correctly configured headers reduce risk, but should be tested against the real page to avoid unintentionally blocking application resources.
'''

[questions.web-api-dv015]
prompt = "You need to observe CSP violations in a legacy application before enabling blocking. Which header is appropriate for the initial phase?"
options = ["`Content-Security-Policy-Report-Only`", "`Content-Security-Policy` with `default-src *`", "`Access-Control-Allow-Origin`", "`X-Content-Type-Options: nosniff`"]
explanation = "Report-Only lets you observe the policy without blocking resources; configure reporting to receive the reports."

[questions.web-api-dv016]
prompt = "A policy declares only `default-src 'self'` and does not declare `script-src`. Which conclusion is most accurate?"
options = ["`script-src` has no fallback and allows every source", "`default-src` is the fallback for scripts; it does not replace directives such as `frame-ancestors`", "`default-src` affects images only", "The browser automatically changes the policy to Report-Only"]
explanation = "`default-src` is a fallback for fetch directives that are not declared; some directives do not inherit from it."

[questions.web-api-dv017]
prompt = "Choose the configurations/statements that help build a stricter CSP for a web application."
options = ["Use a fresh random nonce for each response to allow trusted scripts", "Set `object-src 'none'` if the application does not need object plugins", "Use `frame-ancestors 'none'` when the page must not be embedded", "Add `'unsafe-inline'` to `script-src` to avoid all CSP errors", "Assume CSP replaces output encoding and fixes XSS vulnerabilities"]
explanation = "A nonce works when it is generated and attached correctly; CSP is still defense in depth and does not fix the root cause of injection."

[questions.web-api-dv018]
prompt = "To specify which origins are allowed to embed the current page in an iframe, use the `{{blank}}` directive."
explanation = "`frame-ancestors` controls who can embed the page; `frame-src` controls which frames the page loads."

[questions.web-api-dv019]
prompt = "Which directive restricts the destinations of connections initiated by JavaScript in the page, such as `fetch` or WebSocket?"
explanation = "`connect-src` applies to connection APIs initiated by the page, including fetch/XHR and WebSocket."

[questions.web-api-dv020]
prompt = "An application sends `Content-Security-Policy-Report-Only` with reporting configured. How does the browser handle a violating resource?"
options = ["It always blocks it immediately", "It records/sends a violation report but does not block the resource just because of the Report-Only policy", "It automatically adds a nonce to the script", "It ignores both the policy and the report"]
explanation = "Report-Only supports an observational rollout before enabling the enforcing CSP header."

[questions.web-api-dv021]
prompt = "You need to roll out CSP for a long-lived application with many third-party scripts. Describe the rollout, how to allow trusted scripts, and how to distinguish CSP errors from CORS errors."
keywords = [["report-only", "report without blocking"], ["nonce", "hash"], ["script-src"], ["unsafe-inline"], ["cors"], ["connect-src"], ["frame-ancestors"]]
model_answer = '''
First, send `Content-Security-Policy-Report-Only` with reporting configured to inventory the script sources and connections in use without blocking them. After removing unnecessary sources, apply an enforcing policy with `default-src 'none'` or a suitable baseline, specify `script-src` explicitly, and use a fresh random nonce per response or a hash for static scripts. Restrict `'unsafe-inline'`, specify the required API endpoints in `connect-src`, and set `frame-ancestors` according to the embedding policy. CSP restricts page behavior and resources; CORS controls whether the browser lets JavaScript read a cross-origin response, so diagnose the relevant headers and console messages for each mechanism.
'''
explanation = "An observational rollout can uncover legitimate dependencies before enforcement is enabled; nonces and hashes reduce the need to broadly allow inline scripts."

[questions.web-api-dv022]
prompt = "What is the difference between CSP `frame-src` and `frame-ancestors`?"
options = ["`frame-src` restricts who can embed this page; `frame-ancestors` restricts images", "`frame-src` restricts frames the page loads; `frame-ancestors` restricts which sites may embed this page", "The two directives are synonymous", "Both apply only to WebSocket"]
explanation = "One directive controls frames loaded by the page; the other controls whether another site may embed the page."

[questions.web-api-lv017]
prompt = "A client sends `POST /users` with a JSON body missing the required `email` field. Which status is most appropriate?"
options = ["200 OK", "400 Bad Request (or 422)", "404 Not Found", "500 Internal Server Error"]
explanation = "Invalid client input is a 4xx error; 400 or 422 is commonly used for validation. 200 would falsely indicate success, 404 is for a missing resource, and 500 is for a server-side failure."

[questions.web-api-lv018]
prompt = "Which method is used to **read** a resource and must not change data on the server?"
options = ["POST", "GET", "DELETE", "PUT"]
explanation = "GET is a safe method for reading. POST commonly creates resources, DELETE removes them, and PUT replaces a resource."

[questions.web-api-lv019]
prompt = "Which status code indicates that the user is **unauthenticated** (credentials are missing or invalid)?"
options = ["401 Unauthorized", "403 Forbidden", "404 Not Found", "409 Conflict"]
explanation = "401 means the user's identity could not be authenticated. 403 means the user is known but lacks permission. 404 means not found, and 409 indicates a state conflict."

[questions.web-api-lv020]
prompt = "Which header tells the server the format of the body the client is sending, such as `application/json`?"
options = ["Accept", "Content-Type", "Authorization", "Cache-Control"]
explanation = "`Content-Type` describes the body in the current message. `Accept` describes what the client wants to receive, `Authorization` carries credentials, and `Cache-Control` controls caching."

[questions.web-api-lv023]
prompt = "Which HTTP methods are **idempotent** by definition?"
options = ["GET", "PUT", "DELETE", "POST"]
explanation = "GET, PUT, and DELETE are idempotent: repeating them has the same intended effect as performing them once. Repeating POST may create multiple records."

[questions.web-api-lv024]
prompt = "Which status codes belong to the **client error** (4xx) class?"
options = ["400", "404", "502", "429"]
explanation = "400, 404, and 429 are 4xx responses. 502 Bad Gateway is a 5xx error on the server/gateway side."

[questions.web-api-lv025]
prompt = "Complete: a missing resource returns **{{blank}}**; a successful deletion with no response body commonly returns **{{blank}}**.\n"
explanation = "404 Not Found indicates a missing resource. 204 No Content indicates success without a response body, for example after a DELETE."

[questions.web-api-lv026]
prompt = "To send a Bearer access token, the client uses the header `{{blank}}: Bearer <token>`.\n"
explanation = "A Bearer token belongs in the `Authorization` header. Do not put tokens in URLs, which may be recorded in logs and browser history."

[questions.web-api-lv044]
prompt = "A client updates `PUT /documents/7` with `If-Match: \"v3\"`, but the current server version is `\"v4\"`. Which response is most appropriate?\n"
options = ["200 OK", "412 Precondition Failed", "304 Not Modified", "401 Unauthorized"]
explanation = "A non-matching `If-Match` ETag means another writer changed the resource (a lost update). 412 tells the client the precondition failed so it can fetch the latest version and reconcile its changes."

[questions.web-api-lv046]
prompt = "The `{{blank}}` header in a 429/503 response tells the client how long to wait before retrying.\n"
explanation = "`Retry-After` can be a number of seconds or an HTTP date. Clients should honor it instead of retrying aggressively."

[questions.web-api-lv050]
prompt = "A service receives a partner webhook and verifies the body's HMAC signature. Which signature comparison approach is correct?\n"
options = ["Compare hexadecimal strings with `==`", "Compute the HMAC over the received **raw body** and compare it with a constant-time function; also check a timestamp to prevent replay", "Parse the JSON and stringify it again before computing the HMAC", "Check only the source IP"]
explanation = "Compute the signature over the original bytes: parsing and re-serializing can change ordering or whitespace. `==` can leak information through timing. A signed timestamp helps prevent replay; source IPs can change and do not prove integrity."

[questions.web-api-lv051]
prompt = "The `POST /fetch-preview` endpoint accepts a user-provided `url`, then the server fetches it to build a link preview. What is the main security risk and an appropriate mitigation?\n"
options = ["CORS; add `Access-Control-Allow-Origin`", "SSRF: the server could be induced to access internal networks or cloud metadata; use an allowlist, block private/loopback IPs after DNS resolution, and limit redirects and timeouts", "Reflected XSS; HTML-encode the value", "CSRF; add a CSRF token"]
explanation = "Letting a server fetch arbitrary URLs is a classic SSRF scenario, especially dangerous for metadata services. Check resolved IPs (to mitigate DNS rebinding) and control redirects. CORS, CSRF, and XSS address different risks."

[questions.web-api-lvc05]
title = "Calculate a Retry Delay"
prompt = '''Implement `retryDelay(attempt, response, opts)` to return the number of milliseconds to wait before the next attempt, or `null` if it should not be retried:
- `attempt` starts at 1 (the first failed attempt).
- `response = { status, headers }` (header names are lowercase); `opts = { base, cap, maxAttempts, random }`, where `random()` returns a value in `[0, 1)`.
- Retry only for status 429, 502, 503, or 504; return `null` for any other status.
- Return `null` when `attempt >= maxAttempts`.
- If `retry-after` is a number of seconds, return `seconds * 1000` without jitter, capped at `cap`.
- Otherwise use exponential backoff with **full jitter**: `Math.floor(random() * Math.min(cap, base * 2 ** (attempt - 1)))`.
'''
explanation = "Full jitter spreads retries across clients to avoid synchronized load spikes. Respecting `Retry-After` follows the server's guidance."
hints = ["Check the status and attempt count first.", "Set the ceiling to `min(cap, base * 2^(attempt-1))`, then multiply it by the random value."]

[questions.web-api-lv060]
prompt = "Which statements about timeouts and retries between services are correct?"
options = ["Automatically retry only idempotent operations or operations protected by an idempotency key", "A client's timeout should be shorter than the timeout of the layer calling it, to control failure propagation (deadline propagation)", "Retries at every layer in a call chain multiply the number of calls during an incident", "Retrying without a limit until success is always safe"]
explanation = "Retries multiply across layers, so systems need retry budgets and deadline propagation. Unlimited retries can overwhelm a service that is already struggling."

[questions.web-api-lv021]
prompt = "In REST design, which URL follows the plural-noun resource convention for retrieving a list of posts?"
options = ["GET /getPosts", "GET /posts", "POST /posts/list", "GET /post/get-all"]
explanation = "REST uses nouns for resources and HTTP methods to express actions: `GET /posts`. Verb-based URLs such as `getPosts` follow an RPC style."

[questions.web-api-lv022]
prompt = "A new resource is successfully created using `POST /posts`. Which status code is most appropriate?"
options = ["200", "201 Created", "204 No Content", "302 Found"]
explanation = "201 Created indicates that a resource was created and commonly includes a `Location` header pointing to it. 200 can work but is less specific; 204 has no body, and 302 is a redirect."

[questions.web-api-lvc03]
title = "Build a Query String"
prompt = '''Implement `buildQuery(params)` to accept a flat object and return a query string without a leading `?`:
- Skip `null` and `undefined` values.
- Encode each key and value with `encodeURIComponent`.
- Join pairs with `&`, preserving the key order from the object.
- Return the empty string `''` for an empty object or when all values are skipped.
'''
explanation = "Values such as 0, false, and the empty string are valid, so skip only null and undefined. `encodeURIComponent` prevents characters such as `&` from breaking the query structure."
hints = ["Filter out null and undefined values before mapping.", "Remember to encode both keys and values."]

[questions.web-api-lv033]
prompt = "A list endpoint returns tens of thousands of records in one response. What is the most basic improvement?"
options = ["Increase the server timeout", "Use pagination", "Change the method to POST", "Compress images"]
explanation = "Pagination limits the number of records returned at once, reducing load on the server, network, and client. Increasing the timeout does not reduce payload size, and changing the method is unrelated."

[questions.web-api-lv035]
prompt = "Which components are commonly part of a good REST API error response?"
options = ["An appropriate status code", "A developer-friendly error message", "The full server stack trace", "A stable error code that clients can handle programmatically"]
explanation = "A status, message, and stable error code help clients respond. A stack trace exposes internal details and creates security risk; keep it in server-side logs instead."

[questions.web-api-lv037]
prompt = "A **partial** update of a resource (only a few fields) commonly uses **{{blank}}**; replacing the **entire** resource uses **{{blank}}**.\n"
explanation = "PATCH sends the changes, while PUT sends a complete new representation of the resource."

[questions.web-api-lv038]
prompt = "A post feed has five million records, and users keep adding new posts at the beginning. Pagination with `?page=N&limit=20` repeats or skips posts while scrolling. What is the best fix?\n"
options = ["Increase `limit` to 1000", "Use cursor/keyset pagination based on a stable sort key, such as `created_at, id`", "Cache the entire list on the client", "Switch to a larger `offset`"]
explanation = "Offsets shift as records are inserted, causing repeats or omissions; large offsets are also slow. A cursor follows key values, remains stable, and can use an index. Increasing the limit or offset does not fix the underlying issue."

[questions.web-api-lv039]
prompt = "A mobile app sends `POST /orders`, times out, and automatically retries; sometimes this creates two identical orders. What is the best API-side fix?\n"
options = ["Change POST to GET", "Accept a client-generated `Idempotency-Key`, store the result by key, and return the same result on retry", "Increase the timeout to five minutes", "Lock the entire orders table while processing"]
explanation = "An idempotency key makes retries safe for a POST. GET is not appropriate for writes, a long timeout still leaves retry ambiguity, and locking the whole table can block the system."

[questions.web-api-lv045]
prompt = "Compare offset pagination with cursor pagination. When should each be chosen?"
keywords = [["offset"], ["cursor", "keyset"], ["stable", "repeat", "skip", "insert"], ["index", "performance", "slow"], ["jump to any page", "arbitrary page", "total count", "random access"]]
model_answer = '''- **Offset**: `LIMIT n OFFSET m` is simple, supports jumping to an arbitrary page, and makes total-page counts easy. Insertions or deletions can cause repeated or skipped records; large offsets are slow because the database must skip rows.
- **Cursor/keyset**: uses a key from the last record, such as `WHERE id > :last`. It has stable performance with an index and stays stable as data changes. It does not support arbitrary page jumps, needs a stable sort key, and makes totals harder to count.
- Choose **offset** for small tables or admin screens that need page jumps; choose **cursor** for feeds, large datasets, or frequently changing data.
'''
explanation = "A strong answer covers offset's convenience as well as cursor's stability and performance."

[questions.web-api-lv053]
prompt = "Two people edit the same document through `PUT /docs/1`; the later update overwrites the earlier one (a lost update). Which measures address this correctly?"
options = ["Return an ETag from GET and require `If-Match` on PUT; return 412 on mismatch", "Use a `version` column and `UPDATE ... WHERE id=? AND version=?`; return 409 if zero rows are updated", "Increase the request timeout", "Require `If-Match` and return 428 Precondition Required when it is missing"]
explanation = "Optimistic concurrency using ETags/If-Match or a version column detects conflicts; 428 requires clients to provide a condition. A longer timeout does not prevent overwrites."

[questions.web-api-lv056]
prompt = "What weakness of a fixed window of 100 requests per minute does a token bucket address?\n"
options = ["A fixed window cannot count requests", "At a window boundary, a client can send 100 requests at the end of one window and 100 at the start of the next, causing a double-sized burst; a token bucket smooths traffic and allows controlled bursts", "A token bucket requires no state", "A fixed window works only with HTTP/1.1"]
explanation = "The window-boundary effect permits a short burst of twice the limit. A token bucket refills steadily, controlling the average rate while allowing bounded bursts. Both approaches require state."

[questions.web-api-lv027]
prompt = "What does the `Cache-Control: no-store` header mean?"
options = ["Cache the response for one year", "Do not store the response in any cache", "Cache only in the browser, not in a CDN", "Always revalidate with the server before using a cached copy"]
explanation = "`no-store` instructs caches not to store the response, which is useful for sensitive data. Browser-only caching is `private`; revalidation before reuse is `no-cache`."

[questions.web-api-lv028]
prompt = "A client sends a request with `If-None-Match` matching the resource's current ETag. Which status should the server return?"
options = ["200 with the full body", "304 Not Modified with no body", "404 Not Found", "412 Precondition Failed"]
explanation = "A matching ETag means the client's cached copy is still current, so the server returns 304 to save bandwidth. 412 applies when `If-Match` fails during an update."

[questions.web-api-lv036]
prompt = "To let a browser cache a static file for one hour, the server returns `Cache-Control: max-age={{blank}}` (in seconds).\n"
explanation = "`max-age` is measured in seconds; one hour is 60 × 60 = 3600 seconds."

[questions.web-api-lv040]
prompt = "An API returns different content based on `Accept-Language`, but omits `Vary`. A CDN caches the Vietnamese response and serves it to users who want English. What is the correct fix?\n"
options = ["Add `Vary: Accept-Language` to the response", "Set `Cache-Control: max-age=0` on every route", "Replace `Accept-Language` with a cookie", "Disable the CDN permanently"]
explanation = "`Vary` tells caches to distinguish variants based on the named request header. `max-age=0` only forces revalidation and does not address the cause; moving this to a cookie can make shared caching harder."

[questions.web-api-lvc04]
title = "Parse Cache-Control"
prompt = '''Implement `parseCacheControl(header)` to return an object describing the directives:
- Split on `,`, trim extra whitespace, and lowercase directive names.
- A directive without a value becomes `true` (for example, `public` becomes `{ public: true }`).
- Convert numeric values for `max-age`, `s-maxage`, and `stale-while-revalidate` to numbers.
- For other directives with values, preserve the string and remove surrounding double quotes if present.
- Return `{}` when `header` is `null`, `undefined`, or empty.
'''
explanation = "Proxies, CDNs, and HTTP clients parse this header to decide whether a response can be cached and for how long."
hints = ["Split on commas, then trim each item.", "Use `indexOf('=')` to distinguish directives with values."]

[questions.web-api-lv049]
prompt = "A popular cache entry expires just as 10,000 requests per second arrive; they all go to the origin and overload it (a cache stampede). Which measure is effective?\n"
options = ["Reduce TTL to one second", "Request coalescing (only one request fetches the data), `stale-while-revalidate`/`stale-if-error`, and TTL jitter", "Increase the number of origins by ten", "Delete the cache when an error occurs"]
explanation = "Coalescing duplicate requests and serving stale data during refresh protects the origin. Jitter prevents many keys from expiring simultaneously. Reducing TTL makes stampedes happen more often."

[questions.web-api-lv054]
prompt = "Which statements about validators in HTTP caching are correct?"
options = ["A weak ETag (`W/\"v1\"`) promises semantic equivalence, not byte-for-byte identity", "A matching ETag in `If-None-Match` allows the server to return 304 without a body", "`Last-Modified` has one-second resolution and may miss two changes made within the same second", "An ETag must always be a hash of the entire body"]
explanation = "An ETag is an opaque string defined by the server; it need not be a body hash and may be a version or revision. The other three statements are correct."

[questions.web-api-lvc06]
title = "Handle a Conditional GET"
prompt = '''Implement `handleConditionalGet(req, resource)` where `req = { headers }` (lowercase names) and `resource = { body, etag }` (the ETag is quoted, e.g. a quoted version value):
- Without `if-none-match`, return `{ status: 200, headers: { ETag: resource.etag }, body: resource.body }`.
- `if-none-match` can be `*` or a comma-separated list of ETags; compare **weakly** (remove the `W/` prefix from both sides).
- On a match, return `{ status: 304, headers: { ETag: resource.etag } }` with no `body` property.
- On a non-match, return the same shape as the 200 case.
'''
explanation = "Conditional GET saves bandwidth: the client keeps its cached copy and downloads again only when the ETag changes. GET uses weak comparison under RFC 9110."
hints = ["Split `if-none-match` on commas and normalize each value.", "A 304 response has no body but includes the ETag again."]

[questions.web-api-lv062]
prompt = "An API returns a product list shared by everyone, but the response also contains an `isFavorite` field calculated for the signed-in user. Which cache policy is most appropriate?"
options = ["`Cache-Control: public, max-age=300` because the product list changes infrequently", "`Cache-Control: private, max-age=60` (or move personalization to a separate endpoint so the shared portion can be cached publicly)", "`Cache-Control: no-store` for every response to avoid all risk", "`Vary: *` with `public, max-age=300` so the CDN distinguishes users"]
explanation = "A response containing user-specific data must not be stored by a shared CDN or proxy (`private`). Better still, separate personalization so the shared portion can remain publicly cacheable. `no-store` is safe but gives up browser caching; `Vary: *` makes the response effectively uncacheable."


[questions.web-api-lv029]
prompt = "Why should an access token not be placed in a URL query string, for example `/api/me?token=abc`?"
options = ["URLs are limited to ten characters", "URLs are commonly recorded in access logs, browser history, and the `Referer` header", "GET does not support query strings", "The token would expire automatically"]
explanation = "URLs appear in many places, including logs, browser history, and `Referer` headers, so tokens can leak. Put the token in the `Authorization` header."

[questions.web-api-lv030]
prompt = "How should user passwords be stored in a database?"
options = ["Store them in plaintext so they can be recovered", "Encode them with Base64", "Hash them with a password-specific algorithm such as bcrypt, scrypt, or Argon2 and use a salt", "Hash them once with MD5"]
explanation = "Passwords should be hashed with a deliberately slow, salted password-hashing algorithm. Plaintext and reversible Base64 expose them immediately in a database leak; MD5 is too fast to resist brute force."

[questions.web-api-lv031]
prompt = "Which component enforces CORS when a web page tries to call an API on another origin and the server has not allowed it?"
options = ["The API server automatically blocks it", "The browser", "The operating system", "The network router"]
explanation = "Browsers enforce CORS based on response headers such as `Access-Control-Allow-Origin`. Tools such as curl and server-to-server clients are not blocked by CORS."

[questions.web-api-lv034]
prompt = "Which practices help protect an API while data is transmitted over a network?"
options = ["Use HTTPS for every endpoint", "Send passwords in query strings for easier debugging", "Put tokens in the `Authorization` header", "Enable HSTS so browsers consistently use HTTPS"]
explanation = "HTTPS protects against eavesdropping; the Authorization header avoids exposing tokens in URL logs; HSTS tells browsers to use HTTPS. Passwords in query strings may be recorded in logs and browser history."

[questions.web-api-lv041]
prompt = "An SPA at `https://app.example.com` calls `https://api.example.com` with `fetch` and cookies (`credentials: 'include'`). The browser blocks it because the server returned `Access-Control-Allow-Origin: *`. Why?\n"
options = ["For credentialed requests the server cannot use `*`; it must return an allowed specific origin and `Access-Control-Allow-Credentials: true`", "Browsers do not support cross-origin cookies", "The method must be changed to POST", "The `Content-Length` header is missing"]
explanation = "For requests with credentials, browsers reject the wildcard origin. The server must echo an allowed origin and include `Access-Control-Allow-Credentials: true` (and `Vary: Origin`)."

[questions.web-api-lv042]
prompt = "Which statements about storing a web application's session in a cookie are correct?"
options = ["`HttpOnly` prevents JavaScript from reading the cookie, reducing some XSS impact", "`Secure` sends the cookie only over HTTPS", "`SameSite=Lax/Strict` helps reduce CSRF risk", "Session cookies do not need CSRF protection because the browser sends them automatically"]
explanation = "HttpOnly, Secure, and SameSite are useful baseline attributes. Automatic cookie sending is exactly why CSRF protection is needed; it is not a reason to omit it."

[questions.web-api-lv047]
prompt = "A service reads the `alg` value from a JWT's own header to choose the verification algorithm. What is the most serious risk?\n"
options = ["The token becomes longer", "An attacker could set `alg: none` or switch to HS256 and use the public key as a secret to forge a token", "The token expires sooner", "Key rotation becomes impossible"]
explanation = "The server must fix the accepted algorithm set and choose keys from trusted configuration (with an allowlisted `kid`); it must not trust the token's claimed `alg`. Otherwise `none` or RS256/HS256 confusion may enable forgery."

[questions.web-api-lv048]
prompt = "A SPA or mobile app (a public client that cannot keep a secret) uses the Authorization Code flow. What prevents someone who intercepts the redirect `code` from exchanging it for a token?\n"
options = ["A client secret embedded in the JavaScript bundle", "PKCE: send `code_challenge` when requesting the code and `code_verifier` when exchanging it", "The `Referer` header", "An `HttpOnly` cookie"]
explanation = "PKCE binds the authorization code to a verifier known only to the original client, making an intercepted code unusable. A secret embedded in a bundle is not secret; Referer and cookies do not provide this protection."

[questions.web-api-lv055]
prompt = "An access-token JWT lasts 24 hours. A user selects “sign out of all devices,” but old tokens remain usable until they expire. What is a reasonable balance?\n"
options = ["Keep the current setup; JWTs cannot be revoked", "Use short-lived access tokens (5–15 minutes) plus rotating refresh tokens stored server-side for revocation, or check a revocation list/`jti` for sensitive actions", "Increase token lifetime to 30 days to reduce logins", "Store JWTs in `localStorage` so they are easy to delete"]
explanation = "Short-lived access tokens limit exposure, while stateful refresh tokens can be revoked. Longer lifetimes increase risk; `localStorage` does not solve revocation and can be read by injected JavaScript."

[questions.web-api-lv061]
prompt = "To prevent clickjacking, a page should send the CSP directive `frame-ancestors {{blank}}` to prohibit all sites from embedding it in a frame."
explanation = "`frame-ancestors 'none'` prohibits embedding; `'self'` allows only the same origin. Modern browsers use this directive in place of `X-Frame-Options`."

[questions.web-api-lv059]
prompt = "When putting GraphQL into production with clients that are not fully trusted, which measures are needed?"
options = ["Limit query depth and complexity", "Disable or control introspection in public environments if it is not needed", "Use persisted queries/an allowlist for known clients", "Allow arbitrary queries because the clients were written by our team"]
explanation = "Deeply nested queries can cause denial of service; introspection can expose the schema; persisted queries reduce the attack surface. No client is fully trusted because an attacker can send requests directly."

[questions.web-api-lv058]
prompt = "A client is downloading a 2 GB file and loses connection at 1.2 GB. The server supports `Accept-Ranges: bytes`. How should the client resume?\n"
options = ["Start over because HTTP does not support resuming", "Send `Range: bytes=1200000000-` with `If-Range` and an ETag; receive 206 Partial Content if the file is unchanged (or the full response with 200 if it changed)", "Send `Content-Length: 1200000000`", "Use `Cache-Control: max-age`"]
explanation = "A Range request downloads only part of a representation. `If-Range` ensures the resumed part is from the same file version; if the file changed, the server returns the full new content with 200."

[questions.web-api-lv052]
prompt = "Compared with HTTP/1.1 over TCP, what is the clearest improvement HTTP/3 (QUIC) provides on a mobile network with frequent packet loss?\n"
options = ["It removes the need for TLS entirely", "Each stream progresses independently during packet loss, avoiding transport-layer head-of-line blocking as with HTTP/2 over TCP", "It automatically compresses the body with gzip", "It makes every request idempotent"]
explanation = "HTTP/2 multiplexes streams over one TCP connection, so losing a packet can stall all streams. QUIC handles loss per stream. QUIC still uses TLS 1.3 and does not change idempotency semantics."

[questions.web-api-lv057]
prompt = "An application has many inline scripts, so the team adds `'unsafe-inline'` to `script-src`. Why is this a poor choice, and what is a better approach?\n"
options = ["`'unsafe-inline'` makes the page slower; use `defer`", "It allows any inline script, including an injected XSS script; use a nonce or hash for each trusted script and begin with `Content-Security-Policy-Report-Only`", "CSP does not support inline scripts, so remove CSP", "Just add `X-Frame-Options`"]
explanation = "CSP is valuable because it blocks unauthorized scripts; `'unsafe-inline'` undermines that protection. A nonce or hash allows only a specific trusted script. Report-Only helps introduce the policy gradually without breaking the page."

[questions.web-api-lv032]
prompt = "In GraphQL, the client selects exactly the fields it needs in a query. What is the main benefit?"
options = ["The server no longer needs a schema", "Avoiding over-fetching and under-fetching", "Every request is cached by a CDN", "Authentication is no longer needed"]
explanation = "The client fetches only the data it needs, reducing excess data and extra calls. GraphQL still has a schema and still requires authentication; CDN caching is harder than with REST GET requests."

[questions.web-api-lv043]
prompt = "A GraphQL query fetches 50 posts with their authors and makes 51 database queries (one for the list plus one per author). What is this called, and what is a common fix?"
options = ["Deadlock; add a database lock", "The N+1 query problem; batch with DataLoader or use a join/preload", "Race condition; add a mutex", "Cache stampede; add a TTL"]
explanation = "This is N+1: one list query triggers N child queries. Request-level batching with DataLoader or a join/preload can reduce this to a small number of queries."


[modules.web-api-lead]
title = "API Architecture & Technical Leadership"
description = "Make API decisions across teams: compatibility, operations, governance, security, and migration trade-offs."
lesson = '''### Leading API decisions across teams
At senior and lead levels, API design includes the operating model and migration path, not only endpoint shapes. A technically clean contract can still fail if dozens of consumers cannot migrate together. Prefer additive changes, make ownership explicit, and measure actual usage before removing a field or version.

| Decision | Useful default | Watch for |
|---|---|---|
| Breaking contract change | Keep the old version stable; introduce a new version and migration window | A version header alone does not make incompatible behavior safe |
| Quota and rate limit | Apply limits per tenant/API key and plan | IP-only limits can penalize users behind shared NAT |
| Shared caching | Cache public, non-personalized representations at a CDN | Never serve one user's response to another user |
| Service retries | Use deadlines, bounded retries, backoff, jitter, and idempotency | Retries at multiple layers can amplify an outage |
| Authorization | Check access to each object at the data boundary | An unpredictable identifier does not prevent BOLA/IDOR |

For a public API used by many partners, announce deprecation early, expose machine-readable `Deprecation`/`Sunset` signals, publish migration guidance, and track traffic by consumer. For example, retain `/v1` while `/v2` adopts a new field shape; remove `/v1` only after the announced window and measured migration progress support it. A common mistake is treating email notice as a compatibility strategy.

### Review checklist for an API change
1. Is the change breaking (removed/renamed field, changed type, stricter validation, changed status semantics)?
2. Are retries safe: which methods are idempotent, and which writes need an `Idempotency-Key`?
3. Do errors follow a consistent format such as RFC 9457 without exposing internals?
4. Are body size, page size, query depth, and timeouts bounded?
5. Is authorization checked for every object, not just at the route?
6. Are endpoint-level 4xx/5xx rates, p95/p99 latency, 429 rates, and request IDs observable?
7. Is there a migration plan and a clear retirement date for existing consumers?

### A short ADR example
- **Context**: 40 partners integrate with the API; migrations cannot happen at once; a five-person team supports it.
- **Decision**: keep `/v1` stable, add fields there only when additive, and create `/v2` for breaking changes; publish a `Sunset` signal well ahead of retirement (for example, six months, subject to contracts).
- **Consequences**: maintain two versions during the transition, in exchange for avoiding unannounced partner outages.

### Team-scale anti-patterns
- Hot-patching a contract without notice because a change seems small.
- Applying one hard rate limit to internal clients and paying partners alike.
- Caching responses with `Set-Cookie` or personal data in a shared CDN.
- Retrying without backoff and turning a slow server into a retry storm.
- Leaving deprecation without an owner or an end date.
- Failing to record decisions, then losing the rationale a few months later.
'''

[questions.web-api-lv001]
prompt = "A five-person team operates a public API used by 40 partners, many without an actively maintained client. You need to change `price` from a number to an object `{amount, currency}` within three weeks. Which option is most reasonable?\n"
options = ["Change `/v1` immediately and email partners one day in advance", "Keep `/v1` unchanged, create `/v2` with the new shape, add `Deprecation`/`Sunset` headers to `/v1`, and allow a long migration window", "Force all partners to update their SDK by returning 400 for old requests next week", "Run two databases in parallel with a separate schema for each partner"]
explanation = "With consumers outside your control, a breaking change needs a new version and a migration window. Changing `/v1` directly or returning 400 would break partner integrations and create outages and support cost. Per-partner databases are expensive and do not solve the contract issue."

[questions.web-api-lv002]
prompt = "An API serves two groups: a free tier (~2,000 tenants) and an enterprise tier (~20 tenants under SLA contracts). One free tenant runs a scraping script that slows the whole system. You have two weeks and an existing Redis. What should you prioritize?\n"
options = ["Rate-limit by source IP across every endpoint", "Double the number of API instances", "Rate-limit by API key/tenant with tier-based quotas (Redis counters), return 429 with `Retry-After`, and separate queue/budget capacity for enterprise", "Block free accounts whenever p99 exceeds a threshold"]
explanation = "Per-tenant limits align with the commercial unit and use Redis already available. IP limits misclassify users behind shared NATs and can be bypassed with multiple IPs. More instances cost money without stopping one tenant from consuming resources. Blocking accounts is crude and invites disputes."

[questions.web-api-lv003]
prompt = "`GET /catalog` receives 90% of traffic; its data changes a few times per hour and is the same for everyone. The origin is overloaded at peak times. This sprint can change only HTTP and CDN configuration. What is the best choice?\n"
options = ["Set `Cache-Control: public, s-maxage=60, stale-while-revalidate=30` for catalog responses and use the CDN as the primary cache", "Set `Cache-Control: no-store` to keep data always current", "Set `private, max-age=3600` so each browser caches it", "Rewrite the endpoint in GraphQL so clients can choose fields"]
explanation = "The data is shared and a delay of several seconds is acceptable, so a shared CDN cache can substantially reduce origin load. `no-store` sends all traffic to the origin. `private` prevents CDN caching. GraphQL is outside the sprint constraint and may be harder to cache."

[questions.web-api-lv004]
prompt = "A payment service calls a partner API that sometimes times out. The client retries, and a previous incident charged a customer twice. The team is small, has a two-week deadline, and cannot change providers. Which measure addresses the root cause?\n"
options = ["Shorten the timeout so failures appear sooner", "Generate a stable `Idempotency-Key` for each payment operation, store results by key on the server, and retry with backoff using the same key", "Disable retries and ask users to click again", "Run a nightly reconciliation job and issue refunds manually"]
explanation = "POST is not idempotent, so a retry after a timeout can create a duplicate. An idempotency key makes retries safe. Disabling retries shifts failures to users and still permits double submissions; a shorter timeout increases ambiguous outcomes. Reconciliation is a safety net, not a replacement."

[questions.web-api-lv005]
prompt = "A penetration test finds that `GET /orders/{id}` returns another user's order when the `id` is changed. The release is in three days; a four-person team has 60 endpoints shaped like `/{resource}/{id}`. What is the best action?\n"
options = ["Change sequential IDs to UUIDs and consider the issue fixed", "Patch only this endpoint and leave the rest for next quarter", "Hotfix object-ownership checks here, then audit all 60 endpoints with a checklist/automated authorization tests and move the check into shared middleware or policy", "Add a WAF rule to block ID-changing patterns"]
explanation = "The root cause is missing object-level authorization (BOLA/IDOR). UUIDs make IDs harder to guess but do not replace permission checks. Fixing one endpoint leaves 59 similar risks. A WAF cannot infer data ownership rules. Hotfix first, then standardize the policy and automated checks."

[questions.web-api-lv006]
prompt = "You are preparing to deprecate `/v1/reports` after `/v2/reports` is available. Which actions belong in the plan?"
options = ["Send `Deprecation` and `Sunset` headers with a migration-documentation link in `/v1` responses", "Measure `/v1` traffic by consumer to identify who has not migrated", "Turn off `/v1` as soon as `/v2` launches to avoid maintaining two versions", "Communicate through multiple channels with a clear date, and retire only after contacting consumers still using it"]
explanation = "Deprecation needs machine-readable signals, per-consumer usage data, and a communicated timeline. Turning off v1 at v2 launch breaks consumers who have not migrated; the temporary cost of maintaining two versions is reasonable."

[questions.web-api-lv007]
prompt = "A team operating a public API wants to detect partner integration problems early. Which signals belong on a dashboard or in alerts?"
options = ["5xx rate and p95/p99 latency by endpoint", "429 rate by tenant to find incorrect quotas or faulty clients", "Number of new lines of code each week", "A sudden 4xx increase by client version/User-Agent, which may indicate a broken client release"]
explanation = "Latency and 5xx measure server health; 429 by tenant highlights rate-limit policy; 4xx by client version can reveal a partner release that violates the contract. Lines of code do not measure operational health."

[questions.web-api-lv008]
prompt = "When rejecting a tenant that exceeded its quota, the API should return status **{{blank}}** and the **{{blank}}** header to tell the client how many seconds to wait before calling again.\n"
explanation = "429 Too Many Requests is the standard rate-limit status. `Retry-After` tells the client when to retry instead of making it guess, reducing retry storms."

[questions.web-api-lv009]
prompt = "Write a short ADR for this decision: a public API needs a breaking contract change, but 40 partners cannot upgrade at once. State the context, decision, consequences, and alternatives rejected."
keywords = [["context", "constraints"], ["version", "v2"], ["sunset", "deprecation", "retirement date"], ["consequence", "trade-off", "cost"], ["measure", "metric", "traffic", "consumer"]]
model_answer = '''**Context**: 40 partners cannot upgrade simultaneously; the team is small; a breaking contract change is necessary.

**Decision**: keep the old version stable and introduce `v2` with the new contract; send `Deprecation` and `Sunset` headers for v1; measure traffic by consumer to identify partners who have not migrated; set a retirement date that can be adjusted for contractual needs.

**Consequences/trade-offs**: maintain two versions during migration and provide migration documentation and partner support; in return, avoid breaking integrations.

**Rejected alternatives**: change v1 directly (breaks partners), force upgrades with 400 responses (reputational risk), or build a separate system for each partner (too expensive).
'''
explanation = "A strong answer states the constraint, timeline, progress measure, and accepted cost."

[questions.web-api-lvc01]
title = "Tenant Plan Rate Limiter"
prompt = '''Implement `createLimiter(plans, now)` to return `check(tenant)` using a fixed 60-second window:
- `plans` is `{ free: 3, pro: 10 }` (requests per minute); `tenant = { id, plan }`; unknown plans use the `free` limit.
- `now()` returns the current time in milliseconds.
- Each tenant has its own counter. The window starts on that tenant's first request and lasts 60,000 ms, then resets.
- `check` returns `{ allowed: true, remaining }` (remaining after consuming this request), or, when over quota, `{ allowed: false, status: 429, retryAfter }`, where `retryAfter` is the number of seconds (rounded up) until the window ends.
'''
explanation = "This is a per-tenant fixed window. A production system might store counters in Redis with INCR + EXPIRE or use a token bucket to smooth window boundaries."
hints = ["Store `{ start, count }` for each tenant in a `Map`.", "Compute `retryAfter` as `ceil((start + 60000 - now) / 1000)`." ]

[questions.web-api-lv010]
prompt = "A company has a web app, a mobile app, and five B2B partners. The frontend needs six to eight endpoints for one screen; partners need a few stable resources and want CDN caching. The team has eight people. What is the most reasonable decision?\n"
options = ["Move everything to GraphQL and remove REST", "Keep public REST for partners and add a separate BFF (possibly GraphQL) for web/mobile to aggregate screen data", "Combine every resource in a `/everything` endpoint", "Move every client to gRPC-web"]
explanation = "The groups have different needs: first-party clients need aggregation, while partners need a simple cacheable contract. A BFF serves the first group without disrupting the second. Removing REST loses CDN benefits for partners; a huge endpoint is hard to cache and version; gRPC-web adds tooling cost for partners."

[questions.web-api-lv011]
prompt = "A system has web and mobile clients plus three internal services. Each service manages separate user credentials, leaving four password stores. A six-person team needs SSO within two months. What is a reasonable direction?\n"
options = ["Write another login service with a custom token", "Use OIDC/OAuth2 with an Identity Provider (self-hosted or managed), have internal services verify access tokens with public keys (JWKS), and migrate users gradually", "Share one user database and let every service read the user table directly", "Give every service the same symmetric JWT secret through environment variables"]
explanation = "Standard protocols and a mature identity provider reduce security risk and development time for a small team. Custom tokens invite cryptographic mistakes and maintenance. A shared database creates tight coupling. A shared symmetric secret lets every service sign tokens, so a compromise of one service compromises all."

[questions.web-api-lv012]
prompt = "Service A calls service B over HTTP. B has an outage for ten minutes and A immediately retries each request three times, preventing B from recovering. You need a low-cost way to reduce risk for all services this week. What should be prioritized?\n"
options = ["Increase retries to ten to guarantee success", "Standardize a shared client library with explicit timeouts, bounded retries with backoff and jitter, a retry budget, a circuit breaker, and retries only for idempotent operations", "Remove timeouts and wait for B to respond", "Let each team decide its own retry behavior"]
explanation = "Unbounded retries amplify load into a retry storm. A shared library is a low-cost organization-wide fix. More retries worsen the problem; removing timeouts exhausts threads/connections; independent team choices create inconsistent behavior."

[questions.web-api-lv013]
prompt = '''A PR changes `GET /users/{id}` from `{"name": "An"}` to `{"firstName": "An", "lastName": "Le"}`. The author says, “the mobile app will update later.” You can approve the change. What should you do?'''
options = ["Approve because the mobile app will update later", "Reject it and require a complete rewrite in GraphQL", "Keep `name` alongside the new fields, add contract tests, and remove `name` only after usage data shows no clients depend on it", "Approve but ask the author to deploy outside peak hours"]
explanation = "This is breaking because already-released apps still request the old field and users do not update immediately. Keeping the field while clients migrate is the safest low-cost approach. Deploying off-hours does not solve compatibility; a GraphQL rewrite is out of scope."

[questions.web-api-lv014]
prompt = "After enabling a CDN for an API, a customer reports seeing another user's data at `GET /me/dashboard`. The origin sends `Cache-Control: public, max-age=300`. What is your first response?\n"
options = ["Assume it is a browser bug and close the ticket", "Purge this route's cache immediately, change it to `Cache-Control: private, no-store` (or an appropriate `Vary`), inspect other personalized routes, and write a postmortem", "Reduce `max-age` to 60 seconds", "Disable the CDN across the entire system permanently"]
explanation = "A data leak is a security incident: contain it immediately (purge and fix headers), review its scope, and learn from it. Shortening max-age only reduces the exposure window. Permanently disabling the CDN is an excessive response that loses its benefits."

[questions.web-api-lv015]
prompt = "When standardizing API change reviews across an organization of 20 teams, which practices provide value that justifies their cost?"
options = ["Use OpenAPI as the source of truth and run breaking-change detection in CI", "Require every API PR to be manually approved by one person on the platform team", "Provide shared API guidance (naming, errors, pagination) and an automated linter", "Record ADRs for hard-to-reverse decisions such as versioning, authentication, and error formats"]
explanation = "CI automation and shared standards scale across teams. Requiring one person to approve every PR creates a bottleneck and a single point of failure."

[questions.web-api-lv016]
prompt = "You need to design rate limits/quotas for a public API with free and paid plans on a five-person team. Describe the key decisions and trade-offs."
keywords = [["by tenant", "api key", "per-tenant", "customer-based"], ["429", "retry-after"], ["redis", "counter", "token bucket", "sliding window"], ["burst", "controlled bursts"], ["header", "transparent", "ratelimit", "documentation"]]
model_answer = '''- **Limit unit**: use the API key/tenant to match commercial plans; optionally add an IP limit for unauthenticated endpoints.
- **Algorithm**: a token bucket permits short bursts while controlling the average rate; a fixed window is simpler but can allow boundary bursts. Store counters in Redis so instances share them.
- **Response**: return 429 with `Retry-After` and headers showing remaining quota so clients can self-throttle; document each plan's limits.
- **Tiers**: give paid plans separate quotas and apply lower limits to expensive endpoints.
- **Trade-off**: exact precision costs more; accept small inaccuracies in exchange for low latency.
'''
explanation = "A strong answer explains the limit unit, burst behavior, and signals that help clients adjust."

[questions.web-api-lvc02]
title = "Version Deprecation Policy"
prompt = '''Implement `resolveVersion(headers, policy, now)` to decide how to serve a request:
- `headers` may contain `x-api-version` (lowercase); if absent, use `policy.default`.
- `policy.versions` is an object such as `{ '1': { sunset: Date.UTC(2026,5,1) }, '2': {} }`; `sunset` is a timestamp in milliseconds or may be absent.
- `now` is the current timestamp in milliseconds.
- If the version is absent from `policy.versions`, return `{ status: 400, error: 'unsupported version' }`.
- If its `sunset` has passed (`now >= sunset`), return `{ status: 410, error: 'version sunset' }`.
- If `sunset` is in the future, return `{ status: 200, version, headers: { Deprecation: 'true', Sunset: <string in the format returned by new Date(sunset).toUTCString()> } }`.
- If the version has no `sunset`, return `{ status: 200, version, headers: {} }`.
'''
explanation = "Returning 410 Gone after sunset tells clients the version was intentionally removed. `Deprecation` and `Sunset` give them machine-readable advance notice."
hints = ["Convert the version to a string before looking it up in `policy.versions`.", "Check whether `sunset` has passed before returning the warning headers."]
