[modules.en-meetings]
title = "Meetings and Collaboration"
description = "Standups, sprint planning, retrospectives, expressing ideas, disagreeing politely, and confirming details."
lesson = '''
### Language for different meetings
| Situation | Natural phrase |
|---|---|
| Standup: yesterday | *Yesterday, I finished the retry logic.* |
| Standup: today | *Today, I’m going to add integration tests.* |
| Blocker | *I’m blocked by the staging credentials.* |
| Planning: estimate | *This looks like a two-point task, assuming the API stays unchanged.* |
| Expressing an opinion | *I’d suggest keeping the endpoint backward compatible.* |
| Gentle disagreement | *I see the benefit, but I’m concerned about the migration cost.* |
| Asking someone to repeat | *Sorry, could you repeat the last part?* |

In a retrospective, describe specific events instead of assigning blame: *The deploy took 40 minutes because the migration ran synchronously.* Then suggest a next step: *Could we test the migration on a copy of production data?* To agree with nuance, use *That makes sense because…*; to disagree, explain the risk and offer an alternative. If you did not hear something, ask for a repeat or restate what you understood: *So the new limit applies to each user, correct?* Do not just say *yes* if something is still unclear.
'''

[questions.en-x009]
prompt = "Which standup sentence describes a blocker naturally?"
explanation = "Use the structure *be blocked by* + cause."

[questions.en-x010]
prompt = "You disagree with a proposal to store full logs because they could expose sensitive data. Which opening is constructive?"
explanation = "Acknowledging the goal before stating a specific risk helps keep the discussion focused on a solution."

[questions.en-x011]
prompt = "You want to confirm that the limit of 100 requests applies to each user. Which sentence is appropriate?"
explanation = "Restating an assumption and asking for confirmation helps prevent misunderstandings."

[questions.en-x031]
prompt = "In a retrospective, which statement describes a problem in terms of the process instead of blaming someone?"
explanation = "A specific observation and a suggested improvement help the team learn from an incident without attacking an individual."

[questions.en-x041]
prompt = "In sprint planning, choose the estimates that state a condition or assumption clearly."
explanation = "Stating assumptions and splitting work into smaller tasks help the team evaluate an estimate."

[questions.en-x042]
prompt = "Choose the useful statements for a standup or retrospective."
explanation = "The useful statements describe progress, a blocker, or an evidence-based improvement; personal attacks do not help solve the problem."

[questions.en-x051]
prompt = '''Complete the standup update:

“Yesterday I {{blank}} the retry logic. Today I'm going to {{blank}} integration tests. I'm {{blank}} by the staging credentials.”
'''
explanation = "Use the past tense for yesterday's work, *be going to* for today's plan, and *be blocked by* for an obstacle."

[questions.en-x052]
prompt = '''Ask someone to repeat a point from the meeting:

“Sorry, could you repeat the last {{blank}}?”
'''
explanation = "This is a short, polite request that identifies which part you missed."

[questions.en-x065]
prompt = "During sprint planning, write 3–5 sentences in English agreeing that caching may improve speed, raising a concern about stale data, asking to clarify the freshness requirement, and suggesting a next step.\n"
explanation = "State a benefit and risk, ask a clarifying question, and propose an action to keep disagreement collaborative."

[questions.en-x066]
prompt = "Write 3–5 sentences for a retrospective about a migration that made a deploy take longer. Describe the event and its impact without blaming an individual, then suggest an improvement with an owner.\n"
explanation = "Describe the observed impact and cause, then turn them into an action item with an owner."

[questions.en-x084]
prompt = "Complete the blocker update: “The release is blocked {{blank}} missing staging credentials.”"
explanation = "Use *blocked by* + cause to name what is preventing work from continuing."

[modules.en-code-review]
title = "Code Review and Bug Reports"
description = "Writing clear review comments, PR descriptions, commit messages, and reproducible bug reports."
lesson = '''
### Keep review comments focused on the code
| Severity | Example | Meaning |
|---|---|---|
| Nit | *Nit: could we rename this to `userCount` for consistency?* | A minor suggestion that does not block merging |
| Suggestion | *Could we move this validation into the service so both callers use it?* | A proposed improvement |
| Blocking | *This can expose another user’s data. Please check ownership before merging.* | An issue that must be fixed before merging |

Explain **why** and suggest a way to fix the issue when possible. Write *This branch misses the empty-list case* instead of *You forgot…*; critique the change, not its author. A PR description usually includes **What**, **Why**, and **How to test**, plus screenshots or a changelog when useful. A bug report includes a title, environment, numbered reproduction steps, expected behavior, and actual behavior. Make the steps specific enough for someone else to follow; separate observations from guesses about the cause. Use a Conventional Commits header such as *fix(auth): reject expired sessions*; use the base form of the verb and omit a final period.
'''

[questions.en-x012]
prompt = "You found a change that could let a user read someone else's data. Which comment correctly marks it as blocking?"
explanation = "A security risk should be described specifically and addressed before merging; review comments should not attack the author."

[questions.en-x013]
prompt = "A minor naming issue does not affect behavior or block merging. Which word should begin the comment?"
explanation = "*Nit* signals a minor suggestion that usually does not have to be fixed before merging."

[questions.en-x014]
prompt = "Which bug report best helps a teammate reproduce the issue?"
explanation = "A good report includes the environment, reproduction steps, expected behavior, and actual behavior."

[questions.en-x032]
prompt = "Choose the review suggestion that gives a reason and a way to improve the code."
explanation = "The comment focuses on the code and gives a specific suggestion and reason."

[questions.en-x043]
prompt = "Choose the constructive code review comments."
explanation = "A good comment describes severity, impact, and reasoning without attacking the author."

[questions.en-x044]
prompt = "Choose the useful parts of a PR description."
explanation = "What, Why, How to test, and compatibility notes help reviewers evaluate a change."

[questions.en-x053]
prompt = '''Add a label for a minor suggestion that does not block merging:

“{{blank}}: could we rename this variable for consistency?”
'''
explanation = "*Nit* signals a minor suggestion; do not use it for a blocking issue."

[questions.en-x054]
prompt = '''Fill in the names of the two parts of a bug report:

- {{blank}} behavior: what should happen
- {{blank}} behavior: what actually happens
'''
explanation = "Expected behavior is what should happen; actual behavior is what was observed."

[questions.en-x067]
prompt = "Write a PR description in English for a bug fix: two concurrent requests updating a cart could overwrite each other. State What, Why, how to test, and the expected result.\n"
explanation = "Describing the cause, fix, test, and result helps reviewers understand both the change and its rationale."

[modules.en-docs-writing]
title = "READMEs and Technical Documentation"
description = "Write READMEs, ADRs, and technical explanations in plain English, using active voice and scannable structure."
lesson = '''
### Write so readers can get things done
A README usually answers: What does the project do? What are its requirements? How do I install, run, and test it? Where can I get help? An ADR records **Context**, **Decision**, and **Consequences**; explain the chosen decision and its trade-offs, not just list the alternatives.

| Wordy or unclear | Plain English |
|---|---|
| *The cache is invalidated by the service.* | *The service clears the cache.* |
| *In order to run the tests, execute…* | *To run the tests, execute…* |
| *It should be noted that the token expires…* | *The token expires…* |

Prefer the active voice when the actor matters: *The worker retries the job twice.* Use the passive when the actor is unknown or unimportant: *The token is stored securely.* A paragraph should cover one idea; name sections after the questions readers need answered. Explain a term once, use short examples with realistic data, and distinguish requirements from recommendations. Avoid long, formal words when a familiar verb expresses the same idea clearly.
'''

[questions.en-x015]
prompt = "Choose the concise active-voice sentence describing a worker retrying a job."
explanation = "The active sentence names the actor and action clearly."

[questions.en-x016]
prompt = "What should the Consequences section of an ADR describe?"
options = ["Only the author's name.", "The benefits and trade-offs that result from the decision.", "The entire source code.", "A translation of the title."]
explanation = "An ADR records positive and negative consequences so readers understand the cost of the decision."

[questions.en-x017]
prompt = "Which sentence uses the clearest plain English?"
explanation = "Familiar words and specific verbs are often easier to read than long, nominalized sentences."

[questions.en-x033]
prompt = "What should a README for new users put near the beginning to help them get started quickly?"
options = ["The installation steps and the basic run/test commands.", "The history of every commit.", "A list of every bug the project has ever had.", "A long biography of the author."]
explanation = "Readers need the requirements, installation steps, and run instructions before other details."

[questions.en-x045]
prompt = "Choose the techniques that make technical documentation easier to scan and understand."
explanation = "Clear headings, concise sentences, and concrete examples help readers complete a task."

[questions.en-x055]
prompt = '''Complete the README headings that help new users get started:

- {{blank}}: required tools and versions
- {{blank}}: commands to verify the change
'''
explanation = "A README should state the environment requirements and how to run tests."

[questions.en-x056]
prompt = '''Rewrite the passive sentence in the active voice:

“The service {{blank}} the token {{blank}}.”
'''
explanation = "The active sentence clearly names the service as the actor; *securely* describes how it stores the token."

[questions.en-x068]
prompt = "Write a Quick start section in English for a hypothetical CLI tool. State its purpose, the Node.js prerequisite, the installation command, the run command, and how to run tests. Use short, active sentences.\n"
explanation = "A good quick-start guide states prerequisites and specific commands; active sentences tell readers what to do."

[modules.en-interview]
title = "Technical Interviews"
description = "Use STAR, describe projects and system designs, ask thoughtful questions, and discuss offers in English."
lesson = '''
### Give structured answers
For behavioral questions, use **STAR**: Situation, Task, Action (what you did), and Result. Be specific about **I** to make your individual contribution clear; use numbers only when they are real. When describing a project, start with the user or problem, then explain the architecture, decisions, trade-offs, and outcome.

In a system design interview, clarify requirements first: *How many daily active users should we support?* Then summarize assumptions, the API, data model, main flow, bottlenecks, and failure handling. If you need time to think, say *Let me think through the trade-offs* instead of going silent. If the question is unclear, confirm its scope.

Ask the interviewer about success criteria, the review process, on-call operations, and how the team makes decisions. When negotiating an offer, say thank you, show interest, explain the basis for your request, and ask about the overall package: *Based on the role and my experience, is there flexibility in the base salary?* Do not invent metrics or competing offers; ask for time to consider the offer if needed.
'''

[questions.en-x018]
prompt = "In a STAR answer, what should the Action section emphasize?"
options = ["The specific things you did.", "The company's entire history.", "Only what the team plans to do.", "A list of technologies with no context."]
explanation = "STAR makes your individual actions and results clear instead of describing only what the team did in general."

[questions.en-x019]
prompt = "At the start of a system design interview, which step helps prevent designing for the wrong scope?"
options = ["Choose a database immediately.", "Ask about user count, expected load, and functional requirements.", "Draw every service you have ever used.", "Wait for the interviewer to state every assumption."]
explanation = "Clarify requirements and assumptions before choosing an architecture."

[questions.en-x020]
prompt = "You received an offer and want to ask whether the base salary is negotiable. Which sentence is professional?"
explanation = "Giving a reason and asking an open question starts a respectful, clear negotiation."

[questions.en-x034]
prompt = "Which question helps you understand how the team operates?"
explanation = "A specific question about code review and on-call incidents helps you understand the team's real working practices."

[questions.en-x046]
prompt = "In a system design interview, choose the useful steps to take before settling on an architecture."
explanation = "Clarifying scale, stating assumptions, and explaining trade-offs make the design well-grounded."

[questions.en-x057]
prompt = '''Complete the STAR sequence:

Situation → Task → {{blank}} → Result
'''
explanation = "Action describes what the candidate did to address the task."

[questions.en-x058]
prompt = '''Complete the question about the on-call process:

“Could you tell me how the team {{blank}} on-call incidents?”
'''
explanation = "Both *handles incidents* and *responds to incidents* are natural phrases."

[questions.en-x069]
prompt = "Answer in English using STAR: “Tell me about a challenging bug you fixed.” Include the situation, task, main actions you took, a measurable result, and what you learned.\n"
explanation = "STAR keeps your answer specific and helps the interviewer see your individual contribution and its result."

[questions.en-x070]
prompt = "Describe a technical project in English in 4–6 sentences: the user problem, your role, the architecture/API, one trade-off, and the result.\n"
explanation = "A clear project story connects the need, your individual work, the technical decision, and the result."

[questions.en-x071]
prompt = "Explain in English how you would begin designing a large-scale webhook processing service. Include clarifying questions, assumptions or load, the API or data model, bottlenecks, and failure handling.\n"
explanation = "Stating assumptions, the data flow, and failure handling helps the interviewer follow your design reasoning."

[questions.en-x072]
prompt = "Write 4–6 sentences in English to close an interview: thank the interviewer, ask a question about code review/on-call, and politely ask whether the base salary is flexible given your experience and the role's scope.\n"
explanation = "Ask about how the team works and negotiate using specific reasons in a respectful tone."

[modules.en-pronunciation]
title = "Technical English Pronunciation"
description = "Practice stress in technology terms, final -s/-ed sounds, acronym pronunciation, and clear connected speech."
lesson = '''
### Technical terms and common American stress patterns
| Term | Reference IPA | Note |
|---|---|---|
| develop | /dɪˈvɛləp/ | stress on the second syllable |
| component | /kəmˈpoʊnənt/ | stress on the second syllable |
| database | /ˈdeɪtəˌbeɪs/ | usually stressed at the beginning; *data* also has the variant /ˈdætə/ |
| cache | /kæʃ/ | rhymes with *cash* |
| queue | /kjuː/ | one syllable |
| GUI | /ˌdʒiː juː ˈaɪ/ or /ˈɡuːi/ | say the letters or “goo-ee” |
| SQL | /ˌɛs kjuː ˈɛl/ or /ˈsiːkwəl/ | both “ess-cue-ell” and “sequel” are used |
| Linux | /ˈlɪnəks/ | usually stressed on the first syllable in the US |
| algorithm | /ˈælɡəˌrɪðəm/ | primary stress on the first syllable |
| architecture | /ˈɑːrkɪˌtɛktʃər/ | primary stress on the first syllable |

The **-s** ending is pronounced /s/ after a voiceless sound (*tests*), /z/ after a voiced sound (*builds*), and /ɪz/ after a sibilant (*branches*). The **-ed** ending is pronounced /t/ (*fixed*), /d/ (*merged*), or /ɪd/ (*tested*), depending on the final sound of the base verb. Do not drop final sounds or add an unnecessary syllable. In connected speech, *check it* may flow together, but both words should still be recognizable. Some IPA transcriptions vary by region; aim for consistent, clear pronunciation rather than one required accent.
'''

[questions.en-x021]
prompt = "In common pronunciation, which word does *queue* sound like?"
explanation = "*Queue* is pronounced /kjuː/, the same as *cue*."

[questions.en-x022]
prompt = "In common American English, which syllable is stressed in *component*?"
options = ["The first syllable: COM-ponent.", "The second syllable: com-PO-nent.", "The third syllable: compo-NENT.", "All three syllables are stressed equally."]
explanation = "*Component* usually has primary stress on the second syllable."

[questions.en-x023]
prompt = "Which stress pattern is correct for *develop*?"
options = ["DE-velop", "de-VEL-op", "devel-OP", "Stress all three syllables equally"]
explanation = "*Develop* is stressed on the second syllable: /dɪˈvɛləp/."

[questions.en-x024]
prompt = "Which pronunciations of the acronym SQL are accepted?"
options = ["Only “sequel.”", "Only the letter names “ess-cue-ell.”", "Both “ess-cue-ell” and “sequel” are used.", "Like the word “school.”"]
explanation = "SQL has two common pronunciations; a team can choose one and use it consistently."

[questions.en-x059]
prompt = '''Fill in the pronunciation of the -ed ending using IPA:

- fixed: /{{blank}}/
- merged: /{{blank}}/
- tested: /{{blank}}/
'''
explanation = "The -ed ending is /t/ after a voiceless sound, /d/ after a voiced sound, and /ɪd/ after /t/ or /d/."

[questions.en-x060]
prompt = '''Fill in the final sound of the plural -s ending:

- tests: /{{blank}}/
- builds: /{{blank}}/
- releases: /{{blank}}/
'''
explanation = "The ending depends on the final sound of the base word: voiceless /s/, voiced /z/, or an extra syllable /ɪz/ after a sibilant."

[questions.en-x077]
prompt = "In common American English, where is the primary stress in *algorithm*?"
options = ["The first syllable: AL-go-rithm.", "The second syllable: al-GO-rithm.", "The third syllable: algo-RITHM.", "All three syllables are stressed equally."]
explanation = "*Algorithm* usually has primary stress on the first syllable: /ˈælɡəˌrɪðəm/."
