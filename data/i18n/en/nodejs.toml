  '''server.close() doesn't work with HTTP''',
  '''Node can't handle SIGTERM''',
  '''Kubernetes always sends SIGKILL first''',
]
explanation = '''Removing the endpoint from the Service/LB is not instantaneous; mark readiness as failed, wait a few seconds (preStop/sleep) and only then close the listener. Keep-alive connections must also be closed after draining.'''

[questions.nodejs-lv034]
prompt = '''Node's `--max-old-space-size` flag sets V8's old-space heap limit. What is the unit of `1024` in `node --max-old-space-size=1024 server.js`? Fill in: {{blank}}'''
explanation = '''The value is in megabytes (MB).'''

[questions.nodejs-lv035]
prompt = '''You use cluster/PM2 with 4 workers, but each worker keeps its own rate-limit counter in RAM. What is the consequence?'''
options = [
