  '''Wait forever because TCP will report the error itself''',
  '''Use setInterval to check every second''',
  '''Wrapping fetch in try/catch is enough''',
]
explanation = '''AbortSignal.timeout(ms) (or an AbortController) cancels the request when the deadline passes; always set a timeout on outbound calls.'''

[questions.nodejs-lv037]
prompt = '''Which headers are directly involved in conditional HTTP caching (conditional requests)?'''
explanation = '''ETag/If-None-Match and Last-Modified/If-Modified-Since enable 304 Not Modified. Content-Length and Host are not validator mechanisms.'''

[questions.nodejs-lv038]
prompt = '''An API accepts POST to create orders; the network causes the client to resend the same request. What is the most standard way to prevent duplicate orders?'''
