  '''Keep writing because data will be dropped if overloaded''',
  '''Call end() immediately''',
  '''Raise highWaterMark to infinity''',
]
explanation = '''false means the internal buffer exceeded highWaterMark; pause writing until the 'drain' event to apply backpressure. Ignoring it makes RAM balloon.'''

[questions.nodejs-lv026]
prompt = '''Which function in `node:stream/promises` connects streams, propagates errors and destroys them on failure? Fill in: await {{blank}}(readable, transform, writable)'''
explanation = '''pipeline from stream/promises returns a Promise and handles cleanup on error.'''

[questions.nodejs-lv027]
prompt = '''You want to read a 5GB log file and count lines containing 'ERROR' with only 512MB of RAM. Which approaches are suitable?'''
options = [
  '''fs.createReadStream combined with readline.createInterface''',
  '''for await (const line of rl) with a counter''',
  '''fs.readFileSync then split('\n')''',
  '''fs.promises.readFile then filter''',
  '''Read chunks with a stream and handle line boundaries yourself''',
]
explanation = '''Use streams (createReadStream + readline, or for await over an async iterable) to process in chunks. readFile loads everything into RAM and can exceed the limit.'''

[questions.nodejs-lv028]
prompt = '''A Node.js pod is OOMKilled after a few hours, and the heap grows steadily after each GC. What does this suggest and what is the first diagnostic step?'''
options = [
  '''A memory leak; take and compare heap snapshots to find the retainers''',
  '''The event loop is too fast; add setTimeout''',
  '''You need to call global.gc() every second''',
  '''Just double the pod memory limit''',
]
explanation = '''A heap that keeps growing after GC is a sign of a leak (objects still referenced). Take two heap snapshots some time apart and compare them (retainers) to find the growing objects. More RAM only delays it; manual GC does not fix live references.'''

[questions.nodejs-lv029]
prompt = '''A Map used as a cache keyed by userId has no size limit and no TTL. What is the long-term problem and how do you fix it?'''
options = [
  '''Memory grows without bound; use an LRU/TTL with a max size or an external cache''',
  '''Map automatically deletes old keys when GC runs''',
  '''It only fails with Map; a plain object is fine''',
  '''No problem, because V8 compresses memory''',
]
explanation = '''An unbounded cache is a logical leak: the number of keys keeps growing. Use an LRU/TTL with a max size or an external cache such as Redis. WeakMap doesn't help when keys are strings/numbers.'''

[questions.nodejs-lv030]
prompt = '''How does Express 5+ handle async handlers when the Promise rejects?'''
options = [
  '''The error is automatically forwarded to the error-handling middleware''',
  '''The process always crashes immediately''',
  '''The error is swallowed and the request hangs forever''',
  '''It only works with the express-async-errors library''',
]
explanation = '''Since Express 5, if a handler/middleware returns a rejected Promise (or an async function throws), the error is passed to next(err) automatically, so you don't need try/catch just to call next. In Express 4 you had to catch it yourself.'''

[questions.nodejs-lv031]
prompt = '''Middleware registration order in Express: where should the 4-argument error handler (err, req, res, next) go?'''
options = [
  '''After the routes and other middleware''',
  '''Before every route''',
  '''Anywhere, because Express reorders them''',
  '''Only in the app.listen file''',
]
explanation = '''Error-handling middleware must be registered after the routes/middleware whose errors it should catch; Express recognizes it by its 4 parameters.'''

[questions.nodejs-lv032]
prompt = '''Which measures help an Express API resist overly large or slow requests that exhaust resources?'''
options = [
  '''express.json({ limit: '100kb' })''',
  '''Setting sensible server.requestTimeout/headersTimeout''',
  '''Rate limiting by client identity''',
  '''Disabling all validation to process faster''',
  '''Allowing unlimited bodies''',
]
explanation = '''Limit body size, set server/request timeouts, and rate limit. Disabling validation or removing limits makes things worse.'''

[questions.nodejs-lv033]
prompt = '''On SIGTERM in Kubernetes, `server.close()` is called but the pod still receives new requests for the first few seconds. What is the common cause?'''
options = [
