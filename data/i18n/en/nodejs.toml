[modules.node-core]
title = '''Runtime & Event Loop'''
description = '''libuv, event loop phases, nextTick vs. microtasks vs. setImmediate, worker_threads, and cluster.'''
lesson = '''
### Key ideas
- Node runs JavaScript on a **single thread** (V8) and uses **libuv** (a default four-thread pool for fs, dns.lookup, crypto, and zlib).
- Event loop phases: **timers** → pending callbacks → poll (I/O) → **check** (`setImmediate`) → close callbacks.
- After **each callback**, Node drains the `process.nextTick` queue, then runs **Promise microtasks**.
- Inside an I/O callback, `setImmediate` always runs before `setTimeout(fn, 0)`.
- CPU-heavy work blocks the event loop. Use **worker_threads** for CPU-bound work; use **cluster** or multiple processes (PM2, containers) to use multiple cores for a server.
- **ESM** (`import`, `"type": "module"`, top-level await) vs. **CommonJS** (`require`, `module.exports`).
- Recent Node versions include `fetch`, `node:test`, `--watch`, `--env-file`, and `AbortSignal.timeout()`.
'''

[questions.node-001]
prompt = '''What is the output order in Node.js (a directly executed CommonJS file)?

```js
setTimeout(() => console.log('timeout'), 0);
setImmediate(() => console.log('immediate'));
Promise.resolve().then(() => console.log('promise'));
process.nextTick(() => console.log('nextTick'));
console.log('sync');
```
'''
options = [
  '''sync, nextTick, promise, then timeout/immediate (the order of the last two is not guaranteed in the main module)''',
  '''sync, promise, nextTick, timeout, immediate''',
  '''nextTick, sync, promise, immediate, timeout''',
  '''sync, timeout, immediate, nextTick, promise''',
]
explanation = '''The nextTick queue runs before Promise microtasks. In the main module, `setTimeout 0` and `setImmediate` depend on when the event loop starts; inside an I/O callback, `setImmediate` always runs first.'''

[questions.node-002]
prompt = '''A Node API computes a bcrypt hash synchronously (`bcrypt.hashSync`) for every request. What is the problem?'''
options = [
  '''There is no problem because Node is multithreaded''',
  '''It blocks the event loop, making every other request wait; use the asynchronous version (which runs on the thread pool) or worker_threads''',
  '''It causes a memory leak''',
  '''It is only slow on Windows''',
]
explanation = '''The golden rule is: “Don't block the event loop.”'''

[questions.node-003]
prompt = '''What is the difference between `worker_threads` and `cluster`?'''
options = [
  '''They are the same''',
  '''`worker_threads`: multiple threads in one process that can share memory (`SharedArrayBuffer`), suited to CPU-bound work; `cluster`: multiple processes sharing a server port, suited to scaling HTTP across cores''',
  '''`cluster` only runs on Linux''',
  '''`worker_threads` is for reading files''',
]
explanation = '''In a container or Kubernetes deployment, it is common to run one process per container and scale with replicas.'''

[questions.node-004]
prompt = '''Which statements about ES Modules in Node.js are correct?'''
options = [
  '''They can be enabled with the `.mjs` extension or `"type": "module"` in package.json''',
  '''They support top-level `await`''',
  '''They provide `__dirname` automatically, as CommonJS does''',
  '''Relative imports must include the file extension (`./db.js`)''',
  '''`require()` is always available in an ESM file''',
]
explanation = '''In ESM, use `import.meta.dirname` or `import.meta.url`. To call `require` from ESM, use `createRequire`.'''

[questions.node-005]
prompt = '''Cancel `fetch` if it takes longer than 3 seconds (Node 18+):

```js
const res = await fetch(url, { signal: AbortSignal.{{blank}}(3000) });
```
'''
explanation = '''The thrown error has `name === 'TimeoutError'`.'''

[questions.node-006]
prompt = '''Explain how Node.js can handle many concurrent connections even though JavaScript runs on a single thread.'''
keywords = [
  ["event loop"],
  ["non-blocking", "asynchronous", "async"],
  ["libuv", "thread pool", "epoll", "kqueue", "operating system"],
  ["callback", "promise"],
  ["i/o"],
]
model_answer = '''Node uses **non-blocking I/O** coordinated by the **event loop**. When it encounters I/O (such as network or file operations), Node delegates the work to the operating system (epoll/kqueue/IOCP) or **libuv's thread pool**, then continues handling other requests. When the I/O completes, a **callback or Promise** is queued for the event loop to run.

Because a web server spends most of its time waiting for I/O, one JavaScript thread can serve thousands of connections. The limitation is **CPU-heavy** work, which blocks the event loop; use worker_threads or a separate service for that work.
'''
explanation = '''This is a classic Node.js interview question.'''

[questions.node-007]
title = '''Promisify a callback-style API'''
prompt = '''Write `promisify(fn)`, similar to `util.promisify`: convert an **error-first** callback function `fn(...args, (err, value) => {})` into a function that returns a Promise.
- Preserve `this`.
- If `err` is truthy, reject; otherwise, resolve with `value`.
- If `fn` throws synchronously, reject.
'''
explanation = '''Modern Node.js provides promise-based versions of most APIs (`fs/promises`, `timers/promises`).'''
hints = [
  '''Return `function (...args)` (not an arrow function) to preserve `this`.''',
  '''Append the callback to the argument list.''',
]

[modules.node-io]
title = '''Streams, Buffers & I/O'''
description = '''Readable/Writable/Transform, backpressure, pipeline, Buffer, fs/promises, and EventEmitter.'''
lesson = '''
### Key ideas
- **Streams** process data in chunks, keeping memory use steady when handling large files.
- Four types: Readable, Writable, Duplex, and Transform.
- **Backpressure**: `write()` returns `false` when the buffer is full, so wait for the `'drain'` event. `stream.pipeline()` handles backpressure, errors, and cleanup automatically (and is preferable to `.pipe()`).
- **Buffer** stores binary data outside the V8 heap (`Buffer.from('hi')`, `buf.toString('base64')`).
- For an `EventEmitter`, emitting `'error'` without a listener **throws an error and can crash the process**.
- Use `fs/promises` with `async/await`; avoid `fs.readFileSync` in a request handler.
'''

[questions.node-020]
prompt = '''Why stream a 2 GB file instead of calling `fs.readFile` and then `res.end(data)`?'''
options = [
  '''`readFile` cannot read files larger than 1 MB''',
  '''`readFile` loads the entire file into RAM; a stream processes chunks, using less memory and letting the client receive data sooner''',
  '''Streams always compress data''',
  '''There is no difference''',
]
explanation = '''`pipeline(fs.createReadStream(path), res)` handles backpressure and errors automatically.'''

[questions.node-021]
prompt = '''What is “backpressure” in a stream?'''
options = [
  '''An error that occurs when a stream is closed''',
  '''A mechanism that tells the data source to stop writing when the destination is slower (`write()` returns false, so wait for `'drain'`)''',
  '''Data compression''',
  '''Writing data in reverse''',
]
explanation = '''Ignoring backpressure can make the buffer grow until the process runs out of memory.'''

[questions.node-022]
prompt = '''An EventEmitter emits an `'error'` event without any listener. What happens?'''
options = [
  '''The event is ignored''',
  '''The error is thrown; if it is not caught, the process can crash''',
  '''A warning is printed''',
  '''The operation is retried automatically''',
]
explanation = '''Always attach `.on('error', ...)` to a stream or emitter, or use `pipeline` or `events.once`.'''

[questions.node-023]
prompt = '''Safely connect streams (automatically destroy the streams and return an error if any step fails):

```js
import { {{blank}} } from 'node:stream/promises';
await {{blank}}(fs.createReadStream('in.log'), zlib.createGzip(), fs.createWriteStream('in.log.gz'));
```
'''
explanation = '''`stream/promises` provides a Promise-based version of `pipeline`.'''

[questions.node-024]
title = '''Process data in chunks (line splitter)'''
prompt = '''Simulate a Transform stream that splits lines. Write `createLineSplitter(onLine)` to return an object:
- `write(chunk: string)` — data arrives in **arbitrary chunks** (a line may be split across two chunks); call `onLine(line)` for each **complete line** (ending in `\n`, with a trailing `\r` removed if present).
- `end()` — if a non-empty remainder has no `\n`, call `onLine` with it.
'''
explanation = '''This is the logic behind `readline` and stream-based log or NDJSON parsers.'''
hints = [
  '''Keep the remainder in a buffer between calls to `write`.''',
  '''Split only at `\n` and keep the part after it.''',
]

[modules.node-express]
title = '''Express & API Architecture'''
description = '''Middleware, routers, error-handling middleware, async errors, validation, and project structure.'''
lesson = '''
### Key ideas
- **Middleware** `(req, res, next)` runs in registration order; it must call `next()` or finish the response.
- **Error-handling middleware** has **four parameters** `(err, req, res, next)` and should be registered **last**.
- In Express 5, errors and rejected Promises in `async` handlers are forwarded to error middleware automatically. In Express 4, wrap handlers with an `asyncHandler` or call `next(err)`.
- `express.json()` parses JSON request bodies; `express.Router()` splits routes into modules.
- Layering: route → controller → service → repository; validate input (with zod/joi) at the boundary.
- Security: use `helmet`, rate limiting, and a body-size limit; do not return stack traces in production.
'''

[questions.node-040]
prompt = '''How does Express identify error-handling middleware?'''
options = [
  '''The function name starts with `error`''',
  '''The function has **four parameters**: `(err, req, res, next)`''',
  '''It is registered with `app.error()`''',
  '''It is placed in an errors directory''',
]
explanation = '''It must also be registered **after** the other routes.'''

[questions.node-041]
prompt = '''A middleware neither calls `next()` nor sends a response. What happens?'''
options = [
  '''Express calls `next()` automatically''',
  '''The request hangs until the client times out''',
  '''A 404 response is returned''',
  '''A 500 response is returned''',
]
explanation = '''Every middleware must finish the request (`res.send/json/end`) or pass control with `next()`.'''

[questions.node-042]
prompt = '''In **Express 4**, what happens if an `async` handler throws (its Promise rejects)?'''
options = [
  '''The error is forwarded to error middleware automatically''',
  '''It is not caught: it can become an unhandled rejection and leave the request hanging; use `try/catch` with `next(err)` or a wrapper''',
  '''A 400 response is returned''',
  '''Express 4 does not support async functions''',
]
explanation = '''Express 5 automatically forwards rejected Promises to `next(err)`.'''

[questions.node-043]
prompt = '''Which measures help secure an Express API in production?'''
options = [
  '''Use `helmet()` to set security headers''',
  '''Limit body size with `express.json({ limit: '100kb' })`''',
  '''Return `err.stack` to the client to make debugging easier''',
  '''Rate-limit login endpoints''',
  '''Validate input with a schema (zod/joi)''',
]
explanation = '''Log stack traces on the server only.'''

[questions.node-044]
prompt = '''Read a route parameter and return 404:

```js
app.get('/users/:id', async (req, res) => {
  const user = await repo.find(req.{{blank}}.id);
  if (!user) return res.{{blank}}(404).json({ error: 'Not found' });
  res.json(user);
});
```
'''
explanation = '''`req.query` contains query-string values; `req.body` contains the body (and requires `express.json()`).'''

[questions.node-045]
title = '''Compose middleware (onion model)'''
prompt = '''Write `compose(middlewares)` like `koa-compose`: return a function `(ctx) => Promise`.
- Each middleware has the form `async (ctx, next) => {}`. Calling `await next()` runs the next middleware; code after `await next()` runs on the way back out (the **onion** model).
- If any middleware fails, the Promise rejects (so an outer middleware can catch the error with `try/catch`).
- If a middleware calls `next()` **twice**, reject with `Error('next() called multiple times')`.
'''
explanation = '''Koa uses this model. Express has a similar callback-style `next`, but does not provide an `await`-based return path.'''
hints = [
  '''Write a recursive `dispatch(i)` that calls middleware i with `next = () => dispatch(i + 1)`.''',
