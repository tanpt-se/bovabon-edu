[modules.nodejs-dv-http]
title = '''HTTP Server, Client & Headers'''
description = '''Node http/https/http2, request-response flow, socket reuse, timeouts, and correct header lifecycle handling.'''
lesson = '''
### HTTP as a request-response stream
The `node:http` module provides a low-level API for serving and sending HTTP/1.1. The `createServer` callback receives an `IncomingMessage` (Readable) and a `ServerResponse` (Writable); the body is delivered in chunks and is not automatically parsed as JSON. Call `write()` to send multiple chunks and `end()` to finish the response. Headers must be set before they are sent; use `headersSent` to avoid writing a status or headers a second time.

| Need | API | Note |
|---|---|---|
| HTTP/1.1 server | `http.createServer()` | Receives `req` and `res` streams |
| TLS server | `https.createServer()` | Configure the certificate and key for your infrastructure |
| HTTP/2 | `http2.createServer()` or `createSecureServer()` | Uses a different API/session from HTTP/1.1; TLS is typical on the public Internet |
| Outbound client | `http.request()` / `https.request()` | An Agent can reuse and limit sockets |

Example: `http.createServer((req, res) => { res.writeHead(200, {'content-type':'application/json'}); res.end(JSON.stringify({ok:true})); }).listen(3000)`.

For large files, do not collect the entire body in an unbounded string or Buffer; process it as a stream and preserve backpressure. Limit request sizes and configure `headersTimeout` and `requestTimeout` for the endpoint. `headersTimeout` limits how long headers may take to arrive; `requestTimeout` limits receipt of the entire request. A socket timeout is a separate concept. A client may disconnect, so handle errors and `close` events, and do not keep writing to a response that has already ended.

Common mistakes include calling `writeHead()` after `write()`, forgetting `end()`, assuming the request body is automatically a JSON object, or believing a socket timeout also limits body size. Express adds routing and middleware on top of the HTTP server, but understanding the stream, socket, and response lifecycle is still necessary.
'''

[questions.nodejs-dv008]
prompt = '''In the callback passed to `http.createServer`, what is `req`?'''
options = [
  '''A Readable stream representing the incoming request''',
  '''Already-parsed JSON''',
  '''The Writable stream for the response''',
  '''A worker thread''',
]
explanation = '''`IncomingMessage` is a Readable stream; the body may arrive in multiple chunks and must be read or piped.'''

[questions.nodejs-dv009]
prompt = '''You need to know whether a response has started sending headers to avoid setting the status again. Which property should you check?'''
options = [
  '''`res.headersSent`''',
  '''`res.writableEnded`''',
  '''`req.complete`''',
  '''`req.aborted`''',
]
explanation = '''`ServerResponse.headersSent` indicates whether the headers have been sent to the client.'''

[questions.nodejs-dv010]
prompt = '''What can a client-side HTTP Agent help with?'''
options = [
  '''Reusing sockets with keep-alive''',
  '''Limiting the number of concurrent sockets to an origin''',
  '''Retrying every failed request without considering idempotency''',
  '''Parsing JSON responses into objects''',
  '''Managing an outbound socket pool''',
]
explanation = '''An Agent manages client-side sockets and can reuse or limit them; retrying and parsing the response body are separate responsibilities.'''

[questions.nodejs-dv011]
prompt = '''After writing the body with `res.write()`, which method ends the response? `res.{{blank}}()`'''
explanation = '''`response.end()` signals that no more data will be written.'''

[questions.nodejs-dv012]
prompt = '''In Node, which module provides `createServer()` for an HTTPS server using TLS? `node:{{blank}}`'''
explanation = '''`node:https` wraps HTTP in TLS; configure the certificate and key appropriately.'''

[questions.nodejs-dv013]
prompt = '''You need to create an HTTP/2 server with TLS. Which API is correct?'''
options = [
  '''`https.createServer()`''',
  '''`http2.createSecureServer()`''',
  '''`http.createServer({ http2: true })`''',
  '''`net.createServer({ tls: true })`''',
]
explanation = '''`node:http2` provides `createSecureServer()` for HTTP/2 over TLS. It also has `createServer()` for unencrypted connections in suitable environments.'''

[questions.nodejs-dv014]
prompt = '''Describe the request-response lifecycle in Node core HTTP, then explain when you would choose HTTP/1.1, HTTPS, HTTP/2, or Express and what to consider with large bodies, timeouts, and client disconnections.'''
keywords = [
  ["incomingmessage", "readable stream", "request stream"],
  ["serverresponse", "writable stream", "response"],
  ["backpressure", "stream"],
  ["timeout", "headerstimeout", "requesttimeout"],
  ["https", "tls"],
  ["http2", "multiplexing"],
  ["express", "middleware"],
]
model_answer = '''In `node:http`, `IncomingMessage` is a Readable stream and `ServerResponse` is a Writable stream. The request body can arrive in chunks, and the response must be finished with `end()`. For a large body, I use streams to preserve backpressure instead of collecting everything in RAM, and I handle errors when the client disconnects. I configure `headersTimeout` and `requestTimeout` for the endpoint because they measure different periods of receiving data. I choose HTTPS when TLS is needed; HTTP/2 has its own API and session, while Express is useful for routing and middleware but still relies on the HTTP server.'''
explanation = '''A strong answer connects the abstractions to the real lifecycle and resource limits.'''

[questions.nodejs-dvc02]
title = '''Merge a Vary header'''
prompt = '''Write `mergeVary(current, field)`. `current` is the current Vary value (a string or `undefined`); `field` is one valid header name. Return the updated Vary string:
- Split the current list on commas, trim extra whitespace, and preserve its original order.
- Add `field` only if an equivalent name is not already present, comparing case-insensitively.
- If `current` already contains `*`, or if `field` is `*`, return `*`.
- If the list is empty, return `field`.

You do not need to validate header-name syntax.
'''
explanation = '''Vary describes which request headers affect the cached representation. A wildcard has special meaning and should not be combined like an ordinary header name.'''
hints = [
  '''Split `current` on commas, trim each name, and compare them in lowercase.''',
  '''Handle the wildcard before combining any other names.''',
]

[modules.nodejs-dv-express-prod]
title = '''Express Production Boundaries & Readiness'''
description = '''Configure a trusted reverse proxy, harden the application, and implement health checks and shutdown with request draining.'''
lesson = '''
### Trust the right reverse proxy and shut down in a controlled way
When Express runs behind a load balancer or reverse proxy, `X-Forwarded-*` headers can provide the original client IP, protocol, and hostname. Express uses this information according to the `trust proxy` setting. If the application trusts every connection but can also be reached directly from the Internet, a client may forge these headers and falsify `req.ip`, `req.protocol`, or `req.hostname`. Limit trust to proxies you control, and configure the edge proxy to overwrite headers supplied by clients.

| Concern | How to handle it | What to avoid |
|---|---|---|
| Proxy identity | Set `trust proxy` to match the actual subnet/hop topology | Setting it to `true` without controlling the network path |
| Liveness | Report whether the application/process is alive | Depending on every external service |
| Readiness | Stop accepting traffic during shutdown or when an essential dependency fails | Returning internal error details to the Internet |
| SIGTERM | Mark the app not ready, close the listener, drain requests, then close pools | Exiting immediately and cutting off in-flight requests |

Example configuration for a particular deployment network: `app.set('trust proxy', ['loopback', '10.0.0.0/8'])`. The list must match the real infrastructure; do not copy it unchanged if the proxy uses different subnets. Liveness only confirms that the process is still serving; readiness checks whether it can accept new work. On `SIGTERM`, first mark readiness as failed, then close the HTTP server to stop accepting connections and wait for in-flight requests, and finally close the database/message-broker pools. Add a deadline so the supervisor can terminate the process if draining gets stuck.

Production hardening also includes keeping Express and supported dependencies updated, using TLS at the proxy or application, Helmet/security headers, body limits, input validation, and risk-based rate limits. Monitor latency, errors, and saturation; do not log tokens or sensitive data. Common mistakes include setting `trust proxy=true` by copying a guide, making a readiness endpoint depend on too many services, or closing the DB pool before in-flight requests finish.
'''

[questions.nodejs-dv015]
prompt = '''Express runs behind a load balancer. Why must `trust proxy` match the actual topology?'''
options = [
  '''So Express can conditionally trust forwarded headers when determining the client IP, protocol, and hostname''',
  '''To automatically enable HTTPS between every service''',
  '''To replace authentication middleware''',
  '''To automatically limit request body size''',
]
explanation = '''`trust proxy` affects how Express interprets information forwarded by a proxy; trusting too broadly may allow clients to forge that information.'''

[questions.nodejs-dv016]
prompt = '''What is the main difference between liveness and readiness checks?'''
options = [
  '''Liveness reports whether the process is alive; readiness reports whether the instance can accept new traffic''',
  '''Readiness only runs during deployment, while liveness only runs locally''',
  '''Liveness must always query the database; readiness must never access a dependency''',
  '''Both endpoints must return the same status code''',
]
explanation = '''Readiness often switches to not-ready during shutdown or when an essential dependency fails. Liveness should avoid repeated restarts just because an external dependency is unavailable.'''

[questions.nodejs-dv017]
prompt = '''An Express application is behind a reverse proxy managed by your team. Which configuration reduces the risk of forged forwarded headers?'''
options = [
  '''The edge proxy removes or overwrites client-supplied `X-Forwarded-*` headers before setting trusted values''',
  '''Limit `trust proxy` to subnets/hops that match the topology''',
  '''Assume `req.ip` is always the original socket address under every configuration''',
  '''Ensure the app cannot be reached directly while relying on forwarded headers''',
  '''Always set `trust proxy=true`, even when the proxy chain is unknown''',
]
explanation = '''Limit both what Express trusts and the network paths into the app; incorrect trust settings may let clients forge IP or protocol information.'''

[questions.nodejs-dv018]
prompt = '''During a deployment, which sequence after receiving `SIGTERM` helps avoid cutting off requests already being processed?'''
options = [
  '''Mark readiness as failed, stop accepting new connections, drain in-flight requests, then close dependency pools''',
  '''Close the database first, then continue accepting HTTP requests''',
  '''Call `process.exit` immediately''',
  '''Ignore the signal and wait for the supervisor to send `SIGKILL`''',
]
explanation = '''Mark the app not ready first, then close the listener and let in-flight requests finish before closing dependencies.'''

[questions.nodejs-dv019]
prompt = '''Which measures are appropriate when hardening Express for production?'''
options = [
  '''Update the framework and dependencies through a supported process''',
  '''Limit body size and validate input at the boundary''',
  '''Return `err.stack` to the client to help with debugging''',
  '''Use security headers and rate limits appropriate to the endpoint''',
  '''Write access tokens verbatim to logs for reference''',
]
explanation = '''Do not expose stack traces or credentials in responses or logs. Updates, input limits, validation, and security headers reduce common risks.'''

[questions.nodejs-dv020]
prompt = '''The topology is fixed: the app only receives connections from one trusted reverse proxy. What hop-count value can be used in this configuration? `app.set('trust proxy', {{blank}})`'''
explanation = '''One hop matches the stated topology. If the path has a variable number of hops or the app can be reached directly, use a more specific proxy configuration.'''

[questions.nodejs-dv021]
prompt = '''Outline how to deploy Express securely behind a reverse proxy and how to handle shutdown during deployment. Include the trust boundary, forwarded headers, readiness/liveness, and the order for draining requests and closing dependencies.'''
keywords = [
  ["trust proxy", "trusted proxy"],
  ["forwarded headers", "x-forwarded-for", "x-forwarded-proto"],
  ["readiness", "not-ready"],
  ["liveness"],
  ["sigterm", "graceful shutdown", "shutdown"],
  ["drain", "in-flight requests"],
  ["close database", "close the pool"],
]
model_answer = '''I configure `trust proxy` for the actual subnet or hop count and ensure the edge proxy overwrites client-supplied forwarded headers. The application must not have a route that bypasses the proxy if it relies on those headers. Readiness switches to not-ready as deployment begins, while liveness only reports whether the process is still running. On `SIGTERM`, the app stops accepting new connections, drains in-flight requests, then closes database and message-broker pools; a deadline lets the supervisor terminate it if draining gets stuck. Health endpoints return only the minimum status and do not expose configuration or internal errors.'''
explanation = '''A good answer clearly identifies the trust boundary and shutdown order, and distinguishes readiness from liveness.'''

[questions.nodejs-dv022]
prompt = '''A health endpoint returns database error details, internal hostnames, and environment variables to every client. Which assessment is appropriate?'''
options = [
  '''Return only the minimum status needed by the probe; keep operational details in controlled telemetry or logs''',
  '''This is a good way for clients to repair the database themselves''',
  '''Add an access token so the probe can authenticate''',
  '''A health endpoint does not need content limits because it has no user data''',
]
explanation = '''An overly detailed public health endpoint creates another information exposure surface; probes only need the required status.'''

[modules.nodejs-lead]
title = "Tech Lead Perspective"
description = "Making architecture and operations decisions for Node.js at team scale: ADRs, trade-offs, rollout, incidents, cost."
lesson = '''
### A Tech Lead doesn't pick the "best technology" but the option that fits the team's constraints

A good decision answers four questions: **what the constraints are** (headcount, time, budget, acceptable risk), **which options are feasible**, **the trade-offs of each option**, and **how we will know we were wrong so we can back out**. An answer like "use X because X is modern" almost always leaves out the constraints.

#### Decision framework

1. Write down the problem and the criteria (P99 latency, delivery time, operating cost, team skills).
2. List 2–3 options, including "do nothing" or "do the smallest thing".
3. Score them against the criteria, noting risks and how to mitigate them.
4. Choose, write an ADR, set a review date.
5. Roll out small, with metrics and a way back.

| Situation | Commonly wrong choice | More reasonable choice in a small context |
|---|---|---|
| 5-person team, 3-month MVP | Microservices from day one | Modular monolith, clear module boundaries, one deploy pipeline |
| CPU-bound API blocking the event loop | Rewrite in another language | Move heavy work to a worker pool or queue, measure first |
| Flaky downstream | Infinite retries, no jitter | Timeout + retry budget + backoff with jitter + circuit breaker |
| Node major upgrade across many services | Upgrade everything in one night | Canary per service, CI on 2 versions, rollback ready |

#### Short sample ADR

```md
# ADR-014: Send invoice emails via a queue
Status: Accepted (2026-03)
Context: synchronous SMTP calls push /checkout P99 to 4s when the provider is slow.
Decision: write an outbox in the same transaction, a worker sends asynchronously, idempotency key = invoiceId.
Consequences: one more component to operate; emails may be delayed by a few minutes; need a dead-letter queue and alerts.
Review: after 2 quarters or when volume > 10k/day.
```

#### Team-level review checklist

- Is there a timeout on every outbound call? Are body size and connection count limited?
- Are errors classified (retryable / not) and do logs carry a correlation id without secrets?
- Is the change backward compatible (additive), behind a feature flag, with a rollback path?
- Are there metrics for the new flow (rate, error, duration) and alerts linked to a runbook?
- Do tests cover the error branches, not just the happy path?

#### Common anti-patterns at team scale

- **Resume-driven architecture**: choosing technology to learn it rather than to solve the problem.
- **Hero culture**: one person holds all operational knowledge; no runbooks.
- **Big-bang migration**: rewriting everything with no checkpoints along the way.
- **Alert fatigue**: non-actionable alerts make on-call engineers ignore real ones.
- **Optimizing before measuring**: spending weeks on something that is not the bottleneck.

When in doubt, remember: decide quickly on reversible decisions; for hard-to-reverse ones (data schema, public API contract, service boundaries) take the time to write an ADR and ask for review.
'''

[questions.nodejs-lv001]
prompt = '''A 5-person team must ship an MVP in 3 months and doesn't yet know which business domain will grow. Which proposal is most reasonable for the Node.js backend?'''
options = [
  '''Modular monolith: one deploy, modules with clear boundaries and internal APIs, split into services when there are measurable signals''',
  '''Microservices per database table from the start so it scales easily later''',
  '''One big server.js file with no modules to be as fast as possible''',
  '''A separate serverless function per endpoint, each function in its own repo''',
]
explanation = '''With 5 people and 3 months, the operating cost of many services (deploys, tracing, contracts, on-call) eats all the feature time. A modular monolith keeps clear module boundaries, so it can still be split once there is data. Microservices from the start draw boundaries before the domain is understood; "quickly write one blob with no boundaries" creates debt that is hard to pay back.'''

[questions.nodejs-lv002]
prompt = '''An API that exports a 50,000-row CSV report blocks the event loop for ~3 seconds, and P99 of other endpoints spikes. The team has 4 people and no time for a big project. Which step should come first?'''
options = [
  '''Confirm with profiling/event loop delay, then move report generation to a worker pool or queue and return 202 with a job status''',
  '''Rewrite the whole service in Go''',
  '''Double the number of instances and hope the load spreads evenly''',
  '''Raise the load balancer timeout to 60 seconds''',
]
explanation = '''Measure to confirm the cause is synchronous CPU work, then move the heavy work off the event loop (worker_threads/piscina or a job queue). This is small and reversible. Rewriting in another language costs a lot; more instances only mask the symptom because each instance still blocks; a longer timeout does not fix the blocking.'''

[questions.nodejs-lv003]
prompt = '''Which sections should a useful ADR (Architecture Decision Record) contain?'''
options = [
  '''Context and constraints''',
  '''The options considered and their trade-offs''',
  '''The full implementation source code''',
  '''Consequences, risks and conditions for revisiting the decision''',
  '''The name of the person to blame if the decision is wrong''',
]
explanation = '''An ADR records why, not just what: context/constraints, options considered, the decision, consequences and a review date. Full source code or the name of someone to blame is not core ADR content.'''

[questions.nodejs-lv004]
prompt = '''The company has 40 Node.js services on an old Node version nearing end of support. The CTO wants to upgrade all of them to the new LTS in one weekend night. What should the Tech Lead's approach be?'''
options = [
  '''Upgrade in waves: a two-version CI matrix, canary a few low-risk services, watch metrics, keep a rollback path''',
  '''Upgrade all 40 services in one night to finish early''',
  '''Don't upgrade until end-of-support day, then deal with it''',
  '''Only change the engines line in package.json and skip the tests''',
]
explanation = '''Upgrade in waves: CI runs a two-version matrix, canary starting with low-risk services, watch errors/latency/memory, roll back with the old image. A big bang concentrates risk in one moment and makes it hard to tell which service broke; waiting until end of support wastes the safe window.'''

[questions.nodejs-lv005]
prompt = '''A payment service calls a third-party provider; when the provider is slow, the service immediately retries 5 times with no wait and the whole system cascades into failure (retry storm). Which change is most effective?'''
options = [
  '''Short timeout + exponential backoff with jitter + retry budget + circuit breaker''',
  '''Increase retries to 10 to make sure it succeeds''',
  '''Retry at exactly 1-second intervals for every client''',
  '''Remove the timeout to wait for the provider to respond''',
]
explanation = '''You need timeouts, exponential backoff with jitter, a cap on total retries (retry budget) and a circuit breaker to stop calling when failures persist. More retries make the storm worse; fixed retries without jitter make clients hit at the same moment in sync; removing timeouts piles up hanging connections.'''

[questions.nodejs-lv006]
prompt = '''A 200-route Express codebase runs well and the 8-person team knows it. A member proposes rewriting everything in another framework because a benchmark is 20% faster. P99 currently meets the SLO at 3x the current load. What is the reasonable decision?'''
options = [
  '''Keep Express and keep improving incrementally; revisit when data shows the framework is the bottleneck''',
  '''Rewrite everything in one quarter to gain the 20% performance''',
  '''Freeze all new features until the rewrite is done''',
  '''Let each person pick their own framework for the routes they write''',
]
explanation = '''There is no measured problem to solve; a rewrite costs months, regression risk and training. Keep Express, record the proposal, and only use a new framework for new services if there is a clear reason. Rewriting "because it's faster" when the SLO is already met is optimizing in the wrong place.'''

[questions.nodejs-lv007]
prompt = '''Review checklist for a PR that adds a new write endpoint. Which items should be checked?'''
options = [
  '''Body validation and size limits''',
  '''Per-resource authorization checks''',
  '''Handling of duplicate submissions (idempotency key or unique constraint)''',
  '''Whether local variable names match the reviewer's taste''',
  '''Logs carry a correlation id but no tokens/PII''',
]
explanation = '''A write endpoint needs input validation at the boundary, authorization, idempotency/duplicate handling, timeouts/limits, and logs/metrics that do not leak secrets. Naming variables to personal taste is not an operational risk.'''

[questions.nodejs-lv008]
prompt = '''A public API needs rate limiting. Many enterprise customers come through the same NAT IP, and the system runs 6 instances. Which design is reasonable?'''
options = [
  '''Per API key/tenant with a shared counter such as Redis, returning 429 with Retry-After''',
  '''Per IP with an in-memory counter on each instance''',
  '''No rate limiting; just add instances when overloaded''',
  '''Rate limit only in the client SDK''',
]
explanation = '''Limit per API key/tenant (the real identity) and use a shared store (Redis) so quotas are correct across instances. Per-IP limits make customers behind NAT block each other; in-RAM counters per instance give the wrong total quota and reset on restart.'''

[questions.nodejs-lv009]
prompt = '''A mobile app cannot force users to update; you need to change the response shape of an API with millions of users. Which versioning strategy is reasonable?'''
options = [
  '''Add new fields backward-compatibly, ship breaking changes as a parallel /v2, announce deprecation, measure v1 usage before turning it off''',
  '''Change the response now and ask users to update the app''',
  '''Keep every version forever and never measure usage''',
  '''Rename fields in /v1 whenever needed''',
]
explanation = '''Additive changes don't break clients; breaking changes go into a new version running in parallel, with a deprecation notice and a long enough window, and the old version is turned off only after measuring its usage. Changing in place breaks old apps; keeping every version forever bloats maintenance cost.'''

[questions.nodejs-lv010]
prompt = '''Which HTTP header tells the client when an API/endpoint will stop working (RFC 8594)? Fill in the header name: {{blank}}'''
explanation = '''The Sunset header gives the expected shutdown time; it is usually paired with Deprecation and a link to migration docs.'''

[questions.nodejs-lv011]
prompt = '''At 02:00 an alert fires: a Node service's memory grows steadily and the pod is OOMKilled every ~2 hours; customers are affected. You are the incident coordinator. Which order of actions is correct?'''
options = [
  '''Mitigate impact (controlled rollback/restart), save a heap snapshot and metrics, investigate the cause afterwards, write a postmortem''',
  '''Keep searching for the root cause until done, letting customers suffer''',
  '''Delete old logs to save space and wait and see''',
  '''Disable the OOM alert to reduce noise''',
]
explanation = '''Mitigate first (roll back the latest release or add instances/restart in a controlled way), preserve evidence (heap snapshot/metrics), then investigate the cause and write a blameless postmortem. Deep investigation before mitigation prolongs the incident; deleting logs destroys evidence.'''

[questions.nodejs-lv012]
prompt = '''Incidents are increasing because every service logs the full request body; log cost has grown 5x and errors are hard to find. What is a reasonable improvement?'''
options = [
  '''Structured logs with a correlation id, sampled detailed logs, masked PII, details pushed to traces/metrics''',
  '''Keep it as is and buy more storage''',
  '''Turn off all logging in production''',
  '''Use only unformatted console.log''',
]
explanation = '''Structured logs, sensible levels, a correlation id across services, sampling for detailed logs, masking sensitive data. Logging every body costs money and leaks PII; turning off all logs removes the ability to investigate.'''

[questions.nodejs-lv013]
prompt = '''Which signs suggest a part of the monolith should be split into its own service?'''
options = [
  '''The module needs very different scaling/resources from the rest''',
  '''A separate team owns it and needs independent releases''',
  '''Wanting to try a new framework for fun''',
  '''Fault/security isolation is needed for a sensitive domain''',
  '''Having many services looks more modern''',
]
explanation = '''Split when there is a measurable reason: very different scaling/resources, an independent release cadence owned by another team, or a need for fault or security isolation. "Wanting to use new tech" or "many services look modern" are not reasons.'''

[questions.nodejs-lv014]
prompt = '''Sending invoice emails calls SMTP synchronously inside the /checkout request; when the provider is slow, checkout slows down too. Which solution fits a small budget?'''
options = [
  '''An outbox in the same transaction + a worker sending asynchronously, idempotency key, retries and a dead-letter queue''',
  '''Raise the SMTP timeout to 60 seconds''',
  '''Swallow email errors and treat them as success''',
  '''Send the email first, then save the order''',
]
explanation = '''Write an outbox in the same transaction, then a worker sends asynchronously with an idempotency key, retries and a dead-letter queue; checkout no longer depends on SMTP. A synchronous call with a long timeout or ignoring send errors either loses emails or blocks payment.'''

[questions.nodejs-lv015]
prompt = '''Describe how you would lead the team in extracting a payment module from a Node.js monolith (strangler): state the criteria for deciding to split, the rollout steps, how you measure, and the way back.'''
keywords = [
  ["strangler", "incrementally", "step by step"],
  ["boundary", "internal api", "contract"],
  ["feature flag", "canary"],
  ["metric", "measure", "slo", "latency"],
  ["rollback", "roll back", "way back"],
  ["data", "database", "schema", "dual write"],
]
model_answer = '''First I establish the reason for splitting with data (release cadence, load, risk) and write an ADR. I clarify the boundary and contract of the payment module inside the monolith, then apply the strangler pattern: move one flow at a time to the new service behind a facade, using a feature flag/canary to ramp up traffic. The data is split according to a plan (dual write or outbox, no long-term shared tables). I track metrics such as latency, error rate and the SLO on both sides; if a threshold is exceeded I roll back by turning off the flag. Only when things are stable do I clean up the old code.'''
explanation = '''A good answer starts from a measurable reason, splits incrementally through boundaries/APIs, runs both in parallel, and has a rollback; no big bang.'''

[questions.nodejs-lv016]
prompt = '''Describe a dependency and supply-chain management policy for a 15-person Node.js team: cover the lockfile, installs in CI, regular updates, vulnerability checks, and review of new dependencies.'''
keywords = [
  ["lockfile", "package-lock"],
  ["npm ci", "reproducible"],
  ["renovate", "dependabot", "regular updates"],
  ["audit", "sca", "vulnerab"],
  ["review", "approval"],
  ["provenance", "ignore-scripts", "install script", "permission"],
]
model_answer = '''Every repo commits its lockfile; CI uses npm ci for reproducible installs and fails when the lockfile is out of sync. A bot such as Renovate or Dependabot opens small PRs on a schedule and auto-merges patches when tests are green. The pipeline runs npm audit/SCA and blocks severe vulnerabilities that have a fix. New dependencies go through review: purpose, popularity, maintenance, license, number of transitive dependencies. For high risk, disable unnecessary install scripts (ignore-scripts), pin versions and verify provenance/signatures where available.'''
explanation = '''Key points: lockfile + npm ci for reproducibility, a bot for small frequent updates, audit/SCA, review of new dependencies, reduced permissions for install scripts.'''

[questions.nodejs-lv017]
prompt = '''P99 latency of a Node.js API quadruples at peak. Write an investigation and mitigation runbook: the order of checks, tools, temporary decisions and post-incident actions.'''
keywords = [
  ["dashboard", "metric", "apm"],
  ["event loop", "event loop lag", "eventloop delay"],
  ["cpu", "memory", "gc"],
  ["database", "downstream", "dependency", "pool"],
  ["rollback", "scale", "shed load", "temporary"],
  ["postmortem", "post-incident", "runbook"],
]
model_answer = '''Start with the dashboard: compare rate/error/duration and check for any recent deploy or config change. I check the process's event loop delay, CPU and memory/GC, then move on to dependencies: an exhausted database pool, a slow downstream, the cache hit rate. If a deploy is suspected, roll back; if overloaded, scale out or shed load (turn off heavy features) as a temporary measure. I capture profiles/traces during the incident as evidence. Afterwards I write a blameless postmortem, update the runbook, and add alerts and load tests.'''
explanation = '''A good runbook goes from symptom to cause, cheapest and fastest checks first, with mitigations and post-incident work.'''

[questions.nodejs-lv018]
prompt = '''Should a slow task (generating an invoice PDF) be handled with synchronous HTTP or an asynchronous queue? Analyze it against UX, reliability and operating-cost constraints, and describe the design if you choose a queue.'''
keywords = [
  ["synchronous", "sync"],
  ["asynchronous", "queue"],
  ["idempotency", "idempotent", "duplicate"],
  ["retry", "dead-letter", "dlq"],
  ["status", "202", "polling", "webhook"],
  ["operating cost", "operations", "monitor"],
]
model_answer = '''If the task takes under a few hundred ms and the user needs the result immediately, handling it synchronously is the simplest. When the task is slow, variable or depends on external services, a queue lets the request return 202 quickly and decouples the load from the API, at the price of higher operating cost. The design needs an idempotency key because messages can be delivered more than once (duplicate delivery), retry with backoff, a dead-letter queue for poison messages, and an endpoint/webhook/polling to report job status. Queue-depth metrics and alerts are needed so the team can monitor it.'''
explanation = '''The answer must state the trade-offs and the requirements when using a queue: idempotency, retries, dead-letter, status tracking.'''

[questions.nodejs-lv019]
title = "Circuit breaker with an injected clock"
prompt = '''Write `createCircuitBreaker({ failureThreshold, cooldownMs, now })` returning a function `exec(fn)` (fn returns a Promise). When the number of consecutive failures reaches `failureThreshold`, the breaker OPENS: `exec` rejects immediately with `Error('circuit open')` without calling `fn`. After `cooldownMs` (measured with the injected `now()`) the breaker allows one trial (half-open): success closes and resets it, failure opens it again. A success resets the failure counter.'''
explanation = '''A circuit breaker helps avoid retry storms: it stops calling a failing dependency, gives it time to recover, then probes gently.'''
hints = [
  '''Store `openedAt` (when it opened) and `failures`.''',
  '''If it is open and the cooldown has not elapsed, throw `circuit open` before calling fn.''',
  '''A failure in half-open must reset `openedAt = now()`.''',
]

[questions.nodejs-lv020]
prompt = '''Within one event loop iteration, what order does the following code print when run from a CommonJS module?
```js
setTimeout(() => console.log('timeout'), 0);
setImmediate(() => console.log('immediate'));
process.nextTick(() => console.log('tick'));
Promise.resolve().then(() => console.log('promise'));
```
'''
options = [
  '''tick, promise, then timeout/immediate (the order of the last two is not guaranteed)''',
  '''timeout, immediate, tick, promise''',
  '''promise, tick, immediate, timeout''',
  '''immediate, timeout, tick, promise''',
]
explanation = '''The nextTick queue runs first, then the promise microtasks, and only then the event loop phases. The order of timeout and immediate in the main module is not guaranteed (it depends on process performance), so only the first two lines are fixed.'''

[questions.nodejs-lv021]
prompt = '''Inside an I/O callback (e.g. within an fs.readFile callback), setTimeout(fn, 0) and setImmediate(fn) are called together. Which statement is true?'''
options = [
  '''setImmediate always runs first''',
  '''setTimeout always runs first''',
  '''The order is random, as in the main module''',
  '''Both are ignored inside an I/O callback''',
]
explanation = '''Inside an I/O callback, the poll phase ends and moves on to the check phase, so setImmediate always runs before a 0ms timer of the next iteration.'''

[questions.nodejs-lv022]
prompt = '''Which work should be moved to worker_threads (or a separate process) instead of running on the HTTP server's main thread?'''
options = [
  '''Hashing passwords with a heavy algorithm synchronously''',
  '''Parsing tens of MB of JSON on every request''',
  '''Calling fetch to an external API''',
  '''Resizing images in pure JS''',
  '''Reading a small file with fs/promises''',
]
explanation = '''Synchronous CPU-bound work (compression, heavy hashing, parsing large payloads, image processing) blocks the event loop. Network/disk I/O is already asynchronous thanks to libuv, so moving it to a worker usually brings no benefit.'''

[questions.nodejs-lv023]
prompt = '''Which worker_threads function lets a worker send data back to the parent thread? Fill in: parentPort.{{blank}}(result)'''
explanation = '''parentPort.postMessage sends a message (structured clone; ArrayBuffers can be transferred via transferList) to the parent thread.'''

[questions.nodejs-lv024]
prompt = '''A pipeline reads a large file → gzip → writes the destination file with `src.pipe(gzip).pipe(dest)`. When gzip fails, why does manual pipe() easily cause leaks?'''
options = [
  '''pipe() does not close/destroy the remaining streams on error; pipeline() does that and reports the error in one place''',
  '''pipe() always reads the entire file into RAM''',
  '''pipeline() only works with files under 64KB''',
  '''Gzip streams never emit errors''',
]
explanation = '''pipe() does not destroy the other streams when one stream errors, so file descriptors may be held open. stream.pipeline (or stream/promises) propagates the error, destroys everything and calls the callback once.'''

[questions.nodejs-lv025]
prompt = '''Writable.write() returns false. What is the correct action for the producer?'''
options = [
