  '''The quota is exact because cluster shares memory''',
  '''Only the first worker counts''',
  '''Node automatically syncs global variables between workers''',
]
explanation = '''Each worker counts separately, so the effective total quota is N times higher and inconsistent; you need a shared store (Redis) or limiting at the LB layer.'''

[questions.nodejs-lv036]
prompt = '''A fetch to an external API often hangs when the network is flaky. What is the safest way to bound the wait time?'''
options = [
