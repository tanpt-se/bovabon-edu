  '''Block every second POST within 1 hour per IP''',
  '''Trust that the client never resends''',
  '''Use GET instead of POST''',
]
explanation = '''The client sends an Idempotency-Key; the server stores the result per key (or uses a unique constraint) so a repeated request returns the same result instead of creating another order.'''

[questions.nodejs-lv039]
title = "Keyed serializer"
prompt = '''Write `createKeyedSerializer()` returning a function `run(key, task)`: tasks with the same `key` run sequentially in call order (a later task starts only after the previous one finishes, even if the previous one rejects), tasks with different keys run in parallel. `run` returns a Promise with the task's result/error. No leaks: when a key's queue is empty, remove the key from the Map.'''
explanation = '''This pattern serializes operations per account/order within a process without a global lock.'''
hints = [
  '''Keep a Map key → last promise in the queue (with errors swallowed).''',
  '''Chain the new task with `prev.then(() => task())`.''',
  '''Delete the key when the current tail is still the latest tail.''',
]

