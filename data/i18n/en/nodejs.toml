[questions.node-046]
title = '''Mini Express router with params'''
prompt = '''Write `createRouter()` to return `{ get(path, handler), post(path, handler), handle(method, url) }`:
- A path may contain parameters such as `:name` (for example, `/users/:id/posts/:postId`).
- `handle(method, url)`: remove the query string, find the **first** route matching the method and path, call `handler(req)` with `req = { method, path, params, query }`, and return the handler's result.
- Parse `query` from the query string (`a=1&b=x` → `{ a: '1', b: 'x' }`); values are strings and URL-decoded.
- If no path matches, return `{ status: 404 }`; if the path matches but the method does not, return `{ status: 405 }`.
'''
explanation = '''Express uses `path-to-regexp` to compile routes in a similar way.'''
hints = [
  '''Convert `/users/:id` into a regex such as `^/users/([^/]+)/?$` and keep the parameter names in order.''',
  '''Track a `pathMatched` variable to distinguish 404 from 405.''',
]

[modules.node-ops]
title = '''Performance & Operations'''
description = '''Caching, rate limiting, retry/backoff, graceful shutdown, logging, and environment variables.'''
lesson = '''
### Key ideas
- **Caching**: use an in-memory LRU cache for hot data; use Redis across multiple instances.
- **Rate limiting**: use a token bucket or sliding window, backed by Redis when scaling horizontally.
- Retry with **exponential backoff + jitter** only for transient errors and idempotent operations.
- **Graceful shutdown**: handle `SIGTERM` → `server.close()` → close the DB pool → `process.exit`.
- For unhandled errors, `process.on('unhandledRejection'|'uncaughtException')` should log and then **exit** so the process manager can restart the process; do not try to keep running.
- Use structured logs (pino) and configure the application through environment variables (12-factor).
'''

[questions.node-060]
prompt = '''When an `uncaughtException` occurs, the recommended response is to:'''
options = [
  '''Ignore it and keep running''',
  '''Log the error, do minimal cleanup, then **exit the process** so the process manager (PM2/K8s) can restart it''',
  '''Restart the event loop''',
  '''Send the error to the client''',
]
explanation = '''After an uncaught exception, the application's state can no longer be trusted.'''

[questions.node-061]
prompt = '''Why should retries use **exponential backoff + jitter**?'''
options = [
  '''To make the code shorter''',
  '''To increase the wait between attempts so a failing service can recover, while jitter prevents clients from retrying **at the same time** (a thundering herd)''',
  '''To increase the number of retries''',
  '''It is required by the HTTP specification''',
]
explanation = '''Retry only transient errors (timeouts, 503, 429) and idempotent operations.'''

[questions.node-062]
title = '''Token-bucket rate limiter'''
prompt = '''Write `createRateLimiter({ capacity, refillPerSec, now })`:
- Each **key** (for example, an IP address) has its own bucket, initially filled to `capacity` tokens.
- Tokens refill over time at `refillPerSec` tokens per second (which may be fractional), up to `capacity`.
- `take(key)` returns `{ allowed, remaining, retryAfterMs }`:
  - If at least 1 token remains, subtract 1, set `allowed: true`, and set `retryAfterMs: 0`.
  - If the bucket is empty, set `allowed: false`; `retryAfterMs` is the time in milliseconds, rounded up, until one token is available.
- `remaining` is the number of whole tokens left (`Math.floor`).
- `now()` returns the current time in milliseconds and is provided for testing.
'''
explanation = '''When the API returns 429, set the `Retry-After` header using `retryAfterMs`. With multiple instances, store buckets in Redis (for example, with an atomic Lua script).'''
hints = [
  '''Store `{ tokens, last }` for each key; on each call to `take`, add tokens based on the elapsed time.''',
  '''Tokens can be fractional; apply `floor` only when returning `remaining`.''',
]

[questions.node-063]
title = '''LRU cache with TTL'''
prompt = '''Write a class `LRUCache` with `constructor(max, { ttlMs = Infinity, now = Date.now } = {})`:
- `get(key)` returns the value or `undefined`. Access makes the key the **most recently used**. If the key has expired (`now() - setAt >= ttlMs`), delete it and return `undefined`.
- `set(key, value)` deletes the **least recently used** key if the cache exceeds `max`.
- Support `has(key)` (does not update order, but respects TTL), `delete(key)`, and the `size` property.

Hint: `Map` preserves insertion order.
'''
explanation = '''The widely used npm package `lru-cache` implements this idea with further optimizations.'''
hints = [
  '''`map.delete(key); map.set(key, v)` moves the key to the end (most recent).''',
  '''The oldest key is `map.keys().next().value`.''',
]

[modules.nodejs-dv-modules]
title = '''ESM, CommonJS & Package Contracts'''
description = '''Distinguish module formats, configure package.json, use conditional exports, and define a public API boundary.'''
lesson = '''
### Choose a module format and define the public API deliberately
Node supports two main module systems. CommonJS loads with `require()` and exports through `module.exports`; ECMAScript Modules (ESM) use `import`/`export`, support static analysis, and allow top-level await. Clear rules avoid relying on guesses based on syntax or runtime version.

| Signal | Format | Note |
|---|---|---|
| `.mjs` | ESM | Explicit; does not depend on package.json |
| `.cjs` | CommonJS | Explicit; does not depend on package.json |
| `.js` | Determined by the nearest package.json `type`; if absent, by the runtime's default or detection rules | Declare it explicitly to avoid ambiguity |

Example package.json: `{"type":"module","exports":{".":{"import":"./dist/index.js","require":"./dist/index.cjs"},"./client":"./dist/client.js"}}`

In ESM, relative file paths generally need an explicit extension; `__dirname` and `__filename` are not available automatically as they are in CommonJS. To call `require` from ESM, create it with `createRequire(import.meta.url)` from `node:module`. The `exports` field defines the entry points consumers may import and can select targets based on conditions such as `import` or `require`. When this field exists, an undeclared deep import may fail with `ERR_PACKAGE_PATH_NOT_EXPORTED`. The `imports` field is for internal aliases that start with `#`.

Common mistakes include setting `type=module` and still using `module.exports`, omitting extensions from relative imports, or importing an internal file that is not listed in `exports`. For a package that supports both formats, check each entry point separately and do not assume both formats always share the same object state.
'''

[questions.nodejs-dv001]
prompt = '''A package declares `type=module` in its nearest package.json. Which format does `src/index.js` use under that configuration?'''
options = [
  '''ESM''',
  '''CommonJS''',
  '''Node chooses randomly based on how the file is run''',
  '''The file cannot be loaded''',
]
explanation = '''For `.js`, Node uses the `type` field in the nearest package.json; `.mjs` and `.cjs` are more explicit indicators.'''

[questions.nodejs-dv002]
prompt = '''In a package with `type=module`, which file does Node still explicitly interpret as CommonJS?'''
options = [
  '''index.js''',
  '''index.mjs''',
  '''index.cjs''',
  '''index.json''',
]
explanation = '''The `.cjs` extension identifies CommonJS even when the package defaults to ESM.'''

[questions.nodejs-dv003]
prompt = '''A library adds an `exports` field to package.json. Which consequences are correct?'''
options = [
  '''It can declare different entry points for `import` and `require` conditions''',
  '''Node automatically converts CommonJS code to ESM''',
  '''Undeclared subpaths may be blocked when a consumer uses a deep import''',
  '''Every file in the package directory automatically becomes public API''',
  '''`exports` must always point to exactly one file''',
]
explanation = '''`exports` can use conditional exports and restrict public subpaths; it does not compile formats or expose the entire directory automatically.'''

[questions.nodejs-dv004]
prompt = '''For `.js` files, which package.json field declares the default format for files in the package: {{blank}}?'''
explanation = '''`type` accepts `module` or `commonjs`; use `.mjs` or `.cjs` when the format should be explicit in the file name.'''

[questions.nodejs-dv005]
prompt = '''In ESM, which API from `node:module` creates a `require` function tied to the current module's URL: {{blank}}?'''
explanation = '''`createRequire(import.meta.url)` is useful when a module needs to remain compatible with a CommonJS API.'''

[questions.nodejs-dv006]
prompt = '''In Node ESM, what is the appropriate way to import the relative JavaScript file `db.js`?'''
options = [
  '''`import db from './db'`''',
  '''`import db from './db.js'`''',
  '''`import db from 'db.js'`''',
  '''`require('./db.js')` is always available without setup''',
]
explanation = '''In typical cases, Node ESM requires an explicit extension for relative file paths; a bare specifier such as `db.js` is resolved as a package.'''

[questions.nodejs-dv007]
prompt = '''In an interview, explain practical differences between CommonJS and ESM in Node, then describe how you would design a package to support consumers without exposing internal files.'''
keywords = [
  ["commonjs", "cjs", "module.exports"],
  ["esm", "ecmascript modules", "import/export"],
  ["package.json type", "type field"],
  ["exports", "conditional exports"],
  ["public api", "interoperability", "compatibility"],
]
model_answer = '''CommonJS uses `require()` and `module.exports`, while ESM uses `import`/`export` with static linking. If a package supports both formats, the `type` setting and `.cjs`/`.mjs` extensions help Node distinguish them clearly. I declare `exports` to define the public API and can use conditional exports for consumers using `import` or `require`. This keeps implementation files from being treated as a stable API, so they can change independently.'''
explanation = '''A good answer distinguishes syntax, resolution rules, and the package contract instead of merely naming the two module systems.'''

[questions.nodejs-dvc01]
