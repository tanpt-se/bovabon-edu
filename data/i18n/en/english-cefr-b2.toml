[modules.cefr-b2-grammar-plus]
title = "B2 · Grammar in Context"
description = "Narrative tenses, future in the past, verb patterns with changing meanings, quantifiers, noun phrases, emphasis, and natural substitution."
lesson = '''
### Telling stories and looking back at plans
| Structure | Use | Example |
|---|---|---|
| Past simple | Main events in sequence | *Mia opened the email and called her manager.* |
| Past continuous | Background or an action in progress | *I was driving when the storm began.* |
| Past perfect | An event before a past reference point | *They had left before we arrived.* |
| Past perfect continuous | Emphasising duration before a past reference point | *He had been waiting for an hour when the bus came.* |
| was/were going to; would | An intention or future viewed from the past | *I was going to call, but I forgot.* / *She said she would help.* |

### Verbs followed by to V or V-ing
The form after a verb can change its meaning. *Remember to lock the door* means remembering a task that still needs to be done; *remember locking it* means recalling that you did it. *Stop to answer the phone* means pausing another activity in order to answer; *stop answering calls* means no longer answering them. *Try to restart the app* means making an effort to restart it; *try restarting it* means testing that as a possible solution. *Regret to say* often introduces bad news; *regret saying it* means feeling sorry about something already said. Read the context instead of memorising a mechanical list.

### Quantifiers and noun phrases
| Phrase | Meaning | Example |
|---|---|---|
| few / little | Almost none; often negative in tone | *Few people noticed the change.* |
| a few / a little | A small amount or number that is still available | *We have a few options and a little time.* |

A noun can modify another noun: *a customer service team*, *a three-day trip*. Compound adjectives are often hyphenated before a noun: *a well-known author*, *a time-consuming task*. The usual order of several adjectives is opinion, size/age, colour, origin, material, then noun; avoid a long string when a shorter sentence would be clearer.

### Emphasis, evaluation, and avoiding repetition
*I do understand your concern* uses *do/does/did + base verb* to emphasise an affirmative statement; do not add *-s* or *-ed* to the verb after the auxiliary. *You should have checked the date* expresses criticism or regret about the past. *You needn't have brought food* tells the listener that they brought it, although it was unnecessary; *You didn't need to bring food* only says there was no need, without confirming whether they brought any. To avoid repetition, use *one/ones* for countable nouns (*the blue one*), *do so* for an action just mentioned, or *so/not* after verbs such as *think* (*I think so; I hope not*). Learners may use *few* instead of *a few*, leave the main verb unchanged after *did*, or write *I am agree*. Distinguish the quantifiers, use the base verb after *do*, and say *I do agree* when you need emphasis.

### Perfect modals, conditionals and emphasis
Modal + have + past participle looks back at a situation: *You should have called* is advice or criticism about the past; *They may have missed the train* is a deduction; *You needn't have booked* means the person booked, but it was unnecessary. Compare this with *didn't need to book*, which does not tell us whether the person booked.

Mixed conditionals connect the past to the present: *If I had accepted the job, I would be living abroad now.* A fronted negative or restrictive phrase can trigger auxiliary inversion: *Rarely have we seen such a change*; *Only after the call did I understand*. Cleft sentences focus information: *It was the delay that changed our plan*; *What we need is a clearer schedule*.

### Ellipsis, substitution and noun phrases
Use *so/neither* to avoid repetition (*I enjoyed the talk, and Sam did too*), *one/ones* to replace a noun (*the blue one*), and *do so* to replace an action. Impersonal passives such as *It is widely believed that…* or *The report is expected to…* suit writing that focuses on information. Keep long noun phrases in a clear order: *a recently approved regional transport plan*. Check articles, quantifiers and modifier relationships to avoid unclear strings.
'''

[questions.cefr-b2-001]
explanation = "The past continuous sets the background action; the past perfect shows that leaving the wallet behind happened before the speaker noticed."

[questions.cefr-b2-002]
explanation = "*Was going to* describes an intention in the past; the next clause shows that the plan changed."

[questions.cefr-b2-003]
explanation = "*Stop + V-ing* means to end that activity. *Stop to enter* would mean pausing another activity in order to go in."

[questions.cefr-b2-004]
explanation = "*Passengers* is a plural countable noun. *Few* emphasises that the number is very small; *a few* means there are some."

[questions.cefr-b2-005]
explanation = "For emphasis in an affirmative statement, use *do + base verb*: *I do have*. Do not use *am* or inflect the verb after *do/did*."

[questions.cefr-b2-006]
explanation = "The correct sentences use *had + past participle* for an event before a past reference point. Sentence 3 does not need the past perfect for a state at a specific time; sentence 4 combines the present perfect with a finished past-time reference."

[questions.cefr-b2-007]
explanation = "*Remember to do* means remembering a task that needs to be done; *remember doing* means recalling that you did it. *Stop to talk* means pausing another activity to talk. *Try doing* means testing a solution. The last sentence should use *regret buying*."

[questions.cefr-b2-008]
explanation = "*Time* is uncountable; *a little* means that a small amount remains. *Little time* emphasises that there is almost no time left."

[questions.cefr-b2-009]
explanation = "The students left before the teacher arrived, so the earlier action takes the past perfect."

[questions.cefr-b2-010]
explanation = "To remind someone to do something later, use *remember + to V*. Both *switch off* and *turn off* are natural here."

[questions.cefr-b2-011]
explanation = "The response includes a past continuous background, an earlier event in the past perfect, and the original plan with *was going to*."

[modules.cefr-b2-vocab]
title = "B2 · Vocabulary in Chunks and Nuance"
description = "Collocations, phrasal verbs with multiple meanings, word formation, common idioms, and easily confused word pairs."
lesson = '''
### Learn words in chunks
At B2, knowing the separate meanings of words is not enough; you also need to remember which words commonly go together. Examples include *make progress*, *heavy traffic*, *reach a decision*, *raise awareness*, *take responsibility*, and *meet a deadline*. Avoid translating word by word from Vietnamese: these collocations do not use *do a progress* or *strong rain*. When recording a new word, save the whole phrase and an example sentence with context.

### Phrasal verbs: use context to choose a meaning
| Phrase | Common meaning | Example |
|---|---|---|
| bring up | mention a topic; raise a child | *She brought up the cost at the meeting.* |
| put off | postpone | *They put off the trip until June.* |
| take over | take charge; gain control | *A new manager took over the team.* |
| find out | discover or learn information | *We found out why the bus was late.* |
| turn down | refuse; lower the volume | *He turned down the offer.* |

Some phrasal verbs have several meanings, so identify the object and situation before interpreting them. With a pronoun as the object, some separable phrasal verbs split: say *turn it down*, not *turn down it*.

### Word formation and easily confused pairs
Prefixes and suffixes can change a word's part of speech or meaning: *rely → reliable → reliability*; *decide → decision*; *success → successful → successfully*; *possible → impossible*. Use the word's position in the sentence to predict its part of speech: after *a/an/the* you often need a noun; before a noun you often need an adjective; after a verb you may need an adverb.

| Word | Common use | Example |
|---|---|---|
| affect | verb: influence | *Noise can affect sleep.* |
| effect | noun: result or impact | *The change had little effect.* |
| economic | related to the economy | *economic growth* |
| economical | efficient and not wasteful to use | *an economical car* |

Use common idioms in the right situation; avoid them in a formal letter if they sound too casual: *break the ice* (help people start talking), *under the weather* (feeling unwell), *once in a while* (occasionally). Learners often confuse *affect/effect*, choose the wrong preposition in a collocation, or change a word in an idiom. Look up the full phrase, note its part of speech, and write a new example. If you are unsure about the tone, choose a direct, neutral expression.

### Nuance, register and specialised vocabulary
At B2, choose words by collocation, nuance and situation. *Strong evidence* is more natural than *powerful evidence* in many reports; *raise an issue* is often neutral, while *bring up a problem* is more informal. Common chunks include *meet a deadline, pose a risk, reach a compromise, take responsibility* and *draw attention to*. A phrasal verb may have several meanings: *take over a company* means assume control, *bring up a topic* means mention it, and *put off a meeting* means postpone it.
Idioms often suit conversation better than reports: *on the same page* may work with familiar colleagues; a formal text could say *share the same understanding*. Distinguish near-synonyms by collocation: *economic growth* relates to an economy; an *economical design* saves money. Suffixes also show word class: *rely → reliable / reliability*; *accessible* is an adjective, while *accessibility* is a noun. Before choosing, identify the register and the required word class.
'''

[questions.cefr-b2-012]
explanation = "The natural collocation is *make progress*. Avoid translating the phrase word for word as *do progress*."

[questions.cefr-b2-013]
explanation = "*Bring up an issue* means to mention it so people can discuss it."

[questions.cefr-b2-014]
explanation = "*Put off* means to postpone an event or plan."

[questions.cefr-b2-015]
explanation = "*Economic effects* are effects related to the economy; *economical* usually means efficient and inexpensive to use."

[questions.cefr-b2-016]
explanation = "*Break the ice* means to ease the initial awkwardness so people can start talking more comfortably."

[questions.cefr-b2-017]
explanation = "The natural collocations are *make progress*, *heavy traffic*, and *raise awareness*. Say *make a decision*; *progress* is not used with *take* in this way."

[questions.cefr-b2-018]
explanation = "*Take over* means to take charge; *put off* means to postpone; *bring up* can also mean to raise a child; and *find out* means to discover information. *Turn down the music* means to lower its volume, not to accept it."

[questions.cefr-b2-019]
explanation = "A noun is needed here: *effect*. *Affect* is usually a verb: *The timetable affected attendance.*"

[questions.cefr-b2-020]
explanation = "An adjective is needed after *is* to describe the guide: *reliable*."

[questions.cefr-b2-021]
explanation = "The common collocation is *heavy traffic* for a road with many vehicles."

[questions.cefr-b2-022]
explanation = "A persuasive response gives specific benefits and uses phrases that suit a community event."

[modules.cefr-b2-functions]
title = "B2 · Discussion, Persuasion, and Negotiation"
description = "Expressing degrees of certainty, giving reasons, disagreeing tactfully, finding compromises, presenting, and facilitating discussion."
lesson = '''
### Making reasoned inferences
When you are not sure, let the listener know how confident you are and why: *It might be a delivery delay; the roads are very busy.* With stronger evidence, say *She must be on the train; she sent us a photo from the platform.* If something is almost impossible, say *That can't be the right room; the sign shows a different number.* Distinguish what you know from what you infer; avoid saying *definitely* when you have only one clue.

### Persuading and disagreeing
A clear argument usually includes a proposal, a reason, and a specific benefit: *We should extend the opening hours because many students finish work at six.* You can emphasise a practical benefit: *This would give more people time to use the service.* To disagree politely, acknowledge part of the other person's point and then explain a limitation: *I see your point about cost. However, the current system also wastes staff time.* Avoid *You are wrong* or *I agree, but…* if the tone could sound dismissive; give facts or consequences instead of judging the speaker.

### Negotiating and facilitating
Reaching agreement often means suggesting options, asking what the other person needs, and confirming what you have agreed: *Could we try this for one month?* · *Would a later start work for you?* · *It sounds as if we agree on the date.* You can suggest meeting halfway or trying an option for a short time and reviewing it later. A facilitator helps everyone take part: *Could we hear from someone who hasn't spoken yet?* They clarify with *Could you explain what you mean by “flexible”?*, summarise with *So far, we have agreed to…*, and signal when the discussion is moving to a new point.

### Giving a clear presentation
Open by stating your aim: *Today I'd like to explain…*; move between sections with *Let me move on to the next point*; introduce examples with *For example…*; finish with *To sum up…*; and invite questions with *Are there any questions?* These phrases help listeners follow the structure without overly formal transitions. Learners sometimes translate directly into *I very agree* or disagree too bluntly. Say *I completely agree* to show agreement; otherwise, try *I understand your concern, although…* or *Could we consider…?* to keep the exchange collaborative.

### Negotiation, facilitation and online interaction
In a B2 discussion, state a position with reasons, acknowledge a valid point from the other side and propose a conditional option: *I understand the budget concern. Could we pilot the service for one month and review the figures?* Use hedging when evidence is uncertain: *The figures seem to suggest…*; *One possible explanation is…* Do not present a deduction as a fact.
A facilitator invites quieter participants, checks agreement and summarises decisions: *We have agreed to test option B, subject to approval from Finance.* In chat or online meetings, quote the point you are replying to, signal when you are paraphrasing and separate the issue from the person. B2 mediation can also involve explaining a concept to a colleague in simpler words while preserving important conditions and cautions. A text exercise cannot assess turn-taking, intonation or handling interruptions in real time.
'''

[questions.cefr-b2-023]
explanation = "*May have been delayed* expresses a possibility based on limited information. The other choices make excessive or unsupported claims."

[questions.cefr-b2-024]
explanation = "The proposal is supported by a reason and a practical benefit; its wording does not impose an absolute conclusion."

[questions.cefr-b2-025]
explanation = "The response acknowledges the concern about costs and then gives a specific consequence, while keeping a polite tone."

[questions.cefr-b2-026]
explanation = "Trying both options and comparing the results is a compromise that can be evaluated."

[questions.cefr-b2-027]
explanation = "*Let me move on to…* is a natural phrase that signals a transition to the next section."

[questions.cefr-b2-028]
explanation = "The selected phrases invite someone else to contribute, summarise an area of agreement, and ask for clarification."

[questions.cefr-b2-029]
explanation = "The selected responses acknowledge the other person's view or priorities and then add a reason or another criterion to consider."

[questions.cefr-b2-030]
explanation = "*Could you explain…?* is a polite way to ask someone to clarify information."

[questions.cefr-b2-031]
explanation = "*Meet halfway* describes each side making a partial concession to reach an agreement."

[questions.cefr-b2-032]
explanation = "*Summarise/summarize* means to give a brief account of the main points. Both British and American spellings are accepted."

[questions.cefr-b2-033]
explanation = "The response makes a concession, raises a concern, and suggests a compromise."

[modules.cefr-b2-reading-writing]
title = "B2 · Reading and Writing Clear Texts"
description = "Organising essays, reports, reviews, and formal letters; controlling register, cohesion, and paraphrase."
lesson = '''
### Opinion and for-and-against essays
An opinion essay introduces the topic and states a clear view, then develops each reason with an explanation or example; its conclusion restates the position in different words. A for-and-against essay presents both advantages and disadvantages before reaching a conclusion. Each paragraph should have a topic sentence and supporting sentences that develop the same point. *Firstly*, *in addition*, *on the other hand*, and *finally* show how ideas relate, but they do not replace an argument.

### Reports, reviews, and formal letters
Reports often have a title or short sections such as *Purpose*, *Findings*, and *Recommendations*. Focus on results, use clear sentences, and keep a neutral tone: *The survey found that…*; *It is recommended that the opening hours be extended.* A review should state its criteria, strengths, limitations, and final assessment instead of simply saying *It was good*. In a formal letter, use an appropriate greeting (*Dear Ms Lee,*), state your purpose early (*I am writing to enquire about…*), and close politely (*Kind regards,*). Avoid informal wording such as *Hey*, *gonna*, or *send me this now* when writing to an organisation or customer.

### Cohesion and paraphrase
Cohesion links sentences through clear pronoun references (*The library changed its hours. This decision…*), connectors that express the right relationship (*however* for contrast; *as a result* for a consequence), and reduced repetition. Pronouns such as *it/they/this* need an easy-to-identify referent. A paraphrase preserves the information while changing the structure or suitable vocabulary: *The council reduced fares* can be rephrased as *Bus tickets became cheaper*. Do not change only one word if that distorts the meaning, and do not add a conclusion that the source does not state. Learners sometimes write *In my opinion, I think* (a repeated opinion marker), *regarding to* (an incorrect phrase), or join several clauses with commas. Choose either *In my opinion* or *I think*, write *regarding the issue*, and use separate sentences or a connector with correct punctuation.

### Critical reading, synthesis and editing
When reading an argument or report, identify the claim, reasons, evidence and their relationships. Notice words showing certainty such as *may, likely, must* so you do not make a claim stronger than the source. Paraphrasing means more than replacing a few words with synonyms: change the structure while preserving degree, conditions and attribution. When synthesising two sources, state common ground first and make differences explicit.
A report usually uses clear headings and presents findings before recommendations. A for-and-against essay presents both sides fairly before reaching a position. After writing, check reference words, linkers, commas in non-defining clauses, articles and hyphenated compound adjectives before nouns. In mediation, adapt information for a new reader without losing an important warning, figure or condition.
'''

[questions.cefr-b2-034]
explanation = "A for-and-against essay should present both sides before concluding; its paragraphs should support a clear structure."

[questions.cefr-b2-035]
explanation = "The topic sentence introduces the main idea to be developed: the benefits of urban parks."

[questions.cefr-b2-036]
explanation = "The sentence uses a neutral report style, gives a specific finding, and fits the findings section."

[questions.cefr-b2-037]
explanation = "The greeting and polite opening state the purpose clearly and suit an email to a company."

[questions.cefr-b2-038]
explanation = "*This change* clearly refers to the extended opening hours; the other choices are vague or grammatically incorrect."

[questions.cefr-b2-039]
explanation = "The first sentence preserves the time and result relationship while changing the wording and structure. The others change the meaning or add an idea."

[questions.cefr-b2-040]
explanation = "The selected sentences use a result relationship, a clear pronoun reference, or a contrast connector with appropriate punctuation."

[questions.cefr-b2-041]
explanation = "These words introduce a concessive clause. *Despite* must be followed by a noun or V-ing form, not a complete clause."

[questions.cefr-b2-042]
explanation = "*This* can refer to the whole statement just made; this singular subject takes the verb *surprised*."

[questions.cefr-b2-043]
explanation = "Both *increased* and *rose* are natural ways to say that sales went up."

[questions.cefr-b2-044]
explanation = "The balanced review states a strength, a limitation, and a recommendation in a register suitable for a work report."

[questions.cefr-b2-x001]
prompt = "You ______ have told us about the allergy; we could have prepared another meal."
options = ["should", "shouldn't", "must", "may"]
explanation = "Should have + past participle expresses an action that was advisable in the past but did not happen."

[questions.cefr-b2-x002]
prompt = "If Nia had accepted the role, she ______ in Singapore now. Choose the form that emphasises an ongoing temporary situation."
options = ["would live", "would be living", "will be living", "had lived"]
explanation = "This is a mixed conditional: a past condition has a present result."

[questions.cefr-b2-x003]
prompt = "Only after the review ______ how much the original estimate had missed."
options = ["we understood", "did we understand", "we had understand", "had we understood"]
explanation = "A fronted Only after phrase triggers inversion: did + subject + base verb."

[questions.cefr-b2-x004]
prompt = "He stopped ______ some water before continuing his walk."
options = ["drinking", "to drink", "drink", "drank"]
explanation = "Stop to drink means pause another activity in order to drink; stop drinking means cease drinking."

[questions.cefr-b2-x005]
prompt = "The editor asked for a ______ report that would fit on four pages."
options = ["four pages", "four-page", "four-pages", "four-pages-long"]
explanation = "A compound adjective before a noun is hyphenated and its measure stays singular: four-page report."

[questions.cefr-b2-x006]
prompt = "Select the sentences with correct perfect modals or inversion."
options = ["You needn't have printed the form; a digital copy was enough.", "Rarely we have seen such a clear result.", "Had I known about the change, I would have booked earlier.", "The team may have taken the earlier train.", "Not only she explained the issue, but she also proposed a fix."]
explanation = "The correct options use modal + have + past participle or correct inversion after a restrictive phrase."

[questions.cefr-b2-x007]
prompt = "Select the sentences that use ellipsis or substitution naturally."
options = ["I prefer the first draft, and Maya does too.", "The blue folder is mine; take the blue one.", "I don't think so; the figures look incomplete.", "The first team completed the audit, and the second did so as well.", "We expected delays, and the delays we did."]
explanation = "So/neither, one and do so avoid repetition, but each must match the earlier meaning."

[questions.cefr-b2-x008]
prompt = "Choose the sentences with correctly formed compound adjectives or noun phrases."
options = ["They submitted a four-page proposal.", "The company needs a long-term plan.", "We reviewed a two-hours meeting.", "She interviewed a well-known researcher.", "The team prepared a highly detailed report."]
explanation = "Four-page, long-term and well-known are hyphenated before nouns; highly detailed uses an adverb correctly; two-hours meeting has the wrong plural form."

[questions.cefr-b2-x009]
prompt = "Complete the deductions or criticisms with a perfect modal.\n\n1. The lights are off and the office is empty. They {{blank}} already. (must / leave)\n2. The signed paper copy is still on my desk, so you {{blank}} it yesterday. (can't / send)\n3. We missed the deadline. We {{blank}} the dates earlier. (should / check)"
explanation = "A perfect modal uses modal + have + past participle; must/can't express deductions, while should have expresses a past action that was advisable."

[questions.cefr-b2-x010]
prompt = "Complete the future forms.\n\n1. By June, the council {{blank}} two new cycle paths. (build)\n2. At this time tomorrow, we {{blank}} to the conference. (travel)\n3. By the time the guests arrive, I {{blank}} the presentation. (finish)"
explanation = "The future perfect marks completion before a future point; the future continuous describes an action in progress at that point."

[questions.cefr-b2-x011]
prompt = "Complete each sentence with the form that matches the meaning.\n\n1. Please remember {{blank}} the signed copy today; it is still on your list. (send)\n2. I remember {{blank}} the new director at last year's conference. (meet)\n3. We stopped {{blank}} a map because we were lost. (buy)"
explanation = "Remember to do means remember a task to be done; remember doing means recall a past action; stop to buy means pause in order to buy."

[questions.cefr-b2-x012]
prompt = "Complete the sentences with a quantifier or article.\n\n1. {{blank}} of the evidence was checked twice, but only a {{blank}} of the figures were confirmed.\n2. Every applicant must bring {{blank}} identification.\n3. The more carefully we plan, {{blank}} the fewer problems we are likely to face."
explanation = "Evidence and identification are uncountable; a few takes a plural noun; every takes a singular noun; use the more..., the fewer... pattern."

[questions.cefr-b2-x013]
prompt = "Complete the formal structures.\n\n1. Only when the final figures arrived {{blank}} the scale of the problem. (we / understand)\n2. What the committee needs {{blank}} a clearer set of criteria. (be)\n3. It is widely {{blank}} that the old system costs too much. (believe)"
explanation = "A fronted Only when clause triggers did-inversion; a What-clause subject takes singular agreement; an impersonal passive uses is believed."

[questions.cefr-b2-x014]
prompt = "Write three or four sentences recommending a change to a public service. Include one cautious deduction, one concession and one structure referring to an earlier action."
keywords = [["may", "might"], ["although", "while"], ["should have", "could have"]]
model_answer = "The long queues may have been caused by the reduced opening hours. Although the change saved money, it has made access more difficult. The council should have consulted regular users before closing the desk. A trial evening service could address both concerns."
explanation = "The model includes hedging, concession and a perfect modal; the checker only matches keywords."

[questions.cefr-b2-x015]
prompt = "The new security process could {{blank}} a risk if staff are not trained first."
options = ["pose", "do", "make", "reach"]
explanation = "Pose a risk is the natural collocation for creating a risk."

[questions.cefr-b2-x016]
prompt = "The report uses survey results to {{blank}} attention to the gap between the two groups."
options = ["draw", "make", "take", "put"]
explanation = "Draw attention to is the standard collocation."

[questions.cefr-b2-x017]
prompt = "The two departments need to get on the same {{blank}} before the launch."
options = ["page", "book", "paper", "line"]
explanation = "On the same page is an idiom meaning to share the same understanding."

[questions.cefr-b2-x018]
prompt = "The company chose an {{blank}} design that uses less energy and fewer materials."
options = ["economic", "economical", "economics", "economically"]
explanation = "Economical describes a design that saves money or resources; economic usually relates to the economy."

[questions.cefr-b2-x019]
prompt = "The website includes captions and keyboard navigation to improve {{blank}} for all users."
options = ["accessible", "accessibility", "accessibly", "access"]
explanation = "Accessibility is the noun describing how easy something is to access."

[questions.cefr-b2-x020]
prompt = "Select the natural B2 collocations."
options = ["The campaign aims to raise awareness of road safety.", "We have to meet the deadline by Thursday.", "After two hours, both sides reached a compromise.", "The report contains strong evidence for the claim.", "The update may pose a risk to older devices."]
explanation = "Raise awareness, meet a deadline, reach a compromise, strong evidence and pose a risk are natural collocations."

[questions.cefr-b2-x021]
prompt = "Choose the phrases that fit a formal report better than an informal team chat."
options = ["We should investigate the cause of the delay.", "We need to sort this mess out ASAP.", "The findings raise a concern about data quality.", "The team reached a conclusion after reviewing the evidence.", "That new tool is a piece of cake."]
explanation = "Investigate, raise a concern and reach a conclusion suit a report; slang and casual idioms are more informal."

[questions.cefr-b2-x022]
prompt = "Select the sentences that use the phrasal verbs naturally."
options = ["A larger company took over the local supplier in March.", "She brought up the missing figures during the review.", "We put off the launch until the safety checks were complete.", "I came across an old photograph while sorting the files.", "He took over the meeting by postponing it until June."]
explanation = "Take over means assume control; bring up means mention a topic; put off means postpone; come across can mean find by chance."

[questions.cefr-b2-x023]
prompt = "Complete each sentence with the correct form of the word in brackets.\n\n1. The system's long-term {{blank}} is essential for the service. (rely)\n2. The building is fully {{blank}} to wheelchair users. (access)\n3. They presented the results {{blank}} and clearly. (effective)"
explanation = "Reliability is a noun; accessible is an adjective; effectively is an adverb modifying presented."

[questions.cefr-b2-x024]
prompt = "Complete each sentence with the correct word form.\n\n1. The study found a small but {{blank}} difference between the groups. (significance)\n2. Better public transport can improve economic {{blank}} in rural areas. (grow)\n3. We need an {{blank}} review before publishing the report. (independence)"
explanation = "Significant is an adjective; growth is a noun; independent is an adjective before review."

[questions.cefr-b2-x025]
prompt = "Complete each phrasal verb.\n\n1. The chair asked the speaker to {{blank}} up the safety concern.\n2. A new director will {{blank}} over the department in January.\n3. We had to put {{blank}} the workshop because the trainer was ill."
explanation = "Bring up means mention; take over means assume control; put off means postpone."

[questions.cefr-b2-x026]
prompt = "Complete the collocations with the correct word.\n\n1. The team must {{blank}} a deadline without reducing quality.\n2. The campaign hopes to raise {{blank}} about online fraud.\n3. After discussion, they reached a {{blank}} on the meeting time."
explanation = "Meet a deadline, raise awareness and reach a compromise are standard collocations."

[questions.cefr-b2-x027]
prompt = "Complete the sentence with a word that keeps the meaning cautious.\n\nThe evidence is not conclusive, but it {{blank}} points to a problem with the older model."
explanation = "Tentatively signals a cautious conclusion."

[questions.cefr-b2-x028]
prompt = "Write three sentences for a formal proposal. Identify one risk, suggest one response and use one precise collocation or phrasal verb."
keywords = [["pose a risk"], ["mitigate", "reduce"], ["decision", "compromise"]]
model_answer = "The lack of staff training may pose a risk to the new service. A short pilot could help mitigate the problem before the full launch. The committee should reach a decision after reviewing the results."
explanation = "The model uses pose a risk, mitigate and reach a decision; keywords do not assess register or overall accuracy."

[questions.cefr-b2-x029]
prompt = "The evidence is incomplete, but several customers report the same fault. Which response is appropriately cautious?"
options = ["The supplier definitely caused the fault.", "The fault may have started after the latest update.", "There is no possible connection.", "Everyone knows the update is unsafe."]
explanation = "May have expresses a reasonable deduction without presenting the cause as certain."

[questions.cefr-b2-x030]
prompt = "Your colleague proposes cutting all evening support. You recognise the budget concern but disagree. Which response is most constructive?"
options = ["That is a terrible idea.", "I understand the budget pressure; however, removing all evening support could leave urgent users without help.", "You never listen to the team.", "We should stop discussing the budget."]
explanation = "The best response acknowledges the budget concern and then states a specific risk."

[questions.cefr-b2-x031]
prompt = "Two teams need the same meeting room. Which proposal offers a practical compromise?"
options = ["One team should cancel every meeting.", "Could we reserve mornings for Team A and afternoons for Team B for a month, then review usage?", "The room belongs to whoever books first forever.", "We should move all meetings online without asking."]
explanation = "Sharing time according to need and trying a revised schedule creates a negotiable option."

[questions.cefr-b2-x032]
prompt = "A discussion is dominated by two people. What can the chair say to invite another view?"
options = ["We have already heard enough.", "Sam, would you like to add a perspective before we decide?", "You must agree with the majority.", "Let's ignore the quieter people."]
explanation = "A direct but low-pressure invitation gives another participant a turn."

[questions.cefr-b2-x033]
prompt = "You need to interrupt briefly and return to the speaker's point. Which phrase is suitable?"
options = ["Stop talking; I have a better idea.", "Could I come in briefly? I’ll return to your point in a moment.", "I will ignore what you said.", "That is not relevant."]
explanation = "Asking to interrupt briefly and promising to return to the point helps maintain the discussion."

[questions.cefr-b2-x034]
prompt = "Select the phrases that help negotiate without sounding aggressive."
options = ["Could we test the smaller option first and review the results?", "You have to accept my plan.", "I take your point; one concern is the effect on weekend staff.", "What would both teams need in order to agree?", "If you disagree, we can end the meeting."]
explanation = "The correct phrases set conditions, acknowledge a point or seek common ground instead of issuing orders."

[questions.cefr-b2-x035]
prompt = "Which phrases are useful for facilitating an online discussion?"
options = ["I’ll pause here and invite anyone who has not spoken to comment.", "Your microphone is bad, so your point does not count.", "Let me check that I understood the proposal correctly.", "We seem to agree on the goal but not the timeline.", "Please stop repeating yourself."]
explanation = "The correct phrases manage turns, summarise and invite clarification; blame increases tension."

[questions.cefr-b2-x036]
prompt = "A policy is written in technical language. Select mediation strategies that make it easier to act on."
options = ["Replace specialised terms with familiar words and give a short example.", "Remove the exception because it makes the policy longer.", "Keep the deadline and eligibility condition in the explanation.", "Ask the colleague to explain the next step in their own words.", "Translate every word literally even when the result is unclear."]
explanation = "Rephrasing terms, preserving key conditions and checking understanding support access; removing a warning changes the meaning."

[questions.cefr-b2-x037]
prompt = "Complete the phrases for managing turns.\n\n1. Before we move on, could we hear {{blank}} Priya?\n2. May I come {{blank}} with one question?\n3. Let me finish the summary, and then we can open the {{blank}}."
explanation = "Hear from, come in and open the floor are natural meeting expressions."

[questions.cefr-b2-x038]
prompt = "Complete the cautious statements.\n\n1. The figures {{blank}} to suggest that demand is increasing.\n2. One possible {{blank}} is that the survey missed younger users.\n3. We cannot {{blank}} out a delay in the supply chain."
explanation = "Seem to suggest, possible explanation and rule out suit qualified deductions."

[questions.cefr-b2-x039]
prompt = "Complete the meeting recap.\n\nWe agreed to test option B for one month, {{blank}} to approval from Finance. The team will then {{blank}} the results and {{blank}} a recommendation."
explanation = "Subject to approval states a condition; review the results and make a recommendation are appropriate next steps."

[questions.cefr-b2-x040]
prompt = "Complete the compromise proposal.\n\nI understand why the team prefers a longer trial. {{blank}}, we could begin with four weeks and extend it if early results are positive."
explanation = "However introduces a balanced proposal that contrasts with the previous point."

[questions.cefr-b2-x041]
prompt = "Complete the check for shared understanding.\n\nTo confirm, we will collect data for six weeks and then compare results. Have I understood that {{blank}}? Please {{blank}} me if I have missed a condition."
explanation = "Understood that correctly checks comprehension; correct me invites the other person to fix a misunderstanding."

[questions.cefr-b2-x042]
prompt = "Write a short meeting comment about a proposed change. Acknowledge one benefit, raise one evidence-based concern and suggest a compromise."
keywords = [["benefit", "advantage"], ["concern", "risk"], ["trial", "pilot"]]
model_answer = "I can see the benefit of reducing support hours because it would lower costs. One concern is that the request data shows many users need help after six. Could we run a four-week pilot and review the results before making a permanent change?"
explanation = "The model includes a concession, a concern and a trial proposal; keyword scoring does not assess real-time interaction."

[questions.cefr-b2-x043]
prompt = "Read the report extract: “Most participants completed the new form in under five minutes. However, users with screen readers reported difficulty locating the submission button.” What is the main conclusion?"
options = ["The form is unusable for everyone.", "The form is generally quick, but screen-reader access needs improvement.", "The submission button should be removed.", "The study measured only typing speed."]
explanation = "The overall result is positive, but the report identifies an accessibility issue that needs attention."

[questions.cefr-b2-x044]
prompt = "A writer says, “The figures may indicate a rise in demand, although the sample is small.” What is the writer's attitude?"
options = ["Certain that demand has risen sharply.", "Cautious because the evidence is limited.", "Angry about the survey.", "Uninterested in the result."]
explanation = "May indicate and although the sample is small signal a cautious, qualified claim."

[questions.cefr-b2-x045]
prompt = "Which paraphrase keeps both the meaning and the level of certainty? Source: “The change may reduce waiting times.”"
options = ["The change will eliminate waiting times.", "The change could make waiting times shorter.", "The change has already shortened every queue.", "The change cannot affect waiting times."]
explanation = "May reduce must remain tentative; will eliminate makes a stronger claim than the source."

[questions.cefr-b2-x046]
prompt = "You are sending a proposal to an external partner you have not met. Which opening best fits the register?"
options = ["Hey, here's our idea.", "Dear Ms Patel, I am writing to propose a short pilot of the new service.", "Listen, we need you to agree.", "Hi mate, check this out."]
explanation = "A named greeting and a clear purpose suit a professional email; hey is too informal here."

[questions.cefr-b2-x047]
prompt = "A report gives findings first, then discusses causes and recommendations. Which sentence belongs in the recommendation section?"
options = ["Forty-two per cent of users completed the form.", "The delay was most common on Mondays.", "We recommend testing the revised form with screen-reader users before launch.", "Some users may have missed the final page."]
explanation = "A recommendation proposes an action; the other choices state findings or explanations."

[questions.cefr-b2-x048]
prompt = "Two sources discuss a new cycle lane. Select the claims supported by the excerpts.\n\nSource A: “The lane reduced the average bus journey by two minutes on weekdays.”\nSource B: “Cyclist numbers rose, though the survey did not measure weekend use.”"
options = ["The average weekday bus journey became two minutes shorter.", "The sources prove that weekend cycling increased.", "Cyclist numbers rose according to Source B.", "The survey measured weekend use carefully.", "The lane had some measured weekday effect."]
explanation = "The correct options preserve the facts and measurement limits in both sources."

[questions.cefr-b2-x049]
prompt = "Select the statements that distinguish fact, inference and opinion accurately.\n\nText: “The centre recorded 120 visits in June, up from 90 in May. The new evening hours may have contributed. Staff say the centre feels more welcoming.”"
options = ["There were 120 visits in June.", "Evening hours definitely caused the increase.", "The centre had 30 more visits than in May.", "The new hours may have contributed to the increase.", "Staff think the centre feels more welcoming."]
explanation = "Visit counts are facts; may have contributed is a qualified inference; welcoming is staff opinion."

[questions.cefr-b2-x050]
prompt = "Choose the sentences with clear cohesion and accurate reference."
options = ["The council extended library hours. This change helped evening students.", "The report lists three barriers. These include cost, travel time and limited opening hours.", "Although the sample was small, the results were useful.", "The school changed the timetable. It was very helpful. (no clear referent for it)", "The proposal was revised twice; the final version addresses the main concern."]
explanation = "The correct sentences use clear reference and appropriate linkers; it is ambiguous when its referent is unclear."

[questions.cefr-b2-x051]
prompt = "Complete the paragraph with accurate linkers.\n\n{{blank}} the sample was small, both groups preferred the earlier opening time. The result is promising. {{blank}}, it should be checked with a larger group. {{blank}}, the team recommends a short pilot."
explanation = "Although introduces a concession; however signals a limitation; therefore introduces the resulting recommendation."

[questions.cefr-b2-x052]
prompt = "Complete the synthesis with a clear reference word.\n\nThe first survey found that price was the main barrier. The second found that travel time was the main barrier. {{blank}} findings suggest that access has more than one cause."
explanation = "These refers clearly to the plural findings in the preceding sentences."

[questions.cefr-b2-x053]
prompt = "Paraphrase the claim without changing its certainty.\n\nSource: “The revised process may shorten approval times.”\n\nThe revised process {{blank}} reduce the time needed for approval."
explanation = "Could paraphrases may while preserving the source's uncertainty."

[questions.cefr-b2-x054]
prompt = "Complete the report sentence with a precise attribution.\n\n{{blank}} the staff survey, several employees found the new booking system easier to use. The survey included 86 responses."
explanation = "According to the staff survey attributes the claim to its source rather than presenting it as unsupported fact."

[questions.cefr-b2-x055]
prompt = "Replace the informal idiom with a formal phrase.\n\nThe two teams are finally “on the same page” about the launch date.\n\nThe two teams now {{blank}} the same understanding of the launch date."
explanation = "Share the same understanding conveys the same idea in a more formal register."

[questions.cefr-b2-x056]
prompt = "Write a short synthesis of two viewpoints about a new workplace policy. State one point of agreement, one difference and a cautious recommendation."
keywords = [["both", "agree"], ["whereas", "while", "differ"], ["pilot", "trial", "review"]]
model_answer = "Both groups agree that the current booking process is confusing. The support team wants a single online form, whereas the reception team is concerned about access for visitors without smartphones. A short pilot with a paper alternative may help the organisation review both needs before making a decision."
explanation = "The model states common ground, a difference and a qualified recommendation; the checker does not fully assess source synthesis."
