[modules.cefr-b2-grammar-plus]
title = "B2 · Grammar in Context"
description = "Narrative tenses, future in the past, verb patterns with changing meanings, quantifiers, noun phrases, emphasis, and natural substitution."
lesson = '''
### Telling stories and looking back at plans
| Structure | Use | Example |
|---|---|---|
| Past simple | Main events in sequence | *Mia opened the email and called her manager.* |
| Past continuous | Background or an action in progress | *I was driving when the storm began.* |
| Past perfect | An event before a past reference point | *They had left before we arrived.* |
| Past perfect continuous | Emphasising duration before a past reference point | *He had been waiting for an hour when the bus came.* |
| was/were going to; would | An intention or future viewed from the past | *I was going to call, but I forgot.* / *She said she would help.* |

### Verbs followed by to V or V-ing
The form after a verb can change its meaning. *Remember to lock the door* means remembering a task that still needs to be done; *remember locking it* means recalling that you did it. *Stop to answer the phone* means pausing another activity in order to answer; *stop answering calls* means no longer answering them. *Try to restart the app* means making an effort to restart it; *try restarting it* means testing that as a possible solution. *Regret to say* often introduces bad news; *regret saying it* means feeling sorry about something already said. Read the context instead of memorising a mechanical list.

### Quantifiers and noun phrases
| Phrase | Meaning | Example |
|---|---|---|
| few / little | Almost none; often negative in tone | *Few people noticed the change.* |
| a few / a little | A small amount or number that is still available | *We have a few options and a little time.* |

A noun can modify another noun: *a customer service team*, *a three-day trip*. Compound adjectives are often hyphenated before a noun: *a well-known author*, *a time-consuming task*. The usual order of several adjectives is opinion, size/age, colour, origin, material, then noun; avoid a long string when a shorter sentence would be clearer.

### Emphasis, evaluation, and avoiding repetition
*I do understand your concern* uses *do/does/did + base verb* to emphasise an affirmative statement; do not add *-s* or *-ed* to the verb after the auxiliary. *You should have checked the date* expresses criticism or regret about the past. *You needn't have brought food* tells the listener that they brought it, although it was unnecessary; *You didn't need to bring food* only says there was no need, without confirming whether they brought any. To avoid repetition, use *one/ones* for countable nouns (*the blue one*), *do so* for an action just mentioned, or *so/not* after verbs such as *think* (*I think so; I hope not*). Learners may use *few* instead of *a few*, leave the main verb unchanged after *did*, or write *I am agree*. Distinguish the quantifiers, use the base verb after *do*, and say *I do agree* when you need emphasis.
'''

[questions.cefr-b2-001]
explanation = "The past continuous sets the background action; the past perfect shows that leaving the wallet behind happened before the speaker noticed."

[questions.cefr-b2-002]
explanation = "*Was going to* describes an intention in the past; the next clause shows that the plan changed."

[questions.cefr-b2-003]
explanation = "*Stop + V-ing* means to end that activity. *Stop to enter* would mean pausing another activity in order to go in."

[questions.cefr-b2-004]
explanation = "*Passengers* is a plural countable noun. *Few* emphasises that the number is very small; *a few* means there are some."

[questions.cefr-b2-005]
explanation = "For emphasis in an affirmative statement, use *do + base verb*: *I do have*. Do not use *am* or inflect the verb after *do/did*."

[questions.cefr-b2-006]
explanation = "The correct sentences use *had + past participle* for an event before a past reference point. Sentence 3 does not need the past perfect for a state at a specific time; sentence 4 combines the present perfect with a finished past-time reference."

[questions.cefr-b2-007]
explanation = "*Remember to do* means remembering a task that needs to be done; *remember doing* means recalling that you did it. *Stop to talk* means pausing another activity to talk. *Try doing* means testing a solution. The last sentence should use *regret buying*."

[questions.cefr-b2-008]
explanation = "*Time* is uncountable; *a little* means that a small amount remains. *Little time* emphasises that there is almost no time left."

[questions.cefr-b2-009]
explanation = "The students left before the teacher arrived, so the earlier action takes the past perfect."

[questions.cefr-b2-010]
explanation = "To remind someone to do something later, use *remember + to V*. Both *switch off* and *turn off* are natural here."

[questions.cefr-b2-011]
explanation = "The response includes a past continuous background, an earlier event in the past perfect, and the original plan with *was going to*."

[modules.cefr-b2-vocab]
title = "B2 · Vocabulary in Chunks and Nuance"
description = "Collocations, phrasal verbs with multiple meanings, word formation, common idioms, and easily confused word pairs."
lesson = '''
### Learn words in chunks
At B2, knowing the separate meanings of words is not enough; you also need to remember which words commonly go together. Examples include *make progress*, *heavy traffic*, *reach a decision*, *raise awareness*, *take responsibility*, and *meet a deadline*. Avoid translating word by word from Vietnamese: these collocations do not use *do a progress* or *strong rain*. When recording a new word, save the whole phrase and an example sentence with context.

### Phrasal verbs: use context to choose a meaning
| Phrase | Common meaning | Example |
|---|---|---|
| bring up | mention a topic; raise a child | *She brought up the cost at the meeting.* |
| put off | postpone | *They put off the trip until June.* |
| take over | take charge; gain control | *A new manager took over the team.* |
| find out | discover or learn information | *We found out why the bus was late.* |
| turn down | refuse; lower the volume | *He turned down the offer.* |

Some phrasal verbs have several meanings, so identify the object and situation before interpreting them. With a pronoun as the object, some separable phrasal verbs split: say *turn it down*, not *turn down it*.

### Word formation and easily confused pairs
Prefixes and suffixes can change a word's part of speech or meaning: *rely → reliable → reliability*; *decide → decision*; *success → successful → successfully*; *possible → impossible*. Use the word's position in the sentence to predict its part of speech: after *a/an/the* you often need a noun; before a noun you often need an adjective; after a verb you may need an adverb.

| Word | Common use | Example |
|---|---|---|
| affect | verb: influence | *Noise can affect sleep.* |
| effect | noun: result or impact | *The change had little effect.* |
| economic | related to the economy | *economic growth* |
| economical | efficient and not wasteful to use | *an economical car* |

Use common idioms in the right situation; avoid them in a formal letter if they sound too casual: *break the ice* (help people start talking), *under the weather* (feeling unwell), *once in a while* (occasionally). Learners often confuse *affect/effect*, choose the wrong preposition in a collocation, or change a word in an idiom. Look up the full phrase, note its part of speech, and write a new example. If you are unsure about the tone, choose a direct, neutral expression.
'''

[questions.cefr-b2-012]
explanation = "The natural collocation is *make progress*. Avoid translating the phrase word for word as *do progress*."

[questions.cefr-b2-013]
explanation = "*Bring up an issue* means to mention it so people can discuss it."

[questions.cefr-b2-014]
explanation = "*Put off* means to postpone an event or plan."

[questions.cefr-b2-015]
explanation = "*Economic effects* are effects related to the economy; *economical* usually means efficient and inexpensive to use."

[questions.cefr-b2-016]
explanation = "*Break the ice* means to ease the initial awkwardness so people can start talking more comfortably."

[questions.cefr-b2-017]
explanation = "The natural collocations are *make progress*, *heavy traffic*, and *raise awareness*. Say *make a decision*; *progress* is not used with *take* in this way."

[questions.cefr-b2-018]
explanation = "*Take over* means to take charge; *put off* means to postpone; *bring up* can also mean to raise a child; and *find out* means to discover information. *Turn down the music* means to lower its volume, not to accept it."

[questions.cefr-b2-019]
explanation = "A noun is needed here: *effect*. *Affect* is usually a verb: *The timetable affected attendance.*"

[questions.cefr-b2-020]
explanation = "An adjective is needed after *is* to describe the guide: *reliable*."

[questions.cefr-b2-021]
explanation = "The common collocation is *heavy traffic* for a road with many vehicles."

[questions.cefr-b2-022]
explanation = "A persuasive response gives specific benefits and uses phrases that suit a community event."

[modules.cefr-b2-functions]
title = "B2 · Discussion, Persuasion, and Negotiation"
description = "Expressing degrees of certainty, giving reasons, disagreeing tactfully, finding compromises, presenting, and facilitating discussion."
lesson = '''
### Making reasoned inferences
When you are not sure, let the listener know how confident you are and why: *It might be a delivery delay; the roads are very busy.* With stronger evidence, say *She must be on the train; she sent us a photo from the platform.* If something is almost impossible, say *That can't be the right room; the sign shows a different number.* Distinguish what you know from what you infer; avoid saying *definitely* when you have only one clue.

### Persuading and disagreeing
A clear argument usually includes a proposal, a reason, and a specific benefit: *We should extend the opening hours because many students finish work at six.* You can emphasise a practical benefit: *This would give more people time to use the service.* To disagree politely, acknowledge part of the other person's point and then explain a limitation: *I see your point about cost. However, the current system also wastes staff time.* Avoid *You are wrong* or *I agree, but…* if the tone could sound dismissive; give facts or consequences instead of judging the speaker.

### Negotiating and facilitating
Reaching agreement often means suggesting options, asking what the other person needs, and confirming what you have agreed: *Could we try this for one month?* · *Would a later start work for you?* · *It sounds as if we agree on the date.* You can suggest meeting halfway or trying an option for a short time and reviewing it later. A facilitator helps everyone take part: *Could we hear from someone who hasn't spoken yet?* They clarify with *Could you explain what you mean by “flexible”?*, summarise with *So far, we have agreed to…*, and signal when the discussion is moving to a new point.

### Giving a clear presentation
Open by stating your aim: *Today I'd like to explain…*; move between sections with *Let me move on to the next point*; introduce examples with *For example…*; finish with *To sum up…*; and invite questions with *Are there any questions?* These phrases help listeners follow the structure without overly formal transitions. Learners sometimes translate directly into *I very agree* or disagree too bluntly. Say *I completely agree* to show agreement; otherwise, try *I understand your concern, although…* or *Could we consider…?* to keep the exchange collaborative.
'''

[questions.cefr-b2-023]
explanation = "*May have been delayed* expresses a possibility based on limited information. The other choices make excessive or unsupported claims."

[questions.cefr-b2-024]
explanation = "The proposal is supported by a reason and a practical benefit; its wording does not impose an absolute conclusion."

[questions.cefr-b2-025]
explanation = "The response acknowledges the concern about costs and then gives a specific consequence, while keeping a polite tone."

[questions.cefr-b2-026]
explanation = "Trying both options and comparing the results is a compromise that can be evaluated."

[questions.cefr-b2-027]
explanation = "*Let me move on to…* is a natural phrase that signals a transition to the next section."

[questions.cefr-b2-028]
explanation = "The selected phrases invite someone else to contribute, summarise an area of agreement, and ask for clarification."

[questions.cefr-b2-029]
explanation = "The selected responses acknowledge the other person's view or priorities and then add a reason or another criterion to consider."

[questions.cefr-b2-030]
explanation = "*Could you explain…?* is a polite way to ask someone to clarify information."

[questions.cefr-b2-031]
explanation = "*Meet halfway* describes each side making a partial concession to reach an agreement."

[questions.cefr-b2-032]
explanation = "*Summarise/summarize* means to give a brief account of the main points. Both British and American spellings are accepted."

[questions.cefr-b2-033]
explanation = "The response makes a concession, raises a concern, and suggests a compromise."

[modules.cefr-b2-reading-writing]
title = "B2 · Reading and Writing Clear Texts"
description = "Organising essays, reports, reviews, and formal letters; controlling register, cohesion, and paraphrase."
lesson = '''
### Opinion and for-and-against essays
An opinion essay introduces the topic and states a clear view, then develops each reason with an explanation or example; its conclusion restates the position in different words. A for-and-against essay presents both advantages and disadvantages before reaching a conclusion. Each paragraph should have a topic sentence and supporting sentences that develop the same point. *Firstly*, *in addition*, *on the other hand*, and *finally* show how ideas relate, but they do not replace an argument.

### Reports, reviews, and formal letters
Reports often have a title or short sections such as *Purpose*, *Findings*, and *Recommendations*. Focus on results, use clear sentences, and keep a neutral tone: *The survey found that…*; *It is recommended that the opening hours be extended.* A review should state its criteria, strengths, limitations, and final assessment instead of simply saying *It was good*. In a formal letter, use an appropriate greeting (*Dear Ms Lee,*), state your purpose early (*I am writing to enquire about…*), and close politely (*Kind regards,*). Avoid informal wording such as *Hey*, *gonna*, or *send me this now* when writing to an organisation or customer.

### Cohesion and paraphrase
Cohesion links sentences through clear pronoun references (*The library changed its hours. This decision…*), connectors that express the right relationship (*however* for contrast; *as a result* for a consequence), and reduced repetition. Pronouns such as *it/they/this* need an easy-to-identify referent. A paraphrase preserves the information while changing the structure or suitable vocabulary: *The council reduced fares* can be rephrased as *Bus tickets became cheaper*. Do not change only one word if that distorts the meaning, and do not add a conclusion that the source does not state. Learners sometimes write *In my opinion, I think* (a repeated opinion marker), *regarding to* (an incorrect phrase), or join several clauses with commas. Choose either *In my opinion* or *I think*, write *regarding the issue*, and use separate sentences or a connector with correct punctuation.
'''

[questions.cefr-b2-034]
explanation = "A for-and-against essay should present both sides before concluding; its paragraphs should support a clear structure."

[questions.cefr-b2-035]
explanation = "The topic sentence introduces the main idea to be developed: the benefits of urban parks."

[questions.cefr-b2-036]
explanation = "The sentence uses a neutral report style, gives a specific finding, and fits the findings section."

[questions.cefr-b2-037]
explanation = "The greeting and polite opening state the purpose clearly and suit an email to a company."

[questions.cefr-b2-038]
explanation = "*This change* clearly refers to the extended opening hours; the other choices are vague or grammatically incorrect."

[questions.cefr-b2-039]
explanation = "The first sentence preserves the time and result relationship while changing the wording and structure. The others change the meaning or add an idea."

[questions.cefr-b2-040]
explanation = "The selected sentences use a result relationship, a clear pronoun reference, or a contrast connector with appropriate punctuation."

[questions.cefr-b2-041]
explanation = "These words introduce a concessive clause. *Despite* must be followed by a noun or V-ing form, not a complete clause."

[questions.cefr-b2-042]
explanation = "*This* can refer to the whole statement just made; this singular subject takes the verb *surprised*."

[questions.cefr-b2-043]
explanation = "Both *increased* and *rose* are natural ways to say that sales went up."

[questions.cefr-b2-044]
explanation = "The balanced review states a strength, a limitation, and a recommendation in a register suitable for a work report."
