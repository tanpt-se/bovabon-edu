explanation = '''INP measures from the interaction to the next painted frame. Letting the browser paint feedback first and then splitting heavy work (yield via macrotasks/`scheduler.yield`, list virtualization) shortens the delay. Pushing to a microtask still blocks rendering; lazy images and fonts do not touch the long task.'''

