[questions.frontend-lv038]
prompt = '''Interview: 3 squads use 3 different UI libraries, the UI is inconsistent and a11y bugs keep recurring. Would you propose a design system? Describe how you decide, the scope of the first phase, and how you measure success.'''
keywords = [[ '''cost''', '''effort''' ], [ '''token''' ], [ '''component''' ], [ '''owner''', '''platform team''', '''platform''' ], [ '''measure''', '''metric''', '''adoption''', '''rate''' ], [ '''gradual''', '''incremental''', '''phase''', '''step by step''' ], [ '''a11y''', '''accessibility''', '''accessible''' ]]
model_answer = '''First, measure the current **cost**: the number of duplicated UI/a11y bugs, the time spent building the same component in 3 places, and user feedback about inconsistency. If that cost exceeds the effort of maintaining a design system (it needs at least 1–2 part-time **owners**), then propose it.

**First phase** (1 quarter): unify **tokens** (color, spacing, typography) and the 8–10 most used **components** (Button, Input, Select, Dialog, Toast…) with tested **a11y** standards, wrapping existing libraries where possible to reduce effort. Adopt it **gradually**: new code uses the design system, old code migrates when touched.

**Measure success**: adoption rate (% of screens using shared components), number of a11y/UI bugs per month, time to build a new screen, developer surveys. Keep a changelog, semver and a proposal channel so squads do not fork.
'''
explanation = '''A good answer does not default to "yes": it weighs maintenance cost against benefit, starts small and uses data.'''

[questions.frontend-lv039]
prompt = '''The checkout page has been completely rebuilt and accounts for 70% of revenue. It launches into peak season in 3 weeks. Which release strategy fits best?'''
options = [ '''Put it behind a feature flag, roll out by percentage (1% → 10% → 50% → 100%), compare conversion rate, JS errors and CWV between the two versions, with a kill switch that turns it off instantly without a deploy''', '''Deploy to 100% the night before peak season''', '''Test thoroughly on staging only, then deploy to 100%''', '''Postpone indefinitely until there are no bugs left''' ]
explanation = '''A gradual rollout limits the blast radius and provides real data for decisions; a kill switch reduces time to recover. Staging cannot reproduce every browser, data set and real-world load; waiting for "no bugs" means never launching.'''

[questions.frontend-lv040]
prompt = '''The bundle analyzer shows an old date library taking 70 KB gzip (including every locale), imported in 120 files. The library is no longer maintained. Which direction do you choose?'''
options = [ '''Create an internal wrapper module (`formatDate`, `addDays`…) using `Intl` + a small tree-shakeable library, migrate imports with codemods in batches, and add a lint rule banning direct imports of the old library''', '''Leave it as is because it still works''', '''Manually change all 120 files to the new library in one big PR''', '''Copy the old library's source into the repo and maintain it yourselves''' ]
explanation = '''An internal wrapper reduces direct dependence on the library, making the next replacement cheaper; codemods + lint make migration safe and prevent regressions. A huge PR is hard to review; forking a dead library means taking on more maintenance and security debt.'''

[questions.frontend-lvc02]
title = '''Performance budget gate (p75)'''
prompt = '''Write `checkBudget(samples, budget)` used in a daily CI/RUM job to decide whether to alert the team.

- `samples`: an object `{ LCP: number[], INP: number[], CLS: number[] , ... }` — measurements from real users.
- `budget`: an object `{ LCP: 2500, INP: 200, CLS: 0.1 }` — the maximum allowed thresholds.
- For **each metric in `budget`** (keeping the key order of `budget`), compute **p75** using the nearest-rank method: sort ascending, take the element at position `ceil(0.75 * n)` (1-based).
- Return `{ pass, report }`, where `report` is an array of `{ metric, p75, limit, ok }` with `ok = p75 <= limit`.
- A metric with no samples (missing or an empty array) → `p75: null`, `ok: false` (missing data is a bad signal too).
- `pass` is `true` when every row is `ok`.
- Must not modify the input sample arrays.
'''
hints = [ '''Copy before sorting: `[...values].sort((a, b) => a - b)` — the default sort compares as strings.''', '''Iterate over `Object.keys(budget)` to keep the order and skip extra metrics.''' ]
explanation = '''Using p75 instead of the mean avoids being skewed by outliers and matches how Core Web Vitals are assessed. Treating missing data as "fail" helps detect a broken RUM script instead of silently reporting green.'''
