[questions.frontend-lv031]
prompt = '''Write a short ADR choosing a CSS strategy for a new SSR app (team of 8, 3 squads, INP close to the threshold): compare at least CSS Modules, utility-first and runtime CSS-in-JS.'''
keywords = [[ '''context''' ], [ '''css modules''', '''css module''' ], [ '''utility''', '''tailwind''' ], [ '''runtime''', '''css-in-js''' ], [ '''token''', '''css variable''', '''custom propert''' ], [ '''consequence''', '''trade-off''', '''tradeoff''' ], [ '''review''', '''revisit''', '''re-evaluate''' ]]
model_answer = '''**ADR-012: CSS strategy for the SSR app**

**Context:** SSR, 8 devs in 3 squads, INP p75 at ~190 ms, need a consistent UI and theming.

**Options:**
- **CSS Modules + design tokens** (CSS custom properties): no runtime cost, file-scoped, SSR-friendly; consistency depends on linting.
- **Utility-first**: high consistency, little dead CSS; takes time to learn, verbose markup.
- **Runtime CSS-in-JS**: flexible via props but costs style computation at render time, and SSR and streaming are more complex — a risk for INP.

**Decision:** CSS Modules + tokens; allow some utility classes provided by the design system; no runtime CSS-in-JS for new code.

**Consequences:** + no runtime cost, easy to debug; − needs stylelint and review to avoid hard-coded values (an acceptable trade-off).

**Review:** after 2 quarters, based on the number of UI inconsistency bugs and INP.
'''
explanation = '''A good ADR states the context with data, the rejected options and why, consequences both good and bad, and a review date.'''

[questions.frontend-lv032]
prompt = '''Present a one-quarter plan to turn performance budgets and Core Web Vitals into a team process (measurement, CI gates, ownership, handling budget overruns).'''
keywords = [[ '''rum''', '''field''', '''real user''' ], [ '''p75''', '''percentile''' ], [ '''lighthouse''', '''lab''', '''ci''' ], [ '''budget''' ], [ '''owner''', '''ownership''', '''responsib''' ], [ '''dashboard''', '''alert''' ]]
model_answer = '''**Month 1 – Measure:** add RUM (the web-vitals library or PerformanceObserver) sending LCP, INP, CLS with device type and route; a dashboard at **p75** for mobile/desktop. Pick the 5 pages with the most revenue impact as the scope.

**Month 2 – CI gate:** Lighthouse CI (lab) runs on each PR preview with a **budget**: main-route JS, lab LCP, number of third-party requests. Exceeding the budget → the PR is flagged and needs an approved justification.

**Month 3 – Process:** every page has an **owner**; an **alert** fires when p75 worsens past the threshold for 2 consecutive weeks → a priority ticket is created; 10–15% of capacity each sprint goes to performance work; a monthly report to stakeholders.

Risk: lab and field disagree → always decide based on field data; lab only blocks regressions.
'''
explanation = '''Key point: field data as the KPI, lab data as the gate; budgets have owners and clear consequences when exceeded.'''

[questions.frontend-lv033]
