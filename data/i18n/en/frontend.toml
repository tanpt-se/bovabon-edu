[questions.frontend-lv021]
prompt = '''Interview: explain the browser event loop (macrotasks, microtasks, rendering) and how you keep a heavy task from freezing the UI.'''
keywords = [[ '''call stack''', '''stack''' ], [ '''microtask''', '''promise''', '''queuemicrotask''' ], [ '''macrotask''', '''task queue''', '''settimeout''' ], [ '''render''', '''paint''', '''frame''' ], [ '''split''', '''chunk''', '''yield''', '''web worker''', '''worker''' ]]
model_answer = '''JavaScript on the main thread runs on the **call stack**. Each event loop iteration takes **one macrotask** (an event, `setTimeout`, a message), runs it, then drains **all microtasks** (`Promise.then`, `await`, `queueMicrotask`), after which the browser gets a chance to **render** a frame (style, layout, paint; `requestAnimationFrame` runs right before that).

Because rendering only happens between tasks, a long task (> 50 ms) or a never-ending chain of microtasks freezes the UI and hurts INP. To avoid it: **split** the work into **chunks** across many tasks and **yield** the main thread (`setTimeout`, `MessageChannel`, `scheduler.yield()`), update UI feedback before the heavy work, virtualize long lists, and move pure computation to a **Web Worker**.
'''
explanation = '''Bonus points: explaining that microtasks run before rendering, why recursive microtasks block rendering, and measuring with Long Tasks/INP.'''

