}
pump();
setTimeout(() => console.log("tick"), 0);
```
'''
options = [ '''The microtask queue is drained **completely** before the browser renders or runs a macrotask, so a self-chaining microtask blocks both''', '''`queueMicrotask` runs in parallel on another thread and competes for CPU''', '''The browser rounds `setTimeout(…, 0)` up to 1 second''', '''`queueMicrotask` only runs after all timers have finished''' ]
explanation = '''The event loop runs every microtask (including newly queued ones) before rendering and the next macrotask. To yield to rendering/input, split the work using macrotasks (`setTimeout`, `MessageChannel`) or `scheduler.yield()` when available.'''

[questions.frontend-lv015]
