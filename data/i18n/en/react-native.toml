[modules.react-native-dv-network]
title = "Networking & Request Handling"
description = "Calling APIs, distinguishing HTTP errors from network errors, managing request state, and retrying safely."
lesson = '''### Requests in React Native
React Native provides **fetch** for sending HTTP requests. A rejected Promise usually indicates a communication error such as a lost connection; a 404 or 500 is still a valid HTTP response, so check **response.ok** or **response.status** before processing the body.

| Result | How to identify it | How to handle it |
|---|---|---|
| HTTP success | `response.ok` is true | Read the body according to the API format |
| HTTP error | A response exists but `ok` is false | Show an appropriate error; do not assume the body is always JSON |
| Communication error | The request rejects | Allow a limited retry and report offline status |

A data-loading screen should keep loading, success, and error states separate. When the screen's input changes or the user leaves, cancel the request if the environment supports it, or ignore stale results so a slow response cannot overwrite newer data. When the app moves to the background, the operating system may pause JavaScript; important synchronization should resume from the server when the app becomes active.

Use exponential backoff with a retry limit; for 429, honor `Retry-After` when available. Do not blindly resend an order-creation or payment operation: use an idempotency key or confirm the current status before retrying. Send data over HTTPS, never log tokens, and validate server response data before using it in the UI.

Common mistakes: treating every HTTP status as success because fetch does not reject; parsing JSON before checking the response; letting an old request update state after a newer one; retrying forever; or assuming Wi-Fi means the API is always reachable. On mobile, connectivity can change between requests and while a request is in progress.'''

[questions.react-native-dv001]
prompt = "A fetch request receives an HTTP 404 response. Which interpretation is correct?"
options = ["The Promise always rejects and enters catch", "A response exists but `response.ok` is false; handle the status", "The body automatically becomes a JSON error", "React Native automatically retries the request"]
explanation = "An HTTP error such as 404 still produces a response; fetch usually rejects only for communication errors. Check `ok` or `status`."

[questions.react-native-dv002]
prompt = "A screen sends request A, then quickly sends request B. A finishes after B and writes stale data to state. What is the best fix?"
options = ["Ignore all responses with status 200", "Cancel the old request when appropriate or check the request ID before updating state", "Increase request A's timeout", "Move every response to AsyncStorage"]
explanation = "Requests may finish in a different order from the order they were sent. Cancel or ignore stale results to prevent old data from overwriting new data."

[questions.react-native-dv003]
prompt = "An API returns 429 for a read operation that can be retried. What is a reasonable behavior?"
options = ["Retry without limit immediately", "Honor `Retry-After` when present, use backoff, and limit attempts", "Switch to HTTP instead of HTTPS", "Treat 429 as success"]
explanation = "Limited backoff reduces load; `Retry-After` indicates when the server allows another attempt."

[questions.react-native-dv004]
prompt = "Choose good practices for calling an API from a mobile app."
options = ["Distinguish communication errors from unsuccessful HTTP statuses", "Keep loading, success, and error states clear", "Log the access token to help with debugging", "Limit retries and use idempotency for operations with side effects"]
explanation = "Requests need clear state, status handling, and controlled retries. Logging a token exposes sensitive information."

[questions.react-native-dv005]
prompt = "An app needs to reload data when the user returns after leaving it in the background for a long time. Which choices are appropriate?"
options = ["Use AppState to detect the return to active and check the data", "Assume JavaScript runs continuously in the background on both iOS and Android", "Use a timestamp or sync version to decide whether a refresh is needed", "Check only Wi-Fi; if Wi-Fi exists, ignore API errors"]
explanation = "JavaScript may be paused in the background. When the app becomes active, check the data state instead of relying on continuously running tasks."

[questions.react-native-dv006]
prompt = "After receiving a response, check the boolean property `response.{{blank}}` to see whether its status is in the success range."
explanation = "`response.ok` indicates that the status is in the 200–299 range."

[questions.react-native-dv007]
prompt = "For a valid JSON response, read the body asynchronously with `await response.{{blank}}()`."
explanation = "`response.json()` parses the body into a JavaScript value."

[questions.react-native-dv008]
prompt = "In an interview, describe how to build a reliable data-loading screen when the API is slow, returns an HTTP error, or the user leaves the screen."
model_answer = '''Check `response.ok` and the HTTP status before reading the body, and represent loading, success, and error states separately. Cancel the request or ignore stale responses when the screen's data changes or it is left. Retry communication failures and selected statuses with limited exponential backoff; operations with side effects need an idempotency key.'''
explanation = "A strong answer covers UI state, request lifecycle, the difference between HTTP and network errors, and a safe retry policy."

[questions.react-native-dvc01]
title = "Calculate exponential backoff delay"
prompt = "Write `retryDelay(attempt, baseDelay, maxDelay)` to return the wait time for retry number `attempt`. `attempt` starts at 1; the delay doubles each time and never exceeds `maxDelay`. For example, with `baseDelay = 500` and `maxDelay = 3000`, the first delays are 500, 1000, 2000, and 3000 ms. All inputs are valid non-negative integers, except `attempt` is at least 1."
explanation = "Exponential backoff reduces pressure on a server during persistent temporary errors; the cap prevents the wait from growing without limit."
hints = ["Use a power of 2 based on the number of retries already made.", "Use `Math.min` to apply the upper bound."]

[modules.react-native-dv-native]
title = "Native Modules & Native UI Components"
description = "Choosing the right native integration, understanding Codegen and Fabric, and designing safe data boundaries."
lesson = '''### Choosing an extension point
When JavaScript needs to call an iOS- or Android-specific API, a native module provides behavior rather than UI, such as access to a sensor or operating-system service. If you need a native view that can be laid out in the React tree, use a native UI component. Each platform may need its own implementation even when JavaScript uses a shared API.

| Need | Integration approach | New Architecture role |
|---|---|---|
| Call native functionality | Native module | TurboModule |
| Display a native view | Native UI component | Fabric component |
| Define a typed API | Spec for Codegen | Generates the JS/native connection layer |

The New Architecture uses Codegen with a typed spec to generate connection code, helping catch mismatches between the JavaScript interface and native implementation earlier. Fabric manages native UI rendering; TurboModules provide native modules through the new mechanism. These concepts do not generate business logic, replace implementation, or eliminate testing on each platform.

Example: if the app only needs to read battery state, create a module with a read function and an update event; if it needs a native map with interactive markers, use a component with props, commands, and events. Keep data crossing the platform boundary simple, validate types, and handle native errors clearly. After adding native code or a native library, create a matching development build; a JavaScript-only update cannot install a missing native binary component.

Common mistakes: using a module for something that is really a view; implementing only iOS and assuming Android compatibility; ignoring permissions and the native API lifecycle; or assuming Codegen replaces on-device testing. During integration, state which platforms are supported, what happens when permission is missing, and how errors are passed back to JavaScript.'''

[questions.react-native-dv009]
prompt = "The app needs to read data from HealthKit on iOS and Health Connect on Android, without adding native UI. Which integration is the best fit?"
options = ["Native module", "Native UI component", "StyleSheet", "An Expo Router route"]
explanation = "A native module wraps platform behavior or APIs; this requirement does not need a native view."

[questions.react-native-dv010]
prompt = "A product needs to embed a native map view in the React UI tree and receive an event when the user selects a marker. Which integration is correct?"
options = ["A plain native module, because every native API is a module", "A native UI component with props and events", "Call Linking to open a map URL", "Put marker data in a StyleSheet"]
explanation = "Native UI with layout and interaction should be wrapped as a native UI component so React can manage it in the view tree."

[questions.react-native-dv011]
prompt = "How does Codegen mainly support native integration in the New Architecture?"
options = ["It writes all native logic from a Vietnamese description", "It generates a typed connection layer from a spec so JS and native agree on the API", "It replaces Metro during development", "It runs JavaScript directly on the UI thread"]
explanation = "Codegen generates connection code from a typed spec; implementation and testing for each platform are still required."

[questions.react-native-dv012]
prompt = "Choose suitable practices when maintaining a native module used on iOS and Android."
options = ["Test the implementation on every supported platform", "Use a typed spec to describe the public API", "Assume the same function name means both platforms behave identically", "Clearly define how errors and event payloads are represented"]
explanation = "A spec, platform-specific testing, and a clear payload contract reduce mismatches between native and JavaScript."

[questions.react-native-dv013]
prompt = "A native API emits events to JavaScript. What should be clearly designed?"
