options = ["When a short explanation of the action's result adds information not conveyed by the label", "Always repeat the exact `accessibilityLabel`", "To contain the entire screen's content", "To replace `accessibilityRole`"]
explanation = "A hint should add information about the result; role and label are still needed to describe the control."

[questions.react-native-dv028]
prompt = "Choose ways to improve accessibility for a group of controls."
options = ["Use roles and labels that describe their purpose", "Keep `accessibilityState` synchronized with app state", "Use color alone to show selected or disabled states", "Check focus order and how a screen reader reads the group"]
explanation = "Semantics, state, focus order, and testing help users understand and operate the interface."

[questions.react-native-dv029]
