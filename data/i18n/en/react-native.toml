explanation = "`windowSize` controls the area kept around the viewport. Measure on target devices to balance memory and smoothness."

[questions.rn-x007]
prompt = "Some rows disappear or render incorrectly with `removeClippedSubviews` enabled. What is the most reasonable first step?"
