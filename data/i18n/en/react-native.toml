[modules.react-native-dv-accessibility]
title = "Accessibility for Mobile Interfaces"
description = "Designing roles, labels, states, and focus order to support VoiceOver, TalkBack, and users who need accessibility support."
lesson = '''### Semantics for screen readers
A native interface should describe the purpose and state of controls, not only how they look. For an icon-only button, set an appropriate `accessibilityRole` and a short, clear `accessibilityLabel`; use `accessibilityHint` only to explain the next result when the label is not enough. Use `accessibilityState` to represent disabled, selected, checked, expanded, or busy states rather than relying on color alone.

| Property | Question it answers | Example meaning |
|---|---|---|
| Role | What kind of control is this? | button, link, header |
| Label | What is this control called? | Open cart |
| Hint | What will the action do? | Opens the item list |
| State | What state is it in? | selected, disabled, expanded |

Example: a filter chip should have a label naming the filter, a role suitable for the control, and a selected state synchronized with the app's actual state. Do not make a screen reader announce a decorative icon separately if the control's label already communicates enough. For grouped content, consider accessibility grouping to create a natural reading order, but do not combine the entire screen into one element and prevent access to individual controls.

`AccessibilityInfo` provides information about device accessibility settings; the interface should adapt without losing functionality. Check font scaling, contrast, touch-target size, and focus order. Verify directly with VoiceOver on iOS and TalkBack on Android because reading and focus behavior can differ by platform.

Common mistakes: an icon button without a label; a hint that repeats the label verbatim; showing selected state only through color; or putting accessibility props on a non-interactive wrapper while the actual pressable element lacks semantics. Test with a screen reader and appropriate keyboard/focus interaction, not just a screenshot.'''

[questions.react-native-dv025]
