explanation = "This option can cause display issues with some layouts; do not enable it by default without checking the target iOS/Android platforms."

[questions.rn-x008]
prompt = "What is the main idea behind FlashList compared with FlatList?"
options = ["FlashList replaces React Native with the DOM", "FlashList recycles views to reduce view creation/destruction in long lists", "FlashList always loads data from the network", "FlashList removes the need for keys"]
explanation = "FlashList is a third-party library focused on recycling; correct keys/identity are still required, and version and architecture requirements should be checked."

[questions.rn-x032]
prompt = "When there is evidence of a bottleneck, which changes often make a long FlatList more stable?"
options = ["Use stable keys based on IDs", "Use `getItemLayout` when dimensions are fixed", "Pass new objects/functions to every row on each render", "Use `extraData` for dependencies outside `data`", "Increase images to the highest possible resolution"]
explanation = "Stable identity, known layouts, and declared dependencies help FlatList update correctly; new props and heavy images can increase cost."

[questions.rn-x043]
prompt = "In FlatList, pass the function that converts an item to a stable React key through the `{{blank}}` prop."
explanation = "Stable keys help React preserve row identity when data changes."

[questions.rn-x052]
prompt = "Describe how to investigate a list that stutters and explain why it should be measured on a near-production build."
keywords = [["profiling", "profile"], ["release", "production build"], ["hermes"], ["js thread", "javascript thread"], ["measure", "measurement"], ["re-render", "rerender"]]
model_answer = '''Reproduce the issue on a representative device and use React Profiler/Hermes profiling to measure JS thread time, render counts, and UI work. Compare one change at a time, such as stabilizing props, adding `getItemLayout`, or tuning `windowSize`. Development builds have overhead and behave differently from release builds, so confirm on a near-production build before drawing conclusions.'''
explanation = "Profiling distinguishes JS, native, image, and virtualization bottlenecks instead of relying on guesswork."

[questions.rn-xc03]
title = "Estimate the FlatList render window"
prompt = '''Write `getRenderRange(itemCount, itemHeight, viewportHeight, scrollOffset, windowSize)` to return `{ start, end }`, where `end` is inclusive:
- The visible items start at `floor(scrollOffset / itemHeight)` and end at `ceil((scrollOffset + viewportHeight) / itemHeight) - 1`.
- `windowSize` is the total number of viewports kept; distribute the extra area evenly on both sides. Each side adds `floor(((windowSize - 1) * viewportHeight) / (2 * itemHeight))` items.
- Clamp the offset to the valid scroll range and indexes to `[0, itemCount - 1]`.
- For an empty list, return `{ start: 0, end: -1 }`.'''
explanation = "This is a simplified mathematical model of the render window; actual FlatList behavior also depends on batching and layout measurement."
hints = ["Calculate the visible range first, then add overscan on each side.", "Clamp the scroll offset using total content height minus the viewport height."]

[modules.rn-navigation]
description = "React Navigation, stack/tab navigation, deep links, state restoration, and authentication flows."
title = "Navigation"
lesson = '''### React Navigation
- `NavigationContainer` wraps the whole app (Expo Router handles this itself).
- **Native Stack** (`@react-navigation/native-stack`) uses native `UINavigationController`/`Fragment`, so it can feel smoother than a JS stack.
- `navigation.navigate('Profile', { id })` returns to that screen if it is already in the stack; `push` always adds a new instance. Other actions include `goBack`, `popToTop`, and `replace`.
- Read params from `route.params` or `useRoute()`; use `useNavigation()` in a child component.
- A screen in the stack **does not unmount** when another screen is pushed, so use `useFocusEffect` to run logic when the screen gains focus.
- **Deep linking**: configure `linking` (prefix + path-to-screen mapping).
- **Expo Router**: file-based routing (`app/(tabs)/index.tsx`, `app/user/[id].tsx`) built on React Navigation.

### Stack and external URLs
| Action | Meaning |
|---|---|
| `navigate(name)` | Go to a route, possibly returning to an existing route with that name |
| `push(name)` | Always add a new instance to the stack |
| `replace(name)` | Replace the current route |
| `reset(state)` | Replace the entire navigation state |

Example: `app/user/[id].tsx` receives `id` from the URL; pass only an ID or another serializable value in params, then load data in the screen.

Common mistakes: assuming a screen lower in the stack has unmounted, passing callbacks in navigation params, or handling URLs only while the app is already open. Web routes are often tied to browser history; RN needs linking/prefix configuration and must handle both launch URLs and URLs received later.'''

[questions.rn-060]
prompt = "In a Stack, what is the difference between `navigation.navigate('Detail')` and `navigation.push('Detail')`?"
options = ["There is no difference", "`navigate` returns to an existing `Detail` screen in the stack; `push` always adds a new instance", "`push` is only for tabs", "`navigate` clears the stack"]
explanation = "Use `push` when you want multiple screens of the same type stacked (for example, Detail → a related Detail)."

[questions.rn-061]
prompt = "Screen A in a stack has pushed screen B. When returning to A, does A's `useEffect(() => {...}, [])` run again?"
options = ["Yes, because A mounts again", "No — A is not unmounted when B is pushed; use `useFocusEffect` to run logic whenever A gains focus", "Only on Android", "Yes, when using native-stack"]
explanation = "Use `useFocusEffect(useCallback(() => { ...; return cleanup }, []))`."

[questions.rn-062]
prompt = "Which hook provides access to `navigation` in a component that is **not** a screen?"
options = ["`useRoute`", "`useNavigation`", "`useNavigationState`", "`useLinking`"]
explanation = "Use `useRoute()` to read params for the current screen."

[questions.rn-063]
prompt = "In Expo Router, what does `app/user/[id].tsx` correspond to?"
options = ["A static `/user/[id]` route", "A dynamic `/user/:id` route, read with `useLocalSearchParams()`", "The layout for the user directory", "An ignored route"]
explanation = "`_layout.tsx` defines a layout; `(group)` is a group that does not affect the URL."

[questions.rn-064]
prompt = '''Pass and read params:

```jsx
navigation.navigate('Profile', { userId: 42 });

function Profile({ route }) {
  const { userId } = route.{{blank}};
}
```'''
explanation = "Params should be serializable data (such as an ID); do not pass large objects or functions."

[questions.rn-065]
title = "Stack navigation reducer"
prompt = '''Simulate Stack Navigator state. State: `{ routes: [{ name, params }], index }` (`index` is the visible screen, which is the last element).

Implement an immutable `stackReducer(state, action)` supporting:
- `{ type: 'PUSH', name, params }` → add a new route
- `{ type: 'NAVIGATE', name, params }` → if a route with the same `name` exists in the stack, **pop back** to it (and update params if provided); otherwise, behave like PUSH
- `{ type: 'POP', count = 1 }` → remove `count` top routes, but **always keep at least one**
- `{ type: 'POP_TO_TOP' }` → keep only the first route
- `{ type: 'REPLACE', name, params }` → replace the top route
- `{ type: 'RESET', name, params }` → replace the stack with one route
- Any other action → return the original state'''
explanation = "React Navigation itself uses a router in this reducer style (`StackRouter.getStateForAction`)."
hints = ["Write a `make(routes)` helper that calculates `index = routes.length - 1`.", "For NAVIGATE, search backward from the top of the stack."]

[questions.rn-dd05]
title = "Parse a deep link"
prompt = '''The app receives a deep link through `Linking`. Write `parseDeepLink(url, routes)`:

- `url` has the form `scheme://path?query` (for example, `bovabon://course/react/lesson/3?ref=mail`); **ignore** the scheme and extra leading/trailing `/` characters
- `routes` is an object `{ "<pattern>": "<ScreenName>" }`; a pattern uses `:param` (for example, `"course/:courseId/lesson/:lessonId"`)
- Return `{ screen, params }` for the **first** matching route (the number of path segments must match); `params` contains path params and query params (values decoded with `decodeURIComponent`, with `+` converted to a space)
- Return `null` if no route matches
- (Do not use `URL`/`URLSearchParams` — they are unavailable in the test runtime)'''
explanation = "React Navigation handles this through `linking` configuration; understanding the mechanism helps with deep-link debugging. Always check/validate params received from a link."
hints = ["Remove the scheme with the regex `^[a-z][a-z0-9+.-]*://`.", "Compare segments one by one; a segment beginning with `:` is a param."]

[questions.rn-x009]
prompt = "Screen A remains in the stack when screen B is pushed. What should you use to refresh data whenever A gains focus?"
options = ["Only `useEffect(..., [])`", "`useFocusEffect` with a stable callback", "`setTimeout` during render", "Remove `NavigationContainer`"]
explanation = "A screen underneath another screen usually stays mounted. Focus lifecycle differs from mount lifecycle; `useFocusEffect` runs when the screen gains focus."

[questions.rn-x010]
prompt = "The app needs to handle a link both while it is open and when it is launched from a URL. What should be configured?"
options = ["Read `route.params` once", "Handle the initial URL and subscribe to URL events while the app is running", "Only enable `onEndReached`", "Store the URL in a `StyleSheet`"]
explanation = "A deep link can launch the app or arrive while it is active; linking configuration must cover both cases."

[questions.rn-x033]
prompt = "When configuring deep links, which practices should you follow?"
options = ["Handle URLs that launch the app and URLs received while it is running", "Check/normalize params before using them", "Pass arbitrary callbacks in the URL", "Map paths to routes explicitly", "Trust every external URL"]
explanation = "A URL is external input; map it to a route and validate params, while supporting both initial URLs and events received while the app is active."

[questions.rn-x044]
prompt = "The React Native API that receives the initial URL when the app is opened from a deep link is `Linking.{{blank}}()`."
explanation = "`getInitialURL()` handles launch; URLs received while the app is running require an event listener."

[modules.rn-native]
title = "Architecture, Native & Data"
description = "New Architecture (JSI, Fabric, TurboModules), the bridge, Expo, storage, permissions, builds, and releases."
lesson = '''### Architecture
- **Old architecture**: JS ↔ Native communication goes through the asynchronous **Bridge** and serializes data as JSON, which can become a bottleneck when many messages are sent.
- **New Architecture** (the default since RN 0.76):
  - **JSI** (JavaScript Interface): a C++ API that lets JS hold references to and call native objects directly, including synchronously.
  - **Fabric**: the new renderer, supporting concurrent React and synchronous layout measurement.
  - **TurboModules**: lazily loaded, type-safe native modules through **Codegen**.
- **Yoga**: a Flexbox layout engine written in C++.

### Data and security
- `AsyncStorage`: **unencrypted**, asynchronous key-value storage. For tokens/secrets, use `expo-secure-store` / Keychain / Keystore.
- **MMKV**: synchronous, very fast key-value storage (based on JSI).
- Permissions (camera, location): declare them in `Info.plist` / `AndroidManifest.xml` and request them at runtime.

### Expo
- Expo SDK + **EAS Build/Submit/Update**; use a **development build** instead of Expo Go when you need a custom native module; use **config plugins** to adjust native configuration without ejecting.
- **OTA updates** (EAS Update) can update JS and assets only; they cannot update native code.

### Runtime, data, and releases
| Need | Choice |
|---|---|
| Non-sensitive cache | AsyncStorage or MMKV, depending on synchronization/performance requirements |
| Token | SecureStore/Keychain/Keystore wrapper |
| App state | Use `AppState` to pause polling or refresh when the app becomes active |
| New native module | Suitable development build and config plugin/prebuild |

Example: when the app returns to `active`, check the last sync time and refresh data; do not depend on JS tasks running continuously in the background.

Common mistakes: storing tokens in AsyncStorage, assuming OTA can replace native code, or requesting a permission without handling denial. On the web, localStorage and service workers have different lifecycles and permissions; RN uses secure storage and background capabilities controlled by iOS/Android.'''

[questions.rn-080]
prompt = "What problem with the old Bridge does JSI (JavaScript Interface) address in the New Architecture?"
options = ["It lets you write the UI in C++", "It lets JS call native objects directly through C++, including synchronously, without serializing JSON through the asynchronous bridge", "It replaces JavaScript with TypeScript", "It lets React Native run on the web"]
explanation = "JSI is the foundation for TurboModules, Fabric, Reanimated, MMKV, VisionCamera, and more."

[questions.rn-081]
prompt = "What is Fabric?"
options = ["A UI library", "React Native's new rendering system in the New Architecture", "An iOS build tool", "A JavaScript engine"]
explanation = "Fabric supports concurrent rendering, synchronous layout measurement, and a shared shadow tree in C++."

[questions.rn-082]
prompt = "Where should a user's **access token** be stored in an RN app?"
options = ["AsyncStorage", "A global variable", "Keychain (iOS) / Keystore (Android) through `expo-secure-store` or `react-native-keychain`", "A JSON file in the bundle"]
explanation = "AsyncStorage is unencrypted; it can be read on rooted or jailbroken devices."

[questions.rn-083]
prompt = "What **cannot** an OTA update (EAS Update) update?"
options = ["JavaScript code", "Images/assets in the bundle", "Native code (adding a native module or changing Info.plist)", "Displayed text"]
explanation = "Native changes require a new build and store release. `runtimeVersion` compatibility is also required."

[questions.rn-084]
prompt = "When do you need a **development build** instead of Expo Go?"
options = ["When using `useState`", "When the project needs a native module/configuration that Expo Go does not include (for example, a third-party native library or custom config plugin)", "When running on Android", "Never"]
explanation = "A development build is your own debug app with `expo-dev-client`."

[questions.rn-085]
prompt = "Which components belong to React Native's **New Architecture**?"
options = ["JSI", "Fabric", "TurboModules", "Codegen", "Bridge (MessageQueue)", "Bridgeless mode"]
explanation = "The Bridge belongs to the old architecture; the New Architecture moves toward bridgeless mode."

[questions.rn-086]
prompt = '''Store and read data with AsyncStorage (which stores **strings only**):

```js
await AsyncStorage.setItem('user', JSON.{{blank}}(user));
const user = JSON.{{blank}}(await AsyncStorage.getItem('user'));
```'''
explanation = "AsyncStorage stores strings only, so data must be serialized/deserialized."

[questions.rn-087]
prompt = "Compare React Native's old (Bridge) architecture with the New Architecture."
keywords = [["bridge"], ["asynchronous", "async"], ["json", "serialize", "serialization"], ["jsi"], ["fabric"], ["turbomodule", "turbo module", "lazy loading"], ["synchronous", "sync"]]
model_answer = '''**Old architecture**: JS and native communicate through the **Bridge** — calls are **serialized as JSON** and sent **asynchronously** in batches. This can bottleneck under heavy traffic (scrolling, animation, gestures), does not support synchronous calls, and initializes every native module at startup.

**New Architecture**:
- **JSI**: JS holds direct references to C++/native objects and can call them **synchronously** or asynchronously without serialization.
- **Fabric**: a new renderer that supports concurrent React (Suspense, transitions) and synchronous layout measurement.
- **TurboModules**: native modules **load lazily** and are type-safe through **Codegen** from a TypeScript/Flow spec.
- Result: faster startup, smoother interaction, and a path toward bridgeless operation.'''
explanation = "The New Architecture has been the default since RN 0.76."

[questions.rn-088]
title = "TTL cache on AsyncStorage"
prompt = '''Write `createCache(storage, ttlMs)`. `storage` has an AsyncStorage-like API: `getItem(key)`, `setItem(key, value)`, and `removeItem(key)` all return a **Promise** and store **strings only**.

Return:
- `set(key, value)` → store `JSON.stringify({ value, expires: Date.now() + ttlMs })`
- `get(key)` → return a Promise resolving to `value` if it has not expired; otherwise return `null` when the key is missing or expired (`Date.now() >= expires`), and remove the key if expired. Invalid JSON also returns `null`.

`Date.now()` is controlled by fake timers (`jest.advanceTimersByTime`).'''
explanation = "A cache-with-TTL pattern is often used for offline-first API responses."
hints = ["`JSON.parse` can throw, so wrap it in try/catch.", "Distinguish a missing key (`null`) from a stored value of `0`/`false`."]

[questions.rn-dd02]
prompt = "Which uses of `AppState` are reasonable?"
options = ["Pause polling/video when the app moves to `background`", "Refresh data when the app returns to `active`", "Lock the screen with a PIN when the user returns to the app", "Run heavy tasks indefinitely while the app is in the background (iOS)"]
explanation = "`AppState.addEventListener('change', cb)` reports `active` / `background` / `inactive`. JS is not guaranteed to run for long in the background; use a dedicated background-task API instead."

[questions.rn-dd04]
prompt = "How can a custom button (`Pressable` containing an icon) work well with VoiceOver/TalkBack?"
keywords = [["accessible"], ["accessibilitylabel", "label"], ["accessibilityrole", "role", "button"], ["accessibilityhint", "hint"], ["accessibilitystate", "disabled", "selected", "state"], ["hitslop", "touch target", "44", "48"]]
model_answer = '''- Set `accessible` (Pressable already groups its children by default) and provide an **`accessibilityLabel`** describing the action (for example, “Add to cart”), since the icon has no text.
- Set **`accessibilityRole="button"`** so the screen reader announces a button.
- Add an **`accessibilityHint`** when the result is not obvious (for example, “Opens checkout”).
- Make **`accessibilityState={{ disabled, selected }}`** reflect the actual state.
- Provide a sufficiently large touch target (≥ 44pt on iOS / 48dp on Android); use **`hitSlop`** if the icon is small.
- Test with VoiceOver/TalkBack and use `AccessibilityInfo.isScreenReaderEnabled()` when needed.'''
explanation = "Accessibility should be considered from the start, not added as a final fix."

[questions.rn-x045]
prompt = "Store an access token with Expo's library for sensitive data: `expo-{{blank}}-store`."
explanation = "`expo-secure-store` uses the platform's secure storage; AsyncStorage is not encrypted."

[questions.rn-x053]
prompt = "Describe how to combine platform permissions and secure storage when an app uses the camera and an access token."
keywords = [["permission", "request permission"], ["denied", "permission denial"], ["securestore", "keychain", "keystore"], ["asyncstorage"], ["do not log", "never log", "logging"], ["explain", "just in time", "context"]]
model_answer = '''Explain the camera permission just before the feature needs it, handle both granted and denied states, and provide a way forward if the user declines. Store the access token in SecureStore/Keychain/Keystore; AsyncStorage is unencrypted and should be used only for non-sensitive data. Do not put the token in logs or crash reports.'''
explanation = "Permissions and sensitive data need to be handled separately according to their purpose and platform."

[modules.rn-architecture]
title = "New Architecture & Execution Flow"
description = "JSI, Fabric, TurboModules, Codegen, Hermes, bridgeless mode, and interaction between the JS thread and UI thread."
lesson = '''### The building blocks
| Component | Role |
|---|---|
| JSI | C++ interface for JavaScript to interact with native objects without serializing every call through the old Bridge |
| Fabric | New renderer coordinating React with the native UI tree |
| TurboModules | Load native modules on demand; Codegen creates the connection layer from a typed spec |
| Hermes | JavaScript engine commonly bundled by default with RN apps |
| Bridgeless | Runs the New Architecture without depending on the legacy Bridge |

The JS thread handles React, JavaScript, and events; the UI/native thread handles display, native layout, and frame interactions. JSI reduces communication overhead, but it does not make all JavaScript run automatically on the UI thread. Hermes does not replace Metro either: Metro still bundles the app during development.

Example: Codegen processes a native module spec during the build; the app calls the module when needed instead of initializing every module at startup.

Common mistakes: assuming JSI makes synchronous calls automatically safe; running heavy loops on the JS thread; confusing Fabric with a JS engine; or assuming bridgeless mode makes every old library compatible automatically. On the web, JavaScript often updates the DOM; RN sends changes through its renderer to native views.'''

[questions.rn-x013]
prompt = "What is the key difference between JSI and calls through the legacy Bridge?"
options = ["JSI requires every call to be serialized as JSON", "JSI lets JS interact with host objects through a C++ interface without the legacy JSON message path", "JSI is a CSS engine", "JSI replaces Metro bundler"]
explanation = "JSI is an interface between the JavaScript runtime and native/C++ code; it does not replace the bundler or automatically run all JS on the UI thread."

[questions.rn-x014]
prompt = "Which responsibility does Fabric have in the New Architecture?"
options = ["JavaScript engine", "React Native renderer, coordinating React with native views", "OTA service", "App signing tool"]
explanation = "Fabric is the renderer; Hermes is the JS engine, and EAS Update distributes updates."

[questions.rn-x015]
prompt = "How does Codegen mainly support TurboModules?"
options = ["It creates images for the app", "It generates the native connection layer from a typed spec so JS and native share a consistent contract", "It replaces Hermes", "It writes the entire UI in C++ automatically"]
explanation = "A typed spec is the input to Codegen; the native module implementation still needs to be written and built."

[questions.rn-x016]
prompt = "What does bridgeless mode mean?"
options = ["The app no longer has native modules", "A New Architecture app does not depend on the legacy Bridge; JS/native communication and modules still exist", "JS runs entirely on the GPU", "A native binary build is no longer needed"]
explanation = "Bridgeless mode removes dependence on the legacy Bridge; it does not remove native code or the need to build the app."

[questions.rn-x035]
prompt = "Which components belong to the New Architecture or a related RN runtime mode?"
options = ["JSI", "Fabric", "TurboModules", "Codegen", "Hermes", "The legacy Bridge is the new renderer"]
explanation = "JSI/Fabric/TurboModules/Codegen are parts of the New Architecture; Hermes is a JS engine that can be used with it. The legacy Bridge is not a new renderer."

[questions.rn-x046]
prompt = "In the New Architecture, a native module that loads on demand uses `{{blank}}`; a typed spec is processed by `{{blank}}`."
explanation = "TurboModules support lazy loading; Codegen generates the connection layer from a typed spec."

[questions.rn-x054]
prompt = "Explain the roles of JSI, Fabric, TurboModules/Codegen, and the JS/UI threads in the New Architecture."
model_answer = """JSI provides a C++ interface for JavaScript to interact with host objects without routing every call through the legacy Bridge. Fabric is the renderer; TurboModules load native modules on demand, and Codegen generates the connection layer from a spec. The JS thread handles JavaScript/React, while the UI thread handles native display; JSI does not move all JS to the UI thread. Bridgeless removes dependence on the legacy Bridge, but the app still needs a native runtime."""
explanation = "Distinguishing the renderer, JS engine, native communication, and threads helps identify the right performance cause."

[modules.rn-expo]
title = "Expo SDK & Development Workflow"
description = "Expo SDK, Expo Router, config plugins, prebuild, development builds, EAS Build, and EAS Update."
lesson = '''### Choosing an environment and workflow
| Tool | Use when |
|---|---|
| Expo Go | Trying the app with the pre-bundled set of native modules |
| Development build | The development app needs a custom native module or configuration |
| Prebuild | Generating native directories from app config and config plugins |
| EAS Build | Creating an iOS/Android artifact locally or on EAS infrastructure |
| EAS Update | Distributing JavaScript and assets compatible with the installed runtime |

An Expo SDK pairs Expo module versions with a compatible React Native base; upgrade the SDK using its version-specific guidance instead of upgrading individual pieces arbitrarily. Expo Router maps files in the `app` directory to routes. Dynamic routes use names such as `[id].tsx`, while `_layout.tsx` defines the layout/stack.

Example: a custom native library requires a development build; a config plugin describes native changes so `npx expo prebuild` can regenerate a consistent native project.

Common mistakes: editing generated native directories directly and losing changes on prebuild; assuming Expo Go includes every native module; or publishing an OTA update with an incompatible native runtime. On the web, routers are often tied to browser URL/history; Expo Router still navigates inside a native app and needs deep-link configuration for external links.'''

[questions.rn-x017]
prompt = "The app uses a native module that is not included in Expo Go. What is the appropriate development choice?"
options = ["Use Expo Go and hope the module appears", "Create a development build that includes the required module", "Move the module into CSS", "Disable Metro"]
explanation = "A development build is your own app with the project's native modules; Expo Go contains only its pre-bundled set."

[questions.rn-x018]
prompt = "What is `_layout.tsx` for in Expo Router?"
options = ["The default image file", "Defining a shared layout and navigator for routes in a directory branch", "Creating a native module", "Handling HTTP requests only"]
explanation = "Expo Router maps the file tree to routes; `_layout` configures the layout/stack or a route group."

[questions.rn-x036]
prompt = "Which statements about config plugins and prebuild are true?"
options = ["A config plugin describes reproducible native changes", "Prebuild can regenerate native directories from app config/plugins", "Edits to generated native files are always preserved through every prebuild", "A development build is needed when a native change is not included in Expo Go", "A config plugin is a CSS selector"]
explanation = "Plugins express reproducible native configuration; direct edits to generated artifacts may be lost when prebuild runs."

[questions.rn-x047]
prompt = "The app needs a custom native module outside Expo Go's built-in set, so create a `{{blank}}`."
explanation = "A development build includes the project's own native modules and configuration."

[questions.rn-x055]
prompt = "Compare Expo Go, development builds, prebuild, EAS Build, and EAS Update across the development lifecycle."
keywords = [["expo go"], ["development build", "dev client"], ["prebuild"], ["config plugin"], ["eas build"], ["eas update"], ["runtimeversion"]]
model_answer = '''Expo Go enables quick testing with its included native modules. When custom native modules/configuration are needed, create a development build; config plugins describe changes so prebuild can regenerate a consistent native project. EAS Build creates the binary. EAS Update distributes JS/assets when `runtimeVersion` matches the installed binary; native changes require a new binary.'''
explanation = "These steps serve different needs: quick testing, generating the native project, building a binary, and releasing compatible JS/assets."

[questions.rn-xc04]
title = "Choose Expo Go or a development build"
prompt = '''Write `chooseExpoClient(needsCustomNative, hasDevClient)` to return one of three strings:
- `development-build` if a dev client is already installed.
- `development-build-required` if a custom native module is needed but no dev client is installed.
- `expo-go` if no custom native module is needed and no dev client is installed.'''
explanation = "Distinguishing these environments helps select the right way to run the app during development."
hints = ["Check whether a dev client is already available first.", "A custom native module will not run in Expo Go unless it is included in its binary."]

[questions.rn-xc05]
title = "Check EAS Update compatibility"
prompt = "Write `canApplyUpdate(build, update)` to return a boolean. Allow an update only when both `platform` and `runtimeVersion` exactly match the installed build. Do not compare any other fields."
explanation = "Runtime compatibility is required for JS/assets to work with the native binary."
hints = ["Compare both conditions using exact equality.", "An OTA update cannot add a native module to an already installed binary."]

[modules.rn-perf]
title = "List Optimization & Profiling"
description = "Virtualization, FlatList configuration, FlashList, controlling re-renders, and measuring performance in the right environment."
lesson = '''### Tune based on measurements
| Technique | Effect | Trade-off |
|---|---|---|
| Stable `keyExtractor` | Preserves item identity when data changes | Do not use the index if items can be inserted, deleted, or reordered |
| `getItemLayout` | Skips dynamic measurement when item height is fixed | Offsets are wrong if item/header/separator sizes are omitted |
| `windowSize` | Sets how many viewports are kept rendered around the visible area | Larger uses more memory; smaller can expose blank space during fast scrolling |
| `removeClippedSubviews` | Removes views outside the visible area on some platforms | Can cause rendering issues with certain layouts/transforms |
| FlashList | Third-party library that recycles views | Check the version and New Architecture requirements of the version you choose |

Example: for a row with a fixed height of 56 dp and a 1 dp separator, `getItemLayout` should use `length: 56` and `offset: index * 57`. `React.memo` helps when props are stable; `useCallback` helps only when a changing function reference causes the child to re-render.

Common mistakes: enabling every optimization prop at once, creating new objects/functions for every item, using the index as a key, or measuring in development and drawing conclusions about release performance. Use React DevTools/Profiler and the Hermes sampling profiler to find the cause before changing configuration. Unlike web list virtualization, RN creates native views; do not rely on a DOM profiler or browser APIs.'''

[questions.rn-x019]
prompt = "When is `getItemLayout` most useful?"
options = ["When item heights vary with their content", "When item and separator dimensions are known in advance", "When the list has no data yet", "When network images must be loaded"]
explanation = "Known dimensions/positions skip dynamic measurement and support scrolling to an index; incorrect measurements produce incorrect offsets."

[questions.rn-x020]
prompt = "`React.memo(Row)` does not reduce renders. The `item` prop is recreated as a new object for every row on each render. What is the most direct cause?"
options = ["`memo` compares props shallowly, so a new reference is still considered a change", "`memo` only runs on the web", "FlatList forbids objects", "Hermes removes memo"]
explanation = "Memoization usually compares props shallowly. Keep references stable or pass only the needed values, after a profiler confirms this is a bottleneck."

[questions.rn-x021]
prompt = "Why can an incorrect `getItemLayout` make `scrollToIndex` land in the wrong place?"
options = ["FlatList uses the index as a color", "The offset must account for the actual header, item, and separator sizes", "`scrollToIndex` only works with ScrollView", "It disables `keyExtractor`"]
explanation = "FlatList uses the supplied offset to jump to a position; omitting a header/separator or using the wrong height shifts the result."

[questions.rn-x022]
prompt = "To find the cause of stuttering in a release build, which process is more reliable?"
options = ["Measure only in development and infer release behavior", "Profile a near-production build/configuration, inspect JS/UI time, and change one factor at a time", "Enable every optimization at once", "Count components in the source"]
explanation = "Development has different overhead from release. Measure a representative build and change one factor at a time to identify the cause."

[questions.rn-x037]
prompt = "Choose reasonable steps for profiling a list."
options = ["Reproduce on a representative build and device", "Use React Profiler/Hermes profiler to identify time spent", "Measure on the web and infer native behavior exactly", "Change one configuration at a time and measure again", "Enable all optimization props at once without recording measurements"]
explanation = "Profiling needs a representative environment and comparable measurements; change one factor at a time to attribute the result."

[questions.rn-x048]
prompt = "FlatList receives the function that provides `{ length, offset, index }` for an item through the `{{blank}}` prop."
explanation = "Use it when item dimensions can be determined in advance."

[questions.rn-xc06]
title = "Compare props for a memoized row"
prompt = '''Write `shouldRenderRow(previous, next)` for a row that receives only three props: `item`, `selected`, and `onPress`:
- Return `true` if at least one prop changes under JavaScript reference/value comparison with `!==`.
- Return `false` if all three props remain the same.'''
explanation = "Memoization helps only when props are stable and measurements show that row rendering is a significant cost."
hints = ["Compare each of the listed props.", "This is a shallow comparison; a new object can cause the row to render again."]

[questions.rn-xc07]
title = "Merge list pages without duplicate IDs"
prompt = '''Write `mergeById(existing, incoming)` to return a new array containing the old items followed by new items whose `id` is not already present.
- If an ID appears more than once, keep its first occurrence.
- Support IDs of `0` and the empty string.
- Do not mutate either input array.'''
explanation = "Deduplicating by ID prevents duplicate rows during pagination/offline sync."
hints = ["Use a Set to track IDs already seen.", "Do not use a truthiness check for IDs; `0` is valid."]

[modules.rn-animation-gesture]
title = "Animation & Gestures"
description = "Animated, native driver, Reanimated worklets/shared values, and React Native Gesture Handler."
lesson = '''### Choose a tool for the motion
| Tool | Best suited for |
|---|---|
| `Animated` | Declarative animations in React Native; `useNativeDriver` works well for opacity/transform |
| Reanimated | Worklet calculations and shared-value updates close to the UI runtime |
| Gesture Handler | Recognizing pan, tap, and pinch gestures and coordinating them with native handlers |
| Layout animation | Motion tied to layout changes, when supported by the target configuration |

Animated example: `Animated.timing(progress, { toValue: 1, duration: 220, useNativeDriver: true })`. The native driver does not support properties that require layout recalculation, such as `height` or `padding`. In Reanimated, a shared value stores motion state; a worklet can calculate frames without calling JavaScript on every frame.

Common mistakes: reading/writing React state on every frame; marking a function as a worklet but calling an API available only in the JS runtime; or allowing gestures to compete without defining their priority relationship. On the web, animation is often tied to CSS/WAAPI and pointer events; RN uses native views/gesture handlers and has no DOM.'''

[questions.rn-x023]
prompt = "Which group of properties is suitable for Animated with `useNativeDriver: true`?"
options = ["`opacity` and `transform`", "`height` and `padding`", "Any style property", "Text content and React state"]
explanation = "The native driver supports properties that do not require layout recalculation, such as opacity/transform; it does not support every property."

[questions.rn-x024]
prompt = "What is a benefit of a Reanimated worklet when running an animation?"
options = ["It moves the entire app to the web", "It lets animation logic run on the UI runtime without JS sending every frame", "It replaces `StyleSheet`", "It automatically grants gesture permissions"]
explanation = "A worklet can run in the UI runtime. Work that requires JS must use the appropriate communication mechanism; avoid calling into JS on every frame."

[questions.rn-x025]
prompt = "Why is Gesture Handler often more suitable than updating React state for every pan event?"
options = ["It uses the DOM", "Gestures are recognized by native handlers, reducing dependence on a JS render for every movement", "It replaces navigation", "It automatically stores gestures in AsyncStorage"]
explanation = "Gesture Handler uses native gesture recognition; frequent React state updates can still cause many renders."

[questions.rn-x038]
prompt = "Which statements about animation and gestures in RN are true?"
options = ["The native driver suits opacity/transform", "`useNativeDriver` supports every layout property", "A Reanimated shared value can change without re-rendering the entire React tree on every frame", "Gesture Handler provides native gesture recognition", "Heavy JS calls on every frame will always be smooth"]
explanation = "The native driver supports a limited set of properties; shared values/worklets and native gesture recognition reduce work through JS on every frame."

[questions.rn-x049]
prompt = "In Reanimated, a value that can update on the UI runtime without React state on every frame is a `{{blank}}`; a function that runs on the UI runtime is a `{{blank}}`."
explanation = "A shared value stores motion state; a worklet is logic that can run in the UI runtime."

[questions.rn-x056]
prompt = "When would you choose Animated's native driver, Reanimated, and Gesture Handler for a drag-and-drop interaction?"
model_answer = """Animated with `useNativeDriver` suits opacity/transform properties that do not affect layout. Reanimated uses shared values and worklets to calculate motion on the UI runtime. Gesture Handler recognizes pan/tap through native handlers; combine these tools to avoid updating React state on every frame. Layout properties and work that requires JS must respect the specific API limitations."""
explanation = "Choose based on the animated properties, execution path, and gesture complexity instead of assuming one library replaces every tool."

[questions.rn-xc08]
title = "Simulate Animated.interpolate"
prompt = '''Write `interpolate(value, inputRange, outputRange, extrapolate = 'extend')` for strictly increasing ranges of equal length, with at least two points.
- Interpolate linearly between adjacent points.
- `clamp` clamps value to the ends of the input range; `extend` extends linearly using the first/last segment.
- The output range may be increasing or decreasing.'''
explanation = "This simulates the arithmetic of interpolation; it does not create an animation or access the UI thread."
hints = ["Find the input segment containing the value; for out-of-range values, use the first or last segment.", "Clamp the input before finding a segment when extrapolate is `clamp`."]

[questions.rn-xc09]
title = "Throttle scroll events"
prompt = '''Write `throttleLeading(fn, wait, now = () => Date.now())`:
- Call `fn` immediately on the first invocation.
- Ignore subsequent invocations that occur less than `wait` apart.
- Once `wait` has elapsed, call again with the arguments from the newly accepted invocation.
- Do not schedule an automatic trailing call with a timer.'''
explanation = "Throttling is useful for scroll callbacks; choose an interval based on the actual work and keep UI updates smooth enough."
hints = ["Store the timestamp of the most recently accepted invocation.", "The prompt does not require a trailing timer."]

[modules.rn-data-offline]
title = "Offline Data & Linking"
description = "Local storage, secure tokens, network state, queued synchronization, push notifications, and deep links."
lesson = '''### Storage and synchronization
| Need | Choice | Notes |
|---|---|---|
| Non-sensitive cache | AsyncStorage or MMKV | AsyncStorage is asynchronous and does not encrypt data |
| Token/secret | SecureStore or a Keychain/Keystore wrapper | Do not put tokens in logs or the bundle; handle cases where they cannot be read |
| Connection state | NetInfo | `isConnected` and `isInternetReachable` can differ or be unknown |
| Offline changes | Local queue with retries | Use idempotency keys and conflict-handling rules when sending again |
| Push/deep link | Notification handler and Linking | Payloads come from outside the app and must be validated before navigation |

Example: while offline, add an operation to a queue with a stable ID; when the network returns, send operations in sequence, retry with exponential backoff, and remove an operation after the server confirms it. Push notifications may be delayed or never arrive, so important data must be resynchronized from the server.

Common mistakes: treating a Wi-Fi signal as proof that the Internet is available; retrying forever without a limit; storing tokens in AsyncStorage; or handling URLs only while the app is open. On the web, localStorage/service workers have different lifecycles and permissions; do not use those APIs in an RN app.'''

[questions.rn-x026]
prompt = "NetInfo reports `isConnected: true` but `isInternetReachable: false`. Which conclusion is appropriate?"
options = ["The API server is definitely reachable", "There is a local network connection, but Internet reachability has not been confirmed", "The app is in the background", "The token has expired"]
explanation = "A Wi-Fi/mobile connection does not guarantee Internet access or a working server; handle unknown status and actual request failures."

[questions.rn-x027]
prompt = "An order-creation operation is retried after an unstable network connection. What helps prevent duplicate orders?"
options = ["Retry forever with a new ID", "A stable ID/idempotency key and handling of already-applied results", "Store the request in a component variable", "Disable retries"]
explanation = "A retry can repeat an operation the server already processed; an idempotency key lets the server recognize the duplicate and return a stable result."

[questions.rn-x028]
prompt = "How should push notifications be treated in a data synchronization design?"
options = ["As the only data source, guaranteed to arrive in order", "As a signal that may be delayed/lost; reload important state from the server when the app opens", "As a replacement for deep links", "As a guarantee that the app can run indefinitely in the background"]
explanation = "Push delivery is not guaranteed to be timely or ordered; use it to signal a change, then sync authoritative data from the server."

[questions.rn-x039]
prompt = "Which characteristics should a safe offline queue have?"
options = ["Operations have a stable ID/idempotency key", "Retries are limited and use backoff", "Delete an operation as soon as a request starts", "Handle errors/conflicts during synchronization", "Store tokens in an unencrypted queue record"]
explanation = "A queue needs controlled retries, duplicate detection, and error handling; secrets should not be stored in unprotected queue data."

[questions.rn-x050]
prompt = "A popular community library for observing React Native connection state is `@react-native-{{blank}}/netinfo`."
explanation = "NetInfo provides connection state; network status does not replace handling request errors."

[questions.rn-x057]
prompt = "Design offline synchronization for a data-creation operation on an unstable network, including retries and conflict handling."
keywords = [["offline"], ["queue"], ["retry", "retries"], ["exponential backoff"], ["idempotency", "idempotency key"], ["conflict", "conflict resolution"], ["netinfo"]]
model_answer = '''Store the operation in a local queue with a stable ID/idempotency key. NetInfo helps determine when to try sending, but requests must still handle failures. Send sequentially, retry with a limit and exponential backoff, and remove a record only after server confirmation. If the server returns a conflict, apply merge rules or ask the user to resolve it; do not assume push notifications always arrive.'''
explanation = "Offline-first design needs duplicate prevention, limited retries, and rules for resolving concurrent edits."

[questions.rn-xc10]
title = "Offline queue with retries"
prompt = '''Write `createOfflineQueue(send, baseDelay = 100, maxRetries = 2)` to return an object with `enqueue(value)`, `setOnline(value)`, and a `pending` getter.
- Jobs are sent sequentially; the queue is online by default.
- While offline, keep jobs queued until the network is online again.
- When `send` fails, retry up to `maxRetries` times with a delay of `baseDelay * 2 ** retryIndex`.
- After the final attempt, reject the job's Promise and remove it from the queue.
- `pending` returns the current values; use fake timers to test backoff.'''
explanation = "This queue simulates sequential sending and backoff; a real app also needs persistence, idempotency keys, and merge policies."
hints = ["Keep a `processing` flag so only one worker processes the queue.", "Increment retryIndex after calculating the delay; advance the timer Promise in the test."]

[questions.rn-xc11]
title = "Parse a deep link"
prompt = '''Write `parseDeepLink(url, routes)` for a custom link such as `bovabon://course/rn?ref=mail` and an app link such as `https://example.com/course/rn?ref=mail`; `routes` has the form `{ 'course/:id': 'Course' }`.
- For custom links, use the part after `://` as the route; for HTTP(S), discard the hostname and use only the pathname. Trim extra leading/trailing `/`; the number of path segments must match.
- `:param` represents a path param; decode percent-encoding in query values and convert `+` to a space.
- Preserve any `=` after the first separator in a query value; path params override query params with the same name; for duplicate query keys, keep the last value.
- Static routes must match exactly; choose the first matching route; return `null` if none match.
- Do not use `URL` or `URLSearchParams`.'''
explanation = "An app link has a real hostname; treating the host as part of the route gives the wrong path. External links still require validation of access and route param values after parsing."
hints = ["Check the scheme first; for HTTP(S), remove the authority up to the first `/`, `?`, or `#`.", "Split each query pair at the first `=` and compare path segments one by one."]

[modules.rn-release]
title = "Permissions, Security & Releases"
description = "Permissions, platform differences, app signing, OTA updates, crash reporting, and store review."
lesson = '''### Release checklist
| Area | Check |
|---|---|
| Permissions | Declare the reason in line with the feature; request access at the right time; handle denial |
| Platform | Use `Platform.select` or platform-specific files for real differences |
| App signing | Keep the keystore/certificate and signing information outside the repository, with controlled backups |
| OTA | Release JS/assets only to compatible runtimes; native changes require a new binary |
| Crash reporting | Upload matching symbols and remove tokens/PII from breadcrumbs and payloads |
| Store review | Ensure declared permissions, privacy information, and app behavior match the release |

Example: a JavaScript change can be sent through EAS Update if `runtimeVersion` matches the build; adding a native module or changing a permission manifest requires a new binary build and distribution. Release to a channel/small group first to catch problems before expanding the rollout.

Common mistakes: committing a signing secret in app config; requesting permissions too early; using OTA to bypass store review or runtime compatibility; and treating crash logs as harmless data. On the web, server TLS/certificates differ from signing iOS/Android binaries; mobile platforms also manage permission prompts.'''

[questions.rn-x029]
prompt = "An OTA update adds a new native module but keeps the same `runtimeVersion` as the old binary. What is the main risk?"
