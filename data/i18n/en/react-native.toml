[modules.react-native-dv-testing]
title = "Testing & Debugging"
description = "Multi-layer testing, investigating JavaScript/native errors, and tracing production stack traces."
lesson = '''### Risk-based testing
React Native tests should cover JavaScript logic, component interactions, and behavior that needs to run on a device. Unit tests stay fast for pure functions; component tests check what users see and do; end-to-end tests validate integrated flows involving navigation, permissions, or native APIs.

| Test layer | Scope | Keep in mind |
|---|---|---|
| Unit | Functions, reducers, business rules | Fast, with few environment dependencies |
| Component | Props, visible state, interactions | Prefer outcomes observable to the user |
| End-to-end | Flows on a running app | Finds native and integration-configuration problems |

Mock native modules at the boundary to keep unit tests stable, but do not treat a mock as proof that a module works on a device. For asynchronous state updates, tests should wait for the UI to settle using the testing library's mechanism; avoid asserting internal details such as exact render counts when they are not product requirements. When appropriate, role- or label-based selectors can also reveal missing accessibility metadata.

When debugging, first locate the problem in JavaScript, Metro, build configuration, or native code. Fast Refresh shortens the UI edit loop but does not replace running tests. Production stack traces often point into a minified bundle; symbolication requires a source map that matches the exact bundle and app version. Reproduce native failures on a device or simulator for the affected platform, because JavaScript logs may not contain the native cause.

Common mistakes: shipping after testing only with mocks and never running the native flow; using large snapshots that are hard to diagnose; treating a successful Fast Refresh as a test; or using a source map from another build to read a stack trace. Do not put tokens or personal data in debug logs.'''

[questions.react-native-dv017]
