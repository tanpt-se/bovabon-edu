[modules.rn-lists]
title = "Lists & Performance"
description = "FlatList, SectionList, virtualization, getItemLayout, pagination, re-rendering, Hermes."
lesson = '''### FlatList
- **Virtualized**: renders only items near the viewport (`windowSize`, `initialNumToRender`, `maxToRenderPerBatch`).
- `keyExtractor` returns a unique key (by default, RN uses `item.key` and then the index).
- `getItemLayout` (for items with fixed height) skips measurement, making `scrollToIndex` accurate.
- Use `onEndReached` + `onEndReachedThreshold` for pagination (infinite scrolling).
- Use `extraData` to make FlatList (a PureComponent) re-render when data outside `data` changes.
- Items should use `React.memo`, and `renderItem` should be stable (`useCallback`).
- For very large lists, consider **FlashList** (Shopify), which recycles views.

### General performance
- Keep the JS thread free: avoid expensive calculations during render; use **Reanimated** (runs on the UI thread) or `useNativeDriver: true` for animation.
- **Hermes** is a JavaScript engine optimized for RN: it compiles bytecode ahead of time, starts quickly, and uses less RAM.
- Remove `console.log` from release builds.

### Choosing a component and configuration
| Component | Use when | Notes |
|---|---|---|
| `ScrollView` | Content is small and the item count is limited | Renders all children |
| `FlatList` | A long list, often loaded in batches | Virtualization, stable keys |
| `SectionList` | A grouped list with headers | `sections` stores grouped data |
| FlashList | A large list needs recycling | Third-party library; check version requirements |

Example: `keyExtractor={(item) => String(item.id)}`; if a row depends on state outside `data`, pass that value through `extraData`.

Common mistakes: using the index as a key when the list can reorder, forgetting the separator in `getItemLayout`, or creating new props in `renderItem` so memoization has no effect. The web often virtualizes DOM nodes; FlatList manages native views and should be measured on a real device.'''

[questions.rn-040]
prompt = "What does `getItemLayout` do in FlatList?"
options = ["Changes the layout from vertical to horizontal", "Provides FlatList with the known size/position of each item (when fixed), skipping dynamic measurement for fast, accurate scrolling to an index", "Automatically measures item height", "Enables virtualization"]
explanation = "It returns `{ length, offset, index }`. This is especially useful for `scrollToIndex` and `initialScrollIndex`."

[questions.rn-041]
prompt = "FlatList does not re-render when `selectedId` (state outside `data`) changes. How should you fix it?"
options = ["Add `key={Math.random()}` to FlatList", "Pass `extraData={selectedId}`", "Use ScrollView", "Call `forceUpdate`"]
explanation = "FlatList is a PureComponent: it re-renders only when its props change shallowly. `extraData` tells it about additional data it depends on."

[questions.rn-042]
prompt = "What does `onEndReachedThreshold={0.5}` mean?"
options = ["Call `onEndReached` when 50 items remain", "Call `onEndReached` when the remaining content is within 0.5 times the visible area's height", "Call it after 0.5 seconds", "Call it after scrolling through 50% of the list"]
explanation = "The value is the number of viewport lengths from the end of the list."

[questions.rn-043]
prompt = "What is a main benefit of Hermes?"
options = ["It supports CSS", "It compiles JS to bytecode during build (AOT), improving startup time, memory use, and APK size", "It runs JS on the UI thread", "It replaces Metro bundler"]
explanation = "Hermes has been the default RN engine since 0.70."

[questions.rn-044]
prompt = "Why can animation using `Animated` with `useNativeDriver: true` (or a Reanimated worklet) stay smooth while the JS thread is busy?"
options = ["It uses the GPU to run JS", "Animation values are calculated and applied on the UI/native thread, so JS does not need to send every frame", "It reduces the frame rate to 30 FPS", "It disables virtualization"]
explanation = "The native driver supports only properties that do not affect layout, such as `transform` and `opacity`."

[questions.rn-045]
prompt = "Which techniques can help a long FlatList scroll smoothly?"
options = ["Wrap the item component with `React.memo`", "Define `renderItem` with `useCallback` or outside the component", "Use full-resolution images in every item", "Use `getItemLayout` when item heights are fixed", "Put expensive anonymous calculations in `renderItem` so they run on each render", "Tune `windowSize`, `maxToRenderPerBatch`, and `removeClippedSubviews`"]
explanation = "Images should be resized/cached (for example, with expo-image or FastImage); avoid expensive work in renderItem."

[questions.rn-046]
prompt = '''Complete the FlatList:

```jsx
<FlatList
  data={products}
  {{blank}}={(item) => String(item.id)}
  renderItem={({ {{blank}} }) => <ProductRow product={item} />}
/>
```'''
explanation = "`renderItem` receives `{ item, index, separators }`."

[questions.rn-047]
prompt = "Describe how to implement **infinite scrolling** (pagination) with FlatList and which mistakes to avoid."
keywords = [["onEndReached"], ["loading", "isLoading", "loading flag"], ["duplicate", "duplicate calls", "repeated calls"], ["hasMore", "no more data", "last page", "cursor"], ["ListFooterComponent", "footer", "spinner"]]
model_answer = '''- Use `onEndReached` + `onEndReachedThreshold` to load the next page, then append the new data.
- Track a **loading** flag to prevent **duplicate calls** (`onEndReached` may fire repeatedly), and a **hasMore** flag/cursor to stop when there is no more data.
- Show a spinner with `ListFooterComponent`; support pull-to-refresh with `refreshing` + `onRefresh` (reset to page 1).
- **Deduplicate by id** when merging pages, use a stable `keyExtractor`, and handle network errors with retry.'''
explanation = "In practice, this is often implemented with TanStack Query's `useInfiniteQuery`."

[questions.rn-048]
title = "getItemLayout for fixed-height items"
prompt = '''Write `makeGetItemLayout(itemHeight, separatorHeight = 0, headerHeight = 0)` to return a function
`(data, index) => ({ length, offset, index })` for FlatList:
- `length` = `itemHeight`
- `offset` = `headerHeight + index * (itemHeight + separatorHeight)`'''
explanation = "Use this only when item height is truly fixed; an incorrect value causes inaccurate scrolling."
hints = ["Each item before the index contributes `itemHeight + separatorHeight`."]

[questions.rn-049]
title = "Paginator that prevents duplicate requests"
prompt = '''Write `createPaginator(fetchPage)` for infinite scrolling. `fetchPage(page)` returns a Promise of `{ items, hasMore }` (page starts at **1**).

Return an object with:
- `items` — an array of all loaded items (deduplicate by `id`, keeping the **first** occurrence)
- `loading`, `hasMore` (initially `false` and `true`)
- `loadMore()` → Promise: if already `loading` or `!hasMore`, do **not** call `fetchPage` (resolve immediately). Otherwise, load the next page.
- If `fetchPage` fails: set `loading = false`, set `error` to the error, and **do not increment the page** (the next call retries that page).
- `refresh()` → reset to page 1, clear items, and load again.'''
explanation = "This is the core logic beneath `onEndReached`, a common React Native interview topic."
hints = ["Keep `page` in a closure and increment it only after a successful fetch.", "Use a `Set` of existing IDs to filter duplicates."]

[questions.rn-x005]
prompt = "The list can be reordered. What should `keyExtractor` return?"
options = ["`String(index)`", "A unique, stable item ID", "`Math.random()` on every render", "The item's pixel position"]
explanation = "A stable key lets React preserve the correct identity when items are inserted, deleted, or reordered; an index/random key can attach row state to the wrong item."

[questions.rn-x006]
prompt = "What trade-off usually comes with increasing FlatList's `windowSize`?"
