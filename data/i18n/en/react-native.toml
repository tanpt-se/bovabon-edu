model_answer = '''Use unit tests for pure logic, component tests for observable behavior, and end-to-end tests for important integrated flows. For a production crash, identify the exact app build, collect native logs, and reproduce it on a device if possible. Use the source map for the exact bundle to symbolicate the trace; mocks do not replace native testing.'''
explanation = "The answer balances test speed with integration confidence and explains the roles of logs and a version-matched source map."

[questions.react-native-dvc03]
