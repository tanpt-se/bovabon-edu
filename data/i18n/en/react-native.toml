model_answer = '''Use a native module for behavior such as reading a sensor, and a native UI component for a view that belongs in the UI tree. In the New Architecture, TurboModules and Fabric serve these respective purposes; Codegen generates the connection layer from a typed spec. Validate payloads, permissions, and errors, then test both iOS and Android because native implementations can differ.'''
explanation = "Distinguish behavior APIs from views, describe Codegen's role, and emphasize the contract and platform-specific testing."

[questions.react-native-dvc02]
title = "Filter a native event payload"
prompt = "Write `pickNativeEventFields(payload, allowedFields)`. Return a new object containing only keys that appear in `allowedFields` and are own properties of `payload`. Preserve values such as `false`, `0`, `null`, and the empty string; omit missing or inherited keys. Do not mutate the input payload. `allowedFields` is an array of strings and `payload` is an object."
explanation = "Event payloads cross the native boundary, so pass only fields explicitly allowed by the caller and directly present on the payload."
