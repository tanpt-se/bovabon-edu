explanation = "A control needs a meaningful role and label; color or `testID` cannot replace information for a screen reader."

[questions.react-native-dv026]
prompt = "A selected filter chip only changes its background to blue. What is the best way to add semantics?"
options = ["Set the selected state to match the actual filter state", "Set `testID` to selected", "Add a hint that repeats the filter name", "Disable accessibility on the chip"]
explanation = "A screen reader needs to receive the selected state through `accessibilityState`; it cannot rely on color."

[questions.react-native-dv027]
