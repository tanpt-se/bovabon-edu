keywords = [["authentication", "identity verification", "establishing identity"], ["authorization", "access control", "permission check"], ["policy", "gate"]]
model_answer = "Authentication verifies who the caller is, such as whether the user is logged in. Authorization checks whether that user can update a particular order; Laravel policies or gates can define this rule."
explanation = "A good answer distinguishes identity from permission to perform an action on a resource."

[questions.php-036]
prompt = "Propose a test strategy for a profile update endpoint that validates email, requires login, and writes to the database. Name a test type and at least two things to verify."
keywords = [["feature test", "HTTP test"], ["validation", "422", "validation error"], ["authentication", "login"], ["database", "database state", "assert database"]]
model_answer = "Use a feature test to send an HTTP request as a logged-in user. Send an invalid email to verify that validation returns a 422 error; send valid data to verify a successful response and the updated database state. A case with no authenticated user can also check authentication."
explanation = "A feature test checks multiple application layers through endpoint behavior rather than calling an isolated function."

[questions.php-037]
title = "Basic validator rules"
prompt = '''Implement `validateData(array $data, array $rules): array` for each field, using a pipe-separated rule string. Support `required`, `email`, and `min:n`. Return an error array keyed by field; each value is a list of failed rule names in declaration order. `required` fails when a field is missing, null, or an empty string after trimming; if `required` fails, skip the field's remaining rules. For an empty field that is not required, skip the other rules. For `email`, use `filter_var` with `FILTER_VALIDATE_EMAIL`. `min:n` accepts only a string whose `strlen` is at least n; other types fail. Ignore unsupported rules.
'''
explanation = "A validator separates empty-value handling from each rule check and returns structured errors."
hints = ["Split the rules on `|` and determine whether the value is empty first.", "If `required` fails, record the error and skip the field's remaining rules."]

[modules.php-laravel-dv-errors]
title = "PHP Errors and Exceptions"
description = "Distinguish Error, Exception, and Throwable, and handle failures at the right boundary."
lesson = '''### PHP's error model
In PHP, `Throwable` is the base interface implemented by both `Error` and `Exception`. An `Exception` commonly represents a business condition or invalid input that the program is expected to handle; an `Error` commonly signals an execution or programming problem such as `TypeError`. Therefore, `catch (Exception $e)` does not catch every throwable error.

| Kind | Example | Common handling approach |
|---|---|---|
| `Exception` | `InvalidArgumentException` | Catch near the point where invalid input can be reported or business flow can change |
| `Error` | `TypeError` | Fix the cause; catch only at a boundary that needs to log or clean up |
| `Throwable` | Both kinds | Use when a boundary truly needs to observe every failure and then propagate it |

Example:
```php
function requirePositiveId(int $id): int {
    if ($id <= 0) {
        throw new InvalidArgumentException('ID must be positive');
    }
    return $id;
}
```

`catch` clauses are considered in order, so a specific branch must come before a broad one. `finally` is appropriate for releasing resources or completing cleanup whether the `try` block succeeds or throws. A common mistake is catching `Throwable` everywhere and returning `null`, which loses the cause and makes incorrect state difficult to trace. Catch the failure type the current layer can handle; propagate failures it cannot recover from.'''

[questions.php-laravel-dv001]
prompt = "A function call causes a `TypeError`. Which type catches that error in PHP?"
options = ["Exception", "Error", "InvalidArgumentException", "RuntimeException"]
explanation = "`TypeError` belongs to the `Error` branch. Both `Error` and `Exception` implement `Throwable`, but neither inherits from the other."

[questions.php-laravel-dv002]
prompt = "Why is `catch (Exception $e)` not a way to catch every possible failure in PHP?"
options = ["Because Exception catches only syntax errors", "Because Error also implements Throwable but does not inherit from Exception", "Because catch works only for errors in finally", "Because PHP does not allow catching exceptions"]
explanation = "`Exception` and `Error` are separate branches that both implement `Throwable`; `catch (Exception)` does not catch errors such as `TypeError`."

[questions.php-laravel-dv003]
prompt = "A function must clean up a temporary file whether processing succeeds or throws an exception. Which structure is most appropriate?"
options = ["Put the cleanup command after try/catch", "Put the cleanup command in `finally`", "Catch all failures and ignore them", "Use `return` only in catch"]
explanation = "`finally` runs after try/catch on both the success path and the failure path, making it suitable for cleanup."

[questions.php-laravel-dv004]
prompt = "Select the practices that help keep error handling maintainable in a PHP application."
options = ["Catch a specific exception type at a layer that can recover", "Use `finally` to clean up resources", "Catch `Throwable` in every function and return an empty value", "Propagate failures that cannot be handled after adding suitable context"]
explanation = "Catching specific failures and cleaning up deliberately preserves meaning. Swallowing every `Throwable` often hides programming errors and produces incorrect results."

[questions.php-laravel-dv005]
prompt = '''To catch both `Error` and `Exception` objects, provide the base interface:

```php
catch ({{blank}} $error) {
    report($error);
}
```'''
explanation = "`Throwable` is the interface implemented by both `Error` and `Exception`."

[questions.php-laravel-dv006]
prompt = '''Which block is suitable for cleanup that runs after try/catch whether an exception occurs or not?

```php
try { work(); } catch (Throwable $error) { report($error); } {{blank}} { cleanup(); }
```'''
explanation = "`finally` is for operations that need to run after try/catch on ordinary execution paths."

[questions.php-laravel-dv007]
prompt = "In an interview, explain the difference between `Error` and `Exception`, then describe where to catch failures in a web request."
keywords = [["Throwable", "Throwable interface"], ["Error", "TypeError"], ["Exception", "application exception"], ["specific catch", "catch a specific type", "specific failure type"], ["propagate", "rethrow"]]
model_answer = "Both `Error` and `Exception` implement `Throwable`, but they are separate branches. An `Error` commonly reflects an execution failure such as `TypeError`, while an `Exception` commonly describes an expected application condition. Catch a specific failure at a layer that can handle it or turn it into a suitable response; the outermost layer can log an unhandled failure and propagate it instead of silently returning fake data."
explanation = "A strong answer distinguishes the type relationship and explains the recovery boundary rather than only listing catch syntax."

[questions.php-laravel-dvc01]
title = "Safely parse a positive integer"
prompt = '''Implement `positiveInt(mixed $value): int`. The function accepts a positive integer or a string containing only decimal digits; a string may have surrounding whitespace and leading zeros. Return the normalized integer. For zero, a negative number, a boolean, a float, a string containing any non-digit character, or a value greater than `PHP_INT_MAX`, throw `InvalidArgumentException`.
'''
explanation = "Validate the representation before casting to avoid accepting invalid data or overflowing while converting a string to an integer."
hints = ["Check the input type before trimming or matching the string.", "Compare the length and lexicographic order of the digit string with `PHP_INT_MAX` before casting."]

[modules.php-laravel-dv-api]
title = "API Resources and Pagination"
description = "Design stable JSON responses and choose the right pagination strategy."
lesson = '''### API response contracts
An Eloquent Resource creates a presentation layer between a model and a JSON response. Instead of returning the raw model with every attribute it currently has, a resource explicitly selects public fields, renames fields when needed, and can format nested data. This prevents internal schema changes from accidentally breaking the client contract. For relationships, use a loaded-state check such as `whenLoaded` so a response does not silently trigger another query.

| Strategy | Total count | Best for | Considerations |
|---|---|---|---|
| `paginate` | Yes | UI needs page numbers and a total | Requires a count query; can be costly on large datasets |
| `simplePaginate` | No | Simple previous/next navigation | Does not provide a total number of pages |
| `cursorPaginate` | No | Large tables browsed continuously in order | Requires a stable order and a suitable cursor column |

Example:
```php
return UserResource::collection(User::with('profile')->paginate(25));
```

Laravel creates a paginated response with `data`, `links`, and `meta`; check the structure the client needs rather than assembling inconsistent metadata by hand. Offset pagination is convenient for jumping to any page, but inserts or deletions between requests can cause records to repeat or be skipped. Cursor pagination continues after a sort value and is often more stable and efficient for large lists, but is not suitable when a client must jump directly to page 40. Common mistakes include paginating without a stable `orderBy`, or having a Resource access a relationship that was not eager-loaded.'''

[questions.php-laravel-dv008]
prompt = "What is the main benefit of using an Eloquent Resource instead of returning a model directly?"
options = ["It creates a database index automatically", "It controls the public JSON response separately from the model structure", "It disables middleware for a route", "It guarantees that every query runs only once"]
explanation = "A Resource defines an explicit API representation, helping avoid exposing internal fields and reducing client dependence on the model."

[questions.php-laravel-dv009]
prompt = "An endpoint returns millions of records over time, and the client only needs to continue from the last record it saw. Which option is usually more suitable?"
options = ["`paginate` because it is always cheaper", "`simplePaginate` to get an exact total", "`cursorPaginate` with a stable ordering", "Load the entire collection and slice it in PHP"]
explanation = "Cursor pagination suits large, ordered streams when the total number of pages is not required."

[questions.php-laravel-dv010]
prompt = "When is `simplePaginate` a reasonable choice?"
options = ["When the UI must show the exact number of pages", "When only previous/next navigation is needed and the full result count is not", "When every record must be returned in one response", "When the data has no defined order"]
explanation = "`simplePaginate` does not need a total record count, so it suits a UI that only needs previous and next page links."

[questions.php-laravel-dv011]
prompt = "Select the good practices for creating a paginated JSON response with a Resource."
options = ["Expose only the fields the client needs", "Use `whenLoaded` for optional relationships to avoid unintended lazy loading", "Always remove pagination metadata to make the response shorter", "Set a stable ordering before using cursor pagination"]
explanation = "A Resource should define the public contract deliberately; cursor pagination needs a stable order. Keep metadata when the client needs navigation or pagination state."

[questions.php-laravel-dv012]
prompt = '''Provide the resource name so Laravel can create a JSON collection from the `$users` list:

```php
return {{blank}}::collection($users);
```'''
explanation = "A Resource class provides a collection method to present a list of models under the same contract."

[questions.php-laravel-dv013]
prompt = '''The query needs cursor pagination for a large list. Provide the appropriate method:

```php
$users = User::orderBy('id')->{{blank}}(50);
```'''
explanation = "`cursorPaginate` continues from a cursor instead of an offset, and the query needs a stable ordering."

[questions.php-laravel-dv014]
prompt = "In an interview, compare offset pagination with cursor pagination and explain why an API should use a Resource."
keywords = [["offset pagination"], ["cursor pagination"], ["stable ordering", "stable order"], ["response contract", "JSON contract"], ["total count", "total"]]
model_answer = "Offset pagination supports jumping to a page and often provides a total count, but large queries can be costly and changes between requests can shift results. Cursor pagination uses a stable ordering to continue from the last position; it suits large lists but is not convenient for jumping to an arbitrary page. A Resource keeps the response contract independent from the model and limits which fields are public."
explanation = "Balance navigation options, query cost, data stability, and the JSON contract."

[questions.php-laravel-dvc02]
title = "Paginate a result list"
prompt = '''Implement `paginateRecords(array $items, int $perPage, int $page): array`. Return an array with `data` containing the requested page slice and `meta` containing `current_page`, `per_page`, `total`, and `last_page`. `page` and `perPage` must be at least 1; otherwise throw `InvalidArgumentException`. `last_page` must be at least 1, even for an empty list. If `page` is greater than `last_page`, `data` must be an empty array and `current_page` must remain the requested page.'''
explanation = "Pagination metadata is part of the response contract; test the final page and an empty list to catch boundary errors."
hints = ["Calculate the offset from `page` and `perPage` after validating them.", "Calculate `last_page` with `ceil(total / perPage)`, then ensure it is at least 1."]

[modules.php-laravel-dv-http-client]
title = "HTTP Client and Service Integration"
description = "Call external services with timeouts, handle responses explicitly, and test without network access."
lesson = '''### Controlled HTTP calls
Laravel's HTTP Client provides a fluent API for setting headers, sending payloads, and reading responses from external services. Set an explicit timeout so a request cannot hold a worker indefinitely. An HTTP error status such as 404 or 503 usually still returns a response object; check `successful` or `failed`, or call `throw()` to turn a 4xx/5xx status into an exception. A connection failure and an error status are different cases and should be logged and handled according to separate policies.

| Need | Tool | Note |
|---|---|---|
| Limit the wait time | `timeout` | Choose a threshold based on the dependency SLA |
| Retry temporary failures | `retry` | Limit the number of attempts and delay |
| Handle an unsuccessful status | `failed` or `throw` | Do not assume every response succeeded |
| Test a request | `Http::fake` and assertions | Do not call the real service in a test |

Example:
```php
$response = Http::timeout(3)->retry(2, 100)->get($url);
$response->throw();
```

Retries can repeat side effects if a write request was already processed by the other service. For an operation that creates a transaction, retry only when it is designed to be idempotent or uses an idempotency key that the service actually supports. Retry temporary failures a limited number of times; do not retry forever or retry every 4xx error. Tests can use `Http::fake` to simulate a status and body and assert the method, URL, headers, and payload. This keeps tests stable and independent from the network. Common mistakes include forgetting a timeout, ignoring error statuses, or configuring a fake after the request has already been sent.'''

[questions.php-laravel-dv015]
prompt = "A request through Laravel's HTTP Client receives status 503. Which statement about the response is correct?"
options = ["It always throws an exception before a response object exists", "You can inspect the status or call `throw()` to convert the error status into an exception", "Laravel retries automatically without limit", "Status 503 is considered successful"]
explanation = "The HTTP Client returns a response so the application can decide how to handle it; `throw()` converts an HTTP error status into a `RequestException`."

[questions.php-laravel-dv016]
prompt = "A payment-creation endpoint may have processed a request, but the client timed out before receiving the response. What matters most before retrying?"
options = ["Increase the timeout without limit", "Ensure the operation is idempotent or use an idempotency key supported by the service", "Retry continuously until a 200 response arrives", "Change POST to GET without changing the contract"]
explanation = "A timeout does not prove the server failed to perform the operation. Idempotency helps prevent duplicate transactions on retry."

[questions.php-laravel-dv017]
prompt = "You want to test a service that calls a partner API without depending on the real network. What should you do?"
options = ["Call the real endpoint in every test", "Register `Http::fake` before the call, then assert the request and response", "Disable all test assertions", "Replace the HTTP Client with a sleep"]
explanation = "An HTTP fake simulates the external service and lets the test assert the request without making a network call."

[questions.php-laravel-dv018]
prompt = "Select the measures that make HTTP integration more reliable in production."
options = ["Set a clear timeout", "Limit retries and retry only suitable failures", "Retry every 401 authentication error forever", "Use a fake and assertions in tests to verify the request"]
explanation = "Timeouts, bounded retries, and test fakes improve control. Retrying a 401 forever does not fix the cause and may increase load."

[questions.php-laravel-dv019]
prompt = '''Provide the facade used to configure a fake response before calling an external service in a test:

```php
{{blank}}::fake(['partner.test/*' => Http::response(['ok' => true], 200)]);
```'''
explanation = "The Laravel HTTP Client fake configures a simulated response for requests made in a test."

[questions.php-laravel-dv020]
prompt = '''Provide the method that turns a 4xx/5xx response into an exception:

```php
$response = Http::get($url);
$response->{{blank}}();
```'''
explanation = "`throw` throws an exception when a response has an HTTP error status, so execution can move to the appropriate catch handler."

[questions.php-laravel-dv021]
prompt = "In an interview, describe timeout, retry, and testing policies for a client that calls an external payment API."
keywords = [["timeout", "time limit"], ["bounded retry", "limited retries"], ["idempotent", "idempotency"], ["idempotency key"], ["Http::fake", "HTTP fake"]]
model_answer = "I set a timeout based on the service SLA so a worker does not wait indefinitely. Retries are limited and target temporary failures. Since a timeout can occur after the partner creates a transaction, the operation must be idempotent or use an idempotency key supported by both parties. In tests, I use `Http::fake` to simulate successful and failed responses and verify the request without making a real network call."
explanation = "Treat a timeout as an uncertain outcome and protect write operations from being performed more than once."

[questions.php-laravel-dvc03]
title = "Calculate bounded backoff"
prompt = '''Implement `retryDelayMs(int $attempt, int $baseMs, int $maxMs): int` for exponential backoff. Attempts start at 1; the first delay is `baseMs`, and each later delay doubles, but must not exceed `maxMs`. `attempt` must be between 1 and 20, and `baseMs` and `maxMs` must be non-negative; values outside these bounds must throw `InvalidArgumentException`.'''
explanation = "Bounded backoff reduces retry bursts; in a real integration, combine it with a timeout and classification of temporary failures."
hints = ["Validate the input bounds before calculating.", "Stop early when the delay has reached `maxMs` or the next multiplication could exceed it."]

[modules.php-laravel-dv-events]
title = "Events, Notifications, and Mail"
description = "Separate domain events from side effects and send notifications through suitable channels."
lesson = '''### Separating events from notifications
A domain event describes something that has happened, such as `OrderPaid`; a listener reacts by updating a projection, sending email, or publishing information to another system. This keeps a controller from needing to know about every side effect. An event describes a business occurrence, while a notification chooses recipients and channels such as mail, database, or broadcast. Mail is appropriate when custom email content is needed; a Notification is useful when the same message can be delivered through multiple channels.

| Tool | Responsibility | Example |
|---|---|---|
| Event | Describes something that happened | `OrderPaid` |
| Listener | Reacts to an event | Create a receipt |
| Notification | Chooses content, recipients, and channels | Mail + database |
| Queue | Moves slow work to a worker | Send email outside the request |

Example of sending a notification to multiple users:
```php
Notification::send($users, new InvoicePaid($invoice));
```

A listener or notification can implement `ShouldQueue` when slow work needs to run in the background; queues still need bounded retries and a way to handle final failure. If an event depends on data written in a transaction, dispatch it after commit so a listener does not read an uncommitted record. In tests, `Notification::fake` and `Event::fake` verify that a notification or event was dispatched without sending it for real. Common mistakes include sending email synchronously in a request, dispatching an event before a transaction commits, or assuming that retries prevent duplicate side effects.'''

[questions.php-laravel-dv022]
prompt = "In an event/listener architecture, what should `OrderPaid` represent?"
options = ["An SQL query", "A business event that has occurred", "An email sent to the buyer", "An HTTP middleware"]
explanation = "An event describes what happened; a listener decides which reaction should run."

[questions.php-laravel-dv023]
prompt = "A listener reads an order immediately after an event is dispatched inside a transaction, but cannot find the record. What is a suitable fix?"
options = ["Dispatch the event after the transaction commits", "Disable transactions for the whole application", "Retry indefinitely in the controller", "Change the event to an email"]
explanation = "A listener may run before the transaction commits. Delaying dispatch until after commit lets it read the persisted state."

[questions.php-laravel-dv024]
prompt = "A message needs to reach a user by both email and database. Which choice correctly describes the role of a Laravel Notification?"
options = ["A Notification can define multiple channels for the same message", "Each notification can be sent through only one SMTP server", "A Notification replaces a database transaction", "A Notification can only be used in a controller"]
explanation = "A Notification can choose one or more channels based on the recipient and context."

[questions.php-laravel-dv025]
prompt = "Select reasonable decisions when implementing a notification after an order is paid."
options = ["Dispatch an event to represent that the order was paid", "Queue slow email delivery when appropriate", "Fake notifications in tests", "Dispatch the event before commit and assume the listener always sees committed data"]
explanation = "Events separate business logic from side effects; a queue reduces request time; fakes prevent real sends in tests. Transaction consistency must be handled deliberately."

[questions.php-laravel-dv026]
prompt = '''Provide the interface that lets Laravel queue notification delivery:

```php
class InvoicePaid extends Notification implements {{blank}} {
}
```'''
explanation = "A Notification can implement `ShouldQueue` so a worker handles delivery."

[questions.php-laravel-dv027]
prompt = '''Provide the facade used to record a notification in a test without sending it through a real channel:

```php
{{blank}}::fake();
```'''
explanation = "`Notification::fake` replaces real delivery and provides assertions for tests."

[questions.php-laravel-dv028]
prompt = "In an interview, explain how to separate order payment from email delivery and ensure a listener can read committed data."
keywords = [["domain event", "business event"], ["listener", "event listener"], ["queue", "queued job"], ["after commit", "after the transaction commits"], ["notification", "user notification"]]
model_answer = "After a payment succeeds, the application dispatches a domain event such as `OrderPaid`. A listener handles email delivery or creates a notification, keeping the controller separate from side effects. Slow work can run through a queue. If the event depends on a record created in a transaction, dispatch it after commit so the listener runs only after the data has been committed. A test can use `Notification::fake` to verify the notification without sending a real email."
explanation = "A good answer identifies the business boundary, background processing, and consistency with the transaction."

[questions.php-laravel-dvc04]
title = "Deduplicate notification recipients"
prompt = '''Implement `uniqueRecipientIds(array $ids): array`. Keep only IDs that are positive integers, remove duplicates, and preserve the order of first appearance. Ignore values that are not positive integers; do not cast numeric strings to integers.'''
explanation = "Deduplicating recipient lists helps prevent repeated notifications when the same user appears in multiple sources."
hints = ["Iterate once and add each valid ID to the result array.", "Use strict comparison when checking whether an ID is already present so values of different types are not combined."]
