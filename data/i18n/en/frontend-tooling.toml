options = ["Transforming non-JS files (CSS, images, TS…) into modules webpack can process", "Making web pages load faster in the browser", "Completely replacing plugins", "Running unit tests"]
explanation = "A loader transforms each file as it is imported; a plugin hooks into broader steps of the build process."

[questions.frontend-tooling-lv047]
prompt = "What is the main difference between ESLint and Prettier?"
options = ["ESLint finds bugs/suspicious code patterns; Prettier formats code in one consistent style", "ESLint only runs on CSS", "Prettier compiles TypeScript to JavaScript", "The two tools are identical"]
explanation = "A linter analyzes logic and conventions; a formatter only handles whitespace, line breaks, and brackets."

[questions.frontend-tooling-lv048]
