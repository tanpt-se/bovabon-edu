if (name === 'a') {}
```
'''
options = ["The line using `==`", "The line using `===`", "Both lines", "Neither line"]
explanation = "`eqeqeq` requires `===`/`!==` to avoid implicit type coercion."

[questions.frontend-tooling-lv050]
prompt = "Which form lets the bundler split the Settings page into its own chunk that loads only when needed?"
options = ["`const Settings = () => import('./Settings.js')`", "`import Settings from './Settings.js'` at the top of the file", "`require('./Settings.js')` at the top of the file", "Copy the Settings code into `main.js`"]
explanation = "A dynamic `import()` creates an asynchronous loading boundary; a static import merges the module into the caller's chunk."

[questions.frontend-tooling-lv051]
prompt = "Why do build files have names like `app.3f9a1c.js` instead of `app.js`?"
options = ["The hash changes when the content changes, so browsers can cache for a long time and still get the new version on deploy", "To make the file smaller", "To make the browser run the code faster", "To hide the source code"]
explanation = "That is cache busting with a content hash: new content gets a new URL."

[questions.frontend-tooling-lv052]
prompt = "Which classes vertically center the children of a flex row?"
explanation = "With `flex-row`, `items-*` aligns along the cross axis (vertical); `justify-*` distributes along the main axis (horizontal)."

[questions.frontend-tooling-lv053]
prompt = '''How many classes does the following generate?
```scss
