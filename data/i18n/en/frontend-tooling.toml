```
'''
options = ["3", "1", "0, because `@each` only runs in the browser", "6"]
explanation = "`@each` iterates over the 3 list items and generates `.text-sm`, `.text-md`, `.text-lg` at compile time."

[questions.frontend-tooling-lvc05]
title = "Add a Hash to a File Name"
prompt = '''Write `hashedName(fileName, hash)` that inserts the hash before the **last** extension of a file name, the way bundlers name assets:
- `hashedName('app.js', 'a1b2')` → `'app.a1b2.js'`
- `hashedName('vendor.min.js', 'ff')` → `'vendor.min.ff.js'`
- A file without an extension: append `.hash` at the end, e.g. `hashedName('LICENSE', '9')` → `'LICENSE.9'`.
- Only consider the file name (no directories). A name starting with a dot, like `.env`, is treated as having no extension.
'''
explanation = "A content hash in the file name is the foundation of long-term caching: when the content changes, the name changes and the browser fetches the new version automatically."
hints = ["`lastIndexOf('.')` gives the position of the last dot.", "Position 0 (hidden file) or -1 (no dot) are both treated as having no extension."]
