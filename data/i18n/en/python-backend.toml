[modules.python-backend-dv-fastapi-deps]
title = "FastAPI: Dependency Lifecycle & Testing"
description = "Dependency graphs, cleanup with yield, request-scoped caching and dependency overrides."
lesson = '''### Dependencies as replaceable boundaries

FastAPI uses **Depends** to declare dependencies in an endpoint signature. A dependency can have its own dependencies, so the framework builds a graph and resolves it before calling the endpoint. This is a suitable place to provide an authenticated user, configuration, a database session or shared logic without tying a route to the way a resource is created.

| Pattern | Effect | When to use it |
|---|---|---|
| Regular dependency function | Creates or returns a value | Configuration, authorization |
| Dependency with `yield` | Provides a resource, then cleans it up | Database session, file, lock |
| Sub-dependency | Reuses another dependency | User depends on token |
| `dependency_overrides` | Replaces a dependency in tests | Fake database or user |

Example of a resource that must be closed even if the endpoint fails:

~~~python
def get_connection():
    connection = open_connection()
    try:
        yield connection
    finally:
        connection.close()

@app.get("/items")
def list_items(connection = Depends(get_connection)):
    return query_items(connection)
~~~

FastAPI runs the code before `yield` to prepare the resource and the `finally` block to clean it up according to the dependency lifecycle. Dependencies reused within one request are usually cached, so referencing the same dependency from multiple branches does not necessarily create multiple connections. When needed, caching can be disabled with `use_cache=False`; do not rely on this cache to share state between requests.

In a test, `TestClient` sends a request through the app, while `app.dependency_overrides` maps the original dependency function to a replacement. This lets a test avoid a real database or token and create deterministic data. Restore or clear overrides after the test so they do not affect later tests. Common mistakes include overriding the wrong dependency object, forgetting to clear an override, or opening a resource without putting its close operation in `finally`. Use dependencies to share logic with a clear boundary; middleware is a better fit for behavior that applies broadly to most requests, such as measuring duration.
'''

[questions.python-backend-dv009]
prompt = '''An endpoint needs to reuse a function that retrieves the current user and checks permissions. How does FastAPI usually declare that dependency?'''
options = ["Put `Depends(get_current_user)` in the endpoint signature", "Create a global variable and modify it in each request", "Call `app.run()` from the endpoint", "Pass the dependency through a query string"]
explanation = '''`Depends` declares a dependency explicitly so FastAPI can resolve it and provide its result to the endpoint.'''

[questions.python-backend-dv010]
prompt = '''Why does a dependency that manages a database session often use `try/finally` around `yield`?'''
options = ["To close the session after use, including when an exception occurs", "To automatically turn a synchronous endpoint into an asynchronous one", "To skip request validation", "To store the session in a cookie"]
explanation = '''The `finally` block in a dependency with `yield` provides reliable cleanup after the resource has been supplied.'''

[questions.python-backend-dv011]
prompt = '''How does FastAPI usually handle the same dependency being referenced multiple times within one request?'''
options = ["It caches the result within the request by default", "It calls the dependency exactly once for the entire process lifetime", "It stores the result in a cookie", "It rejects the request because the dependency is duplicated"]
explanation = '''FastAPI caches dependencies within a request by default; that cache is not shared state across requests.'''

[questions.python-backend-dv012]
prompt = '''What is a suitable way for a test endpoint to use a fake repository instead of the real repository dependency?'''
options = ["Assign the fake function in `app.dependency_overrides` under the original dependency", "Modify the endpoint function directly in production", "Change every response to status 204", "Create a random token in a query string"]
explanation = '''`dependency_overrides` lets a test app replace the exact dependency without changing the endpoint code.'''

[questions.python-backend-dv013]
prompt = '''Why are dependency overrides useful in API tests?'''
options = ["Avoid connecting to the real database", "Provide a test user with known permissions", "Keep the endpoint signature the same as in production", "Precisely verify production performance automatically"]
explanation = '''An override replaces a dependency at the test boundary; it is not a substitute for performance testing the production system.'''

[questions.python-backend-dv014]
prompt = '''Choose the correct statements about dependencies with `yield`.'''
options = ["They can manage a resource lifecycle", "Putting cleanup in `finally` helps it run if request handling raises an error", "Every request always shares the same dependency object with every other request", "Dependencies can be nested to split setup into smaller steps"]
explanation = '''`yield` supports setup and cleanup, and a dependency can have sub-dependencies; default caching is scoped to a request.'''

[questions.python-backend-dv015]
prompt = '''Fill in the attribute used to map an original dependency to a fake dependency in a test:

~~~python
app.{{blank}}[get_db] = get_test_db
~~~
'''
explanation = '''FastAPI exposes `dependency_overrides` on the app to replace dependencies during testing.'''

[questions.python-backend-dv016]
prompt = '''Explain how a dependency with `yield` and a dependency override help an endpoint use resources safely in production while remaining independently testable.'''
model_answer = '''Dependency injection lets an endpoint receive a resource through `Depends` instead of creating it directly. A dependency with `yield` prepares the resource and puts cleanup in `finally`, closing the session even if an error occurs. In a test, dependency overrides replace a real database or user with a fake that has deterministic data. The test should restore the override afterward to keep tests isolated and prevent it from affecting other tests.'''
explanation = '''Mention setup and cleanup with `yield`, and controlled replacement of a dependency in a test.'''

[questions.python-backend-dvc02]
title = "Scoped override registry"
prompt = '''Write a context manager `override_scope(registry, replacements)`. On entering the `with` block, update `registry` with `replacements`. On exit, always restore the original values of keys that existed and remove keys that were added, even if the `with` block raises an exception. Support nested scopes. Use only the standard library.'''
hints = ["Save each key's old value; use a unique sentinel to distinguish a missing key from a value of `None`.", "Restore values in `finally` so cleanup also runs if the `with` block fails."]
explanation = '''Test overrides are temporary app state; a context manager ensures the registry is cleaned up even if a request or assertion raises an error.'''

[modules.python-backend-dv-sqlite]
title = "SQLite: Safe Queries & Transactions"
description = "Parameter binding, connection management and atomic data updates."
lesson = '''### Using SQLite safely in Python applications

`sqlite3` is the standard library for storing relational data in a file or a temporary in-memory database. A Connection holds a connection and transaction boundary; `execute()` runs SQL, while a Cursor reads results. In a web app, a connection is usually created for the request scope and closed when the request ends, rather than sharing a global cursor.

| Need | Approach | Avoid |
|---|---|---|
| Pass values to SQL | `?` placeholders and a parameter tuple | Concatenating user input |
| Group related changes | One transaction | Committing after each related statement |
| Finish successfully | `commit` or a context manager | Leaving changes uncommitted |
| Handle an error midway | Roll back the transaction | Leaving data partially updated |

Example parameterized query:

~~~python
row = connection.execute(
    "SELECT id, email FROM users WHERE email = ?",
    (email,),
).fetchone()
~~~

Placeholders are for **values** only; they cannot replace table or column names. If you need to select a column, use a fixed allowlist rather than inserting arbitrary text into SQL. Do not use an f-string to concatenate input into a query, because that can create SQL injection.

A transaction makes multiple statements succeed together or roll back together. A bank transfer is an example: subtract from the source account, then add to the destination; if the destination does not exist, the subtraction must roll back. With a connection context manager, an error in the block rolls back the transaction, and a normal exit commits if a transaction is open; the context manager does not close the connection. Set the autocommit or transaction mode explicitly in the connection configuration to avoid relying on legacy defaults.

SQLite has more flexible storage types than many database servers, so applications should validate input and use integers for money in the smallest unit rather than floats. Enable foreign key enforcement on each connection if the schema relies on foreign keys. Common mistakes include forgetting to commit, committing too early and breaking the atomicity of a multi-step operation, using a connection concurrently inappropriately, and swallowing `sqlite3.Error` without noticing a failed transaction.
'''

[questions.python-backend-dv017]
prompt = '''What is a safe way to put a user-supplied email address into a SQL condition?'''
options = ["Use a `?` placeholder and pass the email separately in a tuple", "Concatenate the email directly with an f-string", "Use `repr(email)` to construct the SQL", "Remove single quotes and then concatenate the string"]
explanation = '''Parameter binding separates data from SQL syntax and helps prevent SQL injection.'''

[questions.python-backend-dv018]
prompt = '''An update subtracts money from A and then adds it to B. If the addition fails, what is most important?'''
options = ["Roll back to undo the subtraction too", "Commit the subtraction first and ignore the error", "Close the cursor to restore the data automatically", "Retry only the addition without checking the state"]
explanation = '''A transaction makes a multi-step operation atomic and prevents a state where money was subtracted but not added.'''

[questions.python-backend-dv019]
prompt = '''Which statement about the `sqlite3` connection context manager is correct?'''
options = ["It may commit when the block exits normally and roll back on error if a transaction is open", "It always closes the connection when leaving the block", "It starts a separate SQLite server automatically", "It converts all data to JSON automatically"]
explanation = '''The context manager handles commit or rollback for the transaction, but it does not close the connection.'''

[questions.python-backend-dv020]
prompt = '''A `balance` column stores money in cents. Which type should the application use to avoid floating-point errors?'''
options = ["`INTEGER` containing the number of cents", "`REAL` for all monetary calculations", "A formatted string with commas", "A `BLOB` containing a float representation"]
explanation = '''Storing the smallest unit as an integer avoids floating-point rounding errors.'''

[questions.python-backend-dv021]
prompt = '''Which practices make SQLite queries safer and easier to maintain?'''
options = ["Bind input with placeholders", "Use a transaction for related multi-step updates", "Put a user-supplied column name directly into a value placeholder", "Close the connection according to the application's lifecycle"]
explanation = '''Placeholders protect values; if identifiers must be dynamic, select them from an allowlist. Connections need a clear lifecycle.'''

[questions.python-backend-dv022]
prompt = '''A bank transfer transaction fails after the source account has been debited. Choose the correct handling.'''
options = ["Roll back the entire transaction", "Check both the source balance and the destination update", "Catch the error and commit the unfinished changes", "Keep both updates in the same transaction"]
explanation = '''Both changes must belong to the same transaction; committing a partial state breaks atomicity.'''

[questions.python-backend-dv023]
prompt = '''Complete the safe parameterized query:

~~~python
row = connection.execute(
    "SELECT id FROM users WHERE email = {{blank}}",
    (email,),
).fetchone()
~~~
'''
explanation = '''A qmark placeholder receives a value from the parameter tuple instead of concatenating input into SQL.'''

[questions.python-backend-dv024]
prompt = '''Describe how to implement a safe money transfer with `sqlite3`, from parameter binding to transaction error handling.'''
model_answer = '''Use placeholders and bind parameters so user data is not concatenated into SQL. Subtract from the source and add to the destination in the same transaction to make the operation atomic. If either update fails, roll back to restore the original balances; commit only when both steps succeed.'''
explanation = '''Connect safe parameter binding with rollback/commit and the atomicity of the operation.'''

[questions.python-backend-dvc03]
title = "Atomic money transfer"
prompt = '''Write `transfer(connection, source_id, target_id, amount)` for a table `accounts(id INTEGER PRIMARY KEY, balance INTEGER NOT NULL)`. `amount` is a positive integer number of cents, and the two IDs must differ. Return `True` if the transfer succeeds. Return `False` if `amount` is invalid, the source does not exist or lacks sufficient funds, or the target does not exist. If any update step fails, do not leave a partial change. Use placeholders for every SQL value.'''
hints = ["Use an `UPDATE` with the condition `balance >= amount` and check `rowcount`.", "If updating the source or target does not affect exactly one row, raise an exception inside `with` so SQLite rolls back."]
explanation = '''Two `UPDATE` statements in the same transaction make the operation atomic; parameter binding keeps input separate from SQL syntax.'''
