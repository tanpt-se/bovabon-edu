explanation = '''Test overrides are temporary app state; a context manager ensures the registry is cleaned up even if a request or assertion raises an error.'''

[modules.python-backend-dv-sqlite]
title = "SQLite: Safe Queries & Transactions"
description = "Parameter binding, connection management and atomic data updates."
lesson = '''### Using SQLite safely in Python applications

`sqlite3` is the standard library for storing relational data in a file or a temporary in-memory database. A Connection holds a connection and transaction boundary; `execute()` runs SQL, while a Cursor reads results. In a web app, a connection is usually created for the request scope and closed when the request ends, rather than sharing a global cursor.

| Need | Approach | Avoid |
|---|---|---|
| Pass values to SQL | `?` placeholders and a parameter tuple | Concatenating user input |
| Group related changes | One transaction | Committing after each related statement |
| Finish successfully | `commit` or a context manager | Leaving changes uncommitted |
| Handle an error midway | Roll back the transaction | Leaving data partially updated |

Example parameterized query:

~~~python
row = connection.execute(
    "SELECT id, email FROM users WHERE email = ?",
    (email,),
).fetchone()
~~~

Placeholders are for **values** only; they cannot replace table or column names. If you need to select a column, use a fixed allowlist rather than inserting arbitrary text into SQL. Do not use an f-string to concatenate input into a query, because that can create SQL injection.

A transaction makes multiple statements succeed together or roll back together. A bank transfer is an example: subtract from the source account, then add to the destination; if the destination does not exist, the subtraction must roll back. With a connection context manager, an error in the block rolls back the transaction, and a normal exit commits if a transaction is open; the context manager does not close the connection. Set the autocommit or transaction mode explicitly in the connection configuration to avoid relying on legacy defaults.

SQLite has more flexible storage types than many database servers, so applications should validate input and use integers for money in the smallest unit rather than floats. Enable foreign key enforcement on each connection if the schema relies on foreign keys. Common mistakes include forgetting to commit, committing too early and breaking the atomicity of a multi-step operation, using a connection concurrently inappropriately, and swallowing `sqlite3.Error` without noticing a failed transaction.
'''

[questions.python-backend-dv017]
prompt = '''What is a safe way to put a user-supplied email address into a SQL condition?'''
options = ["Use a `?` placeholder and pass the email separately in a tuple", "Concatenate the email directly with an f-string", "Use `repr(email)` to construct the SQL", "Remove single quotes and then concatenate the string"]
explanation = '''Parameter binding separates data from SQL syntax and helps prevent SQL injection.'''

[questions.python-backend-dv018]
prompt = '''An update subtracts money from A and then adds it to B. If the addition fails, what is most important?'''
options = ["Roll back to undo the subtraction too", "Commit the subtraction first and ignore the error", "Close the cursor to restore the data automatically", "Retry only the addition without checking the state"]
explanation = '''A transaction makes a multi-step operation atomic and prevents a state where money was subtracted but not added.'''

[questions.python-backend-dv019]
prompt = '''Which statement about the `sqlite3` connection context manager is correct?'''
options = ["It may commit when the block exits normally and roll back on error if a transaction is open", "It always closes the connection when leaving the block", "It starts a separate SQLite server automatically", "It converts all data to JSON automatically"]
explanation = '''The context manager handles commit or rollback for the transaction, but it does not close the connection.'''

[questions.python-backend-dv020]
prompt = '''A `balance` column stores money in cents. Which type should the application use to avoid floating-point errors?'''
options = ["`INTEGER` containing the number of cents", "`REAL` for all monetary calculations", "A formatted string with commas", "A `BLOB` containing a float representation"]
explanation = '''Storing the smallest unit as an integer avoids floating-point rounding errors.'''

[questions.python-backend-dv021]
prompt = '''Which practices make SQLite queries safer and easier to maintain?'''
options = ["Bind input with placeholders", "Use a transaction for related multi-step updates", "Put a user-supplied column name directly into a value placeholder", "Close the connection according to the application's lifecycle"]
explanation = '''Placeholders protect values; if identifiers must be dynamic, select them from an allowlist. Connections need a clear lifecycle.'''

[questions.python-backend-dv022]
prompt = '''A bank transfer transaction fails after the source account has been debited. Choose the correct handling.'''
options = ["Roll back the entire transaction", "Check both the source balance and the destination update", "Catch the error and commit the unfinished changes", "Keep both updates in the same transaction"]
explanation = '''Both changes must belong to the same transaction; committing a partial state breaks atomicity.'''

[questions.python-backend-dv023]
prompt = '''Complete the safe parameterized query:

~~~python
row = connection.execute(
    "SELECT id FROM users WHERE email = {{blank}}",
    (email,),
).fetchone()
~~~
'''
explanation = '''A qmark placeholder receives a value from the parameter tuple instead of concatenating input into SQL.'''

[questions.python-backend-dv024]
prompt = '''Describe how to implement a safe money transfer with `sqlite3`, from parameter binding to transaction error handling.'''
model_answer = '''Use placeholders and bind parameters so user data is not concatenated into SQL. Subtract from the source and add to the destination in the same transaction to make the operation atomic. If either update fails, roll back to restore the original balances; commit only when both steps succeed.'''
explanation = '''Connect safe parameter binding with rollback/commit and the atomicity of the operation.'''

[questions.python-backend-dvc03]
title = "Atomic money transfer"
prompt = '''Write `transfer(connection, source_id, target_id, amount)` for a table `accounts(id INTEGER PRIMARY KEY, balance INTEGER NOT NULL)`. `amount` is a positive integer number of cents, and the two IDs must differ. Return `True` if the transfer succeeds. Return `False` if `amount` is invalid, the source does not exist or lacks sufficient funds, or the target does not exist. If any update step fails, do not leave a partial change. Use placeholders for every SQL value.'''
hints = ["Use an `UPDATE` with the condition `balance >= amount` and check `rowcount`.", "If updating the source or target does not affect exactly one row, raise an exception inside `with` so SQLite rolls back."]
explanation = '''Two `UPDATE` statements in the same transaction make the operation atomic; parameter binding keeps input separate from SQL syntax.'''

[modules.python-backend-lead]
title = "Tech Lead Perspective"
description = "Choosing a framework and the sync/async model, structuring large projects, zero-downtime DB migrations, worker scaling, task queues, observability, safe rollouts, and review standards for a Python backend team."
lesson = '''### The Tech Lead's role in a Python backend project
A senior answers "how do we do this right"; a lead answers "**what should we do, with this team, under these constraints**". Every decision should state the context (people, time, load, cost), the options, the comparison criteria, the risks and the way back (rollback).

### A quick decision framework
1. **Constraints first, technology second**: what the team knows, the deadline, the SLO (e.g. p95 < 300 ms), the infrastructure budget.
2. **List ≥ 2 options**, always including "keep as is + small improvements".
3. **Score against criteria** (table below), and say whether each number is an estimate or a measurement.
4. **Try small first** (spike, canary, feature flag), with a stop point if metrics get worse.
5. **Write an ADR** so whoever comes next understands why.

| Criterion | Flask (WSGI) | FastAPI (ASGI) | Django |
|---|---|---|---|
| Team learning curve | low | medium (async, Pydantic) | medium |
| High concurrent I/O, WebSocket | poor (needs gevent/separate ASGI) | good | medium (ASGI + channels) |
| Built-in internal admin/CRUD | no | no | excellent |
| API contract (OpenAPI) | add an extension | generated automatically | add DRF/ninja |
| Biggest risk | self-assembled, few conventions | blocking code inside `async def` | heavy ORM, hard to split into services |

### Reference numbers (estimates — always re-measure on the real system)
- Gunicorn/Uvicorn workers: start at ~1 process per vCPU (sync workers can use 2×vCPU + 1), then tune by memory and load tests.
- Sync workers blocked on I/O: throughput ≈ number of workers ÷ average wait time per request.
- DB connection pool: the total `pool_size × processes × instances` must stay below the DB's `max_connections`.

### Zero-downtime DB migration (expand → migrate → contract)
1. **Expand**: add the new column/table as nullable, without locking the table for long.
2. **Migrate**: code writes both old and new; backfill in small batches that can be paused and resumed.
3. **Contract**: once every deployment reads the new column, add the NOT NULL constraint, then drop the old column in a later release.
Each step must stay compatible with both code versions running side by side during a rolling deploy.

### Backend PR review checklist (put it in the template)
- [ ] The endpoint has a clear input/output schema (`response_model`) and exposes no sensitive fields.
- [ ] No blocking library calls inside `async def`; outgoing calls always have a **timeout**.
- [ ] Error branches (4xx) are tested, not just the happy path.
- [ ] Logs are structured with a `request_id`, and never contain passwords/tokens.
- [ ] Migrations are backward compatible and have a rollback plan.
- [ ] Important background jobs go through a durable queue with retries and idempotency.

### Sample ADR (condensed)
> **ADR-007: Move realtime chat into a separate ASGI service**
> *Context*: a 4-year-old Flask monolith, a team of 5, WebSocket needed within one quarter.
> *Decision*: keep Flask for everything else; write the chat service in FastAPI, share auth via JWT, behind the same reverse proxy.
> *Consequences*: one more deploy pipeline and dashboard; avoids a full rewrite; revisit in 6 months.

### Anti-patterns at team scale
- **A big-bang rewrite** just because a new framework is faster in benchmarks.
- Business logic stuffed into route handlers → untestable, not reusable from workers/CLI.
- Module-level globals used as cache/state → every worker process sees a different copy.
- Everyone reads configuration their own way and picks their own HTTP library → slow onboarding, unpredictable bugs.
- Alerting on every exception instead of on SLOs → the team goes "blind" from alert fatigue.
- Fixing juniors' code for them without explaining, and without turning the lesson into a lint rule or guideline.
'''

[questions.python-backend-lv001]
prompt = '''A team of 5 maintains a stable Flask monolith. Next quarter they need a realtime chat feature (WebSocket) for a small group of users, with a 10-week deadline and without slowing down the rest of the roadmap. What is the most reasonable option?'''
options = ["Rewrite the whole monolith in FastAPI to get ASGI for every endpoint", "Keep Flask; write a small chat service in FastAPI/Starlette (ASGI) that shares the auth mechanism, behind the same reverse proxy", "Enable gevent monkey-patching for the whole monolith so Flask handles WebSocket itself", "Have the client poll REST every 100 ms so WebSocket is not needed"]
explanation = '''Splitting the part that needs ASGI into a small service confines the risk to the new feature. A full rewrite blows the deadline and is high risk; monkey-patching the whole app can break libraries already in use; 100 ms polling costs many times more resources than it is worth.'''

[questions.python-backend-lv002]
prompt = '''You need to add a `tenant_id NOT NULL` column to an `orders` table with 50 million rows. Deploys are rolling (old and new code run side by side for a few minutes), and there must be no downtime. Which plan fits?'''
options = ["A single migration: `ADD COLUMN tenant_id ... NOT NULL DEFAULT`, then deploy the new code", "Add a nullable column → deploy code that writes the new column → backfill in batches → once every deployment writes it, add the NOT NULL constraint → clean up old code", "Create an `orders_v2` table, copy the data overnight, rename the tables", "Stop writes for 30 minutes at off-peak hours to run the migration"]
explanation = '''The expand → migrate → contract pattern keeps every step compatible with both old and new code and can be paused midway. A one-step migration may lock the table for a long time or make old code (unaware of the new column) fail on insert; copying to a new table misses writes made during the copy; stopping writes violates the no-downtime requirement.'''

[questions.python-backend-lv003]
prompt = '''You are writing a PR review checklist for a FastAPI team. Which items are worth including (value relative to review cost)?'''
options = ["Endpoints declare a clear `response_model`/output schema and expose no sensitive fields", "Every outgoing HTTP/DB call has a timeout", "No blocking library calls inside `async def`", "Require 100% coverage on every PR and block the merge otherwise", "Reviewers manually check indentation and import order", "Error branches (4xx) are tested, not just the happy path"]
explanation = '''Items 0, 1, 2 and 5 catch common production bugs that tools struggle to detect. 100% coverage produces meaningless tests written to hit a number; formatting and import order belong to a formatter/linter in CI, not to reviewers.'''

[questions.python-backend-lv004]
prompt = '''A FastAPI service must send ~10,000 report emails per day. Requirements: no lost jobs on deploy/restart, automatic retry on transient email provider errors, no duplicate sends. Choose the design.'''
options = ["FastAPI `BackgroundTasks` in the report-creation endpoint", "Start a `threading.Thread` in the API process for each email", "A durable queue (Celery/RQ/Arq with a broker such as Redis/RabbitMQ), tasks with retry + backoff and an idempotency key per email", "A cron job that calls an internal endpoint every minute to scan the table and send everything"]
explanation = '''Only a durable queue decoupled from the API process lifecycle keeps jobs across restarts; retry + an idempotency key handle transient errors without duplicates. BackgroundTasks and threads lose jobs when the process stops; a cron calling an endpoint easily overlaps and lacks per-job retry.'''

[questions.python-backend-lv005]
prompt = '''Each instance has 4 vCPU and 2 GB RAM; one Uvicorn worker of the FastAPI service (mostly async I/O) uses ~300 MB at runtime. Which starting worker configuration do you pick before load testing?'''
options = ["A single worker, since async already handles many concurrent requests", "~4 workers (about 1 per vCPU, ~1.2 GB RAM), then adjust based on load test results and actual memory", "16 workers to maximize throughput", "As many workers as expected concurrent requests at peak"]
explanation = '''A Python process can only make effective use of ~1 core for CPU work (GIL), so 1 worker wastes 3 vCPUs. 16 workers need ~4.8 GB, exceeding RAM. Async lets each worker serve many requests, so you do not need one worker per concurrent request. The number is only a starting point and must be measured.'''

[questions.python-backend-lv006]
prompt = '''Set the minimum mandatory observability for every new Python service before it goes to production. Choose the reasonable requirements.'''
options = ["Structured (JSON) logs with a `request_id` propagated across services", "RED metrics per endpoint: rate, errors, duration (p50/p95/p99)", "Tracing for DB calls and outgoing HTTP", "Log the full request body (including passwords) for easier debugging", "Send an alert for every exception as soon as it happens", "SLO-based alerts (e.g. error rate/latency over a threshold within a time window)"]
explanation = '''Structured logs, RED metrics, tracing and SLO-based alerts let you detect and isolate incidents. Logging passwords is a security bug; alerting on every exception causes alert fatigue, so the team ignores even the important alerts.'''

[questions.python-backend-lv007]
prompt = '''New project: an internal back-office with ~40 CRUD screens and group-based permissions, 6 weeks, a team of 4 who all have years of Django experience, low load (< 20 req/s). Choose the framework.'''
options = ["FastAPI because it is fastest in benchmarks", "Flask + hand-assembled extensions for admin, auth and forms", "Django (built-in admin, auth, ORM, migrations), adding an API when needed", "Write it in Go to be ready for the future"]
explanation = '''At low load, the deciding factors are delivery speed and team experience: Django admin covers most CRUD screens. FastAPI's performance edge is worthless at 20 req/s; Flask requires a lot of assembly; switching languages increases deadline risk.'''

[questions.python-backend-lv008]
prompt = '''A Flask codebase has ~40% of endpoints without tests. This quarter you must replace the auth mechanism (session cookie → JWT) while still shipping features. Which strategy is most balanced?'''
options = ["Freeze features for 2 months to write tests for the whole codebase", "Write characterization tests for the current auth flows, replace the mechanism step by step behind a feature flag, and enable it gradually by user group", "Replace all of auth in one big PR and test it carefully by hand", "Keep both mechanisms forever to avoid risk"]
explanation = '''Tests that lock in current behavior exactly where you are about to change things, combined with a feature flag, allow a gradual rollout and fast rollback. A feature freeze has a business cost; a large PR is hard to review and hard to back out; keeping two mechanisms forever doubles the attack surface and maintenance cost.'''

[questions.python-backend-lv009]
prompt = '''You are responsible for upgrading 12 services from Python 3.10 to 3.13. Two services handle payments; the rest are internal. Which plan is reasonable?'''
options = ["Upgrade all 12 services in the same release for consistency", "Wait until 3.10 reaches end of support before thinking about it", "Add a CI matrix running tests on both 3.10 and 3.13; upgrade low-risk internal services first and watch metrics; finally canary the payment services", "Upgrade the payment services first because they matter most"]
explanation = '''A CI matrix catches compatibility problems early; starting with low-risk services lets the team learn and refine the playbook before touching critical parts. Upgrading everything at once makes failures hard to isolate; waiting for EOL piles the risk into the last minute; starting with payments puts the biggest risk first.'''

[questions.python-backend-lv010]
prompt = '''Write a short ADR: a new service (FastAPI) calls 3 external APIs and PostgreSQL on every request; the team is not yet familiar with async. Do you choose `def` or `async def` endpoints? Include the conditions and how you will validate the decision.'''
keywords = [["async"], ["blocking", "block"], ["driver"], ["threadpool", "thread pool"], ["load test", "benchmark", "measure"], ["trade-off", "tradeoff"]]
model_answer = '''Context: each request waits on 3 external APIs and PostgreSQL, and the team is new to async. Decision: use async def with httpx.AsyncClient and an async driver (asyncpg/SQLAlchemy async) to call the 3 APIs concurrently, because I/O wait dominates the time. Conditions: no blocking library anywhere in the request path; where a synchronous library is unavoidable, keep that endpoint as def (FastAPI runs it in a threadpool) or use to_thread. Trade-off: async gives higher throughput but is harder to debug and needs team training, plus a lint rule that blocks blocking calls. Validation: run a load test comparing p95 and throughput of both options on a sample endpoint before applying it to the whole service; revisit after 3 months.'''
explanation = '''A good answer states the context, the chosen option, the conditions under which it holds (no blocking calls, async driver), the trade-off in team skills, and how you will measure to validate it.'''

[questions.python-backend-lv011]
prompt = '''The JWT signing secret (HS256) is suspected to have leaked. Plan a key rotation that does not force every user to log in again at the same time, while limiting the damage.'''
keywords = [["kid"], ["in parallel", "two keys", "both keys", "side by side"], ["exp", "expir"], ["revoke", "revocation"], ["monitor", "metric"]]
model_answer = '''Create a new key and put a kid in the token header so you know which key signed each token. During the transition, run two keys in parallel: sign new tokens with the new key, and keep verifying old tokens until their exp (shorten the access token lifetime, e.g. 15 minutes). If evidence shows the key has been misused, revoke the old key and the related refresh tokens immediately, accepting forced re-login. Monitor metrics for the number of tokens signed with the old key and unusual verification failures; when it drops to 0, remove the old key. After the incident: move the secret into a secret manager and schedule periodic key rotation.'''
explanation = '''Key points: key identification (kid), a parallel period bounded by exp, a revocation decision based on how badly the key leaked, and monitoring to know when to remove the old key.'''

[questions.python-backend-lv012]
prompt = '''A public API runs 6 instances behind a load balancer (round-robin). You need a limit of 100 requests/minute per API key, with an error of a few percent being acceptable. Choose the implementation.'''
options = ["Each process keeps an in-memory counter dict, limited to 100/minute", "Each process limits to 100/6 ≈ 17 requests/minute", "Centralized counting: a token bucket in shared Redis (or limiting at the API gateway)", "Log every request in PostgreSQL and `COUNT(*)` before each request"]
explanation = '''The counter must be shared across all instances/workers. An in-process dict allows up to 6 × number of workers times the limit; splitting evenly at 17/minute is wrong when the LB is uneven or the instance count changes; COUNT(*) on PostgreSQL per request puts heavy load on the primary DB.'''

[questions.python-backend-lv013]
prompt = '''Which practices are anti-patterns once a Python backend codebase grows to 10+ people?'''
options = ["Business logic written directly in route handlers, calling the DB right there", "Module-level globals used as a cache/state shared between requests", "Every module reads environment variables its own way", "Using Pydantic schemas to validate data at the boundary (request/response)", "Injecting the DB session through a dependency so it can be replaced with a fake in tests"]
explanation = '''Logic in handlers cannot be reused from workers/CLI and is hard to test; global state differs between worker processes; scattered configuration is hard to control. Validating at the boundary and injecting dependencies are good practices.'''

[questions.python-backend-lv014]
prompt = '''10 minutes after a deploy, p99 latency is up 5×, CPU is low, and the logs report `QueuePool limit ... timed out`. The previous deploy ran fine for 2 weeks. As incident coordinator, what is the first step?'''
options = ["Roll back to the previous version to restore service, then investigate the cause on staging/logs", "Raise `pool_size` to 500 right away in production", "Restart the database", "Attach a debugger to the production process to see which request holds connections"]
explanation = '''The most recent change coincides with the incident and a stable previous version exists → restore first, investigate later. Increasing the pool may exceed the DB's `max_connections` and bring the DB down; restarting the DB affects every service; debugging in production prolongs the incident.'''

[questions.python-backend-lv015]
prompt = '''A FastAPI backend serves 3 client teams (web, iOS, Android). API changes often break mobile apps already released. Which systemic measure is most effective?'''
options = ["Send a new Postman collection whenever the API changes", "Generate OpenAPI from FastAPI, diff the schema against the previous version in CI to block breaking changes, generate clients from the schema, and version when a break is unavoidable", "Write wiki docs and remind everyone to read them", "Forbid API changes"]
explanation = '''A machine-readable contract plus automated checks in CI catch problems before merge; old mobile apps stay in use for a long time, so versioning is needed. Manual docs go stale quickly; forbidding changes stalls the product.'''

[questions.python-backend-lv016]
prompt = '''Fill in the terms:

- The zero-downtime DB migration pattern has three phases: `{{blank}}` → migrate → contract.
- Enabling a new feature for 5% → 25% → 100% of users without redeploying, thanks to a feature `{{blank}}`.
'''
explanation = '''Expand/contract keeps backward compatibility during rolling deploys; feature flags separate deploying from releasing and allow a quick switch-off during incidents.'''

[questions.python-backend-lv017]
prompt = '''A SaaS has 200 small tenants and 2 large tenants that account for 60% of the load; the infrastructure team is 2 people. Which data design is reasonable?'''
options = ["A separate database per tenant from day one", "A shared schema with a `tenant_id` column (indexed, mandatory filtering via a dependency), ready to move the 2 large tenants to their own DB/pool when needed", "Shared tables without a tenant column, distinguishing tenants by subdomain at the application layer", "A separate service per tenant"]
explanation = '''A shared schema minimizes operating cost for the many small tenants; centralized `tenant_id` filtering via a dependency reduces the risk of cross-tenant data leaks; isolating the large tenants solves the noisy-neighbor problem. 200 separate databases are too heavy for a 2-person team; without a tenant column data cannot be isolated.'''

[questions.python-backend-lv018]
prompt = '''This is the third PR this month that calls `requests.get(...)` inside `async def`, blocking the event loop. What is the most sustainable fix?'''
options = ["The lead fixes those PRs personally to save time", "Ban `async def` across the codebase", "Explain the cause in the review, enable a lint rule that detects blocking calls in async code (e.g. Ruff's ASYNC rules) in CI, and add a guideline with replacement examples (httpx.AsyncClient)", "Mention it in the team meeting"]
explanation = '''Turning the lesson into an automated check stops the bug before it reaches review, while the explanation and guideline help newcomers understand why. Fixing it yourself does not transfer knowledge; banning async throws away legitimate benefits; verbal reminders are easily forgotten.'''

[questions.python-backend-lv019]
prompt = '''The team proposes moving a running service from synchronous SQLAlchemy to SQLAlchemy async + asyncpg. Which risks should be assessed before you agree?'''
options = ["Relationship lazy loading no longer happens implicitly; accessing an attribute may fail if it was not loaded", "Session/transaction lifecycles must be reviewed for every request", "The test suite and fixtures must run with an event loop", "Performance will certainly improve many times over, so there is no need to measure", "There is no need to review the connection pool configuration"]
explanation = '''Moving to async changes how relationships load, how sessions are managed and how tests are written. Performance gains depend on the workload and must be measured; the number of concurrent connections usually changes, so the pool needs reviewing.'''

[questions.python-backend-lvc04]
title = "Percentage rollout"
prompt = '''You are standardizing how the team rolls out features. Write in_rollout(flag, user_id, percent) that returns True if the user is in the group for which the feature is enabled.

Requirements:
- percent is an integer 0..100; out of range (or not an int) raises ValueError.
- The result is **stable** across processes and restarts: use hashlib (e.g. sha256 of "flag:user_id"), not hash(), which has a random salt.
- **Monotonic**: a user in the 10% group stays in the group when it grows to 30%.
- Each flag buckets users independently (the same user can be in one flag but not another).
- 0% enables nobody, 100% enables everybody.'''
explanation = '''A fixed bucket per (flag, user) pair makes rollouts stable and monotonic; including the flag in the hashed string keeps experiments from always hitting the same group of users.'''
hints = ['Hash the string f"{flag}:{user_id}" with hashlib.sha256 and take part of the hexdigest as an integer.', "Map that number to a bucket 0..99 with % 100; the user is enabled when bucket < percent — this condition is naturally monotonic."]

[questions.python-backend-lv020]
prompt = '''One of three coroutines raises `TimeoutError` after 1 second; the other two run for 10 seconds. How do the following two approaches behave differently?

```python
# A
await asyncio.gather(a(), b(), c())

# B
async with asyncio.TaskGroup() as tg:
    tg.create_task(a()); tg.create_task(b()); tg.create_task(c())
```
'''
options = ["Exactly the same: both cancel the remaining tasks", "A raises immediately but the other two tasks keep running in the background; B cancels the remaining tasks and then raises an `ExceptionGroup`", "A waits the full 10 seconds before raising; B raises right after 1 second", "B ignores the error, A raises it"]
explanation = '''`gather` (with the default `return_exceptions=False`) propagates the first error but does not cancel the other awaitables; `TaskGroup` (3.11+) cancels sibling tasks and collects errors into an `ExceptionGroup`, preventing orphaned tasks from continuing to use resources.'''

[questions.python-backend-lv021]
prompt = '''An `async def` endpoint must compute a perceptual hash of an uploaded image (pure Python, ~800 ms of CPU). Which approach does not block the event loop and actually uses multiple cores on CPython with the GIL?'''
options = ["Call the function directly inside `async def`", "`await asyncio.to_thread(compute, data)`", "`await loop.run_in_executor(process_pool, compute, data)` with a pre-created `ProcessPoolExecutor` (or push it to a worker queue)", "Add `await asyncio.sleep(0)` between computation steps"]
explanation = '''A process pool runs CPU-bound code in another process, unconstrained by the GIL and without blocking the loop. `to_thread` frees the loop, but pure Python code still competes with the loop for the GIL; `sleep(0)` only splits up the blocking time without reducing total CPU.'''

[questions.python-backend-lv022]
prompt = '''Choose the correct statements about the GIL in CPython.'''
options = ["Threads are still useful for I/O-bound work because the GIL is released while waiting on I/O", "Pure Python CPU-bound code running on many threads is not significantly faster on a CPython build with the GIL", "C libraries (e.g. numpy, hashlib on large data) can release the GIL while computing", "Since Python 3.13 there is an optional free-threaded build that can disable the GIL", "Because of the GIL, multithreaded code never has race conditions"]
explanation = '''The GIL only protects the interpreter's internal state; it does not make your multi-step operations (read–modify–write) atomic, so you still need a `Lock` for shared data.'''

[questions.python-backend-lv023]
prompt = '''You want every log line in an async FastAPI service to automatically include the current request's `request_id`. Where should `request_id` be stored?'''
options = ["A module-level global", "`threading.local()`", "A `contextvars.ContextVar` set in middleware", "An attribute of `app`"]
