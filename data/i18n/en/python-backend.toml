[questions.python-backend-lv034]
prompt = '''Product configuration data is read very often and changes a few times a day; the service runs 8 workers on 3 instances. Compare an in-process cache (`functools.lru_cache`/dict) with Redis and state your choice.'''
keywords = [["process", "worker"], ["invalidat"], ["ttl", "expir"], ["network", "latency"], ["consisten"]]
model_answer = '''An in-process cache is fastest (no network hop), but every worker keeps its own copy: 8 workers × 3 instances is 24 copies, invalidation when the data changes is very hard, data is less consistent between requests, and RAM usage multiplies. lru_cache also has no TTL. Redis is shared, so you invalidate in one place and get better consistency, but it adds network latency and one more dependency to operate. For data that changes a few times a day you can combine them: an in-process cache with a short TTL (e.g. 30–60 seconds) in front of Redis or the DB, accepting stale data within the TTL window; if changes must take effect immediately, publish an invalidation event.'''
explanation = '''The answer should mention the number of cache copies per worker/process, the invalidation and TTL problem, the network latency cost of Redis, and the acceptable level of consistency.'''

