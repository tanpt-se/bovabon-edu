[modules.py-flask]
lesson = '''### Key concepts
- `@app.route("/users/<int:user_id>", methods=["GET", "POST"])` — converters include `int`, `float`, `path` and `uuid`.
- **Request context**: `request` and `session` are available only while a request is being handled.
- **Application context**: `current_app` and `g` (temporary request-scoped storage, e.g. a database connection). Outside a request (CLI, tests), use `with app.app_context():`.
- By default, `session` is a **signed cookie** (requires `SECRET_KEY`): users can read its contents but cannot modify them.
- **Blueprints** split an app into modules; an **application factory**, `create_app(config)`, helps with testing and multiple configurations.
- Returning a dict lets Flask convert it to JSON. Use `abort(404)` and `@app.errorhandler(404)` for error handling.
- Hooks include `before_request`, `after_request` and `teardown_appcontext`.
- Testing: `app.test_client()`.
- Production: run behind a WSGI server (such as gunicorn or waitress); do not use `app.run()`.
'''

[questions.py-001]
prompt = '''Which Flask route matches the URL `/users/42` and passes `42` to the function as an **int**?'''
explanation = '''Flask uses the `<converter:name>` syntax. `{name}` is FastAPI syntax.'''

[questions.py-002]
prompt = '''What is `flask.g` used for?'''
options = ["Store permanent global data across requests", "Store temporary data in the **application context for a single request** (e.g. a database connection or the current user)", "Store session cookies", "Configure the application"]
explanation = '''A new `g` is created for each request; clean up resources in `teardown_appcontext`.'''

[questions.py-003]
prompt = '''Calling `current_app.config` in a CLI script (outside a request) raises "Working outside of application context". How should you fix it?'''
options = ["Use a global variable", "Wrap it in `with app.app_context():`", "Call `app.run()` first", "Import Flask again"]
explanation = '''The context is pushed automatically while handling a request; outside a request, you must push it yourself.'''

[questions.py-004]
prompt = '''Where is data in `flask.session` stored by default?'''
options = ["In the server's RAM", "In a client-side cookie **signed** with `SECRET_KEY` (readable but not modifiable)", "In a database", "In localStorage"]
explanation = '''Do not put secrets in the default session. For server-side sessions, use an extension such as Flask-Session with Redis.'''

[questions.py-005]
prompt = '''What are the benefits of an **application factory**, `create_app()`?'''
options = ["Create multiple app instances with different configurations (test, dev, prod)", "Avoid circular imports when registering blueprints or extensions", "Double request-processing speed", "Make it easier to test with a dedicated configuration", "Eliminate the need for `SECRET_KEY`"]
explanation = '''Initialize extensions inside the factory, for example with `db.init_app(app)`.'''

[questions.py-006]
prompt = '''Complete the route that accepts JSON and returns status 201:

```python
@app.post("/todos")
def create_todo():
    data = request.{{blank}}()
    todo = {"id": 1, "title": data["title"]}
    return todo, {{blank}}
```
'''
explanation = '''Return `(body, status)`; Flask automatically converts a dict to JSON.'''

[questions.py-007]
title = "Flask-style route matcher"
prompt = '''Write `match_route(rule, path)` to simulate how Flask matches URLs:

- `rule` contains static segments and variables in the form `<name>` or `<converter:name>`. Support the `string` converter (the default; cannot contain `/`), `int` (digits), and `path` (may contain `/`, only at the end).
- On a match, return a `dict` of variables, converting `int` values to `int`; otherwise return `None`.
- Match the entire path, with no extra or missing characters.

```python
match_route("/users/<int:id>", "/users/42")  # {"id": 42}
match_route("/files/<path:p>", "/files/a/b.txt")  # {"p": "a/b.txt"}
```
'''
hints = ["Convert the rule to a regex with named groups such as `(?P<name>...)`, then use `re.fullmatch`.", "Remember to use `re.escape` for static text (for example, the `.` in `/a.b`)."]
explanation = '''Werkzeug, the foundation Flask uses, compiles rules into similar regular expressions and caches them.'''

[modules.py-fastapi]
lesson = '''### Key concepts
- FastAPI is built on **Starlette** (ASGI), **Pydantic** (data validation) and **type hints**.
- Function parameters: names in the path are **path parameters**; simple types (`int`, `str`) not in the path are **query parameters**; a Pydantic model is a **request body**.
- Invalid data types automatically produce **422 Unprocessable Entity** with details.
- `response_model=UserOut` filters response fields (for example, so `password` is not exposed).
- `Depends(get_db)` provides **dependency injection** for reusable logic such as database sessions, authentication and pagination; a dependency with `yield` can clean up resources.
- Raise `HTTPException(status_code=404, detail="...")` to return an error.
- OpenAPI documentation is generated at `/docs` (Swagger UI) and `/redoc`.
- `BackgroundTasks` is for lightweight work after the response; use a queue (Celery, RQ, Arq) for heavy jobs.
- Testing: `TestClient(app)` (built on httpx).
'''

[questions.py-020]
prompt = '''For the endpoint below, where does `skip` come from?

```python
@app.get("/items/{item_id}")
async def read(item_id: int, skip: int = 0, item: Item | None = None): ...
```
'''
explanation = '''`item_id` is in the path, so it is a path parameter; `skip` is a simple type, so it is a query parameter; `item` is a Pydantic model, so it comes from the body.'''

[questions.py-021]
prompt = '''Send `GET /items/abc` to an endpoint with `item_id: int`. What status does FastAPI return?'''
explanation = '''Invalid input during validation produces **422 Unprocessable Entity**, with JSON describing the field error.'''

[questions.py-022]
prompt = '''What does `response_model=UserOut` do in `@app.post('/users', response_model=UserOut)`?'''
options = ["Validate the request body", "Convert and **filter** the response data according to `UserOut` (e.g. remove the `password` field) and describe the schema in OpenAPI", "Speed up serialization", "Require the client to send a header"]
explanation = '''A common pattern is to use `UserIn` (with a password) for input and `UserOut` (without a password) for output.'''

[questions.py-023]
prompt = '''A dependency written as a generator with `yield` (e.g. `get_db`) is used to:'''
options = ["Return multiple values", "Provide a resource to an endpoint and **clean it up after the request finishes** (close a database session); code after `yield` runs after the response", "Run tasks in parallel", "Cache results forever"]
explanation = '''This is similar to a context manager. By default, the same dependency is cached and called once within a request.'''

[questions.py-024]
prompt = '''Which statements about FastAPI are correct?'''
options = ["Automatically generates OpenAPI/Swagger documentation at `/docs`", "Built on Starlette (ASGI) and Pydantic", "Supports only `async def` endpoints", "Use `raise HTTPException(status_code=404, detail=...)` to return an error", "`BackgroundTasks` is suitable for jobs that run for hours"]
explanation = '''A regular `def` endpoint typically runs in a thread pool. Heavy jobs should use a separate task queue.'''

[questions.py-025]
prompt = '''Inject an authentication dependency into the endpoint:

```python
@app.get("/me")
async def me(user: User = {{blank}}(get_current_user)):
    return user
```
'''
explanation = '''Dependencies can be nested: `get_current_user` may itself depend on `oauth2_scheme`.'''

[questions.py-026]
prompt = '''Declare a Pydantic model for a request body:

```python
from pydantic import {{blank}}

class Item({{blank}}):
    name: str
    price: float
    tags: list[str] = []
```
'''
explanation = '''Pydantic v2 uses `model_dump()` and `model_validate()` in place of `.dict()` and `parse_obj`.'''

[questions.py-027]
title = "Pydantic-style data validation"
prompt = '''Without using a library, write `validate(schema, data)` that returns `(clean, errors)`:

- `schema` is a dict mapping `field` to `(type, required, default)`; `type` is `int`, `float`, `str` or `bool`.
- A missing required field produces `{"loc": field, "msg": "field required"}`.
- A missing optional field uses `default`.
- Coerce types in a "lax" manner like Pydantic: `"42"` → `int` 42, `"3.5"` → float; `int` accepts an integer or a numeric string; `bool` accepts `True`/`False` or the strings `"true"`/`"false"`. If coercion fails, produce `{"loc": field, "msg": "invalid <type name>"}` (e.g. `invalid int`).
- Ignore fields in `data` that are not in the schema.
- If there are errors, `clean` is `None`; `errors` is a list in schema field order.
'''
hints = ["Extract a helper `_coerce(tp, value)` that raises `ValueError` when coercion fails.", "Be careful: `bool` is a subclass of `int` in Python."]
explanation = '''Pydantic v2 does this much faster with its Rust core, and FastAPI turns `errors` into a 422 response.'''

[questions.py-028]
prompt = '''Simulate FastAPI's `Depends` system:

- A `Depends(dependency)` class stores a dependency function.
- `solve(func, overrides=None)` calls `func`; for each parameter whose default is `Depends(dep)`:
  - resolve `dep` **recursively** (it may also have dependencies declared with `Depends`);
  - if `dep` is in `overrides` (a dict), use the replacement function (like `app.dependency_overrides` in tests);
  - **cache within one call to `solve`**: call each dependency only once.
- Parameters that are not `Depends` use their ordinary default values.
- Return the result of `func`.

Hint: `inspect.signature(func).parameters`.
'''
hints = ["Iterate over `inspect.signature(func).parameters.items()` and check `isinstance(p.default, Depends)`.", "Pass the same cache dict through recursive calls."]
explanation = '''This is how FastAPI builds a dependency graph for each request; `app.dependency_overrides` is especially useful in tests.'''

[modules.py-async]
title = "Async Python & Performance"
description = "async/await, event loop, def vs async def in FastAPI, asyncio.gather, Semaphore, WSGI vs ASGI."
lesson = '''### Key concepts
- **WSGI** (classic Flask and Django): synchronous, with one worker or thread per request. **ASGI** (FastAPI, Starlette): asynchronous and supports WebSockets.
- An `async def` endpoint runs **on the event loop** — never call blocking I/O (`requests`, `time.sleep`, a synchronous database driver) there.
- A regular `def` endpoint typically runs in FastAPI's **thread pool**, so it can use blocking libraries.
- `await asyncio.gather(*coros)` runs coroutines concurrently; `asyncio.Semaphore(n)` limits the number of simultaneous tasks; `asyncio.wait_for(coro, timeout)` sets a timeout.
- For CPU-bound work (image processing, ML), use a process pool or separate worker because of the **GIL** (except in free-threaded Python 3.13+ builds).
- Use multiple Uvicorn/Gunicorn worker processes to use multiple CPUs.
'''

[questions.py-040]
prompt = '''In FastAPI, what happens if you call `time.sleep(5)` inside an `async def` endpoint?'''
options = ["Only that request waits for 5 seconds", "It **blocks the event loop** — every other request on that worker is also stalled for 5 seconds", "FastAPI automatically moves it to a thread", "A syntax error"]
explanation = '''Use `await asyncio.sleep(5)`, or declare the endpoint as `def` so it runs in the thread pool.'''

[questions.py-041]
prompt = '''What is the main difference between WSGI and ASGI?'''
options = ["ASGI is only for Django", "WSGI is synchronous (one request per worker); ASGI supports asynchronous code, WebSockets and long-lived connections", "WSGI is faster in every case", "There is no difference"]
explanation = '''Flask uses WSGI (it supports `async def` views, but each request still occupies a worker). FastAPI uses ASGI.'''

[questions.py-042]
prompt = '''Call three APIs concurrently and wait for all of them:

```python
users, posts, tags = await asyncio.{{blank}}(fetch_users(), fetch_posts(), fetch_tags())
```
'''
explanation = '''Python 3.11+ also provides `asyncio.TaskGroup`, which cancels the remaining tasks if one task fails.'''

[questions.py-043]
title = "Concurrency-limited gather"
prompt = '''Write `async def gather_limited(funcs, limit)`:
- `funcs` is a list of zero-argument functions that return coroutines (e.g. `lambda: fetch(i)`).
- Run them concurrently, but run **at most `limit`** coroutines at a time (use `asyncio.Semaphore`).
- Return a list of results in the **same order** as the input.
- If an error occurs, raise it (like `asyncio.gather` by default).
'''
hints = ["Wrap each coroutine in `async with sem:`.", "`asyncio.gather` keeps results in input order."]
explanation = '''Limiting concurrency helps avoid overloading external APIs or a database connection pool.'''

[questions.py-044]
prompt = '''When should a FastAPI endpoint be declared as `async def`, and when should it be `def`?'''
keywords = [["await", "async library"], ["blocking", "synchronous", "requests", "time.sleep"], ["threadpool", "thread pool"], ["event loop"]]
model_answer = '''Use **`async def`** when the endpoint calls only libraries that support async and awaits them, such as httpx.AsyncClient or asyncpg. Requests share the **event loop**, which can serve many I/O-bound connections. Use **`def`** when you need a **blocking** or synchronous library, such as requests or a synchronous database driver: FastAPI runs a `def` function in a **threadpool** so it does not block the event loop. Never call blocking code inside `async def`. Move CPU-heavy work to a separate process or worker.'''
explanation = '''If you are unsure, `def` is the safer choice.'''

[modules.py-security]
title = "API Authentication & Security"
description = "Password hashing, JWT, OAuth2 password flow, CORS, rate limiting, secrets."
lesson = '''### Key concepts
- Passwords: use **slow, salted hashes** (`bcrypt`, `argon2`) — never MD5/SHA1 or plaintext storage.
- **JWT** = `base64url(header).base64url(payload).signature`. The payload is **not encrypted**, only **signed** (HMAC/RSA), so do not put sensitive data in it. Check `exp`, the algorithm and the signature.
- Compare signatures and tokens with `hmac.compare_digest` to prevent timing attacks.
- FastAPI: `OAuth2PasswordBearer(tokenUrl="token")` + `Depends(get_current_user)`.
- **CORS**: configure `CORSMiddleware(allow_origins=[...])` — do not use `*` when `allow_credentials=True`.
- Read secrets from environment variables; do not commit them to git.
'''

[questions.py-060]
prompt = '''Which statement about JWT (JWS, HS256) is correct?'''
options = ["The payload is encrypted, so it is safe to store passwords in it", "The payload is only base64url-encoded and **signed**; anyone can read it, but it cannot be modified without the secret", "A JWT cannot expire", "The server must store every JWT in a database to validate it"]
explanation = '''Use JWE to encrypt content. Always check `exp` and pin the algorithm to prevent attacks such as `alg: none`.'''

[questions.py-061]
prompt = '''What is the correct way to store a user's password?'''
options = ["Plaintext", "`hashlib.md5(password)`", "A slow salted hash such as **bcrypt/argon2** (passlib, pwdlib)", "Encrypt with AES and store the key beside the database"]
explanation = '''Fast hashes (plain MD5 or SHA-256) are easy to brute-force with a GPU.'''

[questions.py-062]
prompt = '''Which CORS configurations are **unsafe or invalid**?'''
options = ["`allow_origins=[\"https://app.bovabon.edu\"]`", "`allow_origins=[\"*\"]` together with `allow_credentials=True`", "Reflect any supplied `Origin` into `Access-Control-Allow-Origin` while allowing credentials", "Allow only the methods that are needed"]
explanation = '''Browsers reject `*` when credentials are included. Reflecting arbitrary origins lets any website read the user's data.'''

[questions.py-063]
prompt = '''Compare signatures safely against timing attacks:

```python
import hmac
if not hmac.{{blank}}(expected_sig, given_sig):
    raise HTTPException(status_code={{blank}})
```
'''
explanation = '''A comparison using `==` stops at the first differing byte, which can leak information through response timing.'''

[questions.py-064]
title = "Signing and verifying JWT HS256"
prompt = '''Using only the standard library (`hmac`, `hashlib`, `base64`, `json`), write:

- `b64url(data: bytes) -> str` — base64url-encode and **remove `=` padding**.
- `sign(payload: dict, secret: str) -> str` — use the header `{"alg":"HS256","typ":"JWT"}`, compact JSON (`separators=(",", ":")`), and an HMAC-SHA256 signature over `"<header>.<payload>"`.
- `verify(token: str, secret: str, now: int) -> dict` — return the payload if valid; otherwise raise `ValueError` with the message:
  - `"malformed"` if there are not exactly three parts;
  - `"bad algorithm"` if the header's `alg` is not `HS256`;
  - `"bad signature"` if the signature is incorrect (use `hmac.compare_digest`);
  - `"expired"` if `exp` exists and `now >= exp`.
'''
hints = ["When decoding, restore padding with `s + '=' * (-len(s) % 4)`.", "Check the algorithm **before** verifying the signature."]
explanation = '''In production, use PyJWT or python-jose; implementing this yourself helps explain why the algorithm must be pinned and comparisons must take constant time.'''

[modules.python-backend-dv-flask-structure]
title = "Flask: Application Structure & Testing"
description = "Blueprints, application factories, environment-specific configuration and the test client."
lesson = '''### Organizing a Flask application by responsibility

As an application grows, putting every route in one file makes imports, configuration and testing harder to manage. A **Blueprint** groups routes and hooks for a functional area; it is not a standalone app and only works after registration with a Flask application. When registering it, you can add a **url_prefix** to create a clear URL namespace.

| Component | Role | Example |
|---|---|---|
| Application factory | Creates an app and applies configuration on each call | `create_app(test_config)` |
| Blueprint | Groups routes by function | `users`, `admin` |
| Test client | Sends simulated requests through the app | `client.get("/health")` |
| `TESTING` config | Enables behavior suited to tests | `app.config.update(TESTING=True)` |

Example structure:

~~~python
from flask import Blueprint, Flask

api = Blueprint("api", __name__)

@api.get("/health")
def health():
    return {"ok": True}

def create_app(config=None):
    app = Flask(__name__)
    app.config.from_mapping(SECRET_KEY="replace-in-deployment")
    if config:
        app.config.update(config)
    app.register_blueprint(api, url_prefix="/api")
    return app
~~~

In a test, call the factory with a dedicated configuration, then use `app.test_client()` to exercise Flask routing and middleware without opening a network port. Each test can create a fresh app to prevent configuration or global state from leaking into other tests. Check status, headers and JSON responses; use `session_transaction()` when you need to prepare a session.

Common mistakes include importing route modules before the factory is configured and creating a global app, which makes tests harder to isolate; forgetting to register a Blueprint, causing its routes to return 404; and using `app.run()` as a production server. A factory creates apps consistently, while production needs a separately configured WSGI server. Do not put real secrets in source code or test configuration.
'''

[questions.python-backend-dv001]
prompt = '''What is the best description of a Flask Blueprint?'''
options = ["An independent Flask app that listens on its own port", "A group of routes and hooks that can be registered with an app", "A shared database connection", "A simulated HTTP test client"]
explanation = '''A Blueprint organizes functionality into modules, but must be registered with a Flask application before its routes work.'''

[questions.python-backend-dv002]
prompt = '''Why is an application factory useful when testing the same application with different configurations?'''
options = ["Each call can create a new app with its own configuration", "The factory creates a production database automatically", "The factory skips all middleware", "The factory turns Flask into ASGI"]
explanation = '''A factory can create independent apps, for example with `TESTING` enabled or a dummy secret, without changing another app configuration.'''

[questions.python-backend-dv003]
prompt = '''When is the Flask test client a good fit?'''
options = ["Sending requests through the app in a test without starting a network server", "Measuring latency from a real browser over the Internet", "Starting Gunicorn in production", "Creating a database migration"]
explanation = '''The test client calls the application in the test process, which is useful for checking routes and responses without binding a port.'''

[questions.python-backend-dv004]
prompt = '''How do you register a Blueprint named `api` with the `/v1` prefix?'''
options = ['app.register_blueprint(api, url_prefix="/v1")', 'api.run(prefix="/v1")', 'app.config["BLUEPRINT"] = api', 'Blueprint("/v1", app)']
explanation = '''The prefix is applied when the Blueprint is registered with the app.'''

[questions.python-backend-dv005]
prompt = '''What are common benefits of splitting a Flask application with Blueprints?'''
options = ["Group routes by functional domain", "Add a prefix when registering", "Make the Blueprint an independent process", "Register the same Blueprint with multiple suitable apps"]
explanation = '''Blueprints help organize and reuse route configuration; they are not separate processes or servers.'''

[questions.python-backend-dv006]
prompt = '''A test needs to check the `/api/health` endpoint and a session. Choose appropriate practices.'''
options = ["Create the app with a factory and `TESTING=True`", "Use `app.test_client()` to send the request", "Use `session_transaction()` if a session needs to be prepared", "Run `app.run()` on a public port in every test"]
explanation = '''A factory and test client keep tests lightweight and isolated; `session_transaction` helps set up a session for a test.'''

[questions.python-backend-dv007]
prompt = '''Complete the Blueprint registration:

~~~python
app.{{blank}}(api, url_prefix="/v1")
~~~
'''
explanation = '''Attach a Blueprint to a Flask app with `register_blueprint`.'''

[questions.python-backend-dv008]
prompt = '''In a Flask codebase with multiple functional areas, explain how an application factory, Blueprints and the test client work together to keep the application extensible and testable.'''
keywords = [["application factory", "create_app"], ["blueprint"], ["test client", "testing"], ["isolated configuration", "test configuration"]]
model_answer = '''An application factory creates an app and accepts a test configuration, so each test can run with isolated state. A Blueprint groups routes by function and is registered in the factory, often with a `url_prefix`. The test client sends requests through the app to verify status and responses without starting a network server.'''
explanation = '''A good answer explains the distinct roles of the factory, Blueprint and test client, and how test configuration avoids affecting another app.'''

[questions.python-backend-dvc01]
title = "Combining configuration for an app factory"
