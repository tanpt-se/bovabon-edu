[modules.cefr-c1-grammar-plus]
title = "C1 · Advanced Grammar"
description = "Epistemic and attitudinal modals, alternative conditionals, fronting, and preposition-fronted relative clauses."
lesson = '''
### Modals for deduction and attitude
| Pattern | Common meaning | Example |
|---|---|---|
| **be bound to + V** | something is almost certain to happen | *With three teams involved, the launch is bound to take longer.* |
| **may well + V** | something is genuinely possible; a reasoned view, but not a certainty | *The new policy may well improve staff retention.* |
| **might as well + V** | choosing the most practical option when no better alternative remains | *The train is delayed, so we might as well get a coffee.* |

Do not treat *be bound to* as meaning “be required to” in *be bound by a contract*: when it is followed by a base verb, *is bound to happen* usually predicts something very likely. *Might as well* does not express a low probability; it often means “given the circumstances, this is the most practical choice.”

### Flexible and inverted conditionals
| Pattern | Use | Example |
|---|---|---|
| **but for + noun phrase** | names a factor that prevented a different outcome | *But for Maya's warning, we would have missed the deadline.* |
| **provided (that) + clause** | sets a clear condition, often in a rule or agreement | *You may quote the report provided that you name the source.* |
| **supposing (that) + clause** | introduces a hypothetical situation so its consequences can be considered | *Supposing the supplier says no, what is our next option?* |

Conditional inversion with *Had / Were / Should* was introduced in `gr-c1`; here, recognise that it can also express a formal hypothetical: *Had the team known about the delay, it would have changed the schedule.* Do not put *would* directly in the conditional clause. Remember the comma when the conditional clause comes first.

### Fronting and preposition-fronted relative clauses
Fronting moves information that needs emphasis to the beginning, often giving a report a more formal rhythm: *At the centre of the proposal is a six-month trial.* When a phrase of place comes first, the verb may precede the subject; inversion is not required after every fronted adverbial. A formal relative clause can keep its preposition before the pronoun: *the colleague to whom I sent the draft*; use *whom* for a person and *which* for a thing: *the framework on which the decision depends*. In conversation, the preposition often comes at the end: *the colleague I sent the draft to*. Do not add another object pronoun (*to whom I sent it to*). A useful check is to choose a structure that fits the level of formality, verify the verb's preposition, then reread the sentence to make sure it is still clear.

**Common errors for Vietnamese learners:** translating *bound* as “required” in every context; using *will* after *provided that* for a future condition; confusing *might as well* with *may well*; writing *to who* in a formal relative clause; or inverting every sentence after a fronted adverbial. Learn each phrase as a unit and check the meaning before choosing a form.
'''

[questions.cefr-c1-001]
explanation = "*Be bound to + base verb* predicts that something is very likely to happen. *Might as well* describes the most practical choice, not a degree of certainty."

[questions.cefr-c1-002]
explanation = "*May well* expresses a substantial possibility while leaving the conclusion open. *Is bound to* is stronger and does not agree with the plural subject *they*."

[questions.cefr-c1-003]
explanation = "With no better option available, *might as well* expresses the practical decision. *May well* is more about predicting a possibility."

[questions.cefr-c1-004]
explanation = "Use the present simple after *provided that* for a future condition; the conditional clause does not need *will*."

[questions.cefr-c1-005]
explanation = "In a formal relative clause, the preposition can come before *whom* when referring to a person: *the consultant to whom we sent…*."

[questions.cefr-c1-006]
explanation = "The correct sentences front an important phrase; after a phrase of place, the verb can precede the subject. Sentence 4 has an incorrectly placed subject and unnatural word order."

[questions.cefr-c1-007]
explanation = "Use *to which*, *with whom*, and *on which* with the prepositions required by *refer to, discuss with,* and *depend on*. The preposition with *rely* is *on*, not *in*."

[questions.cefr-c1-008]
explanation = "*But for + noun phrase* means “if it were not for”; the rest of the sentence usually gives a hypothetical result."

[questions.cefr-c1-009]
explanation = "*Provided (that)* sets a condition. *That* can be omitted without changing the meaning."

[questions.cefr-c1-010]
explanation = "The sample answer gives a clear condition, a measured prediction, and a practical alternative suited to a workplace situation."

[modules.cefr-c1-vocab]
title = "C1 · Academic and Professional Vocabulary"
description = "Academic vocabulary in context, the nuance of argumentative verbs, collocations, and common metaphors and idioms."
lesson = '''
### Academic vocabulary through word families and context
The Academic Word List (AWL) contains words commonly found in academic texts across many disciplines; it is not a collection of “advanced” words to memorise in isolation. Learn words in sentences and notice their part of speech: *assess* → *assessment*; *analyse* → *analysis*; *establish*; *indicate*; *interpret*; *relevant*; *require*. A familiar word can have a specialised meaning: *significant* can mean “considerable” or “important”, but in statistics you should call a result *statistically significant* only when the statistical test supports that description.

### Claim, assert, and maintain
| Verb | Common nuance | Example |
|---|---|---|
| **claim** | reports something said to be true; the verb itself does not confirm the evidence | *The company claims that the update reduces energy use.* |
| **assert** | states something firmly and emphatically; often calls for evidence or a response | *The spokesperson asserted that no customer data had been lost.* |
| **maintain** | continues to defend a position, especially during a debate | *The authors maintain that longer trials are necessary.* |

These verbs differ in how a statement is presented; they do not form a fixed scale of certainty. Consider who is speaking, what evidence is offered, and whether the text is challenging the statement. Avoid *prove* when the data only suggest a possibility.

### Collocations and metaphors
Learn whole phrases: *conduct research*, *assess the impact*, *draw on evidence*, *address a concern*, *raise an issue*, *reach a consensus*, *meet a requirement*, *set priorities*, *deliver a presentation*. Do not translate word for word from Vietnamese: English normally uses *conduct research*, not *make research*, and *address a concern*, not *answer a concern*.

| Phrase | Meaning in context | Example |
|---|---|---|
| **shed light on** | help clarify | *The interviews shed light on why staff left.* |
| **the tip of the iceberg** | a small visible part of a larger problem | *The late invoices may be the tip of the iceberg.* |
| **move the goalposts** | change the criteria after someone has followed the earlier requirements | *The client moved the goalposts after approval.* |
| **be on the same page** | share an understanding or agree on a plan | *Let's confirm that we are on the same page.* |

Metaphors and idioms can sound natural in workplace conversations, but may be too informal for an essay or proposal. Learn each phrase with an example, check its register, and choose a direct expression if you are unsure of its nuance. Vietnamese learners often choose the wrong preposition, confuse parts of speech, or translate a metaphor literally; treat each collocation as a unit.
'''

[questions.cefr-c1-011]
explanation = "*Claim* reports something a party says is true, but does not itself confirm that it has been proven. *Prove* and *guarantee* make stronger assertions."

[questions.cefr-c1-012]
explanation = "*Maintain that* means to continue holding and defending a view, which fits a position being challenged."

[questions.cefr-c1-013]
explanation = "*Assert* means to state something firmly and formally. *Interpret* means explain meaning; *assess* means evaluate; and *conduct* needs a noun such as *research*."

[questions.cefr-c1-014]
explanation = "*Shed light on* means to help clarify an issue. The other choices refer to changing criteria, reaching agreement, and meeting a deadline."

[questions.cefr-c1-015]
explanation = "*Move the goalposts* means to change the criteria after the other party has tried to meet the earlier requirements."

[questions.cefr-c1-016]
explanation = "The natural phrases are *conduct research*, *draw on evidence*, and *address a concern*. Avoid direct translations such as *make research* or *answer a concern*."

[questions.cefr-c1-017]
explanation = "*Assess* means to evaluate something carefully. The related noun is *assessment*."

[questions.cefr-c1-018]
explanation = "*Draw on/upon evidence* means to use evidence as the basis for an analysis."

[questions.cefr-c1-019]
explanation = "The fixed phrase is *shed light on + an issue/question*."

[questions.cefr-c1-020]
explanation = "The sample uses *claim* to report a statement, *maintain* to describe a position that is being defended, and limits the strength of its wording to fit the evidence."

[modules.cefr-c1-functions]
title = "C1 · Argumentation and Workplace Interaction"
description = "Structured arguments, diplomatic disagreement, meeting facilitation, and constructive feedback."
lesson = '''
### Presenting a structured argument
An easy-to-follow argument usually includes a claim, a reason, evidence or an example, an acknowledgement of a limitation, and then a conclusion or recommendation. You could begin with *The main reason I support this option is…*, introduce evidence with *For example…*, and acknowledge a counterpoint with *Although the initial cost is higher…*. Then explain why the main argument still holds. Do not add connectors when the relationship between ideas is already clear; each sentence should have a purpose.

### Disagreeing politely and using tactful language
| Purpose | Natural phrase | Effect |
|---|---|---|
| acknowledge a view | *I see your point about the cost.* | shows that you have listened |
| express a reservation | *I'm not sure that the current figures support that conclusion.* | keeps the focus on evidence |
| invite reconsideration | *Could we also consider the effect on support staff?* | broadens the discussion without attacking anyone |
| qualify a view | *That may be true in the short term; however…* | acknowledges part of a point before adding a qualification |

Hedging should clarify the level of certainty, not make the message vague. Critique an argument or process rather than attributing a flaw to the speaker. If the goal is to solve a problem together, avoid translating “I disagree” word for word into a blunt opening.

### Facilitating meetings and giving constructive feedback
A facilitator states the goal, invites contributions, manages time, and ends with a decision, an owner, and a deadline. Useful phrases include *Shall we turn to the budget?*, *We haven't heard from Minh yet; would you like to add anything?*, and *Let me summarise the decision before we move on.* If the discussion goes off topic, restate the goal and note the item for later; do not interrupt to impose a conclusion.

Good feedback describes an observable action, its impact, and then a possible next step: *The report is clear, and adding a short summary of the risks would help the client make a decision.* Avoid broad judgements such as *Your work is careless*. When people disagree, restate the other person's concern, ask what evidence would persuade them, and suggest a way to check the issue together. A useful sequence is **listen → clarify → respond → agree next step**. Vietnamese learners often repeat *I think* in every sentence or ask questions that sound like challenges; choose one suitable opening and finish with a concrete suggestion.
'''

[questions.cefr-c1-021]
explanation = "This sequence helps the listener follow the main point, its basis, the limits of the evidence, and the proposed action."

[questions.cefr-c1-022]
explanation = "The correct sentence focuses on evidence, expresses a measured reservation, and proposes a specific check instead of making a personal attack."

[questions.cefr-c1-023]
explanation = "*Shall we turn to…?* introduces the next topic naturally and invites the group to take part."

[questions.cefr-c1-024]
explanation = "Useful feedback refers to a specific piece of work, describes its impact, and suggests an actionable next step."

[questions.cefr-c1-025]
explanation = "The correct sentences acknowledge the concern, then add another perspective or suggest checking it. Being polite does not mean agreeing with everything."

[questions.cefr-c1-026]
explanation = "Inviting someone who has not spoken, recording the decision clearly, and parking an off-topic item help the group participate and track follow-up work. Silence alone does not establish agreement."

[questions.cefr-c1-027]
explanation = "Both *However* and *That said* can introduce a contrasting point after acknowledging the previous view."

[questions.cefr-c1-028]
explanation = "The phrase *turn to + topic* is used to move to the next item in a meeting."

[questions.cefr-c1-029]
explanation = "*Support a recommendation with an example* is a way to suggest adding specific, practical evidence."

[questions.cefr-c1-030]
explanation = "The sample acknowledges the other person's view, gives a reasoned reservation, refers to a shared goal, and proposes a next step."

[modules.cefr-c1-reading-writing]
title = "C1 · Academic Reading and Writing"
description = "Reading implications and tone; structuring proposals, reports, and essays; summarising and synthesising multiple sources."
lesson = '''
### Reading what a text implies
When reading a longer text, separate **what is stated directly** from **what can reasonably be inferred**. Look for the claim, evidence, limitations, words that indicate degree, and links between paragraphs. *The pilot's results are encouraging, although the sample remains small* recognises a positive signal while limiting the strength of the conclusion. *Although* shows that the author does not want readers to treat the early results as decisive evidence. A sentence such as *The committee was thanked for its patience* after repeated delays may imply that the delays caused inconvenience, but use the context rather than inventing an emotion.

| Signal | Evidence-based reading |
|---|---|
| *may, appears, preliminary* | the conclusion is tentative |
| *however, despite this* | an important limitation or opposing point follows |
| *only, still, even* | something may be emphasised as unexpected |
| a strong judgement such as *unacceptable* | the writer is clearly critical |

Tone may be *measured*, *cautiously optimistic*, *critical*, or *skeptical*. A negative subject does not automatically make the tone angry. Support an inference by pointing to words and structure in the text.

### Structuring a proposal, report, and essay
| Text | Common structure | Main purpose |
|---|---|---|
| **Proposal** | problem → objective → option → resources/timeline → evaluation | persuade the reader to choose an action |
| **Report** | scope → findings → analysis → conclusion/recommendation | present findings that can be checked |
| **Academic essay** | claim → paragraphs with reasons/evidence → counterargument/limitation → conclusion | develop a coherent argument |

### Summarising and synthesising sources
A summary condenses the main ideas of one source in your own words, preserves its level of certainty, and adds no personal judgement. Synthesis brings sources together: where they reach the same conclusion, how they differ because of their samples, methods, or context, and what can be said when they are considered together. For example: *Lee's survey links flexible hours with retention, whereas Tran's interviews highlight the role of team support. Taken together, the studies suggest that flexibility may help, but it is not the only factor.* Attribute ideas to their sources, paraphrase accurately, and cite as required; do not disguise a near-copy by combining similar sentences. A useful sequence is **claim → evidence → limit → implication**. Vietnamese learners may translate word for word, list sources without connecting them, or use *therefore* when evidence only suggests a possibility; check how each paragraph is linked and how strongly it makes its claim.
'''

[questions.cefr-c1-031]
explanation = "*Encouraging* signals a positive assessment, while *although* and the small sample-size caveat make the conclusion cautious."

[questions.cefr-c1-032]
explanation = "The repeated postponements and thanks for patience suggest inconvenience, but they do not show who caused the delays or prove that the author is angry."

[questions.cefr-c1-033]
explanation = "A recommendation should connect findings to an action and explain its evidence and trade-offs so readers can make a decision."

[questions.cefr-c1-034]
explanation = "Synthesis connects sources, identifies their similarities and differences, and draws a conclusion that stays within the limits of the evidence."

[questions.cefr-c1-035]
explanation = "The first sentence records a positive response; the small number of departments and lack of long-term data limit the conclusion. The text neither establishes an organisation-wide impact nor calls the pilot a failure."

[questions.cefr-c1-036]
explanation = "*Whereas* places two contrasting findings alongside each other in one sentence."

[questions.cefr-c1-037]
explanation = "*Taken together* signals that the writer is drawing a conclusion from several sources considered as a whole."

[questions.cefr-c1-038]
explanation = "A proposal should state the resources and implementation schedule so readers can assess whether the plan is feasible."

[questions.cefr-c1-039]
explanation = "*Suggest* suits limited evidence; *prove* would make an excessive claim."

[questions.cefr-c1-040]
explanation = "The sample places the two sources side by side, synthesises their differences, and keeps its conclusion cautious."

[modules.cefr-c1-register]
title = "C1 · Register and Audience"
description = "Choosing a register, controlling nominalisation, calibrating certainty, using connectors, and writing clearly for the reader."
lesson = '''
### Choosing a register for the reader and purpose
Register is the level of formality and style of expression that suits the reader, relationship, and communication channel. An email to a client usually needs a clear, polite request and little slang; an internal message can be brief and friendly, and may use contractions if that is the team's convention. Formal does not mean long or full of rare words: *Could you confirm the revised date?* is usually better than a multi-layered, indirect sentence. Ask yourself what the reader needs to know, what they need to do, and whether they know the terminology.

### Nominalisation and clarity
`gr-c1` introduced forming nouns from verbs; here the focus is on choosing how much nominalisation to use for its effect. Nominalisation can package information in a report (*The review identified three risks* → *The review's identification of three risks…*), but long strings of nouns can hide who does what. In a status update, a sentence with a clear subject and verb is often easier to understand: *The new process should reduce delays* rather than *The implementation of the new process will result in the reduction of delays*. Use nominalisation when you want to make an event the topic or keep a report structure compact; use a verb when the actor and action need to be clear.

### Hedging, boosting, and connectors
Hedging and boosting were introduced in `gr-c1`; here, practise matching the strength of a claim to the evidence and the reader's needs. Preliminary data often calls for *suggests, may,* or *appears to*; repeated, consistent evidence may support *strongly indicates*. Avoid both unsupported certainty (*proves beyond doubt*) and layers of caution (*may perhaps possibly suggest*).

| Relationship | Connector | Example |
|---|---|---|
| adding information | **furthermore, in addition** | *The plan is affordable. Furthermore, it can start next month.* |
| contrast/concession | **however, nevertheless, by contrast** | *The sample is small. Nevertheless, the pattern is consistent.* |
| result | **therefore, consequently** | *Costs fell; consequently, the team extended the trial.* |
| example | **for instance** | *Several teams changed their process; for instance, the support group added a review step.* |

Do not stack connectors at the beginnings of sentences, and do not treat them as interchangeable: *therefore* signals a result, while *however* signals contrast. Reread to check the flow of ideas, active and passive voice, terminology, and consistent formality. Vietnamese learners may translate conversational phrases too literally, overuse connectors, or make formal writing difficult to read; write clearly first, then adjust the register only where the reader needs it.
'''

[questions.cefr-c1-041]
explanation = "The correct request states what is needed, gives a deadline and reason, and remains polite and clear. The other choices are too casual, blunt, or indirect."

[questions.cefr-c1-042]
explanation = "The first sentence is brief, friendly, and still appropriate for a workplace exchange. Good style does not require maximum formality."

[questions.cefr-c1-043]
explanation = "The active sentence with a specific verb communicates the same idea briefly and clearly; the other options are weighed down by strings of nominalisations."

[questions.cefr-c1-044]
explanation = "The second sentence gives a positive result despite the cost, so *Nevertheless* signals concession or contrast."

[questions.cefr-c1-045]
explanation = "*Strongly indicate* reflects consistent evidence without turning a research finding into an absolute claim."

[questions.cefr-c1-046]
explanation = "*Consequently* signals a result, *furthermore* adds information, and *nevertheless* signals something that happens despite a limitation. *For instance* should introduce an example, while *however* should mark a contrast."

[questions.cefr-c1-047]
explanation = "The two correct sentences communicate a status and a proposed action directly and professionally. Sentence 2 is weighed down by nominalisation; sentences 4–5 are too casual or blame-focused."

[questions.cefr-c1-048]
explanation = "Both *Nevertheless* and *Even so* introduce a positive outcome despite the tight deadline."

[questions.cefr-c1-049]
explanation = "*Resolve an issue* is suitable for report style and preserves the meaning of dealing with a problem."

[questions.cefr-c1-050]
explanation = "*Suggest a possible link* is appropriate for a small sample; *prove* would overstate the evidence."
