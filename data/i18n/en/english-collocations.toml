# English overlay for data/english-collocations.toml (text fields only)

# ─────────────────────────────────────────────────────────────
[modules.col-preferences-time]
title = "Wants, choices & time"
description = "want / prefer / tend to / opt for / prioritise / be inclined to; have time for, make time for, afford, have access to, within / out of reach."
lesson = '''
A simple idea like "I like…" or "I can't pay for…" can be said at different levels of formality. Learn the whole phrase, including the preposition and the verb form that follows.

### Talking about wants and choices
| Phrase | Followed by | Nuance | Example |
|---|---|---|---|
| want to / would like to | base verb | informal / polite | *I'd like to change my seat.* |
| prefer A **to** B | noun or V-ing | like A more than B | *She prefers trains to planes.* |
| prefer to V (rather than V) | base verb | would rather do | *I prefer to walk rather than wait for the bus.* |
| tend to | base verb | usually, as a pattern | *Prices tend to rise before Tết.* |
| opt for | noun / V-ing | choose after thinking | *Most guests opted for the vegetarian menu.* |
| prioritise (AmE prioritize) | noun | put first | *The school prioritises safety.* |
| be inclined to | base verb | lean towards, slightly want | *I'm inclined to agree with you.* |

**Note:** *prefer A to B* — never *than*. With two verbs: *prefer cooking to eating out* (both V-ing) or *prefer to cook rather than eat out*.

### Time, money and access
| Phrase | Meaning | Example |
|---|---|---|
| have time for + N / have time to V | have enough time | *I don't have time for a long lunch today.* |
| make time for + N | create time even when busy | *He always makes time for his kids.* |
| (can't) afford + N / afford **to** V | (not) have enough money or means | *We can't afford to repair the roof this year.* |
| have access to + N | be able to use or reach | *Every student has access to the lab.* |
| within reach (of) | achievable, close enough | *A first job in IT is within reach if you build a portfolio.* |
| out of reach (of) | not achievable | *Housing in the city centre is out of reach for many young families.* |

*afford* always takes **to V**, never V-ing: ~~afford buying~~ → *afford to buy*.

### Putting it into sentences
- *Many young workers **prefer** flexible hours **to** a higher salary, and they **tend to** change jobs more often.*
- *When money is tight, families **opt for** cheaper brands and **prioritise** basic needs.*
- *Even with a busy schedule, try to **make time for** exercise.*
'''

[questions.col-001]
explanation = "*prefer A to B*: like A more than B. *tend* needs *to V*, *opt* needs *for*, and *prioritise* does not take the *A to B* pattern."

[questions.col-002]
explanation = "*opt for + N*: choose after careful thought. The other options have a missing or wrong preposition/structure."

[questions.col-003]
prompt = '''
Fill in **one verb** to describe a general tendency:

Young people {{blank}} to spend more time online than older adults.
'''
explanation = "*tend to + V*: usually do something, as a general pattern."

[questions.col-004]
prompt = "Which sentences use *afford* and *make time* correctly? Select all that apply."
explanation = "*afford* takes a noun or *to V*, not V-ing. *make time for + N* is correct."

[questions.col-005]
explanation = "*within reach*: achievable. *in reach of* needs an object and means something else; *reachable to* and *out of access* are not natural collocations."

[questions.col-006]
explanation = "*give / have access to + N*: be allowed or able to use something."

[questions.col-007]
explanation = "*make time for*: find time for something even when you are busy."

[questions.col-008]
prompt = "Which sentence is the **most formal** way to say you lean towards agreeing in a meeting?"
explanation = "*be inclined to + V* is polite and careful; the others are either too casual or ungrammatical."

[questions.col-009]
prompt = '''
Write **two English sentences** about how you like to study (when, where…) and why. Use *prefer … to …* or *tend to*, and give a reason.
'''
explanation = "Combining a preference/tendency structure with a reason clause makes the answer clear."

# ─────────────────────────────────────────────────────────────
[modules.col-problems-causes]
title = "Problems, causes & effects"
description = "find it difficult, struggle, deal with, address, overcome; because of, make + adj, lead to, result in / from, contribute to, be associated with."
lesson = '''
### Talking about problems and solutions
| Phrase | Structure | Example |
|---|---|---|
| find it difficult / hard to | find **it** + adj + to V | *Many freshers find it hard to manage their money.* |
| have difficulty (in) | + V-ing | *He had difficulty finding a parking space.* |
| struggle to / struggle with | + V / + N | *She struggled to stay awake. · They struggle with deadlines.* |
| ask for help | ask (sb) for + N | *Don't be afraid to ask for help.* |
| deal with / cope with | + N | *The team dealt with the complaint quickly.* |
| address + N | **no** preposition | *The report addresses the issue of noise.* |
| overcome + N | get past a difficulty | *She overcame her fear of flying.* |
| tackle + N | start dealing with | *The city is tackling air pollution.* |

### Causes and effects
| Phrase | Direction | Example |
|---|---|---|
| because of / due to + N | cause | *The match was delayed because of the rain.* |
| because + clause | cause | *The match was delayed because it was raining.* |
| make + O + adj | cause a state | *Long meetings make people tired.* |
| lead to + N / V-ing | cause → effect | *Skipping breakfast can lead to poor focus.* |
| A **result in** B | cause → effect | *The storm resulted in power cuts.* |
| B **result from** A | effect ← cause | *The power cuts resulted from the storm.* |
| contribute to + N / **V-ing** | be one of several causes | *Tourism contributes to creating jobs.* |
| be associated with | linked (not necessarily a cause) | *Late nights are associated with lower grades.* |

### Key distinctions
- *result in* ≠ *result from*: swap the direction and you swap the meaning.
- *contribute to* and *lead to*: **to** is a preposition, so a noun or V-ing follows (~~contribute to reduce~~).
- *be associated with* only says there is **a link**; to claim a cause, use *cause / lead to* — and you need strong evidence.
'''

[questions.col-010]
explanation = "*find it + adj + to V*: *it* is a dummy object and cannot be left out."

[questions.col-011]
explanation = "*address + N* takes no preposition. *deal* must be *deal with*; *solve with* is wrong."

[questions.col-012]
explanation = "*lead to / contribute to + N*: cause / help cause."

[questions.col-013]
explanation = "Fuel prices are the cause → *result in* + effect. *result from* reverses the direction; *leaded* does not exist (the past is *led*)."

[questions.col-014]
prompt = "Which sentences use common verb and noun collocations correctly? Select all that apply."
explanation = "*because* + clause; before a noun use *because of*: *because of the storm*."

[questions.col-015]
explanation = "*overcome a fear / a problem*: get past it."

[questions.col-016]
prompt = "A survey only shows that two things happen together. Which sentence describes the result **at the right strength**?"
explanation = "A correlational survey only supports *is associated with*; the other three claim cause and effect."

[questions.col-017]
explanation = "The *to* in *contribute to* is a preposition → follow it with V-ing."

[questions.col-018]
prompt = '''
Write **2–3 English sentences** about a problem in your city: give its cause, its effect and what should be done. Use phrases from at least two groups in the lesson (cause, effect, solution).
'''
explanation = "One sentence gives the cause (*because of*), another the effect (*lead to*) and the way forward (*address*)."

