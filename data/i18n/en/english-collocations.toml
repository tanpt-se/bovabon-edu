[modules.col-learning-work]
title = "Learning, work & responsibility"
description = "learn to, get used to, keep up with, put into practice, build on; care about, get on with, rely on, be responsible for, take for granted, take into account."
lesson = '''
### Learning and adapting
| Phrase | Followed by | Example |
|---|---|---|
| learn to / learn how to | V | *Kids learn to swim faster than adults.* |
| get used to / be used to | **V-ing** / N | *I'm getting used to waking up early.* |
| used to | V (past habit) | *I used to live in Huế.* |
| keep up with | N | *It's hard to keep up with new frameworks.* |
| catch up with | N | *I missed a week, so I need to catch up with the class.* |
| put sth into practice | — | *Put the new grammar into practice in your emails.* |
| develop an understanding of | N | *The course helps you develop an understanding of data.* |
| build on | N | *Lesson 2 builds on the ideas from lesson 1.* |

**Three forms people mix up:** *used to + V* (did regularly in the past) · *be used to + V-ing* (am accustomed to) · *get used to + V-ing* (am becoming accustomed to).

### Relationships and responsibility
| Phrase | Meaning | Example |
|---|---|---|
| care about | think something is important | *She really cares about her students.* |
| get on (well) with | have a good relationship with | *I get on well with my flatmates.* |
| rely on / depend on | trust, need | *You can rely on Minh to fix it.* |
| be responsible **for** + N / V-ing | have the duty of | *Who is responsible for booking the room?* |
| take sth for granted | assume it will always be there, not value it | *We often take electricity for granted.* |
| take sth into account | consider it | *Take the traffic into account when you plan.* |

~~responsible of~~ is a very common mistake — always use **for**.
'''

[questions.col-028]
explanation = "*get used to + V-ing*: gradually become accustomed to doing something."

[questions.col-029]
explanation = "*keep up with*: move at the same speed as, stay up to date."

[questions.col-030]
explanation = "*be responsible for + V-ing / N*."

[questions.col-031]
explanation = "*put sth into practice*: apply it in real situations."

[questions.col-032]
prompt = "Which sentences use a collocation or phrasal verb correctly? Select all that apply."
explanation = "The correct phrase is *take sth for granted* (participle *granted*)."

[questions.col-033]
explanation = "*take sth for granted*: assume it will always be there and so not value it."

[questions.col-034]
explanation = "*build on sth*: develop further from an existing base."

[questions.col-035]
explanation = "A past habit that no longer happens → *used to + V*."

[questions.col-036]
prompt = '''
Write **2–3 English sentences** about when you started at a new school or job: what you had to get used to, what you had to keep up with, and who you relied on.
'''
explanation = "Combine *get used to + V-ing*, *keep up with* and *rely on* to tell a story about adapting."

