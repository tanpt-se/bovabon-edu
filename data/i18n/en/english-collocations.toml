[modules.col-change-compare]
title = "Change & comparison"
description = "get better / worse, increase / fall from A to B, by vs to, level off, give way to; the same as, different from, compared with, unlike, outweigh, on a par with."
lesson = '''
### Describing change
| Trend | Verbs | Nouns |
|---|---|---|
| go up | increase, rise, grow, go up | an increase / a rise **in** + N |
| go down | fall, drop, decline, go down | a fall / a drop **in** + N |
| become steady after changing | level off, stabilise | — |
| stay the same | remain stable, stay the same | — |
| go up and down | fluctuate | fluctuation |
| get better / worse | improve, get better / get worse, deteriorate | improvement |
| be gradually replaced | give way to + N | — |

**by or to?** — *by* gives **the size of the change**, *to* gives **the final level**:
- *Visitors increased **from** 400 **to** 600.* (start → end)
- *Visitors increased **by** 200.* (the difference)
- *There was **a rise of** 50% **in** online orders.*

### Comparing
| Phrase | Example |
|---|---|
| the same as | *My schedule is the same as yours.* |
| similar **to** | *The new logo is similar to the old one.* |
| different **from** | *City life is very different from village life.* |
| compared with / to | *Compared with 2020, rents are much higher.* |
| unlike + N (at the start) | *Unlike her sister, Lan loves maths.* |
| whereas / while + clause | *Hà Nội has four seasons, whereas Sài Gòn has two.* |
| outweigh | *The advantages outweigh the disadvantages.* |
| on a par with | *Their salaries are now on a par with those in Singapore.* |

**Common mistakes:** ~~similar with~~ → *similar to*; ~~different with~~ → *different from*; ~~the same like~~ → *the same as*.
'''

[questions.col-019]
explanation = "*from A to B*: from the starting level to the final level."

[questions.col-020]
explanation = "60 is **the difference** → *increase by*. For the final level, say *increased to 260*."

[questions.col-021]
explanation = "*level off*: stop rising or falling and stay steady."

[questions.col-022]
explanation = "*Unlike + N* at the start of a sentence shows contrast."

[questions.col-023]
prompt = "Which sentences use the right prepositions in comparison phrases? Select all that apply."
explanation = "*similar* goes with *to*: *similar to the old one*."

[questions.col-024]
explanation = "*outweigh*: be greater or more important than (the benefits are bigger than the risks)."

[questions.col-025]
explanation = "*give way to + N*: gradually be replaced by."

[questions.col-026]
explanation = "*on a par with*: equal to, at the same level as."

[questions.col-027]
prompt = '''
A chart shows library visitors: 500 (2020), 900 (2023) and still 900 (2024). Write **2 English sentences** describing the trend and comparing it with 2020.
'''
explanation = "Use *from … to …* for the rise, *level off* for the steady period and *compared with* for the comparison."

