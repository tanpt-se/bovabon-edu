[modules.col-usefulness-opinion]
title = "Usefulness, opinions & evidence"
description = "useful for, worth + V-ing, benefit from, meet needs, effective vs efficient; I think, not sure whether, seem to, suggest that, provide evidence, rule out."
lesson = '''
### Benefits and effectiveness
| Phrase | Followed by | Example |
|---|---|---|
| useful for + N / V-ing | purpose | *This app is useful for learning new words.* |
| (be) worth + **V-ing** / N | deserve doing | *The museum is worth visiting.* · *It's worth the money.* |
| benefit from + N / V-ing | gain from | *Shy students benefit from working in pairs.* |
| be of benefit to + sb | be helpful to | *The new park is of benefit to everyone.* |
| meet sb's needs | satisfy what someone needs | *The service doesn't meet customers' needs.* |
| effective (in V-ing) | **produces** the desired result | *The medicine was effective in reducing pain.* |
| efficient | **wastes little** time / money / energy | *An efficient way to travel is by metro.* |

**effective vs efficient:** a method can be *effective* (it works) but not *efficient* (it takes too much effort).

### Opinions and certainty (hedging)
| Purpose | Phrases |
|---|---|
| give a view | *I think / I believe / In my opinion,* |
| not sure | *I'm not sure whether / if…* |
| careful claim | *It seems that… / X seems to + V / It is likely that…* |
| cite evidence | *The data suggest(s) that + clause · The study provides evidence for / of + N* |
| exclude | *rule out + N* (remove a possibility) |

- *suggest* + clause or V-ing, **not** *suggest sb to V*: ~~suggests us to buy~~ → *suggests that we buy*.
- In essays, use *seem to / it is likely that* when the evidence is not strong, instead of *prove* or *always*.
'''

[questions.col-037]
explanation = "*be worth + V-ing*."

[questions.col-038]
explanation = "This is about **the result** (it prevented the disease) → *effective*. The high cost suggests it was not really *efficient*."

[questions.col-039]
explanation = "The focus is on **saving** water and time → *efficient*."

[questions.col-040]
explanation = "*benefit from + N*: gain an advantage from."

[questions.col-041]
prompt = "Choose **the sentences that hedge** — suitable when the evidence is not certain."
explanation = "*prove* and *always* make absolute claims; they are not hedging."

[questions.col-042]
explanation = "*rule out*: exclude a possibility; the present perfect needs *ruled*."

[questions.col-043]
explanation = "*suggest that + clause*. *suggest* does not take *to V* or a personal object as in ~~suggest us~~."

[questions.col-044]
explanation = "*meet sb's needs*: satisfy what someone needs."

[questions.col-045]
prompt = '''
Write **2 English sentences** giving your view on online learning for working adults. State your opinion, use a hedging phrase, and mention evidence and a benefit.
'''
explanation = "A good answer gives a view, stays appropriately careful (*seem to*) and notes the limits of the evidence."

# ─────────────────────────────────────────────────────────────
[modules.col-practice-mistakes]
title = "Using the phrases & common mistakes"
description = "Combine the phrases into a coherent paragraph and fix common mistakes: afford to, worth V-ing, contribute to V-ing, responsible for, by vs to, effective vs efficient, correlation vs causation."
lesson = '''
### Building a paragraph from the phrases
A short paragraph (IELTS, an email, a report) usually has 4 steps. Each step has a ready-made "phrase kit" from the earlier lessons:

| Step | Function | Suggested phrases |
|---|---|---|
| 1. Topic sentence | state a trend / choice | *tend to, prefer … to …, opt for* |
| 2. Reasons | causes, difficulties | *because of, struggle to, find it hard to* |
| 3. Results | effects, comparison | *lead to, result in, compared with, outweigh* |
| 4. Evaluation | careful conclusion | *seem to, it is likely that, worth + V-ing* |

**Sample paragraph:** *Many retired people now **opt for** smaller flats in the city. They often **find it hard to** look after a large house, and moving **leads to** lower living costs. **Compared with** life in the suburbs, city flats also give them easier **access to** hospitals. Overall, downsizing **seems to** be **worth considering** for older couples.*

### Common mistakes
| Wrong | Right | Remember |
|---|---|---|
| ~~can't afford buying~~ | can't afford **to buy** | afford + to V |
| ~~worth to read~~ | worth **reading** | worth + V-ing |
| ~~get used to work~~ | get used to **working** | *to* is a preposition |
| ~~contributed to reduce~~ | contributed to **reducing** | *to* is a preposition |
| ~~responsible of~~ | responsible **for** | |
| ~~prefer tea than coffee~~ | prefer tea **to** coffee | |
| ~~discuss about the plan~~ | **discuss** the plan | discuss takes no preposition |
| ~~address to the issue~~ | **address** the issue | |
| increased **to** 50 (final level) | increased **by** 50 (amount of rise) | two different meanings |
| ~~an effective way to save time~~ (when you mean saving) | an **efficient** way | efficient = little waste |
| ~~X causes Y~~ (with only correlational data) | X **is associated with** Y | correlation ≠ causation |
'''

[questions.col-046]
prompt = "Choose the **grammatically correct** sentence."
explanation = "*contribute to + V-ing*: *to* is a preposition."

[questions.col-047]
explanation = "*prefer A to B*, not *than*."

[questions.col-048]
prompt = "Which sentences use adjective-preposition pairs or common expressions correctly? Select all that apply."
explanation = "Corrections: *responsible **for** their children's safety*; *discussed the budget* (no *about*)."

[questions.col-049]
prompt = "We need to {{blank}} the issue of late deliveries before the holiday season. (one verb, no preposition)"
explanation = "*address / tackle / solve the issue* — these verbs take the object directly."

[questions.col-050]
explanation = "The data only show a correlation → *is associated with*. It could be that people who sleep less drink more coffee, not the other way round."

[questions.col-051]
explanation = "15,000 is **the amount of increase** → *by*. For the final level, say *increased to 65,000*."

[questions.col-052]
prompt = "Choose the **correct** sentence."
explanation = "*get used to + V-ing*."

[questions.col-053]
prompt = '''
Write **a 3–4 sentence English paragraph** about working from home. Use **at least four different groups** of phrases: choice/tendency, time/cost, effect, comparison, certainty, adapting.
'''
explanation = "The model paragraph follows 4 steps: trend (*prefer … to*), benefit (*time for, lead to*), comparison (*compared with*), careful evaluation (*seems to*)."
