[modules.ir-strategy-paraphrase]
title = "Reading strategies and recognising paraphrase"
description = "Skimming, scanning, budgeting 20 minutes per passage, and spotting the same idea expressed in different words."
lesson = '''
### Suggested learning path
Take this track after finishing roughly CEFR B1, alongside B2 and IELTS Grammar/Vocabulary. Reading and Listening are the two skills where strategy raises your score fastest. **Note:** the app is text-only; the passages here are written by us to practise technique, so you should also practise with real paper or computer-based tests to get used to the time pressure. A band 6.5 target corresponds to roughly 27–29 correct answers out of 40 (a reference figure; it varies by test).

### Test structure
Academic Reading has 3 long passages, 40 questions in total, **60 minutes**, and no extra time to transfer answers. Difficulty increases: passage 3 is usually the densest and has the most inference questions. A common mistake is spending 30 minutes on passage 1 trying to "understand everything".

### A 5-step routine for each passage (20 minutes)
1. **Read the title and glance at the first paragraph (30 seconds)** to get the topic and tone.
2. **Read the instructions and questions first**, underlining keywords (proper nouns, numbers, technical terms). Watch the word limit (NO MORE THAN TWO WORDS).
3. **Skim** each paragraph: read the topic sentence (usually sentence 1–2) and jot the main idea in the margin.
4. **Scan** for the keyword or its paraphrase, then **read closely** the few sentences around that spot to decide the answer.
5. **Transfer answers to the answer sheet straight away** and mark any skipped questions to come back to later.

### How skimming and scanning differ
| Technique | Goal | Use for |
|---|---|---|
| Skim | get the main idea of a paragraph | matching headings, finding the passage structure |
| Scan | find one specific detail | numbers, names, dates, completion |
| Close reading | choose the exact answer | TRUE/FALSE/NOT GIVEN, MCQ |

### Paraphrase: the core skill
The test almost never repeats the exact words of the question. Common types of paraphrase:
| Type | Passage | Question |
|---|---|---|
| Synonym | *a rapid increase* | *a quick rise* |
| Change of word form | *The decision was criticised* | *There was criticism of the decision* |
| Change of structure | *Few people attended* | *Attendance was low* |
| Generalisation | *cars, buses and trains* | *forms of transport* |
| Double negative | *not uncommon* | *fairly frequent* |
Verbs and adjectives are the words most often paraphrased; **numbers, proper nouns and technical terms** usually stay the same, so they are the best anchors when scanning.

### Common mistakes
- Choosing an answer just because it **shares words** with the question; traps often use the right words with the wrong meaning.
- Translating word by word into your first language slows you down; read in chunks of meaning.
- Stopping too long on an unfamiliar word: guess its meaning from context or move on.
- Using background knowledge instead of the information in the passage.

### Time management
Passage 1: 17–18 minutes, passage 2: 20 minutes, passage 3: 22–23 minutes. If a question takes more than 1 minute, mark it with a question mark and move on. Keep ~2 minutes at the end to guess any blank answers, since wrong answers are not penalised.
'''

[modules.ir-tfng-ynng]
title = "TRUE/FALSE/NOT GIVEN and YES/NO/NOT GIVEN"
description = "Compare each part of a statement with the passage, tell FALSE from NOT GIVEN, and watch out for qualifying words."
lesson = '''
### Two formats, one logic
| Format | Asks about | Answers |
|---|---|---|
| TRUE / FALSE / NOT GIVEN | **information/facts** in the passage | TRUE: the passage says exactly this; FALSE: the passage says the opposite; NOT GIVEN: the passage does not say enough to decide |
| YES / NO / NOT GIVEN | **the writer's opinions/views** | YES: matches the writer's view; NO: contradicts the writer's view; NOT GIVEN: it is unclear what the writer thinks |
The questions follow **the order** of the passage, so you can work through it once from top to bottom.

### Checking routine
1. Break the statement into parts: subject, action, figures, degree, time, cause.
2. Find the paragraph that contains the subject (by keyword or paraphrase).
3. Compare each part with the passage:
   - Every part matches → **TRUE**.
   - Some part **contradicts** the passage → **FALSE**.
   - Some part is **not mentioned** in the passage → **NOT GIVEN**.
4. Do not use outside knowledge to decide.

### Telling FALSE from NOT GIVEN
**Passage:** *The library opens at 9 a.m. on weekdays.*
- *The library opens at 8 a.m. on weekdays.* → **FALSE** (a clearly different time).
- *The library opens at 9 a.m. on Sundays.* → **NOT GIVEN** (the passage says nothing about Sundays).
- *The library is open on weekday mornings.* → **TRUE** (paraphrase).
Tip: FALSE needs a sentence in the passage that **says the opposite** and that you can quote; if you have to "guess", the answer is most likely NOT GIVEN.

### Qualifying words and traps
| Word in the statement | Common trap |
|---|---|
| all, every, always, never | the passage only says *most*, *often* → FALSE |
| some, a few | the passage says *none* → FALSE; the passage gives no quantity → possibly NOT GIVEN |
| only, solely | the passage mentions another factor → FALSE |
| may, might, could | compare carefully whether the passage is certain or only hypothetical |
| the first, the largest | the passage makes no comparison → NOT GIVEN |
| because, as a result | the passage only states two facts without a cause-and-effect link → NOT GIVEN |

### Common mistakes
- Confusing NOT GIVEN with FALSE because "the passage doesn't say that" — check whether there is a **contradicting** sentence.
- Choosing TRUE because the first part matches while ignoring the later part (figures, causes).
- Using personal knowledge ("in reality…").
- With YES/NO, confusing the writer's view with the view of **someone else quoted** in the passage.

### Timing
Spend no more than 1 minute per statement. If you still cannot find evidence after reading the relevant section closely, the answer is usually NOT GIVEN.
'''

[modules.ir-matching-headings]
description = "Find the main idea of each paragraph, separate the main idea from details, and eliminate distractor headings."
lesson = '''
### The task
You get a list of headings numbered with Roman numerals (i, ii, iii…), more than there are paragraphs, and must match each paragraph (A, B, C…) with the most suitable heading. Some headings are left over, and **each heading is used once**. This task is time-consuming, so it is usually done **after** the other tasks for the same passage, or first if you have already skimmed the passage.

### Routine
1. Read the list of headings quickly and underline the keywords of each.
2. Read the **first and last sentences** of the paragraph; the topic sentence is usually there. For long paragraphs, also read the sentence right after a linker that changes direction (*However, Yet, In contrast*).
3. Summarise the paragraph in a few words yourself before looking at the headings.
4. Choose the heading that **covers the whole paragraph**, not just one detail.
5. Eliminate as you go: cross out used headings; match the remaining ones to the difficult paragraphs.

### Main idea vs detail
| Signal | Main idea | Detail |
|---|---|---|
| Position | usually at the start or end of the paragraph | in the middle |
| Function | generalises, states the argument | examples, figures, names |
| Linkers | *therefore, overall* | *for instance, such as* |
The correct heading is usually **more general** than the text and uses paraphrase; distractor headings often repeat words from the paragraph but reflect only one detail or go beyond its scope.

### Types of distractor heading
- **Right words, wrong idea:** repeats a keyword but says something the passage does not discuss.
- **Too narrow:** only one example in the paragraph.
- **Too broad:** the whole passage rather than this paragraph.
- **Reversed relationship:** the paragraph is about *the effect of A on B* but the heading says *the effect of B on A*.

### Common mistakes
- Matching by identical words instead of by meaning.
- Reading every word of the paragraph and losing time: read just enough to get the main idea.
- Forgetting that a paragraph may open with an introductory sentence, with the main idea in the next one.
- Choosing a heading for paragraph A from the content of paragraph B because the two have similar topics.

### Timing tips
Spend at most 5–6 minutes on 5–6 paragraphs. Do the easy paragraphs first to eliminate headings, then return to the hard ones. Fill-in answers use lowercase Roman numerals (*iv*).
'''

[modules.ir-matching-information-features]
title = "Matching information, features and sentence endings"
description = "Find the paragraph that contains the information, match statements with people/items, and match sentence halves."
lesson = '''
### Three matching tasks
| Task | What you do | Features |
|---|---|---|
| Matching information | Find the **paragraph** (A–G) that contains the stated information | the items are **not** in passage order; a paragraph may be used more than once or not at all |
| Matching features | Match statements with **people, organisations, periods, categories** | usually follow passage order when the people are mentioned; an option may be used more than once |
| Matching sentence endings | Match the **first half of a sentence** with an ending from the list | there are more endings than sentences; the match must be correct in both grammar and meaning |

### Matching information
1. Underline the keywords in each statement. A statement is usually a very specific idea, e.g. *a comparison between two methods*, *an example of a failed attempt*, *the reason for a delay*.
2. Because the order does not follow the passage, **skim** to learn what each paragraph is about, then go back and scan.
3. Look for the **function** of the information (example, comparison, cause, definition, warning), not just keywords.
4. Double-check: the paragraph must contain the **whole** idea in the statement.

### Matching features
- Passages usually name people/organisations together with their words or views. Circle the names in the passage, then read the sentences containing them.
- Distinguish the person **giving the opinion** from the person **being argued against**.
- Don't confuse two people with similar views: look for the difference (degree, reason).

### Matching sentence endings
1. Read the first half of the sentence and predict the type of ending (cause? result? contrast?).
2. Eliminate endings that are **grammatically** wrong (e.g. a stem ending in *because of* needs a noun/noun phrase).
3. Find the location in the passage and compare it with the paraphrase.
4. Distractor endings are often half right or reverse cause and effect.

### Common mistakes
- Matching a keyword to a minor detail in the paragraph while ignoring the main idea of the statement.
- Forgetting that a paragraph can be reused.
- Attributing a view to the wrong person because the passage mixes several names.
- Choosing an ending that is grammatically correct but contradicts the content.

### Timing
Matching information can take 1.5–2 minutes per question; if you still can't find it after skimming, move on to the next question. For matching features, mark the people's names in the passage so you can return quickly.
'''

[modules.ir-completion]
title = "Completion: sentences, summaries, notes, tables and diagrams"
description = "Fill gaps within the word limit, predict the word class, and recognise paraphrase around the gap."
lesson = '''
### Completion tasks
Sentence, summary, note, table, flow-chart and diagram completion all ask you to fill gaps with words **taken from the passage**. Some summary tasks give a box of words to choose from (in that case the words may be paraphrased).

### Word-limit rules
| Instruction | Meaning | Valid example |
|---|---|---|
| ONE WORD ONLY | exactly one word | *rainfall* |
| NO MORE THAN TWO WORDS | one or two words | *solar power* |
| ONE WORD AND/OR A NUMBER | a word, a number, or both | *1990* / *group 3* |
A hyphenated word (*long-term*) usually counts as **one** word. Numbers written as words or digits are both normally accepted, but copy exactly what the passage says. Spelling mistakes or going over the limit lose the mark.

### Routine
1. Read the sentence/box with the gap to **predict the word class**: noun, verb, adjective, number.
2. Identify the **other keywords** in the sentence (especially numbers and proper nouns) to scan for.
3. Find the location in the passage and read the whole surrounding sentence; the paraphrase usually changes the keywords.
4. Copy the word **in the exact form used in the passage**; check that the completed sentence is grammatical (a/an, singular/plural, tense).
5. Check the word limit.

### Predicting from grammar
| Before the gap | Usually needs |
|---|---|
| a / an / the | a noun or adjective + noun (*an* → starts with a vowel sound) |
| is / was | an adjective, noun or V-ing |
| to | a base-form verb |
| of / in / by | a noun, V-ing |
| a quantifier (*several*) | a plural noun |

### Flow-charts and tables
- The boxes in a flow-chart follow **the order of the passage** — use sequence words (*first, then, finally*).
- With tables, identify the column and row to know what kind of information is needed (name, place, number).
- With diagrams, use the labels provided to locate the paragraph that describes it.

### Common mistakes
- Writing a word with the right meaning but the **wrong form** (*grow* instead of *growth*).
- Adding an article that pushes the answer over the limit.
- Copying a word from the question instead of from the passage.
- Writing something that "sounds plausible" but is not in the passage.

### Timing
Completion is usually quick because it targets specific details; scan for keywords and numbers. If there is a word box, first eliminate the words that clearly do not fit the word class.
'''

[modules.ir-mcq-short-answer]
title = "Multiple choice and short answer"
description = "Choose one or more answers, eliminate distractors, and give short answers within the word limit."
lesson = '''
### Single-answer multiple choice
Questions usually follow the order of the passage. Distractors are often:
- **right words, wrong idea:** use words from the passage but say something different;
- **true but not the answer:** information that is in the passage but is not what the question asks;
- **too absolute:** use *always*, *all*, *only* when the passage says *often*, *most*;
- **over-inferred:** go further than what the passage states.

### Multiple-answer multiple choice
The question clearly says whether to choose *TWO* or *THREE* answers. The correct answers are often in the same paragraph but **not in order**. Read the paragraph closely and check each option; you must choose the whole correct set to score the question (depending on the test, each correct answer may be marked separately, but don't count on it).

### Elimination routine
1. Read the **question** (stem) first without looking at the options, and predict the answer yourself.
2. Find the relevant paragraph from the keywords in the question.
3. For each option, ask yourself: *Does the passage actually say this?* If only half of the idea is right, it is a distractor.
4. Choose the option whose paraphrase matches best, not the one with similar words.
5. Questions about **the writer's purpose** or **the main idea** require you to consider the whole paragraph/passage.

### Short answer
Answer the question (*What*, *Which*, *How many*, *Who*) with a short phrase **taken from the passage** within the word limit. Check the type of word needed: a *How many…* question needs a number; *Who…* needs a name/group of people.
| Question | Answer type |
|---|---|
| What material was used? | a noun for a material |
| How long did it take? | number + unit |
| Which group benefited? | a noun phrase for a group |

### Common mistakes
- Choosing an answer as soon as you see a familiar word, before reading the whole sentence.
- Missing the *TWO* / *THREE* instruction.
- Writing a long phrase as a short answer and going over the limit.
- Choosing an option that is true from outside knowledge but not stated in the passage.

### Timing
Hard MCQs are often at the end of passage 3; if you are out of time, eliminate the two clearly wrong options and choose between the remaining two. Never leave a question blank.
'''

[modules.ir-full-passages]
title = "Full timed reading passages"
description = "Four 700–900-word passages, each with three question sets of different types. Practise finishing a whole passage in 20 minutes."
lesson = '''
### How to practise with long passages
Each passage in this section is a complete text (700–900 words), written by us and **fictional**: the studies, organisations and figures in it exist only for practice and are not real information. Each passage has three consecutive question sets that share the same text, each set using a different question type. Time yourself: **20 minutes for all three sets**.

### Routine for a whole passage
| Minutes | What to do |
|---|---|
| 0–2 | Read the title, skim the paragraphs, read the instructions and underline the keywords of all three question sets |
| 2–6 | Do the matching/headings set (needs the main idea of each paragraph) |
| 6–13 | Do TRUE/FALSE/NOT GIVEN and completion in passage order |
| 13–18 | Do the MCQs and remaining questions |
| 18–20 | Review blank answers, check word limits and spelling |

### Order of the question sets
In the real test, the order in which question sets appear on the page is not necessarily the best order to do them. General rule: first do the tasks that require skimming the whole passage (headings), then the detail-scanning tasks (completion, TFNG), and finally the hard MCQs or multiple-answer tasks.

### After finishing: analyse your mistakes
For each wrong answer, record the cause in a separate table:
| Cause | Fix |
|---|---|
| Didn't recognise the paraphrase | add the word pair to your vocabulary notebook |
| Confused FALSE/NOT GIVEN | quote the contradicting sentence before choosing FALSE |
| Broke the word limit | underline the instruction before filling in |
| Ran out of time | practise setting minute checkpoints for each set |

### Common mistakes with long passages
- Reading the whole passage closely before looking at the questions, losing 8–10 minutes.
- Not marking where answers are, which makes reviewing hard.
- Pouring time into a few hard questions and leaving easy ones at the end blank.
- Forgetting to transfer answers to the answer sheet (the paper test gives no extra transfer time).

### Target
After working through all four passages, you should reach at least 70% correct per passage in 20 minutes before trying full 60-minute tests. If you're not there yet, go back to the module for the question type you get wrong most.
'''

[questions.ir-001]
prompt = '''
You have 60 minutes for 3 Academic Reading passages. Which time allocation is most sensible?
'''
options = ["Spend 40 minutes on passage 1 to make sure everything is right", "About 17–18 minutes for passage 1, 20 for passage 2, 22–23 for passage 3", "Split exactly 30 minutes between passages 1 and 2 and skip passage 3", "Read all three passages closely first, then answer"]
explanation = '''
There is no separate time to transfer answers and passage 3 is usually the hardest, so do passage 1 faster to save time for the later ones. Spending too long on the first passage is a common mistake.
'''

[questions.ir-002]
prompt = '''
Before reading a paragraph closely, which step should come first in the recommended routine?
'''
options = ["Translate the whole passage into your first language", "Read the title, glance at the first paragraph, and read the instructions and questions", "Fill in the answer sheet from memory straight away", "Read the passage twice"]
explanation = '''
Knowing the topic and what you need to find makes skimming/scanning efficient. Translating the whole passage or rereading it wastes time.
'''

[questions.ir-003]
prompt = '''
Which technique is best for finding a **year** or a **proper noun** in the passage?
'''
options = ["Skim", "Scan", "Read every word of the passage closely", "Translate it"]
explanation = '''
Scanning means reading quickly to find a specific detail such as a number, date or name. Skimming is for the main idea.
'''

[questions.ir-004]
prompt = '''
Passage: *Prices rose sharply in 2015.* Which sentence is the best paraphrase?
'''
explanation = '''
*Rose sharply* = *increased rapidly*; *prices* = *costs*. The next two options say the opposite; the last option is only general and has no idea of an increase.
'''

[questions.ir-005]
prompt = '''
Passage: *Many students find the course difficult.* Which sentence has the same meaning?
'''
explanation = '''
*Many students* = *a large number of learners*, *difficult* = *hard*. Option 2 changes the idea (few people like it); option 3 only keeps the keywords.
'''

[questions.ir-006]
prompt = '''
Fill in a synonym for the underlined word with one English word (lowercase): *The company aims to reduce waste.* → *The company wants to {{blank}} waste.* (one word starting with *c*, meaning to make smaller)
'''
explanation = '''
*Reduce* is often paraphrased as *cut*. In Reading, verbs are usually what changes most, while the noun *waste* stays the same.
'''

[questions.ir-007]
prompt = '''
Which words usually **stay the same** when a question paraphrases the passage, making them good anchors for scanning?
'''
options = ["Action verbs", "Adjectives of degree", "Numbers, proper nouns and technical terms", "Adverbs"]
explanation = '''
Figures, proper nouns and technical terms are hard to replace with other words, so they usually stay the same; verbs and adjectives are easily paraphrased.
'''

[questions.ir-008]
prompt = '''
Passage: *The decision was widely criticised.* Which sentence shows a change of word form?
'''
explanation = '''
*Criticised* (verb) → *criticism* (noun); *widely* → *widespread*. Option 1 lowers the degree (*a few*), so it is not equivalent.
'''

[questions.ir-009]
prompt = '''
Passage: *Few residents attended the meeting.* Which paraphrase is correct?
'''
explanation = '''
*Few residents attended* → *attendance was low* (change of structure: verb becomes noun + adjective). The other two options have the opposite meaning or add information that isn't there.
'''

[questions.ir-010]
prompt = '''
Passage: *Cars, buses and trains all contributed to the rise in emissions.* Question: *Various forms of transport led to higher emissions.* Which type of paraphrase is used?
'''
options = ["Double negative", "Generalisation (cars, buses, trains → forms of transport)", "Change of verb tense", "Swapping subject and object"]
explanation = '''
The specific list is grouped into the general category *forms of transport*; *contributed to the rise* → *led to higher*.
'''

[questions.ir-011]
prompt = '''
Passage: *It is not uncommon for apprentices to change employers.* Which idea is correct?
'''
explanation = '''
*Not uncommon* is a double negative, meaning it happens fairly often. The other two options say *never/rarely*, the opposite meaning.
'''

[questions.ir-012]
prompt = '''
When should you skip a question and come back to it later?
'''
options = ["When you have already found the answer", "When you have spent about 1 minute and still cannot find the evidence", "When the question contains a number", "Never"]
explanation = '''
Save time for easier questions: mark it with a question mark, move on, and come back if time allows. Don't leave the answer sheet blank, since wrong answers are not penalised.
'''

[questions.ir-013]
prompt = '''
Choose **two** types of paraphrase used between this pair of sentences. Passage: *Sales increased sharply after the advertising campaign.* Question: *There was a sharp rise in sales following the campaign.*
'''
options = ["Synonym (after → following)", "Change of word form (increased → a rise)", "Double negative", "Reversed meaning"]
explanation = '''
*After* → *following* is a synonym; the verb *increased* → the noun *a rise*. There is no negation and the meaning stays the same.
'''

[questions.ir-014]
prompt = '''
Which of these shows a **mistake** in exam technique?
'''
options = ["Underlining the word limit before filling in", "Choosing an answer just because the words in the option are identical to the passage", "Transferring answers to the sheet after each question set", "Predicting the word class needed"]
explanation = '''
A common IELTS trap is a distractor that uses the exact words of the passage with the wrong meaning; check by paraphrase and context.
'''

[questions.ir-015]
prompt = '''
Passage: *The scheme, though initially popular, ultimately failed to attract sustained investment.* Which sentence is the closest paraphrase?
'''
explanation = '''
*Scheme* → *programme*, *initially popular* → *early appeal*, *failed to attract sustained investment* → *lost investor support*. The other options contradict it or drop the concession *though initially popular*.
'''

[questions.ir-016]
prompt = '''
Passage: *Rarely did the committee reach a unanimous verdict.* Which sentence keeps the same meaning?
'''
explanation = '''
*Rarely* = *uncommon*, *unanimous verdict* = *complete agreement*. *Never* in option 3 is too absolute.
'''

[questions.ir-017]
prompt = '''
Passage: *Researchers attributed the decline in bee numbers chiefly to habitat loss.* Which sentence is correct?
'''
explanation = '''
*Attributed… chiefly to* = *seen as the main cause*. Option 2 is too absolute (*only*); option 3 reverses cause and effect.
'''

[questions.ir-018]
prompt = '''
A paragraph has two sentences similar to the question: one at the start of the paragraph and one at the end containing *However*. Why should you read the *However* sentence closely too?
'''
options = ["Because *However* always signals the correct answer", "Because the information may change direction, so the first sentence no longer fits the statement", "Because sentences with *However* are never important", "Because *However* is a keyword in every test"]
explanation = '''
Contrast linkers often introduce the main idea or correct the previous one. If you rely only on the first sentence, you can easily answer wrongly.
'''

[questions.ir-019]
prompt = '''
Do the following statements agree with the information in the passage? Write **TRUE** if the statement agrees, **FALSE** if it contradicts, **NOT GIVEN** if there is no information. (Enter `true`, `false` or `not given`.)

**The Riverside Community Garden**

The Riverside Community Garden was opened in 2018 on a piece of land that had been empty for ten years. It has forty plots, and each plot is rented by a local family for a small yearly fee. Volunteers meet every Saturday morning to repair paths and water the shared fruit trees. Most of the vegetables are grown for personal use, although a small market stall sells extra tomatoes and herbs once a month. The garden has no electricity supply, so a rainwater tank is used for watering. Last year, a primary school began to visit the garden to teach children about plants.

1. The garden was built on land that had been unused for a decade. {{blank}}
2. Families do not pay to use a plot. {{blank}}
3. Volunteers also water the trees on Wednesdays. {{blank}}
4. The market stall sells vegetables every week. {{blank}}
5. Rainwater is collected for watering. {{blank}}
6. The primary school pays the garden for each visit. {{blank}}
'''
explanation = '''
1. TRUE: "empty for ten years" = unused for a decade.
2. FALSE: "rented… for a small yearly fee", so families do pay a fee.
3. NOT GIVEN: the passage only says volunteers meet every Saturday morning; Wednesday is not mentioned.
4. FALSE: "once a month", not every week.
5. TRUE: "a rainwater tank is used for watering".
6. NOT GIVEN: the passage says nothing about paying for the visits.
'''

[questions.ir-020]
prompt = '''
Do the following statements agree with the information in the passage? Write **TRUE** if the statement agrees, **FALSE** if it contradicts, **NOT GIVEN** if there is no information. (Enter `true`, `false` or `not given`.)

**Harnessing the tides**

Interest in tidal energy has grown because tides are far more predictable than wind or sunlight. Engineers can calculate the height of the sea years in advance, which makes it easier for grid operators to plan supply. However, building turbines on the sea floor is expensive, and salt water corrodes equipment quickly. A pilot project in a narrow channel, funded by a regional government, installed four turbines in 2016. Two were removed after eighteen months because of damage, but the remaining pair has produced electricity continuously since then. Local fishermen initially objected, fearing that the turbines would harm fish, but monitoring so far has recorded no significant change in fish numbers near the site. Supporters argue that costs will fall as designs improve, whereas critics say that the technology will remain too costly to compete with offshore wind.

1. Tidal energy is easier to forecast than wind energy. {{blank}}
2. All four turbines of the pilot project are still operating. {{blank}}
3. The pilot project was paid for by the national government. {{blank}}
4. Monitoring has confirmed the fishermen's fears about fish. {{blank}}
5. The turbines were installed before 2017. {{blank}}
6. The pilot channel is in northern Europe. {{blank}}
'''
explanation = '''
1. TRUE: "tides are far more predictable than wind or sunlight".
2. FALSE: "Two were removed… the remaining pair", so only two are left.
3. FALSE: "funded by a regional government", not the national government.
4. FALSE: "no significant change in fish numbers".
5. TRUE: installed in 2016, i.e. before 2017.
6. NOT GIVEN: the passage does not give the canal's geographical location.
'''

[questions.ir-021]
prompt = '''
Do the following statements agree with the information in the passage? Write **TRUE** if the statement agrees, **FALSE** if it contradicts, **NOT GIVEN** if there is no information. (Enter `true`, `false` or `not given`.)

**Reading for pleasure**

A survey of 600 adults in a mid-sized city, carried out by the local library network, found that people who read for pleasure at least twice a week were more likely to report feeling relaxed at the end of the day. The finding does not prove that reading causes relaxation: the survey authors noted that people with less stressful jobs may simply have more time to read. Printed books remained more popular than e-books among respondents over fifty, but the difference almost disappeared among those under thirty. Surprisingly, the share of respondents who borrowed books from the library was higher among the young than the old. The authors recommended that libraries expand their digital lending, although they accepted that the survey only covered one city.

1. The survey included 600 respondents. {{blank}}
2. The authors state that reading causes relaxation. {{blank}}
3. Among those under thirty, printed books were far more popular than e-books. {{blank}}
4. Younger respondents were more likely to borrow from the library than older ones. {{blank}}
5. Libraries have already expanded their digital lending. {{blank}}
6. The survey was carried out by a national university. {{blank}}
'''
explanation = '''
1. TRUE: "A survey of 600 adults".
2. FALSE: "does not prove that reading causes relaxation".
3. FALSE: "the difference almost disappeared among those under thirty".
