> **E** Public policy has also played a part. A number of governments have begun to treat night trains as part of their climate strategy, offering subsidies for new rolling stock or reducing track-access charges for overnight services. Critics argue that such support is difficult to justify when the number of passengers carried is small compared with commuter railways, which serve millions of people every week. Supporters reply that the relevant comparison is not with commuter trains but with the flights that night trains replace; measured against the emissions avoided, they claim, the subsidy per tonne of carbon is modest.
