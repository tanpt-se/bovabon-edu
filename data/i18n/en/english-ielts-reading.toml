[questions.ir-118]
prompt = '''
Complete the sentence. Choose **ONE WORD ONLY** from Reading Passage 2. (Write in lowercase.)

> **Reading Passage 2 – Cooling the City** (fictional text for practice)
>
> **A** On a still summer afternoon, the centre of a large city can be several degrees warmer than the farmland that surrounds it. This phenomenon, known as the urban heat island, has been recognised for more than a century, but it has only recently moved from the pages of climate journals into the agendas of city councils. The reason is partly demographic: more than half of the world's population now lives in urban areas, and heatwaves are becoming both more frequent and more intense. It is also political, since a single severe heatwave can now fill hospital wards and dominate local news for weeks.
>
> **B** The causes of the effect are well understood. Asphalt, concrete and dark roofing materials absorb sunlight during the day and release it slowly at night, so that cities cool down far less after sunset than the countryside does. Tall buildings trap heat between them and reduce the wind that might otherwise carry it away, while air-conditioning units, vehicles and industry add heat of their own. Crucially, the lack of vegetation means that cities lose the cooling that plants provide when water evaporates from their leaves.
>
> **C** Of the many remedies proposed, the simplest is to change the colour of surfaces. Light-coloured or "cool" roofs reflect a greater proportion of incoming sunlight, and a trial in the city of Marrowfield found that painting the roofs of 400 low-rise buildings white reduced the indoor temperature of top-floor flats by an average of 2.1°C on the hottest days. The same trial, however, recorded an unexpected side effect: in winter, residents of the treated buildings used slightly more energy for heating, as their roofs now absorbed less of the weak winter sun.
>
> **D** Trees offer benefits that paint cannot. Besides shading pavements and walls, they cool the air through evaporation, absorb some pollutants and, according to several studies, improve the mental well-being of people who live near them. But trees are slow to establish, and in dense neighbourhoods there is often no room for them; underground pipes and cables restrict where roots can grow. Planners in Marrowfield estimated that a newly planted street tree takes around fifteen years to deliver its full cooling effect, a timescale that sits uneasily with the electoral cycles of local politicians.
>
> **E** Perhaps the most contested question is who benefits. Researchers mapping surface temperatures across Marrowfield found that the hottest districts were also those with the lowest household incomes, a pattern they attributed to decades of decisions that placed parks in wealthier areas and industry in poorer ones. When the city launched its tree-planting scheme, early plantings were concentrated in neighbourhoods whose residents had been most active in requesting them, which tended to be the cooler, more affluent ones. Only after a revision of the scheme, which allocated trees according to measured temperature rather than requests, did planting reach the districts that needed it most.
>
> **F** None of these measures, on its own, will make a city comfortable during an extreme heatwave. Experts increasingly argue that heat should be managed in the way cities already manage floods: by combining long-term changes to the physical environment with short-term emergency plans, such as public cooling centres and checks on elderly residents living alone. The aim is not to eliminate urban heat, which is impossible, but to reduce the number of people for whom a hot week becomes a medical emergency.

**Sentence:** Cities stay warm after sunset because materials such as asphalt and concrete give out the heat they have absorbed {{blank}}.
'''
explanation = '''
Paragraph B: *absorb sunlight during the day and release it slowly at night*. *Give out* is a paraphrase of *release*; the gap needs an adverb of manner.
'''

