[modules.typescript-dv-declarations]
title = "Declaration Files and Library Types"
description = "Read, write, and publish types for JavaScript or packages without type declarations."
lesson = '''
### Describe a runtime API without rewriting its implementation
A declaration file has the `.d.ts` extension and gives the compiler type information about existing JavaScript, external packages, or a published API. Declarations such as `declare function`, `declare class`, and `declare module` do not create a JavaScript implementation. A declaration can therefore be syntactically valid but still misrepresent the real API, allowing callers to write code that fails without a compiler warning.

| Need | Common declaration approach | Scope |
|---|---|---|
| Describe a package with modules | Export its functions, classes, or types | Callers import from the module |
| Describe an untyped JavaScript package | Ambient module for the exact module specifier | Import that package name |
| Describe a global variable | Declare it in an appropriate script declaration | Project-wide global scope |
| Extend an existing API | Module augmentation or `declare global` | Extend an existing declaration |
| Publish types with a library | Generate or package declarations matching the entry point | Library consumers |

A declaration file without a top-level `import` or `export` is usually treated as a script, so declarations may be in the global scope. When a file has an import or export, it becomes a module; use `declare global` if that module needs to add a global declaration. A module augmentation must target the module consumers actually import; it does not create a runtime implementation and cannot add every kind of declaration arbitrarily.

Example declaration for an untyped JavaScript library:
~~~ts
declare module "legacy-format" {
  export function formatDate(value: Date): string;
}
~~~

When publishing a package, declarations must match the JavaScript exports, parameters, overloads, and return values exactly. Package configuration and module resolution must also let the compiler find the declaration at the actual entry point. For a project's own JavaScript, `tsc` declaration emit can generate types instead of maintaining a handwritten copy.

Common mistakes include using overly broad `any` to silence errors, mixing global declarations into the wrong module scope, or copying an imagined API that does not exist at runtime. Check the actual source or API documentation, try the declaration in a small consumer project, and update it alongside implementation changes. Declarations do not replace validation of data received from a network or user.
'''

[questions.typescript-dv017]
prompt = "What is the main role of a `.d.ts` file in a JavaScript package?"
options = ["Describe the API and types so the compiler can check callers, without providing a runtime implementation", "Completely replace the JavaScript file when the application runs", "Automatically validate every network input", "Create a JavaScript copy for each type"]
explanation = "A declaration provides a static type contract for an existing implementation; it does not run or check data at runtime."

[questions.typescript-dv018]
prompt = "An application imports a JavaScript package named `legacy-format`, but the compiler cannot find its types. If the package cannot be changed, which declaration approach describes the module?"
options = ["Write an ambient module declaration for the exact module specifier and real exports", "Add any interface to a .ts file", "Change every import to any", "Use declare global for every function in the package"]
explanation = "An ambient module associates a declaration with the exact module specifier so callers can import its types; the declaration must reflect the real runtime exports."

[questions.typescript-dv019]
prompt = "How is a `.d.ts` file with a top-level export or import usually treated?"
options = ["As a module with module scope", "As a global script in every case", "As executable JavaScript", "Ignored when the compiler looks for types"]
explanation = "A top-level import or export makes the file a module. To add a global declaration from it, use the appropriate declare global structure."

[questions.typescript-dv020]
prompt = "When publishing declarations with a library, what matters most for keeping the type contract safe?"
options = ["The declaration must match the real runtime API exports and behavior", "Set every result to any for compatibility", "Declare extra convenience methods even if they do not exist at runtime", "Only check that the .d.ts file is syntactically valid"]
explanation = "The compiler trusts declarations, so a mismatch between the published types and implementation can create errors that static checking will not catch."

[questions.typescript-dv021]
prompt = "Choose the good practices when writing declarations for a JavaScript library."
options = ["Compare declared signatures with the runtime implementation", "Describe exports that consumers can actually import", "Use broad any everywhere to avoid reading the API", "Try the declaration from a consumer project or small example", "Keep declarations aligned as the implementation API changes"]
explanation = "Declarations are contracts trusted by the compiler; they need to match the real API and be checked from a consumer's perspective."

[questions.typescript-dv022]
prompt = "Choose the correct descriptions of declaration scope."
options = ["An ambient module should target the module specifier imported by callers", "declare global can add global declarations from a module using the valid structure", "Module augmentation automatically adds an implementation to JavaScript", "A declaration file can describe an API without implementation code", "A file with a top-level export is still always a global script"]
explanation = "Ambient modules and declare global describe type scope; declarations do not generate runtime code. A top-level export makes a file a module."

[questions.typescript-dv023]
prompt = "The common TypeScript extension for a file that contains only type declarations is {{blank}}."
explanation = "A declaration file commonly uses the .d.ts extension."

[questions.typescript-dv024]
prompt = "A JavaScript package has no types, so a TypeScript application cannot import its API. Describe how you would investigate the cause and create a trustworthy declaration."
keywords = [["declaration file", ".d.ts"], ["runtime api", "implementation"], ["ambient module", "declare module"], ["module specifier"], ["consumer"]]
model_answer = '''First check the module specifier, exports, and the package's real runtime API. If the package has no types, create a declaration file or ambient module for the exact module name and describe its actual exports instead of using broad `any`. Then test it from a small TypeScript consumer to confirm module resolution finds the declaration and its signatures match the implementation; update the declaration when the runtime API changes.'''
explanation = "Distinguish a module lookup problem from a missing declaration, then make sure the type contract reflects the actual package."
