explanation = "override clarifies intent and catches a method name that does not exist on the base class; it does not call super automatically."

[questions.typescript-dv013]
prompt = "Choose the correct descriptions of class members."
options = ["A member is public by default when no other modifier is given", "A static member belongs to the constructor rather than each instance", "A parameter property can declare a field from a constructor parameter", "implements automatically adds missing methods to a class", "A class creates both an instance type and a constructor value at runtime"]
explanation = "Public is the default; static members live on the class constructor; a parameter property abbreviates a field declaration; a class has both a type and a value side. implements only checks compatibility."

[questions.typescript-dv014]
prompt = "Choose the correct statements about access control and inheritance."
options = ["TypeScript private does not provide the same runtime protection as #field", "protected allows a subclass to access a member under static checking", "readonly automatically calls Object.freeze on an instance", "override lets the compiler check for a member on the base class", "Both extends and implements provide an implementation from a parent type"]
explanation = "TypeScript private and protected are mainly static restrictions; #field provides runtime protection. readonly does not freeze an object, and only extends inherits implementation."

[questions.typescript-dv015]
prompt = '''Which keyword makes it clear that a subclass member intentionally overrides a member of its base class?
~~~ts
class Child extends Parent {
  {{blank}} save(): void {}
}
~~~'''
explanation = "override communicates intent and lets the compiler report an error if there is no corresponding member in the base class."

[questions.typescript-dv016]
prompt = "In an interview, compare an interface with an abstract class when designing contracts for different services."
keywords = [["interface"], ["abstract class"], ["implementation"], ["state"], ["multiple", "multiple contracts", "multiple interfaces"]]
model_answer = '''An interface describes a structural contract that multiple classes can implement; it carries no runtime implementation or state. An abstract class fits when services need to share state, a constructor, or common implementation while leaving abstract parts for subclasses to complete. A class can implement multiple interfaces, while inheriting implementation from a class is best when that relationship has clear meaning.'''
explanation = "Choose based on whether behavior and state need to be shared, rather than using inheritance just to reuse a few lines of code."

[questions.typescript-dvc02]
title = "Counter with Private State"
