[modules.typescript-dv-classes]
title = "Classes, Inheritance, and Encapsulation"
description = "Design TypeScript classes, interface contracts, inheritance, and access control."
lesson = '''
### A class provides both an instance type and a runtime value
A class declaration creates a constructor used at runtime and a type that describes its instances. TypeScript checks members, parameters, and method return types before emitting JavaScript. A class can implement multiple interfaces to check structural contracts; `implements` does not add methods or fields and does not validate objects at runtime. `extends` inherits implementation and state from a base class, so a subclass constructor must initialize the base class according to JavaScript rules.

| Member or keyword | Main meaning | Runtime protection? |
|---|---|---|
| `public` | A publicly accessible member; this is the default | No |
| TypeScript `private` | Restricts access during static checking | No |
| `#field` | A JavaScript private field | Yes |
| `protected` | Access within the class and subclasses under static checking | No |
| `abstract` | Defines a contract or base implementation | An abstract class cannot be instantiated directly |
| `override` | Requires a matching member in the base class | Primarily static checking |

A class can also declare static members on the constructor rather than on instances, accessors to control reading and writing, and parameter properties that declare a field from a constructor parameter. `readonly` prevents assignment through the type after initialization according to TypeScript rules, but it does not create runtime immutability. The `noImplicitOverride` option helps catch a subclass method whose name accidentally fails to match the method it was meant to override.

Example:
~~~ts
interface Clock { now(): number }
class SystemClock implements Clock {
  now(): number { return Date.now(); }
}
~~~

Common mistakes include assuming `implements` generates code, treating TypeScript `private` as a JavaScript private field, or accessing a static member through an instance. Use `#field` for encapsulation enforced by JavaScript; TypeScript `private` may be sufficient when only the project API needs a static restriction. Deep inheritance increases coupling, so interfaces and composition are often easier to replace when shared implementation is not needed.
'''

[questions.typescript-dv009]
prompt = '''~~~ts
interface Serializable { serialize(): string }
class Report implements Serializable {
  serialize() { return "ok"; }
}
~~~
What does `implements` do in this example?'''
options = ["Statically checks that Report satisfies the Serializable contract", "Generates serialize if the class does not have it", "Creates a separate Serializable object at runtime", "Requires Report to inherit an implementation from the interface"]
explanation = "implements requires the class to be compatible with the interface during type checking; the interface does not provide a runtime implementation."

[questions.typescript-dv010]
prompt = "What is an important difference between a TypeScript `private` property and a private field written with `#`?"
options = ["TypeScript private is mainly checked statically, while # is enforced by JavaScript at runtime", "# can only be used on an interface", "TypeScript private always emits a WeakMap", "Both approaches provide the same runtime protection"]
explanation = "TypeScript private does not create JavaScript privacy; #field is runtime syntax whose access is restricted by the engine."

[questions.typescript-dv011]
