- `reset()` sets the state to 0.'''
explanation = "A JavaScript private field preserves a runtime invariant; the class also groups related state and behavior."
hints = ["Store the state in #value and expose it for reading only through a getter.", "Check Number.isInteger and the lower bound before updating the state."]

[modules.typescript-dv-declarations]
title = "Declaration Files and Library Types"
description = "Read, write, and publish types for JavaScript or packages without type declarations."
lesson = '''
### Describe a runtime API without rewriting its implementation
A declaration file has the `.d.ts` extension and gives the compiler type information about existing JavaScript, external packages, or a published API. Declarations such as `declare function`, `declare class`, and `declare module` do not create a JavaScript implementation. A declaration can therefore be syntactically valid but still misrepresent the real API, allowing callers to write code that fails without a compiler warning.

| Need | Common declaration approach | Scope |
|---|---|---|
| Describe a package with modules | Export its functions, classes, or types | Callers import from the module |
| Describe an untyped JavaScript package | Ambient module for the exact module specifier | Import that package name |
| Describe a global variable | Declare it in an appropriate script declaration | Project-wide global scope |
| Extend an existing API | Module augmentation or `declare global` | Extend an existing declaration |
| Publish types with a library | Generate or package declarations matching the entry point | Library consumers |

A declaration file without a top-level `import` or `export` is usually treated as a script, so declarations may be in the global scope. When a file has an import or export, it becomes a module; use `declare global` if that module needs to add a global declaration. A module augmentation must target the module consumers actually import; it does not create a runtime implementation and cannot add every kind of declaration arbitrarily.

Example declaration for an untyped JavaScript library:
~~~ts
declare module "legacy-format" {
  export function formatDate(value: Date): string;
}
~~~

When publishing a package, declarations must match the JavaScript exports, parameters, overloads, and return values exactly. Package configuration and module resolution must also let the compiler find the declaration at the actual entry point. For a project's own JavaScript, `tsc` declaration emit can generate types instead of maintaining a handwritten copy.

Common mistakes include using overly broad `any` to silence errors, mixing global declarations into the wrong module scope, or copying an imagined API that does not exist at runtime. Check the actual source or API documentation, try the declaration in a small consumer project, and update it alongside implementation changes. Declarations do not replace validation of data received from a network or user.
'''

[questions.typescript-dv017]
prompt = "What is the main role of a `.d.ts` file in a JavaScript package?"
options = ["Describe the API and types so the compiler can check callers, without providing a runtime implementation", "Completely replace the JavaScript file when the application runs", "Automatically validate every network input", "Create a JavaScript copy for each type"]
explanation = "A declaration provides a static type contract for an existing implementation; it does not run or check data at runtime."

[questions.typescript-dv018]
prompt = "An application imports a JavaScript package named `legacy-format`, but the compiler cannot find its types. If the package cannot be changed, which declaration approach describes the module?"
options = ["Write an ambient module declaration for the exact module specifier and real exports", "Add any interface to a .ts file", "Change every import to any", "Use declare global for every function in the package"]
explanation = "An ambient module associates a declaration with the exact module specifier so callers can import its types; the declaration must reflect the real runtime exports."

[questions.typescript-dv019]
prompt = "How is a `.d.ts` file with a top-level export or import usually treated?"
options = ["As a module with module scope", "As a global script in every case", "As executable JavaScript", "Ignored when the compiler looks for types"]
explanation = "A top-level import or export makes the file a module. To add a global declaration from it, use the appropriate declare global structure."

[questions.typescript-dv020]
prompt = "When publishing declarations with a library, what matters most for keeping the type contract safe?"
options = ["The declaration must match the real runtime API exports and behavior", "Set every result to any for compatibility", "Declare extra convenience methods even if they do not exist at runtime", "Only check that the .d.ts file is syntactically valid"]
explanation = "The compiler trusts declarations, so a mismatch between the published types and implementation can create errors that static checking will not catch."

[questions.typescript-dv021]
prompt = "Choose the good practices when writing declarations for a JavaScript library."
options = ["Compare declared signatures with the runtime implementation", "Describe exports that consumers can actually import", "Use broad any everywhere to avoid reading the API", "Try the declaration from a consumer project or small example", "Keep declarations aligned as the implementation API changes"]
explanation = "Declarations are contracts trusted by the compiler; they need to match the real API and be checked from a consumer's perspective."

[questions.typescript-dv022]
prompt = "Choose the correct descriptions of declaration scope."
options = ["An ambient module should target the module specifier imported by callers", "declare global can add global declarations from a module using the valid structure", "Module augmentation automatically adds an implementation to JavaScript", "A declaration file can describe an API without implementation code", "A file with a top-level export is still always a global script"]
explanation = "Ambient modules and declare global describe type scope; declarations do not generate runtime code. A top-level export makes a file a module."

[questions.typescript-dv023]
prompt = "The common TypeScript extension for a file that contains only type declarations is {{blank}}."
explanation = "A declaration file commonly uses the .d.ts extension."

[questions.typescript-dv024]
prompt = "A JavaScript package has no types, so a TypeScript application cannot import its API. Describe how you would investigate the cause and create a trustworthy declaration."
keywords = [["declaration file", ".d.ts"], ["runtime api", "implementation"], ["ambient module", "declare module"], ["module specifier"], ["consumer"]]
model_answer = '''First check the module specifier, exports, and the package's real runtime API. If the package has no types, create a declaration file or ambient module for the exact module name and describe its actual exports instead of using broad `any`. Then test it from a small TypeScript consumer to confirm module resolution finds the declaration and its signatures match the implementation; update the declaration when the runtime API changes.'''
explanation = "Distinguish a module lookup problem from a missing declaration, then make sure the type contract reflects the actual package."
[modules.typescript-lead]
title = "The Tech Lead View"
description = "Deciding on strictness, migration, monorepos, API contracts, and type conventions at team scale."
lesson = '''
### Type-system decisions are decisions about people and cost

In a lead role, the question is rarely "how does this TypeScript feature work" but "for this team, this deadline, this codebase, where do we invest in type checking to remove the most errors at the lowest cost". Every technical choice must come with: who has to learn it, who gets slowed down, the risk if it goes wrong, and how to roll back.

### Decision framework

1. State the real constraints: headcount, TypeScript experience, deadline, tolerance for production errors, existing CI.
2. List 2-3 feasible options, including "do nothing".
3. Choose the smallest rollout unit that can be measured (one package, one folder, one compiler flag).
4. Set success criteria and a stopping point (for example, implicit `any` count dropping weekly).
5. Record it in an ADR so the next person understands why.

| Decision | Safe option for a large team | Risky option | Signal it is time to change |
|---|---|---|---|
| Turning on `strict` for old code | Enable per package/folder, one sub-flag at a time (`noImplicitAny` first), block new code | Turn on repo-wide at once, thousands of errors | The team stops fixing type errors and just adds `any` |
| Splitting packages in a monorepo | Project references + `composite`, incremental builds | One giant `tsconfig`, type-checking the whole repo on every commit | CI type-check exceeds its time budget |
| Types for the API | Generate types from OpenAPI/schema, validate at runtime at the boundary | Hand-write interfaces then force them with assertions | The backend changes and the frontend breaks in production |
| Sharing types across packages | Small, stable, versioned type packages | Cross-importing internal files | A small change triggers rebuilds of many packages |
| Team conventions | A few rules backed by lint (`no-explicit-any`, `consistent-type-imports`) | A long document nobody reads | Reviews keep re-arguing the same topic |

### Type review checklist at team scale

- Where does data enter from outside (HTTP, storage, message queue)? Does it have runtime validation, or only assertions?
- Does the package's public API have an explicit return type to avoid accidentally exposing a complex inferred type?
- Are there new `any` or `@ts-ignore`, and does every `@ts-expect-error` carry a reason?
- Do complex types (nested conditional, mapped) significantly increase check time, and can anyone maintain them?
- Does the change break consumers in other packages (a type change is a breaking change too)?

### Short ADR example

```
Title: Enable noImplicitAny per package
Context: 400k lines of mixed JS/TS, 12 devs, two-week release cadence.
Decision: New packages must be strict; existing packages enable noImplicitAny when touched; track error counts weekly.
Consequences: Slower progress but releases are not blocked; need lint to block new any.
Rejected: Turn on the whole repo (would freeze features for 2 sprints).
```

### Anti-patterns at team scale

- Adding `any` or `@ts-ignore` to get CI green and never coming back: type debt compounds with interest.
- A type so clever only one person understands: bus factor of 1, unreadable error messages.
- One big migration with no stopping point: the team burns out and the long-lived branch conflicts constantly.
- Trusting static types as proof that data is correct: TypeScript is erased at runtime, so the system boundary still needs validation.
- Standardizing by decree instead of tooling: rules not enforced by lint/CI get skipped under deadline pressure.

General principle: changing the tool's default (compiler option, lint, template package) is more effective than relying on people to remember rules; measure before and after to prove value to both the team and management.
'''

[questions.typescript-lv001]
prompt = "A 300k-line mixed JS/TS codebase, 10 devs, releasing every two weeks. Turning on `strict: true` repo-wide raises about 4,000 errors. You want to reduce null/undefined-related production errors without stopping feature work. Which approach do you choose?"
options = ["Turn on sub-flags per package, starting with `strictNullChecks` for low-dependency packages, block new violations in CI, and track error counts weekly", "Turn on `strict` repo-wide and freeze features until all errors are fixed", "Keep the current configuration and only ask devs to be careful during review", "Add `// @ts-nocheck` to every file with errors, then turn on `strict` repo-wide"]
explanation = "Rolling out in small, measurable units keeps release speed while preventing new debt. A feature freeze costs the business and risks long-branch conflicts; careful review without enforcement is not durable; ts-nocheck hides errors and makes strict meaningless."

[questions.typescript-lv002]
prompt = "A monorepo with 8 packages: whole-repo CI type-check takes 14 minutes and devs complain. The budget is two weeks of one person's time, and you do not want to change the bundler. Which direction is most reasonable?"
options = ["Switch to project references with `composite` and incremental builds (`tsc -b`), so only the changed package and its dependents are re-checked", "Remove type-check from CI and run it only on dev machines", "Merge all packages into a single `tsconfig` so the compiler optimizes globally", "Replace every type with `any` in shared packages"]
explanation = "Project references split the build graph, enabling incremental builds and caching, which fits a small budget. Removing type-check from CI lets errors reach main; one tsconfig is exactly why it is slow; any suppresses errors without reducing cost and loses type safety."

[questions.typescript-lv003]
prompt = "Frontend and backend are two different teams, and API fields change without notice. The frontend hand-writes interfaces and casts `response.json() as Order`. The backend team already has an OpenAPI spec updated per release. Which decision is most advantageous?"
options = ["Generate types from the OpenAPI spec in CI and validate responses at the boundary with runtime schema for important endpoints", "Keep writing interfaces by hand but add comments to remind updates", "Use `any` for all responses so the frontend is not blocked when the backend changes", "Ask the backend to import the frontend's interface files directly"]
explanation = "Generating types from a shared source of truth detects contract mismatches at build time, while runtime validation catches real mismatches at runtime. Comments are not enforced; any drops all protection; making the backend depend on the frontend reverses contract ownership."

[questions.typescript-lv004]
prompt = "You set type-review conventions for a 15-person team and want to limit emotional arguments. Which measures are appropriate?"
options = ["Enforce via lint/CI (for example, ban new explicit `any`, use `consistent-type-imports`) instead of only documentation", "Require `@ts-expect-error` to carry a reason and ticket", "Let each dev choose their own conventions within their package", "Keep the convention list short, covering only rules that clearly affect bugs or read time"]
explanation = "Rules enforced by machines, documented with reasons, and kept short are durable under deadline pressure. Everyone having their own conventions makes the codebase hard to read and turns review into repeated arguments."

[questions.typescript-lv005]
prompt = "A 5-dev startup needs to ship a customer feature in 6 weeks; the 60k-line JavaScript codebase has no TypeScript yet. Which decision is most reasonable?"
options = ["Enable `allowJs` and `checkJs` for important areas, write new files in TypeScript, use JSDoc for old code when touched, and do not run a separate migration", "Stop features for 3 weeks to convert everything to TypeScript strict", "Do not use TypeScript because the team is too small", "Outsource the whole conversion and merge it all on the last day"]
explanation = "Gradual migration along small boundaries suits a small team and a tight deadline. Stopping for 3 weeks eats half the time budget; dropping TypeScript forgoes compounding benefits; one final merge is a large risk and causes conflicts."

[questions.typescript-lv006]
prompt = "A senior dev writes a 5-level nested conditional/mapped type set for a form builder. It works, but error messages run hundreds of lines, only the author understands them, and the package's check time doubles. How do you handle it?"
options = ["Simplify the API: keep public types clear, reduce inference layers, add type tests and docs; accept being less 'clever'", "Keep it because correct is enough, measure later", "Delete all the types and use `any`", "Ban all conditional types company-wide"]
explanation = "Types must be maintainable by the whole team; error-reading cost and compile time are real costs. Keeping it creates a bus factor of 1; any loses safety; an absolute ban overreacts since conditional types have legitimate uses."

[questions.typescript-lv007]
prompt = "For a package in a monorepo to be referenced by other packages via project references, its tsconfig must enable the `{{blank}}` option."
blanks = [['composite']]
explanation = "`composite` enforces the required constraints (declaration, rootDir...) so `tsc -b` can build incrementally and projects can reference each other."

[questions.typescript-lv008]
prompt = "Two teams share the type package `@acme/types`. Team A often renames fields and releases without notice, breaking team B's build. Which measure fixes the root cause without blocking team A?"
options = ["Treat public type changes as API changes: semver versioning, a changelog, and breaking-change checks in CI before publishing", "Have team B pin an old version forever", "Copy the types into both repos", "Make every field optional so errors disappear"]
explanation = "Public types are a contract; versioning and breaking-change checks make changes transparent. Pinning forever leaves team B behind; copying causes drift and duplication; optionalizing hides errors and devalues the types."

[questions.typescript-lv009]
prompt = "While enabling `strict` gradually, devs start adding `any` and `@ts-ignore` to pass CI. Which lead reactions are reasonable?"
options = ["Measure the count of `any`/`@ts-ignore` over time and set a decreasing budget", "Block new `@ts-ignore`, allow `@ts-expect-error` with a reason because it reports when the error is gone", "Completely ban type errors and make devs stay until all are fixed", "Find common causes (missing library types, weak type helpers) and fix them at the source"]
explanation = "Measuring, replacing `@ts-ignore` with reasoned `@ts-expect-error`, and fixing root causes gradually reduce type debt. Making devs stay to fix everything causes burnout and pushes them toward worse workarounds."

[questions.typescript-lv010]
prompt = "A 12-person team wants to enable `strict` for a 400k-line codebase running in production. Write a short proposal (ADR style): rollout, measurement, risks, and rejected options."
keywords = [['per package', 'per phase', 'gradual', 'incremental'], ['ci', 'lint', 'block new code'], ['measure', 'track', 'metric'], ['risk', 'freeze', 'rollback']]
model_answer = "Roll out gradually per package: new packages require `strict`; old packages enable sub-flags such as `noImplicitAny` then `strictNullChecks` as people touch them. CI and lint block new violations so debt does not grow. Track metrics weekly: remaining type errors and the count of `any` and `@ts-expect-error`, to prove progress. The main risk is devs dodging errors with `any`, so set a decreasing budget and allow rolling back flags for packages that block releases. Rejected option: turning on the whole repo at once and freezing features, because the business cost is high and a long-lived branch conflicts constantly."
explanation = "A good proposal ties the decision to constraints (team, release, risk), includes measurement points, and states clearly why the alternatives are worse in this context."

[questions.typescript-lv011]
prompt = "A service receives webhooks from a partner and typed the payload as `Payload` using `as Payload`. After an incident the partner sent the `amount` field as a string, causing a wrong payment. Budget: 3 days, no wish to add a large library. Which action comes first?"
options = ["Receive the body as `unknown`, write a centralized validate function at the boundary (or use an existing schema validator), and return 4xx for bad data", "Change the `amount` type to `string | number` everywhere in the codebase", "Enable the `strictNullChecks` compiler flag", "Catch errors with `try/catch` in every handler and ignore them"]
explanation = "The bug is at the untrusted data boundary; static types are erased at runtime, so runtime validation is needed in one place. Widening the type spreads the bug everywhere; strictNullChecks does not address value type errors; swallowing errors hides the incident."

[questions.typescript-lv012]
prompt = "CI type-check for a 200k-line app takes 9 minutes and slows PRs. The team has only 1 day to improve. Which low-risk option gives immediate results?"
options = ["Enable `incremental` with a `.tsbuildinfo` cache preserved between CI runs, and `skipLibCheck` if not already on", "Turn off all type-checking on PRs and run it only at release", "Rewrite the whole project to project references in one day", "Turn every complex type into `any`"]
explanation = "incremental and caching are small, low-risk configuration changes that greatly reduce repeated runs. Turning off checks on PRs lets errors reach main; project references is the right long-term direction but too large for one day; any loses checking value."

[questions.typescript-lv013]
prompt = "The team has many devs new to TypeScript who often use `as` to make errors disappear. The lead wants to reduce this habit without being seen as harsh. Which measure is most reasonable?"
options = ["Add lint warnings for unnecessary assertions, teach narrowing/type guards through code review with examples, and provide a shared validate helper", "Ban `as` completely in all cases", "Ignore it because working code is enough", "Only the lead may write complex typed code"]
explanation = "Combining tooling, teaching with real examples, and easy helpers changes behavior without creating barriers. An absolute ban makes devs dodge other ways; ignoring it accumulates debt; monopolizing types creates a bottleneck and bus factor."

[questions.typescript-lv014]
prompt = "A project depends on a JS library with no types, used in 40 places. Two options: write full declarations (3 days) or declare an empty `declare module 'lib'` (10 minutes). The library handles money calculations. What do you choose?"
options = ["Write declarations for the API actually used, verify against the real source, and put them in the repo's `types/` folder; extend as needed", "Use an empty `declare module 'lib'` so everything is `any`", "Drop the library and rewrite it entirely", "Cast `as any` at every call site"]
explanation = "For important functionality like money math, typing the parts actually used is a good cost/safety balance. Empty declarations make everything any; rewriting the library is costly and risky; as any scatters the hole across 40 places."

[questions.typescript-lv015]
prompt = "You design a shared type package for an 8-package monorepo. Which decisions reduce risk?"
options = ["Keep the package small, containing only stable types, with a clear owner", "Allow other packages to import internal files directly for convenience", "Set `declaration` and `composite` so consumers use built types", "Check breaking changes of public types in CI"]
explanation = "A small owned package with built types and breaking-change checks keeps boundaries clear. Importing internal files breaks encapsulation, so even small changes break many places."

[questions.typescript-lv016]
prompt = "When you must suppress a type error, you should use `// @{{blank}}` with a reason, because the compiler reports an error if that line no longer has an error."
blanks = [['ts-expect-error']]
explanation = "`@ts-expect-error` reports itself once the error is fixed, so it does not leave a meaningless stale directive like `@ts-ignore`."

[questions.typescript-lvc01]
title = "Choose the next package to migrate"
prompt = '''The team migrates to `strict` package by package. Write a function nextPackage(packages) that chooses the next package to work on.
Each package has the form { name, errors, deps, done }, where deps is an array of package names it depends on.
- Only consider packages not done whose every dep is done.
- Among those, choose the package with the fewest errors; if tied, choose alphabetically by name.
- Return the package name, or null if no package qualifies.
'''
explanation = "Choosing migration order by dependency graph means each step unlocks the next package; prioritizing few errors gives early results and builds team momentum."
hints = ["Build a Set of done package names for fast dep checks.", "Filter then sort by errors, then by name."]

[questions.typescript-lv017]
prompt = "The team considers switching from `tsc` to a fast transpiler (esbuild/swc) for builds while keeping `tsc --noEmit` for type checking. What must you confirm before deciding?"
options = ["Whether the codebase uses TypeScript features that need type information to emit code (like cross-file `const enum`, `isolatedModules`), and that type-check still runs in CI", "A fast transpiler type-checks like tsc, so type-check can be dropped", "Only comparing build speed is needed", "It is guaranteed to be 100% compatible with every tsconfig configuration"]
explanation = "A transpiler only erases types, does not type-check, and works per-file, so it needs `isolatedModules` and must avoid features depending on cross-file information. Comparing only speed or assuming full compatibility ignores risk."

[questions.typescript-lv018]
prompt = "Frontend and backend belong to two teams; API fields change frequently causing production errors. Describe how you design a process to keep types in sync on both sides, and state the trade-offs."
keywords = [['openapi', 'schema', 'contract'], ['codegen', 'generate'], ['validation', 'runtime'], ['ci', 'breaking change', 'version']]
model_answer = "Take the API contract (OpenAPI or schema) as the shared source of truth. Use codegen to generate frontend types whenever the spec changes, and CI to flag breaking changes when the spec changes incompatibly or generated types break the build. Static types are erased at runtime, so for important endpoints add runtime validation at the boundary to catch drifted data. Trade-offs: maintaining the spec and codegen pipeline costs effort, and runtime validation adds runtime cost; in return, production errors decrease and team arguments are reduced."
explanation = "A good answer states the shared source of truth, CI automation, and runtime validation, and accepts operational cost instead of relying on verbal convention."

[questions.typescript-lv019]
prompt = '''~~~ts
type ElementOf<T> = T extends (infer U)[] ? U : never;
type A = ElementOf<string[] | number>;
~~~
What is type `A`?'''
options = ["string", "string | number", "string | never, that is string", "never"]
explanation = "Conditional types distribute over unions when the type parameter is bare: `string[]` yields `string`, `number` does not match so yields `never`; `string | never` simplifies to `string`."

[questions.typescript-lv020]
prompt = '''~~~ts
type IsString<T> = [T] extends [string] ? "yes" : "no";
type R = IsString<string | number>;
~~~
What is type `R`, and why is `[T]` wrapped?'''
options = ["\"no\", because wrapping in a tuple disables distribution so the whole union is compared to string once", "\"yes\" | \"no\", because tuple wrapping still distributes", "\"yes\", because one component is string", "never"]
explanation = "Without wrapping, a conditional type distributes and yields `\"yes\" | \"no\"`. Wrapping `[T]` makes a non-bare type, so `string | number` is checked once and does not extends string."

[questions.typescript-lv021]
prompt = '''~~~ts
interface Animal { name: string }
interface Dog extends Animal { bark(): void }
type Handler<T> = (value: T) => void;
declare let handleAnimal: Handler<Animal>;
declare let handleDog: Handler<Dog>;
handleDog = handleAnimal; // (1)
handleAnimal = handleDog; // (2)
~~~
With `strictFunctionTypes` on, which line is valid?'''
options = ["Only (1): function parameters are contravariant", "Only (2): function parameters are covariant", "Both", "Neither"]
explanation = "A function accepting Animal can handle any Dog, so assigning it to Handler<Dog> is safe. The reverse is unsafe because handleDog may call bark() on an arbitrary Animal."

[questions.typescript-lv022]
prompt = '''~~~ts
