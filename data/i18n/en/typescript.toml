~~~
What keys does `G` have?'''
options = ["getId and getName", "id and name", "Only one key named get", "No keys because mapped types do not rename keys"]
explanation = "The `as` clause in mapped types renames keys; `Capitalize` capitalizes the first letter, turning `id` into `getId`."

[questions.typescript-lv023]
prompt = "The team wants to avoid confusing `UserId` with `OrderId` (both are strings) without runtime cost. Which approach is suitable?"
options = ["Branded type: `type UserId = string & { readonly __brand: \"UserId\" }` together with a constructor function with checks", "Declare `type UserId = string` and `type OrderId = string`", "Use a string `enum` for all ids", "Use `any` then name variables clearly"]
explanation = "Two string aliases are still assignable to each other because TypeScript is structural. Branded types create nominal typing that exists only at compile time; the constructor is the only place for coercion and validation."

[questions.typescript-lv024]
