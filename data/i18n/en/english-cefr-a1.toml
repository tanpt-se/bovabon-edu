[modules.cefr-a1-be-pronouns]
title = "To be, pronouns & possession"
description = "Use be, have got, personal pronouns, possessives, this/that, and singular and plural nouns."
lesson = '''
### The verb *be*
| Subject | Affirmative | Negative | Question |
|---|---|---|---|
| I | I am (I'm) | I am not (I'm not) | Am I…? |
| you / we / they | are (you're / we're / they're) | aren't | Are you…? |
| he / she / it | is (he's / she's / it's) | isn't | Is he…? |

Put *am/is/are* after the subject to give a name, age, job, or location: *I'm 18. She is a student. They are at home.* In a question, put *be* before the subject: *Are you ready?* Use short answers such as *Yes, I am* or *No, she isn't*; do not repeat the whole sentence.

### Pronouns and possessives
| Subject | Object | Possessive + noun |
|---|---|---|
| I / you | me / you | my / your |
| he / she / it | him / her / it | his / her / its |
| we / they | us / them | our / their |

A subject pronoun names the person or thing doing an action: *He is my brother. I like him.* A possessive comes before a noun: *This is her bag.* Use *'s* with people: *Anna's brother*. Use *have got* to talk about possession: *I have got a bike; he has got two sisters.* Ask *Have you got a pen?*; use *haven't got / hasn't got* for the negative.

### Pointing to things and plural nouns
*This/these* refer to things near the speaker; *that/those* refer to things farther away. Use *this/that* for one thing and *these/those* for more than one: *This is a cup. Those are my shoes.* Most nouns take *-s* in the plural (*books*); add *-es* after some endings, as in *box → boxes*. Remember these irregular forms: *child → children, person → people, man → men, woman → women*.

**Common mistakes:** leaving out *be* (*She very nice* → *She is very nice*); using the wrong form of *be* for the subject (*They is* → *They are*); using *have* instead of *has* with *he/she/it*; using *he* instead of *him* after a verb; writing *two childs* instead of *two children*. Tip: find the subject first, choose the right form of *be* or *has*, then check whether the noun is singular or plural. For age, use *be*: *I am 20*, not *I have 20*.
'''

[questions.cefr-a1-001]
prompt = "Choose the correct word to complete the sentence: **I ___ 18 years old.**"
explanation = "With the subject *I*, use *am* to give your age. English uses *be* in the pattern *I am 18*, not *have*."

[questions.cefr-a1-002]
prompt = "Tom is my friend. **___** is from Hanoi. Choose the subject pronoun."
explanation = "Tom is one male person, so use the subject pronoun *he* before the verb *is*. *Him* is an object pronoun; *his* shows possession."

[questions.cefr-a1-003]
prompt = "Mai ___ two brothers. Choose the correct phrase to say that Mai has two brothers."
explanation = "With *he/she/it* and one person's name, use *has got*. Do not put *is* before *got* in this possession pattern."

[questions.cefr-a1-004]
prompt = "There are several pairs of shoes near the speaker. Choose the correct sentence."
explanation = "*These* is used for more than one nearby thing and goes with *are*. *This/that* go with singular nouns; *those* also goes with *are* but refers to things farther away."

[questions.cefr-a1-005]
prompt = "Choose all the sentences that use pronouns, *be*, and possession correctly."
explanation = "The first three sentences use the possessive and *be* correctly. *He* goes with *is*, and the subject pronoun for the speaker is *I*, not *me*."

[questions.cefr-a1-006]
prompt = "Choose all the correctly written singular → plural pairs."
explanation = "*Children, people,* and *women* are the correct plural forms. *Man* becomes *men*; it does not take *-s*."

[questions.cefr-a1-007]
prompt = "Complete the sentence: **We {{blank}} classmates.**"
explanation = "The subject *we* goes with *are*: *We are classmates.*"

[questions.cefr-a1-008]
prompt = "Complete the sentence with a possessive: **I am Anna. This is {{blank}} sister.**"
explanation = "Use *my* before the noun *sister* to say that she is the speaker's sister."

[questions.cefr-a1-009]
prompt = "Use the correct plural form: **One child, two {{blank}}.**"
explanation = "The irregular plural of *child* is *children*."

[questions.cefr-a1-010]
prompt = "Write three short sentences in English to introduce your name and say where you are from or which city you are from. You may add a sentence saying whether you are a school or university student."
explanation = "An A1 response can use short, separate sentences: give your name with *My name is…*, where you are from with *I am from…*, and a simple fact about yourself."

[modules.cefr-a1-present-simple]
title = "Habits and actions happening now"
description = "Use the present simple, frequency adverbs, can, imperatives, like + V-ing, and the basic present continuous."
lesson = '''
### Present simple: habits and things that are generally true
| Subject | Affirmative | Negative | Question |
|---|---|---|---|
| I / you / we / they | work | don't work | Do they work? |
| he / she / it | works | doesn't work | Does she work? |

Add **-s** to most verbs in the third-person singular: *read → reads*. Add **-es** after some endings, as in *watch → watches, go → goes*; change a consonant + *y* to *-ies*: *study → studies*. After *does/doesn't*, use the base form of the verb: *Does he play? He doesn't play.*

### Frequency, ability, and requests
*Always, usually, often, sometimes,* and *never* usually come before a main verb: *I usually walk to school.* With *be*, the adverb comes after the verb: *She is always kind.* Use *can* + base verb to talk about ability or ask permission: *I can swim. Can I sit here?* Do not add *to* or *-s*: *He can cook.* An imperative starts with the base form of a verb: *Open the door, please.* Add *don't* to tell someone not to do something: *Don't run.* Use *Let's + verb* to suggest doing something together: *Let's eat.*

### Likes and actions happening now
After *like/love/hate*, you can use a noun or an *-ing* verb: *I like music. He likes cooking.* Use the present continuous for an action happening now: **am/is/are + V-ing** — *They are playing now.* Some verbs change their spelling: *make → making, run → running*.

**Common mistakes:** forgetting *-s* (*She work* → *She works*); adding *-s* after *does* (*Does she works?* → *Does she work?*); using *am/is/are* for every sentence (*I am go*); putting *usually* in the wrong position; saying *like read* instead of *like reading*; leaving out *be* in the present continuous. Tip: ask whether something is a habit or happening now. Habits use the present simple; “now/look!” often suggests the present continuous. After *can*, *do/does*, and *don't/doesn't*, always use the base form of the verb.
'''

[questions.cefr-a1-011]
prompt = "Complete the sentence about a routine: **She ___ to school by bus every day.**"
explanation = "With the subject *she* in the present simple, the verb takes *-es*: *goes*. The phrase *every day* shows that this is a routine."

[questions.cefr-a1-012]
prompt = "Choose the correct negative sentence: **I ___ coffee.**"
explanation = "With *I*, use *don't + base verb*. Do not add *-s* after *don't*."

[questions.cefr-a1-013]
prompt = "Choose the correct auxiliary verb: **___ your brother play chess?**"
explanation = "*Your brother* is third-person singular, so a present simple question uses *Does*; the main verb stays in the base form, *play*."

[questions.cefr-a1-014]
prompt = "Choose the correct position and form of the frequency adverb: **We ___ have dinner at 7.**"
explanation = "A frequency adverb usually comes before a main verb: *We usually have dinner*. With *be*, the adverb usually comes after *be*."

[questions.cefr-a1-015]
prompt = "**Can Mai swim? — Yes, ___.** Choose the correct short answer."
explanation = "When the question uses *can*, the short answer also uses *can*: *Yes, she can.* Do not add *-s* to a modal verb."

[questions.cefr-a1-016]
prompt = "Choose all the correct sentences about likes, imperatives, and actions happening now."
explanation = "After *like*, you can use an *-ing* verb; an imperative uses the base form; an action happening now uses *be + V-ing*. Do not use *to* after *can* or *let's*."

[questions.cefr-a1-017]
prompt = "Put the verb in parentheses in the present simple: **My father {{blank}} (work) at a hospital.**"
explanation = "*My father* is third-person singular, so add *-s*: *works*."

[questions.cefr-a1-018]
prompt = "Complete the sentence about an action happening now: **The children {{blank}} football now.** (play)"
explanation = "The subject *the children* goes with *are*; the present continuous uses *are + playing*. The contraction *they're* is also possible."

[questions.cefr-a1-019]
prompt = "Use the verb in parentheses to complete the request: **Please {{blank}} your name here.** (write)"
explanation = "An imperative starts with the base form of the verb: *Please write your name here.*"

[questions.cefr-a1-020]
prompt = "Write three short sentences in English about a typical day for you. Use at least one frequency adverb, such as *usually* or *often*."
explanation = "Use the present simple for routines. An adverb such as *usually* usually comes before a main verb; you can write each activity as a short sentence."

[modules.cefr-a1-nouns-articles]
title = "Nouns, articles & basic questions"
description = "Use a/an/the, some/any, countable and uncountable nouns, there is/are, prepositions, and question words."
lesson = '''
### Nouns and articles
Countable nouns have singular and plural forms: *a chair, two chairs*. Uncountable nouns usually do not take *-s*: *water, rice, money*. A singular countable noun usually needs a word before it.

| Word | Simple use | Example |
|---|---|---|
| a | one thing; the first sound is a consonant | a bag, a university |
| an | one thing; the first sound is a vowel | an apple, an hour |
| the | a specific thing that is known | the door, the book on my desk |

Choose *a/an* by **sound**, not just by the first letter: *an hour* begins with a vowel sound, while *a university* begins with a /y/ sound. *Some* is common in affirmative sentences, and *any* is common in questions and negatives: *There are some eggs. Are there any eggs?*; *There isn't any milk.*

### There is/are, place, and time
| Pattern | Example |
|---|---|
| There is + singular / uncountable noun | There is a shop. / There is some rice. |
| There are + plural noun | There are two chairs. |
| at + time; on + day/date; in + month/year | at 8; on Monday; in June |
| in / on / under / next to / between | in the room; on the table; under the bed |

Use *there is/are* to say that something exists in a place or to say how many things there are. *How many* asks about the number of plural countable nouns (*How many books?*); *How much* asks about an amount of an uncountable noun or a price (*How much water? How much is it?*). Basic question words include *what* (a thing), *where* (a place), *when* (a time), *who* (a person), *how* (the way), *how old*, and *what time*.

**Common mistakes:** leaving out *a/an* before a singular noun (*I have cat*); choosing *a/an* by spelling instead of sound; saying *many money* or *many rice*; using *there are* with *milk*; confusing *in Monday* with *on Monday*. Tip: check whether a noun is one countable thing, several things, or an uncountable substance; then check singular/plural and choose *is/are*. Remember the time phrases *at* for a time, *on* for a day, and *in* for a month.
'''

[questions.cefr-a1-021]
prompt = "Choose the correct article: **I eat ___ apple every morning.**"
explanation = "*Apple* begins with a vowel sound, so use *an*. Choose by the first sound, not just by the first letter."

[questions.cefr-a1-022]
prompt = "This is the first time a book is mentioned. Choose the correct sentence: **There is ___ book on the table.**"
explanation = "Use *a* when introducing a singular countable noun that begins with a consonant sound for the first time."

[questions.cefr-a1-023]
prompt = "Choose the correct verb: **There ___ some milk in the fridge.**"
explanation = "*Milk* is uncountable, so use *there is*. *Some* can be used with an uncountable noun in an affirmative sentence."

[questions.cefr-a1-024]
prompt = "Choose the correct word for the question: **Are there ___ eggs in the fridge?**"
explanation = "In a typical information question, use *any* with a plural countable noun: *Are there any eggs?*"

[questions.cefr-a1-025]
prompt = "Choose the question word that asks about a location: **___ is the bus station?**"
explanation = "Use *where* to ask where a person or thing is."

[questions.cefr-a1-026]
prompt = "Choose all the correct time preposition phrases."
explanation = "Use *at* with a time, *on* with a day/date, and *in* with a month. Say *on Friday* and *in the morning*."

[questions.cefr-a1-027]
prompt = "Choose all the questions that use the correct quantifier."
explanation = "*Apples* is countable, so it goes with *many*; *water* and *money* are uncountable, so they go with *much*. Do not use *many* with *bread*."

[questions.cefr-a1-028]
prompt = "Choose the preposition for something on a surface: **The book is {{blank}} the table.**"
explanation = "Use *on* when something is on a surface: *on the table*."

[questions.cefr-a1-029]
prompt = "Choose the correct preposition: **The school is {{blank}} the bank and the park.** (in the middle of two places)"
explanation = "Use *between* to say that a place is in the middle of two named places."

[questions.cefr-a1-030]
prompt = "Complete the question about the time: **{{blank}} time is it?**"
explanation = "The fixed question for asking the time is *What time is it?*"

[modules.cefr-a1-vocab-everyday]
title = "Everyday vocabulary"
description = "Review numbers, days and times, prices, family, jobs, homes, food, clothes, places in town, and spelling."
lesson = '''
### Numbers, days, times, and money
| Topic | Pattern / example |
|---|---|
| Numbers | one, two, three…; ten, twenty, thirty |
| Days | Monday, Tuesday…; *a week* has seven days |
| Time | 8:00 = eight o'clock; 8:15 = quarter past eight |
| Prices | $3 = three dollars; $3.50 = three dollars and fifty cents |
| Spelling | *book*: B-O-O-K; *name*: N-A-M-E |

Ask about a price with *How much is this bag?*; when giving a price, you can say the currency units too. Reading a phone number one digit at a time can make it easier to understand. To ask for someone's name spelling, say *How do you spell your name?* and then read each letter.

### People, homes, and daily life
Family words include *mother, father, sister, brother, grandmother,* and *grandfather*. Common jobs include *teacher, doctor, nurse, student,* and *cook*. Rooms in a home include *kitchen, bedroom, bathroom,* and *living room*; the *kitchen* is where people cook. Basic food words include *bread, rice, egg, apple, banana,* and *water*. Clothes include *shirt, T-shirt, coat, dress,* and *shoes*. Places in a town include *school, hospital, supermarket, bus stop, train station,* and *bank*.

Natural examples: *My sister is a nurse. She works at a hospital.* · *We have bread and eggs for breakfast.* · *The bus stop is near my house.* · *This coat is twenty dollars.*

**Common mistakes:** confusing *thirteen* with *thirty* when listening or reading; forgetting to capitalize days of the week; confusing *teacher* (a job) with *student* (a learner); using *wear* for food; confusing *house* (the building) with *home* (the place where someone lives). Tip: learn words in small groups and use each one in a sentence about yourself. For prices, check the currency symbol first; when spelling, write each letter in uppercase and separate them so they are easy to check.
'''

[questions.cefr-a1-031]
prompt = "How do you say **8:15**?"
explanation = "8:15 is 15 minutes after eight, so it is *quarter past eight*. *Quarter to eight* is 7:45."

[questions.cefr-a1-032]
prompt = "A sandwich costs **$3.50**. Which sentence gives the correct price?"
explanation = "For a price of $3.50, say the dollars first and then the cents: *three dollars and fifty cents*."

[questions.cefr-a1-033]
prompt = "My father's mother is my ___. Choose the correct family word."
explanation = "Your father's mother is your grandmother."

[questions.cefr-a1-034]
prompt = "A person who teaches children is a ___. Choose the word for the job."
explanation = "A *teacher* teaches; a *student* studies, while a *kitchen* and a *hospital* are places."

[questions.cefr-a1-035]
prompt = "You cook dinner in the ___. Choose the correct room in a home."
explanation = "A *kitchen* is the room where people usually cook food."

[questions.cefr-a1-036]
prompt = "Choose the words for clothes."
explanation = "A *coat* and a *hat* are clothes or accessories that people wear; *bread* is food, and a *station* is a place."

[questions.cefr-a1-037]
prompt = "Complete the sentence about the calendar: **There are seven days in a {{blank}}.**"
explanation = "A *week* has seven days."

[questions.cefr-a1-038]
prompt = "Fill in the name of the fruit: **I peel a {{blank}} before I eat it. It is a long, yellow fruit.**"
explanation = "A *banana* is a long, yellow fruit that people usually peel before eating."

[questions.cefr-a1-039]
prompt = "Complete the name of a place in town: **You wait for a bus at a bus {{blank}}.**"
explanation = "The place where you wait for a bus is a *bus stop*."

[questions.cefr-a1-040]
prompt = "Spell the word **book**: **B - O - {{blank}} - K**"
explanation = "*Book* is spelled B-O-O-K, so the missing letter is O."

[modules.cefr-a1-functions]
title = "Communicating in familiar situations"
description = "Practice greetings, introductions, ordering food, shopping, asking for directions, asking someone to repeat, thanking, and apologizing."
lesson = '''
### Greetings and introductions
| Situation | Common phrases |
|---|---|
| Meeting someone | *Hello. / Hi. / Good morning.* |
| Asking a name | *What's your name?* — *I'm Mai.* |
| Introducing someone | *This is my friend, Nam.* |
| Saying goodbye | *Goodbye. / See you later.* |
| Thanking / replying | *Thank you. / Thanks.* — *You're welcome.* |
| Apologizing | *I'm sorry.* — *That's OK.* |

When you first meet someone, you can ask *Where are you from?* and answer *I'm from Vietnam.* If you did not hear clearly, say *Sorry, can you repeat that, please?* or *Can you say that again?* These phrases are polite and make it clear that you need the other person to repeat something.

### Ordering, shopping, and asking for directions
To order politely, say *Can I have a coffee, please?* or *I'd like a sandwich, please.* A server may reply *Here you are.* When shopping, ask *How much is this T-shirt?*; the seller may say *It's ten dollars.*

To ask for directions, begin with *Excuse me,* then ask *Where is the bank?* Give simple directions with *Go straight. Turn left/right. It's next to the school.* Name the place clearly, such as *the bus stop* or *the station*.

**Common mistakes:** translating a sentence word for word from Vietnamese and getting the word order wrong; forgetting *please* when making a request; saying *How much this bag?* instead of *How much is this bag?*; replying *Thank you* when someone has just thanked you instead of *You're welcome*; saying *Sorry?* without making it clear that you want the other person to repeat something. Tip: learn whole phrases for each situation. Start with *Excuse me* when you need someone's attention; end a request with *please*; reply to thanks with *You're welcome* and to an apology with *That's OK*.
'''

[questions.cefr-a1-041]
prompt = "You meet a friend in the morning. Which greeting is appropriate?"
explanation = "*Good morning!* is a greeting used in the morning. *Good night* is usually said when saying goodbye before going to bed."

[questions.cefr-a1-042]
prompt = "A: **Hi, I'm Hoa. What's your name?** B: Choose a natural reply."
explanation = "You can give your name with *I'm Nam* or *My name is Nam*. The other options have incorrect word order or are missing *is*."

[questions.cefr-a1-043]
prompt = "At a café, you want to order a cup of tea. Choose the polite sentence."
explanation = "The pattern *Can I have …, please?* is used to order something or make a polite request. In a café, *a tea* can mean a cup of tea."

[questions.cefr-a1-044]
prompt = "You want to ask the price of a T-shirt. Choose the correct question."
explanation = "Ask the price of an item with *How much is …?*; the question needs the verb *is*."

[questions.cefr-a1-045]
prompt = "You hear these directions: **Go straight and turn left.** What should you do?"
options = ["Go straight and turn left.", "Go straight and turn right.", "Stop and go back.", "Go to the right."]
explanation = "*Go straight* means to continue straight ahead; *turn left* means to make a left turn."

[questions.cefr-a1-046]
prompt = "You did not hear clearly and want the other person to repeat something. Choose all the polite, natural phrases."
explanation = "The first two sentences are natural ways to ask someone to repeat something. The other two translate Vietnamese phrases too literally and are not correct English structures."

[questions.cefr-a1-047]
prompt = "Choose the appropriate reply for each phrase."
explanation = "*You're welcome* replies to thanks; *That's OK* is a common reply to an apology. The other pairs do not match the situation."

[questions.cefr-a1-048]
prompt = "Complete the question about the price: **How much {{blank}} this bag?**"
explanation = "For one item, ask *How much is this bag?*"

[questions.cefr-a1-049]
prompt = "Complete the polite question: **Excuse {{blank}}, where is the bank?**"
explanation = "The fixed opening phrase is *Excuse me* when you want to ask a question or politely get someone's attention."

[questions.cefr-a1-050]
prompt = "Write a short dialogue in English at a café: order a drink, use polite language, and say thank you."
explanation = "A short dialogue can use *Can I have …, please?* to order and *Thank you* to show appreciation."

[modules.cefr-a1-reading-writing]
title = "Short reading and writing"
description = "Read signs, menus, and short messages; complete forms and write introductory sentences using capital letters and basic punctuation."
lesson = '''
### Reading very short texts
At A1 level, practice finding information that is stated directly: names, places, times, prices, and actions to take. For signs, look for the key words: *NO ENTRY* (do not enter), *OPEN*, *CLOSED*, and *KEEP LEFT*. In a menu, match each item with its price; in a message, find the sender, meeting place, and time.

| Text | What to find | Example |
|---|---|---|
| Sign | what is or is not allowed | *No entry.* |
| Menu | food, drinks, prices | *Tea — $2* |
| Message | person, place, time | *Meet me at 6.* |
| Form | the right kind of information | *First name: Lan* |

Read the question first, then scan the text for key words. You do not need to translate every word if the question only asks for a price or time. On a form, *first/given name* is a person's given name, while *family/last name* is their surname; *country* is a nation, and *city* is a city.

### Writing a few clear sentences
An A1 introduction can have 3–5 sentences: *Hello! My name is Linh. I am from Da Nang. I live in Da Nang. I am a student.* A sentence usually has a subject and a verb. Use a capital letter at the start of a sentence and for *I*, people's names, cities, countries, and days of the week. Use a period for a statement, a question mark for a question, and a comma after a short greeting such as *Hello, Mai.*

**Common mistakes:** incorrect capitalization of proper names (*vietnam* → *Vietnam*); forgetting to capitalize *I*; using a period instead of a question mark; joining too many ideas into one long sentence; putting a surname in the first-name field. Tip: after writing, check each sentence in this order: is the first letter capitalized, does it have a subject and a verb, and does it end with the right punctuation? When filling out a form, check each field label before copying in the information.
'''

[questions.cefr-a1-051]
prompt = "What does the sign **NO ENTRY** mean?"
options = ["Do not enter.", "The door is open.", "Turn left.", "Keep the door open."]
explanation = "*No entry* is a sign that prohibits people from entering an area."

[questions.cefr-a1-052]
prompt = "Read the menu: **Tea $2 · Juice $3 · Water $1**. Which drink costs $3?"
explanation = "On the menu, *Juice* costs $3."

[questions.cefr-a1-053]
prompt = "Read the message: **Hi Nam, Meet me at 6. —Mai**. What time does Mai arrange to meet Nam?"
explanation = "The message says *Meet me at 6*, so the meeting is at six o'clock."

[questions.cefr-a1-054]
prompt = "The form says: **First name: Lan · Family name: Pham**. What is this person's given name?"
explanation = "*First name* is the given name, which is *Lan* here; *family name* is the surname, which is *Pham* here."

[questions.cefr-a1-055]
prompt = "Choose the sentence with correct capitalization and punctuation."
explanation = "A statement starts with a capital letter, the person's name *Lan* is capitalized, and the sentence ends with a period."

[questions.cefr-a1-056]
prompt = "Choose all the sentences with correct capitalization and punctuation."
explanation = "A question ends with a question mark; a statement ends with a period. *I* is always capitalized, and a question also needs a question mark."

[questions.cefr-a1-057]
prompt = "Read the message: **Hi Linh, The café is next to the bank. Meet me at 4. —Mai**. Choose all the correct information."
options = ["Mai sent the message.", "The café is next to the bank.", "The meeting is at 4.", "The café is inside the hospital."]
explanation = "The sender is Mai; the message says the café is next to the bank and the meeting is at 4. It does not say that the café is in a hospital."

[questions.cefr-a1-058]
prompt = "Add the correct punctuation mark to the question: **How are you{{blank}}**"
explanation = "A direct question ends with a question mark."

[questions.cefr-a1-059]
prompt = "Choose the correct sentence (subject pronoun and the verb *be*)."
explanation = "The subject is the pronoun *I* (always capitalized, even in the middle of a sentence), not the object pronoun *me*; use *am* with *I*, not *is/are*."

[questions.cefr-a1-060]
prompt = "Write 3–5 short sentences in English to introduce your name, city or hometown, and studies or job. Capitalize the first word of each sentence and proper names, and use periods."
explanation = "An A1 introduction can use separate, short sentences to give your name, where you live, and your studies or job. Check capitalization in proper names and put a period at the end of each sentence."
