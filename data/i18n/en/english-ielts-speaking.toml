[modules.isp-format-descriptors]
title = "Test format and the 4 assessment criteria"
description = "The 3-part structure, the 4 criteria, the difference between band 6 and band 7, and how to practise on your own when the app is text-only."
lesson = '''
### What the app cannot do, and how to make up for it
The app is text-only: no recording, no examiner. So it trains your **content, answer frameworks, linking words, grammar and pronunciation theory**. The "speaking out loud" part you must do yourself outside the app (see the last section). Do not skip it: learners who only read and never speak often get stuck at band 5.5.

### Test format (11–14 minutes, one examiner)
| Part | Content | Time | What you do |
|---|---|---|---|
| Part 1 | Introduction, 2–3 familiar topics (home, work, hobbies...) | 4–5 minutes | Answer each question in 2–4 sentences |
| Part 2 | Cue card: 1 minute to prepare, then speak for 1–2 minutes without stopping | 3–4 minutes | Take notes, follow your outline; the examiner will stop you |
| Part 3 | Abstract discussion linked to the Part 2 topic | 4–5 minutes | Explain, compare, predict, evaluate |

### The four assessment criteria (explained)
| Criterion | Band 6 | Band 7 |
|---|---|---|
| Fluency & Coherence | Speaks at length but sometimes hesitates, repeats or self-corrects a lot; linking words are limited | Speaks at length without effort; hesitation is mostly to think of ideas, not to search for words; a range of linking words |
| Lexical Resource | Enough vocabulary for familiar topics; can paraphrase when a word is missing | Flexible, uses collocations and less common phrases, uses idioms appropriately |
| Grammatical Range & Accuracy | Mixes simple and complex sentences; errors remain but rarely cause misunderstanding | Many complex structures, most sentences error-free |
| Pronunciation | Mostly understandable; still drops final sounds and misplaces stress | Easy to follow, sensible word stress and intonation, minor errors do not get in the way |

Band 6.5 means you are stable at band 6 and reach band 7 in one or two criteria. The easiest to raise are usually Fluency (thanks to answer frameworks) and Lexical (thanks to collocations).

### General strategy
1. Answer the question directly in your first sentence, then add reasons and examples.
2. Do not memorise model answers: examiners recognise a "recited" voice and lower your Fluency score.
3. If you make a mistake, fix it quickly (*I mean...*) and keep going; do not stop completely.
4. There is no right or wrong opinion. You may invent examples, as long as you speak fluently.
5. If you lack a word, paraphrase it with simpler words.

### Common mistakes of Vietnamese learners
- Giving a one-sentence answer (*Yes, I do.*) and then going silent.
- Dropping final sounds (*work*, *looked*), or pronouncing *-ed* as a separate syllable.
- Translating ideas directly from Vietnamese, e.g. *I very like*.
- Saying *In my opinion, I think* (one phrase too many).

### Practising outside the app
- **Record yourself on your phone**: answer a Part 1 question in 20–30 seconds, listen back, count the hesitations and dropped final sounds, then record again.
- **Time your Part 2**: set a timer for 1 minute of preparation and at least 1 minute 30 seconds of speaking. If you run out of ideas before 1 minute, you need one more point in your outline.
- **Shadowing**: listen to a normal piece of spoken English of your choice (a podcast, a lecture), repeat it 1–2 seconds behind the speaker, and copy the rhythm and stress. No specific material is needed, just a clear voice.
- Ask a friend to ask you Part 3 questions they make up themselves, so you get used to not knowing the questions in advance.
'''

[modules.isp-part1]
title = "Part 1: extending your answers"
description = "Answer frameworks, reasons and examples for familiar topics; avoid one-line answers and memorised responses."
lesson = '''
### The goal of Part 1
Part 1 tests your ability to speak naturally about familiar topics. The questions are simple, but your Fluency and Lexical scores depend on how far you can extend your answer without rambling. An ideal answer is **2–4 sentences, 15–30 seconds** long.

### The ARE framework: Answer, Reason, Example
| Step | What to do | Sentence starters |
|---|---|---|
| Answer | Answer directly | *Yes, quite often.* / *I'd say it's my favourite room.* |
| Reason | Explain why | *The main reason is that...* / *That's because...* |
| Example | One specific detail or example | *For instance, last weekend I...* / *Take my sister, for example.* |

Example: *Do you like cooking?* A band 7 answer: *Yes, I'm quite keen on it. It helps me relax after a long day of coding, and I like experimenting with new recipes. For instance, last Sunday I made a Thai curry from scratch and it turned out better than I expected.* The answer has a direct answer, a reason and a specific example.

### Common topics
home/hometown, work/study, hobbies, food, daily routine, weather, technology, transport, friends. Prepare 5–6 expressions for each topic (collocations, not single words): *a bustling neighbourhood*, *a tight deadline*, *to unwind after work*.

### Openers for each question type
| Question type | How to start |
|---|---|
| Yes/No (*Do you...?*) | *Yes, I do, mainly because...* / *Not really. I'd rather...* |
| Habits (*How often...?*) | *Probably once or twice a week.* |
| Preferences (*Why do you like...?*) | *What I enjoy most is...* |
| Past (*Did you... as a child?*) | *When I was little, I used to...* |
| Comparison (*Which do you prefer...?*) | *I'd go for... rather than... because...* |

### Common mistakes
- **One-line answers**: *Yes.* or *I like it.* and then waiting for the next question.
- **Reciting**: an overly polished answer that does not fit the question (e.g. the question is about a habit but you answer about a preference). The examiner will change the question if they suspect a memorised answer.
- **Rambling**: speaking for more than 40 seconds so the examiner has to interrupt.
- **Wrong tense**: use the present simple for habits and the past simple for the past.
- **Repetition**: *very good*, *very nice* again and again. Replace them with *really enjoyable*, *genuinely helpful*.

### Timing tips
You have 1–2 seconds to think before answering; use them. If you need a phrase to buy time: *That's an interesting question.*, *Let me think...*. Do not use the same phrase for every question.

### Practising outside the app
Make up 10 Part 1 questions and record your answers. Listen back: does each answer have all three parts? Is any answer shorter than 10 seconds? Try answering again, adding a real personal example. Practise with a timer to get a feel for 20–30 seconds.
'''

[modules.isp-part2-long-turn]
title = "Part 2: note-taking and the long turn on a cue card"
description = "An outline in 1 minute of preparation, storytelling in past tenses, and how to keep going for 2 minutes."
lesson = '''
### What Part 2 is
The examiner gives you a cue card; you have **1 minute to prepare** (you may take notes) and then speak for **1–2 minutes without stopping**. The examiner usually only says *Thank you* and asks a short question at the end. This is the part where Fluency problems show most, because nobody is guiding you.

### What a cue card contains
A topic (*Describe a place you visited...*) and 3–4 bullet-point prompts (*where it was, when you went, what you did, and explain why you liked it*). The last line usually asks you to explain your feelings; that is where you can speak the longest.

### How to take notes in 1 minute
Do not write full sentences. Each bullet point needs only 2–3 keywords and one specific detail.
| Cue card prompt | Sample notes |
|---|---|
| Where it was | Da Lat, mountain city |
| When you went | last year, with friends, 3 days |
| What you did | coffee farm, cycling, rain |
| Why you liked it | cool air, calm, escape deadlines |

Also note one "backup idea" (an example or a feeling) to use if you run out of ideas before 1 minute 30 seconds.

### Storytelling outline
1. **Opening**: state the topic directly: *I'd like to talk about a trip to Da Lat that I took last year.*
2. **Body**: go through the bullet points in order, 2–3 sentences each.
3. **Closing**: one sentence of feeling or conclusion: *All in all, it was exactly the break I needed.*

### Language you need
| Function | Examples |
|---|---|
| Opening | *I'd like to talk about...* / *The ... I have in mind is...* |
| Moving on | *As for...*, *Another thing worth mentioning is...* |
| Past tenses | past simple for a sequence of events, past continuous for the background (*It was raining when...*), past perfect for something that happened earlier (*I had never seen...*) |
| Feelings | *I was over the moon*, *It left a lasting impression on me* |
| Wrapping up | *That's pretty much it.* / *To sum up,...* |

### Common mistakes
- Speaking for less than 1 minute because each bullet point gets only one sentence.
- Jumping between past and present while telling the story.
- Giving too much unnecessary detail on the first bullet point and running out of time before the "why" part.
- Going silent when you forget a word instead of paraphrasing.

### Timing tips
Aim for 1 minute 45 seconds. If you still have time, add a sensory detail (a sound, a smell, a colour), a comparison or a short piece of dialogue. You do not need exact timing, but do not stop at 50 seconds.

### Practising outside the app
- Make up a cue card, time 1 minute for notes, and record your first attempt. Listen back to check whether you covered every bullet point.
- Repeat the same topic but give more detail in the "why" part. Compare the two recordings.
- On the third attempt, speak without looking at your notes to build confidence.
'''

[modules.isp-part3-discussion]
title = "Part 3: abstract discussion"
description = "Comparing past and present, predicting the future, evaluating, and giving opinions with reasons."
lesson = '''
### How Part 3 differs from Part 1
Part 3 asks about society and general trends, not about you. The examiner wants to see you **explain, compare, speculate and evaluate**. This part decides whether you reach band 7. A good answer is 4–6 sentences long (30–45 seconds).

### Question types and answer frameworks
| Type | Example question | Framework |
|---|---|---|
| Past vs present | *How has communication changed?* | In the past ... → Now ... → Because ... |
| Prediction | *Will people travel more in future?* | I think ... → because ... → however ... |
| Causes | *Why do people leave their hometown?* | One main reason ... → another reason ... → example |
| Pros and cons | *Is online learning a good thing?* | On the positive side ... → the drawbacks ... → my conclusion |
| Suggestions | *What can governments do?* | They should ... → because ... |

### Language you need
- **Hedging** (being less certain): *I'd say that...*, *It tends to be the case that...*, *In many cases...*, *to some extent*.
- **Speculating**: *I suspect that...*, *It's likely that...*, *I wouldn't be surprised if...*.
- **Past vs present**: *Back in my parents' day...*, *These days...*, *used to... but now...*.
- **Balancing both sides**: *On the one hand..., on the other hand...*, *While ... , I'd also argue that...*.
- **Conditionals**: *If cities were designed for pedestrians, air quality would improve.*

### A 4-sentence structure
1. Answer directly with hedging: *I'd say it has changed quite dramatically.*
2. The main reason: *The main reason is that...*
3. An example or comparison: *For example, ... whereas now...*
4. A comment or condition: *That said, it isn't the same for everyone.*

### Common mistakes
- Answering with personal experience instead of speaking generally (*I never use...* instead of *Many people...*).
- Giving only a reason with no example, or only an example with no explanation.
- Starting every sentence with *I think*.
- Making absolute claims (*Everyone*, *always*), which sound unnatural for abstract topics.
- Going silent on a difficult question. Say *That's a tricky one. Let me think...* and then follow the framework.

### Timing tips
You get no preparation time, so keep the "answer, reason, example, comparison" framework in your head like a checklist. Each question needs only 3 points, not 10.

### Practising outside the app
Choose 8 abstract questions (technology, education, the environment), answer each for 40 seconds and record yourself. Listen back to check: did you hedge, did you give an example, did you slip into personal stories? Copy the 3 best phrases into your vocabulary notebook.
'''

[modules.isp-fluency-discourse]
title = "Fluency and discourse markers"
description = "Natural linking words, phrases to buy time, self-correction, and paraphrasing when you lack a word."
lesson = '''
### Fluency does not mean speaking fast
Examiners judge Fluency & Coherence by how smoothly you speak and how logically your ideas connect. Speaking slowly but steadily and in an organised way is better than speaking fast and then stalling. The goal: hesitate to **think of ideas**, not to search for words.

### Discourse markers by function
| Function | Examples |
|---|---|
| Adding | *Besides, ...*, *On top of that, ...*, *What's more, ...* |
| Contrasting | *However, ...*, *That said, ...*, *Having said that, ...* |
| Giving reasons | *The reason is that...*, *That's why...* |
| Giving examples | *For instance, ...*, *Take ... for example*, *such as* |
| Emphasising | *Actually, ...*, *To be honest, ...*, *Honestly, ...* |
| Summarising | *All in all, ...*, *To sum up, ...* |
| Rephrasing | *In other words, ...*, *What I mean is...* |

Use them in moderation. One marker every 2–3 sentences sounds natural; a marker in every sentence sounds memorised.

### Phrases to buy time (instead of constant *erm*)
*That's a good question.*, *Let me think for a second.*, *Well, it depends.*, *I've never really thought about it, but...*. Choose 3–4 and rotate them.

### Self-correction
When you make a mistake, correct it briefly and carry on: *I go there yesterday... I mean, I went there yesterday.* Do not apologise or pause for too long. A few natural self-corrections are normal and even show that you control your grammar.

### Paraphrasing when you lack a word
| Situation | What to do |
|---|---|
| You forget the exact word | Describe it: *It's the thing you use to...*, *a kind of...* |
| You need an abstract word | Use a broader word: *a situation where...* |
| You forget a name | *What's it called...*, *the name escapes me* |
| You don't know how to say it | Change the structure: *It was very noisy* instead of a specialised word |

### Common mistakes
- Chaining everything with *and... and... and...*, or using only *because* and *so*.
- Using *Firstly... Secondly... Finally...* as in writing: it sounds stiff in speech.
- Using *erm* or *you know* more than 3–4 times in one answer.
- Translating Vietnamese linking words literally: *In the other hand*, *According to me*.

### Timing tips
Build a "toolbox" with 2 markers for each function. When practising, use each new marker at least 5 times in real answers until it becomes automatic.

### Practising outside the app
- Record yourself speaking for 1 minute on any topic, then listen back and mark every hesitation. For each one, ask yourself: was I searching for a word or for an idea?
- Play "no stopping": talk for 90 seconds about an object you can see in the room without pausing for more than 2 seconds.
- Shadowing: choose a natural piece of speech, note the markers the speaker uses and try them in your own sentences.
'''

[modules.isp-pronunciation-text]
title = "Pronunciation through text: stress, -ed, -s, intonation"
description = "Word stress and word families, pronouncing -ed and -s, final sounds, and sentence stress, practised through written descriptions."
lesson = '''
### Pronunciation is 25% of the Speaking score
Band 6 means most of what you say is understandable; band 7 means you are easy to follow and control stress and intonation well. Vietnamese learners often lose marks for **dropping final sounds**, **misplacing word stress** and **speaking in a flat rhythm** (one beat per syllable). The app has no audio, so we learn the rules through text and you practise by recording yourself.

### Word stress
A word with several syllables has exactly one strongest syllable (shown in capitals here). Useful rules:
| Rule | Examples |
|---|---|
| Two-syllable nouns and adjectives usually stress the first syllable | *TAble, HAPpy, PREsent (n)* |
| Two-syllable verbs usually stress the second syllable | *reLAX, deCIDE, preSENT (v)* |
| Words ending in *-tion, -sion, -ic, -ical, -ity, -graphy* stress the syllable just before the suffix | *eduCAtion, ecoNOmic, uniVERsity, phoTOgraphy* |
| Stress moves within a word family | *PHOtograph, phoTOgrapher, photoGRAphic* |
| Compound nouns stress the first word | *BLACKboard, LAPtop* |

### Pronouncing -ed
| Final sound of the verb | -ed sounds like | Examples |
|---|---|---|
| /t/ or /d/ | /ɪd/ (an extra syllable) | *wanted, needed* |
| Voiceless sounds (/p, k, f, s, ʃ, tʃ/) | /t/ | *worked, stopped, watched* |
| Voiced sounds and vowels | /d/ | *played, lived, called* |

Common mistakes: saying *worked* as two syllables (*work-ed*) or dropping the final sound altogether (*work*). Fix: touch your tongue lightly and release a short /t/.

### Pronouncing -s / -es
| Final sound | -s sounds like | Examples |
|---|---|---|
| /s, z, ʃ, tʃ, dʒ/ | /ɪz/ | *buses, watches* |
| Other voiceless sounds | /s/ | *books, stops* |
| Voiced sounds and vowels | /z/ | *friends, plays* |

### Final sounds and linking
Vietnamese has few final consonants, so learners tend to swallow them. Pronounce the /t/, /d/, /s/ fully in *meets, mind, thanks*. When one word ends in a consonant and the next begins with a vowel, the sounds link together (*pick it up* sounds like *pi-ki-tup*).

### Sentence stress and intonation
In a sentence, content words (nouns, main verbs, adjectives, adverbs) are stressed; function words (*the, of, to, and*) are said lightly. Example: *I'd LIKE to VISit the MUseum toMORrow.* Yes/No questions usually rise at the end; statements fall. In a list, rise on each item and fall on the last one.

### Common mistakes
- Speaking English as if reading Vietnamese: every syllable equal.
- Stressing the wrong syllable in a word family (*eCOnomy* is correct, *ecoNOmic* is correct; mixing up the two).
- Adding a vowel to the end of a word (*stop* becomes *stop-uh*).

### Practising outside the app
- Record 10 words ending in *-tion, -ic, -ity* and listen back to check which syllable you stress. Compare with a dictionary that shows pronunciation.
- Choose a piece of speech you like, shadow it, copy the rhythm and intonation, then record your own voice to compare.
- Read a 100-word passage aloud every day, paying attention to final sounds.
'''

[questions.isp-001]
explanation = "The Speaking test has 3 parts: Part 1 (questions on familiar topics), Part 2 (cue card, long turn) and Part 3 (abstract discussion), 11–14 minutes in total."

[questions.isp-002]
explanation = "Part 2 gives you 1 minute to prepare and take notes, then you speak for 1–2 minutes without stopping. Parts 1 and 3 are the ones with no preparation time."

[questions.isp-003]
explanation = "Part 2 asks you to speak for 1–2 minutes. The examiner stops you at 2 minutes, so a realistic target is about 1 minute 45 seconds."

[questions.isp-004]
explanation = "Speaking is scored on 4 equally weighted criteria: Fluency & Coherence, Lexical Resource, Grammatical Range & Accuracy, Pronunciation. Task Response is a Writing Task 2 criterion; opinions are not marked right or wrong."

[questions.isp-005]
explanation = "Band 7 Fluency: speaking at length without effort, hesitating mainly to think of ideas, with a range of linking words. Frequent repetition and self-correction are band 6 features. One-sentence answers are not long enough; speed is not a criterion."

[questions.isp-006]
explanation = "The Speaking score is the average of the 4 criteria. 6.5 usually means stable at band 6 and reaching band 7 in some criteria, e.g. Fluency or Lexical. You do not need a native accent or zero mistakes."

[questions.isp-007]
explanation = "Examiners are trained to spot memorised answers (a flat, recited delivery that does not fit the question). They may change the question, and Fluency/Coherence is scored lower because it does not reflect your real speaking ability. The test is not stopped."

[questions.isp-008]
explanation = "Part 3 is an abstract discussion that extends the Part 2 cue card topic (e.g. from a personal trip to travel trends in general). Part 1 asks about you and familiar topics."

[questions.isp-009]
explanation = "Answering directly first, paraphrasing when you lack a word, and correcting yourself quickly before carrying on all protect your Fluency. Memorised answers get noticed; long silences cost Fluency marks; the examiner does not explain the scoring criteria in the exam room."

[questions.isp-010]
explanation = "The first option uses natural, less common phrases (*genuinely memorable*, *took my breath away*), matching band 7 Lexical. The other options repeat *very good, nice, good* and stay at band 5–6."

[questions.isp-011]
explanation = "The full name of the criterion is Grammatical Range & Accuracy: *range* is the variety of structures (complex sentences, conditionals, passives...), *accuracy* is the proportion of error-free sentences."

[questions.isp-012]
explanation = "Self-assessment checklist: (1) Fluency & Coherence: the steps are clearly ordered (*Afterwards, Once a month*); (2) Lexical Resource: words that fit the exam-practice context (*record, timer, long turn, filler*); (3) Grammar: *will*, a *so that* clause, complex sentences; (4) Content: recording, listening back, timing and a way to measure progress. The app only checks keywords, so you have to judge how natural it sounds yourself."

[questions.isp-013]
explanation = "The grammar criterion covers both *range* and *accuracy*. Using only simple sentences gives high accuracy but low range, making it hard to go beyond band 6. Add controlled complex sentences: relative clauses, conditionals, *although/whereas*."

[questions.isp-014]
explanation = "Band 7 Lexical rewards less common words used *appropriately*. A misused or forced idiom counts as an error. Accurate collocations are safe and still show good vocabulary. Stuffing idioms into every sentence sounds unnatural."

[questions.isp-015]
explanation = "The first option follows the ARE framework: answer (*Yes*), reason (*helps me relax*), example (*last Sunday...*), 2–3 sentences long. *Yes.* is too short; the third option repeats words; the last one rambles like a definition and says nothing about the speaker."

[questions.isp-016]
explanation = "ARE = Answer (answer directly), Reason, Example (an example or a specific detail). These three steps make your answer 2–4 sentences long without rambling."

[questions.isp-017]
explanation = "A question about a present habit takes the present simple + an adverb of frequency (*usually, once a month*). The past simple is for the past; the present continuous and present perfect do not express regular habits."

[questions.isp-018]
explanation = "Past habits take *used to + base verb*. *am used to* means being accustomed to something (and must be followed by V-ing); the present simple and present perfect do not match the time reference *when I was little*."

[questions.isp-019]
explanation = "The main problems are repetition (*Hue, very*), which lowers Lexical, and the word-order error *I very like* (a common Vietnamese learner mistake; the correct forms are *I really like* or *I like it very much*). The answer is not too long and the present tense is correct."

[questions.isp-020]
explanation = "A choice question is best answered with *I'd go for X rather than Y because...*: a clear choice and a specific reason. The second option hesitates without content; the third gives no reason; the last has a structural error (*prefer X to Y*, not *than*)."

[questions.isp-021]
explanation = "The standard collocation is *meet a (tight) deadline*. *catch* and *do* do not go with *deadline*; *narrow deadline* is not natural. Preparing collocations for the Work topic helps push Lexical to band 7."

[questions.isp-022]
explanation = "*unwind* is the natural verb for relaxing after work (*to unwind after work*). The variants *relax, chill, de-stress* also have the right meaning; *unwind* shows a wider vocabulary."

[questions.isp-023]
explanation = "Part 1 has many short questions in 4–5 minutes. 2–4 sentences (15–30 seconds) is enough to extend your answer without rambling. Speaking too long makes the examiner interrupt, and you lose the chance to show your ability on later questions."

[questions.isp-024]
explanation = "The sign of a memorised answer is a polished response that misses the focus of the question (asked about a personal preference, it talks about climate and history). No topic is forbidden; length does not make up for going off-topic."

[questions.isp-025]
explanation = "The first three phrases are natural ways to buy time that still lead into an answer. *I don't know. Next question* throws away the chance to show your ability; constant *erm* lowers Fluency. Rotate the phrases instead of using one for every question."

[questions.isp-026]
explanation = "Self-assessment checklist: (1) Fluency & Coherence: Answer, Reason, Example and a closing *That said*; (2) Lexical Resource: natural phrases (*keen on, fighting the traffic*); (3) Grammar: a mix of present simple, past simple and *I'd rather*; (4) Length: 3–4 sentences, about 25 seconds when spoken. The app only checks keywords; read it aloud and time yourself."

[questions.isp-027]
explanation = "Part 1 needs concise, focused answers. In-depth analysis (history, urban planning) belongs in Part 3. Answers that are too long get interrupted, while one-line answers lose Fluency marks. The balance is 15–30 seconds."

[questions.isp-028]
explanation = "You can still answer without personal experience: be honest (*Not really*), explain why, then extend by talking about someone else (*my grandmother*). The second and fourth options waste the chance to speak; the third is untrue and repetitive, so it sounds unnatural."

[questions.isp-029]
explanation = "1 minute is only enough for keywords: 2–3 words per bullet point. Writing full sentences takes time and makes you read aloud instead of speaking. You usually cannot change the cue card."

[questions.isp-030]
explanation = "*I'd like to talk about...* is the standard opener that states the topic directly. *I'd love to* is also natural."

[questions.isp-031]
explanation = "A sequence of completed events takes the past simple. Switching to the present in the middle of a story is a common grammar mistake in Part 2."

[questions.isp-032]
explanation = "Good notes are short keywords plus one specific detail. Writing full sentences takes time and tempts you to read your notes. Writing nothing makes it easy to forget ideas while speaking."

[questions.isp-033]
explanation = "The past continuous (*was raining*) describes the background in progress when another event (*reached*, past simple) happened."

[questions.isp-034]
explanation = "The past perfect (*had seen*) is for an experience before the past point of the story (*before that trip*). Using this tense correctly increases your grammatical range."

[questions.isp-035]
explanation = "Sensory details, comparisons and a short quoted line of dialogue all extend the answer on topic. Stopping completely costs Fluency marks; rereading the cue card adds nothing; switching to another topic is off-topic."

[questions.isp-036]
explanation = "Many candidates describe the first bullet point in too much detail and get stopped before the last line, *explain why*, which is where Lexical and Grammar are easiest to show. Aiming for 1:45, glancing at notes and a standard opener are all good practice."

[questions.isp-037]
explanation = "The task asks for 1–2 minutes. Aim for about 1:45 and keep talking until the examiner stops you. Under 1 minute is a sign of weak Fluency."

[questions.isp-038]
explanation = "*As for...* moves naturally to a new point. Numbering as in writing or reading out the cue card (*Point number three...*) sounds mechanical and lowers Coherence."

[questions.isp-039]
explanation = "Self-assessment checklist: (1) Fluency & Coherence: an opening that states the topic, then who, when, what, why in order; (2) Lexical Resource: phrases such as *treated mistakes as part of learning, looking back*; (3) Grammar: past simple, past perfect (*had always believed*), *used to*, relative clauses; (4) A specific *why* section. The app only checks keywords; say it aloud and time yourself to see whether you reach 1:45 when you continue the story."

[questions.isp-040]
explanation = "The first option has a collocation (*left a lasting impression*), a specific reason and the past perfect. The others repeat ideas and fail to explain why, so they struggle to go beyond band 6 in Lexical and Coherence."

[questions.isp-041]
explanation = "Paraphrasing (circumlocution) keeps you talking and is a skill assessed under Lexical Resource. Staying silent, switching to Vietnamese or apologising repeatedly all lower Fluency."

[questions.isp-042]
explanation = "Part 3 is an abstract discussion: comparing, explaining, predicting and evaluating issues in society. There is no cue card or preparation time, and the questions are open rather than just yes/no."

[questions.isp-043]
explanation = "*used to + base verb* expresses a past habit that no longer exists, which fits Part 3 questions comparing past and present very well."

[questions.isp-044]
explanation = "Part 3 answers need to be longer than Part 1 so you can explain, give examples and weigh both sides: about 4–6 sentences. If you talk for 2 minutes, the examiner will interrupt and time is lost for other questions."

[questions.isp-045]
explanation = "Hedging (*I'd say, to some extent*) makes an opinion softer and more precise, which suits abstract topics. Absolute claims (*100%, Everyone*) sound unnatural and are easily wrong in content."

[questions.isp-046]
explanation = "Part 3 calls for speaking generally about society: causes and trends (*many graduates, tend to*). Personal experience should only be an illustration, not a replacement for the answer. The last option both dodges the question and is ungrammatical."

[questions.isp-047]
explanation = "The second conditional (a hypothetical present) uses *If + past simple, would + base verb*; the passive is *were designed*. This structure is very useful for suggestion questions in Part 3."

[questions.isp-048]
explanation = "The first three phrases are natural ways to speculate about the future. *definitely sure* is redundant and too absolute; *According to me* is a literal-translation error; use *In my view* instead."

[questions.isp-049]
explanation = "The 4-sentence framework: a direct answer (with hedging), the main reason, an example or comparison, and a comment/condition (*That said...*). An answer with only an example or only a reason is unbalanced."

[questions.isp-050]
explanation = "*Most people, especially in cities, rely heavily on...* limits the scope (hedging) and uses the collocation *rely heavily on*. The other options still overgeneralise or have a subject–verb agreement error (*Everybody use*)."

[questions.isp-051]
explanation = "*What can governments do...* asks you to suggest solutions: use *They should..., because...*, or a conditional *If they invested in..., ... would...*."

[questions.isp-052]
explanation = "Self-assessment checklist: (1) Fluency & Coherence: a direct answer, a reason, an example, a counterpoint (*That said*) and a conclusion; (2) Lexical Resource: *niche product, take over, a split rather than a complete replacement*; (3) Grammar: *will/likely to/probably*, an *although* clause, *because*; (4) Speaking generally about society, with personal examples only as illustration. The app only checks keywords; say it aloud in about 40 seconds."

[questions.isp-053]
explanation = "The first option weighs both sides, compares with *whereas*, names specific groups and concludes (*On balance*). The other options are one-sided, rely on personal feelings or have no content."

[questions.isp-054]
explanation = "Examiners score language, not knowledge. Saying *That's a tricky one, I'm no expert, but...* and then reasoning from general ideas still shows Fluency and Lexical. Silence, asking for a different question or going off-topic all lose marks."

[questions.isp-055]
explanation = "Fluency & Coherence assesses smoothness and organisation of ideas, not speed. Speaking slowly but steadily and coherently is better than speaking fast and then stalling."

[questions.isp-056]
explanation = "*In other words* is used to rephrase or summarise what you have just said, making your answer more coherent."

[questions.isp-057]
explanation = "*That said* (= however) signals a contrasting idea. *What's more* adds a point, *For instance* gives an example, *All in all* summarises."

[questions.isp-058]
explanation = "The correct phrase is *On the other hand*. *In the other hand* is a common literal-translation error. The other three phrases are all correct."

[questions.isp-059]
explanation = "A brief correction with *I mean* before carrying on shows you control your grammar without breaking the flow. Apologising a lot, going silent or asking to start again all lower Fluency."

[questions.isp-060]
explanation = "Describing the use (*the thing you use to...*), the category (*a kind of...*) or admitting you forgot the name and then describing it all keep you talking. Switching to Vietnamese or going silent costs Fluency and Lexical marks."

[questions.isp-061]
explanation = "*On top of that* (= in addition) is a natural spoken marker for adding a point, instead of repeating *and*."

[questions.isp-062]
explanation = "Written-style numbering is not grammatically wrong but sounds stiff in speech, especially in short answers. Natural speech uses *The main thing is..., Another thing is..., On top of that...*."

[questions.isp-063]
explanation = "Markers used in moderation and for the right function make an answer coherent. Starting every sentence with a marker sounds memorised; using no markers leaves the ideas disconnected."

[questions.isp-064]
explanation = "*What's more* (= moreover) adds a point in the same direction. Contrast uses *However/That said*, examples use *For instance*, and summaries use *All in all*."

[questions.isp-065]
explanation = "Self-assessment checklist: (1) Fluency & Coherence: each idea is linked with a marker of the right function (reason, example, addition, contrast) instead of a chain of *and*; (2) Lexical Resource: *genuinely enjoy, picked up, supportive*; (3) Grammar: complex sentences with *because, when*; (4) Part 1 length (3–4 sentences). The app only checks keywords; read it aloud to check how natural it sounds."

[questions.isp-066]
explanation = "Band 7 accepts hesitation to think about content, especially when you voice that thinking (*it depends on whether...*). Pausing to find basic words, restarting many times or overusing *erm* are band 5–6 features."

[questions.isp-067]
explanation = "Fillers usually appear when you rush. Slowing down a little and replacing them with meaningful phrases improves Fluency. Speaking faster causes more errors; memorised answers get noticed; never pausing makes you hard to follow and affects Pronunciation."

[questions.isp-068]
explanation = "When a verb ends in /t/ or /d/, *-ed* is pronounced /ɪd/ and adds a syllable: *wan-ted*, *nee-ded*."

[questions.isp-069]
explanation = "*work* ends in the voiceless sound /k/, so *-ed* is pronounced /t/: *worked* has only one syllable. Common mistakes are saying *work-ed* or dropping the final sound completely."

[questions.isp-070]
explanation = "After /s, z, ʃ, tʃ, dʒ/, the *-s/-es* ending is pronounced /ɪz/ and adds a syllable: *bus-es*, *watch-es*."

[questions.isp-071]
explanation = "Words ending in *-tion* are stressed on the syllable just before the suffix: *edu-CA-tion*. The same rule applies to *infor-MA-tion*, *popu-LA-tion*."

[questions.isp-072]
explanation = "Many two-syllable words change stress with the word class: nouns/adjectives stress the first syllable (*a PREsent*), verbs stress the second (*to preSENT*). Likewise *REcord / reCORD*."

[questions.isp-073]
explanation = "Stress moves within the word family: *PHO-to-graph*, *pho-TO-gra-pher*, *pho-to-GRA-phic*. Words with *-graphy/-grapher* are stressed on the syllable just before the suffix."

[questions.isp-074]
explanation = "After a vowel or a voiced sound (*play, live, call*), *-ed* is pronounced /d/. *stopped, watched* end in voiceless sounds, so they take /t/; *needed* ends in /d/, so it takes /ɪd/."

[questions.isp-075]
explanation = "In a sentence, content words (main verbs, nouns, adverbs) are stressed while function words (*to, the*) are said lightly. Stressing every syllable equally is the common Vietnamese learner mistake of speaking in a flat rhythm."

[questions.isp-076]
explanation = "Yes/No questions usually rise at the end; statements and Wh- questions usually fall. Flat intonation makes your meaning harder to understand."

[questions.isp-077]
explanation = "*friend* ends in the voiced sound /d/, so *-s* is pronounced /z/. Vietnamese learners often drop both /d/ and /z/; keep the full final cluster /ndz/."

[questions.isp-078]
explanation = "Self-assessment checklist: (1) Fluency & Coherence: the three problems are clearly ordered (*The first, The second, The third*); (2) Lexical Resource: correct terms (*final consonants, word stress, intonation, shadowing*); (3) Grammar: relative clauses (*which, where*), complex sentences; (4) Each problem has a specific practice method. The app only checks keywords; record this passage and listen back."

[questions.isp-079]
explanation = "*e-CO-no-my* is stressed on the second syllable; *e-co-NO-mic* is stressed just before the suffix *-ic*. Learners often keep the same stress for both words, making them hard for the examiner to recognise."

[questions.isp-080]
explanation = "A regional accent is not penalised; examiners score how easy you are to understand. Final sounds, word stress and sentence stress are the three factors that most affect intelligibility. Imitating an accent wastes time, speaking fast increases errors, and learning phonetic symbols does not automatically improve your speech."
