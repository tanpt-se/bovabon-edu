[modules.iw2-task-analysis]
title = "Analysing the prompt and identifying the essay type"
description = "Recognise the 5 essay types, underline the requirements, and avoid going off-topic or leaving parts unanswered."
lesson = '''
### A note about the app
The app is text-only and grades essays by keywords. This only checks the *required components* (a thesis, an example, linkers...); it cannot assess your band. So after every essay question, compare your answer with the `model_answer` and the checklist in the explanation. Ideally, ask a teacher or an experienced marker to grade real essays.

### What Task 2 is
Task 2 is an essay of at least 250 words, written in about 40 minutes, and it carries twice the weight of Task 1. You get only one prompt, so how you read it decides most of your Task Response score. Vietnamese learners often lose marks not because their English is weak but because they **answer a different question** from the one asked.

### Five common essay types
| Type | Signal in the prompt | What you must do |
|---|---|---|
| Opinion (agree/disagree) | *To what extent do you agree or disagree?* | State a clear position and defend it throughout |
| Discussion | *Discuss both views and give your opinion.* | Present both views, then give your own opinion |
| Advantages/disadvantages | *Do the advantages outweigh the disadvantages?* | Cover both sides and conclude which one is heavier |
| Problem–solution | *What problems... What solutions...?* | One paragraph on problems, one on solutions, with solutions matching problems |
| Two-part question | Two separate questions | Answer each question, one body paragraph per question |

Some prompts combine two types (for example, asking for both causes and solutions). In that case you must answer every part.

### Underline three things in the first 2 minutes
1. **The topic** and its scope (for example *young people in cities*, not *everyone*).
2. **The instruction words**: agree, discuss, outweigh, cause, solution.
3. **The number of parts to answer**: count the questions and question marks.

### Going off-topic and missing parts
- **Off-topic**: the prompt asks about *employee bonuses* but the essay is about *salaries in general*. Memorising a model essay on the same topic and forcing it onto the prompt is the most common cause.
- **Missing parts**: the prompt asks for *causes and solutions* but only solutions are given. Task Response drops very quickly.
- **No opinion** in a discussion essay when the prompt says *give your opinion*.

### Scope and limiting words
Watch words like *some, many, most, should, only, always*. If the prompt says *Some people believe...*, do not write as if it said *Everyone believes...*. Keep the prompt's scope in your thesis.

### The 5-minute routine
Read the prompt, identify the type, underline the requirements, choose a position, and note 2 main ideas for each body paragraph with a short example. Only then start writing.

### Common mistakes
- Copying the prompt into the introduction instead of paraphrasing it.
- Writing a 100-word introduction because you have no ideas for the body yet.
- Choosing *partly agree* without explaining which part you agree with and which part you do not.
'''

[modules.iw2-structure-thesis]
title = "Essay structure, introduction and thesis"
description = "Paraphrase the prompt, write a clear thesis and conclusion, plan the essay, and manage your time."
lesson = '''
### The four-paragraph frame
A safe frame for band 6.5: **introduction** (2–3 sentences), **body 1**, **body 2**, **conclusion** (2 sentences). About 260–290 words in total. An essay that is too short (under 250 words) loses Task Response marks, but writing 400 words usually adds more errors without adding marks.

### The introduction: two jobs
1. **Paraphrase the prompt**: change words to synonyms and change the structure while keeping the meaning. For the prompt *Some people think children should start school early*, you could write *It is argued by some that formal education ought to begin at a young age*.
2. **Thesis statement**: one sentence giving your position or the plan of the essay, for example *This essay will argue that the drawbacks outweigh the benefits.*

You do not need a generic opener such as *In today's modern society...*. Such sentences waste words and carry no content.

### Strong and weak theses
| Weak | Strong |
|---|---|
| *There are many opinions about this topic.* (no position) | *I partly agree: early schooling helps social skills, but formal lessons should wait until six.* |
| *I will talk about advantages and disadvantages.* (only says what it will do) | *While the advantages are real, the disadvantages are more serious in the long run.* |
| The position changes mid-essay | The position stays consistent |

The thesis must **answer the question directly** and match the content of the two body paragraphs.

### The conclusion
The conclusion restates your position in different words (do not copy the thesis) and briefly sums up the two main reasons. Do not introduce new ideas. You may add a short prediction or recommendation if it fits.

### A 5-minute plan
- Line 1: essay type and position.
- Each body paragraph: 1 main idea, 1 explanation, 1 example.
- No full sentences needed, just keywords.

### Splitting the 40 minutes
| Task | Time |
|---|---|
| Read the prompt and plan | 5 minutes |
| Write the essay | 30 minutes |
| Check for errors | 5 minutes |

When checking, look for errors in this order: verb tenses, articles, subject–verb agreement, commas, then linkers.

### Common mistakes by Vietnamese learners
- Starting every sentence with *I think that...*, which sounds repetitive and subjective.
- A thesis that is too long, packed with 3–4 small ideas, leaving no room in the body to develop them.
- Copying the prompt into the introduction and then adding *in my opinion*.
- A conclusion that opens a new idea with no time to explain it.
'''

[modules.iw2-idea-development]
title = "Developing ideas in body paragraphs"
description = "The topic sentence, explanation, example, link model; avoiding rambling or undeveloped ideas."
lesson = '''
### Why idea development matters
Task Response assesses how well you **develop** your ideas, not how many ideas you have. Band 6 essays usually have relevant ideas that are only mentioned, with vague examples. Band 7 essays develop the main ideas quite fully with specific examples. Two well-developed ideas are better than four ideas mentioned in passing.

### The paragraph model: TEEL
| Step | What to do | Example |
|---|---|---|
| Topic sentence | State the main idea of the paragraph | *Remote work can improve employees' well-being.* |
| Explanation | Explain the mechanism | *Without a daily commute, workers gain time for sleep and family.* |
| Example | Give a specific example | *For instance, several software companies reported lower burnout after adopting hybrid schedules.* |
| Link | Connect back to the prompt or the main idea | *This shows why flexible arrangements are worth supporting.* |

A band 6.5 body paragraph usually has 4–6 sentences following this model.

### Good and weak examples
- Weak: *For example, many people like this.* (vague, cannot be checked)
- Weak: a long personal story that drifts away from the argument.
- Good: name a group, a place, a situation or a reasonable figure: *In Vietnam, cities such as Hanoi have introduced restrictions on motorbikes in some districts.* You do not need precise real data, but avoid inventing overly specific statistics.

### Development mistakes
1. **Listing**: *There are three reasons: money, time, health.* and then moving to another paragraph.
2. **Repetition**: two sentences saying the same thing in different words.
3. **Drifting from the topic sentence**: the second half of the paragraph is about something else.
4. **Overgeneralisation**: *All young people are lazy.*
5. **Shallow ideas** such as *Technology is good because it is useful.* (circular, no explanation).

### Finding ideas quickly
Ask three questions: *Who is affected? How are they affected? Why does it matter?* Or use these angles: individual, family, economy, society, environment.

### Paragraph length
Each body paragraph is about 100–120 words. If a paragraph has only 2 sentences, the idea is not developed. If it is over 180 words, consider splitting the idea or cutting unnecessary detail.

### Self-check
For each paragraph, ask: (1) does the topic sentence answer the prompt? (2) is there a *why* part? (3) is the example specific and relevant? (4) does the last sentence link back to the argument?
'''

[modules.iw2-cohesion-coherence]
title = "Cohesion and coherence"
description = "Linkers used for the right function, referencing, paragraphing, and mechanical overuse of linkers."
lesson = '''
### Coherence and cohesion are different
**Coherence** means the ideas are in a logical order and each paragraph has one central idea. **Cohesion** means the devices that connect sentences: linkers, pronouns, substitution, controlled repetition. Band 6 uses linkers but sometimes wrongly or mechanically; band 7 uses a range of them naturally, with good referencing.

### Linkers by function
| Function | Examples |
|---|---|
| Addition | *In addition, Moreover, Furthermore* |
| Contrast | *However, On the other hand, In contrast* |
| Concession | *Although, Even though, Despite* |
| Cause – effect | *Because of, As a result, Consequently, Therefore* |
| Example | *For instance, For example, such as* |
| Conclusion | *In conclusion, To sum up, Overall* |

Choose by **meaning relationship**, not by how impressive the word sounds. *However* is only for contrasting ideas; using it to add an idea is wrong.

### Punctuation around linkers
- *However,* at the start of a sentence takes a comma after it and a full stop before it: *Costs are high. However, benefits are clear.*
- Joining two clauses with *however* and only a comma is a comma splice. Use a semicolon or split the sentence.
- *Although* is not used with *but* in the same sentence.

### Referencing and substitution
Instead of repeating a noun, use *this trend, such measures, these changes, the former/the latter*. Pronouns must have a clear referent. *This* on its own is easily vague; *this approach* is better.

### Paragraphing and paragraph openers
Each paragraph has one central idea stated right away in the topic sentence. Use signposting phrases such as *One major advantage is...* or *Another factor to consider is...* so the reader knows where they are. Do not write the whole essay as one block, and do not make every two sentences a new paragraph.

### Mechanical linking
- Starting every sentence with a linker (*Firstly, Secondly, Thirdly, Moreover, Furthermore...*).
- Using *Moreover* at the start of every paragraph.
- Using *On the contrary* when you only mean *however*.
- Overusing *In my opinion* in every paragraph.

### Tip
Use few linkers, but use them correctly. A 5-sentence paragraph usually needs only 1–2 clear linkers; the rest relies on referencing and the order of ideas.
'''

[modules.iw2-opinion-discussion]
title = "Opinion and discussion essays"
description = "Keep a consistent position, concede and then rebut, present two views and give your own opinion."
lesson = '''
### Opinion essay
A prompt like *To what extent do you agree or disagree?* needs a clear position. You have three options: fully agree, disagree, or partly agree. Partly agreeing is valid if you make clear *which part* and *why*. What loses marks is a vague position or changing your mind mid-essay.

### Suggested structure (opinion)
| Paragraph | Content |
|---|---|
| Introduction | Paraphrase the prompt + position (*I strongly believe that...*) |
| Body 1 | Main reason supporting the position |
| Body 2 | A second reason, or a concession followed by a rebuttal |
| Conclusion | Restate the position in different words |

### Concede, then rebut
This technique makes an essay sound mature: acknowledge an opposing point, then explain why it is weaker. For example: *Admittedly, online courses lack face-to-face interaction. Nevertheless, this drawback is outweighed by flexibility, which allows working adults to study at their own pace.* Do not overuse it: once per essay is enough.

### Discussion essay
A prompt like *Discuss both views and give your opinion.* has two tasks: present both views in a balanced way, then give your own opinion. A common structure: body 1 covers view A, body 2 covers view B together with your opinion (or the opinion is given in the introduction and restated in the conclusion). Avoid devoting a paragraph to a view you cannot explain.

### Language for stating views
- Your own opinion: *I firmly believe that..., From my perspective, ...*
- Other people's views: *Supporters argue that..., Critics point out that..., It is often claimed that...*
- Measured emphasis: *to a large extent, in most cases, tend to*.

### Stay consistent
If the introduction says *I agree*, the conclusion must not say *I disagree*. If a body paragraph includes a concession, the conclusion must still lean clearly towards one side.

### Common mistakes
1. Presenting two views but forgetting to give your own opinion (a missing part of the task).
2. Using *I* too much and emotional language (*I really hate...*).
3. Absolute generalisations (*everyone, nobody, always*).
4. Choosing *partly agree* while the body supports only one side.
5. Writing a long paragraph A and a disproportionately short paragraph B.
'''

[modules.iw2-advantages-problem-solution]
title = "Advantages/disadvantages, problem–solution, two-part question"
description = "The other three essay types: weighing pros and cons, matching problems with solutions, and answering two separate questions."
lesson = '''
### Advantages and disadvantages
There are two kinds of prompt. Type 1: *Discuss the advantages and disadvantages.* Type 2: *Do the advantages outweigh the disadvantages?* Type 2 requires you to **conclude** which side is heavier, while type 1 only needs a balanced presentation. A common structure: body 1 covers the advantages, body 2 the disadvantages. For type 2, the thesis states clearly whether the disadvantages or the advantages matter more, and both body paragraphs must support that judgement.

### Problem–solution
The prompt asks for problems (or causes) and solutions. Structure: body 1 presents 1–2 problems with explanations, body 2 presents **matching** solutions. Common mistakes: vague solutions (*The government should do something*) that do not match the problems given. Each solution should say *who does what* and *why it works*, for example *Local councils could subsidise bus tickets, which would encourage commuters to leave cars at home.*

### Two-part question
The prompt has two independent questions, for example *Why is this happening? Is it a positive or negative development?* Answer each question in its own body paragraph, in the same order as the prompt. The introduction signals the answer to both. The conclusion briefly answers both.

### Choosing a structure
| Type | Body 1 | Body 2 |
|---|---|---|
| Adv/disadv (type 1) | Advantages | Disadvantages |
| Adv/disadv (outweigh) | The weaker side | The stronger side, with a conclusion |
| Problem–solution | Problems | Solutions matching the problems |
| Two-part | Answer to question 1 | Answer to question 2 |

### Useful sentence frames
- Pros and cons: *A key benefit is..., One significant drawback is..., The main downside lies in...*
- Problems: *This has led to..., A major consequence of this trend is...*
- Solutions: *One effective measure would be to..., Governments could address this by...*
- Evaluation: *On balance, ..., Overall, the advantages clearly outweigh...*

### Common mistakes
- Covering both sides but not concluding in an outweigh essay.
- Solutions unrelated to the problems given.
- Giving only solutions and skipping the problems, or vice versa.
- Reversing the order of the two questions compared with the prompt, which makes the essay hard to follow.
- Advantages and disadvantages of very unequal length.
'''

[modules.iw2-band-descriptors-editing]
title = "Self-assessing with the 4 criteria and lifting your essay to band 7"
description = "Task Response, Coherence & Cohesion, Lexical Resource, Grammatical Range & Accuracy; editing band 5.5 sentences into band 7."
lesson = '''
### The four Writing Task 2 criteria
Each criterion is worth 25% of the score. This lesson paraphrases them in its own words and does not copy the official descriptors. Consult the official materials from the test provider for details.

| Criterion | Questions to ask yourself |
|---|---|
| Task Response | Have I answered every part? Is my position clear and consistent? Are my ideas developed and supported with examples? |
| Coherence & Cohesion | Are the ideas in a logical order? Is the paragraphing sensible? Are linkers used for the right function and not mechanically? |
| Lexical Resource | Is my vocabulary precise enough? Are there natural collocations and some less common words used in the right context? Any spelling errors? |
| Grammatical Range & Accuracy | Do I mix simple and complex sentences? Are many sentences error-free? Do errors make the meaning hard to follow? |

### Band 6 vs band 7 (paraphrased)
- **Task Response**: band 6 answers all parts but develops ideas unevenly, with rather general examples. Band 7 presents a clear position throughout and develops the main ideas fairly fully, with specific examples.
- **Coherence & Cohesion**: band 6 is organised but linking is sometimes mechanical or lacks referencing. Band 7 has a clear progression of ideas and uses a range of cohesive devices fairly naturally.
- **Lexical Resource**: band 6 has enough vocabulary but repeats words and sometimes gets collocations wrong. Band 7 is more flexible, uses some less common words, and makes few errors.
- **Grammar**: band 6 mixes simple and complex sentences but still makes quite a few errors. Band 7 uses a variety of structures and has many completely correct sentences.

Band 6.5 means being steady at 6 and reaching 7 on some criteria.

### Lifting sentences from 5.5 to 7
| Band 5.5 sentence | Problem | Band 7 sentence |
|---|---|---|
| *Many people use car so air is very bad.* | Missing article, crude cause | *Widespread car use has contributed to a serious deterioration in air quality.* |
| *Technology is good because it is useful.* | Circular, undeveloped | *Technology streamlines daily tasks, which frees up time for more meaningful activities.* |
| *I am agree with this idea.* | Grammar error, repetition | *I largely agree with this view.* |

### Techniques for raising your band
1. Replace general verbs (*get, do, make, have*) with more precise ones.
2. Use controlled nominalisation (*the rise in unemployment*).
3. Add a relative clause or participle phrase to combine two short sentences.
4. Use hedging: *tend to, may, is likely to*.
5. Make examples specific instead of *many people*.

### Self-assessment checklist after writing
1. Have I answered every part of the prompt?
2. Is my position consistent from the introduction to the conclusion?
3. Does each body paragraph have a topic sentence, an explanation and an example?
4. Are there at least 3–4 different linkers used for the right function?
5. Are at least half of the sentences error-free?
6. Is the essay ≥ 250 words?

### Typical errors of Vietnamese learners
Missing articles (*the, a*), confusing singular and plural with uncountable nouns (*informations, advices*), missing subjects, *I am agree*, and word-for-word translation from Vietnamese.
'''

[questions.iw2-001]
explanation = "The phrase *To what extent do you agree or disagree?* signals an opinion essay. You need to state a clear position and defend it. There are no keywords about problems and solutions or two separate questions."

[questions.iw2-002]
explanation = "This is a problem–solution essay: it needs both problems and solutions. Giving only solutions leaves part of the task unanswered; personal stories or comparing vehicles do not answer the prompt."

[questions.iw2-003]
explanation = "*Discuss both views and give your opinion* signals a discussion essay. You must present both views and give your own opinion."

[questions.iw2-004]
explanation = "Task 2 requires at least 250 words. 150 words is the minimum for Task 1."

[questions.iw2-005]
explanation = "Only the first sentence addresses the exact topic, *bonuses instead of higher salaries*, and points towards an evaluation. The others are about salaries in general, management or education: off-topic even though they sound related."

[questions.iw2-006]
explanation = "There are two independent questions (reasons; positive or negative), so each gets its own body paragraph, in the prompt's order. The other plans belong to other essay types."

[questions.iw2-007]
explanation = "Leaving out a required part and answering beside the question both lower Task Response. A clear position is a strength. The last option is not necessarily a mistake: a discussion prompt allows the opinion to appear in the conclusion if it is clear."

[questions.iw2-008]
explanation = "The prompt says *most young adults*, so the thesis must keep that scope. *All people* or *everyone* overextends it; the last sentence is about house prices, not a position."

[questions.iw2-009]
explanation = "*Outweigh* is a verb that often appears in advantages/disadvantages prompts. This type requires you to conclude which side is heavier."

[questions.iw2-010]
explanation = "When the prompt does not ask for an opinion, you still need to present both views in a balanced way. A brief position helps the essay stay coherent, but dropping one view entirely leaves part of the task unanswered."

[questions.iw2-011]
explanation = "The 5–30–5 plan is reasonable: you have an outline to avoid going off-topic and time to check for errors. Skipping the plan easily leads to going off-topic; planning for too long leaves too little time to write 250 words."

[questions.iw2-012]
explanation = "Checklist: (1) Task Response: name the essay type correctly and cover both sides; (2) Coherence: one central idea per body paragraph, clear order; (3) Lexical Resource: academic words such as *advantages, drawbacks, isolation*; (4) Grammar: complete sentences in the correct future or present tense."

[questions.iw2-013]
explanation = "Only the first option paraphrases the prompt, mentions both views and gives a clear opinion. The others are generic openers or theses with no position."

[questions.iw2-014]
explanation = "The prompt asks for two things: other causes and ways to address the problem. A history of the fast-food industry is off-topic, and claiming there is only one cause contradicts the question about *other causes*."

[questions.iw2-015]
explanation = "Checklist: (1) Task Response: identify the essay type, include both causes and solutions, with solutions matching the causes; (2) Coherence: problems before solutions, the linker *To address this*; (3) Lexical: *apprenticeships, subsidise*; (4) Grammar: *could* for solutions, a *so that* clause."

[questions.iw2-016]
explanation = "A *two-part question* has two separate questions. Each must be answered, usually in its own body paragraph and in the same order as the prompt."

[questions.iw2-017]
explanation = "A standard introduction needs only 2 parts: a paraphrase of the prompt and a thesis (position + plan). Stories, history or statistics make the introduction long and waste time; skipping the introduction makes the argument hard for the examiner to follow."

[questions.iw2-018]
explanation = "*In conclusion* or *In summary* is a common way to open the conclusion. Avoid *In a nutshell* (too informal) and *To sum up, I will say* (redundant)."

[questions.iw2-019]
explanation = "A thesis must have a position (*I disagree*) and a reason that sets up the body paragraphs. The other sentences are generic openers or irrelevant information; the examiner cannot tell which side you are on."

[questions.iw2-020]
explanation = "A good paraphrase changes the structure (*It is widely argued that*) and uses synonyms (*harms, traditions*) while keeping the meaning. Copying the prompt does not count towards the word count; sentence 3 changes the meaning; sentence 4 has grammar errors (*makes damage for*, *persons*)."

[questions.iw2-021]
explanation = "A good thesis mentions both views and gives an opinion with a reason. *This essay will discuss both views* has no opinion; sentence 3 is vague (everything is important); sentence 4 only lists topics."

[questions.iw2-022]
explanation = "The conclusion restates the position (in different words) and sums up the main reasons. Adding a new idea in the conclusion leaves it undeveloped; changing the position breaks consistency (lowering Task Response and Coherence)."

[questions.iw2-023]
explanation = "*In the modern/current/digital era* is a natural replacement for *nowadays*. Do not repeat *nowadays* many times, and avoid *in this modern life* (a literal translation from Vietnamese)."

[questions.iw2-024]
explanation = "A 5-minute plan contains your position and 2 main ideas, each with 1 example or explanation. A full draft takes too long; a vocabulary list does not help the argument; polishing the introduction while the body has no direction easily leads off-topic."

[questions.iw2-025]
explanation = "Sentence 1 is a memorised phrase (*with the development of society*, *more and more controversial*) that could be attached to any prompt and says nothing about this one. Examiners recognise such sentences and do not credit them in the vocabulary assessment."

[questions.iw2-026]
explanation = "Checklist: (1) Task Response: paraphrase the prompt accurately and state a clear position (*agree/disagree*); (2) Coherence: the thesis signals the 2 body ideas; (3) Lexical: *no longer necessary* becomes *unnecessary*, *available online* becomes *found online*; (4) Grammar: *now that* and *because* clauses, accurate complex sentences."

[questions.iw2-027]
explanation = "The 4-paragraph frame (introduction, 2 body paragraphs, conclusion) balances length and depth. One very long body paragraph is hard to keep coherent; one-sentence paragraphs are poor paragraphing; 5 body paragraphs in 250 words leave no idea developed."

[questions.iw2-028]
explanation = "A partial position must make clear *to what extent you agree and why*. Sentence 1 does this. *I partly agree and partly disagree* draws no clear line; sentence 3 does not answer *to what extent*; sentence 4 contradicts itself (*totally agree* yet arguing against)."

[questions.iw2-029]
explanation = "*Income inequality is widening* and *the divide between wealthy and low-income groups is growing* both keep the meaning *the gap between rich and poor is increasing*. Sentences 3 and 4 change the meaning completely: a paraphrase that changes the meaning lowers Task Response."

[questions.iw2-030]
explanation = "A good conclusion restates the position in different words, acknowledges the other side and sums up the main reasons. Sentence 2 blurs the position; sentence 3 changes it; sentence 4 adds a new, undeveloped idea (*pollution*)."

[questions.iw2-031]
explanation = "A concessive thesis (*While/Although X, Y*) shows you have considered the other side while keeping your position, which suits band 7 well. Do not use *but* after *although* (the *Although…, but…* error is common among Vietnamese learners)."

[questions.iw2-032]
explanation = "The body paragraph model: a topic sentence states the main idea, an explanation says why, an example illustrates it, and a final sentence links back to the prompt. Listing many ideas without explanation is a common mistake that keeps essays at band 5–5.5."

[questions.iw2-033]
explanation = "A topic sentence must state the paragraph's main idea and connect to the prompt. Sentence 2 is a personal example, sentence 3 is too general, and sentence 4 has nothing to do with learning to cook."

[questions.iw2-034]
explanation = "*For example* introduces an illustration. Do not write *For examples* or *Example,* on its own."

[questions.iw2-035]
explanation = "An explanation must say *why* the main idea is true (the mechanism). Sentence 1 clearly explains what *accessible* means. Sentence 2 repeats the idea, sentence 3 is unconnected information, and sentence 4 is a personal experience with no analysis."

[questions.iw2-036]
explanation = "This is listing: 4 ideas, but none is explained or illustrated. Band 6.5+ needs fewer ideas, each fully developed (Task Response: *extends and supports main ideas*)."

[questions.iw2-037]
explanation = "Realistic or hypothetical situations are valid and safe examples. Inventing specific figures as if from real research is easily unconvincing; a one-word example cannot explain the idea."

[questions.iw2-038]
explanation = "The link-back sentence sums up the paragraph and connects it to the prompt (*public funding for the arts*). Sentences 2 and 3 conclude nothing; sentence 4 is a mechanical transition that does not tie the paragraph to the question."

[questions.iw2-039]
explanation = "Use *Consequently/Therefore/As a result* to connect a cause and its effect, so the paragraph develops as a chain of reasoning instead of a list."

[questions.iw2-040]
explanation = "The example must prove the topic sentence itself: advertising → children ask for snacks → health. The other options are only superficially related (food, TV) and do not prove the idea."

[questions.iw2-041]
explanation = "Checklist: (1) Task Response: the main idea supports the prompt and is developed, not listed; (2) Coherence: all 4 steps topic → explain → example → link back, linkers used for the right function; (3) Lexical: *empathy, low-income, active citizens*; (4) Grammar: complex sentences with *because*, the relative clause *who volunteers*."

[questions.iw2-042]
explanation = "Sentence 1 has a multi-step causal chain: less commuting → less peak-hour traffic → less pressure to build roads. This is band 7 idea development. The other sentences are circular or only one shallow step."

[questions.iw2-043]
explanation = "Band 7 uses cautious language (*many, may, tends to, some*) to argue precisely. *All… hate* and *always destroys* are overgeneralisations that are easy to refute and weaken Task Response."

[questions.iw2-044]
explanation = "The two ideas must be clearly distinct and deep enough to fill a paragraph: conservation and education. Pair 2 is too vague, pair 3 repeats the same idea (saving = protecting from extinction), and pair 4 states obvious facts with no argument."

[questions.iw2-045]
explanation = "A specific hypothetical example (twice the price → choosing water) shows the mechanism of behaviour change, which is very useful when you have no data. The other sentences are obvious, too general, or personal experiences that prove nothing."

[questions.iw2-046]
explanation = "The two sentences contrast (convenient ↔ polluting), so use *However*. *Moreover* adds, *For example* illustrates, and *Therefore* shows a result: all the wrong function."

[questions.iw2-047]
explanation = "*Moreover/Furthermore/Additionally* add an idea in the same direction. Do not overuse *Besides that*, and avoid *Moreover* when the next idea contrasts."

[questions.iw2-048]
explanation = "One main idea per paragraph. Splitting paragraphs by sentence count or writing one continuous block both lower the Coherence and Cohesion score."

[questions.iw2-049]
explanation = "*Such schemes* refers back to *bike-sharing schemes* (plural). *This* and *That* go with singular nouns; *It schemes* is ungrammatical. Correct referencing avoids repetition and raises the Cohesion score."

[questions.iw2-050]
explanation = "Sentence 1 stacks linkers (*Secondly, moreover*; *furthermore, in addition*) at the start of every sentence: this is *mechanical linking*, which the band descriptors mention at bands 5–6. The other options connect ideas naturally with referencing and clauses."

[questions.iw2-051]
explanation = "*This measure* sums up the whole idea *tax plastic bags* with a general noun. The *this + summary noun* pattern (measure, trend, approach) is a natural band 7 way to create cohesion."

[questions.iw2-052]
explanation = "*On the other hand* introduces a contrasting side; it is not used to add a point (*I like coffee and also tea*). Vietnamese learners often misuse *On the other hand* to mean *in addition*. The other sentences use their linkers for the right function."

[questions.iw2-053]
explanation = "Cohesion is not only linking words: pronouns, synonyms and summary nouns are all cohesive devices. *Firstly/secondly* are linking words (sequencers). Band 7 combines a range of these devices."

[questions.iw2-054]
explanation = "*They* could refer to teachers or parents, which confuses the reader. Fix: *Parents spend more time with them at home*. Ambiguous referencing is a common Cohesion error."

[questions.iw2-055]
explanation = "Checklist: (1) Task Response: keep all the original ideas (cheap, unhealthy, obesity, children); (2) Coherence: linkers used for the right function (*Although, because, so*), referencing (*it, such meals, This habit*); (3) Lexical: synonyms (*meals, junk food*) instead of repeating *fast food*; (4) Grammar: complex sentences with concessive and causal clauses."

[questions.iw2-056]
explanation = "Topic sentence (B) → illustrating example (C) → consequence (A, *As a result*). Starting with *As a result* before any cause is illogical. The progression of ideas is central to Coherence."

[questions.iw2-057]
explanation = "*Whereas* joins two contrasting clauses in one sentence. It is not used as a sentence-initial adverb (*Whereas,*); sentence 3 has no real contrast; sentence 4 has a broken structure (*whereas… so…*)."

[questions.iw2-058]
explanation = "Coherence comes from organising ideas: one central idea per paragraph and a clear topic sentence. Adding linkers does not fix disconnected ideas (and counts as mechanical); making paragraphs longer only makes the problem worse."

[questions.iw2-059]
explanation = "*Nevertheless/Nonetheless* show a result contrary to expectation (expensive yet selling well). Varying contrast linkers beyond *However* helps both Lexical Resource and Cohesion."

[questions.iw2-060]
explanation = "In an opinion essay, state your position right away in the thesis of the introduction and keep it until the conclusion. Leaving the opinion to the end or not giving one means the examiner does not see a *clear position throughout*."

[questions.iw2-061]
explanation = "*Agree* is a verb and is not used with *am*. Write *I agree* or *I do not agree*; the error *I am agree* comes from translating the Vietnamese *tôi đồng ý* word for word."

[questions.iw2-062]
explanation = "A discussion essay needs both views (one paragraph per view) and your own opinion. Writing about only one side leaves part of the task unanswered; describing your hometown or the history of cities is off-topic."

[questions.iw2-063]
explanation = "The concede–rebut pattern: *Admittedly/It is true that X; however, Y*. Sentence 1 acknowledges the cost but rebuts it with a comparison. Sentences 2 and 3 contradict themselves, and sentence 4 offers no rebuttal."

[questions.iw2-064]
explanation = "The Task Response descriptor requires *a clear position throughout*. A position that contradicts itself between the introduction and the conclusion lowers Task Response (and Coherence too)."

[questions.iw2-065]
explanation = "*Proponents/Supporters/Advocates of this idea argue that…* lets you present other people's views objectively in a discussion essay, keeping them separate from your own opinion."

[questions.iw2-066]
explanation = "*I would argue that* is an academic way to give an opinion: soft yet clear. *In my opinion, I think* is redundant; *I think 100%* is too colloquial; *Everybody knows* is an unsupported generalisation."

[questions.iw2-067]
explanation = "A discussion prompt has 3 requirements: view 1, view 2 and your own opinion. A story about your first day at school is personal and does not develop the argument."

[questions.iw2-068]
explanation = "When you fully agree, both body paragraphs must serve your position; one paragraph can rebut the opposing view. Writing both sides equally with no conclusion makes the position unclear."

[questions.iw2-069]
explanation = "Checklist: (1) Task Response: present one view objectively (*Supporters… argue*) and give a clear opinion of your own; (2) Coherence: move from other people's view to yours with *However, in my view*; (3) Lexical: *financial education, budgeting, reinforced*; (4) Grammar: complex sentences with *because, when, regardless of*."

[questions.iw2-070]
explanation = "An effective rebuttal states the opposing argument accurately and then refutes it with specific reasoning. *They are wrong* gives no reason; sentence 3 undermines the writer's own position; sentence 4 denies the other side exists, which is unconvincing."

[questions.iw2-071]
explanation = "Signal the position in the thesis, develop it more strongly in the paragraph on the favoured view, and confirm it in the conclusion: a clear position throughout. Putting it in the View A paragraph is confusing; staying neutral leaves out *give your opinion*."

[questions.iw2-072]
explanation = "*It seems reasonable to conclude* and *There is a strong case for* express a clear but cautious position, suitable for academic writing. *Definitely… everyone 100%* and *the only solution to every* are unsupported absolute claims."

[questions.iw2-073]
explanation = "*While it is true that X, Y* is a one-sentence concession pattern. Do not add *but* to the second clause (*Although…, but…* is an error)."

[questions.iw2-074]
explanation = "An advantages/disadvantages prompt needs both sides, one paragraph each. A causes–solutions plan belongs to another type; writing about only one side leaves part of the task unanswered."

[questions.iw2-075]
explanation = "A solution sentence uses the modal *should/could* + base verb. Common errors: *should to build* or *should builds*."

[questions.iw2-076]
explanation = "The solution must tackle the cause (lack of jobs in rural areas). Building malls in cities makes the problem worse; raising ticket prices or banning moving is unrealistic and does not address the root cause."

[questions.iw2-077]
explanation = "An *outweigh* question requires a conclusion about which side is heavier, stated in the thesis and the conclusion. Listing both sides without evaluating them is an incomplete answer."

[questions.iw2-078]
explanation = "Vary the words for *disadvantage*: *drawback, downside, shortcoming*. Avoid repeating *disadvantage* many times to raise Lexical Resource."

[questions.iw2-079]
explanation = "A two-part thesis should signal the answers to both questions (reasons + evaluation). Sentence 2 only partly answers question 1; sentence 3 only answers question 2; sentence 4 is off-topic."

[questions.iw2-080]
explanation = "Traffic and construction directly cause noise. House prices and birth rates are other urban issues: superficially related but not causes of noise pollution."

[questions.iw2-081]
explanation = "A good solution says who acts, what they do and why it works. *Do something* and *try harder* are too vague; sentence 4 offers no solution at all."

[questions.iw2-082]
explanation = "Checklist: (1) Task Response: a specific solution matching the *food waste* problem; (2) Coherence: solution → mechanism → supporting solution, linkers *also, so that*; (3) Lexical: *edible, donate, tax benefits*; (4) Grammar: *require sb to*, the implied conditional *This would…*."

[questions.iw2-083]
explanation = "The prompt asks about pros and cons *for consumers*. The impact on small shop owners fits the broad topic but the wrong group: a very common scope error. The other three sentences are about buyers."

[questions.iw2-084]
explanation = "To argue convincingly that the disadvantages are heavier, briefly acknowledge the advantages, then develop the disadvantages in depth with an evaluation criterion (*more lasting*). Reversing the balance, or balancing without evaluating, leaves the conclusion unsupported."

[questions.iw2-085]
explanation = "Band 7 evaluates solutions with sound criteria (cost–benefit, speed of effect, feasibility). Personal preferences or how *fashionable* an idea is are not academic reasons."

[questions.iw2-086]
explanation = "The second question asks for *effects*, not solutions. Writing solutions answers the wrong question and sharply lowers Task Response, however well the essay is written."

[questions.iw2-087]
explanation = "*Far outweigh* is a collocation emphasising that the benefits are much greater. Note the verb agrees with the plural subject: *benefits outweigh*, not *outweighs*."

[questions.iw2-088]
explanation = "Task 2 is marked on 4 equally weighted criteria: TR, CC, LR, GRA. Pronunciation and Fluency belong to Speaking; spelling falls under Lexical Resource."

[questions.iw2-089]
explanation = "*Advice* is uncountable and takes no *-s*. The same goes for *information, equipment, furniture, knowledge*. To count it, use *a piece of advice*."

[questions.iw2-090]
explanation = "The correct sentence has the articles *the Internet* and *an important role*, and the verb *plays*. The distractors contain typical errors of Vietnamese learners: missing articles, unconjugated verbs, *is play*, *a important*."

[questions.iw2-091]
explanation = "*Although…, but…* has an extra conjunction (drop *but*); *informations* is wrong because *information* is uncountable. Sentences 3 and 4 are correct (a relative clause, a second conditional)."

[questions.iw2-092]
explanation = "*Poses a serious threat to* is a precise, specific collocation. Stacking adjectives (*extremely huge enormous*) or repeating *very very* does not raise Lexical Resource and even introduces errors (*a extremely*)."

[questions.iw2-093]
explanation = "Answering only part of the prompt pulls Task Response down (often to band 5 or below on this criterion). The four criteria are averaged, so good vocabulary cannot fully make up for it."

[questions.iw2-094]
explanation = "The head of the subject is *The number* (singular), so use *has*. Compare: *A number of students have…* (many students, plural)."

[questions.iw2-095]
explanation = "Under 250 words usually loses marks (mainly in Task Response) because the ideas are not fully developed. It does not score zero, but it gets no extra credit for being brief either."

[questions.iw2-096]
explanation = "Checklist: (1) Task Response: keep the original ideas; (2) Coherence: link cause and effect with *As a result*, a *which* relative clause instead of *and it*; (3) Lexical: *lead busy lives, rely on, contribute to*, avoiding the colloquial *fat*; (4) Grammar: fix *people is* → *are*, *time for cook* → *time for cooking*, *it make* → *can contribute*."

[questions.iw2-097]
explanation = "Sentence 1 combines an inverted third conditional (*Had… invested*) with a non-defining relative clause, and is grammatically accurate. Sentence 2 is correct but simple; sentences 3 and 4 have basic structural errors."

[questions.iw2-098]
explanation = "Band 7 needs varied, natural cohesion (reference, substitution, summary nouns) without overusing sentence-initial linkers. Adding *Moreover* everywhere is mechanical; one-sentence paragraphs and repeated nouns make cohesion worse."

[questions.iw2-099]
explanation = "In the last 5 minutes, check for recurring errors (verb agreement, articles, plurals) and make sure every part of the prompt is answered. Rewriting the introduction can create new errors; counting every word wastes time (estimating by the number of lines is enough)."

[questions.iw2-100]
explanation = "Checklist: (1) Task Response: keep one main idea (reducing isolation) and develop it in depth instead of listing 3 ideas; (2) Coherence: topic → explanation → example → link back, dropping *Also… Also… So*; (3) Lexical: *elderly, stay in regular contact, isolation*; (4) Grammar: relative clauses, *which means*, the participle phrase *living alone*."
