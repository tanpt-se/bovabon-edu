[questions.django-lv032]
prompt = '''Compare three ways to prevent concurrent overwrites in Django: F() expressions, select_for_update and optimistic locking with a version column. When would you choose each?'''
keywords = [["f()", "f expression"], ["select_for_update", "row lock", "pessimistic"], ["version", "optimistic"], ["race", "concurrent", "concurrency"], ["update()", "rows", "row count"]]
model_answer = '''F() fits when the change is a simple arithmetic operation on one column (increment/decrement): the DB makes it atomic with no lock. select_for_update (pessimistic) takes a row lock inside the transaction when you must read, check complex conditions and then write, at the cost of lower concurrency and a risk of deadlocks. Optimistic locking uses a version column: filter(pk=..., version=v).update(..., version=v+1) and check the number of affected rows; if it is 0 there was a conflict, so raise an error or retry. It suits cases where races are rare, such as a user's long-running edit form.'''
explanation = '''This senior question checks understanding of race conditions and the trade-off between pessimistic and optimistic locking.'''

