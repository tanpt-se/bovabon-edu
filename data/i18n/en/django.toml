2. save_with_retry(store, pk, mutate, attempts=3): loop at most attempts times: read a copy of the current record, call mutate(copy) which returns a changes dict, and try update_if_version with the version that was read. On success return True; when attempts run out return False. A missing pk returns False immediately.
