[modules.ig-tense-control]
title = "Tense control in Task 1 and Speaking"
description = "Choosing tenses from the chart's time frame, forecasts, the present perfect, and storytelling in Speaking Part 2."
lesson = '''
### Suggested learning path
The IELTS area is for learners who have roughly finished B1. A sensible order: study CEFR B2 alongside **IELTS Grammar** and **IELTS Vocabulary**, then Reading and Listening, then Writing Task 1, Task 2, and finally Speaking. Finish by using the Mock Exam feature until you score at least 70% on band 6.5 questions. The app is text-only: practise separately with real audio and record yourself when working on Listening and Speaking.

### Rule: the tense follows the data's time frame
In Writing Task 1, you do not choose a tense by feel but by the **time frame shown on the chart**. Look at the time axis before you write your first sentence.

| Time frame of the data | Tense to use | Example |
|---|---|---|
| Entirely in the past (1990–2010) | Past simple | *Sales rose sharply between 1990 and 2000.* |
| Forecast (2030, 2040) | will / is expected to / is projected to | *Demand is projected to reach 50 million by 2040.* |
| No time frame, general data | Present simple | *The chart shows how energy is used in homes.* |
| From the past up to now | Present perfect | *The number of users has doubled since 2015.* |
| Before another past point | Past perfect | *By 2005, the figure had already fallen to 12%.* |

### Present perfect vs past simple
Use the **past simple** with a finished time point (*in 2008, last year*). Use the **present perfect** with *since, for, so far, over the past decade*, or when the result is still relevant now. Common errors for Vietnamese learners: writing *Since 2010, the number rose* (correct: *has risen*) or *The price has risen in 2012* (correct: *rose*).

### Keep tenses consistent
A paragraph describing past data should not jump into the present: ~~The figure fell to 8% in 2000 and then rises to 11%~~. You may change tense when the content changes, for example describing past data and then a forecast: *Sales peaked in 2010 and are forecast to fall again by 2030.* The overview follows the same rule: *Overall, car ownership increased throughout the period.*

### Speaking Part 2: telling a story in past tenses
When describing an experience on the cue card, use the **past simple** for the main sequence of events, the **past continuous** for background (*I was walking home when…*), and the **past perfect** for earlier events (*I had never met him before*). Switch to the present to give your current feelings: *Now I think it was the best decision I have ever made.* Do not jump back and forth between past and present while telling the story.

### Common errors
- Forgetting to mark tense because Vietnamese verbs do not change form: ~~Last year I go to Da Nang~~.
- Using *will* for every forecast; higher bands use *is expected to, is likely to, is set to*.
- Using the present perfect with a definite past time (*yesterday, in 2019*).

### Time tip
Before writing Task 1, underline the time frame in the question and write a "P" (past), "F" (future), or "N" (now) at the top of your answer. It takes 10 seconds but prevents tense errors that run through the whole essay.
'''

[modules.ig-complex-sentences]
title = "Complex and compound sentences with correct punctuation"
description = "Adverbial clauses, correct conjunction pairs, compound sentences, and how to avoid run-ons and fragments."
lesson = '''
### Why complex sentences matter
The Grammatical Range & Accuracy criterion expects a mix of simple and complex sentences, with many error-free sentences. Band 6 uses complex sentences but with errors; band 7 uses a variety of structures that are mostly accurate. Goal: at least 2 correct complex sentences per paragraph — there is no need to force 5 clauses into one sentence.

### Conjunctions by function
| Function | Conjunctions | Example |
|---|---|---|
| Concession | although, though, even though | *Although the cost is high, many families still buy cars.* |
| Contrast between two clauses | whereas, while | *Urban areas are crowded, whereas rural areas are sparsely populated.* |
| Condition | provided that, as long as, unless | *Cities will remain liveable provided that public transport improves.* |
| Purpose | so that, in order to | *Schools should offer online options so that working adults can study.* |
| Reason | because, since, as | *Since housing is expensive, young people stay with parents.* |
| Result | so, so… that, such… that | *The fee was so high that few students applied.* |

### Punctuation
Two independent clauses joined by a coordinating conjunction need a comma before the conjunction: *Prices rose, but wages stayed flat.* A subordinate clause at the start of a sentence needs a comma after it: *Although prices rose, demand did not fall.* If the subordinate clause comes second, a comma is usually not needed: *Demand did not fall although prices rose.* A semicolon (;) joins two closely related independent clauses: *Some people prefer cities; others choose the countryside.*

### Run-ons and fragments
- **Run-on / comma splice:** ~~Many people use social media, it saves time.~~ Fix: *Many people use social media because it saves time.*
- **Fragment:** ~~Because the roads were closed.~~ This is only a subordinate clause; it needs a main clause: *Because the roads were closed, the event was cancelled.*
- A short sentence without a main verb is also a fragment: ~~The government, which has introduced new taxes.~~

### Typical errors of Vietnamese learners
1. **Although … but**: Vietnamese says *Mặc dù… nhưng…*, but English uses only one of the two: *Although it rained, we went out.*
2. **Because … so**: likewise, use only one conjunction.
3. Using *despite* and *in spite of* with a clause: ~~Despite he was tired~~. They are followed by a noun/V-ing or *the fact that*.
4. *Whereas/while* without a comma between the two contrasting clauses.

### Self-check routine
For each long sentence, ask: (1) is there a main finite verb? (2) does each clause have its own subject? (3) does the conjunction have the right function? (4) is the comma placement sensible? If unsure, two correct short sentences are better than one long wrong one.
'''

[modules.ig-relative-participle]
title = "Relative clauses and participle clauses"
description = "Which, who, that, whose; defining and non-defining clauses; reduced participle clauses and sentence-initial participle phrases."
lesson = '''
### Relative clauses for concise linking
Relative clauses let you merge two sentences into one while keeping the meaning clear — very useful in Task 2 and Speaking Part 3. Choose the pronoun according to the noun before it.

| Pronoun | Refers to | Example |
|---|---|---|
| who | people (subject) | *Teachers who use technology engage students more.* |
| whom | people (object, formal) | *The experts whom we consulted disagreed.* |
| which | things | *The scheme, which began in 2018, reduced waste.* |
| that | people/things (defining only) | *The policy that was introduced last year failed.* |
| whose | possession | *Students whose parents read to them tend to read earlier.* |
| where / when | place / time | *Cities where public transport is cheap have less traffic.* |

### Defining vs non-defining
- **Defining:** needed to identify who/what we mean; no commas; *that* is allowed. *Workers who lack digital skills may lose their jobs.* (only the group lacking those skills)
- **Non-defining:** extra information, commas on both sides, **no** *that*. *Automation, which is spreading quickly, will change many jobs.*
- *Which* can comment on the whole previous clause: *Fuel prices have doubled, which has forced many to cycle to work.*

### Reducing with participles
| Full form | Reduced | Note |
|---|---|---|
| *students who study abroad* | *students studying abroad* | V-ing for active meaning |
| *a law that was passed in 2020* | *a law passed in 2020* | past participle for passive meaning |
| *Because he lacked funds, he cancelled it.* | *Lacking funds, he cancelled it.* | sentence-initial participle phrase |
| *After they had analysed the data, the team…* | *Having analysed the data, the team…* | perfect, earlier action |

**Golden rule:** the subject of a sentence-initial participle phrase must be the same as the subject of the main clause. ~~Walking down the street, the rain started.~~ (the rain was not walking). Correct: *Walking down the street, I felt the rain start.*

### Common errors
1. Adding an extra pronoun: ~~The book which I bought it~~ → *The book which I bought*.
2. Using *that* after a comma: ~~The film, that I saw~~.
3. Mixing up *who/which* for people and things.
4. Dangling participles as above.
5. Leaving out the commas of a non-defining clause, which changes the meaning.

### Using it for band 7
A sentence such as *Governments should invest in public transport, which reduces congestion and lowers emissions* compresses two ideas into one. Do not overuse it: one or two relative clauses per paragraph is enough; too many make sentences confusing.
'''

[questions.ig-001]
explanation = "The period 2001–2010 is finished, so use the past simple *rose*. The other options are wrong: no tense marking (*rise*), the wrong past participle form (*has rose*), or an added *is* with a verb that has no passive."

[questions.ig-002]
explanation = "*Since 2015* links the past with the present, so use the present perfect *has risen*. *Rose* is only correct with a finished past time."

[questions.ig-003]
explanation = "*In 2000* is a finished time point, so use the past simple. *Fall* is irregular: *fell*."

[questions.ig-004]
explanation = "The 2030 figure is a forecast, so use *is projected to* (or *will*). The past simple and present perfect with a future time point both give the wrong meaning."

[questions.ig-005]
explanation = "Both parts belong to the past, so both use the past simple: *fell … rose*. The other options jump between past and present or use the present perfect with a definite time (*in 1995*)."

[questions.ig-006]
explanation = "Sentences 1 and 3 contain *since / over the past decade*, so the present perfect fits. Sentence 5 uses the past perfect for something that happened before 2000. Sentences 2 and 4 have a definite past time (*in 2012, in 2008*) and need the past simple."

[questions.ig-007]
explanation = "*Since* goes with a starting point (2012). *For* goes with a length of time (five years). Both are used with the present perfect."

[questions.ig-008]
explanation = "The match started before I arrived, so use the past perfect *had + past participle*: *had already started*."

[questions.ig-009]
explanation = "This is a finished story with the time marker *last summer*, so use the past simple for both consecutive actions: *stayed … visited*."

[questions.ig-010]
explanation = "Checklist: (1) the 2000–2010 data uses the past simple; (2) the 2030 forecast uses *is projected to / will*; (3) all figures are included with the correct prepositions *from… to*, *by 2030*; (4) no comments on causes that are not in the data."

[questions.ig-011]
explanation = "The rise continued and was completed before the past point 2015, so use the past perfect continuous *had been rising*. *Has been rising* is linked to the present."

[questions.ig-012]
explanation = "The overview separates past data (*rose*) from the forecast (*is expected to continue*) and states the general trend. The other options use the wrong tense or the wrong verb form."

[questions.ig-013]
explanation = "Sentence 1: past continuous for the background, past simple for the interrupting event. Sentences 2 and 4: past perfect for earlier events, and a switch to the present for current feelings. Sentences 3 and 5 use the wrong tense with a past time marker."

[questions.ig-014]
explanation = "Checklist: (1) the main sequence of events is in the past simple; (2) background is in the past continuous; (3) earlier events are in the past perfect; (4) the last sentence switches to the present to give your feelings; (5) no tense jumping midway; (6) natural linkers (*so, by the third month*)."

[questions.ig-015]
explanation = "English uses only one conjunction: *Although … , we …*. Vietnamese learners often translate *Mặc dù… nhưng…* literally as *although … but*. *Despite* is not followed by a full clause."

[questions.ig-016]
explanation = "A *because…* clause is only a subordinate clause and needs a main clause (*the match was cancelled*). Option 3 also lacks a main verb."

[questions.ig-017]
explanation = "The weather was bad but the flight was still on time: a concession relationship. *Although, though, even though* are all followed by a clause."

[questions.ig-018]
explanation = "Two independent clauses cannot be joined by a comma alone (comma splice) or by nothing at all (run-on). Using the conjunction *because* is the simplest fix."

[questions.ig-019]
explanation = "*Whereas* expresses a contrast between two clauses. The other words express reason, purpose, or condition, so the meaning is wrong."

[questions.ig-020]
explanation = "Sentence 2 has an unnecessary *so* (*because … so* is an error carried over from Vietnamese). Sentence 4 is wrong because *despite* is not followed by a clause with a subject and verb; it should be *Although…* or *Despite the high cost…*."

[questions.ig-021]
explanation = "*Provided that* and *as long as* both mean *on condition that*, and they take a present-tense clause for future meaning."

[questions.ig-022]
explanation = "The structure *so + adjective + that* expresses a result. *Such* needs a noun: *such a high fee that…*."

[questions.ig-023]
explanation = "The *although* clause comes first, followed by a comma and the main clause. Option 2 is a comma splice, option 3 has an unnecessary *but*, and option 4 puts the comma in the wrong place."

[questions.ig-024]
explanation = "Checklist: (1) *although* is used correctly without an added *but*; (2) *so that* is followed by a clause with a subject and verb; (3) each sentence is correctly punctuated; (4) ideas are clear, with no repetition."

[questions.ig-025]
explanation = "*Despite* must be followed by a noun, V-ing, or *the fact that + clause*. *In spite* must be followed by *of*."

[questions.ig-026]
explanation = "A semicolon joins two closely related independent clauses. It is not used after a subordinating conjunction (*although*) or before *because*."

[questions.ig-027]
explanation = "Sentence 1 has no main verb. Sentence 2 is a comma splice. Sentence 5 is only a subordinate clause. Sentences 3 and 4 are complete."

[questions.ig-028]
explanation = "Checklist: (1) each subordinate clause uses the right conjunction with no extra *but*; (2) a comma follows an opening clause; (3) a clear position; (4) no run-ons or fragments; (5) varied linkers."

[questions.ig-029]
explanation = "*Who* refers to people as the subject. *Which* is for things, *whose* for possession, *where* for places."

[questions.ig-030]
explanation = "The relative pronoun already replaces the object, so do not add *it*. *Who* is for people; *what* is not used as a relative pronoun here."

[questions.ig-031]
explanation = "*Whose parents* shows possession (the parents of those students)."

[questions.ig-032]
explanation = "A non-defining clause has commas at both ends and does not use *that*."

[questions.ig-033]
explanation = "An active meaning is reduced with V-ing: *students studying abroad*. The past participle has a passive meaning."

[questions.ig-034]
explanation = "The passive clause *that was passed* is reduced to the past participle: *passed*."

[questions.ig-035]
explanation = "Sentence 2 is wrong because *that* is not used after a comma (non-defining). Sentence 4 is a dangling participle: *the rain* is not the one walking. Sentence 5 uses *which* to comment on the whole previous clause."

[questions.ig-036]
explanation = "The perfect participle phrase *Having analysed the data…* shows that the analysis happened first. The blank needs only *having*."

[questions.ig-037]
explanation = "You can use the full clause *which began* or reduce it with the past participle *begun*. However, *which began* is the most natural."

[questions.ig-038]
explanation = "Checklist: (1) the defining clause has no commas; (2) the non-defining clause has commas and uses *which/who*, not *that*; (3) no extra pronouns; (4) the verb agrees with the subject."

[questions.ig-039]
explanation = "The subject of the participle phrase must match the subject of the main clause: *the researcher* lost the funding and stopped the experiment."

[questions.ig-040]
explanation = "The non-defining relative clause with *which* modifies *public transport* and follows a comma. *That* is not used after a comma; option 3 is a run-on; *what* is not a relative pronoun."

[questions.ig-041]
explanation = "Sentence 2 needs *who* (subject). Sentence 5 is a participle/imperative phrase without a matching subject. Sentence 1 uses *whom* (object), and sentences 3 and 4 use correct reduced structures."

[questions.ig-042]
explanation = "Checklist: (1) the subject of the participle phrase matches the subject of the main clause; (2) *which/whose* is used correctly, with commas when non-defining; (3) each sentence has a main verb; (4) not too many clauses in one sentence."

[modules.ig-conditionals-hypothesis]
title = "Conditionals and hypothesis"
description = "Zero to third conditionals, mixed conditionals, unless, as long as, if governments were to..., and hypothetical clauses."
lesson = '''
### The four basic conditionals
| Type | Structure | Used for | Example |
|---|---|---|---|
| 0 | If + present, present | facts, general rules | *If water reaches 100°C, it boils.* |
| 1 | If + present, will + V | real future possibilities | *If fares fall, more people will use buses.* |
| 2 | If + past, would + V | unreal present situations | *If I were the mayor, I would ban cars downtown.* |
| 3 | If + past perfect, would have + past participle | hypotheses about the past | *If the city had invested earlier, congestion would have been lower.* |

Mixed: *If the government had taxed sugar earlier, obesity rates would be lower today.* (past → present).

### In Task 2
First and second conditionals are very natural when proposing solutions or predicting consequences. Use the first conditional when you see a realistic possibility: *If universities offer more online courses, access to education will improve.* Use the second to discuss an unlikely change: *If governments were to ban private cars, cities would become cleaner.* The *were to* and *should* structures are more formal: *If governments were to raise fuel tax… / Should the number of drivers continue to grow…*

### Alternatives to if
| Word | Meaning | Example |
|---|---|---|
| unless | if not (= if … not) | *Unless wages rise, families will struggle.* |
| as long as / provided (that) | on condition that | *Remote work is fine as long as productivity stays high.* |
| in case | as a precaution | *Carry a map in case your phone dies.* |
| otherwise | if not, then | *Cities must act now; otherwise, pollution will worsen.* |

Do not add another negative with *unless*: ~~Unless it doesn't rain~~.

### Conditional inversion (band 7)
*Had the company trained its staff, the mistake would not have happened.* (= If the company had trained…). *Were people better informed, they would choose healthier food.* Use it only once or twice, and make sure it is correct.

### Common errors of Vietnamese learners
1. Using *will* in the *if* clause: ~~If it will rain~~. Correct: *If it rains*.
2. Using *would* in the *if* clause: ~~If I would have money~~. Correct: *If I had money, I would…*
3. Confusing *was/were*: formal hypotheses use *were* for every person (*If she were…*).
4. A third-conditional meaning written as a second conditional: ~~If he studied harder, he would pass last year~~.
5. Forgetting the comma when the *if* clause comes first.

### How to choose the type
Ask two questions: (1) could this really happen? (2) is the time present, future, or past? Choose the type from that, then check each clause separately.
'''

[modules.ig-passive-impersonal]
title = "The passive and impersonal structures"
description = "The passive in process descriptions, It is believed that..., X is said to..., and when not to use the passive."
lesson = '''
### When to use the passive
The passive makes sense when the agent is unimportant or unknown, or when you want to focus on what is affected. In a **Task 1 process** (a production process, a natural cycle), almost every step is in the passive because the reader cares about the materials and stages.

*First, the raw materials are collected and transported to the factory. Next, they are crushed and mixed with water.*

### Passive forms
| Tense | Structure | Example |
|---|---|---|
| Present simple | am/is/are + past participle | *The bricks are heated in a kiln.* |
| Past simple | was/were + past participle | *The data was collected in 2019.* |
| Present perfect | has/have been + past participle | *The road has been repaired.* |
| Future | will be + past participle | *More jobs will be created.* |
| Modal | modal + be + past participle | *Waste can be recycled.* |
| Continuous | is/are being + past participle | *The bridge is being rebuilt.* |

To add the agent, use *by*: *The water is filtered by a series of tanks.* Add it only when the agent is meaningful.

### Sequencing in a process
Use sequencing words: *First, Next, Then, After that, Finally, Once the mixture has cooled…, At the same time, Subsequently*. Do not repeat *then* in every sentence. Use *when/once/after* clauses to link two steps: *Once the grapes have been picked, they are transported to the winery.*

### Impersonal structures
Use them in Task 2 to present general opinions without claiming them as your own.
- *It is widely believed that technology improves learning.*
- *Young people are said to spend too much time online.*
- *It has been argued that tuition fees should be abolished.*
- *The policy is expected to reduce traffic.*

The forms *S + is said/believed/thought to + V* and *It is said that + clause* mean the same; choose the second when the clause is long. For past or completed events, use *to have + past participle*: *The city is believed to have grown rapidly after 1990.*

### When not to use the passive
- When the agent is the main point: *Governments must act* is better than ~~Action must be taken by governments~~.
- With intransitive verbs, which have no passive: ~~The accident was happened~~, ~~The price was risen~~ (*happen, rise, occur, appear, fall* have no passive).
- When an essay written entirely in the passive sounds heavy.

### Common errors
1. Missing *be*: ~~The water heated~~.
2. Using the base form or V-ing instead of the past participle: ~~is produce~~, ~~is producing~~ (when the meaning is passive).
3. Forgetting irregular past participles: ~~was build~~, ~~were gave~~.
4. Wrong subject: ~~People are believed that~~.

### Tip
Before writing a process, ask yourself: "who does it?" If it is a machine or a natural law, use the passive; if a person makes decisions (Task 2), prefer the active.
'''

[modules.ig-nominalisation-noun-phrases]
title = "Nominalisation and academic noun phrases"
description = "Turning verbs and adjectives into nouns; long noun phrases; the + comparative... the + comparative; academic style."
lesson = '''
### What nominalisation is
Nominalisation turns a verb or adjective into a noun to compress information and create an academic style. Compare:

- Everyday: *Many people lose their jobs because machines can do more tasks.*
- Academic: *The increasing capability of machines is leading to job losses.*

The second sentence is more concise and its subject is a concept rather than people. This is a feature of band 7 in Lexical Resource and Grammatical Range.

### Common pairs
| Verb / adjective | Noun | Example |
|---|---|---|
| decide | decision | *The decision to close the school was criticised.* |
| increase | increase | *A sharp increase in prices…* |
| develop | development | *Economic development brings new risks.* |
| fail | failure | *Failure to plan leads to waste.* |
| able | ability | *The ability to adapt is vital.* |
| important | importance | *The importance of sleep is often ignored.* |
| depend | dependence / dependency | *Dependence on foreign oil is risky.* |
| grow | growth | *Rapid growth strains housing.* |

### Long noun phrases
Structure: *determiner + modifiers + head noun + post-modifiers*. Example: *the rapid expansion of low-cost airlines in Southeast Asia*. What follows the head noun is usually *of*, another preposition, a relative clause, or a participle. With a long subject like this, find the head noun (*expansion*) to choose the verb form: *The rapid expansion of airlines has/have…* → *has*.

### The + comparative
The structure *The + comparative, the + comparative* shows two parallel changes: *The more people use public transport, the fewer cars are on the road.* Do not write ~~The more… more~~ (missing the second *the*).

### Turning everyday sentences into academic ones
| Everyday | Academic |
|---|---|
| *People are worried because prices keep going up.* | *Rising prices are a source of growing concern.* |
| *If we don't act, the problem will get worse.* | *Failure to act will exacerbate the problem.* |
| *Many students find it hard to concentrate.* | *Difficulty concentrating is common among students.* |

### Common errors
1. Too much nominalisation, so the sentence reads like a hard-to-follow list of nouns. Balance it with strong verbs.
2. Wrong word class: ~~The economic of the country~~ → *The economy*; ~~an important of~~ → *the importance of*.
3. Forgetting the article before a singular countable noun.
4. Overusing *of*: ~~the development of the growth of the economy of the country~~.
5. Confusing singular/plural subjects in long phrases (see the Accuracy module).

### How to practise
Take one of your own band 6 Task 2 essays, pick 3 sentences with "people + verb", and rewrite them with an abstract noun as the subject. Keep whichever version reads more naturally.
'''

[questions.ig-043]
explanation = "First conditional: *If + present simple, will + V*. Do not use *will* in the *if* clause."

[questions.ig-044]
explanation = "Second conditional (unreal hypothesis): *If + past simple (were), would + V*. Do not use *would* in the *if* clause."

[questions.ig-045]
explanation = "Zero conditional (a general rule): *If + present simple, present simple*. The subject is *it*, so the verb takes *-s*."

[questions.ig-046]
explanation = "Third conditional: *If + past perfect, would have + past participle*. Do not use *would have* in the *if* clause."

[questions.ig-047]
explanation = "*Unless* = *if … not*; it is already negative. Do not add *not*: ~~Unless wages don't rise~~."

[questions.ig-048]
explanation = "Sentences 2 and 4 are wrong because they use *will/would* in the *if* clause. Sentence 5 is correct: *as long as* + present for future meaning."

[questions.ig-049]
explanation = "*Otherwise* means *if not, then*; it comes between two independent clauses after a semicolon and is followed by a comma."

[questions.ig-050]
explanation = "Mixed conditional: a past hypothesis (*had taxed*) with a present result (*would be … today*). The blank needs only *would be*."

[questions.ig-051]
explanation = "*If … were to + V* expresses an unlikely hypothesis and combines with *would + V*. The other options mix tenses between the *if* clause and the main clause."

[questions.ig-052]
explanation = "Checklist: (1) first conditional: *if + present, will + V*; (2) second conditional: *if + were/past, would + V*; (3) no *will* or *would* in the *if* clause; (4) a comma after an opening *if* clause; (5) the ideas are sensible and feasible."

[questions.ig-053]
explanation = "Third-conditional inversion: *Had + S + past participle, S + would have + past participle*, without *if*. The other options have the wrong word order or tense."

[questions.ig-054]
explanation = "*Unless* + present, combined with *will* in the main clause. Do not add *not* and do not use *will* after *unless*."

[questions.ig-055]
explanation = "Sentence 3 needs *would have passed* because it is about the past. Sentence 5 has an extra negative after *unless*. Sentences 1 and 2 are correct formal inversions, and sentence 4 is a correct mixed conditional."

[questions.ig-056]
explanation = "Checklist: (1) the inversion or mixed conditional uses correct tenses; (2) *as long as/provided that* + present; (3) *unless* is not used with a negative; (4) a clear opinion; (5) not too many conditional clauses in a row."

[questions.ig-057]
explanation = "Processes use the passive: *are + past participle*. Bricks do not fire themselves, and the subject is plural, so use *are*."

[questions.ig-058]
explanation = "*Rise* is intransitive, so it has no passive: *The price rose*. This is a common error because Vietnamese uses *bị/được* freely."

[questions.ig-059]
explanation = "The data *was collected* in the past, and the subject is singular: *was collected*."

[questions.ig-060]
explanation = "A completed earlier step is expressed with the present perfect passive: *have been picked*. The subject *grapes* is a thing, so the passive is needed."

[questions.ig-061]
explanation = "Impersonal structure: *It is believed that + clause*. The other three options are ungrammatical (*believe + to V* needs a suitable subject)."

[questions.ig-062]
explanation = "The structure *S + is/are said to + V* conveys the meaning of *People say that…*."

[questions.ig-063]
explanation = "*Happen, rise, occur* are intransitive, so they have no passive. *Build* and *produce* are transitive."

[questions.ig-064]
explanation = "Passive with a modal: *modal + be + past participle*. The blank needs *can be*."

[questions.ig-065]
explanation = "Future passive: *will be + past participle*."

[questions.ig-066]
explanation = "Checklist: (1) correct passive *are + past participle*; (2) varied sequencing words (*first, next, then*), not *then* over and over; (3) no first person or opinions; (4) all three stages are covered; (5) accurate vocabulary (*pulp, chips*)."

[questions.ig-067]
explanation = "For an event earlier than the time of *believe*, use *to have + past participle*. Option 3 is missing *is*."

[questions.ig-068]
explanation = "When the agent (*governments*) is the main idea, the active is better: *Governments must act to cut emissions.* The other three sentences are fine because the agent is unimportant."

[questions.ig-069]
explanation = "Sentence 2 uses the passive with an intransitive verb. Sentence 4 lacks the past participle (*are produced*). The other three sentences use impersonal structures correctly."

[questions.ig-070]
explanation = "Checklist: (1) impersonal structures used correctly; (2) the passive has a past participle and the auxiliary *be*; (3) no passive with intransitive verbs; (4) the argument is developed (*However…*); (5) the passive is not overused in every sentence."

[questions.ig-071]
explanation = "After *the* and before *to-V*, a noun is needed: *decision*. Word family: decide (v), decision (n), decisive (adj)."

[questions.ig-072]
explanation = "The subject needs a noun with an article: *The importance of sleep*. The adjective *important* and the adverb *importantly* cannot be the subject."

[questions.ig-073]
explanation = "*Growth* is the noun form of *grow*. A noun is needed after the adjective *rapid*."

[questions.ig-074]
explanation = "The first option turns *machines can do more* into the noun phrase *the increasing capability of machines* and *lose jobs* into *job losses*. The other options are still ordinary clauses."

[questions.ig-075]
explanation = "Structure: *The + comparative, the + comparative*. *Cars* is countable, so use *fewer*."

[questions.ig-076]
explanation = "Sentence 2 needs *economy* instead of *economic*. Sentence 5 needs *The importance of exercise*. The other three sentences use nouns correctly."

[questions.ig-077]
explanation = "Pattern: *The + comparative … , the + comparative …*; the first part needs *The*."

[questions.ig-078]
explanation = "After the adjective *growing*, an abstract noun is needed. *Concern, anxiety, worry* all fit."

[questions.ig-079]
explanation = "The head noun is *expansion* (singular), not *airlines*. Therefore use *has made*."

[questions.ig-080]
explanation = "Checklist: (1) the subject is a noun phrase (*rising prices*); (2) an abstract noun (*concern*); (3) a concise sentence with no new ideas; (4) the verb agrees with the plural subject; (5) correct articles and prepositions."

[questions.ig-081]
explanation = "*Failure to + V* is a common nominalisation, here combined with the strong verb *exacerbate*. The other options have the wrong structure."

[questions.ig-082]
explanation = "Too much nominalisation makes a sentence heavy. A simple sentence with the adjective *economic* gives the clearest result."

[questions.ig-083]
explanation = "The subject is the head noun (*expansion, reliance, difficulty*), not the noun inside the prepositional phrase."

[questions.ig-084]
explanation = "Checklist: (1) the subject is an abstract noun; (2) nominalisation does not make the sentence confusing; (3) correct articles and prepositions; (4) subject-verb agreement; (5) the original meaning is kept, with no ideas outside the task."

[modules.ig-comparison-data]
title = "Accurate comparisons and data description"
description = "Comparatives and superlatives, twice as... as, proportions, compared with, while, and describing the degree of change."
lesson = '''
### Basic comparisons
| Form | Structure | Example |
|---|---|---|
| Comparative | adj-er / more + adj + than | *Rent was higher in London than in Leeds.* |
| Superlative | the adj-est / the most + adj | *Japan had the highest proportion of older people.* |
| Equality | as + adj + as | *Spain's rate was as high as Italy's.* |
| Multiples | twice / three times as + adj + as | *Sales were twice as high as in 2010.* |
| Multiples of quantity | N times + as many/much as | *Women made up three times as many students as men.* |
| Near equality | roughly/almost the same as | *The figures were almost the same.* |

*Twice as many* is used with countable nouns; *twice as much* with uncountable nouns: *twice as many cars*, *twice as much traffic*.

### Contrast words
Use *compared with / compared to*, *in contrast*, *whereas*, *while*, *by comparison*, *on the other hand*. Example: *Car use rose by 15%, whereas cycling fell slightly.* At the start of a sentence: *In contrast, rail travel remained stable.* Avoid listing numbers like ~~A is 20%, B is 30%, C is 15%~~ without comparing them.

### Proportions and degree
- *the highest / lowest proportion (percentage, share)*; *the largest number* (countable).
- Degree: *slightly, marginally, moderately, considerably, substantially, dramatically*.
- Approximation: *approximately, around, just over, nearly, roughly a third*.
- Fractions: *a quarter, three-fifths, one in ten*, *the majority*, *a small minority*.

### The number of vs a number of
*The number of students has risen.* (the subject is *number*, singular). *A number of students were absent.* (= several; plural subject). Likewise, *the proportion of* takes a singular verb: *The proportion of women is higher.*

### Prepositions with figures
*rise **by** 10%* (the size of the rise), *rise **to** 50%* (the end point), *an increase **of** 5%*, *a figure **of** 12%*, *account **for** 40%*, *at 15%* (a level), *from 10% to 20%*, *between 2000 and 2010*, *in 2005*, *over the period*.

### Common errors
1. Confusing *by* and *to*: ~~rose to 5% from 10%~~ when you mean the size of the rise.
2. ~~The number of cars is more than~~ → *higher than* (figures are "high/low", not "more/less", for *number*).
3. Using *than* with *as…as*: ~~as high than~~.
4. Missing *the* with superlatives: ~~highest percentage~~ → *the highest percentage*.
5. Using *more* with short adjectives: ~~more high~~.
6. Using *less* with countable nouns: ~~less people~~ → *fewer people*.

### Tip for choosing data
In a band 7 Task 1 you do not describe every figure; select the highest and lowest points, the biggest changes, and a few notable comparisons, then group similar categories. Keeping comparison sentences accurate matters more than squeezing in more numbers.
'''

[modules.ig-modals-hedging]
title = "Modal verbs and hedging"
description = "Degrees of certainty, recommendations, softening claims with may, tend to, it is essential that, and avoiding overstatement."
lesson = '''
### Why hedging is needed
In Task 2, stating everything as absolute fact (*Technology destroys education*) weakens your argument and is easily wrong. Hedging softens the degree of certainty and makes your writing sound academic. Band 7 uses a range of devices, not just *can*.

### Scale of certainty
| Level | Expressions | Example |
|---|---|---|
| Very certain | will, must, is certain to, undoubtedly | *Automation will transform manufacturing.* |
| Fairly certain | is likely to, is bound to, should | *Prices are likely to rise.* |
| Possible | may, might, could, is possible that | *This may lead to unemployment.* |
| Tendency | tend to, often, in many cases, generally | *Teenagers tend to prefer online learning.* |
| Tentative suggestion | seems/appears to, suggests that | *Research suggests that sleep affects memory.* |

*May* and *might* are close; *might* is slightly less certain. *Could* can express possibility or ability, depending on context.

### Hedging nouns and adverbs
- Adverbs: *probably, possibly, perhaps, arguably, apparently, generally, typically, largely*.
- Nouns: *a tendency, a possibility, the likelihood of*.
- Phrases: *to some extent, in most cases, it could be argued that…*.
- Avoid absolutes: *all, every, always, never, nobody*. Replace them with *most, many, a majority of, usually, rarely*.

### Recommendation and obligation
| Structure | Example |
|---|---|
| should / ought to | *Governments should invest in public transport.* |
| It is essential/vital/important that + (should) + V | *It is essential that schools teach financial skills.* |
| must / have to | *Employers must provide safe conditions.* |
| had better, need to | *Cities need to reduce emissions.* |
| be encouraged to, be required to | *Citizens should be encouraged to recycle.* |

After *It is essential that*, the verb is in the base form (the subjunctive): *It is essential that he **attend**…*, or use *should*. Do not add *-s*.

### Perfect modals
*may have + past participle* (possibly did), *should have + past participle* (ought to have done), *must have + past participle* (certainly did), *can't have + past participle* (cannot have done). Example: *The government should have acted earlier.* Use them in Task 2 when looking back at and criticising a policy.

### Common errors
1. Adding *to* after a modal: ~~should to invest~~.
2. Adding *-s* after a modal: ~~can makes~~.
3. Using two modals together: ~~will can~~ → *will be able to*.
4. Too much hedging makes the essay vague: ~~It may possibly perhaps be a problem~~. One signal is enough.
5. Absolute claims with *all, always, never*.
6. Confusing *must not* (prohibited) with *don't have to* (not required).

### Combining with a clear position
Hedging does not mean an unclear position. State your view clearly in the introduction, then hedge in the body paragraphs so your argument is nuanced: *I strongly believe that… This is likely to…*
'''

[modules.ig-accuracy-errors]
title = "Accuracy: articles, plurals, subject-verb agreement, punctuation"
description = "Errors Vietnamese learners often make: articles, uncountable nouns, subject-verb agreement, there is/are, rise/raise, commas."
lesson = '''
### Why focus on accuracy
At band 6.5, examiners pay attention to the proportion of error-free sentences. An essay with a wide range but basic errors in every sentence will be held at band 6. This module lists the errors Vietnamese learners make most often so you can check your work before submitting.

### Articles
| Situation | Rule | Example |
|---|---|---|
| General meaning, plural/uncountable | no article | *Cities face pollution.* |
| Singular countable, first mention | a / an | *A new law was passed.* |
| Already identified, unique | the | *The government should act.* |
| Superlatives, ordinals | the | *the most serious problem* |
| Country names | usually no the | *Vietnam, Japan*, but *the UK, the US* |

Errors: ~~Government should…~~ (when you mean a specific government → *The government*); ~~The education is important~~ (general meaning → *Education is*); ~~a information~~.

### Uncountable nouns
*information, advice, research, equipment, furniture, traffic, knowledge, evidence, progress, homework, news, luggage* take **no** *-s* and no *a*. Use *a piece of advice, a lot of research, much information*. Common errors: ~~informations, researches, advices, equipments~~. *Research* has no plural in most meanings; use *studies* or *research studies* for "many studies".

### Subject-verb agreement
- *There is a problem / There are many problems* (follows the noun after it). Avoid ~~There have many~~.
- *People* is always plural: ~~people is~~.
- *The number of cars **is*** … / *A number of cars **are*** …
- *Each / every / either / neither + singular*: *Each student has*.
- A prepositional phrase in between does not change the subject: *The cost of these projects **is** high.*
- *Police, staff, family, government* can be singular or plural depending on how you view the group.

### Easily confused words
*rise* (intransitive, no object) and *raise* (transitive): *Prices rise. The government raised taxes.* *affect* (verb) and *effect* (noun): *Pollution affects health; the effect is serious.* *lose* and *loose*; *fewer* (countable) and *less*; *economic* and *economical*; *its* and *it's*.

### Commas
- After an opening subordinate clause: *Although it is expensive, many people buy it.*
- Before a conjunction joining two independent clauses: *…, but…*
- Around non-defining relative clauses.
- No comma between the subject and the verb: ~~Students who study hard, succeed~~.
- Do not join two independent clauses with only a comma.

### Fixed errors to avoid
~~In my opinion, I think~~ (choose one). ~~Many people they~~ (extra pronoun). ~~I am agree~~ (*I agree*). ~~More and more people is~~.

### 3-minute review routine
After writing, check in turn: (1) do subjects and verbs agree? (2) do nouns need -s or an article? (3) does each sentence have a main verb? (4) is there a comma after the opening clause? Keep your own "error list" and check exactly those items, because each person tends to repeat the same few errors.
'''

[questions.ig-085]
explanation = "Short adjectives use *adj-er + than*. *More high* is an error carried over from the Vietnamese *cao hơn*."

[questions.ig-086]
explanation = "The superlative needs *the* and the *-est* form: *the highest*."

[questions.ig-087]
explanation = "Equality structure: *as + adj + as*. Do not use *than*."

[questions.ig-088]
explanation = "Double: *twice as + adj + as*. Forms like *twice higher than* are a common error among Vietnamese learners."

[questions.ig-089]
explanation = "*A number of + plural noun* is a plural subject, so the verb is *were*. This differs from *The number of students was…*."

[questions.ig-090]
explanation = "Sentence 2 needs *fewer people*. Sentence 4 needs *higher/greater*: *the number* does not go with *more than* in this way."

[questions.ig-091]
explanation = "*Rise by 12%* gives the size of the rise; *a peak of / at $50* gives the highest point. Do not confuse *by* with *to*."

[questions.ig-092]
explanation = "*Cars* is countable, so use *as many as*. Use *much* with uncountable nouns."

[questions.ig-093]
explanation = "*Account for* (no passive) is used with proportions: *accounted for 40% of…*. Do not use *accounts to* or *from*."

[questions.ig-094]
explanation = "Checklist: (1) both groups are compared, with the 2000 and 2020 figures; (2) correct comparison/contrast words (*compared with, whereas*); (3) correct prepositions with figures (*to, from, of*); (4) consistent past tense; (5) no comments on causes outside the data."

[questions.ig-095]
explanation = "50/200 = 25% = *a quarter*. *Majority, nearly half* are too large; *small minority* is too small."

[questions.ig-096]
explanation = "Compare like with like: a proportion with a proportion. Use *that in medicine* to replace *the proportion … in medicine*."

[questions.ig-097]
explanation = "Sentence 2: *a number of* + plural verb (*were*). Sentence 5: *students* is countable, so it must be *fewer*."

[questions.ig-098]
explanation = "Checklist: (1) correct multiples (*doubled / twice as high as*); (2) contrast linkers with a comma; (3) correct prepositions (*from … to …*, *by*); (4) degree described (*slight*); (5) the past tense is kept."

[questions.ig-099]
explanation = "After a modal, use the base form without *to* and without *-s*."

[questions.ig-100]
explanation = "*Is likely to* softens the degree of certainty. *Always, everyone, never* are absolute claims and easily wrong."

[questions.ig-101]
explanation = "*May, might, could* express possibility and reduce certainty. After a modal, use the base form."

[questions.ig-102]
explanation = "*Don't have to* means not required. *Must not* means prohibited — two different meanings."

[questions.ig-103]
explanation = "*Tend to + V* expresses a general tendency; the subject is plural, so there is no *-s*. *Be tend to* is ungrammatical."

[questions.ig-104]
explanation = "After *It is essential that*, use the base form (or *should + V*). Do not add *to* or V-ing."

[questions.ig-105]
explanation = "Sentences 3 and 5 are absolute claims with *all, nobody*. The other sentences use may, suggests, in most cases to soften the claim."

[questions.ig-106]
explanation = "After *It is vital that*, use the base form (*provide*) or *should provide*. Do not add *-s*."

[questions.ig-107]
explanation = "*Should have + past participle* criticises something that ought to have been done in the past. The blank contains only *should have*."

[questions.ig-108]
explanation = "Checklist: (1) modal + base form; (2) a suitable degree of certainty, not absolute; (3) no stacked hedging signals; (4) a clear idea that can be developed; (5) no emotional language."

[questions.ig-109]
explanation = "*May contribute to* expresses possibility and a partial cause. Stacked hedging (*possibly maybe*) or *only cause* are both weak."

[questions.ig-110]
explanation = "Speculation about the past: *may have + past participle*. The other forms have the wrong structure."

[questions.ig-111]
explanation = "Sentence 3 uses two modals together (*will can*); it should be *will be able to*. Sentence 5 has an extra *to* after *should*."

[questions.ig-112]
explanation = "Checklist: (1) *should/must* + base form; (2) after *It is essential that*, use the base form or *should*; (3) just enough hedging; (4) a clear position; (5) no absolute claims."

[questions.ig-113]
explanation = "*Information* is uncountable: no *-s*, no *a/an*, and a singular verb."

[questions.ig-114]
explanation = "*There are* + plural noun. ~~There have many~~ is a literal translation of the Vietnamese *Có nhiều*."

[questions.ig-115]
explanation = "*People* is always plural, so use *are*, not *is*."

[questions.ig-116]
explanation = "For a concept in general, use the uncountable noun without an article: *Education is…*."

[questions.ig-117]
explanation = "*Rise* (intransitive, no object), *raise* (transitive, with the object *taxes*). Past forms: *rose / raised*."

[questions.ig-118]
explanation = "*Research, advice, equipment, traffic* are uncountable nouns and take no *-s*."

[questions.ig-119]
explanation = "*The number of + N* is singular (*has*). *A number of + N* means several and is plural (*have*)."

[questions.ig-120]
explanation = "*Affect* is the verb (*affects*), *effect* is the noun. The subject is singular, so *affects*."

[questions.ig-121]
explanation = "Do not put a comma between the subject and the verb; a defining relative clause also has no commas."

[questions.ig-122]
explanation = "Checklist: (1) remove the repetition *In my opinion, I think*; (2) *information* has no -s and takes a singular verb; (3) *people are*; (4) complete sentences with correct commas; (5) no new errors introduced."

[questions.ig-123]
explanation = "*Despite* is not followed by *of*; *an increasing number of* + plural; a finite verb (*are choosing*) and the article *an* are needed."

[questions.ig-124]
explanation = "A non-defining clause goes between two commas; do not put a comma between the subject and the main verb."

[questions.ig-125]
explanation = "Sentence 1 repeats the idea. Sentence 2 has an extra pronoun *they*. Sentence 4 has an extra *am*: *I agree*. Sentences 3 and 5 are correct."

[questions.ig-126]
explanation = "Checklist: (1) uncountable nouns take no *-s* and a singular verb; (2) *the number of* + singular verb, *a number of* + plural; (3) *rise* takes no object, *raise* takes one; (4) subject-verb agreement; (5) correct punctuation."
