[modules.cefr-a2-grammar-plus]
title = "Expanded A2 Grammar"
description = "Past simple and ago, future forms, present perfect, comparisons, modals, quantifiers, time clauses, and indefinite pronouns."
lesson = '''
### Experiences with the present perfect
Use **have/has + past participle (V3)** to ask about or describe experiences up to the present. It often appears with *ever* and *never*. Do not give a finished past time in this sentence.

| Pattern | Example |
|---|---|
| Have/Has + subject + ever + V3? | *Have you ever stayed in a hotel?* |
| Subject + have/has never + V3 | *He has never tried sushi.* |
| An experience that has happened | *We have visited Da Lat.* |

For a finished time such as *last year*, use the past simple: *I went to Hue last year.* Do not combine *have* with a past-simple verb: ~~She has went~~ → *She has gone*. *Been to* usually means someone visited a place and came back; *gone to* means they went there and are still away.

### Verbs followed by to + verb or V-ing
Some common verbs take a fixed form after them. Learn the whole pattern: *want/need/hope/decide/plan + to + verb*; *enjoy/finish + V-ing*. For example: *I hope to see you soon.* / *They finished packing at six.* Do not put *to* before V-ing: ~~enjoy to play~~; do not leave out *to* after *decide*: ~~decided visit~~.

### Quantifiers, too, and enough
| Pattern | Example |
|---|---|
| a lot of + plural or uncountable noun | *a lot of bags / a lot of rain* |
| too many + plural countable noun | *too many suitcases* |
| too much + uncountable noun | *too much luggage* |
| too + adjective | *too cold to swim* |
| adjective + enough / enough + noun | *old enough; enough time* |

*Too* means more than is wanted or needed and often suggests a problem; *enough* means sufficient. Their positions differ: *big enough*, but *enough space*. Avoid ~~enough big~~ and ~~too much people~~.

### Time clauses, subject questions, and indefinite pronouns
*When, before,* and *after* connect two actions: *Call me when you arrive.* For a future meaning, still use the present simple after a time connector, not *will*: *I'll wait until the bus comes.* In a subject question, *who/what* is the subject, so do not add *do*: *Who called you?* To ask about the person receiving the action, say *Who did you call?* Indefinite pronouns include *someone/anyone/no one/everyone*, *something/anything/nothing*, and *somewhere/anywhere/nowhere/everywhere*. Use a singular verb with *everyone/no one*; *everywhere* means all places: *I looked everywhere.* Questions and negatives commonly use *any-* forms, while affirmative statements often use *some-* forms.

**Tip:** Learn verbs in pairs such as *decide to go* and *enjoy going*; check whether a noun is countable before using *many*; and identify the real subject before adding an auxiliary. Vietnamese learners often translate word for word and write ~~Who did come?~~ or use *will* after *when*.

### Plans and future arrangements
Use *be going to* for an existing intention or a prediction with evidence; the present continuous for a fixed arrangement; and *will* for a decision made now, a promise, or an offer. A time word such as *tomorrow* does not determine the tense by itself—consider the intention and how firmly it is arranged.

### Modals and quantifiers
*Mustn’t* means something is prohibited; *don’t have to* means it is unnecessary. *Should* gives advice, *could* can express past ability or a polite request, and *might/may* express possibility. Use *a few* with plural countable nouns and *a little* with uncountable nouns; *too + adjective* means excessive, while *adjective + enough* means sufficient.

### Questions and time clauses
When the question word is the subject, do not add *do/did*: *Who called?* When asking about the object, use an auxiliary: *Who did you call?* In future time clauses after *when/before/after*, use the present simple: *I’ll call when I arrive*.

### Past time and comparisons
Use the past simple with *ago*: put a time period before *ago*, as in *two days ago* or *five years ago*. For short adjectives, add *-er* and use *than* (*cheaper than*); with longer adjectives, use *more … than* (*more comfortable than*). Irregular forms include *good → better → the best* and *bad → worse → the worst*. Use *not as + adjective + as* for a lower degree: *This bag is not as heavy as that one*.

### Past ability
Use *could + base verb* for a general ability in the past: *When I was five, I could read simple books.* Use *Could you…?* for a polite request; context tells you which meaning is intended.
'''

[questions.cefr-a2-001]
prompt = "Choose a natural question to ask a friend whether they have ever stayed in a hotel."
explanation = "Ask about an experience with *Have + you + ever + V3?*; after *did*, use the base form, and *you* takes *have*."

[questions.cefr-a2-002]
prompt = "Nam went to Da Lat and has returned. Choose the correct sentence."
explanation = "*Has been to* describes Nam visiting the place and returning; *has* takes the past participle *been*, not *went* or *go*."

[questions.cefr-a2-003]
explanation = "*Decide* is usually followed by *to + base verb*: *decided to take*."

[questions.cefr-a2-004]
explanation = "*Enjoy* is followed by V-ing: *enjoy playing*. Learn this pattern together with the main verb."

[questions.cefr-a2-005]
explanation = "*Too + adjective* means more than is wanted: the soup is too hot for the child to eat now. *Enough* comes after an adjective."

[questions.cefr-a2-006]
prompt = "Choose the sentences that use quantifiers correctly."
explanation = "*Enough* comes before a noun but after an adjective; use *many* with plural countable nouns and *much* with uncountable nouns."

[questions.cefr-a2-007]
prompt = "Choose the questions in which the question word is the subject."
explanation = "In the first two questions, *who/what* is the subject, so no *do/did* is needed. The other three ask about an object and use an auxiliary."

[questions.cefr-a2-008]
prompt = '''Fill in the correct V3 forms to talk about experiences:

1. Have you ever {{blank}} (eat) Indian food?
2. I have never {{blank}} (fly) on a plane.
3. My parents have {{blank}} (see) this film before.
'''
explanation = "The present perfect takes V3: *eat–eaten, fly–flown, see–seen*."

[questions.cefr-a2-009]
prompt = '''Complete the sentences with the correct form of the verb in brackets:

1. I need {{blank}} (buy) a ticket today.
2. They finished {{blank}} (pack) at six.
'''
explanation = "*Need* is followed by *to + verb*; *finish* is followed by V-ing. Learn the following form together with each main verb."

[questions.cefr-a2-010]
prompt = "Fill in the connector meaning “when / at the time that”: I'll call you {{blank}} I get off the bus."
explanation = "*When* connects the call with the time you get off the bus. In a time clause about the future, use the present simple *get*, not *will get*."

[questions.cefr-a2-011]
prompt = "Write three sentences in English about a travel or food experience: include at least one thing you have done and one thing you have never done. Use the present perfect."
explanation = "The model uses the present perfect for experiences, including an experience that has not happened, with *never*."

[modules.cefr-a2-vocab-daily]
title = "Everyday Vocabulary"
description = "Essential phrases for travel, health, shopping, work, leisure, feelings, and common phrasal verbs."
lesson = '''
### Phrases for everyday situations
Learning new words in phrases and short sentences helps you remember how to use them naturally. The phrases below are useful for travelling, talking about your health, and daily work.

| Topic | A2 phrases | Example |
|---|---|---|
| Travel | book a room, catch a bus, check in, luggage | *We booked a room near the station.* |
| Health | have a cold, have a headache, feel ill, see a doctor | *I have a sore throat, so I will see a doctor.* |
| Shopping | try on, pay by card, size, receipt | *Can I try on this jacket?* |
| Work | colleague, take a break, start work, finish work | *My colleague takes a short break at noon.* |
| Leisure | go out, play tennis, watch a film, listen to music | *We go out with friends on Fridays.* |

### Feelings: -ed and -ing
Adjectives ending in **-ed** usually describe how a person feels; adjectives ending in **-ing** usually describe what causes that feeling: *I am bored because the film is boring.* / *She is excited about the exciting trip.* One way to remember: a person **feels** something (-ed), while an event or thing **causes** the feeling (-ing). Avoid saying ~~I am boring~~ if you mean “I feel bored”; that sentence means “I make other people feel bored.”

### Common phrasal verbs
| Phrase | Common meaning | Example |
|---|---|---|
| get up | get out of bed | *I get up at seven.* |
| turn on | start a device | *Please turn on the light.* |
| look for | search for | *He is looking for his phone.* |
| put on | dress in / wear | *Put on your coat; it is cold.* |

In *look for*, *for* is part of the phrase: say *look for my keys*; do not leave out *for*. Some phrases can be separated: *put on your coat* or *put your coat on*. With a pronoun, put it in the middle: *put it on*, not ~~put on it~~. Avoid translating directly from Vietnamese: *have a headache* is natural; ~~get a headache pain~~ is not. When shopping, *try on* means to wear clothes to check their fit; *try* a food means to taste it. Use the object to help choose the right phrase.

**Tip:** Learn pairs such as *bored/boring* and *excited/exciting*; practise phrasal verbs with a specific object; and learn phrases instead of translating word for word. The examples use short sentences, the present or past simple, and familiar A2 vocabulary.

### Vocabulary by situation
For travel, distinguish *book a room, check in, check out, return ticket,* and *platform*; at work or school, use *colleague, interview, take notes,* and *report*. Health words include *fever, sore throat, appointment,* and *medicine*. Basic technology phrases include *download an app, send a message,* and *turn on a device*.

### Common phrasal verbs
- *get up*: leave your bed; *get on/off* a bus.
- *look for* something: search; keep *for* after the verb.
- *turn on/off* a light; *put on/take off* clothes.

Learn each phrase in a concrete situation to remember both its meaning and use.
'''

[questions.cefr-a2-012]
explanation = "*Reservation* means an arrangement made in advance; it is the right phrase to use when speaking to hotel staff."

[questions.cefr-a2-013]
explanation = "The natural phrase is *have a headache*. The singular noun *headache* needs *a*."

[questions.cefr-a2-014]
explanation = "*Try on* means to wear clothes to check their fit. With the pronoun *it*, put the pronoun in the middle: *try it on*."

[questions.cefr-a2-015]
explanation = "A *colleague* is someone you work with; the other words mean luggage, a receipt, and an appointment."

[questions.cefr-a2-016]
explanation = "The film causes the feeling, so use *boring*; the viewer feels bored, so use *bored*."

[questions.cefr-a2-017]
prompt = "Choose the sentences that use the phrasal verbs correctly for the meanings in brackets."
options = ["I get up at seven every morning. (wake up)", "Please turn on the light. (switch on)", "We are looking for the bus stop. (search for)", "She puts on it before she leaves. (put on a coat)", "I look my phone for after work. (look for)"]
explanation = "*Get up, turn on,* and *look for* are used correctly. With a pronoun, say *put it on*; *for* cannot be separated from *look for*."

[questions.cefr-a2-018]
prompt = "Choose the natural phrases."
explanation = "We say *catch a bus*, *book a room*, and *have a sore throat*. Use *have a headache* and *pay by card*."

[questions.cefr-a2-019]
prompt = "We stayed at a small {{blank}} near the beach. (a place you pay to sleep while travelling)"
explanation = "A *hotel* is a place where travellers stay; the sentence describes accommodation during a trip."

[questions.cefr-a2-020]
prompt = "It's dark in here. Could you {{blank}} the light, please? (switch it on)"
explanation = "*Turn on the light* means to switch on the light."

[questions.cefr-a2-021]
prompt = "This game is very {{blank}}. I want to play it again. (makes players feel excited)"
explanation = "The game causes a feeling, so use the adjective *exciting*; a player may feel *excited*."

[questions.cefr-a2-022]
prompt = "Write three or four sentences in English about a recent day off: describe at least one shopping or leisure activity and say how you felt."
explanation = "The model describes an activity, uses the phrases *looked for / tried on*, and gives a feeling with a suitable adjective."

[modules.cefr-a2-functions]
title = "Communication in Familiar Situations"
description = "Making and responding to invitations, making suggestions, asking for help, arranging plans, making phone calls, describing people and places, and briefly recounting experiences."
lesson = '''
### Inviting, accepting, and politely declining
| Purpose | Natural expression |
|---|---|
| Invite | *Would you like to have lunch with us?* |
| Accept | *I'd love to. What time?* |
| Politely decline | *I'd love to, but I'm busy on Saturday.* |
| Suggest | *Why don't we meet at the café?* / *How about going by bus?* |

When declining, you can add a brief reason to sound friendly. After *How about*, use a noun or V-ing: *How about a walk? / How about walking?* With *Why don't we*, use the base form: *Why don't we meet at six?* Avoid ~~Why we don't meet?~~ when making a suggestion.

### Making requests, offering help, and arranging plans
*Could you help me with these bags, please?* is a polite request; *Shall I carry one for you?* offers help. When arranging a meeting, state the activity, day, and time: *Can we meet on Friday at ten?* / *Are you free this afternoon?* Ask about the time if it is unclear: *What time shall we meet?* *On* is commonly used with days and dates, while *at* is used with clock times.

### Making phone calls
| Situation | Example phrase |
|---|---|
| Ask to speak to someone | *Hello, could I speak to Anna, please?* |
| The person is unavailable | *I'm sorry, she's not here right now.* |
| Leave a message | *Can I leave a message?* |
| Ask someone to repeat | *Sorry, could you say that again?* |

Say the name of the person you want to speak to early, speak clearly, and use *please* when making a request. If the signal is poor, you can say *I can't hear you very well* and ask the other person to repeat.

### Describing people and recounting experiences
To describe a person, mention their appearance or personality: *My brother is tall and friendly. He has short dark hair.* Use *be* with adjectives (*is friendly*) and *have* for hair or eyes (*has brown eyes*). To describe a place, mention its size, atmosphere, or location: *The town is small and quiet. It is near the sea.* When recounting an experience, use two or three short sentences and add a time or a personal impression: *We visited a small market. I bought a scarf, and the people were kind.* There is no need for fancy words; clear sentences that fit the situation help the listener follow you.

**Common mistakes:** translating a request directly from Vietnamese and making it sound too blunt; using *How about we go* instead of the pattern being practised, *How about going*; leaving out *to* in *speak to*; or saying *He is hair short*. Learn each phrase by its purpose, then replace the name, activity, day, and time.

### Invitations, suggestions, and replies
Use *Would you like to…?* or *Why don’t we…?* to invite or suggest; *How about + V-ing?* also makes a suggestion. Accept with *I’d love to*; refuse politely with thanks and a brief reason (*Thanks, but I have to work*). Use *Could you…?* to ask for help and *Shall I…?* to offer help.

### Real-life situations
When booking a hotel or appointment, give your name, date, and need; on a call, ask for the right person. When complaining, explain the problem and request a solution calmly. To talk about experience, ask *Have you ever…?* and answer *Yes, I have / No, I haven’t* before adding a past detail.
'''

[questions.cefr-a2-023]
explanation = "*Would you like to + verb?* is a polite, natural way to invite a friend."

[questions.cefr-a2-024]
explanation = "*I'd love to, but…* accepts warmly and then gives a reason for not being able to join."

[questions.cefr-a2-025]
explanation = "The suggestion pattern is *Why don't we + base verb?* After *How about*, use a noun or V-ing."

[questions.cefr-a2-026]
explanation = "*Could you help me with…?* is a polite request; use the base form of the verb after *could*."

[questions.cefr-a2-027]
explanation = "On the phone, you can politely ask *Could I speak to [name], please?*"

[questions.cefr-a2-028]
prompt = "Choose one sentence that asks someone to do something and one that offers help."
explanation = "*Could you + verb?* asks someone to do something; *Shall I + verb?* offers to do something for them. Both patterns take the base form of the verb."

[questions.cefr-a2-029]
prompt = "Choose the natural sentences describing a person or a place."
explanation = "Use *be + adjective* (*is tall, is quiet*) and *have + feature* (*has short hair*). Do not use *a* before a standalone adjective or *have* with a singular subject."

[questions.cefr-a2-030]
explanation = "The natural phrase is *join us for dinner*."

[questions.cefr-a2-031]
prompt = "Fill in the appropriate word for a phone call: Could I {{blank}} to Mr Brown, please?"
explanation = "Both *speak to* and *talk to* are natural when asking to speak with someone on the phone."

[questions.cefr-a2-032]
explanation = "Use *on* with a day or date; *at* is already used with the specific time."

[questions.cefr-a2-033]
prompt = "Write a three- or four-turn dialogue in English: invite a friend to see a film, accept the invitation, and agree on the day and time to meet."
explanation = "The sample dialogue includes an invitation, an acceptance, an agreed day, and a meeting time."

[modules.cefr-a2-reading-writing]
title = "Reading and Writing Short Texts"
description = "Reading emails, messages, notices, and short stories; writing personal emails with basic linking words."
lesson = '''
### Reading to find information
Personal emails often tell you who is writing, why they are writing, when something will happen, or what they need the reader to answer. Short messages and notices often put important information near the beginning: opening times, locations, changes to plans, or things to do. Read the question first, then look for related names, dates, times, and verbs in the text. For example, *The shop closes at six. Please come before 5:30* means you need to arrive before 5:30, not at six. In a short story, follow who does what and what happens first; *then* often signals the next step.

### Writing a 50–80-word personal email
| Part | Suggested content |
|---|---|
| Greeting | *Hi Anna,* |
| Purpose | *I'm writing to invite you…* |
| Details | day, time, meeting place, or reason |
| Closing | *Hope you can come. See you soon!* |
| Name | *Lan* |

For an invitation, clearly state the activity, time, and place. A thank-you email should say what you are grateful for; an apology email should explain what happened and give a brief reason. Use simple sentences, sensible line breaks, capital letters for names, and commas and full stops. Keep the word count close to the requested range; do not add long sentences just to reach the limit.

### Linking ideas clearly
| Connector | Meaning | Example |
|---|---|---|
| and | adds information | *We had lunch and watched a film.* |
| but | contrast | *I wanted to come, but I was ill.* |
| so | result | *It was late, so we took a taxi.* |
| because | reason | *I stayed home because I was tired.* |
| then | next step | *We ate dinner. Then we went home.* |

*Because* introduces a reason; *so* links a cause to its result. Do not use both for the same cause-and-result relationship as in ~~Because I was tired, so I slept~~. Write *Because I was tired, I slept* or *I was tired, so I slept*. Vietnamese learners also tend to connect every sentence with *and* or forget the comma between two clauses. Choose a connector that reflects the actual relationship between the ideas, then reread the email to check that the reader can understand the plan and message.

### Read and write short texts
Read emails, notices, adverts, and stories by finding the sender, time, action, and reason. In a story, follow sequence with *before, after,* and *then*; in an explanation, use *because* for a reason and *so* for a result. A 50–80-word personal email can include a greeting, purpose, essential details, a question or invitation, and a closing. Link ideas with *and, but, so, because,* and *then*; then check past tense and punctuation. Model-answer keywords do not fully assess an email’s length, accuracy, or coherence.
'''

[questions.cefr-a2-034]
prompt = '''Read the notice:

"The library closes at 5 p.m. today. Please return your books before 4:45 p.m."

When should you return your books?
'''
explanation = "The notice asks you to return the books before 4:45; the library closes at 5."

[questions.cefr-a2-035]
prompt = '''Read the message:

"Hi Ben, meet me outside the cinema at 6. I have two tickets. See you, Alex"

Where should Ben meet Alex?
'''
explanation = "The message clearly says to meet outside the cinema."

[questions.cefr-a2-036]
explanation = "Being tired is the reason for going to bed early, so use *so* to introduce the result."

[questions.cefr-a2-037]
prompt = "Choose the correct sentence that connects ideas to give a reason."
explanation = "Use *because + clause* to give a reason. Do not also use *so* for the same cause-and-result relationship in this pattern."

[questions.cefr-a2-038]
prompt = "You are writing an informal email inviting a classmate to a picnic. Which opening is most suitable?"
explanation = "*Hi + name,* is a friendly, natural greeting when writing to a friend."

[questions.cefr-a2-039]
prompt = '''Read the short story:

"On Saturday, Tom missed the bus, so he walked to the station. It started to rain, but a woman gave him an umbrella. Then he called his sister, and she met him at the station."

Choose the true statements.
'''
explanation = "Tom missed the bus, so he walked; a woman gave him an umbrella; then his sister met him at the station."

[questions.cefr-a2-040]
prompt = "I wanted to go for a walk, {{blank}} it started to rain. (shows contrast)"
explanation = "*But* connects two contrasting ideas: wanting to go for a walk and then having it start to rain."

[questions.cefr-a2-041]
prompt = "We stayed inside {{blank}} it was raining. (gives a reason)"
explanation = "*Because* comes before the clause that gives the reason for staying inside."

[questions.cefr-a2-042]
prompt = "First, we had dinner. {{blank}}, we watched a film. (next / after that)"
explanation = "*Then* signals the next event in a sequence of activities."

[questions.cefr-a2-043]
prompt = "Write a 50–80-word email in English to thank a friend for inviting you to a party. Say how much you enjoyed it, give one reason, and mention one detail you would like to arrange."
explanation = "The email must include thanks, how the writer felt, a reason, and one specific detail to arrange."

[questions.cefr-a2-x001]
prompt = "Last Saturday, we ___ a small museum near the station."
explanation = "The finished event has a specific past time, so use the past simple: *visited*."

[questions.cefr-a2-x002]
prompt = "I ___ my keys yesterday, so I took the spare set."
explanation = "*Yesterday* calls for the past simple; the past form of *lose* is *lost*."

[questions.cefr-a2-x003]
prompt = "We {{blank}} (not / see) the guide at the hotel yesterday."
explanation = "A past-simple negative uses *didn’t + base verb*."

[questions.cefr-a2-x004]
prompt = "We decided this morning to take the earlier train, and the tickets are booked. We ___ leave at six."
explanation = "This is a prepared plan, so *be going to* expresses the intention."

[questions.cefr-a2-x005]
prompt = "The table is booked for 7:00. We ___ dinner with the Parkers tonight."
explanation = "A fixed arrangement can use the present continuous for the future."

[questions.cefr-a2-x006]
prompt = "“The phone is ringing.” “I ___ answer it.”"
explanation = "A spontaneous decision made now commonly uses *will*."

[questions.cefr-a2-x007]
prompt = "Have you ever {{blank}} (ride) a horse?"
explanation = "Use the past participle *ridden* after *have* in the present perfect."

[questions.cefr-a2-x008]
prompt = "Choose the correct sentence about life experience."
explanation = "When no specific past time is given, use the present perfect: *I have never flown…*."

[questions.cefr-a2-x009]
prompt = "Employees ___ wear a name badge at work; it is part of the company rule."
explanation = "A workplace rule requires *have to*; a plural subject takes *have to*."

[questions.cefr-a2-x010]
prompt = "The sign says “No swimming.” You ___ swim here."
explanation = "*Mustn’t* expresses prohibition; *don’t have to* means something is not necessary."

[questions.cefr-a2-x011]
prompt = "Your friend has a bad headache. What is a helpful suggestion?"
explanation = "Use *should* to give advice."

[questions.cefr-a2-x012]
prompt = "“___ you help me carry this box, please?”"
explanation = "Use *Could you…?* for a polite request; follow the modal with the base verb."

[questions.cefr-a2-x013]
prompt = "Choose the sentences that express possibility, not obligation."
explanation = "*Might* and *may* express possibility; *must* and *have to* express obligation."

[questions.cefr-a2-x014]
prompt = "“My room is ___ yours; they are both 3 metres wide.”"
explanation = "Use *as + adjective + as* for an equal comparison."

[questions.cefr-a2-x015]
prompt = "This is ___ bus route in the city; it has the fewest stops."
explanation = "Use *the + -est* for the superlative of a short adjective."

[questions.cefr-a2-x016]
prompt = "The nurse spoke {{blank}} (quiet) so the patient could sleep."
explanation = "An adverb modifies *spoke*; *quiet* changes to *quietly*."

[questions.cefr-a2-x017]
prompt = "There are ___ seats left, so we can invite two more people."
explanation = "Use *a few* with a plural countable noun when a small number remains."

[questions.cefr-a2-x018]
prompt = "The coffee is ___ hot for me to drink. I’ll wait a minute."
explanation = "Use *too + adjective* when the degree is excessive for an action."

[questions.cefr-a2-x019]
prompt = "I’ll text you when the train {{blank}} (arrive)."
explanation = "In a future time clause after *when*, use the present simple, not *will*."

[questions.cefr-a2-x020]
prompt = "___ called the hotel to confirm the booking?"
explanation = "*Who* is the subject of the question, so do not add the auxiliary *did*."

[questions.cefr-a2-x021]
prompt = "You arrive at a hotel and show your reservation at the front desk. What are you doing?"
explanation = "At a hotel, arriving and completing the arrival formalities is *checking in*."

[questions.cefr-a2-x022]
prompt = "You have a sore throat and a fever. Who should you contact?"
explanation = "A sore throat and fever are health problems; a doctor is the appropriate person to contact."

[questions.cefr-a2-x023]
prompt = "Use the phrasal verb from the lesson meaning ‘put clothing on your body’: It is cold outside. Please {{blank}} your coat before you leave."
explanation = "*Put on* is the phrasal verb for dressing in clothing; *take off* means to remove it."

[questions.cefr-a2-x024]
prompt = "What do you usually do when you wake up at 6:30?"
explanation = "*Get up* means to leave your bed after waking."

[questions.cefr-a2-x025]
prompt = "The room is dark. Please ___ the light."
explanation = "*Turn on* means to start a device or switch on a light."

[questions.cefr-a2-x026]
prompt = "I can’t find my bus card. I’m going to {{blank}} it in my bag."
explanation = "*Look for* means to search for something; keep the verb with *for*."

[questions.cefr-a2-x027]
prompt = "You want a room for one person. What should you ask for?"
explanation = "A *single room* is intended for one person."

[questions.cefr-a2-x028]
prompt = "Your new colleague starts work today. A colleague is ___."
explanation = "A *colleague* is someone you work with."

[questions.cefr-a2-x029]
prompt = "The teacher asked us to {{blank}} notes during the lesson."
explanation = "Both *take notes* and *write notes* are natural; *take notes* is the common collocation."

[questions.cefr-a2-x030]
prompt = "Choose the two phrases that describe free-time activities."
explanation = "*Go swimming* and *play chess* are leisure activities; the other phrases describe work or procedures."

[questions.cefr-a2-x031]
prompt = "A weather app says there is a 90% chance of rain. What should you take?"
explanation = "A high chance of rain is a reason to take an umbrella."

[questions.cefr-a2-x032]
prompt = "You want to save a map on your phone before travelling. What can you do?"
explanation = "Download the map to save it on your device; upload means sending content from your device to another service."

[questions.cefr-a2-x033]
prompt = "Your friend is free on Saturday. Make a friendly suggestion to visit the museum."
explanation = "Use *Why don’t we + base verb…?* to suggest doing something together."

[questions.cefr-a2-x034]
prompt = "“Would you like to have dinner with us?” Choose a positive reply."
explanation = "*I’d love to* is a natural, friendly way to accept an invitation."

[questions.cefr-a2-x035]
prompt = "You cannot join a friend’s picnic because you have to work. What is a polite reply?"
explanation = "A polite refusal can thank the person for the invitation and give a brief reason."

[questions.cefr-a2-x036]
prompt = "Choose a natural suggestion using “How about…?”"
explanation = "After *How about*, use a noun or an -ing form: *How about taking…?*"

[questions.cefr-a2-x037]
prompt = "Your friend is carrying two heavy bags. Offer to help."
explanation = "Use *Shall I + base verb…?* to offer help."

[questions.cefr-a2-x038]
prompt = "You cannot open a window. Ask someone politely for help."
explanation = "*Could you…?* is a polite way to ask someone to do something."

[questions.cefr-a2-x039]
prompt = "At a hotel: “I have a reservation under the name Nguyen.” What is a suitable reply?"
explanation = "A hotel receptionist can confirm the booking and ask for identification or the length of the stay."

[questions.cefr-a2-x040]
prompt = "You call a clinic and want to speak to the receptionist. What can you say?"
explanation = "On a call, state politely whom you would like to speak to."

[questions.cefr-a2-x041]
prompt = "“I’d like to make {{blank}} for a haircut on Friday.”"
explanation = "The natural phrase is *make an appointment*."

[questions.cefr-a2-x042]
prompt = "A hotel room is noisy at night. What is a polite way to complain?"
explanation = "State the problem with *I’m afraid…* and ask for help rather than giving a blunt command."

[questions.cefr-a2-x043]
prompt = "Choose the two useful phrases for asking and giving simple directions."
explanation = "*Could you tell me how to get to…?* asks politely for directions; *Go straight and turn left* gives a route."

[questions.cefr-a2-x044]
prompt = "Your friend asks, “Have you ever stayed in a hostel?” Choose a natural answer about one experience."
explanation = "A present-perfect question can be answered with *Yes, I have* and a brief description of the experience."

[questions.cefr-a2-x045]
prompt = "Write a short message to a friend who is ill. Offer to bring them something and ask what time you can visit."
explanation = "The model offers to bring something and asks what time to visit. The keyword rubric requires all three requested elements."

[questions.cefr-a2-x046]
prompt = "Read the advert: “Green View Hotel: rooms from $45 per night, breakfast included. Free cancellation until 6 p.m. the day before arrival.” What is included in the price?"
explanation = "The advert says that breakfast is included in the room price."

[questions.cefr-a2-x047]
prompt = "Read the email: “Hi Minh, I’ve booked two tickets for the 6:20 film on Friday. Meet me outside the cinema at 6. The seats are near the back. —An” Choose all the details stated."
explanation = "The email states there are two tickets, the film is at 6:20 on Friday, and they will meet outside at six."

[questions.cefr-a2-x048]
prompt = "A notice says: “The swimming pool is closed on Monday for cleaning. It opens again at 7 a.m. on Tuesday.” When can you swim again?"
explanation = "The notice says that the pool opens again at 7 a.m. on Tuesday."

[questions.cefr-a2-x049]
prompt = "Choose the best connector: “We checked the map ___ we left the hotel.”"
explanation = "Use *before* to show that checking the map happened earlier than leaving the hotel."

[questions.cefr-a2-x050]
prompt = "Please wash your hands {{blank}} you eat."
explanation = "Use *before* to show the order of two actions."

[questions.cefr-a2-x051]
prompt = "The door is open, but there isn't ___ in the room. It is empty."
explanation = "Use *anyone* after the negative *isn't*; *someone/everyone* do not fit the meaning that the room is empty."

[questions.cefr-a2-x052]
prompt = "The lost tourist looked ___ for the station, but could not find it."
explanation = "*Everywhere* means in all places and fits after *looked* here."

[questions.cefr-a2-x053]
prompt = "The bus was late, {{blank}} we took a taxi."
explanation = "Use *so* to introduce the result: the bus was late, so they took a taxi."

[questions.cefr-a2-x054]
prompt = "Which opening is suitable for a friendly email to a classmate?"
explanation = "*Hi Mai,* is a suitable friendly opening to a classmate."

[questions.cefr-a2-x055]
prompt = "Which sentence is the best polite closing for a short email asking a hotel to confirm a booking?"
explanation = "*Thank you for your help* is a polite, clear closing for this request."

[questions.cefr-a2-x056]
prompt = "Read the review: “The room was clean and close to the station. The staff were friendly, but breakfast started too late for our early train.” Choose all the reviewer’s opinions."
explanation = "The reviewer liked the clean room, location, and staff, but disliked the breakfast time."

[questions.cefr-a2-x057]
prompt = "Write a short email (about 50–80 words) apologizing to a friend for missing a meeting. Explain that your bus was late, suggest a new day and time, and ask them to reply."
explanation = "The model is about 50–80 words and includes an apology, reason, day, time, and request for a reply. The keyword rubric requires all requested elements; it does not count words automatically."

[questions.cefr-a2-x058]
prompt = "My cousin moved to Hue three years {{blank}}."
explanation = "Place *ago* after a period of time to give a past reference; use the past simple with it."

[questions.cefr-a2-x059]
prompt = "My new phone is ___ than my old one. Both work well, but the new one has a longer battery life."
explanation = "The irregular comparative of *good* is *better*; use *than* when comparing two things."

[questions.cefr-a2-x060]
prompt = "Of the three meals we tried, this one was the ___."
explanation = "The irregular superlative of *good* is *the best*."

[questions.cefr-a2-x061]
prompt = "The blue suitcase costs $80 and the red one costs $50. The red suitcase is ___ the blue one."
explanation = "Use *not as + adjective + as* to say that something has a lower degree; the red case costs less."

[questions.cefr-a2-x062]
prompt = "When I was six, I ___ ride a bike, but I could not swim."
explanation = "Use *could + base verb* for a general ability in the past."

[questions.cefr-a2-x063]
prompt = "Choose all the sentences that use *a little* or *a lot of* correctly."
explanation = "Use *a little* with an uncountable noun; *a lot of* can be used with plural countable and uncountable nouns."

[questions.cefr-a2-x064]
prompt = "There was ___ in the box: an old photo with my name on it."
explanation = "Use *something* in an affirmative sentence when referring to an unspecified thing."

[questions.cefr-a2-x065]
prompt = "I knocked on the door twice, but ___ answered."
explanation = "*Nobody* means no person; it expresses the negative meaning without adding *not*."

[questions.cefr-a2-x066]
prompt = "Choose the time connector showing that the room inspection happens later: “We return the key and check out at 10. The receptionist inspects the room ___ we leave.”"
explanation = "Use *after* to show that the room inspection happens later than the guests’ departure."
