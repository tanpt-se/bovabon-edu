options = ["Prerender all 40k pages at build time and rebuild whenever a price changes", "ISR: prerender popular pages, render the rest on the first request, and have the CMS webhook call revalidateTag by SKU", "Use dynamic SSR for every request so prices are always absolutely current", "Use CSR: send an empty page and have the client fetch all product data"]
explanation = "Tag-based ISR keeps SEO and CDN costs favorable, shortens builds, and refreshes prices soon after a webhook. Rebuilding everything is slow; SSR spends compute on mostly stable content and is sensitive to backend latency; CSR harms SEO for primary content."

[questions.nextjs-lv002]
