options = ["Sharing typed dependencies such as auth state or a QueryClient with route hooks and loaders", "Automatically saving all component state in the URL", "Replacing authentication in the server API", "Creating the HTML `<head>` for each route"]
explanation = "Router context provides shared dependencies in the route tree; it does not replace server-side access control."

