options = ["A QueryClient only works inside a component", "One request might read another request's cache, including user-specific data", "A QueryClient can hold only one query", "Hydration always fails when a cache exists"]
explanation = "A server QueryClient needs a request-appropriate scope to avoid sharing cache state across users."

[questions.nextjs-dv011]
