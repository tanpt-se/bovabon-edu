[modules.nextjs-dv-authz]
title = "Authentication and Data Protection"
description = "Distinguish authentication from authorization, protect Server Actions, and enforce resource-level permissions on the server."
lesson = '''
### Authentication and server-side authorization
Authentication answers “who does this request belong to?”; authorization decides what that identity may do with a specific resource. The App Router can read a session in a Server Component, Route Handler, or Server Action, but each data-changing operation must still check permission where it is handled. A Server Action is an entry point that can be called through a request, so hiding a button in the UI is not a way to protect data.

| Layer | Responsibility | Example check |
|---|---|---|
| UI | User experience and navigation | Hide an edit button when the user lacks permission |
| Proxy/Middleware | Early filtering or redirecting | Send a signed-out visitor to the sign-in page |
| Server Action / Route Handler | Authenticate the request and check permission | May this user edit this project? |
| Data access layer | Limit returned or updated data | Query only resources in an allowed tenant |

For example, an action that receives `projectId` from a client must read the session on the server, load the project, and compare its owner or role; it must not trust a `userId` sent in the form. Permission checks can be centralized in data-access functions so different call paths use the same policy. Session cookies commonly need `HttpOnly`, `Secure`, and `SameSite`; environment variables prefixed with `NEXT_PUBLIC_` are exposed to the client and must not contain secrets.

Common mistakes include treating middleware or a route guard as the only security boundary, assuming a form's types validate its input, or serializing a whole user object with sensitive fields into a Client Component. Check identity, permission on the specific resource, and input data in the server-side read or write path.
'''

[questions.nextjs-dv001]
prompt = "How do authentication and authorization differ?"
options = ["Authentication identifies the user; authorization determines their permissions on an action or resource", "Authentication checks permissions; authorization creates a session", "They are two names for the same concept", "Authorization applies only to the UI"]
explanation = "First identify who is making the request, then check whether they may perform the specific action on the resource."

[questions.nextjs-dv002]
prompt = "A Server Action receives `projectId` from a form and updates the project. Which check must happen before writing?"
options = ["Trust a `userId` from the form if its type is string", "Read the session on the server and check the user's permission on the loaded project", "Only check that the edit button is hidden from other users", "Only check that the URL starts with `/dashboard`"]
explanation = "Client input can be changed; the action must authenticate the request and authorize access to the actual resource on the server."

[questions.nextjs-dv003]
prompt = "Why should a secret API key not be placed in an environment variable prefixed with `NEXT_PUBLIC_`?"
options = ["That variable exists only in tests", "Next.js exposes its value in the client bundle", "That variable can only be read from CSS", "The prefix automatically encrypts its value"]
explanation = "The `NEXT_PUBLIC_` prefix marks a value for client use, so it is not appropriate for a secret."

[questions.nextjs-dv004]
prompt = "Which practices help protect a data-editing operation?"
options = ["Check the session and permission on the resource in a server-side action", "Hide the edit button on the client and treat that as complete access control", "Validate form data before using it", "Trust a client-supplied `ownerId` if it matches a TypeScript type"]
explanation = "The UI and TypeScript do not verify a request when it reaches the server; the server must check identity, permission, and input."

