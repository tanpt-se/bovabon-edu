options = ["A regular dynamic segment", "A required catch-all", "An optional catch-all", "A route group"]
explanation = "The double brackets make the catch-all optional, so it also matches when there are no following segments."

[questions.next-004]
prompt = "Which statements about `loading.tsx` and `error.tsx` in the App Router are correct?"
options = ["`loading.tsx` provides a pending fallback for a segment", "`error.tsx` is an error boundary for its branch", "`error.tsx` must be a Server Component", "`error.tsx` can provide a retry action with `reset`"]
explanation = "The error boundary convention requires a Client Component and can call `reset` to retry rendering the branch."

