explanation = "This exercise models App Router file-based routing and shows that route groups do not affect URLs."

[modules.next-render-cache]
title = "Server Components, Actions, and Data"
description = "Choose server/client boundaries, handle mutations, and design caching, revalidation, ISR, and streaming."
lesson = '''
### Choose where code runs and when data refreshes
Server Components are the default in the App Router. They work well for reading data on the server and keeping credentials out of the browser bundle. Add `use client` at the smallest boundary that needs state, event handlers, or browser APIs; every module imported from that boundary also becomes part of the client bundle. Props passed across the boundary must be serializable.

Do not assume `fetch` is always cached. Choose an explicit policy: use `force-cache` for reusable data, or `next: { revalidate: 60, tags: ['posts'] }` when a time limit or tag is needed. ISR serves a generated version and regenerates it over time or when revalidated. `revalidateTag('posts', 'max')` marks data with that tag as stale for profile-based refresh; this differs from immediately invalidating a specific route.

| Need | Approach |
|---|---|
| Mostly static data | Cache and revalidate after an interval |
| Data that varies by user | Avoid a shared cache with the wrong scope |
| A slow part of the page | Use Suspense or `loading.tsx` to stream a fallback |

A Server Action is an entry point that can be called through a request; authentication and authorization must still be checked inside the action. Common mistakes include putting secrets in a Client Component or assuming `use server` automatically enforces access control.
'''

[questions.next-009]
prompt = "A component needs `useState` and click handling in the App Router. What is the most appropriate change?"
options = ["Mark the component file with `use client` at the top of the module", "Put `use server` in the component", "Rename the file to `client.tsx`", "Convert every layout to a Client Component"]
explanation = "`use client` creates a client boundary for state and events; keep that boundary small to limit client bundle growth."

[questions.next-010]
prompt = "A Server Action changes a user's profile. What must the action itself do?"
options = ["Only check that the submit button is disabled", "Authenticate the caller and check their permission on the target data before writing", "Trust that the action is only called from the page's form", "Put the secret in a client module so the action can reuse it"]
explanation = "A Server Action can be called through a request, so authorization must be checked on the server at the mutation point."

[questions.next-011]
prompt = "A `fetch` request returns data that changes frequently for each user. What is the safest choice?"
options = ["Use one shared cache for everyone", "Do not rely on implicit caching; explicitly choose an uncached policy or an appropriately scoped cache", "Set TanStack Query's `staleTime` to 0; that is enough for server `fetch`", "Change the endpoint to GET to guarantee the data is not cached"]
explanation = "Server caching and client caching are separate mechanisms; private data needs an explicit policy with the correct scope."

[questions.next-012]
prompt = "A request tagged `posts` should be refreshed using the modern stale-while-revalidate profile. Which choice fits?"
options = ["`revalidateTag('posts', 'max')`", "`revalidatePath('/posts')` even though invalidation by tag is needed", "`router.refresh('posts')`", "`cacheTag('posts', 0)`"]
explanation = "`revalidateTag` refreshes data by tag; the `max` profile can serve stale data while revalidation follows its policy."

[questions.next-013]
prompt = "Which choices help stream the UI while part of the data is loading slowly?"
options = ["Wrap the slow region in Suspense with a fallback", "Put `loading.tsx` at the appropriate segment", "Convert every component to a Client Component", "Wait for every request to finish before rendering the entire page"]
explanation = "Suspense and the `loading` convention can send a fallback first, then stream the content when it is ready."

[questions.next-014]
prompt = '''
To use `fetch` with reusable cached data rather than treating every request as uncached, the explicit cache value is {{blank}}.
'''
explanation = "Stating the cache policy at the request makes its behavior explicit and avoids incorrect assumptions about defaults."

[questions.next-015]
prompt = '''
The directive at the top of a module that creates a client boundary for components using state and event handlers is {{blank}}.
'''
explanation = "This directive belongs at the top of the module; components imported from it are also part of the client bundle."

[questions.next-016]
title = "Revalidate Cache by Tag"
prompt = '''
Write `revalidateByTag(entries, tag)` for a plain JavaScript cache model. `entries` is an array of objects with `path`, `tags` (an array of strings), and other fields.
- For each entry containing the tag, set `stale` to `true`.
- Preserve all other fields and the array order.
- Return the paths that were marked, in their original order.
- Do not modify entries that do not contain the tag.

This exercise models tag-based invalidation: data is marked stale so it can be revalidated on the next read.
'''
hints = ["Iterate over `entries` once and check with `includes`.", "Change only the `stale` field on entries that actually have the tag."]
explanation = "In a real application, tags are attached to fetched or cached data; `revalidateTag` marks tagged content stale according to a profile."

[modules.next-route-platform]
title = "Route Handlers, Middleware, and Metadata"
description = "Create endpoints, control matchers, and optimize metadata, images, and fonts."
lesson = '''
### Endpoints and presentation
`route.ts` defines HTTP handlers through exported functions such as `GET` or `POST`; they receive a `Request` and return a `Response` or `NextResponse`. A Route Handler is an endpoint, and `page.tsx` cannot share the same segment with `route.ts`. Middleware runs before a request is completed and can be scoped with `config.matcher`; matchers should be declared statically so the framework can analyze them at build time. Middleware is useful for redirects, rewrites, or preliminary checks, but it does not replace authorization where data is read or written.

> **Next.js 16:** `middleware.ts` was renamed to `proxy.ts` (exporting a `proxy` function and running on the Node.js runtime); `config.matcher`, redirects, and rewrites work the same way. The `npx @next/codemod@latest middleware-to-proxy` codemod can help migrate.

Static metadata uses `metadata`; metadata that depends on data can be generated with `generateMetadata`. `next/image` can optimize images; when using `fill`, provide suitable `sizes` so the browser can select the right variant. `next/font` helps self-host fonts at build time.

| Tool | Consideration |
|---|---|
| Route Handler | Return the appropriate status, headers, and body |
| config.matcher | Run middleware only for routes that need it |
| Metadata | Set a title and description for each route |
| Images and fonts | Consider dimensions, alt text, sizes, and layout shift |

For example, a matcher for `/dashboard/:path*` covers both `/dashboard` and its child pages. Common mistakes include using a broad matcher that sends every request through expensive logic, or protecting only the UI while forgetting permission checks in a handler or action.
'''

[questions.next-017]
prompt = "In the App Router, which file declares an HTTP endpoint at `/api/health`?"
options = ["`app/api/health/page.tsx`", "`app/api/health/route.ts`", "`app/api/health/layout.tsx`", "`app/route.ts`"]
explanation = "`route.ts` contains HTTP handlers for a route segment; `page.tsx` creates a UI."

[questions.next-018]
prompt = "A post page's title must depend on data loaded from its slug. Which API is appropriate?"
options = ["Export fixed `metadata` for every post", "Export `generateMetadata` based on params or data", "Use `useEffect` to change the title after rendering", "Set the title in a middleware matcher"]
explanation = "`generateMetadata` supports metadata that depends on the route and its data; use the `metadata` export for static metadata."

[questions.next-019]
prompt = "A hero image uses `fill` with `next/image`, but the browser downloads an oversized image on mobile. Which field describes the expected display size?"
options = ["`sizes`", "`priorityMode`", "`cacheTag`", "`fontDisplay`"]
explanation = "`sizes` helps the browser choose an image variant suited to the layout and viewport."

[questions.next-020]
prompt = "Which statements about middleware and route protection are correct?"
options = ["`config.matcher` limits which requests middleware handles", "Matchers should be static configuration so the framework can analyze them", "Middleware replaces permission checks in a Server Action", "Data access permissions still need to be verified where data is read or written"]
explanation = "Middleware is a useful request-processing layer, but it is not the final authorization boundary for data."

[questions.next-021]
prompt = '''
To self-host fonts using Next.js optimization, the commonly used package is {{blank}}.
'''
explanation = "`next/font` downloads and self-hosts fonts during the build rather than depending on a runtime request to the font provider."

[questions.next-022]
