'''
explanation = "A Route Handler exports functions such as `GET`, `POST`, `PUT`, or `DELETE` to handle the corresponding methods."

[questions.next-023]
prompt = "Name two appropriate uses for middleware and explain why it should not be the only place that authorizes data access."
keywords = [["redirect", "redirecting"], ["rewrite", "rewriting"], ["matcher", "route filtering", "limiting routes"], ["authorization", "permission check", "access control"], ["server action", "route handler", "read boundary", "write boundary"], ["request", "middleware"]]
model_answer = '''
Middleware can use a matcher to limit requests, redirect them, or rewrite them before the route completes. Data still needs authorization checks in a Route Handler, Server Action, or data access layer because a client can call an endpoint directly.
'''
