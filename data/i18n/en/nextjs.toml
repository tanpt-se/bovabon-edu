- `filterKey` matches when it is a **prefix** of `queryKey`: every `filterKey[i]` is deeply equal to `queryKey[i]`.
- An empty `filterKey` matches every key; a longer `filterKey` does not match.
- Deep equality: numbers/strings/booleans/null use `===`; arrays compare element by element; objects have the same key set and deeply equal values, regardless of key order.

Example: `todos` keys with status `done` match the prefix `['todos']` and an exact filter, but not a filter for status `open`.
'''
explanation = "Hierarchical query keys let prefix invalidation refresh a group (such as every todos list) without enumerating every exact key."
hints = ["Write a separate deepEqual helper, then apply it to each filterKey element.", "Handle null separately because typeof null is 'object'."]

