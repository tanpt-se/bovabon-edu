[modules.nextjs-dv-query-ssr]
title = "TanStack Query: SSR and Hydration"
description = "Prefetch data on the server, safely transfer cache state to the client, and avoid needless refetches or data leaks across requests."
lesson = '''
### Transfer query cache from the server to the browser
Server rendering with TanStack Query usually has three steps: create a `QueryClient` for the current request, prefetch the queries needed by the route, and serialize the state with `dehydrate`. In React, wrap the component tree in a `HydrationBoundary` with that state; `useQuery` on the client can reuse the cache rather than starting empty. The `queryKey` and query options must be consistent between prefetching and the component that reads the data.

| Step | Action | Consideration |
|---|---|---|
| Server | Create a QueryClient and call `prefetchQuery` | User-specific data belongs in that request's cache |
| Transfer state | Call `dehydrate(queryClient)` | Send only data that is safe and serializable for the client |
| Client | Hydrate with `HydrationBoundary`, then call `useQuery` | Use the same query key to find the right cache entry |

Do not use one global `QueryClient` for a long-running server process: requests from two users could see the same cache. `staleTime` determines when data is considered stale; the default of zero can make a query stale as soon as it hydrates and trigger a refetch when the client mounts. Choose a freshness period that fits the domain instead of disabling refetch indefinitely. When several queries are independent, start prefetching them in parallel to reduce waterfalls; preserve ordering only when one query depends on another's result.

Common mistakes include using different query keys on the server and client, passing only `initialData` and losing cache timestamp metadata, or serializing an object containing a secret or token. Hydration continues with already loaded data; it does not replace access control, server cache policy, or API authentication.
'''

[questions.nextjs-dv010]
