- `run(key, fn)`: if a promise for `key` is still pending, return that exact promise without calling `fn`; otherwise call `fn()` (which returns a promise), store it, and return it.
- When the promise settles (resolves **or** rejects), remove the key so a later call invokes `fn` again.
- `size()`: number of pending keys.

Do not cache completed results; this is request deduplication, not a cache.
'''
