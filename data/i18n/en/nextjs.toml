[modules.nextjs-lead]
title = "Next.js Technical Leadership"
description = "Choose rendering and caching strategies, manage security, cost, architecture, observability, and safe upgrades at team scale."
lesson = '''
### Make rendering and caching an explicit system decision
At scale, rendering choices affect search visibility, infrastructure cost, freshness, and failure behavior. Prefer static rendering or ISR for shared content that changes occasionally; reserve dynamic rendering for request-specific data. Keep personalization inside a small boundary so a session lookup does not make an entire site dynamic. For multi-tenant applications, tenant identity must be included in every cache key, tag, and data query.

| Concern | Practical approach |
|---|---|
| Large catalog with SEO | Prerender popular pages and use ISR for the rest |
| Private account page | Render with request-scoped data and avoid shared caching |
| Edge runtime | Use for light request logic; measure latency to regional databases |
| Safe rollout | Use stable canary buckets, stop thresholds, and a quick rollback |

Instrument route and data traces before optimizing. Track cache hit rate, p95 response time, errors, and user-facing Web Vitals. During upgrades, use migration guides and codemods, then canary one application before broad rollout. Common mistakes include reading cookies in a root layout, using one cache entry across tenants, and treating middleware as the only authorization layer.
'''

[questions.nextjs-lv001]
