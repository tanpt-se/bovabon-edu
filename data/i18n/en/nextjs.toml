explanation = "Reading cookies in the root layout makes every route dynamic. Isolating personalization preserves caching elsewhere, and a review rule prevents recurrence. More instances treat the symptom; removing the feature avoids the problem; full-site CSR trades away SEO and performance."

[questions.nextjs-lv003]
