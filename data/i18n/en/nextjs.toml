options = ["Create an HTTP endpoint for the branch", "Wrap child route UI and potentially preserve its state during navigation within the branch", "Replace every `page.tsx` with static content", "Automatically create a dynamic segment"]
explanation = "A layout shares UI across child routes; the root layout provides the `html` and `body` structure."

