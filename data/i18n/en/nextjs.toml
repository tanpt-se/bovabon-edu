[modules.tanstack-query]
title = "TanStack Query and Client-Side Caching"
description = "Query keys, freshness, retention, invalidation, optimistic updates, and pagination."
lesson = '''
### Cache data by query identity
`queryKey` is an array that describes the data and every input used by the query function, for example `['projects', { teamId, page }]`. TanStack Query hashes objects in a key consistently, so object property order does not change identity; the order of array elements still matters. Leaving an input out of the key can make different requests share the same cache entry.

| Option | Meaning |
|---|---|
| `staleTime` | How long data is considered fresh |
| `gcTime` | How long to retain cache with no observers |
| `invalidateQueries` | Marks matching queries stale and usually refetches active queries |

Requests with the same key that are already in flight are deduplicated. For an optimistic mutation, snapshot the cache before updating it, restore the snapshot on error, and invalidate when the mutation settles. Pagination usually puts the page in the key and uses `placeholderData: keepPreviousData`; an infinite query uses `initialPageParam` with `getNextPageParam`. Common mistakes include confusing `staleTime` with cache deletion time or mutating a cached object in place so the old value cannot be restored.
'''

[questions.next-025]
prompt = "A query has `staleTime: 30_000` and `gcTime: 300_000`. Which interpretation is correct?"
options = ["Data is removed from the cache after 30 seconds", "30 seconds is the fresh period; `gcTime` retains cache that has no observers", "`gcTime` determines when in-flight requests are deduplicated", "The two options have the same meaning"]
explanation = "`staleTime` controls freshness; `gcTime` controls how long a query without observers remains cached."

[questions.next-026]
prompt = "A query function fetches orders by `userId` and `status`. Which query key describes all of its inputs?"
options = ["`['orders']`", "`['orders', userId, status]`", "`['orders', Date.now()]`", "`['orders', queryFn]`"]
explanation = "Every variable that affects the query result should be in the key so the cache does not mix different data."

[questions.next-027]
prompt = "A mutation successfully updates a post. Which API marks the post list query stale so it can synchronize again?"
options = ["`invalidateQueries`", "`setGcTime`", "`removeObserver`", "`resetStaleTime`"]
explanation = "Invalidation marks matching queries stale and usually refetches those that are active."

[questions.next-028]
prompt = "Which statements about hashing `queryKey` are correct?"
options = ["Object property order does not change the hash of equivalent keys", "The order of array elements in the key still matters", "Include filter variables that affect the result in the key", "Every query should use the same key to make cache reuse easier"]
explanation = "Stable object hashing lets equivalent keys share a cache entry, but array order and input variables still express query identity."

[questions.next-029]
prompt = "An infinite query uses a cursor. Which parts belong to the correct pattern?"
options = ["Define `initialPageParam`", "Use `getNextPageParam` to derive the next cursor", "Use `hasNextPage` to determine whether another page exists", "Create a different query key for every call to `fetchNextPage`"]
explanation = "An infinite query keeps its pages in one query; the page parameter changes on each load without requiring a new query key for every page."

[questions.next-030]
prompt = '''
In `useQuery`, the required field that holds the array describing the data's identity is {{blank}}.
'''
explanation = "The query key identifies a cache entry and should include variables that affect the data."

[questions.next-031]
title = "Stable Hashing and a Mini QueryClient"
prompt = '''
Write `stableQueryKeyHash(key)` and `MiniQueryClient`.
- Hash an array key as JSON after recursively sorting object properties; preserve array order.
- `new MiniQueryClient({ staleTime })` stores a cache in memory.
- `fetchQuery(queryKey, queryFn, { staleTime })` returns cached data if it is still fresh. The `staleTime` option overrides the client's default; at the exact `staleTime` boundary, data is stale.
- Calls with the same hash and an unfinished request must share one Promise and call `queryFn` only once.
- `getQueryData(key)` reads data; `setQueryData(key, value)` writes data.
- `invalidateQueries(prefix)` marks every query key that starts with `prefix` stale; the next fetch must call `queryFn` again. Compare each prefix part using the stable hash.

The tests use `Date.now()` for the clock; fake timers are available.
'''
hints = ["Normalize keys recursively: sort object keys and preserve array order.", "Store the original `queryKey` with each cache entry for prefix invalidation; register in-flight requests before calling `queryFn`."]
explanation = "This exercise models core query-cache concepts: stable identity, freshness, deduplication, and invalidation."

[questions.next-032]
title = "Optimistic Update with Rollback"
prompt = '''
Write `optimisticMutation(cache, key, update, mutation)` where `cache` is a `Map`.
- Snapshot the old value and immediately update the cache with `update(previousValue)`.
- If `mutation` resolves, return its result and keep the optimistic value.
- If `mutation` rejects, restore the old value and rethrow the same error.
- If the key was absent from the `Map` and the mutation fails, delete the key instead of storing `undefined`.

This is a plain JavaScript model of a snapshot in `onMutate` and rollback in `onError`; a real application commonly invalidates queries after the mutation settles.
'''
hints = ["Use `Map.has` to distinguish a missing key from a key whose value is `undefined`.", "Rollback in `catch`, then rethrow the same error so the caller can still handle it."]
explanation = "A snapshot lets the UI respond immediately while restoring consistent state if the request fails."

[modules.tanstack-router]
title = "TanStack Router: Type-Safe Routing"
description = "Define a route tree, validate search parameters, and load data with loaders."
lesson = '''
### A typed route tree and data from the URL
TanStack Router infers path parameters, search parameters, and context from the registered route tree. When configured correctly, `Link` and `navigate` can report invalid routes or missing parameters early. File-based routing can generate a route tree; code-based routing declares routes through the API.

`validateSearch` normalizes and validates the query string into typed data; because a URL is untrusted input, handle missing or invalid values. A loader receives parsed params, search, and context to preload data, determine pending or error UI, and support preloading during navigation.

| Location | Use |
|---|---|
| Path params | Identify a resource such as `/posts/$postId` |
| Search params | Filters, sorting, and page number that can be shared through the URL |
| Loader | Load data before the route renders |

For example, `/posts/42?page=2` separates `postId` from `page`; a loader can use both to call an API. Common mistakes include leaving the query string unvalidated or keeping filters only in component state so a refresh or shared link loses them. Type-safe routing helps catch client-side mistakes, but does not replace server-side authentication.
'''

[questions.next-033]
prompt = "What is the main benefit of a typed, registered route tree in TanStack Router?"
options = ["Automatically create a server API", "Infer and validate routes and params when using `Link` or `navigate`", "Remove the need to validate input on the server", "Automatically replace the Next.js App Router in every project"]
explanation = "The router can infer valid routes from the route tree; data still needs to be trusted and validated at the appropriate layer."

[questions.next-034]
prompt = "A page's filters and page number must stay in the URL, be shareable, and be type-checked before use. Where should the main logic go?"
options = ["The route's `validateSearch`", "Local state that is not synchronized with the URL", "A `useEffect` in the root layout", "Next.js middleware"]
explanation = "`validateSearch` parses and normalizes search params so routes and loaders can use more reliable data."

[questions.next-035]
prompt = "A route needs to load data from path params before its component appears. Which route mechanism is the best fit?"
options = ["`loader`", "`validateSearch`", "`Link`", "`Outlet`"]
explanation = "A loader receives params and context to load data before the route renders and supports pending and error states."

[questions.next-036]
prompt = "A loader uses `search.page` to call an API. What should happen before the loader uses that value?"
options = ["Trust every query-string value as a valid integer", "Validate and normalize the search params in the route", "Move `page` into component state after rendering", "Remove search params from the URL"]
explanation = "Search params come from the URL, so they should be parsed and validated first; the route can provide a type and default value."

[questions.next-037]
prompt = "Which tasks fit a TanStack Router loader and route context?"
options = ["Read path params to load the corresponding resource", "Use validated search params for filters", "Use context provided to the router or route", "Trust that a loader automatically grants permission to read backend data"]
explanation = "A loader coordinates params, search, and context; authorization still needs to be checked at the backend or data boundary."

[questions.next-038]
prompt = '''
The route option that parses, validates, and normalizes a query string is named {{blank}}.
'''
explanation = "A route uses `validateSearch` to turn URL data into validated search state."

[questions.next-039]
prompt = "Explain the relationship between validated search params and a loader on a filtered, paginated list page."
keywords = [["validate search", "validatesearch", "search validation"], ["typed", "type-safe", "typed value"], ["loader"], ["filter", "filtering"], ["pagination", "page number"], ["url", "query string"]]
model_answer = '''
`validateSearch` reads and normalizes the query string into typed values; it can supply defaults or reject invalid data. A loader uses validated search together with params and context to load the requested filters and page. The URL remains shareable and can be reloaded.
'''
