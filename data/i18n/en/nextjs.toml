keywords = [["prefetchQuery", "prefetch"], ["dehydrate"], ["HydrationBoundary", "hydrate"], ["staleTime"], ["new QueryClient per request", "per request", "each request"]]
model_answer = "In a Server Component, create a `QueryClient`, call `prefetchQuery` with the same `queryKey` that the client will use, then dehydrate the cache and wrap the child tree in a `HydrationBoundary` with that state. A client component calling `useQuery` with the same key can reuse the hydrated data. Set a positive `staleTime` so it does not immediately refetch after hydration. A common mistake is using one global server `QueryClient`, which can leak one user's data to another; create a new QueryClient per request on the server (and keep a stable instance on the client)."

