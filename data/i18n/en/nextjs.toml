[modules.nextjs-dv-router-auth]
title = "TanStack Router: Context and Route Guards"
description = "Pass typed dependencies through the route tree, guard navigation with `beforeLoad`, and organize authentication across route branches."
lesson = '''
### Shared context and protected routes
TanStack Router lets you pass shared dependencies through router context, such as a `queryClient` or information about the authenticated user. You can define the context type on the root route so `beforeLoad`, loaders, and route components receive a typed contract. A route can add context, and its descendants inherit the accumulated context from parent branches. This lets a protected layout share logic with the screens beneath it.

| Mechanism | When | Role |
|---|---|---|
| Router context | When creating or updating the router | Share dependencies such as the current user or client cache |
| `beforeLoad` | Before a route's loader | Check navigation conditions, add route context, or throw a redirect |
| Loader | When a route needs data | Load data from params, search, and available context |
| Server/API | When reading or writing data | Re-authenticate and enforce actual authorization |

For example, a parent route at `/app` can check `context.auth.user`; if no user is present, it can throw a redirect to `/login`. Child routes in the branch can use that context to load data or display the appropriate UI. If login or logout changes the user, update the router context and invalidate route state as needed so guards and loaders run again.

A client-side route guard improves navigation flow only. Users can still call an API directly, so the server must enforce permissions on each resource. Common mistakes include using React context in a component when a loader cannot access that dependency, keeping stale auth state after login, or assuming a redirect replaces server-side authorization.
'''

