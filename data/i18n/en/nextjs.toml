[modules.next-routing]
title = "App Router and Route Conventions"
description = "Pages, layouts, route groups, dynamic segments, loading states, and error boundaries."
lesson = '''
### From the folder tree to URLs
In the App Router, folders inside `app` create route segments. A `page` makes a segment accessible as a route, while a `layout` wraps its descendants and can preserve UI state during navigation within that branch. The root layout provides the `html` and `body` elements.

| File or segment | Role |
|---|---|
| page.tsx | Route content |
| layout.tsx | UI shared by child routes |
| loading.tsx | Fallback while a segment waits for data |
| error.tsx | Segment error boundary; must be a Client Component |
| (marketing) | Route group that does not appear in the URL |
| [id] | A single dynamic segment |
| [...slug] / [[...slug]] | Required / optional catch-all |

For example, `app/(shop)/products/[id]/page.tsx` matches `/products/42`; `(shop)` only organizes the layout. A catch-all captures multiple segments and must be the final route segment. `loading.tsx` creates a nearby pending state; `error.tsx` can retry with `reset()`. Common mistakes include putting `page.tsx` and `route.ts` in the same segment or assuming a route group adds a URL segment.
'''

[questions.next-001]
