[modules.rust-dv-patterns]
title = "Advanced patterns & let-else"
description = "Use destructuring, match guards, refutability, and patterns in control-flow constructs."
lesson = '''
### Patterns inspect and extract data
Patterns appear in more than `match`: Rust also uses them in `let`, function parameters, `if let`, `while let`, `for`, and `let-else`. An **irrefutable** pattern always matches a value of its type, such as `let (x, y) = pair`; a **refutable** pattern may fail, such as `Some(value)`. Therefore, `let` usually requires an irrefutable pattern, while `if let` and `match` handle a pattern that may not match.

| Syntax | Refutability | Use it when |
|---|---|---|
| `let (x, y) = pair` | Irrefutable | Destructuring is guaranteed to succeed |
| `if let Some(x) = value` | Refutable | Only one variant needs handling |
| `match value { ... }` | Refutable; must be exhaustive | Every case or group of cases needs handling |
| `let Some(x) = value else { return; }` | Refutable | Extracting a value early; the else branch must diverge |

`match` must be exhaustive so no state is missed; the compiler also warns about an unreachable branch when an earlier one already covers it. `_` ignores a value that is not needed, while `..` ignores the remaining fields or elements during destructuring. A match guard such as `Some(n) if n > 0` adds a condition after a pattern matches; the compiler does not use guards to prove exhaustiveness. A binding such as `name @ pattern` both checks a shape and keeps the matched value, which is useful when it must be used afterward.

For example, an event parser could destructure `Event::Retry { code, .. } if code >= 500` to retry only server errors, then handle other statuses in separate branches. Use `let-else` when an invalid case should exit early, but its `else` branch must end with `return`, `break`, `continue`, or a panic so the binding is guaranteed to exist afterward.

Common mistakes include using a pattern that can fail directly in `let`, using `_` too early and losing needed data, assuming a match guard proves that every value is covered, or putting a general branch before a specific one and making the latter unreachable. Choose `match` when the state space needs clear accounting, and use `if let` or `let-else` when they make the control flow simpler.
'''

[questions.rust-dv015]
prompt = "Why is `let Some(value) = maybe_value;` invalid when `maybe_value: Option<T>`?"
options = ["`Some(value)` is a refutable pattern and may not match", "`let` does not allow new bindings", "Option<T> can only be used in match", "value must be mutable"]
explanation = "An ordinary `let` requires an irrefutable pattern. Use `match`, `if let`, or `let-else` to handle the None case."

[questions.rust-dv016]
prompt = "In `Some(code) if code >= 500 => retry()`, what does the match guard do?"
options = ["It adds a condition after the pattern matches; the compiler does not treat a guard as proof of exhaustiveness", "It marks code as mutable", "It replaces every missing match branch", "It requires code to have type u32"]
explanation = "A guard further filters a matched pattern at runtime; the branches must still make the match exhaustive."

[questions.rust-dv017]
prompt = "What is required of the `else` branch in `let Some(value) = input else { ... }`?"
options = ["It must diverge, for example by returning or panicking", "It must assign a value to value", "It must return Option<T>", "It cannot contain an expression"]
explanation = "let-else guarantees that the binding exists after the statement, so a non-matching branch must end control flow."

[questions.rust-dv018]
prompt = "Select the correct statements about `match` and patterns."
options = ["Match branches must cover every possible value", "A general branch placed first can make a later specific branch unreachable", "A match guard always lets the compiler prove that an enum is fully covered", "`_` matches the remaining cases without binding their values"]
explanation = "The compiler checks pattern exhaustiveness but does not use guards to prove coverage, because a guard is evaluated at runtime."

[questions.rust-dv019]
prompt = "Where can patterns be used in Rust?"
options = ["Function parameters", "A `for` loop pattern", "`if let` / `while let`", "Only in `match`"]
explanation = "Patterns appear in many binding and control-flow constructs, not only in match."

[questions.rust-dv020]
prompt = "In a match, which pattern matches every value without creating a new binding? `{{blank}} => fallback()`"
explanation = "The wildcard pattern ignores a value and is often used for the remaining cases."

[questions.rust-dv021]
prompt = "Compare refutable and irrefutable patterns in a code review. Explain when to use match, if let, or let-else, and the role of exhaustiveness."
keywords = [["refutable", "may fail to match"], ["irrefutable", "always matches"], ["let-else", "let else"], ["if let"], ["exhaustive", "exhaustiveness", "all branches"], ["match guard", "guard"]]
model_answer = '''An irrefutable pattern always matches, so it works with an ordinary `let`; a refutable pattern can fail and needs `match` or `if let`. Use `let-else` to bind a value and exit early when the pattern does not match; its else branch must diverge. A match must be exhaustive so every state is handled, while a match guard adds a runtime condition and does not replace exhaustive branch coverage.'''
explanation = "A complete answer connects each pattern type to a control-flow construct and explains why the compiler requires exhaustive matches."

