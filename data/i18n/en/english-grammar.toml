prompt = "Select all sentences that maintain a formal register and appropriately cautious claims."
explanation = "Sentences 1 and 2 are measured and evidence-based; the others are informal or overstate certainty."

[questions.gr-c2-x032]
prompt = "Select all statements that make the scope clear without overgeneralising."
explanation = "The correct statements specify the sample or period; the others extend the claim beyond the data."

[questions.gr-c2-x033]
prompt = "Complete the substitution: The first build passed the tests, and the second {{blank}} too."
explanation = "Use the auxiliary *did* to substitute for the previously stated past verb phrase."

[questions.gr-c2-x034]
prompt = "Given incomplete evidence, write a modal phrase: The mismatch {{blank}} from a stale cache. (possibly / result)"
explanation = "*May have resulted* presents a possible past cause without claiming certainty."

[questions.gr-c2-x035]
prompt = "Complete the formal wording: The findings {{blank}} a reduction in repeat failures. (suggest / possibly)"
explanation = "*May suggest* reports the finding while keeping the claim cautious."

[questions.gr-c2-x036]
prompt = "Write two incident-report sentences: state a cautious finding from an initial sample and clearly limit the data scope."
explanation = "The model uses *suggests* instead of an absolute claim and limits the conclusion to the 40 sampled requests."

[questions.gr-c2-x037]
prompt = "Rewrite *The system is kind of slow and stuff* as a clearer report sentence with cautious wording and a specific scope."
explanation = "The model replaces vague language with a measurement, a cautious modal, and a defined scope."

[questions.gr-c2-x038]
prompt = "Write two sentences advising a team to revise an ambiguous sentence and explain why in a professional register."
explanation = "The model names the subject, recommends a revision, and explains the reason in a professional register."
