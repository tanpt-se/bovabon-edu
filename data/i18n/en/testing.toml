explanation = "Coverage is an execution measure, not proof of test quality or correctness."

[modules.testing-dv-network]
title = "Controlling Network Traffic in Tests"
description = "Mock requests at the right boundary, provide stable responses, and verify UI behavior for successful and failed API calls."
lesson = '''### Keep requests predictable
Tests that use a real network can be flaky because they depend on external services, changing data, quotas, and response times. Instead of waiting an arbitrary number of milliseconds, control responses at the HTTP boundary and synchronize with the request or UI state being checked.

| Need | Common approach | What is still tested |
|---|---|---|
| Unit test API client callers | Mock a module or dependency | The consumer's handling branches |
| Check requests through the app | MSW at the request boundary | Request construction, response parsing, and state updates |
| Browser E2E with fake responses | Playwright `page.route` or Cypress `cy.intercept` | UI flow for a controlled response |

For example, with Playwright: `await page.route('**/api/orders', (route) => route.fulfill({ status: 503, body: '{"message":"Unavailable"}' }));`. Register the route before navigation, then check the error message users see. With Cypress, `cy.intercept('GET', '/api/orders', { fixture: 'orders.json' }).as('orders')` can stub a response; omit the response handler to observe a request only. A Jest manual mock is useful when a unit test must replace an API module, but it does not verify real HTTP behavior.

### Common mistakes
- Calling `wait(2000)` instead of waiting for an alias, locator, or conditional assertion.
- Registering a route after the request was sent, or using a URL pattern that does not match the real path or query.
- Asserting only that a request was sent without checking success, error, loading, and empty UI states.
- Mocking every layer so tests pass even when the real URL, headers, or response conversion are wrong.
- Sharing a stateful handler between tests without resetting it.'''

[questions.testing-dv006]
prompt = '''In a `page.route` callback, which method sends a fake response for the request?
```js
await page.route('**/api/profile', (route) => route.{{blank}}({ status: 200, body: '{"name":"Sam"}' }));
```'''
explanation = "Playwright's `route.fulfill()` supplies a mocked response to the intercepted request."

[questions.testing-dv007]
prompt = "In Cypress, wait for an alias named `orders` with this command:\n```js\ncy.wait('@{{blank}}')\n```"
explanation = "The alias name is prefixed with `@` when passed to `cy.wait`."

[questions.testing-dv008]
prompt = "In an interview, explain how you choose between mocking an API client, mocking at the network boundary, and calling a real backend; include how to keep tests stable while still detecting integration defects."
keywords = [["network boundary", "request boundary"], ["deterministic response", "controlled response"], ["over-mocking", "mocking too deeply"], ["integration test", "integration testing"]]
model_answer = '''I use an API-client mock for consumer unit tests, and an MSW or network-boundary stub to run the request-building and response-parsing code against a deterministic response. I keep integration tests against a real backend for important contracts. Avoid over-mocking so URL construction, serialization, and real error handling are still checked.'''
explanation = "A strong answer describes test levels that trade speed for integration confidence and avoids mocking away the behavior under test."

[questions.testing-dvc01]
title = "Select a Response Stub for a Request"
prompt = '''Write `findStub(request, stubs)` to find the first response stub matching a request.
- `request` has `method` and `url`; each stub has `method`, `url`, `status`, and `body`.
- Compare methods case-insensitively, but require an exact URL match.
- Return a new object containing only `status` and `body` from the first matching stub; return `null` if none matches.
- Do not modify the request or stubs array.

Example: a `GET /api/items` request matches a `get /api/items` stub and returns `{ status: 200, body: [] }`.
'''
hints = ["Use `find` to preserve order and select only the first match.", "Create a new result object instead of returning all stub metadata."]
explanation = "Matching by method and URL selects the intended response while returning only the required fields."

[questions.testing-lv045]
