[modules.testing-principles]
title = "Testing Principles"
description = "The testing pyramid, AAA, and choosing the right test double."
lesson = '''### Choosing a test level
| Level | Scope | Characteristics |
|---|---|---|
| Unit | One function or small unit | Fast, with failures that are usually easy to isolate |
| Integration | Several collaborating components | Catches boundary issues involving a database, router, or component |
| E2E | A user flow through the application | Realistic, but slower and more effort to keep stable |

The testing pyramid is a guideline: write many small tests, enough integration tests, and a few critical E2E tests. It is not a fixed ratio for every product. Each test should be independent, deterministic, and check meaningful behavior.

### AAA and test doubles
AAA means **Arrange** (prepare data), **Act** (perform the action), and **Assert** (check the result). In this learning path, a stub returns predefined data, a mock records calls for interaction checks, a spy observes or wraps a real function, and a fake is a simple working implementation of a subsystem.

For example, a cart total test can use fixed data and assert the total; an email test can replace the email service with a mock at the side-effect boundary. Common mistakes include mocking every internal function, checking implementation details instead of outcomes, and sharing state so tests depend on execution order.'''

[questions.tst-001]
prompt = "What does a unit test usually focus on?"
options = ["A small unit with controlled dependencies", "An entire flow in a real browser", "Production page load time", "Deployment configuration for every environment"]
explanation = "A unit test targets a small unit to provide fast feedback and make failures easier to isolate."

[questions.tst-002]
prompt = "A project has many slow E2E tests that often fail because of selectors, while pure logic has no tests. What is the most reasonable adjustment?"
options = ["Add small tests for logic and integration tests at important boundaries; keep E2E tests for core user flows", "Convert every test to E2E to make it more like production", "Delete all tests because some are flaky", "Add a fixed wait to every test"]
explanation = "The testing pyramid suggests testing logic at faster levels and reserving E2E tests for high-value flows."

[questions.tst-003]
prompt = "In the AAA structure, what is the Act step?"
options = ["Creating data and initial conditions", "Calling the action or function under test", "Checking the expected result", "Removing all test files from the repository"]
explanation = "Act is the step that performs the behavior under test, usually a function call or an interaction."

[questions.tst-004]
prompt = "According to this learning path's convention, which test double is suitable when you need to check whether a function was called with the right arguments?"
options = ["Stub", "Mock", "Fake", "Fixture"]
explanation = "A mock records calls so a test can verify interactions. Terminology can vary across teams, so document the project's convention."

[questions.tst-005]
prompt = "Which traits make a unit test reliable and maintainable? Select all that apply."
options = ["It produces a deterministic result for the same input", "It checks behavior that matters to users or the function contract", "It depends on another test's execution order", "It keeps a narrow scope so failures are easy to locate"]
explanation = "Determinism, meaningful behavior, and a clear scope make tests stable. Order dependencies make a suite prone to random failures."

[questions.tst-006]
prompt = '''Complete the three AAA steps in order:

1. {{blank}}: prepare data and conditions.
2. {{blank}}: perform the action.
3. {{blank}}: verify the result.'''
explanation = "AAA stands for Arrange, Act, Assert."

[questions.tst-007]
prompt = "Explain when to use a unit test and when an integration test is needed; mention one limitation of replacing every dependency with a mock."
keywords = [["unit test", "unit testing"], ["integration test", "integration testing"], ["mock", "test double"]]
model_answer = '''A unit test is suitable for checking small pieces of logic quickly and in isolation. An integration test is needed to verify that components actually work together across a boundary. Mocking every dependency can miss integration defects and make tests depend on implementation details.'''
explanation = "A good answer distinguishes the purposes of unit and integration tests and recognizes that mocks cannot replace integration checks."

[questions.testing-lv018]
prompt = "A service called `OrderService` uses a repository for complex queries. Its tests stub each `findById`, `save`, and `update` call in order, and break whenever internal code is refactored. Which test double is a better fit?"
options = ["An in-memory fake repository with real read/write-by-id behavior, so the test can assert the resulting state", "A strict mock for every call using `toHaveBeenNthCalledWith`", "A spy on the development environment's real database", "No test double; connect directly to the production database"]
explanation = "A fake lets tests assert behavior through resulting state and is more resilient to refactoring. Strict call-by-call mocks cause the brittleness; a shared database also breaks test isolation."

[questions.testing-lv019]
prompt = "When is verifying an interaction with a mock (`toHaveBeenCalledWith`) preferable to asserting state?"
options = ["For an external side effect with no state to read back, such as sending email or publishing analytics", "To ensure a payment API is not called twice for the same order", "To check that the pure function `calculateTax` returns the right number", "To check the order of private functions inside the same module"]
explanation = "Mocks fit side-effect boundaries where the interaction itself is the behavior. Assert return values for pure functions; tracking private functions couples tests to implementation details."

[questions.testing-lv035]
prompt = "How does an integration test differ from a unit test?"
options = ["It checks multiple components working together across real boundaries", "It always runs in a real browser", "It never uses a test double", "It can only run in production"]
explanation = "An integration test checks collaboration between parts such as modules, routers, or databases; it may still mock selected external boundaries."

[questions.testing-lv036]
prompt = "Which are traits of a good test?"
options = ["It returns the same result on every run", "It runs independently of other tests", "Its name clearly describes the scenario and expected outcome", "It checks as many unrelated things as possible in one test"]
explanation = "Deterministic, independent tests with clear names are easier to read and debug. Combining unrelated checks makes failures harder to isolate."

[modules.testing-unit]
title = "Unit Testing with Vitest and Jest"
description = "Matchers, function and module mocks, fake timers, snapshots, and asynchronous checks."
lesson = '''### Assertions and dependency isolation
| Need | Common matcher or technique |
|---|---|
| Compare primitives | `toBe` usually checks value or identity |
| Compare structure | `toEqual` deeply compares fields |
| Check calls | A mock or spy with call-count or argument matchers |
| Control time | Fake timers replace real timers with a controllable clock |

Vitest and Jest have many similar APIs, but their configuration and module-mocking details are not identical. Module mocks help isolate boundaries such as external libraries or I/O; avoid mocking internal logic merely to make tests match today's structure.

Fake timers make timeouts, intervals, and simulated time controllable; restore the clock and mock state after each test. For asynchronous code, always return or await the Promise so the runner knows when the test is complete.

Snapshots store an output representation for later comparison. Keep snapshots small and stable, and review diffs before updating them. Large snapshots, random data, or bulk updates without reading diffs can hide regressions. Common mistakes include confusing `toBe` with deep equality, leaking mock state to the next test, and waiting with real sleeps that slow the suite.'''

[questions.tst-008]
prompt = "In Vitest/Jest, which matcher is usually appropriate for comparing two objects with different identities but the same nested structure?"
options = ["toBe", "toEqual", "toHaveBeenCalled", "toThrow"]
explanation = "`toEqual` checks deep structure; `toBe` is better for primitives or when identity must match."

[questions.tst-009]
prompt = "A function calls an external payment SDK. What is the most reasonable way to use a module mock?"
options = ["Mock the SDK at the boundary to verify the submitted data, and test business logic separately", "Mock every function in the business module", "Mock the test runner's matchers", "Replace every assertion with a snapshot"]
explanation = "Mocking at a side-effect boundary avoids dependence on an external service while keeping the test focused on the contract."

[questions.tst-010]
prompt = "What is the main benefit of testing a debounce function with fake timers?"
options = ["Advance the clock in a controlled way without waiting in real time", "Automatically prove that a UI is accessible", "Replace every assertion", "Measure production CPU speed accurately"]
explanation = "Fake timers let a test advance simulated time to verify when a callback runs without slowing the suite."

[questions.tst-011]
prompt = "When is a snapshot test most useful?"
options = ["When the output is relatively stable and its diff can be reviewed", "For all business logic without assertions", "When output contains unnormalized random timestamps", "As a replacement for browser accessibility checks"]
explanation = "Snapshots can reveal intended or unintended output changes, but their diffs need review and important semantics still need assertions."

[questions.tst-012]
prompt = "After using a mock function in a test, which practices help reduce interference between tests? Select all that apply."
options = ["Reset or clear mock state as appropriate", "Await Promises created by the test", "Run dependent tests in a fixed order", "Restore fake timers after use"]
explanation = "Cleaning mock state, finishing asynchronous work, and restoring timers help tests remain independent. Fixing execution order does not remove dependencies."

[questions.tst-013]
prompt = '''Fill in the matcher for deep object equality and the matcher that checks whether a function was called exactly twice:

```js
expect({ id: 4 }).{{blank}}({ id: 4 })
expect(callback).{{blank}}(2)
```'''
explanation = "`toEqual` checks object structure; `toHaveBeenCalledTimes` verifies the number of calls to a mock or spy."

[questions.tst-014]
prompt = "A test calls a function that returns a Promise, but the test finishes before the Promise settles. What is the most reliable fix?"
options = ["Return or await the Promise in the test", "Add an arbitrarily long sleep at the end of every test", "Remove the asynchronous assertion", "Convert the callback to a snapshot"]
explanation = "The runner must be notified when async work finishes; returning or awaiting the Promise lets it catch rejections at the right time."

[questions.tst-015]
title = "Create a Spy That Records Calls"
prompt = '''Write `createSpy(implementation)` to return a spy function:
- Each time it is called, append that call's argument list to `spy.calls`.
- If `implementation` is a function, call it with the received arguments and return its result; otherwise return `undefined`.
- `spy.calls` starts as an empty array and preserves call order.

Example: `const add = createSpy((a, b) => a + b)`; `add(2, 3)` returns `5` and `add.calls` is `[[2, 3]]`.
'''
hints = ["Initialize the calls array once when creating the spy.", "Record `args` before calling the implementation."]
explanation = "A spy records argument history and forwards calls to the implementation when one is provided."

[questions.tst-016]
title = "Mini Expect with Deep Equality"
prompt = '''Write `miniExpect(actual)` to return an object with a `toEqual(expected)` matcher.
- `toEqual` returns `undefined` when the values are deeply equal.
- Otherwise, throw an `Error`.
- Support primitives, `null`, arrays, and nested plain objects; compare objects by their key/value sets, regardless of key declaration order.
- Cyclic objects and special prototypes do not need to be handled.

Example: `miniExpect({ a: [1] }).toEqual({ a: [1] })` does not throw.
'''
hints = ["Compare primitives before iterating over keys.", "Distinguish arrays from ordinary objects."]
explanation = "Deep equality recursively compares keys and values; `Object.is` handles primitives, identical references, and cases such as NaN."

[questions.testing-lv020]
prompt = '''Why does this test still use the real module even though `vi.mock` is called?
```js
import { getUser } from './api'
test('x', async () => {
  const factory = () => ({ getUser: vi.fn() })
  if (process.env.CI) vi.mock('./api', factory)
  // ...
})
```'''
options = ["`vi.mock` is hoisted to the top of the file and must not be placed inside a condition or function; the factory also references a local variable in a way that does not work as expected", "`vi.mock` only works in `beforeAll`", "`vi.mock` can only mock packages in node_modules", "`vi.mock` must be called after the import to take effect"]
explanation = "Vitest hoists `vi.mock` ahead of imports, so the call belongs at top level and its factory must not depend on later local variables (use `vi.hoisted` if needed). A call inside an `if` or test does not work as intended."

[questions.testing-lv021]
prompt = '''This debounce test hangs or times out. What is the most likely reason?
```js
vi.useFakeTimers()
const p = debouncedSave('x')   // returns a Promise resolved after setTimeout 300ms
await p
vi.advanceTimersByTime(300)
```'''
options = ["`await p` waits for a Promise that resolves only when the timer runs, but the fake timer has not advanced; advance it first (or use `advanceTimersByTimeAsync`) and then await", "Fake timers do not support `setTimeout`", "Call `vi.useRealTimers()` before `await`", "`debouncedSave` must be mocked with `vi.fn()`"]
explanation = "With fake timers, time moves only when the test advances it. Awaiting before advancing creates a deadlock. The async timer advancement function also flushes microtasks between timers."

[questions.testing-lv022]
prompt = "A Vitest suite passes when each file runs alone but fails when the whole repository runs. Which causes are suspicious?"
options = ["Module-level state (cache or singleton) left behind by earlier tests", "Mocks or spies not restored between tests", "A test enabled fake timers but did not turn them off", "Using `toEqual` instead of `toStrictEqual`"]
explanation = "Leaked state between tests is a classic source of order-dependent failures. The difference between `toEqual` and `toStrictEqual` does not change merely because tests run together."

[questions.testing-lv037]
prompt = '''Which assertion correctly compares two objects with the same contents?
```js
expect({ a: 1 }).???({ a: 1 })
```'''
options = ["toEqual", "toBe", "toBeTruthy", "toContain"]
explanation = "`toBe` uses `Object.is` (including reference identity); `toEqual` recursively compares contents."

[questions.testing-lv038]
prompt = "Complete the assertion that checks whether a function throws an error:\n```js\nexpect(() => parse('')).{{blank}}('empty input')\n```"
explanation = "`toThrow` calls the function and checks that it throws (optionally matching the message)."

[questions.testing-lv039]
prompt = "Create a Vitest mock function that records calls:\n```js\nconst onSave = vi.{{blank}}()\n```"
explanation = "`vi.fn()` creates a mock function that records call count and arguments."

[questions.testing-lv040]
prompt = '''What is wrong with this test?
```js
test('loads user', () => {
  fetchUser(1).then(u => expect(u.name).toBe('An'))
})
```'''
options = ["The Promise is not returned or awaited, so the test finishes before the assertion runs", "`toBe` cannot be used with strings", "A `describe` block is required", "Tests cannot use `.then`"]
explanation = "The runner waits only when the test returns a Promise or is an async function that awaits it; otherwise the assertion may run after the test has passed."

[questions.testing-lvc03]
title = "Summarize Test Results"
prompt = '''Write `summarize(statuses)`, which accepts an array of strings `'passed' | 'failed' | 'skipped'` and returns `{ passed, failed, skipped }` with a count for each status.
For example, `summarize(['passed', 'failed', 'passed'])` → `{ passed: 2, failed: 1, skipped: 0 }`.
'''
hints = ["Initialize a count object with all three keys set to zero.", "Iterate over the array and increment the matching key."]
explanation = "A loop and a count object provide a simple way to summarize results, as a test runner reporter might."

[questions.testing-lv047]
prompt = "After each test, a mock function still has the previous test's call count, causing `toHaveBeenCalledTimes(1)` to fail. What is the simplest fix?"
options = ["Enable `clearMocks`/`restoreMocks` in config or call `vi.clearAllMocks()` in `afterEach`", "Create a separate test file for each assertion", "Change to `toHaveBeenCalled()`", "Use `test.only` for the failing test"]
explanation = "Clearing call history between tests keeps them independent. Loosening the assertion or splitting files only avoids the issue."

[questions.testing-lv048]
prompt = "Spy on `console.error` while keeping the original object, then silence its output:\n```js\nconst spy = vi.{{blank}}(console, 'error').mockImplementation(() => {})\n```"
explanation = "`vi.spyOn(obj, method)` wraps an existing method; `mockRestore()` restores the original function."

[modules.testing-components]
title = "Component and Hook Testing"
description = "Prioritize user behavior, query by role and name, and test hooks in an appropriate context."
lesson = '''### Test what users can observe
Component tests should interact with and verify meaningful content, state, or callbacks instead of depending on internal class names or implementation structure. With Testing Library, queries by role and accessible name usually express the intent well: for example, find a button named “Save” and activate it.

| Query method | Typical priority | Reason |
|---|---|---|
| Role and accessible name | High | Close to semantic HTML and assistive technology |
| Label or visible content | High | Tied to content users see |
| Test id | When needed | Less dependent on CSS, but does not verify semantics |
| Class or deep structural selector | Low | Easily breaks during UI refactoring |

Hooks are often tested through the component that uses them to verify a user flow. `renderHook` is useful for an independently reusable hook; state updates caused by interactions need to be synchronized with the renderer's `act` mechanism. Browser component tests can check real semantics more closely than tests that only simulate rendering.

Common mistakes include selecting nodes by internal class, calling a hook outside React context, and asserting private state without checking visible results. Role/name queries are part of accessible querying; the actual accessible name follows the platform's accessibility rules.'''

[questions.tst-017]
prompt = "In a component test, why should you prefer querying for a button by role and accessible name?"
options = ["It checks semantics close to how users and assistive technologies find controls", "It is always faster than every other query", "It removes the need to assert the result of an interaction", "It verifies all server logic automatically"]
explanation = "Role and accessible-name queries reflect semantics users can access and depend less on internal CSS classes."

[questions.tst-018]
prompt = "A custom hook manages form state. Which approach usually produces the most resilient test?"
options = ["Test the component using the hook through input, displayed errors, and submission; use `renderHook` when testing the hook independently", "Read every private variable in its closure", "Snapshot only the hook's source code", "Call the hook directly in a test without a renderer"]
explanation = "Testing through a component often reflects user behavior; `renderHook` fits when reusable logic must be isolated."

[questions.tst-019]
prompt = "Which choices usually make component tests less dependent on implementation? Select all that apply."
options = ["Find controls by role and accessible name", "Assert content or state visible to users", "Rely on generated CSS classes", "Simulate interactions that match the user flow"]
explanation = "Role/name, visible outcomes, and realistic interactions keep tests focused on the component's contract."

[questions.tst-020]
prompt = '''Fill in both parts to query a button by semantic role and displayed name in Testing Library:

```js
screen.{{blank}}('button', { {{blank}}: 'Save' })
```'''
explanation = "`getByRole` accepts a role and a `name` option to match the accessible name."

[questions.tst-021]
prompt = "Explain why queries by role/name are usually more resilient than queries by internal class, and give one reasonable situation for using a test id."
keywords = [["getByRole", "role"], ["accessible name", "accessible label"], ["test id", "data-testid"]]
model_answer = '''A `getByRole` query with an accessible name reflects semantics users can perceive and is less coupled to implementation details such as CSS classes. A test id can be used when no suitable stable semantic query exists, but a test id alone does not prove that the control has good semantics.'''
explanation = "A good answer connects role/name queries to semantics and describes test ids as a deliberate fallback."

[questions.tst-022]
title = "Find a Node by Role and Name"
prompt = '''Write `getByRole(tree, role, name)` to find exactly one node in a simulated tree. Each node is an object that may have `role`, `name`, `ariaLabel`, `text`, and `children` (an array of child nodes).
- Traverse depth-first from the root node.
- In this model, the accessible name is `ariaLabel` if it is a string; otherwise use `name`, then `text`. If none is a string, use an empty string.
- The role and name must match exactly.
- Return the node object if exactly one match exists; throw an `Error` if there are no matches or more than one.
- `tree` may be missing or null; in that case no match exists.

This is a simplified model; you do not need to implement the browser's full accessible-name computation rules.
'''
hints = ["Collect matching nodes instead of returning the first one immediately.", "Traverse `children` only when it is an array."]
explanation = "A get-by-style query must detect both missing and ambiguous matches; this model intentionally supports only the described object tree."

[questions.testing-lv023]
prompt = '''A component test sometimes fails with a warning about a state update after the test ends. The component fetches data in an effect and then sets state. What is the right underlying fix?'''
options = ["Wait for the final user-visible state (for example, use a retrying query for the result text) and mock the network with a deterministic response", "Disable the console warning", "Add `setTimeout(1000)` before the test ends", "Move fetch outside the effect so the test cannot see it"]
explanation = "The warning means the test finished before async work completed; wait for the observable state and control the network to keep the test deterministic. Disabling the warning or sleeping only hides the race."

[questions.testing-lv024]
prompt = "Which element-selection strategies help component/E2E tests remain resilient to UI changes while reflecting user experience?"
options = ["A locator by role and accessible name", "A locator by a form field's label", "A `data-testid` for an element without clear semantics", "A CSS selector based on an auto-generated CSS-in-JS class"]
explanation = "Role and label queries are resilient and check accessibility; a test id is a deliberate fallback. Generated classes can change after builds or refactors."

[questions.testing-lv041]
prompt = "When testing a component, how should you find the “Save” button?"
options = ["By role `button` and the name “Save”", "By CSS class `.btn-primary-23x`", "By its position as the third DOM node", "By the button's background color"]
explanation = "Role and accessible name match how users and assistive technologies identify elements and remain stable across styling changes."

[questions.testing-lv049]
prompt = "What should a registration form test check from the user's perspective?"
options = ["An error appears for an invalid email format", "The submit button is disabled while submitting", "The API receives the correct data after a valid submission", "The internal `useState` value after every keystroke"]
explanation = "Observable behavior (messages, button state, and submitted request) matters to users; internal state is an implementation detail."

[modules.testing-e2e]
title = "E2E Testing with Playwright and Cypress"
description = "Locators, auto-waiting, web-first assertions, fixtures, traces, and Cypress retry behavior."
lesson = '''### Locators and waiting for conditions
A Playwright locator describes how to find an element and is evaluated again when used; actions such as clicking automatically wait for actionable conditions. A web-first assertion such as `toBeVisible()` retries within a timeout while waiting for the expected state. Avoid fixed sleeps: they slow tests without guaranteeing that the page is ready.

| Tool | Pattern | Remember |
|---|---|---|
| Playwright | `getByRole('button', { name: 'Save' })` | Prefer semantics; web-first assertions retry |
| Cypress | `cy.get(...).should(...)` | The command chain and assertions retry appropriately |
| Fixture | Create context or test data | Choose scope to avoid unintended shared state |
| Trace | Review timeline, screenshots, and action details | Helps investigate hard-to-reproduce CI failures |

Playwright fixtures provide controlled setup by scope and manage lifecycle. Trace Viewer replays actions and context around a failure; tracing every run can increase storage costs.

Common mistakes include keeping an old element handle after the DOM changes, using deep structural selectors, asserting immediately instead of using web-first assertions, and using `waitForTimeout` to hide a race condition. Cypress also retries queries and assertions through its command chain; this does not mean arbitrary Promises or side effects retry automatically.'''

[questions.tst-027]
prompt = '''In Cypress, which command is commonly used to retry an assertion about query state until it passes or times out?

```js
cy.get('[role="status"]').{{blank}}('be.visible')
```'''
explanation = "Cypress `.should()` retries the assertion in the command chain until it passes or reaches the timeout."

[questions.tst-028]
title = "waitFor with a Timeout"
prompt = '''Write `waitFor(check, options)` to return a Promise:
- Call `check` immediately and then every `interval` milliseconds.
- If `check` returns a truthy value, resolve with that value.
- If `check` returns a falsy value or throws, retry.
- If `timeout` milliseconds elapse without success, reject with an `Error` whose message is `Timed out`.
- Defaults: `timeout` is 1000 and `interval` is 50. Assume valid numeric values, `timeout >= 0`, and `interval > 0`.

Example: `waitFor(() => ready, { timeout: 100, interval: 10 })` resolves when `ready` becomes truthy at or before the final check.
'''
hints = ["Use `Date.now()` to calculate the remaining timeout.", "Call `check` before scheduling the first timer."]
explanation = "Checking immediately avoids unnecessary delay; limiting retries by elapsed time prevents waiting forever."

[questions.testing-lv042]
prompt = "Open the home page in a Playwright test:\n```js\nawait page.{{blank}}('/')\n```"
explanation = "`page.goto()` navigates the page to the specified URL."

[questions.testing-lv051]
prompt = "Save a trace only when a test is retried for the first time (to debug CI failures without wasting storage):\n```js\nuse: { trace: '{{blank}}' }\n```"
explanation = "Playwright's `on-first-retry` mode records a trace on the first retry."

[modules.testing-strategy]
title = "Testing Strategy and Reliability"
description = "Coverage, flaky tests, CI, and the TDD feedback loop."
lesson = '''### Coverage and flaky tests
Line coverage is the percentage of executable lines that ran among all executable lines in the report: `covered lines / total lines × 100%`. It shows what was executed, not whether assertions would catch a defect; high coverage can coexist with weak tests or missing important branches.

A flaky test produces inconsistent results across runs even though code and expected conditions have not changed. Common causes include race conditions, shared data, order dependencies, real clocks, networks, or differences in CI environments. Save logs and traces, isolate the test, and find the nondeterministic condition. Retries can help detect or classify intermittent failures, but do not replace fixing the cause.

| Practice | Goal |
|---|---|
| Run tests independently with separate data | Reduce interference |
| Wait for conditions instead of sleeping | Reduce races and wasted waiting |
| Run the suite in stable CI | Catch regressions under consistent conditions |
| TDD: Red → Green → Refactor | Define behavior with a test before completing implementation |

Common mistakes include setting a high coverage target and optimizing the number rather than risk, retrying indefinitely to make CI green, and running tests only on a developer's machine. Good CI also needs fast feedback and clear failure reporting.'''

[questions.tst-033]
prompt = "If 18 of 24 executable lines ran, line coverage is {{blank}} percent.\n"
explanation = "Line coverage is covered lines divided by total executable lines, multiplied by 100."

[questions.tst-034]
prompt = "A test passes alone but randomly fails in the suite because it shares a mutable variable. It is likely {{blank}}.\n"
explanation = "Flaky tests can change results between runs because of shared mutable state or other nondeterministic conditions."

[questions.tst-035]
title = "Detect Flaky Tests from History"
prompt = '''Write `findFlakyTests(history)`, which accepts an array of `{ id, runs }` objects, where `runs` is an array of status strings: `pass`, `fail`, or `skip`.
- Return the list of `id` values in input order.
- A test is flaky if its history contains at least one `pass` and at least one `fail`.
- Tests that always pass, always fail, are only skipped, or have no runs are not flaky.
- Each input entry represents a unique test.
'''
hints = ["Keep tests with both `pass` and `fail` states.", "Map the filtered results to ids to preserve input order."]
explanation = "A test is flaky when the same test has both passing and failing runs."

[questions.tst-036]
title = "Calculate Line Coverage"
prompt = '''Write `lineCoverage(totalLines, coveredLines)` to return line coverage as a percentage from 0 to 100.
- Inputs are non-negative integers, with `coveredLines <= totalLines`.
- If `totalLines` is zero, return 0.
- Round the result to two decimal places.

Examples: `lineCoverage(8, 6)` returns `75`; `lineCoverage(3, 2)` returns `66.67`.
'''
hints = ["Divide covered lines by total lines and multiply by 100.", "Multiply by 100 before `Math.round` to round the percentage to two decimal places."]
explanation = "Coverage is the ratio of covered executable lines to all executable lines, expressed as a percentage."

[questions.testing-lvc02]
title = "Classify Flaky Tests from Run History"
prompt = '''CI runs the same commit multiple times. Write `classifyRuns(runs)` where `runs` is an array of `{ test, passed }` objects:
- A test with both passing and failing runs is `flaky`; only failing runs is `failing`; only passing runs is `passing`.
- Return `{ flaky, failing, passing }`. Each array contains unique test names in ascending order.
- For an empty `runs` array, return three empty arrays.

Example: `classifyRuns([{test:'a',passed:true},{test:'a',passed:false},{test:'b',passed:true}])` → `{ flaky: ['a'], failing: [], passing: ['b'] }`.
'''
hints = ["Group by test name and record whether it has passed or failed.", "Sort names before classification to produce ordered results."]
explanation = "Grouping repeated runs makes intermittent behavior distinguishable from consistently passing or failing tests."

[questions.testing-lv044]
prompt = "A pull request passes locally but fails intermittently in CI. Which investigation is most useful first?"
options = ["Inspect CI logs and traces, then rerun with the same concurrency and environment to identify nondeterministic state", "Increase every timeout and retry count", "Disable the failing test", "Assume the CI result is unrelated to the code"]
explanation = "Reproducing the CI conditions and inspecting evidence helps reveal races, environment differences, and shared state."

[questions.testing-lv052]
prompt = "What does line coverage tell you, and what does it not prove?"
