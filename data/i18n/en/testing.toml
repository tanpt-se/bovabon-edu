explanation = "`cy.intercept()` can intercept a request and provide a fixture response."

[modules.testing-dv-state]
title = "Fixtures, Data, and Authentication State"
description = "Manage fixture lifecycles, repeatable data, and login state without creating dependencies between tests."
lesson = '''### Separate data, setup, and login state
A fixture provides resources or data to a test with a defined lifecycle. Playwright fixtures can be scoped to a test or worker; built-in fixtures such as `page` are prepared before a test and closed afterward. Cypress `cy.fixture` reads static data from a file, while `cy.session` saves and restores cookies and web storage by session key. These solve different needs: input data is not the same as an authenticated session.

| Need | Mechanism | Boundary to remember |
|---|---|---|
| Mostly static sample data | Playwright fixture or Cypress `cy.fixture` | Do not mutate objects shared between tests |
| Fast E2E login | Playwright `storageState` or Cypress `cy.session` | Keys should distinguish user, role, or tenant; create state reliably |
| Shared matcher or setup | Vitest/Jest setup file | Runs before a test file; it is not per-test data storage |
| Resource that must close | Fixture with teardown | Clean up after the test or worker according to scope |

For example, Playwright can use `use: { storageState: 'playwright/.auth/member.json' }` so a test starts logged in. Tests should still create their own order or use repeatable seed data, because sharing a session does not isolate backend data. In Jest, `setupFiles` runs before the test framework is installed; `setupFilesAfterEnv` runs after, making it suitable for shared matchers or hooks.

### Common mistakes
- Reusing a mutable fixture across tests and depending on execution order.
- Sharing a user or tenant so parallel tests compete over records.
- Caching a session under a key that omits role or tenant and accidentally reusing another user's state.
- Seeding per-test data in global setup without a cleanup or recreation strategy.
- Treating `setupFiles` as one-time setup for the entire suite; setup is usually associated with each test file.'''

[questions.testing-dv014]
prompt = "In Playwright, which option takes the path to saved state so a context starts logged in?\n```js\ntest.use({ {{blank}}: 'playwright/.auth/member.json' });\n```"
explanation = "The `storageState` option initializes a context from saved cookies and web storage."

[questions.testing-dv015]
prompt = "Which Cypress command caches and restores a browser session by an id?\n```js\ncy.{{blank}}('member', setupLogin);\n```"
explanation = "`cy.session()` caches and restores session data for the provided key."

[questions.testing-dv016]
prompt = "In an interview, describe how you design fixtures and login state for parallel E2E runs; explain how you prevent tests from sharing mutable data."
keywords = [["test-scoped fixture", "fixture scope"], ["storage state", "authentication state"], ["test isolation", "state isolation"], ["teardown", "cleanup"]]
model_answer = '''I use test-scoped fixtures for isolated resources, create storage state for the required user or role, and keep tests isolated with records unique to each test or worker. Baseline fixture data should be immutable; teardown or cleanup removes resources created by each test so parallel runs do not conflict.'''
explanation = "A good answer covers scope, authentication state, isolated records, and cleanup."

[questions.testing-dvc02]
title = "Merge Fixture Data Without Mutation"
prompt = '''Write `mergeTestData(defaults, overrides)` to create a fixture object for one test.
- Shallow-copy the properties of two plain objects.
- Values in `overrides` replace properties with the same name in `defaults`.
- Return a new object and do not mutate either input.
- Nested objects do not need to be cloned.

Example: `mergeTestData({ role: 'member', active: true }, { role: 'admin' })` returns `{ role: 'admin', active: true }`.
'''
hints = ["Spread the objects in order: defaults first, overrides second.", "Create a new object literal so neither input is changed."]
explanation = "A shallow merge with overrides applied last creates a new fixture without mutating the defaults."

[questions.testing-lv033]
prompt = "Interview question: describe how you diagnose and fix a flaky test caused by data shared between parallel tests. Explain how you find the cause, fix it, and prevent it from recurring."
keywords = [["parallel", "worker"], ["separate data", "isolation", "isolated", "independent"], ["fixture", "seed"], ["trace", "log", "rerun", "repeat"]]
model_answer = '''I inspect the failed run's trace and logs, then rerun the test with the same worker count as CI. If it fails only in parallel, I look for shared data such as the same account or record. I fix it by having each test create unique data through a fixture or API seed, namespaced by worker when appropriate, and clean it up afterward. To prevent recurrence, I add an isolation check to review guidance and run tests with randomized order periodically.'''
explanation = "A strong answer uses evidence to reproduce the problem, isolates test data, and adds a prevention step."

[questions.testing-lv046]
prompt = "Parallel E2E tests overwrite each other's records in a shared account. What is the most direct fix?"
options = ["Give each test or worker isolated data and clean up its own records", "Add a fixed sleep between tests", "Increase every timeout", "Disable assertions on shared records"]
explanation = "Independent data removes conflicts and supports parallel execution; sleeps and longer timeouts do not isolate state."

[questions.testing-lv054]
prompt = "Which practices help keep test data isolated and repeatable? Select all that apply."
options = ["Create unique records for each test or worker", "Use immutable baseline fixtures", "Clean up resources created by the test", "Reuse one mutable account for every parallel test"]
explanation = "Unique records, immutable baselines, and cleanup support repeatability. A shared mutable account causes interference."

[modules.testing-dv-projects]
title = "Project Matrices and Runtime Environments"
description = "Organize multiple test configurations to cover browsers, runtimes, or packages with deliberate choices."
lesson = '''### One suite, multiple intentional projects
A project groups a run configuration under a name with its own options. Projects are useful when the same tests need to run across browsers, runtimes, packages, or configuration sets. A project matrix makes the tested combinations explicit and lets developers select a subset; each project may also need appropriate setup and data.

| Tool | Organization | Useful for |
|---|---|---|
| Vitest | `test.projects` with child configurations | Monorepos or multiple environments |
| Jest | `projects` in configuration | Multiple packages or suites in one run |
| Playwright | `projects` with separate `name` and `use` | Running tests on browsers/devices or configurations |
| Cypress | Project configuration and Node event hooks | Custom lifecycle, tasks, or runner settings |

For example, Playwright can define `chromium` and `firefox` projects, each with its own browser option but shared specs; select one project while debugging and run the required matrix in CI. Jest's `testEnvironment` or Vitest's `environment` determines runtime APIs such as `window`, so a test that needs a DOM cannot be assumed to run as a plain Node test. Environment is one configuration dimension; a project packages several dimensions into a named run.

### Common mistakes
- Creating every browser × locale × role combination without added value, making CI slow and failures harder to locate.
- Assuming that declaring multiple projects proves every browser ran; inspect the actual CI command and filters.
- Running DOM tests in a Node environment and mistaking missing globals for an application defect.
- Sharing mutable test data or accounts across parallel projects.
- Letting project configurations drift in timeouts, setup, or base URL without knowing whether the differences are intentional.'''

[questions.testing-dv022]
prompt = "Which Playwright command-line option selects only the project named `chromium`?\n```sh\nnpx playwright test --project={{blank}}\n```"
explanation = "The `--project` option limits a run to the named project in the configuration."

[questions.testing-dv023]
prompt = "In Vitest configuration, which property accepts a list of child project configurations?\n```js\ntest: { {{blank}}: [/* project configs */] }\n```"
explanation = "`test.projects` groups project configurations that Vitest runs."

[questions.testing-dv024]
prompt = "In an interview, describe how you choose a project matrix for CI, balancing browser/runtime coverage with execution time and failure investigation."
keywords = [["project matrix", "configuration matrix", "matrix"], ["runtime cost", "execution time", "CI duration"], ["targeted subset", "smoke suite", "focused smoke"], ["browser coverage", "environment coverage", "coverage matrix"]]
model_answer = '''I build the project matrix around browser coverage and environments with real risk instead of multiplying every combination by default. CI can run a targeted subset or fast smoke suite on each commit and a wider matrix on a schedule. I track CI duration and report the specific project to make failures easier to investigate.'''
explanation = "A good answer states matrix criteria, controls CI time, and describes subset or scheduled runs."

[questions.testing-dvc03]
title = "Build an Ordered Project Matrix"
prompt = '''Write `buildProjectMatrix(browsers, locales)` to create configurations for every browser-locale pair.
- Each item has the shape `{ name, browser, locale }`, with `name` equal to `browser + '-' + locale`.
- Iterate browsers in input order and, within each browser, locales in input order.
- If either input is empty, return an empty array.
- Do not modify the input arrays.

For example, `buildProjectMatrix(['chromium'], ['en', 'vi'])` returns projects `chromium-en` and `chromium-vi`.
'''
hints = ["Use nested loops to preserve browser-first order.", "Create a new result array; do not push into the inputs."]
explanation = "An ordered matrix makes runs consistent and clarifies how many combinations the suite covers."

[questions.testing-lv034]
prompt = "Playwright has a `setup` project that logs in and saves storage state, which browser projects reuse. Which configuration ensures `setup` always runs first?"
options = ["Declare `dependencies: ['setup']` for the browser projects", "Putting `setup` first in the `projects` array is sufficient", "Log in in every test's `beforeEach`", "Set the entire suite to serial with `test.describe.configure({ mode: 'serial' })`"]
explanation = "Project dependencies explicitly define ordering and report the setup step. Array order does not guarantee run order; logging in for each test is slower, and serializing the suite removes parallelism."

[modules.testing-lead]
title = "The Tech Lead Perspective"
description = "Team testing strategy: pyramid/trophy, CI quality gates, E2E flow selection, environments and data, flaky-test policy, and pipeline time."
lesson = '''### A lead asks “where should we invest in tests?”
At team scale, tests are an investment with costs (writing time, CI time, and flaky-test maintenance) and benefits (early defect detection, safer refactoring, and faster releases). Good decisions are tied to product risk: protect the flows that would cost money, data, or users most heavily if they failed.

### Decision framework: choose the shape of the suite
| Criterion | Pyramid (more unit) | Trophy (more integration) | Many E2E tests |
|---|---|---|---|
| Fits | Complex domain logic, libraries, backend | API-driven frontend, UI joining components | Rarely the primary choice |
| Feedback speed | Very fast | Fast to moderate | Slow |
| Refactoring confidence | Fragile if tests inspect implementation details | Strong when tests check behavior | Strong, but costly to stabilize |
| Maintenance cost | Low for pure functions | Moderate | High (selectors, data, environment) |

There is no right ratio for every team; the shape should reflect where defects actually occur. Review recent postmortems and bug reports to learn that.

### CI quality gates (initial estimates; measure for your project)
- **On pull requests (target ≤ 10–15 minutes):** lint, type check, unit and integration tests, smoke E2E for 3–5 critical flows, with sharding.
- **On the merge queue or nightly:** full E2E, cross-browser matrix, visual and accessibility checks.
- **Coverage:** gate on *diff coverage* (new or changed lines) and set separate thresholds for critical modules; avoid a high global target that encourages tests without meaningful assertions.
- **Required checks must be deterministic:** a flaky required check teaches teams to rerun instead of investigate.

### E2E strategy
1. Select flows by impact × frequency × defect history (login, payment, signup, etc.); do not automate every UI variation.
2. Use preview or ephemeral environments per pull request when possible; replace third-party services such as payment and email with a sandbox or a mock at the network boundary.
3. Have each test create its own data through an API or seed process; avoid shared accounts and clean up or use a dedicated tenant.
4. Save traces or videos on retry or failure so a defect can be investigated without rerunning it.

### Test review checklist
- Does the test check user-visible behavior or a contract instead of internal details?
- Does it avoid fixed sleeps and timeouts in favor of retrying assertions or fake timers?
- Is its data isolated so any order and parallel execution work?
- Does its name describe the scenario and expected result?
- Are mocks at boundaries (network, clock, randomness), rather than spread through internal modules?

### Short sample ADR
**Context:** the pull-request pipeline takes 42 minutes and E2E flakiness is about 6% (estimated from 30 days of CI). **Decision:** run unit/integration tests and sharded smoke E2E on four runners for pull requests; run full E2E on the merge queue; quarantine flaky tests with an owner and a five-business-day repair deadline. **Consequences:** pull-request feedback is faster; some defects are detected only in the merge queue, requiring same-day ownership.

### Team-scale anti-patterns
- Retrying every test three times by default to make CI green, hiding real race conditions.
- Using 90% global coverage as an individual KPI, producing empty tests and huge snapshots.
- Sharing one staging environment across teams running E2E in parallel.
- Leaving flaky tests without owners so the quarantine list only grows.'''

[questions.testing-lv001]
prompt = "A six-developer team has a 40-minute pull-request pipeline because all 600 E2E tests run sequentially; developers are combining larger pull requests to avoid waiting. CI can add at most four runners. What is the most reasonable plan?"
options = ["Run unit/integration tests plus smoke E2E for critical flows on pull requests, shard across four runners, and run full E2E on the merge queue or nightly", "Remove E2E from CI and test manually only before releases", "Keep the pipeline unchanged and ask developers to wait or make smaller pull requests", "Run full E2E on four runners for every commit, including documentation-only changes"]
explanation = "Separating test tiers gives fast pull-request feedback while preserving a full safety net before merge. Removing E2E loses regression coverage; keeping the current setup does not address the cause; running the full suite on every commit consumes all runners and remains slow."

[questions.testing-lv002]
prompt = "An E2E suite is about 8% flaky, and the team enabled `retries: 3` for every test and environment. A real race-condition bug reached production while CI was green. What policy is most reasonable?"
options = ["Keep retries low only in CI, track tests marked flaky, and quarantine them with an owner and repair deadline; critical-flow tests must not remain quarantined past that deadline", "Increase retries to five to make CI more stable", "Delete every test that has failed at least once", "Turn off E2E CI until the entire suite is rewritten"]
explanation = "Retries are a way to collect signal, not hide failures. Quarantine with an owner and deadline keeps CI useful without letting flaky tests accumulate. More retries hide races; deleting or disabling tests removes the safety net."

[questions.testing-lv003]
prompt = "Leadership wants a global 90% coverage KPI for a repository currently at 55%, with a one-quarter deadline. The team is concerned it will write tests only to raise the number. What proposal is most reasonable?"
options = ["Gate diff coverage for new or changed code, set separate thresholds for critical modules such as payments and authorization, and report coverage trends instead of a single hard target", "Agree to 90% and allow every hard-to-test file to be excluded", "Reject all coverage metrics because coverage is meaningless", "Set 90% but measure only statement coverage to make it easier"]
explanation = "Diff coverage prevents new debt without requiring a large backlog of tests; module thresholds focus on risk. Arbitrary exclusions and easy metrics game the numbers, while abandoning metrics loses a useful signal."

[questions.testing-lv004]
prompt = "E2E tests run on one staging environment shared by four teams; data is overwritten by other teams, and the payment sandbox sometimes takes 30 seconds. Infrastructure can create a preview environment per pull request. What should the team do?"
options = ["Run smoke E2E in a per-pull-request preview environment with seeded data and mock or sandbox payment at the network boundary; keep a few real sandbox tests on a schedule", "Run E2E directly in production with test accounts", "Keep shared staging and raise the entire suite timeout to two minutes", "Drop payment-flow tests because they depend on a third party"]
explanation = "An isolated environment and seeded data remove cross-team interference; boundary mocks make tests deterministic while scheduled sandbox tests still check real integration. Production is risky, longer timeouts only slow tests, and dropping payment leaves the highest-risk flow untested."

[questions.testing-lv005]
prompt = "The team has time to automate about 15 E2E flows this quarter. Which criteria should it use to choose them?"
options = ["Business impact if the flow fails (revenue, data, or legal impact)", "How often users take the flow", "The area's history of regressions and bugs", "Every button color and marketing-page breakpoint"]
explanation = "Prioritize risk as impact × likelihood; bug history provides evidence about likelihood. Small visual variations fit component or visual tests better than expensive E2E tests."

[questions.testing-lv006]
prompt = "Four teams own four services; each month there are two or three incidents because one team's API response change breaks a consumer. A shared integrated E2E environment is slow and difficult to provision. What is the best investment?"
options = ["Consumer-driven contract tests: consumers publish expectations and providers verify them in CI before deployment", "Build a larger integrated E2E environment and run all four teams' tests there", "Ban API changes for six months", "Require each team to read every other team's changelog weekly"]
explanation = "Contract tests catch boundary defects in the provider pipeline quickly without provisioning the whole system. A larger environment is costly and slow; bans and manual processes do not scale."

[questions.testing-lv007]
prompt = "A React app mostly displays API data and has little pure logic; postmortems show defects usually occur where components integrate with APIs and routing. The team has 800 unit tests mocking each hook. How should it shift investment?"
options = ["Increase page/feature-level integration tests with network mocks, reduce detailed internal unit mocks, and keep E2E for a few critical flows", "Add unit tests for every hook to reach 100% coverage", "Move everything to E2E because it is most realistic", "Keep the suite unchanged because the pyramid is always right"]
explanation = "The test-suite shape should follow where defects occur. For a UI/API-heavy app, integration tests can provide the best confidence-to-cost ratio. Extensive unit mocks break during refactoring, all-E2E is too slow, and no one shape is always right."

[questions.testing-lv008]
prompt = "You must refactor a 3,000-line pricing module with no tests in two weeks; it drives the core revenue. What is the most reasonable first step?"
options = ["Write characterization tests at the module boundary for actual inputs and outputs, including odd existing behavior, then refactor in small steps", "Rewrite the module from scratch using the new design and test afterward", "Finish refactoring and ask QA to test everything manually", "Write unit tests for every private function before changing anything"]
explanation = "Characterization tests lock in current behavior so unintended changes are visible. A complete rewrite is risky under a short deadline; manual tests are not repeatable, and private-function tests break during refactoring."

[questions.testing-lv009]
prompt = "Which checks are suitable as required pull-request checks that block a merge?"
options = ["Type checking and lint", "Deterministic unit/integration tests", "Stable smoke E2E for critical flows", "A full cross-browser E2E suite with a 10% flaky rate"]
explanation = "Required checks must be fast and deterministic. Flaky checks teach teams to rerun and reduce trust in CI. Broad or flaky suites can run on a merge queue or nightly as informational checks until stable."

[questions.testing-lv010]
prompt = "You decide to split a Playwright suite across four CI machines. What command should the second machine run?\n```sh\nnpx playwright test --{{blank}}=2/4\n```"
explanation = "`--shard=x/y` splits tests into `y` parts and runs part `x`; a CI matrix can use this to shorten the pipeline."

[questions.testing-lv011]
prompt = "To run only Jest tests related to files changed since the `main` branch on a pull request (while still running the full suite on merge), which flag should you use?\n```sh\nnpx jest --{{blank}}=main\n```"
explanation = "`--changedSince` selects tests related to changes since a ref; keep a full run later because dependency analysis may not catch every relationship."

[questions.testing-lv012]
prompt = "You are writing a team test-review checklist. Which items should it include?"
options = ["Tests check observable behavior, not internal implementation details", "Do not use fixed sleeps or timeouts to wait for UI", "Test data is isolated so parallel runs and any order work", "Every pull request must increase the total test count by at least ten"]
explanation = "The first three practices directly reduce flakiness and maintenance cost. A test-count quota encourages meaningless tests instead of valuable coverage."

[questions.testing-lv013]
prompt = "A repository has 300 large snapshots of entire-page HTML; developers often bulk-update them with `-u` without reading the diff, and an obvious pricing defect recently slipped through. What policy is most reasonable?"
options = ["Replace large snapshots with focused assertions for important data; keep only small, stable snapshots and require review of snapshot diffs in pull requests", "Ban snapshots in all cases", "Keep the current snapshots but automatically run `-u` in CI", "Add more snapshots to cover more pages"]
explanation = "Snapshots have value only when diffs are small and reviewed. A total ban also removes useful cases such as serializers or small outputs; auto-updating in CI makes them meaningless."

[questions.testing-lv014]
prompt = "A 200-test E2E suite shares one admin account; with eight parallel workers, tests randomly fail because their data interferes. What is a reasonable fix at moderate cost?"
options = ["Have each test/worker create data through an API fixture, use role-specific authentication storage state, and clean up by prefix or isolated tenant", "Permanently run one worker sequentially", "Add sleeps between tests to reduce collisions", "Reset the whole database before every test through the UI"]
explanation = "Independent data enables parallelism, and API fixtures are cheaper than UI setup. Serial runs lose speed; sleeps do not remove races; resetting through the UI is slow and can still conflict in parallel."

[questions.testing-lv015]
prompt = "It is Friday afternoon and a release is scheduled. Two nightly E2E tests fail: one in the payment flow due to a defect introduced by yesterday's commit, and one on the FAQ page with a flaky-test ticket from last week. What is the most reasonable decision?"
options = ["Block release until the payment failure is investigated (revert if needed); an FAQ test already quarantined with an owner does not block", "Release because two tests are only one percent of the suite", "Block release until both tests pass, including the known flaky FAQ test", "Disable both tests to release on time"]
explanation = "Risk should drive the decision: a new failure in a revenue flow blocks release; a known flaky failure on a low-risk page follows the quarantine policy. Percent of suite does not represent risk, and disabling tests hides issues."

[questions.testing-lv016]
prompt = "Write a short ADR to reduce a pull-request pipeline from 45 minutes to under 15 minutes for a team of eight without increasing production escapes. Include context, alternatives considered, decision, and consequences."
keywords = [["shard", "parallel", "parallelize"], ["smoke"], ["merge queue", "nightly"], ["flaky", "quarantine"], ["measure", "metric", "metrics", "track"]]
model_answer = '''Context: pull-request CI takes 45 minutes, developers batch large pull requests, and flakiness is about 5%. Alternatives: add runners only (costly and does not fix flakiness), run only tests related to changed files (fast but may miss failures), or split the suite into tiers. Decision: run lint, type checks, unit/integration, and smoke E2E for five critical flows on four parallel shards for pull requests; run full E2E and cross-browser coverage on the merge queue and nightly; quarantine flaky tests with an owner and a repair deadline. Consequences: feedback falls below 15 minutes, but some defects are caught only on the merge queue and need same-day ownership. Track pipeline duration, flaky rate, and production escapes monthly and adjust.'''
explanation = "A good ADR states constraints, alternatives and tradeoffs, a concrete tiering/sharding decision, a flaky-test policy, and outcome metrics."

[questions.testing-lv017]
prompt = "You have just become lead for a five-person team whose SaaS product has no test strategy (a few scattered unit tests, and QA manually tests for two days before each release). Present a 90-day testing-strategy plan: what to prioritize first, which quality gates to add, and how to measure success."
keywords = [["risk", "risks"], ["critical path", "core flow", "smoke"], ["integration", "integration test"], ["quality gate", "required check", "CI"], ["metric", "measure", "lead time", "production escape"]]
model_answer = '''Month 1: review bug reports and postmortems to map risk, select five critical flows (login, payment, project creation, etc.), and write stable smoke E2E tests for them; add lint, type checks, and existing tests to CI as quality gates. Month 2: add feature-level integration tests with network mocks in defect-prone areas, gate diff coverage for new code, and agree on a test-review checklist. Month 3: parallelize/shard CI to get pull requests under 15 minutes, assign owners to flaky tests, and shift QA from manual regression toward exploratory testing. Measure production escapes, pipeline duration, flakiness, and the reduction in release preparation from two days.'''
explanation = "The plan should prioritize risk and core flows, define CI quality gates, choose a suitable test mix, and name concrete measures."

[questions.testing-lvc01]
title = "Balance Shards by Runtime"
prompt = '''To shorten the pipeline, split test files into `n` shards using their previous runtimes. Write `balanceShards(tests, n)`:
- `tests` is an array of `{ name, ms }`; return an array of `n` arrays of file names.
- Use a greedy algorithm: sort tests by descending `ms` (ties by ascending `name`), then assign each test to the shard with the smallest current total `ms` (ties go to the lowest shard index).
- Empty shards should be empty arrays. Do not modify the input array.

Example: `balanceShards([{name:'a',ms:5},{name:'b',ms:3},{name:'c',ms:3}], 2)` → `[['a'], ['b','c']]`.
'''
hints = ["Copy the array with `slice()` before sorting.", "Keep a `totals` array alongside `shards` to find the lightest shard."]
explanation = "Longest-processing-time-first balances shards better than splitting by file count, reducing pipeline time toward that of the slowest shard."

