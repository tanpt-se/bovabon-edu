[modules.devops-dv-k8s-security]
title = "Kubernetes: RBAC and Workload Isolation"
description = "Design least-privilege access, NetworkPolicies, and safeguards for sensitive information in a cluster."
lesson = '''### Limiting permissions and communication paths
Kubernetes separates identities (users, groups, and ServiceAccounts), permissions (Roles and ClusterRoles), and permission assignments (RoleBindings and ClusterRoleBindings). A Role describes permissions in one namespace; a ClusterRole can describe cluster-wide permissions or be referenced within a namespace, depending on the binding. A RoleBinding limits the assigned permissions to its own namespace, even when it references a ClusterRole. Grant only the required verbs and resources; avoid * and cluster-admin for ordinary applications.

| Mechanism | Scope or purpose | What to check |
|---|---|---|
| Role + RoleBinding | API permissions in one namespace | Are the subject and binding namespace correct? |
| ClusterRole + ClusterRoleBinding | Cluster-wide API permissions | Does the workload really need cluster-wide read or write access? |
| ServiceAccount | API identity for a Pod | Grant only the application's required permissions; disable automatic token mounting if it does not call the API |
| NetworkPolicy | Filters L3/L4 traffic to and from Pods | Does the cluster's CNI support NetworkPolicy? |
| Secret | Stores sensitive configuration in the API | RBAC, encryption at rest, logs, and rotation procedures |

For example, an API that only reads ConfigMaps in the app namespace can use a dedicated ServiceAccount, a Role granting only get/list on ConfigMaps, and a RoleBinding assigning that Role to the ServiceAccount. A NetworkPolicy can start with default-deny ingress and then allow only traffic from the gateway and required dependencies; ingress and egress are separate directions. Policies do not filter traffic unless the network plugin implements them.

A Secret's data is not encrypted merely because its values are represented in base64; datastore encryption at rest and restricted read access are still needed. For workloads that do not call the Kubernetes API, consider automountServiceAccountToken: false. Common mistakes include assigning a ClusterRoleBinding just to fix a permission error quickly, using a default ServiceAccount with broad permissions, treating NetworkPolicy as a host firewall, or putting secrets in public manifests. Check permissions with kubectl auth can-i and test both allowed and blocked network paths.'''

