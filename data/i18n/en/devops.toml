- Budget consumed = burn_rate * days_elapsed / window_days; budget_remaining = 1 - consumed, not less than 0, rounded to 4 decimal places.
- action is "freeze" if budget_remaining is 0, otherwise "slow_down" if burn_rate > 1, otherwise "ship".
- Raise ValueError if slo is not in the open interval (0, 1), total <= 0, failed < 0 or failed > total, or days_elapsed is not in (0, window_days].
Example: release_policy(0.999, 1_000_000, 1500, 10) returns {"burn_rate": 1.5, "budget_remaining": 0.5, "action": "slow_down"}.
'''
