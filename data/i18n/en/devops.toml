options = ["Move to a remote backend with locking and encryption, run plan/apply in CI, and apply only after the plan is reviewed", "Commit terraform.tfstate to git to keep history", "Everyone keeps their own copy of the state and syncs it via chat", "Drop Terraform and use the console to move faster"]
explanation = "Remote state with locking prevents concurrent applies and lost state; running in CI gives a single reviewed change flow. State in git easily leaks secrets and still conflicts; per-person state is a source of drift; dropping IaC means going back to ClickOps."

[questions.devops-lv009]
