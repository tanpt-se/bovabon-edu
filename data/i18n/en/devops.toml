explanation = "Turning the error budget policy into code lets the pipeline decide automatically whether to block or allow a release, instead of arguing every time."

[questions.devops-lv019]
prompt = "A container has a 512Mi memory limit. The application's memory grows steadily and then the container stops with exit code 137, with no stack trace in the application logs. Which explanation is most accurate?"
