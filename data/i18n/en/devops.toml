[modules.devops-dv-nginx-edge]
title = "Nginx: TLS and Traffic Protection"
description = "Configure end-to-end TLS, request limits, and proxy trust in a controlled way."
lesson = '''### Hardening an edge reverse proxy
Nginx commonly terminates TLS, normalizes forwarding headers, and applies request limits before traffic reaches the application. A certificate and a private key are different materials: the certificate can be sent to clients, while the private key must be readable only by the appropriate process or group and must never be placed in an image or log. TLS does not replace application authentication, and the connection from Nginx to an upstream may need separate protection depending on the trust boundary.

| Setting | Role | Risk to avoid |
|---|---|---|
| ssl_certificate / ssl_certificate_key | Loads the certificate chain and private key for TLS | Exposing the key or omitting part of the certificate chain |
| limit_req_zone | Defines a key, shared-memory zone, and request rate | Using a key that does not represent the intended client |
| limit_req | Applies a zone, burst, and policy for excess requests | Setting the threshold too low and blocking legitimate traffic |
| set_real_ip_from | Defines trusted proxies allowed to supply client IPs | Trusting every address lets clients spoof their IP through a header |
| access_log | Records requests for monitoring and investigation | Logging tokens, sensitive query values, or unnecessary personal data |

For example, in the http context you can declare limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;, then apply limit_req zone=api burst=20 in an API location. burst allows a temporary number of requests above the normal rate. Without nodelay, excess requests are delayed by the algorithm; with nodelay, the burst is admitted immediately while the longer-term rate limit still applies. Observe logs or use dry-run mode before enforcing a limit on an endpoint with real traffic.

If a load balancer is in front, set_real_ip_from should include only proxy CIDRs you control; do not trust X-Forwarded-For directly from the Internet. Nginx should forward Host and the client address chain according to the system's policy, and the upstream should accept connections only from authorized proxies. Before reloading, run nginx -t, inspect configuration errors, and monitor access and error logs after deployment.

Common mistakes include enabling TLS without protecting the private key, trusting client IP headers from every source, treating burst as a fixed per-minute quota, or reloading without checking the configuration. Design rate limits around client identity, the path through proxies, and endpoint behavior, then measure their impact so a protective measure does not cause an availability incident.'''

