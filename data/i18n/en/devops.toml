[modules.devops-lead]
title = "The Tech Lead Perspective"
description = "Deployment strategies (rolling, blue-green, canary), SLOs and error budgets, on-call and postmortems, FinOps, GitOps, and governing IaC and secrets at team scale."
lesson = '''### Making operational decisions for the whole team
At the Tech Lead level, the question is no longer "which command is right" but "which option fits best with the current constraints": headcount, on-call skills, infrastructure budget, business risk, and the desired release speed. A good decision always records the context, the rejected options, and how to measure whether the decision worked.

#### 1. Choosing a deployment strategy

| Strategy | Infrastructure cost | Rollback speed | Observability needs | Good fit when |
|---|---|---|---|---|
| Recreate | Low | Slow, with downtime | Low | Internal jobs, short interruptions acceptable |
| Rolling update | Low (extra `maxSurge`) | Medium (`rollout undo`) | Medium | Default for stateless services |
| Blue-green | High (temporarily doubled) | Very fast (switch traffic) | Medium | Big changes that need an instant cutover |
| Canary | Low to medium | Fast, affects few users | High: per-version metrics | Critical services, frequent deploys |

A canary is only safe when you have metrics split by version and pre-written go/no-go criteria (error rate, p99 latency, minimum traffic). Without observability, a canary is just a slower rolling update.

#### 2. SLOs and error budgets
A 99.9% SLO over 30 days means an error budget of roughly 43 minutes (estimate) or 0.1% of requests failing. Burn rate = observed error rate / (1 − SLO); a burn rate of 1 consumes the budget at exactly the sustainable pace, while a burn rate of 10 exhausts it in about 3 days. The error budget policy must be agreed by PMs and engineers *before* an incident: with budget left, ship normally; when burning fast, slow down and prioritize reliability; when the budget is gone, freeze risky features.

#### 3. On-call and postmortems
- Alert on user-facing symptoms (SLO burn rate) rather than every CPU metric; every alert must be actionable and have a runbook.
- A reference target: fewer than about 2 pages per on-call shift (estimate, team-dependent).
- During an incident: mitigate first (rollback, turn off the feature flag), find the root cause later.
- Blameless postmortems: data-driven timeline, systemic causes, action items with owners and deadlines.

#### 4. Checklist for reviewing infrastructure changes
1. The change goes through a PR with the `terraform plan` output or manifest diff attached.
2. There is a clear rollback path, tested at least in staging.
3. Secrets are not in the repo, state, or logs; permissions follow least privilege.
4. Dashboards/alerts for the new component exist before traffic is turned on.
5. Estimated cost (requests/limits, node count, egress) is recorded.

#### 5. A short sample ADR
**ADR-007: Deploy with GitOps.** Context: 3 clusters, CI holds an admin kubeconfig, configuration often drifts due to manual edits. Decision: use a pull-based agent that syncs from the manifest repo; CI only builds images and opens PRs to bump tags. Consequences: fewer credentials in CI, drift is detected automatically, rollback via `git revert`; in exchange the team has to learn a new tool and debug through an extra layer.

#### 6. Team-scale anti-patterns
- ClickOps: editing production by hand in the console, so IaC is no longer the source of truth.
- Every team invents its own pipelines, charts, and logging; with no golden path nobody can review anyone else's work.
- Granting cluster admin to every developer "to move faster".
- Buying reserved instances before knowing which service the cost belongs to (missing tags, no cost per request).
- Alerts nobody can act on, so on-call engineers ignore even the real ones.
'''

[questions.devops-lv001]
prompt = "A 5-person team runs a payment service on Kubernetes, deploys daily, and already has error rate and latency metrics split by version. The budget does not allow doubling the infrastructure, even temporarily. Which release strategy is most reasonable?"
options = ["Blue-green: build a full parallel environment and then switch all traffic", "Canary by traffic percentage, with automatic rollback when the new version's metrics exceed thresholds", "Recreate during off-peak hours to avoid running two versions at once", "Default rolling update, only checking that Pods are Running"]
explanation = "A canary uses the existing per-version metrics, affects only a small share of users, and does not require doubling infrastructure. Blue-green violates the cost constraint; recreate causes downtime for a payment service; a rolling update that only looks at Running status pushes errors to all users before anyone notices."

[questions.devops-lv002]
prompt = "Availability SLO is 99.9% over a 30-day window. After 12 days the team has consumed 80% of the error budget. The PM wants to release a big feature this week. Both sides signed an error budget policy beforehand. What is the most reasonable decision?"
options = ["Release anyway because the SLO is only counted at the end of the month", "Slow down: postpone risky features, prioritize reliability work, and allow only bugfixes and changes with fast rollback, per the policy", "Lower the SLO to 99% to get more budget", "Turn off burn-rate alerts until the end of the month"]
explanation = "Error budgets exist to turn the ship-vs-stability argument into an agreed rule. Burning fast (80% after 40% of the window) is a signal to reduce risk. Arbitrarily lowering the SLO or turning off alerts breaks the commitment to users; continuing to release risks breaching the SLO."

[questions.devops-lv003]
prompt = "You are standardizing the postmortem process for 4 teams. Choose the practices to include in the template."
options = ["A timeline built from logs, metrics, and deploy history rather than memory", "Every action item has an owner and a tracked due date", "Name the person who caused the error for disciplinary lessons", "Focus on the system conditions and processes that let the error slip through", "Only write postmortems when an incident loses revenue"]
explanation = "Blameless postmortems target systems and processes; blaming individuals makes people hide information. Action items without owners do not get done. The threshold for writing a postmortem should be based on impact to the SLO/users, not just revenue."

[questions.devops-lv004]
prompt = "A 6-person team rotates on-call, the pager fires about 40 times a week, and 70% of the pages resolve themselves within 5 minutes. On-call engineers are burning out. What should the first priority be?"
options = ["Add people from other teams to the rotation to share the load", "Review alerts: switch to symptom-based and SLO burn-rate alerts, delete or downgrade non-actionable alerts, and give every remaining alert a runbook", "Double the threshold of every alert", "Turn off the pager outside business hours"]
explanation = "The root problem is noisy alerts, not a lack of people. Adding people only spreads the noise; raising all thresholds can hide real incidents; turning off the pager after hours abandons users. SLO burn-rate alerts reduce noise while still catching incidents that affect users."

[questions.devops-lv005]
prompt = "The cloud bill rose 40% this quarter while traffic only grew 10%. Leadership wants a plan within 2 weeks. What is the most reasonable first step?"
options = ["Buy 3-year reserved instances for every running machine", "Tag costs by team/service/environment and build unit-cost reports (e.g. cost per 1000 requests) to find the source of the increase", "Scale every service down to 1 replica", "Plan a migration to another cloud provider"]
explanation = "If you cannot tell who a cost belongs to, every optimization is a guess. Long-term commitments before rightsizing can lock in spend on wasted resources; cutting replicas across the board loses HA; switching clouds is expensive and does not address the cause."

[questions.devops-lv006]
prompt = "You are writing rightsizing guidance for Kubernetes workloads for the teams. Choose the correct statements."
options = ["The scheduler reserves node capacity based on requests, so overly high requests make nodes look full while actually idle, and you still pay for them", "Requests should be based on actual usage percentiles (e.g. p90-p95) and reviewed periodically", "Drop requests entirely so the scheduler optimizes on its own", "Spot/preemptible nodes suit stateless workloads that tolerate interruption, given a PDB and multiple replicas", "Always set the CPU limit to 10 times the request to be safe"]
explanation = "Requests are the basis for scheduling and often for node cost; removing requests makes Pods BestEffort, easily evicted, and utilization-based HPA stops working. A fixed limit multiplier has no basis; it should come from the real profile."

[questions.devops-lv007]
prompt = "Write a short ADR (context, decision, consequences) choosing between pull-based GitOps and pushing kubectl apply from CI for 3 Kubernetes clusters, given that CI currently holds an admin kubeconfig and configuration is often edited by hand."
keywords = [["gitops", "pull"], ["drift", "manual edit", "edited by hand"], ["credential", "kubeconfig", "permission", "rbac"], ["rollback", "revert", "undo"], ["consequence", "trade-off", "tradeoff"]]
model_answer = '''Context: 3 clusters, CI holds an admin kubeconfig, and configuration is often edited by hand, so drift happens constantly. Decision: use pull-based GitOps, with an in-cluster agent syncing from the manifest repo; CI only builds images and opens PRs to bump tags. Consequences: CI no longer holds credentials to the clusters, and permissions are narrowed to the agent's RBAC; drift is detected and self-healed; rollback is a git revert. Trade-off: the team must learn a new tool, debug an extra sync layer, and agree on a repo structure for multiple environments.'''
explanation = "A good ADR states the constraints (credentials, drift), the decision, and the price paid, so later readers understand why it was chosen."

[questions.devops-lv008]
