explanation = "This models the principle of trusting only headers supplied by managed proxies; a real configuration must match the load balancer's ordering and append behavior."

[modules.devops-dv-terraform-modules]
title = "Terraform: Modules and Controlled Changes"
description = "Design modules with clear interfaces, stable resource addresses, and tests and plan reviews."
lesson = '''### Separating configuration into modules with clear interfaces
A Terraform module is a directory of configuration called by a root module or parent module. A reusable module should accept inputs with clear types and meanings, expose only outputs its caller needs, and have a focused responsibility. Implicit global variables or too many internal outputs make changes harder to review. Choose registry module versions deliberately so an upgrade does not change behavior unexpectedly.

| Approach | Behavior | Good fit when |
|---|---|---|
| count | Creates numbered instances using integer indexes | Instances are nearly identical and their order is stable |
| for_each with a map | Uses named keys in instance addresses | Instances have different configurations or need readable addresses |
| Input variable | Passes configuration into a module | Values differ by environment or calling component |
| Output | Exposes a value to the calling module | Creating a small contract between modules |
| terraform test | Tests configuration with test files and assertions | Validating a module or configuration before sharing or applying it |

Example of a local module:
~~~hcl
module "service" {
  source = "./modules/service"
  name   = var.service_name
}
~~~

For named resources such as databases or buckets, for_each with stable map keys is often easier to understand than count over a list: removing an item in the middle of a list can shift index-based addresses, while map keys preserve instance identity. However, changing a for_each key also gives Terraform a different address. Plan a suitable state migration when changing an address; do not casually edit the key string. Use terraform plan to inspect create, update, delete, and replacement actions, and review destructive changes before applying.

terraform test can run tests in plan or apply mode. Tests that apply real resources need a provider, an isolated environment, least-privilege access, and clear cleanup because they may incur costs or leave infrastructure behind if they fail. Common mistakes include turning a module into a copy of configuration without a contract, exposing too many outputs, changing a module source without reviewing its version, or assuming that a resource address change is a harmless refactor. Keep the module interface small and treat resource addresses and state as part of the migration plan.'''

