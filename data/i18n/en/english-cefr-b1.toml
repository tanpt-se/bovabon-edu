[modules.cefr-b1-grammar-plus]
title = "Extended B1 Grammar"
description = "Future forms, modal verbs, clauses of result and purpose, indirect questions and question tags, articles, quantifiers, and be used to."
lesson = '''
### Choosing future forms by meaning
| Form | Use | Example |
|---|---|---|
| will + V | an immediate decision, a promise, or a prediction based on an opinion | *I'll help you. I think it will be busy.* |
| be going to + V | an existing plan or a prediction based on present evidence | *We're going to save money. Look at those clouds!* |
| present continuous | a personal arrangement that has already been made | *I'm meeting Lan at six.* |
| present simple | a fixed timetable | *The bus leaves at 7.20.* |

### Modals: obligation, permission, and ability
| Structure | Meaning | Example |
|---|---|---|
| need to + V | something is necessary | *You need to bring your ID.* |
| needn't + V | something is not necessary | *You needn't print the form.* |
| be allowed to + V | having permission | *Visitors are allowed to take photos.* |
| may + V | possibility or a polite request for permission | *It may rain. May I sit here?* |
| be able to + V | ability; can be used in different tenses | *She was able to finish on time.* |

Do not confuse *needn't* (not necessary) with *mustn't* (prohibited). Use the base form without *to* after a modal; *need to* and *be allowed to* are exceptions that include *to*.

### Result, degree, and purpose
Use *so + adjective/adverb + that*: *The room was so noisy that I couldn't sleep.* Use *such + (a/an) + adjective + noun + that*: *It was such a useful lesson that I took notes.* Use *too + adjective + to V* when something is excessive for an action (*too tired to walk*), and *adjective + enough + to V* when someone has sufficient ability (*old enough to travel alone*). Express purpose with *to / in order to + V* or *so that + subject + verb*: *I left early to catch the bus.* / *I spoke slowly so that everyone could understand.*

### Polite indirect questions and question tags
In an indirect question, use statement word order after the question word: *Could you tell me where the bank is?* Do not use *where is the bank* inside the longer question. Yes/no questions commonly use *if/whether*: *Do you know if the shop is open?* Question tags reverse the polarity: an affirmative statement is usually followed by a negative tag (*You live nearby, don't you?*), while a negative statement is followed by an affirmative tag (*She isn't busy, is she?*). Choose an auxiliary that matches the main verb.

### Articles and quantifiers
Use *a/an* for an unspecified singular countable noun (*an interview*), and *the* when the listener knows which item you mean or it is unique in context (*the interview at 2 p.m.*). General statements with plural or uncountable nouns usually have no article: *Books are useful; Water is important.* *Go to school* refers to studying; *go to the school* means going to a particular school building. *Both* means the two, *either* means one of two, and *neither* means not one or the other. With plural nouns: *Both options are fine.* *Neither answer is correct.*

### used to and be used to
*used to + V* describes a past habit or state that has changed: *I used to cycle to work.* *be used to + noun/V-ing* means to be accustomed to something: *I'm used to cycling in the rain.* Remember that *to* in *be used to* is a preposition, so it is followed by a noun or V-ing. Common mistakes include writing *I'm used to cycle* and using *will* immediately after *if* in a conditional sentence; check the structure and meaning before choosing a form.

### Other B1 structures
Reflexive pronouns (*myself, yourself, himself, herself, ourselves, themselves*) emphasize that someone did something personally: *I made the cake myself.* Use *each other* when two or more people do something mutually: *The classmates help each other.* Some phrasal verbs are separable: *turn off the light / turn the light off / turn it off*; others are inseparable: *look after a child* (not *look a child after*). Learn each phrase and the position of its pronoun. To express contrast, *although + clause* can begin a sentence (*Although it was late, we stayed.*), *but* joins two ideas in one sentence, and *however* often begins the next sentence (*It was late. However, we stayed.*). Do not combine *although…but* or *but, however* in the same structure.

### Passive voice, conditionals and reported speech
Use the passive when the action or result matters more than the person doing it: *The road was repaired last month.* The basic pattern is the appropriate form of *be + past participle*; do not add an object after a passive verb. Zero conditional describes facts (*If you heat ice, it melts*), first conditional describes a real future possibility (*If it rains, we will stay inside*), and second conditional describes an unreal present situation (*If I had more time, I would learn another language*). Do not use *will* directly after *if* in a first conditional.
In reported speech, pronouns and tense often shift with the context: *“I work here,” Linh said* becomes *Linh said that she worked there.* Relative clauses identify a person or thing (*the person who called*) or add extra information, usually between commas (*My laptop, which is quite old, still works*).

### Choose structures by meaning
Some verbs take an -ing form (*avoid doing, suggest taking*); others take to + infinitive (*plan to leave, decide to wait*). Learn the whole pattern instead of translating each word. Phrasal verbs may be separable (*turn the screen off / turn it off*) or inseparable (*look after a child*). With a pronoun, place it between the verb and particle in a separable phrasal verb: *turn it off*. Use *myself/yourself* when the subject and object are the same person, and *each other* for a reciprocal action. After choosing an answer, check its meaning, word order and verb form.
'''

[questions.cefr-b1-001]
explanation = "A fixed opening time uses the present simple. The present continuous usually describes an arrangement that has already been made."

[questions.cefr-b1-002]
explanation = "There is clear evidence in the present, so use *be going to* for the prediction. Do not use *to* after *will*."

[questions.cefr-b1-003]
explanation = "*Needn't* means something is not necessary. *Mustn't* means something is prohibited, which is a different meaning."

[questions.cefr-b1-004]
explanation = "After *Could you tell me*, the clause uses statement word order: the subject comes before the verb."

[questions.cefr-b1-005]
explanation = "The main clause is affirmative and uses *is*, so the negative question tag is *isn't she*."

[questions.cefr-b1-006]
prompt = "Choose the sentences that use an appropriate future form for the situation described."
options = ["The train leaves at 8.15, according to the timetable.", "I've booked a table; I'm meeting Mai at seven.", "We planned this last week: we're going to paint the kitchen.", "Look at the timetable: the train is leaving every day at 8.15.", "I think he going to enjoy the film."]
explanation = "Timetables use the present simple; arranged appointments use the present continuous; plans made earlier use *going to*."

[questions.cefr-b1-007]
prompt = "Choose the sentences that are correct about modal verbs, articles, and either/neither/both."
options = ["Visitors are allowed to use the garden.", "You mustn't wear a uniform; it is optional. (meaning: it is not compulsory)", "Both answers are possible.", "Neither of the two rooms is available.", "She is an engineer at a local hospital.", "You can either take the bus or walk to the station.", "She may to arrive late because of traffic."]
explanation = "*Be allowed to* expresses permission; *both* is used with a plural noun; *neither* usually takes a singular verb; and *either...or* connects two choices. *Mustn't* means prohibited, and *may* is followed by a verb without *to*."

[questions.cefr-b1-008]
prompt = '''
Complete each sentence with an appropriate future form:

1. The film {{blank}} (start) at 6.30 according to the programme.
2. We {{blank}} (have) dinner with our cousins tomorrow; the table is booked.
3. I think you {{blank}} (like) this book.
'''
explanation = "Fixed timetables use the present simple; personal arrangements use the present continuous; predictions based on an opinion commonly use *will*."

[questions.cefr-b1-009]
prompt = '''
Complete each blank with a suitable word or phrase:

1. The box is {{blank}} heavy that I can't lift it. (so/such)
2. It was {{blank}} a funny story that we all laughed. (so/such)
3. The soup is too hot {{blank}} eat now. (to/for)
4. Mia is old {{blank}} to travel alone. (enough/too)
5. I left early {{blank}} catch the first bus. (purpose)
'''
explanation = "Use *so* before an adjective and *such* before a noun phrase; use *too + adjective + to V* and *adjective + enough + to V*. Use *to/in order to + V* to express purpose."

[questions.cefr-b1-010]
prompt = '''
Complete the polite questions and question tags:

1. Could you tell me where the post office {{blank}}? (is)
2. You haven't met our new teacher, {{blank}}? (have)
3. Do you know {{blank}} the shop is open on Sundays? (if/whether)
4. My grandfather {{blank}} live by the sea, but now he lives in Hanoi. (used to)
5. I am used to {{blank}} up early, so mornings are easy for me. (get)
6. She is {{blank}} engineer at a local hospital. (an)
'''
explanation = "Indirect questions keep statement word order; the negative main clause *haven't met* takes the affirmative tag *have you?*. *Used to + V* describes a past habit, while *be used to + V-ing* means to be accustomed to something. Use *an* before the vowel sound in *engineer*."

[questions.cefr-b1-011]
prompt = "You are in an unfamiliar town. Write **two sentences in English** to politely ask how to get to the museum and whether it is open on Mondays. Use indirect questions.\n"
explanation = "Indirect questions make a request more polite. After the opening phrase, use statement word order, including in questions with a question word."

[modules.cefr-b1-vocab]
title = "B1 Topic Vocabulary"
description = "Vocabulary for work, education, media, the environment, and money; common collocations and basic word formation."
lesson = '''
### Vocabulary for familiar topics
| Topic | Words and phrases | Example |
|---|---|---|
| Work | apply for a job, CV, salary, colleague, interview | *I have an interview on Friday.* |
| Education | course, subject, exam, improve, take notes | *She takes notes during the lesson.* |
| Media | news, headline, online, post, share | *I read the news online every morning.* |
| Environment | recycle, waste, pollution, public transport, save energy | *We take the bus to reduce air pollution.* |
| Money | price, cost, spend, save, borrow, lend | *I'm saving money for a new laptop.* |
| Health and lifestyle | exercise, sleep, healthy, habit | *A short walk is a healthy habit.* |
| Travel and culture | ticket, local food, museum, festival | *We tried local food at the festival.* |
| Relationships | invite, get on with, apologize, each other | *I get on well with my colleagues.* |

Watch out for easily confused pairs: *borrow* means to receive something temporarily from someone; *lend* means to give something temporarily to someone. *Salary* is usually regular pay; *price* is how much an item costs; *cost* is the amount of money that must be paid. Say *apply for a job* when seeking employment and *apply to a company* when sending an application to an organization.

### Collocations with make, do, take, have, and get
| Verb | Common phrases | Example |
|---|---|---|
| make | a decision, a mistake, progress | *We made a decision together.* |
| do | homework, housework, a course | *He does his homework after dinner.* |
| take | notes, a photo, a break | *Please take notes of the new words.* |
| have | a meeting, a lesson, a good time | *They have a meeting at noon.* |
| get | a job, a message, better | *I hope you get a job soon.* |

Learn the whole phrase instead of translating each word separately. Common mistakes include *make homework* and *do a decision*. With *have* and *get*, pay attention to the collocation and context instead of choosing a verb from just one translation.

### Prefixes and suffixes
Prefixes often change meaning; suffixes often change a word's part of speech or form a noun or adjective.
| Affix | Example | Clue |
|---|---|---|
| un- | unhappy, unusual | not / opposite |
| dis- | disagree, dislike | not / opposite |
| -ful | useful, careful | having a quality |
| -less | careless, useless | without / lacking |
| -ment | employment, development | often forms a noun |
| -tion | education, information | often forms a noun |

For example: *use → useful → useless*; *employ → employment*. Not every prefix or suffix can be added to every word. When completing a word-formation task, first identify whether the sentence needs a noun, adjective, or verb, then check the spelling and meaning in context.

### Build vocabulary in chunks
Learn new words with their common partners and prepositions: *apply for a position, be responsible for a task, take part in a workshop, make progress, pay attention to details*. A word can change in meaning by context: *salary* is regular pay, *wage* is often calculated by the hour or shift, and *income* is a general term for money received. Phrasal verbs also depend on their object and context: *look up a word* means search for its meaning; *look after a child* means care for the child.
Prefixes and suffixes help you predict meaning, but check the word class: *employ → employment / employer / employee*; *use → useful / useless*. When reading, infer a word from its sentence and confirm it with grammar and context. When writing, prefer a natural collocation to a rare word: say *make a decision*, not *do a decision*. Record a complete example sentence to remember how the word is used.
'''

[questions.cefr-b1-012]
explanation = "We say *apply for a job* when seeking employment. *Borrow* means to take something temporarily, *save* means to keep money for later, and *share* means to use or give something jointly."

[questions.cefr-b1-013]
explanation = "A *course* is a series of lessons; the other options refer to pay, news, and unwanted material."

[questions.cefr-b1-014]
explanation = "A *headline* is the title at the top of a news article or report."

[questions.cefr-b1-015]
explanation = "Using public transport can reduce the number of private cars and their emissions. The other choices create more waste or waste energy."

[questions.cefr-b1-016]
explanation = "Putting money aside for a goal is to *save for* it. *Spend* means to use money, *lend* means to give money temporarily, and *cost* refers to a price."

[questions.cefr-b1-017]
prompt = "Choose the natural verb-noun combinations commonly used in study routines."
explanation = "The correct phrases are *do homework*, *make a decision*, and *take notes*. We say *do housework* and *make progress*."

[questions.cefr-b1-018]
prompt = "Choose the sentences that use the correct word forms and meanings."
explanation = "*Useful*, *employment*, and *careless* are the correct word forms. Use the noun *hope* (or *hopeless* with a different meaning) and *information*, not *unhope/inform*."

[questions.cefr-b1-019]
prompt = '''
Fill each blank with make, do, take, have, or get:

1. I need to {{blank}} my homework before dinner.
2. We {{blank}} a meeting every Monday morning.
3. She wants to {{blank}} a job in education.
'''
explanation = "Learn these fixed combinations: *do homework*, *have a meeting*, and *get a job*."

[questions.cefr-b1-020]
prompt = '''
Form the correct word from the word in brackets:

1. This website is very {{blank}}; it helps me practise English. (use)
2. The company offers jobs in teaching and {{blank}}. (employ)
3. Please be {{blank}} when you cross this busy road. (care)
'''
explanation = "After *very* and *be*, use the adjectives *useful/careful*; after *in* in this phrase, use the noun *employment*."

[questions.cefr-b1-021]
prompt = '''
Fill each blank with a word that matches the clue:

1. The money you receive regularly for your work is your {{blank}}. (regular pay)
2. I need to {{blank}} a book from the library and return it next week. (take temporarily and return)
3. We sort glass and paper so that we can {{blank}} them. (process for reuse)
'''
explanation = "*Salary* is regular pay; a person who takes something temporarily *borrows* it, while the person who gives it *lends* it; *recycle* means to process something for reuse."

[questions.cefr-b1-022]
prompt = "Write **three sentences in English** suggesting ways to make a school more environmentally friendly. Include one action to reduce waste and one way to travel or save energy.\n"
explanation = "The response suggests specific actions and uses B1 environmental vocabulary such as *recycle*, *waste*, and *public transport*."

[modules.cefr-b1-functions]
title = "B1 Communication Functions"
description = "Giving opinions, responding politely, offering advice, handling complaints, telling stories, and talking about plans."
lesson = '''
### Giving opinions and responding
| Purpose | Natural phrases | Example |
|---|---|---|
| Asking for an opinion | *What do you think about…?* | *What do you think about online classes?* |
| Giving an opinion | *In my opinion,… / I think…* | *In my opinion, the bus is more convenient.* |
| Agreeing | *I agree. / That's a good point.* | *I agree; it saves time.* |
| Disagreeing gently | *I see what you mean, but… / I'm not sure I agree.* | *I see what you mean, but the train is cheaper.* |

To keep a discussion friendly, acknowledge the other person's point and then give a brief reason. Avoid saying only *You are wrong*; try *I'm not sure I agree because…* or *I see your point, but…*.

### Giving advice and making complaints
Give advice with *You should + V*, *You could + V*, or *Why don't you + V?*: *You should speak to your teacher.* Do not add *to* after *should*. When making a complaint, describe the specific problem calmly and suggest a solution: *Excuse me, the room is very noisy. Could I change rooms, please?* Avoid accusations or direct commands if you want staff to be willing to help. If you receive a complaint, you can apologize, confirm the problem, and suggest a next step: *I'm sorry about that. I'll ask someone to check it.*

### Telling a story in order
Use linking words to help listeners follow: *At first / First* introduces the story; *then / after that / a little later* introduces the next event; *because / so* gives a reason or result; *in the end / finally* brings the story to a close. For example: *First, we missed the bus. Then, we called a taxi. In the end, we arrived before the show started.* You do not need to repeat *and then* in every sentence; varying your linking words makes the story clearer.

### Plans, ambitions, and asking for clarification
Talk about near-future plans with *I'm planning to…* or *I'd like to…*; talk about goals with *I hope to…* or *My goal is to…*: *I'm planning to take an English course because I want to work in tourism.* When you do not understand, ask politely: *Could you explain what you mean?*, *Could you say that again, please?*, or *Do you mean…?* You can repeat the part you understood before asking. A common mistake for Vietnamese learners is translating *explain me* word for word; *explain* is usually followed by the information (*explain the rule to me*) or a clause (*explain what you mean*).

When apologizing, say clearly what happened and add a brief explanation: *I'm sorry I'm late. The bus was delayed.* You can persuade someone gently by giving an opinion and a specific benefit: *I think we should take the train because it is cheaper.* The aim is to help the listener understand your reason, not to put pressure on them.

### Interaction, clarification and mediation
In a conversation, signal when you need someone to repeat or explain: *Could you say that again?*; *What do you mean by “flexible”?* When disagreeing, acknowledge the other view before giving your own: *I see your point, but…* When handling a complaint, recognise the problem, apologise when appropriate and offer a next step instead of arguing.
In email, group chat and online meetings, keep sentences brief and purposeful, quote the point you are replying to, and avoid writing in all capitals as if shouting. To help two people understand each other, restate the message neutrally: *So, you need the room by nine, and the organiser can open it at half past eight.* Summarise what has been agreed before closing. These phrases support written interaction; real speaking practice is still needed to assess pronunciation and fluency.
'''

[questions.cefr-b1-023]
explanation = "*What do you think about…?* is a natural, polite way to ask for someone's opinion."

[questions.cefr-b1-024]
explanation = "The first response acknowledges the other person's idea before politely disagreeing and giving an implied reason."

[questions.cefr-b1-025]
explanation = "Use the base form of the verb without *to* after *should*: *should make*."

[questions.cefr-b1-026]
explanation = "Describing the problem and making a request with *could* makes the complaint polite and easier to resolve."

[questions.cefr-b1-027]
explanation = "*After that* connects an event that happens next. The other options express contrast, cause, or substitution."

[questions.cefr-b1-028]
prompt = "Choose the sentences that politely agree or disagree in a discussion."
explanation = "The first three sentences express agreement or disagreement while acknowledging the other person. If you use this structure, say *I don't agree with you*; avoid attacking the listener."

[questions.cefr-b1-029]
prompt = "Choose the sentences that can be used to ask someone to clarify what they have just said."
explanation = "The first sentences politely ask the speaker to repeat or clarify their meaning. *Explain me* is incorrect; say *explain it to me* or ask *what you mean*."

[questions.cefr-b1-030]
prompt = '''
Complete the pieces of advice with one word:

1. You {{blank}} talk to your teacher about the problem. (should)
2. Why don't you {{blank}} a short break? (take)
3. You could {{blank}} the instructions again before starting. (read)
'''
explanation = "*Should/could + V* and *Why don't you + V* are all followed by the base form of the verb without *to*."

[questions.cefr-b1-031]
prompt = '''
Fill in suitable story connectors:

1. {{blank}}, we bought our tickets. Then, we went inside. (first)
2. The bus was late, {{blank}} we called a taxi. (as a result)
3. We visited the old town. {{blank}}, we had dinner by the sea. (after that)
'''
explanation = "Connectors that signal sequence and result make a story easier for listeners to follow."

[questions.cefr-b1-032]
prompt = '''
Complete the sentences about plans and ambitions:

1. I'm planning {{blank}} take an evening English course. (to)
2. My goal {{blank}} to work in a hospital. (is)
3. I hope {{blank}} travel around my country next year. (to)
'''
explanation = "Use *plan to + V*, *goal is to + V*, and *hope to + V* to talk about plans or goals."

[questions.cefr-b1-033]
prompt = "A friend wants to give up because their English course is difficult. Write **three sentences in English**: give your opinion, respond politely to their concern, and then offer advice with a reason.\n"
explanation = "The response gives an opinion, acknowledges the friend's feelings, and offers advice with a reason."

[modules.cefr-b1-reading-writing]
title = "B1 Reading and Writing"
description = "Reading blogs, short news items, and reviews; writing emails in an appropriate style and coherent paragraphs."
lesson = '''
### Reading short texts with a purpose
A personal blog often describes experiences and feelings; a short news item prioritizes the main event and who did what, where, and when; a review gives an opinion with reasons and may end with a recommendation. Before reading closely, look at the title and first sentence to predict the topic. For detail questions, find the key words in the text and read the surrounding sentence; do not choose an answer just because it repeats a word from the passage. Distinguish information stated directly from a simple inference based on details.

### Informal and formal emails
| Part | Informal | Formal |
|---|---|---|
| Greeting | *Hi Anna,* | *Dear Ms Brown,* |
| Opening | *How are you?* | *I am writing to ask about…* |
| Request | *Can you send me…?* | *Could you please send me…?* |
| Sign-off | *See you soon,* | *Yours sincerely,* |

An email should suit its purpose, include enough information, and have clear paragraphs. Choose a greeting and sign-off that fit the recipient. In a simple work email, avoid overly casual contractions; *I'm* can be used in an informal exchange, while *I am* is often more suitable in a formal letter. Do not translate *I want to know* word for word when making a polite request; use *Could you please tell me…?*.

### Paragraphs with a topic sentence
A topic sentence states the main idea; the following sentences give reasons or examples; a final sentence can sum up. Choose linking words that express the right relationship: *Firstly* introduces the first reason; *In addition* adds an idea; *However* signals contrast; *For example* introduces an example; *Finally* brings the paragraph to a close. For example: *Public transport is useful for students. Firstly, it is cheaper than driving. In addition, students can read on the bus. However, buses can be crowded at busy times.* Avoid using *but* and *however* together in the same structure (*but, however*); each linking word should connect ideas that have the right relationship.

At B1, learners can write a formal or informal email of about **100–150 words**, tell a short story, write a blog post or review, or give an opinion paragraph with reasons. Divide the text into short paragraphs when the topic changes; choose a topic sentence first, then add two reasons or examples. In an email to invite, thank, or apologize, state the purpose near the beginning and choose an appropriate ending for the recipient.

### Check before sending
Reread your work to check that the recipient can understand its purpose right away, that each paragraph focuses on one idea, and that pronouns and linking words make the connections clear. Check the topic sentence, capitalization at the start of sentences and in proper names, punctuation, verb tenses, and spelling. B1 writing should be clear and use some familiar linking words; there is no need to force long words or overly complex sentences. In a review, give a specific reason for what you like or dislike instead of writing only *It was good*.

### Read with a purpose, write and summarise
Before reading, decide whether you need the main idea, a detail or the writer’s attitude. Read the title and opening sentence for the topic; scan names, dates and figures for facts; then read around a keyword to infer meaning. Distinguish information stated directly from a reasonable inference and from personal opinion.
A B1 email usually has an appropriate greeting, its purpose near the beginning, details in a clear order and a polite closing. A paragraph needs a topic sentence, an explanation or example, and a link to the next idea. When summarising, keep the key people, actions, time and outcome; remove minor examples and do not add your own view. For instructions to another person, use *first, then, finally* to restate the steps clearly. The app’s essay checker only matches keywords, so it cannot replace teacher feedback on grammar, coherence and register.
'''

[questions.cefr-b1-034]
prompt = '''
Read the blog post:

“Last Saturday, I joined a cooking class at the community centre. We learned to make vegetable soup. I enjoyed meeting new people, and I want to go again next month.”

What is the main idea?
'''
explanation = "The blog post describes joining a cooking class and says that the writer wants to go again."

[questions.cefr-b1-035]
prompt = '''
Read the news brief:

“A new bike path opened near Green Park on Monday. The city built it to help people travel safely to work and school. Local residents can use it for free.”

Why did the city build the path?
'''
explanation = "The text clearly states that the path was built to help people travel more safely to work and school."

[questions.cefr-b1-036]
prompt = '''
Read the review:

“I watched *The Blue Island* with my family. The story was easy to follow, and the music was beautiful. The film was a little long, but I would recommend it to people who enjoy adventure stories.”

What does the writer think about the film?
'''
explanation = "The writer praises the story and music and says the film was a little long, but still recommends it to people who enjoy adventure."

[questions.cefr-b1-037]
explanation = "*Dear Ms Green,* is a suitable greeting for a formal email to a recipient whose name you know."

[questions.cefr-b1-038]
explanation = "A topic sentence clearly states the main idea that following sentences can explain with reasons or examples."

[questions.cefr-b1-039]
prompt = "Choose the sentences suitable for a formal email asking for information about a course."
explanation = "The greeting and polite request are suitable for a formal email. The other sentences are too casual or sound like commands."

[questions.cefr-b1-040]
prompt = '''
Fill in suitable linking words:

{{blank}}, I would like to describe the problem with my new phone. (firstly)
It is light and easy to use. {{blank}}, the battery lasts all day. (in addition)
The camera is good. {{blank}}, the screen is difficult to read outside. (however)
'''
explanation = "*Firstly/first* introduces the first point, *in addition* adds information, and *however* signals contrast."

[questions.cefr-b1-041]
prompt = '''
Complete the closing of a formal email to **Mr Lee**:

I look forward to hearing from you.
{{blank}},
Mai Tran
'''
explanation = "When you know the recipient's name and begin with *Dear Mr Lee*, a common formal sign-off is *Yours sincerely*."

[questions.cefr-b1-042]
prompt = '''
Fill in **however** or **in addition**:

The library is close to my house. {{blank}}, it has a quiet room where I can study.
The room is comfortable. {{blank}}, it can be noisy after school.
'''
explanation = "The first sentence adds another benefit, so use *in addition*; the second gives a contrasting point, so use *however*."

[questions.cefr-b1-043]
prompt = '''
Read the passage and fill in the details:

“Our town opened a small weekend market in May. Local farmers sell fruit there, and visitors can buy bread from a family bakery. The market closes at 2 p.m.”

1. The market opened in {{blank}}.
2. Visitors can buy bread from a family {{blank}}.
'''
explanation = "Scan the passage again to find specific details; use the exact words and information stated in the text."

[questions.cefr-b1-044]
prompt = "Write **one 4–5 sentence paragraph in English** giving your opinion about students taking the bus to school. Begin with a topic sentence, give two reasons, and use at least two linking words from *Firstly, In addition, However,* and *Finally*.\n"
explanation = "The paragraph has a topic sentence, reasons, and linking words that connect the ideas and help readers follow the opinion."

[questions.cefr-b1-x001]
prompt = "If you heat ice, it {{blank}} into water."
options = ["melts", "will melt", "would melt", "is melting"]
explanation = "This is a general fact, so the zero conditional uses the present simple in both clauses."

[questions.cefr-b1-x002]
prompt = "The old library {{blank}} last year after the roof was damaged."
options = ["repaired", "was repaired", "has repaired", "is repairing"]
explanation = "The past passive is was/were + past participle; the library receives the action."

[questions.cefr-b1-x003]
prompt = "“I work in Bristol,” Ben said. Ben said that he {{blank}} in Bristol."
options = ["works", "worked", "has worked", "will work"]
explanation = "In past reported speech, the present simple commonly shifts to the past simple."

[questions.cefr-b1-x004]
prompt = "The woman {{blank}} teaches our evening class is from Leeds."
options = ["which", "where", "who", "whose"]
explanation = "Use who for a person that is the subject of a relative clause."

[questions.cefr-b1-x005]
prompt = "Our neighbours suggested {{blank}} the meeting to Friday afternoon."
options = ["to move", "moving", "move", "moved"]
explanation = "Suggest is followed by an -ing form, not to + infinitive."

[questions.cefr-b1-x006]
prompt = "Select the sentences that use conditionals correctly."
options = ["If you press this button, the screen lights up.", "If it rains tomorrow, we will take a taxi.", "If I would have more time, I would visit you.", "If she lived closer, she would walk to work.", "If the train will be late, call me."]
explanation = "The selected options correctly use zero, first or second conditional forms; standard conditional clauses do not use would directly after if."

[questions.cefr-b1-x007]
prompt = "Which sentences use a passive or a relative clause correctly?"
options = ["The tickets were checked at the entrance.", "This is the café where we met.", "The parcel delivered yesterday by the post office.", "My aunt, which lives in York, is a nurse.", "The room was cleaned before the guests arrived."]
explanation = "A passive needs be + past participle; a relative clause needs a suitable pronoun and word order."

[questions.cefr-b1-x008]
prompt = "Select the sentences with correct verb patterns, reflexives or phrasal verbs."
options = ["He avoids driving at night.", "Mina introduced herself to the new class.", "Please turn off it before you leave.", "We looked after our neighbour’s dog.", "They decided taking the earlier bus."]
explanation = "The correct options use an -ing form after avoid, a reflexive pronoun with the same subject, or a natural phrasal verb."

[questions.cefr-b1-x009]
prompt = "Complete the conditional sentences.\n\n1. If you {{blank}} (mix) red and blue, you get purple.\n2. If I {{blank}} (have) a car, I would visit more often.\n3. If the weather is clear tomorrow, we {{blank}} (go) hiking."
explanation = "Zero conditional uses the present simple; second conditional uses the past simple in the if-clause; first conditional uses will in the result clause."

[questions.cefr-b1-x010]
prompt = "Complete the reported and relative clauses.\n\n1. “I am busy,” Lan said. Lan said she {{blank}} busy.\n2. The film {{blank}} we watched was based on a true story.\n3. “We live here,” they said. They said they {{blank}} there."
explanation = "Reported speech commonly shifts the present to the past; that/which can refer to a thing; live shifts to lived."

[questions.cefr-b1-x011]
prompt = "Complete each sentence with a purpose or result structure.\n\n1. I left home early {{blank}} catch the first bus.\n2. The room was {{blank}} noisy that we moved outside.\n3. She spoke slowly {{blank}} everyone could follow the instructions."
explanation = "Use to + infinitive for purpose, so + adjective + that for a result, and so that before a clause."

[questions.cefr-b1-x012]
prompt = "Complete the sentences with an article, quantifier or question form.\n\n1. We need {{blank}} information before we can decide. (a little / a few)\n2. Could you tell me when the office {{blank}}? (close)\n3. You have met the new manager, {{blank}}? (tag)"
explanation = "Information is uncountable; an indirect question uses statement word order; a positive clause with have takes the negative tag haven't you."

[questions.cefr-b1-x013]
prompt = "Complete the sentences with the correct form.\n\n1. I am used to {{blank}} (work) with a small team.\n2. She repaired the chair by {{blank}} (she).\n3. The children helped {{blank}} when they could not reach the top shelf. (each other / themselves)"
explanation = "Be used to takes a noun or -ing form; by herself emphasises doing something alone; reciprocal actions use each other."

[questions.cefr-b1-x014]
prompt = "Write three or four connected sentences about a habit you changed. Include one used-to contrast, one relative clause and one conditional sentence."
keywords = [["used to"], ["who", "that", "which"], ["if"]]
model_answer = "I used to leave every task until Friday, but now I plan the week on Monday. My colleague, who is very organised, showed me a simple checklist. If I follow it, I finish important work earlier. The checklist is reviewed every month."
explanation = "This item only checks whether the target structures appear; a keyword score is not a full measure of accuracy."

[questions.cefr-b1-x015]
prompt = "Everyone on the project must {{blank}} in a short safety workshop before Monday."
options = ["take part", "make part", "do part", "have part"]
explanation = "Take part in is the natural collocation for participating in an activity."

[questions.cefr-b1-x016]
prompt = "The team needs to {{blank}} a decision before the booking closes."
options = ["make", "do", "take", "get"]
explanation = "Make a decision is the standard collocation."

[questions.cefr-b1-x017]
prompt = "Our new assistant is responsible {{blank}} updating the customer list."
options = ["for", "to", "with", "about"]
explanation = "Responsible is followed by the preposition for."

[questions.cefr-b1-x018]
prompt = "The manager had to {{blank}} the interview until next week because she was ill."
options = ["put off", "look after", "find out", "take up"]
explanation = "Put off means postpone."

[questions.cefr-b1-x019]
prompt = "The report gives a clear {{blank}} of why the bus route changed."
options = ["explain", "explanation", "explaining", "explained"]
explanation = "Explanation is the noun required after a clear."

[questions.cefr-b1-x020]
prompt = "Select the sentences with natural B1 collocations."
options = ["She has made good progress in reading.", "Please pay attention to the final date.", "He did a mistake in the form.", "Nora took responsibility for the delay.", "We took a photo of the old bridge."]
explanation = "Make progress, pay attention, take responsibility and take a photo are natural; do a mistake is not."

[questions.cefr-b1-x021]
prompt = "Choose the sentences that use phrasal verbs naturally."
options = ["Could you look after my bag for a moment?", "We ran out of milk, so I went to the shop.", "She gave up the bus at the next stop.", "They carried on working after lunch.", "I looked the meaning up in a dictionary."]
explanation = "Look after, run out of, carry on and look up are used naturally; give up a bus does not mean board or leave it."

[questions.cefr-b1-x022]
prompt = "Select the sentences with correct word forms and meanings."
options = ["The guide is reliable and easy to follow.", "We need more information before choosing.", "She gave a carefully explanation.", "Their employment began after the training course.", "The team completed the work successfully."]
explanation = "Reliable is an adjective after is; information is an uncountable noun; carefully modifies a verb; employment is a noun."

[questions.cefr-b1-x023]
prompt = "Complete the collocations with make, do, take, have or get.\n\n1. The researchers will {{blank}} a survey this week.\n2. Please {{blank}} attention to the warning sign.\n3. I hope to {{blank}} the chance to study abroad.\n4. We need to {{blank}} ready before the visitors arrive."
explanation = "The natural expressions are do a survey, pay attention, have the chance and get ready."

[questions.cefr-b1-x024]
prompt = "Complete each sentence with the correct form of the word in brackets.\n\n1. The new employee showed great {{blank}} (confident).\n2. This website is {{blank}} useful for beginners. (particular)\n3. We need more {{blank}} about the evening course. (inform)"
explanation = "Great is followed by the noun confidence; the adverb particularly modifies useful; information is an uncountable noun."

[questions.cefr-b1-x025]
prompt = "Complete the phrasal verbs.\n\n1. I need to {{blank}} up the train times before we leave.\n2. The meeting was put {{blank}} until Thursday.\n3. The team carried {{blank}} with the project after the delay."
explanation = "Look up means search for information; put off means postpone; carry on means continue."

[questions.cefr-b1-x026]
prompt = "Complete each sentence with a word that matches the meaning.\n\n1. Money you receive for your work is your {{blank}}. (general term)\n2. A person who applies for a job is an {{blank}}.\n3. When prices rise, the cost of living may become less {{blank}}. (affordable)"
explanation = "Income is money received; applicant is a person applying; affordable describes something at a reasonable price."

[questions.cefr-b1-x027]
prompt = "Complete the collocations with the correct preposition.\n\n1. The result depends {{blank}} how much time we have.\n2. My brother is interested {{blank}} wildlife photography.\n3. She succeeded {{blank}} finding a cheaper ticket."
explanation = "Depend on, interested in and succeed in are fixed collocations."

[questions.cefr-b1-x028]
prompt = "Write three sentences about a skill you have developed. Include one collocation such as make progress or take responsibility, and one phrasal verb such as find out or carry on."
keywords = [["make progress", "take responsibility"], ["find out", "carry on"]]
model_answer = "I made progress in English by reading a short article every day. When I find out that a phrase is unfamiliar, I write it in my notebook. I now take responsibility for reviewing my notes each week."
explanation = "The model includes the requested collocation and phrasal verb; the keyword groups only confirm that these ideas appear."

[questions.cefr-b1-x029]
prompt = "A colleague says, “The schedule is impossible.” Which reply shows empathy and asks for useful detail?"
options = ["That is not my problem.", "I can see why that feels difficult. Which deadline is causing the most pressure?", "You should have planned better.", "The schedule is perfect, so stop worrying."]
explanation = "The best reply recognises the difficulty and asks for useful information to address it."

[questions.cefr-b1-x030]
prompt = "You need to interrupt politely during a meeting. What can you say?"
options = ["Be quiet for a moment.", "May I add one point before we move on?", "You are wrong again.", "I will speak now."]
explanation = "May I add something? is a polite way to request a turn."

[questions.cefr-b1-x031]
prompt = "A customer says the parcel has not arrived. Which response is most helpful?"
options = ["You must have lost it.", "I’m sorry it hasn’t arrived. I’ll check the tracking information now.", "Wait and see.", "The delivery company is always late."]
explanation = "A helpful response acknowledges the issue and states the next step."

[questions.cefr-b1-x032]
prompt = "A friend invites you to a concert, but you are working that evening. Choose a natural refusal."
options = ["No. That sounds bad.", "Thanks for asking, but I’m working that evening. Could we meet next week instead?", "I do not want to answer.", "You should choose a different concert."]
explanation = "The response thanks the person, declines briefly and suggests another occasion."

[questions.cefr-b1-x033]
prompt = "You did not understand a detail in an online meeting. What is the clearest request?"
options = ["Could you clarify what you mean by “shared access”?", "Why are you speaking like that?", "I heard everything.", "Let us ignore that detail."]
explanation = "Asking the speaker to repeat or clarify one specific point prevents misunderstanding."

[questions.cefr-b1-x034]
prompt = "Select the responses that handle a complaint constructively."
options = ["I’m sorry the room was not ready. I’ll contact reception now.", "You probably arrived too early.", "I understand why the delay was frustrating. When did you check in?", "That is not a real problem.", "Let me confirm the booking and update you in ten minutes."]
explanation = "The correct responses acknowledge or apologise, ask for details and offer action; blaming or dismissing the person is unhelpful."

[questions.cefr-b1-x035]
prompt = "Which phrases support clear, respectful online interaction?"
options = ["Could you clarify what “urgent” means in this case?", "That is a stupid suggestion.", "I agree with the goal, although I see one risk.", "Let me summarise what we have agreed so far.", "Nobody asked for your opinion."]
explanation = "Restating an idea, inviting others and paraphrasing neutrally help keep an online exchange cooperative."

[questions.cefr-b1-x036]
prompt = "A colleague has misunderstood a meeting time. Select the actions that could mediate the disagreement fairly."
options = ["Ask each person to explain what time they understood.", "Say that the more senior colleague must be right.", "Restate both accounts without blaming either person.", "Check the written invitation together.", "Tell them to stop discussing it."]
explanation = "A mediator checks the schedule, listens to both people and summarises agreement instead of taking sides."

[questions.cefr-b1-x037]
prompt = "Complete the polite requests.\n\n1. Could you {{blank}} me through to the course office?\n2. Would you mind {{blank}} that last point again?\n3. Could you tell me {{blank}} the meeting starts?"
explanation = "Put someone through, mind + -ing and an indirect question with when are the correct patterns."

[questions.cefr-b1-x038]
prompt = "Complete the invitation and responses.\n\n1. Would you like {{blank}} us for lunch on Friday?\n2. Thanks for inviting me, but I {{blank}} already made plans.\n3. I’d love to come. What time should I {{blank}} there?"
explanation = "Would like takes to + infinitive; the present perfect uses have; be there is the natural phrase."

[questions.cefr-b1-x039]
prompt = "Complete the suggestions and clarification phrases.\n\n1. How about {{blank}} the call until everyone is available? (move)\n2. I see your point. {{blank}}, could we check the cost first?\n3. When you say “flexible”, do you {{blank}} we can change the date?"
explanation = "How about takes an -ing form; however signals a contrast; mean asks about the intended meaning."

[questions.cefr-b1-x040]
prompt = "Complete the neutral summary.\n\nA: “I need the room by 9:00.”\nB: “I can open it at 8:30.”\n\nSo, you need the room by {{blank}}, and it can be opened at {{blank}}."
explanation = "The summary should preserve both times without adding a new conclusion."

[questions.cefr-b1-x041]
prompt = "Write a short reply in a team chat. A colleague says a training link does not work. Acknowledge the problem, ask one clarifying question and offer a next step."
keywords = [["sorry", "understand"], ["which browser", "what browser"], ["send", "check", "share"]]
model_answer = "I’m sorry the training link is not working. Which browser are you using? Please send me a screenshot, and I’ll check the access settings."
explanation = "The model acknowledges the problem, asks for clarification and offers a next step; keywords do not assess overall politeness or grammar."

[questions.cefr-b1-x042]
prompt = "Read the notice: “The library will close at 4 p.m. on Thursday for electrical work. Books can be returned in the outside box.” What should visitors do if they need to return a book after 4 p.m.?"
options = ["Use the outside return box.", "Wait inside until the library reopens.", "Return it to the electrical team.", "Take the book to the town hall."]
explanation = "The notice says the outside return box can still be used after closing."

[questions.cefr-b1-x043]
prompt = "Read the email: “Could you send the final attendee list by noon? We need it to print name badges before the workshop.” Why does the writer need the list?"
options = ["To book a larger room.", "To print name badges before the workshop.", "To cancel the event.", "To update the website."]
explanation = "The second sentence directly states the purpose: printing badges before the workshop."

[questions.cefr-b1-x044]
prompt = "A review says, “The app is easy to use, although it takes a long time to load on older phones.” What is the reviewer’s overall view?"
options = ["Completely negative.", "Balanced, with a strength and a limitation.", "Uncertain about what the app does.", "Only focused on the price."]
explanation = "The writer gives one strength and one limitation, so the view is balanced."

[questions.cefr-b1-x045]
prompt = "Which sentence is a fact rather than an opinion?"
options = ["The course has six evening sessions.", "The course is the most enjoyable in town.", "The teacher is probably too strict.", "Evening classes are always better."]
explanation = "“The course has six evening sessions” can be verified; the other options express opinions."

[questions.cefr-b1-x046]
prompt = "Choose the best order for a short paragraph about joining a new class."
options = ["I met two helpful classmates. I joined a cooking class last month. Now I feel more confident in the kitchen.", "I joined a cooking class last month. I met two helpful classmates there. Now I feel more confident in the kitchen.", "Now I feel more confident. I met two classmates. I joined a class.", "I met two classmates. Now I joined a class last month. I feel cooking."]
explanation = "A paragraph should introduce its topic, give a specific experience and end with a result or reflection."

[questions.cefr-b1-x047]
prompt = "Read the message: “The evening course starts on 12 September, meets every Tuesday, and costs £90. Students should bring a notebook. The first lesson is in Room 4.” Select all details stated in the message."
options = ["It starts on 12 September.", "It meets every Tuesday.", "It costs £90.", "It lasts for twelve weeks.", "The first lesson is in Room 4."]
explanation = "The selected answers are stated in the message; the number of sessions is not given."

[questions.cefr-b1-x048]
prompt = "Select the sentences suitable for a polite formal email asking about a course."
options = ["Dear Ms Ahmed,", "Hey, tell me the price now.", "Could you please let me know whether places are still available?", "Send the timetable today.", "I look forward to hearing from you."]
explanation = "Suitable options use a greeting, a polite request and a closing; slang and blunt commands are inappropriate."

[questions.cefr-b1-x049]
prompt = "Read the paragraph: “The town opened a weekend market in May. Local farmers sell fruit there, and a family bakery offers fresh bread. The market closes at 2 p.m.” Which statements are supported?"
options = ["The market opened in May.", "Farmers sell fruit there.", "A family bakery sells bread.", "The market closes at 5 p.m.", "The market is open every weekday."]
explanation = "Select only facts in the paragraph; do not infer daily opening or vegetable sales."

[questions.cefr-b1-x050]
prompt = "Complete the email with linking words.\n\n{{blank}} (firstly), I would like to ask about the evening course. I work until six. {{blank}} (therefore), I need to know whether the class begins later. {{blank}} (in addition), please send me the fee information."
explanation = "Firstly introduces the first point; therefore gives a result of the work schedule; in addition adds another request."

[questions.cefr-b1-x051]
prompt = "Complete the formal email closing.\n\nDear Mr Lee,\nThank you for explaining the application process. I will send the completed form tomorrow.\nYours {{blank}},\nMai Tran"
explanation = "When the recipient is named in Dear Mr Lee, Yours sincerely is an appropriate closing."

[questions.cefr-b1-x052]
prompt = "Complete the summary using details from the notice.\n\n“On Saturday, the museum opens at 10 a.m. The guided tour begins at 11:30 and lasts one hour. Visitors should book online.”\n\nThe museum opens at {{blank}}. The tour starts at {{blank}} and lasts {{blank}}."
explanation = "The summary preserves the three main details stated in the notice."

[questions.cefr-b1-x053]
prompt = "Complete the instructions for a new online class.\n\n{{blank}} (first), open the invitation email. {{blank}} (then), select the meeting link. {{blank}} (finally), check that your microphone is muted."
explanation = "The linkers organise the steps in sequence without changing their order."

[questions.cefr-b1-x054]
prompt = "Rewrite the information in a neutral summary.\n\n“Some students prefer online lessons because they save travel time. Others prefer the classroom because they can ask questions immediately.”\n\nThe text describes two views: some students value the time saved by online lessons, while others prefer {{blank}} interaction."
explanation = "The summary preserves both views and uses a broad phrase instead of repeating the full sentence."

[questions.cefr-b1-x055]
prompt = "Write a short email to a course organiser (about 60–80 words). Explain which session you want to join, give one reason, and ask one polite question about preparation."
keywords = [["session", "class"], ["because", "reason"], ["could you", "would you"]]
model_answer = "Dear Course Organiser, I would like to join the Tuesday session because it fits my work schedule. Could you tell me whether I need to bring any materials? Thank you for your help. Kind regards, Mai."
explanation = "The essay is checked for key ideas; a teacher should also review register, clarity and grammar."
