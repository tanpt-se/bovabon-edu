[questions.react-dv019]
prompt = "Which differences can make server markup and the client’s first render disagree? (Select all that apply.)"
options = ["Different `Date.now()` results", "Random values generated independently", "Different locale or timezone formatting", "A deterministic constant used on both sides", "Branching on browser-only data such as `window`"]
explanation = "Nondeterministic values, locale/timezone differences, and browser-only branches can produce mismatched initial output."

[questions.react-dv020]
prompt = "Choose the correct descriptions of server rendering APIs. (Select all that apply.)"
options = ["`renderToString` produces a string and does not stream", "`renderToPipeableStream` targets Node streams", "`renderToReadableStream` uses Web Streams", "`createRoot` hydrates existing server HTML", "`hydrateRoot` attaches to server-rendered markup"]
explanation = "The rendering API should match whether markup is streamed and the runtime environment; `createRoot` is client rendering, not hydration."

[questions.react-dv021]
prompt = "To hydrate server markup, call `{{blank}}(container, <App />)`."

[questions.react-dv022]
prompt = "Explain common causes of hydration mismatch and the order you would use to investigate an SSR application."
keywords = [["server", "client"], ["match", "same", "identical"], ["date", "random", "locale", "timezone", "browser"], ["deterministic", "initial render"]]
model_answer = "Hydration requires the server markup and the client’s first render to match. I would compare the two sides’ input data and props, then look for nondeterministic values such as `Date.now()`, random values, locale/timezone formatting, or branches that read browser APIs. Next I would inspect the HTML parsed by the browser and make the initial output deterministic across environments."
explanation = "The answer connects the matching requirement to environment-dependent causes and a systematic investigation order."

[questions.react-lv004]
prompt = "A four-person team has a two-week deadline to build a dashboard that calls about 30 endpoints. It needs cached data when returning to an old screen, refetching when the tab regains focus, retries on network errors, and deduplication of identical requests. Everyone has written `useEffect` + `fetch` before. What would you choose?"
options = ["Write a `useFetch` hook with `useEffect`, then gradually add caching, retries, and deduplication", "Use a server-state library with caching, deduplication, retries, and refetching built in, and standardize query-key conventions", "Put every response in a global store with a manually maintained reducer and actions", "Rewrite the application with React Server Components to avoid needing client-side caching"]
explanation = "All four requirements are standard query-library features. Reimplementing them in two weeks with four people costs time and risks race-condition bugs. A manual store still requires cache and invalidation logic. RSC is a major architectural change, too risky for the deadline, and does not solve refetching on focus."

[questions.react-lv005]
prompt = "You are choosing a rendering strategy for an **internal tool behind sign-in**, with 200 users, no SEO needs, and a three-person SPA team. Which statements are reasonable? (Select all that apply.)"
options = ["CSR served through a CDN is a reasonable starting point because it is simple and inexpensive to operate", "Implement SSR streaming immediately as a precaution, because SSR is always faster", "Compare the operating cost of server rendering (scaling, caching, hydration errors) with its actual benefit, which is small here", "You can move to SSR/RSC later if measurements show poor LCP, so prefer the option that is easy to reverse", "SEO makes SSR mandatory for every application"]
explanation = "With no SEO, few users, and a small team, CSR reduces cost and complexity; prefer the option that is cheap to reverse. SSR is not “always faster” (it adds TTFB and server load), and SEO does not apply to a signed-in page."

[questions.react-lv006]
prompt = "A home page has six independent widgets (news, charts, notifications, and so on). A render error in one widget currently blanks the whole page. You want to reduce the impact without adding much code. What is the most reasonable approach?"
options = ["Add only one error boundary at the application root with a generic error page", "Wrap each widget in an error boundary with fallback UI and a retry button, report errors to monitoring, and keep a root boundary as well", "Wrap every function in `try/catch` to catch render errors", "Use `window.onerror` to reload the page when an error occurs"]
explanation = "Boundaries around regions limit the error’s blast radius: a broken widget affects only itself, while the rest of the page remains usable. A single root boundary can still blank the page. `try/catch` in a component body does not catch errors thrown while its children render; automatic reloads hide incidents and may create loops."

[questions.react-lv007]
prompt = "A teammate proposes micro-frontends for an application with eight developers across two teams, one repository and deployment pipeline, weekly releases, and a four-minute build. What should you do?"
options = ["Adopt micro-frontends immediately so teams can be “independent”", "Keep one app in the monorepo, split it by route/feature with clear module boundaries (and import lint rules), and consider micro-frontends only when multiple teams truly need independent deployments", "Move each page into its own repository", "Use an iframe for every part to isolate everything"]
explanation = "Micro-frontends offer deployment independence at the cost of complexity: shared dependencies, inconsistent experiences, cross-app routing/state, and more infrastructure. With eight developers, one pipeline, and a fast build, the benefit is close to zero. Module boundaries in a monorepo provide much of the value at lower cost."

[questions.react-lv008]
prompt = "A React 18 app has over 200 components, weekly releases, and six weeks for a React 19 upgrade without disrupting the product. Which plan is safest?"
options = ["Freeze features for six weeks, upgrade everything at once, then release", "Move to the latest React 18 first, resolve deprecation warnings, run the official codemod, upgrade incrementally with tests and canary/feature flags, and prepare a rollback plan", "Ignore warnings and upgrade directly; fix issues when users report them", "Stay on React 18 because it “works,” and never upgrade"]
explanation = "Addressing warnings on React 18 separates risks: deprecated API removals are handled before the major-version change. Incremental upgrades and rollback preserve the release cadence. A big-bang upgrade concentrates risk, while an unprepared upgrade makes users the testers; never upgrading accumulates debt and misses fixes."

[questions.react-lv009]
prompt = "A five-person team’s CI pipeline takes 40 minutes because of 120 E2E tests, many of them flaky; developers have started rerunning tests until they pass. What should you do?"
options = ["Increase automatic retries to five so the pipeline always turns green", "Keep E2E tests for roughly 10–15 critical flows, move the rest to cheaper component/integration behavior tests, isolate and fix or remove flaky tests, and run tests in parallel", "Delete all E2E tests and use only unit tests", "Run E2E tests manually only before releases"]
explanation = "Restore trust in CI with a small, stable E2E suite for critical flows and cheaper test levels for the rest. Retries hide real failures; removing all E2E tests loses protection for important flows, while manual runs are slow and not repeatable."

[questions.react-lv010]
prompt = "You want to make performance a frontend team KPI. Which actions are reasonable? (Select all that apply.)"
options = ["Set a performance budget (bundle size, LCP/INP targets) and have CI warn or block when it is exceeded", "Measure real user data (RUM) alongside lab metrics such as Lighthouse", "Require every component to use `memo` “just in case”", "Prioritize fixes by pages/flows with the most traffic and greatest revenue impact", "Run Lighthouse only on a powerful developer machine and treat its result as ground truth"]
explanation = "CI budgets make performance an acceptance criterion; RUM reflects real devices and networks; prioritization should follow impact. Blanket `memo` adds comparison work without evidence, while measurements from a powerful machine can misrepresent user experience."

[questions.react-lv011]
prompt = "A team has moved to a global store and is putting everything in it: modal open/closed state, form input text, and API data. Screens rerender frequently, and every PR touches the store. What is the most reasonable fix?"
options = ["Switch to a different, faster global store", "Classify state: use a cache library for server data, keep UI/form state local (`useState`), and store globally only what is truly shared across distant areas", "Wrap every selector in `useMemo` to reduce rerenders", "Split the store into 30 smaller stores but keep every kind of state there"]
explanation = "The root problem is mixing three kinds of state with different lifecycles. Switching tools or splitting the store does not fix misplaced state. Keeping state near its consumers reduces both rerenders and review conflicts."

[questions.react-lv012]
prompt = "You are writing an ADR for the decision “choose a form library for the whole company.” Which sections should it include? (Select all that apply.)"
options = ["Context and constraints (number of teams, form types, accessibility requirements, performance)", "Alternatives considered, including keeping the current approach, and why options were rejected", "Consequences and accepted risks, plus how to reverse the decision if it proves wrong", "Names of people who voted against it so everyone knows", "When or by what metric the decision should be reviewed"]
explanation = "An ADR records reasoning and trade-offs; it is not a political record. Include context, alternatives, consequences/reversal path, and review conditions so future readers can judge whether the decision still holds."

[questions.react-lv013]
prompt = "A five-year-old codebase has hundreds of hand-written `useMemo`/`useCallback` calls and a few components that violate the Rules of React. You want to try React Compiler without causing regressions. What is a reasonable approach?"
options = ["Enable the compiler across the whole codebase and remove every `useMemo`/`useCallback` in the same PR", "Opt in with `compilationMode: 'annotation'` and the `\"use memo\"` directive, or enable it folder by folder; use compiler lint to find violations, keep existing memoization, measure performance, and expand gradually", "Never use the compiler because it is experimental", "Enable it only in production so real users can test it"]
explanation = "The compiler assumes code follows the Rules of React; gradual rollout surfaces violations early and lets you measure impact. Removing existing memoization wholesale may change behavior (it may stabilize an Effect dependency). Testing directly in production transfers risk to users."

[questions.react-lv014]
prompt = "Every PR has debate about Hook style (missing dependencies, Effects syncing derived state, and so on). Reviews drag on, and new teammates hesitate to comment. What is the most effective way to reduce friction?"
options = ["Review every PR yourself and make the final decision", "Encode conventions in tools: ESLint (`react-hooks` and compiler rules), component/Hook templates, and short “how we work” docs; let reviewers focus on design and risk", "Ban custom Hooks", "Hold a team vote on every convention each week"]
explanation = "Automated conventions do not depend on a particular reviewer and give immediate, consistent feedback to new teammates. One person reviewing everything is a bottleneck; banning custom Hooks loses reuse, and weekly votes are slow and unenforceable."

[questions.react-lv015]
prompt = "An SSR product page loads its main information from a database in 80 ms, while its “recommendations” block calls an ML service that sometimes takes 2 seconds. TTFB/LCP is poor because the page waits for recommendations. You have one sprint. What is the most reasonable option?"
options = ["Cache recommendations on a CDN for one hour for every user", "Wrap recommendations in `Suspense` with a skeleton so the main content can stream first, and set a timeout/fallback for the ML service", "Remove recommendations from the page", "Switch the entire page to CSR to avoid waiting on the server"]
explanation = "Streaming with Suspense takes the slow block off the critical path, so LCP no longer depends on the ML service; it is a small change for one sprint. A shared one-hour cache loses personalization, removing the block loses business value, and CSR often worsens LCP."

[questions.react-lv016]
prompt = "With `compilationMode: 'annotation'`, React Compiler compiles only functions with a directive. Complete the opt-in for a component:\n\n```jsx\nfunction Cart({ items }) {\n  \"use {{blank}}\";\n  const total = items.reduce((sum, i) => sum + i.price, 0);\n  return <p>{total}</p>;\n}\n```"
explanation = "The `\"use memo\"` directive marks a function for compiler optimization in annotation mode, allowing a gradual component-by-component rollout instead of enabling it across the whole codebase."

[questions.react-lv017]
prompt = "You are leading a six-person team building a new React app. Explain how you would classify and manage state (server state, client state, URL, and form state), why, and what you would **not** do."
keywords = [["server state", "API data", "cache"], ["local", "useState", "near its consumers"], ["URL", "search params", "router"], ["global store", "global", "Context"]]
model_answer = "I classify state by lifecycle. Server state (API data) belongs in a caching library with deduplication, retries, and invalidation instead of a custom `useEffect`. UI and form state should be local, using `useState`/`useReducer` in the component closest to where it is used. Shareable or deep-linkable state, such as filters and the current page, belongs in the URL (search params). Use Context or a small global store only when state is genuinely shared across distant areas. I would not put everything in one global store, which broadens rerenders, complicates reviews, and requires custom caching/invalidation. Record query-key conventions and lint rules in an ADR for the team."
explanation = "Key ideas: classify by lifecycle, keep state as low as possible, use the URL for shareable state, and use a global store only with a clear reason."

[questions.react-lv018]
prompt = "A large React app needs to replace its core UI library across hundreds of screens, while the product continues weekly releases. Describe a migration plan, how you would reduce risk, and how you would measure progress."
keywords = [["incrementally", "gradually", "strangler", "screen by screen"], ["feature flag", "canary", "rollout"], ["rollback", "revert", "fallback plan"], ["codemod", "automation", "lint", "adapter", "wrapper", "compatibility"], ["measure", "metric", "progress", "dashboard", "rate"]]
model_answer = "I would migrate incrementally: create an adapter/wrapper so both libraries can coexist, use a codemod for mechanical changes, and add a lint rule preventing new imports of the old library. Release important screens behind a feature flag or canary to a subset of users, with a rollback path by disabling the flag. Track progress on a dashboard using the number of old-library imports and migrated screens, and monitor errors and Web Vitals before and after to catch regressions early."
explanation = "A strong answer covers incremental migration, risk reduction through flags/canaries and rollback, automation for mechanical work, and measurable progress."

[questions.react-lvc01]
title = "Percentage-based User Feature Flag"
prompt = "You are gradually rolling out a new React feature (5% → 25% → 100%). Implement `isEnabled(flag, userId, percent)`:\n\n- Return `true` when a user belongs to the enabled group, **consistently**: the same `flag` and `userId` must always produce the same result.\n- Hash the string `` `${flag}:${userId}` `` to a non-negative integer (hint: FNV-1a 32-bit), then use `% 100` as the bucket; enable when `bucket < percent`.\n- `percent <= 0` always returns `false`; `percent >= 100` always returns `true`.\n- Increasing `percent` should only **add** users, never disable users already enabled."
hints = ["FNV-1a: start at `2166136261`; for each character use `h ^= code; h = Math.imul(h, 16777619)`, then finish with `h >>> 0`.", "The `bucket < percent` threshold makes groups nested, so raising the percentage never removes users."]
explanation = "A stable hash gives each user a consistent experience across loads and devices. Include the flag name in the hash input so different flags do not always select the same group."

[questions.react-lvc02]
title = "Query Cache: Deduplication and staleTime"
prompt = "Model the core of a server-state library. Implement `createQueryCache({ now })` returning `{ fetchQuery, invalidate }`:\n\n- `fetchQuery(key, fetcher, { staleTime = 0 } = {})` returns a Promise for the data.\n- If cached data exists and `now() - fetchedAt < staleTime`, return the cached data without calling `fetcher`.\n- If a request for the same `key` is already pending, reuse that Promise (deduplicate); call `fetcher` only once.\n- Do not cache errors or leave a request stuck; a later call should invoke `fetcher` again.\n- `invalidate(key)` removes the cached data for that key.\n- `now` returns the current time (default `Date.now`) so tests can control the clock."
hints = ["Use two `Map` objects: `entries` for completed data and `inflight` for pending Promises.", "Remove the entry from `inflight` on both success and failure."]
explanation = "This is the core of what query libraries provide: cache by key, deduplicate identical requests, honor a freshness window, and avoid caching errors. Understanding it helps a lead explain why the team should not rebuild it inside `useEffect`."

[questions.react-lvc03]
title = "Performance Budget Check in CI"
prompt = "Implement `checkBudget(metrics, budget)` so CI can block a PR that worsens performance.\n\n- `metrics` and `budget` are objects of `{ name: number }`, for example `{ lcp: 2300, bundleKb: 180 }` and `{ lcp: 2500, bundleKb: 170 }`.\n- For each name in `budget`, if `metrics[name]` is **greater than** its limit, report `{ metric, actual, limit }`.\n- If `metrics` has no such name (`undefined`), report a violation with `actual: null` (a missing measurement is also a failure).\n- A value equal to the limit passes.\n- Return `{ ok, violations }`; `ok` is `true` when there are no violations. Sort `violations` by `metric` in ascending order."
hints = ["Iterate over `Object.keys(budget)`, not over `metrics`.", "Distinguish `undefined` (not measured) from `0` (a valid value)."]
explanation = "A performance budget makes performance goals an automated CI criterion. Treating missing measurements as failures avoids a green pipeline when measurement tooling is broken."
