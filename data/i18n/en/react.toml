[modules]

[modules.react-basics]
title = "JSX & Components"
description = "How JSX is transformed, function components, props, children, conditional rendering, lists, and keys."
lesson = "### JSX, components, and lists\nJSX describes React elements. Modern JSX transforms compile it into calls such as `jsx(...)`, while the classic runtime uses `React.createElement(...)`. A component is a capitalized function that receives props and returns elements. Props are read-only; use a Fragment to group nodes without adding DOM.\n\n| Situation | Approach | Reason |\n|---|---|---|\n| A list can change order | `key={item.id}` | React preserves each row's identity and state |\n| A condition uses a count | `items.length > 0 && <List />` | `0 && ...` renders the number zero |\n| DOM attributes | `className`, `htmlFor`, `onClick` | Names follow the React DOM API |\n\n```jsx\nfunction TodoList({ items }) {\n  return <ul>{items.map(item => <li key={item.id}>{item.text}</li>)}</ul>;\n}\n```\n\n### Common mistakes\n- Using `key={index}` for a list that can be inserted into, deleted from, or reordered, which can attach row state to the wrong item.\n- Lowercasing component names or mutating props.\n- Using `condition && node` when the condition can be `0`.\n\n### Interview checklist\n- Does JSX create DOM nodes immediately, or describe elements?\n- In what scope must `key` be unique, and why is it not an ordinary prop?\n- When is the short `<>` Fragment syntax insufficient because a `key` is needed?"

[modules.react-state]
title = "State, Props & Events"
description = "useState, immutable updates, batching, lifting state up, and controlled versus uncontrolled inputs."
lesson = "### State is a snapshot\n`useState` returns the value for the current render. Calling a setter schedules another render; it does not change the variable in the current closure. If a new value depends on the previous one, use an updater function. Replace state objects and arrays instead of mutating them.\n\n| Update | Example | Note |\n|---|---|---|\n| Independent value | `setOpen(true)` | Pass a value directly |\n| Based on previous state | `setCount(c => c + 1)` | Safe for several updates in one event |\n| Object/array | `setUser(u => ({ ...u, name }))` | Do not mutate the old object |\n| Shared by several places | Move state to the nearest common parent | Keep one source of truth |\n\n```jsx\nfunction addItem(item) {\n  setItems(current => [...current, item]);\n}\n```\n\nReact 18+ automatically batches multiple updates in the same processing turn. `useState(() => expensive())` uses a lazy initializer and avoids repeating the initialization calculation on every render.\n\n### Common mistakes\n- Calling `setCount(count + 1)` repeatedly in one handler and expecting each call to read a new snapshot.\n- Mutating with `items.push(item)` and passing the same array back.\n- Keeping duplicate copies of the same data in parent and child state.\n- Using a controlled input (`value`) without updating state in `onChange`.\n\n### Interview checklist\n- Why does a setter not change the state variable in the current handler?\n- When should you choose local state, lifting state up, controlled, or uncontrolled inputs?\n- How do you update one array item without mutation?"

[modules.react-hooks]
title = "Hooks"
description = "useEffect, useRef, useMemo, useCallback, useReducer, useContext, custom Hooks, and the Rules of Hooks."
lesson = "### Rules of Hooks\n1. Call Hooks only at the **top level** (not inside conditions, loops, or nested functions).\n2. Call Hooks only from a **function component** or a **custom Hook** (whose name starts with `use`).\n\n### Choose a Hook by purpose\n| Hook | Use it to | Do not use it to |\n|---|---|---|\n| `useEffect` | Synchronize a subscription, timer, or external system | Calculate data already derivable during render |\n| `useRef` | Keep a mutable value that does not require a render | Store UI data that must be displayed |\n| `useMemo` / `useCallback` | Cache a value or function for a measured reason | Make code correct |\n| `useReducer` | Handle several actions that update related state | Put all state in one object |\n| `useContext` | Read shared data through a component tree | Replace every kind of state management |\n\n```jsx\nuseEffect(() => {\n  const connection = connect(roomId);\n  return () => connection.disconnect();\n}, [roomId]);\n```\n\nAn Effect without a dependency list runs after every render; `[]` means there are no reactive dependencies. Cleanup runs before the next setup and on unmount. Strict Mode adds a setup-cleanup cycle in development to expose missing cleanup.\n\n### Common mistakes\n- Calling a Hook conditionally, which changes the Hook order.\n- Omitting a dependency so a callback reads stale state.\n- Using an Effect to synchronize two state values that can be derived from one another.\n- Adding memoization before measuring a render problem.\n\n### Interview checklist\n- Where does each Effect dependency come from?\n- Which resource created by setup must cleanup undo?\n- Could the value be calculated during render or handled in an event handler instead of an Effect?\n\nThe code exercises in this module use MiniReact with `useState`, `useEffect`, `useRef`, `useMemo`, `useCallback`, `useReducer`, `renderHook`, and `act`."

[modules.react-perf]
title = "Rendering & Performance"
description = "Rendering, reconciliation, profiling, memoization, transitions, and code splitting."
lesson = "### Rendering and optimization\nA component may render again when its state or a context it reads changes, or when its parent renders. A render does not mean the DOM is replaced wholesale; React compares element trees and commits the necessary differences.\n\n| Tool | Effect | Consideration |\n|---|---|---|\n| `React.memo` | Skips rendering when props are shallowly equal | New objects/functions still count as changed props |\n| `useMemo` | Caches a calculation result | Add it when the calculation or identity matters |\n| `useCallback` | Preserves a function identity | Often paired with a memoized component |\n| `useTransition` | Marks an update as non-urgent | Does not run CPU-heavy work in the background |\n| `lazy` + `Suspense` | Loads a component when needed | Choose a useful boundary and fallback |\n\n```jsx\nconst visible = useMemo(\n  () => todos.filter(todo => todo.title.includes(query)),\n  [todos, query]\n);\n```\n\nStable keys help reconciliation preserve identity after reordering. Profile and measure user flows before optimizing; React Compiler may memoize automatically when configured for compatible code.\n\n### Common mistakes\n- Expecting `React.memo` to block updates from context or the component's own state.\n- Creating a new dependency object on every render and invalidating a cache.\n- Using an index as a key in a list that can change order.\n- Wrapping every callback in `useCallback` without a measured benefit.\n\n### Interview checklist\n- Which render is actually expensive according to the Profiler?\n- Which identity changes and causes an unnecessary child render?\n- Could you split a component/state or defer code loading before adding memoization?"

[modules.react-patterns]
title = "Patterns & Ecosystem"
description = "Composition, Context, Error Boundaries, portals, Suspense, testing, and React ecosystem boundaries."
lesson = "### Patterns and boundaries\n| Pattern | Use it when | Remember |\n|---|---|---|\n| Composition with `children` | Separating a layout from its content | Usually more flexible than many boolean props |\n| Context | Sharing a theme, locale, or tree-wide data | Consumers rerender when the value changes |\n| Error Boundary | Recovering when a rendered child throws | Does not catch ordinary event-handler errors |\n| Portal | A modal or tooltip must escape an overflow region | React events still bubble through the React tree |\n| Suspense / `lazy` | Loading code or data with Suspense support | Place boundaries where the fallback is useful |\n\n```jsx\nfunction Panel({ title, children }) {\n  return <section><h2>{title}</h2>{children}</section>;\n}\n```\n\nReact 19 adds Actions, `useActionState`, `useOptimistic`, `use(promise)`, and support for `ref` as a prop. Server and Client Components have a module boundary: `'use client'` creates a client boundary, while `'use server'` marks a Server Function.\n\n### Common mistakes\n- Using Context for all data, causing many consumers to rerender together.\n- Expecting an Error Boundary to catch errors in a click callback or any promise.\n- Assuming a portal removes events from the React tree.\n- Testing DOM structure in detail instead of querying by role and accessible name.\n\n### Interview checklist\n- Why is composition often preferable to boolean props or inheritance?\n- Which errors does an Error Boundary cover, and which need separate handling?\n- How should a portal modal manage focus, Escape-to-close, and accessibility state?"

[modules.react-19]
title = "React 19: Actions & Compiler"
description = "React 19 Actions, form status, optimistic UI, the use API, refs as props, and compiler setup."
lesson = "### React 19 APIs\n| API | Role | Remember |\n|---|---|---|\n| `useActionState` | Connects an action to result state and pending status | The action receives previous state and input |\n| `useOptimistic` | Shows a temporary result while an action is running | Final UI must still reflect the authoritative result |\n| `useFormStatus` | Reads the parent form's status in a child component | The Hook must be below `<form>` |\n| `use(value)` | Reads a Promise or Context during render | A pending Promise may activate Suspense |\n\n```jsx\nfunction SubmitButton() {\n  const { pending } = useFormStatus();\n  return <button disabled={pending}>{pending ? 'Saving' : 'Save'}</button>;\n}\n```\n\nReact 19 lets function components receive `ref` as a prop; `forwardRef` remains common in older code. React DOM can hoist `<title>` and some `<meta>` elements from components into the document. React Compiler can memoize compatible code automatically, but the build must enable and configure the compiler.\n\n### Common mistakes\n- Calling `useFormStatus` in the component that owns `<form>` instead of a child.\n- Creating a new Promise on every render and passing it to `use()`.\n- Assuming `useOptimistic` replaces saving a successful server result.\n- Assuming every project enables React Compiler by default.\n\n### Interview checklist\n- Which arguments does an Action receive, and where does pending state come from?\n- When might optimistic state need to roll back?\n- How does `use()` differ from an ordinary Hook?"

[modules.react-server]
title = "Server Components & Streaming"
description = "Choosing where components run, client boundaries, Suspense streaming, and hydration."
lesson = "### Choose where a component runs\n| Kind | Can use state/effects? | Is component JavaScript sent to the browser? |\n|---|---|---|\n| Server Component | No client Hooks | Its component implementation is not sent |\n| Client Component | Yes, across a `'use client'` boundary | Yes |\n| Server Function | Runs on the server when called | The client receives a reference it can call |\n\n`'use client'` goes at the top of a module and creates a boundary for client-side imports. Props crossing that boundary must be serializable. `'use server'` marks a Server Function; it does not turn a component into a Server Component.\n\n```jsx\n// Server Component\nexport default async function Page() {\n  const user = await loadUser();\n  return <Profile name={user.name} />;\n}\n```\n\nSuspense lets a framework stream ready content while a slow part displays a fallback. Hydration attaches client events and state to server-rendered HTML; the initial server and client output must match.\n\n### Common mistakes\n- Importing browser APIs or calling `useState` in a Server Component.\n- Passing an ordinary callback/function through server-to-client props.\n- Treating `'use server'` as equivalent to `'use client'`.\n- Rendering `Date.now()`, random values, or browser-dependent data differently on the first render.\n\n### Interview checklist\n- Across which imported modules does a `'use client'` boundary extend?\n- Where in the tree does Suspense help streaming?\n- What causes a hydration mismatch, and in what order would you investigate it?"

[modules.react-effects]
title = "Effects & Synchronization"
description = "Deciding when an Effect is needed, cleanup, subscriptions, async races, and external systems."
lesson = "### Do you really need an Effect?\n| Need | Preferred approach |\n|---|---|\n| Calculate a value from props/state | Calculate during render; memoize only if needed |\n| Respond to a user action | Handle it in the event handler |\n| Synchronize with a system outside React | Use `useEffect` with cleanup |\n| Measure layout before paint | Use `useLayoutEffect` only when necessary |\n\nEffects run after a commit. Their setup should synchronize with an external system, and cleanup should undo that setup before dependencies change or the component unmounts. Include every reactive value the Effect reads in its dependencies.\n\n```jsx\nuseEffect(() => {\n  const connection = connect(roomId);\n  return () => connection.disconnect();\n}, [roomId]);\n```\n\nFor asynchronous work, prevent an older response from overwriting a newer one: abort the request when supported or use a cleanup flag. Strict Mode's extra development setup cycle helps reveal Effects that cannot be safely repeated.\n\n### Common mistakes\n- Using an Effect to copy props into state or calculate a derived value.\n- Omitting dependencies to force an Effect to run once, creating stale closures.\n- Registering a subscription or timer without cleanup.\n- Allowing a slower, older request to overwrite newer results.\n\n### Interview checklist\n- What external system is this Effect synchronizing with?\n- Does cleanup fully undo setup?\n- How does the code handle dependency changes and asynchronous races?"

[modules.react-forms-a11y]
title = "Forms & Accessibility"
description = "Form state, validation, semantic controls, accessible names, keyboard interaction, and focus."
lesson = "### Forms and accessibility\nA form should communicate its purpose and errors through semantic HTML and accessible names. Associate each input with a visible label; expose help and validation messages to assistive technology, and move focus to an appropriate place after submission when errors need attention.\n\n| Need | Prefer | Check |\n|---|---|---|\n| Input label | `<label htmlFor=\"email\">` | The `id` matches and the label is visible |\n| Invalid field | `aria-invalid` and linked error text | Error is announced and specific |\n| Submit status | Text and disabled/pending state | Keyboard and screen reader users get feedback |\n| Custom control | Native control when possible | Keyboard, focus, and accessible name work |\n\n```jsx\n<label htmlFor=\"email\">Email</label>\n<input id=\"email\" type=\"email\" aria-describedby=\"email-error\" />\n<p id=\"email-error\">Enter a valid email address.</p>\n```\n\nKeep field values close to the form unless other regions genuinely share them. Validate on submit and, where useful, provide timely field feedback without making every keystroke disruptive.\n\n### Common mistakes\n- Using placeholder text as the only label.\n- Showing an error only by changing border color.\n- Building a custom control without keyboard and focus behavior.\n- Announcing every intermediate validation error in a distracting way.\n\n### Interview checklist\n- Does each control have a programmatic accessible name?\n- Can a keyboard user reach and operate it?\n- After invalid submission, can users identify and reach the first invalid field?"

[modules.react-testing-arch]
title = "Testing & Component Architecture"
description = "Testing user-visible behavior, state placement, composition, loading boundaries, and component structure."
lesson = "### Test behavior and keep state near its users\n| Concern | Approach | Benefit |\n|---|---|---|\n| User-facing control | Query by role and accessible name | Matches how users find controls |\n| State used in one region | Keep it near the owning component | Limits coupling and rerenders |\n| Data shared in a tree | Context | Consumers update when provider value changes |\n| Large subscription with selective updates | Store with selectors | Adds concepts and subscription machinery |\n\n```jsx\nconst Page = lazy(() => import('./Page'));\n<Suspense fallback={<p>Loading</p>}><Page /></Suspense>\n```\n\nTesting Library usually favors `getByRole('button', { name: 'Save' })`; use `findByRole` for asynchronous appearance. An Error Boundary can recover a failed render region; `lazy` splits a chunk and needs a Suspense boundary. Keeping state close to its consumers limits dependencies; lift it only when multiple regions truly need the same data.\n\n### Common mistakes\n- Querying by class or fragile DOM structure instead of role/name.\n- Lifting all state to the root or putting everything in Context from the start.\n- Assuming Context provides field-level subscriptions automatically.\n- Omitting a fallback while a lazy component loads.\n\n### Interview checklist\n- Could this state live lower while serving all consumers?\n- Does the test check user behavior or implementation details?\n- When is Context enough, and when is an external store with selectors useful?"

[modules.react-dv-rules]
title = "Rules of React & Linting"
description = "Why pure rendering, Hook order, immutability, and complete dependencies make React code reliable."
lesson = "### Why does React need these rules?\nReact needs components and Hooks that can be called again safely. During render, the same props, state, and context should produce the same result; rendering should not mutate external data, register listeners, or start side-effectful work. React may rerender, pause, or retry a branch, so pure rendering keeps the UI independent of how many times a function runs.\n\n| Rule | Good practice | Sign of a violation |\n|---|---|---|\n| Pure components | Derive JSX from props/state; handle actions in events | `Date.now()` changes displayed content between renders |\n| Correct Hook order | Call Hooks at the top of a component/custom Hook | Hook inside `if`, loop, or ordinary callback |\n| Immutability | Create a new array/object for updates | `push`, `sort`, or assigning to props/state fields |\n| Complete dependencies | Declare reactive values read by an Effect/Callback | Stale closure or missing-dependency lint warning |\n\n```jsx\nfunction addTodo(todos, todo) {\n  return [...todos, todo];\n}\n\nfunction TodoCount({ todos }) {\n  return <p>{todos.length} items</p>;\n}\n```\n\n`eslint-plugin-react-hooks` checks the Rules of Hooks, dependencies, immutability, and some risky state-update patterns. Fix the underlying diagnostic instead of disabling lint broadly; these rules also help React Compiler analyze code reliably.\n\n### Common mistakes\n- Calling a component as `Child(props)` instead of letting React render `<Child />`.\n- Calling `useState` only when a condition is true, changing Hook order between renders.\n- Sorting `props.items` in place and reusing the array.\n- Omitting a dependency to force an Effect not to rerun, leaving a stale callback.\n- Calling a setter during render to “fix” data, which can create a render loop."

[modules.react-dv-compiler]
title = "React Compiler"
description = "Build-time memoization, compiler configuration, lint diagnostics, and gradual adoption."
lesson = "### What does the compiler do?\nReact Compiler analyzes components and custom Hooks at build time and may cache reusable values or components. It is not a Hook that runs during render: code must remain correct without optimization, and component authors do not call a compiler API. The goal is to reduce repeated calculations or renders without changing the UI result.\n\n| Part | Role | Safe mental model |\n|---|---|---|\n| Compiler in the build | Analyzes code and adds memoization when eligible | Do not assume every component is compiled |\n| `eslint-plugin-react-hooks` | Reports patterns that block analysis or violate rules | Fix root causes instead of disabling lint broadly |\n| Configuration/gating | Chooses scope and compiler integration | Roll out gradually and watch results |\n| Directives | Control compilation in supported scopes | Use only for a concrete reason and known setup |\n\n```jsx\nfunction ProductList({ products, query }) {\n  const normalized = query.trim().toLowerCase();\n  const visible = products.filter(product => product.name.toLowerCase().includes(normalized));\n  return <List items={visible} />;\n}\n```\n\nThis function only reads its inputs and calculates a result; it is easier to analyze than code that mutates props or implicitly reads changing values. A project may retain `useMemo`/`useCallback` where measurement shows a benefit or identity is part of an integration. Check project configuration and lint output to see which code the compiler recognizes.\n\n### Common mistakes\n- Assuming React 19 enables the compiler automatically; it needs build integration.\n- Treating memoization as a correctness guarantee instead of an optimization that may be skipped.\n- Trying to compile code with render-time mutation or side effects instead of making it pure.\n- Deleting all manual memoization before checking configuration, profiling, and behavior.\n- Ignoring compiler/lint diagnostics and losing visibility into skipped code."

[modules.react-dv-ssr]
title = "SSR, Streaming & Hydration"
description = "Server HTML, hydration versus client rendering, streaming render APIs, and mismatch debugging."
lesson = "### Server HTML and React in the browser\nServer rendering creates initial HTML so the browser can show content early. For interactive HTML, the client calls `hydrateRoot` so React can attach events and manage the existing tree. If the page is rendered entirely on the client into an empty container, use `createRoot`. The initial client output must match the server markup; the two sides should not choose different values for the first render.\n\n| API | Purpose | Main property |\n|---|---|---|\n| `renderToString` | Produce an HTML string | Does not stream; more limited with Suspense |\n| `renderToPipeableStream` | Server runtime with Node streams | Sends the shell and content in chunks |\n| `renderToReadableStream` | Runtime with Web Streams | Also supports streaming via `ReadableStream` |\n| `prerender` | Produce static HTML after data is ready | Resolves after Suspense regions finish |\n| `hydrateRoot` | Hydrate existing server markup | The first client HTML must match the server |\n| `createRoot` | Render a client app into a container | Does not hydrate server-rendered markup |\n\nWith streaming, the server can send the page shell when ready and then send slower regions through Suspense. Choose an API for the server's stream environment and how the framework manages scripts/responses. Static prerendering is useful when HTML should wait for all data.\n\n### Common mistakes\n- Calling `createRoot` on a container with server HTML and bypassing hydration.\n- Using `Date.now()`, random values, browser data, or different locales in initial markup.\n- Assuming `renderToString` streams or handles all Suspense cases like streaming APIs.\n- Hiding a mismatch with `suppressHydrationWarning` instead of finding different server/client inputs.\n- Calling `hydrateRoot` repeatedly for one root instead of keeping the created root.\n\n### Debug in order\nCompare server data/props with the client's first-render inputs; check timezone/locale, random values, and branches that depend on `window`; inspect the HTML after the browser parses it; then use root error callbacks to collect suitable diagnostics."

[modules.react-lead]
title = "Tech Lead Perspective"
description = "Team-scale decisions about state architecture, boundaries and errors, rendering strategy, migrations, UI testing, performance budgets, reviews, and ADRs."
lesson = "### From “correct code” to “the right decision”\nA Tech Lead does not choose the theoretically best technology; they choose what best fits the constraints: team size, schedule, acceptable risk, operating cost, and existing skills. Record each decision briefly in an ADR so future teammates understand *why*, not just *what*.\n\n### Decision framework\n1. State the problem and hard constraints (deadline, traffic, SLA, budget, team size).\n2. List 2–3 realistic options, including “do nothing.”\n3. Compare operational complexity, reversibility, risk, learning curve, and performance.\n4. Choose the cheapest option to reverse unless risk requires early investment.\n5. Set a metric and a date to review the decision.\n\n### React comparison guide\n| Topic | Lighter option | Heavier option | Choose heavier when |\n|---|---|---|---|\n| Server state | Query library (cache, dedupe, retry) | Handwritten `useEffect` + store | Almost never worth rebuilding yourself |\n| Client state | `useState` + local Context | Global store | State is truly shared across distant areas |\n| Rendering | CSR + CDN | SSR/streaming/RSC | SEO, poor-network LCP, or server-personalized content |\n| Application split | Monorepo, one app with route chunks | Micro-frontends | Several teams truly need independent deployments |\n| UI tests | Behavior tests with Testing Library | Excessive snapshots/E2E | Reserve E2E for critical flows such as login/payment |\n| Render tuning | Profile and fix measured hotspots | `memo` everywhere | Measurements justify it; consider React Compiler |\n\n### React code review checklist\n- Is state placed at the lowest level that serves its consumers, and is any of it derived?\n- Does an Effect only synchronize with an external system? Does it clean up and handle races?\n- Do Suspense and Error Boundaries fit the user experience, so one widget failure does not blank the page?\n- Did the team measure before optimizing? Are bundle and Web Vitals budgets checked in CI?\n- Do tests check visible behavior rather than implementation details?\n\n### Short ADR example\n**Context:** Three teams, a 40-screen dashboard, slow APIs, and users often returning to earlier screens. **Decision:** use a query library for server state, `useState`/Context for UI state, and no global store. **Consequences:** less data-synchronization code (estimated 30–40%); query-key conventions must be agreed. **Review:** after two sprints, or when cross-page state cannot be cached naturally.\n\n### Team-scale anti-patterns\n- Choosing technology for resumes or trends instead of constraints.\n- Rewriting everything in a “big bang” instead of migrating behind feature flags.\n- Premature optimization: unmeasured `useMemo`/`useCallback` or excessive bundle splitting.\n- Keeping conventions in one person's head instead of lint rules, templates, and documentation.\n- Ignoring observability: no error tracking or real-user Web Vitals (RUM).\n- Reviewing style while missing architecture and security risks.\n\nFigures here are estimates for reasoning; replace them with measurements from the actual system."

[questions.react-001]
prompt = "With the **automatic JSX runtime** (React 17+), what does `<h1 className=\"t\">Hi</h1>` compile to?"
explanation = "Babel/TS/SWC transform JSX into a call to `jsx()` (from `react/jsx-runtime`), which returns a **React element**—an object describing UI, not a DOM node."

[questions.react-002]
prompt = "Why must a component name start with a **capital letter** in JSX (`<MyButton />`)?"
options = ["It is only a convention; lowercase works the same way", "JSX treats lowercase names as HTML/intrinsic elements (strings) and uppercase names as component variable references", "ESLint requires it", "React only exports capitalized components"]

[questions.react-003]
prompt = "What does this render when `messages = []`?\n\n```jsx\n<div>{messages.length && <Badge count={messages.length} />}</div>\n```"
options = ["Nothing", "The number `0`", "`false`", "A runtime error"]
explanation = "`0 && X` evaluates to `0`, and React **renders the number zero** (it skips only `false`, `null`, `undefined`, and `true`). Fix it with `messages.length > 0 && ...`."

[questions.react-004]
prompt = "What requirements should a list `key` satisfy?"
options = ["Be unique across the entire application", "Be unique among siblings and stable across renders", "Be an increasing integer", "Use `Math.random()` to guarantee uniqueness"]
explanation = "A key only needs to be unique among siblings. `Math.random()` changes the key on every render, causing React to unmount and remount everything, losing state and hurting performance."

[questions.react-005]
prompt = "Which attribute correctly sets a CSS class in JSX?"
options = ["`class`", "`className`", "`cssClass`", "`styleName`"]
explanation = "React uses `className` (corresponding to the DOM `element.className` property). Similarly, use `htmlFor` instead of `for`."

[questions.react-006]
prompt = "Which values render no visible content when placed in JSX as `{value}`? (Select all that apply.)"
explanation = "`null`, `undefined`, `true`, and `false` are skipped; an empty string creates an empty text node (nothing visible). `0` (and `NaN`) **is rendered**."

[questions.react-007]
prompt = "Complete the code so it returns multiple elements **without** adding a wrapper DOM element:\n\n```jsx\nfunction Row() {\n  return (\n    {{blank}}\n      <td>A</td>\n      <td>B</td>\n    {{blank}}\n  );\n}\n```"
explanation = "A Fragment groups `<>...</>` without creating a DOM node—important inside `<tr>`, where a `<div>` cannot be inserted."

[questions.react-008]
prompt = "Render the list with the correct key:\n\n```jsx\n<ul>\n  {todos.map(todo => <li {{blank}}={todo.id}>{todo.text}</li>)}\n</ul>\n```"
explanation = "`key` lets React match elements across renders (reconciliation)."

[questions.react-009]
prompt = "Which statement about `props.children` is correct?"
options = ["It is always an array", "It is the content between a component’s opening and closing tags and can be any kind of node (string, element, array, function, etc.)", "It only works with class components", "A function cannot be passed as children"]
explanation = "`children` can be one element, a string, an array, or a function (render props). Use `React.Children` utilities when you need to traverse it safely."

[questions.react-010]
prompt = "Which inline style is valid in React DOM?"
options = ["`style=\"color: red; font-size: 14px\"`", "`style={{ color: 'red', fontSize: 14 }}`", "`style={{ color: red, font-size: 14 }}`", "`style={['color: red']}`"]
explanation = "`style` takes an **object** with camelCase keys; unitless numbers are treated as `px` for most properties."

[questions.react-011]
prompt = "Briefly explain **why an array index should not be used as a `key`** when a list can be inserted into, deleted from, or reordered."
keywords = [["state"], ["order", "reordering", "position"], ["reuse", "wrong item", "mismatch", "attached to the wrong item"]]
model_answer = "React uses keys to identify elements across renders. If the **index** is used, inserting, deleting, or reordering changes an item’s **position** while its key still reflects the position. React may then **reuse the wrong** component/DOM for new data, attaching internal **state** (typed input, checkbox, animation) to the wrong item and rendering less efficiently. Use a stable data ID."
explanation = "An index is safe only for a static list whose order never changes and whose items have no state."

[questions.react-012]
title = "Mini createElement & renderToString"
prompt = "Learn how JSX works by implementing it yourself. Implement:\n\n1. `h(type, props, ...children)` — return an object `{ type, props }` where `props.children` is a **flattened array**, with `null`, `undefined`, `false`, and `true` removed. `props` may be `null`.\n2. `renderToString(node)`:\n   - string/number → text (escape `&`, `<`, `>`);\n   - string `type` → `<type attr=\"v\">children</type>`; output `className` as `class`; skip `children` and props whose values are functions;\n   - function `type` → call `type(props)` and render the result (function component)."
