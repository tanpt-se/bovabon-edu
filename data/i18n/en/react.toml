```'''
explanation = '''The `'use client'` directive declares a boundary: this file and the modules it imports are bundled for the client.'''

[questions.react-087]
prompt = '''Compare the **Context API** with a state management library such as Redux Toolkit or Zustand. When should you use each?'''
keywords = [["re-render", "rerender", "render again"], ["selector", "select", "partial subscription", "subscribe to part"], ["devtools", "middleware", "debugging"], ["infrequent changes", "theme", "locale", "auth", "rarely changes"], ["complex", "large", "frequent updates", "changes frequently"]]
model_answer = '''- **Context** passes data through a tree (dependency injection); it is not optimized for frequent updates because every consumer can **re-render** when the value changes. It suits data that changes **infrequently**, such as a theme, locale, or authenticated user.
- **Redux Toolkit / Zustand** provide an external store with **selectors**; a component re-renders only when the selected state changes. They also offer **devtools and middleware**, with clear patterns for **large, complex state that changes frequently**.
- Server data is usually better handled by TanStack Query or SWR than placed in a global store.'''
explanation = '''There is no single right answer; what matters is understanding the trade-offs in rendering and complexity.'''

