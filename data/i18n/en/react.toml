explanation = '''`useOptimistic(state, updateFn)` returns an optimistic state that exists only while an Action is running. Combine it with `useActionState` to receive the Action's result or error.'''

[questions.react-x005]
prompt = '''An error is thrown by a button's `onClick` handler. Which statement about Error Boundaries is correct?'''
options = ["A parent boundary always catches event-handler errors", "A boundary catches errors only if `componentDidCatch` is used in a function component", "A boundary does not automatically catch ordinary event-handler errors; the handler must handle them", "React retries the handler until it succeeds"]
explanation = '''Error Boundaries handle errors while rendering a descendant tree. Errors from event handlers or asynchronous callbacks need to be handled where they occur.'''

[questions.react-x023]
prompt = '''A Provider passes `value={{ theme, setTheme }}`. An unrelated state update makes its parent render and the consumer read a changed context. What is the most immediate cause?'''
