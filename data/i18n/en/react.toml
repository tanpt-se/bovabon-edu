[modules.react-basics]
title = "JSX & Components"
description = "How JSX is transformed, function components, props, children, conditional rendering, lists, and keys."
lesson = '''### JSX, components, and lists
JSX describes React elements. The modern JSX transform converts it to calls such as `jsx(...)`, while the classic runtime uses `React.createElement(...)`. A component is a capitalized function that receives props and returns an element. Props are read-only; use a Fragment when you need multiple nodes without adding a DOM element.

| Situation | Approach | Why |
|---|---|---|
| A list can be reordered | `key={item.id}` | React preserves the identity and state of each row |
| A condition depends on a count | `items.length > 0 && <List />` | `0 && ...` renders the number zero |
| DOM attributes | `className`, `htmlFor`, `onClick` | These names follow the React DOM API |

```jsx
function TodoList({ items }) {
  return <ul>{items.map(item => <li key={item.id}>{item.text}</li>)}</ul>;
}
```

### Common mistakes
- Using `key={index}` for a list that can have items inserted, removed, or reordered can attach a row's state to the wrong item.
- Defining a component with a lowercase name or mutating its props.
- Using `condition && node` when the condition might be `0`.

### Interview checklist
- Does JSX immediately create a DOM node, or describe an element?
- Within what scope must a `key` be unique, and why is it not an ordinary prop?
- When is the shorthand `<>` Fragment insufficient because you need a `key`?
'''

[questions.react-001]
options = ["`document.createElement('h1')`", "`jsx('h1', { className: 't', children: 'Hi' })`", "`new HTMLElement('h1')`", "A string of HTML: `'<h1 class=\"t\">Hi</h1>'`"]
prompt = '''With the **automatic JSX runtime** (React 17+), what does `<h1 className="t">Hi</h1>` compile to?'''
explanation = '''Babel, TypeScript, or SWC transforms JSX into a call to `jsx()` from `react/jsx-runtime`, which returns a **React element**—an object that describes the UI, not a DOM node.'''

[questions.react-002]
options = ["That is only a convention; lowercase names work the same way", "JSX treats lowercase names as HTML/intrinsic elements (strings) and capitalized names as component variable references", "Because ESLint requires it", "Because React exports only capitalized components"]
prompt = '''Why must a component name in JSX start with a **capital letter** (`<MyButton />`)?'''
explanation = '''`<button />` becomes `jsx('button')` (a string), while `<Button />` becomes `jsx(Button)` (a variable reference). A lowercase name is treated as an intrinsic DOM tag, so React would create an unknown `<mybutton>` element.'''

[questions.react-003]
options = ["Nothing is displayed", "The number `0` is displayed", "`false` is displayed", "A runtime error"]
prompt = '''What does this code display when `messages = []`?

```jsx
<div>{messages.length && <Badge count={messages.length} />}</div>
```'''
explanation = '''`0 && X` evaluates to `0`, and React **renders the number zero** (it skips only `false`, `null`, `undefined`, and `true`). Use `messages.length > 0 && ...` instead.'''

[questions.react-004]
options = ["Unique across the entire application", "Unique among siblings and stable across renders", "Must be an increasing integer", "Must be `Math.random()` to guarantee there are no duplicates"]
prompt = '''What requirements should a list `key` meet?'''
explanation = '''A key only needs to be unique among siblings. `Math.random()` changes the key on every render, causing React to unmount and remount the entire item, which loses state and hurts performance.'''

[questions.react-005]
prompt = '''Which attribute is the correct way to set a CSS class in JSX?'''
explanation = '''`class` is a JavaScript keyword, so React uses `className` (the corresponding DOM property is `element.className`). Similarly, use `htmlFor` instead of `for`.'''

[questions.react-006]
options = ["`null`", "`false`", "`0`", "`undefined`", "`''` (an empty string)", "`true`"]
prompt = '''Which values **render nothing** when placed in JSX as `{value}`? (Select all that apply.)'''
explanation = '''`null`, `undefined`, `true`, and `false` are omitted; an empty string renders an empty text node, which is not visible. `0` (and `NaN`) **is rendered**.'''

[questions.react-007]
prompt = '''Complete the code so it returns multiple elements **without** adding an enclosing DOM element:

```jsx
function Row() {
  return (
    {{blank}}
      <td>A</td>
      <td>B</td>
    {{blank}}
  );
}
```'''
explanation = '''A Fragment groups multiple elements without creating an extra DOM node. This matters inside `<tr>`, where inserting a `<div>` would be invalid.'''

[questions.react-008]
prompt = '''Render the list with the correct key:

```jsx
<ul>
  {todos.map(todo => <li {{blank}}={todo.id}>{todo.text}</li>)}
</ul>
```'''
explanation = '''A `key` helps React match items across renders during reconciliation.'''

[questions.react-009]
prompt = '''Which statement about `props.children` is correct?'''
options = ["It is always an array", "It is the content between a component's opening and closing tags and can be any kind of node (a string, element, array, function, and so on)", "It can only be used with class components", "A function cannot be passed as children"]
explanation = '''`children` can be a single element, a string, an array, or a function (render props). Use the `React.Children` utilities when you need to traverse children safely.'''

[questions.react-010]
prompt = '''Which inline style is valid in React DOM?'''
explanation = '''The `style` prop accepts an **object** whose keys use camelCase. For most properties, a number without a unit is interpreted as pixels.'''

[questions.react-011]
prompt = '''Briefly explain **why you should avoid using an array index as a `key`** when a list can have items added, removed, or reordered.'''
keywords = [["state", "component state"], ["order", "ordering", "sorting", "reordering", "position"], ["reuse", "wrong component", "incorrect component", "mismatch", "attached to the wrong item"]]
model_answer = '''React uses keys to identify items across renders. If you use an **index**, inserting, removing, or reordering items changes their **positions** while the index keys remain tied to those positions. React may then **reuse** an old component or DOM node for different data, attaching internal **state** (such as input text, a checkbox, or an animation) to the wrong item and making rendering less efficient. Use a stable ID from the data instead.'''
explanation = '''An index is safe only when the list is static, its order never changes, and its items have no state.'''

[questions.react-012]
prompt = '''Explore how JSX works by implementing it yourself:

1. `h(type, props, ...children)` returns an object `{ type, props }`. `props.children` must be a **flattened array**, with `null`, `undefined`, `false`, and `true` removed. `props` may be `null`.
2. `renderToString(node)`:
   - converts strings and numbers to text, escaping `&`, `<`, and `>`
   - when `type` is a string, returns `<type attr="v">children</type>`; outputs `className` as `class`, and ignores `children` and props whose values are functions
   - when `type` is a function, calls `type(props)` and renders the result (function component)'''
hints = ["`children.flat(Infinity)` flattens arrays at every nesting level.", "In `renderToString`, handle cases in this order: primitive → array → function component → string tag."]
explanation = '''This demonstrates the core idea behind JSX: it is a function call that creates an object describing a UI tree. A renderer such as `react-dom` or `react-native` turns that object into an actual interface.'''

[questions.react-x001]
prompt = '''A `users` list is sorted by name. After the user expands the second row, the list order changes. What is the main risk of using `key={index}`?'''
options = ["React will not render the list again", "A row's local state may follow its position instead of its user", "React automatically converts the index to `user.id`", "It only produces a warning and does not affect the UI"]
explanation = '''Keys identify items across renders. After reordering, index keys still identify positions, so state or input values can become associated with a different user. Use each user's stable ID.'''

[questions.react-xc01]
explanation = '''Each component has its own local state identity. Immutable updates help React detect changes and make selection behavior easier to test.'''

[modules.react-state]
title = "State, Props & Events"
description = "useState, immutable updates, batching, lifting state up, and controlled versus uncontrolled inputs."
lesson = '''### State is a snapshot
`useState` returns the value for the current render. Calling a setter schedules another render; it does not change the variable in the current closure. If the next value depends on the previous one, use an updater function. Replace state objects and arrays with new values rather than mutating them.

| Update | Example | Note |
|---|---|---|
| Independent value | `setOpen(true)` | Pass a value directly |
| Based on previous state | `setCount(c => c + 1)` | Safe when several updates happen in one event |
| Object or array | `setUser(u => ({ ...u, name }))` | Do not mutate the old object |
| Shared by multiple components | Move state to their common parent | Keep one source of truth |

```jsx
function addItem(item) {
  setItems(current => [...current, item]);
}
```

React 18+ automatically batches multiple updates in the same processing turn. `useState(() => expensive())` uses a lazy initializer, avoiding repeated initialization work on every render.

### Common mistakes
- Calling `setCount(count + 1)` several times in one handler and expecting each call to read a new snapshot.
- Mutating the array with `items.push(item)` and passing the same array back.
- Keeping the same data in both a parent and child, allowing the copies to drift apart.
- Using a controlled input (`value`) without updating state in `onChange`.

### Interview checklist
- Why doesn't a setter change the state variable in the current handler?
- When should you use local state, lift state up, or choose a controlled or uncontrolled input?
- How can you update one array item without mutating the array?
'''

[questions.react-020]
options = ["1", "3", "0", "Infinite-loop error"]
prompt = '''After one click, what value does `count` display? (It starts at 0.)

```jsx
function Counter() {
  const [count, setCount] = useState(0);
  const onClick = () => {
    setCount(count + 1);
    setCount(count + 1);
    setCount(count + 1);
  };
  return <button onClick={onClick}>{count}</button>;
}
```'''
explanation = '''In this render, `count` is the snapshot `0`, so all three calls set state to `1`. To reach `3`, use the updater `setCount(c => c + 1)`.'''

[questions.react-021]
prompt = '''Which approach correctly adds an item to the `items` array in state **immutably**?'''
explanation = '''`push` mutates the old array. Because its reference stays the same, React (which compares with `Object.is`) may skip the render. Always create a new array.'''

[questions.react-022]
options = ["2 times", "1 time (automatic batching)", "0 times", "It depends on the browser"]
prompt = '''In React 18, how many renders do these two calls inside a `setTimeout` cause?

```js
setA(1);
setB(2);
```'''
explanation = '''With `createRoot`, React 18 automatically batches updates in timeouts, promises, and native events as well. React 17 batched only updates inside React event handlers.'''

[questions.react-023]
options = ["It has a `ref` attribute", "Its value is controlled by React state through `value` and updated with `onChange`", "It uses `defaultValue`", "It is inside a `<form>` element"]
prompt = '''An input is a **controlled component** when:'''
explanation = '''For a controlled input, React is the single source of truth (`value` + `onChange`). For an uncontrolled input, the DOM holds the value; read it with a `ref` and initialize it with `defaultValue`.'''

[questions.react-024]
options = ["There is no difference", "The second form calls `expensiveCompute` only on the initial render; the first calls it on **every** render (even though the result is discarded)", "The second form stores the function in state", "The first form is faster because it does not create a closure"]
prompt = '''How do `useState(expensiveCompute())` and `useState(() => expensiveCompute())` differ?'''
explanation = '''This is **lazy initial state**. Pass an initializer function to avoid doing unnecessary work on every render.'''

[questions.react-025]
prompt = '''Which operations **mutate** state and should be avoided when the state is an array or object?'''
explanation = '''`sort`, `splice`, `reverse`, `push`, and property assignments modify the original value. `filter`, `map`, `slice`, spread, `toSorted`, `toSpliced`, and `with` return a new value.'''

[questions.react-026]
prompt = '''Safely increment the counter based on its previous value:

```jsx
setCount({{blank}} => prev + 1);
```'''
explanation = '''An updater function receives the latest queued state, so multiple consecutive updates are all applied.'''

[questions.react-027]
prompt = '''Immutably update the nested property `user.address.city`:

```js
setUser({
  ...user,
  address: { {{blank}}, city: 'Hà Nội' },
});
```'''
explanation = '''Spread each level that you change; otherwise, replacing `address` will discard its other fields.'''

[questions.react-028]
prompt = '''What does “lifting state up” mean, and when should you use it?'''
keywords = [["parent", "common parent", "ancestor"], ["props", "properties"], ["shared", "share", "synchronize", "multiple components"]]
model_answer = '''When **multiple child components need to share or synchronize** data, move the state to their nearest **common parent**, then pass the value down through **props** and pass an update function (callback) so children can report changes. This keeps a single source of truth.'''
explanation = '''If prop drilling becomes too deep, consider Context or a state manager.'''

[questions.react-029]
title = "Immutable todoReducer"
prompt = '''Write a reducer `todoReducer(state, action)` that manages a todo list without mutating the old state.

State is an array of `{ id, text, done }` objects. Handle these actions:
- `{ type: 'added', id, text }` → append a todo with `done: false`
- `{ type: 'toggled', id }` → toggle `done`
- `{ type: 'deleted', id }` → delete the todo
- `{ type: 'cleared' }` → remove completed todos
- unknown action → `throw new Error('Unknown action: ' + type)`'''
hints = ["Use `map` to update one item, `filter` to remove items, and spread syntax to append.", "The state is `Object.freeze`d; mutation will have no effect or may throw an error."]
explanation = '''A reducer should be a pure function: the same input produces the same output, with no side effects or mutation.'''

[questions.react-x002]
options = ["4", "5", "6", "Unknown"]
prompt = '''Inside an event handler, `count` is currently `4`:

```js
setCount(count + 1);
setCount(count + 1);
```

What value will it have after the next render?'''
explanation = '''Both expressions read the snapshot `count === 4`, so both queue the value `5`. To increment twice, use `setCount(c => c + 1)` for each update.'''

[questions.react-xc02]
explanation = '''A reducer groups related state transitions in one place, while each action describes an intent. Every branch preserves the old state immutably.'''

[modules.react-hooks]
title = "Hooks"
description = "useEffect, useRef, useMemo, useCallback, useReducer, useContext, custom hooks, and the Rules of Hooks."
lesson = '''### Rules of Hooks
1. Call hooks **at the top level** (not inside an `if`, loop, or nested function).
2. Call hooks only from a **function component** or a **custom hook** (whose name starts with `use`).

### Choose a hook by its purpose
| Hook | Use it when | Do not use it to |
|---|---|---|
| `useEffect` | Synchronize a subscription, timer, or external system | Calculate data that can be derived during render |
| `useRef` | Hold a mutable value that does not need to trigger a render | Store UI data that must be displayed |
| `useMemo` / `useCallback` | Cache a value or function when measurement gives you a reason | Make code correct |
| `useReducer` | Several actions update related state | Put all state into one object |
| `useContext` | Read shared data through the component tree | Replace every kind of state management |

```jsx
useEffect(() => {
  const connection = connect(roomId);
  return () => connection.disconnect();
}, [roomId]);
```

An Effect without a dependency array runs after every render; `[]` means there are no reactive dependencies. Cleanup runs before the next setup and when the component unmounts. In development, Strict Mode adds a setup-cleanup cycle to expose missing cleanup logic.

### Common mistakes
- Calling a hook in a conditional branch changes the order of hooks.
- Omitting a dependency can make a callback read stale state.
- Using an Effect to synchronize two pieces of state when one can be calculated from the other.
- Adding memoization before measuring a rendering problem.

### Interview checklist
- Where does each Effect dependency come from?
- Which resource created by setup must cleanup undo?
- Can you calculate the value during render or handle it in an event handler instead of using an Effect?

The coding exercises in this module use MiniReact, which provides `useState`, `useEffect`, `useRef`, `useMemo`, `useCallback`, `useReducer`, `renderHook`, and `act`.
'''

[questions.react-040]
prompt = '''Which statement violates the **Rules of Hooks**?'''
options = ["Calling `useState` at the top of a function component", "Calling `useEffect` inside `if (isOpen) { ... }`", "Calling the custom hook `useFetch` in a component", "Calling `useState` several times in a row"]
explanation = '''React identifies hooks by their **call order**. A conditional call changes that order between renders, which can associate state with the wrong hook.'''

[questions.react-041]
options = ["Only when the component unmounts", "Before the Effect runs again (when dependencies change) and on unmount", "Immediately after the Effect finishes", "Never when dependencies are `[]`"]
prompt = '''When does a `useEffect` cleanup function run?'''
explanation = '''With `[]`, cleanup runs on unmount. In development, Strict Mode also runs it once after the initial mount as a check.'''

[questions.react-042]
options = ["Yes, just like `setState`", "No — a ref is a mutable container, and changing it does not trigger a render", "Only when the ref is attached to the DOM", "Only in Strict Mode"]
prompt = '''Does changing `ref.current` in `useRef` trigger a re-render?'''
explanation = '''Use a ref for values that do not affect the UI, such as a timer ID, a previous value, a DOM node, or an `isMounted` flag.'''

[questions.react-043]
options = ["`useMemo` caches the **result** of `fn()`, while `useCallback` caches the **function itself**", "`useCallback` is only for event handlers", "`useMemo` runs asynchronously", "There is no difference"]
prompt = '''What is the main difference between `useMemo(fn, deps)` and `useCallback(fn, deps)`?'''
explanation = '''`useCallback(fn, deps)` is equivalent to `useMemo(() => fn, deps)`.'''

[questions.react-044]
options = ["A memory leak because the interval is not cleared", "A stale closure: `count` stays at 0, so the count stops at 1", "The interval runs twice per second", "There is no problem"]
prompt = '''What is wrong with this code?

```jsx
useEffect(() => {
  const id = setInterval(() => setCount(count + 1), 1000);
  return () => clearInterval(id);
}, []);
```'''
explanation = '''The closure captures `count` from the first render. Use `setCount(c => c + 1)` or include `count` in the dependencies.'''

[questions.react-045]
options = ["When fetching data", "When you need to measure the DOM layout and update it synchronously before the browser paints to avoid flicker", "When you want the Effect to run on the server", "Always, because it is faster"]
prompt = '''When should you use `useLayoutEffect` instead of `useEffect`?'''
explanation = '''`useLayoutEffect` runs synchronously after the DOM is mutated but before the browser paints. It blocks painting, so use it only when necessary.'''

[questions.react-046]
prompt = '''According to “You Might Not Need an Effect,” which situations **do not need** `useEffect`?'''
options = ["Deriving a value from props or state (for example, `fullName = first + ' ' + last`)", "Subscribing to a WebSocket when a component mounts", "Handling logic when the user clicks a button (such as submitting a form)", "Resetting all state when the `userId` prop changes (use `key={userId}` instead)", "Synchronizing with an external jQuery widget"]
explanation = '''Effects are for synchronizing with **external systems**. Calculate derived data during render, put event logic in the handler, and reset state with a `key`.'''

[questions.react-047]
prompt = '''Complete the Effect that subscribes to the resize event and cleans up, running once after mount:

```jsx
useEffect(() => {
  const onResize = () => setWidth(window.innerWidth);
  window.addEventListener('resize', onResize);
  return () => window.{{blank}}('resize', onResize);
}, {{blank}});
```'''
explanation = '''Cleanup removes the exact same handler reference. An empty dependency array means the Effect runs after mount and cleans up on unmount.'''

[questions.react-048]
prompt = '''Create a context and read it:

```jsx
const ThemeContext = {{blank}}('light');

function Button() {
  const theme = {{blank}}(ThemeContext);
  return <button className={theme}>OK</button>;
}
```'''
explanation = '''Use `createContext(defaultValue)`, `<ThemeContext.Provider value=...>` (React 19 also allows `<ThemeContext value=...>`), and `useContext` (or `use` in React 19).'''

[questions.react-049]
prompt = '''Explain **stale closures** in React hooks and describe how to fix them.'''
keywords = [["closure", "closed-over value"], ["stale value", "old value", "previous render", "snapshot"], ["updater function", "functional update", "prev =>", "c =>"], ["dependencies", "dependency array"], ["ref", "useRef"]]
model_answer = '''Each render creates new functions that **close over the props and state values from that render**. A callback created in an earlier render (for example, in a `setInterval` Effect with `[]`, or a `useCallback` with missing dependencies) can keep reading a **stale value**.

Ways to fix it:
- Use a **functional updater**, such as `setX(prev => ...)`, so the update does not depend on the closed-over value.
- Declare all **dependencies** (`eslint react-hooks/exhaustive-deps`).
- Store the latest value in a **useRef** and read `ref.current` inside the callback.'''
explanation = '''This is one of the most common bugs with timers, subscriptions, and event listeners in hooks.'''

[questions.react-050]
prompt = '''Write a custom hook `useToggle(initial = false)` that returns the array `[value, toggle, setValue]`:
- `toggle()` switches the value
- `setValue(v)` sets the value directly
- `toggle` must **keep the same reference** between renders (use `useCallback`)

> The environment provides `useState`, `useCallback`, and other MiniReact hooks, plus `renderHook` and `act` for testing.'''
hints = ["Use the functional update `setValue(v => !v)` so two consecutive toggles still work correctly.", "`useCallback(fn, [])` keeps a stable reference."]
explanation = '''A functional update keeps `toggle` independent of its closure, so `useCallback` can have an empty dependency array.'''

[questions.react-051]
title = "useCounter with min/max"
prompt = '''Write `useCounter(initial = 0, { min = -Infinity, max = Infinity, step = 1 } = {})` to return an object:
`{ count, increment, decrement, reset, set }`
- `increment` and `decrement` change the count by `step` and **clamp** it to `[min, max]`
- `set(n)` must also clamp the value
- `reset()` restores `initial`, clamped to the range'''
hints = ["Write a helper `clamp(n) = Math.min(max, Math.max(min, n))`."]
explanation = '''A custom hook packages stateful logic for reuse; each component that calls it gets its own state.'''

[questions.react-052]
prompt = '''Write a `usePrevious(value)` hook that returns the value from the **previous render** (on the first render, return `undefined`).

A classic approach is `useRef` + `useEffect`.'''
hints = ["The Effect runs **after** rendering, so `ref.current` still holds the old value during render."]
explanation = '''With `[value]` as the dependency array, if a render happens without a value change, the previous value remains the one from the most recent change.'''

[questions.react-053]
prompt = '''Write a `useDebouncedValue(value, delay)` hook that returns a value only after it has **stopped changing** for `delay` milliseconds (useful for a search field).

- On the first render, return the initial `value`.
- Whenever `value` changes, cancel the old timer (cleanup) and start a new one.

The environment uses **fake timers**; tests call `jest.advanceTimersByTime(ms)`.'''
hints = ["Call `clearTimeout` in the Effect cleanup.", "Use `[value, delay]` as the Effect dependencies."]
explanation = '''This debounce pattern uses an Effect and cleanup: whenever the value changes, cleanup cancels the old timer before the next Effect starts a new one.'''

[questions.react-054]
title = "useAsync — data loading state"
prompt = '''Write a hook `useAsync(asyncFn, deps)` that calls `asyncFn()` in an Effect and returns `{ status, data, error }`:
- initial state: `status: 'pending'`, `data: undefined`, `error: undefined`
- on success: `status: 'success'`, `data: result`
- on failure: `status: 'error'`, `error: the error`
- If the dependencies change or the component unmounts before the promise settles, **ignore** the old result to avoid a race condition. Use an `ignore` flag in cleanup.'''
hints = ["Set `let ignore = false;` in the Effect and set `ignore = true` in cleanup.", "Check `if (!ignore)` before calling a state setter."]
explanation = '''This is the pattern React documents for fetching in an Effect without a race condition. In practice, consider TanStack Query, SWR, or a framework data loader.'''

[questions.rx-dd03]
prompt = '''Generate an ID that stays consistent between server and client, to connect a `<label>` with an `<input>`:

```jsx
function EmailField() {
  const id = {{blank}}();
  return (<>
    <label htmlFor={id}>Email</label>
    <input id={id} type="email" />
  </>);
}
```

Safely subscribe to a data source outside React (for example, `navigator.onLine`) during concurrent rendering:

```js
const online = {{blank}}(subscribe, () => navigator.onLine);
```'''
explanation = '''`useId` generates IDs that match during hydration (do not use `Math.random`). `useSyncExternalStore(subscribe, getSnapshot)` avoids tearing when reading an external store.'''

[questions.rx-dd05]
prompt = '''When do you **not** need `useEffect`? Give at least three commonly overused cases and the right approach for each.'''
keywords = [["derived data", "derive during render", "calculate during render", "direct calculation"], ["useMemo", "memoization"], ["event handler", "event callback", "onsubmit", "onclick"], ["key", "reset state", "remount"], ["extra render", "render loop", "chained effect"]]
model_answer = '''Effects synchronize with **external systems** (DOM APIs, networks, subscriptions). Common cases that do not need an Effect:

1. **Data derived from props or state** (filtering, totals, joined strings): calculate during render; use `useMemo` if the calculation is expensive. An Effect with `setState` causes an **extra render** and can leave values out of sync.
2. **Responding to a user action** (submitting a form, making a purchase, showing a toast): put it in an **event handler**, where the triggering action is known.
3. **Resetting state when a prop changes** (for example, a new `userId`): pass `key={userId}` so React recreates the component instead of using an Effect to call `setState`.
4. **Chaining Effects that update state**: move the logic into one handler or reducer.
5. **Notifying a parent component**: call the parent's callback from the handler instead of using an Effect to watch state.'''
explanation = '''Every unnecessary Effect adds an extra render and another source of synchronization bugs.'''

[questions.rx-dd06]
title = "External store for useSyncExternalStore"
prompt = '''`useSyncExternalStore(subscribe, getSnapshot)` needs a store with two stable functions. Write `createStore(initial)` that returns:

- `getSnapshot()` → the current state (**the same reference** while the state is unchanged)
- `setState(next)` — `next` is an object **or** a function `(prev) => object`; shallow-merge it into the old state to create a new object. If every new key is `Object.is`-equal to its old value, **do not** change the reference or notify listeners.
- `subscribe(listener)` → returns an unsubscribe function; whenever the state changes, call every listener with no arguments
- `select(selector)` → a function `() => selector(getSnapshot())`'''
hints = ["Use a `Set` to store listeners; the unsubscribe function only needs to call `delete`.", "Compare each key with `Object.is` before creating a new object."]
explanation = '''A snapshot must be **immutable and stable**. If `getSnapshot` returns a new object on every call, `useSyncExternalStore` can render forever.'''

[questions.react-x003]
prompt = '''A component calls `useEffect` only inside `if (enabled)`. Why is this a design error?'''
