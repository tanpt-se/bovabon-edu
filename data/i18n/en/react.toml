[questions.react-xc07]
explanation = '''Keeping the authoritative state separate from its temporary display makes commit and rollback clear. A real app would usually use `useOptimistic` directly inside an Action or transition.'''

[questions.react-xc08]
explanation = '''The Action receives the previous state and submitted data, then returns the next state for `useActionState` to publish. A real application still needs server-side validation.'''

[questions.react-x039]
prompt = '''The hook that takes an Action and initial state, then returns state, a dispatch function, and pending status is `{{blank}}`.'''
explanation = '''`useActionState(action, initialState)` returns `[state, dispatchAction, isPending]`.'''

[questions.react-x040]
prompt = '''In React 19, the hook for displaying temporary state while an Action is running is `{{blank}}`.'''
explanation = '''`useOptimistic` creates optimistic state while waiting for the Action or server result.'''

[modules.react-server]
title = "Server Components & Streaming"
description = "Server/client boundaries, directives, Suspense, streaming, and hydration."
lesson = '''### Choose where a component runs
| Kind | Can it use state/effects? | Is its JavaScript sent to the browser? |
|---|---|---|
| Server Component | No client hooks | Its component implementation is not sent |
| Client Component | Yes, through a `'use client'` boundary | Yes |
| Server Function | Runs on the server when called | The client receives a reference it can call |

`'use client'` goes at the top of a module and creates a boundary for its client-side imports. Props crossing the boundary must be serializable. `'use server'` marks a Server Function; it does not turn a component into a Server Component.

```jsx
// Server Component
export default async function Page() {
  const user = await loadUser();
  return <Profile name={user.name} />;
}
```

Suspense lets a framework stream content that is ready while a slower part displays a fallback. Hydration attaches client events and state to server-rendered HTML; the initial server and client output must match.

### Common mistakes
- Importing browser APIs or calling `useState` in a Server Component.
- Passing an ordinary callback/function through server-to-client props.
- Treating `'use server'` as equivalent to `'use client'`.
- Rendering `Date.now()`, random values, or browser-dependent data differently during the initial render.

### Interview checklist
- Which imported modules fall under a `'use client'` boundary?
- Where in the tree can Suspense help with streaming?
- What causes a hydration mismatch, and in what order would you investigate it?
'''

[questions.react-x012]
prompt = '''A Server Component needs to read server data before returning JSX. Which statement is correct?'''
options = ["It can use async/await, but not client state/effect hooks such as `useState`", "It must add `'use client'`", "Every server component sends its JavaScript source to the browser", "Only class components can run on the server"]
explanation = '''Server Components run on the server and can read data there. Client interaction hooks such as state and effects belong in Client Components.'''

[questions.react-x013]
prompt = '''A file has `'use client'` at the top of its module and then imports `SearchBox`. What is the directive's main meaning?'''
options = ["Only the first component in the file becomes a client component", "The module becomes a client boundary and its dependencies are included on the client", "The component runs exclusively on the server", "The directive enables hydration for the whole site"]
explanation = '''`'use client'` marks a module boundary. Modules imported beneath that boundary belong to the client graph; child files do not each need the directive.'''

[questions.react-x014]
prompt = '''A file has `'use server'` on an order-saving function. Which interpretation is correct?'''
