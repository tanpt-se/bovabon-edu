explanation = '''Prefer queries that reflect how users and assistive technologies such as screen readers find UI: `getByRole`, `getByLabelText`, `getByText`, and so on. Use `getByTestId` as a last resort.'''

[questions.react-085]
prompt = '''Which APIs are **new in React 19**?'''
options = ["`useActionState`", "`useFormStatus`", "`useOptimistic`", "`use(promise)`", "`ref` can be passed as a prop", "`componentWillMount`"]
explanation = '''React 19 adds Actions (`useActionState`, `useFormStatus`, `useOptimistic`), `use()` for reading a promise or context, and `ref` as a prop. `componentWillMount` was removed long ago.'''

[questions.react-086]
prompt = '''Mark the file as a Client Component in the Next.js App Router (first line of the file):

```jsx
{{blank}}
