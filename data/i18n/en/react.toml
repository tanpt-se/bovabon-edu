[modules.react-dv-ssr]
title = "SSR, Streaming & Hydration"
description = "Choosing server-rendering APIs, streaming HTML, and attaching React to rendered markup without mismatches."
lesson = '''### Server HTML and React in the browser
Server rendering creates initial HTML so the browser can show content early. For interactive HTML, the client calls `hydrateRoot` to attach events and let React manage the existing tree. If the page is rendered entirely on the client into an empty container, use `createRoot`. Hydration expects the initial client markup to match the server HTML; the two sides must not choose different values for the first render.

| API | Purpose | Main characteristic |
|---|---|---|
| `renderToString` | Creates an HTML string | Does not stream; more limited with Suspense |
| `renderToPipeableStream` | Server runtime with Node streams | Sends the shell and content as a stream |
| `renderToReadableStream` | Runtime that supports Web Streams | Also streams through a `ReadableStream` |
| `prerender` | Creates static HTML after data is ready | Returns a Promise when Suspense regions have completed |
| `hydrateRoot` | Hydrates existing server-rendered markup | The initial client HTML should match the server |
| `createRoot` | Renders a client app into a container | Does not hydrate server-rendered markup |

With streaming, the server can send the page shell when it is ready, followed by slower regions through Suspense. Choose an API based on the server's stream environment and how the framework manages scripts and responses. Static prerendering is useful when you want to wait for data before emitting HTML.

### Common mistakes
- Calling `createRoot` on a container that already has server HTML, bypassing hydration.
- Using `Date.now()`, random values, browser data, or different locales in the initial markup.
- Assuming `renderToString` streams or handles every Suspense case like the streaming APIs.
- Hiding a mismatch with `suppressHydrationWarning` instead of finding different server and client inputs.
- Calling `hydrateRoot` multiple times for the same root instead of keeping the created root.

### Debug in this order
Compare the server's props and input data with the client's first render; check time zones/locales, random values, and `window`-dependent conditions; inspect the HTML after the browser parses it; then use the root's recoverable-error callback to collect useful diagnostics.
'''

[questions.react-dv015]
prompt = '''The server has sent HTML for `<App />`. Which API should the client call to attach React to that markup?'''
explanation = '''`hydrateRoot` is for server-rendered HTML; `createRoot` is for client rendering into a new container.'''

[questions.react-dv016]
prompt = '''A client-only page mounts into an empty container. Which API is appropriate?'''
explanation = '''`createRoot` initializes a client-side React root when the container does not need to hydrate server HTML.'''

[questions.react-dv017]
prompt = '''A Node server wants to stream React HTML through a Node writable stream. Which API is designed for this case?'''
explanation = '''`renderToPipeableStream` integrates with Node streams; `renderToReadableStream` is for Web Streams.'''

[questions.react-dv018]
prompt = '''A hydration warning appears because the initial client markup differs from the server HTML. What is the best response?'''
options = ["Find the different data or logic and make the two initial renders consistent", "Always wrap the component in `suppressHydrationWarning`", "Call `createRoot` instead of `hydrateRoot` to preserve the markup", "Disable Strict Mode in production"]
explanation = '''A mismatch often comes from non-deterministic inputs or environment differences. Fix the source of the difference before using a narrow escape hatch.'''

[questions.react-dv019]
prompt = '''Which differences can make the server markup and the client's first render disagree? (Select all that apply.)'''
options = ["Using `Date.now()` to create content", "Using a random number during render", "Depending on different time zones or locales on the server and browser", "Reading `window.innerWidth` directly to choose client markup", "Creating an object during render without using it to produce markup"]
explanation = '''Time, randomness, locale, and browser-only data can differ between environments. An object that does not affect the markup does not cause a mismatch.'''

[questions.react-dv020]
prompt = '''Choose the correct descriptions of server-rendering APIs. (Select all that apply.)'''
options = ["`renderToPipeableStream` uses Node streams", "`renderToReadableStream` uses Web Streams", "`hydrateRoot` continues from existing server HTML", "`createRoot` hydrates existing server HTML", "`renderToString` sends chunks as Suspense regions complete"]
explanation = '''The two streaming APIs serve different runtime stream types; hydration uses `hydrateRoot`. `createRoot` does not hydrate, and `renderToString` synchronously creates a string rather than streaming.'''

[questions.react-dv021]
prompt = '''To hydrate server markup, use `{{blank}}(container, <App />)`.'''
explanation = '''`hydrateRoot` takes the container holding server HTML and the React tree for the client.'''

[questions.react-dv022]
prompt = '''Explain common causes of a hydration mismatch and the order in which you would investigate it in an SSR application.'''
keywords = [["server", "client"], ["same", "match", "consistent markup"], ["date", "random", "locale", "timezone", "browser API"], ["deterministic", "consistent", "initial render"]]
model_answer = '''Hydration requires the server markup and the client's first render to **match**. I would compare the data and props on both sides, then look for non-deterministic values such as `Date.now()`, randomness, locale/time-zone differences, or a branch that reads a browser API. Next I would inspect the HTML parsed by the browser and fix the input so both environments produce the same initial markup.'''
explanation = '''A good answer connects the requirement for matching markup with environment-dependent differences and a systematic investigation.'''

