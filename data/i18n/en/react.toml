model_answer = '''`useActionState` holds the Action result state and pending status. `useFormStatus` in a child component lets the submit button show that it is **pending** or disabled. `useOptimistic` can show predicted profile data as soon as the Action starts; then use the authoritative result on success or **roll back** to the authoritative state on failure.'''
