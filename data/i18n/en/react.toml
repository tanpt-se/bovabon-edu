[modules.react-perf]
title = "Rendering & Performance"
description = "Reconciliation, keys, React.memo, avoiding unnecessary renders, code splitting, and concurrent features."
lesson = '''### Rendering and optimization
A component can render again when its state or a context it reads changes, or when its parent renders. A re-render does not mean the entire DOM is replaced; React compares the element trees, then commits the necessary changes.

| Tool | Effect | Consideration |
|---|---|---|
| `React.memo` | Skips a render when shallowly compared props have not changed | New objects or functions still count as changed props |
| `useMemo` | Caches a calculated result | Add it only when the calculation or identity matters |
| `useCallback` | Preserves a function identity | Often useful with a memoized component |
| `useTransition` | Marks an update as non-urgent | Does not move a CPU-heavy task to the background |
| `lazy` + `Suspense` | Loads a component when needed | Choose an appropriate boundary and fallback |

```jsx
const visible = useMemo(
  () => todos.filter(todo => todo.title.includes(query)),
  [todos, query]
);
```

Stable keys help reconciliation preserve the right identity after reordering. Use the Profiler and measure a user flow before optimizing; React Compiler can automatically memoize code in compatible configurations.

### Common mistakes
- Expecting `React.memo` to block updates from context or a component's own state.
- Creating a new dependency object on every render, which invalidates a cache.
- Using an index as a key in a list that can change order.
- Wrapping every callback in `useCallback` without a measured benefit.

### Interview checklist
- Which render actually takes time according to the Profiler?
- Which identity changes and causes an unnecessary child render?
- Can you split a component or state, or load code later, before adding memoization?
'''

[questions.react-060]
options = ["Only re-renders if props change", "Always re-renders", "Never re-renders", "Re-renders if it has state"]
prompt = '''By default, when a parent component renders again, what happens to a child component that does not use `memo`?'''
explanation = '''By default, React renders the entire child tree again. `React.memo` is what compares props and may skip a child render.'''

[questions.react-061]
options = ["Because `memo` works only with class components", "Because `options` and `onSelect` are new objects/functions on every render, so shallow comparison sees them as different", "Because `Child` has no key", "Because `useState` always makes every component render"]
prompt = '''`Child` is wrapped in `React.memo`. Why does it still render whenever `Parent` renders?

```jsx
function Parent() {
  const [n, setN] = useState(0);
  const options = { sort: 'asc' };
  return <Child options={options} onSelect={() => setN(n + 1)} />;
}
```'''
explanation = '''Use `useMemo` for `options` (or move it outside the component if it is constant) and `useCallback` for `onSelect`.'''

[questions.react-062]
options = ["The process of synchronizing state with the server", "The algorithm that compares the new element tree with the old one to find the minimal changes to apply to the UI", "The process of compiling JSX", "React's garbage-collection mechanism"]
prompt = '''What is “reconciliation” in React?'''
explanation = '''React uses an O(n) heuristic: a different `type` replaces the whole subtree, the same type updates props, and list items are matched by `key`.'''

[questions.react-063]
options = ["Creating a CSS transition effect", "Marking a state update as non-urgent so the UI stays responsive (the input does not lag) during expensive rendering", "Navigating between pages in React Router", "Delaying an Effect"]
prompt = '''What is `useTransition` used for?'''
explanation = '''`const [isPending, startTransition] = useTransition();` — updates inside `startTransition` can be interrupted by urgent updates.'''

[questions.react-064]
options = ["`const Page = require('./Page')`", "`const Page = lazy(() => import('./Page'))` together with `<Suspense fallback={...}>`", "`const Page = await import('./Page')` at the top level of a component", "`<Page lazy />`"]
prompt = '''What is the correct way to lazy-load a page with React?'''
explanation = '''`React.lazy` with dynamic `import()` creates a separate chunk; `Suspense` displays a fallback while it loads.'''

[questions.react-065]
prompt = '''Which techniques can reduce unnecessary renders or rendering cost?'''
options = ["Keep state close to where it is used (state colocation)", "Pass a heavy component as `children` so it does not re-render when wrapper state changes", "Use `key={Math.random()}`", "Virtualize long lists (react-window, FlashList)", "Split a large Context into smaller contexts or memoize its `value`", "Wrap everything in `useMemo` without measuring"]
explanation = '''`Math.random()` changes the key and causes a remount. Unnecessary memoization costs memory and comparison time; measure with the Profiler first.'''

[questions.react-066]
prompt = '''Wrap a component so it can skip rendering when its props have not changed:

```jsx
const Row = {{blank}}(function Row({ item }) {
  return <li>{item.name}</li>;
});
```'''
explanation = '''`React.memo(Component, arePropsEqual?)` accepts an optional second argument to customize the comparison.'''

[questions.react-067]
prompt = '''When should you **avoid** `useMemo` and `useCallback`? Briefly explain.'''
keywords = [["cheap", "simple", "lightweight", "low-cost calculation"], ["overhead", "memory", "dependency comparison"], ["memo", "React.memo", "not memoized", "referential stability", "stable reference"], ["measure", "profiler", "measurement"]]
model_answer = '''Avoid them when a calculation is **cheap**, or when a value or function is not passed to a **memoized** component and is not used as a dependency for another hook. Memoization itself has **overhead** (memory, dependency comparisons, and harder-to-read code) without providing useful **referential stability**. **Measure with the Profiler** before optimizing. React Compiler also memoizes automatically in many cases.'''
explanation = '''Premature optimization often creates unnecessary complexity.'''

[questions.react-068]
prompt = '''By default, `React.memo` compares props with **shallow equality**. Implement `shallowEqual(a, b)`:
- Return `true` if `Object.is(a, b)` is true.
- If either value is not an object (or is `null`), return `false`.
- Otherwise, require the same number of keys and `Object.is(a[key], b[key])` for every key.'''
hints = ["`Object.is` differs from `===` for `NaN` and `+0`/`-0`.", "Check that each key actually exists in `b` with `hasOwnProperty`."]
explanation = '''Understanding `shallowEqual` explains why inline objects and functions can defeat `React.memo`.'''

[questions.rx-dd01]
prompt = '''Filtering a list of 10,000 items makes typing in a search field lag. Which approach keeps the input responsive without manually debouncing?'''
options = ["Wrap the list update in `startTransition` (from `useTransition`) so React treats it as non-urgent and interruptible", "Use `useEffect` without a dependency array", "Use `useLayoutEffect` to render synchronously", "Call `forceUpdate` after each keystroke"]
explanation = '''Updates in a transition have lower priority: React can update the input immediately and render the list when time is available, interrupting that render if the user types again. `isPending` indicates that the transition is in progress.'''

[questions.rx-dd02]
prompt = '''Which statements about `useDeferredValue(value)` are **correct**?'''
options = ["It returns a deferred version of the value; during an urgent render it may still hold the previous value", "It is often combined with `memo` on an expensive child so that skipped renders are effective", "It fully replaces debouncing API calls and reduces the number of network requests", "You can compare `value !== deferred` to show a stale state, such as dimming results"]
explanation = '''`useDeferredValue` defers **rendering**; it does not reduce network requests. Use debounce or throttle separately when you need to limit API calls.'''

[questions.react-x004]
options = ["A render of any kind, even when Row's state changes", "A render caused by the parent when shallowly compared props are equal", "A render caused by a context Row reads changing", "A render caused by Row calling its own setter"]
prompt = '''Which render does `React.memo(Row)` usually skip?'''
explanation = '''By default, `memo` shallowly compares props. It does not block updates to the component's own state or to a context it reads.'''

[questions.react-x027]
options = ["The update can be marked non-urgent", "The pending state can be read", "A heavy synchronous JavaScript loop runs faster", "React can prioritize urgent updates"]
prompt = '''`useTransition` can make a large filter update more responsive. What does it not guarantee?'''
explanation = '''A transition lets React prioritize other rendering and defer non-urgent UI. It does not reduce the CPU complexity of a heavy synchronous loop.'''

[questions.react-x048]
prompt = '''The API that creates a component loaded asynchronously from a module when needed is `{{blank}}`; it is commonly placed inside `Suspense`.'''
explanation = '''`lazy` loads a component from a Promise; `Suspense` displays a fallback while it loads.'''

[questions.react-xc06]
explanation = '''Virtualization renders only the rows that intersect the viewport, plus an overscan region. An exclusive end index can be passed directly to `slice(start, end)`.'''

[questions.react-x038]
prompt = '''You use `useMemo` in a selector that filters 20,000 rows. Which practices are correct? (Select all that apply.)'''
options = ["Include both `items` and `filter` in the dependency list", "Measure with the Profiler before and after to check the benefit", "Keep the `items` identity stable when its contents have not changed", "Omit the `filter` dependency to keep the cache longer", "Remember that `useMemo` is a performance optimization, not the source of truth for state"]
explanation = '''Memoization is correct only when dependencies represent every input. It can avoid recalculation when identities are stable, but it does not replace the source of truth or measurement.'''

[modules.react-patterns]
title = "Patterns & Ecosystem"
description = "Context, composition, error boundaries, Suspense, Server Components, forms, and testing."
lesson = '''### Patterns and boundaries
| Pattern | Use it when | Keep in mind |
|---|---|---|
| Composition with `children` | Separating a layout from its content | Often more flexible than many boolean props |
| Context | Sharing a theme, locale, or tree-wide data | Consumers re-render when the value changes |
| Error Boundary | Recovering the UI when a descendant throws during rendering | It does not catch ordinary event-handler errors |
| Portal | A modal or tooltip must escape an overflow region | React events still bubble through the React tree |
| Suspense / `lazy` | Loading code or data that supports Suspense | Place the boundary where its fallback is useful |

```jsx
function Panel({ title, children }) {
  return <section><h2>{title}</h2>{children}</section>;
}
```

React 19 adds Actions, `useActionState`, `useOptimistic`, and `use(promise)`, and allows `ref` as a prop. Server Components and Client Components have a module boundary: `'use client'` creates a client boundary, while `'use server'` marks a Server Function.

### Common mistakes
- Using Context for all data can make many consumers re-render together.
- Expecting an Error Boundary to catch errors in a click callback or an arbitrary promise.
- Assuming a portal separates events from the React tree.
- Testing detailed DOM structure instead of querying by role and accessible name.

### Interview checklist
- Why is composition often preferable to prop flags or inheritance?
- Which errors does an Error Boundary cover, and which need separate handling?
- How should a modal portal manage focus, Escape-to-close, and accessible state?
'''

[questions.react-080]
options = ["An error while rendering a child component", "An error in a child component's lifecycle method or constructor", "An error thrown in an `onClick` event handler", "An error in a grandchild's render function"]
prompt = '''Which error is **not** caught by an Error Boundary?'''
explanation = '''Error Boundaries do not catch errors in event handlers, asynchronous code (`setTimeout`, promises), server-side rendering, or the boundary itself. Use `try/catch` for event handlers.'''

[questions.react-081]
options = ["Only the Provider re-renders", "Every component below the Provider that calls `useContext` for that context re-renders, even if wrapped in `memo`", "No component re-renders", "Only direct child components re-render"]
