explanation = '''`'use server'` marks a Server Function, often used as a server Action. It differs from `'use client'` and does not change the classification of every component in the module.'''

[questions.react-x015]
prompt = '''During streaming SSR, a child region inside `<Suspense>` is still waiting for data. What does the boundary allow?'''
options = ["Block the entire response until every region is ready", "Send a fallback first, then stream the content when that region is ready", "Skip hydration for the whole page", "Retry forever if the data fails"]
explanation = '''Suspense boundaries let the server send ready content along with a fallback, then stream the slower region when it becomes available.'''

[questions.react-x016]
prompt = '''An SSR page shows different times on the server and during the first client render, causing a hydration mismatch. What is the best fix?'''
options = ["Make the initial output deterministic, then read the time on the client after hydration", "Disable all of React Strict Mode", "Add `key={Date.now()}` to the root", "Wrap every component in `React.memo`"]
explanation = '''The server HTML and initial client render need to match. Pass in stable data, or render browser-dependent content in an Effect after hydration.'''

[questions.react-x051]
prompt = '''Explain the difference between `'use client'`, `'use server'`, Server Components, and Server Functions. Include the constraint on props that cross the boundary.'''
keywords = [["use client", "client boundary"], ["use server", "Server Function", "server function"], ["Server Component", "server component"], ["serializable", "serialization"]]
model_answer = '''A Server Component runs on the server and cannot use client state or Effect hooks. `'use client'` creates a client boundary for a module and its dependencies. `'use server'` marks a Server Function that can be called from the client through the framework; it does not turn a component into a Client Component. Ordinary props that cross the boundary must be **serializable**.'''
explanation = '''The two directives mark different boundaries. Confusing them can lead to code running in the wrong place or invalid data crossing the boundary.'''

[questions.react-x053]
prompt = '''Describe common causes of a hydration mismatch and how you would diagnose and fix a UI that depends on time or browser APIs.'''
keywords = [["hydration mismatch", "hydration error"], ["deterministic", "stable", "consistent"], ["initial render", "first render"], ["browser-only", "window", "browser API"]]
model_answer = '''A hydration mismatch occurs when server HTML and the initial client render are not **deterministic**, for example because each reads a different time or the client uses a **browser-only** API. Pass stable data so the **initial render** matches; if a browser value is truly needed, read it in an Effect after hydration and check the relevant boundary.'''
explanation = '''React needs to hydrate matching markup. Fix the difference between the two renders instead of hiding the warning.'''

[questions.react-x031]
prompt = '''When passing data from a Server Component to a Client Component, which rules should you remember? (Select all that apply.)'''
options = ["Props crossing the boundary must be serializable", "You can keep interactions in a small client subtree", "A Server Function is an exception that can be passed as a callable reference", "Passing an ordinary JavaScript callback is always safe", "`'use client'` at the top of a module creates a boundary"]
explanation = '''The client-server boundary requires serializable props. Server Functions have their own reference mechanism; ordinary callbacks cannot be passed directly across the boundary.'''

[questions.react-x032]
prompt = '''Which benefits or requirements are associated with Suspense and streaming SSR? (Select all that apply.)'''
options = ["A boundary can send a fallback before slower content", "Independent regions can finish at different times", "Hydration mismatches still need to be handled separately", "Suspense automatically fixes all differences between server and client", "A fallback should communicate a useful loading state"]
explanation = '''Streaming can send regions and fallbacks incrementally. It does not automatically fix hydration mismatches; the server output and initial client render still need to be consistent.'''

[modules.react-effects]
title = "Effects & Synchronization"
description = "Avoiding unnecessary Effects, cleanup, safe fetching, Strict Mode, layout effects, and Effect Events."
lesson = '''### Do you really need an Effect?
| Need | Preferred approach |
|---|---|
| Calculate a value from props or state | Calculate during render; memoize if needed |
| Respond to a user action | Handle it in an event handler |
| Synchronize with an external system | Use `useEffect` and cleanup |
| Measure layout before paint | Use `useLayoutEffect` sparingly |

```jsx
useEffect(() => {
  const controller = new AbortController();
  loadUser(userId, { signal: controller.signal });
  return () => controller.abort();
}, [userId]);
```

Cleanup runs before the Effect synchronizes with a new dependency and when the component leaves the tree. In development, Strict Mode runs an extra setup-cleanup cycle to expose asymmetric lifecycles. `useEffectEvent` lets an Effect call logic that reads the latest values without re-subscribing to a resource just because those values changed.

### Common mistakes
- Copying props into state with an Effect, then having to keep two sources of data synchronized.
- Omitting cleanup and leaving an old timer or subscription active.
- Ignoring an old fetch result without also cancelling a request when cancellation is available.
- Using `useLayoutEffect` for work that does not need to finish before paint.

### Interview checklist
- Which external system is the Effect synchronizing with?
- Does cleanup cancel the resource created by the matching setup?
- Could the logic go in render or an event handler instead?
'''

[questions.react-x017]
prompt = '''`fullName` is just `firstName` joined with `lastName`. A component stores `fullName` in state and updates it in an Effect. What is the simpler and more correct approach?'''
options = ["Calculate `fullName` directly during render", "Add a second Effect to synchronize it", "Use a ref instead of state", "Use `useLayoutEffect` to make it run faster"]
explanation = '''Derived values should be calculated from props or state during render. Storing a copy and updating it in an Effect adds a render and risks stale state.'''

[questions.react-x018]
options = ["connect", "connect then disconnect", "connect, disconnect, connect", "disconnect then connect then disconnect"]
prompt = '''In development with Strict Mode, what order might an Effect with `connect()` and cleanup `disconnect()` log on its first mount?'''
explanation = '''In development, Strict Mode runs an extra setup-cleanup cycle to expose resources that are not cleaned up correctly. The final setup leaves the connection active.'''

[questions.react-x021]
options = ["`useEffect`, because it always runs before paint", "`useLayoutEffect`, because it runs after commit but before paint", "`useMemo`, because it reads the DOM", "`useDeferredValue`, because it blocks layout"]
prompt = '''A popover needs to measure the DOM and set its position before the user sees the first frame. Which hook is a better fit?'''
explanation = '''`useLayoutEffect` runs after the DOM is committed and before the browser paints, which suits layout measurements that must avoid flicker. It can block painting, so do not use it for ordinary work.'''

[questions.react-x022]
prompt = '''An Effect creates a connection based on `roomId`. A logging callback needs the latest `theme`, but changing the theme should not reconnect. What should you consider in React 19?'''
options = ["Add `theme` to the dependencies and accept reconnection", "Use `useEffectEvent` for the logging logic called by the Effect", "Read the theme from a global variable", "Remove `roomId` from the dependencies"]
explanation = '''An Effect Event reads the latest props and state without making the Effect re-subscribe just because those values change. Call it from an Effect or its callback; do not use it as a UI event handler.'''

[questions.react-x043]
prompt = '''The function returned by `useEffect` to clean up a subscription or timer is called a `{{blank}}` function.'''
explanation = '''Cleanup releases resources created by setup before the next synchronization and when the component unmounts.'''

[questions.react-x044]
prompt = '''The React 19 API that lets an Effect call logic needing the latest props/state without adding them as subscription dependencies is `{{blank}}`.'''
explanation = '''`useEffectEvent` separates Effect Event logic from subscription setup. Call it only inside an Effect or a callback created by that Effect.'''

[questions.react-x045]
prompt = '''The Effect hook that runs after commit but before the browser paints, suitable for layout measurements that must avoid flicker, is `{{blank}}`.'''
explanation = '''`useLayoutEffect` runs before paint and can block it. Prefer `useEffect` unless you need synchronous layout measurement.'''

[questions.react-x049]
prompt = '''Explain how to decide whether `useEffect` is needed. Give at least one case that should be calculated during render or handled in an event handler, and one case where an Effect is appropriate.'''
keywords = [["derived state", "derived value", "calculate during render"], ["event handler", "event callback"], ["external system", "subscription", "timer"]]
model_answer = '''You do not need an Effect for **derived state** such as `fullName` from `firstName` and `lastName`; calculate it during render. Handle user-triggered actions in an **event handler**. Use `useEffect` to synchronize with an **external system**, such as a subscription or timer, and return the matching cleanup.'''
explanation = '''Effects should synchronize with systems outside React, not serve as the default way to connect pieces of state.'''

[questions.react-x050]
prompt = '''Describe how to avoid a race condition when fetching as `userId` changes quickly. Distinguish cancelling a request from ignoring an old result.'''
keywords = [["AbortController", "abort", "cancel request", "cancellation"], ["cleanup", "clean up"], ["ignore flag", "stale result", "ignore old result"], ["race condition", "request race"]]
model_answer = '''In an Effect keyed by `userId`, create an `AbortController` and cancel the request in cleanup when the ID changes or the component unmounts. If the client cannot cancel the operation, use an ignore flag to avoid committing a **stale result**. Cleanup and the guard both prevent a **race condition** in which old user data overwrites new data.'''
explanation = '''Cancelling a request saves resources when the API supports it; guarding the result still protects state if an old response arrives late.'''

[questions.react-xc10]
explanation = '''Cleanup cancels an operation when the underlying API supports a cancellation token. An `ignore` flag still blocks an old completion if the transport cannot cancel. In a real app, use the standard `AbortController`/signal and verify request ownership.'''

[questions.react-xc11]
explanation = '''The hook emits the initial value immediately, then limits update frequency while still preserving the final value in the waiting period.'''

[questions.react-xc12]
explanation = '''Cleanup mirrors setup, while the functional updater reads the latest state without re-registering the interval on every tick.'''

[questions.react-x033]
prompt = '''An Effect creates a subscription based on `roomId`. Choose the correct practices. (Select all that apply.)'''
options = ["Clean up the old subscription before synchronizing with the new room", "Include every required dependency so the Effect does not read a stale closure", "Ensure setup-cleanup-setup leaves exactly one active subscription", "Skip cleanup because Strict Mode runs only in development", "Use an Effect Event for callback logic that needs the latest value without changing the subscription"]
explanation = '''An Effect must declare its reactive dependencies and provide matching cleanup. Strict Mode helps expose bugs early; an Effect Event separates logic that reads the latest value from the subscription dependencies.'''

[modules.react-forms-a11y]
title = "Forms & Accessibility"
description = "Controlled forms, validation, focus management, ARIA, and modal portals."
lesson = '''### Usable forms
| Input type | Initial value | Who holds the value? |
|---|---|---|
| Controlled | `value` / `checked` | React state, updated through `onChange` |
| Uncontrolled | `defaultValue` / `defaultChecked` | The DOM; read it when needed through a ref or FormData |

```jsx
<label htmlFor="email">Email</label>
<input id="email" value={email} onChange={event => setEmail(event.target.value)} aria-invalid={Boolean(error)} aria-describedby="email-error" />
<p id="email-error">{error}</p>
```

Validation messages should be associated with their fields. After a failed submission, move focus to the first field with an error. Use real labels, preserve keyboard operation, and expose error state to assistive technology. A portal suits a modal, but the modal still needs to manage focus in and out, Escape handling, an accessible name, and background interaction.

### Common mistakes
- Using a placeholder instead of a label, or using color alone to show an error.
- Setting `aria-invalid` without linking the message through `aria-describedby`.
- Showing errors after submission while leaving focus on the submit button.
- Creating a modal portal without keeping and restoring focus to the opener.

### Interview checklist
- What gives a field its accessible name and error state?
- Where is the value stored in a controlled versus uncontrolled input?
- After an invalid submission, where should keyboard users go?
'''

[questions.react-x019]
prompt = '''An input has `value={email}` but no `onChange`, so the user cannot edit it. Why?'''
options = ["`value` creates a controlled input, so React keeps the value fixed unless state is updated", "React allows input only with `defaultValue`", "The input must be inside a portal", "`value` is only for checkboxes"]
explanation = '''A controlled input gets its value from React state. Add an `onChange` handler to update that state; to let the DOM hold the value, use `defaultValue` for an uncontrolled input.'''

[questions.react-x024]
prompt = '''Which attribute should associate the “Invalid email” message with the input so assistive technology can identify the error description?'''
options = ["`aria-describedby` pointing to the message's ID", "`data-error` pointing to a CSS class", "`tabIndex=-1` on the input", "`aria-hidden=true` on the message"]
explanation = '''`aria-describedby` links a description, including an error message, to the input. You can also set `aria-invalid` while the field has an error.'''

[questions.react-x046]
prompt = '''The ARIA attribute that links a description or error message to an input by ID is `{{blank}}`.'''
explanation = '''`aria-describedby` points to the ID of an element describing the input, often including instructions or a validation error.'''

[questions.react-x054]
prompt = '''Design accessible validation feedback for a multi-field form. Cover labels, error associations, invalid state, focus after submission, and requirements for a modal portal.'''
keywords = [["label", "accessible label"], ["aria-describedby", "describedby"], ["aria-invalid", "invalid state"], ["focus", "focus the field", "move focus"], ["portal", "modal"]]
model_answer = '''Give every input a correctly associated **label**. When it has an error, set `aria-invalid` and link the error text with `aria-describedby`; after a failed submission, move **focus** to the first invalid field. If the form is in a modal **portal**, give the dialog an accessible name, manage focus inside it, support an appropriate close action, and restore focus to the opener.'''
explanation = '''Validation must communicate both the error state and how to fix it to keyboard users and assistive technology.'''

[questions.react-xc14]
explanation = '''Fields usually follow the order in which users see them. The result can be used to move focus after submission; focus the DOM from the component.'''

[questions.react-x034]
prompt = '''A form has client-side validation. Which steps make an invalid field easier to identify and fix? (Select all that apply.)'''
options = ["Associate a label with the input", "Link the message with `aria-describedby`", "Set `aria-invalid` when the field has an error", "After an invalid submission, focus the first invalid field", "Use red as the only error indicator"]
explanation = '''A label, linked description, error state, and focus movement help users identify the problem and reach the field to fix it. Pair color with another signal.'''

[questions.react-x035]
prompt = '''A modal is rendered through a portal. Which requirements still need to be handled? (Select all that apply.)'''
options = ["An accessible name for the dialog", "Move focus into the dialog and manage focus inside it", "Restore focus to the opener when the dialog closes", "Allow closing with Escape when appropriate", "Assume the portal creates a focus trap automatically"]
explanation = '''A portal only changes the DOM location. It does not provide semantics, a focus trap, Escape handling, or focus restoration automatically; events still follow the React tree.'''

[modules.react-testing-arch]
title = "Testing & Component Architecture"
description = "Role-based queries, module organization, state colocation, context/store, error boundaries, and lazy loading."
lesson = '''### Organization and testing
| Problem | Approach | Trade-off |
|---|---|---|
| Testing UI | Query by role and accessible name | Matches how users find controls |
| State used in one area | Keep it near the component that owns that area | Reduces dependencies and broad re-renders |
| Data shared within a tree | Use Context | A changed Provider value updates consumers |
| Many subscriptions or selective updates | Use a store with selectors | Adds concepts and subscription machinery |

```jsx
const Page = lazy(() => import('./Page'));
<Suspense fallback={<p>Loading</p>}><Page /></Suspense>
```

Testing Library usually prefers `getByRole('button', { name: 'Save' })`; use `findByRole` when an element appears asynchronously. An Error Boundary recovers a rendering region from errors; `lazy` splits a chunk and needs a Suspense boundary. Keeping state near where it is used limits the number of dependent components. Lift it only when multiple areas truly need the same data.

### Common mistakes
- Querying by class or fragile DOM structure instead of role and name.
- Moving all state to the root or putting everything in Context from the start.
- Assuming Context automatically provides a subscription for each field.
- Omitting a fallback while a lazy component loads.

### Interview checklist
- Could this state live lower in the tree while still serving every consumer?
- Does the test check user behavior or implementation details?
- When is Context enough, and when do you need an external store with selectors?
'''

[questions.react-x020]
prompt = '''You need to verify that a save button has the accessible name “Save” and calls its handler when clicked. Which Testing Library query should you prefer?'''
options = ["`container.querySelector('.blue')`", "`getByRole('button', { name: 'Save' })`", "`getByTestId('save-1')`", "Find the third node in the body"]
explanation = '''A query by role and accessible name reflects how users find a control and can also reveal missing accessibility semantics.'''

[questions.react-x025]
prompt = '''A filter is used by `FilterPanel` and `Results`, two sibling components. Where is a reasonable first place to keep the state?'''
options = ["A global variable outside React", "The nearest common parent that needs to coordinate the two components", "Separate state in each component and synchronize it with an Effect", "A whole-app store regardless of scope"]
explanation = '''Lifting state to the nearest common parent creates one source of truth for both consumers without expanding the state scope unnecessarily.'''

[questions.react-x047]
prompt = '''In a React test, the React API for wrapping an operation that updates state and waiting for the update to be applied before asserting is `{{blank}}`.'''
explanation = '''`act` batches React updates caused by a test operation before assertions run. Testing Library already wraps common interactions in it in many cases.'''

[questions.react-x055]
prompt = '''Explain how to organize tests and state for a page with a filter, lazily loaded results, and a region that can fail. Name an appropriate Testing Library query.'''
keywords = [["getByRole", "role-based query", "accessible role"], ["state colocation", "colocation", "keep state near where it is used"], ["Context", "context"], ["Error Boundary", "error boundary"], ["lazy", "code splitting"], ["Suspense", "fallback"]]
model_answer = '''Keep filter state near `FilterPanel` and `Results`, lifting it to their common parent when both need it; use Context only when data truly needs to cross multiple levels. Test behavior with `getByRole` and an accessible name. Load large result sections with `lazy` inside `Suspense` with a fallback, and place an Error Boundary around the region that needs recovery.'''
explanation = '''State scope, error boundaries, and loading fallbacks should follow product areas; tests should check the semantics visible to users.'''

[questions.react-xc15]
explanation = '''History is a suitable state transition for a reducer. Test the hook with `renderHook` and `act` to verify undo/redo behavior and history limits.'''

[questions.react-x036]
prompt = '''Choose the appropriate Testing Library queries. (Select all that apply.)'''
options = ["Use `getByRole` for an element that should be present immediately", "Use `findByRole` when an element will appear asynchronously", "Use `queryByRole` to check that an element is currently absent", "Always prefer `getByTestId` over a role", "Use the accessible name to distinguish buttons with the same role"]
explanation = '''`getBy` fails immediately when there is no match, `findBy` waits asynchronously, and `queryBy` returns `null` when there is no match. Prefer role and name because they reflect accessibility.'''

[modules.react-dv-rules]
title = "Rules of React & Linting"
description = "Render purity, the Rules of Hooks, immutable updates, and diagnostics from eslint-plugin-react-hooks."
lesson = '''### Why does React need these rules?
React needs components and hooks that can be called again safely. During render, the same props, state, and context should produce the same result; rendering should not mutate external data, register listeners, or start side-effecting work. React may render again, pause, or retry a branch, so pure rendering keeps the UI independent of how many times a function runs.

| Rule | Good practice | Sign of a violation |
|---|---|---|
| Pure components | Derive JSX from props/state; handle actions in events | `Date.now()` changes content between renders |
| Call Hooks in a consistent order | Call them at the top of a function component or custom hook | A hook is inside an `if`, loop, or ordinary callback |
| Immutability | Create a new array/object when updating | `push`, `sort`, or assigning a field on props/state |
| Complete dependencies | Declare reactive values read by an Effect or callback | A closure reads stale values or lint reports missing dependencies |

```jsx
function addTodo(todos, todo) {
  return [...todos, todo];
}

function TodoCount({ todos }) {
  return <p>{todos.length} items</p>;
}
```

`eslint-plugin-react-hooks` checks the Rules of Hooks, dependencies, immutability, and some risky state-update patterns. Address its diagnostics instead of disabling lint broadly; these rules also help React Compiler analyze code reliably.

### Common mistakes
- Calling a component as `Child(props)` instead of letting React call `<Child />`.
- Calling `useState` only when a condition is true, changing hook order between renders.
- Mutating `props.items` with `sort()` and reusing the array.
- Omitting a dependency to force an Effect not to rerun, leaving its callback with stale data.
- Calling a setter during render to “fix” data, which can create a render loop.
'''

[questions.react-dv001]
prompt = '''A component needs to display a list sorted by name. Why should it avoid calling `items.sort(compareByName)` directly on a prop during render?'''
options = ["`sort` mutates the input array, so rendering causes a side effect and may affect other components", "React allows sorting only in an event handler", "`sort` always runs asynchronously", "A sorted array cannot have keys"]
explanation = '''`Array.sort` mutates the original array. Copy the array before sorting so render does not change data received from elsewhere.'''

[questions.react-dv002]
prompt = '''A component needs `useState` only when `enabled` is true. Which fix follows the Rules of Hooks?'''
options = ["Call `useState` unconditionally at the top of the component, then use `enabled` to decide what UI to show", "Call `useState` inside `if (enabled)`", "Call `useState` inside the button's enable callback", "Call `useState` in a loop only when enabled"]
explanation = '''Hooks must be called in the same order on every render. Apply the condition to the logic or JSX after calling the hook.'''

[questions.react-dv003]
prompt = '''A component calls `setTotal(total + 1)` in its function body during render to update itself. What is the main problem?'''
options = ["Updating state during render can create a render loop and violate purity", "A setter works only in a class component", "React ignores every setter in a function component", "`total + 1` always returns a string"]
explanation = '''Render should calculate UI from the current state. Updating state during render usually loops indefinitely; derive the value or update it in an appropriate event or Effect.'''

[questions.react-dv004]
prompt = '''What problems or violations can this code cause? (Select all that apply.)

```js
useMemo(() => items.sort(compare).filter(item => item.name.includes(query)), [items])
```'''
options = ["`sort` mutates the `items` array", "`query` is missing from the dependencies, so the result may use a stale query", "`filter` always changes component identity", "The compiler does not support every call to `filter`", "`useMemo` cannot be called in a component"]
explanation = '''The callback mutates its input with `sort` and reads `query` even though the dependencies include only `items`. Copy the array and declare every reactive input.'''

[questions.react-dv005]
prompt = '''Which behaviors make rendering impure or unsafe if React calls a component again? (Select all that apply.)'''
options = ["Calling `Date.now()` to put the current time in JSX", "Calling `window.addEventListener` directly during render", "Calling `items.push(newItem)` on props", "Creating a new array with `items.filter(...)`", "Displaying `count + 1` from props"]
explanation = '''Time changes between calls, a listener creates a side effect, and `push` mutates input data. Calculating on a new array and pure addition can safely be repeated.'''

[questions.react-dv006]
prompt = '''To sort a prop array without mutating the original, first make a copy with `{{blank}}`.'''
explanation = '''`slice()` or spread creates a new array. You can sort that copy instead of mutating the prop.'''

[questions.react-dv007]
prompt = '''In an interview, explain why React encourages pure components and immutable state updates. Connect this to React being able to re-render or retry a component.'''
keywords = [["pure", "purity", "pure component"], ["same inputs", "same output", "same inputs produce the same output"], ["retry", "interrupted", "re-render", "render again"], ["immutable", "immutability", "immutable update"]]
model_answer = '''A **pure** component produces the same result for the **same inputs** and does not cause side effects during render. React can call it again, interrupt it, or retry the render without unexpectedly changing external data. An **immutable** state update creates a new array or object so React can detect the change while keeping calculations safe to repeat.'''
explanation = '''A strong answer connects purity, flexible re-rendering, and change detection through new identities.'''

[questions.react-dvc01]
title = "Immutable todo update"
prompt = '''Write `updateTodo(todos, id, patch)` to return a **new array**. For the todo whose `id` matches, create a new object by merging the fields of `patch` into the old todo. Preserve order; do not mutate the input array or objects. Non-matching todos must keep their identity. If no ID matches, still return a new array containing the old elements.'''
hints = ["Use `map` to preserve order and create a new array.", "Create a new object only for the item with the matching ID; return the existing object for all other items."]
explanation = '''Immutable updates give React a new identity for the changed value without corrupting a data snapshot that another component may still use.'''

[modules.react-dv-compiler]
title = "React Compiler"
description = "Build-time component analysis, automatic memoization, directives, and incremental adoption."
lesson = '''### What does the compiler do?
React Compiler analyzes components and custom Hooks at build time, then can cache values or components that can be reused. It is not a hook that runs during rendering: code must still work correctly without optimization, and you do not call a compiler API from a component. The goal is to reduce repeated calculations or renders without changing the UI result.

| Part | Role | Safe assumption |
|---|---|---|
| Compiler in the build | Analyzes code and adds memoization when eligible | Do not assume every component is optimized |
| `eslint-plugin-react-hooks` | Reports patterns that block analysis or violate rules | Fix the cause instead of disabling lint broadly |
| Configuration/gating | Selects the scope and how the compiler enters the app | Roll out incrementally and monitor results |
| Directives | Control compilation in supported scopes | Use them only for a specific reason and with the configuration understood |

```jsx
function ProductList({ products, query }) {
  const normalized = query.trim().toLowerCase();
  const visible = products.filter(product => product.name.toLowerCase().includes(normalized));
  return <List items={visible} />;
}
```

This function only reads its inputs and calculates a result, which is easier to analyze than code that mutates props or reads values that change implicitly. A project can still keep `useMemo` or `useCallback` where measurement shows a benefit or where identity is part of an existing integration. Use the project's configuration and linting to learn which code the compiler recognizes.

### Common mistakes
- Assuming the compiler is enabled just because the project uses React 19; it must be integrated into the build.
- Treating memoization as a correctness guarantee instead of an optimization that can be skipped.
- Trying to force compilation of code with mutation or side effects during render instead of making the code pure.
- Removing all manual memoization without checking configuration, the Profiler, and app behavior.
- Ignoring compiler/lint diagnostics and losing visibility into skipped code.
'''

[questions.react-dv008]
prompt = '''At what stage does React Compiler primarily analyze components and add optimizations?'''
options = ["During the application build", "When a user clicks for the first time", "When the server receives its first request", "In an Effect after every render"]
explanation = '''The compiler is integrated into the build process to analyze source code and produce optimized code; it is not a hook that runs when a component renders.'''

[questions.react-dv009]
prompt = '''What is the purpose of the `'use no memo'` directive in code processed by React Compiler?'''
options = ["Tell the compiler to skip the marked scope", "Clear every browser cache", "Disable `useMemo` across the entire app at runtime", "Force React to render a component exactly once"]
explanation = '''The directive controls compilation for the corresponding scope. It is not a runtime command that changes the cache across the whole application.'''

[questions.react-dv010]
