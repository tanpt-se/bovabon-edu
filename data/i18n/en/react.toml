explanation = '''Context updates are not blocked by `memo`. Consider memoizing the `value` with `useMemo` and splitting contexts by how often their data changes.'''

[questions.react-082]
options = ["They can use `useState` and `useEffect`", "They run on the server, can use async/await to access a database directly, and do not send their own code in the client bundle", "They completely replace SSR", "They must have `'use server'` at the top of the file"]
prompt = '''Which statement about **React Server Components** is correct?'''
explanation = '''`'use client'` marks a Client Component boundary. `'use server'` is for **Server Functions/Actions**, not Server Components.'''

[questions.react-083]
options = ["Calling an API", "Rendering a modal or tooltip into a different DOM node (for example, `document.body`) while preserving Context and event bubbling through the React tree", "Sharing state between tabs", "Creating a Web Worker"]
