explanation = '''An object literal gets a new identity on every render, so React treats the context value as changed. You can memoize the value or split context by data; measure the impact before optimizing.'''

[questions.react-xc05]
explanation = '''This selector preserves the referential stability of its selected result. Skipping subscription updates by field requires selective subscription support; a memoized selector alone does not block renders caused by Context.'''

[questions.react-x037]
prompt = '''Choose the reasonable statements about state colocation and Context. (Select all that apply.)'''
options = ["Keeping state near its use often reduces the number of dependent consumers", "Lifting state up fits when a few components need the same state", "A changed Context value can re-render consumers that read that context", "Context automatically selects fields and notifies only consumers of those fields", "An external store with selectors is useful when selective subscriptions are needed"]
explanation = '''Colocation and lifting state up handle smaller sharing scopes. Context does not provide field-based subscriptions by default; a selector-based store can provide selective updates with additional trade-offs.'''

[modules.react-19]
title = "React 19: Actions & Compiler"
description = "Actions, new hooks, the ref prop, document metadata, use(), and React Compiler."
lesson = '''### React 19 APIs
| API | Role | Remember |
|---|---|---|
| `useActionState` | Associates an Action with its result state and pending status | The Action receives the previous state and an input |
| `useOptimistic` | Shows a temporary result while an Action is running | The final UI still needs to reflect the authoritative result |
| `useFormStatus` | Reads the parent form's status from a child component | The hook must be inside the `<form>` subtree |
| `use(value)` | Reads a Promise or Context during render | A pending Promise may trigger Suspense |

```jsx
function SubmitButton() {
  const { pending } = useFormStatus();
  return <button disabled={pending}>{pending ? 'Saving' : 'Save'}</button>;
}
```

React 19 allows a function component to receive `ref` as a prop; `forwardRef` remains common in older code. React DOM can hoist `<title>` and some `<meta>` elements from a component to the document. React Compiler can automatically memoize compatible code, but the compiler must be enabled and configured in the build.

### Common mistakes
- Calling `useFormStatus` in the component that owns `<form>` instead of a child component.
- Creating a new Promise on every render and passing it to `use()`.
- Assuming `useOptimistic` replaces storing a successful server result.
- Assuming every project has React Compiler enabled by default.

### Interview checklist
- What arguments does an Action receive, and where does pending state come from?
- When does optimistic state need to roll back?
- How is `use()` different from an ordinary hook?
'''

[questions.react-x006]
prompt = '''In React 19, how should a function component pass a `ref` through to a DOM input?'''
options = ["Receive `ref` as a regular prop and attach it to the input", "Use `createRef` only in a class", "Rename the prop to `key`", "Wrap the component in `React.memo` so the ref is forwarded automatically"]
explanation = '''React 19 allows a function component to receive `ref` as a prop, so new components do not need `forwardRef` just to pass a ref through.'''

[questions.react-x007]
prompt = '''A React DOM component renders `<title>Account</title>`. Which behavior does React 19 support?'''
options = ["`title` always stays in the body as an ordinary element", "React can hoist supported metadata into the document head", "React changes the title to `aria-label`", "Only a Server Component can render a title"]
explanation = '''React DOM supports document metadata such as `title` and `meta`. You can declare it near the component that uses it, and React handles its placement in the document.'''

[questions.react-x008]
prompt = '''A team enables React Compiler in its build. Which expectation is reasonable?'''
options = ["The compiler optimizes every third-party library automatically", "It can automatically memoize compatible code; the build still needs configuration and verification", "All hooks become synchronous", "Performance measurement and testing are no longer needed"]
explanation = '''When integrated correctly, React Compiler automatically memoizes code it can analyze. It does not remove the need to measure performance, test, or account for code it cannot compile.'''

[questions.react-x009]
options = ["The Action was cancelled", "The Action is in progress", "There is a validation error", "The component is unmounting"]
prompt = '''In `const [state, dispatchAction, isPending] = useActionState(action, initialState)`, what does the third value represent?'''
explanation = '''`isPending` indicates that the Action is currently running. It is useful for disabling a submit button or showing a loading state.'''

[questions.react-x010]
prompt = '''`useFormStatus()` does not return `pending: true` as expected. The hook is called in the component that owns the `<form>`. What is the right fix?'''
options = ["Move the hook to a child component rendered inside the form", "Call the hook after submitting", "Wrap the form in `useMemo`", "Change `<form>` to `<div>`"]
explanation = '''`useFormStatus` reads the nearest parent form's status, so the component that calls the hook must be inside that form's descendant tree.'''

[questions.react-x011]
options = ["React renders the Promise as a string", "Rendering may suspend until the Promise settles; an appropriate boundary is needed", "React automatically turns the Promise into local state", "The Promise is cancelled immediately"]
prompt = '''A component calls `use(userPromise)` while the Promise is still pending. What may happen?'''
explanation = '''`use` can read a Promise during render. A pending Promise suspends the component, and a rejection should be handled by an Error Boundary.'''

[questions.react-x028]
prompt = '''Unlike an ordinary hook, in which case can `use(promise)` be called?'''
options = ["Inside a component or hook, including a conditional branch or loop; the Promise still needs a stable identity", "Inside any JavaScript function outside React", "After the component has unmounted", "Only inside `useEffect`"]
explanation = '''`use` is a special API that can be used in a condition or loop while rendering a component or hook. Do not create a new Promise on every render, which can cause repeated suspension.'''

[questions.react-x029]
prompt = '''Which roles are appropriate for `useActionState`? (Select all that apply.)'''
options = ["Keep the result state returned by an Action", "Provide the Action's pending status", "Automatically turn every click handler into a Server Function", "Use an Action as a form action", "Completely replace server-side validation"]
explanation = '''`useActionState` manages state returned by an Action and its pending status; the Action can also be attached to a form. It does not automatically make a function a Server Action or replace server-side validation.'''

[questions.react-x030]
prompt = '''Choose the correct statements about `useOptimistic`. (Select all that apply.)'''
options = ["It can display a predicted state while an Action is running", "The authoritative state still needs to be updated when the server responds", "If the Action fails, the UI can return to the authoritative state", "Optimistic state guarantees that the server request succeeds", "Use a stable temporary key for a new item"]
explanation = '''Optimistic UI improves responsiveness but does not guarantee success. The Action or server still owns the authoritative result and error handling; temporary items need stable identities for matching.'''

[questions.react-x041]
prompt = '''The React DOM hook that lets a child component read `pending`, `data`, `method`, and `action` from its parent form is `{{blank}}`.'''
explanation = '''`useFormStatus` is exported from React DOM and must be called in a child component beneath the form being tracked.'''

[questions.react-x042]
prompt = '''The React 19 API that reads a Promise or Context during render and may suspend while the Promise is pending is `{{blank}}`.'''
explanation = '''`use(value)` reads a Promise or Context; a pending Promise may trigger Suspense.'''

[questions.react-x052]
prompt = '''Describe how `useActionState`, `useOptimistic`, and `useFormStatus` can work together when submitting a profile update form.'''
