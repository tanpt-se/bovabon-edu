[modules.cefr-c2-grammar-style]
title = "C2 · Grammar and Rhetorical Effect"
description = "Choose inversion, fronting, the subjunctive, end-weight, end-focus, noun clauses, and tense nuances to suit your purpose."
lesson = '''
### Choosing structures to control focus
At C2, grammar is not only about correctness; it also helps readers see which ideas deserve attention. Inversion often follows negative or restrictive adverbials placed at the beginning of a clause. Fronting moves an element forward to create contrast or connect ideas.

| Structure | Typical effect | Example |
|---|---|---|
| Never/Rarely + auxiliary + subject | Adds emphasis and a formal tone | *Rarely have the two sides agreed so quickly.* |
| Only after/Not until + clause + inversion | Puts a condition or time point first | *Only after the review did we see the full cost.* |
| It is vital that + subject + base verb | Makes a formal recommendation; uses the subjunctive | *It is vital that every copy be checked.* |
| It + verb + ... + to-infinitive/that-clause | Moves a long subject to the end (end-weight) | *It surprised us that the small team finished first.* |

The formal subjunctive uses the bare infinitive after verbs such as *recommend, insist,* and *request*, and adjectives such as *essential* and *important*. In British English, *should + bare infinitive* can express the same idea. Follow the task and the register, and do not add *-s* to a singular subject's verb in the subjunctive.

**End-weight** puts a long or complex element at the end to make a sentence easier to process; **end-focus** usually puts new or contrasting information at the end. A noun clause can function as a subject, object, or complement: *What the report leaves out matters*; *We cannot tell whether the figures are final.* Choose a structure that reflects the meaning rather than piling up clauses to make a sentence sound academic.

Tense and aspect also express attitude. *You are always interrupting* often suggests annoyance at repeated behaviour, unlike the neutral habit expressed by *You always interrupt*. The past simple in *I was wondering whether you could help* softens a request, even though it concerns the present. Vietnamese learners often omit inversion after *Only after*, use *becomes* in the subjunctive, misplace adverbs, or make sentences too long. First decide what you want to emphasise, then check the auxiliary, verb form, and subject length.

### Editing for precision and ease of reading
At C2, writers choose structures for emphasis while avoiding unclear reference. If two nouns could be the antecedent, repeat the necessary noun or recast the sentence. Lists should be parallel, and a participle clause needs a clear implied subject. Ellipsis is natural when the omitted words are recoverable: *The first draft was approved, and the second was too.* Do not omit material if readers would have to guess it.

When editing, ask whether a sentence allows more than one reading, whether new information is placed appropriately, and whether a hedge preserves the intended certainty. Concision does not mean deleting conditions or qualifiers. Fronting, inversion, the subjunctive, and end-focus are purposeful choices, not decoration to make a sentence look advanced.
'''

[questions.cefr-c2-001]
explanation = "A restrictive phrase such as *Only after...* at the beginning triggers auxiliary inversion: *did the team realise*. After *did*, use the base form of the verb."

[questions.cefr-c2-002]
explanation = "After *It is vital that*, the subjunctive uses the base form *be*. Learners often add *-s* to agree with a singular subject or confuse it with a past tense."

[questions.cefr-c2-003]
explanation = "The cleft construction *it was ... that* places emphasis on the new information at the end. The other options end with known information or have less natural word order."

[questions.cefr-c2-004]
explanation = "The noun clause *Whether the dates are realistic* is the subject of *remains unclear*. In the other options, the clause is an object or complement."

[questions.cefr-c2-005]
explanation = "The present continuous with *always* often conveys irritation about repeated behaviour. The present simple describes a more neutral habit."

[questions.cefr-c2-006]
explanation = "The subjunctive uses the base form (*be checked, be omitted, be*). Sentence 3 needs *be shortened*; sentence 4 needs *leave* in the subjunctive reading."

[questions.cefr-c2-007]
explanation = "When *Not until, Rarely,* or *At no point* begins a sentence, the main clause inverts the auxiliary and subject. Sentence 3 lacks inversion; sentence 5 puts *never* in the wrong position."

[questions.cefr-c2-008]
explanation = "Because *Never before* is fronted, the auxiliary *has* must come before the subject. The present perfect suits a period that continues up to the present."

[questions.cefr-c2-009]
explanation = "After *asked that*, the passive subjunctive uses *be + past participle*: *be reviewed*."

[questions.cefr-c2-010]
prompt = "Choose the sentence that most naturally uses the dummy subject *It* to move a long piece of information to the end (end-weight)."
explanation = "The pattern *It took + person + amount of time + to-infinitive* places the long infinitive phrase at the end, following the end-weight principle. Sentence 2 is grammatical but front-loads too much; sentence 3 has incorrect word order; sentence 4 redundantly repeats the pronoun *it*."

[questions.cefr-c2-011]
explanation = "The model answer uses the subjunctive after *It is essential that* and places the *whether*-clause at the end for emphasis."

[modules.cefr-c2-vocab-idiom]
title = "C2 · Idioms, Metaphors, and Nuance"
description = "Recognise fixed idioms, figurative meanings, connotations, common colloquialisms, and less familiar collocations."
lesson = '''
### Learning phrases with their nuance
At C2, a broad vocabulary needs to be matched by an understanding of implication, level of formality, and the words that commonly occur together. A bilingual dictionary may give an approximate meaning without showing whether a phrase sounds approving, critical, ironic, or casual. Record the whole phrase, its context, and the audience it suits.

| Phrase/word | Meaning and nuance | Example |
|---|---|---|
| the elephant in the room | An obvious problem that everyone avoids | *The cost was the elephant in the room.* |
| open a can of worms | Bring up many complicated problems | *The inquiry opened a can of worms.* |
| a long shot | Unlikely, but still possible | *Getting approval today is a long shot.* |
| patronising | Seem kind while putting someone down | *That praise sounded patronising.* |
| inextricably linked | Connected so closely that separation is difficult | *Trust and transparency are inextricably linked.* |

Idioms often have a fixed form: *let the cat out of the bag* means to reveal a secret accidentally; replacing *cat* with a near-synonym would break the idiom. Metaphors such as *gather momentum* or *a fragile relationship* create an image but still depend on the right meaning. Do not translate each word literally.

**Connotation** is the evaluative nuance associated with a basic meaning. *Frugal* is often approving, while *miserly* is critical; *confident* is positive or neutral, while *arrogant* is disapproving. Colloquial phrases such as *a long shot* or *that sounds fishy* are useful to recognise when reading or in text-based listening practice, but do not automatically use them in a formal report or letter. Less familiar collocations such as *inextricably linked* are best learned as fixed pairs. Vietnamese learners often choose a synonym based only on its dictionary definition, alter an idiom's form, or confuse casual language with neutral language. Before using a phrase, consider who is speaking to whom, the purpose, its positive or negative tone, and the register.

### Implication, connotation, and register
A word can be dictionary-correct but have the wrong nuance: *frugal* is often positive, while *stingy* is usually critical. *Ostensibly* creates distance between a stated purpose and what the writer suspects about reality. Idioms such as *a Pyrrhic victory* or *the tip of the iceberg* require the right context; in a formal report, a direct explanation may sometimes be more precise.

Learn collocations as phrases and note their register: *mitigate the impact, come under scrutiny, draw a distinction*. Slang and irony depend on speakers, culture, and context; do not infer meaning from isolated words. When choosing a word, consider the audience, formality, positive or negative implication, and the certainty of the evidence.
'''

[questions.cefr-c2-012]
explanation = "*The elephant in the room* is a major, obvious issue that people avoid discussing. A *red herring* is a detail that distracts from the main issue."

[questions.cefr-c2-013]
explanation = "*Gather momentum* describes something that grows steadily stronger. The other options refer respectively to raising a new problem, being overlooked, or missing the main point."

[questions.cefr-c2-014]
explanation = "*Surprisingly well* implies that the speaker expected less ability; the compliment may therefore sound *patronising*, as if it puts down an experienced person."

[questions.cefr-c2-015]
explanation = "A *foregone conclusion* is an outcome considered certain in advance. If the vote was nearly tied, the result was still undecided."

[questions.cefr-c2-016]
explanation = "The colloquial phrase *a long shot* describes an opportunity with a low chance of success. Recognising it while reading helps avoid interpreting each word literally."

[questions.cefr-c2-017]
explanation = "*Call it a day* means stop working; *open a can of worms* means bring up further problems; and *move the goalposts* means change criteria or requirements midway through. The other two sentences use idioms inconsistently with their meanings."

[questions.cefr-c2-018]
explanation = "*Miserly, arrogant,* and *childish* are usually more critical than *frugal, confident,* and *childlike*. The last two pairs are close to neutral synonyms and do not create as clear an evaluative contrast."

[questions.cefr-c2-019]
explanation = "The fixed idiom is *the elephant in the room*. The preposition *in* is part of the phrase and should not be translated word by word."

[questions.cefr-c2-020]
explanation = "The standard collocation is *inextricably linked*, meaning closely connected and difficult to separate."

[questions.cefr-c2-021]
explanation = "*Fishy* is an informal word meaning suspicious. *Suspicious* is the closest option in meaning while using a more neutral register in this sentence."

[questions.cefr-c2-022]
explanation = "The model answer uses an idiom for a proposal that brought up further problems and an adjective with a demeaning connotation to describe the compliment."

[modules.cefr-c2-discourse]
title = "C2 · Implication and Register"
description = "Interpret implication, irony, understatement, vague language, and ellipsis; choose a register to suit the audience and purpose."
lesson = '''
### Reading what a speaker implies
Communicative intent does not always match literal meaning. At C2, interpret words alongside context, the relationship between speaker and listener, and the tone suggested by punctuation or word choice.

| Expression | Typical effect | Example |
|---|---|---|
| Irony | The intended meaning contrasts with the surface praise | *Wonderful timing!* (when the bus has just left) |
| Understatement | Makes something sound less serious, often for politeness or humour | *The delay was not ideal.* |
| Hedging | Reduces certainty and leaves room for discussion | *I may be mistaken, but the total seems high.* |
| Vague language | Deliberately avoids an exact quantity or detail | *We invited about thirty people and a few others.* |
| Ellipsis | Leaves out words that can be recovered from context | *Seen the latest draft?* (= *Have you seen... ?*) |

Irony depends on the situation: *That went well* can be sincere praise or criticism when something has clearly failed. Understatement can make criticism less harsh, but an incident report should state the severity accurately rather than obscure responsibility. Phrases such as *sort of, more or less,* and *and stuff* are usually colloquial; use them deliberately in informal conversation, not in place of figures that need to be verified.

Register varies with the audience, purpose, medium, and familiarity between people. For a client, *Would you mind sending the signed copy when convenient?* is usually more suitable than a bare command or an excessively deferential plea. Ellipsis such as *I might* instead of *I might take the train* sounds natural when the verb phrase is already clear; not every fragment suits formal writing. Vietnamese learners may take every sentence literally, overuse *please* instead of choosing a tactful structure, or carry colloquial language into a report. Ask what the speaker wants the listener to do, how certain the speaker is, and what can be omitted without causing confusion.

### Implication and strategic interaction
An utterance can mean more than its literal wording. Calling a plan *a flawless demonstration* immediately after a failure may be ironic. *Finally* can allude to previous delays, though interpretation still depends on context and the relationship between speakers.

When disagreeing, soften the opening while keeping the point clear: *I see the reasoning; my concern is that the sample is too small.* In online discussion, confirm the meaning of important terms before settling a decision. Ask for clarification, restate the other person's view, then identify the difference; do not assume everyone uses a word in the same way.
'''

[questions.cefr-c2-023]
explanation = "Because the presentation failed, the surface praise conflicts with the situation. The remark is ironic rather than a literal positive assessment."

[questions.cefr-c2-024]
explanation = "The serious problems contrast with the phrase *one or two minor issues*, so the speaker uses understatement to soften the criticism."

[questions.cefr-c2-025]
explanation = "*And stuff* is colloquial and leaves the other items unspecified. In a formal document, list them or define the scope more clearly."

[questions.cefr-c2-026]
explanation = "Option 2 makes a polite request, explains the next step, and maintains a professional register. The alternatives are abrupt, excessively formal, or too casual."

[questions.cefr-c2-027]
explanation = "The modal verb *might* stands in for the verb phrase *take the early train*, which is already clear from the question. This ellipsis avoids repetition in conversation."

[questions.cefr-c2-028]
explanation = "The suitable replies express disagreement based on a conclusion or evidence, with different degrees of directness but without attacking anyone personally. The other two are confrontational and unconstructive."

[questions.cefr-c2-029]
explanation = "In informal conversation, a subject and auxiliary can be omitted in *Want...?*, *Coming...?*, and *Seen...?*. Sentence 3 uses both *although* and *but* unnecessarily; sentence 5 is complete and contains no ellipsis."

[questions.cefr-c2-030]
explanation = "*I have* repeats the auxiliary from the question and omits *seen the first draft*. The context makes the shortened reply clear."

[questions.cefr-c2-031]
explanation = "*About, around,* and *roughly* all express an approximate quantity; choose one that suits the register and rhythm of the sentence."

[questions.cefr-c2-032]
explanation = "Use a gerund after *Would you mind*: *checking*. This structure turns a direct command into a polite request."

[questions.cefr-c2-033]
explanation = "The model answer uses a hedge to disagree tactfully, then uses *a couple of* in conversation for a quantity that does not need to be exact."

[modules.cefr-c2-reading-writing]
title = "C2 · Critical Reading and Editing"
description = "Analyse journalistic and literary texts, claims, and evidence; write with parallel structure, coherence, and concision."
lesson = '''
### Reading arguments and editing with purpose
A C2 text may present evidence, counterarguments, and conclusions within the same paragraph. When reading journalism, identify the main claim, locate the evidence, and check whether it actually supports the conclusion or merely suggests it. In literature, notice sensory details, imagery, sentence rhythm, and what the narrator deliberately leaves unsaid.

| Textual signal | Question to ask | Short example |
|---|---|---|
| *Although, admittedly* | What point does the author concede? | *Although costs fell, complaints rose.* |
| *The figures suggest...* | Is this a firm conclusion or a qualified one? | *The figures suggest a modest improvement.* |
| Repeated detail or image | What tone or theme does it create? | *The untouched cup remained by the door.* |
| Parallel list | Do the elements have the same grammatical form? | *to reduce costs, shorten delays, and improve access* |

A nuanced argument may acknowledge a benefit while also identifying a limit: *The trial shortened waiting times, although it did not measure appeal rates.* Do not turn correlation into causation or generalise from a small sample. Separate what the text states explicitly from what you infer; use words such as *suggests, may,* and *does not establish* to keep the level of certainty accurate.

Parallelism makes equally important ideas easier to follow. After *aims to*, write *reduce costs, shorten delays, and improve access*; do not mix *to reduce, shortening,* and *that access improves*. Make a sentence concise by removing empty phrases such as *due to the fact that* (often replaceable with *because*), avoiding repeated transition words, and keeping the agent clear. Vietnamese learners often overuse *moreover/furthermore* at the start of every sentence, join clauses with commas, or carry Vietnamese sentence structure into long, cumbersome English sentences. First mark the claim, evidence, and limitation; then check that each list uses parallel forms and each sentence contains only the information it needs.

### Critical reading, editing, and multi-source synthesis
Follow the claim, evidence, data choices, and omissions in an argument. Distinguish findings by group or time; do not turn them into a universal conclusion. A statement such as *may have contributed* does not prove causation. Notice conditions, scope, and certainty.

A synthesis of multiple sources should preserve differences in samples, measures, timing, and results. Report disagreement rather than selecting the source that supports a preferred view. Edit so the main point appears early; remove repetition but keep caveats that affect a decision. Use a direct verb when nominalisation hides the actor, and shorten only when nuance is preserved.
'''

[questions.cefr-c2-034]
explanation = "The writer acknowledges that initial decision times fell but stresses that appeal data are missing, so overall efficiency cannot be established. Do not turn an indication into proof of causation."

[questions.cefr-c2-035]
explanation = "The smell, untouched cup, and letter create an atmosphere. The writer leaves the letter and footsteps unexplained, leaving room for the reader to infer what happened."

[questions.cefr-c2-036]
explanation = "The writer challenges the description of the fee as a simple incentive by pointing out its unequal effects. The sentence does not claim that every small organisation will close."

[questions.cefr-c2-037]
explanation = "*Admittedly* concedes one positive point before the argument qualifies its conclusion. It does not make the conceded point evidence for an outcome that was not measured."

[questions.cefr-c2-038]
explanation = "After *aims to*, use three base-form verbs in parallel. Do not mix *to + verb*, a noun form, and an *-ing* form in the same list."

[questions.cefr-c2-039]
explanation = "The note directly reports that the sample's median completion time fell and says seasonal changes were not controlled for. This design is not enough to prove causation, approval rates, or value for money."

[questions.cefr-c2-040]
explanation = "Sentence 1 uses three parallel verbs; sentence 3 uses three noun phrases; and sentence 5 connects two complete clauses. Sentences 2 and 4 mix grammatical forms within a list."

[questions.cefr-c2-041]
explanation = "*Because* expresses the cause directly and more concisely than *due to the fact that*."

[questions.cefr-c2-042]
explanation = "*Decide whether* conveys the same idea as *make a decision about whether* more concisely."

[questions.cefr-c2-043]
explanation = "The sentence adverbs *however, nevertheless,* and *nonetheless* all signal contrast. The semicolon separates two independent clauses."

[questions.cefr-c2-044]
explanation = "The model answer limits its claim to what the evidence supports, notes what was not measured, and uses three parallel nouns for further research."

[modules.cefr-c2-mediation]
title = "C2 · Mediation and Multi-Source Synthesis"
description = "Summarise and reorganise information from multiple sources, adapt the register, convey disagreement, and preserve degrees of certainty."
lesson = '''
### Conveying ideas without distortion
Mediation helps others access information or understand different parties; it is not word-for-word translation. A mediator selects relevant points, organises them coherently, and adjusts the level of detail or register for the audience while preserving each source's position and degree of certainty.

| Task | Preserve | Example wording |
|---|---|---|
| Summarise a report | The conclusion and limits of the data | *The trial shortened waits, but did not measure repeat visits.* |
| Synthesize several sources | Shared points and differences | *Both sources note shorter waits; only the interviews mention timing concerns.* |
| Write for a non-specialist | The main idea; remove unnecessary jargon | *We cannot tell whether the programme caused the change.* |
| Convey disagreement | Represent each side fairly | *Staff want more notice; managers need service hours to remain stable.* |

Before writing, mark which points are supported by every source, which appear in only one, and which limitations prevent a stronger conclusion. Preserve modality: *may improve* does not mean *improves*; *is associated with* does not prove *caused by*. If two parties disagree, include both views rather than quietly choosing the one you find more plausible. When simplifying for a general audience, explain technical terms without omitting important conditions.

A good summary usually removes secondary examples, repetition, and details that do not serve the audience; it does not add causes, motives, or figures that the sources never state. Vietnamese learners may translate Vietnamese sentence structure directly, merge several sources into a single voice, or drop qualifiers such as *some, may,* and *preliminary*. Check whether you can identify the source behind every claim in your writing, and whether a new reader can understand it without being led to an overconfident conclusion. When writing for two different groups, keep the core information and adjust terminology, detail, and formality.

### Relaying information accurately to different audiences
Advanced mediation preserves certainty, conditions, and disagreement while changing the wording for the audience. Explain technical terms plainly, distinguish observed facts from what remains uncertain, and check what the recipient needs. Do not turn preliminary results into firm claims or remove limitations just to make the message shorter.

When sources disagree, present each finding separately, mention differences in groups or timing when relevant, and conclude only what the evidence supports. In a multi-party meeting, clarify terms with several meanings and confirm the next action in writing.
'''

[questions.cefr-c2-045]
explanation = "The answer keeps the scope limited to a small sample, combines the trial result with interview feedback, and does not present early indications as universal evidence."

[questions.cefr-c2-046]
explanation = "The paraphrase replaces technical terms with plain language while preserving both sides of the result: typical responses became quicker, while the slowest group took longer."

[questions.cefr-c2-047]
explanation = "Option 2 gives the reasons and needs of both groups without assigning motives or claiming that either side has accepted a proposal."

[questions.cefr-c2-048]
explanation = "The synthesis preserves the positive finding from Source A and the remaining problem reported by Source B. It does not infer anything about every user or cancellation rates."

[questions.cefr-c2-049]
explanation = "Option 2 removes the jargon while keeping the limitation: the data do not establish whether the programme caused the change, rather than proving either that it did or did not have an effect."

[questions.cefr-c2-050]
explanation = "Option 1 preserves the curator's point about drawing attention to details and the adviser's condition that written captions remain available. The other choices misrepresent or omit one of the views."

[questions.cefr-c2-051]
explanation = "Distinguish shared findings from points reported by only one source, preserve qualifiers, and simplify necessary technical language without changing the claim. Removing limitations or treating association as causation distorts the sources."

[questions.cefr-c2-052]
explanation = "Both sources say that the average waiting time fell by 12 minutes. Passive wording or a near-synonymous verb is acceptable as long as it preserves the size of the decrease."

[questions.cefr-c2-053]
explanation = "*Brief outage* or *temporary outage* tells users clearly that the service will be unavailable for a short time."

[questions.cefr-c2-054]
explanation = "*That said, however,* and *nevertheless* can all move from acknowledging a point to introducing a contrast, while keeping a tactful tone."

[questions.cefr-c2-055]
explanation = "These phrases preserve the cautious level of *possibly indicate*. Do not replace them with *prove* or *show*, which would make a stronger claim than the source."

[questions.cefr-c2-x001]
explanation = "Sentence 1 makes clear that the editor revised the statement before the chair spoke to her; the other options leave the pronoun open to more than one reference."

[questions.cefr-c2-x002]
explanation = "The three base verbs after “aims to” — “reduce, improve, make” — form a balanced parallel list."

[questions.cefr-c2-x003]
explanation = "Options 1 and 3 make clear that the advisers were concerned. Option 2 changes the meaning to say both sides were concerned; option 4 remains ambiguous, and option 5 makes the proposal sound concerned."

[questions.cefr-c2-x004]
explanation = "“And the second was too” omits the repeated noun and keeps the auxiliary."

[questions.cefr-c2-x005]
explanation = "The passive subjunctive after “recommends that” uses “be + past participle”: “be retained.”"

[questions.cefr-c2-x006]
explanation = "The sentence puts the important contrast at the end: the committee rejected the forecast, not the model."

[questions.cefr-c2-x007]
explanation = "Sentence 1 inverts after “Only after”; sentence 2 has a clear passive participle phrase; sentence 4 uses a noun clause. Sentence 3 dangles, and sentence 5 lacks inversion."

[questions.cefr-c2-x008]
explanation = "A fronted “Not until” requires inversion in the main clause; use “did” before the subject and the base verb after it."

[questions.cefr-c2-x009]
explanation = "The edit removes padding while preserving the hedge “may” and the limited degree “slight”; the other options strengthen the claim."

[questions.cefr-c2-x010]
explanation = "The sample gives a formal recommendation, identifies the records, and states the retention period."

[questions.cefr-c2-x011]
explanation = "A “Pyrrhic victory” is a victory gained at excessive cost, which fits a contract that produces a net loss."

[questions.cefr-c2-x012]
explanation = "“Mitigate the impact” is the natural collocation; the other verb-particle combinations are not idiomatic here."

[questions.cefr-c2-x013]
explanation = "“Frugal” often praises careful spending, while the other choices usually criticise someone as ungenerous."

[questions.cefr-c2-x014]
explanation = "“Flawless” clashes with the outage context, so the comment is most likely ironic."

[questions.cefr-c2-x015]
explanation = "The natural phrase is “come under scrutiny,” meaning to receive close examination."

[questions.cefr-c2-x016]
explanation = "Natural phrases include “draw a distinction,” “pose a question,” and “reach a consensus.” Say “reach/draw a conclusion” and “heavy rain.”"

[questions.cefr-c2-x017]
explanation = "The first option states the inconsistency precisely and formally; the others are colloquial or subjective."

[questions.cefr-c2-x018]
explanation = "“Toe the line” means to comply with a rule or requirement; the other idioms do not fit."

[questions.cefr-c2-x019]
explanation = "“Ostensibly” marks a stated or apparent purpose; the second clause contrasts with the actual result."

[questions.cefr-c2-x020]
explanation = "The sample replaces the metaphor with a formal expression while keeping the idea that the first delay revealed a larger problem."

[questions.cefr-c2-x021]
explanation = "The plan depends on partners renewing, but the passage does not establish that they will."

[questions.cefr-c2-x022]
explanation = "“Promising start” is positive, while “hardly a verdict” limits the conclusion; there is no call to stop the pilot."

[questions.cefr-c2-x023]
explanation = "The uneven space given to benefits and costs is a reason to examine the balance of the argument, though it does not by itself prove bias."

[questions.cefr-c2-x024]
explanation = "The synthesis preserves the group and outcome reported by each source without generalising to all customers."

[questions.cefr-c2-x025]
explanation = "“Overstates” means that the conclusion is stronger than the evidence warrants."

[questions.cefr-c2-x026]
explanation = "The reviewer questions omitted downside risks. “Ambitious” may signal qualified praise or scepticism depending on context; the passage does not prove the forecast false."

[questions.cefr-c2-x027]
explanation = "“May review” permits or allows a review; unlike “will review,” it does not clearly promise one."

[questions.cefr-c2-x028]
explanation = "The apparent invitation is undercut because scrutiny is allowed only after the decision is final."

[questions.cefr-c2-x029]
explanation = "The criticism is implied through the reasoning rather than stated directly."

[questions.cefr-c2-x030]
explanation = "The synthesis preserves both results and the distinction between routine and complex cases."

[questions.cefr-c2-x031]
explanation = "The sentence preserves the condition and timing while using a shorter structure."

[questions.cefr-c2-x032]
explanation = "The correct paraphrases preserve the source's uncertainty and avoid claiming a sole cause."

[questions.cefr-c2-x033]
explanation = "Move the main recommendation earlier to orient readers; retain only conditions that affect the decision."

[questions.cefr-c2-x034]
explanation = "The sentence attributes the claim to the authors and separately reports the reviewer's concern about evidence."

[questions.cefr-c2-x035]
explanation = "The phrase prevents readers from extending the finding automatically beyond the tested population."

[questions.cefr-c2-x036]
explanation = "A fair synthesis needs the measured outcomes, relevant sample differences, and limits on inference; it should not cherry-pick."

[questions.cefr-c2-x037]
explanation = "The direct verb identifies the audit team as the actor and avoids heavy nominalisation."

[questions.cefr-c2-x038]
explanation = "These phrases make replication an explicit condition of adopting the change."

[questions.cefr-c2-x039]
explanation = "A summary for a senior reader should put the recommendation and its main reason first."

[questions.cefr-c2-x040]
explanation = "The sample preserves the time distinction between an initial gain and the lack of a sustained effect."

[questions.cefr-c2-x041]
explanation = "The reply notices the implication about earlier delays, responds calmly, and points to a concrete improvement."

[questions.cefr-c2-x042]
explanation = "The correct options soften the opening but still identify the concern; option 5 avoids addressing the substance."

[questions.cefr-c2-x043]
explanation = "The contrast between “interesting” and “complete failure” suggests ironic criticism rather than direct praise."

[questions.cefr-c2-x044]
explanation = "The linker acknowledges the intention before introducing a practical problem, keeping the tone diplomatic."

[questions.cefr-c2-x045]
explanation = "Clarify the term before deciding so participants do not rely on different meanings."

[questions.cefr-c2-x046]
explanation = "Explain the term, preserve stated probability and conditions, and separate known facts from open questions. Do not remove uncertainty or add unsupported claims."

[questions.cefr-c2-x047]
