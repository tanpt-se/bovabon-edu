'''
explanation = "`useEventSource` wraps a Server-Sent Events connection from server to client."

[questions.vue-dv028]
prompt = "Interview question: Design a page that first displays HTTP data, then receives realtime updates, and has a button to copy the result. Choose a composable for each part, explain error and lifecycle handling, and describe the limits of browser permission."
keywords = [["useFetch", "http"], ["useEventSource", "server-sent events"], ["useWebSocket", "websocket"], ["loading", "error", "retry"], ["permission", "authorization", "server authorization"]]
model_answer = '''Use `useFetch` for the initial HTTP data and show loading/error/retry states. If the server only pushes one-way updates, choose `useEventSource`; if the client also needs to send realtime messages, consider `useWebSocket`. Close the connection when the component scope ends. Use `useClipboard` when the user asks to copy and handle capability errors; browser permission does not replace server authorization.'''
explanation = "The answer should choose a transport based on communication direction, manage errors and lifecycle, and distinguish browser permission from backend authorization."

[questions.vue-dvc04]
title = "Accept Only the Latest Request Result"
prompt = '''
Implement `createLatestRequestState()` so it returns `{ state, begin, resolve, reject, cancel }`.
- `state` starts as `{ requestId: 0, loading: false, data: null, error: null }`.
- `begin()` increments the request ID, sets `loading` to true, clears `error`, keeps `data` unchanged, and returns the new ID.
- `resolve(id, value)` accepts a result only when the ID is current and a request is loading; if accepted, update `data`, turn off loading, and return `true`.
- `reject(id, error)` follows the same rule, saves the error, turns off loading, and returns `true`.
- A stale result or repeated settlement must return `false` without changing state. `cancel(id)` cancels only the current loading request, increments the ID to invalidate the old token, turns off loading, and returns `true`; otherwise return `false`.
'''
explanation = "A request ID protects state when requests compete; in a real app, prefer cancelling old work when the transport supports it."
hints = ["Increment `requestId` and settle only when the token is still current and loading is true.", "Cancelling must invalidate the old token so a late callback cannot write to state."]
