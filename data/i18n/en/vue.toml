[modules.vue-dv-state]
title = "VueUse State, Storage, and History"
description = "Share state intentionally, persist reactive values, and undo data changes."
lesson = '''
### Shared state and persistence with VueUse
Component-local state suits data with a single owner. When several screens need the same state, choose its sharing scope and lifecycle deliberately instead of putting everything in one global variable. VueUse provides helpers for shared state, storage synchronization, value history, and async tasks. These helpers reduce repetition but do not replace decisions about data ownership.

| API | Purpose | Scope or note |
|---|---|---|
| `useStorage` | Synchronize a ref with storage | Values must be serializable/parseable; storage belongs to the browser environment |
| `useRefHistory` | Keep snapshots for undo/redo | Use `deep: true` to track nested changes inside an object |
| `createGlobalState` | Reuse state across multiple calls | It can live as long as the module/app; consider SSR |
| `createSharedComposable` | Share one composable among consumers | Shared until no consumers remain under scope management |
| `useAsyncState` | Represent an async task's result | The UI still needs loading, error, retry, and request-order policies |

For example, `const settings = useStorage('settings', { theme: 'light' })` synchronizes a preference with client-side storage. Serialization is an important boundary for objects: functions, circular references, or values that do not fit JSON are poor defaults for persisted data. Do not store high-value secrets in localStorage, because scripts from the same origin can read it. In SSR, mutable state at module scope may be shared between requests; check the scope or initialize it per request.

`useRefHistory` is useful for undo or inspecting changes. If it tracks object replacement but nested properties are mutated, enable deep tracking or replace objects immutably. Common mistakes include confusing `createGlobalState` with component-local state or accidentally sharing data between different users. Choose persistence when data must survive reloads, history when a user needs to undo changes in a session, and a shared composable when multiple consumers should observe the same source with a defined lifecycle.
'''

[questions.vue-dv015]
prompt = "A preference must remain available after the user reloads the page. Which VueUse API is the best fit?"
explanation = "`useStorage` synchronizes a ref with storage; state shared only in memory does not survive a reload."

