options = ["It indicates a client-side capability; the server API must still check access to its data", "Clipboard permission means the user is allowed to read all server data", "Permission is always supported and requires no error handling", "Server authentication can be skipped when the client uses a permission composable"]
explanation = "The Permission API reflects browser permission for a capability; it is not an authorization mechanism for the backend."

[questions.vue-dv025]
prompt = "Match each need to the appropriate VueUse composable. Select every correct option."
options = ["HTTP request/response for profile data: `useFetch`", "One-way events pushed by the server: `useEventSource`", "A chat that sends and receives realtime messages: `useWebSocket`", "Copy text to the clipboard: `usePermission`"]
explanation = "The three network APIs have different communication models; clipboard operations use `useClipboard`, while `usePermission` only observes browser permission state."

[questions.vue-dv026]
prompt = "A composable has a request tied to a rapidly changing query and a WebSocket that lives as long as its component. Choose appropriate measures."
options = ["Ignore an old request response using a request ID or cancellation", "Show loading/error states and allow an appropriate retry", "Close the connection or remove its listener when the scope is no longer used", "Treat browser permission state as backend access authorization"]
explanation = "Requests can arrive out of order; long-lived connections need lifecycle and status management. Browser permission does not replace server authorization."

[questions.vue-dv027]
prompt = '''
Fill in the composable for one-way server-sent events:
```js
