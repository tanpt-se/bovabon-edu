model_answer = '''First measure and profile the page to determine whether rendering, reactive tracking, or layout is the bottleneck. Use virtualization to render only visible rows, reducing DOM and patch work at the cost of more complex scrolling and row sizing. For large immutable data, consider shallow reactivity to reduce proxy overhead, and keep row components and keys stable. Measure again to confirm the change helped; memoization can make content stale if its dependencies are incomplete.'''
explanation = "A strong answer measures before changing code, identifies techniques such as virtualization and reduced reactive overhead, and explains a concrete tradeoff."

[modules.vue-lead]
title = "Advanced Architecture, Migration, and Optimization"
description = "Scalable state management, component architecture, testing strategy, performance optimization, TypeScript integration, and Vue 2-to-3 migration."
lesson = '''
### Advanced Vue architecture and optimization

For a large application, divide state by domain: use Pinia for shared state, composables for reusable logic, and local state for local UI. Feature-oriented components keep code close to its purpose, reduce coupling, and make maintenance easier. Testing choices should reflect the risk: unit tests for composables and logic, and end-to-end tests for important user flows; uniform coverage is not the goal. Begin performance work by measuring, then reduce bundle size with lazy routes and code splitting or virtualize large lists. TypeScript catches errors at compile time, especially around `defineProps` and `defineEmits`. For a Vue 2-to-3 migration, `@vue/compat` can support a gradual transition, together with automated migration tools.
'''

[questions.vue-lv001]
prompt = "A large Vue application has about 50 screens and an 8-person team. State is shared across several domains (auth, product, cart, notifications). Which state strategy is most appropriate?"
options = ["Put all state in one global Pinia store to avoid cross-store imports", "Split stores by domain (authStore, productStore, etc.), use composables for reusable logic, and keep local UI state local", "Use only module-level `ref`/`reactive` and avoid Pinia", "Use Vuex 4 because Pinia is not ready for this scale"]
explanation = "Domain-specific stores reduce coupling and are easier to test and tree-shake. Composables package reusable logic, while local `ref` state suits UI that does not need to be shared. Pinia supports multiple stores rather than requiring one monolithic store."

[questions.vue-lv002]
prompt = "In a Pinia store, an async `fetchProducts()` action calls an API. Components A and B call it at nearly the same time. What is the most effective way to avoid duplicate requests?"
options = ["Use an `isLoading` variable in the store and return early if a request is in progress", "Cache the in-flight Promise so later callers await the same Promise", "Debounce the action", "Watch a getter to trigger the fetch automatically"]
explanation = "Caching the in-flight Promise lets multiple components await the same request. A separate `isLoading` check can race between checking and setting the flag; debounce adds latency, and watching a getter is not a good fit for an explicitly requested fetch."

[questions.vue-lv003]
prompt = "A team chooses feature folders instead of type-based folders for organizing components. What is the main benefit?"
options = ["Fewer imports because everything is in one directory", "Keep a feature's logic, UI, and tests together, reducing coupling between features and making removal or migration easier", "Circular dependencies become safe", "Code splitting happens automatically by route"]
explanation = "Feature folders colocate components, composables, utilities, tests, and stories for a feature. This reduces coupling and aids refactoring or removal, but does not automatically split code; circular dependencies should still be avoided."

[questions.vue-lv004]
prompt = "Which statement about the test strategy for a large Vue application is correct?"
options = ["Unit test every component with `shallowMount` to reach 100% coverage", "Focus unit tests on composables and pure logic, use E2E for important user flows, and add fewer component tests for complex UI", "Use only E2E because unit tests cannot find real bugs", "Snapshot-test every component to catch accidental UI changes"]
explanation = "A testing pyramid uses fast, less flaky unit tests for pure logic (composables, store actions, utilities), E2E for critical paths such as login or checkout, and component tests for complex UI behavior. Full coverage is not a practical goal, and snapshots can create false positives."

[questions.vue-lv005]
prompt = "A page with 5,000 items renders slowly. Measurement shows that only the initial render is slow (2.8 seconds); later interactions are smooth. What is the most conservative solution?"
options = ["Immediately rewrite it as a virtual list using `vue-virtual-scroller`", "Add `v-memo` to item components with dependencies `[item.id, item.version]`, and lazy-load images", "Use server-side pagination and remove infinite scrolling", "Use `v-once` for each item because its data rarely changes"]
explanation = "`v-memo` can skip item re-renders when its dependencies have not changed, with relatively low cost. Virtual lists add complexity and are most useful for very large lists (over about 10,000 items) or variable-height rows. Pagination changes the UX, while `v-once` prevents future updates."

[questions.vue-lv006]
prompt = "Choose appropriate performance techniques for a large Vue 3 app. (Select all that apply.)"
options = ["Use route-level code splitting with `defineAsyncComponent` and lazy routes", "Use `v-memo` for stable list items and subtrees", "Use `mapState`/`mapActions` in Pinia stores to optimize reactivity", "Tree-shake icons and libraries with ES module imports and `sideEffects: false`", "Use `shallowRef`/`shallowReactive` for large objects that do not need deep reactivity"]
explanation = "Lazy routes reduce the initial bundle; `v-memo` can avoid unnecessary re-renders; ES module tree-shaking reduces bundle size; and shallow reactivity lowers overhead for large data such as canvas or 3D objects. `mapState`/`mapActions` are an Options API pattern and are not more optimized than setup stores."

[questions.vue-lv007]
prompt = "When using TypeScript with Vue 3 `<script setup>`, which statements are correct? (Select all that apply.)"
options = ["`defineProps<{ msg: string }>()` infers the type without requiring a runtime declaration", "`defineEmits<{ (e: 'change', id: number): void }>()` provides type checking for `$emit`", "`withDefaults(defineProps<{ count?: number }>(), { count: 0 })` supplies a typed default", "`const props = defineProps([...])` (array syntax) still provides full type inference", "A generic component's `<Comp v-slot=\"{ item }\">` can infer the slot type from the parent's scope"]
explanation = "Type-based `defineProps` and `defineEmits` are ergonomic compile-time declarations, and `withDefaults` supplies typed defaults. Array syntax such as `['msg']` does not provide type inference. Generic slot scope can be inferred with TypeScript 4.7 and later."

[questions.vue-lv008]
