[modules.vue-template]
title = "Templates and Directives"
description = "Template syntax, bindings, events, conditions, lists, and custom directives."
lesson = '''
### Templates and directives
Vue templates let you describe the interface with near-standard HTML. Expressions inside `{{ }}` are for expressions, not multi-step statements. `v-bind` (shorthand `:`) connects an attribute to data, while `v-on` (shorthand `@`) attaches an event listener. `v-if` creates or removes a branch; `v-show` keeps the element in the DOM and changes its CSS `display` property.

| Syntax | Purpose | Note |
|---|---|---|
| `:href="url"` | Bind an attribute | The value updates when state changes |
| `@click="save"` | Listen for an event | A modifier such as `.once` limits the behavior |
| `v-for="item in items"` | Iterate over a list | Use a stable, unique `:key` |
| `v-model="name"` | Synchronize a form field | Shorthand for a prop and an event |

Example: `<li v-for="task in tasks" :key="task.id">{{ task.title }}</li>`. Avoid using the index as a key when a list can be reordered or items can be inserted in the middle, because Vue may reuse the wrong DOM node. Avoid putting `v-if` and `v-for` on the same node; filter the data with a computed value instead. `v-html` inserts raw HTML, so use it only with trusted content to avoid XSS. Custom directives suit low-level DOM operations; they do not replace components or composables.
'''

[questions.vue-001]
prompt = "In a template, which shorthand binds a DOM attribute to a reactive expression?"
explanation = "The colon is shorthand for `v-bind`; `@` is shorthand for `v-on`."

[questions.vue-002]
prompt = "A table has a few thousand rows. Its content rarely changes, but a filter may be toggled often. Which conditional display directive avoids recreating the nodes each time it is toggled?"
options = ["`v-if`", "`v-show`", "`v-html`", "`v-once`"]
explanation = "`v-show` keeps the node and changes its CSS display; `v-if` removes and reinserts the node, so it is a better fit when the condition changes rarely."

[questions.vue-003]
prompt = "A task list allows items to be inserted, deleted, and reordered. What should you use for `:key`?"
options = ["The current loop index", "A stable, unique ID for the task", "A new `Math.random()` value on every render", "No key is needed"]
explanation = "A stable key helps Vue preserve the identity of each node when the list order changes."

[questions.vue-004]
prompt = "Choose the correct statements about template bindings and directives."
options = ["`@click` is shorthand for `v-on:click`", "`v-html` inserts content as escaped text", "`.once` can limit a listener to handling an event once", "`v-if` and `v-for` should be placed on the same node so Vue can filter each item", "`v-show` usually keeps a hidden node in the DOM"]
explanation = "`v-html` inserts raw HTML, while combining `v-if` and `v-for` on one node can make the logic hard to understand; filter with a computed value instead."

[questions.vue-005]
prompt = '''
Fill in the directive name to render a list and key each item by its ID:
```html
<li {{blank}}="task in tasks" :key="task.id">{{ task.title }}</li>
```
'''
explanation = "`v-for` iterates over the list; the key is bound separately with `:key`."

[questions.vue-006]
prompt = "A page renders a username from free-form user input with `v-html`. What is the main risk, and how should it be fixed?"
options = ["There is no risk when the content is a string; leave it as is", "HTML injection/XSS; use interpolation if only text is needed", "Vue automatically removes every dangerous tag; no change is needed", "Just add a `:key` to the element"]
explanation = "`v-html` inserts raw HTML and does not sanitize the data; interpolation escapes text content."

[questions.vue-lv019]
prompt = "Given `const agree = ref(false)` and `<input type=\"checkbox\" v-model=\"agree\">`, what is `agree.value` after the user checks the box?"
options = ["`true`", "`\"on\"`", "`\"checked\"`", "`1`"]
explanation = "For a single checkbox, `v-model` synchronizes a boolean (`true`/`false` by default), unless `true-value` or `false-value` is specified."

[questions.vue-lv020]
prompt = "For `<div :class=\"{ active: isActive, error: hasError }\">` with `isActive = true` and `hasError = false`, which class is rendered?"
options = ["`active`", "`active error`", "`error`", "No classes"]
explanation = "Object syntax adds a class when its corresponding value is truthy; `error` is omitted because `hasError` is false."

[questions.vue-lv021]
prompt = '''
Fill in the directive that shows the remaining branch when `loggedIn` is false:
```html
<p v-if="loggedIn">Welcome!</p>
<p {{blank}}>Please sign in.</p>
```
'''
explanation = "`v-else` must immediately follow an element with `v-if` or `v-else-if`."

[modules.vue-reactivity]
title = "Reactivity"
description = "ref, reactive, computed, watch, watchEffect, toRefs, and shallowRef."
lesson = '''
### The reactivity system
`ref()` wraps a value in `.value`; `reactive()` creates a proxy for an object. In templates, a top-level ref is usually unwrapped automatically, but in JavaScript you read or assign `.value`. Directly destructuring a primitive property from a reactive object loses the reactive connection; `toRefs()` creates linked refs that can be destructured safely. `shallowRef()` tracks changes to `.value` itself, but does not deeply proxy the object inside it.

| API | Use when | Main behavior |
|---|---|---|
| `ref` / `reactive` | State changes | Records dependencies when values are read |
| `computed` | A derived value is needed | Lazy and cached until a dependency changes |
| `watch` | Reacting to a specific source | Receives new and old values and supports cleanup |
| `watchEffect` | Dependencies are easy to infer from the function body | Runs immediately and tracks values read synchronously |

Example: `const total = computed(() => price.value * quantity.value)`. Do not call a helper with side effects inside a computed getter: the getter should be pure and only calculate a value. `watch` suits requests or external synchronization; register cleanup to cancel old work. `watchEffect` does not make every async dependency reactive: values first read after `await` are not tracked like values read during the initial synchronous run. Choose `shallowRef` for large data or external objects when you want to avoid deep proxying.
'''

[questions.vue-007]
prompt = "How do you read a value created with `ref(0)` in JavaScript?"
options = ["`count.value`", "`count.current`", "`count.get()`", "`count[0]`"]
explanation = "In JavaScript, a ref uses the `.value` property; templates usually unwrap a top-level ref automatically."

[questions.vue-008]
prompt = "`computed(() => price.value * quantity.value)` has not been read yet. If its dependencies change several times before the first read, what does Vue usually do?"
options = ["Recomputes immediately after every change", "Marks it dirty and computes it when read, then caches it until the next invalidation", "Runs it every frame", "Computes it only once for the entire application lifetime"]
explanation = "Computed values are lazy and cached by dependency; several changes before a read do not force the getter to run after each one."

[questions.vue-009]
prompt = "Why can destructuring `const { count } = reactiveState` break the reactive connection between `count` and the original property?"
options = ["Destructuring always clones every object", "`count` becomes a local primitive value that is no longer read through the proxy", "Vue forbids destructuring in JavaScript", "`reactive` only works with arrays"]
explanation = "Destructuring a primitive property separates its value from the proxy; use `toRefs(reactiveState)` if you need to destructure while preserving the connection."

[questions.vue-010]
prompt = "Choose the accurate statements about watchers and shallow reactivity."
options = ["`watch` tracks the explicitly declared source by default", "`watchEffect` runs immediately to collect synchronous dependencies", "`shallowRef` deeply proxies every property of its object", "Cleanup can cancel an old timer or request before the next run", "A dependency first read after `await` in `watchEffect` is always tracked"]
explanation = "`shallowRef` tracks only `.value`; in an async effect, a dependency read after `await` is outside the initial synchronous tracking run."

[questions.vue-011]
prompt = '''
Fill in the API that converts a reactive object's properties into linked refs so they can be safely destructured:
```js
const state = reactive({ count: 0 })
const { count } = {{blank}}(state)
```
'''
explanation = "`toRefs` creates refs for the existing enumerable properties on the proxy."

[questions.vue-012]
title = "Mini Reactivity with Lazy Computed Values"
prompt = '''
Implement `createMiniReactivity()` so it returns `{ ref, computed, effect }` using plain JavaScript.
- `ref(value)` returns an object with `.value`; when the value changes, dependent effects run again.
- `computed(getter)` returns an object with `.value`; the getter runs only when needed, caches its result, and is marked dirty when a dependency changes.
- `effect(fn)` runs `fn` immediately, tracks refs/computed values read by it, reruns when they change, and returns a runner that can be called manually.
- Only synchronous dependencies and scalar values need to be supported; no scheduler or `stop` is required.
'''
explanation = "This exercise models the core of dependency tracking: reads register dependencies, writes trigger them, and computed values cache results until invalidated."
hints = ["Each dependency can store a set of runners; a runner should remember and remove its old dependencies before it runs again.", "A computed value needs an internal lazy effect whose scheduler only marks it dirty and notifies consumers."]

[questions.vue-013]
title = "Watch with Cleanup"
prompt = '''
Implement `createSignal(initialValue)` and `watch(source, callback)` to model a synchronous watcher for one source.
- A signal has a `.value` property. Its setter notifies listeners only when the value changes according to `Object.is`, and `subscribe(listener)` returns an unsubscribe function.
- `watch` does not call the callback during initialization. Whenever the source changes, call `callback(newValue, oldValue, onCleanup)`.
- A cleanup registered by the callback must run before the next callback and when the stop function is called. Calling stop more than once must not run cleanup repeatedly.
- `watch` returns the stop function; the callback may register one cleanup for each run.
'''
explanation = "Cleanup lets you cancel resources from an earlier watch run, such as a timer or request, before reacting to a new value."
hints = ["Store listeners in a Set and notify a copy of the set so listeners can unsubscribe safely during notification.", "Cleanup belongs to the previous callback run; take it and clear the reference before invoking it to prevent duplicate calls."]

[questions.vue-lv022]
prompt = '''
After `inc()` runs, what does the template display for `{{ state.count }}`?
```js
const state = reactive({ count: 0 })
let { count } = state
function inc() { count++ }
```
'''
options = ["`0` — destructuring takes an ordinary value and loses the reactive connection", "`1`", "An error because a reactive value cannot be destructured", "`NaN`"]
explanation = "Destructuring a primitive property from a reactive object copies its current value; incrementing the local variable does not change `state.count`. Use `toRefs(state)` to preserve reactivity when destructuring."

[questions.vue-lv023]
prompt = '''
Fill in the API that creates a cached derived value and updates it when `items` changes:
```js
const total = {{blank}}(() => items.value.length)
```
'''
explanation = "`computed` caches its result and recalculates only when a reactive dependency changes."

[questions.vue-lv024]
prompt = "You need to call an API to save a draft whenever `title` changes. Which API is the best fit?"
options = ["`watch(title, save)`", "`computed(() => save(title.value))`", "Call `save()` directly in the template", "`ref(save)`"]
explanation = "Side effects such as API calls belong in a watcher; a computed getter should be pure and only calculate a value."

[questions.vue-lvc01]
title = "Filter a Task List"
prompt = '''
Write a pure function `summarizeTasks(tasks, filter)`—the kind of logic often placed in a todo screen's `computed` value.
- `tasks`: an array of `{ id, title, done }` objects.
- `filter`: `"all"`, `"active"` (not done), or `"done"` (done). Treat any other value as `"all"`.
- Return `{ visible, remaining }`: `visible` is a new array of tasks matching the filter, in their original order; `remaining` is the total number of tasks that are not done.
- Do not modify the input array or its objects.
'''
explanation = "Keeping filtering in a pure function makes it easy to test; the component can use `computed(() => summarizeTasks(tasks.value, filter.value))`."
hints = ["`Array.prototype.filter` always returns a new array.", "Calculate `remaining` from `tasks`, not from `visible`."]

[questions.vue-lv031]
prompt = "An edit form has `const user = ref({ name: '', address: { city: '' } })`. `watch(user, save)` does not run when the user edits `user.value.address.city`. What is an appropriate fix?"
options = ["Use `watch(user, save, { deep: true })` or watch a specific getter such as `() => user.value.address.city`", "Change `ref` to a regular `let`", "Use `computed` instead of a watcher", "Call `save` in `onMounted`"]
explanation = "Watching a ref that contains an object tracks reassignment of `.value`; use `deep: true` or watch a getter for the specific nested property."

[questions.vue-lv032]
prompt = "After `items.value.push(x)`, you want to scroll to the last item that was just rendered, but `listEl.lastElementChild` still refers to the previous item. What should you do?"
options = ["Await `nextTick()` before scrolling", "Call `push` twice", "Use `setTimeout(fn, 5000)`", "Change `ref` to `reactive`"]
explanation = "Vue batches DOM updates asynchronously; `nextTick` waits for the next DOM update to finish."

[questions.vue-lv043]
prompt = "A watcher needs to read the DOM size after Vue updates the DOM for new state. By default, the watcher runs before the component DOM is updated. Which option fits?"
options = ["`{ flush: 'post' }` (or `watchPostEffect`)", "`{ flush: 'sync' }`", "`{ immediate: true }`", "`{ deep: true }`"]
explanation = "`flush: 'post'` defers the callback until after the DOM update. `sync` runs immediately when state changes, before the DOM update, and may be costly when state changes frequently."

[questions.vue-lv044]
prompt = "A screen receives 50,000 data points per second over WebSocket and replaces the entire array each time. Profiling shows much of the time is spent creating deep proxies. What is the best choice?"
options = ["Keep the array in a `shallowRef` and assign `.value = newArray` each time", "Use `reactive([])` and replace everything with `splice`", "Wrap the array in `computed`", "Keep the deep `ref` and add `deep: true` to the watcher"]
explanation = "`shallowRef` tracks assignment to `.value` without proxying each item, which suits large data replaced as a whole. If you mutate it in place, use `triggerRef`."

[questions.vue-lv045]
prompt = "Choose the accurate statements about `markRaw`, `toRaw`, and reactive proxies."
options = ["`markRaw(obj)` prevents `obj` from becoming a proxy, which is useful for third-party instances such as maps or charts", "`reactive(obj) === obj` is always true", "`reactive(obj) === obj` is false, so identity comparisons such as `includes` or `indexOf` can cause bugs", "`toRaw(proxy)` returns the original object; reading or writing through it does not trigger effects", "`markRaw` also automatically makes every nested object raw in the future"]
explanation = "A proxy has a different identity from its original object. `markRaw` marks only that object; a nested object placed elsewhere in reactive state can still become a proxy."

[modules.vue-components]
title = "Components, Props, and v-model"
description = "Component communication through props, emits, slots, v-model, and provide/inject."
lesson = '''
### Component boundaries
A child component receives data through `props` and notifies its parent through `emits`. Props are read-only inputs, so a child should not modify a prop object to update the parent. In `<script setup>`, `defineProps()` and `defineEmits()` are compiler macros and do not need to be imported. Declaring emits makes the component contract clear and helps avoid confusion between component events and fallthrough listeners.

| Mechanism | Data flow | Example |
|---|---|---|
| prop | parent → child | `<UserCard :user="user" />` |
| emit | child → parent | `emit('save', form)` |
| slot | parent provides content | `<Panel><template #title>...</template></Panel>` |
| provide/inject | ancestor → descendant | A service or configuration scoped to a tree |

By default, `v-model` corresponds to the `modelValue` prop and the `update:modelValue` event. The child emits the new value instead of mutating the prop. Vue 3.4+ provides `defineModel()` to shorten the common pattern; understanding the prop/event contract is still useful when integrating older components or multiple named models. Slots let the parent customize presentation, while a scoped slot passes data from the child into the slot content. Provide/inject helps avoid prop drilling through a deep tree, but should not become a global state store in place of clear state design.
'''

[questions.vue-014]
prompt = "A child component wants to ask its parent to update `modelValue`. Which event is the default for `v-model`?"
options = ["`change:modelValue`", "`update:modelValue`", "`set:modelValue`", "`input:value`"]
explanation = "By default, `v-model` connects the `modelValue` prop to the `update:modelValue` event."

[questions.vue-015]
prompt = "A child component needs to report that the user saved a form. Which communication contract is the best fit?"
options = ["The child directly edits the `form` prop and hopes the parent notices", "The child emits a `save` event, which the parent listens for", "The child finds the parent component through the DOM", "The child writes to any global variable"]
explanation = "Props pass data from parent to child; emits send an intentional notification from child to parent."

[questions.vue-016]
prompt = "Choose the correct statements about props, slots, and provide/inject."
options = ["Props are read-only inputs to a child component", "A scoped slot can receive data provided by the child component", "Provide/inject can only pass data to a direct child component", "`defineProps` and `defineEmits` in `<script setup>` are compiler macros", "Every slot makes the parent the owner of the child's state"]
explanation = "Provide/inject can pass values through the component tree to descendants; slots customize content but do not transfer ownership of state."

[questions.vue-017]
prompt = '''
Fill in the default prop that lets a child component receive the value from an unnamed `v-model`:
```js
const props = defineProps({ {{blank}}: String })
```
'''
explanation = "`v-model` uses the `modelValue` prop and `update:modelValue` event by default."

[questions.vue-018]
prompt = "Describe the data flow when a parent uses `v-model` with a child component, and explain why the child should not mutate the prop directly."
keywords = [["`modelValue`", "`modelValue` prop"], ["`update:modelValue`", "`update:modelValue` event"], ["`emit`", "emit an event", "event emission"], ["read-only props", "props are read-only", "do not mutate props"]]
model_answer = '''The parent passes the value through the `modelValue` prop. The child emits the `update:modelValue` event with the new value; the parent receives the event and updates its source state. Props are read-only inputs, so mutating a prop makes the one-way data flow harder to follow and does not reliably update the parent's state.'''
explanation = "A good answer explains that the prop flows from parent to child, the event flows from child to parent, and props should not be mutated."

[questions.vue-019]
title = "Simulating emit and v-model"
prompt = '''
Implement `createModelBinding(initialValue)` to model a parent connecting `v-model` to a child component.
- Return an object containing `props`, `emit`, `emitted`, and a `value` getter.
- `props.modelValue` must always reflect the parent's current value.
- Accept only the `update:modelValue` event. Record that event as `{ event, payload }`, update the parent's value, and return `true`.
- Other events must not change state, must not be added to `emitted`, and must return `false`.
'''
explanation = "This exercise models the default `v-model` contract: the `modelValue` prop and the `update:modelValue` event."
hints = ["Use a closure variable to hold the parent's state; the prop can be a getter that reads it.", "Check the event name before recording the payload."]

[questions.vue-lv025]
prompt = "In `<script setup>`, how do you declare a string prop named `title`?"
options = ["`const props = defineProps({ title: String })`", "`const props = useProps('title')`", "`export const title = String`", "`this.props.title = String`"]
explanation = "`defineProps` is a compiler macro in `<script setup>` and does not need to be imported."

[questions.vue-lv026]
prompt = "A child component wants to tell its parent that the user clicked a delete button. What is the standard approach in `<script setup>`?"
options = ["Declare `const emit = defineEmits(['remove'])` and call `emit('remove', id)`", "Assign directly to a parent prop", "Call `window.parent.remove(id)`", "Use `document.dispatchEvent` for every event"]
explanation = "A child communicates with its parent through a declared event; the parent listens with `@remove`."

[questions.vue-lv027]
prompt = "Component `Card` contains `<div class=\"card\"><slot /></div>`. What happens when it is used as `<Card><p>Hello</p></Card>`?"
options = ["`<p>Hello</p>` is rendered at the `<slot />` position", "The content is ignored", "Vue reports a missing prop error", "`<p>` is rendered outside `.card`"]
explanation = "The default slot receives content placed between a component's opening and closing tags."

[questions.vue-lv033]
prompt = "A layout calls `provide('theme', theme)` where `theme` is a ref. Descendants should be able to read the theme but not change it themselves. What is appropriate?"
options = ["Provide `readonly(theme)` and also provide a `setTheme` function if changes are needed", "Provide `theme.value` as a string", "Use the global variable `window.theme`", "Pass a prop through every level"]
explanation = "`readonly` preserves reactivity while preventing writes; providing `theme.value` would lose reactivity. Changes can go through a function owned by the provider."

[questions.vue-lv034]
prompt = "A modal is rendered inside a container with `overflow: hidden` and a low `z-index`, so it is clipped. What is the most appropriate Vue solution?"
options = ["Wrap the modal content in `<Teleport to=\"body\">`", "Increase `z-index` to 999999", "Use `v-show` instead of `v-if`", "Put the modal in `<KeepAlive>`"]
explanation = "Teleport renders DOM elsewhere (for example, under `body`) while preserving the logical component relationship; a higher z-index cannot escape an ancestor's stacking context."

[questions.vue-lv035]
prompt = "Component `BaseInput` has a root `<label>` wrapping an `<input>`. The parent uses `<BaseInput placeholder=\"Email\" @focus=\"f\" />`. Which statement is correct?"
options = ["By default, `placeholder` falls through to the root `<label>`", "Set `inheritAttrs: false` and bind `v-bind=\"$attrs\"` to the `<input>` to forward the attribute there", "Fallthrough attributes never include listeners", "An attribute declared in `defineProps` is not present in `$attrs`"]
explanation = "Attributes not declared as props or emits fall through to the root; listeners such as `onFocus` are also in `$attrs`. To attach them to a child element, disable `inheritAttrs` and bind them manually."

[modules.vue-composables]
title = "Composition API and Composables"
description = "Organize logic with setup, lifecycle hooks, and composables; use VueUse utilities."
lesson = '''
### Composition API and reusable logic
In the Composition API, `setup()` or `<script setup>` is where you declare state and logic associated with a component. Lifecycle hooks such as `onMounted()` must be called while a component is active. A composable is a function, usually named with a `use` prefix, that packages state/reactivity and may register lifecycle hooks. Each call usually creates its own state unless you intentionally share state at module scope.

A composable should have clear inputs, return the refs/computed values callers need, and clean up timers, listeners, or subscriptions when they are no longer needed. VueUse provides utilities for common details such as `refDebounced`, `useDebounceFn`, and debounced watchers. Check their cancel/flush behavior and update timing instead of assuming every utility has the same API.

| Pattern | Responsibility |
|---|---|
| `useSearch(query)` | Combines search state and loading status |
| `refDebounced(source, ms)` | Provides a delayed value to reduce updates |
| `onUnmounted(cleanup)` | Releases resources tied to the component lifecycle |

Do not call a composable conditionally if it depends on lifecycle hooks; call it consistently in `setup()`. For async effects, cancel old requests during cleanup so a late response cannot overwrite a newer result. A composable should address one reusable concern rather than collecting all application state into one large function.
'''

[questions.vue-020]
prompt = "A composable installs a `window` listener during setup. What should it do to prevent a leak when the component is unmounted?"
options = ["Register cleanup with `onUnmounted`", "Store the listener in a computed value", "Call the listener one more time", "Move the listener to `v-memo`"]
explanation = "A composable called during setup can register a lifecycle hook to release resources when the component is unmounted."

[questions.vue-021]
prompt = "A search box sends a request after every keystroke and is calling the server too often. Which VueUse utility provides a ref that updates only after a quiet interval?"
options = ["`refDebounced`", "`refThrottled`, which updates only after a quiet interval", "`useEventListener`", "`useClipboard`"]
explanation = "`refDebounced` creates a delayed ref from a source ref; throttling limits frequency but does not have the same wait-until-quiet behavior."

[questions.vue-022]
prompt = "Choose appropriate practices when writing a composable."
options = ["Use the `use...` naming convention to identify reusable logic", "Call it consistently in setup if it registers lifecycle hooks", "Always put all state in a module variable so every component shares it", "Clean up timers or listeners created by the composable", "Organize composables around clear concerns"]
explanation = "Module-level state is appropriate only when sharing is intentional; by default, many composables should keep state local to each call."

[questions.vue-023]
prompt = '''
Fill in the name of the VueUse function that creates a debounced function:
```js
const submitLater = {{blank}}(submit, 300)
```
'''
explanation = "`useDebounceFn` wraps a function so it runs after the quiet interval."

[questions.vue-024]
prompt = "Design a search composable with debounce and an asynchronous request. Explain how to keep an old response from overwriting a newer result and how to clean up resources."
keywords = [["debounce", "debounced request"], ["cleanup", "cancel request", "abort"], ["stale", "stale response", "old response"], ["watch", "watcher"]]
model_answer = '''The composable can watch the query and debounce it before sending a request, reducing the number of calls. Before starting a new run, cleanup should cancel the old timer or request with an `AbortController`; if the API cannot be cancelled, use a request ID to discard stale responses. On component unmount, cleanup should also clear timers and listeners.'''
explanation = "Combine debounce with cleanup or a way to discard stale results; debounce alone does not handle responses that arrive out of order."

[questions.vue-025]
title = "useDebouncedRef with Fake Timers"
prompt = '''
Implement `useDebouncedRef(initialValue, delayMs)` with the standard timer APIs and no library.
- Return an object with a `.value` getter/setter and `cancel()` and `flush()` methods.
- Assigning `.value` schedules an update after `delayMs`; until then, the getter returns the committed value.
- Multiple assignments during the wait should commit only the last value, with the wait interval restarted from the latest assignment.
- `cancel()` discards the pending value; `flush()` commits it immediately and returns the current value.
'''
explanation = "This exercise models a minimal debounced ref; fake timers allow exact boundary checks without waiting in real time."
hints = ["Store the timer ID, pending value, and a flag indicating whether a value is pending; clear the timer before each assignment.", "Both `flush` and the timer callback should clear the pending state so the same value is not committed twice."]

[questions.vue-lv028]
prompt = "You need to measure a DOM element through a template ref. In which hook should you read the ref?"
options = ["`onMounted`", "At the start of `<script setup>`", "`onBeforeMount`", "`onUnmounted`"]
explanation = "A template ref points to the element only after the component has mounted; before that its value is `null`."

[questions.vue-lv036]
prompt = "Composable `useWindowWidth()` adds a `resize` listener in `onMounted`. After navigating back and forth several times, the handler runs dozens of times per resize. What caused this, and how should it be fixed?"
options = ["The listener is never removed; add `onUnmounted(() => removeEventListener(...))` or use VueUse's `useEventListener`", "`resize` is asynchronous; wrap it in `nextTick`", "It uses `ref`; change it to `reactive`", "The router caused it; disable history mode"]
explanation = "Each remount adds another listener while old listeners remain. A composable must clean up its side effects with the component lifecycle."

[questions.vue-lv037]
prompt = "Composable `useUser(id)` should reload when `id` changes, and callers may pass either a ref or a plain value. Which implementation is appropriate?"
