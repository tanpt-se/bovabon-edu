[modules.vue-performance-state]
title = "Performance and State"
description = "Pinia, KeepAlive, v-memo, render profiling, and measurement-driven optimization."
lesson = '''
### State and performance
Keep state in the narrowest scope that serves its users: component state for local UI, a composable for reusable logic, and a store such as Pinia for state shared across areas or when explicit tooling/devtools are useful. Pinia organizes state, getters, and actions into stores; there is no need to build a custom global reactive object when the application already uses a store.

`<KeepAlive>` caches dynamic component instances to preserve state while switching tabs or routes; `include`, `exclude`, and `max` control the cached set. `v-memo` skips subtree updates when values in its dependency array have not changed, but should be used only after measuring a rendering bottleneck. A missing dependency can leave the UI showing stale data.

| Tool | Use | Risk to avoid |
|---|---|---|
| Pinia | Structured shared state | An overly broad store or circular dependencies |
| KeepAlive | Preserve a component while switching away and back | Caching too many instances |
| `v-memo` | A large subtree that rarely changes | Missing a dependency |

Start optimization with small components, stable data, and good list keys; investigate with Vue DevTools or browser profiling. Caching reduces setup work but retains memory, and cached state may still need synchronization. Do not add memoization just because an expression looks complex: measure, find the cause, and then choose the smallest effective change.
'''

[questions.vue-034]
