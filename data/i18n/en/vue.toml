[modules.vue-router]
title = "Vue Router"
description = "Static and dynamic routes, params, catch-all routes, lazy loading, and navigation guards."
lesson = '''
### Defining routes and navigating
A dynamic route uses a segment such as `/users/:id`; its value is available in `route.params`, unlike a query string in `route.query`. A modern catch-all route is commonly written as `/:pathMatch(.*)*`. Route order and specificity affect matching; when using a custom matcher, place general routes after specific ones.

| Mechanism | Role | Example |
|---|---|---|
| `:id` | Matches one dynamic segment | `/users/42` |
| `*` / catch-all | Matches the remaining path | A 404 page |
| Lazy route | Loads a component when needed | `component: () => import('./Page.vue')` |
| Navigation guard | Allows, cancels, or redirects | `beforeEach((to, from) => ...)` |

A guard can return `false` to cancel, `true` or `undefined` to continue, or a location to redirect. Async guards are awaited in order. Return-based guards are usually clearer and less error-prone than the `next` callback pattern. A guard is not the only place to check permissions: the server must still authenticate and authorize requests. Lazy route components split the bundle; do not wrap an async route component with `defineAsyncComponent` when the Router already handles the dynamic import. When adding a route while the application is running, explicitly update the matcher.
'''

[questions.vue-026]
