options = ["Render a stable value (or placeholder) on the server and update the live time in `onMounted`, which only runs on the client", "Disable hydration warnings in production", "Add `:key=\"Math.random()\"`", "Call `location.reload()` after loading"]
explanation = "The server HTML and the first client render must match. A value that depends on time or timezone should be created after mounting. Hiding the warning does not fix the DOM mismatch."

[questions.vue-lv048]
