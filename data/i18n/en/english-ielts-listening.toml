[modules.il-format-numbers-spelling]
title = "Test format, numbers & spelling"
description = "The four-part structure of Listening; how to write numbers, dates, times and prices; spelled names and postcodes; spelling mistakes that cost marks."
lesson = '''
**Suggested path:** finish CEFR B1 → study CEFR B2 + IELTS Grammar + IELTS Vocabulary in parallel → **Reading and Listening** (the two skills where strategy raises your score fastest) → Writing → Speaking.

**App limitation:** the app is text-only, with no audio. Here you practise Listening through *transcripts* (with speakers marked): you learn to spot traps, numbers, spelling and signposts. To really reach band 6.5 you still need practice with real audio (see "Practice outside the app").

### Test format
| Part | Content | Common question types |
|---|---|---|
| 1 | Everyday conversation between 2 people (booking, registering) | Form / note completion |
| 2 | Everyday monologue (announcement, introduction to a place) | Map / plan labelling, MCQ |
| 3 | Academic discussion with 2–4 people | MCQ, matching, completion |
| 4 | Academic lecture by one speaker | Note / summary completion |

40 questions in total, about 30 minutes, and you **hear each recording only once**. In the paper test you get 10 minutes at the end to transfer answers to the answer sheet; spelling and word limits must be correct.

### Step-by-step strategy
1. **Read the questions first** during the time given: underline keywords and predict the type of word needed (number, name, noun, adjective).
2. **Follow the order**: answers always come in the same order as the questions.
3. **Write immediately** as you listen, don't wait; use abbreviations and tidy up later.
4. **Watch the word limit** (*NO MORE THAN TWO WORDS AND/OR A NUMBER*): one extra word makes the answer wrong.

### Numbers, dates, times, money
| Type | What you hear | How to write it |
|---|---|---|
| 13 / 30 | thir**teen** (stress at the end) / **thir**ty (stress at the start) | 13 / 30 |
| 15 / 50 | fif**teen** / **fif**ty | 15 / 50 |
| Dates | *the fifteenth of March* / *March the fifteenth* | 15 March or March 15 |
| Times | *quarter past nine, half past two, ten to eight* | 9.15, 2.30, 7.50 |
| Money | *two hundred and fifty pounds, four ninety-nine* | £250, £4.99 |
| Phone numbers | *double five* = 55, *oh/zero* = 0 | 07755 ... |
| Postcodes | read character by character | CB4 2LT |

### Spelled names
Know the English alphabet sounds: A /eɪ/, E /iː/, I /aɪ/, G /dʒiː/, J /dʒeɪ/, R /ɑː/, W /ˈdʌbəljuː/. Common confusions: **B/P/V**, **M/N**, **S/F**, **G/J**, **E/I**. When you hear *double L*, write LL.

### Common mistakes by Vietnamese learners
- Writing ~~informations~~, ~~advices~~: these are uncountable nouns.
- Dropping the plural *-s* when the answer needs it (*two tickets*).
- Misspelling easy words: *Wednesday, February, accommodation, necessary, library, environment*.
- Confusing 13/30 and 15/50, and mixing up day and month (*3/4* is 3 April in the UK).
- Copying extra words beyond the limit, or repeating a unit that is already printed on the question paper.

### Time management
Don't stop on a question you missed: skip it and keep listening for the next one. At the end, fill every blank: wrong answers lose no marks.

### Practice outside the app
- Every day, listen to 10–15 minutes of English audio with British/Australian/American/Canadian accents and **transcribe** it sentence by sentence (dictation).
- Practise numbers and letters separately: ask a friend to read out phone numbers and booking codes, or record yourself and write them down when you play it back.
- Do one full Listening test each week, mark it with the official answers, and log your mistakes by group (spelling, numbers, traps, word limit).
- Listen with English subtitles *after* doing the test to compare what you missed.
'''

[modules.il-section1-forms]
title = "Part 1: Form & note completion"
description = "Part 1: everyday conversations and form filling (bookings, registrations); spotting corrected information, codes, addresses and prices."
lesson = '''
Part 1 is the **easiest** part, but also where marks are easily lost through spelling and traps. Two people talk (a customer and a staff member): one asks, the other answers, and the person asking will *repeat to confirm*.

### Step-by-step strategy
1. During the reading time, look at **the whole form**: which gaps need a number, a proper name, a noun, a date. Predict the answer type.
2. Listen for **the staff member's questions**: *Could I have your name? What's your postcode?*. The question tells you which gap is about to be answered.
3. When the customer gives information, **don't commit straight away**. Wait to see if it is corrected or confirmed: the final answer is usually the confirmed version.
4. Write the answer and move straight on to the next gap.

### Phrases that signal important information
| Function | Phrases |
|---|---|
| Asking for information | *Could I take your…? / What's the best number to reach you on?* |
| Confirming | *So that's… / Let me just check that…* |
| Correcting | *Sorry, I meant… / Actually, it's… / No, not … but …* |
| Closing | *That's all booked. / Right, so I've put you down for…* |

### Common types of information
- **Names and addresses:** surnames are usually spelled out; house numbers are read as numbers (*forty-two*); street names end in *Road/Street/Lane*.
- **Times, dates, durations:** listen carefully for *half past, quarter to*; *a fortnight* = 2 weeks.
- **Prices:** *£12.50* is read *twelve fifty*; distinguish the normal price from the discounted one.
- **Codes:** letters and numbers read one character at a time; *double* and *triple* come up often.

### Worked example
> Staff: What date would you like to start? Customer: The third of May, no wait, the fifth, because the flat isn't free until then.

The answer is **5 May**, not 3 May. Signal: *no wait*. Always wait for the end of the sentence.

### Common mistakes by Vietnamese learners
- Writing the answer as soon as you hear the first number and missing the correction that follows.
- Forgetting that the form already prints the unit (*£* or *minutes*) and writing it again, which makes the answer wrong.
- Misspelling a name that was spelled out (you heard it but didn't check carefully).
- Getting singular/plural wrong when the gap requires it (*two bedrooms*).

### Timing tip
Part 1 is usually where you get full marks. Aim for 9–10 out of 10: if you lose many here, review numbers, dates and spelling first.

### Practice outside the app
- Find real audio of conversations about booking a room, renting a car or enrolling on a course (or write a script and ask a friend to read it), then listen and fill in a similar form.
- After each test, highlight the places where speakers correct themselves (*sorry, I mean…*) to learn the pattern.
- Record yourself reading out a form with numbers and names, then play it back to get used to how native speakers say them.
'''

[modules.il-section2-maps-plans]
title = "Part 2: Map & plan labelling"
description = "Part 2: everyday monologues; words for direction and position, describing routes, labelling maps and floor plans."
lesson = '''
Part 2 is one person speaking continuously (a guided tour, an event announcement), often with a **map or floor plan** to label A–H, or MCQs. Key skill: catch **words for position and direction** and locate them on the picture.

### Step-by-step strategy
1. Before listening, **identify the fixed landmarks** on the map: the entrance, a river, the main road, a large building. Find north if there is a compass.
2. The speaker usually follows **a route**: often starting from the entrance, in question order.
3. Each time the speaker names a place, look for *landmark + direction*: *next to the café, opposite the gate*.
4. If you get lost, go back to the nearest landmark; don't guess from the area names.

### Words for position & direction
| Meaning | Words / phrases |
|---|---|
| beside | *next to, beside, alongside* |
| opposite | *opposite, facing, across from* |
| in the middle | *between A and B, in the middle of* |
| behind / in front | *behind, at the back of / in front of* |
| turning | *turn left/right, take the second turning* |
| going straight | *go straight on, carry on, continue past* |
| corners | *on the corner of, at the junction* |
| compass directions | *to the north/south/east/west of, in the north-east corner* |
| near/far | *close to, a short walk from, at the far end* |

### Easily confused pairs
- **opposite** (facing, on the other side of the road) ≠ **next to** (beside).
- **past** (walk by) ≠ **to** (arrive at). *Go past the library* means you do *not* stop at the library.
- **first turning on the left** = the first real road on the left; small lanes before it don't count.
- **left/right** are from the walker's point of view, not from how you hold the paper.

### Worked example
> *Go through the main gate and the shop is on your right, just before the fountain.*

Location: the shop is on the **right** of the path, **before** the fountain. If the map has two boxes on the right, choose the one closer to the gate.

### Common mistakes
- Mixing up left and right while the speaker is walking, or confusing "go past" with "go to".
- Spending too long on one box and missing the next question.
- Not reading the boxes that already have names (the speaker says the name, not the letter).

### Timing tip
Trace the route in pencil as you listen. A box that has been used is usually not used again (unless the instructions say letters can be reused).

### Practice outside the app
- Open a map of your area, describe a route in English and record it; ask a friend to draw it from your recording.
- Listen to English guided tours (museums, university campuses) and sketch a plan from the description.
- Learn direction words by practising sentences: *The library is opposite the sports hall, between the café and the car park.*
'''

[modules.il-section3-discussion]
title = "Part 3: Group discussion"
description = "Part 3: academic discussions with 2–4 people; telling speakers apart, agreeing / disagreeing, MCQ and matching."
lesson = '''
Part 3 is a discussion between students and a tutor about a project, an assignment or a piece of research. It is harder than Parts 1–2 because **there are several speakers, opinions change, and the answer lies in attitudes, not just facts**.

### Step-by-step strategy
1. Read the question **and the options** of each MCQ: underline the keywords that make the options different.
2. While listening, note **who says what** (use initials) and their **attitude**: agree, disagree, hesitate.
3. The correct option is usually **the final view** after the group has finished discussing. The first idea is often a distractor.
4. For matching (people – opinions), write the names and match them with the ideas mentioned.

### Language of opinion
| Function | Phrases |
|---|---|
| Agreeing | *Exactly. / That's a good point. / I couldn't agree more.* |
| Partly agreeing | *Yes, but… / I see what you mean, however…* |
| Disagreeing | *I'm not so sure. / I don't think that would work.* |
| Suggesting | *Why don't we…? / What about…? / Maybe we should…* |
| Deciding | *OK, so we'll go with… / Right, let's do that.* |

### Distinguishing attitudes
- *I'd quite like to try…* = wants to try, not yet certain; *I'm convinced that…* = very sure.
- *It might be worth…* = a gentle suggestion; *We have to…* = an obligation.
- *It seems a bit risky* = a concern; *I'm a little worried about…* = a concern, so the answer is usually **a problem**.

### Worked example
> *Mia: I think we should use a survey. Tom: It would take too long. Mia: True. How about interviews? Tom: Yes, that's more realistic.*

The answer to "what does the group decide to use" is **interviews**. *survey* is a distractor that Tom rejects.

### Common mistakes
- Choosing the first option you hear without waiting for the conclusion.
- Confusing the speakers (especially two voices of the same gender), which leads to wrong matching.
- Choosing an option that uses the exact words from the recording but the wrong meaning (the "right words, wrong meaning" distractor).
- Not noticing negatives (*not, hardly, rather than*).

### Timing tip
Part 3 often has 2 *multiple* questions (choose 2–3 options). The correct ones may be mentioned at different points; tick in draft and decide only when you have heard everything.

### Practice outside the app
- Listen to short academic podcasts/discussions (2–3 people) and summarise them yourself: who wants what, and what was finally decided.
- Review the transcript after listening and highlight the signals of agreement/disagreement.
- Role-play: record yourself discussing an assignment with a classmate, then play it back and imitate ways of conceding (*Yes, but…*).
'''

[modules.il-section4-lecture]
title = "Part 4: Academic lecture"
description = "Part 4: a lecture by one speaker; note/summary completion, academic vocabulary, recognising the structure of a lecture."
lesson = '''
Part 4 is an academic lecture with no break in the middle, usually completing **notes, a table or a diagram** in the order of the talk. It is the hardest part because of academic vocabulary and the continuous pace.

### Step-by-step strategy
1. Read the task: the title of the talk and the headings of each group of notes show the lecture's **structure**. Predict the word type.
2. Listen to **the introduction**: the lecturer usually states the topic and structure (*Today I'll cover three areas…*).
3. Use the keywords in the task to find your place, but remember the task usually **paraphrases** the words in the talk.
4. Write the answer immediately; if you catch a *key term* but aren't sure of its spelling, write it by sound and fix it at the end.

### Common academic vocabulary
| Group | Words |
|---|---|
| Research | *survey, sample, hypothesis, findings, data, evidence* |
| Causes | *factor, cause, trigger, contribute to, result in* |
| Solutions | *strategy, approach, method, tackle, address* |
| Degree | *significant, marginal, substantial, negligible* |
| Frequent topics | *ecology, urban planning, marine biology, psychology, history of technology* |

### Recognising lecture structure
- *Firstly / Secondly / Finally* → answers come point by point.
- *There are three main types…* → fill in a list.
- *The most important point is…* → the key idea.
- *To sum up…* → a summary that often repeats the answers.

### Worked example
> *The experiment involved placing sensors on the riverbed to monitor the temperature of the water over a period of two years.*

Task: *Sensors were placed on the ____ to measure temperature.* Answer: **riverbed**. *placing sensors on* ↔ *were placed on*.

### Common mistakes
- Getting caught up in difficult words (scientific names) and forgetting that the answer is often an everyday word.
- Misspelling academic words (*environment, phenomenon, behaviour*).
- Writing the wrong number (singular/plural) or a word form that doesn't fit the grammar of the gap.
- Losing your place: missing one gap, panicking and missing the next one too.

### Timing tip
If you miss a gap, **move on immediately** to the next one. The answers are always in order.

### Practice outside the app
- Listen to short (10–15 minute) popular-science lectures in English, take structured notes as you listen, then summarise them aloud.
- *Shadow* a 30-second passage: listen and repeat immediately to get used to the speed.
- Keep an academic vocabulary notebook; for each word, note the pronunciation and one collocation.
'''

[modules.il-distractors-signposting]
title = "Correction traps & signposting"
description = "Spotting correction traps (Actually, sorry — it's…), reversed keywords and look-alike traps; using signposts to locate answers."
lesson = '''
IELTS Listening doesn't only test whether you can hear; it tests whether you **listen to the end of the information**. Speakers often give one value and then *correct it*, or list several options and choose one. This module combines two skills: spotting **traps** and using **signposts**.

### Common traps
| Trap | Example | How to handle it |
|---|---|---|
| Correction | *It's on the 12th — sorry, the 21st.* | Take the value **after** the correction |
| Negation | *Not the red one, the green one.* | Eliminate what is negated |
| Several options | *We could meet at 3, or 4, but 4 is better.* | Take the option that is **settled on** |
| Right words, wrong meaning | Task: *free*; recording: *free of charge for members only* | Read the attached condition |
| Similar numbers | *fifteen / fifty*, *thirteen / thirty* | Listen for the stress |
| List then eliminate | *Two options were considered, but only one was kept.* | Choose the one that was kept |

### Correction phrases
*Actually… / Sorry, I mean… / No, wait… / Let me correct that… / Hang on, it's…* When you hear these, the value before them is usually **not** the answer.

### Signposts
| Function | Example | What it means for the answer |
|---|---|---|
| Opening | *Let me start with…* | The first point begins |
| Moving on | *Moving on to… / Turning to…* | The next question is coming |
| Contrast | *However, / On the other hand,* | Important information often follows |
| Emphasis | *The main reason is… / Above all…* | The answer is often here |
| Conclusion | *In conclusion / To sum up* | A summary: check your answers |

### Worked example
> *The workshop begins at ten. Actually, sorry, that's for the morning group. Yours starts at eleven thirty.*

Answer: **11.30**. *ten* is the distractor; *Actually, sorry* signals the correction.

### Common mistakes
- Writing the answer from the first piece of information and never correcting it.
- Listening only for keywords that match the task and ignoring the context.
- Confusing the subject: the information is about a different group (*the morning group*), not the one in the question.
- Ignoring words of degree (*only, mostly, at least*).

### Timing tip
Use signposts as landmarks: when you hear *Moving on to…*, finish the current question and look at the next one.

### Practice outside the app
- When listening to audio, mark every time a speaker corrects themselves and note how they signal it.
- Write 5 short dialogues containing correction traps, ask someone to read them, and do them like a test.
- After each test, list separately the questions you got wrong because you "heard it correctly but chose the wrong version", so you know which traps catch you.
'''

[questions.il-001]
prompt = "Which describes the structure of the IELTS Listening test correctly?"
options = ["4 parts, 40 questions, each recording heard once", "3 parts, 30 questions, each recording heard twice", "4 parts, 40 questions, each recording heard twice", "2 parts, 20 questions, each recording heard once"]
explanation = "Listening has 4 parts with 40 questions in total, and each recording is played **only once**. That's why you must read the questions carefully before listening and write your answers straight away."

[questions.il-002]
prompt = "Which question type is **most common** in Part 1 (an everyday conversation between two people)?"
options = ["Form / note completion", "Matching headings", "TRUE / FALSE / NOT GIVEN", "Scientific process diagram completion"]
explanation = "Part 1 is an everyday conversation (booking, registering), so the task is usually form or note completion. Matching headings and TFNG are Reading question types."

[questions.il-003]
prompt = '''**Transcript**
Clerk: And the total comes to thirteen pounds fifty, please.
Customer: Thirteen fifty. Here you are.

Write the ticket price: £{{blank}}'''
explanation = "Evidence: *thirteen pounds fifty*. *Thirteen* (13) is stressed at the end, unlike *thirty* (30), which is stressed at the start. *fifty* here means 50 pence, so write 13.50."

[questions.il-004]
prompt = '''**Transcript**
Receptionist: Could you spell your surname for me?
Guest: Certainly. B, A, double R, I, N, G, T, O, N.

Write the guest's surname: {{blank}}'''
explanation = "*double R* means two Rs together: B-A-R-R-I-N-G-T-O-N = **Barrington**. Missing one R is a spelling mistake and loses the mark."

[questions.il-005]
prompt = '''**Transcript**
Advisor: When does the course begin?
Student: The first of September, I think.
Advisor: Yes, that's a Monday.

Write the start date of the course (NO MORE THAN TWO WORDS AND/OR A NUMBER): {{blank}}'''
explanation = "Evidence: *The first of September*. The date can be written 1 September, 1st September or September 1. The answer must include both the day and the month."

[questions.il-006]
prompt = '''**Transcript**
Agent: And what's your postcode?
Caller: It's C, B, four, two, L, T.

Write the postcode: {{blank}}'''
explanation = "Postcodes are read character by character: C-B-4-2-L-T = **CB4 2LT**. Be careful to distinguish *L* from *T* and *B* from *P*; the space does not affect marking."

[questions.il-007]
prompt = '''**Transcript**
Tutor: The seminar is at quarter to eight, so please don't be late.

What is the correct answer for the time gap?'''
explanation = "*Quarter to eight* means 15 minutes before 8 o'clock, i.e. **7.45**. 8.15 is *quarter past eight*; 7.15 is *quarter past seven*."

[questions.il-008]
prompt = "Choose **all** correct pairs (how it is said → how it is written)."
options = ["thirty → 30", "fifteen → 50", "double seven → 77", "oh (in a phone number) → 0"]
explanation = "*thirty* = 30, *double seven* = 77, and *oh* usually means 0 when reading phone numbers. *fifteen* is 15; 50 is said *fifty*."

[questions.il-009]
prompt = "You hear the word *accommodation* but write **acommodation** on the answer sheet. What happens?"
options = ["It is wrong and gets no mark because of the spelling mistake", "It still gets the mark because the pronunciation was right", "It gets half a mark", "It is only penalised if the task asks for correct spelling"]
explanation = "Listening is marked right/wrong per question: a misspelled answer counts as wrong. *accommodation* has two *c*s and two *m*s."

[questions.il-010]
prompt = '''Task: **ONE WORD ONLY**. Transcript: *The lockers are in the basement, next to the sports hall.*
Gap: Lockers are located in the ____.
Which answer is valid?'''
explanation = "The limit is **one word**, so only *basement* is valid. *the basement* is two words, and the other options are too long."

[questions.il-011]
prompt = "Choose **all** correctly spelled words."
explanation = "Correct: *accommodation*, *February*, *library*. Wrong: *recieve* (receive: i before e except after c), *necesary* (necessary has two s's)."

[questions.il-012]
prompt = '''**Transcript**
Agent: The deposit is five hundred and fifteen pounds, and the monthly rent is fifteen hundred.

Write the amounts:
Deposit: £{{blank}}
Monthly rent: £{{blank}}'''
explanation = "*five hundred and fifteen* = 515. *fifteen hundred* = 1500 (not 150). *fifteen hundred* is a common British English way of saying numbers in the thousands."

[questions.il-013]
prompt = '''**Transcript**
Caller: My mobile is oh seven double five, three nine oh, double two eight.

Write the phone number (digits only): {{blank}}'''
explanation = "Read it group by group: *oh seven* = 07, *double five* = 55, *three nine oh* = 390, *double two eight* = 228. Result: 07755390228 (11 digits)."

[questions.il-014]
prompt = '''**Transcript**
Organiser: The deadline is the second Friday of November. As you know, the first of November is a Wednesday this year.

Write the deadline date (NO MORE THAN TWO WORDS AND/OR A NUMBER): {{blank}}'''
explanation = "If 1 November is a Wednesday, the first Friday is 3 November and the second Friday is **10 November**. This question practises relative dates and quick calculation."

[questions.il-015]
prompt = '''**Transcript** (Section 1)
Staff: Good morning, Lakeside Sports Centre.
Caller: Hi, I'd like to join the swimming club.
Staff: Of course. Can I take your name?
Caller: Yes, it's Anna Reed.
Staff: And which day would you like to swim?
Caller: Wednesday, please.

**Membership form**
Name: Anna {{blank}}
Day: {{blank}}'''
explanation = "Evidence: *it's Anna Reed* and *Wednesday, please*. Both answers are stated directly with no trap; make sure you spell *Wednesday* correctly (with the d)."

[questions.il-016]
prompt = '''**Transcript**
Staff: Is that single or return?
Customer: Return, please.

What type of ticket does the customer buy?'''
options = ["A return ticket", "A one-way ticket", "A monthly pass", "A family ticket"]
explanation = "*Return* (British English) means a round-trip ticket; a one-way ticket is a *single*. This vocabulary comes up often in Part 1."

[questions.il-017]
prompt = '''**Transcript**
Agent: How many bedrooms do you need?
Caller: Two, and ideally a garden.
Agent: Lovely. Our two-bedroom flats start at six hundred pounds a month.

**Note**
Number of bedrooms: {{blank}}
Price from: £{{blank}} a month'''
explanation = "Evidence: *Two* and *six hundred pounds a month*. Numbers can be written in words or digits, as long as they fit the word limit."

[questions.il-018]
prompt = '''**Transcript**
Staff: When would you like to start?
Customer: Tuesday the third... no, wait, the fifth. The flat isn't free until then.
Staff: Fine, the fifth of May.

**Form**
Start date: {{blank}} May'''
explanation = "The customer says *the third* and then corrects herself: *no, wait, the fifth*, and the staff member confirms *the fifth of May*. The answer is **5**, not 3."

[questions.il-019]
prompt = '''**Transcript**
Agent: And your address?
Caller: Forty-two Maple Road... sorry, that should be Maple *Lane*.
Agent: Maple Lane, right.

**Form**
Address: 42 Maple {{blank}}'''
explanation = "The caller corrects himself: *sorry, that should be Maple Lane*. The agent repeats *Maple Lane* to confirm. *Road* is the distractor."

[questions.il-020]
prompt = '''**Transcript**
Agent: Would you like the standard room at ninety pounds or the sea view at one hundred and ten?
Guest: The sea view is a bit much for just two nights. I'll take the standard one.

Which room does the guest choose, and how much is it per night?'''
explanation = "The guest says *I'll take the standard one*, so the choice is the standard room at **£90**. £110 is the price of the sea-view room, which was rejected."

[questions.il-021]
prompt = '''**Transcript**
Staff: Would you like to pay by card?
Customer: I'll pay cash. Is there a discount for students?
Staff: Yes, ten per cent. So that's forty-five pounds instead of fifty.

**Note**
Student price: £{{blank}}'''
explanation = "Evidence: *forty-five pounds instead of fifty*. £50 is the original price and £45 is the price after the 10% discount. The question asks for the student price."

[questions.il-022]
prompt = '''**Transcript**
Agent: The package includes breakfast, airport transfer and a guided city tour. Entry to the museum is extra, and so are drinks at dinner.

Choose **two** things that **are** included in the package.'''
options = ["Breakfast", "Museum entry", "Drinks at dinner", "Airport transfer"]
explanation = "The package includes *breakfast* and *airport transfer*. Museum entry and drinks are *extra* (charged separately)."

[questions.il-023]
prompt = '''**Transcript**
Agent: And how will you be getting to the centre?
Caller: I usually take the bus. Though the number nineteen doesn't run on Sundays, so I'll cycle then.
Agent: OK, so I'll note the bus for weekdays.

**Note**
On Sundays, Mr Hall will {{blank}} to the centre.'''
explanation = "Evidence: *doesn't run on Sundays, so I'll cycle then*. The task asks what he does on Sundays, not his usual means of transport (the bus)."

[questions.il-024]
prompt = '''**Transcript**
Staff: Is that a one-off payment or monthly?
Customer: Monthly, please. I'd rather spread the cost.

Which payment method does the customer choose?'''
options = ["Monthly instalments", "A single payment", "A gift card", "Payment on delivery"]
explanation = "*Monthly* and *spread the cost* both mean paying in smaller monthly amounts. *one-off* means a single payment, which was rejected."

[questions.il-025]
prompt = '''**Transcript**
Staff: So you booked the family room for the fourteenth of July... sorry, the room is only available from the fifteenth. Would that work?
Guest: Yes, as long as we can check in after lunch. We'll leave on the twentieth.
Staff: That's five nights, then.

**Booking note**
Check-in: {{blank}} July
Number of nights: {{blank}}'''
explanation = "The staff member corrects herself: *only available from the fifteenth*, and the guest agrees. From the 15th to the 20th is *five nights*. 14 is the distractor."

[questions.il-026]
prompt = '''**Transcript**
Caller: My reference is H, double seven, four, B... no, sorry, D. D for dog.
Agent: So H, 7, 7, 4, D.

**Booking reference**
{{blank}}'''
explanation = "The caller says *B... no, sorry, D. D for dog*, so the last character is **D**; the agent confirms *H, 7, 7, 4, D*. Answer: H774D."

[questions.il-027]
prompt = '''**Transcript**
Agent: Sorry, did you say the course is called Beginners' Photography?
Customer: No, Intermediate Photography. The beginners' one is already full.
