[modules.iw1-format-overview]
title = "Report structure and the overview"
description = "The 4-paragraph layout, paraphrasing the task, writing an overview and choosing key data without giving personal opinions."
lesson = '''
### Suggested learning path
The IELTS area is for learners who have roughly finished B1. Study IELTS Grammar and IELTS Vocabulary in parallel, then move on to this Writing Task 1 track. The app is text-only and grades essays by keywords, so it can only check the *required components*, not give you a band. Use the `model_answer` and the self-assessment checklist to compare your writing.

### What Task 1 asks for
You have about 20 minutes to write at least 150 words that **describe and compare information** from a chart, table, process or map. It is not a discussion essay: do not give causes, predictions or opinions that the data does not show. Task 1 is worth about one third of the total Writing score, but a report with no overview is usually pulled down to band 5 for Task Achievement.

### The 4-paragraph layout
| Paragraph | What to do | Length |
|---|---|---|
| 1. Introduction | Paraphrase the task sentence: change the verbs and nouns, keep the figures, units and time period | 1–2 sentences |
| 2. Overview | State the 2–3 biggest features of the whole data set, **with no detailed figures** | 2–3 sentences |
| 3. Body 1 | Describe the first group of data, with supporting figures and comparisons | 3–4 sentences |
| 4. Body 2 | Describe the remaining group | 3–4 sentences |

### Paraphrasing the task
A typical task reads *The chart shows the percentage of households with internet access in four countries between 2000 and 2020.* How to change it:
- *shows* → *illustrates, compares, gives information about*;
- *the percentage of households with internet access* → *the proportion of homes connected to the internet*;
- *between 2000 and 2020* → *over a 20-year period / from 2000 to 2020*;
- *four countries* → *four different nations*.
Do not copy the task sentence, because copied words are not counted when your vocabulary is assessed. Do not change the meaning either: *percentage* is not *number*.

### What an overview is
The overview is the big picture: the general trend, the highest/lowest item, the biggest difference, or (for a process) the number of stages and the start and end points. Useful patterns: *Overall, X increased while Y declined.* / *It is clear that … was the most popular, whereas … was the least.* / *The process has five main stages, beginning with … and ending with …* Put the overview in its own paragraph, right after the introduction, so the examiner can easily find it.

### Choosing data: key features
Do not list every number. Choose: the start and end points, peaks and lows, crossing points, the most striking item and any item that breaks the general pattern. Small, less meaningful figures can be left out. Each body paragraph should **group** items with similar trends.

### How band 6 differs from band 7
- **Task Achievement:** band 6 has an overview, but it is vague or misses major features, and includes unnecessary detail. Band 7 has a clear overview, picks the right key features and supports them with accurate figures.
- **Coherence & Cohesion:** band 6 follows the order of the chart and uses basic linking words. Band 7 groups information logically (rising / falling) and uses natural referencing (*the latter, this figure*).
- **Lexical Resource:** band 6 repeats *increase / decrease*. Band 7 varies them: *climb, surge, dip, plunge*.
- **Grammar:** band 6 uses mostly simple sentences and makes tense errors. Band 7 mixes complex sentences and *while/whereas* clauses, with few errors.

### Common mistakes made by Vietnamese learners
- Forgetting the overview, or putting it at the end as a conclusion.
- Writing *In conclusion, I think…* or explaining causes ("because people are richer").
- Wrong tense: data from 1990–2010 needs the past simple.
- Copying figures with the wrong unit: *percent* vs *percentage*, *a number of* vs *the number of*.

### Timing tips
3 minutes to analyse the task and underline the key features, 15 minutes to write, 2 minutes to check tenses and figures. Always spend 20 minutes on Task 1, no more, so that you keep 40 minutes for Task 2.
'''

[modules.iw1-line-bar-trends]
title = "Line and bar charts: the language of trends"
description = "Trend verbs and nouns, adverbs of degree, peak, bottom out, plateau, and how to choose the key figures."
lesson = '''
### Step-by-step strategy
1. Read the title, the axes and the units (millions of people, %, tonnes).
2. Find the general trend of each line/bar: rising, falling, fluctuating or unchanged.
3. Find the highest point, the lowest point and any crossing points.
4. Put lines with similar trends into the same body paragraph.
5. Write the overview before describing the details.

### Trend verbs and nouns
| Direction | Verbs | Nouns |
|---|---|---|
| Up | rise, increase, grow, climb, go up | a rise, an increase, a growth, an upward trend |
| Sharply up | surge, soar, jump, rocket | a surge, a jump |
| Down | fall, decrease, decline, drop | a fall, a decrease, a decline, a drop |
| Sharply down | plunge, plummet, collapse | a sharp fall, a plunge |
| Stable | remain stable, stay constant, level off, plateau | a plateau, a period of stability |
| Up and down | fluctuate, vary | fluctuations |
| Peak / low | peak at, reach a high of / bottom out at, hit a low of | a peak, a low point |

### Adverbs and adjectives of degree
Fast: *sharply, dramatically, rapidly, significantly*. Slow: *gradually, steadily, slightly, marginally*. Matching pairs: *a sharp rise* (adjective + noun) = *rose sharply* (verb + adverb). Switching between these two forms helps you vary your structures.

### Prepositions with figures
- *rose from 20% to 35%* (start point and end point)
- *rose by 15%* (the amount of change)
- *peaked at 40%* (the level reached)
- *reached a peak of 40%*
- *stood at 25%* (stayed at a level)
- *in 2005 / between 2000 and 2010 / over the period*

### Choosing the key figures
Each line should have at most 2–3 figures: the start, the end, and the peak or low if it matters. Do not write *In 2001 it was 12, in 2002 it was 14, in 2003 it was 15…* Write *It climbed steadily from 12 to 15 between 2001 and 2003.*

### Tenses
Past dates take the past simple. Future projections use *is projected to / will*. A period that runs up to the present can use the present perfect with *since*.

### Worked example
Task: the number of subscribers of three companies, 2010–2020. Band 6 sentence: *The number of customers of Company A went up. Then it went up again.* Band 7 sentence: *Company A's customer base climbed steadily from 2 million to 5 million, overtaking Company B in 2016.* The band 7 sentence has a comparison, figures, precise prepositions and varied vocabulary.

### Common mistakes
- Confusing *from … to* with *by*: *rose by 10* (went up by 10) is different from *rose to 10* (reached 10).
- Writing *fell down*, *increase up* (redundant).
- Repeating *increase* in every sentence.
- Describing all 12 data points instead of summarising the trend.
- Giving reasons that are not in the chart (e.g. "because of the economic crisis").

### Band 6 and band 7
Band 6 describes the data correctly but monotonously, and figures are sometimes wrong or excessive. Band 7 compares the items, groups trends, uses at least 6–8 different trend words and makes almost no data errors. This affects both Task Achievement and Lexical Resource.

### Timing tips
Circle the points you need to mention on the task paper (peaks, lows, crossing points). When writing, each body paragraph needs only 3–4 sentences: if it is much longer, you are listing.
'''

[modules.iw1-pie-table-proportions]
title = "Pie charts and tables: proportions and grouping data"
description = "Expressing proportions and fractions, account for / make up, comparisons and grouping many categories."
lesson = '''
### Step-by-step strategy
1. Identify the unit: percentages, numbers, money.
2. Find the largest and the smallest category.
3. Check whether there are two points in time or two groups to compare.
4. Group the categories: large (over 30%), medium and small.
5. Write an overview that states the most striking item and the biggest difference.

### Expressing proportions
| Meaning | Pattern |
|---|---|
| Taking up a share | *Rent accounted for 35% of spending.* / *Food made up a quarter of the budget.* |
| Fractions | *a quarter (25%), a third (33%), a half (50%), two-thirds (67%), three-quarters (75%)* |
| Approximation | *just over a fifth, nearly half, roughly 30%* |
| Largest / smallest | *the largest share, the smallest proportion, the highest figure* |
| Multiples | *twice as high as, three times the figure for…* |
| Comparison | *compared with, whereas, while, in contrast, by comparison* |

### Grammar notes
- *The proportion of X* takes a singular verb; *a proportion of people* can take a plural verb depending on the noun that follows.
- *The number of students is…* (singular) is different from *A number of students are…* (plural).
- Use *percentage* in general statements; use *percent* or *%* after a number.
- Do not write ~~the percentage of 20%~~; write *20% of…* or *the percentage was 20*.

### Grouping data
A table with 8 categories should not be described row by row. Group them: *The three largest categories were housing, food and transport, which together made up over 70%.* This grouping creates good cohesion and saves words. For a table covering many years, pick the two most contrasting points to compare.

### Two pie charts from two points in time
When there are two pie charts (1990 and 2020), the overview should state **the biggest change**, e.g. *the share of renewable energy more than doubled while coal fell sharply.* Body 1 covers the items that rose; body 2 covers those that fell or stayed the same.

### Worked example
Table: a family budget, housing 38%, food 24%, transport 14%, leisure 9%, other 15%. A good overview: *Housing took the largest share of the household budget, followed by food, while leisure accounted for the smallest.* Body: *Housing accounted for 38%, while food made up 24%...* Do not write "people spend a lot on housing because it is expensive".

### Common mistakes
- Forgetting the unit.
- Confusing *twice as many as* with *twice more*.
- Using *the majority* for an item of only 30%: *majority* means more than 50%.
- Adding up totals wrongly when saying *together*.

### Band 6 and band 7
Band 6: lists categories and figures with simple comparisons (*higher than*). Band 7: groups categories, uses fractions and approximations accurately, varies *account for / make up / represent / constitute*, and uses multiple comparisons without data errors.

### Timing tips
Work out the fractions before you write: 25% is a quarter, 33% is a third. Rounding where appropriate (*just under a third*) helps you avoid awkward exact figures that may cause errors.
'''

[modules.iw1-process-diagram]
title = "Processes and cycles"
description = "The passive, sequencing words, grouping stages and writing an overview for a manufacturing or natural process."
lesson = '''
### Step-by-step strategy
1. Identify the type: a manufacturing process (with people/machines) or a natural cycle.
2. Count the stages and find the start and end points.
3. Number the stages on the task paper.
4. Split the stages into 2 groups (e.g. preparation and finishing) for the two body paragraphs.
5. The overview states the total number of stages and the start and end points, or says it is a closed cycle.

### The language of processes
| Function | Pattern |
|---|---|
| Starting | *First, At the first stage, The process begins with…* |
| Continuing | *Next, Then, After that, Following this, Subsequently* |
| Simultaneous | *At the same time, Meanwhile, While this is happening* |
| Ending | *Finally, In the last stage, The process ends when…* |
| Linking stages | *Once the beans are dried, they are…* / *After being washed, the fruit is cut.* |

### The passive
Processes mainly use the **present simple passive**: *The clay is mixed with water and is then shaped into bricks.* Use the active only when the subject acts by itself in a natural cycle: *Water evaporates and condenses into clouds.* Avoid *I / we*. The pattern *passive + V-ing* links two actions: *The bricks are heated, producing hard blocks.*

### Processes vs cycles
A manufacturing process has a clear start and end point. A cycle is closed, so the overview says *The diagram shows a continuous cycle* and does not "end". Write in the **present simple**, because a process is a general truth with no time reference.

### Precise vocabulary
Keep the exact names of materials, equipment and actions: *crush, filter, heat, cool, package, store, harvest*. You may paraphrase lightly, but do not change the meaning (*filter* is not *wash*). Do not add stages that are not in the diagram.

### Worked example
A recycled-paper process has 6 stages. Band 7 overview: *Overall, the process of recycling paper has six stages, starting with the collection of used paper and ending with the delivery of new rolls.* Body 1: *First, used paper is collected and transported to a factory, where it is sorted…* Body 2: *After the ink is removed, the pulp is pressed…*

### Common mistakes
- Wrong active forms: ~~The machine crushes the paper and then pour into water~~ (errors in parallelism and the passive).
- Wrong past participles of irregular verbs: ~~is cutted~~ (correct: *is cut*), ~~is putted~~ (correct: *is put*).
- Repeating *then* in every sentence.
- Miscounting or skipping stages.
- Listing "Step 1, Step 2" like bullet points, which loses cohesion.

### Band 6 and band 7
Band 6 covers all the stages but with monotonous structures (*Then… Then…*) and some passive errors. Band 7 mixes sequencing adverbs with *once / after being / while* clauses, groups the stages sensibly, uses the passive accurately and has an overview that clearly states the number of stages.

### Timing tips
Spend 2 minutes numbering the stages. After writing, check the passive: does every sentence have *be + V3*? If you are short of time, prioritise the overview and covering every stage over complex sentences.
'''

[modules.iw1-maps-change]
title = "Maps: comparing two points in time"
description = "Vocabulary for construction and change, location words, past vs present tenses and the overview for maps."
lesson = '''
### Step-by-step strategy
1. Identify the two points in time, e.g. 1990 and now (or a future plan).
2. Choose a fixed landmark (a river, the main road, a school) to locate things.
3. List what is **new**, what was **removed**, what **stayed the same** and what **changed its function**.
4. Split the body: the area that changed most, then the rest.
5. The overview states the overall degree of change: *The village changed significantly, with farmland replaced by housing.*

### Vocabulary of change
| Meaning | Words/phrases |
|---|---|
| Built new | *be built, be constructed, be added, appear, a new … was opened* |
| Removed | *be demolished, be knocked down, be removed, disappear* |
| Replaced | *be replaced by, make way for, be converted into, be turned into* |
| Expanded | *be expanded, be extended, be enlarged, double in size* |
| Reduced | *be reduced, shrink* |
| Unchanged | *remain unchanged, stay the same, be retained* |
| Moved | *be relocated, be moved to* |

### Location words
*to the north of, in the south-east, on the eastern side, next to, opposite, between … and …, alongside the river, at the edge of, in the centre.* Use compass directions and landmarks; avoid *on the left* if the map has a north arrow.

### Tenses
Two past dates take the past simple (*was built*). Past compared with the present: *In 1995 there was a farm, but today there is a shopping mall.* A future date: *will be built, is planned to be*. You may change tense within a sentence if the time reference changes, but make it clear.

### The passive
Maps use the passive a lot because you do not know who did the work: *The farmland was replaced by houses, and a bridge was constructed across the river.* Use the active for features that appear: *A new library appears in the north.*

### Worked example
Task: maps of a town in 1980 and 2020. A good overview: *Overall, the town became much more developed, with farmland and the old market giving way to housing and a modern shopping centre, while the river and the main road remained unchanged.* This sentence states the major changes and what stayed the same, with no small details.

### Common mistakes
- Using the present tense for two past dates.
- Confusing *in the north* with *to the north of*.
- Using active *build* with no agent: ~~The council build a school~~ (wrong tense).
- Leaving out what stayed the same (also a key feature).
- Explaining causes ("because the population grew").

### Band 6 and band 7
Band 6 lists changes in the order they appear on the map, and locations are sometimes vague. Band 7 groups changes by theme (housing, transport), locates them precisely using directions, uses varied vocabulary of change and has a clear overview.

### Timing tips
Spend 2 minutes drawing arrows on the task paper linking the areas that changed. Use one short clause per change. If you run out of time, prioritise the biggest changes over small details.
'''

[modules.iw1-mixed-band-upgrade]
title = "Combined charts and moving from band 6 to band 7"
description = "Writing about two charts, linking data across them and turning a band 5–6 report into a band 7 one."
lesson = '''
### Strategy for combined charts
The task has two charts (e.g. a bar chart + a table, or a line graph + a pie chart). Do not describe each one separately as if they were two reports. Instead:
1. Find the **relationship**: same topic, or complementary information.
2. Overview: one sentence for the first chart and one for the second, or one general sentence stating the relationship.
3. Body 1 mainly covers the first chart; body 2 covers the second and can refer back to link the two sources with *In contrast, the pie chart reveals…*
4. Choose only 2–3 key points from each chart.

### Linking two sources
*While the bar chart shows …, the table indicates …* / *This pattern is also reflected in…* / *By contrast, the second chart reveals…* / *Taken together, the figures suggest…* (but do not infer anything beyond the data).

### From band 6 to band 7
| Band 6 | Band 7 |
|---|---|
| *The number went up a lot.* | *The number rose dramatically from 20 to 70.* |
| *A is high. B is low.* | *A was considerably higher than B.* |
| *There are many people who use bikes.* | *Cycling was the most popular mode of transport.* |
| Listing 10 figures | Stating the trend + 2 key figures |
| *Then…, then…* | *Following this, … / Once …* |
| No overview | A clear overview with a comparison |

### Self-assessment against the 4 criteria
1. **Task Achievement:** is there an overview? are the figures correct? are the key features selected? no opinions?
2. **Coherence & Cohesion:** 4-paragraph layout? varied linking words? referencing (*this, the latter*)?
3. **Lexical Resource:** varied trend vocabulary, correct collocations?
4. **Grammar:** correct tenses? complex sentences (*while, which*)? singular/plural errors?

### Upgrade example
Band 5.5 script: *The chart shows internet users. In 2010 it is 30 and in 2012 it is 40 and in 2014 is 55. It is increase.* Upgraded to band 7: *The chart illustrates changes in the number of internet users between 2010 and 2014. Overall, usage grew steadily, rising from 30 million to 55 million.* Changes: corrected tenses, removed repetition, added an overview, added the unit and the *from … to* prepositions.

### Common mistakes
- Describing the two charts separately with no link.
- Putting figures from chart A in the paragraph about chart B.
- Too much detail, so you run out of time.
- Not checking tenses when revising.

### Band 6 and band 7: summary
Band 6.5 means being solid at band 6 and reaching band 7 on some criteria. To move up, the quickest wins are: (1) a clear overview, (2) selective use of figures, (3) varied trend vocabulary, (4) adding 2–3 accurate complex sentences.

### Timing tips
When revising, check in this order: figures and tenses (they affect the score most), then word choice, and finally spelling and commas.
'''

[questions.iw1-001]
explanation = "Option C changes the verb (*compares*) and the noun (*proportion of homes*) while keeping the meaning, the number of cities and the year. Option A copies the task. Option B changes *percentage* to *number*, so the meaning is wrong. Option D adds a cause that is not in the task."

[questions.iw1-002]
explanation = "The overview should be a separate paragraph straight after the introduction so the examiner can see it clearly. Leaving it out usually pulls Task Achievement down to around band 5. Task 1 has no personal opinion, so do not use *I think*."

[questions.iw1-003]
explanation = "Task 1 requires at least 150 words in about 20 minutes. 250 words is the requirement for Task 2."

[questions.iw1-004]
explanation = "An overview usually opens with *Overall,* or *In general,* to signal the big picture. Do not use *In conclusion*, because Task 1 does not need a separate conclusion."

[questions.iw1-005]
explanation = "Analyse the task briefly, spend most of the time writing and leave a few minutes to check figures and tenses. Spending too long on Task 1 cuts into the time for Task 2, which carries twice the weight."

[questions.iw1-006]
explanation = "Option B states the general trend and the main contrasts across the whole table without getting lost in detailed figures. Option A is just detail, not an overview. Option C adds a cause that is not in the table. Option D is wrong: Aland and Cestan rose and Dunmark stayed the same."

[questions.iw1-007]
explanation = "An overview covers trends, contrasts, the highest/lowest items or the number of stages in a process. It does not list every figure (that belongs in the body) and has no opinions or invented causes."

[questions.iw1-008]
explanation = "Task 1 only describes the data. *because the government created many new jobs* is a guessed cause that is not in the chart, so it loses Task Achievement marks. The tense *fell* is perfectly correct."

[questions.iw1-009]
explanation = "A and B keep the meaning with synonyms (*average → mean*, *spending → expenditure*). C adds the idea of \"explaining why\", and D changes *spending* to *income* and *weekly* to *yearly*."

[questions.iw1-010]
explanation = "You need a present simple verb with the singular subject *the chart*, so add *-s*. Using different verbs (*illustrates, compares, presents*) is better for Lexical Resource than repeating *shows*."

[questions.iw1-011]
explanation = "Option B describes the data correctly (21 > 2 x 9) and gives figures with *from … to*. The other options are predictions, causes or advice, none of which are in the table."

[questions.iw1-012]
explanation = "4-criteria checklist: (1) Task Achievement: the intro paraphrases the task, the overview has the general trend (both groups rose) and the contrast (teenagers were always higher), with no detailed figures and no causes; (2) Coherence: the intro and overview are clearly separated, with the signal word *Overall*; (3) Lexical Resource: no copying of the task, uses *illustrates, usage, consistently*; (4) Grammar: correct past simple, at least one complex sentence with *and / while*."

[questions.iw1-013]
explanation = "Option C states both trends and the important contrast (stores still had the larger share) without using numbers. Option A just repeats the figures. Option B predicts \"will soon disappear\". Option D gives a cause that is not in the data."

[questions.iw1-014]
explanation = "A and C keep the meaning (*two or more = at least two*, *proportion = share*). B narrows it to *exactly two*. D talks about the total number of cars and says \"doubled\", which is not in the task."

[questions.iw1-015]
explanation = "High bands require selecting and grouping figures by key features. Listing everything is a common band 5–6 mistake. Describing only the first and last years misses important peaks and lows. Giving causes is not allowed when the data does not show them."

[questions.iw1-016]
explanation = "*Whereas* and *while* link two contrasting clauses after a comma. Using these conjunctions to compare items is a band 7 sign for Grammatical Range. Do not use *but* and *whereas* together."

[questions.iw1-017]
explanation = "The verb *rose* takes the adverb *sharply* (not the adjective *sharp*). A noun phrase needs an adjective: *a sharp rise*, so C is wrong. The data is in the past (2000–2005), so the past simple is needed; D uses the present and has the wrong tense."

[questions.iw1-018]
explanation = "*Reach a peak of + figure* is the standard phrase for the highest point. The price then started to fall, so this is the top of the line."

[questions.iw1-019]
explanation = "*Level off / plateau / remain stable* are used for a flat line. *Fluctuate wildly* means going up and down irregularly, *peak* means reaching the top and then falling, and *plummet* means falling sharply; none of them fits a flat line."

[questions.iw1-020]
explanation = "Before the noun *increase* you need the adjective *significant*. The adverb *significantly* goes with verbs: *sales increased significantly*. Being able to switch between the two patterns (verb + adverb / adjective + noun) helps you vary your structures."

[questions.iw1-021]
explanation = "90 is the highest value (2016); in 2014 sales dropped to 65 and then rose again; 80 − 65 = 15 thousand. C is wrong because there was a fall in 2014. E is wrong: 50 → 80 is not double (that would be 100)."

[questions.iw1-022]
explanation = "The pair *from … to …* gives the start and end points. This is a common preposition error at band 5–6 (e.g. writing *fell 8% to 5%* without *from*)."

[questions.iw1-023]
explanation = "*By* gives the amount of change (10 → 12 is a 20% rise). *To* gives the end point (*rose to $12*). Confusing *by* and *to* changes the meaning of the figures and also affects Task Achievement."

[questions.iw1-024]
explanation = "Grouping items with the same trend in one paragraph makes comparisons clear and coherent (Coherence and Cohesion). Splitting by year or listing bar by bar easily turns into a list of figures; personal opinions do not belong in Task 1."

[questions.iw1-025]
explanation = "After the adjective *gradual* you need a noun meaning a fall: *decline, decrease, fall, drop*. The pattern *There was a + adj + noun + in + subject* is an alternative structure to *The birth rate fell gradually*."

[questions.iw1-026]
explanation = "*Fluctuate*, *rise and fall erratically* and *show considerable variation* all describe ups and downs. *Remain stable* and *plateau* describe a flat line, the opposite meaning."

[questions.iw1-027]
explanation = "Checklist: (1) Task Achievement: covers the initial dip, the sharp rise, the 2015 peak and the slight final fall; accurate figures with the unit (thousands); (2) Coherence: follows time order with linkers *After that, In the final five years*; (3) Lexical: varied *dipped, rose sharply, reaching a peak, fell marginally*; (4) Grammar: correct past simple, with the participle phrase *reaching a peak of…*."

[questions.iw1-028]
explanation = "Option B picks the key point (the March peak) and summarises the rest with a comparison (*roughly their January level*), using the structure *before + V-ing*. A is vague and wrong (sales did not rise again). C lists every number. D stacks two adverbs and gives no figures."

[questions.iw1-029]
explanation = "49.6% is just below 50%, so it is *just under half* (or *nearly half*). Precise approximation language (*just under, well over, roughly*) is a band 7 sign; a wrong approximation counts as misreporting the data."

[questions.iw1-030]
explanation = "25% = 1/4 = *a quarter*. A third is about 33%, a half is 50% and a fifth is 20%. Using fractions instead of percentages helps you avoid repeating numbers."

[questions.iw1-031]
explanation = "The fixed phrase is *account for + proportion*. 2010 is in the past, so use *accounted*. Do not write *accounted 40%* (missing *for*)."

[questions.iw1-032]
explanation = "*Make up* is followed directly by the proportion (no *of*), while *account* must take *for*. *Consist of* is not used in the passive and means \"to be composed of\", not \"to take up a share\"."

[questions.iw1-033]
explanation = "2/3 ≈ 66.7%, so 67% is *roughly two thirds*. *Exactly* is wrong because the figures are not identical. Three quarters is 75%, too far off; *just over half* only suits about 51–55%."

[questions.iw1-034]
explanation = "Food at 35% was the highest in 2000, and in 2020 housing at 38% overtook it; 35 − 22 = 13 percentage points; leisure rose to 14%. C is wrong: 30 → 38 is not double. E is wrong: the smallest category is *Other* (and leisure in 2000), not transport."

[questions.iw1-035]
explanation = "The difference between two percentages is measured in *percentage points* (30 − 20 = 10). Saying *rose by 10%* is wrong, because the relative increase is actually 50% (10/20). Distinguishing these two ideas helps you describe figures accurately."

[questions.iw1-036]
explanation = "You need a superlative adjective with *share*: *the largest / biggest / greatest share*. This is a common way to state the leading category in an overview."

[questions.iw1-037]
explanation = "When there are many categories, grouping them by level (high/low) or by trend helps you compare and avoid listing. Mentioning only one country misses key data; writing about every cell is mechanical listing."

[questions.iw1-038]
explanation = "5% is a very small share, so use *a small minority / fraction / proportion*. These nouns save you from repeating the figure."

[questions.iw1-039]
explanation = "*The majority, over half, more than half* all mean > 50%. *A minority* is < 50%, and *nearly half* is slightly under 50%."

[questions.iw1-040]
explanation = "Checklist: (1) Task Achievement: the overview states the food/housing reversal, the body gives correct figures for both years; (2) Coherence: compares in pairs, using *however, whereas*; (3) Lexical: *proportion, share, accounted for, made up* instead of repeating *percentage*; (4) Grammar: past perfect with *By 2020*, complex sentences with *while/whereas*."

[questions.iw1-041]
explanation = "*By + a past date* describes a result completed before that point, so use the past perfect *had fallen*. *Has fallen* (present perfect) does not go with a finished past date. Using the past perfect correctly earns credit for Grammatical Range."

[questions.iw1-042]
explanation = "*Twice that of* (or *twice as large as*) is the standard structure for doubling; *that* replaces *the share* to avoid repetition. B and C are ungrammatical; D reverses the figures."

[questions.iw1-043]
explanation = "*Identical / equal to that of* says the two shares are the same; *similar / comparable to* is also acceptable. The structure *that of* avoids repeating the noun *share*, making the sentence more concise and academic."

[questions.iw1-044]
explanation = "Manufacturing processes usually use the present passive: *am/is/are + V3*. Tea leaves do not pick themselves, so it must be *are picked*. *Are pick* is missing the participle form."

[questions.iw1-045]
explanation = "*After / Once / When* + clause links two consecutive stages in one sentence. This is better than writing two short sentences starting with *Then*."

[questions.iw1-046]
explanation = "*Finally* (or *In the final stage*) signals the last stage. *Firstly* is for the first stage, *Meanwhile* is for two simultaneous actions, and *For example* introduces an example, not a sequence."

[questions.iw1-047]
explanation = "A process overview states the number of stages and the start and end points. B is the detail of stage 1 (it belongs in the body). C and D are opinions/judgements; the diagram says nothing about difficulty or cost."

[questions.iw1-048]
explanation = "In a natural cycle the living things act by themselves, so the active voice is natural; the passive is for processes carried out by people. The overview states that the cycle repeats and how many stages it has. Personal opinions have no place in Task 1."

[questions.iw1-049]
explanation = "Passive *is + V3*: *is heated*. The mixture does not heat itself, so the active *heats* is not used."

[questions.iw1-050]
explanation = "The clay is dug up by someone, so the relative clause must also be passive: *which is dug*. A non-defining relative clause (with commas) is a way to combine two stages into one complex sentence."

[questions.iw1-051]
explanation = "*Then / subsequently* sits between the (omitted) *are* and the V3 to show the next stage. Repeating *then* many times lowers your Lexical score, so alternate it with *subsequently, following this, after that*."

[questions.iw1-052]
explanation = "*After being + V3* is a reduced passive with the correct order and figures. B has the wrong meaning (the juice \"ferments the tanks\") and no passive. C reverses the order. D has the wrong tense and the wrong time period (*months*)."

[questions.iw1-053]
explanation = "*Following this, Subsequently, At the next stage* all show sequence. *In contrast* shows contrast, and *Overall* opens an overview; neither links stages."

[questions.iw1-054]
explanation = "Checklist: (1) Task Achievement: the overview states the number of stages and the start and end points; all four first stages are covered, with details such as *five days, in the sun*; (2) Coherence: *First, After that, before being*; (3) Lexical: nominalisation *the harvesting of*; (4) Grammar: correct present passive, with *before being + V3*."

[questions.iw1-055]
explanation = "Option B uses the reduced clause *Once shaped*, *are left to dry* and *after which*: varied and accurate, meeting the band 7 criteria. A is correct but monotonous; C lacks the passive auxiliary; D is ungrammatical."

[questions.iw1-056]
explanation = "The loop is a key feature of the diagram, so it belongs in the overview. The temperature at each stage is a detail for the body; judging the environmental impact is an opinion beyond the data."

[questions.iw1-057]
explanation = "*Where / in which* replaces *in the crusher* and joins two stages into one complex sentence. *Which* alone is not possible because it is followed by a complete clause (*they are broken*)."

[questions.iw1-058]
explanation = "*To the north of X* means outside X, on its northern side. *In the north of X* means inside X, in its northern part. A wrong location preposition makes the reader misread the map."

[questions.iw1-059]
explanation = "There is a past time reference *In 2010*, so use the past simple passive *was built*. Maps often use the passive because who built it does not matter."

[questions.iw1-060]
explanation = "*Clear trees / a forest* means cutting them down to free the land. *Construct* means build, *extend* means enlarge, and *relocate* means move; none of these fits trees being cut down."

[questions.iw1-061]
explanation = "From the past to the present (*Since 1990*, a map of today) takes the present perfect passive *has been converted*. The past simple does not go with *since*; *In 1990* is a past date, so the present perfect is not used."

[questions.iw1-062]
explanation = "A, C and D match the 2020 description. The school was enlarged, not *demolished*, and the road was only widened, not moved."

[questions.iw1-063]
explanation = "A closed time period (*between 2000 and 2020*) takes the past simple; the school was enlarged by someone else, so the passive *was extended* is needed."

[questions.iw1-064]
explanation = "A map overview states the overall change (from farming/fishing to residential/leisure). B invents a figure and is a detail; C is an opinion; D is just one minor change."

[questions.iw1-065]
explanation = "*Construct, erect, set up* all mean building or establishing something new. *Demolish* and *knock down* mean removing it, the opposite meaning, typically used when a building disappears from the later map."

[questions.iw1-066]
explanation = "*Knock down / pull down / tear down* mean demolishing a building. *Make way for* means clearing space for something new, a very useful phrase for map tasks."

[questions.iw1-067]
explanation = "Grouping by area or by type of change helps the reader follow the comparison. Describing the two maps separately without comparing them loses the focus on \"change\"; describing only one building misses key data."

[questions.iw1-068]
explanation = "Checklist: (1) Task Achievement: covers all five changes in the correct locations; (2) Coherence: starts with the biggest change, groups by area, uses *Meanwhile, while*; (3) Lexical: *replaced by, converted into, extended, widened* instead of repeating *changed*; (4) Grammar: correct past passive, relative clause *where…*."

[questions.iw1-069]
explanation = "Option B uses the participle phrase *formerly occupied by* and the verb *houses*, which is precise and academic. A is clumsy, and C and D are ungrammatical (*become to*, *changed park*)."

[questions.iw1-070]
explanation = "When almost every building was replaced, you need a strong adverb of degree: *completely / radically / dramatically transformed*. Choosing an adverb of degree that matches the data is a band 7 sign for Lexical Resource."

[questions.iw1-071]
explanation = "*Where* = *at the place in which*, introducing a complete place clause (*the old market used to stand*). *Which/that* need a preceding noun as an antecedent; *when* refers to time."

[questions.iw1-072]
explanation = "Combined charts still need one overview, covering the main features of both charts and linking them if possible. Leaving out a chart or the overview lowers Task Achievement."

[questions.iw1-073]
explanation = "*Increase* meaning \"go up\" is intransitive and is not used in the passive *were increased*. The subject is *The number* (singular), so if *to be* were needed it would be *was*, not *were*."

[questions.iw1-074]
explanation = "Option A replaces *went up a lot* with *rose significantly* and adds supporting figures. B repeats an informal word; C stacks two adverbs; D has wrong verb agreement and a wrong passive."

[questions.iw1-075]
explanation = "The script has no overview, only lists numbers and makes a personal prediction (*I think it will…*). The past simple is correct for past data, and the script has almost no linking words: the problem is too few, not too many."

[questions.iw1-076]
explanation = "Option A links the 2020 point of the line graph with the share in the pie chart, approximating 45% as *almost half*. B is an opinion; C does not really link the charts; D mistakes the destination share for total exports."

[questions.iw1-077]
explanation = "*Accounted for* makes it clear what Asia had 45% of. The original *Asia was 45%* is vague (a continent cannot \"be\" a percentage), a common band 5 mistake."

[questions.iw1-078]
explanation = "*The number of + plural noun* takes a singular verb (*was*), because the main subject is *the number*. C is missing the article *the*; D has singular/plural errors."

[questions.iw1-079]
explanation = "Mixing tenses, subject–verb agreement errors and missing prepositions are common errors that lower the score. Using *increase* correctly as both a noun and a verb earns credit; the passive is the right choice for a manufacturing process."

[questions.iw1-080]
explanation = "Option A states the main trend of the line graph and the key feature of the pie chart without using numbers. B repeats figures; C just restates the task; D gives advice beyond the data."

[questions.iw1-081]
explanation = "Checklist: (1) Task Achievement: keeps all the figures and removes the cause *because phone is cheap*; (2) Coherence: compares the two groups with *by contrast*; (3) Lexical: *rose steadily, continued to climb, from a much lower base*; (4) Grammar: fixes verb forms (*go → rose*, *was → rose*) and adds the participle phrases *reaching…, ending…*."

[questions.iw1-082]
explanation = "The weaknesses are in Lexical Resource and Grammatical Range, so varying the trend vocabulary and adding complex sentences will raise the score. Adding numbers usually leads to listing, personal opinions are penalised, and a longer report does not automatically score higher."
