[questions.go-dv014]
prompt = "In an interview, describe how you would test a parser that accepts valid, boundary, and invalid inputs; when would you use a benchmark or fuzzing?"
keywords = [["table-driven"], ["subtest", "t.run"], ["edge case", "boundary case", "invalid input"], ["deterministic", "stable", "repeatable"], ["benchmark", "b.n"], ["fuzz", "fuzzing", "f.add"]]
model_answer = '''
I would create table-driven cases containing inputs and expected results, then run each case as a subtest so a failure identifies the scenario. In addition to valid inputs, I would cover empty strings, boundary values, malformed formats, and overflow. Tests should be deterministic and should not depend on the network or timing. To compare execution cost, I would write a benchmark that loops over `b.N`; for a parser with a broad input space, I would seed fuzzing with `f.Add` and check invariants to find panics or invalid results.
'''
explanation = "A good answer describes a testing strategy and boundary cases, and distinguishes the purpose of benchmarks from fuzzing."

[questions.go-dvc02]
title = "Parse and validate a port"
