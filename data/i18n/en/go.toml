Implement `ParsePort(input string) (int, bool)`:
- Trim whitespace from both ends.
- Accept only one or more ASCII decimal digits; reject `+`, `-`, decimal points, and the empty string.
- The value must be in the inclusive range 1 through 65535.
- For valid input, return the integer and `true`; for invalid input or overflow, return `0, false`.

For example, `" 8080 "` returns `8080, true`; `"0"` and `"80x"` are invalid.
'''
hints = ["After `strings.TrimSpace`, check that every byte is between `'0'` and `'9'`.", "Use `strconv.Atoi` to detect overflow, then check the port range."]
explanation = "A small, pure function with clearly defined boundary inputs is a good fit for table-driven unit tests."

[modules.go-dv-io]
title = "I/O, buffering & file handling"
description = "`io.Reader`/`Writer`, streaming, `bufio.Scanner`, file lifecycle, and read errors."
lesson = '''
### Read as a stream
The small `io.Reader` and `io.Writer` interfaces let functions work with files, memory buffers, networks, or test doubles without depending on a particular source. `Read(p)` returns the number of bytes read along with an error; process the `n` bytes before handling `err`, because a call can return valid data and `io.EOF` together. Never assume one `Read` fills the buffer.

| API | How to use it | Trade-off |
|---|---|---|
| `os.ReadFile` / `io.ReadAll` | Load the entire input into memory | Simple, but unsuitable for large or unbounded data |
| `io.Copy(dst, src)` | Transfer data sequentially between streams | Low memory use; suitable for large files |
| `bufio.Scanner` | Split input into lines or tokens | Convenient, with a token-size limit that may need configuration |
| `bufio.Reader` | Read chunks, peek, or control delimiters | More flexible, but requires careful EOF handling |

For line-by-line reading, open the file with `os.Open`, defer `Close`, create a `bufio.Scanner`, and loop over `Scan`. After the loop, check `scanner.Err()`. If a line may exceed the default limit, configure `scanner.Buffer` with an appropriate maximum; input beyond that limit is still an error. `ScanLines` removes newlines and the carriage return before a newline, preserves empty lines, and returns a final line even when it has no trailing newline.

Choose `ReadFile` for small configuration files with a known size. For uploads or large logs, stream the data or limit it with `io.LimitReader`. Common mistakes include ignoring the final Scanner error, calling `ReadAll` on untrusted unbounded input and exhausting memory, failing to close a file, or assuming `io.EOF` always means that a read returned no data.
'''

[questions.go-dv015]
prompt = "A call to `Read(p)` returns `n > 0` together with `io.EOF`. What should the caller do?"
options = ["Discard `p[:n]` because EOF always means no data was returned", "Process `p[:n]` first, then handle EOF", "Call `Read` again until `n == len(p)` without checking errors", "Turn EOF into a panic"]
explanation = "The `io.Reader` interface allows data and an end-of-stream error to be returned together. The bytes read must still be consumed."

[questions.go-dv016]
prompt = "You need to copy a large file from `src io.Reader` to `dst io.Writer` without loading the whole file into RAM. Which API is appropriate?"
options = ["`io.Copy(dst, src)`", "Call `io.ReadAll(src)` and keep the byte slice", "Call `os.ReadFile` with a path that does not exist", "Use `bufio.Scanner` regardless of the data format"]
explanation = "`io.Copy` transfers data as a stream; `ReadAll` keeps all bytes in memory."

[questions.go-dv017]
prompt = "`bufio.Scanner` stops before reading a very long line. What is the appropriate response?"
options = ["Ignore `scanner.Err()`", "Increase the buffer and set an appropriate token limit with `scanner.Buffer`, while still checking `Err`", "Call `Scan` once more to remove the limit", "Use `io.ReadAll` for every unbounded input"]
explanation = "Scanner limits token size. Raise the limit deliberately or use `bufio.Reader` when you need more control over long lines."

[questions.go-dv018]
prompt = "Choose the correct practices for reading a file line by line in Go."
options = ["Close the file with `defer file.Close()` after it opens successfully", "Check `scanner.Err()` after the `Scan` loop", "Assume `Read` always fills the buffer", "Increase Scanner's limit if valid lines may exceed the default", "Use `io.ReadAll` on an unbounded client body"]
explanation = "Close the file, check Scanner's final error, and adjust the token limit to fit the data. `Read` may return fewer bytes than the buffer can hold; unbounded input should not all be loaded into memory."

[questions.go-dv019]
prompt = '''
Stream data from a reader to a writer:

```go
n, err := io.{{blank}}(dst, src)
```
'''
explanation = "`io.Copy` returns the number of bytes written and an error if the stream transfer fails."

[questions.go-dv020]
prompt = '''
After the `for scanner.Scan()` loop, get the final read error with:

```go
if err := scanner.{{blank}}(); err != nil {
    return err
}
```
'''
explanation = "`Scan` returns false both at end of input and on an error; `Err` distinguishes the error case."

[questions.go-dv021]
prompt = "In an interview, choose between `os.ReadFile`, `io.Copy`, `bufio.Scanner`, and `bufio.Reader` for different kinds of input; explain how to handle EOF and errors."
keywords = [["readfile", "readall", "entire contents in memory", "full contents in memory"], ["io.copy", "stream"], ["scanner", "buffer", "token limit"], ["reader", "delimiter"], ["eof", "io.eof", "process returned bytes"], ["error", "scanner.err", "close the file", "close"]]
model_answer = '''
`os.ReadFile` or `io.ReadAll` is convenient for small input with a known limit, but keeps the entire contents in memory. `io.Copy` is a good fit for large files because it streams between a `Reader` and a `Writer`. `bufio.Scanner` is convenient for lines or tokens; raise its buffer limit if valid tokens are long. Use `bufio.Reader` when you need delimiter control or incremental reads. With `Read`, process the returned bytes even when the error is `io.EOF`; after a Scan loop, check `scanner.Err`. Close each file you open.
'''
explanation = "Choose based on input size, how it should be split, and memory limits; do not ignore the final stream error."

[questions.go-dvc03]
title = "Read lines from an `io.Reader`"
prompt = '''
Implement `ReadLines(r io.Reader) ([]string, error)` using the standard library:
- Split lines using `bufio.Scanner` rules: preserve empty lines, remove `\n` and the `\r` in CRLF, and keep a final line without a newline.
- Empty input returns an empty slice and a `nil` error.
- Support lines up to 1 MiB; if the reader fails or a line exceeds the limit, return `nil, error`.
- Do not close `r`; this function does not own the reader.
'''
hints = ["Use `bufio.Scanner` and configure its maximum buffer size to 1 MiB.", "Always check `scanner.Err()` after `Scan` finishes."]
explanation = "This function processes a stream borrowed from the caller, follows explicit line rules, and returns read errors instead of silently dropping data."

[modules.go-lead]
title = "Tech Lead Perspective"
description = "Project layout & interface boundaries, error-handling conventions, logging/observability, production profiling, team concurrency strategy, Go code review, upgrading versions & dependencies."
lesson = '''
### The Tech Lead's role in a Go codebase
Go deliberately has little "magic": no mandatory DI framework, no exceptions, no inheritance. So codebase quality depends heavily on **team conventions**. A lead does not need to write the hardest code, but must help 5–10 people write code that is **consistent, readable and easy to operate**.

### Decision framework
1. **State the constraints**: headcount, deadline, SLOs, infrastructure cost, the team's Go experience.
2. **List 2–3 options** and compare them on fixed criteria (complexity, operational risk, reversibility).
3. **Pick the simplest option that meets the constraints**, record it in a short ADR, and set a review point (e.g. when traffic grows 5x).

### Comparison: package organization
| Option | Pros | Cons | Fits when |
|---|---|---|---|
| Flat (`main` + a few files) | Fast, little ceremony | Messy past ~5k lines | CLIs, PoCs, small services |
| By layer (`handler/`, `service/`, `repo/`) | Familiar | One feature touches many packages, import cycles are easy | Teams coming from Java/.NET, simple domains |
| By domain (`order/`, `billing/`) + `internal/` | Clear boundaries, easy to split into services later | Needs discipline about where interfaces live | Long-lived services, many people editing |

Principle: **declare interfaces on the consumer side**, keep them small (1–3 methods); return concrete structs ("accept interfaces, return structs"). Use `internal/` to stop other packages importing by mistake.

### Team error-handling conventions
- Always wrap errors with `%w` plus the operation context (`"load order %d: %w"`); do not log and then return (duplicate logs).
- Export sentinels/error types only when callers **really need to branch**; everything else stays opaque.
- Map domain errors → HTTP status in **one place** (the transport layer), not `http.Error` scattered across services.
- Panic only for programmer errors; a recover middleware at the edge keeps one bad request from crashing the process.

### Observability & production profiling
- Structured logs with `log/slog`, attach a `request_id` through context; RED metrics (rate, errors, duration) per endpoint.
- Enable `net/http/pprof` on a **separate internal port**, never exposed to the internet; grab CPU/heap/goroutine profiles during incidents instead of guessing.
- Set `GOMEMLIMIT` (or `debug.SetMemoryLimit`) below the container limit (roughly ~90%) so the GC works earlier instead of getting OOM-killed.
- A goroutine count that grows steadily over time is almost always a **goroutine leak** — alert on this metric.

### Go code review checklist
- [ ] Does every goroutine have a way to finish (context, closed channel, WaitGroup)?
- [ ] Does I/O take `context.Context` as the first parameter, with timeouts on HTTP/DB clients?
- [ ] Are errors checked, wrapped with context, and important `rows.Err()`/`Close()` not swallowed?
- [ ] Are shared maps/slices locked or owned by a single goroutine?
- [ ] Do tests run with `-race` in CI?
- [ ] Is a new interface really needed (≥ 2 implementations or a fake for tests)?

### Sample ADR (abridged)
> **ADR-007: Use bounded `errgroup`-style fan-out for downstream calls.** Context: the endpoint calls 4 services, p99 1.2s. Decision: call in parallel, limit 4, cancel the whole group on one error, 800ms total timeout. Consequences: estimated p99 ~400ms; downstream load spikes → they need rate limiting. Revisit when a 6th service is added.

### Team-scale anti-patterns
- A bloated `utils`/`common` package that everything imports → import cycles, hard to split.
- "Giant" interfaces predefined for every struct "for mocking" → hard to change, pointless.
- Scattered `go func()` with no lifecycle management; `context.Background()` deep inside a request.
- Writing an in-house framework (router, DI, ORM) when the standard library is enough — the maintenance cost lands on the team.
- Bulk Go/dependency upgrades with no `-race` CI and no reading of release notes (e.g. the loop variable semantics change in Go 1.22).
'''

[questions.go-lv001]
prompt = '''
A 6-person team has a ~25k-line Go service organized by layer (`handlers/`, `services/`, `repos/`). Every new feature touches all three packages and import cycles are frequent. The 6-month roadmap may split `billing` into its own service. What is the most sensible reorganization?
'''
options = ["Gradually move to domain packages (`order/`, `billing/`, `user/`) under `internal/`, each domain containing its own handler/service/repo; do one domain at a time, starting with `billing`", "Merge everything into a single `app` package to eliminate import cycles", "Create a `common` package holding all shared interfaces and models for every layer to import", "Rewrite the whole service as microservices this quarter"]
explanation = "Domain packages reduce the number of packages each feature touches and create a ready-made boundary for splitting out `billing`; doing it gradually keeps risk low. A single package erases all boundaries. A `common` package usually becomes something everything depends on, bloats and still causes coupling. A full microservices rewrite is the riskiest option for a 6-person team."

[questions.go-lv002]
prompt = '''
In review, a developer proposes predefining a 14-method `UserRepository` interface in the `repo` package, with auto-generated mocks, "so we can swap the database later". There is only one Postgres implementation and services use only 1–3 methods. What is the lead's best response?
'''
options = ["Suggest each service declare a small interface on the consumer side with only the methods it needs; the `repo` package returns a concrete struct", "Agree — the more complete the interface, the better for the future", "Drop interfaces entirely and test services against a real database in every case", "Switch to a DI framework that generates interfaces for every struct"]
explanation = "Go interfaces are satisfied implicitly, so they can be declared on the consumer side, small and fit for purpose — easy to fake in tests and not locking every change into a 14-method interface. A big interface \"for the future\" is YAGNI and makes every signature change expensive. Dropping interfaces entirely makes unit tests slow/hard; a DI framework adds unnecessary complexity."

[questions.go-lv003]
prompt = '''
A Go service in a 1 GiB container is occasionally OOM-killed at peak traffic, while the measured "live" heap is only ~400 MiB. A low-risk fix is needed this week. What should be done first?
'''
options = ["Set `GOMEMLIMIT` to about 900MiB (below the container limit) so the GC runs earlier near the ceiling, then watch GC CPU and heap profiles", "Raise the container limit to 4 GiB and move on", "Set `GOGC=off` to disable the GC and save CPU", "Rewrite hot paths with `unsafe` to avoid allocations"]
explanation = "With a live heap well below the limit, OOMs usually happen because the GC lets the heap grow to twice the live size before collecting. A memory limit (Go 1.19+) tells the GC to respect a soft ceiling — a config change that is easy to revert. Quadrupling RAM is costly and hides the problem. An unbounded `GOGC=off` makes OOMs happen sooner. `unsafe` is high-risk and not a first step."

[questions.go-lv004]
prompt = '''
p99 latency of a Go API rose from 80ms to 600ms after a release, only in production. The team wants to enable `net/http/pprof` to investigate. What is the most appropriate deployment?
'''
options = ["Register pprof on a separate `http.Server` listening on an internal port (e.g. `127.0.0.1:6060` or cluster-only), and take a 30s CPU profile under load", "Import `net/http/pprof` into the public mux so anyone can grab profiles quickly", "Do not use pprof in production; only benchmark on a laptop", "Enable pprof by raising the log level to debug for all requests"]
explanation = "pprof gives real data instead of guesses; the cost of a short CPU profile is acceptable. But pprof endpoints leak internal information and can be abused, so they must be on an internal port. Local benchmarks miss production conditions. Debug logs cannot measure CPU/lock time."

[questions.go-lv005]
prompt = '''
You are drafting error-handling conventions for the team (8 devs, 3 Go services). Choose the conventions to include.
'''
options = ["Wrap errors with `%w` plus operation context when returning them upward", "Map domain errors to HTTP status in one place in the transport layer", "Every layer logs the error and returns it, to be sure nothing is missed", "Export sentinels/error types only when callers need to branch on them", "Use `panic` for input validation errors to keep code shorter"]
explanation = "Wrapping with `%w` preserves the error chain for `errors.Is/As`; centralized status mapping avoids inconsistency; exporting errors only when needed keeps the API small. Logging at every layer logs one error many times — log once at the edge. Panicking on input errors is misuse; panic is for programmer errors."

[questions.go-lv006]
prompt = '''
The `GET /dashboard` endpoint calls 5 internal services sequentially (~150ms each), p99 ~1s, and the SLO is 400ms. The downstream services have load limits. What is the most sensible approach?
'''
options = ["Call in parallel with a concurrency limit, use one context with a total deadline of ~350ms, cancel remaining calls when a required call fails; optional parts return empty when the deadline passes", "Start one goroutine per call, with no timeout, and wait for all of them", "Cache the whole dashboard for 24 hours", "Triple the number of dashboard service replicas"]
explanation = "Parallelizing brings latency down to roughly the slowest call; a total deadline secures the SLO, early cancellation avoids waste, and degrading optional parts preserves the experience. Without a timeout one slow service drags the whole request. A 24h cache serves wrong data. More replicas do not reduce sequential latency."

[questions.go-lv007]
prompt = '''
The team is on Go 1.20 and wants Go 1.22+ for the new `ServeMux` route patterns. The codebase has many `for _, v := range xs { go func() { use(v) }() }`. What is the most sensible upgrade plan?
'''
options = ["Bump the `go` line in go.mod module by module, run the full test suite with `-race` in CI, read the release notes (especially the loop variable semantics change), canary one service first", "Upgrade all services at once on a Friday to make the sprint", "Stay on Go 1.20 forever because upgrades are always risky", "Upgrade but disable race tests to go faster"]
explanation = "Go 1.22 creates a new loop variable per iteration — usually fixing bugs, but it can change behavior of code relying on the old semantics; upgrading per module + race CI + canary limits the blast radius. A Friday big-bang raises risk. Staying on an old version misses security fixes. Disabling race drops the most important safety net."

[questions.go-lv008]
prompt = '''
The team's three Go services each log differently (`log.Printf`, free-form strings); during incidents it takes 30 minutes to stitch together one request's logs. Budget: 1 sprint, no new infrastructure beyond the existing log system. What is the best choice?
'''
options = ["Standardize on `log/slog` with a JSON handler, a middleware that generates/accepts a `request_id` and attaches it to the context, and shared field-name conventions", "Immediately roll out full distributed tracing for every service", "Raise the log level to debug in all services", "Ask devs to write more detailed logs with `fmt.Println`"]
explanation = "`log/slog` is in the standard library; structured logs + request_id solve exactly the stitching problem, fit in 1 sprint and need no new infrastructure. Full tracing is good but exceeds the constraints. Debug logs increase volume and remain hard to correlate. `fmt.Println` is unstructured."

[questions.go-lv009]
prompt = '''
Choose the items that belong in the team's Go PR review checklist (prioritizing bugs that cause production incidents).
'''
options = ["Every new goroutine has a clear way to finish (context, closed channel, WaitGroup)", "HTTP client/DB calls have a timeout or take the request context", "Every variable name must be at least 8 characters long", "Tests run with `-race` in CI", "Every struct must have a matching interface"]
explanation = "Goroutine leaks, missing timeouts and data races are three common sources of production incidents in Go services. A variable-length rule goes against Go style (short names in narrow scopes). Mandatory interfaces for every struct create needless abstraction."

[questions.go-lv010]
prompt = '''
A developer wants to add a large ORM/web framework (pulling ~60 indirect dependencies) to a 12-endpoint CRUD service. The team uses `net/http` + `database/sql` and things run fine. What is the most sensible decision?
'''
options = ["Keep the standard library, possibly adding a small focused library (e.g. query code generation) if there is a measured pain point; every new dependency needs a reason, an owner, and `govulncheck` in CI", "Agree right away because big frameworks always make code faster", "Ban every dependency outside the standard library", "Fork the framework into the repo to patch it when needed"]
explanation = "For 12 endpoints the standard library is enough; a large dependency grows the supply-chain surface and upgrade cost. A balanced approach adds dependencies with a reason, an owner and vulnerability scanning. A total ban is extreme; forking makes the team maintain all of it."

[questions.go-lv011]
prompt = '''
A Go service runs on Kubernetes and each deploy produces ~0.5% 502 errors. Investigation shows the process exits immediately on SIGTERM. What is the most sensible fix?
'''
options = ["Catch SIGTERM with `signal.NotifyContext`, switch readiness to failing, wait briefly for the load balancer to update, then `Server.Shutdown(ctx)` with a timeout shorter than `terminationGracePeriodSeconds`", "Add replicas so the error rate is spread thinner", "Ignore SIGTERM entirely and let Kubernetes SIGKILL", "Add infinite client retries for every request"]
explanation = "Graceful shutdown in the right order: stop accepting new traffic (readiness), let in-flight requests finish within a deadline, then exit — eliminating 502s during deploys. More replicas do not fix the cause. Ignoring SIGTERM cuts requests off at SIGKILL. Infinite retries can duplicate non-idempotent operations."

[questions.go-lv012]
prompt = '''
CI for a Go monorepo takes 25 minutes; 70% of that is integration tests spinning up Postgres for every package. Developers have started ignoring CI. Goal: under 10 minutes within 2 sprints. What is the best choice?
'''
options = ["Separate unit tests (fakes via small interfaces) that run on every PR; integration tests share one DB per job, isolated by transaction/separate schema, run only for affected packages and fully on the main branch", "Delete the integration tests", "Run CI only at night", "Buy CI machines 4x more powerful and keep testing the same way"]
explanation = "Cutting DB setup cost and running tests selectively shortens time dramatically while keeping the safety net on the main branch. Deleting tests loses integration bug detection. Nightly CI delays feedback by a day. Faster machines only give linear gains at a cost."

[questions.go-lv013]
prompt = '''
A junior developer proposes using `sync.Pool`, `unsafe` and hand-managed buffers throughout the service to "optimize performance", without any profile, while the service meets its SLO at ~30% CPU. What is the best response?
'''
options = ["Not now; first require a benchmark/profile showing a hotspot, prefer readable code; if a real hotspot exists, optimize locally with before/after benchmarks", "Agree to apply it all, since early optimization is never wasted", "Refuse and ban `sync.Pool` in all cases", "Rewrite the service in Rust"]
explanation = "When the SLO is met and CPU is low, data-free optimization adds complexity and risk (unsafe, buffer-reuse bugs) with no measurable benefit. The right process is to measure first and optimize locally with evidence. A total ban is extreme; a rewrite in another language has no basis."

[questions.go-lv014]
prompt = '''
A cleanup function runs several steps and the team convention is to **combine all errors** (not just the first) so callers can still use `errors.Is` on each one:

```go
var errs []error
for _, c := range closers {
	if err := c.Close(); err != nil {
		errs = append(errs, err)
	}
}
return errors.{{blank}}(errs...)
```
'''
explanation = "`errors.Join` (Go 1.20) combines multiple errors, returns `nil` if there are none, and supports `errors.Is/As` on each wrapped error — a good convention for cleanup operations."

[questions.go-lv015]
prompt = '''
After sending the response, a handler must write an audit log asynchronously. Team convention: keep the context values (request_id) but **do not get cancelled** when the request ends:

```go
auditCtx := context.{{blank}}(r.Context())
go audit.Write(auditCtx, event)
```
'''
explanation = "`context.WithoutCancel` (Go 1.21) keeps values but does not propagate the parent's cancellation/deadline. `context.Background()` would lose the request_id; using `r.Context()` directly cancels the audit when the request finishes. You should still set a separate timeout for the write."

[questions.go-lv016]
prompt = '''
You lead a 5-person team about to start a new Go service (REST API + Postgres + background job worker) expected to live for years. Write a short ADR on **project layout and package boundaries**: options considered, decision, consequences and revisit conditions.
'''
keywords = [["internal", "internal/"], ["domain", "by feature", "feature"], ["interface"], ["cmd", "cmd/"], ["trade-off", "tradeoff", "consequence", "downside", "drawback"], ["test"]]
model_answer = '''
**ADR-001: Domain-based service layout.**

- **Context**: 5 devs, API + worker share logic, long-lived, may split into services later.
- **Options**: (1) flat single package — fast but messy as it grows; (2) by layer `handler/service/repo` — familiar but each feature touches many packages and import cycles are easy; (3) by domain.
- **Decision**: choose (3). `cmd/api` and `cmd/worker` are two thin binaries; logic lives in `internal/order`, `internal/billing`… so outside packages cannot import it. Each domain contains its own handler, service and store. Small interfaces are declared on the consumer side; constructors return concrete structs. Dependency wiring is done by hand in `main`.
- **Consequences / trade-offs**: clear boundaries, easy to split a domain into a service; the downside is the discipline needed not to reach into another domain's internals — only through its exported API. Unit tests use fakes via interfaces, integration tests cover the store with a real DB.
- **Revisit** when there are more than 10 domains or when a domain needs independent deployment.
'''
explanation = "A good ADR states context, options and trade-offs, a concrete decision (cmd/, internal/, consumer-side interfaces), a testing strategy and revisit conditions."

[questions.go-lv017]
prompt = '''
A production Go service's goroutine count grows steadily from 2k to 80k over 3 days, memory grows with it, and it eventually restarts. Present the lead's plan: investigation, short-term mitigation, root-cause fix and prevention measures for the whole team.
'''
keywords = [["pprof", "goroutine profile", "profile"], ["leak"], ["context", "timeout", "deadline"], ["metric", "alert", "dashboard"], ["postmortem", "post-mortem"], ["test", "goleak"]]
model_answer = '''
**Investigate**: grab a goroutine profile from the internal pprof endpoint (`debug=2` to see stacks) and group by stack — usually a few locations account for most of them, e.g. goroutines stuck sending to a channel nobody reads or waiting on an HTTP call with no timeout. Correlate when the growth started with releases.

**Short term**: roll back the suspect release or temporarily restart periodically, and set up an alert so it is no longer a surprise.

**Root-cause fix**: make sure every goroutine has an exit path — pass a context with a timeout/deadline into downstream calls, use `select` with `ctx.Done()` when sending/receiving on channels, use buffered channels for results the receiver may abandon. This is a classic goroutine leak.

**Prevention**: a goroutine-count metric + alert on linear growth; a review checklist item "every goroutine has a way to finish"; leak tests (count goroutines before/after or use a library like goleak); write a blameless postmortem and share it with the team.
'''
