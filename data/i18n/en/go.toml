explanation = "A benchmark uses a loop such as `for i := 0; i < b.N; i++` so the framework can calibrate the measurement duration."

[questions.go-dv011]
prompt = "Choose the practices that make Go tests easier to maintain and more reliable."
options = ["Put multiple inputs and expected results in a table, and name each case with `t.Run`", "Use `t.Cleanup` to register resource cleanup", "Use a long `time.Sleep` to synchronize every goroutine", "Use `t.TempDir` when a file test needs a temporary directory", "Make every test use the same fixed file in the working directory"]
explanation = "Table-driven subtests make cases clear, while cleanup and temporary directories isolate resources. Sleeps and shared files make tests flaky and prone to collisions."

