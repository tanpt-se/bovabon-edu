[questions.go-lv036]
prompt = '''
Senior interview: explain how `context.Context` propagates cancellation and deadlines through a call chain (HTTP handler → service → DB/HTTP client). State the rules for using context correctly and common mistakes.
'''
keywords = [["first parameter", "first argument"], ["ctx.done", "done()"], ["cancel"], ["deadline", "timeout"], ["struct"], ["value", "withvalue"]]
model_answer = '''
Contexts form a tree: `r.Context()` is the request's root, and each `WithTimeout`/`WithCancel` creates a child. When a parent is cancelled (client disconnects, server shuts down) or its deadline passes, the signal propagates to every child; code waiting on I/O listens on `ctx.Done()` and returns `ctx.Err()`. Standard libraries such as `database/sql` (`QueryContext`) and `http.NewRequestWithContext` honor this context.

Rules: pass ctx as the first parameter, do not store it in a struct; always `defer cancel()` after `WithTimeout` to release the timer; child timeouts should be shorter than the parent deadline; `WithValue` is only for request-scoped data (request_id, user) with a private key type, not for passing optional parameters.

Common mistakes: using `context.Background()` deep inside a request so cancellation is lost; forgetting `cancel`, leaking timers; loops/goroutines that never check `ctx.Done()` and keep running after the request ends; treating `context.Canceled` as an ordinary error and logging noisily.
'''
explanation = "The answer should cover the context tree, propagation of cancellation/deadlines, the rules (first parameter, not stored in structs, defer cancel, limited WithValue) and common mistakes."

