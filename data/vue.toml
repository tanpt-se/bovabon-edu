[[questions]]
id = "vue-012"
module = "vue-reactivity"
type = "code"
difficulty = 3
title = "Mini reactivity với computed lazy"
prompt = '''
Viết `createMiniReactivity()` trả về `{ ref, computed, effect }` bằng JavaScript thuần.
- `ref(value)` trả object có `.value`; khi giá trị đổi, các effect phụ thuộc được chạy lại.
- `computed(getter)` trả object có `.value`; getter chỉ chạy khi cần, cache kết quả, và đánh dấu dirty khi dependency đổi.
- `effect(fn)` chạy `fn` ngay, tự track các ref/computed được đọc, chạy lại khi chúng đổi và trả về runner có thể gọi thủ công.
- Chỉ cần hỗ trợ dependency đồng bộ và giá trị scalar; không cần scheduler hay `stop`.
'''
starter = '''
function createMiniReactivity() {
  function ref(value) { return { value }; }
  function computed(getter) { return { get value() { return getter(); } }; }
  function effect(fn) { fn(); return fn; }
  return { ref, computed, effect };
}
'''
solution = '''
function createMiniReactivity() {
  let activeEffect = null;
  function cleanup(runner) {
    for (const dep of runner.deps) dep.delete(runner);
    runner.deps.clear();
  }
  function track(dep) {
    if (!activeEffect) return;
    dep.add(activeEffect);
    activeEffect.deps.add(dep);
  }
  function trigger(dep) {
    for (const runner of Array.from(dep)) {
      if (runner !== activeEffect) {
        if (runner.scheduler) runner.scheduler();
        else runner();
      }
    }
  }
  function makeEffect(fn, scheduler, lazy) {
    const runner = function () {
      if (runner.running) return;
      cleanup(runner);
      const previous = activeEffect;
      activeEffect = runner;
      runner.running = true;
      try { return fn(); }
      finally { runner.running = false; activeEffect = previous; }
    };
    runner.deps = new Set();
    runner.scheduler = scheduler;
    runner.running = false;
    if (!lazy) runner();
    return runner;
  }
  function ref(initialValue) {
    let value = initialValue;
    const dep = new Set();
    return {
      get value() { track(dep); return value; },
      set value(next) {
        if (Object.is(value, next)) return;
        value = next;
        trigger(dep);
      }
    };
  }
  function computed(getter) {
    let dirty = true;
    let value;
    const dep = new Set();
    const runner = makeEffect(getter, () => {
      if (!dirty) { dirty = true; trigger(dep); }
    }, true);
    return {
      get value() {
        track(dep);
        if (dirty) { value = runner(); dirty = false; }
        return value;
      }
    };
  }
  function effect(fn) { return makeEffect(fn, null, false); }
  return { ref, computed, effect };
}
'''
tests = '''
test('effect chạy lần đầu và theo dõi ref', () => {
  const api = createMiniReactivity();
  const count = api.ref(1);
  const seen = [];
  api.effect(() => seen.push(count.value));
  count.value = 2;
  expect(seen).toEqual([1, 2]);
});
test('computed chạy lazy và cache', () => {
  const api = createMiniReactivity();
  const count = api.ref(2);
  let calls = 0;
  const doubled = api.computed(() => { calls++; return count.value * 2; });
  expect(calls).toBe(0);
  expect(doubled.value).toBe(4);
  expect(doubled.value).toBe(4);
  expect(calls).toBe(1);
});
test('computed invalidation tính giá trị mới khi đọc', () => {
  const api = createMiniReactivity();
  const count = api.ref(2);
  const doubled = api.computed(() => count.value * 2);
  expect(doubled.value).toBe(4);
  count.value = 3;
  expect(doubled.value).toBe(6);
});
test('effect theo dõi computed và chạy lại khi nguồn đổi', () => {
  const api = createMiniReactivity();
  const count = api.ref(2);
  const doubled = api.computed(() => count.value * 2);
  const seen = [];
  api.effect(() => seen.push(doubled.value));
  count.value = 4;
  expect(seen).toEqual([4, 8]);
});
test('runner có thể gọi thủ công và bằng nhau không kích hoạt effect', () => {
  const api = createMiniReactivity();
  const count = api.ref(1);
  let calls = 0;
  const run = api.effect(() => { count.value; calls++; });
  count.value = 1;
  run();
  expect(calls).toBe(2);
});
'''
hints = ["Mỗi dependency có thể lưu tập runner; runner cần nhớ và gỡ dependency cũ trước khi chạy lại.", "Computed cần một effect nội bộ lazy với scheduler chỉ đánh dấu dirty và thông báo cho consumer."]
explanation = "Bài tập mô phỏng lõi dependency tracking: đọc để đăng ký, ghi để trigger, computed cache kết quả và chỉ invalidation khi dependency đổi."
sources = ["vue~3/api/reactivity-core#ref", "vue~3/api/reactivity-core#computed", "vue~3/api/reactivity-core#watch"]

[[questions]]
id = "vue-013"
module = "vue-reactivity"
type = "code"
difficulty = 3
title = "Watch với cleanup"
prompt = '''
Viết `createSignal(initialValue)` và `watch(source, callback)` để mô phỏng watcher đồng bộ trên một nguồn đơn.
- Signal có thuộc tính `.value`, setter chỉ phát thông báo khi giá trị đổi theo `Object.is`, và phương thức `subscribe(listener)` trả hàm unsubscribe.
- `watch` không gọi callback lúc khởi tạo. Mỗi lần nguồn đổi, gọi `callback(newValue, oldValue, onCleanup)`.
- Cleanup được đăng ký trong callback phải chạy trước callback kế tiếp và khi hàm stop được gọi. Stop nhiều lần không được chạy cleanup lặp.
- `watch` trả hàm stop; callback có thể đăng ký một cleanup cho mỗi lượt chạy.
'''
starter = '''
function createSignal(initialValue) {
  return { value: initialValue, subscribe() { return () => {}; } };
}
function watch(source, callback) {
  return function stop() {};
}
'''
solution = '''
function createSignal(initialValue) {
  let value = initialValue;
  const listeners = new Set();
  return {
    get value() { return value; },
    set value(next) {
      if (Object.is(value, next)) return;
      const previous = value;
      value = next;
      for (const listener of Array.from(listeners)) listener(next, previous);
    },
    subscribe(listener) {
      listeners.add(listener);
      return () => listeners.delete(listener);
    }
  };
}
function watch(source, callback) {
  let oldValue = source.value;
  let cleanup = null;
  let stopped = false;
  const unsubscribe = source.subscribe((newValue) => {
    if (stopped) return;
    if (cleanup) { const previousCleanup = cleanup; cleanup = null; previousCleanup(); }
    const previousValue = oldValue;
    oldValue = newValue;
    callback(newValue, previousValue, (fn) => {
      if (typeof fn === 'function') cleanup = fn;
    });
  });
  return function stop() {
    if (stopped) return;
    stopped = true;
    unsubscribe();
    if (cleanup) { const previousCleanup = cleanup; cleanup = null; previousCleanup(); }
  };
}
'''
tests = '''
test('watch nhận giá trị mới và cũ nhưng không chạy ngay', () => {
  const source = createSignal(1);
  const seen = [];
  watch(source, (next, old) => seen.push([next, old]));
  expect(seen).toEqual([]);
  source.value = 3;
  expect(seen).toEqual([[3, 1]]);
});
test('cleanup cũ chạy trước callback tiếp theo', () => {
  const source = createSignal('a');
  const events = [];
  watch(source, (next, old, onCleanup) => {
    events.push('watch:' + old + '>' + next);
    onCleanup(() => events.push('cleanup:' + next));
  });
  source.value = 'b';
  source.value = 'c';
  expect(events).toEqual(['watch:a>b', 'cleanup:b', 'watch:b>c']);
});
test('stop chạy cleanup cuối đúng một lần và unsubscribe', () => {
  const source = createSignal(0);
  let cleanups = 0;
  const stop = watch(source, (next, old, onCleanup) => onCleanup(() => cleanups++));
  source.value = 1;
  stop();
  stop();
  source.value = 2;
  expect(cleanups).toBe(1);
});
test('giá trị không đổi không phát thông báo', () => {
  const source = createSignal(NaN);
  let calls = 0;
  watch(source, () => calls++);
  source.value = NaN;
  expect(calls).toBe(0);
});
test('cleanup cũ được xóa trước callback không đăng ký cleanup mới', () => {
  const source = createSignal(0);
  let cleanups = 0;
  const stop = watch(source, (next, old, onCleanup) => {
    if (next === 1) onCleanup(() => cleanups++);
  });
  source.value = 1;
  source.value = 2;
  stop();
  expect(cleanups).toBe(1);
});
'''
hints = ["Signal lưu listener trong Set và phát bản sao tập listener để unsubscribe an toàn khi đang thông báo.", "Cleanup thuộc lượt callback trước; lấy nó ra và xóa tham chiếu trước khi gọi để tránh gọi lặp."]
explanation = "Cleanup giúp hủy tài nguyên của lượt watch cũ, chẳng hạn timer hoặc request, trước khi phản ứng với giá trị mới."
sources = ["vue~3/api/reactivity-core#watch", "vue~3/api/reactivity-core#onwatchercleanup"]

