prompt = '''Viết `createAsyncLoader(load)` trả về hàm `loadOnce()`.
- `load` có thể trả giá trị hoặc Promise.
- Chỉ gọi `load` khi `loadOnce()` được gọi lần đầu; các lời gọi đồng thời phải dùng chung Promise đang chạy.
- Sau khi thành công, lưu kết quả và những lần gọi tiếp theo trả lại kết quả đó mà không gọi lại `load`.
- Nếu `load` lỗi, xóa trạng thái đang chạy để lần gọi sau có thể thử lại; lỗi phải được truyền về caller.
'''
starter = '''function createAsyncLoader(load) {
  return function loadOnce() {
    return Promise.resolve(load());
  };
}
'''
solution = '''function createAsyncLoader(load) {
  let hasValue = false;
  let value;
  let pending = null;
  return function loadOnce() {
    if (hasValue) return Promise.resolve(value);
    if (pending) return pending;
    pending = Promise.resolve().then(load).then(
      (result) => {
        value = result;
        hasValue = true;
        pending = null;
        return result;
      },
      (error) => {
        pending = null;
        throw error;
      }
    );
    return pending;
  };
}
'''
tests = '''test('không tải trước khi được gọi và cache kết quả thành công', async () => {
  let calls = 0;
  const loadOnce = createAsyncLoader(() => { calls++; return 'module'; });
  expect(calls).toBe(0);
  expect(await loadOnce()).toBe('module');
  expect(await loadOnce()).toBe('module');
  expect(calls).toBe(1);
});
test('các caller đồng thời dùng chung Promise', async () => {
  let resolveLoad;
  let calls = 0;
  const loadOnce = createAsyncLoader(() => {
    calls++;
    return new Promise((resolve) => { resolveLoad = resolve; });
  });
  const first = loadOnce();
  const second = loadOnce();
  expect(first).toBe(second);
  expect(calls).toBe(0);
  await Promise.resolve();
  expect(calls).toBe(1);
  resolveLoad('ready');
  expect(await first).toBe('ready');
});
test('lỗi được truyền và lần sau có thể thử lại', async () => {
  let calls = 0;
  const loadOnce = createAsyncLoader(() => {
    calls++;
    if (calls === 1) throw new Error('offline');
    return 'recovered';
  });
  let message = '';
  try { await loadOnce(); } catch (error) { message = error.message; }
  expect(message).toBe('offline');
  expect(await loadOnce()).toBe('recovered');
  expect(calls).toBe(2);
});
test('giá trị thành công null vẫn được cache', async () => {
  let calls = 0;
  const loadOnce = createAsyncLoader(() => { calls++; return null; });
  expect(await loadOnce()).toBeNull();
  expect(await loadOnce()).toBeNull();
  expect(calls).toBe(1);
});
'''
hints = ["Tách trạng thái đã có kết quả khỏi giá trị kết quả, vì `null` vẫn có thể là kết quả hợp lệ.", "Giữ Promise đang chạy; khi reject phải xóa nó để lần gọi kế tiếp thử lại."]
explanation = "Một loader dùng chung tránh tải lặp khi nhiều phần giao diện cùng yêu cầu module; lỗi không nên bị cache vĩnh viễn."
sources = ["vue~3/guide/components/async"]

