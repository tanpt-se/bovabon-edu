[[questions]]
id = "vue-019"
module = "vue-components"
type = "code"
difficulty = 2
title = "Mô phỏng emit và v-model"
prompt = '''
Viết `createModelBinding(initialValue)` mô phỏng component cha nối `v-model` với component con.
- Trả object gồm `props`, `emit`, `emitted` và getter `value`.
- `props.modelValue` luôn phản ánh giá trị hiện tại của cha.
- Chỉ event `update:modelValue` được chấp nhận; event này ghi lại `{ event, payload }`, cập nhật giá trị cha và trả `true`.
- Event khác không đổi state, không ghi vào `emitted` và trả `false`.
'''
starter = '''
function createModelBinding(initialValue) {
  return { props: { modelValue: initialValue }, emit() { return false; }, emitted: [], value: initialValue };
}
'''
solution = '''
function createModelBinding(initialValue) {
  let current = initialValue;
  const emitted = [];
  const props = { get modelValue() { return current; } };
  function emit(event, payload) {
    if (event !== 'update:modelValue') return false;
    emitted.push({ event, payload });
    current = payload;
    return true;
  }
  return { props, emit, emitted, get value() { return current; } };
}
'''
tests = '''
test('prop ban đầu và giá trị binding giống nhau', () => {
  const binding = createModelBinding('hello');
  expect(binding.props.modelValue).toBe('hello');
  expect(binding.value).toBe('hello');
});
test('emit update:modelValue cập nhật prop và state cha', () => {
  const binding = createModelBinding(1);
  expect(binding.emit('update:modelValue', 2)).toBe(true);
  expect(binding.props.modelValue).toBe(2);
  expect(binding.value).toBe(2);
});
test('event cập nhật được ghi lại theo thứ tự', () => {
  const binding = createModelBinding('a');
  binding.emit('update:modelValue', 'b');
  expect(binding.emitted).toEqual([{ event: 'update:modelValue', payload: 'b' }]);
});
test('event không được khai báo bị từ chối và không đổi state', () => {
  const binding = createModelBinding(3);
  expect(binding.emit('save', 4)).toBe(false);
  expect(binding.value).toBe(3);
  expect(binding.emitted).toEqual([]);
});
test('binding hỗ trợ mọi kiểu payload JavaScript', () => {
  const value = { id: 7 };
  const binding = createModelBinding(null);
  binding.emit('update:modelValue', value);
  expect(binding.props.modelValue).toBe(value);
});
'''
hints = ["Dùng biến đóng để giữ state cha; prop có thể là getter đọc biến đó.", "Kiểm tra tên event trước khi ghi nhận payload."]
explanation = "Bài tập biểu diễn hợp đồng mặc định của `v-model`: prop `modelValue` và event `update:modelValue`."
sources = ["vue~3/guide/components/v-model", "vue~3/guide/components/events"]

