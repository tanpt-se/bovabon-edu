[[modules]]
id = "vue-template"
title = "Template & directive"
description = "Cú pháp template, binding, event, điều kiện, danh sách và directive tùy chỉnh."
sources = ["vue~3/guide/essentials/template-syntax", "vue~3/api/built-in-directives", "vue~3/guide/reusability/custom-directives"]
lesson = '''
### Template và directive
Template của Vue cho phép khai báo giao diện bằng HTML gần chuẩn; biểu thức trong `{{ }}` chỉ dùng cho biểu thức, không viết câu lệnh nhiều bước. `v-bind` (viết tắt `:`) nối thuộc tính với dữ liệu, `v-on` (viết tắt `@`) gắn sự kiện. `v-if` tạo hoặc gỡ nhánh, còn `v-show` giữ phần tử trong DOM và đổi CSS `display`.

| Cú pháp | Mục đích | Lưu ý |
|---|---|---|
| `:href="url"` | bind thuộc tính | giá trị được cập nhật theo state |
| `@click="save"` | lắng nghe sự kiện | modifier như `.once` giới hạn hành vi |
| `v-for="item in items"` | lặp danh sách | dùng `:key` ổn định, duy nhất |
| `v-model="name"` | đồng bộ form | là cú pháp rút gọn cho prop và event |

Ví dụ: `<li v-for="task in tasks" :key="task.id">{{ task.title }}</li>`. Không dùng index làm key khi danh sách có thể sắp xếp hoặc chèn giữa, vì DOM có thể bị tái sử dụng sai. Tránh `v-if` và `v-for` trên cùng một node; lọc dữ liệu bằng computed. `v-html` chèn HTML thô, nên chỉ dùng nội dung đáng tin cậy để tránh XSS. Directive tùy chỉnh phù hợp với thao tác DOM cấp thấp, không thay thế component hay composable.
'''

[[modules]]
id = "vue-reactivity"
title = "Reactivity"
description = "ref, reactive, computed, watch, watchEffect, toRefs và shallowRef."
sources = ["vue~3/guide/essentials/reactivity-fundamentals", "vue~3/api/reactivity-core", "vue~3/api/reactivity-advanced", "vue~3/api/reactivity-utilities", "vue~3/guide/essentials/watchers"]
lesson = '''
### Hệ thống reactivity
`ref()` bọc một giá trị trong `.value`; `reactive()` tạo proxy cho object. Trong template, ref cấp cao nhất thường được tự unwrap, nhưng trong JavaScript cần đọc hoặc gán `.value`. Khi destructure trực tiếp thuộc tính primitive từ reactive object, liên kết reactivity bị mất; `toRefs()` tạo các ref liên kết để destructure an toàn. `shallowRef()` chỉ theo dõi việc thay `.value`, không proxy sâu object bên trong.

| API | Dùng khi | Hành vi chính |
|---|---|---|
| `ref` / `reactive` | state thay đổi | ghi nhận dependency khi đọc |
| `computed` | giá trị suy ra | lazy, cache đến khi dependency đổi |
| `watch` | phản ứng với nguồn cụ thể | nhận giá trị mới/cũ và cleanup |
| `watchEffect` | dependency dễ suy ra từ thân hàm | chạy ngay và tự track phần được đọc |

Ví dụ: `const total = computed(() => price.value * quantity.value)`. Không gọi hàm phụ có side effect bên trong computed: getter nên thuần và chỉ tính giá trị. `watch` phù hợp cho request hoặc đồng bộ bên ngoài; đăng ký cleanup để hủy công việc cũ. `watchEffect` không tự biến mọi async dependency thành dependency: phần đọc sau `await` không được theo dõi như phần chạy đồng bộ ban đầu. Chọn `shallowRef` cho dữ liệu lớn hoặc tích hợp object bên ngoài khi muốn tránh proxy sâu.
'''

[[modules]]
id = "vue-components"
title = "Component, props và v-model"
description = "Giao tiếp component qua props, emits, slots, v-model và provide/inject."
sources = ["vue~3/guide/components/props", "vue~3/guide/components/events", "vue~3/guide/components/v-model", "vue~3/guide/components/slots", "vue~3/guide/components/provide-inject", "vue~3/api/sfc-script-setup#defineprops-defineemits", "vue~3/api/composition-api-dependency-injection#provide"]
lesson = '''
### Ranh giới component
Component con nhận dữ liệu qua `props` và thông báo sự kiện lên component cha qua `emits`; props là đầu vào chỉ đọc, nên con không sửa trực tiếp object prop để cập nhật cha. Với `<script setup>`, `defineProps()` và `defineEmits()` là compiler macro, không cần import. Khai báo emits giúp hợp đồng component rõ ràng và tránh nhầm sự kiện component với listener fallthrough.

| Cơ chế | Hướng dữ liệu | Ví dụ |
|---|---|---|
| prop | cha → con | `<UserCard :user="user" />` |
| emit | con → cha | `emit('save', form)` |
| slot | cha cung cấp nội dung | `<Panel><template #title>...</template></Panel>` |
| provide/inject | tổ tiên → hậu duệ | dịch vụ hoặc cấu hình theo cây |

`v-model` mặc định tương ứng prop `modelValue` và event `update:modelValue`; component phát event với giá trị mới thay vì mutate prop. Vue 3.4+ có `defineModel()` để rút gọn mẫu phổ biến; vẫn cần hiểu hợp đồng prop/event khi tích hợp component cũ hoặc nhiều model có tên. Slots cho phép component cha tùy biến phần trình bày; scoped slot truyền dữ liệu từ con ra nội dung slot. Provide/inject hữu ích khi tránh prop drilling trong cây sâu, nhưng đừng dùng làm kho state toàn cục thay cho thiết kế state rõ ràng.
'''

[[modules]]
id = "vue-composables"
title = "Composition API & composable"
description = "Tổ chức logic bằng setup, lifecycle và composable; áp dụng tiện ích VueUse."
sources = ["vue~3/api/composition-api-setup", "vue~3/api/composition-api-lifecycle", "vue~3/guide/reusability/composables", "vueuse/shared/refdebounced/index", "vueuse/shared/usedebouncefn/index", "vueuse/shared/watchdebounced/index"]
lesson = '''
### Composition API và tái sử dụng logic
Trong Composition API, `setup()` hoặc `<script setup>` là nơi khai báo state và logic gắn với component. Lifecycle hook như `onMounted()` phải được gọi trong ngữ cảnh component đang hoạt động. Composable là hàm thường bắt đầu bằng `use`, đóng gói state/reactivity và có thể đăng ký lifecycle; mỗi lần gọi thường tạo state riêng, trừ khi chủ ý chia sẻ state ở phạm vi module.

Một composable nên có đầu vào rõ, trả về các ref/computed cần thiết và dọn dẹp timer, listener hoặc subscription khi không còn dùng. VueUse cung cấp tiện ích đã giải quyết các chi tiết phổ biến như `refDebounced`, `useDebounceFn` và watcher có debounce; kiểm tra chính sách cancel/flush và thời điểm cập nhật thay vì giả định mọi tiện ích có cùng API.

| Mẫu | Trách nhiệm |
|---|---|
| `useSearch(query)` | kết hợp state tìm kiếm và trạng thái tải |
| `refDebounced(source, ms)` | cung cấp giá trị trễ để giảm cập nhật |
| `onUnmounted(cleanup)` | gỡ tài nguyên thuộc vòng đời component |

Không gọi composable tùy ý bên trong nhánh điều kiện nếu composable phụ thuộc lifecycle; gọi ổn định trong `setup()`. Với async effect, hủy request cũ trong cleanup để response đến trễ không ghi đè kết quả mới. Composable nên giải quyết một mối quan tâm có thể tái sử dụng, không gom mọi state của ứng dụng vào một hàm lớn.
'''

[[modules]]
id = "vue-router"
title = "Vue Router"
description = "Route tĩnh/động, params, catch-all, lazy loading và navigation guard."
sources = ["vue_router~5/guide/essentials/dynamic-matching", "vue_router~5/guide/essentials/route-matching-syntax", "vue_router~5/guide/advanced/dynamic-routing", "vue_router~5/guide/advanced/navigation-guards", "vue_router~5/guide/advanced/lazy-loading", "vue_router~5/guide/advanced/navigation-failures"]
lesson = '''
### Khai báo và điều hướng
Route động dùng segment như `/users/:id`; giá trị được đưa vào `route.params`, khác với query string trong `route.query`. Route catch-all hiện đại thường viết `/:pathMatch(.*)*`. Thứ tự và độ cụ thể của route ảnh hưởng kết quả; đặt route tổng quát sau route cụ thể khi dùng matcher tự xây.

| Cơ chế | Vai trò | Ví dụ |
|---|---|---|
| `:id` | nhận một segment động | `/users/42` |
| `*` / catch-all | nhận phần đường dẫn còn lại | trang 404 |
| lazy route | tải component khi cần | `component: () => import('./Page.vue')` |
| navigation guard | cho phép, hủy hoặc chuyển hướng | `beforeEach((to, from) => ...)` |

Guard có thể trả `false` để hủy, `true` hoặc `undefined` để tiếp tục, hoặc location để redirect; guard async được chờ theo thứ tự. Mẫu trả về thường dễ đọc và ít lỗi hơn callback `next`. Guard không phải nơi duy nhất kiểm tra quyền: server vẫn phải xác thực và phân quyền. Component route lazy giúp chia bundle; đừng bọc async route component bằng `defineAsyncComponent` khi Router đã xử lý dynamic import. Khi thêm route lúc ứng dụng đang chạy, matcher phải được cập nhật rõ ràng.
'''

[[modules]]
id = "vue-performance-state"
title = "Hiệu năng & state"
description = "Pinia, KeepAlive, v-memo, phân tích render và tối ưu có đo lường."
sources = ["vue~3/guide/best-practices/performance", "vue~3/guide/scaling-up/state-management", "vue~3/api/built-in-components#keepalive", "vue~3/api/built-in-directives#v-memo"]
lesson = '''
### State và hiệu năng
State nên ở phạm vi hẹp nhất đủ cho nơi sử dụng: state component cho giao diện cục bộ, composable cho logic tái sử dụng, store như Pinia cho state dùng chung giữa nhiều khu vực hoặc cần công cụ/devtools rõ ràng. Pinia tổ chức state, getters và actions theo store; không cần tự xây một global reactive object khi ứng dụng đã dùng store.

`<KeepAlive>` cache instance component động để giữ state khi chuyển tab/route; `include`, `exclude` và `max` điều khiển tập cache. `v-memo` bỏ qua cập nhật subtree khi các giá trị trong dependency array không đổi, nhưng chỉ nên dùng sau khi đo thấy render là nút thắt; dependency thiếu có thể làm UI hiển thị dữ liệu cũ.

| Công cụ | Dùng cho | Rủi ro cần tránh |
|---|---|---|
| Pinia | state chia sẻ có cấu trúc | store quá rộng, phụ thuộc vòng |
| KeepAlive | giữ component khi chuyển qua lại | cache quá nhiều instance |
| `v-memo` | subtree lớn ít thay đổi | bỏ sót dependency |

Tối ưu trước hết bằng component nhỏ, dữ liệu ổn định và danh sách có `key` tốt; kiểm tra bằng Vue DevTools hoặc profiling trình duyệt. Cache làm giảm khởi tạo nhưng giữ bộ nhớ; state cache vẫn có thể cần đồng bộ. Không thêm memoization chỉ vì một biểu thức trông phức tạp: đo, tìm nguyên nhân, rồi chọn thay đổi nhỏ nhất.
'''

[[modules]]
id = "vue-dv-render"
title = "Async component, Teleport và transition"
description = "Tổ chức component tải trễ, modal ngoài cây DOM và hiệu ứng vào/ra hoặc danh sách."
sources = ["vue~3/guide/components/async", "vue~3/api/built-in-components#teleport", "vue~3/api/built-in-components#transition", "vue~3/api/built-in-components#transitiongroup", "vue~3/guide/built-ins/teleport", "vue~3/guide/built-ins/transition-group"]
lesson = '''
### Component tải trễ và render tích hợp

Vue cung cấp các component tích hợp để giải quyết những vấn đề giao diện mà một component thông thường khó làm gọn: tải mã theo nhu cầu, đặt một nhánh giao diện ở vị trí khác trong DOM và phối hợp class hoặc lifecycle với CSS transition. `defineAsyncComponent()` nhận loader trả về Promise; component chỉ cần được tải khi xuất hiện trong cây render. Đây là cách chia nhỏ bundle, nhưng trạng thái loading, lỗi tải và retry cần được thiết kế cho trải nghiệm thật.

| API | Trường hợp dùng | Điều cần nhớ |
|---|---|---|
| `defineAsyncComponent` | màn hình hoặc widget ít dùng | loader trả Promise; có thể cấu hình loading/error component |
| `<Teleport>` | modal, popover, toast | đổi vị trí DOM, vẫn thuộc cây component ban đầu |
| `<Transition>` | một phần tử hoặc component vào/ra | CSS class được gắn theo các pha transition |
| `<TransitionGroup>` | nhiều phần tử danh sách thay đổi | mỗi phần tử cần `key` ổn định, mặc định không thêm wrapper |

Ví dụ: `const ReportsPage = defineAsyncComponent(() => import('./ReportsPage.vue'))` chỉ tạo điểm tải trễ; route-level splitting cũng là lựa chọn khi màn hình được chọn qua Router. Modal thường được Teleport tới phần tử overlay gần `body` để tránh bị cắt bởi `overflow` hoặc stacking context của tổ tiên. Dù DOM được chuyển chỗ, quan hệ component, props và event vẫn theo cây Vue ban đầu. `<TransitionGroup>` hữu ích khi thêm/xóa/sắp xếp hàng trong danh sách; `key` theo index có thể khiến Vue tái sử dụng nhầm node và hiệu ứng nhìn sai.

Lỗi hay gặp là nghĩ Teleport tự quản lý focus, Escape hay khóa cuộn: đây vẫn là trách nhiệm của thiết kế modal. Transition cũng không chạy nếu điều kiện không làm phần tử vào/ra đúng cách, và class CSS phải khớp tên transition. Với component bất đồng bộ, tránh tạo component mới trong mỗi lần render và cung cấp trạng thái lỗi/loading hợp lý. `<Suspense>` tồn tại nhưng vẫn là API thử nghiệm; không nên dựa vào nó như hợp đồng ổn định nếu dự án chưa chấp nhận rủi ro thay đổi.
'''

[[modules]]
id = "vue-dv-router-data"
title = "Route metadata và data fetching"
description = "Thiết kế metadata lồng nhau, tải dữ liệu theo điều hướng và bọc route view."
sources = ["vue_router~5/guide/advanced/meta", "vue_router~5/guide/advanced/data-fetching", "vue_router~5/guide/advanced/router-view-slot", "vue_router~5/guide/advanced/scroll-behavior", "vue_router~5/guide/advanced/navigation-guards", "vue_router~5/guide/essentials/active-links"]
lesson = '''
### Metadata route và dữ liệu màn hình

Route record có thể mô tả chính sách hoặc thông tin trình bày ngoài `path` và `component`. Trường `meta` phù hợp cho dữ liệu khai báo như yêu cầu đăng nhập, tiêu đề trang hay quyền cần có. Với route lồng nhau, Vue Router tạo `route.meta` bằng cách gộp nông các meta record đã match theo thứ tự cha đến con; giá trị cùng khóa ở route con thay giá trị của cha. Đây không phải phép gộp sâu cho object lồng nhau.

| Chiến lược | Hành vi điều hướng | Hợp với |
|---|---|---|
| Tải sau khi vào route | hiện loading trong trang rồi cập nhật | giao diện muốn phản hồi sớm hoặc giữ màn hình cũ |
| Tải trước khi vào route | guard chờ dữ liệu rồi mới cho tiếp tục | màn hình không thể render nếu thiếu dữ liệu |
| `route.meta` | đọc metadata đã gộp nông | title hoặc chính sách đơn giản |
| `route.matched` | duyệt từng record cha/con đã match | cần xét mọi ràng buộc tổ tiên |

Ví dụ kiểm tra yêu cầu đăng nhập lồng nhau: `to.matched.some(record => record.meta.requiresAuth)` sẽ nhận ra metadata ở bất kỳ record nào trong nhánh. Dùng `to.meta.requiresAuth` thì đọc giá trị đã gộp; nếu con đặt `false`, nó có thể ghi đè giá trị cha. Guard chỉ điều khiển trải nghiệm ở client, không thay thế xác thực và phân quyền của API.

`RouterView` có slot để lấy component route hiện tại và bọc nó bằng `Transition` hoặc `KeepAlive`. Hãy cân nhắc key khi muốn hiệu ứng chạy lại giữa các route khác nhau. `scrollBehavior` tách khôi phục vị trí cuộn khỏi component; ứng dụng có thể trả vị trí mới hoặc khôi phục `savedPosition` khi back/forward. Lỗi thường gặp là tải cùng dữ liệu ở cả guard lẫn component, gộp sâu metadata theo giả định, hoặc để guard chờ vô hạn khi request không có timeout/cancel. Chọn một chủ sở hữu cho request và thể hiện rõ trạng thái loading, lỗi, retry.
'''

[[modules]]
id = "vue-dv-state"
title = "VueUse state, storage và history"
description = "Chia sẻ state có chủ đích, lưu trữ phản ứng và hoàn tác thay đổi dữ liệu."
sources = ["vueuse/core/usestorage/index", "vueuse/core/userefhistory/index", "vueuse/shared/createglobalstate/index", "vueuse/shared/createsharedcomposable/index", "vueuse/core/useasyncstate/index"]
lesson = '''
### State dùng chung và persistence với VueUse

State lưu trong component phù hợp với dữ liệu chỉ có một chủ sở hữu. Khi nhiều màn hình cần cùng một trạng thái, hãy chọn rõ phạm vi chia sẻ và vòng đời thay vì đưa mọi thứ vào một biến toàn cục. VueUse có các helper cho state chia sẻ, đồng bộ với storage, lịch sử giá trị và tác vụ bất đồng bộ. Các helper này giảm phần lặp nhưng không thay thế quyết định về quyền sở hữu dữ liệu.

| API | Mục đích | Phạm vi hoặc lưu ý |
|---|---|---|
| `useStorage` | đồng bộ ref với storage | dữ liệu phải serialize/parse được; storage thuộc môi trường browser |
| `useRefHistory` | lưu snapshot để undo/redo | cần `deep: true` nếu theo dõi thay đổi lồng bên trong object |
| `createGlobalState` | tạo state được dùng lại qua nhiều lần gọi | vòng đời có thể dài bằng module/app; cân nhắc SSR |
| `createSharedComposable` | chia sẻ một composable giữa consumer | chia sẻ đến khi không còn consumer theo quản lý scope |
| `useAsyncState` | biểu diễn kết quả tác vụ bất đồng bộ | UI vẫn cần loading, lỗi, retry và chính sách request mới/cũ |

Ví dụ, `const settings = useStorage('settings', { theme: 'light' })` giúp đồng bộ preference với storage phía client. Với object, serialization là ranh giới quan trọng: function, circular reference hoặc dữ liệu không hợp JSON không phù hợp làm giá trị lưu mặc định. Không lưu bí mật có giá trị cao trong localStorage vì script cùng origin có thể đọc được. Trong SSR, module-level mutable state có nguy cơ bị dùng chung giữa request; phải kiểm tra scope hoặc khởi tạo theo request.

`useRefHistory` hữu ích cho undo hoặc xem thay đổi; nếu chỉ theo dõi thay object nhưng lại mutate thuộc tính lồng, cần cấu hình theo dõi sâu hoặc thay object bất biến. Lỗi phổ biến là nhầm `createGlobalState` với state riêng theo component, hoặc vô tình chia sẻ dữ liệu người dùng khác nhau. Chọn persistence khi cần sống qua reload, history khi cần quay lui trong phiên, và shared composable khi nhiều consumer phải quan sát cùng một nguồn sống có vòng đời xác định.
'''

[[modules]]
id = "vue-dv-network"
title = "VueUse network và browser APIs"
description = "Chọn composable cho HTTP, luồng sự kiện, WebSocket và capability của browser."
sources = ["vueuse/core/usefetch/index", "vueuse/core/useeventsource/index", "vueuse/core/usewebsocket/index", "vueuse/core/useclipboard/index", "vueuse/core/usepermission/index"]
lesson = '''
### Kết nối mạng và capability của browser

VueUse gom một số thao tác browser thường gặp thành composable reactive, nhưng mỗi API có mô hình giao tiếp và giới hạn môi trường khác nhau. Chọn theo chiều dữ liệu, vòng đời và cách trình duyệt cấp quyền. Dù trạng thái được bọc thành ref, request vẫn có thể lỗi, bị hủy, trả về sai thứ tự hoặc không được hỗ trợ trong môi trường đang chạy.

| API | Kiểu giao tiếp | Khi phù hợp |
|---|---|---|
| `useFetch` | HTTP request/response | tải hoặc gửi dữ liệu theo request hữu hạn |
| `useEventSource` | server gửi sự kiện về client | cập nhật một chiều như tiến độ hoặc thông báo |
| `useWebSocket` | kết nối hai chiều tồn tại lâu | chat hoặc dữ liệu realtime cần gửi và nhận |
| `useClipboard` | capability của browser | sao chép văn bản khi môi trường cho phép |
| `usePermission` | trạng thái quyền browser | hiển thị khả năng hiện tại, không quyết định quyền truy cập server |

Ví dụ, `useFetch('/api/profile')` phù hợp cho response hữu hạn; một dashboard nhận thông báo liên tục có thể dùng EventSource, còn chat thường cần giao tiếp hai chiều qua WebSocket. Với kết nối lâu, cần hiển thị trạng thái, xử lý mất mạng, reconnect có giới hạn và đóng kết nối khi scope không còn dùng. Không gửi token hoặc dữ liệu nhạy cảm qua query string nếu có thể dùng một cơ chế xác thực phù hợp hơn.

Clipboard và permission phụ thuộc browser, secure context, user activation hoặc policy của trang; hãy kiểm tra khả năng hỗ trợ và bắt lỗi thay vì giả định luôn thành công. Permission browser cũng không phải authorization của API. Lỗi thường gặp là dùng WebSocket chỉ để tải một lần, không dọn socket/listener, hoặc cho phép response cũ ghi đè kết quả của request mới. Khi request gắn với input thay đổi nhanh, hủy request cũ nếu có thể hoặc so sánh request id trước khi cập nhật state. Trong SSR, không chạm vào API browser ở thời điểm module được import; chỉ sử dụng khi có môi trường phù hợp.
'''

