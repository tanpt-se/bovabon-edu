[[questions]]
id = "vue-025"
module = "vue-composables"
type = "code"
difficulty = 2
title = "useDebouncedRef với fake timers"
prompt = '''
Viết `useDebouncedRef(initialValue, delayMs)` bằng timer chuẩn, không dùng thư viện.
- Trả object có getter/setter `.value`, cùng phương thức `cancel()` và `flush()`.
- Gán `.value` lên lịch cập nhật sau `delayMs`; trước thời điểm đó getter vẫn trả giá trị đã commit.
- Nhiều lần gán trong thời gian chờ chỉ commit giá trị cuối, tính lại khoảng chờ từ lần gán gần nhất.
- `cancel()` bỏ giá trị đang chờ; `flush()` commit ngay giá trị chờ và trả về giá trị hiện tại.
'''
starter = '''
function useDebouncedRef(initialValue, delayMs) {
  return { value: initialValue, cancel() {}, flush() { return initialValue; } };
}
'''
solution = '''
function useDebouncedRef(initialValue, delayMs) {
  let current = initialValue;
  let pending;
  let hasPending = false;
  let timer = null;
  function clearPendingTimer() {
    if (timer !== null) { clearTimeout(timer); timer = null; }
  }
  const result = {
    get value() { return current; },
    set value(next) {
      pending = next;
      hasPending = true;
      clearPendingTimer();
      timer = setTimeout(() => {
        timer = null;
        if (hasPending) { current = pending; pending = undefined; hasPending = false; }
      }, delayMs);
    },
    cancel() {
      clearPendingTimer();
      pending = undefined;
      hasPending = false;
    },
    flush() {
      if (!hasPending) return current;
      clearPendingTimer();
      current = pending;
      pending = undefined;
      hasPending = false;
      return current;
    }
  };
  return result;
}
'''
tests = '''
test('giữ giá trị cũ trước khi hết debounce', () => {
  jest.useFakeTimers();
  const value = useDebouncedRef('a', 100);
  value.value = 'b';
  jest.advanceTimersByTime(99);
  expect(value.value).toBe('a');
  jest.advanceTimersByTime(1);
  expect(value.value).toBe('b');
});
test('gán liên tiếp chỉ commit giá trị cuối sau khoảng chờ mới', () => {
  jest.useFakeTimers();
  const value = useDebouncedRef(0, 50);
  value.value = 1;
  jest.advanceTimersByTime(40);
  value.value = 2;
  jest.advanceTimersByTime(49);
  expect(value.value).toBe(0);
  jest.advanceTimersByTime(1);
  expect(value.value).toBe(2);
});
test('flush commit ngay và trả giá trị mới', () => {
  jest.useFakeTimers();
  const value = useDebouncedRef(1, 100);
  value.value = 5;
  expect(value.flush()).toBe(5);
  expect(value.value).toBe(5);
  jest.runAllTimers();
  expect(value.value).toBe(5);
});
test('cancel bỏ giá trị chưa commit', () => {
  jest.useFakeTimers();
  const value = useDebouncedRef('old', 10);
  value.value = 'new';
  value.cancel();
  jest.runAllTimers();
  expect(value.value).toBe('old');
});
test('flush khi không có giá trị chờ trả giá trị hiện tại', () => {
  jest.useFakeTimers();
  const value = useDebouncedRef(7, 10);
  expect(value.flush()).toBe(7);
});
'''
hints = ["Lưu timer id, pending value và cờ cho biết có giá trị chờ; clear timer trước mỗi lần gán.", "`flush` và callback timer phải xóa trạng thái chờ để không commit cùng giá trị hai lần."]
explanation = "Bài tập mô phỏng ref debounce tối giản; fake timers giúp kiểm tra chính xác biên thời gian mà không phải chờ thật."
sources = ["vueuse/shared/refdebounced/index", "vueuse/shared/usedebouncefn/index"]

