[[questions]]
id = "vue-dvc04"
module = "vue-dv-network"
type = "code"
difficulty = 3
title = "Chỉ nhận kết quả request mới nhất"
lang = "javascript"
prompt = '''Viết `createLatestRequestState()` trả về `{ state, begin, resolve, reject, cancel }`.
- `state` bắt đầu là `{ requestId: 0, loading: false, data: null, error: null }`.
- `begin()` tăng request id, đặt `loading` thành true, xóa `error`, giữ nguyên `data`, rồi trả id mới.
- `resolve(id, value)` chỉ nhận kết quả khi id là request hiện tại và đang loading; nếu nhận thì cập nhật `data`, tắt loading và trả true.
- `reject(id, error)` áp dụng cùng quy tắc, lưu error, tắt loading và trả true.
- Kết quả cũ hoặc settle lặp phải trả false và không đổi state. `cancel(id)` chỉ hủy request hiện tại đang loading, tăng id để vô hiệu token cũ, tắt loading và trả true; trường hợp khác trả false.
'''
starter = '''function createLatestRequestState() {
  const state = { requestId: 0, loading: false, data: null, error: null };
  return {
    state,
    begin() { return state.requestId; },
    resolve() { return false; },
    reject() { return false; },
    cancel() { return false; }
  };
}
'''
solution = '''function createLatestRequestState() {
  const state = { requestId: 0, loading: false, data: null, error: null };
  function isCurrent(id) { return state.loading && id === state.requestId; }
  return {
    state,
    begin() {
      state.requestId++;
      state.loading = true;
      state.error = null;
      return state.requestId;
    },
    resolve(id, value) {
      if (!isCurrent(id)) return false;
      state.data = value;
      state.loading = false;
      return true;
    },
    reject(id, error) {
      if (!isCurrent(id)) return false;
      state.error = error;
      state.loading = false;
      return true;
    },
    cancel(id) {
      if (!isCurrent(id)) return false;
      state.requestId++;
      state.loading = false;
      return true;
    }
  };
}
'''
tests = '''test('begin tạo id mới và bật loading, đồng thời xóa lỗi cũ', () => {
  const requests = createLatestRequestState();
  requests.state.error = 'old error';
  const id = requests.begin();
  expect(id).toBe(1);
  expect(requests.state.loading).toBe(true);
  expect(requests.state.error).toBeNull();
});
test('resolve của request hiện tại cập nhật data và tắt loading', () => {
  const requests = createLatestRequestState();
  const id = requests.begin();
  expect(requests.resolve(id, { name: 'Ada' })).toBe(true);
  expect(requests.state.data).toEqual({ name: 'Ada' });
  expect(requests.state.loading).toBe(false);
});
test('response cũ bị bỏ qua sau khi request mới bắt đầu', () => {
  const requests = createLatestRequestState();
  const oldId = requests.begin();
  const newId = requests.begin();
  expect(requests.resolve(oldId, 'old')).toBe(false);
  expect(requests.state.loading).toBe(true);
  expect(requests.resolve(newId, 'new')).toBe(true);
  expect(requests.state.data).toBe('new');
});
test('reject hiện tại lưu lỗi, reject cũ không đổi state', () => {
  const requests = createLatestRequestState();
  const oldId = requests.begin();
  const currentId = requests.begin();
  expect(requests.reject(oldId, 'stale')).toBe(false);
  expect(requests.reject(currentId, 'offline')).toBe(true);
  expect(requests.state.error).toBe('offline');
  expect(requests.state.loading).toBe(false);
});
test('cancel vô hiệu token hiện tại và settle lặp bị từ chối', () => {
  const requests = createLatestRequestState();
  const id = requests.begin();
  expect(requests.cancel(id)).toBe(true);
  expect(requests.state.loading).toBe(false);
  expect(requests.resolve(id, 'late')).toBe(false);
  expect(requests.cancel(id)).toBe(false);
});
'''
