[[questions]]
id = "vue-032"
module = "vue-router"
type = "code"
difficulty = 3
title = "Matcher route có param và wildcard"
prompt = '''
Viết `createRouteMatcher(routes)` trả về hàm `match(path)`.
- Route có dạng `{ path, name }`; hỗ trợ segment tĩnh, segment `:param` và segment `*` bắt phần đường dẫn còn lại.
- Đường dẫn có thể bắt đầu bằng `/`; bỏ query string và fragment trước khi so khớp.
- Trả `{ name, params }` cho route đầu tiên khớp, trong đó param động là chuỗi và wildcard lưu phần còn lại dưới khóa `pathMatch`.
- Trả `null` nếu không có route. Các route được duyệt theo thứ tự khai báo; wildcard nên để sau route cụ thể.
'''
starter = '''
function createRouteMatcher(routes) {
  return function match(path) { return null; };
}
'''
solution = '''
function createRouteMatcher(routes) {
  return function match(path) {
    const pathname = path.split(/[?#]/)[0];
    const actual = pathname.split('/').filter(Boolean);
    for (const route of routes) {
      const expected = route.path.split('/').filter(Boolean);
      const params = {};
      let index = 0;
      let failed = false;
      for (let i = 0; i < expected.length; i++) {
        const segment = expected[i];
        if (segment === '*') {
          params.pathMatch = actual.slice(i).join('/');
          index = actual.length;
          break;
        }
        if (actual[i] === undefined) { failed = true; break; }
        if (segment[0] === ':') params[segment.slice(1)] = actual[i];
        else if (segment !== actual[i]) { failed = true; break; }
        index = i + 1;
      }
      if (!failed && index === actual.length) return { name: route.name, params };
    }
    return null;
  };
}
'''
tests = '''
test('khớp route tĩnh và root', () => {
  const match = createRouteMatcher([{ path: '/', name: 'home' }, { path: '/about', name: 'about' }]);
  expect(match('/')).toEqual({ name: 'home', params: {} });
  expect(match('/about')).toEqual({ name: 'about', params: {} });
});
test('trích một param động', () => {
  const match = createRouteMatcher([{ path: '/users/:id', name: 'user' }]);
  expect(match('/users/42')).toEqual({ name: 'user', params: { id: '42' } });
});
test('trích nhiều param động', () => {
  const match = createRouteMatcher([{ path: '/teams/:team/users/:id', name: 'member' }]);
  expect(match('/teams/a/users/7').params).toEqual({ team: 'a', id: '7' });
});
test('wildcard lấy toàn bộ phần đường dẫn còn lại', () => {
  const match = createRouteMatcher([{ path: '/files/*', name: 'files' }]);
  expect(match('/files/a/b.txt')).toEqual({ name: 'files', params: { pathMatch: 'a/b.txt' } });
});
test('wildcard khớp phần còn lại rỗng và query bị bỏ qua', () => {
  const match = createRouteMatcher([{ path: '/files/*', name: 'files' }]);
  expect(match('/files?download=1')).toEqual({ name: 'files', params: { pathMatch: '' } });
});
test('route đầu tiên khớp được chọn, route dư segment không khớp', () => {
  const match = createRouteMatcher([{ path: '/users/:id', name: 'user' }, { path: '*', name: 'not-found' }]);
  expect(match('/users/2').name).toBe('user');
  expect(match('/users/2/edit').name).toBe('not-found');
  expect(match('/missing#top').params.pathMatch).toBe('missing');
});
'''
hints = ["Tách path thành segment sau khi cắt query và fragment; bỏ segment rỗng do dấu slash đầu.", "Param động tiêu thụ một segment, còn wildcard gom các segment từ vị trí hiện tại."]
explanation = "Bài tập mô phỏng lõi route matching để làm rõ params và catch-all; Vue Router còn có quy tắc ranking và cú pháp pattern phong phú hơn."
sources = ["vue_router~5/guide/essentials/dynamic-matching", "vue_router~5/guide/essentials/route-matching-syntax"]

[[questions]]
id = "vue-033"
module = "vue-router"
type = "code"
difficulty = 3
title = "Navigation guard pipeline"
prompt = '''
Viết `async runGuards(guards, to, from)` thực thi các guard theo thứ tự.
- Mỗi guard nhận `(to, from)` và có thể trả giá trị thường hoặc Promise.
- `undefined` hoặc `true` cho phép chạy guard kế tiếp.
- `false` dừng pipeline và trả `{ status: 'cancelled' }`.
- String hoặc object location dừng pipeline và trả `{ status: 'redirect', target: result }`.
- Nếu mọi guard cho phép, trả `{ status: 'allowed' }`. Lỗi từ guard được propagate.
'''
starter = '''
async function runGuards(guards, to, from) {
  return { status: 'allowed' };
}
'''
solution = '''
async function runGuards(guards, to, from) {
  for (const guard of guards) {
    const result = await guard(to, from);
    if (result === false) return { status: 'cancelled' };
    if (result !== undefined && result !== true) return { status: 'redirect', target: result };
  }
  return { status: 'allowed' };
}
'''
tests = '''
test('mọi guard cho phép thì navigation thành công', async () => {
  const result = await runGuards([() => true, () => undefined], '/b', '/a');
  expect(result).toEqual({ status: 'allowed' });
});
test('guard false hủy pipeline và không gọi guard sau', async () => {
  let calls = 0;
  const result = await runGuards([() => false, () => { calls++; }], '/b', '/a');
  expect(result).toEqual({ status: 'cancelled' });
  expect(calls).toBe(0);
});
test('location string tạo redirect', async () => {
  const result = await runGuards([() => '/login'], '/private', '/home');
  expect(result).toEqual({ status: 'redirect', target: '/login' });
});
test('location object tạo redirect', async () => {
  const location = { name: 'login', query: { next: '/private' } };
  const result = await runGuards([() => location], '/private', '/home');
  expect(result).toEqual({ status: 'redirect', target: location });
});
test('guard async được chờ và chạy tuần tự', async () => {
  const order = [];
  const result = await runGuards([
    async () => { order.push(1); return true; },
    async () => { order.push(2); return undefined; }
  ], '/b', '/a');
  expect(order).toEqual([1, 2]);
  expect(result.status).toBe('allowed');
});
test('lỗi guard được propagate', async () => {
  let message = '';
  try { await runGuards([async () => { throw new Error('guard failed'); }], '/b', '/a'); }
  catch (error) { message = error.message; }
  expect(message).toBe('guard failed');
});
'''
hints = ["Dùng vòng lặp `for...of` để giữ thứ tự và `await` từng kết quả.", "Phân biệt rõ ba kết quả: tiếp tục, hủy và redirect; không chạy guard sau kết quả kết thúc."]
explanation = "Guard pipeline dừng ngay khi một guard hủy hoặc redirect; điều này phản ánh quyết định điều hướng trước khi render route mới."
sources = ["vue_router~5/guide/advanced/navigation-guards"]

