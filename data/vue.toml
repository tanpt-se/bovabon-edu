[[questions]]
id = "vue-dvc02"
module = "vue-dv-router-data"
type = "code"
difficulty = 2
title = "Gộp metadata của route records"
lang = "javascript"
prompt = '''Viết `mergeRouteMeta(records)` nhận các route record đã match theo thứ tự từ cha đến con.
- Mỗi record có thể có `meta` là object hoặc không có `meta`.
- Trả object mới chứa các key từ mọi `meta`.
- Khi nhiều record có cùng key, giá trị ở record sau ghi đè giá trị trước theo phép gộp nông.
- Không làm thay đổi object `meta` đầu vào.
'''
starter = '''function mergeRouteMeta(records) {
  return {};
}
'''
solution = '''function mergeRouteMeta(records) {
  const result = {};
  for (const record of records) {
    if (!record || !record.meta) continue;
    for (const key of Object.keys(record.meta)) result[key] = record.meta[key];
  }
  return result;
}
'''
tests = '''test('gộp metadata theo thứ tự cha đến con', () => {
  const result = mergeRouteMeta([
    { meta: { requiresAuth: true, title: 'Admin' } },
    { meta: { title: 'Users' } }
  ]);
  expect(result).toEqual({ requiresAuth: true, title: 'Users' });
});
test('record con có thể ghi đè một giá trị bằng false', () => {
  const result = mergeRouteMeta([
    { meta: { requiresAuth: true } },
    { meta: { requiresAuth: false } }
  ]);
  expect(result.requiresAuth).toBe(false);
});
test('gộp nông nên object cùng khóa ở con thay object của cha', () => {
  const result = mergeRouteMeta([
    { meta: { policy: { read: true, edit: true } } },
    { meta: { policy: { read: false } } }
  ]);
  expect(result.policy).toEqual({ read: false });
});
test('bỏ qua record thiếu meta và trả object rỗng khi không có dữ liệu', () => {
  expect(mergeRouteMeta([{}, null, { meta: null }])).toEqual({});
});
test('không mutate metadata đầu vào', () => {
  const parentMeta = { title: 'Parent' };
  const result = mergeRouteMeta([{ meta: parentMeta }, { meta: { title: 'Child' } }]);
  expect(parentMeta).toEqual({ title: 'Parent' });
  expect(result).toEqual({ title: 'Child' });
});
'''
hints = ["Duyệt records từ trái sang phải và gán từng key vào object kết quả mới.", "Phép gộp nông thay cả value của một key; không cần đệ quy vào object con."]
explanation = "Mô phỏng phép gộp nông của route meta giúp thấy rõ quy tắc ghi đè giữa record cha và con."
sources = ["vue_router~5/guide/advanced/meta"]

