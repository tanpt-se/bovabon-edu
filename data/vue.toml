[[questions]]
id = "vue-dvc03"
module = "vue-dv-state"
type = "code"
difficulty = 2
title = "Ref lưu trữ với JSON"
lang = "javascript"
prompt = '''Viết `createStorageRef(storage, key, initialValue)` dùng một đối tượng `storage` có `getItem(key)` và `setItem(key, value)`.
- Khi tạo, nếu key có chuỗi JSON hợp lệ thì dùng giá trị đã parse; nếu key chưa có hoặc JSON lỗi thì dùng `initialValue`.
- Trả object có getter/setter `.value`.
- Khi gán `.value`, cập nhật giá trị hiện tại và ghi `JSON.stringify(value)` vào storage.
- Không cần mô phỏng reactivity hoặc storage event từ tab khác.
'''
starter = '''function createStorageRef(storage, key, initialValue) {
  return {
    value: initialValue
  };
}
'''
solution = '''function createStorageRef(storage, key, initialValue) {
  let value = initialValue;
  const raw = storage.getItem(key);
  if (raw !== null) {
    try { value = JSON.parse(raw); } catch {}
  }
  return {
    get value() { return value; },
    set value(next) {
      value = next;
      storage.setItem(key, JSON.stringify(next));
    }
  };
}
'''
tests = '''function createMemoryStorage(initial = {}) {
  const values = { ...initial };
  return {
    values,
    getItem(key) { return Object.prototype.hasOwnProperty.call(values, key) ? values[key] : null; },
    setItem(key, value) { values[key] = value; }
  };
}
test('đọc giá trị JSON có sẵn', () => {
  const storage = createMemoryStorage({ prefs: '{"theme":"dark"}' });
  const ref = createStorageRef(storage, 'prefs', { theme: 'light' });
  expect(ref.value).toEqual({ theme: 'dark' });
});
test('dùng giá trị mặc định khi key chưa có', () => {
  const storage = createMemoryStorage();
  const initial = { theme: 'light' };
  const ref = createStorageRef(storage, 'prefs', initial);
  expect(ref.value).toBe(initial);
  expect(storage.getItem('prefs')).toBeNull();
});
test('setter cập nhật ref và ghi JSON vào storage', () => {
  const storage = createMemoryStorage();
  const ref = createStorageRef(storage, 'count', 0);
  ref.value = 4;
  expect(ref.value).toBe(4);
  expect(storage.getItem('count')).toBe('4');
});
test('JSON lỗi quay về giá trị mặc định', () => {
  const storage = createMemoryStorage({ prefs: '{broken' });
  const ref = createStorageRef(storage, 'prefs', 'fallback');
  expect(ref.value).toBe('fallback');
});
test('null là giá trị JSON hợp lệ, khác với key không tồn tại', () => {
  const storage = createMemoryStorage({ value: 'null' });
  const ref = createStorageRef(storage, 'value', 'fallback');
  expect(ref.value).toBeNull();
});
'''
hints = ["Phân biệt `getItem` trả `null` với một chuỗi JSON hợp lệ biểu diễn giá trị null.", "Bọc `JSON.parse` bằng try/catch để dữ liệu cũ hoặc lỗi không làm hỏng khởi tạo."]
explanation = "Bài tập mô phỏng phần serialization cơ bản ở ranh giới storage; ứng dụng thật còn cần xét SSR, quota và đồng bộ nhiều tab."
