id = "angular"
title = "Angular & RxJS"
icon = "🅰️"
color = "#dd0031"
group = "Frontend"
docs = ["angular", "rxjs"]
description = "Xây ứng dụng Angular hiện đại với component standalone, signals, DI, router, forms và luồng bất đồng bộ RxJS."

[[modules]]
id = "ng-components"
title = "Component & Template"
description = "Component standalone, binding, control flow mới và API input/output/model."
sources = ["angular/api/core/component", "angular/api/core/@if", "angular/api/core/@for", "angular/api/core/@switch", "angular/api/core/model", "angular/guide/components/inputs", "angular/guide/components/outputs", "angular/guide/templates/two-way-binding"]
lesson = '''
### Component và template
Component standalone tự khai báo dependency template trong imports; đây là cách tổ chức mặc định của component mới. Template liên kết dữ liệu với property bằng [value], sự kiện bằng (click), hoặc hai chiều bằng [(ngModel)] hay model signal phù hợp.

| Cú pháp | Vai trò | Ví dụ |
|---|---|---|
| [value]="name()" | Property binding | Đồng bộ giá trị vào DOM |
| (click)="save()" | Event binding | Gọi hành động từ template |
| @if / @switch | Chọn nhánh | Hiển thị theo trạng thái |
| @for (item of items(); track item.id) | Lặp có định danh | Giữ DOM ổn định |

Ví dụ: @if (user(); as current) { <p>{{ current.name }}</p> } @else { <p>Chưa đăng nhập</p> }. Dùng track theo khóa bền vững như id để Angular nhận ra item khi danh sách đổi.

Lỗi thường gặp: bỏ track trong danh sách lớn hoặc dùng vị trí làm khóa khi thứ tự có thể đổi; gọi hàm nặng trong template; nhầm [value] với (value); tạo output chỉ để đồng bộ hai chiều khi model() đã diễn đạt đúng ý định.
'''

[[modules]]
id = "ng-signals"
title = "Signals & Change Detection"
description = "signal, computed, effect, linkedSignal, OnPush và ứng dụng zoneless."
sources = ["angular/guide/signals", "angular/api/core/signal", "angular/api/core/computed", "angular/api/core/effect", "angular/api/core/linkedsignal", "angular/api/core/changedetectionstrategy", "angular/guide/zoneless"]
lesson = '''
### Trạng thái phản ứng
signal() giữ trạng thái có thể ghi; computed() tạo giá trị dẫn xuất có cache và chỉ tính lại khi dependency đổi. effect() chạy để đồng bộ với tác động bên ngoài, chẳng hạn local storage hoặc API không phản ứng; không dùng effect để sao chép trạng thái có thể biểu diễn bằng computed. linkedSignal() giữ trạng thái có thể ghi nhưng tính lại khi nguồn phụ thuộc đổi.

| API | Ý định | Lưu ý |
|---|---|---|
| signal | Trạng thái ghi được | set() hoặc update() |
| computed | Giá trị dẫn xuất | Lazy, chỉ đọc |
| effect | Đồng bộ side effect | Theo dõi signal được đọc |
| linkedSignal | Giá trị dẫn xuất có thể ghi | Reset theo nguồn |

Ví dụ: const total = computed(() => price() * quantity()); total tự invalid khi một dependency thay đổi. Với ChangeDetectionStrategy.OnPush, Angular kiểm tra component theo tín hiệu đầu vào, event và các trigger phù hợp; zoneless có thể cấu hình bằng provideZonelessChangeDetection().

Lỗi thường gặp: gọi effect để cập nhật một signal khác thay vì dùng computed; sửa object bên trong signal mà không set/update; cho rằng OnPush có nghĩa là không bao giờ kiểm tra component; bật zoneless nhưng giữ cách cập nhật không phát tín hiệu cho Angular.
'''

[[modules]]
id = "ng-di"
title = "Dependency Injection & Service"
description = "inject(), provider scope, hierarchical injector và InjectionToken."
sources = ["angular/guide/di", "angular/guide/di/defining-dependency-providers", "angular/guide/di/hierarchical-dependency-injection", "angular/api/core/inject", "angular/api/core/injectable", "angular/api/core/injectiontoken"]
lesson = '''
### Dependency injection
Service tách logic dùng lại khỏi component. @Injectable({providedIn: 'root'}) thường tạo một instance dùng chung ở root injector; provider đặt ở component hoặc route tạo phạm vi con và có thể ghi đè dependency cho nhánh đó. inject() dùng trong injection context như field initializer, constructor hoặc provider factory.

| Cách khai báo | Phạm vi thường gặp | Dùng khi |
|---|---|---|
| providedIn: 'root' | Toàn ứng dụng | Service dùng chung |
| providers ở route | Nhánh route | Trạng thái theo khu vực |
| providers ở component | Component và hậu duệ | Trạng thái theo cây view |
| InjectionToken | Giá trị không có class runtime | Cấu hình hoặc interface |

Ví dụ: export const API_URL = new InjectionToken<string>('api-url'); sau đó cung cấp giá trị theo môi trường và inject(API_URL) tại service. Injector con tìm provider cục bộ trước, rồi tiếp tục lên cha.

Lỗi thường gặp: cung cấp cùng service ở component làm mỗi component có instance riêng; tạo InjectionToken mới ở nhiều nơi thay vì chia sẻ cùng token; gọi inject() tùy ý trong hàm không thuộc injection context; nhầm provider scope với quyền truy cập bảo mật.
'''

[[modules]]
id = "ng-router-forms"
title = "Router & Forms"
description = "Route config, lazy component, guard/resolver dạng hàm và typed reactive forms."
sources = ["angular/guide/routing/define-routes", "angular/guide/routing/route-guards", "angular/guide/routing/data-resolvers", "angular/api/router/route", "angular/api/router/canactivatefn", "angular/api/router/resolvefn", "angular/guide/forms/reactive-forms", "angular/guide/forms/typed-forms", "angular/api/forms/formcontrol", "angular/api/forms/formgroup", "angular/api/forms/validators"]
lesson = '''
### Điều hướng và biểu mẫu
Routes ánh xạ URL đến component; loadComponent tải component độc lập khi cần, còn guard quyết định có điều hướng được không và resolver chuẩn bị dữ liệu trước khi kích hoạt route. Guard phía client cải thiện trải nghiệm nhưng không thay thế kiểm tra quyền ở server.

| Công cụ | Trách nhiệm |
|---|---|
| loadComponent | Lazy load một component |
| CanActivateFn | Cho phép, từ chối hoặc redirect |
| ResolveFn | Nạp dữ liệu trước khi route hoạt động |
| FormControl / FormGroup | Trạng thái và giá trị biểu mẫu |
| Validators | Quy tắc kiểm tra tại client |

Ví dụ: const routes = [{ path: 'profile', loadComponent: () => import('./profile').then(m => m.Profile) }]. Reactive forms typed suy ra kiểu từ FormControl và FormGroup; dùng nonNullable khi giá trị không được phép trở thành null.

Lỗi thường gặp: viết guard chỉ trả false khi cần redirect có URL; nhúng toàn bộ dữ liệu lớn vào route config; dùng any hoặc UntypedFormGroup làm mất kiểm tra kiểu; coi validator ở trình duyệt là biện pháp bảo vệ dữ liệu duy nhất.
'''

[[modules]]
id = "rxjs-core"
title = "RxJS căn bản"
description = "Observable, Observer, Subscription, Subject, cold/hot và pipeable operators."
sources = ["rxjs/guide/observable", "rxjs/guide/observer", "rxjs/guide/subscription", "rxjs/guide/subject", "rxjs/api/operators/map", "rxjs/api/operators/filter", "rxjs/api/operators/take"]
lesson = '''
### Observable và subscription
Observable mô tả một luồng có thể phát 0-n giá trị rồi complete hoặc error. subscribe() bắt đầu nhận dữ liệu và trả Subscription để hủy; teardown giải phóng timer, listener hoặc kết nối khi hoàn tất hay unsubscribe. Pipeable operator nhận Observable và trả Observable mới.

| Khái niệm | Ý nghĩa |
|---|---|
| Observable | Nguồn dữ liệu theo thời gian |
| Observer | Bộ xử lý next, error, complete |
| Subscription | Quyền nhận dữ liệu có thể hủy |
| Subject | Vừa phát dữ liệu vừa là Observable |

Ví dụ: source.pipe(map(x => x * 2), filter(x => x > 4), take(3)). Hai lần subscribe vào cold Observable thường chạy hai producer riêng; hot Observable có thể chia sẻ nguồn phát đang diễn ra.

Lỗi thường gặp: quên unsubscribe luồng sống lâu; cho rằng mọi Observable đều async; dùng Subject làm trạng thái hiện tại dù người subscribe muộn cần giá trị gần nhất; bỏ qua nhánh error khiến lỗi khó quan sát.
'''

[[modules]]
id = "rxjs-angular"
title = "RxJS nâng cao & Angular"
description = "Higher-order mapping, debounce, kết hợp luồng, lifecycle và tích hợp HTTP/signals."
sources = ["rxjs/api/operators/switchmap", "rxjs/api/operators/mergemap", "rxjs/api/operators/concatmap", "rxjs/api/operators/exhaustmap", "rxjs/api/operators/debouncetime", "rxjs/api/operators/combinelatest", "rxjs/api/operators/catcherror", "rxjs/api/operators/retry", "angular/api/core/rxjs-interop/takeuntildestroyed", "angular/api/core/rxjs-interop/tosignal", "angular/api/core/rxjs-interop/toobservable", "angular/api/common/http/httpclient", "angular/guide/http/setup", "angular/guide/http/interceptors"]
lesson = '''
### Chọn toán tử theo hành vi
Higher-order operator quyết định cách xử lý Observable con. switchMap hủy luồng con trước khi chuyển sang luồng mới; mergeMap chạy song song; concatMap xếp hàng; exhaustMap bỏ qua đầu vào mới khi luồng con hiện tại còn chạy. debounceTime đợi khoảng lặng trước khi phát giá trị mới nhất.

| Toán tử | Hành vi | Ví dụ |
|---|---|---|
| switchMap | Chỉ giữ luồng mới nhất | Tìm kiếm theo từ khóa |
| mergeMap | Xử lý đồng thời | Tải nhiều ảnh độc lập |
| concatMap | Tuần tự, giữ thứ tự | Gửi lần lượt các lệnh |
| exhaustMap | Bỏ lần gọi trùng khi đang bận | Chặn submit lặp |

combineLatest phát khi mỗi nguồn đã có giá trị; forkJoin chờ tất cả nguồn hoàn tất rồi phát kết quả cuối. catchError thay luồng lỗi bằng luồng khác; retry có thể chạy lại nguồn nên cần cân nhắc tác dụng phụ. Trong Angular, takeUntilDestroyed gắn vòng đời subscription với context; toSignal/toObservable đổi dạng tín hiệu; HttpClient dùng interceptor hàm để xử lý request chung.

Lỗi thường gặp: dùng switchMap cho thao tác ghi không được phép hủy; retry request không idempotent; gọi toSignal nhiều lần cho cùng nguồn; quên đăng ký interceptor hoặc xử lý lỗi ở sai tầng.
'''

[[modules]]
id = "angular-dv-http"
title = "HTTP & dữ liệu từ máy chủ"
description = "Cấu hình HttpClient, luồng request, interceptor, httpResource và xử lý lỗi."
sources = ["angular/guide/http", "angular/guide/http/setup", "angular/guide/http/making-requests", "angular/guide/http/interceptors", "angular/guide/http/http-resource", "angular/api/common/http/httpclient"]
lesson = '''
### Gọi API trong Angular
HttpClient cung cấp các phương thức có kiểu cho request và trả về Observable. Request thường chỉ được gửi khi có subscription; subscribe lần nữa thường tạo một lần gọi mới. Kiểu generic như get<User>() giúp TypeScript kiểm tra cách dùng ở thời điểm biên dịch, nhưng không xác thực JSON thực tế nhận từ mạng. Khi dữ liệu ngoài hệ thống cần tin cậy, hãy kiểm tra cấu trúc tại ranh giới ứng dụng.

| Công cụ | Vai trò | Lưu ý |
|---|---|---|
| HttpClient | Tạo request và nhận response | Observable có thể hủy |
| HttpParams / HttpHeaders | Xây query và header | API bất biến, cần giữ giá trị trả về |
| Functional interceptor | Áp dụng chính sách chung | Đăng ký qua cấu hình HttpClient |
| httpResource | Đọc dữ liệu phản ứng trong UI | Phù hợp với trạng thái tải/lỗi/dữ liệu |

Ví dụ tìm kiếm: khi từ khóa đổi, switchMap có thể thay request cũ bằng request mới; unsubscribe khỏi request đang chạy cho phép backend hủy việc chờ kết quả. Với một form ghi dữ liệu, cần tránh retry mù vì server có thể đã xử lý request dù client chưa nhận response. catchError nên đặt đúng tầng: bắt lỗi bên trong từng lần tìm kiếm giúp luồng từ khóa bên ngoài tiếp tục hoạt động.

Lỗi thường gặp: tưởng generic của TypeScript là runtime schema; gọi subscribe lặp lại và vô tình gửi nhiều request; gọi params.set() nhưng bỏ qua object mới; retry mọi status hoặc mọi method; nhét xử lý lỗi riêng của màn hình vào interceptor toàn cục.
'''

[[modules]]
id = "angular-dv-ssr"
title = "SSR, prerender & hydration"
description = "Chọn chiến lược render theo route và tránh sai khác giữa máy chủ với trình duyệt."
sources = ["angular/guide/ssr", "angular/api/ssr/serverroute", "angular/api/ssr/rendermode", "angular/api/ssr/provideserverrendering", "angular/api/ssr/serverrouteprerender", "angular/api/ssr/serverrouteserver"]
lesson = '''
### Render ở server và theo từng route
Angular có thể tạo HTML ở máy chủ cho mỗi request, tạo sẵn HTML lúc build, hoặc render ở trình duyệt. Hybrid rendering cho phép chọn cách phù hợp theo route: trang nội dung ít đổi thường hợp với prerender; trang cá nhân hóa theo request thường cần server rendering; một khu vực tương tác chỉ dành cho client có thể dùng client rendering. Server rendering giúp nội dung có mặt sớm, nhưng không thay thế kiểm soát quyền truy cập ở backend.

| Chiến lược | Thời điểm tạo HTML | Trường hợp thường dùng |
|---|---|---|
| Client rendering | Trong trình duyệt | Nội dung sau đăng nhập, phụ thuộc nhiều vào client |
| Server rendering | Theo request trên server | Nội dung động cần HTML ban đầu |
| Prerender | Trong lúc build | Trang công khai, dữ liệu ổn định |
| Hydration | Sau khi HTML server tới client | Gắn hành vi Angular lên DOM đã có |

Hydration giúp trình duyệt tái sử dụng DOM được server render thay vì dựng lại toàn bộ. Để hai phía khớp nhau, template ban đầu nên xác định từ cùng dữ liệu; tránh tạo nội dung phụ thuộc ngẫu nhiên vào thời gian hoặc thứ tự không ổn định. Mã chạy trên server cũng không có sẵn các API chỉ thuộc trình duyệt như window và document. Chỉ truy cập chúng trong ngữ cảnh client phù hợp, và kiểm tra các side effect để tránh gửi request trùng khi client tiếp nhận trang.

Lỗi thường gặp: prerender route có dữ liệu riêng tư hoặc thay đổi theo từng người; đọc window ngay trong quá trình render server; dùng giá trị ngẫu nhiên khiến HTML server và client khác nhau; cho rằng SSR tự bảo vệ API hoặc tự làm trang luôn nhanh hơn.
'''

[[modules]]
id = "angular-dv-testing"
title = "Kiểm thử Angular"
description = "TestBed, kiểm thử component/service và giả lập request HTTP."
sources = ["angular/guide/testing", "angular/guide/testing/components-basics", "angular/guide/testing/services", "angular/guide/http/testing", "angular/api/core/testing/testbed", "angular/api/common/http/testing/httptestingcontroller"]
lesson = '''
### Kiểm thử hành vi component và service
TestBed tạo môi trường kiểm thử cho dependency injection và component mà không cần chạy toàn ứng dụng. Một bài kiểm thử tốt quan sát kết quả người dùng hoặc hợp đồng của service: cấu hình đầu vào, kích hoạt thay đổi, rồi xác nhận nội dung, trạng thái hay request phát sinh. Với component, ComponentFixture cung cấp instance và DOM; detectChanges() chạy binding và lifecycle cần thiết cho lượt kiểm tra.

| Công cụ | Dùng để | Ví dụ |
|---|---|---|
| TestBed | Khai báo providers và component cần kiểm thử | Cấu hình component dưới test |
| ComponentFixture | Đọc instance/DOM và kích hoạt change detection | detectChanges() |
| HttpTestingController | Bắt request mà HttpClient gửi | expectOne(), flush() |
| verify() | Phát hiện request chưa được xử lý | Gọi sau mỗi test HTTP |

Khi kiểm thử HTTP, đăng ký provideHttpClient() trước provideHttpClientTesting(), gọi phương thức service, dùng expectOne() để xác nhận URL/phương thức, rồi flush() response giả. Sau đó verify() giúp phát hiện request ngoài dự kiến. Cách này không truy cập mạng thật và cho phép kiểm tra cả trạng thái thành công lẫn lỗi. Component test nên thay dependency ngoài phạm vi bằng provider giả khi mục tiêu là hành vi component; test service riêng để kiểm tra logic dữ liệu.

Lỗi thường gặp: quên detectChanges() trước khi đọc DOM; để request giả chưa flush; chỉ kiểm tra implementation nội bộ thay vì kết quả; dùng một test khổng lồ bao trùm component, router và backend; hoặc để nhiều test dùng chung trạng thái khiến kết quả phụ thuộc thứ tự chạy.
'''

[[modules]]
id = "angular-lead"
title = "Góc nhìn Tech Lead"
description = "Ra quyết định kiến trúc Angular, hiệu năng, SSR, độ tin cậy, chiến lược test/release và chuẩn hóa cách làm trong team."
sources = ["angular/guide/signals", "angular/guide/http", "angular/guide/ssr", "angular/guide/testing", "angular/guide/di"]
lesson = '''
### Ra quyết định cho ứng dụng Angular ở quy mô team

Tech Lead bắt đầu từ kết quả cần bảo vệ: người dùng nào bị ảnh hưởng, chỉ số nào đang lệch, ràng buộc thời gian/nhân lực ra sao và quyết định có thể đảo ngược đến mức nào. Không chọn API vì nó mới hoặc vì một benchmark riêng lẻ. Hãy ghi giả định, lập đường cơ sở, thử trên một lát cắt đại diện rồi mở rộng theo cổng kiểm soát.

| Phương án | Khi hợp lý | Chi phí/rủi ro cần đo |
|---|---|---|
| Giữ hiện trạng và sửa điểm nghẽn | Phạm vi nhỏ, có số liệu tái hiện | Có thể giữ lại nợ kỹ thuật; cần đặt thời hạn xem lại |
| Chuyển dần theo feature/route | Hệ thống đang chạy, nhiều nhóm cùng phát hành | Có giai đoạn hai cách làm; cần hợp đồng tương thích và owner |
| Thay đổi đồng loạt | Ranh giới rõ, tự động hóa tốt, rollback khả thi | Phạm vi lỗi lớn; phụ thuộc test và thời gian release |

Khung đánh giá tối thiểu gồm: tác động người dùng; độ tin cậy và bảo mật; khả năng đo/rollback; tổng chi phí vận hành; độ phức tạp cho các nhóm; và mức chắc chắn của dữ liệu. Ví dụ, chọn prerender cho trang nội dung ổn định có thể giảm công việc lúc request, còn dữ liệu cá nhân hóa cần phân tích cache và ranh giới server trước khi bật SSR. Không dùng guard ở trình duyệt thay cho kiểm tra quyền ở backend. Với signals/RxJS, thống nhất ranh giới: signal cho trạng thái UI đồng bộ, Observable cho luồng bất đồng bộ cần hủy/kết hợp; ngoại lệ phải có lý do dễ review.

Checklist review trước khi duyệt thay đổi lớn:
- Có người dùng, luồng và chỉ số nền cụ thể; có phân biệt dữ liệu công khai với dữ liệu theo người dùng.
- Có kiểm thử ở đúng ranh giới: logic thuần, component/service, HTTP giả lập và smoke test cho đường phát hành.
- Có xử lý lỗi, loading/empty state, hủy request và hành vi khi dependency chậm hoặc lỗi.
- Có cách triển khai theo lát cắt, cổng dừng, rollback, người trực và dashboard sau phát hành.
- Có owner, tài liệu ngắn, kế hoạch tương thích và tiêu chí xóa mã chuyển tiếp.
- Có kiểm tra accessibility, bundle/performance và dependency theo mức rủi ro của thay đổi.

ADR mẫu ngắn:
> **Bối cảnh:** ba nhóm cùng sở hữu ứng dụng Angular; trang hướng dẫn công khai chậm ở lần tải đầu, còn dashboard cá nhân hóa phải giữ dữ liệu riêng tư.  
> **Quyết định:** prerender các route nội dung ổn định; đánh giá SSR riêng cho dashboard với cache riêng tư; giữ client rendering cho khu vực chỉ xuất hiện sau đăng nhập nếu SSR chưa đem lại lợi ích đo được.  
> **Kiểm chứng:** so sánh p75/p95, TTFB, lỗi hydration, chi phí server và lỗi truy cập dữ liệu trước/sau; thử theo nhóm route.  
> **Hoàn tác:** chuyển route thử nghiệm về client rendering nếu ngưỡng lỗi hoặc chi phí vượt ngân sách.

Các số liệu trong ADR là ước lượng cho lần thử, không phải cam kết chung: có thể đặt canary 5–10% traffic và quan sát ít nhất một chu kỳ tải đại diện; nhóm phải chọn ngưỡng theo baseline thật và mức độ rủi ro. Không áp một con số mẫu cho mọi sản phẩm.

Anti-pattern ở quy mô team gồm: big-bang migration không có đường lui; dùng shared service như kho trạng thái toàn cục không owner; interceptor chứa logic riêng của từng màn hình; retry mù request ghi; test snapshot khổng lồ thay cho hợp đồng hành vi; bỏ qua flaky test vì “CI đôi lúc đỏ”; ép mọi nhóm dùng cùng một abstraction trước khi có nhu cầu chung; và để chuẩn review chỉ tồn tại trong trí nhớ của senior. Thay vào đó, chuẩn hóa tiêu chí và ví dụ, không chuẩn hóa mọi chi tiết triển khai; theo dõi ngoại lệ và xóa dần khi đã hết lý do tồn tại.
'''

