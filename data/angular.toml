[[questions]]
id = "angular-lvc04"
module = "ng-components"
type = "code"
lang = "javascript"
difficulty = 1
tags = ["level:junior", "pipe"]
title = "Lọc danh sách theo từ khoá"
prompt = '''Viết hàm filterByName(users, query) giống logic của một pipe lọc.

- users là mảng object { id, name }.
- Trả về mảng mới chỉ gồm user có name chứa query, không phân biệt hoa thường.
- Bỏ khoảng trắng đầu/cuối của query. Nếu query rỗng thì trả về bản sao của toàn bộ mảng.
- Không làm thay đổi mảng gốc.'''
starter = '''function filterByName(users, query) {
  return users;
}'''
solution = '''function filterByName(users, query) {
  const q = (query || "").trim().toLowerCase();
  if (q === "") return users.slice();
  return users.filter(function (u) {
    return u.name.toLowerCase().indexOf(q) !== -1;
  });
}'''
tests = '''const users = [
  { id: 1, name: "Lan Nguyen" },
  { id: 2, name: "Minh Tran" },
  { id: 3, name: "Anh Lan" }
];

test("lọc không phân biệt hoa thường", function () {
  expect(filterByName(users, "LAN").map(function (u) { return u.id; })).toEqual([1, 3]);
});

test("bỏ khoảng trắng của query", function () {
  expect(filterByName(users, "  minh ").length).toBe(1);
});

test("query rỗng trả bản sao", function () {
  const result = filterByName(users, "");
  expect(result).toEqual(users);
  expect(result === users).toBe(false);
});

test("không khớp trả mảng rỗng", function () {
  expect(filterByName(users, "zzz")).toEqual([]);
});'''
hints = ["Chuẩn hoá query bằng trim() và toLowerCase().", "Dùng filter, không dùng sort hay splice trên mảng gốc."]
explanation = "Logic lọc thuần, không mutate đầu vào, là nền tảng cho pipe hoặc computed lọc danh sách trong Angular."
sources = ["angular/guide/templates/pipes"]

