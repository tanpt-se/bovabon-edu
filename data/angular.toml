[[questions]]
id = "ng-c03"
module = "ng-di"
type = "code"
difficulty = 2
tags = ["level:middle"]
lang = "javascript"
title = "Injector cha và con"
prompt = '''
Viết createInjector(providers, parent) cho DI container nhỏ bằng JavaScript thuần.

- providers là danh sách cặp [token, value].
- injector.get(token) trả provider gần nhất; nếu không có ở injector hiện tại thì tra lên parent.
- Nếu không có provider trong cả cây, ném Error.
- injector.createChild(providers) tạo injector con; provider con có thể che token từ cha.
- Giá trị đã cung cấp phải giữ nguyên identity khi được lấy nhiều lần.
'''
starter = '''
function createInjector(providers, parent) {
  return {
    get: function (token) { return undefined; },
    createChild: function (childProviders) { return createInjector(childProviders, parent); }
  };
}
'''
solution = '''
function createInjector(providers, parent) {
  const values = new Map(providers || []);
  const injector = {
    get: function (token) {
      if (values.has(token)) return values.get(token);
      if (parent) return parent.get(token);
      throw new Error('No provider for ' + String(token));
    },
    createChild: function (childProviders) {
      return createInjector(childProviders, injector);
    }
  };
  return injector;
}
'''
tests = '''
test('reads a local provider', function () {
  const token = {};
  const instance = {};
  const injector = createInjector([[token, instance]]);
  expect(injector.get(token)).toBe(instance);
});

test('falls back to a parent provider', function () {
  const token = 'config';
  const parent = createInjector([[token, 7]]);
  expect(parent.createChild([]).get(token)).toBe(7);
});

test('child provider shadows parent', function () {
  const token = 'service';
  const parent = createInjector([[token, 'parent']]);
  const child = parent.createChild([[token, 'child']]);
  expect(child.get(token)).toBe('child');
  expect(parent.get(token)).toBe('parent');
});

test('throws when no injector provides the token', function () {
  const child = createInjector([], createInjector([], null));
  expect(function () { child.get('missing'); }).toThrow();
});
'''
hints = ["Dùng Map để hỗ trợ token object và kiểm tra sự tồn tại chính xác.", "Đóng tham chiếu injector hiện tại vào createChild để cây cha-con giữ đúng scope."]
explanation = "Injector tra cứu từ scope gần nhất lên cha và giữ provider cục bộ theo từng injector."
sources = ["angular/guide/di/hierarchical-dependency-injection", "angular/api/core/injector"]

