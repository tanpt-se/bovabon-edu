[[questions]]
id = "angular-lvc03"
module = "rxjs-angular"
type = "code"
lang = "javascript"
difficulty = 3
tags = ["level:senior", "async"]
title = "Chỉ giữ kết quả mới nhất (kiểu switchMap)"
prompt = '''Viết latestOnly(asyncFn) trả về hàm mới. Mỗi lần gọi hàm mới sẽ gọi asyncFn(...args) và trả Promise.

- Nếu một lời gọi cũ hoàn thành sau khi đã có lời gọi mới hơn, Promise của lời gọi cũ phải resolve với giá trị undefined (kết quả bị bỏ qua).
- Lời gọi mới nhất resolve với kết quả thật.
- Lỗi của lời gọi mới nhất phải được ném tiếp (reject); lỗi của lời gọi cũ bị bỏ qua (resolve undefined).'''
starter = '''function latestOnly(asyncFn) {
  return function () {
    return asyncFn.apply(null, arguments);
  };
}'''
solution = '''function latestOnly(asyncFn) {
  let latest = 0;
  return function () {
    const id = ++latest;
    return Promise.resolve(asyncFn.apply(null, arguments)).then(
      function (value) {
        return id === latest ? value : undefined;
      },
      function (error) {
        if (id === latest) throw error;
        return undefined;
      }
    );
  };
}'''
tests = '''function deferred() {
  const d = {};
  d.promise = new Promise(function (resolve, reject) { d.resolve = resolve; d.reject = reject; });
  return d;
}

test("lời gọi đơn lẻ trả kết quả", function () {
  const fn = latestOnly(function (x) { return Promise.resolve(x * 2); });
  return fn(4).then(function (v) { expect(v).toBe(8); });
});

test("kết quả cũ về sau bị bỏ qua", function () {
  const d1 = deferred();
  const d2 = deferred();
  const queue = [d1, d2];
  const fn = latestOnly(function () { return queue.shift().promise; });
  const first = fn();
  const second = fn();
  d2.resolve("new");
  d1.resolve("old");
  return Promise.all([first, second]).then(function (r) {
    expect(r[0]).toBe(undefined);
    expect(r[1]).toBe("new");
  });
});

test("lỗi của lời gọi mới nhất được ném", function () {
  const fn = latestOnly(function () { return Promise.reject(new Error("boom")); });
  return fn().then(function () { throw new Error("should fail"); }, function (e) { expect(e.message).toBe("boom"); });
});

test("lỗi của lời gọi cũ bị bỏ qua", function () {
  const d1 = deferred();
  const queue = [d1.promise, Promise.resolve("ok")];
  const fn = latestOnly(function () { return queue.shift(); });
  const a = fn();
  const b = fn();
  d1.reject(new Error("old"));
  return Promise.all([a, b]).then(function (r) {
    expect(r[0]).toBe(undefined);
    expect(r[1]).toBe("ok");
  });
});'''
hints = ["Giữ một bộ đếm tăng dần; mỗi lời gọi nhớ id của mình.", "Khi Promise xong, so id với bộ đếm hiện tại để biết còn là mới nhất hay không."]
explanation = "Đây là ngữ nghĩa của switchMap: chỉ kết quả của lời gọi mới nhất được dùng, tránh response cũ ghi đè kết quả mới."
sources = ["rxjs/api/operators/switchmap"]

