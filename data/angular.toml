[[questions]]
id = "ng-c05"
module = "rxjs-angular"
type = "code"
difficulty = 3
lang = "javascript"
title = "switchMap hủy inner cũ"
prompt = '''
Viết MiniObservable và switchMap(project) bằng JavaScript thuần.

- Observable constructor nhận producer(observer), subscribe(next, error, complete) trả subscription unsubscribe().
- switchMap chỉ chuyển tiếp giá trị từ inner Observable mới nhất.
- Mỗi outer value mới phải unsubscribe inner trước đó và chạy teardown của inner đó.
- Khi outer hoàn tất, chỉ complete downstream sau khi inner hiện tại hoàn tất.
- Unsubscribe downstream phải hủy outer và inner hiện tại.
'''
starter = '''
class MiniObservable {
  constructor(producer) { this.producer = producer; }
  subscribe(next) { this.producer({ next: next }); return { unsubscribe: function () {} }; }
  pipe(operator) { return operator(this); }
}
function switchMap(project) {
  return function (source) { return new MiniObservable(function (observer) {
    return source.subscribe(observer.next);
  }); };
}
'''
solution = '''
class MiniObservable {
  constructor(producer) { this.producer = producer; }
  subscribe(next, error, complete) {
    let stopped = false;
    let teardown;
    let closed = false;
    const subscription = {
      get closed() { return closed; },
      unsubscribe: function () {
        if (closed) return;
        closed = true;
        if (typeof teardown === 'function') teardown();
        else if (teardown && typeof teardown.unsubscribe === 'function') teardown.unsubscribe();
      }
    };
    const observer = {
      next: function (value) { if (!stopped && !closed && next) next(value); },
      error: function (reason) {
        if (stopped || closed) return;
        stopped = true;
        if (error) error(reason);
        subscription.unsubscribe();
      },
      complete: function () {
        if (stopped || closed) return;
        stopped = true;
        if (complete) complete();
        subscription.unsubscribe();
      }
    };
    const result = this.producer(observer);
    if (closed) {
      if (typeof result === 'function') result();
      else if (result && typeof result.unsubscribe === 'function') result.unsubscribe();
    } else {
      teardown = result;
    }
    return subscription;
  }
  pipe(operator) { return operator(this); }
}

function switchMap(project) {
  return function (source) {
    return new MiniObservable(function (observer) {
      let outerSub;
      let innerSub = null;
      let innerActive = false;
      let outerDone = false;
      let index = 0;
      outerSub = source.subscribe(function (value) {
        const current = ++index;
        if (innerSub) innerSub.unsubscribe();
        innerSub = null;
        innerActive = true;
        const candidate = project(value).subscribe(function (innerValue) {
          if (current === index) observer.next(innerValue);
        }, observer.error, function () {
          if (current !== index) return;
          innerActive = false;
          innerSub = null;
          if (outerDone) observer.complete();
        });
        if (current === index && !candidate.closed) innerSub = candidate;
      }, observer.error, function () {
        outerDone = true;
        if (!innerActive) observer.complete();
      });
      return function () {
        if (outerSub) outerSub.unsubscribe();
        if (innerSub) innerSub.unsubscribe();
      };
    });
  };
}
'''
tests = '''
test('new outer value cancels old timer and only latest value emits', function () {
  jest.useFakeTimers();
  let emit;
  const values = [];
  const source = new MiniObservable(function (observer) { emit = observer.next; });
  source.pipe(switchMap(function (item) {
    return new MiniObservable(function (observer) {
      const id = setTimeout(function () { observer.next(item.value); observer.complete(); }, item.delay);
      return function () { clearTimeout(id); };
    });
  })).subscribe(function (value) { values.push(value); });
  emit({ value: 'old', delay: 20 });
  jest.advanceTimersByTime(5);
  emit({ value: 'new', delay: 10 });
  jest.advanceTimersByTime(10);
  expect(values).toEqual(['new']);
});

test('switching runs teardown on the previous inner', function () {
  let emit;
  let cleaned = 0;
  const source = new MiniObservable(function (observer) { emit = observer.next; });
  const sub = source.pipe(switchMap(function () {
    return new MiniObservable(function () { return function () { cleaned += 1; }; });
  })).subscribe(function () {});
  emit(1);
  emit(2);
  expect(cleaned).toBe(1);
  sub.unsubscribe();
  expect(cleaned).toBe(2);
});

test('outer completion waits for the active inner', function () {
  jest.useFakeTimers();
  let send;
  let finish;
  let completed = false;
  const source = new MiniObservable(function (observer) { send = observer.next; finish = observer.complete; });
  source.pipe(switchMap(function (value) {
    return new MiniObservable(function (observer) {
      const id = setTimeout(function () { observer.next(value); observer.complete(); }, 4);
      return function () { clearTimeout(id); };
    });
  })).subscribe(function () {}, function () {}, function () { completed = true; });
  send(8);
  finish();
  expect(completed).toBe(false);
  jest.advanceTimersByTime(4);
  expect(completed).toBe(true);
});

test('downstream unsubscribe cancels the active inner timer', function () {
  jest.useFakeTimers();
  let emit;
  const values = [];
  const source = new MiniObservable(function (observer) { emit = observer.next; });
  const sub = source.pipe(switchMap(function (value) {
    return new MiniObservable(function (observer) {
      const id = setTimeout(function () { observer.next(value); }, 5);
      return function () { clearTimeout(id); };
    });
  })).subscribe(function (value) { values.push(value); });
  emit('skip');
  sub.unsubscribe();
  jest.advanceTimersByTime(5);
  expect(values).toEqual([]);
});
'''
hints = ["Lưu inner subscription hiện tại và tăng chỉ số mỗi khi outer phát giá trị mới.", "Outer complete không có nghĩa downstream complete nếu inner hiện tại còn chạy."]
explanation = "switchMap đổi sang inner mới bằng cách hủy subscription inner cũ, tránh đưa kết quả lỗi thời tới consumer."
