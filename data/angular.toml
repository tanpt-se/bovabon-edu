[[questions]]
id = "angular-lvc05"
module = "angular-dv-http"
type = "code"
lang = "javascript"
difficulty = 2
tags = ["level:middle", "http"]
title = "Tính thời gian chờ retry với exponential backoff"
prompt = '''Viết hàm backoffDelay(attempt, baseMs, maxMs) cho chiến lược retry.

- attempt bắt đầu từ 1 (lần retry thứ nhất).
- Độ trễ = baseMs * 2^(attempt - 1), nhưng không vượt maxMs.
- attempt nhỏ hơn 1 được coi như 1.
- Trả về số nguyên (miligiây).'''
starter = '''function backoffDelay(attempt, baseMs, maxMs) {
  return baseMs;
}'''
solution = '''function backoffDelay(attempt, baseMs, maxMs) {
  const n = Math.max(1, Math.floor(attempt));
  const delay = baseMs * Math.pow(2, n - 1);
  return Math.min(delay, maxMs);
}'''
tests = '''test("lần đầu bằng baseMs", function () {
  expect(backoffDelay(1, 200, 5000)).toBe(200);
});

test("tăng gấp đôi mỗi lần", function () {
  expect(backoffDelay(2, 200, 5000)).toBe(400);
  expect(backoffDelay(3, 200, 5000)).toBe(800);
});

test("không vượt maxMs", function () {
  expect(backoffDelay(10, 200, 5000)).toBe(5000);
});

test("attempt nhỏ hơn 1 coi như 1", function () {
  expect(backoffDelay(0, 100, 1000)).toBe(100);
  expect(backoffDelay(-3, 100, 1000)).toBe(100);
});'''
hints = ["Dùng Math.pow(2, attempt - 1).", "Kết hợp Math.min với maxMs."]
explanation = "Backoff tăng cấp số nhân giúp giảm tải cho server khi lỗi tạm thời; giới hạn tối đa tránh chờ quá lâu."
sources = ["angular/guide/http/making-requests"]
