[[questions]]
id = "angular-lvc02"
module = "angular-lead"
type = "code"
lang = "javascript"
difficulty = 3
tags = ["level:lead", "release"]
title = "Chia người dùng cho canary release"
prompt = '''Viết hàm isInRollout(userId, percent) quyết định người dùng có thuộc nhóm canary hay không.

- userId là chuỗi; percent là số từ 0 đến 100.
- Kết quả phải xác định: cùng userId và percent luôn cho cùng kết quả.
- percent = 0: không ai thuộc nhóm; percent = 100: mọi người đều thuộc nhóm.
- Tính tăng dần: nếu một user thuộc nhóm ở percent p thì vẫn thuộc nhóm ở mọi percent lớn hơn p.
- Gợi ý: băm userId thành bucket từ 0 đến 99 và so sánh bucket < percent. Dùng băm chuỗi đơn giản, không cần mật mã.'''
starter = '''function isInRollout(userId, percent) {
  return false;
}'''
solution = '''function bucketOf(userId) {
  let hash = 0;
  for (let i = 0; i < userId.length; i++) {
    hash = (hash * 31 + userId.charCodeAt(i)) % 1000003;
  }
  return hash % 100;
}

function isInRollout(userId, percent) {
  return bucketOf(String(userId)) < percent;
}'''
tests = '''test("percent 0 không chọn ai", function () {
  for (let i = 0; i < 50; i++) {
    expect(isInRollout("user-" + i, 0)).toBe(false);
  }
});

test("percent 100 chọn tất cả", function () {
  for (let i = 0; i < 50; i++) {
    expect(isInRollout("user-" + i, 100)).toBe(true);
  }
});

test("kết quả xác định", function () {
  expect(isInRollout("alice", 30)).toBe(isInRollout("alice", 30));
});

test("tăng dần khi tăng percent", function () {
  for (let i = 0; i < 100; i++) {
    const id = "u" + i;
    let was = false;
    for (let p = 0; p <= 100; p += 10) {
      const now = isInRollout(id, p);
      if (was) expect(now).toBe(true);
      was = now;
    }
  }
});

test("percent 50 chọn khoảng một nửa", function () {
  let count = 0;
  for (let i = 0; i < 1000; i++) {
    if (isInRollout("user-" + i, 50)) count++;
  }
  expect(count > 350 && count < 650).toBe(true);
});'''
hints = ["Băm chuỗi bằng vòng lặp charCodeAt rồi lấy phần dư cho 100.", "So sánh bucket < percent để có tính tăng dần."]
explanation = "Chia nhóm xác định theo băm userId giúp mỗi người luôn thấy cùng một phiên bản và cho phép tăng dần tỉ lệ canary mà không đổi người đã được chọn."
sources = ["angular/guide/ssr"]

