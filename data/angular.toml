[[questions]]
id = "angular-lvc01"
module = "angular-lead"
type = "code"
lang = "javascript"
difficulty = 3
tags = ["level:lead", "ssr"]
title = "Chọn chế độ render theo route"
prompt = '''Team muốn quy tắc render rõ ràng cho từng route. Viết hàm chooseRenderMode(route) trả về "csr", "ssr" hoặc "prerender".

route có dạng { requiresAuth: boolean, seo: boolean, personalized: boolean, updatesPerDay: number }.

- Route cần đăng nhập (requiresAuth) và không cần SEO: "csr".
- Route cần SEO mà nội dung cá nhân hoá (personalized) hoặc đổi từ 24 lần/ngày trở lên: "ssr".
- Route cần SEO, không cá nhân hoá và đổi ít hơn 24 lần/ngày: "prerender".
- Các trường hợp còn lại (không SEO, không cần đăng nhập): "csr".
- Route cần SEO thì ưu tiên các quy tắc SEO kể cả khi requiresAuth là true và personalized là true: "ssr".'''
starter = '''function chooseRenderMode(route) {
  return "csr";
}'''
solution = '''function chooseRenderMode(route) {
  if (route.seo) {
    if (route.personalized || route.updatesPerDay >= 24) return "ssr";
    return "prerender";
  }
  return "csr";
}'''
tests = '''test("trang marketing tĩnh được prerender", function () {
  expect(chooseRenderMode({ requiresAuth: false, seo: true, personalized: false, updatesPerDay: 0 })).toBe("prerender");
});

test("trang SEO đổi liên tục dùng ssr", function () {
  expect(chooseRenderMode({ requiresAuth: false, seo: true, personalized: false, updatesPerDay: 24 })).toBe("ssr");
});

test("trang SEO cá nhân hoá dùng ssr", function () {
  expect(chooseRenderMode({ requiresAuth: false, seo: true, personalized: true, updatesPerDay: 1 })).toBe("ssr");
});

test("trang sau đăng nhập không SEO dùng csr", function () {
  expect(chooseRenderMode({ requiresAuth: true, seo: false, personalized: true, updatesPerDay: 100 })).toBe("csr");
});

