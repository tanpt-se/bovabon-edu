[[questions]]
id = "angular-dvc01"
module = "angular-dv-http"
type = "code"
lang = "javascript"
difficulty = 2
title = "Quyết định retry request HTTP"
prompt = '''Viết hàm shouldRetryHttp(method, status) cho chính sách retry tự động bảo thủ. Trả về true chỉ khi method là GET, HEAD, PUT, DELETE hoặc OPTIONS và status là 408, 429, 500, 502, 503 hoặc 504. Method có thể viết thường hoặc hoa. Mọi tổ hợp khác trả về false; chính sách này không xét Idempotency-Key cho POST.'''
starter = '''function shouldRetryHttp(method, status) {
  return false;
}'''
solution = '''function shouldRetryHttp(method, status) {
  const methodName = method.toUpperCase();
  const retryableMethods = ["GET", "HEAD", "PUT", "DELETE", "OPTIONS"];
  const transientStatuses = [408, 429, 500, 502, 503, 504];
  return retryableMethods.includes(methodName) && transientStatuses.includes(status);
}'''
tests = '''test("cho phép GET với lỗi tạm thời", function () {
  expect(shouldRetryHttp("GET", 503)).toBe(true);
});

test("không phân biệt hoa thường của method", function () {
  expect(shouldRetryHttp("put", 429)).toBe(true);
});

test("không retry POST dù server lỗi tạm thời", function () {
  expect(shouldRetryHttp("POST", 503)).toBe(false);
});

test("không retry lỗi không thuộc nhóm tạm thời", function () {
  expect(shouldRetryHttp("GET", 404)).toBe(false);
});

test("không retry method không được cho phép", function () {
  expect(shouldRetryHttp("PATCH", 500)).toBe(false);
});'''
hints = ["Chuẩn hóa method bằng toUpperCase() trước khi so sánh.", "Dùng hai danh sách cho phép và chỉ trả true khi cả method lẫn status đều khớp."]
explanation = "Retry tự động cần tính đến tính lặp an toàn của method và các status có thể chỉ ra lỗi tạm thời."
sources = ["angular/guide/http/making-requests", "angular/api/common/http/httpclient"]

