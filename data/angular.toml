[[questions]]
id = "ng-c05"
module = "rxjs-angular"
type = "code"
difficulty = 3
tags = ["level:senior"]
lang = "javascript"
title = "switchMap hủy inner cũ"
prompt = '''
Viết MiniObservable và switchMap(project) bằng JavaScript thuần.

- Observable constructor nhận producer(observer), subscribe(next, error, complete) trả subscription unsubscribe().
- switchMap chỉ chuyển tiếp giá trị từ inner Observable mới nhất.
- Mỗi outer value mới phải unsubscribe inner trước đó và chạy teardown của inner đó.
- Khi outer hoàn tất, chỉ complete downstream sau khi inner hiện tại hoàn tất.
- Unsubscribe downstream phải hủy outer và inner hiện tại.
'''
starter = '''
class MiniObservable {
  constructor(producer) { this.producer = producer; }
  subscribe(next) { this.producer({ next: next }); return { unsubscribe: function () {} }; }
  pipe(operator) { return operator(this); }
}
function switchMap(project) {
  return function (source) { return new MiniObservable(function (observer) {
    return source.subscribe(observer.next);
  }); };
}
'''
solution = '''
class MiniObservable {
  constructor(producer) { this.producer = producer; }
  subscribe(next, error, complete) {
    let stopped = false;
    let teardown;
    let closed = false;
    const subscription = {
      get closed() { return closed; },
      unsubscribe: function () {
        if (closed) return;
        closed = true;
        if (typeof teardown === 'function') teardown();
        else if (teardown && typeof teardown.unsubscribe === 'function') teardown.unsubscribe();
      }
    };
    const observer = {
      next: function (value) { if (!stopped && !closed && next) next(value); },
      error: function (reason) {
        if (stopped || closed) return;
        stopped = true;
        if (error) error(reason);
        subscription.unsubscribe();
      },
      complete: function () {
        if (stopped || closed) return;
        stopped = true;
        if (complete) complete();
        subscription.unsubscribe();
      }
    };
    const result = this.producer(observer);
    if (closed) {
      if (typeof result === 'function') result();
      else if (result && typeof result.unsubscribe === 'function') result.unsubscribe();
    } else {
      teardown = result;
    }
    return subscription;
  }
  pipe(operator) { return operator(this); }
}

function switchMap(project) {
  return function (source) {
    return new MiniObservable(function (observer) {
      let outerSub;
      let innerSub = null;
      let innerActive = false;
      let outerDone = false;
      let index = 0;
      outerSub = source.subscribe(function (value) {
        const current = ++index;
        if (innerSub) innerSub.unsubscribe();
        innerSub = null;
        innerActive = true;
        const candidate = project(value).subscribe(function (innerValue) {
          if (current === index) observer.next(innerValue);
        }, observer.error, function () {
          if (current !== index) return;
          innerActive = false;
          innerSub = null;
          if (outerDone) observer.complete();
        });
        if (current === index && !candidate.closed) innerSub = candidate;
      }, observer.error, function () {
        outerDone = true;
        if (!innerActive) observer.complete();
      });
      return function () {
        if (outerSub) outerSub.unsubscribe();
        if (innerSub) innerSub.unsubscribe();
      };
    });
  };
}
'''
tests = '''
test('new outer value cancels old timer and only latest value emits', function () {
  jest.useFakeTimers();
  let emit;
  const values = [];
  const source = new MiniObservable(function (observer) { emit = observer.next; });
  source.pipe(switchMap(function (item) {
    return new MiniObservable(function (observer) {
      const id = setTimeout(function () { observer.next(item.value); observer.complete(); }, item.delay);
      return function () { clearTimeout(id); };
    });
  })).subscribe(function (value) { values.push(value); });
  emit({ value: 'old', delay: 20 });
  jest.advanceTimersByTime(5);
  emit({ value: 'new', delay: 10 });
  jest.advanceTimersByTime(10);
  expect(values).toEqual(['new']);
});

test('switching runs teardown on the previous inner', function () {
  let emit;
  let cleaned = 0;
  const source = new MiniObservable(function (observer) { emit = observer.next; });
  const sub = source.pipe(switchMap(function () {
    return new MiniObservable(function () { return function () { cleaned += 1; }; });
  })).subscribe(function () {});
  emit(1);
  emit(2);
  expect(cleaned).toBe(1);
  sub.unsubscribe();
  expect(cleaned).toBe(2);
});

test('outer completion waits for the active inner', function () {
  jest.useFakeTimers();
  let send;
  let finish;
  let completed = false;
  const source = new MiniObservable(function (observer) { send = observer.next; finish = observer.complete; });
  source.pipe(switchMap(function (value) {
    return new MiniObservable(function (observer) {
      const id = setTimeout(function () { observer.next(value); observer.complete(); }, 4);
      return function () { clearTimeout(id); };
    });
  })).subscribe(function () {}, function () {}, function () { completed = true; });
  send(8);
  finish();
  expect(completed).toBe(false);
  jest.advanceTimersByTime(4);
  expect(completed).toBe(true);
});

test('downstream unsubscribe cancels the active inner timer', function () {
  jest.useFakeTimers();
  let emit;
  const values = [];
  const source = new MiniObservable(function (observer) { emit = observer.next; });
  const sub = source.pipe(switchMap(function (value) {
    return new MiniObservable(function (observer) {
      const id = setTimeout(function () { observer.next(value); }, 5);
      return function () { clearTimeout(id); };
    });
  })).subscribe(function (value) { values.push(value); });
  emit('skip');
  sub.unsubscribe();
  jest.advanceTimersByTime(5);
  expect(values).toEqual([]);
});
'''
hints = ["Lưu inner subscription hiện tại và tăng chỉ số mỗi khi outer phát giá trị mới.", "Outer complete không có nghĩa downstream complete nếu inner hiện tại còn chạy."]
explanation = "switchMap đổi sang inner mới bằng cách hủy subscription inner cũ, tránh đưa kết quả lỗi thời tới consumer."
sources = ["rxjs/api/operators/switchmap", "rxjs/guide/subscription"]

[[questions]]
id = "ng-c06"
module = "rxjs-angular"
type = "code"
difficulty = 2
tags = ["level:middle"]
lang = "javascript"
title = "debounceTime với fake timers"
prompt = '''
Viết MiniObservable và debounceTime(delay) bằng JavaScript thuần.

- Mỗi giá trị mới hủy timer trước và bắt đầu lại khoảng chờ.
- Phát giá trị gần nhất khi không có giá trị mới trong delay mili giây.
- Khi nguồn hoàn tất, phát giá trị đang chờ ngay rồi complete.
- Khi nguồn lỗi, hủy timer và chuyển lỗi xuống observer.
- Unsubscribe phải dọn subscription nguồn và timer.
'''
starter = '''
class MiniObservable {
  constructor(producer) { this.producer = producer; }
  subscribe(next) { this.producer({ next: next }); return { unsubscribe: function () {} }; }
  pipe(operator) { return operator(this); }
}
function debounceTime(delay) {
  return function (source) { return new MiniObservable(function (observer) {
    return source.subscribe(observer.next);
  }); };
}
'''
solution = '''
class MiniObservable {
  constructor(producer) { this.producer = producer; }
  subscribe(next, error, complete) {
    let stopped = false;
    let teardown;
    let closed = false;
    const subscription = {
      get closed() { return closed; },
      unsubscribe: function () {
        if (closed) return;
        closed = true;
        if (typeof teardown === 'function') teardown();
        else if (teardown && typeof teardown.unsubscribe === 'function') teardown.unsubscribe();
      }
    };
    const observer = {
      next: function (value) { if (!stopped && !closed && next) next(value); },
      error: function (reason) {
        if (stopped || closed) return;
        stopped = true;
        if (error) error(reason);
        subscription.unsubscribe();
      },
      complete: function () {
        if (stopped || closed) return;
        stopped = true;
        if (complete) complete();
        subscription.unsubscribe();
      }
    };
    const result = this.producer(observer);
    if (closed) {
      if (typeof result === 'function') result();
      else if (result && typeof result.unsubscribe === 'function') result.unsubscribe();
    } else {
      teardown = result;
    }
    return subscription;
  }
  pipe(operator) { return operator(this); }
}

function debounceTime(delay) {
  return function (source) {
    return new MiniObservable(function (observer) {
      let timer = null;
      let latest;
      let hasValue = false;
      let sourceSub;
      sourceSub = source.subscribe(function (value) {
        latest = value;
        hasValue = true;
        if (timer !== null) clearTimeout(timer);
        timer = setTimeout(function () {
          timer = null;
          if (hasValue) {
            hasValue = false;
            observer.next(latest);
          }
        }, delay);
      }, function (reason) {
        if (timer !== null) clearTimeout(timer);
        timer = null;
        hasValue = false;
        observer.error(reason);
      }, function () {
        if (timer !== null) clearTimeout(timer);
        timer = null;
        if (hasValue) {
          hasValue = false;
          observer.next(latest);
        }
        observer.complete();
      });
      return function () {
        sourceSub.unsubscribe();
        if (timer !== null) clearTimeout(timer);
        timer = null;
      };
    });
  };
}
'''
tests = '''
test('only emits the latest value after the quiet period', function () {
  jest.useFakeTimers();
  let emit;
  const values = [];
  const source = new MiniObservable(function (observer) { emit = observer.next; });
  source.pipe(debounceTime(10)).subscribe(function (value) { values.push(value); });
  emit('a');
  jest.advanceTimersByTime(6);
  emit('b');
  jest.advanceTimersByTime(9);
  expect(values).toEqual([]);
  jest.advanceTimersByTime(1);
  expect(values).toEqual(['b']);
});

test('source completion flushes a pending value immediately', function () {
  jest.useFakeTimers();
  let emit;
  let finish;
  const values = [];
  let completed = false;
  const source = new MiniObservable(function (observer) { emit = observer.next; finish = observer.complete; });
  source.pipe(debounceTime(20)).subscribe(function (value) { values.push(value); }, function () {}, function () { completed = true; });
  emit(3);
  finish();
  expect(values).toEqual([3]);
  expect(completed).toBe(true);
});

test('source error cancels pending value, forwards error, and tears down source', function () {
  jest.useFakeTimers();
  let emit;
  let fail;
  let cleaned = 0;
  const failure = new Error('source failed');
  const values = [];
  let receivedError;
  const source = new MiniObservable(function (observer) {
    emit = observer.next;
    fail = observer.error;
    return function () { cleaned += 1; };
  });
  source.pipe(debounceTime(10)).subscribe(function (value) { values.push(value); }, function (error) { receivedError = error; });
  emit('pending');
  fail(failure);
  jest.advanceTimersByTime(10);
  expect(values).toEqual([]);
  expect(receivedError).toBe(failure);
  expect(cleaned).toBe(1);
});

test('a later value resets the previous timer', function () {
  jest.useFakeTimers();
  let emit;
  const values = [];
  const source = new MiniObservable(function (observer) { emit = observer.next; });
  source.pipe(debounceTime(5)).subscribe(function (value) { values.push(value); });
  emit(1);
  jest.advanceTimersByTime(5);
  emit(2);
  jest.advanceTimersByTime(5);
  expect(values).toEqual([1, 2]);
});

test('unsubscribe cancels pending timer and source', function () {
  jest.useFakeTimers();
  let emit;
  let cleaned = 0;
  const source = new MiniObservable(function (observer) {
    emit = observer.next;
    return function () { cleaned += 1; };
  });
  const values = [];
  const sub = source.pipe(debounceTime(7)).subscribe(function (value) { values.push(value); });
  emit('skip');
  sub.unsubscribe();
  jest.advanceTimersByTime(7);
  expect(values).toEqual([]);
  expect(cleaned).toBe(1);
});
'''
hints = ["Mỗi next phải clearTimeout trước khi tạo timer mới.", "Hoàn tất và lỗi là hai đường kết thúc khác nhau: complete flush giá trị pending, error loại bỏ nó."]
explanation = "debounceTime chờ khoảng lặng để gộp các giá trị liên tiếp và luôn xử lý timer đúng khi kết thúc."
sources = ["rxjs/api/operators/debouncetime", "rxjs/guide/subscription"]

