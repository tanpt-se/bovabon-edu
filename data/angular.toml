[[questions]]
id = "ng-c01"
module = "rxjs-core"
type = "code"
difficulty = 3
tags = ["level:senior"]
lang = "javascript"
title = "Mini Observable và pipeable operators"
prompt = '''
Hãy cài đặt JavaScript thuần gồm MiniObservable, MiniSubscription và ba pipeable operator map(project), filter(predicate), take(count).

- subscribe(next, error, complete) trả subscription có unsubscribe() và closed.
- Producer nhận observer có next, error, complete và có thể trả teardown function.
- Teardown chạy đúng một lần khi unsubscribe hoặc khi stream kết thúc.
- pipe(...operators) áp dụng operator theo thứ tự từ trái sang phải.
- take(0) hoàn tất ngay; take(n) không phát quá n giá trị và dọn subscription nguồn.
- map/filter bắt lỗi từ callback và chuyển lỗi qua error handler.
'''
starter = '''
class MiniSubscription {
  constructor() { this.closed = false; }
  unsubscribe() { this.closed = true; }
}

class MiniObservable {
  constructor(producer) { this.producer = producer; }
  subscribe(next, error, complete) {
    this.producer({ next: next, error: error, complete: complete });
    return new MiniSubscription();
  }
  pipe() { return this; }
}

function map(project) { return function (source) { return source; }; }
function filter(predicate) { return function (source) { return source; }; }
function take(count) { return function (source) { return source; }; }
'''
solution = '''
function runTeardown(teardown) {
  if (typeof teardown === 'function') teardown();
  else if (teardown && typeof teardown.unsubscribe === 'function') teardown.unsubscribe();
}

class MiniSubscription {
  constructor() {
    this.closed = false;
    this.teardowns = [];
  }
  add(teardown) {
    if (!teardown) return;
    if (this.closed) runTeardown(teardown);
    else this.teardowns.push(teardown);
  }
  unsubscribe() {
    if (this.closed) return;
    this.closed = true;
    this.teardowns.splice(0).reverse().forEach(runTeardown);
  }
}

class MiniObservable {
  constructor(producer) { this.producer = producer; }
  subscribe(next, error, complete) {
    const sub = new MiniSubscription();
    const onNext = typeof next === 'function' ? next : function () {};
    const onError = typeof error === 'function' ? error : function () {};
    const onComplete = typeof complete === 'function' ? complete : function () {};
    let stopped = false;
    const observer = {
      next: function (value) { if (!stopped && !sub.closed) onNext(value); },
      error: function (reason) {
        if (stopped || sub.closed) return;
        stopped = true;
        onError(reason);
        sub.unsubscribe();
      },
      complete: function () {
        if (stopped || sub.closed) return;
        stopped = true;
        onComplete();
        sub.unsubscribe();
      }
    };
    try {
      sub.add(this.producer(observer));
    } catch (reason) {
      observer.error(reason);
    }
    return sub;
  }
  pipe() {
    return Array.from(arguments).reduce(function (source, operator) {
      return operator(source);
    }, this);
  }
}

function map(project) {
  return function (source) {
    return new MiniObservable(function (observer) {
      return source.subscribe(function (value) {
        try { observer.next(project(value)); } catch (reason) { observer.error(reason); }
      }, observer.error, observer.complete);
    });
  };
}

function filter(predicate) {
  return function (source) {
    return new MiniObservable(function (observer) {
      return source.subscribe(function (value) {
        try { if (predicate(value)) observer.next(value); } catch (reason) { observer.error(reason); }
      }, observer.error, observer.complete);
    });
  };
}

function take(count) {
  return function (source) {
    return new MiniObservable(function (observer) {
      if (count <= 0) {
        observer.complete();
        return;
      }
      let seen = 0;
      let sourceSub;
      let stopAfterSubscribe = false;
      sourceSub = source.subscribe(function (value) {
        if (seen >= count) return;
        seen += 1;
        observer.next(value);
        if (seen === count) {
          observer.complete();
          if (sourceSub) sourceSub.unsubscribe();
          else stopAfterSubscribe = true;
        }
      }, observer.error, observer.complete);
      if (stopAfterSubscribe) sourceSub.unsubscribe();
      return sourceSub;
    });
  };
}
'''
tests = '''
test('pipe applies map and filter in order', function () {
  const values = [];
  new MiniObservable(function (observer) {
    [1, 2, 3, 4].forEach(observer.next);
    observer.complete();
  }).pipe(map(function (x) { return x * 2; }), filter(function (x) { return x > 4; }))
    .subscribe(function (value) { values.push(value); });
  expect(values).toEqual([6, 8]);
});

test('take stops after the requested number and runs teardown', function () {
  let cleaned = 0;
  const values = [];
  const source = new MiniObservable(function (observer) {
    [1, 2, 3, 4].forEach(observer.next);
    return function () { cleaned += 1; };
  });
  source.pipe(take(2)).subscribe(function (value) { values.push(value); });
  expect(values).toEqual([1, 2]);
  expect(cleaned).toBe(1);
});

test('unsubscribe is idempotent and suppresses later notifications', function () {
  let send;
  let cleaned = 0;
  const values = [];
  const sub = new MiniObservable(function (observer) {
    send = observer.next;
    return function () { cleaned += 1; };
  }).subscribe(function (value) { values.push(value); });
  sub.unsubscribe();
  sub.unsubscribe();
  send(9);
  expect(sub.closed).toBe(true);
  expect(cleaned).toBe(1);
  expect(values).toEqual([]);
});

test('map sends callback exceptions to error', function () {
  let message = '';
  new MiniObservable(function (observer) { observer.next(1); })
    .pipe(map(function () { throw new Error('bad map'); }))
    .subscribe(function () {}, function (error) { message = error.message; });
  expect(message).toBe('bad map');
});
'''
hints = ["Subscription cần nhận teardown cả khi producer kết thúc đồng bộ trước lúc trả về.", "Trong take, xử lý riêng trường hợp nguồn phát đồng bộ trước khi sourceSub được gán."]
explanation = "Bài tập mô phỏng vòng đời Observable, pipeable operator và dọn tài nguyên khi kết thúc."
sources = ["rxjs/guide/observable", "rxjs/guide/subscription", "rxjs/api/operators/map", "rxjs/api/operators/filter", "rxjs/api/operators/take"]

[[questions]]
id = "ng-c04"
module = "rxjs-core"
type = "code"
difficulty = 2
tags = ["level:middle"]
lang = "javascript"
title = "Mini BehaviorSubject"
prompt = '''
Viết MiniBehaviorSubject(initialValue) bằng JavaScript thuần.

- getValue() trả giá trị hiện tại; next(value) cập nhật và phát cho observer đang hoạt động.
- subscribe(next, error, complete) phát giá trị hiện tại ngay cho subscriber mới.
- unsubscribe() chỉ ngừng observer tương ứng.
- complete() hoàn tất các observer hiện tại; next() sau complete không phát thêm.
- Subscriber đăng ký sau complete chỉ nhận complete, không nhận lại giá trị.
'''
starter = '''
function MiniBehaviorSubject(initialValue) {
  this.value = initialValue;
}
MiniBehaviorSubject.prototype.getValue = function () { return this.value; };
MiniBehaviorSubject.prototype.next = function (value) { this.value = value; };
MiniBehaviorSubject.prototype.subscribe = function () { return { unsubscribe: function () {} }; };
MiniBehaviorSubject.prototype.complete = function () {};
'''
solution = '''
function MiniBehaviorSubject(initialValue) {
  this.value = initialValue;
  this.observers = new Set();
  this.stopped = false;
}

MiniBehaviorSubject.prototype.getValue = function () {
  return this.value;
};

MiniBehaviorSubject.prototype.subscribe = function (next, error, complete) {
  const observer = {
    next: typeof next === 'function' ? next : function () {},
    error: typeof error === 'function' ? error : function () {},
    complete: typeof complete === 'function' ? complete : function () {}
  };
  const subscription = {
    closed: this.stopped,
    unsubscribe: function () {
      if (subscription.closed) return;
      subscription.closed = true;
      subject.observers.delete(subscription);
    }
  };
  const subject = this;
  subscription.observer = observer;
  if (this.stopped) {
    observer.complete();
    return subscription;
  }
  this.observers.add(subscription);
  observer.next(this.value);
  return subscription;
};

MiniBehaviorSubject.prototype.next = function (value) {
  if (this.stopped) return;
  this.value = value;
  Array.from(this.observers).forEach(function (subscription) {
    if (!subscription.closed) subscription.observer.next(value);
  });
};

MiniBehaviorSubject.prototype.complete = function () {
  if (this.stopped) return;
  this.stopped = true;
  Array.from(this.observers).forEach(function (subscription) {
    if (!subscription.closed) subscription.observer.complete();
    subscription.unsubscribe();
  });
};
'''
tests = '''
test('subscriber receives current value immediately', function () {
  const subject = new MiniBehaviorSubject(5);
  const values = [];
  subject.subscribe(function (value) { values.push(value); });
  expect(values).toEqual([5]);
  expect(subject.getValue()).toBe(5);
});

test('next updates value and notifies active subscribers', function () {
  const subject = new MiniBehaviorSubject('a');
  const values = [];
  subject.subscribe(function (value) { values.push(value); });
  subject.next('b');
  expect(subject.getValue()).toBe('b');
  expect(values).toEqual(['a', 'b']);
});

test('unsubscribe removes only that subscriber', function () {
  const subject = new MiniBehaviorSubject(0);
  const first = [];
  const second = [];
  const sub = subject.subscribe(function (value) { first.push(value); });
  subject.subscribe(function (value) { second.push(value); });
  sub.unsubscribe();
  subject.next(1);
  expect(first).toEqual([0]);
  expect(second).toEqual([0, 1]);
});

test('complete stops next and late subscribers only complete', function () {
  const subject = new MiniBehaviorSubject(1);
  let completed = 0;
  const values = [];
  subject.subscribe(function (value) { values.push(value); }, function () {}, function () { completed += 1; });
  subject.complete();
  subject.next(2);
  let lateValue = 0;
  let lateComplete = 0;
  subject.subscribe(function () { lateValue += 1; }, function () {}, function () { lateComplete += 1; });
  expect(values).toEqual([1]);
  expect(completed).toBe(1);
  expect(lateValue).toBe(0);
  expect(lateComplete).toBe(1);
});
'''
hints = ["Lưu mỗi subscription cùng observer của nó trong Set để có thể gỡ riêng.", "Phân biệt trạng thái subject đã complete với trạng thái subscription riêng lẻ."]
explanation = "BehaviorSubject multicast giá trị mới và replay giá trị hiện tại cho người đăng ký sau."
sources = ["rxjs/guide/subject"]

