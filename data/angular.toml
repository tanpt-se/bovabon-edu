[[questions]]
id = "ng-c02"
module = "ng-signals"
type = "code"
difficulty = 3
lang = "javascript"
title = "Mini signal, computed và effect"
prompt = '''
Hãy viết ba hàm JavaScript thuần:

- signal(initialValue) trả về hàm đọc; hàm có set(value) và update(fn).
- computed(fn) trả về hàm đọc có cache. Tính toán phải lazy, đánh dấu dirty khi dependency đổi, và chỉ tính lại khi được đọc.
- effect(fn) chạy ngay một lần, tự chạy lại khi signal được đọc bên trong thay đổi; trả về object có destroy() để ngừng theo dõi.
- Không thông báo khi set giá trị bằng giá trị hiện tại theo Object.is.

Ví dụ: const count = signal(2); const doubled = computed(() => count() * 2); doubled() trả 4; count.set(3); lần đọc tiếp theo trả 6.
'''
starter = '''
function signal(initialValue) {
  let value = initialValue;
  const read = () => value;
  read.set = next => { value = next; };
  read.update = fn => { value = fn(value); };
  return read;
}

function computed(fn) {
  return fn;
}

function effect(fn) {
  fn();
  return { destroy: function () {} };
}
'''
solution = '''
let activeObserver = null;

function signal(initialValue) {
  let value = initialValue;
  const node = {
    observers: new Set(),
    invalidate: function () {
      Array.from(node.observers).forEach(observer => observer.invalidate());
    }
  };
  const read = function () {
    if (activeObserver) activeObserver.register(node);
    return value;
  };
  read.set = function (next) {
    if (Object.is(value, next)) return;
    value = next;
    node.invalidate();
  };
  read.update = function (fn) { read.set(fn(value)); };
  return read;
}

function computed(fn) {
  let value;
  let dirty = true;
  const node = {
    observers: new Set(),
    dependencies: new Set(),
    register: function (dependency) {
      node.dependencies.add(dependency);
      dependency.observers.add(node);
    },
    invalidate: function () {
      if (dirty) return;
      dirty = true;
      Array.from(node.observers).forEach(observer => observer.invalidate());
    }
  };
  const read = function () {
    if (activeObserver) activeObserver.register(node);
    if (dirty) {
      node.dependencies.forEach(dependency => dependency.observers.delete(node));
      node.dependencies.clear();
      const previous = activeObserver;
      activeObserver = node;
      try {
        value = fn();
        dirty = false;
      } finally {
        activeObserver = previous;
      }
    }
    return value;
  };
  read.observers = node.observers;
  return read;
}

function effect(fn) {
  const observer = {
    active: true,
    dependencies: new Set(),
    register: function (dependency) {
      observer.dependencies.add(dependency);
      dependency.observers.add(observer);
    },
    invalidate: function () {
      if (observer.active) run();
    }
  };
  function run() {
    observer.dependencies.forEach(dependency => dependency.observers.delete(observer));
    observer.dependencies.clear();
    const previous = activeObserver;
    activeObserver = observer;
    try {
      fn();
    } finally {
      activeObserver = previous;
    }
  }
  run();
  return {
    destroy: function () {
      observer.active = false;
      observer.dependencies.forEach(dependency => dependency.observers.delete(observer));
      observer.dependencies.clear();
    }
  };
}
'''
tests = '''
test('computed is lazy and caches a read', function () {
  const count = signal(2);
  let calculations = 0;
  const doubled = computed(function () { calculations += 1; return count() * 2; });
  expect(calculations).toBe(0);
  expect(doubled()).toBe(4);
  expect(doubled()).toBe(4);
  expect(calculations).toBe(1);
});

test('computed becomes dirty and recalculates on demand', function () {
  const count = signal(2);
  let calculations = 0;
  const doubled = computed(function () { calculations += 1; return count() * 2; });
  doubled();
  count.set(3);
  expect(calculations).toBe(1);
  expect(doubled()).toBe(6);
  expect(calculations).toBe(2);
});

test('effect reruns only when a dependency changes', function () {
  const count = signal(0);
  const seen = [];
  const ref = effect(function () { seen.push(count()); });
  count.set(1);
  count.set(1);
  expect(seen).toEqual([0, 1]);
  ref.destroy();
  count.set(2);
  expect(seen).toEqual([0, 1]);
});

test('update applies a function to the current value', function () {
  const count = signal(4);
  count.update(function (value) { return value + 3; });
  expect(count()).toBe(7);
});
'''
hints = ["Theo dõi dependency hiện tại bằng một biến module-level tạm thời.", "Mỗi node cần Set dependency và observer để invalidation truyền qua computed tới effect."]
explanation = "Bản mini này mô phỏng dependency graph: computed lazy giữ cache, còn effect đăng ký vào các signal được đọc."
sources = ["angular/guide/signals", "angular/api/core/computed", "angular/api/core/effect"]

