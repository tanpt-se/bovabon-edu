[[questions]]
id = "ops-012"
module = "ops-linux-bash"
type = "code"
lang = "python"
difficulty = 3
title = "Đọc file .env"
prompt = '''
Viết parse_env(text) trả về dict từ nội dung file .env. Bỏ dòng trống và dòng bắt đầu bằng #; cho phép khoảng trắng quanh key và dấu =, cùng tiền tố export. Key phải theo dạng chữ cái hoặc _ trước, sau đó là chữ, số hoặc _, sai thì raise ValueError. Giá trị không quote kết thúc tại dấu # nếu dấu này đứng đầu hoặc có khoảng trắng ngay trước. Giá trị trong nháy đơn giữ nguyên ký tự bên trong; giá trị trong nháy kép giải mã \\n, \\r, \\t, \\", \\\\. Sau quote chỉ cho phép khoảng trắng hoặc comment bắt đầu bằng #. Key lặp lại lấy giá trị sau cùng.
'''
starter = '''
def parse_env(text):
    return {}
'''
solution = '''
import re


def parse_env(text):
    result = {}
    key_pattern = re.compile(r"[A-Za-z_][A-Za-z0-9_]*")
    escapes = {"n": "\n", "r": "\r", "t": "\t", '"': '"', "\\": "\\"}
    for line_number, line in enumerate(text.splitlines(), 1):
        stripped = line.strip()
        if not stripped or stripped.startswith("#"):
            continue
        if stripped.startswith("export "):
            stripped = stripped[7:].lstrip()
        if "=" not in stripped:
            raise ValueError(f"line {line_number}: expected KEY=VALUE")
        key, raw = stripped.split("=", 1)
        key = key.strip()
        if not key_pattern.fullmatch(key):
            raise ValueError(f"line {line_number}: invalid key")
        raw = raw.strip()
        if raw.startswith("'") or raw.startswith('"'):
            quote = raw[0]
            value_parts = []
            index = 1
            closed = False
            while index < len(raw):
                char = raw[index]
                if quote == '"' and char == "\\":
                    index += 1
                    if index >= len(raw):
                        break
                    escaped = raw[index]
                    if escaped in escapes:
                        value_parts.append(escapes[escaped])
                    else:
                        value_parts.extend(["\\", escaped])
                elif char == quote:
                    closed = True
                    index += 1
                    break
                else:
                    value_parts.append(char)
                index += 1
            if not closed:
                raise ValueError(f"line {line_number}: unterminated quote")
            remainder = raw[index:].strip()
            if remainder and not remainder.startswith("#"):
                raise ValueError(f"line {line_number}: unexpected text after quote")
            value = "".join(value_parts)
        else:
            comment = None
            for index, char in enumerate(raw):
                if char == "#" and (index == 0 or raw[index - 1].isspace()):
                    comment = index
                    break
            value = raw[:comment].rstrip() if comment is not None else raw.strip()
        result[key] = value
    return result
'''
tests = '''
@test("giá trị thường và khoảng trắng")
def _():
    expect(parse_env(" PORT = 8080 \nNAME=api ")).to_equal({"PORT": "8080", "NAME": "api"})

@test("export và comment")
def _():
    expect(parse_env("export MODE=prod # release")).to_equal({"MODE": "prod"})

@test("giải mã escape nháy kép")
def _():
    expect(parse_env('TEXT="a\\nb\\"c"')["TEXT"]).to_equal('a\nb"c')

@test("nháy đơn giữ nguyên nội dung")
def _():
    expect(parse_env("TEXT='a\\nb'")["TEXT"]).to_equal("a\\nb")

@test("dấu thăng trong token không phải comment")
def _():
    expect(parse_env("TOKEN=abc#123")["TOKEN"]).to_equal("abc#123")

@test("key lặp lấy giá trị cuối")
def _():
    expect(parse_env("A=1\nA=2")["A"]).to_equal("2")

@test("key sai và quote chưa đóng báo lỗi")
def _():
    expect(lambda: parse_env("2BAD=x")).to_raise(ValueError)
    expect(lambda: parse_env('A="open')).to_raise(ValueError)
'''
hints = ["Tách comment không quote trước khi gán giá trị.", "Với nháy kép, duyệt từng ký tự để xử lý escape và tìm dấu quote đóng."]
explanation = "Parser .env phải phân biệt comment thật với ký tự # trong token, đồng thời không làm mất escape có ý nghĩa."

[[modules]]
id = "ops-docker"
title = "Docker và Compose"
description = "Image, container, layer, build cache, multi-stage, volume, network và Compose."
sources = ["docker/engine/reference/commandline/image/index", "docker/engine/reference/commandline/build/index", "docker/engine/reference/commandline/volume/index", "docker/engine/reference/commandline/network/index", "docker/compose/compose-file/compose-file-v2/index", "docker/compose/reference/up/index"]
lesson = '''
### Từ image tới dịch vụ
Image là mẫu chỉ đọc gồm các layer; container là instance được tạo từ image, có writable layer riêng. Layer có thể được tái sử dụng trong build cache nếu instruction và input phía trước không đổi.

| Thành phần | Vai trò |
|---|---|
| Image | Đóng gói filesystem và metadata để chạy ứng dụng |
| Container | Process đang chạy cùng cấu hình runtime |
| Volume | Lưu dữ liệu bền vững ngoài vòng đời container |
| Network | Cho phép container giao tiếp theo tên/service |
| Compose | Khai báo nhiều service và quan hệ của chúng |

Ví dụ Dockerfile có thể đặt dependency trước mã nguồn để tận dụng cache; multi-stage build dùng stage đầu để biên dịch rồi chỉ chép artifact cần thiết sang image runtime. Compose thuận tiện cho môi trường phát triển nhiều service. Tag latest không cố định phiên bản image; pin tag hoặc digest khi cần build lặp lại. Lỗi thường gặp là lưu dữ liệu duy nhất trong writable layer, đưa secret vào image, hoặc giả định image giống container đang chạy.
'''

