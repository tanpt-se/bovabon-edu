prompt = "Database chính cần RPO 15 phút và RTO 1 giờ; ngân sách hạn chế, team chưa từng thử restore. Phương án hợp lý nhất?"
options = ["Backup đầy đủ mỗi đêm", "Replica bất đồng bộ sang region khác cộng point-in-time recovery, diễn tập restore định kỳ và đo thời gian thực tế", "Triển khai active-active đa region ngay lập tức", "Chụp snapshot thủ công trước mỗi lần deploy"]
answer = [1]
explanation = "Backup hằng đêm có thể mất tới 24 giờ dữ liệu, vượt RPO; snapshot thủ công không có lịch cố định. Active-active đắt và phức tạp vượt nhu cầu. PITR cộng replica đáp ứng RPO/RTO với chi phí vừa phải, và chỉ diễn tập mới chứng minh được RTO."

