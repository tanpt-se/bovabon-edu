sources = ["kubernetes/autoscaling/horizontal-pod-autoscaler-v2/index"]

[[modules]]
id = "ops-nginx"
title = "Nginx và reverse proxy"
description = "Khớp location, chuyển tiếp upstream, header, TLS và kiểm tra cấu hình."
sources = ["nginx/http/ngx_http_core_module#location", "nginx/http/ngx_http_proxy_module", "nginx/http/ngx_http_upstream_module"]
lesson = '''
### Reverse proxy và location
Nginx nhận request từ client rồi có thể chuyển tiếp tới upstream bằng proxy_pass. Proxy thường kết thúc TLS, áp dụng routing, giới hạn request và ghi access/error log. Cần hiểu URI thay đổi thế nào khi proxy_pass có hoặc không có phần URI.

| Location | Cách chọn |
|---|---|
| = /health | Khớp chính xác và dừng |
| ^~ /assets/ | Prefix dài nhất; bỏ qua kiểm tra regex |
| /api/ | Prefix thông thường, so theo prefix dài nhất |
| ~ \.php$ | Regex phân biệt hoa thường, kiểm tra theo thứ tự khai báo |
| ~* \.jpg$ | Regex không phân biệt hoa thường |

Nginx chọn exact trước; nếu không có exact thì xét prefix dài nhất. Prefix ^~ thắng regex sau khi tìm được prefix đó; nếu không, regex được xét theo thứ tự khai báo trước khi dùng prefix đã chọn. Ví dụ route tĩnh có thể dùng ^~ để tránh regex PHP bắt nhầm. Lỗi thường gặp là cho rằng regex dài nhất thắng, nhầm thứ tự location, hoặc quên kiểm tra cấu hình trước reload.
'''

