[[modules]]
id = "ops-git"
title = "Git: nhánh, lịch sử và cứu hộ"
description = "Branch, merge/rebase, conflict, reset/restore/revert, cherry-pick, reflog và workflow cộng tác."
sources = ["git/git-branch", "git/git-merge", "git/git-rebase", "git/git-restore", "git/git-reset", "git/git-revert", "git/git-cherry-pick", "git/git-reflog", "git/git-log"]
lesson = '''
### Git và lịch sử thay đổi
Git giữ snapshot trong commit; working tree là file đang sửa, index là vùng chuẩn bị commit. Branch chỉ là con trỏ nhẹ tới một commit.

| Lệnh | Tác động chính | Dùng khi |
|---|---|---|
| git merge | Kết hợp lịch sử, có thể tạo merge commit | Cập nhật nhánh chia sẻ mà không viết lại lịch sử |
| git rebase | Phát lại commit trên nền mới | Làm gọn nhánh riêng trước khi review |
| git restore | Khôi phục nội dung file hoặc bỏ staging | Sửa trạng thái working tree/index |
| git reset | Di chuyển HEAD và có thể thay đổi index/working tree | Chỉnh lịch sử cục bộ cẩn thận |
| git revert | Tạo commit đảo ngược thay đổi cũ | Hoàn tác an toàn trên nhánh đã chia sẻ |
| git cherry-pick | Áp dụng một commit lên nhánh hiện tại | Chuyển bản sửa chọn lọc |

Ví dụ workflow: tạo feature branch, commit các thay đổi nhỏ, cập nhật từ main bằng merge hoặc rebase theo quy ước nhóm, xử lý conflict rồi mở review. Rebase thay đổi commit ID và không nên dùng để viết lại nhánh người khác đang dựa vào. Reflog ghi lại vị trí HEAD gần đây, hữu ích khi commit tưởng như mất sau reset. Lỗi thường gặp là nhầm reset với revert, force-push nhánh chia sẻ, hoặc giải quyết conflict nhưng quên kiểm tra diff trước commit.
'''

[[modules]]
id = "ops-linux-bash"
title = "Linux và Bash"
description = "Quyền file, process, pipeline, redirect và viết script có kiểm soát lỗi."
sources = ["bash/the-set-builtin", "bash/pipelines", "bash/redirections", "bash/quoting", "bash/shell-parameters"]
lesson = '''
### Quan sát hệ thống và viết script
Quyền file thường hiển thị theo chủ sở hữu, nhóm và người khác; chmod 640 file cấp đọc/ghi cho chủ sở hữu, đọc cho nhóm và không cấp quyền cho người khác. ps và kill hỗ trợ quan sát, gửi tín hiệu tới process; ưu tiên xác định đúng PID và thử dừng mềm trước khi dùng SIGKILL.

| Cú pháp | Ý nghĩa |
|---|---|
| command > out.txt | Ghi stdout, ghi đè file |
| command >> out.txt | Ghi stdout nối thêm |
| command 2> err.txt | Ghi stderr riêng |
| command1 \\| command2 | Nối stdout của lệnh trước vào stdin lệnh sau |
| set -euo pipefail | Bật một số kiểm tra lỗi hữu ích cho script |

Ví dụ: grep ERROR app.log | sort | uniq -c cho biết số dòng lỗi duy nhất. Dấu nháy kép bảo toàn khoảng trắng trong biến, còn dấu nháy đơn giữ nguyên nội dung theo nghĩa đen. set -e có ngoại lệ theo ngữ cảnh điều kiện; pipefail làm pipeline thất bại nếu một lệnh con thất bại, còn -u bắt biến chưa đặt. Lỗi thường gặp là dùng chmod 777, quên quote biến, hoặc hiểu set -e như cơ chế bắt mọi lỗi.
'''

[[modules]]
id = "ops-docker"
title = "Docker và Compose"
description = "Image, container, layer, build cache, multi-stage, volume, network và Compose."
sources = ["docker/engine/reference/commandline/image/index", "docker/engine/reference/commandline/build/index", "docker/engine/reference/commandline/volume/index", "docker/engine/reference/commandline/network/index", "docker/compose/compose-file/compose-file-v2/index", "docker/compose/reference/up/index", "docker/engine/reference/builder/index", "docker/engine/security/index"]
lesson = '''
### Từ image tới dịch vụ
Image là mẫu chỉ đọc gồm các layer; container là instance được tạo từ image, có writable layer riêng. Layer có thể được tái sử dụng trong build cache nếu instruction và input phía trước không đổi.

| Thành phần | Vai trò |
|---|---|
| Image | Đóng gói filesystem và metadata để chạy ứng dụng |
| Container | Process đang chạy cùng cấu hình runtime |
| Volume | Lưu dữ liệu bền vững ngoài vòng đời container |
| Network | Cho phép container giao tiếp theo tên/service |
| Compose | Khai báo nhiều service và quan hệ của chúng |

Ví dụ Dockerfile có thể đặt dependency trước mã nguồn để tận dụng cache; multi-stage build dùng stage đầu để biên dịch rồi chỉ chép artifact cần thiết sang image runtime. Compose thuận tiện cho môi trường phát triển nhiều service. Tag latest không cố định phiên bản image; pin tag hoặc digest khi cần build lặp lại. Lỗi thường gặp là lưu dữ liệu duy nhất trong writable layer, đưa secret vào image, hoặc giả định image giống container đang chạy.
'''

[[modules]]
id = "ops-kubernetes"
title = "Kubernetes"
description = "Pod, Deployment, Service, Ingress, cấu hình, probe, rollout và HPA."
sources = ["kubernetes/core/pod-v1/index", "kubernetes/apps/deployment-v1/index", "kubernetes/core/service-v1/index", "kubernetes/networking/ingress-v1/index", "kubernetes/core/config-map-v1/index", "kubernetes/core/secret-v1/index", "kubernetes/autoscaling/horizontal-pod-autoscaler-v2/index"]
lesson = '''
### Kubernetes: đối tượng và controller
Pod chạy một hoặc nhiều container cùng các tài nguyên mạng cơ bản; Deployment quản lý ReplicaSet và số Pod mong muốn. Service tạo điểm truy cập ổn định tới các Pod phù hợp selector. Ingress mô tả luật HTTP(S), nhưng cần Ingress controller thực thi.

| Đối tượng | Trách nhiệm |
|---|---|
| ConfigMap | Cấu hình không bí mật |
| Secret | Dữ liệu nhạy cảm, cần kiểm soát quyền và mã hoá phù hợp |
| readinessProbe | Xác định khi nào Pod nhận traffic |
| livenessProbe | Phát hiện container cần khởi động lại |
| HPA | Điều chỉnh replicas theo metric và giới hạn đã cấu hình |

Ví dụ Deployment đặt replicas, image và resource requests; Service chọn Pod bằng label. Rolling update thay Pod theo từng bước để giảm downtime. HPA thường cần metrics server và resource requests phù hợp khi dùng CPU utilization. Secret không tự động an toàn chỉ vì loại object mang tên Secret. Lỗi thường gặp là probe liveness quá gắt, selector không khớp label, hoặc nghĩ Ingress hoạt động khi chưa cài controller.
'''

[[modules]]
id = "ops-nginx"
title = "Nginx và reverse proxy"
description = "Khớp location, chuyển tiếp upstream, header, TLS và kiểm tra cấu hình."
sources = ["nginx/http/ngx_http_core_module#location", "nginx/http/ngx_http_proxy_module", "nginx/http/ngx_http_upstream_module", "nginx/http/ngx_http_ssl_module", "nginx/http/ngx_http_limit_req_module", "nginx/http/ngx_http_log_module"]
lesson = '''
### Reverse proxy và location
Nginx nhận request từ client rồi có thể chuyển tiếp tới upstream bằng proxy_pass. Proxy thường kết thúc TLS, áp dụng routing, giới hạn request và ghi access/error log. Cần hiểu URI thay đổi thế nào khi proxy_pass có hoặc không có phần URI.

| Location | Cách chọn |
|---|---|
| = /health | Khớp chính xác và dừng |
| ^~ /assets/ | Prefix dài nhất; bỏ qua kiểm tra regex |
| /api/ | Prefix thông thường, so theo prefix dài nhất |
| ~ \.php$ | Regex phân biệt hoa thường, kiểm tra theo thứ tự khai báo |
| ~* \.jpg$ | Regex không phân biệt hoa thường |

Nginx chọn exact trước; nếu không có exact thì xét prefix dài nhất. Prefix ^~ thắng regex sau khi tìm được prefix đó; nếu không, regex được xét theo thứ tự khai báo trước khi dùng prefix đã chọn. Ví dụ route tĩnh có thể dùng ^~ để tránh regex PHP bắt nhầm. Lỗi thường gặp là cho rằng regex dài nhất thắng, nhầm thứ tự location, hoặc quên kiểm tra cấu hình trước reload.
'''

[[modules]]
id = "ops-cicd-terraform"
title = "CI/CD và Terraform"
description = "Pipeline kiểm tra, triển khai có kiểm soát, Infrastructure as Code, state, plan và apply."
sources = ["terraform/language/syntax/configuration", "terraform/language/state/purpose", "terraform/language/state/remote", "terraform/tutorials/cli/plan", "terraform/tutorials/cli/apply"]
lesson = '''
### Tự động hoá triển khai và hạ tầng
CI chạy các bước kiểm tra lặp lại khi có thay đổi; CD tự động đưa artifact đã kiểm chứng tới môi trường theo quy tắc phát hành. Pipeline nên tách build, test, scan và deploy; chỉ cấp credential tối thiểu cho job cần dùng, không in secret vào log.

| Terraform command | Vai trò |
|---|---|
| init | Khởi tạo thư mục làm việc và provider |
| plan | Tính toán thay đổi dự kiến, chưa áp dụng vào hạ tầng |
| apply | Thực thi kế hoạch thay đổi đã xác nhận |
| state | Theo dõi liên hệ giữa cấu hình và resource thực tế |

Terraform state có thể chứa dữ liệu nhạy cảm; backend từ xa cần hỗ trợ kiểm soát truy cập và khoá state phù hợp. Hãy review plan, lưu state an toàn và tránh nhiều người apply đồng thời không có locking. Ví dụ pipeline có thể chạy fmt, validate, plan khi mở pull request rồi chỉ apply sau khi được phê duyệt ở môi trường mục tiêu. Lỗi thường gặp là coi plan là thay đổi đã xảy ra, sửa state bằng tay tuỳ tiện hoặc lưu secret trong repository.
'''

[[modules]]
id = "devops-dv-k8s-rollout"
title = "Kubernetes: readiness và rollout ổn định"
description = "Thiết kế probes, requests/limits, rolling update và PDB để phát hành workload có kiểm soát."
sources = ["kubernetes/core/pod-v1/index", "kubernetes/apps/deployment-v1/index", "kubernetes/policy/pod-disruption-budget-v1/index", "kubernetes/autoscaling/horizontal-pod-autoscaler-v2/index", "kubernetes/core/pod-v1/index#ResourceRequirements"]
lesson = '''
### Giữ workload sẵn sàng khi phát hành
Kubernetes dùng trạng thái của Pod và chính sách cập nhật để điều phối traffic, tài nguyên và thay đổi phiên bản. Readiness quyết định Pod có nhận traffic từ Service hay chưa; liveness phát hiện tiến trình cần khởi động lại; startup probe dành thời gian khởi động cho ứng dụng chậm trước khi hai probe còn lại bắt đầu. Một liveness probe quá gắt có thể tạo vòng lặp restart dù ứng dụng chỉ đang tải dữ liệu ban đầu.

| Cấu hình | Ý nghĩa | Lưu ý vận hành |
|---|---|---|
| `requests` | Lượng tài nguyên dùng để xếp Pod và làm cơ sở cho một số phép autoscale | Đặt quá thấp gây tranh chấp; quá cao gây khó xếp lịch |
| `limits` | Mức tài nguyên tối đa container được dùng | CPU có thể bị throttle; vượt memory limit thường khiến container bị OOM-kill |
| `maxSurge` | Số Pod bổ sung tạm thời trong rolling update | Cần tính cả quota và dung lượng cluster |
| `maxUnavailable` | Số Pod có thể không sẵn sàng trong lúc cập nhật | Giá trị cao tăng tốc rollout nhưng giảm capacity |
| PDB | Giới hạn gián đoạn tự nguyện khi drain/evict | Không ngăn mọi sự cố hoặc mọi thao tác xoá trực tiếp |

Ví dụ, với ba replicas, readiness probe chỉ trả thành công sau khi ứng dụng nạp cấu hình và kết nối dependency cần thiết; khi phiên bản mới chưa ready, Service không gửi request tới Pod đó. Có thể theo dõi `kubectl rollout status deployment/api`, xem `kubectl describe pod` và Events khi tiến trình dừng, rồi dùng `kubectl rollout undo deployment/api` nếu phiên bản mới gây lỗi. PDB bảo vệ số replica tối thiểu khi node được bảo trì, nhưng phải phối hợp với capacity và quy trình drain.

Lỗi thường gặp là chỉ kiểm tra tiến trình còn sống mà không kiểm tra khả năng phục vụ, đặt request bằng 0 rồi kỳ vọng HPA dùng CPU utilization chính xác, để `maxUnavailable` làm mất phần lớn capacity, hoặc xem PDB như bảo đảm HA tuyệt đối. Luôn kiểm tra readiness, quota, Events và kết quả rollout trước khi kết thúc đợt phát hành.
'''

[[modules]]
id = "devops-dv-k8s-security"
title = "Kubernetes: RBAC và cô lập workload"
description = "Thiết kế quyền tối thiểu, NetworkPolicy và cách bảo vệ thông tin nhạy cảm trong cluster."
sources = ["kubernetes/rbac/role-v1/index", "kubernetes/rbac/role-binding-v1/index", "kubernetes/core/service-account-v1/index", "kubernetes/networking/network-policy-v1/index", "kubernetes/core/pod-v1/index#PodSecurityContext", "kubernetes/core/secret-v1/index"]
lesson = '''
### Giới hạn quyền và đường giao tiếp
Kubernetes tách danh tính (user, group, ServiceAccount), quyền (Role/ClusterRole) và phép gán quyền (RoleBinding/ClusterRoleBinding). Role chỉ mô tả quyền trong một namespace; ClusterRole có thể mô tả quyền cấp cluster hoặc được tham chiếu trong namespace tùy kiểu binding. RoleBinding giới hạn phạm vi quyền được gán vào namespace của binding, kể cả khi tham chiếu ClusterRole. Hãy cấp đúng verbs và resources cần thiết, tránh `*` và quyền `cluster-admin` cho ứng dụng thường.

| Cơ chế | Phạm vi / mục đích | Điều cần kiểm tra |
|---|---|---|
| Role + RoleBinding | Quyền API trong một namespace | Subject và namespace của binding đúng chưa |
| ClusterRole + ClusterRoleBinding | Quyền API cấp cluster | Có thực sự cần đọc/ghi tài nguyên toàn cluster không |
| ServiceAccount | Danh tính API cho Pod | Chỉ gán quyền ứng dụng cần; tắt tự mount token nếu không gọi API |
| NetworkPolicy | Lọc kết nối L3/L4 tới/ra Pod | CNI cluster có hỗ trợ NetworkPolicy không |
| Secret | Lưu cấu hình nhạy cảm trong API | RBAC, encryption at rest, log và quy trình xoay vòng |

Ví dụ, một API chỉ đọc ConfigMap trong namespace `app` có thể dùng ServiceAccount riêng, Role chỉ cấp `get/list` cho ConfigMap và RoleBinding gán Role đó cho ServiceAccount. NetworkPolicy có thể bắt đầu bằng chính sách default-deny ingress rồi mở đúng luồng từ gateway và dependency; ingress và egress là hai hướng riêng. Chính sách không có tác dụng lọc nếu network plugin không triển khai hỗ trợ.

Secret không tự mã hóa dữ liệu chỉ vì giá trị được biểu diễn base64; cấu hình encryption at rest cho datastore và giới hạn quyền đọc vẫn cần thiết. Với workload không gọi Kubernetes API, cân nhắc `automountServiceAccountToken: false`. Lỗi thường gặp là gán ClusterRoleBinding chỉ để sửa lỗi permission nhanh, dùng ServiceAccount mặc định có quyền rộng, hiểu NetworkPolicy như firewall host, hoặc đưa secret vào manifest công khai. Kiểm tra quyền bằng `kubectl auth can-i` và thử các luồng mạng được cho phép lẫn bị chặn.
'''

[[modules]]
id = "devops-dv-nginx-edge"
title = "Nginx: TLS và bảo vệ lưu lượng"
description = "Cấu hình TLS đầu cuối, giới hạn request và tin cậy proxy một cách có kiểm soát."
sources = ["nginx/http/ngx_http_ssl_module#ssl_certificate", "nginx/http/ngx_http_limit_req_module#limit_req_zone", "nginx/http/ngx_http_limit_req_module#limit_req", "nginx/http/ngx_http_realip_module#set_real_ip_from", "nginx/http/ngx_http_headers_module#add_header", "nginx/http/ngx_http_log_module#access_log"]
lesson = '''
### Gia cố reverse proxy ở biên
Nginx thường kết thúc TLS, chuẩn hóa header chuyển tiếp và áp dụng giới hạn request trước khi traffic tới ứng dụng. Chứng thư và private key là hai vật liệu khác nhau: chứng thư có thể được gửi cho client, private key phải chỉ đọc được bởi tiến trình/nhóm phù hợp và không được đưa vào image hay log. TLS không thay thế xác thực ứng dụng, và kết nối từ Nginx tới upstream có thể cần bảo vệ riêng tùy ranh giới tin cậy.

| Cấu hình | Vai trò | Rủi ro cần tránh |
|---|---|---|
| `ssl_certificate` / `ssl_certificate_key` | Nạp certificate chain và private key cho TLS | Lộ key hoặc thiếu chuỗi certificate |
| `limit_req_zone` | Khai báo key, shared memory zone và tốc độ | Dùng key không đại diện đúng client |
| `limit_req` | Áp dụng zone, burst và chính sách xử lý vượt tốc độ | Đặt ngưỡng quá thấp gây chặn traffic hợp lệ |
| `set_real_ip_from` | Khai báo proxy đáng tin được phép cung cấp IP client | Tin mọi địa chỉ khiến client giả mạo IP qua header |
| `access_log` | Ghi request để giám sát và điều tra | Log token, query nhạy cảm hoặc dữ liệu cá nhân không cần thiết |

Ví dụ, trong `http` có thể khai báo `limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;`, sau đó áp dụng `limit_req zone=api burst=20` trong location API. `burst` cho phép đệm một lượng request vượt nhịp bình thường; không bật `nodelay` sẽ làm các request dư được trì hoãn theo thuật toán, còn `nodelay` cho phép burst đi ngay nhưng vẫn giữ giới hạn dài hạn. Nên quan sát log hoặc dùng chế độ dry-run trước khi bật chặn trên endpoint đang có tải thật.

Nếu có load balancer phía trước, chỉ đặt `set_real_ip_from` cho CIDR proxy do mình quản lý; không tin `X-Forwarded-For` từ Internet trực tiếp. Nginx cần chuyển tiếp `Host` và chuỗi địa chỉ client theo chính sách của hệ thống, đồng thời upstream chỉ nên nhận kết nối từ proxy được phép. Trước reload hãy chạy `nginx -t`, xem lỗi cấu hình và theo dõi access/error log sau triển khai.

Lỗi thường gặp là mở TLS nhưng không bảo vệ private key, tin header client IP từ mọi nguồn, coi `burst` là quota cố định theo phút, hoặc reload cấu hình chưa kiểm tra. Rate limit cần được thiết kế theo client identity, đường đi qua proxy và hành vi endpoint, rồi đo tác động để tránh biến biện pháp bảo vệ thành sự cố availability.
'''

[[modules]]
id = "devops-dv-terraform-modules"
title = "Terraform: module và thay đổi có kiểm soát"
description = "Thiết kế module có giao diện rõ, địa chỉ resource ổn định và kiểm thử/review plan."
sources = ["terraform/language/modules/sources", "terraform/language/modules/syntax", "terraform/language/values/variables", "terraform/language/values/outputs", "terraform/language/meta-arguments/for_each", "terraform/cli/commands/test"]
lesson = '''
### Tách cấu hình thành module có giao diện rõ
Terraform module là một thư mục cấu hình được gọi từ root module hoặc module cha. Module tái sử dụng nên nhận các input có kiểu và ý nghĩa rõ, xuất output thực sự cần cho caller, và giới hạn phạm vi trách nhiệm; biến toàn cục ngầm định hoặc nhiều output nội bộ khiến thay đổi khó review. Module nguồn từ registry nên được chọn phiên bản có chủ ý để nâng cấp không đổi hành vi ngoài dự kiến.

| Cách làm | Hành vi | Phù hợp khi |
|---|---|---|
| `count` | Tạo số bản sao theo chỉ số số nguyên | Tập instance gần như đồng nhất và thứ tự ổn định |
| `for_each` với map | Địa chỉ gắn với key có tên | Instance có cấu hình khác nhau hoặc cần địa chỉ dễ đọc |
| Input variable | Đưa giá trị cấu hình vào module | Khác biệt theo môi trường hoặc thành phần gọi |
| Output | Công bố một giá trị cho module gọi | Tạo contract nhỏ giữa các module |
| `terraform test` | Kiểm thử cấu hình theo test files và assertions | Xác nhận module/config trước khi chia sẻ hoặc apply |

Ví dụ module cục bộ:
```hcl
module "service" {
  source = "./modules/service"
  name   = var.service_name
}
```

Với các resource đặt tên như database hoặc bucket, `for_each` trên map key ổn định thường dễ hiểu hơn `count` trên danh sách: xoá phần tử ở giữa danh sách có thể làm thay đổi địa chỉ theo index, trong khi key map giữ danh tính instance. Dù vậy, đổi key của `for_each` cũng làm Terraform thấy một địa chỉ khác; khi chuyển địa chỉ cần kế hoạch migration state phù hợp, không chỉ sửa chuỗi key tùy tiện. Dùng `terraform plan` để xem create/update/delete/replacement và review mọi thao tác phá huỷ trước khi apply.

`terraform test` có thể chạy kiểm thử ở chế độ plan hoặc apply; test áp dụng resource thật cần provider, môi trường cô lập, quyền tối thiểu và cleanup rõ ràng vì có thể tốn phí hoặc để lại hạ tầng nếu lỗi. Lỗi thường gặp là biến module thành bản sao cấu hình không có contract, dùng output quá rộng, thay module source mà không review phiên bản, hoặc mặc định rằng thay đổi địa chỉ resource chỉ là refactor vô hại. Hãy giữ giao diện module nhỏ và coi địa chỉ resource cùng state là một phần của kế hoạch migration.
'''

[[modules]]
id = "devops-lead"
title = "Góc nhìn Tech Lead"
description = "Chiến lược deploy (rolling, blue-green, canary), SLO và error budget, on-call và postmortem, FinOps, GitOps, quản trị IaC và secrets ở quy mô team."
sources = ["kubernetes/apps/deployment-v1/index", "kubernetes/policy/pod-disruption-budget-v1/index", "kubernetes/autoscaling/horizontal-pod-autoscaler-v2/index", "terraform/language/state/remote", "terraform/tutorials/cli/plan", "git/git-revert"]
lesson = '''
### Ra quyết định vận hành cho cả team
Ở cấp Tech Lead, câu hỏi không còn là "lệnh nào đúng" mà là "phương án nào hợp lý nhất với ràng buộc hiện có": số người, kỹ năng on-call, ngân sách hạ tầng, mức rủi ro nghiệp vụ và tốc độ phát hành mong muốn. Một quyết định tốt luôn ghi rõ bối cảnh, phương án bị loại và cách đo xem quyết định có hiệu quả hay không.

#### 1. Chọn chiến lược deploy

| Chiến lược | Chi phí hạ tầng | Tốc độ rollback | Yêu cầu quan sát | Phù hợp khi |
|---|---|---|---|---|
| Recreate | Thấp | Chậm, có downtime | Thấp | Job nội bộ, chấp nhận gián đoạn ngắn |
| Rolling update | Thấp (thêm `maxSurge`) | Trung bình (`rollout undo`) | Trung bình | Mặc định cho service stateless |
| Blue-green | Cao (gấp đôi tạm thời) | Rất nhanh (đổi traffic) | Trung bình | Thay đổi lớn, cần cắt chuyển tức thì |
| Canary | Thấp đến trung bình | Nhanh, ảnh hưởng ít người dùng | Cao: metrics theo version | Service quan trọng, deploy thường xuyên |

Canary chỉ an toàn khi có metrics tách theo phiên bản và tiêu chí go/no-go viết sẵn (error rate, latency p99, lượng traffic tối thiểu). Không có observability thì canary chỉ là rolling update chậm hơn.

#### 2. SLO và error budget
SLO 99.9% trong 30 ngày nghĩa là error budget khoảng 43 phút (ước lượng) hoặc 0.1% request lỗi. Burn rate = tỉ lệ lỗi quan sát / (1 − SLO); burn rate 1 là tiêu đúng tốc độ bền vững, burn rate 10 sẽ cạn budget sau khoảng 3 ngày. Error budget policy cần được PM và kỹ sư cùng thống nhất *trước* sự cố: còn budget thì ship bình thường, burn nhanh thì giảm nhịp và ưu tiên reliability, hết budget thì đóng băng tính năng rủi ro.

#### 3. On-call và postmortem
- Alert theo triệu chứng người dùng cảm nhận (SLO burn rate) thay vì mọi chỉ số CPU; mỗi alert phải actionable và có runbook.
- Mục tiêu tham khảo: dưới khoảng 2 lần bị gọi mỗi ca trực (ước lượng, tuỳ team).
- Trong sự cố: mitigate trước (rollback, tắt feature flag), tìm root cause sau.
- Postmortem blameless: timeline dựa trên dữ liệu, nguyên nhân hệ thống, action item có owner và hạn.

#### 4. Checklist review thay đổi hạ tầng
1. Thay đổi đi qua PR, có `terraform plan` hoặc diff manifest đính kèm.
2. Có đường rollback rõ và đã thử ít nhất ở staging.
3. Secrets không nằm trong repo, state hay log; quyền theo least privilege.
4. Dashboard/alert cho thành phần mới đã có trước khi bật traffic.
5. Chi phí ước tính (requests/limits, số node, egress) được ghi lại.

#### 5. ADR mẫu ngắn
**ADR-007: Triển khai bằng GitOps.** Bối cảnh: 3 cluster, CI đang giữ kubeconfig quyền admin, cấu hình thường lệch do sửa tay. Quyết định: dùng agent pull-based đồng bộ từ repo manifest; CI chỉ build image và mở PR cập nhật tag. Hệ quả: giảm credential trong CI, drift được phát hiện tự động, rollback bằng `git revert`; đổi lại team phải học công cụ mới và debug qua thêm một lớp.

#### 6. Anti-pattern ở quy mô team
- ClickOps: sửa tay trên console production, IaC không còn là nguồn sự thật.
- Mỗi team tự chế pipeline, chart và cách log; không có golden path nên không ai review được của ai.
- Cấp quyền admin cluster cho mọi developer "cho nhanh".
- Mua reserved instance trước khi biết chi phí thuộc về service nào (thiếu tag, thiếu cost per request).
- Alert không ai xử lý được, khiến người trực bỏ qua cả alert thật.
'''

