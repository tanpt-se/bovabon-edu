[[questions]]
id = "devops-dvc01"
module = "devops-dv-k8s-rollout"
type = "code"
lang = "python"
difficulty = 2
tags = ["level:middle"]
title = "Đếm Pod đã sẵn sàng"
prompt = '''
Viết `count_ready_pods(pods)` nhận danh sách object Pod dạng dictionary như JSON Kubernetes và trả về số Pod có ít nhất một condition với `type` là `Ready` và `status` là chuỗi `True`. Bỏ qua phần tử sai kiểu, thiếu `status`/`conditions`, hoặc `conditions` không phải danh sách. Các condition khác và giá trị `True` viết hoa/thường khác không được tính. Ví dụ Pod có `{"status": {"conditions": [{"type": "Ready", "status": "True"}]}}` được tính một lần.
'''
starter = '''
def count_ready_pods(pods):
    return 0
'''
solution = '''
def count_ready_pods(pods):
    count = 0
    for pod in pods:
        if not isinstance(pod, dict):
            continue
        status = pod.get("status")
        if not isinstance(status, dict):
            continue
        conditions = status.get("conditions")
        if not isinstance(conditions, list):
            continue
        if any(
            isinstance(condition, dict)
            and condition.get("type") == "Ready"
            and condition.get("status") == "True"
            for condition in conditions
        ):
            count += 1
    return count
'''
tests = '''
@test("đếm Pod Ready")
def _():
    pods = [
        {"status": {"conditions": [{"type": "Ready", "status": "True"}]}},
        {"status": {"conditions": [{"type": "Ready", "status": "False"}]}},
    ]
    expect(count_ready_pods(pods)).to_equal(1)

@test("không đếm lặp condition")
def _():
    pod = {"status": {"conditions": [
        {"type": "Ready", "status": "True"},
        {"type": "Ready", "status": "True"},
    ]}}
    expect(count_ready_pods([pod])).to_equal(1)

@test("bỏ qua field thiếu và phần tử sai kiểu")
def _():
    expect(count_ready_pods([None, {}, {"status": None}, {"status": {"conditions": None}}])).to_equal(0)

@test("phân biệt đúng type và status")
def _():
    pods = [{"status": {"conditions": [
        {"type": "Ready", "status": "true"},
        {"type": "Initialized", "status": "True"},
    ]}}]
    expect(count_ready_pods(pods)).to_equal(0)
'''
hints = ["Đọc status và conditions sau khi xác nhận mỗi lớp dữ liệu là dictionary/list.", "Dùng any để tránh đếm một Pod nhiều lần nếu có condition Ready lặp."]
explanation = "Điều kiện Ready trong Pod status là tín hiệu để workload và Service xác định Pod đã sẵn sàng; bài tập xử lý hình dạng JSON thiếu hoặc không hợp lệ an toàn."
sources = ["kubernetes/core/pod-v1/index"]

