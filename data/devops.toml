title = "Đánh giá rule RBAC"
prompt = '''
Viết `rbac_allows(rules, verb, api_group, resource)` để kiểm tra một yêu cầu đã được gán tới chủ thể có khớp ít nhất một rule trong danh sách hay không. Mỗi rule có thể có các danh sách `verbs`, `apiGroups`, `resources`; ký tự `*` khớp mọi giá trị trong trường đó. API group lõi được truyền bằng chuỗi rỗng. Rule thiếu trường hoặc có trường không phải danh sách không cấp quyền. Hàm chỉ kiểm tra rule đã hiệu lực, không cần mô phỏng binding hay phạm vi namespace. Ví dụ rule `{"verbs": ["get"], "apiGroups": [""], "resources": ["configmaps"]}` cho phép đọc ConfigMap API lõi.
'''
starter = '''
def rbac_allows(rules, verb, api_group, resource):
    return False
'''
solution = '''
def rbac_allows(rules, verb, api_group, resource):
    requested = (verb, api_group, resource)
    for rule in rules:
        if not isinstance(rule, dict):
            continue
        fields = (rule.get("verbs"), rule.get("apiGroups"), rule.get("resources"))
        if not all(isinstance(values, list) for values in fields):
            continue
        if all("*" in values or value in values for values, value in zip(fields, requested)):
            return True
    return False
'''
tests = '''
@test("khớp đủ verb, group và resource")
def _():
    rules = [{"verbs": ["get"], "apiGroups": [""], "resources": ["configmaps"]}]
    expect(rbac_allows(rules, "get", "", "configmaps")).to_be_true()

@test("wildcard khớp từng trường")
def _():
    rules = [{"verbs": ["*"], "apiGroups": ["apps"], "resources": ["deployments", "*"]}]
    expect(rbac_allows(rules, "patch", "apps", "deployments")).to_be_true()

@test("không cấp quyền khi thiếu một trường khớp")
def _():
    rules = [{"verbs": ["get"], "apiGroups": [""], "resources": ["secrets"]}]
    expect(rbac_allows(rules, "get", "", "configmaps")).to_be_false()

@test("bỏ qua rule sai định dạng")
def _():
    rules = [None, {"verbs": "get", "apiGroups": [""], "resources": ["pods"]}]
    expect(rbac_allows(rules, "get", "", "pods")).to_be_false()
'''
hints = ["Xác thực từng rule và ba trường trước khi so khớp.", "Mỗi trường hỗ trợ khớp chính xác hoặc wildcard; cả ba phải khớp trong cùng một rule."]
explanation = "Mô phỏng rule access-control theo hướng fail-closed: rule thiếu dữ liệu hợp lệ không được cấp quyền."
sources = ["kubernetes/rbac/role-v1/index"]

