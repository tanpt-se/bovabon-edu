[[questions]]
id = "ops-025"
module = "ops-kubernetes"
type = "code"
lang = "python"
difficulty = 2
tags = ["level:middle"]
title = "Tính replicas mục tiêu cho HPA"
prompt = '''
Viết desired_replicas(current_replicas, current_value, target_value, min_replicas, max_replicas). Dùng công thức ceil(current_replicas * current_value / target_value), sau đó giới hạn kết quả trong min_replicas..max_replicas. target_value phải dương, min_replicas không âm và không lớn hơn max_replicas, max_replicas phải ít nhất 1; nếu vi phạm raise ValueError. Hàm mô phỏng phép tính cơ bản, không cần xử lý tolerance, metric thiếu hay stabilization window.
'''
starter = '''
def desired_replicas(current_replicas, current_value, target_value, min_replicas, max_replicas):
    return current_replicas
'''
solution = '''
import math


def desired_replicas(current_replicas, current_value, target_value, min_replicas, max_replicas):
    if target_value <= 0 or min_replicas < 0 or max_replicas < 1 or min_replicas > max_replicas:
        raise ValueError("invalid HPA bounds or target")
    calculated = math.ceil(current_replicas * current_value / target_value)
    return max(min_replicas, min(max_replicas, calculated))
'''
tests = '''
@test("tăng replicas theo utilization")
def _():
    expect(desired_replicas(4, 75, 50, 1, 10)).to_equal(6)

@test("ceiling cho kết quả phân số")
def _():
    expect(desired_replicas(3, 51, 50, 1, 10)).to_equal(4)

@test("giới hạn min và max")
def _():
    expect(desired_replicas(2, 10, 50, 3, 5)).to_equal(3)
    expect(desired_replicas(8, 100, 50, 1, 10)).to_equal(10)

@test("không vượt min khi kết quả bằng không")
def _():
    expect(desired_replicas(2, 0, 50, 1, 10)).to_equal(1)

@test("đầu vào không hợp lệ báo lỗi")
def _():
    expect(lambda: desired_replicas(2, 50, 0, 1, 5)).to_raise(ValueError)
    expect(lambda: desired_replicas(2, 50, 10, 6, 5)).to_raise(ValueError)
'''
