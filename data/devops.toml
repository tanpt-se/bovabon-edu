[[questions]]
id = "ops-005"
module = "ops-git"
type = "code"
lang = "python"
difficulty = 2
tags = ["level:middle"]
title = "Tạo changelog từ git log"
prompt = '''
Viết generate_changelog(lines) nhận danh sách dòng theo dạng hash rồi đến subject từ git log --oneline. Phân loại các Conventional Commit hợp lệ vào dict có đủ bốn khóa Breaking Changes, Features, Bug Fixes, Other; mỗi giá trị là danh sách chuỗi theo dạng hash + khoảng trắng + subject, giữ thứ tự đầu vào. feat vào Features, fix vào Bug Fixes, các type hợp lệ khác vào Other. Commit có dấu ! ngay trước dấu hai chấm hoặc có cụm BREAKING CHANGE: trong subject chỉ vào Breaking Changes. Bỏ qua dòng sai định dạng hoặc subject không theo Conventional Commits. Ví dụ a1b2 feat(ui): add theme được đưa vào Features.
'''
starter = '''
def generate_changelog(lines):
    return {"Breaking Changes": [], "Features": [], "Bug Fixes": [], "Other": []}
'''
solution = '''
import re

_HEADER = re.compile(r"^([A-Za-z]+)(?:\([^)]+\))?(!)?:\s*(.+)$")


def generate_changelog(lines):
    result = {"Breaking Changes": [], "Features": [], "Bug Fixes": [], "Other": []}
    for line in lines:
        parts = line.strip().split(None, 1)
        if len(parts) != 2 or not re.fullmatch(r"[0-9a-fA-F]+", parts[0]):
            continue
        commit_hash, subject = parts
        match = _HEADER.fullmatch(subject)
        if not match:
            continue
        kind, breaking_mark, _ = match.groups()
        kind = kind.lower()
        if breaking_mark or "BREAKING CHANGE:" in subject:
            section = "Breaking Changes"
        elif kind == "feat":
            section = "Features"
        elif kind == "fix":
            section = "Bug Fixes"
        else:
            section = "Other"
        result[section].append(commit_hash + " " + subject)
    return result
'''
tests = '''
@test("phân loại feat và fix")
def _():
    result = generate_changelog(["a1b2 feat(ui): add theme", "b2c3 fix: handle timeout"])
    expect(result["Features"]).to_equal(["a1b2 feat(ui): add theme"])
    expect(result["Bug Fixes"]).to_equal(["b2c3 fix: handle timeout"])

@test("breaking change được ưu tiên")
def _():
    result = generate_changelog(["c3d4 feat(api)!: remove v1"])
    expect(result["Breaking Changes"]).to_equal(["c3d4 feat(api)!: remove v1"])
    expect(result["Features"]).to_equal([])

@test("type khác vào Other và giữ thứ tự")
def _():
    result = generate_changelog(["a1 docs: add guide", "b2 chore: update lock"])
    expect(result["Other"]).to_equal(["a1 docs: add guide", "b2 chore: update lock"])

@test("bỏ dòng sai định dạng")
def _():
    result = generate_changelog(["not-a-log", "zzzz feat: bad hash", "a1 custom text"])
    expect(result).to_equal({"Breaking Changes": [], "Features": [], "Bug Fixes": [], "Other": []})

@test("nhận marker breaking trong subject")
def _():
    result = generate_changelog(["d4e5 refactor(core): BREAKING CHANGE: new API"])
    expect(result["Breaking Changes"]).to_have_length(1)
'''
hints = ["Dùng regex tách hash và kiểm tra header Conventional Commit.", "Phân loại breaking trước khi xét feat hoặc fix."]
explanation = "Một changelog ổn định cần giữ thứ tự commit và cho người đọc biết thay đổi nào phá vỡ tương thích."

[[questions]]
id = "ops-006"
module = "ops-git"
type = "code"
lang = "python"
difficulty = 3
tags = ["level:senior"]
title = "Bump phiên bản SemVer"
prompt = '''
Viết bump_version(version, commits). version là dạng MAJOR.MINOR.PATCH, có thể có tiền tố v; commits là danh sách subject Conventional Commit. Tăng major nếu có ! ở header hoặc BREAKING CHANGE:, nếu không tăng minor khi có feat, nếu không tăng patch khi có ít nhất một commit Conventional Commit hợp lệ. Nếu danh sách rỗng hoặc không có commit hợp lệ thì giữ nguyên version. Giữ tiền tố v nếu đầu vào có. Số phiên bản không có số 0 thừa ở đầu.
'''
starter = '''
def bump_version(version, commits):
    return version
'''
solution = '''
import re

_VERSION = re.compile(r"^(v?)(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$")
_COMMIT = re.compile(r"^([A-Za-z]+)(?:\([^)]+\))?(!)?:\s*(.+)$")


def bump_version(version, commits):
    match = _VERSION.fullmatch(version)
    if not match:
        raise ValueError("invalid version")
    prefix, major, minor, patch = match.groups()
    major, minor, patch = int(major), int(minor), int(patch)
    valid = []
    for subject in commits:
        parsed = _COMMIT.fullmatch(subject.strip())
        if parsed:
            valid.append((parsed.group(1).lower(), bool(parsed.group(2)), parsed.group(3)))
    if not valid:
        return version
    if any(mark or "BREAKING CHANGE:" in message for _, mark, message in valid):
        major, minor, patch = major + 1, 0, 0
    elif any(kind == "feat" for kind, _, _ in valid):
        minor, patch = minor + 1, 0
    else:
        patch += 1
    return f"{prefix}{major}.{minor}.{patch}"
'''
tests = '''
@test("fix tăng patch")
def _():
    expect(bump_version("1.2.3", ["fix: handle timeout"])).to_equal("1.2.4")

@test("feat tăng minor và reset patch")
def _():
    expect(bump_version("v1.2.9", ["feat(api): add cursor"])).to_equal("v1.3.0")

@test("breaking tăng major và reset phần sau")
def _():
    expect(bump_version("2.4.8", ["feat(api)!: remove v1"])).to_equal("3.0.0")

@test("commit thường không hợp lệ thì giữ nguyên")
def _():
    expect(bump_version("0.1.0", ["update stuff"])).to_equal("0.1.0")

@test("phiên bản không hợp lệ báo lỗi")
def _():
    expect(lambda: bump_version("01.2.3", ["fix: x"])).to_raise(ValueError)
'''
hints = ["Tách tiền tố v khỏi ba số phiên bản trước khi so sánh commit.", "Thứ tự ưu tiên là breaking, feat, rồi patch."]
explanation = "SemVer giúp người dùng phân biệt thay đổi phá vỡ tương thích, tính năng mới và bản sửa tương thích."

