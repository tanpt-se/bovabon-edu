lesson = '''
### Kubernetes: đối tượng và controller
Pod chạy một hoặc nhiều container cùng các tài nguyên mạng cơ bản; Deployment quản lý ReplicaSet và số Pod mong muốn. Service tạo điểm truy cập ổn định tới các Pod phù hợp selector. Ingress mô tả luật HTTP(S), nhưng cần Ingress controller thực thi.

| Đối tượng | Trách nhiệm |
|---|---|
| ConfigMap | Cấu hình không bí mật |
| Secret | Dữ liệu nhạy cảm, cần kiểm soát quyền và mã hoá phù hợp |
| readinessProbe | Xác định khi nào Pod nhận traffic |
| livenessProbe | Phát hiện container cần khởi động lại |
| HPA | Điều chỉnh replicas theo metric và giới hạn đã cấu hình |

Ví dụ Deployment đặt replicas, image và resource requests; Service chọn Pod bằng label. Rolling update thay Pod theo từng bước để giảm downtime. HPA thường cần metrics server và resource requests phù hợp khi dùng CPU utilization. Secret không tự động an toàn chỉ vì loại object mang tên Secret. Lỗi thường gặp là probe liveness quá gắt, selector không khớp label, hoặc nghĩ Ingress hoạt động khi chưa cài controller.
'''

