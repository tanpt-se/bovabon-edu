[[questions]]
id = "devops-lvc01"
module = "ops-linux-bash"
type = "code"
lang = "python"
difficulty = 1
tags = ["level:junior", "config"]
title = "Đọc file .env"
prompt = '''
Viết parse_env(text) đọc nội dung file .env và trả về dict.
- Bỏ dòng trống và dòng bắt đầu bằng # (sau khi bỏ khoảng trắng đầu dòng).
- Bỏ tiền tố "export " nếu có.
- Tách tại dấu = đầu tiên; bỏ khoảng trắng hai bên key và value. Bỏ qua dòng không có = hoặc key rỗng.
- Nếu value nằm trong một cặp nháy cùng loại (đơn hoặc kép) thì bỏ cặp nháy đó.
- Key xuất hiện sau ghi đè key trước.
Ví dụ: 'PORT=8080\nNAME="api"' trả về {"PORT": "8080", "NAME": "api"}.
'''
starter = '''
def parse_env(text):
    return {}
'''
solution = '''
def parse_env(text):
    result = {}
    for raw in text.splitlines():
        line = raw.strip()
        if not line or line.startswith("#"):
            continue
        if line.startswith("export "):
            line = line[len("export "):]
        if "=" not in line:
            continue
        key, value = line.split("=", 1)
        key, value = key.strip(), value.strip()
        if not key:
            continue
        if len(value) >= 2 and value[0] == value[-1] and value[0] in ("'", '"'):
            value = value[1:-1]
        result[key] = value
    return result
'''
tests = '''
@test("đọc key và bỏ nháy")
def _():
    expect(parse_env('PORT=8080\nNAME="api"')).to_equal({"PORT": "8080", "NAME": "api"})

@test("bỏ comment và dòng trống")
def _():
    expect(parse_env("# config\n\n  DEBUG = true  \n")).to_equal({"DEBUG": "true"})

@test("tách tại dấu = đầu tiên và bỏ export")
def _():
    expect(parse_env("export URL=postgres://u:p@h/db?a=b")).to_equal({"URL": "postgres://u:p@h/db?a=b"})

@test("bỏ dòng sai và ghi đè key")
def _():
    expect(parse_env("JUNK\n=x\nA='1'\nA=2")).to_equal({"A": "2"})

@test("không bỏ nháy lệch cặp")
def _():
    expect(parse_env("""Q="abc'""")).to_equal({"Q": "\"abc'"})
'''
hints = ["Dùng str.split('=', 1) để chỉ tách một lần.", "Kiểm tra ký tự đầu và cuối của value trước khi bỏ nháy."]
explanation = "File .env là cấu hình phổ biến cho ứng dụng 12-factor; parser cần xử lý comment, nháy và value chứa dấu =."
