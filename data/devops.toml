[[questions]]
id = "devops-lvc02"
module = "devops-lead"
type = "code"
lang = "python"
difficulty = 3
tags = ["level:lead", "slo"]
title = "Chính sách phát hành theo error budget"
prompt = '''
Viết release_policy(slo, total, failed, days_elapsed, window_days=30) trả về dict có ba khoá burn_rate, budget_remaining, action.
- burn_rate = (failed / total) / (1 - slo), làm tròn 4 chữ số.
- Phần budget đã tiêu = burn_rate * days_elapsed / window_days; budget_remaining = 1 - phần đã tiêu, không nhỏ hơn 0, làm tròn 4 chữ số.
- action là "freeze" nếu budget_remaining bằng 0, ngược lại "slow_down" nếu burn_rate > 1, còn lại "ship".
- Ném ValueError nếu slo không nằm trong khoảng mở (0, 1), total <= 0, failed < 0 hoặc failed > total, hoặc days_elapsed không nằm trong (0, window_days].
Ví dụ: release_policy(0.999, 1_000_000, 1500, 10) trả về {"burn_rate": 1.5, "budget_remaining": 0.5, "action": "slow_down"}.
'''
starter = '''
def release_policy(slo, total, failed, days_elapsed, window_days=30):
    return {"burn_rate": 0.0, "budget_remaining": 1.0, "action": "ship"}
'''
solution = '''
def release_policy(slo, total, failed, days_elapsed, window_days=30):
    if not (0 < slo < 1):
        raise ValueError("slo must be in (0, 1)")
    if total <= 0 or failed < 0 or failed > total:
        raise ValueError("invalid request counts")
    if not (0 < days_elapsed <= window_days):
        raise ValueError("invalid days_elapsed")
    burn_rate = round((failed / total) / (1 - slo), 4)
    consumed = burn_rate * days_elapsed / window_days
    remaining = round(max(0.0, 1 - consumed), 4)
    if remaining == 0:
        action = "freeze"
    elif burn_rate > 1:
        action = "slow_down"
    else:
        action = "ship"
    return {"burn_rate": burn_rate, "budget_remaining": remaining, "action": action}
'''
tests = '''
@test("burn chậm thì ship")
def _():
    result = release_policy(0.999, 1_000_000, 500, 10)
    expect(result["action"]).to_equal("ship")
    expect(result["burn_rate"]).to_be_close_to(0.5, 3)
    expect(result["budget_remaining"]).to_be_close_to(0.8333, 3)

@test("burn nhanh thì slow_down")
def _():
    expect(release_policy(0.999, 1_000_000, 1500, 10)).to_equal({"burn_rate": 1.5, "budget_remaining": 0.5, "action": "slow_down"})

@test("hết budget thì freeze và không âm")
def _():
    result = release_policy(0.999, 1_000_000, 4000, 10)
    expect(result["action"]).to_equal("freeze")
    expect(result["budget_remaining"]).to_equal(0.0)

@test("không có lỗi")
def _():
    expect(release_policy(0.99, 200, 0, 30)).to_equal({"burn_rate": 0.0, "budget_remaining": 1.0, "action": "ship"})

@test("đầu vào không hợp lệ")
def _():
    expect(lambda: release_policy(1.0, 100, 1, 5)).to_raise(ValueError)
    expect(lambda: release_policy(0.999, 0, 0, 5)).to_raise(ValueError)
    expect(lambda: release_policy(0.999, 100, 101, 5)).to_raise(ValueError)
    expect(lambda: release_policy(0.999, 100, 1, 31)).to_raise(ValueError)
'''
hints = ["Burn rate 1 nghĩa là tiêu budget đúng tốc độ để vừa hết ở cuối cửa sổ.", "Kiểm tra freeze trước slow_down."]
explanation = "Biến error budget policy thành code giúp pipeline tự quyết định chặn hay cho phép phát hành, thay vì tranh luận mỗi lần."

