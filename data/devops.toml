[[questions]]
id = "ops-018"
module = "ops-docker"
type = "code"
lang = "python"
difficulty = 3
title = "Cảnh báo best-practice Dockerfile"
prompt = '''
Viết dockerfile_warnings(text) trả về danh sách mã cảnh báo theo thứ tự latest_tag, many_run, root_user. Bỏ dòng trống và comment. Cảnh báo latest_tag nếu bất kỳ FROM nào dùng tag latest, không ghi tag, hoặc dùng scratch thì scratch không tính; image có digest @sha256: được xem là đã pin. Cảnh báo many_run khi có từ ba chỉ thị RUN trở lên. Mỗi FROM bắt đầu stage mới; cảnh báo root_user nếu stage cuối không có USER, hoặc USER cuối cùng của stage đó là root, 0, root:root hay 0:0. Chỉ thị không phân biệt hoa thường; FROM có thể có các tùy chọn --platform trước tên image.
'''
starter = '''
def dockerfile_warnings(text):
    return []
'''
solution = '''
def dockerfile_warnings(text):
    from_latest = False
    run_count = 0
    stage_count = 0
    final_user = None
    for raw_line in text.splitlines():
        line = raw_line.strip()
        if not line or line.startswith("#"):
            continue
        parts = line.split(None, 1)
        instruction = parts[0].upper()
        argument = parts[1].strip() if len(parts) == 2 else ""
        if instruction == "FROM":
            stage_count += 1
            final_user = None
            tokens = argument.split()
            image = next((token for token in tokens if not token.startswith("--")), "")
            if image and image.lower() != "scratch" and "@sha256:" not in image:
                slash = image.rfind("/")
                colon = image.rfind(":")
                tag = image[colon + 1:] if colon > slash else None
                if tag is None or tag.lower() == "latest":
                    from_latest = True
        elif instruction == "RUN":
            run_count += 1
        elif instruction == "USER" and stage_count:
            final_user = argument.split()[0].lower() if argument else ""
    warnings = []
    if from_latest:
        warnings.append("latest_tag")
    if run_count >= 3:
        warnings.append("many_run")
    if stage_count and (final_user is None or final_user in {"root", "0", "root:root", "0:0"}):
        warnings.append("root_user")
    return warnings
'''
tests = '''
@test("tag latest và mặc định bị cảnh báo")
def _():
    expect(dockerfile_warnings("FROM python\nUSER app")).to_equal(["latest_tag"])

@test("scratch không bị xem là tag latest")
def _():
    expect(dockerfile_warnings("FROM scratch\nUSER 1000")).to_equal([])

@test("nhiều RUN tạo cảnh báo")
def _():
    text = "FROM alpine:3.20\nRUN a\nRUN b\nRUN c\nUSER app"
    expect(dockerfile_warnings(text)).to_equal(["many_run"])

@test("stage cuối mặc định chạy root")
def _():
    text = "FROM golang:1.23 AS build\nUSER builder\nFROM alpine:3.20\nCOPY app /app"
    expect(dockerfile_warnings(text)).to_equal(["root_user"])

@test("stage cuối có USER không root")
def _():
    expect(dockerfile_warnings("FROM app@sha256:abc\nUSER 10001")).to_equal([])

@test("FROM platform option và explicit root")
def _():
    text = "FROM --platform=linux/amd64 app:latest\nUSER root"
    expect(dockerfile_warnings(text)).to_equal(["latest_tag", "root_user"])
'''
hints = ["Tách chỉ thị và đối số sau khi bỏ khoảng trắng đầu dòng.", "Khi gặp FROM mới, đặt lại USER vì cần đánh giá stage cuối."]
explanation = "Tag không pin, quá nhiều layer RUN và chạy mặc định bằng root là các tín hiệu review hữu ích; chúng không thay thế đánh giá ngữ cảnh."
sources = ["docker/engine/reference/commandline/build/index"]

