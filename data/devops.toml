module = "devops-lead"
type = "essay"
difficulty = 3
tags = ["level:lead", "incident"]
prompt = "MTTR trung bình của team là 3 giờ, phần lớn thời gian dành cho việc tìm xem lỗi ở đâu. Trình bày kế hoạch 1 quý để giảm MTTR, nêu thứ tự ưu tiên và cách đo."
keywords = [["runbook"], ["alert", "cảnh báo"], ["dashboard", "observability", "trace", "quan sát"], ["rollback", "feature flag"], ["postmortem", "game day", "diễn tập"]]
min_keywords = 3
model_answer = '''Đầu tiên chuẩn hoá observability: dashboard theo SLO cho từng service, log có request id và trace phân tán để khoanh vùng nhanh. Thứ hai, alert theo triệu chứng kèm runbook nêu bước kiểm tra và cách mitigate. Thứ ba, đảm bảo rollback một lệnh và feature flag cho tính năng rủi ro để giảm tác động trước khi tìm root cause. Cuối cùng chạy game day hằng tháng và theo dõi action item từ postmortem. Đo bằng MTTR, thời gian phát hiện và tỉ lệ sự cố có runbook.'''
explanation = "Giảm MTTR là giảm thời gian phát hiện, khoanh vùng và mitigate; mỗi bước cần công cụ và thói quen riêng, và phải đo được."

