type = "single"
difficulty = 3
tags = ["level:lead", "on-call"]
prompt = "Team 6 người trực luân phiên, pager kêu khoảng 40 lần mỗi tuần và 70% số lần tự hết trong vòng 5 phút. Người trực bắt đầu kiệt sức. Ưu tiên đầu tiên nên là gì?"
options = ["Thêm người từ team khác vào rotation để chia tải", "Rà soát alert: chuyển sang alert theo triệu chứng và SLO burn rate, xoá hoặc hạ cấp alert không actionable, mỗi alert còn lại có runbook", "Tăng gấp đôi ngưỡng của mọi alert", "Tắt pager ngoài giờ hành chính"]
answer = [1]
explanation = "Vấn đề gốc là alert nhiễu, không phải thiếu người. Thêm người chỉ chia đều nhiễu; tăng ngưỡng đồng loạt có thể che sự cố thật; tắt pager ngoài giờ bỏ mặc người dùng. Alert theo SLO burn rate giảm nhiễu mà vẫn bắt được sự cố ảnh hưởng người dùng."

[[questions]]
id = "devops-lv005"
module = "devops-lead"
type = "single"
difficulty = 3
tags = ["level:lead", "finops"]
prompt = "Hoá đơn cloud tăng 40% trong quý trong khi traffic chỉ tăng 10%. Ban giám đốc yêu cầu kế hoạch trong 2 tuần. Bước đầu tiên hợp lý nhất?"
options = ["Mua reserved instance 3 năm cho toàn bộ máy đang chạy", "Gắn tag chi phí theo team/service/môi trường và lập báo cáo chi phí theo đơn vị (ví dụ cost per 1000 request) để tìm nguồn tăng", "Giảm replica mọi service xuống 1", "Lên kế hoạch chuyển sang nhà cung cấp cloud khác"]
answer = [1]
explanation = "Không đo được chi phí thuộc về ai thì mọi tối ưu đều là đoán. Commitment dài hạn trước khi rightsizing có thể khoá chi phí cho tài nguyên lãng phí; giảm replica đồng loạt làm mất HA; đổi cloud tốn kém và không giải quyết nguyên nhân."

[[questions]]
id = "devops-lv006"
module = "devops-lead"
type = "multiple"
difficulty = 3
tags = ["level:lead", "finops"]
prompt = "Bạn soạn hướng dẫn rightsizing workload Kubernetes cho các team. Chọn các nhận định đúng."
options = ["Scheduler giữ chỗ trên node theo requests, nên requests đặt quá cao làm node trông đầy dù thực tế rảnh và vẫn phải trả tiền", "Nên đặt requests dựa trên mức sử dụng thực tế theo percentile (ví dụ p90-p95) và xem lại định kỳ", "Bỏ hẳn requests để scheduler tự tối ưu", "Node spot/preemptible phù hợp workload stateless chịu được gián đoạn khi có PDB và nhiều replica", "Luôn đặt CPU limit bằng 10 lần request để an toàn"]
answer = [0, 1, 3]
explanation = "Requests là cơ sở xếp lịch và thường là cơ sở tính chi phí node; bỏ requests làm Pod thành BestEffort, dễ bị evict và HPA theo utilization không hoạt động. Hệ số limit cố định không có căn cứ; cần dựa trên profile thực tế."
sources = ["kubernetes/core/pod-v1/index#ResourceRequirements", "kubernetes/policy/pod-disruption-budget-v1/index"]

[[questions]]
id = "devops-lv007"
module = "devops-lead"
type = "essay"
difficulty = 3
tags = ["level:lead", "gitops", "adr"]
prompt = "Viết một ADR ngắn (bối cảnh, quyết định, hệ quả) chọn giữa GitOps pull-based và push kubectl apply từ CI cho 3 cluster Kubernetes, khi CI hiện đang giữ kubeconfig quyền admin và cấu hình thường bị sửa tay."
keywords = [["gitops", "pull"], ["drift", "lệch cấu hình", "sửa tay"], ["credential", "kubeconfig", "quyền", "rbac"], ["rollback", "hoàn tác", "revert"], ["hệ quả", "đánh đổi", "trade-off"]]
min_keywords = 3
model_answer = '''Bối cảnh: 3 cluster, CI giữ kubeconfig quyền admin, cấu hình hay bị sửa tay nên drift liên tục. Quyết định: dùng GitOps pull-based, agent trong cluster đồng bộ từ repo manifest; CI chỉ build image và mở PR cập nhật tag. Hệ quả: CI không còn credential vào cluster, quyền được thu hẹp theo RBAC của agent; drift được phát hiện và tự sửa; rollback bằng git revert. Đánh đổi: team phải học công cụ mới, debug thêm một lớp đồng bộ, cần quy ước cấu trúc repo cho nhiều môi trường.'''
explanation = "ADR tốt nêu rõ ràng buộc (credential, drift), quyết định và cả cái giá phải trả để người sau hiểu vì sao chọn như vậy."
sources = ["git/git-revert"]

