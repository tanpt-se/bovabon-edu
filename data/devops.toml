[[questions]]
id = "devops-dvc04"
module = "devops-dv-terraform-modules"
type = "code"
lang = "python"
difficulty = 2
tags = ["level:middle"]
title = "Tóm tắt thay đổi trong Terraform plan"
prompt = '''
Viết `summarize_plan(plan)` nhận object JSON từ `terraform show -json` và trả về dict có các khóa `create`, `update`, `delete`, `replace`, `read`, `no_op`, ban đầu đều bằng 0. Duyệt `resource_changes`; mỗi entry có `change.actions`. Nếu actions chứa cả `create` và `delete` thì tăng riêng `replace` (không tăng create/delete). Nếu không, nhận diện chính xác các danh sách `['create']`, `['update']`, `['delete']`, `['read']`, `['no-op']`. Bỏ qua entry sai định dạng hoặc action không nhận diện. Ví dụ replacement `['delete', 'create']` chỉ tăng `replace`.
'''
starter = '''
def summarize_plan(plan):
    return {"create": 0, "update": 0, "delete": 0, "replace": 0, "read": 0, "no_op": 0}
'''
solution = '''
def summarize_plan(plan):
    result = {"create": 0, "update": 0, "delete": 0, "replace": 0, "read": 0, "no_op": 0}
    if not isinstance(plan, dict):
        return result
    changes = plan.get("resource_changes")
    if not isinstance(changes, list):
        return result
    mapping = {
        "create": "create",
        "update": "update",
        "delete": "delete",
        "read": "read",
        "no-op": "no_op",
    }
    for item in changes:
        if not isinstance(item, dict):
            continue
        change = item.get("change")
        if not isinstance(change, dict):
            continue
        actions = change.get("actions")
        if not isinstance(actions, list) or not all(isinstance(action, str) for action in actions):
            continue
        if "create" in actions and "delete" in actions:
            result["replace"] += 1
        elif len(actions) == 1 and actions[0] in mapping:
            result[mapping[actions[0]]] += 1
    return result
'''
tests = '''
@test("đếm các action cơ bản")
def _():
    plan = {"resource_changes": [
        {"change": {"actions": ["create"]}},
        {"change": {"actions": ["update"]}},
        {"change": {"actions": ["delete"]}},
        {"change": {"actions": ["read"]}},
        {"change": {"actions": ["no-op"]}},
    ]}
    expect(summarize_plan(plan)).to_equal({"create": 1, "update": 1, "delete": 1, "replace": 0, "read": 1, "no_op": 1})

@test("đếm replacement độc lập với thứ tự action")
def _():
    plan = {"resource_changes": [
        {"change": {"actions": ["delete", "create"]}},
        {"change": {"actions": ["create", "delete"]}},
    ]}
    expect(summarize_plan(plan)["replace"]).to_equal(2)
    expect(summarize_plan(plan)["create"]).to_equal(0)

@test("bỏ qua entry sai cấu trúc và action lạ")
def _():
    plan = {"resource_changes": [None, {}, {"change": {"actions": "create"}}, {"change": {"actions": ["forget"]}}]}
    expect(summarize_plan(plan)).to_equal({"create": 0, "update": 0, "delete": 0, "replace": 0, "read": 0, "no_op": 0})

@test("trả các số không khi thiếu resource_changes")
def _():
    expect(summarize_plan({})).to_equal({"create": 0, "update": 0, "delete": 0, "replace": 0, "read": 0, "no_op": 0})
'''
hints = ["Khởi tạo đầy đủ các khóa rồi xác thực từng cấp dictionary/list.", "Xử lý replacement trước action đơn để không tính nó thành create hoặc delete."]
explanation = "Bản tóm tắt giúp reviewer nhận ra replacement riêng vì nó thường có blast radius lớn hơn cập nhật tại chỗ."
sources = ["terraform/cli/commands/show", "terraform/language/modules/sources"]

[[questions]]
id = "devops-lv001"
module = "devops-lead"
type = "single"
difficulty = 3
tags = ["level:lead", "deploy-strategy"]
prompt = "Team 5 người vận hành service thanh toán trên Kubernetes, deploy mỗi ngày, đã có metrics error rate và latency tách theo version. Ngân sách không cho phép nhân đôi hạ tầng kể cả tạm thời. Chiến lược phát hành nào hợp lý nhất?"
options = ["Blue-green: dựng đủ một môi trường song song rồi đổi toàn bộ traffic", "Canary theo phần trăm traffic, tự động rollback khi metrics của version mới vượt ngưỡng", "Recreate vào giờ thấp điểm để tránh chạy hai version cùng lúc", "Rolling update mặc định và chỉ kiểm tra Pod đã Running"]
answer = [1]
explanation = "Canary tận dụng metrics theo version sẵn có, chỉ ảnh hưởng một phần nhỏ người dùng và không cần gấp đôi hạ tầng. Blue-green vi phạm ràng buộc chi phí; recreate gây downtime cho service thanh toán; rolling update chỉ nhìn trạng thái Running sẽ đẩy lỗi tới toàn bộ người dùng trước khi ai phát hiện."
sources = ["kubernetes/apps/deployment-v1/index"]

[[questions]]
id = "devops-lv002"
module = "devops-lead"
type = "single"
difficulty = 3
tags = ["level:lead", "slo"]
prompt = "SLO availability 99.9% theo cửa sổ 30 ngày. Sau 12 ngày team đã tiêu 80% error budget. PM muốn phát hành một tính năng lớn tuần này. Error budget policy đã được hai bên ký trước đó. Quyết định hợp lý nhất?"
options = ["Vẫn phát hành vì SLO chỉ tính vào cuối tháng", "Giảm nhịp: hoãn tính năng rủi ro, ưu tiên việc tăng độ tin cậy, chỉ cho phép bugfix và thay đổi có rollback nhanh theo policy", "Hạ SLO xuống 99% để có thêm budget", "Tắt các alert burn rate cho tới hết tháng"]
answer = [1]
explanation = "Error budget tồn tại để biến tranh luận ship hay ổn định thành quy tắc đã thống nhất. Burn nhanh (80% sau 40% thời gian) là tín hiệu giảm rủi ro. Hạ SLO tuỳ tiện hoặc tắt alert phá vỡ cam kết với người dùng; phát hành tiếp có nguy cơ vượt SLO."

[[questions]]
id = "devops-lv003"
module = "devops-lead"
type = "multiple"
difficulty = 3
tags = ["level:lead", "postmortem"]
prompt = "Bạn chuẩn hoá quy trình postmortem cho 4 team. Chọn các thực hành nên đưa vào template."
options = ["Timeline dựng từ log, metrics và lịch sử deploy thay vì trí nhớ", "Mỗi action item có owner và hạn hoàn thành được theo dõi", "Nêu tên người gây lỗi để rút kinh nghiệm kỷ luật", "Tập trung vào điều kiện hệ thống và quy trình đã cho phép lỗi lọt qua", "Chỉ viết postmortem khi sự cố làm mất doanh thu"]
answer = [0, 1, 3]
explanation = "Postmortem blameless nhắm vào hệ thống và quy trình; quy trách nhiệm cá nhân làm người ta giấu thông tin. Action item không owner sẽ không được làm. Ngưỡng viết postmortem nên dựa trên tác động tới SLO/người dùng, không chỉ doanh thu."

[[questions]]
