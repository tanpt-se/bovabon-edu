[[questions]]
id = "ops-030"
module = "ops-nginx"
type = "code"
lang = "python"
difficulty = 3
title = "Mô phỏng chọn Nginx location"
prompt = '''
Viết select_location(locations, path). locations là danh sách tuple (modifier, pattern) theo thứ tự cấu hình; modifier thuộc "", "=", "^~", "~", "~*". Trả về tuple location được chọn hoặc None. Khớp exact = lập tức; nếu không, lấy prefix dài nhất trong location "" và ^~, hoà độ dài thì giữ mục xuất hiện trước. Prefix ^~ đã chọn thì không xét regex. Nếu prefix không phải ^~, kiểm tra regex ~ phân biệt hoa thường và ~* không phân biệt hoa thường theo thứ tự cấu hình, trả regex khớp đầu tiên; nếu không regex nào khớp thì trả prefix dài nhất. Pattern regex là cú pháp Python re.
'''
starter = '''
def select_location(locations, path):
    return None
'''
solution = '''
import re


def select_location(locations, path):
    prefixes = []
    regexes = []
    for index, location in enumerate(locations):
        modifier, pattern = location
        if modifier == "=" and path == pattern:
            return location
        if modifier in ("", "^~") and path.startswith(pattern):
            prefixes.append((len(pattern), -index, modifier, location))
        elif modifier in ("~", "~*"):
            regexes.append(location)
    prefix = max(prefixes, default=None)
    if prefix is not None and prefix[2] == "^~":
        return prefix[3]
    for modifier, pattern in regexes:
        flags = re.IGNORECASE if modifier == "~*" else 0
        if re.search(pattern, path, flags):
            return (modifier, pattern)
    return prefix[3] if prefix is not None else None
'''
tests = '''
@test("exact match thắng")
def _():
    locations = [("", "/"), ("=", "/health"), ("~", ".*")]
    expect(select_location(locations, "/health")).to_equal(("=", "/health"))

@test("prefix dài nhất thắng khi không có regex")
def _():
    locations = [("", "/"), ("", "/api"), ("", "/api/v2")]
    expect(select_location(locations, "/api/v2/users")).to_equal(("", "/api/v2"))

@test("prefix ^~ bỏ qua regex")
def _():
    locations = [("~", "\\.js$"), ("^~", "/assets/")]
    expect(select_location(locations, "/assets/app.js")).to_equal(("^~", "/assets/"))

@test("regex đầu tiên khớp được chọn")
def _():
    locations = [("", "/"), ("~", "\\.js$"), ("~", "app")]
    expect(select_location(locations, "/app.js")).to_equal(("~", "\\.js$"))

@test("regex không phân biệt hoa thường")
def _():
    expect(select_location([("~*", "\\.jpg$")], "/img/PHOTO.JPG")).to_equal(("~*", "\\.jpg$"))

@test("không khớp trả None")
def _():
    expect(select_location([("", "/api")], "/static/a.css")).to_be_none()
'''
hints = ["Kiểm tra exact trong lần duyệt đầu.", "Tách nhóm prefix và regex; dùng thứ tự cấu hình cho regex."]
explanation = "Thuật toán location có ưu tiên rõ ràng; ^~ chỉ ảnh hưởng bước xét regex sau khi prefix đã thắng."
sources = ["nginx/http/ngx_http_core_module#location"]

[[modules]]
id = "ops-cicd-terraform"
title = "CI/CD và Terraform"
description = "Pipeline kiểm tra, triển khai có kiểm soát, Infrastructure as Code, state, plan và apply."
sources = ["terraform/language/syntax/configuration", "terraform/language/state/purpose", "terraform/language/state/remote", "terraform/tutorials/cli/plan", "terraform/tutorials/cli/apply"]
lesson = '''
### Tự động hoá triển khai và hạ tầng
CI chạy các bước kiểm tra lặp lại khi có thay đổi; CD tự động đưa artifact đã kiểm chứng tới môi trường theo quy tắc phát hành. Pipeline nên tách build, test, scan và deploy; chỉ cấp credential tối thiểu cho job cần dùng, không in secret vào log.

| Terraform command | Vai trò |
|---|---|
| init | Khởi tạo thư mục làm việc và provider |
| plan | Tính toán thay đổi dự kiến, chưa áp dụng vào hạ tầng |
| apply | Thực thi kế hoạch thay đổi đã xác nhận |
| state | Theo dõi liên hệ giữa cấu hình và resource thực tế |

Terraform state có thể chứa dữ liệu nhạy cảm; backend từ xa cần hỗ trợ kiểm soát truy cập và khoá state phù hợp. Hãy review plan, lưu state an toàn và tránh nhiều người apply đồng thời không có locking. Ví dụ pipeline có thể chạy fmt, validate, plan khi mở pull request rồi chỉ apply sau khi được phê duyệt ở môi trường mục tiêu. Lỗi thường gặp là coi plan là thay đổi đã xảy ra, sửa state bằng tay tuỳ tiện hoặc lưu secret trong repository.
'''

