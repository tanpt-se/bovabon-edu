[[questions]]
id = "devops-dvc03"
module = "devops-dv-nginx-edge"
type = "code"
lang = "python"
difficulty = 3
tags = ["level:senior"]
title = "Xác định client qua proxy tin cậy"
prompt = '''
Viết `resolve_client_ip(peer_ip, forwarded_for, trusted_cidrs)`. `peer_ip` là địa chỉ kết nối trực tiếp tới Nginx; `forwarded_for` là chuỗi IP phân tách bằng dấu phẩy; `trusted_cidrs` là danh sách CIDR của proxy tin cậy. Nếu peer không thuộc CIDR tin cậy, bỏ qua header và trả về peer. Nếu peer tin cậy, duyệt các địa chỉ trong X-Forwarded-For từ phải sang trái, bỏ qua IP nằm trong trusted CIDRs và trả về IP hợp lệ đầu tiên không tin cậy. Bỏ qua địa chỉ/CIDR lỗi định dạng; nếu peer IP không hợp lệ trả `None`, nếu không tìm được client hợp lệ thì trả peer. Trả địa chỉ chuẩn hóa bằng `str(ipaddress.ip_address(...))`. Chỉ dùng thư viện chuẩn Python.
'''
starter = '''
def resolve_client_ip(peer_ip, forwarded_for, trusted_cidrs):
    return peer_ip
'''
solution = '''
import ipaddress


def resolve_client_ip(peer_ip, forwarded_for, trusted_cidrs):
    try:
        peer = ipaddress.ip_address(peer_ip)
    except (ValueError, TypeError):
        return None

    networks = []
    if isinstance(trusted_cidrs, list):
        for cidr in trusted_cidrs:
            try:
                networks.append(ipaddress.ip_network(cidr, strict=False))
            except (ValueError, TypeError):
                continue

    def is_trusted(address):
        return any(
            address.version == network.version and address in network
            for network in networks
        )

    if not is_trusted(peer):
        return str(peer)
    if not isinstance(forwarded_for, str):
        return str(peer)

    for raw_ip in reversed(forwarded_for.split(",")):
        try:
            address = ipaddress.ip_address(raw_ip.strip())
        except ValueError:
            continue
        if not is_trusted(address):
            return str(address)
    return str(peer)
'''
tests = '''
@test("bỏ qua header khi peer không tin cậy")
def _():
    result = resolve_client_ip("203.0.113.5", "198.51.100.9", ["10.0.0.0/8"])
    expect(result).to_equal("203.0.113.5")

@test("lấy client từ proxy tin cậy")
def _():
    result = resolve_client_ip("10.0.0.2", "198.51.100.7", ["10.0.0.0/8"])
    expect(result).to_equal("198.51.100.7")

@test("bỏ qua các proxy tin cậy từ phải sang trái")
def _():
    result = resolve_client_ip("10.0.0.2", "198.51.100.7, 10.0.0.1", ["10.0.0.0/8"])
    expect(result).to_equal("198.51.100.7")

@test("không nhận giá trị giả mạo đứng trước client thật")
def _():
    chain = "192.0.2.99, 198.51.100.7, 10.0.0.1"
    expect(resolve_client_ip("10.0.0.2", chain, ["10.0.0.0/8"])).to_equal("198.51.100.7")

@test("IP peer không hợp lệ trả None")
def _():
    expect(resolve_client_ip("not-an-ip", "198.51.100.7", ["10.0.0.0/8"])).to_be_none()

@test("header không có client hợp lệ thì giữ peer")
def _():
    result = resolve_client_ip("10.0.0.2", "bad-ip, 10.0.0.1", ["10.0.0.0/8"])
    expect(result).to_equal("10.0.0.2")
'''
hints = ["Chỉ đọc X-Forwarded-For khi peer kết nối nằm trong mạng tin cậy.", "Duyệt header từ proxy gần nhất về phía client và tiếp tục bỏ qua các hop tin cậy."]
