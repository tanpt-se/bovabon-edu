[[modules]]
id = "ops-git"
title = "Git: nhánh, lịch sử và cứu hộ"
description = "Branch, merge/rebase, conflict, reset/restore/revert, cherry-pick, reflog và workflow cộng tác."
sources = ["git/git-branch", "git/git-merge", "git/git-rebase", "git/git-restore", "git/git-reset", "git/git-revert", "git/git-cherry-pick", "git/git-reflog", "git/git-log"]
lesson = '''
### Git và lịch sử thay đổi
Git giữ snapshot trong commit; working tree là file đang sửa, index là vùng chuẩn bị commit. Branch chỉ là con trỏ nhẹ tới một commit.

| Lệnh | Tác động chính | Dùng khi |
|---|---|---|
| git merge | Kết hợp lịch sử, có thể tạo merge commit | Cập nhật nhánh chia sẻ mà không viết lại lịch sử |
| git rebase | Phát lại commit trên nền mới | Làm gọn nhánh riêng trước khi review |
| git restore | Khôi phục nội dung file hoặc bỏ staging | Sửa trạng thái working tree/index |
| git reset | Di chuyển HEAD và có thể thay đổi index/working tree | Chỉnh lịch sử cục bộ cẩn thận |
| git revert | Tạo commit đảo ngược thay đổi cũ | Hoàn tác an toàn trên nhánh đã chia sẻ |
| git cherry-pick | Áp dụng một commit lên nhánh hiện tại | Chuyển bản sửa chọn lọc |

Ví dụ workflow: tạo feature branch, commit các thay đổi nhỏ, cập nhật từ main bằng merge hoặc rebase theo quy ước nhóm, xử lý conflict rồi mở review. Rebase thay đổi commit ID và không nên dùng để viết lại nhánh người khác đang dựa vào. Reflog ghi lại vị trí HEAD gần đây, hữu ích khi commit tưởng như mất sau reset. Lỗi thường gặp là nhầm reset với revert, force-push nhánh chia sẻ, hoặc giải quyết conflict nhưng quên kiểm tra diff trước commit.
'''

