[[modules]]
id = "databases-dv-pg-recovery"
title = "PostgreSQL backup, recovery & replication"
description = "Chọn logical/physical backup, PITR và replication theo mục tiêu RPO/RTO."
sources = ["postgresql~18/backup-dump", "postgresql~18/backup-file", "postgresql~18/continuous-archiving", "postgresql~18/logical-replication-quick-setup", "postgresql~18/logical-replication-publication", "postgresql~18/logical-replication-subscription"]
lesson = '''
### Khả năng khôi phục và sao chép dữ liệu
Backup chỉ có giá trị khi khôi phục được trong thời gian chấp nhận được. RPO là lượng dữ liệu tối đa có thể mất; RTO là thời gian tối đa để dịch vụ hoạt động lại. pg_dump tạo logical dump cho một database, thuận tiện khi cần khôi phục chọn lọc hoặc chuyển dữ liệu; pg_dumpall có thể lưu các đối tượng toàn cluster như role. Physical backup như pg_basebackup sao chép cấu trúc cluster, phù hợp dựng standby hoặc làm nền cho khôi phục vật lý.

| Cách làm | Phạm vi / mục đích | Lưu ý |
|---|---|---|
| Logical dump | Schema và dữ liệu theo database | Dễ chọn đối tượng; cần quản lý globals riêng |
| Physical backup | Cluster PostgreSQL | Phù hợp khôi phục vật lý và standby |
| PITR | Khôi phục tới thời điểm trong quá khứ | Cần base backup cùng chuỗi WAL được lưu liên tục |
| Logical replication | Chuyển thay đổi hàng được publication chọn | Publisher/subscriber có schema và vòng đời riêng |
| Physical replication | Phát lại WAL cho standby của cluster | Phù hợp hot standby và failover có điều phối |

Để làm PITR, đội vận hành cần tạo base backup, lưu WAL archive ngoài nơi có thể mất cùng máy chủ, rồi diễn tập khôi phục tới một thời điểm cụ thể. Logical replication khởi tạo bản sao ban đầu rồi gửi thay đổi theo publication/subscription; nó hữu ích cho chọn bảng, tích hợp hoặc nâng cấp, nhưng không tự sao chép mọi DDL và sequence. Bảng có UPDATE/DELETE cần replica identity phù hợp. Replication slot giúp subscriber chậm không mất WAL cần thiết, song slot bị bỏ quên có thể giữ WAL mãi và làm đầy đĩa.

Lỗi hay gặp: nhầm replication với backup; chỉ kiểm tra rằng job backup chạy thành công mà chưa restore; không giám sát WAL archive hoặc slot; cho rằng logical replication tự tạo schema; failover không có kế hoạch promotion và chuyển kết nối. Hãy định kỳ đo thời gian restore, kiểm tra tính nhất quán và ghi lại thứ tự phục hồi.
'''

