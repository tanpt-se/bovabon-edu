[[questions]]
id = "databases-lvc03"
module = "db-sql-advanced"
type = "code"
lang = "python"
difficulty = 2
tags = ["level:middle", "pagination"]
title = "Phân trang keyset"
prompt = '''
Viết fetch_page(conn, after_id, limit) nhận kết nối sqlite3 và bảng posts(id INTEGER PRIMARY KEY, title TEXT). Trả về danh sách tuple (id, title) của tối đa limit bài viết có id lớn hơn after_id, sắp xếp tăng dần theo id. Nếu after_id là None thì bắt đầu từ đầu.
Dùng truy vấn tham số hoá, không dùng OFFSET.
Ví dụ: posts có id 1..5, after_id = 2, limit = 2 thì kết quả là [(3, ...), (4, ...)].
'''
starter = '''
def fetch_page(conn, after_id, limit):
    return []
'''
solution = '''
def fetch_page(conn, after_id, limit):
    if after_id is None:
        after_id = -1
    rows = conn.execute(
        "SELECT id, title FROM posts WHERE id > ? ORDER BY id LIMIT ?",
        (after_id, limit),
    ).fetchall()
    return [(r[0], r[1]) for r in rows]
'''
tests = '''
import sqlite3

def make_db(n):
    conn = sqlite3.connect(":memory:")
    conn.execute("CREATE TABLE posts (id INTEGER PRIMARY KEY, title TEXT)")
    conn.executemany("INSERT INTO posts VALUES (?, ?)", [(i, "t%d" % i) for i in range(1, n + 1)])
    return conn

@test("trang đầu khi after_id là None")
def _():
    expect(fetch_page(make_db(5), None, 2)).to_equal([(1, "t1"), (2, "t2")])

@test("trang tiếp theo")
def _():
    expect(fetch_page(make_db(5), 2, 2)).to_equal([(3, "t3"), (4, "t4")])

@test("trang cuối ít hơn limit")
def _():
    expect(fetch_page(make_db(5), 4, 10)).to_equal([(5, "t5")])

@test("hết dữ liệu")
