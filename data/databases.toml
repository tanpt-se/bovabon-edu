[[questions]]
id = "databases-lvc01"
module = "db-sql-basics"
type = "code"
lang = "python"
difficulty = 1
tags = ["level:junior", "join"]
title = "Khách hàng chưa mua hàng"
prompt = '''
Viết customers_without_orders(conn) nhận một kết nối sqlite3. Cơ sở dữ liệu có bảng customers(id, name) và orders(id, customer_id, total).
Trả về danh sách tên các khách hàng không có đơn hàng nào, sắp xếp tăng dần theo tên.
Ví dụ: có khách An (có đơn) và Binh (không có đơn) thì kết quả là ["Binh"]. Nếu mọi khách đều có đơn, trả về danh sách rỗng.
'''
starter = '''
def customers_without_orders(conn):
    return []
'''
solution = '''
def customers_without_orders(conn):
    rows = conn.execute(
        "SELECT c.name FROM customers c "
        "LEFT JOIN orders o ON o.customer_id = c.id "
        "WHERE o.id IS NULL ORDER BY c.name"
    ).fetchall()
    return [r[0] for r in rows]
'''
tests = '''
import sqlite3

def make_db():
    conn = sqlite3.connect(":memory:")
    conn.executescript("""
        CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT NOT NULL);
        CREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER, total INTEGER);
    """)
    return conn

@test("trả về khách chưa có đơn")
def _():
    conn = make_db()
    conn.executemany("INSERT INTO customers VALUES (?, ?)", [(1, "An"), (2, "Binh")])
    conn.execute("INSERT INTO orders VALUES (1, 1, 100)")
    expect(customers_without_orders(conn)).to_equal(["Binh"])

@test("khách có nhiều đơn không bị lặp hay trả về")
def _():
    conn = make_db()
    conn.executemany("INSERT INTO customers VALUES (?, ?)", [(1, "An"), (2, "Chi")])
    conn.executemany("INSERT INTO orders VALUES (?, ?, ?)", [(1, 1, 10), (2, 1, 20), (3, 1, 30)])
    expect(customers_without_orders(conn)).to_equal(["Chi"])

@test("sắp xếp theo tên")
def _():
    conn = make_db()
    conn.executemany("INSERT INTO customers VALUES (?, ?)", [(1, "Zoe"), (2, "Bao"), (3, "Mai")])
    expect(customers_without_orders(conn)).to_equal(["Bao", "Mai", "Zoe"])

@test("mọi khách đều có đơn")
def _():
    conn = make_db()
    conn.execute("INSERT INTO customers VALUES (1, 'An')")
    conn.execute("INSERT INTO orders VALUES (1, 1, 5)")
    expect(customers_without_orders(conn)).to_equal([])

@test("bảng rỗng")
def _():
    expect(customers_without_orders(make_db())).to_equal([])
'''
hints = ["LEFT JOIN từ customers sang orders rồi lọc dòng không khớp.", "Dòng không khớp có o.id IS NULL; nhớ ORDER BY c.name."]
explanation = "Mẫu anti-join: LEFT JOIN + IS NULL. Cũng có thể dùng NOT EXISTS; chọn cách dễ đọc với team."
sources = ["sqlite/lang_select"]

