[[questions]]
id = "db-012"
module = "db-sql-advanced"
type = "code"
lang = "python"
difficulty = 3
title = "Top N mỗi nhóm bằng window function"
prompt = '''
Viết top_n_per_group(records, n), dùng sqlite3.connect(":memory:").
records gồm các tuple (category, item, score), trong đó item là duy nhất trong mỗi category. Trả về tối đa n tuple cho mỗi category theo score giảm dần; khi điểm bằng nhau, item tăng dần. Kết quả cuối được nhóm theo category tăng dần và theo đúng thứ hạng trong nhóm. Nếu n <= 0 hoặc records rỗng, trả danh sách rỗng.
Ví dụ: [("fruit", "pear", 5), ("fruit", "apple", 8)] với n=1 trả [("fruit", "apple", 8)].
Phải xếp hạng bằng ROW_NUMBER() OVER (PARTITION BY ...), không xử lý nhóm bằng vòng lặp Python.
'''
starter = '''
import sqlite3

def top_n_per_group(records, n):
    return []
'''
solution = '''
import sqlite3

def top_n_per_group(records, n):
    conn = sqlite3.connect(":memory:")
    try:
        conn.execute("CREATE TABLE scores (category TEXT NOT NULL, item TEXT NOT NULL, score REAL NOT NULL)")
        conn.executemany("INSERT INTO scores VALUES (?, ?, ?)", records)
        return conn.execute(
            "WITH ranked AS ("
            "SELECT category, item, score, "
            "ROW_NUMBER() OVER (PARTITION BY category ORDER BY score DESC, item ASC) AS position "
            "FROM scores) "
            "SELECT category, item, score FROM ranked "
            "WHERE position <= ? ORDER BY category ASC, position ASC",
            (max(0, n),),
        ).fetchall()
    finally:
        conn.close()
'''
tests = '''
@test("giữ tối đa n dòng của mỗi nhóm")
def _():
    rows = [("a", "x", 4), ("a", "y", 9), ("b", "z", 3), ("b", "w", 7)]
    expect(top_n_per_group(rows, 1)).to_equal([("a", "y", 9.0), ("b", "w", 7.0)])

@test("xếp điểm giảm dần và phá hoà theo item")
def _():
    rows = [("a", "pear", 5), ("a", "apple", 5), ("a", "plum", 7)]
    expect(top_n_per_group(rows, 3)).to_equal([("a", "plum", 7.0), ("a", "apple", 5.0), ("a", "pear", 5.0)])

@test("n bằng không")
def _():
    expect(top_n_per_group([("a", "x", 1)], 0)).to_equal([])

@test("n lớn hơn số dòng và dữ liệu rỗng")
def _():
    expect(top_n_per_group([("a", "x", 1)], 10)).to_equal([("a", "x", 1.0)])
    expect(top_n_per_group([], 3)).to_equal([])
'''
hints = ["Tính ROW_NUMBER trong CTE, phân vùng theo category.", "Lọc position <= n rồi ORDER BY category, position."]
explanation = "Window function giữ chi tiết mỗi sản phẩm trong khi xếp hạng riêng bên trong nhóm."
sources = ["sqlite/lang_select", "postgresql~18/functions-window"]

[[questions]]
id = "db-013"
module = "db-sql-advanced"
type = "code"
lang = "python"
difficulty = 3
title = "Duyệt cây danh mục với CTE đệ quy"
prompt = '''
Viết category_tree(categories, root_id), dùng SQLite trong bộ nhớ.
categories gồm tuple (id, parent_id, name); parent_id là None cho nút gốc. id là số nguyên duy nhất. Trả về danh sách (id, name, depth) bắt đầu từ root_id ở depth 0, sau đó gồm mọi con cháu. Sắp xếp theo depth rồi id tăng dần. Nếu root_id không tồn tại, trả [].
Dữ liệu có thể chứa chu trình do lỗi; một id không được xuất hiện quá một lần trong kết quả. Hãy dùng WITH RECURSIVE và theo dõi đường đi để dừng chu trình.
'''
starter = '''
import sqlite3

def category_tree(categories, root_id):
    return []
'''
solution = '''
import sqlite3

def category_tree(categories, root_id):
    conn = sqlite3.connect(":memory:")
    try:
        conn.execute("CREATE TABLE categories (id INTEGER PRIMARY KEY, parent_id INTEGER, name TEXT NOT NULL)")
        conn.executemany("INSERT INTO categories VALUES (?, ?, ?)", categories)
        return conn.execute(
            "WITH RECURSIVE tree(id, name, depth, path) AS ("
            "SELECT id, name, 0, ',' || id || ',' FROM categories WHERE id = ? "
            "UNION ALL "
            "SELECT c.id, c.name, tree.depth + 1, tree.path || c.id || ',' "
            "FROM categories AS c JOIN tree ON c.parent_id = tree.id "
            "WHERE instr(tree.path, ',' || c.id || ',') = 0) "
            "SELECT id, name, depth FROM tree ORDER BY depth, id",
            (root_id,),
        ).fetchall()
    finally:
        conn.close()
'''
tests = '''
@test("trả gốc và mọi hậu duệ với độ sâu")
def _():
    rows = [(1, None, "root"), (2, 1, "left"), (3, 1, "right"), (4, 2, "leaf")]
    expect(category_tree(rows, 1)).to_equal([(1, "root", 0), (2, "left", 1), (3, "right", 1), (4, "leaf", 2)])

@test("nút lá chỉ có chính nó")
def _():
    expect(category_tree([(1, None, "root"), (2, 1, "leaf")], 2)).to_equal([(2, "leaf", 0)])

@test("root không tồn tại")
def _():
    expect(category_tree([(1, None, "root")], 9)).to_equal([])

@test("dừng khi dữ liệu có chu trình")
def _():
    rows = [(1, 3, "one"), (2, 1, "two"), (3, 2, "three")]
    expect(category_tree(rows, 1)).to_equal([(1, "one", 0), (2, "two", 1), (3, "three", 2)])
'''
hints = ["Phần anchor chọn root_id và tạo depth 0.", "Lưu các id đã đi qua trong path; loại id sắp thêm nếu đã có trong chuỗi đường đi."]
explanation = "CTE đệ quy phù hợp với cây phân cấp; đường đi giúp dừng an toàn khi dữ liệu lỗi có chu trình."
sources = ["sqlite/lang_with#recursivecte", "postgresql~18/queries-with#QUERIES-WITH-RECURSIVE"]

[[questions]]
id = "db-014"
module = "db-sql-advanced"
type = "code"
lang = "python"
difficulty = 2
title = "UPSERT cấu hình"
prompt = '''
Viết upsert_setting(existing, key, value), dùng một bảng SQLite trong database :memory:.
existing là danh sách tuple (key, value) ban đầu; key là duy nhất. Chèn hoặc cập nhật cặp key/value mới bằng một câu lệnh UPSERT có ON CONFLICT(key) DO UPDATE. Trả về toàn bộ cấu hình dưới dạng danh sách tuple sắp xếp tăng dần theo key.
Ví dụ: existing=[("theme", "light")], key="theme", value="dark" phải trả [("theme", "dark")].
'''
starter = '''
import sqlite3

def upsert_setting(existing, key, value):
    return existing
'''
solution = '''
import sqlite3

def upsert_setting(existing, key, value):
    conn = sqlite3.connect(":memory:")
    try:
        conn.execute("CREATE TABLE settings (key TEXT PRIMARY KEY, value TEXT NOT NULL)")
        conn.executemany("INSERT INTO settings VALUES (?, ?)", existing)
        conn.execute(
            "INSERT INTO settings(key, value) VALUES (?, ?) "
            "ON CONFLICT(key) DO UPDATE SET value = excluded.value",
            (key, value),
        )
        return conn.execute("SELECT key, value FROM settings ORDER BY key").fetchall()
    finally:
        conn.close()
'''
tests = '''
@test("chèn key mới")
def _():
    expect(upsert_setting([], "theme", "dark")).to_equal([("theme", "dark")])

@test("cập nhật key trùng")
def _():
    expect(upsert_setting([("theme", "light")], "theme", "dark")).to_equal([("theme", "dark")])

@test("giữ các key khác và sắp xếp kết quả")
def _():
    rows = [("z", "last"), ("a", "first")]
    expect(upsert_setting(rows, "m", "middle")).to_equal([("a", "first"), ("m", "middle"), ("z", "last")])

@test("cập nhật không tạo dòng trùng")
def _():
    expect(upsert_setting([("x", "one")], "x", "two")).to_have_length(1)
'''
hints = ["Tạo key thành PRIMARY KEY để SQLite phát hiện xung đột.", "Trong DO UPDATE, dùng excluded.value là giá trị vừa định chèn."]
explanation = "ON CONFLICT xử lý cạnh tranh ghi ở cơ sở dữ liệu thay vì tách SELECT và INSERT thành hai bước."
sources = ["sqlite/lang_upsert", "postgresql~18/sql-insert#SQL-ON-CONFLICT"]

