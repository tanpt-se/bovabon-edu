[[questions]]
id = "databases-lvc04"
module = "db-transactions"
type = "code"
lang = "python"
difficulty = 3
tags = ["level:senior", "optimistic-lock"]
title = "Khoá lạc quan bằng cột version"
prompt = '''
Bảng accounts(id INTEGER PRIMARY KEY, balance INTEGER, version INTEGER). Viết withdraw(conn, account_id, amount, expected_version) dùng optimistic locking.
Thực hiện một UPDATE trừ amount khỏi balance và tăng version thêm 1 chỉ khi version hiện tại bằng expected_version VÀ balance >= amount. Trả True nếu cập nhật đúng một dòng, ngược lại trả False (version cũ, không đủ số dư hoặc tài khoản không tồn tại). Phải commit khi thành công. Dùng truy vấn tham số hoá.
'''
starter = '''
def withdraw(conn, account_id, amount, expected_version):
    return False
'''
solution = '''
def withdraw(conn, account_id, amount, expected_version):
    cur = conn.execute(
        "UPDATE accounts SET balance = balance - ?, version = version + 1 "
        "WHERE id = ? AND version = ? AND balance >= ?",
        (amount, account_id, expected_version, amount),
    )
    conn.commit()
    return cur.rowcount == 1
'''
tests = '''
import sqlite3

def make_db():
    conn = sqlite3.connect(":memory:")
    conn.execute("CREATE TABLE accounts (id INTEGER PRIMARY KEY, balance INTEGER, version INTEGER)")
    conn.execute("INSERT INTO accounts VALUES (1, 100, 0)")
    return conn

def row(conn):
    return conn.execute("SELECT balance, version FROM accounts WHERE id = 1").fetchone()

@test("rút thành công tăng version")
def _():
    conn = make_db()
    expect(withdraw(conn, 1, 30, 0)).to_be_true()
    expect(row(conn)).to_equal((70, 1))

@test("version cũ bị từ chối")
def _():
    conn = make_db()
    expect(withdraw(conn, 1, 30, 0)).to_be_true()
    expect(withdraw(conn, 1, 30, 0)).to_be_false()
    expect(row(conn)).to_equal((70, 1))

@test("không đủ số dư")
def _():
    conn = make_db()
    expect(withdraw(conn, 1, 500, 0)).to_be_false()
    expect(row(conn)).to_equal((100, 0))

@test("tài khoản không tồn tại")
def _():
    expect(withdraw(make_db(), 99, 10, 0)).to_be_false()

@test("rút chính xác toàn bộ số dư")
def _():
    conn = make_db()
    expect(withdraw(conn, 1, 100, 0)).to_be_true()
    expect(row(conn)).to_equal((0, 1))
'''
hints = ["Đặt cả điều kiện version và balance trong WHERE của câu UPDATE.", "cursor.rowcount cho biết số dòng bị ảnh hưởng."]
explanation = "Optimistic locking tránh giữ khoá lâu: xung đột được phát hiện lúc ghi nhờ điều kiện version; người gọi tải lại dữ liệu và thử lại."
sources = ["sqlite/lang_update"]
