[[questions]]
id = "db-031"
module = "db-transactions"
type = "code"
lang = "python"
difficulty = 3
tags = ["level:senior"]
title = "Chuyển tiền có rollback"
prompt = '''
Viết transfer(conn, sender, receiver, amount_cents) trên connection SQLite đã có bảng accounts(id TEXT PRIMARY KEY, balance_cents INTEGER NOT NULL).
Nếu amount_cents <= 0, hoặc thiếu một trong hai tài khoản, ném ValueError. Trừ tiền bằng UPDATE có điều kiện balance_cents >= amount_cents; nếu không đủ số dư thì ném ValueError có nội dung "insufficient funds". Sau đó cộng đúng số tiền vào tài khoản nhận. Cả hai thay đổi phải nằm trong một transaction; lỗi phải rollback để số dư không đổi.
Khi thành công, trả danh sách tuple (id, balance_cents) theo id tăng dần. Hàm không đóng connection do caller sở hữu.
'''
starter = '''
import sqlite3

def transfer(conn, sender, receiver, amount_cents):
    return []
'''
solution = '''
import sqlite3

def transfer(conn, sender, receiver, amount_cents):
    if amount_cents <= 0:
        raise ValueError("amount must be positive")
    with conn:
        sender_exists = conn.execute("SELECT 1 FROM accounts WHERE id = ?", (sender,)).fetchone()
        receiver_exists = conn.execute("SELECT 1 FROM accounts WHERE id = ?", (receiver,)).fetchone()
        if sender_exists is None or receiver_exists is None:
            raise ValueError("account not found")
        changed = conn.execute(
            "UPDATE accounts SET balance_cents = balance_cents - ? "
            "WHERE id = ? AND balance_cents >= ?",
            (amount_cents, sender, amount_cents),
        )
        if changed.rowcount != 1:
            raise ValueError("insufficient funds")
        conn.execute(
            "UPDATE accounts SET balance_cents = balance_cents + ? WHERE id = ?",
            (amount_cents, receiver),
        )
        return conn.execute("SELECT id, balance_cents FROM accounts ORDER BY id").fetchall()
'''
tests = '''
def make_accounts(rows):
    conn = sqlite3.connect(":memory:")
    conn.execute("CREATE TABLE accounts (id TEXT PRIMARY KEY, balance_cents INTEGER NOT NULL)")
    conn.executemany("INSERT INTO accounts VALUES (?, ?)", rows)
    conn.commit()
    return conn

@test("chuyển thành công và trả số dư mới")
def _():
    conn = make_accounts([("a", 100), ("b", 20)])
    expect(transfer(conn, "a", "b", 35)).to_equal([("a", 65), ("b", 55)])
    conn.close()

@test("thiếu số dư thì rollback")
def _():
    conn = make_accounts([("a", 10), ("b", 20)])
    expect(lambda: transfer(conn, "a", "b", 11)).to_raise(ValueError, match="insufficient funds")
    expect(conn.execute("SELECT id, balance_cents FROM accounts ORDER BY id").fetchall()).to_equal([("a", 10), ("b", 20)])
    conn.close()

@test("tài khoản không tồn tại")
def _():
    conn = make_accounts([("a", 10)])
    expect(lambda: transfer(conn, "a", "missing", 1)).to_raise(ValueError, match="account not found")
    expect(conn.execute("SELECT balance_cents FROM accounts WHERE id = 'a'").fetchone()).to_equal((10,))
    conn.close()

@test("số tiền không dương")
def _():
    conn = make_accounts([("a", 10), ("b", 0)])
    expect(lambda: transfer(conn, "a", "b", 0)).to_raise(ValueError, match="amount must be positive")
    conn.close()
'''
hints = ["Dùng with conn để commit khi thành công và rollback khi có exception.", "Trừ tiền với điều kiện balance_cents >= amount_cents rồi kiểm tra rowcount."]
explanation = "Điều kiện trong UPDATE tránh race giữa lần đọc số dư và lần ghi; hai cập nhật nằm chung transaction."
sources = ["sqlite/lang_transaction", "postgresql~18/transaction-iso"]

