[[questions]]
id = "db-006"
module = "db-sql-basics"
type = "code"
lang = "python"
difficulty = 2
tags = ["level:middle"]
title = "Báo cáo doanh thu theo tháng"
prompt = '''
Viết monthly_revenue(orders, items), dùng sqlite3 và một database :memory:.
orders là danh sách bộ (order_id, created_at, status), trong đó ngày là chuỗi ISO YYYY-MM-DD. items là danh sách bộ (order_id, quantity, unit_price_cents). Chỉ tính đơn có status là paid; doanh thu mỗi dòng là quantity nhân unit_price_cents.
Trả về danh sách tuple (YYYY-MM, revenue_cents) được nhóm theo tháng và sắp xếp tăng dần theo tháng. Tháng không có đơn paid có item không xuất hiện. Không dùng số thực cho tiền.
Ví dụ: đơn paid ngày 2026-03-02 có một dòng quantity 2, unit_price_cents 450 thì kết quả là [("2026-03", 900)].
'''
starter = '''
import sqlite3

def monthly_revenue(orders, items):
    return []
'''
solution = '''
import sqlite3

def monthly_revenue(orders, items):
    conn = sqlite3.connect(":memory:")
    try:
        conn.execute("CREATE TABLE orders (order_id INTEGER PRIMARY KEY, created_at TEXT NOT NULL, status TEXT NOT NULL)")
        conn.execute("CREATE TABLE items (order_id INTEGER NOT NULL, quantity INTEGER NOT NULL, unit_price_cents INTEGER NOT NULL)")
        conn.executemany("INSERT INTO orders VALUES (?, ?, ?)", orders)
        conn.executemany("INSERT INTO items VALUES (?, ?, ?)", items)
        return conn.execute(
            "SELECT substr(o.created_at, 1, 7) AS month, "
            "SUM(i.quantity * i.unit_price_cents) AS revenue_cents "
            "FROM orders AS o JOIN items AS i ON i.order_id = o.order_id "
            "WHERE o.status = ? GROUP BY substr(o.created_at, 1, 7) ORDER BY month",
            ("paid",),
        ).fetchall()
    finally:
        conn.close()
'''
tests = '''
@test("nhóm nhiều dòng trong cùng tháng")
def _():
    result = monthly_revenue(
        [(1, "2026-03-02", "paid"), (2, "2026-03-15", "paid")],
        [(1, 2, 450), (2, 1, 300)],
    )
    expect(result).to_equal([("2026-03", 1200)])

@test("sắp xếp tháng và loại đơn chưa thanh toán")
def _():
    result = monthly_revenue(
        [(1, "2026-04-02", "paid"), (2, "2026-02-03", "paid"), (3, "2026-03-01", "cancelled")],
        [(1, 1, 200), (2, 3, 100), (3, 5, 1000)],
    )
    expect(result).to_equal([("2026-02", 300), ("2026-04", 200)])

@test("đơn không có item không tạo doanh thu")
def _():
    expect(monthly_revenue([(1, "2026-01-01", "paid")], [])).to_equal([])

@test("dữ liệu rỗng")
def _():
    expect(monthly_revenue([], [])).to_equal([])
'''
hints = ["Tạo hai bảng trong SQLite memory và nối items với orders.", "Dùng substr(created_at, 1, 7), GROUP BY và SUM(quantity * unit_price_cents)."]
explanation = "Giữ tiền ở đơn vị nhỏ nhất dạng số nguyên để tránh sai số dấu phẩy động."
