[[modules]]
id = "db-sql-basics"
title = "SQL căn bản"
description = "SELECT, các loại JOIN, lọc và nhóm dữ liệu, subquery, NULL."
sources = ["sqlite/lang_select", "sqlite/lang_aggfunc", "sqlite/lang_expr#isisnot", "postgresql~18/sql-select", "postgresql~18/queries-table-expressions#QUERIES-JOIN"]
lesson = '''
### Đọc và kết hợp dữ liệu
Một truy vấn thường lọc dòng bằng WHERE, nhóm bằng GROUP BY, lọc nhóm bằng HAVING, rồi mới sắp xếp và giới hạn kết quả. JOIN kết hợp các bảng theo điều kiện; hãy xác định rõ mỗi phía có thể có bao nhiêu dòng khớp để tránh nhân đôi dữ liệu khi tính tổng.

| Cấu trúc | Tác dụng |
|---|---|
| INNER JOIN | Chỉ lấy dòng có cặp khớp ở hai phía |
| LEFT JOIN | Giữ mọi dòng bên trái; cột bên phải là NULL nếu không khớp |
| FULL JOIN | Giữ dòng khớp và không khớp ở cả hai phía |
| GROUP BY / HAVING | Gom dòng rồi lọc theo kết quả tổng hợp |

Ví dụ: **SELECT department, COUNT(*) FROM employees WHERE active = 1 GROUP BY department HAVING COUNT(*) >= 3**. Subquery có thể trả một giá trị để so sánh hoặc một tập dòng để lọc bằng EXISTS. NULL biểu thị chưa biết/không có giá trị; so sánh bằng dấu bằng với NULL cho kết quả UNKNOWN, nên dùng IS NULL, IS NOT NULL hoặc COALESCE khi cần giá trị thay thế.

Lỗi hay gặp: đặt điều kiện cột bảng phải ở WHERE sau LEFT JOIN làm mất các dòng không khớp; nối bảng có nhiều dòng con rồi SUM cột bảng cha gây cộng lặp; dùng COUNT(*) thay COUNT(column) khi muốn đếm giá trị khác NULL.
'''

[[modules]]
id = "db-sql-advanced"
title = "SQL nâng cao"
description = "Window function, CTE đệ quy, UPSERT và dữ liệu JSON."
sources = ["postgresql~18/functions-window", "postgresql~18/queries-with#QUERIES-WITH-RECURSIVE", "postgresql~18/sql-insert#SQL-ON-CONFLICT", "postgresql~18/datatype-json", "sqlite/lang_with#recursivecte", "sqlite/lang_upsert", "sqlite/json1"]
lesson = '''
### Window function, CTE và ghi dữ liệu
Window function tính trên các dòng liên quan nhưng vẫn giữ từng dòng trong kết quả. PARTITION BY chia nhóm độc lập; ORDER BY xác định thứ tự bên trong nhóm. ROW_NUMBER đánh số duy nhất, còn RANK/DENSE_RANK xử lý điểm đồng hạng theo quy tắc riêng. Chọn hàm theo yêu cầu “đúng N dòng” hay “lấy tất cả dòng đồng hạng”.

| Công cụ | Khi dùng |
|---|---|
| CTE với WITH | Đặt tên cho một phần truy vấn để dễ đọc/tái sử dụng |
| WITH RECURSIVE | Đi từ tập gốc sang các dòng con, như cây danh mục |
| UPSERT | INSERT và xử lý xung đột khoá bằng DO UPDATE hoặc DO NOTHING |
| JSON / JSONB | Lưu và truy vấn cấu trúc linh hoạt; JSONB là kiểu riêng của PostgreSQL |

Ví dụ top hai mỗi nhóm: tạo CTE có ROW_NUMBER() OVER (PARTITION BY category ORDER BY score DESC), rồi lọc số thứ tự không vượt quá hai. CTE đệ quy có phần gốc và phần đệ quy nối với kết quả trước; dữ liệu có chu trình cần giới hạn hoặc theo dõi đường đi để không lặp vô hạn. UPSERT cần khoá/unique constraint làm mục tiêu xung đột.

Lỗi hay gặp: dùng GROUP BY khi muốn giữ chi tiết từng dòng; nhầm thứ hạng khi có điểm bằng nhau; viết CTE đệ quy mà thiếu điều kiện dừng; giả định JSON/JSONB giống nhau giữa các hệ quản trị.
'''

[[modules]]
id = "db-data-model"
title = "Thiết kế & chuẩn hoá"
description = "Khoá chính, khoá ngoại, ràng buộc, 1NF–3NF và denormalization có chủ đích."
sources = ["postgresql~18/ddl-basics", "postgresql~18/ddl-constraints", "sqlite/lang_createtable", "sqlite/foreignkeys"]
lesson = '''
### Lược đồ giữ dữ liệu nhất quán
Chọn khoá chính ổn định cho mỗi thực thể; khoá ngoại biểu diễn quan hệ và giúp ngăn bản ghi mồ côi. UNIQUE, NOT NULL và CHECK biến quy tắc nghiệp vụ thành điều kiện mà cơ sở dữ liệu kiểm tra trên mọi đường ghi dữ liệu.

| Dạng chuẩn | Ý chính |
|---|---|
| 1NF | Mỗi ô chứa một giá trị thuộc tính, không danh sách lặp trong một cột |
| 2NF | Đạt 1NF và thuộc tính không khoá phụ thuộc toàn bộ khoá ghép |
| 3NF | Đạt 2NF và thuộc tính không khoá không phụ thuộc bắc cầu vào khoá |

Ví dụ: thay vì lưu tên khách hàng lặp trong từng đơn, lưu khách hàng ở bảng riêng rồi tham chiếu customer_id. Chuẩn hoá giảm bất nhất khi sửa/xoá và làm rõ quyền sở hữu dữ liệu. Denormalization có thể hợp lý cho báo cáo đọc nhiều hoặc dữ liệu tổng hợp, nhưng cần đo tải thực tế và xác định cách đồng bộ để tránh bản sao cũ.

Lỗi hay gặp: dùng khoá ngoại nhưng quên bật kiểm tra foreign key ở SQLite; cho phép NULL dù nghiệp vụ yêu cầu giá trị; lưu nhiều số điện thoại phân cách bằng dấu phẩy; thêm cột tổng hợp mà không có quy trình cập nhật nhất quán.
'''

[[modules]]
id = "db-index-performance"
title = "Index & hiệu năng"
description = "B-tree, composite index, EXPLAIN, covering index và chi phí ghi."
sources = ["postgresql~18/indexes-intro", "postgresql~18/indexes-types#INDEXES-TYPES-BTREE", "postgresql~18/indexes-multicolumn", "postgresql~18/indexes-index-only-scans", "postgresql~18/sql-explain", "sqlite/lang_createindex", "sqlite/queryplanner", "sqlite/queryplanner#covidx", "sqlite/lang_explain"]
lesson = '''
### Tăng tốc đúng truy vấn
Index là cấu trúc phụ giúp tìm hoặc sắp xếp dòng nhanh hơn; B-tree phù hợp với nhiều phép so sánh bằng, khoảng và thứ tự. Index không miễn phí: chiếm dung lượng và làm INSERT/UPDATE/DELETE tốn thêm công cập nhật.

| Chỉ mục | Lưu ý |
|---|---|
| B-tree trên một cột | Hữu ích cho lọc, so sánh khoảng và ORDER BY phù hợp |
| Composite (a, b) | Thường tận dụng tốt tiền tố a và điều kiện a cùng b |
| Covering index | Chứa cả cột lọc/sắp xếp và cột cần trả về, có thể tránh đọc bảng |
| EXPLAIN | Cho biết kế hoạch dự kiến; EXPLAIN ANALYZE còn chạy truy vấn trong PostgreSQL |

Ví dụ, truy vấn theo tenant_id rồi created_at có thể hợp với index (tenant_id, created_at). Đổi thứ tự cột nếu workload chủ yếu lọc theo cột khác; không có thứ tự “selective nhất trước” đúng cho mọi truy vấn. Dùng EXPLAIN hoặc EXPLAIN QUERY PLAN trên dữ liệu đại diện, sau đó so sánh kế hoạch và thời gian.

Lỗi hay gặp: tạo index cho mọi cột; cho rằng planner bắt buộc dùng index; chỉ nhìn truy vấn nhỏ; quên index có thể giảm tốc độ ghi và tăng dung lượng; dùng SELECT * khiến covering index khó bao phủ.
'''

[[modules]]
id = "db-transactions"
title = "Transaction & đồng thời"
description = "ACID, isolation level, lock, deadlock, MVCC và rollback."
sources = ["postgresql~18/transaction-iso", "postgresql~18/mvcc-intro", "postgresql~18/explicit-locking#LOCKING-DEADLOCKS", "sqlite/lang_transaction", "sqlite/isolation"]
lesson = '''
### Giao dịch nhiều bước
Transaction gom nhiều thao tác thành một đơn vị. ACID lần lượt là atomicity (tất cả hoặc không), consistency (giữ ràng buộc), isolation (hạn chế ảnh hưởng qua lại) và durability (đã commit thì bền vững theo cấu hình lưu trữ).

| Khái niệm | Ý nghĩa thực tế |
|---|---|
| Isolation level | Mức độ các transaction quan sát thay đổi của nhau |
| Lock | Đồng bộ truy cập; có thể làm transaction phải chờ |
| MVCC | Nhiều phiên bản giúp reader quan sát snapshot trong khi writer thay đổi dữ liệu |
| Deadlock | Hai giao dịch chờ tài nguyên mà giao dịch kia đang giữ; hệ quản trị thường huỷ một bên |

Ví dụ chuyển tiền: trừ số dư có điều kiện, kiểm tra đúng một dòng đã đổi, cộng vào tài khoản nhận rồi commit. Nếu thiếu tiền hoặc bước sau lỗi, rollback để không mất một nửa giao dịch. PostgreSQL mặc định READ COMMITTED; mức cao hơn có thể phát hiện xung đột và yêu cầu ứng dụng chạy lại transaction. SQLite có mô hình ghi khác PostgreSQL và chỉ cho một writer hoạt động tại một thời điểm.

Lỗi hay gặp: commit giữa chừng; đọc số dư rồi cập nhật mà không kiểm tra điều kiện trong câu UPDATE; giữ lock lâu; sau deadlock không retry an toàn; nghĩ MVCC loại bỏ mọi xung đột.
'''

[[modules]]
id = "db-redis"
title = "Redis & NoSQL"
description = "Data type, TTL, cache-aside, rate limit và pub/sub."
sources = ["redis/type/index", "redis/set/index", "redis/hset/index", "redis/lpush/index", "redis/sadd/index", "redis/zadd/index", "redis/expire/index", "redis/ttl/index", "redis/incr/index", "redis/publish/index", "redis/subscribe/index", "redis/xadd/index", "redis/xgroup-create/index", "redis/xreadgroup/index", "redis/xack/index"]
lesson = '''
### Chọn cấu trúc cho truy cập nhanh
Redis lưu cặp key/value và cung cấp cấu trúc dữ liệu chuyên biệt: String cho giá trị/counter, Hash cho field của object, List cho chuỗi có thứ tự, Set cho phần tử duy nhất, Sorted Set cho xếp hạng theo score, Stream cho log sự kiện. Chọn theo thao tác cần thực hiện, không chỉ theo hình dạng JSON.

| Mẫu | Cách hoạt động |
|---|---|
| TTL | Hạn dùng theo key; EXPIRE đặt thời hạn, TTL đọc thời gian còn lại |
| Cache-aside | Đọc cache; miss thì tải nguồn chính, ghi cache; TTL/invalidation giới hạn dữ liệu cũ |
| Rate limit | INCR đếm request theo cửa sổ; đặt TTL nguyên tử để counter tự hết hạn |
| Pub/Sub | Gửi thông điệp tới subscriber đang lắng nghe, không phải hàng đợi lưu trữ bền vững |

Ví dụ: cache hồ sơ theo user:id với TTL ngắn; sau khi cập nhật hồ sơ, xoá key hoặc phát sự kiện invalidation. Với counter rate limit, thao tác tăng và đặt TTL cần được phối hợp nguyên tử để tránh key tồn tại mãi khi có lỗi giữa hai bước. Dữ liệu cần đọc lại sau mất kết nối nên dùng Stream/queue phù hợp thay vì dựa vào Pub/Sub.

Lỗi hay gặp: không có TTL cho cache; invalidation thiếu dẫn tới dữ liệu cũ; cache miss đồng loạt gây tải dồn lên database; nghĩ Pub/Sub giữ lại tin nhắn cho subscriber đến sau; dùng key quá lớn hoặc không có quy ước namespace.
'''

