[[questions]]
id = "databases-lvc02"
module = "databases-lead"
type = "code"
lang = "python"
difficulty = 3
tags = ["level:lead", "rpo-rto"]
title = "Kiểm tra RPO của lịch backup"
prompt = '''
Viết worst_case_data_loss(backup_times, horizon). backup_times là danh sách thời điểm (phút) các bản backup/WAL archive thành công, có thể chưa sắp xếp, nằm trong khoảng [0, horizon]. Hệ thống bắt đầu ở phút 0 với bản backup ban đầu, nên coi 0 luôn là một mốc, và horizon là thời điểm cuối của cửa sổ đánh giá.
Trả về khoảng cách lớn nhất (phút) giữa hai mốc liên tiếp (gồm cả mốc 0 và horizon). Đó là lượng dữ liệu tối đa có thể mất nếu sự cố xảy ra ngay trước mốc tiếp theo.
Ví dụ: backup_times [60, 120] và horizon 240 cho mốc 0, 60, 120, 240 nên kết quả là 120. Không sửa danh sách đầu vào; mốc trùng nhau không ảnh hưởng.
'''
starter = '''
def worst_case_data_loss(backup_times, horizon):
    return 0
'''
solution = '''
def worst_case_data_loss(backup_times, horizon):
    points = sorted(set(backup_times) | {0, horizon})
    return max(b - a for a, b in zip(points, points[1:]))
'''
tests = '''
@test("lịch đều")
def _():
    expect(worst_case_data_loss([60, 120], 180)).to_equal(60)

@test("khoảng trống cuối cửa sổ")
def _():
    expect(worst_case_data_loss([60, 120], 240)).to_equal(120)

@test("danh sách chưa sắp xếp và có trùng")
def _():
    expect(worst_case_data_loss([120, 60, 60, 180], 200)).to_equal(60)

@test("chưa có backup nào ngoài mốc đầu")
def _():
    expect(worst_case_data_loss([], 300)).to_equal(300)

@test("không sửa danh sách đầu vào")
def _():
    data = [90, 30]
    worst_case_data_loss(data, 100)
    expect(data).to_equal([90, 30])

@test("mốc nằm sát đầu hoặc cuối")
def _():
    expect(worst_case_data_loss([0, 100], 100)).to_equal(100)
'''
hints = ["Gộp 0 và horizon vào tập mốc rồi sắp xếp.", "Dùng zip(points, points[1:]) để tính hiệu giữa các mốc liên tiếp."]
explanation = "RPO thực tế được quyết định bởi khoảng trống lớn nhất giữa hai điểm khôi phục, không phải khoảng cách trung bình. Cần giám sát khoảng trống này, đặc biệt khi job backup/WAL archive lỗi."
sources = ["postgresql~18/continuous-archiving"]

