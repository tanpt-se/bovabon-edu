[[modules]]
id = "databases-dv-redis-workflows"
title = "Redis transaction & Stream consumer group"
description = "Ghép thao tác nguyên tử, phát hiện xung đột và xử lý sự kiện có thể được giao lại."
sources = ["redis/multi/index", "redis/watch/index", "redis/exec/index", "redis/xgroup-create/index", "redis/xreadgroup/index", "redis/xack/index"]
lesson = '''
### Từ thao tác nguyên tử đến xử lý sự kiện
Redis MULTI xếp các lệnh vào hàng đợi và EXEC chạy chúng liên tiếp như một đơn vị không bị lệnh client khác chen vào. Transaction không tương đương rollback của SQL: nếu một lệnh gặp lỗi lúc thực thi, lệnh đó lỗi nhưng các lệnh còn lại vẫn có thể chạy. WATCH tạo optimistic concurrency: nếu key được theo dõi thay đổi trước EXEC, transaction bị huỷ để ứng dụng đọc lại và thử lại.

| Cơ chế | Đảm bảo | Khi dùng |
|---|---|---|
| MULTI / EXEC | Các lệnh không bị xen kẽ bởi client khác | Gom nhiều thao tác Redis có thứ tự |
| WATCH | Phát hiện key đổi trước EXEC | Cập nhật dựa trên giá trị vừa đọc |
| Stream consumer group | Phân phối entry và theo dõi entry chưa xác nhận | Worker xử lý nền có thể tiếp tục sau lỗi |
| XACK | Xác nhận entry đã được xử lý | Xoá entry khỏi pending list của group |

Với Streams, XADD thêm entry, XGROUP CREATE tạo nhóm, XREADGROUP đọc entry mới và đưa chúng vào pending-entry list. Worker chỉ XACK sau khi tác động nghiệp vụ đã được lưu bền vững; entry chưa xác nhận có thể được xem bằng XPENDING và giao lại cho worker khác. Vì vậy consumer cần chịu được giao ít nhất một lần: nếu tiến trình chết sau khi ghi database nhưng trước XACK, sự kiện có thể đến lần nữa. Dùng event id làm khoá idempotency hoặc ràng buộc unique để tránh ghi nhận tác động lặp.

MULTI không tạo transaction phân tán giữa Redis và database. Nếu cần cập nhật cả hai nơi, phải thiết kế retry, outbox/inbox hoặc cơ chế đối soát; thứ tự “ghi DB rồi ACK” vẫn có thể khiến event được giao lại. Giữ lệnh trong transaction ngắn, giới hạn số entry mỗi lần xử lý và có chiến lược claim pending để worker chết không giữ công việc mãi.

Lỗi hay gặp: tưởng lỗi một lệnh sẽ rollback cả EXEC; ACK trước khi side effect đã bền vững; coi Stream consumer group như Pub/Sub; bỏ qua pending entry; giả định mỗi event chỉ giao đúng một lần; cập nhật nhiều hệ thống mà không có idempotency.
'''

