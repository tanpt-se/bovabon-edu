[[questions]]
id = "db-037"
module = "db-redis"
type = "code"
lang = "python"
difficulty = 2
title = "Cache-aside với TTL mô phỏng Redis"
prompt = '''
Viết cache_aside(key, cache, loader, now, ttl) để mô phỏng cache-aside trong Redis bằng dictionary Python.
cache lưu key -> (value, expires_at). Nếu key tồn tại và now < expires_at, trả value mà không gọi loader. Nếu thiếu hoặc đã hết hạn, gọi loader(key), lưu kết quả mới với expires_at = now + ttl khi ttl > 0 rồi trả kết quả. Với ttl <= 0, không lưu giá trị mới. Cache đã hết hạn phải được thay bằng kết quả vừa tải.
Ví dụ: cache rỗng, loader trả "Ada", now=10, ttl=5 thì hàm trả "Ada" và cache["user:1"] là ("Ada", 15).
'''
starter = '''
def cache_aside(key, cache, loader, now, ttl):
    return loader(key)
'''
solution = '''
def cache_aside(key, cache, loader, now, ttl):
    cached = cache.get(key)
    if cached is not None:
        value, expires_at = cached
        if now < expires_at:
            return value
    cache.pop(key, None)
    value = loader(key)
    if ttl > 0:
        cache[key] = (value, now + ttl)
    return value
'''
tests = '''
@test("miss tải dữ liệu rồi ghi TTL")
def _():
    cache = {}
    calls = []
    def load(key):
        calls.append(key)
        return "Ada"
    expect(cache_aside("user:1", cache, load, 10, 5)).to_be("Ada")
    expect(cache).to_equal({"user:1": ("Ada", 15)})
    expect(calls).to_equal(["user:1"])

@test("hit trước thời điểm hết hạn không gọi loader")
def _():
    cache = {"k": ("cached", 15)}
    def fail_loader(key):
        raise AssertionError("cache hit should not load")
    expect(cache_aside("k", cache, fail_loader, 14, 5)).to_be("cached")

@test("hết hạn đúng thời điểm thì tải lại và thay giá trị")
def _():
    cache = {"k": ("old", 15)}
    expect(cache_aside("k", cache, lambda key: "new", 15, 3)).to_be("new")
    expect(cache).to_equal({"k": ("new", 18)})

@test("ttl không dương thì không lưu")
def _():
    cache = {}
    expect(cache_aside("k", cache, lambda key: "value", 20, 0)).to_be("value")
    expect(cache).to_equal({})
'''
hints = ["Giá trị cache chỉ hợp lệ khi now nhỏ hơn expires_at.", "Xoá entry cũ trước khi gọi loader; chỉ ghi cache nếu ttl dương."]
explanation = "Mô phỏng cache-aside và TTL; hệ thống nhiều tiến trình còn cần xử lý đồng thời và invalidation."
sources = ["redis/set/index", "redis/expire/index", "redis/ttl/index"]

[[modules]]
id = "databases-dv-pg-search"
title = "PostgreSQL full-text search"
description = "Tạo chỉ mục văn bản, phân tích truy vấn, xếp hạng và chọn cấu hình từ điển."
sources = ["postgresql~18/textsearch-intro", "postgresql~18/textsearch-controls", "postgresql~18/textsearch-tables", "postgresql~18/textsearch-indexes", "postgresql~18/textsearch-dictionaries"]
lesson = '''
### Tìm kiếm theo từ và ngữ nghĩa
Full-text search chuẩn hoá văn bản thành lexeme để so khớp từ, thay vì quét chuỗi con như LIKE. PostgreSQL dùng tsvector cho nội dung đã phân tích và tsquery cho yêu cầu tìm kiếm; toán tử @@ kiểm tra vector có khớp query hay không. Cấu hình như english hoặc simple quyết định cách tách từ, loại stop word và stemming, vì vậy cần chọn theo ngôn ngữ dữ liệu và giữ nhất quán giữa lúc lập chỉ mục với lúc truy vấn.

| Cách làm | Hành vi | Điểm cần cân nhắc |
|---|---|---|
| LIKE / ILIKE | Tìm chuỗi con theo mẫu | Không chuẩn hoá từ; mẫu bắt đầu bằng % thường khó tận dụng B-tree |
| tsvector @@ tsquery | Khớp lexeme đã phân tích | Hỗ trợ từ dừng, stemming, cụm từ và toán tử |
| GIN trên tsvector | Tìm nhanh tập lexeme ứng viên | Tăng chi phí ghi; xếp hạng vẫn cần tính trên kết quả |

Ví dụ, có thể tạo cột search_vector từ title và body, dùng coalesce để NULL không làm mất cả biểu thức, rồi tạo GIN index trên cột đó. Truy vấn dùng search_vector @@ websearch_to_tsquery('simple', $1) với tham số đã bind; websearch_to_tsquery nhận cú pháp gần kiểu tìm kiếm web, còn plainto_tsquery phù hợp khi muốn coi input thường như các từ cần đồng thời khớp. ts_rank có thể sắp thứ tự theo mức liên quan; setweight cho phép ưu tiên title hơn body.

Lỗi hay gặp: dùng cấu hình khác nhau khi tạo vector và query; tạo index trên biểu thức nhưng truy vấn biểu thức khác; quên xử lý NULL; nhầm full-text search với substring search; cho rằng GIN tự cung cấp thứ tự relevance. Với dữ liệu đa ngôn ngữ, một cấu hình duy nhất có thể không phù hợp mọi bản ghi.
'''

