[[questions]]
id = "databases-dvc02"
module = "databases-dv-redis-workflows"
type = "code"
lang = "python"
difficulty = 2
tags = ["level:middle"]
title = "Lọc sự kiện đã xử lý"
prompt = '''
Viết select_new_events(event_ids, processed_ids). event_ids là danh sách id nhận từ một lô Redis Stream; processed_ids là tập id đã áp dụng vào hệ thống nghiệp vụ.
Trả về tuple (accepted, updated_ids). accepted chứa mỗi id chưa xử lý đúng một lần, theo thứ tự xuất hiện đầu tiên trong lô. updated_ids là một tập mới gồm processed_ids và toàn bộ id được nhận. Không thay đổi processed_ids đầu vào. Một event id lặp trong lô hoặc đã có trong processed_ids phải bị bỏ qua.
Ví dụ: event_ids là ["a", "b", "a"] và processed_ids là {"b"} thì kết quả accepted là ["a"].
'''
starter = '''
def select_new_events(event_ids, processed_ids):
    return [], set(processed_ids)
'''
solution = '''
def select_new_events(event_ids, processed_ids):
    updated_ids = set(processed_ids)
    accepted = []
    for event_id in event_ids:
        if event_id not in updated_ids:
            accepted.append(event_id)
            updated_ids.add(event_id)
    return accepted, updated_ids
'''
tests = '''
@test("nhận các id mới theo thứ tự")
def _():
    accepted, updated = select_new_events(["a", "b"], {"old"})
    expect(accepted).to_equal(["a", "b"])
    expect(updated).to_equal({"old", "a", "b"})

@test("bỏ qua id đã có")
def _():
    accepted, updated = select_new_events(["a", "b"], {"a"})
    expect(accepted).to_equal(["b"])
    expect(updated).to_equal({"a", "b"})

@test("khử trùng lặp trong cùng lô")
def _():
    accepted, updated = select_new_events(["a", "b", "a", "b"], set())
    expect(accepted).to_equal(["a", "b"])
    expect(updated).to_equal({"a", "b"})

@test("không sửa tập đầu vào")
def _():
    processed = {"done"}
    select_new_events(["new"], processed)
    expect(processed).to_equal({"done"})

@test("lô rỗng giữ nguyên trạng thái")
def _():
    accepted, updated = select_new_events([], {"done"})
    expect(accepted).to_equal([])
    expect(updated).to_equal({"done"})
'''
hints = ["Tạo bản sao set của processed_ids để cập nhật mà không sửa input.", "Duyệt event_ids theo thứ tự và thêm id vào set ngay khi nhận để loại bản lặp trong cùng lô."]
explanation = "Bài tập mô phỏng deduplication phía consumer; hệ thống thực tế cần lưu event id và side effect theo cách bền vững."
sources = ["redis/xreadgroup/index", "redis/xack/index"]

