[[questions]]
id = "databases-dvc01"
module = "databases-dv-pg-search"
type = "code"
lang = "python"
difficulty = 2
title = "Xếp hạng ứng viên tìm kiếm"
prompt = '''
Viết hàm rank_search(documents, terms). documents là danh sách dictionary có các khoá id, title, body; terms là danh sách từ cần tìm.
Chuẩn hoá bằng cách tách chuỗi theo các nhóm ký tự chữ/số Unicode và so sánh không phân biệt hoa thường. Một tài liệu chỉ được nhận nếu có đủ mọi từ tìm kiếm trong title hoặc body. Tính điểm mô phỏng: mỗi từ có trong title được 2 điểm, mỗi từ có trong body được 1 điểm; một từ xuất hiện ở cả hai nơi cộng cả hai. Trả về danh sách id theo điểm giảm dần; nếu bằng điểm thì giữ thứ tự đầu vào. Bỏ từ trùng trong terms; nếu không còn từ nào thì trả danh sách rỗng.
Đây là bài mô phỏng bộ lọc và trọng số cơ bản, không yêu cầu tái tạo stemming hay ts_rank của PostgreSQL.
Ví dụ: tài liệu title là Rust database, body là index, tìm rust và database thì tài liệu được nhận.
'''
starter = '''
import re

def rank_search(documents, terms):
    return []
'''
solution = '''
import re

def rank_search(documents, terms):
    def tokens(value):
        return set(re.findall(r"\w+", value.casefold(), flags=re.UNICODE))

    query_terms = list(dict.fromkeys(
        token
        for term in terms
        for token in re.findall(r"\w+", term.casefold(), flags=re.UNICODE)
    ))
    if not query_terms:
        return []

    ranked = []
    for position, document in enumerate(documents):
        title = tokens(document.get("title", ""))
        body = tokens(document.get("body", ""))
        if all(term in title or term in body for term in query_terms):
            score = 2 * sum(term in title for term in query_terms)
            score += sum(term in body for term in query_terms)
            ranked.append((-score, position, document["id"]))
    ranked.sort()
    return [document_id for _, _, document_id in ranked]
'''
tests = '''
@test("ưu tiên từ xuất hiện ở tiêu đề")
def _():
    docs = [
        {"id": 1, "title": "Rust database", "body": ""},
        {"id": 2, "title": "", "body": "Rust database"},
    ]
    expect(rank_search(docs, ["rust", "database"])).to_equal([1, 2])

@test("cho phép từ truy vấn nằm ở hai trường")
def _():
    docs = [{"id": "a", "title": "Rust guide", "body": "database index"}]
    expect(rank_search(docs, ["rust", "index"])).to_equal(["a"])

@test("yêu cầu mọi từ tìm kiếm")
def _():
    docs = [
        {"id": 1, "title": "Rust database", "body": ""},
        {"id": 2, "title": "Rust guide", "body": ""},
    ]
    expect(rank_search(docs, ["rust", "database"])).to_equal([1])

@test("không phân biệt hoa thường và dấu câu")
def _():
    docs = [{"id": 7, "title": "PostgreSQL, INDEX!", "body": ""}]
    expect(rank_search(docs, ["postgresql", "index"])).to_equal([7])

@test("từ lặp không làm tăng điểm")
def _():
    docs = [
        {"id": 1, "title": "Rust", "body": ""},
        {"id": 2, "title": "Rust", "body": "Rust"},
    ]
    expect(rank_search(docs, ["rust", "rust"])).to_equal([2, 1])

@test("query rỗng trả danh sách rỗng")
def _():
    expect(rank_search([{"id": 1, "title": "Rust", "body": ""}], ["!!!"])).to_equal([])
'''
hints = ["Dùng re.findall với biểu thức Unicode và casefold để chuẩn hoá từ.", "Tạo set từ title/body; lọc tài liệu đủ mọi từ rồi sắp xếp theo điểm và vị trí ban đầu."]
explanation = "Bài tập mô phỏng AND search và trọng số trường; PostgreSQL có thêm stemming, cấu hình từ điển và cơ chế xếp hạng riêng."
sources = ["postgresql~18/textsearch-intro", "postgresql~18/textsearch-tables"]

[[modules]]
id = "databases-dv-pg-recovery"
title = "PostgreSQL backup, recovery & replication"
description = "Chọn logical/physical backup, PITR và replication theo mục tiêu RPO/RTO."
sources = ["postgresql~18/backup-dump", "postgresql~18/backup-file", "postgresql~18/continuous-archiving", "postgresql~18/logical-replication-quick-setup", "postgresql~18/logical-replication-publication", "postgresql~18/logical-replication-subscription"]
lesson = '''
### Khả năng khôi phục và sao chép dữ liệu
Backup chỉ có giá trị khi khôi phục được trong thời gian chấp nhận được. RPO là lượng dữ liệu tối đa có thể mất; RTO là thời gian tối đa để dịch vụ hoạt động lại. pg_dump tạo logical dump cho một database, thuận tiện khi cần khôi phục chọn lọc hoặc chuyển dữ liệu; pg_dumpall có thể lưu các đối tượng toàn cluster như role. Physical backup như pg_basebackup sao chép cấu trúc cluster, phù hợp dựng standby hoặc làm nền cho khôi phục vật lý.

| Cách làm | Phạm vi / mục đích | Lưu ý |
|---|---|---|
| Logical dump | Schema và dữ liệu theo database | Dễ chọn đối tượng; cần quản lý globals riêng |
| Physical backup | Cluster PostgreSQL | Phù hợp khôi phục vật lý và standby |
| PITR | Khôi phục tới thời điểm trong quá khứ | Cần base backup cùng chuỗi WAL được lưu liên tục |
| Logical replication | Chuyển thay đổi hàng được publication chọn | Publisher/subscriber có schema và vòng đời riêng |
| Physical replication | Phát lại WAL cho standby của cluster | Phù hợp hot standby và failover có điều phối |

Để làm PITR, đội vận hành cần tạo base backup, lưu WAL archive ngoài nơi có thể mất cùng máy chủ, rồi diễn tập khôi phục tới một thời điểm cụ thể. Logical replication khởi tạo bản sao ban đầu rồi gửi thay đổi theo publication/subscription; nó hữu ích cho chọn bảng, tích hợp hoặc nâng cấp, nhưng không tự sao chép mọi DDL và sequence. Bảng có UPDATE/DELETE cần replica identity phù hợp. Replication slot giúp subscriber chậm không mất WAL cần thiết, song slot bị bỏ quên có thể giữ WAL mãi và làm đầy đĩa.

Lỗi hay gặp: nhầm replication với backup; chỉ kiểm tra rằng job backup chạy thành công mà chưa restore; không giám sát WAL archive hoặc slot; cho rằng logical replication tự tạo schema; failover không có kế hoạch promotion và chuyển kết nối. Hãy định kỳ đo thời gian restore, kiểm tra tính nhất quán và ghi lại thứ tự phục hồi.
'''

