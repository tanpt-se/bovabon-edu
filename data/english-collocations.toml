[[questions]]
id = "col-036"
module = "col-learning-work"
type = "essay"
difficulty = 2
prompt = '''
Viết **2–3 câu tiếng Anh** về giai đoạn bạn mới vào trường hoặc công việc mới: bạn phải quen với điều gì, theo kịp điều gì, và dựa vào ai.
'''
keywords = [["get used to", "got used to", "getting used to"], ["keep up with", "catch up with"], ["rely on", "depend on"], ["responsible for"]]
min_keywords = 2
model_answer = '''When I started university, it took me a while to get used to living alone. I had to work hard to keep up with my classes, but I could always rely on my roommate for help.'''
explanation = "Kết hợp *get used to + V-ing*, *keep up with* và *rely on* để kể một trải nghiệm thích nghi."

# ─────────────────────────────────────────────────────────────
[[modules]]
id = "col-usefulness-opinion"
title = "Hiệu quả, ý kiến & bằng chứng"
description = "useful for, worth + V-ing, benefit from, meet needs, effective vs efficient; I think, not sure whether, seem to, suggest that, provide evidence, rule out."
lesson = '''
### Lợi ích và hiệu quả
| Cụm từ | Theo sau là | Ví dụ |
|---|---|---|
| useful for + N / V-ing | mục đích | *This app is useful for learning new words.* |
| (be) worth + **V-ing** / N | đáng làm | *The museum is worth visiting.* · *It's worth the money.* |
| benefit from + N / V-ing | được lợi từ | *Shy students benefit from working in pairs.* |
| be of benefit to + sb | có ích cho | *The new park is of benefit to everyone.* |
| meet sb's needs | đáp ứng nhu cầu | *The service doesn't meet customers' needs.* |
| effective (in V-ing) | **đạt kết quả** mong muốn | *The medicine was effective in reducing pain.* |
| efficient | **ít tốn** thời gian / tiền / năng lượng | *An efficient way to travel is by metro.* |

**effective vs efficient:** một phương pháp có thể *effective* (có kết quả) nhưng không *efficient* (tốn quá nhiều công sức).

### Ý kiến và mức độ chắc chắn (hedging)
| Mức độ | Cụm từ |
|---|---|
| nêu quan điểm | *I think / I believe / In my opinion,* |
| chưa chắc | *I'm not sure whether / if…* |
| thận trọng | *It seems that… / X seems to + V / It is likely that…* |
| dẫn chứng | *The data suggest(s) that + mệnh đề · The study provides evidence for / of + N* |
| loại trừ | *rule out + N* (loại bỏ khả năng) |

- *suggest* + mệnh đề hoặc V-ing, **không** *suggest sb to V*: ~~suggests us to buy~~ → *suggests that we buy*.
- Trong bài luận, dùng *seem to / it is likely that* khi bằng chứng chưa đủ mạnh, thay vì *prove* hay *always*.
'''

[[questions]]
id = "col-037"
module = "col-usefulness-opinion"
type = "single"
difficulty = 1
prompt = "This guidebook is really worth ___ before your first trip abroad."
options = ["to read", "read", "reading", "to reading"]
answer = [2]
explanation = "*be worth + V-ing*."

[[questions]]
id = "col-038"
module = "col-usefulness-opinion"
type = "single"
difficulty = 2
prompt = "The vaccine was highly ___ in preventing the disease, although it was expensive to produce."
options = ["efficient", "effective", "effect", "efficiency"]
answer = [1]
explanation = "Nói về **kết quả** (ngăn được bệnh) → *effective*. Chi phí cao cho thấy nó không hẳn *efficient*."

[[questions]]
id = "col-039"
module = "col-usefulness-opinion"
type = "single"
difficulty = 2
prompt = "A dishwasher is a more ___ way to clean dishes because it uses less water and time."
options = ["effect", "efficient", "affective", "efficiency"]
answer = [1]
explanation = "Nhấn mạnh **tiết kiệm** nước và thời gian → *efficient*."

[[questions]]
id = "col-040"
module = "col-usefulness-opinion"
type = "fill"
difficulty = 1
prompt = "Small businesses can {{blank}} from free online training courses."
blanks = [["benefit"]]
explanation = "*benefit from + N*: được lợi từ."

[[questions]]
id = "col-041"
module = "col-usefulness-opinion"
type = "multiple"
difficulty = 2
prompt = "Chọn **các câu diễn đạt thận trọng** (hedging), phù hợp khi bằng chứng chưa chắc chắn."
options = ["The results seem to show a clear pattern.", "It is likely that prices will rise next year.", "I'm not sure whether this method works for everyone.", "This proves that the method always works."]
answer = [0, 1, 2]
explanation = "*prove* và *always* là khẳng định tuyệt đối, không phải hedging."

[[questions]]
id = "col-042"
module = "col-usefulness-opinion"
type = "fill"
difficulty = 2
prompt = "Engineers have not {{blank}} out the possibility of a software fault."
blanks = [["ruled"]]
explanation = "*rule out*: loại trừ khả năng; ở thì hiện tại hoàn thành dùng *ruled*."

[[questions]]
id = "col-043"
module = "col-usefulness-opinion"
type = "single"
difficulty = 2
prompt = "The survey ___ most customers want faster delivery."
options = ["suggests to", "suggests that", "is suggested", "suggests us"]
answer = [1]
explanation = "*suggest that + mệnh đề*. *suggest* không đi với *to V* hay tân ngữ chỉ người theo kiểu ~~suggest us~~."

[[questions]]
id = "col-044"
module = "col-usefulness-opinion"
type = "single"
difficulty = 1
prompt = "The new bus routes are designed to ___ the needs of elderly passengers."
options = ["reach", "meet", "fill", "make"]
answer = [1]
explanation = "*meet sb's needs*: đáp ứng nhu cầu."

[[questions]]
id = "col-045"
module = "col-usefulness-opinion"
type = "essay"
difficulty = 3
prompt = '''
Viết **2 câu tiếng Anh** nêu quan điểm về việc học trực tuyến cho người đi làm. Nêu ý kiến, dùng một cách nói thận trọng, nhắc đến bằng chứng và lợi ích.
'''
keywords = [["i think", "i believe", "in my opinion"], ["seem to", "seems to", "it is likely", "it appears"], ["evidence", "research", "studies", "survey"], ["worth", "benefit", "effective", "efficient"]]
min_keywords = 3
model_answer = '''I think online courses are worth taking for busy adults. Recent surveys seem to show that learners benefit from studying at their own pace, although the evidence is still limited.'''
explanation = "Câu trả lời tốt vừa nêu quan điểm, vừa giữ mức thận trọng (*seem to*) và nhắc giới hạn của bằng chứng."

# ─────────────────────────────────────────────────────────────
[[modules]]
id = "col-practice-mistakes"
title = "Vận dụng & lỗi thường gặp"
description = "Ghép cụm từ thành đoạn văn mạch lạc và sửa các lỗi hay gặp: afford to, worth V-ing, contribute to V-ing, responsible for, by vs to, effective vs efficient, tương quan vs nhân quả."
lesson = '''
### Ghép cụm từ thành đoạn văn
Một đoạn ngắn (IELTS, email, báo cáo) thường có 4 bước. Mỗi bước có sẵn "bộ cụm từ" từ các bài trước:

| Bước | Chức năng | Cụm từ gợi ý |
|---|---|---|
| 1. Câu chủ đề | nêu xu hướng / lựa chọn | *tend to, prefer … to …, opt for* |
| 2. Lý do | nguyên nhân, khó khăn | *because of, struggle to, find it hard to* |
| 3. Kết quả | hệ quả, so sánh | *lead to, result in, compared with, outweigh* |
| 4. Đánh giá | thận trọng, kết luận | *seem to, it is likely that, worth + V-ing* |

**Đoạn mẫu:** *Many retired people now **opt for** smaller flats in the city. They often **find it hard to** look after a large house, and moving **leads to** lower living costs. **Compared with** life in the suburbs, city flats also give them easier **access to** hospitals. Overall, downsizing **seems to** be **worth considering** for older couples.*

### Bảng lỗi thường gặp
| Sai | Đúng | Ghi nhớ |
|---|---|---|
| ~~can't afford buying~~ | can't afford **to buy** | afford + to V |
| ~~worth to read~~ | worth **reading** | worth + V-ing |
| ~~get used to work~~ | get used to **working** | *to* là giới từ |
| ~~contributed to reduce~~ | contributed to **reducing** | *to* là giới từ |
| ~~responsible of~~ | responsible **for** | |
| ~~prefer tea than coffee~~ | prefer tea **to** coffee | |
| ~~discuss about the plan~~ | **discuss** the plan | discuss không cần giới từ |
| ~~address to the issue~~ | **address** the issue | |
| increased **to** 50 (mức cuối) | increased **by** 50 (mức tăng) | hai nghĩa khác nhau |
| ~~an effective way to save time~~ (khi ý là tiết kiệm) | an **efficient** way | efficient = ít hao phí |
| ~~X causes Y~~ (khi chỉ có số liệu tương quan) | X **is associated with** Y | tương quan ≠ nhân quả |
'''

[[questions]]
id = "col-046"
module = "col-practice-mistakes"
type = "single"
difficulty = 2
prompt = "Chọn câu **đúng ngữ pháp**."
options = ["Cycling to work contributed to reduce my stress.", "Cycling to work contributed reducing my stress.", "Cycling to work contributed to reducing my stress.", "Cycling to work contributed for reducing my stress."]
answer = [2]
explanation = "*contribute to + V-ing*: *to* là giới từ."

[[questions]]
id = "col-047"
module = "col-practice-mistakes"
type = "single"
difficulty = 1
prompt = "I prefer green tea ___ coffee in the afternoon."
options = ["than", "to", "from", "with"]
answer = [1]
explanation = "*prefer A to B*, không dùng *than*."

[[questions]]
id = "col-048"
module = "col-practice-mistakes"
type = "multiple"
difficulty = 2
prompt = "Câu nào dùng đúng cụm tính từ–giới từ hoặc thành ngữ? Chọn mọi câu đúng."
options = ["Most students can't afford to buy new textbooks.", "This museum is worth visiting.", "Parents are responsible of their children's safety.", "The meeting discussed about the budget."]
answer = [0, 1]
explanation = "Sửa: *responsible **for** their children's safety*; *discussed the budget* (bỏ *about*)."

[[questions]]
id = "col-049"
module = "col-practice-mistakes"
type = "fill"
difficulty = 2
prompt = "We need to {{blank}} the issue of late deliveries before the holiday season. (một động từ, không cần giới từ)"
blanks = [["address", "tackle", "solve", "resolve", "fix", "handle"]]
explanation = "*address / tackle / solve the issue* — các động từ này đi thẳng với tân ngữ."

[[questions]]
id = "col-050"
module = "col-practice-mistakes"
type = "single"
difficulty = 3
prompt = "A study found that people who drink a lot of coffee sleep less. Which conclusion is the **most careful**?"
options = ["Coffee causes people to sleep less.", "Heavy coffee drinking is associated with shorter sleep.", "Coffee always ruins sleep.", "The study proves that coffee is harmful."]
answer = [1]
explanation = "Dữ liệu chỉ cho thấy tương quan → *is associated with*. Có thể người ngủ ít uống nhiều cà phê hơn, chứ không phải ngược lại."

[[questions]]
id = "col-051"
module = "col-practice-mistakes"
type = "fill"
difficulty = 2
prompt = "The town had 50,000 people. Now it has 65,000. The population increased {{blank}} 15,000."
blanks = [["by"]]
explanation = "15,000 là **mức tăng** → *by*. Mức cuối thì *increased to 65,000*."

[[questions]]
id = "col-052"
module = "col-practice-mistakes"
type = "single"
difficulty = 2
prompt = "Chọn câu **đúng**."
options = ["It took her weeks to get used to work night shifts.", "It took her weeks to get used to working night shifts.", "It took her weeks to used to working night shifts.", "It took her weeks to get use to working night shifts."]
answer = [1]
explanation = "*get used to + V-ing*."

[[questions]]
id = "col-053"
module = "col-practice-mistakes"
type = "essay"
difficulty = 3
prompt = '''
Viết **một đoạn 3–4 câu tiếng Anh** về làm việc tại nhà (working from home). Dùng **ít nhất bốn nhóm** cụm từ khác nhau: lựa chọn/xu hướng, thời gian/chi phí, kết quả, so sánh, mức độ chắc chắn, thích nghi.
'''
keywords = [["prefer", "tend to", "opt for"], ["time for", "afford"], ["lead to", "leads to", "contribute to", "contributes to", "result in", "results in"], ["compared with", "compared to", "unlike", "outweigh"], ["seem to", "seems to", "it is likely", "i think"], ["get used to", "getting used to", "keep up with", "rely on"]]
min_keywords = 4
model_answer = '''Many office workers now prefer working from home to commuting every day. Without long journeys, they have more time for their families, and this can lead to lower stress. Compared with office life, however, it seems to be harder to keep up with teammates, so the benefits may not outweigh the costs for everyone.'''
explanation = "Đoạn mẫu đi theo 4 bước: xu hướng (*prefer … to*), lợi ích (*time for, lead to*), so sánh (*compared with*), đánh giá thận trọng (*seems to*)."
