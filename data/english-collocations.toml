[[questions]]
id = "col-033"
module = "col-learning-work"
type = "fill"
difficulty = 2
prompt = "Don't take your health for {{blank}}; get a check-up every year."
blanks = [["granted"]]
explanation = "*take sth for granted*: coi là hiển nhiên nên không trân trọng."

[[questions]]
id = "col-034"
module = "col-learning-work"
type = "single"
difficulty = 2
prompt = "The second workshop ___ the skills that participants learned in the first one."
options = ["builds up", "builds in", "builds on", "builds with"]
answer = [2]
