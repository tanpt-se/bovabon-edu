[[questions]]
id = "rust-lvc04"
module = "rs-collections"
type = "code"
difficulty = 3
tags = ["level:senior", "cache"]
lang = "rust"
title = "LRU cache dung lượng cố định"
prompt = '''Cài đặt `LruCache` lưu `String -> i32` với dung lượng `cap` (≥ 1):

- `LruCache::new(cap: usize)`.
- `get(&mut self, key: &str) -> Option<i32>`: trả giá trị và đánh dấu key vừa được dùng.
- `put(&mut self, key: &str, value: i32)`: thêm/cập nhật và đánh dấu vừa dùng; nếu vượt dung lượng thì loại key ít được dùng gần đây nhất.
- `len(&self) -> usize`.'''
starter = '''use std::collections::HashMap;

struct LruCache {
    cap: usize,
    map: HashMap<String, i32>,
}

impl LruCache {
    fn new(cap: usize) -> Self {
        LruCache { cap, map: HashMap::new() }
    }

    fn get(&mut self, key: &str) -> Option<i32> {
        self.map.get(key).copied()
    }

    fn put(&mut self, key: &str, value: i32) {
        let _ = self.cap;
        self.map.insert(key.to_string(), value);
    }

    fn len(&self) -> usize {
        self.map.len()
    }
}'''
solution = '''use std::collections::{HashMap, VecDeque};

struct LruCache {
    cap: usize,
    map: HashMap<String, i32>,
    order: VecDeque<String>,
}

impl LruCache {
    fn new(cap: usize) -> Self {
        LruCache { cap, map: HashMap::new(), order: VecDeque::new() }
    }

    fn touch(&mut self, key: &str) {
        if let Some(pos) = self.order.iter().position(|k| k == key) {
            self.order.remove(pos);
        }
        self.order.push_back(key.to_string());
    }

    fn get(&mut self, key: &str) -> Option<i32> {
        let value = *self.map.get(key)?;
        self.touch(key);
        Some(value)
    }

    fn put(&mut self, key: &str, value: i32) {
        self.map.insert(key.to_string(), value);
        self.touch(key);
        if self.map.len() > self.cap {
            if let Some(old) = self.order.pop_front() {
                self.map.remove(&old);
            }
        }
    }

    fn len(&self) -> usize {
        self.map.len()
    }
}'''
tests = '''bovabon_tests! {
    "get sau put" => {
        let mut c = LruCache::new(2);
        c.put("a", 1);
        assert_eq!(c.get("a"), Some(1));
        assert_eq!(c.get("z"), None);
    },
    "loại key cũ nhất khi đầy" => {
        let mut c = LruCache::new(2);
        c.put("a", 1);
        c.put("b", 2);
        c.put("c", 3);
        assert_eq!(c.get("a"), None);
        assert_eq!(c.len(), 2);
    },
    "get làm mới thứ tự" => {
        let mut c = LruCache::new(2);
        c.put("a", 1);
        c.put("b", 2);
        c.get("a");
        c.put("c", 3);
        assert_eq!(c.get("a"), Some(1));
        assert_eq!(c.get("b"), None);
    },
    "cập nhật key không tăng kích thước" => {
        let mut c = LruCache::new(2);
        c.put("a", 1);
        c.put("a", 5);
        assert_eq!(c.len(), 1);
        assert_eq!(c.get("a"), Some(5));
    },
    "put cập nhật cũng làm mới thứ tự" => {
        let mut c = LruCache::new(2);
        c.put("a", 1);
        c.put("b", 2);
        c.put("a", 3);
        c.put("c", 4);
        assert_eq!(c.get("b"), None);
        assert_eq!(c.get("a"), Some(3));
    },
}'''
hints = ["Giữ thêm `VecDeque<String>` lưu thứ tự dùng: đầu là cũ nhất, cuối là mới nhất.", "Khi get/put, xóa key khỏi vị trí cũ trong hàng đợi rồi push_back; khi vượt cap thì pop_front và xóa khỏi map."]
explanation = "Phiên bản O(n) cho thao tác touch đủ cho bài tập; bản production dùng danh sách liên kết + HashMap để đạt O(1)."
sources = ["rust/book/ch08-03-hash-maps", "rust/book/ch05-03-method-syntax"]
