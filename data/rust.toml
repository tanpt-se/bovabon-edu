[[modules]]
id = "rust-lead"
title = "Góc nhìn Tech Lead"
description = "Chọn Rust cho phần nào của hệ thống, chiến lược FFI & unsafe boundary, workspace và thời gian build, quy ước lỗi, async runtime, code review an toàn bộ nhớ và mentoring team."
sources = ["rust/book/ch14-03-cargo-workspaces", "rust/book/ch14-01-release-profiles", "rust/book/ch20-01-unsafe-rust", "rust/book/ch16-04-extensible-concurrency-sync-and-send", "rust/book/ch17-06-futures-tasks-threads", "rust/book/ch09-03-to-panic-or-not-to-panic"]
lesson = '''
### Vai trò của Tech Lead trong một codebase Rust
Ở cấp Lead, câu hỏi không còn là "viết hàm này thế nào" mà là "đặt Rust ở đâu, với chi phí nào, và làm sao để cả team giữ được chất lượng". Rust mang lại an toàn bộ nhớ, hiệu năng dự đoán được và hệ kiểu mạnh, nhưng đổi lại là đường cong học tập, thời gian biên dịch dài hơn và hệ sinh thái async còn phân mảnh. Quyết định tốt luôn gắn với ràng buộc cụ thể: số người, kinh nghiệm, deadline, yêu cầu độ trễ, chi phí hạ tầng.

### Khung ra quyết định: có nên dùng Rust cho thành phần này?

| Tiêu chí | Hợp với Rust | Chưa nên dùng Rust |
|---|---|---|
| Đặc tính tải | CPU-bound, độ trễ p99 thấp, bộ nhớ hạn chế | CRUD đơn giản, I/O-bound thuần |
| Rủi ro an toàn | Parser dữ liệu không tin cậy, crypto, xử lý nhị phân | Script nội bộ, prototype |
| Đội ngũ | Có ít nhất 1–2 người vững ownership/async | Không ai có kinh nghiệm, deadline gấp |
| Phạm vi | Một hot path có thể tách (extension, sidecar) | Viết lại cả hệ thống đang ổn định |

Chiến lược an toàn nhất thường là **từng phần**: đo trước (profiling), tách hot path thành thư viện Rust gọi qua FFI hoặc service nhỏ, có benchmark và đường lui (fallback), rồi mới mở rộng.

### Ranh giới unsafe và FFI
- Gom `extern` và con trỏ thô vào crate `-sys` hoặc module riêng; phía trên là wrapper **safe** quản lý ownership (Drop gọi hàm giải phóng của C), chuyển đổi `CString`/`CStr` rõ ràng.
- Mỗi khối `unsafe` có comment `// SAFETY:` mô tả invariant mà caller/implementation đảm bảo.
- Chạy Miri hoặc sanitizer trong CI cho module có unsafe; review bắt buộc 2 người.

### Workspace, thời gian build và dependency
- Dùng Cargo workspace với `Cargo.lock` chung và `[workspace.dependencies]` để thống nhất version.
- Đo trước khi tối ưu: `cargo build --timings` chỉ ra crate nào chiếm thời gian; cache thư mục `target` và registry trong CI; tắt `default-features` không cần.
- Mỗi dependency mới là bề mặt tấn công và chi phí build: kiểm tra số crate kéo theo, license, advisory (cargo-audit / cargo-deny) — đây là công cụ cộng đồng, không có sẵn trong Cargo.

### Quy ước team
- **Lỗi**: library dùng enum lỗi có kiểu, implement `std::error::Error`; binary gom lỗi bằng `Box<dyn Error>` kèm ngữ cảnh. Không `unwrap()` trên dữ liệu bên ngoài.
- **Async**: chuẩn hóa một runtime cho toàn workspace; tác vụ CPU nặng hoặc I/O đồng bộ chuyển sang thread pool riêng; không giữ `MutexGuard` qua `.await`.
- **API public**: tuân semver; đổi signature bằng cách thêm hàm mới + `#[deprecated]`, xóa ở major tiếp theo.

### Checklist review PR
1. `unwrap`/`expect`/index trực tiếp trên input ngoài?
2. `clone()` để né borrow checker trong vòng lặp nóng?
3. Khối `unsafe` có `// SAFETY:` và test?
4. Kiểu dùng chung giữa thread có `Send`/`Sync` đúng ý, không dựa vào `unsafe impl`?
5. Thay đổi public API có phá semver?
6. Clippy sạch, có test cho nhánh lỗi?

### ADR mẫu (rút gọn)
> **Bối cảnh**: hàm resize ảnh chiếm ~70% CPU (ước lượng từ profiling), service viết bằng Python. **Phương án**: (A) thêm máy, (B) viết lại toàn bộ bằng Rust, (C) tách hàm thành extension Rust. **Quyết định**: C, có cờ bật/tắt và benchmark so sánh. **Hệ quả**: thêm bước build Rust trong CI, cần 1 người ownership module; rủi ro thấp vì có fallback Python.

### Anti-pattern ở quy mô team
- Viết lại "big bang" một hệ thống ổn định chỉ vì thích Rust.
- `Rc<RefCell<T>>` / `Arc<Mutex<T>>` khắp nơi để "cho qua" borrow checker, che giấu thiết kế ownership kém.
- Trộn nhiều async runtime trong một tiến trình.
- Cấm tuyệt đối `clone()` khiến junior mất nhiều ngày cho code không nóng — tối ưu khi profiling chỉ ra điểm nóng.
'''

