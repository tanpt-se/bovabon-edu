title = "Parse và kiểm tra điểm"
prompt = '''Định nghĩa enum InputError có các variant Missing, InvalidInteger, OutOfRange. Viết parse_score(input: Option<&str>) -> Result<u8, InputError>: None trả Missing; chuỗi số nguyên từ 0 đến 100 trả Ok; chuỗi không parse được trả InvalidInteger; số nguyên ngoài khoảng trả OutOfRange. Bỏ khoảng trắng đầu/cuối trước khi parse.'''
starter = '''#[derive(Debug, PartialEq, Eq)]
enum InputError {
    Missing,
    InvalidInteger,
    OutOfRange,
}

fn parse_score(_input: Option<&str>) -> Result<u8, InputError> {
    Ok(0)
}'''
solution = '''#[derive(Debug, PartialEq, Eq)]
enum InputError {
    Missing,
    InvalidInteger,
    OutOfRange,
}

fn parse_score(input: Option<&str>) -> Result<u8, InputError> {
    let text = input.ok_or(InputError::Missing)?;
    let value = text
        .trim()
        .parse::<i32>()
        .map_err(|_| InputError::InvalidInteger)?;
    if !(0..=100).contains(&value) {
        return Err(InputError::OutOfRange);
    }
    Ok(value as u8)
}'''
tests = '''bovabon_tests! {
    "điểm thường" => { assert_eq!(parse_score(Some(" 72 ")), Ok(72)); },
    "biên dưới" => { assert_eq!(parse_score(Some("0")), Ok(0)); },
    "biên trên" => { assert_eq!(parse_score(Some("100")), Ok(100)); },
    "thiếu input" => { assert_eq!(parse_score(None), Err(InputError::Missing)); },
    "không phải số" => { assert_eq!(parse_score(Some("abc")), Err(InputError::InvalidInteger)); },
    "ngoài khoảng" => { assert_eq!(parse_score(Some("-1")), Err(InputError::OutOfRange)); },
}'''
hints = ["Dùng ok_or để chuyển Option thành Result rồi dùng ? để trả lỗi sớm.", "Parse thành i32 trước khi kiểm tra khoảng, sau đó mới ép sang u8."]
explanation = "Result giữ riêng lỗi thiếu dữ liệu, lỗi cú pháp số và lỗi nghiệp vụ ngoài khoảng."
sources = ["rust/book/ch09-02-recoverable-errors-with-result", "rust/book/ch06-00-enums"]

[[questions]]
id = "rs-033"
module = "rs-traits"
type = "code"
difficulty = 3
lang = "rust"
title = "Shape trait object và Stack generic"
prompt = '''Định nghĩa trait Shape với area(&self) -> f64, rồi triển khai cho Circle { radius: f64 } và Rectangle { width: f64, height: f64 }. Viết total_area(shapes: &[Box<dyn Shape>]) -> f64. Đồng thời định nghĩa Stack<T> có new, push, pop, len, is_empty; pop theo LIFO. Circle dùng πr².'''
starter = '''trait Shape {
    fn area(&self) -> f64;
}

struct Circle {
    radius: f64,
}

struct Rectangle {
    width: f64,
    height: f64,
}

impl Shape for Circle {
    fn area(&self) -> f64 {
        0.0
    }
}

impl Shape for Rectangle {
    fn area(&self) -> f64 {
        0.0
    }
}

fn total_area(_shapes: &[Box<dyn Shape>]) -> f64 {
    0.0
}

struct Stack<T> {
    items: Vec<T>,
}

impl<T> Stack<T> {
    fn new() -> Self {
        Self { items: Vec::new() }
    }

    fn push(&mut self, value: T) {
        self.items.push(value);
    }

    fn pop(&mut self) -> Option<T> {
        None
    }

    fn len(&self) -> usize {
        self.items.len()
    }

    fn is_empty(&self) -> bool {
        self.items.is_empty()
    }
}'''
solution = '''use std::f64::consts::PI;

trait Shape {
    fn area(&self) -> f64;
}

struct Circle {
    radius: f64,
}

struct Rectangle {
    width: f64,
    height: f64,
}

impl Shape for Circle {
    fn area(&self) -> f64 {
        PI * self.radius * self.radius
    }
}

impl Shape for Rectangle {
    fn area(&self) -> f64 {
        self.width * self.height
    }
}

fn total_area(shapes: &[Box<dyn Shape>]) -> f64 {
    shapes.iter().map(|shape| shape.area()).sum()
}

struct Stack<T> {
    items: Vec<T>,
}

impl<T> Stack<T> {
    fn new() -> Self {
        Self { items: Vec::new() }
    }

    fn push(&mut self, value: T) {
        self.items.push(value);
    }

    fn pop(&mut self) -> Option<T> {
        self.items.pop()
    }

    fn len(&self) -> usize {
        self.items.len()
    }

    fn is_empty(&self) -> bool {
        self.items.is_empty()
    }
}'''
tests = '''bovabon_tests! {
    "diện tích hình tròn" => {
        let circle = Circle { radius: 2.0 };
        assert!((circle.area() - std::f64::consts::PI * 4.0).abs() < 1e-9);
    },
    "diện tích hình chữ nhật" => {
        let rectangle = Rectangle { width: 3.0, height: 4.0 };
        assert_eq!(rectangle.area(), 12.0);
    },
    "trait object cộng diện tích" => {
        let shapes: Vec<Box<dyn Shape>> = vec![
            Box::new(Circle { radius: 1.0 }),
            Box::new(Rectangle { width: 2.0, height: 3.0 }),
        ];
        assert!((total_area(&shapes) - (std::f64::consts::PI + 6.0)).abs() < 1e-9);
    },
    "stack generic LIFO" => {
        let mut stack = Stack::new();
        stack.push(10);
        stack.push(20);
        assert_eq!(stack.pop(), Some(20));
        assert_eq!(stack.pop(), Some(10));
        assert_eq!(stack.pop(), None);
    },
    "stack hỗ trợ kiểu khác và trạng thái rỗng" => {
        let mut stack = Stack::new();
        assert!(stack.is_empty());
        stack.push(String::from("rust"));
        assert_eq!(stack.len(), 1);
        assert_eq!(stack.pop().as_deref(), Some("rust"));
        assert!(stack.is_empty());
    },
}'''
hints = ["Tách trait object khỏi Stack<T>: Stack chỉ cần lưu Vec<T>.", "Dùng std::f64::consts::PI và Vec::pop để giữ đúng công thức, thứ tự LIFO."]
explanation = "Bài này kết hợp dynamic dispatch qua Box<dyn Shape> với cấu trúc dữ liệu generic Stack<T>."
sources = ["rust/book/ch10-00-generics", "rust/book/ch10-02-traits", "rust/book/ch18-02-trait-objects"]

[[questions]]
id = "rs-034"
module = "rs-collections"
type = "code"
difficulty = 2
lang = "rust"
title = "Đếm tần suất từ"
prompt = '''Viết word_frequency(text: &str) -> HashMap<String, usize>. Tách theo whitespace, bỏ dấu câu ở đầu/cuối mỗi token, chuyển thành chữ thường, bỏ token rỗng, rồi đếm số lần xuất hiện. Không dùng crate ngoài.'''
starter = '''use std::collections::HashMap;

fn word_frequency(_text: &str) -> HashMap<String, usize> {
    HashMap::new()
}'''
solution = '''use std::collections::HashMap;

fn word_frequency(text: &str) -> HashMap<String, usize> {
    text.split_whitespace()
        .map(|word| {
            word.trim_matches(|character: char| !character.is_alphanumeric())
                .to_lowercase()
        })
        .filter(|word| !word.is_empty())
        .fold(HashMap::new(), |mut counts, word| {
            *counts.entry(word).or_insert(0) += 1;
            counts
        })
}'''
tests = '''bovabon_tests! {
    "đếm không phân biệt hoa thường" => {
        let counts = word_frequency("Rust rust RUST");
        assert_eq!(counts.get("rust"), Some(&3));
    },
    "bỏ dấu câu ở biên" => {
        let counts = word_frequency("Rust, rust! (Rust).");
        assert_eq!(counts.get("rust"), Some(&3));
    },
    "bỏ token chỉ có dấu câu" => {
        let counts = word_frequency("!!! rust ...");
        assert_eq!(counts.get("rust"), Some(&1));
        assert_eq!(counts.len(), 1);
    },
    "input rỗng" => { assert!(word_frequency("").is_empty()); },
    "từ Unicode" => {
        let counts = word_frequency("café CAFÉ");
        assert_eq!(counts.get("café"), Some(&2));
    },
}'''
hints = ["Dùng split_whitespace, trim_matches với predicate trên char và to_lowercase.", "fold cùng entry(...).or_insert(0) để tích luỹ HashMap."]
explanation = "Iterator kết hợp closure biến đổi token; HashMap lưu số đếm mà không cần vòng lặp tra cứu riêng."
sources = ["rust/book/ch08-00-common-collections", "rust/book/ch13-02-iterators"]

