module = "rs-errors-modules"
type = "code"
difficulty = 2
tags = ["level:middle"]
lang = "rust"
title = "Phân tích dòng cấu hình key=value"
prompt = '''Viết `parse_kv(line: &str) -> Result<(String, u32), String>` cho dòng dạng `key=value`:

- Cắt khoảng trắng hai đầu của key và value.
- Không có dấu `=` → `Err("missing '='")`.
- Key rỗng sau khi trim → `Err("empty key")`.
- Value không phải số `u32` hợp lệ → `Err("invalid number")`.
- Chỉ tách ở dấu `=` đầu tiên.'''
starter = '''fn parse_kv(_line: &str) -> Result<(String, u32), String> {
    Err(String::from("todo"))
}'''
solution = '''fn parse_kv(line: &str) -> Result<(String, u32), String> {
    let (key, value) = line.split_once('=').ok_or("missing '='")?;
    let key = key.trim();
    if key.is_empty() {
        return Err("empty key".to_string());
    }
    let value = value.trim().parse::<u32>().map_err(|_| "invalid number".to_string())?;
    Ok((key.to_string(), value))
}'''
tests = '''bovabon_tests! {
    "dòng hợp lệ" => { assert_eq!(parse_kv("port=8080"), Ok(("port".to_string(), 8080))); },
    "cắt khoảng trắng" => { assert_eq!(parse_kv("  retries = 3 "), Ok(("retries".to_string(), 3))); },
    "thiếu dấu bằng" => { assert_eq!(parse_kv("port 8080"), Err("missing '='".to_string())); },
    "key rỗng" => { assert_eq!(parse_kv(" =5"), Err("empty key".to_string())); },
    "value không phải số" => { assert_eq!(parse_kv("port=abc"), Err("invalid number".to_string())); },
    "số âm không hợp lệ cho u32" => { assert_eq!(parse_kv("port=-1"), Err("invalid number".to_string())); },
    "chỉ tách dấu bằng đầu tiên" => { assert_eq!(parse_kv("a=1=2"), Err("invalid number".to_string())); },
}'''
