tags = ["level:lead", "reliability"]
lang = "rust"
title = "Circuit breaker cho lời gọi dịch vụ ngoài"
prompt = '''Cài đặt `Breaker` để bảo vệ lời gọi tới dịch vụ ngoài (thời gian `now` truyền vào dạng số giây, không đọc đồng hồ hệ thống):

- `Breaker::new(threshold: u32, cooldown: u64)`.
- `allow(&self, now: u64) -> bool`: khi đóng (closed) luôn trả `true`. Khi đã mở (open) tại thời điểm `t`, trả `false` nếu `now < t + cooldown`; ngược lại trả `true` (half-open, cho một lời gọi thử).
- `record(&mut self, ok: bool, now: u64)`: thành công thì reset số lỗi về 0 và đóng breaker. Thất bại thì tăng số lỗi liên tiếp; khi số lỗi `>= threshold` thì mở breaker tại `now` (một lỗi ở trạng thái half-open mở lại ngay).'''
starter = '''struct Breaker {
    threshold: u32,
    cooldown: u64,
}

impl Breaker {
    fn new(threshold: u32, cooldown: u64) -> Self {
        Breaker { threshold, cooldown }
    }

    fn allow(&self, _now: u64) -> bool {
        let _ = (self.threshold, self.cooldown);
        true
    }

    fn record(&mut self, _ok: bool, _now: u64) {}
}'''
solution = '''struct Breaker {
    threshold: u32,
    cooldown: u64,
    failures: u32,
    opened_at: Option<u64>,
}

impl Breaker {
    fn new(threshold: u32, cooldown: u64) -> Self {
        Breaker { threshold, cooldown, failures: 0, opened_at: None }
    }

    fn allow(&self, now: u64) -> bool {
        match self.opened_at {
            None => true,
            Some(t) => now >= t + self.cooldown,
        }
    }

    fn record(&mut self, ok: bool, now: u64) {
        if ok {
            self.failures = 0;
            self.opened_at = None;
        } else {
            self.failures += 1;
            if self.failures >= self.threshold {
                self.opened_at = Some(now);
            }
        }
    }
}'''
tests = '''bovabon_tests! {
    "ban đầu cho phép gọi" => {
        let b = Breaker::new(3, 10);
        assert!(b.allow(0));
    },
    "mở sau đủ số lỗi liên tiếp" => {
        let mut b = Breaker::new(2, 10);
        b.record(false, 1);
        assert!(b.allow(1));
        b.record(false, 2);
        assert!(!b.allow(3));
    },
    "thành công reset bộ đếm lỗi" => {
        let mut b = Breaker::new(2, 10);
        b.record(false, 1);
        b.record(true, 2);
        b.record(false, 3);
        assert!(b.allow(4));
    },
    "half-open sau cooldown" => {
        let mut b = Breaker::new(1, 5);
        b.record(false, 10);
        assert!(!b.allow(14));
        assert!(b.allow(15));
    },
    "lỗi ở half-open mở lại ngay" => {
        let mut b = Breaker::new(1, 5);
        b.record(false, 10);
        assert!(b.allow(15));
        b.record(false, 15);
        assert!(!b.allow(16));
        assert!(b.allow(20));
    },
    "thành công ở half-open đóng breaker" => {
        let mut b = Breaker::new(1, 5);
        b.record(false, 0);
        b.record(true, 5);
        assert!(b.allow(6));
    },
}'''
hints = ["Lưu thêm `failures: u32` và `opened_at: Option<u64>`.", "`allow` chỉ cần so sánh `now` với `opened_at + cooldown`; không cần trạng thái half-open riêng vì lỗi kế tiếp sẽ đặt lại `opened_at`."]
explanation = "Circuit breaker ngăn hệ thống tiếp tục dội tải vào dịch vụ đang lỗi; truyền `now` từ ngoài giúp logic xác định và dễ test."
sources = ["rust/book/ch05-03-method-syntax", "rust/book/ch06-02-match"]

