[[questions]]
id = "rust-dvc03"
module = "rust-dv-patterns"
type = "code"
difficulty = 2
lang = "rust"
title = "Lọc số đo trong ngưỡng hợp lệ"
prompt = '''Viết `valid_readings(readings: &[Option<i32>]) -> Vec<i32>`. Trả về theo thứ tự ban đầu các số đo hiện diện và nằm trong khoảng đóng 0..=100. Bỏ qua `None`, số âm và số lớn hơn 100. Dùng pattern matching để tách giá trị và kiểm tra khoảng.'''
starter = '''fn valid_readings(_readings: &[Option<i32>]) -> Vec<i32> {
    Vec::new()
}'''
solution = '''fn valid_readings(readings: &[Option<i32>]) -> Vec<i32> {
    let mut accepted = Vec::new();
    for reading in readings {
        match *reading {
            Some(value @ 0..=100) => accepted.push(value),
            _ => {}
        }
    }
    accepted
}'''
tests = '''bovabon_tests! {
    "giữ thứ tự các số hợp lệ" => {
        assert_eq!(valid_readings(&[Some(18), Some(4), None, Some(70)]), vec![18, 4, 70]);
    },
    "nhận cả hai biên" => {
        assert_eq!(valid_readings(&[Some(0), Some(100)]), vec![0, 100]);
    },
    "bỏ none và giá trị ngoài ngưỡng" => {
        assert_eq!(valid_readings(&[None, Some(-1), Some(101)]), Vec::<i32>::new());
    },
    "lọc xen kẽ" => {
        assert_eq!(valid_readings(&[Some(-3), Some(25), Some(130), None, Some(99)]), vec![25, 99]);
    },
    "input rỗng" => { assert!(valid_readings(&[]).is_empty()); },
}'''
hints = ["Duyệt từng `&Option<i32>` và match sau khi dereference vì i32 là Copy.", "Dùng binding `value @ 0..=100` để vừa ràng buộc khoảng vừa giữ số đo."]
explanation = "Pattern có range kiểm tra ngưỡng ngay khi destructure; wildcard bỏ qua None và các giá trị ngoài phạm vi."
sources = ["rust/book/ch19-03-pattern-syntax", "rust/book/ch19-01-all-the-places-for-patterns"]
