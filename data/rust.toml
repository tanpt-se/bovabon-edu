[[questions]]
id = "rust-dvc02"
module = "rust-dv-testing-cli"
type = "code"
difficulty = 2
tags = ["level:middle"]
lang = "rust"
title = "Phân tích tùy chọn tìm kiếm CLI"
prompt = '''Cài `parse_search_args(args: &[&str]) -> Result<SearchConfig, String>`. Slice chỉ chứa tùy chọn, không có tên chương trình. Bắt buộc nhận đúng một `--query <text>` và một `--file <path>` với giá trị không rỗng; `--ignore-case` là cờ tùy chọn, xuất hiện tối đa một lần. Trả Err nếu thiếu/lặp tùy chọn, thiếu giá trị, gặp cờ lạ hoặc giá trị bắt buộc rỗng. `SearchConfig` có các field `query: String`, `file: String`, `ignore_case: bool`. Không đọc filesystem hay environment.'''
starter = '''struct SearchConfig {
    query: String,
    file: String,
    ignore_case: bool,
}

fn parse_search_args(_args: &[&str]) -> Result<SearchConfig, String> {
    Err("invalid arguments".to_string())
}'''
solution = '''struct SearchConfig {
    query: String,
    file: String,
    ignore_case: bool,
}

fn parse_search_args(args: &[&str]) -> Result<SearchConfig, String> {
    let mut query = None;
    let mut file = None;
    let mut ignore_case = false;
    let mut index = 0;

    while index < args.len() {
        match args[index] {
            "--query" => {
                if query.is_some() {
                    return Err("duplicate --query".to_string());
                }
                let value = args.get(index + 1).ok_or_else(|| "missing --query value".to_string())?;
                if value.is_empty() {
                    return Err("empty --query value".to_string());
                }
                query = Some((*value).to_string());
                index += 2;
            }
            "--file" => {
                if file.is_some() {
                    return Err("duplicate --file".to_string());
                }
                let value = args.get(index + 1).ok_or_else(|| "missing --file value".to_string())?;
                if value.is_empty() {
                    return Err("empty --file value".to_string());
                }
                file = Some((*value).to_string());
                index += 2;
            }
            "--ignore-case" => {
                if ignore_case {
                    return Err("duplicate --ignore-case".to_string());
                }
                ignore_case = true;
                index += 1;
            }
            _ => return Err("unknown argument".to_string()),
        }
    }

    Ok(SearchConfig {
        query: query.ok_or_else(|| "missing --query".to_string())?,
        file: file.ok_or_else(|| "missing --file".to_string())?,
        ignore_case,
    })
}'''
tests = '''bovabon_tests! {
    "hai tùy chọn bắt buộc" => {
        let config = parse_search_args(&["--query", "rust", "--file", "notes.txt"]).unwrap();
        assert_eq!(config.query, "rust");
        assert_eq!(config.file, "notes.txt");
        assert!(!config.ignore_case);
    },
    "cờ không phân biệt hoa thường" => {
        let config = parse_search_args(&["--ignore-case", "--file", "a.txt", "--query", "Hi"]).unwrap();
        assert!(config.ignore_case);
    },
    "thiếu query" => { assert!(parse_search_args(&["--file", "a.txt"]).is_err()); },
    "thiếu giá trị của file" => { assert!(parse_search_args(&["--query", "x", "--file"]).is_err()); },
    "giá trị rỗng" => { assert!(parse_search_args(&["--query", "", "--file", "a.txt"]).is_err()); },
    "cờ lạ và cờ lặp đều bị từ chối" => {
        assert!(parse_search_args(&["--query", "x", "--file", "a.txt", "--verbose"]).is_err());
        assert!(parse_search_args(&["--query", "x", "--file", "a.txt", "--ignore-case", "--ignore-case"]).is_err());
    },
}'''
hints = ["Duyệt slice bằng index để mỗi option có thể đọc giá trị ở vị trí kế tiếp.", "Dùng Option<String> để phát hiện option bắt buộc bị thiếu hoặc bị lặp."]
explanation = "Parser thuần trả Result giúp kiểm thử input hợp lệ và lỗi mà không khởi chạy process hay truy cập filesystem."
sources = ["rust/book/ch12-01-accepting-command-line-arguments", "rust/book/ch12-03-improving-error-handling-and-modularity"]

[[modules]]
id = "rust-dv-patterns"
title = "Pattern nâng cao & let-else"
description = "Dùng destructuring, match guard, refutability và pattern trong các vị trí điều khiển luồng."
sources = ["rust/book/ch19-00-patterns", "rust/book/ch19-01-all-the-places-for-patterns", "rust/book/ch19-02-refutability", "rust/book/ch19-03-pattern-syntax", "rust/book/ch06-03-if-let"]
lesson = '''
### Pattern là cách kiểm tra và lấy cấu trúc dữ liệu
Pattern không chỉ xuất hiện trong `match`: Rust còn dùng chúng ở `let`, tham số hàm, `if let`, `while let`, `for`, và `let-else`. Một pattern **irrefutable** luôn khớp với mọi giá trị có kiểu đó, như `let (x, y) = pair`; một pattern **refutable** có thể không khớp, như `Some(value)`. Vì vậy `let` thường yêu cầu pattern irrefutable, còn `if let` và `match` xử lý trường hợp pattern không khớp.

| Cú pháp | Refutability | Dùng khi |
|---|---|---|
| `let (x, y) = pair` | Irrefutable | Destructure chắc chắn thành công |
| `if let Some(x) = value` | Refutable | Chỉ cần xử lý một variant |
| `match value { ... }` | Refutable, phải exhaustive | Xử lý mọi trường hợp hoặc nhóm trường hợp |
| `let Some(x) = value else { return; }` | Refutable | Lấy giá trị sớm, nhánh else phải diverge |

`match` yêu cầu exhaustive để không bỏ sót trạng thái; compiler cảnh báo nhánh không thể tới nếu nhánh trước đã bao phủ nó. `_` chỉ bỏ qua phần không cần dùng, còn `..` bỏ qua các field/phần tử còn lại khi destructure. Match guard như `Some(n) if n > 0` thêm điều kiện sau khi pattern khớp; compiler không dùng guard để chứng minh exhaustive. Binding `name @ pattern` vừa xác nhận dạng vừa giữ toàn bộ giá trị con, hữu ích khi cần kiểm tra rồi tiếp tục dùng nó.

Ví dụ, parser sự kiện có thể destructure `Event::Retry { code, .. } if code >= 500` để chỉ retry lỗi máy chủ; các status khác được xử lý ở nhánh riêng. Dùng `let-else` khi trường hợp không hợp lệ cần thoát sớm, nhưng nhánh `else` phải kết thúc bằng `return`, `break`, `continue` hoặc panic để binding sau đó chắc chắn tồn tại.

Lỗi thường gặp là dùng pattern có thể thất bại trực tiếp trong `let`, dùng `_` quá sớm làm mất dữ liệu cần thiết, nghĩ match guard giúp chứng minh mọi giá trị đã được bao phủ, hoặc viết nhánh tổng quát trước nhánh cụ thể khiến nhánh sau unreachable. Hãy chọn `match` khi cần kiểm kê trạng thái rõ ràng và `if let`/`let-else` khi cấu trúc điều khiển thực sự đơn giản hơn.
'''

