[[questions]]
id = "rust-lvc02"
module = "rs-collections"
type = "code"
difficulty = 1
tags = ["level:junior"]
lang = "rust"
title = "Lấy chữ cái đầu của tên"
prompt = '''Viết `initials(name: &str) -> String` trả về chữ cái đầu của mỗi từ (từ cách nhau bởi khoảng trắng, có thể nhiều khoảng trắng), viết hoa, nối liền nhau. Ví dụ `"nguyen van an"` → `"NVA"`. Chuỗi rỗng hoặc chỉ có khoảng trắng trả `""`.'''
starter = '''fn initials(name: &str) -> String {
    name.to_string()
}'''
solution = '''fn initials(name: &str) -> String {
    let mut out = String::new();
    for word in name.split_whitespace() {
        if let Some(c) = word.chars().next() {
            out.extend(c.to_uppercase());
        }
    }
    out
}'''
tests = '''bovabon_tests! {
    "ba từ" => { assert_eq!(initials("nguyen van an"), "NVA"); },
    "một từ" => { assert_eq!(initials("rust"), "R"); },
    "nhiều khoảng trắng" => { assert_eq!(initials("  ada   lovelace "), "AL"); },
    "chuỗi rỗng" => { assert_eq!(initials(""), ""); },
    "chỉ có khoảng trắng" => { assert_eq!(initials("   "), ""); },
}'''
hints = ["`split_whitespace()` tách từ và bỏ qua khoảng trắng thừa.", "`word.chars().next()` lấy ký tự đầu; `to_uppercase()` trả về iterator nên dùng `extend`."]
explanation = "Bài tập luyện duyệt iterator trên &str, Option từ `next()` và xây dựng String."
sources = ["rust/book/ch08-02-strings", "rust/book/ch13-02-iterators"]

