[[questions]]
id = "rs-035"
module = "rs-collections"
type = "code"
difficulty = 3
tags = ["level:senior"]
lang = "rust"
title = "LRU cache với HashMap và VecDeque"
prompt = '''Cài LruCache<K, V> với new(capacity), put(key, value), get(&key) -> Option<V> và len(). Key yêu cầu Eq + Hash + Clone, value Clone. get thành công và put key đang có đều đưa key thành mới dùng nhất. Khi vượt capacity, loại key ít dùng nhất; capacity 0 luôn để cache rỗng.'''
starter = '''use std::collections::{HashMap, VecDeque};
use std::hash::Hash;

struct LruCache<K, V> {
    capacity: usize,
    values: HashMap<K, V>,
    order: VecDeque<K>,
}

impl<K: Eq + Hash + Clone, V: Clone> LruCache<K, V> {
    fn new(capacity: usize) -> Self {
        Self {
            capacity,
            values: HashMap::new(),
            order: VecDeque::new(),
        }
    }

    fn put(&mut self, _key: K, _value: V) {}

    fn get(&mut self, _key: &K) -> Option<V> {
        None
    }

    fn len(&self) -> usize {
        self.values.len()
    }
}'''
solution = '''use std::collections::{HashMap, VecDeque};
use std::hash::Hash;

struct LruCache<K, V> {
    capacity: usize,
    values: HashMap<K, V>,
    order: VecDeque<K>,
}

impl<K: Eq + Hash + Clone, V: Clone> LruCache<K, V> {
    fn new(capacity: usize) -> Self {
        Self {
            capacity,
            values: HashMap::new(),
            order: VecDeque::new(),
        }
    }

    fn touch(&mut self, key: &K) {
        if let Some(index) = self.order.iter().position(|existing| existing == key) {
            self.order.remove(index);
        }
        self.order.push_back(key.clone());
    }

    fn put(&mut self, key: K, value: V) {
        if self.capacity == 0 {
            return;
        }
        if self.values.contains_key(&key) {
            self.values.insert(key.clone(), value);
            self.touch(&key);
            return;
        }
        if self.values.len() == self.capacity {
            if let Some(oldest) = self.order.pop_front() {
                self.values.remove(&oldest);
            }
        }
        self.values.insert(key.clone(), value);
        self.order.push_back(key);
    }

    fn get(&mut self, key: &K) -> Option<V> {
        if !self.values.contains_key(key) {
            return None;
        }
        self.touch(key);
        self.values.get(key).cloned()
    }

    fn len(&self) -> usize {
        self.values.len()
    }
}'''
tests = '''bovabon_tests! {
    "đọc lại giá trị" => {
        let mut cache = LruCache::new(2);
        cache.put("a", 1);
        assert_eq!(cache.get(&"a"), Some(1));
    },
    "key không tồn tại" => {
        let mut cache: LruCache<&str, i32> = LruCache::new(2);
        assert_eq!(cache.get(&"missing"), None);
    },
    "put loại key ít dùng nhất" => {
        let mut cache = LruCache::new(2);
        cache.put(1, "one");
        cache.put(2, "two");
        cache.put(3, "three");
        assert_eq!(cache.get(&1), None);
        assert_eq!(cache.get(&2), Some("two"));
    },
    "get làm key thành mới dùng nhất" => {
        let mut cache = LruCache::new(2);
        cache.put(1, "one");
        cache.put(2, "two");
        assert_eq!(cache.get(&1), Some("one"));
        cache.put(3, "three");
        assert_eq!(cache.get(&2), None);
        assert_eq!(cache.get(&1), Some("one"));
    },
    "put key cũ cập nhật và làm mới thứ tự" => {
        let mut cache = LruCache::new(2);
        cache.put(1, "old");
        cache.put(2, "two");
        cache.put(1, "new");
        cache.put(3, "three");
        assert_eq!(cache.get(&1), Some("new"));
        assert_eq!(cache.get(&2), None);
    },
    "capacity không dương" => {
        let mut cache = LruCache::new(0);
        cache.put(1, 10);
        assert_eq!(cache.len(), 0);
        assert_eq!(cache.get(&1), None);
    },
}'''
hints = ["Dùng VecDeque giữ thứ tự từ ít dùng nhất ở front đến mới dùng nhất ở back.", "Khi truy cập key, tìm và xoá vị trí cũ rồi push_back; khi đầy, pop_front và xoá khỏi HashMap."]
explanation = "LRU giữ metadata thứ tự riêng vì HashMap không đảm bảo thứ tự duyệt."
sources = ["rust/book/ch08-00-common-collections"]

[[questions]]
id = "rs-036"
module = "rs-concurrency"
type = "code"
difficulty = 3
tags = ["level:senior"]
lang = "rust"
title = "Gộp tổng từ các thread qua channel"
prompt = '''Viết parallel_sums(chunks: Vec<Vec<i32>>) -> Vec<i32>. Chạy một thread cho mỗi chunk, tính tổng chunk đó, gửi (index, tổng) về qua std::sync::mpsc, rồi trả tổng theo thứ tự chunk ban đầu dù thread hoàn tất khác thứ tự. Chunk rỗng có tổng 0; input rỗng trả Vec rỗng.'''
starter = '''fn parallel_sums(chunks: Vec<Vec<i32>>) -> Vec<i32> {
    vec![0; chunks.len()]
}'''
solution = '''use std::sync::mpsc;
use std::thread;

fn parallel_sums(chunks: Vec<Vec<i32>>) -> Vec<i32> {
    let count = chunks.len();
    let (sender, receiver) = mpsc::channel();

    for (index, chunk) in chunks.into_iter().enumerate() {
        let sender = sender.clone();
        thread::spawn(move || {
            let sum = chunk.into_iter().sum::<i32>();
            sender.send((index, sum)).unwrap();
        });
    }

    drop(sender);
    let mut results = vec![0; count];
    for (index, sum) in receiver {
        results[index] = sum;
    }
    results
}'''
tests = '''bovabon_tests! {
    "input rỗng" => { assert_eq!(parallel_sums(vec![]), Vec::<i32>::new()); },
    "giữ thứ tự chunk" => {
        assert_eq!(parallel_sums(vec![vec![1, 2], vec![10], vec![3, 4, 5]]), vec![3, 10, 12]);
    },
    "số âm và chunk rỗng" => {
        assert_eq!(parallel_sums(vec![vec![-2, 1], vec![], vec![8, -3]]), vec![-1, 0, 5]);
    },
    "một chunk" => { assert_eq!(parallel_sums(vec![vec![7, 8]]), vec![15]); },
}'''
hints = ["Clone sender cho mỗi thread; receiver chỉ kết thúc khi mọi sender đã drop.", "Gửi index cùng kết quả để khôi phục thứ tự ban đầu khi nhận message."]
explanation = "Thread sở hữu chunk qua move; channel chuyển cặp index/kết quả về thread gọi và giữ thứ tự đầu ra."
sources = ["rust/book/ch16-01-threads", "rust/book/ch16-02-message-passing"]

