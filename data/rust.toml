[[modules]]
id = "rs-ownership"
title = "Ownership, borrowing & lifetime"
description = "Quyền sở hữu, mượn bất biến/mutable, slice và quan hệ lifetime."
sources = ["rust/book/ch04-00-understanding-ownership", "rust/book/ch04-02-references-and-borrowing", "rust/book/ch10-03-lifetime-syntax"]
lesson = '''
### Quyền sở hữu và mượn
Mỗi giá trị có một owner; khi owner rời scope, giá trị được giải phóng. Gán một String thường chuyển quyền sở hữu, còn kiểu Copy như i32 được sao chép. Mượn cho phép dùng dữ liệu mà không chuyển ownership.

| Cách dùng | Cú pháp | Quy tắc chính |
|---|---|---|
| Mượn chỉ đọc | &T | Có thể có nhiều immutable reference |
| Mượn để sửa | &mut T | Tại một thời điểm chỉ có một mutable reference, không đồng thời với reference khác |
| Slice | &str, &[T] | View không sở hữu trên một phần dữ liệu |

~~~rust
fn longest<'a>(left: &'a str, right: &'a str) -> &'a str {
    if left.len() >= right.len() { left } else { right }
}
~~~

Lifetime 'a diễn tả rằng kết quả không sống lâu hơn các tham chiếu đầu vào liên quan; nó không kéo dài thời gian sống của dữ liệu. Lỗi thường gặp là dùng giá trị sau khi đã move, giữ immutable borrow trong lúc sửa qua mutable borrow, hoặc trả về tham chiếu tới biến cục bộ.
'''

[[modules]]
id = "rs-types"
title = "Struct, enum, pattern matching & Result"
description = "Tổ chức dữ liệu, xử lý mọi nhánh và lan truyền lỗi bằng Option, Result, và toán tử ?."
sources = ["rust/book/ch05-00-structs", "rust/book/ch06-00-enums", "rust/book/ch09-02-recoverable-errors-with-result"]
lesson = '''
### Kiểu dữ liệu và luồng điều khiển
Struct gom các field có tên; enum biểu diễn một trong nhiều biến thể. Rust dùng enum chuẩn để làm rõ trường hợp thiếu dữ liệu và lỗi thay vì dùng null hay exception ngầm.

| Kiểu | Ý nghĩa | Ví dụ |
|---|---|---|
| Option<T> | Có hoặc không có giá trị | Some(value), None |
| Result<T, E> | Thành công hoặc lỗi có kiểu | Ok(value), Err(error) |
| enum tự định nghĩa | Một trong các trạng thái được liệt kê | Status::Ready |

match phải bao phủ mọi nhánh; dùng _ khi các trường hợp còn lại có cùng cách xử lý. if let Some(x) = value phù hợp khi chỉ quan tâm một mẫu. Trong hàm trả Result, ? trả lỗi sớm và chuyển đổi lỗi nếu kiểu đích hỗ trợ From.

~~~rust
fn parse_count(text: &str) -> Result<usize, std::num::ParseIntError> {
    let count = text.parse::<usize>()?;
    Ok(count)
}
~~~

Lỗi thường gặp là gọi unwrap() trên dữ liệu đầu vào không tin cậy, quên nhánh enum, hoặc dùng ? trong hàm có kiểu trả về không tương thích.
'''

[[modules]]
id = "rs-traits"
title = "Trait, generic & trait object"
description = "Chia sẻ hành vi, giới hạn kiểu generic, dispatch tĩnh và trait object."
sources = ["rust/book/ch10-00-generics", "rust/book/ch10-02-traits", "rust/book/ch18-02-trait-objects"]
lesson = '''
### Hành vi dùng lại
Trait mô tả các hành vi mà kiểu có thể triển khai. Generic cho phép viết thuật toán cho nhiều kiểu; trait bound giới hạn những phép toán mà thuật toán được phép gọi.

| Dạng | Ví dụ | Dispatch |
|---|---|---|
| Generic | fn print<T: Display>(x: T) | Thường được đơn hình hoá lúc biên dịch |
| Opaque return | fn items() -> impl Iterator<Item = i32> | Kiểu cụ thể được giữ kín |
| Trait object | Box<dyn Shape> | Dispatch động qua vtable |

Một trait object hữu ích khi cần lưu nhiều kiểu triển khai chung một trait trong cùng collection. Trait dùng làm object cần object-safe; chẳng hạn method generic không thể gọi qua dyn Trait. Generic struct như Stack<T> có thể dùng với nhiều kiểu mà không cần viết lại cấu trúc.

~~~rust
trait Shape {
    fn area(&self) -> f64;
}
~~~

Lỗi thường gặp là thiếu trait bound, giả định dyn Trait biết kiểu cụ thể, hoặc quên rằng trait object có chi phí dispatch động và thường cần con trỏ như &dyn Trait hay Box<dyn Trait>.
'''

[[modules]]
id = "rs-collections"
title = "Collection, iterator & closure"
description = "Dùng HashMap, VecDeque, iterator lazy và closure để xử lý dữ liệu."
sources = ["rust/book/ch08-00-common-collections", "rust/book/ch13-01-closures", "rust/book/ch13-02-iterators"]
lesson = '''
### Xử lý tập dữ liệu
Vec<T> lưu dãy có thứ tự; HashMap<K, V> tra cứu theo key; VecDeque<T> hỗ trợ thêm/xoá ở hai đầu. Khi đếm tần suất bằng HashMap, entry API gộp bước tìm key và cập nhật giá trị.

| Công cụ | Khi phù hợp | Lưu ý |
|---|---|---|
| Vec<T> | Dãy phần tử, truy cập theo index | Thêm cuối thường hiệu quả |
| HashMap<K, V> | Tra cứu theo key | Thứ tự duyệt không được đảm bảo |
| VecDeque<T> | Hàng đợi hoặc thứ tự LRU | Thêm/xoá ở hai đầu |

Iterator adapter như map, filter, take là lazy; chúng chỉ chạy khi có consumer như collect, sum, hoặc for_each. Closure có thể mượn biến, mượn mutable, hoặc lấy ownership; move yêu cầu capture theo giá trị.

~~~rust
let doubled: Vec<i32> = values.iter().map(|value| value * 2).collect();
~~~

Lỗi thường gặp là nghĩ map đã thực thi dù chưa consume iterator, giả định HashMap giữ thứ tự, hoặc dùng reference sau khi collection đã bị thay đổi.
'''

[[modules]]
id = "rs-errors-modules"
title = "Lỗi, module, crate & Cargo"
description = "Thiết kế lỗi có kiểu, chia module, quản lý visibility và quy trình Cargo."
sources = ["rust/book/ch07-00-managing-growing-projects-with-packages-crates-and-modules", "rust/book/ch07-02-defining-modules-to-control-scope-and-privacy", "rust/book/ch14-00-more-about-cargo", "rust/book/ch09-02-recoverable-errors-with-result"]
lesson = '''
### Tách code và biểu diễn lỗi
Lỗi dự kiến trong nghiệp vụ nên được biểu diễn bằng Result<T, E> với enum lỗi cụ thể; ? giúp truyền lỗi lên caller, còn caller quyết định retry, báo lỗi hay dùng giá trị thay thế. panic! dành cho trạng thái không thể tiếp tục hoặc vi phạm invariant, không phải luồng điều khiển thông thường.

| Khái niệm | Vai trò |
|---|---|
| Package | Đơn vị Cargo có manifest Cargo.toml |
| Crate | Đơn vị biên dịch, binary hoặc library |
| Module | Nhóm item và kiểm soát phạm vi |
| pub | Công khai item theo cây module |

Dùng mod để khai báo module, use để đưa path vào scope, và chỉ mở pub cho API cần thiết. Cargo quản lý dependency, build profile và lệnh như cargo check, cargo test, cargo build. Với ứng dụng, commit Cargo.lock để tái lập phiên bản dependency đã giải quyết.

Lỗi thường gặp là làm mọi item thành public, nhầm package với crate, hoặc nuốt lỗi bằng unwrap() thay vì xử lý ở đúng tầng.
'''

[[modules]]
id = "rs-concurrency"
title = "Concurrency & async căn bản"
description = "Thread, channel, Arc/Mutex, Send/Sync và mô hình Future."
sources = ["rust/book/ch16-01-threads", "rust/book/ch16-02-message-passing", "rust/book/ch16-03-shared-state", "rust/book/ch16-04-extensible-concurrency-sync-and-send", "rust/book/ch17-00-async-await"]
lesson = '''
### Chia sẻ công việc an toàn
thread::spawn chạy closure trên thread mới và thường yêu cầu dữ liệu được move vào thread. Channel truyền message giữa producer và consumer; shared state dùng Arc<T> cho ownership chung giữa thread và Mutex<T> để bảo vệ truy cập mutable.

| Cơ chế | Dùng khi | Điều cần nhớ |
|---|---|---|
| Thread + channel | Gửi kết quả hoặc command | Gửi message thường giảm chia sẻ trạng thái |
| Arc<Mutex<T>> | Nhiều thread cần cập nhật cùng dữ liệu | Lock ngắn, tránh deadlock |
| Send | Chuyển giá trị an toàn qua thread | Compiler kiểm tra tự động |
| Sync | Chia sẻ &T an toàn giữa thread | T: Sync cho phép reference được chia sẻ |

async biểu diễn công việc dưới dạng Future; executor poll Future để tiến triển. Async không tự tạo một thread cho mỗi tác vụ, và thư viện chuẩn cung cấp trait Future nhưng không cung cấp executor tổng quát. Chọn thread cho tác vụ CPU/blocking phù hợp; chọn async khi có runtime và nhiều tác vụ I/O chờ đợi.

Lỗi thường gặp là nghĩ Arc tự làm mọi dữ liệu thread-safe, giữ Mutex lock quá lâu, hoặc quên rằng thread cần ownership/lifetime phù hợp.
'''

