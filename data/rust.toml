[[questions]]
id = "rust-dvc01"
module = "rust-dv-smart-pointers"
type = "code"
difficulty = 2
lang = "rust"
title = "Bộ đếm dùng chung trong một thread"
prompt = '''Cài `SharedCounter` bằng `Rc<RefCell<i32>>`. `new(value)` tạo bộ đếm; `clone_handle(&self)` trả về handle mới cùng trỏ tới bộ đếm; `increment(&self)` tăng giá trị một đơn vị; `get(&self)` đọc giá trị hiện tại. Clone handle phải quan sát cùng trạng thái. Chỉ dùng thư viện chuẩn.'''
starter = '''use std::cell::RefCell;
use std::rc::Rc;

struct SharedCounter {
    value: Rc<RefCell<i32>>,
}

impl SharedCounter {
    fn new(value: i32) -> Self {
        Self { value: Rc::new(RefCell::new(value)) }
    }

    fn clone_handle(&self) -> Self {
        Self { value: Rc::new(RefCell::new(0)) }
    }

    fn increment(&self) {}

    fn get(&self) -> i32 {
        0
    }
}'''
solution = '''use std::cell::RefCell;
use std::rc::Rc;

struct SharedCounter {
    value: Rc<RefCell<i32>>,
}

impl SharedCounter {
    fn new(value: i32) -> Self {
        Self { value: Rc::new(RefCell::new(value)) }
    }

    fn clone_handle(&self) -> Self {
        Self { value: Rc::clone(&self.value) }
    }

    fn increment(&self) {
        *self.value.borrow_mut() += 1;
    }

    fn get(&self) -> i32 {
        *self.value.borrow()
    }
}'''
tests = '''bovabon_tests! {
    "đọc giá trị khởi tạo" => {
        let counter = SharedCounter::new(7);
        assert_eq!(counter.get(), 7);
    },
    "tăng giá trị" => {
        let counter = SharedCounter::new(0);
        counter.increment();
        assert_eq!(counter.get(), 1);
    },
    "handle clone chia sẻ trạng thái" => {
        let counter = SharedCounter::new(3);
        let other = counter.clone_handle();
        other.increment();
        assert_eq!(counter.get(), 4);
    },
    "nhiều lần tăng qua các handle" => {
        let counter = SharedCounter::new(-2);
        let other = counter.clone_handle();
        counter.increment();
        other.increment();
        assert_eq!(counter.get(), 0);
        assert_eq!(other.get(), 0);
    },
}'''
hints = ["Dùng Rc::clone để tạo thêm owner của cùng RefCell.", "borrow_mut() trả guard mutable; dereference guard để cập nhật số nguyên."]
explanation = "Rc chia sẻ ownership đơn luồng, còn RefCell cho phép mutation với kiểm tra borrow lúc chạy."
sources = ["rust/book/ch15-04-rc", "rust/book/ch15-05-interior-mutability"]

[[modules]]
id = "rust-dv-testing-cli"
title = "Kiểm thử & ứng dụng dòng lệnh"
description = "Tổ chức unit/integration test và xây CLI có cấu hình, thông báo lỗi, mã thoát rõ ràng."
sources = ["rust/book/ch11-00-testing", "rust/book/ch11-01-writing-tests", "rust/book/ch11-02-running-tests", "rust/book/ch11-03-test-organization", "rust/book/ch12-01-accepting-command-line-arguments", "rust/book/ch12-03-improving-error-handling-and-modularity"]
lesson = '''
### Kiểm thử và CLI dễ bảo trì
Rust hỗ trợ unit test và integration test qua Cargo. Unit test thường đặt trong module con `tests` của file nguồn; chúng có thể kiểm tra item private theo quy tắc visibility của module. Integration test nằm trong thư mục `tests/`, biên dịch như crate riêng và chỉ dùng API public của library. Dùng `assert!`, `assert_eq!`, `assert_ne!` để kiểm tra kết quả; test nên mô tả một hành vi quan sát được, độc lập với thứ tự chạy và không phụ thuộc trạng thái dùng chung.

| Cách tổ chức | Nhìn thấy gì | Hợp với |
|---|---|---|
| Unit test trong `src` | Có thể truy cập chi tiết private trong module cha | Hàm nhỏ, invariant nội bộ |
| Integration test trong `tests/` | Public API của crate như người dùng thật | Hợp đồng giữa các module |
| Doc test | Ví dụ trong documentation được biên dịch/chạy | Đảm bảo hướng dẫn vẫn đúng |

`#[should_panic]` xác nhận test phải panic; thêm `expected = "..."` để tránh pass do một panic không liên quan. Có thể trả `Result<(), E>` từ test và dùng `?` để lỗi làm test thất bại. `cargo test` chạy test mặc định; đối số sau `--` được chuyển cho test harness, ví dụ `-- --nocapture` để hiện output. Các test chạy song song, nên tránh dựa vào thứ tự hoặc cùng ghi một file.

Với CLI, tách đọc đối số, phân tích cấu hình và xử lý nghiệp vụ thành hàm có thể kiểm thử. Dữ liệu đầu vào sai là lỗi có thể dự kiến: trả `Result` với thông báo rõ, để tầng trên quyết định in ra stderr và dùng exit code khác 0. Không dùng `unwrap()` cho đối số người dùng. Dùng `std::env::args_os()` nếu cần chấp nhận đường dẫn không phải UTF-8; `args()` giả định các đối số chuyển được thành chuỗi UTF-8.

Lỗi hay gặp là đặt mọi test trong binary nên integration test không thể import crate, kiểm tra panic quá rộng, hoặc để test phụ thuộc biến môi trường/working directory mà không cô lập chúng. Thiết kế parser thuần nhận slice đối số giúp test các trường hợp thiếu, lặp, sai và hợp lệ mà không cần chạy process thật.
'''

