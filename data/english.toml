# ============================================================ CODE (xử lý tiếng Anh bằng JS)
[[questions]]
id = "en-c01"
module = "en-vocab"
type = "code"
difficulty = 2
title = "Số nhiều tiếng Anh (pluralize)"
prompt = '''
Viết `pluralize(word)` trả về dạng số nhiều theo các quy tắc (theo thứ tự ưu tiên):

1. **Bất quy tắc**: child→children, person→people, man→men, woman→women, mouse→mice, foot→feet, tooth→teeth, criterion→criteria
2. **Không đếm được** → giữ nguyên: data, information, feedback, software, code, equipment, news
3. Tận cùng **-is** → **-es** (analysis → analyses)
4. Tận cùng **s, x, z, ch, sh** → thêm **es** (class → classes, box → boxes, branch → branches)
5. **Phụ âm + y** → **ies** (query → queries); nguyên âm + y chỉ thêm s (key → keys)
6. **-f / -fe** trong danh sách leaf, life, knife, wife, half, shelf, wolf → **ves**
7. **-o** trong danh sách hero, potato, tomato, echo → thêm **es**
8. Còn lại thêm **s**

Giữ **chữ hoa đầu**: `pluralize('Person') === 'People'`. So khớp danh sách không phân biệt hoa thường.
'''
starter = '''
function pluralize(word) {
  return word + 's';
}
'''
solution = '''
const IRREGULAR = {
  child: 'children', person: 'people', man: 'men', woman: 'women',
  mouse: 'mice', foot: 'feet', tooth: 'teeth', criterion: 'criteria',
};
const UNCOUNTABLE = new Set(['data', 'information', 'feedback', 'software', 'code', 'equipment', 'news']);
const F_TO_VES = new Set(['leaf', 'life', 'knife', 'wife', 'half', 'shelf', 'wolf']);
const O_ES = new Set(['hero', 'potato', 'tomato', 'echo']);

function pluralize(word) {
  const w = word.toLowerCase();
  let out;
  if (IRREGULAR[w]) out = IRREGULAR[w];
  else if (UNCOUNTABLE.has(w)) out = w;
  else if (w.endsWith('is')) out = w.slice(0, -2) + 'es';
  else if (/(s|x|z|ch|sh)$/.test(w)) out = w + 'es';
  else if (/[^aeiou]y$/.test(w)) out = w.slice(0, -1) + 'ies';
  else if (F_TO_VES.has(w)) out = w.replace(/fe?$/, 'ves');
  else if (O_ES.has(w)) out = w + 'es';
  else out = w + 's';
  const upper = word[0] !== word[0].toLowerCase();
  return upper ? out[0].toUpperCase() + out.slice(1) : out;
}
'''
tests = '''
test('quy tắc thường', () => {
  expect(['bug', 'key', 'commit', 'photo'].map(pluralize)).toEqual(['bugs', 'keys', 'commits', 'photos']);
});
test('s, x, z, ch, sh → es', () => {
  expect(['class', 'box', 'branch', 'hash', 'bus'].map(pluralize)).toEqual(['classes', 'boxes', 'branches', 'hashes', 'buses']);
});
test('phụ âm + y → ies', () => {
  expect(['query', 'dependency', 'day'].map(pluralize)).toEqual(['queries', 'dependencies', 'days']);
});
test('bất quy tắc & không đếm được', () => {
  expect(['child', 'person', 'mouse', 'criterion'].map(pluralize)).toEqual(['children', 'people', 'mice', 'criteria']);
  expect(['feedback', 'information', 'software'].map(pluralize)).toEqual(['feedback', 'information', 'software']);
});
test('-is, -f/-fe, -o', () => {
  expect(['analysis', 'leaf', 'knife', 'hero', 'video'].map(pluralize)).toEqual(['analyses', 'leaves', 'knives', 'heroes', 'videos']);
});
test('giữ chữ hoa đầu', () => {
  expect(pluralize('Person')).toBe('People');
  expect(pluralize('Branch')).toBe('Branches');
});
'''
hints = ["Kiểm tra theo đúng thứ tự ưu tiên; bất quy tắc và không đếm được trước tiên.", "Regex `/[^aeiou]y$/` bắt phụ âm + y."]
explanation = "Thư viện như `pluralize` (npm) hay Rails ActiveSupport dùng đúng cách này: danh sách ngoại lệ + quy tắc regex."

[[questions]]
id = "en-c02"
module = "en-grammar"
type = "code"
difficulty = 1
title = "Số thứ tự (1st, 2nd, 3rd…)"
prompt = '''
Viết `ordinal(n)` cho số nguyên `n ≥ 0`, trả về chuỗi số thứ tự tiếng Anh:
`1 → "1st"`, `2 → "2nd"`, `3 → "3rd"`, `4 → "4th"`, `11 → "11th"`, `12 → "12th"`, `13 → "13th"`, `21 → "21st"`, `112 → "112th"`.

(Quy tắc: nếu hai chữ số cuối là 11, 12, 13 → *th*; ngược lại xét chữ số cuối 1/2/3 → *st/nd/rd*, còn lại *th*.)
'''
starter = '''
function ordinal(n) {
  return n + 'th';
}
'''
solution = '''
function ordinal(n) {
  const last2 = n % 100;
  if (last2 >= 11 && last2 <= 13) return n + 'th';
  const suffix = { 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th';
  return n + suffix;
}
'''
tests = '''
test('1–4', () => {
  expect([1, 2, 3, 4].map(ordinal)).toEqual(['1st', '2nd', '3rd', '4th']);
});
test('11, 12, 13 là ngoại lệ', () => {
  expect([11, 12, 13].map(ordinal)).toEqual(['11th', '12th', '13th']);
});
test('21, 22, 23, 101, 111, 112', () => {
  expect([21, 22, 23, 101, 111, 112].map(ordinal)).toEqual(['21st', '22nd', '23rd', '101st', '111th', '112th']);
});
test('0 và số tròn', () => {
  expect([0, 10, 100, 1000].map(ordinal)).toEqual(['0th', '10th', '100th', '1000th']);
});
'''
hints = ["Xét `n % 100` trước, rồi mới tới `n % 10`."]
explanation = "Khi hiển thị ngày/xếp hạng, có thể dùng `Intl.PluralRules(\"en\", { type: \"ordinal\" })` để lấy loại one/two/few/other."

[[questions]]
id = "en-c03"
module = "en-speaking"
type = "code"
difficulty = 3
title = "Đọc số thành chữ (number to words)"
prompt = '''
Viết `toWords(n)` cho số nguyên `0 ≤ n < 1 000 000 000`, trả về cách đọc tiếng Anh kiểu Mỹ, chữ thường:

- `0 → "zero"`, `7 → "seven"`, `15 → "fifteen"`
- Từ 21–99 có **gạch nối**: `42 → "forty-two"`
- **Không** dùng "and": `105 → "one hundred five"`
- Nhóm nghìn/triệu: `1200 → "one thousand two hundred"`, `2000005 → "two million five"`, `999999999 → "nine hundred ninety-nine million nine hundred ninety-nine thousand nine hundred ninety-nine"`
- Các từ cách nhau đúng **một** khoảng trắng.
'''
starter = '''
function toWords(n) {
  return String(n);
}
'''
solution = '''
const ONES = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten',
  'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
const TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];

function under1000(n) {
  const parts = [];
  if (n >= 100) { parts.push(ONES[Math.floor(n / 100)] + ' hundred'); n %= 100; }
  if (n >= 20) parts.push(TENS[Math.floor(n / 10)] + (n % 10 ? '-' + ONES[n % 10] : ''));
  else if (n > 0) parts.push(ONES[n]);
  return parts.join(' ');
}

function toWords(n) {
  if (n === 0) return 'zero';
  const scales = [[1000000, 'million'], [1000, 'thousand'], [1, '']];
  const parts = [];
  for (const [size, name] of scales) {
    const chunk = Math.floor(n / size) % 1000;
    if (chunk) parts.push(under1000(chunk) + (name ? ' ' + name : ''));
  }
  return parts.join(' ');
}
'''
tests = '''
test('0–20', () => {
  expect([0, 7, 13, 15, 20].map(toWords)).toEqual(['zero', 'seven', 'thirteen', 'fifteen', 'twenty']);
});
test('gạch nối 21–99', () => {
  expect([21, 42, 99, 30].map(toWords)).toEqual(['twenty-one', 'forty-two', 'ninety-nine', 'thirty']);
});
test('hàng trăm, không dùng and', () => {
  expect(toWords(105)).toBe('one hundred five');
  expect(toWords(310)).toBe('three hundred ten');
  expect(toWords(999)).toBe('nine hundred ninety-nine');
});
test('nghìn & triệu', () => {
  expect(toWords(1200)).toBe('one thousand two hundred');
  expect(toWords(2000005)).toBe('two million five');
  expect(toWords(1000000)).toBe('one million');
  expect(toWords(40017)).toBe('forty thousand seventeen');
});
test('số lớn nhất', () => {
  expect(toWords(999999999)).toBe('nine hundred ninety-nine million nine hundred ninety-nine thousand nine hundred ninety-nine');
});
'''
hints = ["Tách số thành các nhóm 3 chữ số (triệu, nghìn, đơn vị) và viết hàm đọc số < 1000.", "Bỏ qua nhóm bằng 0 để không sinh ra \"zero thousand\"."]
explanation = "Đây cũng là cách luyện đọc số khi thuyết trình: chia nhóm ba chữ số và đọc từng nhóm kèm *thousand/million*."

[[questions]]
id = "en-c04"
module = "en-writing"
type = "code"
difficulty = 3
title = "Linter cho commit message"
prompt = '''
Viết `lintCommit(message)` trả về **mảng mã lỗi** (rỗng nếu hợp lệ). Dòng đầu là *header*:

1. Header phải khớp `type(scope)!: subject` — `(scope)` và `!` tuỳ chọn, sau `:` đúng **một** khoảng trắng, subject không rỗng. Sai → trả ngay `['format']`
2. `type` thuộc: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert — ngược lại thêm `'type'`
3. Subject bắt đầu bằng chữ **in hoa** (A–Z) → `'lowercase'` (subject phải viết thường đầu câu)
4. Subject kết thúc bằng dấu `.` → `'period'`
5. Từ đầu tiên của subject (viết thường) kết thúc bằng `ed` hoặc `ing`, hoặc kết thúc bằng `s` nhưng không phải `ss`/`us` → `'imperative'`
6. Header dài hơn **72** ký tự → `'length'`
7. Có nhiều hơn một dòng mà dòng thứ hai **không rỗng** → `'blank-line'`

Mã lỗi theo đúng thứ tự trên.
'''
starter = '''
function lintCommit(message) {
  return [];
}
'''
solution = '''
const TYPES = ['feat', 'fix', 'docs', 'style', 'refactor', 'perf', 'test', 'build', 'ci', 'chore', 'revert'];

function lintCommit(message) {
  const lines = message.split('\n');
  const header = lines[0];
  const m = header.match(/^([a-z]+)(\([^()\s]+\))?(!)?: (\S.*)$/i);
  if (!m) return ['format'];
  const errors = [];
  const [, type, , , subject] = m;
  if (!TYPES.includes(type)) errors.push('type');
  if (/^[A-Z]/.test(subject)) errors.push('lowercase');
  if (subject.endsWith('.')) errors.push('period');
  const first = subject.split(/\s+/)[0].toLowerCase();
  if (/(ed|ing)$/.test(first) || (/s$/.test(first) && !/(ss|us)$/.test(first))) errors.push('imperative');
  if (header.length > 72) errors.push('length');
  if (lines.length > 1 && lines[1] !== '') errors.push('blank-line');
  return errors;
}
'''
tests = '''
test('hợp lệ', () => {
  expect(lintCommit('feat(auth): add password reset')).toEqual([]);
  expect(lintCommit('fix!: handle empty cart\n\nThe app crashed when the cart was empty.')).toEqual([]);
  expect(lintCommit('docs: focus on setup steps')).toEqual([]);
});
test('sai định dạng', () => {
  expect(lintCommit('add login page')).toEqual(['format']);
  expect(lintCommit('feat:add login')).toEqual(['format']);
  expect(lintCommit('feat: ')).toEqual(['format']);
});
test('type không hợp lệ', () => {
  expect(lintCommit('feature: add login')).toEqual(['type']);
});
test('viết hoa, dấu chấm, thể mệnh lệnh', () => {
  expect(lintCommit('fix: Fixed the login bug.')).toEqual(['lowercase', 'period', 'imperative']);
  expect(lintCommit('feat: adding dark mode')).toEqual(['imperative']);
  expect(lintCommit('fix: handles null user')).toEqual(['imperative']);
  expect(lintCommit('chore: process images in parallel')).toEqual([]);
});
test('độ dài & dòng trống', () => {
  expect(lintCommit('refactor: ' + 'x'.repeat(70))).toEqual(['length']);
  expect(lintCommit('fix: update deps\nmore details')).toEqual(['blank-line']);
});
'''
hints = ["Regex header: `/^([a-z]+)(\\([^()\\s]+\\))?(!)?: (\\S.*)$/i`.", "Kiểm tra từng quy tắc độc lập và đẩy mã lỗi theo thứ tự."]
explanation = "Công cụ thật: **commitlint** + husky. Viết commit message tốt bằng tiếng Anh là kỹ năng được đánh giá cao khi làm việc với team quốc tế."

