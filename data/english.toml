  ["concern", "risk", "stale"],
  ["freshness", "how often", "requirement"],
  ["could we", "what if", "i'd suggest"],
  ["next step", "measure", "test"],
]
min_keywords = 4
model_answer = '''
I see your point that caching could reduce database load. My concern is stale data for order status, so could we clarify the freshness requirement first? I'd suggest testing a short cache duration and measuring the response time. Then we can review the results before rollout.
'''
explanation = "Nêu lợi ích, rủi ro, câu hỏi làm rõ và hành động đề xuất để bất đồng vẫn mang tính hợp tác."

