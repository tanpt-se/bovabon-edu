difficulty = 3
prompt = '''
Viết PR description bằng tiếng Anh cho thay đổi sửa lỗi: hai request cập nhật cart đồng thời có thể ghi đè nhau. Nêu What, Why, cách test và kết quả mong đợi.
'''
keywords = [
  ["this pr", "what", "adds"],
  ["because", "why", "race condition"],
  ["cart", "concurrent", "stale update"],
  ["how to test", "run the tests", "test"],
  ["result", "prevent", "correct"],
]
min_keywords = 4
model_answer = '''
This PR fixes a race condition in cart updates. Two concurrent requests could overwrite a newer value with a stale update, so the service now checks the cart version before saving. To test the change, run the concurrency tests and verify that stale requests are rejected. This prevents incorrect totals while preserving valid updates.
'''
explanation = "Mô tả nguyên nhân, giải pháp, test và kết quả giúp reviewer hiểu cả thay đổi lẫn lý do."

