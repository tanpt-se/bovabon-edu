# ============================================================ MODULES
[[modules]]
id = "en-vocab"
title = "Từ vựng kỹ thuật"
description = "Những từ developer gặp mỗi ngày: deploy, deprecate, bottleneck, edge case, trade-off…"
lesson = '''
### Nhóm từ hay gặp
| Từ | Nghĩa | Ví dụ |
|---|---|---|
| **deploy** (v) / deployment (n) | triển khai | *We deploy to production every Friday.* |
| **deprecate** (v) | đánh dấu sắp bỏ | *This method is **deprecated** and will be removed in v3.* |
| **backward compatible** | tương thích ngược | *The change is backward compatible.* |
| **edge case** | trường hợp biên | *Empty input is an edge case.* |
| **bottleneck** | nút thắt cổ chai | *The database is the bottleneck.* |
| **trade-off** | sự đánh đổi | *Caching is a trade-off between speed and freshness.* |
| **workaround** | cách lách tạm | *Here is a workaround until the fix is released.* |
| **regression** | lỗi tái phát / làm hỏng cái đang chạy | *This PR introduced a regression.* |
| **out of scope** | ngoài phạm vi | *Dark mode is out of scope for this sprint.* |
| **roll back** (v) / rollback (n) | quay lại bản cũ | *Let's roll back the release.* |

### Từ kỹ thuật, IPA và collocation
IPA dưới đây theo cách đọc Anh–Mỹ phổ biến; trọng âm chính đặt trước âm tiết có dấu /ˈ/.
| Từ | IPA | Nghĩa | Ví dụ trong IT |
|---|---|---|---|
| **deploy** | /dɪˈplɔɪ/ | triển khai | *We deploy the patch after the tests pass.* |
| **repository** | /rɪˈpɑːzəˌtɔːri/ | kho mã nguồn | *The repository contains the API and its tests.* |
| **throughput** | /ˈθruːˌpʊt/ | thông lượng | *The new connection pool improves throughput.* |
| **query** | /ˈkwɪri/ | truy vấn | *This query returns duplicate rows.* |
| **cache** | /kæʃ/ | bộ nhớ đệm | *The cache expires after ten minutes.* |
| **queue** | /kjuː/ | hàng đợi | *The worker reads jobs from the queue.* |
| **reliable** | /rɪˈlaɪəbəl/ | đáng tin cậy | *We need a reliable retry strategy.* |
| **failure** | /ˈfeɪljər/ | sự cố, thất bại | *The dashboard records each failure.* |

Collocation giúp câu tự nhiên hơn: **deploy a service**, **run a query**, **raise an issue**, **meet a deadline**, **break backward compatibility**, **handle an edge case**, **reach an agreement**, **provide feedback**. Nói *raise an issue* thay vì dịch từng chữ kiểu *open a problem*; nói *make a decision* thay vì *do a decision*.

Người Việt thường bỏ âm cuối: *tests* cần /s/ sau /t/, *deploys* cần âm /z/, còn *fixed* đọc tận cùng /t/ và *merged* tận cùng /d/. Đuôi **-ed** đọc /ɪd/ sau /t/ hoặc /d/ (*tested*), /t/ sau âm vô thanh (*fixed*), /d/ sau âm hữu thanh (*merged*). Đừng thêm nguyên âm thành *fix-tờ* hay *test-ịt*.

Trọng âm có thể phân biệt từ và giúp người nghe nhận ra từ: danh từ **REcord** thường nhấn âm đầu, động từ **reCORD** thường nhấn âm sau. Một số từ dễ dịch nhầm: **actually** = thật ra (không phải *hiện tại*), **currently** = hiện tại, **eventually** = cuối cùng, **sensible** = hợp lý, **sensitive** = nhạy cảm. Tránh dịch word-by-word; *The app is running slowly* tự nhiên hơn *The app runs slow* trong văn phong chuyên nghiệp.

### Lưu ý
- Danh từ **không đếm được**: *data* (thường dùng như số ít trong IT), *information*, *feedback*, *software*, *code*, *equipment* → **không** thêm *s*: ~~feedbacks~~, ~~informations~~.
- *setup* (n) vs *set up* (v): *The **setup** is easy. — Please **set up** the project.* Tương tự *login / log in*, *backup / back up*, *rollback / roll back*.
'''

[[modules]]
id = "en-grammar"
title = "Ngữ pháp trong công việc"
description = "Hiện tại hoàn thành, bị động trong tài liệu, câu điều kiện, mạo từ, phrasal verb."
lesson = '''
### Hiện tại hoàn thành (present perfect)
Việc vừa xong, kết quả còn liên quan tới hiện tại: *I **have fixed** the bug.* — *The build **has failed** three times today.*
Dùng **quá khứ đơn** khi có thời điểm cụ thể: *I **fixed** it **yesterday**.*

### Bị động (passive) — rất phổ biến trong tài liệu
*The request **is sent** over HTTPS.* · *The token **will be refreshed** automatically.* · *This API **was deprecated** in v2.*

### Câu điều kiện
- Loại 0 (sự thật/hành vi hệ thống): *If the cache **is** empty, the app **fetches** fresh data.*
- Loại 1 (khả năng thật): *If the tests **pass**, I **will merge** the PR.*
- Loại 2 (giả định): *If we **had** more time, we **would refactor** this module.*

### Mạo từ a / an / the
*an* trước **âm** nguyên âm: *an API* (/eɪ/), *an HTTP request* (/eɪtʃ/), *an hour*; nhưng *a URL* (/juː/), *a user*, *a unique id*.

### Phrasal verb hay dùng
*look into* (điều tra), *figure out* (tìm ra), *set up*, *roll out* (triển khai dần), *clean up*, *break down* (chia nhỏ), *follow up* (theo dõi tiếp), *come up with* (nghĩ ra).

### Lỗi hay gặp khi viết câu
- Chủ ngữ số ít ở hiện tại đơn cần **-s**: *The worker retries the request*, nhưng *The workers retry the request*. Đừng bỏ âm cuối khi nói.
- Dùng quá khứ đơn với thời điểm đã kết thúc: *We deployed it yesterday*; dùng present perfect khi không nêu mốc và kết quả còn liên quan: *We have deployed the fix*.
- Mạo từ theo âm đầu: *an hour*, *a user*, *an API*, *a URL*. Chữ viết không quyết định a/an.
- Trật tự câu tiếng Anh thường là chủ ngữ + động từ + tân ngữ: *The service returns an error*, không dịch từng chữ theo trật tự tiếng Việt.
- Dùng giới từ trong collocation: *depend on*, *responsible for*, *discuss the design* (không có *about* sau *discuss*), *explain the issue to me*.
'''

[[modules]]
id = "en-reading"
title = "Đọc tài liệu & thông báo lỗi"
description = "Từ khoá RFC (MUST/SHOULD/MAY), thuật ngữ trong docs, hiểu nhanh error message."
lesson = '''
### Từ khoá chuẩn (RFC 2119)
- **MUST / REQUIRED / SHALL**: bắt buộc.
- **MUST NOT**: cấm tuyệt đối.
- **SHOULD / RECOMMENDED**: nên làm, chỉ bỏ qua khi có lý do chính đáng.
- **MAY / OPTIONAL**: tuỳ chọn.

### Cụm từ hay gặp trong docs
*out of the box* (có sẵn, không cần cấu hình) · *under the hood* (bên dưới, cơ chế bên trong) · *opt in / opt out* · *by default* · *as of v2.0* (kể từ v2.0) · *e.g.* (ví dụ) vs *i.e.* (tức là) · *caveat* (lưu ý/hạn chế) · *TL;DR* (tóm tắt) · *WIP* (đang làm) · *LGTM* (looks good to me) · *nit* (góp ý nhỏ).

### Đọc error message
*Cannot read properties of **undefined** (reading 'map')* → biến đang là `undefined` khi gọi `.map`.
*Unexpected token '<' … is not valid JSON* → server trả HTML (thường là trang lỗi) thay vì JSON.
*Permission denied*, *Connection refused*, *Address already in use*, *Request timed out*, *Too many open files*.

Khi diễn giải, phân biệt **cause** (nguyên nhân) với **symptom** (biểu hiện): *The request timed out* mô tả biểu hiện, chưa chứng minh server bị hỏng. **Expected behavior** là điều nên xảy ra; **actual behavior** là điều quan sát được. Những từ nối như *therefore*, *however*, *for example* giúp nêu quan hệ rõ ràng; **e.g.** đưa ví dụ, **i.e.** nói cách diễn đạt tương đương.

Một false friend đáng nhớ là **actually** (thật ra), khác **currently** (hiện tại). **Eventually** có nghĩa cuối cùng sau một khoảng thời gian; nó không có nghĩa là “có thể”. Đọc cả câu và kiểm tra quan hệ nguyên nhân–kết quả, đừng dịch từng từ rời rạc.
'''

[[modules]]
id = "en-writing"
title = "Viết commit, PR, issue & email"
description = "Imperative mood, Conventional Commits, mô tả PR, báo bug, email lịch sự."
lesson = '''
### Commit message
- Dòng tiêu đề ở **thể mệnh lệnh** (imperative): *Fix*, *Add*, *Remove* — không phải *Fixed/Adds/Fixing*. Mẹo: câu phải đọc được sau "*If applied, this commit will …*".
- ≤ 72 ký tự, không chấm cuối; dòng trống rồi mới tới phần thân giải thích **why**.
- **Conventional Commits**: `feat(auth): add password reset`, `fix: handle empty cart`, `docs: …`, `refactor: …`; `!` hoặc `BREAKING CHANGE:` cho thay đổi phá vỡ.

### Pull request
**What** (thay đổi gì) · **Why** (vì sao) · **How to test** · ảnh chụp/video nếu là UI · ticket liên quan (*Closes #123*).

### Báo bug (issue)
*Steps to reproduce* · *Expected behavior* · *Actual behavior* · *Environment* (OS, version) · log/screenshot.

### Email / chat lịch sự
*Could you please take a look at…?* · *Would it be possible to…?* · *Just a friendly reminder…* · *Sorry for the late reply.* · *Let me know if you have any questions.* · Tránh *Please do the needful*, *Revert back*, *Kindly revert*.

Collocation công việc: **send an update**, **share a link**, **request a review**, **address a comment**, **follow up on an issue**, **schedule a meeting**. Dùng động từ cụ thể thay cho câu dài: *I fixed the validation error* rõ hơn *A fix was made to the validation error*. Giọng lịch sự không cần quá nhiều *please*; nêu yêu cầu, lý do và thời hạn nếu có.
'''

[[modules]]
id = "en-speaking"
title = "Họp, standup & phỏng vấn"
description = "Cập nhật standup, hỏi lại khi chưa hiểu, phát âm từ kỹ thuật, trả lời phỏng vấn theo STAR."
lesson = '''
### Standup
*Yesterday I finished… · Today I'm going to… · I'm blocked by… / No blockers.*

### Khi chưa nghe rõ / chưa hiểu
*Sorry, could you say that again?* · *Could you elaborate on…?* · *Just to make sure I understand, you mean…?* · *Let me get back to you on that.*

### Đề xuất & phản biện nhẹ nhàng
*What if we…?* · *Have we considered…?* · *I see your point, but…* · *I'd suggest…*

### Phát âm hay sai
**cache** /kæʃ/ (như *cash*) · **Linux** /ˈlɪnəks/ · **SQL** /ˌes.kjuːˈel/ hoặc /ˈsiːkwəl/ · **height** /haɪt/ · **width** /wɪdθ/ · **suite** /swiːt/ · **queue** /kjuː/ · **GUI** /ˈɡuːi/ · **char** /tʃɑːr/ · **null** /nʌl/ · **daemon** /ˈdiːmən/.

### Phỏng vấn — phương pháp STAR
**S**ituation → **T**ask → **A**ction (tập trung vào *I*, không phải *we*) → **R**esult (có số liệu càng tốt).

### Phát âm để đồng nghiệp nghe rõ
Đừng bỏ âm cuối khi nói *tests*, *builds*, *fixed*, *deployed*. Đuôi số nhiều **-s** đọc /s/ sau âm vô thanh (*tests*), /z/ sau âm hữu thanh (*builds*), và /ɪz/ sau âm xì (*releases*). Đuôi quá khứ **-ed** có ba cách đọc: /t/ trong *fixed*, /d/ trong *deployed*, /ɪd/ trong *tested*. Đây là quy tắc phát âm, không phải ba cách viết.

Đặt trọng âm đúng giúp người nghe nhận từ nhanh hơn: *develop* nhấn âm tiết thứ hai (*de-VEL-op*), *component* cũng nhấn âm tiết thứ hai (*com-PO-nent*), còn *database* thường nhấn phần đầu (*DA-ta-base*). Khi không chắc, tra từ điển phát âm và luyện cả cụm thay vì đọc từng chữ cái.

Khi nối âm, phụ âm cuối có thể nối vào nguyên âm đầu kế tiếp: *send it* thường liền mạch, nhưng vẫn giữ đủ âm để phân biệt từ. Mục tiêu là dễ hiểu, không phải bắt chước một giọng địa phương cụ thể.
'''

[[modules]]
id = "en-email-chat"
title = "Email và Slack"
description = "Hỏi thông tin, báo lỗi, xin review, từ chối lịch sự và follow-up theo đúng mức độ trang trọng."
lesson = '''
### Chọn giọng theo kênh và người nhận
Email với khách hàng hoặc người chưa quen thường đầy đủ câu và có lời chào; Slack nội bộ có thể ngắn hơn nhưng vẫn nêu ngữ cảnh và hành động cần thiết.
| Mục đích | Formal email | Slack thân mật vừa phải |
|---|---|---|
| Hỏi | *Could you clarify the deadline for this change?* | *Do we have a deadline for this?* |
| Báo lỗi | *I found an issue with the export flow.* | *The export is failing for archived orders.* |
| Xin review | *Would you be able to review PR #42 by Thursday?* | *Could someone review PR #42 when they have a moment?* |
| Từ chối | *I’m afraid I can’t take this on before Friday.* | *I can’t pick this up today, but I can look tomorrow.* |
| Follow-up | *I’m following up on my request below.* | *Quick follow-up: do you have an update?* |

Một email hữu ích có subject cụ thể, bối cảnh ngắn, yêu cầu rõ và deadline nếu cần. Slack thường bỏ lời chào dài; tránh gửi *Any update?* liên tục. Thay bằng *Could you share an update by 3 p.m. so I can unblock the release?* Nếu từ chối, nói rõ giới hạn và đề xuất phương án khả thi. **Could you…?**, **Would you mind…?**, **I’m afraid…** làm câu mềm hơn; đừng lạm dụng *kindly* hoặc dịch nguyên cụm tiếng Việt sang tiếng Anh.
'''

[[modules]]
id = "en-meetings"
title = "Họp và cộng tác"
description = "Stand-up, sprint planning, retrospective, nêu ý kiến, phản biện lịch sự và xác nhận thông tin."
lesson = '''
### Ngôn ngữ theo từng cuộc họp
| Tình huống | Câu tự nhiên |
|---|---|
| Stand-up: hôm qua | *Yesterday, I finished the retry logic.* |
| Stand-up: hôm nay | *Today, I’m going to add integration tests.* |
| Blocker | *I’m blocked by the staging credentials.* |
| Planning: ước lượng | *This looks like a two-point task, assuming the API stays unchanged.* |
| Nêu ý kiến | *I’d suggest keeping the endpoint backward compatible.* |
| Phản đối nhẹ | *I see the benefit, but I’m concerned about the migration cost.* |
| Hỏi lại | *Sorry, could you repeat the last part?* |

Trong retrospective, nêu sự kiện cụ thể thay vì quy lỗi: *The deploy took 40 minutes because the migration ran synchronously.* Sau đó đề xuất bước tiếp theo: *Could we test the migration on a copy of production data?* Để đồng ý có sắc thái, dùng *That makes sense because…*; để bất đồng, giải thích rủi ro và nêu lựa chọn. Nếu chưa nghe, xin nhắc lại hoặc diễn đạt điều mình hiểu: *So the new limit applies to each user, correct?* Đừng chỉ nói *yes* khi còn mơ hồ.
'''

[[modules]]
id = "en-code-review"
title = "Code review và báo lỗi"
description = "Viết comment có mức độ rõ ràng, PR description, commit message và bug report tái hiện được."
lesson = '''
### Comment review tập trung vào mã
| Mức độ | Cách viết | Ý nghĩa |
|---|---|---|
| Nit | *Nit: could we rename this to `userCount` for consistency?* | góp ý nhỏ, không chặn merge |
| Suggestion | *Could we move this validation into the service so both callers use it?* | đề xuất cải thiện |
| Blocking | *This can expose another user’s data. Please check ownership before merging.* | vấn đề cần sửa trước khi merge |

Giải thích **why** và nêu hướng sửa khi có thể. Viết *This branch misses the empty-list case* thay vì *You forgot…*; phê bình thay đổi, không phê bình người viết. PR description thường gồm **What**, **Why**, **How to test**, và ảnh/changelog nếu cần. Bug report có title, môi trường, bước tái hiện đánh số, expected behavior và actual behavior. Bước phải đủ cụ thể để người khác làm lại; tách quan sát khỏi suy đoán nguyên nhân. Commit header theo Conventional Commits như *fix(auth): reject expired sessions*; dùng động từ nguyên mẫu và không thêm dấu chấm cuối.
'''

[[modules]]
id = "en-docs-writing"
title = "README và tài liệu kỹ thuật"
description = "Viết README, ADR và giải thích kỹ thuật bằng plain English, câu chủ động và cấu trúc dễ quét."
lesson = '''
### Viết để người đọc làm được việc
README thường trả lời: project làm gì, yêu cầu gì, cách cài, cách chạy, cách test và nơi tìm trợ giúp. ADR ghi **Context**, **Decision**, **Consequences**; nêu quyết định đã chọn và đánh đổi, không chỉ liệt kê phương án.

| Dài / mơ hồ | Plain English |
|---|---|
| *The cache is invalidated by the service.* | *The service clears the cache.* |
| *In order to run the tests, execute…* | *To run the tests, execute…* |
| *It should be noted that the token expires…* | *The token expires…* |

Ưu tiên câu chủ động khi tác nhân quan trọng: *The worker retries the job twice.* Dùng bị động khi tác nhân không rõ hoặc không đáng kể: *The token is stored securely.* Một đoạn nên có một ý; đặt tên section theo câu hỏi người đọc cần trả lời. Giải thích thuật ngữ một lần, dùng ví dụ ngắn có dữ liệu thực tế, và phân biệt requirement với recommendation. Không cần dùng từ trang trọng dài nếu động từ quen thuộc diễn đạt đúng ý.
'''

[[modules]]
id = "en-interview"
title = "Phỏng vấn kỹ thuật"
description = "STAR, kể dự án, trình bày system design, đặt câu hỏi ngược và trao đổi offer bằng tiếng Anh."
lesson = '''
### Trả lời có cấu trúc
Với câu hỏi behavioral, dùng **STAR**: Situation (bối cảnh), Task (trách nhiệm), Action (việc chính bạn làm), Result (kết quả). Nói cụ thể phần **I** để làm rõ đóng góp cá nhân; dùng số liệu chỉ khi có thật. Khi mô tả dự án, bắt đầu bằng người dùng/vấn đề, rồi nêu kiến trúc, lựa chọn, đánh đổi và kết quả.

Trong system design, xác nhận yêu cầu trước: *How many daily active users should we support?* Sau đó tóm tắt giả định, API, data model, luồng chính, bottleneck và cách xử lý lỗi. Nếu cần suy nghĩ, nói *Let me think through the trade-offs* thay vì im lặng. Nếu chưa rõ câu hỏi, xác nhận phạm vi.

Hỏi interviewer về tiêu chí thành công, quy trình review, vận hành on-call và cách team ra quyết định. Khi đàm phán offer, cảm ơn, thể hiện quan tâm, nêu cơ sở mong muốn và hỏi về tổng gói: *Based on the role and my experience, is there flexibility in the base salary?* Không bịa số liệu hoặc lời mời cạnh tranh; xin thời gian xem xét nếu cần.
'''

[[modules]]
id = "en-pronunciation"
title = "Phát âm tiếng Anh kỹ thuật"
description = "Luyện trọng âm từ công nghệ, âm cuối -s/-ed, cách đọc acronym và nối âm dễ hiểu."
lesson = '''
### Từ kỹ thuật và trọng âm Anh–Mỹ
| Từ | IPA tham khảo | Ghi chú |
|---|---|---|
| develop | /dɪˈvɛləp/ | nhấn âm 2 |
| component | /kəmˈpoʊnənt/ | nhấn âm 2 |
| database | /ˈdeɪtəˌbeɪs/ | thường nhấn phần đầu; *data* cũng có biến thể /ˈdætə/ |
| cache | /kæʃ/ | vần giống *cash* |
| queue | /kjuː/ | một âm tiết |
| GUI | /ˌdʒiː juː ˈaɪ/ hoặc /ˈɡuːi/ | đọc từng chữ hoặc “goo-ee” |
| SQL | /ˌɛs kjuː ˈɛl/ hoặc /ˈsiːkwəl/ | cả “ess-cue-ell” và “sequel” đều dùng |
| Linux | /ˈlɪnəks/ | thường nhấn âm đầu ở Mỹ |
| algorithm | /ˈælɡəˌrɪðəm/ | nhấn âm đầu |
| architecture | /ˈɑːrkɪˌtɛktʃər/ | nhấn âm đầu |

Đuôi **-s** đọc /s/ sau âm vô thanh (*tests*), /z/ sau âm hữu thanh (*builds*) và /ɪz/ sau âm xì (*branches*). Đuôi **-ed** đọc /t/ (*fixed*), /d/ (*merged*) hoặc /ɪd/ (*tested*) theo âm cuối của động từ gốc. Đừng bỏ âm cuối hoặc thêm âm tiết không cần thiết. Khi nối âm, *check it* có thể liền tiếng nhưng hai từ vẫn cần nghe được. Một số IPA có biến thể vùng miền; mục tiêu là phát âm nhất quán và dễ hiểu, không bắt buộc một accent duy nhất.
'''

