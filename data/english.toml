[[questions]]
id = "en-xc01"
module = "en-docs-writing"
type = "code"
difficulty = 2
lang = "javascript"
title = "Tách câu cho tài liệu"
prompt = '''
Viết splitSentences(text) trả về mảng câu theo quy tắc đơn giản: dấu ., ? hoặc ! kết thúc câu nếu ngay sau nó là khoảng trắng hoặc hết chuỗi. Giữ dấu kết câu, bỏ khoảng trắng thừa quanh mỗi câu, bỏ phần tử rỗng. Nếu đoạn cuối không có dấu câu, vẫn trả nó như một câu. Chuỗi chỉ có khoảng trắng trả về mảng rỗng. Không cần nhận diện chữ viết tắt như e.g. hoặc số thập phân.
Ví dụ: splitSentences("Ship it. Is CI green? Yes!") trả về ["Ship it.", "Is CI green?", "Yes!"].
'''
starter = '''
function splitSentences(text) {
  return text.trim() ? [text.trim()] : [];
}
'''
solution = '''
function splitSentences(text) {
  const sentences = [];
  let start = 0;
  for (let i = 0; i < text.length; i++) {
    if ('.!?'.includes(text[i]) && (i + 1 === text.length || /\s/.test(text[i + 1]))) {
      const sentence = text.slice(start, i + 1).trim();
      if (sentence) sentences.push(sentence);
      start = i + 1;
    }
  }
  const tail = text.slice(start).trim();
  if (tail) sentences.push(tail);
  return sentences;
}
'''
tests = '''
test('tách theo ba dấu kết câu', () => {
  expect(splitSentences('Ship it. Is CI green? Yes!')).toEqual(['Ship it.', 'Is CI green?', 'Yes!']);
});
test('bỏ khoảng trắng thừa và bỏ phần rỗng', () => {
  expect(splitSentences('  First.   Second!  ')).toEqual(['First.', 'Second!']);
});
test('giữ câu cuối không có dấu câu', () => {
  expect(splitSentences('One sentence. Final sentence')).toEqual(['One sentence.', 'Final sentence']);
});
test('chuỗi rỗng hoặc chỉ có whitespace', () => {
  expect(splitSentences('')).toEqual([]);
  expect(splitSentences(' \n  ')).toEqual([]);
});
test('dấu chấm lặp kết thúc một câu', () => {
  expect(splitSentences('Wait... Really?')).toEqual(['Wait...', 'Really?']);
});
'''
hints = ["Duyệt từng ký tự và ghi nhận vị trí bắt đầu câu.", "Sau khi gặp dấu kết thúc, trim đoạn vừa lấy rồi bỏ nếu rỗng."]
explanation = "Cách tách có quy tắc rõ phù hợp cho đoạn văn đơn giản; nhận diện viết tắt cần một bộ quy tắc từ vựng riêng."

[[questions]]
id = "en-xc02"
module = "en-docs-writing"
type = "code"
difficulty = 2
lang = "javascript"
title = "Đếm từ và ước lượng thời gian đọc"
prompt = '''
Viết wordCount(text) và readingMinutes(text, wordsPerMinute = 200). Từ là chuỗi chữ cái hoặc chữ số; dấu nháy đơn bên trong từ và từ ghép nối bằng dấu gạch ngang vẫn tính là một từ, ví dụ don't và end-to-end. Dấu câu không tính. Thời gian đọc trả về số phút làm tròn lên; văn bản không có từ trả về 0. Giả sử wordsPerMinute là số nguyên dương.
Ví dụ: wordCount("Fix the end-to-end test.") trả về 4; readingMinutes("one two three", 2) trả về 2.
'''
starter = '''
function wordCount(text) {
  return 0;
}

function readingMinutes(text, wordsPerMinute = 200) {
  return 0;
}
'''
solution = '''
function wordCount(text) {
  const words = text.match(/[A-Za-z0-9]+(?:['-][A-Za-z0-9]+)*/g);
  return words ? words.length : 0;
}

function readingMinutes(text, wordsPerMinute = 200) {
  const count = wordCount(text);
  return count === 0 ? 0 : Math.ceil(count / wordsPerMinute);
}
'''
tests = '''
test('đếm từ và bỏ dấu câu', () => {
  expect(wordCount('Fix the end-to-end test.')).toBe(4);
});
test('contraction và từ ghép tính là một từ', () => {
  expect(wordCount("Don't break the build")).toBe(4);
});
test('không có từ', () => {
  expect(wordCount('... -- !!!')).toBe(0);
  expect(readingMinutes('   ')).toBe(0);
});
test('làm tròn phút và dùng tốc độ mặc định', () => {
  expect(readingMinutes('one two three', 2)).toBe(2);
  expect(readingMinutes(Array(201).fill('word').join(' '))).toBe(2);
});
test('một phút tối thiểu nếu có từ', () => {
  expect(readingMinutes('hello')).toBe(1);
});
'''
hints = ["Dùng match với regex lấy token, thay vì đếm khoảng trắng.", "Số phút là Math.ceil(số từ / tốc độ); xử lý văn bản rỗng trước."]
explanation = "Ước lượng đọc hữu ích để viết README và PR vừa đủ ngắn; đây là ước lượng theo tốc độ cố định."

[[questions]]
id = "en-xc03"
module = "en-docs-writing"
type = "code"
difficulty = 2
lang = "javascript"
title = "Title case cho tiêu đề kỹ thuật"
prompt = '''
Viết titleCase(title). Chuẩn hóa nhiều khoảng trắng thành một; viết hoa chữ đầu và chữ cuối; các từ nhỏ a, an, the, and, but, or, for, nor, on, at, to, from, by, of, in, with viết thường nếu không ở đầu/cuối. Các từ khác viết hoa chữ đầu và viết thường phần còn lại. Giữ dấu câu gắn với từ; chuẩn hóa token API, HTTP, SQL, GUI, UI, URL và ID thành chữ hoa. Một từ ghép có dấu gạch nối được xử lý như một token. Chuỗi rỗng trả về chuỗi rỗng.
Ví dụ: "the api and the ui" → "The API and the UI".
'''
starter = '''
function titleCase(title) {
  return title;
}
'''
solution = '''
const SMALL_WORDS = new Set(['a', 'an', 'the', 'and', 'but', 'or', 'for', 'nor', 'on', 'at', 'to', 'from', 'by', 'of', 'in', 'with']);
const ACRONYMS = new Set(['api', 'http', 'sql', 'gui', 'ui', 'url', 'id']);

function titleCase(title) {
  const words = title.trim().split(/\s+/).filter(Boolean);
  return words.map((word, index) => {
    const match = word.match(/[A-Za-z0-9]+(?:[.'’_-][A-Za-z0-9]+)*/);
    if (!match) return word;
    const start = match.index;
    const core = match[0];
    const before = word.slice(0, start);
    const after = word.slice(start + core.length);
    const lower = core.toLowerCase();
    if (index > 0 && index < words.length - 1 && SMALL_WORDS.has(lower)) return before + lower + after;
    if (ACRONYMS.has(lower)) return before + core.toUpperCase() + after;
    return before + core[0].toUpperCase() + core.slice(1).toLowerCase() + after;
  }).join(' ');
}
'''
tests = '''
test('viết hoa từ đầu, cuối và từ chính', () => {
  expect(titleCase('the rise and fall of api')).toBe('The Rise and Fall of API');
});
test('giữ từ nhỏ ở giữa câu', () => {
  expect(titleCase('a guide to the service')).toBe('A Guide to the Service');
});
test('giữ dấu câu và acronym kỹ thuật', () => {
  expect(titleCase('the http api, for ui teams')).toBe('The HTTP API, for UI Teams');
});
test('chuẩn hóa whitespace và chữ hoa lẫn lộn', () => {
  expect(titleCase('  a GUIDE   to sql  ')).toBe('A Guide to SQL');
});
test('chuỗi rỗng', () => {
  expect(titleCase('   ')).toBe('');
});
'''
hints = ["Tách token theo whitespace, nhưng giữ riêng phần dấu câu trước và sau từ.", "Kiểm tra từ nhỏ trước khi viết hoa; từ đầu và cuối luôn được viết hoa."]
explanation = "Title case của nhiều style guide khác nhau; bài này định nghĩa một quy tắc nhỏ, ổn định cho tiêu đề."

[[questions]]
id = "en-xc04"
module = "en-grammar"
type = "code"
difficulty = 2
lang = "javascript"
title = "Chọn a hay an theo âm đầu"
prompt = '''
Viết articleBefore(phrase) trả về "a" hoặc "an" theo cách phát âm của từ đầu tiên. Nếu phrase rỗng hoặc chỉ có dấu câu thì trả về chuỗi rỗng. Dùng ngoại lệ đã biết: an hour, honest, honor, heir, API, HTTP, SQL (đọc từng chữ), FBI, MRI, XML; a user, URL, USB, university, unique, unit, European, one, once. Với từ khác, dùng chữ cái đầu: a trước phụ âm, an trước a/e/i/o/u. Không cần xử lý acronym ngoài danh sách.
Ví dụ: "hour" → "an", "user account" → "a", "SQL query" → "an".
'''
starter = '''
function articleBefore(phrase) {
  return /^[aeiou]/i.test(phrase.trim()) ? 'an' : 'a';
}
'''
solution = '''
const AN_WORDS = new Set(['hour', 'honest', 'honor', 'heir', 'api', 'http', 'sql', 'fbi', 'mri', 'xml']);
const A_WORDS = new Set(['user', 'url', 'usb', 'university', 'unique', 'unit', 'european', 'one', 'once']);

function articleBefore(phrase) {
  const first = phrase.trim().split(/\s+/)[0].replace(/^[^A-Za-z]+/, '').toLowerCase();
  if (!first) return '';
  if (AN_WORDS.has(first)) return 'an';
  if (A_WORDS.has(first)) return 'a';
  return /^[aeiou]/.test(first) ? 'an' : 'a';
}
'''
tests = '''
test('ngoại lệ bắt đầu bằng âm nguyên âm', () => {
  expect(articleBefore('hour')).toBe('an');
  expect(articleBefore('an honest error')).toBe('an');
});
test('ngoại lệ bắt đầu bằng âm phụ âm', () => {
  expect(articleBefore('user account')).toBe('a');
  expect(articleBefore('university server')).toBe('a');
  expect(articleBefore('URL')).toBe('a');
});
test('acronym đọc theo tên chữ cái', () => {
  expect(articleBefore('SQL query')).toBe('an');
  expect(articleBefore('API client')).toBe('an');
  expect(articleBefore('USB drive')).toBe('a');
});
test('fallback theo nguyên âm và phụ âm', () => {
  expect(articleBefore('umbrella')).toBe('an');
  expect(articleBefore('database')).toBe('a');
});
test('input rỗng', () => {
  expect(articleBefore('')).toBe('');
  expect(articleBefore('...')).toBe('');
});
'''
hints = ["Chuẩn hóa từ đầu tiên về chữ thường rồi kiểm tra tập ngoại lệ.", "Fallback theo chữ cái chỉ là quy ước cho từ chưa có trong danh sách."]
explanation = "A/an phụ thuộc âm đầu; các acronym được chọn theo cách đọc đã ghi rõ trong đề."

[[questions]]
id = "en-xc05"
module = "en-writing"
type = "code"
difficulty = 2
lang = "javascript"
title = "Chuẩn hóa Conventional Commit"
prompt = '''
Viết normalizeCommit(type, subject, scope = ''). Trả về header Conventional Commits dạng type(scope): subject; bỏ phần scope nếu rỗng. Chuẩn hóa type và scope thành chữ thường; gom whitespace trong subject thành một dấu cách, bỏ khoảng trắng và dấu chấm cuối, rồi chuyển subject thành chữ thường. Chỉ chấp nhận type feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert. Scope nếu có chỉ gồm chữ cái, chữ số và dấu gạch ngang. Trả null nếu type không hợp lệ, subject rỗng hoặc scope sai.
Ví dụ: normalizeCommit("FIX", " Add Password Reset. ", "Auth") → "fix(auth): add password reset".
'''
starter = '''
function normalizeCommit(type, subject, scope = '') {
  return type + ': ' + subject;
}
'''
solution = '''
const COMMIT_TYPES = new Set(['feat', 'fix', 'docs', 'style', 'refactor', 'perf', 'test', 'build', 'ci', 'chore', 'revert']);

function normalizeCommit(type, subject, scope = '') {
  const normalizedType = type.trim().toLowerCase();
  const normalizedScope = scope.trim().toLowerCase();
  const normalizedSubject = subject.trim().replace(/\s+/g, ' ').replace(/\.+$/, '').toLowerCase();
  if (!COMMIT_TYPES.has(normalizedType) || !normalizedSubject) return null;
  if (normalizedScope && !/^[a-z0-9-]+$/.test(normalizedScope)) return null;
  return normalizedType + (normalizedScope ? '(' + normalizedScope + ')' : '') + ': ' + normalizedSubject;
}
'''
tests = '''
test('chuẩn hóa type, scope và subject', () => {
  expect(normalizeCommit('FIX', ' Add Password Reset. ', 'Auth')).toBe('fix(auth): add password reset');
});
test('không có scope', () => {
  expect(normalizeCommit('Docs', '  Explain   local setup  ')).toBe('docs: explain local setup');
});
test('reject type hoặc subject không hợp lệ', () => {
  expect(normalizeCommit('feature', 'add export')).toBeNull();
  expect(normalizeCommit('fix', '   ')).toBeNull();
});
test('scope chỉ nhận chữ, số và dấu gạch ngang', () => {
  expect(normalizeCommit('fix', 'handle timeout', 'API-v2')).toBe('fix(api-v2): handle timeout');
  expect(normalizeCommit('fix', 'handle timeout', 'api v2')).toBeNull();
});
'''
hints = ["Dùng Set cho danh sách type hợp lệ.", "Chuẩn hóa và kiểm tra đầu vào trước khi ghép header."]
explanation = "Chuẩn hóa header giúp commit history nhất quán và dễ lọc theo type/scope."

[[questions]]
id = "en-xc06"
module = "en-email-chat"
type = "code"
difficulty = 2
lang = "javascript"
title = "Làm mềm câu chat thiếu lịch sự"
prompt = '''
Viết softenPhrase(text). Với các câu sau, trả về cách nói lịch sự tương ứng, không phân biệt hoa thường, khoảng trắng thừa hoặc dấu .?! cuối:
- "review my pr now" → "Could you review my PR when you have a moment?"
- "you are wrong" → "I see it differently; could we check the requirement?"
- "this makes no sense" → "Could you clarify the reasoning behind this?"
- "fix this asap" → "Could you take a look at this when you can? It is time-sensitive."
- "do this today" → "Would it be possible to finish this today?"
Câu không nằm trong danh sách phải được trả về nguyên văn, gồm cả whitespace.
'''
starter = '''
function softenPhrase(text) {
  return text;
}
'''
solution = '''
const POLITE_PHRASES = {
  'review my pr now': 'Could you review my PR when you have a moment?',
  'you are wrong': 'I see it differently; could we check the requirement?',
  'this makes no sense': 'Could you clarify the reasoning behind this?',
  'fix this asap': 'Could you take a look at this when you can? It is time-sensitive.',
  'do this today': 'Would it be possible to finish this today?',
};

function softenPhrase(text) {
  const key = text.trim().replace(/[.!?]+$/, '').toLowerCase().replace(/\s+/g, ' ');
  return Object.prototype.hasOwnProperty.call(POLITE_PHRASES, key) ? POLITE_PHRASES[key] : text;
}
'''
tests = '''
test('thay câu mệnh lệnh bằng lời nhờ lịch sự', () => {
  expect(softenPhrase('review my pr now')).toBe('Could you review my PR when you have a moment?');
  expect(softenPhrase('do this today')).toBe('Would it be possible to finish this today?');
});
test('nhận diện không phân biệt hoa thường và dấu câu cuối', () => {
  expect(softenPhrase('  FIX THIS ASAP!  ')).toBe('Could you take a look at this when you can? It is time-sensitive.');
});
test('các câu khác nhau có cách diễn đạt phù hợp', () => {
  expect(softenPhrase('you are wrong.')).toBe('I see it differently; could we check the requirement?');
  expect(softenPhrase('this makes no sense?')).toBe('Could you clarify the reasoning behind this?');
});
test('giữ nguyên câu không nằm trong danh sách', () => {
  expect(softenPhrase('  Thanks for checking.  ')).toBe('  Thanks for checking.  ');
});
'''
hints = ["Chuẩn hóa bản dùng để tra cứu nhưng giữ nguyên text gốc nếu không tìm thấy.", "So khớp cả cụm để không thay một từ nằm bên trong câu khác."]
explanation = "Một danh sách câu mẫu nhỏ phù hợp cho bài tập; trong sản phẩm thật, cách nói cần xét thêm ngữ cảnh."

[[questions]]
id = "en-xc07"
module = "en-code-review"
type = "code"
difficulty = 2
lang = "javascript"
title = "Định dạng bug report"
prompt = '''
Viết formatBugReport(report), nhận object có title, environment, steps (mảng chuỗi), expected và actual. Trim các trường text, đánh số bước bắt đầu từ 1, rồi trả về đúng cấu trúc sau, mỗi mục một dòng:
Title: <title>
Environment: <environment>
Steps to reproduce:
1. <step>
Expected behavior: <expected>
Actual behavior: <actual>
Có thể có nhiều bước; đề bài giả sử các trường đều là chuỗi không rỗng và steps có ít nhất một phần tử.
'''
starter = '''
function formatBugReport(report) {
  return report.title;
}
'''
solution = '''
function formatBugReport(report) {
  const lines = [
    'Title: ' + report.title.trim(),
    'Environment: ' + report.environment.trim(),
    'Steps to reproduce:',
  ];
  for (let i = 0; i < report.steps.length; i++) {
    lines.push((i + 1) + '. ' + report.steps[i].trim());
  }
  lines.push('Expected behavior: ' + report.expected.trim());
  lines.push('Actual behavior: ' + report.actual.trim());
  return lines.join('\n');
}
'''
tests = '''
test('tạo bug report với một bước', () => {
  expect(formatBugReport({ title: 'Crash', environment: 'macOS', steps: ['Open app'], expected: 'Home appears', actual: 'App closes' })).toBe('Title: Crash\nEnvironment: macOS\nSteps to reproduce:\n1. Open app\nExpected behavior: Home appears\nActual behavior: App closes');
});
test('đánh số nhiều bước', () => {
  const report = formatBugReport({ title: 'Export fails', environment: 'Chrome 130', steps: ['Sign in', 'Open exports', 'Click Run'], expected: 'A file downloads', actual: 'A 500 error appears' });
  expect(report).toContain('2. Open exports');
  expect(report).toContain('3. Click Run');
});
test('trim các trường và bước', () => {
  const report = formatBugReport({ title: '  Timeout  ', environment: ' staging ', steps: [' retry request '], expected: ' success ', actual: ' error ' });
  expect(report).toContain('Title: Timeout');
  expect(report).toContain('1. retry request');
  expect(report).toContain('Expected behavior: success');
});
test('có đủ expected và actual behavior', () => {
  const report = formatBugReport({ title: 'Wrong total', environment: 'Linux', steps: ['Add item'], expected: 'Total is 10', actual: 'Total is 0' });
  expect(report).toContain('Expected behavior: Total is 10');
  expect(report).toContain('Actual behavior: Total is 0');
});
'''
