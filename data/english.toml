'''
keywords = [
  ["situation", "at my previous", "we had"],
  ["task", "i was responsible", "i needed to"],
  ["action", "i investigated", "i reproduced", "i added"],
  ["result", "reduced", "improved", "fixed"],
  ["learned", "since then", "lesson"],
]
min_keywords = 4
model_answer = '''
Situation: At my previous company, checkout showed the wrong total for some concurrent cart updates. Task: I was responsible for finding the cause before the next release. Action: I reproduced the race condition, added a cart version check, and wrote concurrency tests. Result: Incorrect totals fell to zero, and support tickets dropped by 25%. I learned to include concurrency cases in critical-flow testing.
'''
explanation = "STAR giữ câu trả lời cụ thể và giúp interviewer thấy rõ đóng góp cá nhân cùng kết quả."

