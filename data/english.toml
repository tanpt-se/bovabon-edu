lang = "javascript"
title = "Định dạng câu trả lời STAR"
prompt = '''
Viết formatSTAR(answer) với object có bốn chuỗi situation, task, action, result. Trim mỗi giá trị và trả về bốn dòng theo đúng thứ tự, gắn nhãn "Situation: ", "Task: ", "Action: ", "Result: ". Ví dụ object có situation="Cart totals were wrong" phải bắt đầu bằng "Situation: Cart totals were wrong".
'''
starter = '''
function formatSTAR(answer) {
  return answer.situation + ' ' + answer.task + ' ' + answer.action + ' ' + answer.result;
}
'''
solution = '''
function formatSTAR(answer) {
  return [
    'Situation: ' + answer.situation.trim(),
    'Task: ' + answer.task.trim(),
    'Action: ' + answer.action.trim(),
    'Result: ' + answer.result.trim(),
  ].join('\n');
}
'''
tests = '''
test('giữ thứ tự và nhãn STAR', () => {
  expect(formatSTAR({ situation: 'Cart totals were wrong', task: 'Find the cause', action: 'Added a version check', result: 'Errors fell to zero' })).toBe('Situation: Cart totals were wrong\nTask: Find the cause\nAction: Added a version check\nResult: Errors fell to zero');
});
test('trim nội dung từng phần', () => {
  expect(formatSTAR({ situation: ' issue ', task: ' task ', action: ' fix ', result: ' done ' })).toBe('Situation: issue\nTask: task\nAction: fix\nResult: done');
});
test('có đủ bốn phần', () => {
  const answer = formatSTAR({ situation: 'S', task: 'T', action: 'A', result: 'R' });
  expect(answer).toContain('Situation: S');
  expect(answer).toContain('Task: T');
  expect(answer).toContain('Action: A');
  expect(answer).toContain('Result: R');
});
test('mỗi thành phần nằm trên một dòng', () => {
  expect(formatSTAR({ situation: 'one', task: 'two', action: 'three', result: 'four' }).split('\n')).toHaveLength(4);
});
'''
