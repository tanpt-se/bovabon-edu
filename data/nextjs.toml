[[questions]]
id = "nextjs-lvc01"
module = "nextjs-lead"
type = "code"
lang = "javascript"
difficulty = 3
tags = ["level:lead", "rollout"]
title = "Chia bucket canary ổn định"
prompt = '''
Team muốn rollout trang mới theo phần trăm người dùng, mỗi người luôn ở cùng một nhóm qua mọi request. Viết hai hàm:

- `bucketOf(userId)`: băm chuỗi userId thành số nguyên 0–99. Thuật toán: `h = 7`; với từng ký tự, `h = (h * 31 + charCode) % 1000003`; trả về `h % 100`.
- `isInCanary(userId, percent)`: `percent <= 0` → false; `percent >= 100` → true; còn lại trả `bucketOf(userId) < percent`.

Ví dụ: `bucketOf('a')` = (7·31 + 97) % 1000003 = 314 → 14. Tính chất mong muốn: người đã ở canary 10% thì vẫn ở canary khi tăng lên 25%.
'''
starter = '''
function bucketOf(userId) {
  return 0;
}
function isInCanary(userId, percent) {
  return Math.random() * 100 < percent;
}
'''
solution = '''
function bucketOf(userId) {
  let h = 7;
  for (let i = 0; i < userId.length; i++) {
    h = (h * 31 + userId.charCodeAt(i)) % 1000003;
  }
  return h % 100;
}
function isInCanary(userId, percent) {
  if (percent <= 0) return false;
  if (percent >= 100) return true;
  return bucketOf(userId) < percent;
}
'''
tests = '''
test('băm đúng công thức', () => {
  expect(bucketOf('a')).toBe(14);
  expect(bucketOf('')).toBe(7);
});
test('ổn định qua nhiều lần gọi', () => {
  for (let i = 0; i < 20; i++) expect(isInCanary('user-42', 30)).toBe(isInCanary('user-42', 30));
});
test('biên 0% và 100%', () => {
  expect(isInCanary('a', 0)).toBe(false);
  expect(isInCanary('a', 100)).toBe(true);
  expect(isInCanary('a', 15)).toBe(true);
  expect(isInCanary('a', 14)).toBe(false);
});
test('tăng phần trăm không loại người đã ở canary', () => {
  for (let i = 0; i < 300; i++) {
    const id = 'u' + i;
    if (isInCanary(id, 10)) expect(isInCanary(id, 25)).toBe(true);
  }
});
test('phân bố xấp xỉ phần trăm', () => {
  let n = 0;
  for (let i = 0; i < 1000; i++) if (isInCanary('user-' + i, 20)) n++;
  expect(n).toBeGreaterThan(120);
  expect(n).toBeLessThan(280);
});
'''
hints = ["Dùng charCodeAt và lấy modulo ở mỗi bước để số không quá lớn.", "Không dùng Math.random: cùng userId phải luôn ra cùng bucket."]
explanation = "Bucket ổn định theo id là nền tảng của canary và A/B test: người dùng không nhảy qua lại giữa hai phiên bản, và tăng phần trăm chỉ thêm người mới vào canary."
sources = ["nextjs/app/building-your-application/deploying/production-checklist"]

[[questions]]
id = "nextjs-lvc02"
module = "next-routing"
type = "code"
lang = "javascript"
difficulty = 1
tags = ["level:junior", "routing"]
title = "Phân loại segment thư mục"
prompt = '''
Viết `parseSegment(name)` nhận tên một thư mục trong `app/` và trả về object `{ type, name }`:

| Đầu vào | type | name |
|---|---|---|
| `(shop)` | `'group'` | `'shop'` |
| `[id]` | `'dynamic'` | `'id'` |
| `[...slug]` | `'catchAll'` | `'slug'` |
| `[[...slug]]` | `'optionalCatchAll'` | `'slug'` |
| `blog` | `'static'` | `'blog'` |

Kiểm tra dạng dài trước (`[[...` trước `[...` trước `[`).
'''
starter = '''
function parseSegment(name) {
  return { type: 'static', name: name };
}
'''
solution = '''
function parseSegment(name) {
  if (name.startsWith('(') && name.endsWith(')')) return { type: 'group', name: name.slice(1, -1) };
  if (name.startsWith('[[...') && name.endsWith(']]')) return { type: 'optionalCatchAll', name: name.slice(5, -2) };
  if (name.startsWith('[...') && name.endsWith(']')) return { type: 'catchAll', name: name.slice(4, -1) };
  if (name.startsWith('[') && name.endsWith(']')) return { type: 'dynamic', name: name.slice(1, -1) };
  return { type: 'static', name: name };
}
'''
tests = '''
test('segment tĩnh', () => {
  expect(parseSegment('blog')).toEqual({ type: 'static', name: 'blog' });
});
test('route group', () => {
  expect(parseSegment('(shop)')).toEqual({ type: 'group', name: 'shop' });
});
test('dynamic segment', () => {
  expect(parseSegment('[id]')).toEqual({ type: 'dynamic', name: 'id' });
});
test('catch-all', () => {
  expect(parseSegment('[...slug]')).toEqual({ type: 'catchAll', name: 'slug' });
});
test('optional catch-all', () => {
  expect(parseSegment('[[...parts]]')).toEqual({ type: 'optionalCatchAll', name: 'parts' });
});
'''
hints = ["Dùng startsWith/endsWith và slice để cắt ngoặc.", "Thứ tự kiểm tra quan trọng: [[... là trường hợp đặc biệt của [."]
explanation = "Bài tập giúp nhớ quy ước đặt tên thư mục của App Router: ngoặc tròn là nhóm, ngoặc vuông là tham số động."
sources = ["nextjs/app/building-your-application/routing/dynamic-routes", "nextjs/app/building-your-application/routing/route-groups"]

[[questions]]
id = "nextjs-lvc03"
module = "tanstack-query"
type = "code"
lang = "javascript"
difficulty = 2
tags = ["level:middle", "query-keys"]
title = "Lọc query key theo tiền tố"
prompt = '''
Mô phỏng cách `invalidateQueries({ queryKey })` khớp từng phần. Viết `matchesQueryKey(queryKey, filterKey)` trả về boolean:
- `filterKey` khớp nếu nó là **tiền tố** của `queryKey`: mỗi phần tử `filterKey[i]` bằng sâu (deep equal) `queryKey[i]`.
- `filterKey` rỗng khớp mọi key; `filterKey` dài hơn `queryKey` thì không khớp.
- Deep equal: số/chuỗi/boolean/null so sánh `===`; mảng so từng phần tử; object so cùng tập key và giá trị bằng sâu (không phụ thuộc thứ tự key).

Ví dụ: `['todos', { status: 'done' }]` khớp với filter `['todos']` và `['todos', { status: 'done' }]`, không khớp `['todos', { status: 'open' }]`.
'''
starter = '''
function matchesQueryKey(queryKey, filterKey) {
  return queryKey[0] === filterKey[0];
}
'''
solution = '''
function deepEqual(a, b) {
  if (a === b) return true;
  if (a === null || b === null || typeof a !== 'object' || typeof b !== 'object') return false;
  if (Array.isArray(a) !== Array.isArray(b)) return false;
  if (Array.isArray(a)) {
    if (a.length !== b.length) return false;
    return a.every((v, i) => deepEqual(v, b[i]));
  }
  const ka = Object.keys(a);
  const kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  return ka.every((k) => Object.prototype.hasOwnProperty.call(b, k) && deepEqual(a[k], b[k]));
}
function matchesQueryKey(queryKey, filterKey) {
  if (filterKey.length > queryKey.length) return false;
  return filterKey.every((part, i) => deepEqual(part, queryKey[i]));
}
'''
tests = '''
test('tiền tố đơn giản', () => {
  expect(matchesQueryKey(['todos', 1], ['todos'])).toBe(true);
  expect(matchesQueryKey(['users', 1], ['todos'])).toBe(false);
});
test('filter rỗng và filter dài hơn', () => {
  expect(matchesQueryKey(['todos'], [])).toBe(true);
  expect(matchesQueryKey(['todos'], ['todos', 1])).toBe(false);
});
test('object so sánh sâu, không phụ thuộc thứ tự key', () => {
  const key = ['todos', { status: 'done', page: 2 }];
  expect(matchesQueryKey(key, ['todos', { page: 2, status: 'done' }])).toBe(true);
  expect(matchesQueryKey(key, ['todos', { status: 'open', page: 2 }])).toBe(false);
});
test('object thiếu key không bằng', () => {
  expect(matchesQueryKey(['todos', { status: 'done', page: 2 }], ['todos', { status: 'done' }])).toBe(false);
});
test('mảng lồng và null', () => {
  expect(matchesQueryKey(['a', [1, 2], null], ['a', [1, 2], null])).toBe(true);
  expect(matchesQueryKey(['a', [1, 2]], ['a', [2, 1]])).toBe(false);
});
'''
hints = ["Tách hàm deepEqual riêng rồi áp dụng cho từng phần tử của filterKey.", "Xử lý null riêng vì typeof null là 'object'."]
explanation = "Query key có cấu trúc phân cấp nên invalidate theo tiền tố cho phép làm mới cả một nhóm (mọi danh sách todos) mà không cần biết từng key cụ thể."
sources = ["tanstack_query/framework/react/guides/query-keys"]

[[questions]]
id = "nextjs-lvc04"
module = "next-render-cache"
type = "code"
lang = "javascript"
difficulty = 3
tags = ["level:senior", "dedup"]
title = "Gộp request trùng đang chạy"
prompt = '''
Trong một lần render, nhiều component có thể cùng xin một dữ liệu. Viết `createDeduper()` trả về object có:
- `run(key, fn)`: nếu đang có promise chưa xong cho `key` thì trả lại **chính promise đó** (không gọi `fn`); nếu không, gọi `fn()` (trả về promise), lưu lại và trả về.
- Khi promise xong (resolve **hoặc** reject), xoá key để lần gọi sau chạy lại `fn`.
- `size()`: số key đang chạy.

Không cache kết quả sau khi xong — đây là request deduplication, không phải cache.
'''
starter = '''
function createDeduper() {
  return {
    run(key, fn) { return fn(); },
    size() { return 0; }
  };
}
'''
solution = '''
function createDeduper() {
  const inflight = new Map();
  return {
    run(key, fn) {
      if (inflight.has(key)) return inflight.get(key);
      let p;
      try { p = Promise.resolve(fn()); } catch (e) { p = Promise.reject(e); }
      const tracked = p.finally(() => { inflight.delete(key); });
      inflight.set(key, p);
      tracked.catch(() => {});
      return p;
    },
    size() { return inflight.size; }
  };
}
'''
tests = '''
test('gọi trùng key chỉ chạy fn một lần', async () => {
  const d = createDeduper();
  const fn = jest.fn(() => Promise.resolve(42));
  const a = d.run('user:1', fn);
  const b = d.run('user:1', fn);
  expect(a).toBe(b);
  expect(fn).toHaveBeenCalledTimes(1);
  expect(await a).toBe(42);
});
test('key khác nhau chạy riêng', async () => {
  const d = createDeduper();
  const fn = jest.fn((x) => Promise.resolve(x));
  const a = d.run('a', () => fn('A'));
  const b = d.run('b', () => fn('B'));
  expect(d.size()).toBe(2);
  expect(await a).toBe('A');
  expect(await b).toBe('B');
});
test('xong thì xoá key, lần sau chạy lại', async () => {
  const d = createDeduper();
  const fn = jest.fn(() => Promise.resolve(1));
  await d.run('k', fn);
  await Promise.resolve();
  expect(d.size()).toBe(0);
  await d.run('k', fn);
  expect(fn).toHaveBeenCalledTimes(2);
});
test('reject cũng xoá key', async () => {
  const d = createDeduper();
  let err;
  try { await d.run('k', () => Promise.reject(new Error('boom'))); } catch (e) { err = e; }
  expect(err.message).toBe('boom');
  await Promise.resolve();
  expect(d.size()).toBe(0);
  const v = await d.run('k', () => Promise.resolve('ok'));
  expect(v).toBe('ok');
});
'''
hints = ["Lưu promise trong Map theo key.", "Dùng finally để xoá key cho cả hai trường hợp resolve và reject; nhớ chặn unhandled rejection của promise phụ."]
explanation = "Deduplication giảm tải backend khi nhiều component cùng cần một dữ liệu; React cache() và cơ chế memo request của Next.js giải bài toán tương tự trong phạm vi một request."
sources = ["nextjs/app/building-your-application/data-fetching/patterns", "nextjs/app/building-your-application/caching"]

