prompt = "Site thương mại điện tử có 40k trang sản phẩm, giá đổi vài lần mỗi ngày qua CMS, cần SEO tốt; build hiện mất 35 phút và team chỉ có 2 người làm hạ tầng. Chiến lược render nào hợp lý nhất cho trang sản phẩm?"
options = ["Prerender toàn bộ 40k trang ở build, mỗi lần đổi giá thì build lại", "ISR: prerender trang bán chạy, phần còn lại render khi có request đầu tiên; webhook CMS gọi revalidateTag theo SKU", "SSR động cho mọi request để giá luôn đúng tuyệt đối", "CSR: trang rỗng, client gọi API lấy toàn bộ thông tin sản phẩm"]
answer = [1]
explanation = "ISR theo tag giữ SEO và chi phí CDN thấp, build ngắn vì không phải render hết, và giá được làm mới gần như ngay sau webhook. Build lại toàn bộ quá chậm với tần suất đổi giá; SSR trả compute cho nội dung ít thay đổi và nhạy cảm khi backend chậm; CSR làm hỏng SEO của nội dung chính."
sources = ["nextjs/app/building-your-application/caching", "nextjs/app/api-reference/functions/revalidatetag", "nextjs/app/api-reference/functions/generate-static-params"]

