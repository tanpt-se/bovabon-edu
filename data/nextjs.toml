options = ["Await phần quan trọng trong loader, trả phần chậm dưới dạng promise không await và render bằng Await/Suspense (deferred data loading)", "Chuyển toàn bộ fetch vào useEffect", "Tăng timeout của router", "Bỏ loader và hardcode dữ liệu"]
