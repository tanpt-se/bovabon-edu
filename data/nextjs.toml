min_keywords = 3
model_answer = '''Trong Server Component tạo QueryClient, gọi prefetchQuery với cùng queryKey mà client sẽ dùng, rồi dehydrate cache và bọc cây con trong HydrationBoundary với state đó. Client Component gọi useQuery cùng key sẽ nhận dữ liệu đã hydrate. Nên đặt staleTime lớn hơn 0 để client không refetch ngay sau khi hydrate. Lỗi thường gặp: dùng một QueryClient toàn cục ở server, khiến dữ liệu của người dùng này rò sang người dùng khác — phải tạo QueryClient mới mỗi request ở server (và giữ một instance ổn định ở client).'''
