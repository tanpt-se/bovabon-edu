[[questions]]
id = "next-024"
module = "next-route-platform"
type = "code"
difficulty = 3
tags = ["level:senior"]
title = "Mô phỏng middleware matcher"
prompt = '''
Viết matchesMiddleware(pathname, matcher) cho một tập con có chủ đích của matcher:
- matcher là một string hoặc mảng string; nếu là mảng, chỉ cần một mẫu khớp.
- Mẫu /dashboard khớp chính xác path đó.
- Segment :id khớp đúng một segment không rỗng.
- Segment cuối :path* khớp không hoặc nhiều segment.
- Bỏ dấu / cuối khi so sánh; không xử lý query string, regex hay locale prefix.

Ví dụ matchesMiddleware('/dashboard/users/2', '/dashboard/:path*') trả true.
'''
starter = '''
function matchesMiddleware(pathname, matcher) {
  return false;
}
'''
solution = '''
function parts(path) {
  if (path === '/') return [];
  return path.split('/').filter(Boolean);
}
function matchesOne(pathname, pattern) {
  const path = parts(pathname);
  const route = parts(pattern);
  let i = 0;
  let j = 0;
  while (j < route.length) {
    if (route[j] === ':path*') return j === route.length - 1;
    if (i >= path.length) return false;
    if (!(/^:[A-Za-z0-9_]+$/).test(route[j]) && route[j] !== path[i]) return false;
    i++;
    j++;
  }
  return i === path.length;
}
function matchesMiddleware(pathname, matcher) {
  const patterns = Array.isArray(matcher) ? matcher : [matcher];
  return patterns.some((pattern) => matchesOne(pathname, pattern));
}
'''
tests = '''
test('khớp path chính xác', () => {
  expect(matchesMiddleware('/dashboard', '/dashboard')).toBe(true);
  expect(matchesMiddleware('/dashboard/users', '/dashboard')).toBe(false);
});
test('dynamic segment khớp một phần', () => {
  expect(matchesMiddleware('/users/42', '/users/:id')).toBe(true);
  expect(matchesMiddleware('/users/42/edit', '/users/:id')).toBe(false);
});
test('wildcard cuối khớp rỗng hoặc nhiều phần con', () => {
  expect(matchesMiddleware('/dashboard', '/dashboard/:path*')).toBe(true);
  expect(matchesMiddleware('/dashboard/a/b', '/dashboard/:path*')).toBe(true);
});
test('mảng matcher là lựa chọn OR', () => {
  expect(matchesMiddleware('/settings/profile', ['/admin/:path*', '/settings/:path*'])).toBe(true);
});
test('bỏ slash cuối và không khớp segment tĩnh sai', () => {
  expect(matchesMiddleware('/settings/', '/settings')).toBe(true);
  expect(matchesMiddleware('/setting', '/settings')).toBe(false);
});
'''
hints = ["Chuẩn hoá path thành mảng segment trước khi so sánh.", "Xử lý :path* riêng vì nó chỉ hợp lệ ở cuối và có thể khớp 0 segment."]
explanation = "Đây là mô phỏng matcher cơ bản; matcher thực tế của Next.js còn hỗ trợ biểu thức và các tuỳ chọn cấu hình khác."
sources = ["nextjs/app/api-reference/file-conventions/middleware"]

[[modules]]
id = "nextjs-lead"
title = "Góc nhìn Tech Lead"
description = "Chọn rendering strategy theo trang, chi phí hạ tầng, multi-tenant, bảo mật dữ liệu, observability, rollout an toàn và quy chuẩn cho team Next.js."
sources = ["nextjs/app/building-your-application/caching", "nextjs/app/building-your-application/deploying", "nextjs/app/building-your-application/deploying/production-checklist", "nextjs/app/building-your-application/optimizing/instrumentation", "nextjs/app/building-your-application/rendering/edge-and-nodejs-runtimes", "nextjs/app/building-your-application/upgrading/app-router-migration", "nextjs/pages/building-your-application/deploying/multi-zones"]
lesson = '''
### Quyết định ở cấp hệ thống, không ở cấp component
Ở vai trò Tech Lead, câu hỏi không còn là "API này dùng thế nào" mà là "trang này nên render ở đâu, cache bao lâu, ai trả tiền cho mỗi request, và khi sai thì rollback ra sao". Mỗi quyết định cần ghi lại ràng buộc (traffic, độ tươi dữ liệu, SEO, đội ngũ, ngân sách) để người sau hiểu vì sao.

### Khung chọn rendering strategy theo trang
| Tiêu chí | SSG / prerender | ISR (revalidate theo thời gian/tag) | SSR động | CSR (client fetch) |
|---|---|---|---|---|
| Độ tươi dữ liệu | Theo lần build | Vài giây tới vài giờ | Mỗi request | Mỗi lần client gọi |
| Cá nhân hoá | Không | Không (trừ phần client) | Có | Có |
| SEO | Tốt nhất | Tốt | Tốt | Kém nếu nội dung chính tải sau |
| Chi phí server | Gần như 0 (CDN) | Thấp | Cao, tỉ lệ với traffic | Thấp ở server, dồn sang API |
| Rủi ro khi backend chết | Thấp | Thấp (phục vụ bản cũ) | Cao | Trung bình |

Quy tắc thực dụng: mặc định tĩnh/ISR, chỉ "đi động" ở phần thực sự phụ thuộc người dùng, và tách phần cá nhân hoá thành Suspense boundary hoặc client island thay vì làm cả trang động. Một `cookies()` đặt ở layout gốc có thể biến toàn bộ site thành động — đó là lỗi tốn tiền nhất hay gặp.

### Chi phí và quy mô (số liệu ước lượng)
- Trang SSR có p95 300 ms với 200 req/s cần nhiều instance hơn hẳn so với cùng trang phục vụ từ CDN; cache hit 95% thường giảm compute hơn 10 lần (ước lượng, tuỳ hạ tầng).
- Tối ưu ảnh tính theo số biến thể; giới hạn `sizes`, định dạng và domain được phép để tránh hoá đơn bất ngờ.
- Edge runtime giảm độ trễ cho logic nhẹ, nhưng không phải mọi thư viện Node chạy được; DB ở một region khiến edge gọi xa còn chậm hơn.

### Multi-tenant
Phân giải tenant ở middleware/proxy (theo host hoặc path), truyền tenant qua header/param, và **đưa tenant vào mọi cache key và tag**. Quên tenant trong cache key = rò dữ liệu giữa khách hàng, lỗi nghiêm trọng hơn mọi lỗi hiệu năng. Phân quyền luôn kiểm tra lại ở data layer.

### Observability và rollout an toàn
- `instrumentation.ts` + OpenTelemetry để có trace theo route; theo dõi tỉ lệ cache hit, p95 TTFB, lỗi theo segment.
- Rollout bằng feature flag và canary theo phần trăm người dùng, chia bucket ổn định theo id; có tiêu chí dừng (error rate, Web Vitals) và rollback một bước.
- Skew giữa client cũ và server mới (Server Action id, chunk) là rủi ro thật khi deploy; giữ bản build cũ một thời gian hoặc dùng cơ chế deployment-id.

### Checklist review PR Next.js
1. `use client` đặt ở lá, không kéo cả cây vào bundle.
2. Không có secret hay dữ liệu nhạy cảm đi qua props sang client.
3. Mỗi Server Action/Route Handler tự xác thực và phân quyền.
4. Cache có chủ đích: ghi rõ thời hạn, tag, phạm vi (theo user/tenant hay dùng chung).
5. Có `loading`/`error` cho segment chậm hoặc dễ lỗi.
6. Ảnh có `sizes`, font qua next/font, metadata theo route.

### ADR mẫu ngắn
**Bối cảnh:** trang sản phẩm 50k SKU, giá đổi vài lần/ngày, cần SEO. **Quyết định:** ISR với tag theo SKU, webhook từ CMS gọi revalidateTag; tồn kho hiển thị bằng client island. **Hệ quả:** giá có thể trễ tối đa vài giây sau webhook; build không phải render 50k trang; cần giám sát webhook thất bại.

### Anti-pattern ở quy mô team
- "Cái gì cũng SSR cho chắc" — trả tiền compute cho nội dung không đổi.
- Mỗi người một kiểu fetch: nửa dùng TanStack Query, nửa dùng Server Component cho cùng dữ liệu, không ai biết nguồn sự thật.
- Coi middleware là lớp bảo mật duy nhất.
- Nâng major version cả monorepo trong một PR khổng lồ, không codemod, không canary.
'''

