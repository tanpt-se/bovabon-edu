description = "Xây dựng ứng dụng với App Router, Server Components, cache và streaming; quản lý dữ liệu client bằng TanStack Query và điều hướng type-safe bằng TanStack Router."

[[modules]]
id = "next-routing"
title = "App Router và quy ước route"
description = "Page, layout, route group, dynamic segment, loading và error boundary."
sources = ["nextjs/app/building-your-application/routing/defining-routes", "nextjs/app/building-your-application/routing/dynamic-routes", "nextjs/app/building-your-application/routing/route-groups", "nextjs/app/api-reference/file-conventions/layout", "nextjs/app/api-reference/file-conventions/page", "nextjs/app/api-reference/file-conventions/loading", "nextjs/app/api-reference/file-conventions/error"]
lesson = '''
### Từ cây thư mục tới URL
Trong App Router, thư mục trong app tạo segment; page làm segment thành route có thể truy cập, còn layout bao phần con và giữ trạng thái UI khi điều hướng trong nhánh đó. Root layout cung cấp html và body.

| File hoặc segment | Vai trò |
|---|---|
| page.tsx | Nội dung route |
| layout.tsx | UI dùng chung cho route con |
| loading.tsx | Fallback trong lúc segment chờ dữ liệu |
| error.tsx | Error boundary của segment; cần Client Component |
| (marketing) | Route group, không xuất hiện trong URL |
| [id] | Một dynamic segment |
| [...slug] / [[...slug]] | Catch-all bắt buộc / catch-all tuỳ chọn |

Ví dụ app/(shop)/products/[id]/page.tsx khớp /products/42; tên (shop) chỉ tổ chức layout. Catch-all nhận nhiều segment và phải nằm cuối route. loading.tsx tạo trạng thái chờ gần route; error.tsx có thể thử lại qua reset(). Lỗi thường gặp là đặt page.tsx và route.ts cùng một segment, hoặc nghĩ route group tạo thêm URL.
'''

[[modules]]
id = "next-render-cache"
title = "Server Components, Actions và dữ liệu"
description = "Chọn server/client boundary, xử lý mutation và thiết kế cache, revalidation, ISR, streaming."
sources = ["nextjs/app/building-your-application/rendering/server-components", "nextjs/app/building-your-application/rendering/client-components", "nextjs/app/building-your-application/data-fetching/server-actions-and-mutations", "nextjs/app/building-your-application/data-fetching/fetching-caching-and-revalidating", "nextjs/app/building-your-application/routing/loading-ui-and-streaming", "nextjs/app/api-reference/functions/fetch", "nextjs/app/api-reference/functions/revalidatetag"]
lesson = '''
### Chọn nơi chạy và thời điểm làm mới
Server Components là mặc định trong App Router. Chúng phù hợp để đọc dữ liệu phía server và giữ credential khỏi bundle trình duyệt. Dùng use client tại ranh giới nhỏ nhất cần state, event handler hoặc browser API; mọi module import từ ranh giới đó cũng thuộc client bundle. Props truyền qua ranh giới phải serialize được.

Không giả định fetch luôn được cache. Chọn rõ cache: force-cache cho dữ liệu có thể dùng lại hoặc next: { revalidate: 60, tags: ['posts'] } khi cần thời hạn/tag. ISR phục vụ bản đã tạo rồi tái tạo theo thời gian hay khi revalidate. revalidateTag('posts', 'max') đánh dấu dữ liệu tag là cũ để làm mới theo profile; nó khác với xoá ngay một route cụ thể.

| Nhu cầu | Cách nghĩ |
|---|---|
| Dữ liệu gần như tĩnh | Cache và revalidate theo thời hạn |
| Dữ liệu thay đổi theo người dùng | Không dùng cache dùng chung sai phạm vi |
| Một phần trang tải chậm | Suspense hoặc loading.tsx để stream fallback |

Server Action là điểm vào có thể được gọi qua request; xác thực và phân quyền vẫn phải kiểm tra trong action. Lỗi thường gặp là đưa secret vào Client Component hoặc nghĩ use server tự đảm bảo quyền truy cập.
'''

[[modules]]
id = "next-route-platform"
title = "Route Handler, Middleware và metadata"
description = "Tạo endpoint, kiểm soát matcher và tối ưu metadata, ảnh, font."
sources = ["nextjs/app/building-your-application/routing/route-handlers", "nextjs/app/api-reference/file-conventions/middleware", "nextjs/messages/middleware-upgrade-guide", "nextjs/app/api-reference/file-conventions/metadata", "nextjs/app/building-your-application/optimizing/images", "nextjs/app/building-your-application/optimizing/fonts", "nextjs/app/building-your-application/optimizing/metadata"]
lesson = '''
### Endpoint và lớp trình bày
route.ts định nghĩa HTTP handler bằng các hàm export như GET hoặc POST, nhận Request và trả Response/NextResponse. Route Handler là endpoint; không đặt page.tsx cùng segment với route.ts. Middleware chạy trước khi hoàn tất request và có thể giới hạn phạm vi bằng config.matcher; matcher nên khai báo tĩnh để framework phân tích lúc build. Middleware hữu ích cho redirect, rewrite hoặc kiểm tra sơ bộ, nhưng không thay thế phân quyền ở nơi đọc/ghi dữ liệu.

> **Next.js 16:** file `middleware.ts` được đổi tên thành `proxy.ts` (hàm export `proxy`, chạy trên runtime Node.js); cơ chế `config.matcher`, redirect/rewrite giữ nguyên. Codemod `npx @next/codemod@latest middleware-to-proxy` hỗ trợ chuyển đổi.

Metadata tĩnh dùng metadata; metadata phụ thuộc dữ liệu có thể tạo bằng generateMetadata. next/image hỗ trợ tối ưu ảnh, và cần khai báo sizes phù hợp khi dùng fill để trình duyệt chọn đúng biến thể. next/font giúp self-host font ở build time.

| Công cụ | Chú ý |
|---|---|
| Route Handler | Trả status/header/body đúng ngữ nghĩa |
| config.matcher | Chỉ chạy middleware cho route cần thiết |
| Metadata | Đặt title/description theo từng route |
| Image và font | Chú ý kích thước, alt, sizes và layout shift |

Ví dụ matcher cho /dashboard/:path* phủ cả /dashboard và các trang con. Lỗi thường gặp là matcher rộng làm mọi request đi qua logic nặng, hoặc chỉ bảo vệ giao diện mà bỏ quên kiểm tra quyền trong handler/action.
'''

[[modules]]
id = "tanstack-query"
title = "TanStack Query và cache client"
description = "Query key, freshness, retention, invalidation, optimistic update và phân trang."
sources = ["tanstack_query/framework/react/guides/query-keys", "tanstack_query/framework/react/guides/caching", "tanstack_query/framework/react/guides/important-defaults", "tanstack_query/framework/react/guides/query-invalidation", "tanstack_query/framework/react/guides/optimistic-updates", "tanstack_query/framework/react/guides/paginated-queries", "tanstack_query/framework/react/guides/infinite-queries", "tanstack_query/framework/react/reference/classes/queryclient"]
lesson = '''
### Cache dữ liệu theo danh tính query
queryKey là mảng mô tả dữ liệu và mọi biến đầu vào của queryFn, ví dụ ['projects', { teamId, page }]. TanStack Query hash ổn định object trong key nên thứ tự property không làm đổi danh tính; thứ tự phần tử mảng vẫn có ý nghĩa. Thiếu biến trong key có thể khiến hai request khác nhau dùng chung cache.

| Tuỳ chọn | Ý nghĩa |
|---|---|
| staleTime | Khoảng dữ liệu được xem là fresh |
| gcTime | Thời gian giữ cache không còn observer |
| invalidateQueries | Đánh dấu query khớp là stale và thường refetch query đang active |

Cùng key đang tải được dedupe thành một request. Với mutation lạc quan, snapshot cache trước khi cập nhật, khôi phục snapshot nếu lỗi, rồi invalidate khi hoàn tất. Phân trang thường đặt page vào key và dùng placeholderData: keepPreviousData; infinite query dùng initialPageParam cùng getNextPageParam. Lỗi thường gặp là nhầm staleTime với thời gian xoá cache, hoặc sửa object cache tại chỗ khiến dữ liệu cũ không thể rollback.
'''

[[modules]]
id = "tanstack-router"
title = "TanStack Router: type-safe routing"
description = "Khai báo route tree, validate search params và tải dữ liệu bằng loader."
sources = ["tanstack_router/routing/code-based-routing", "tanstack_router/guide/creating-a-router#router-type-safety", "tanstack_router/guide/type-safety#route-definitions", "tanstack_router/guide/search-params#validating-and-typing-search-params", "tanstack_router/guide/data-loading#route-loaders", "tanstack_router/guide/data-loading#using-search-params-in-loaders", "tanstack_router/guide/path-params"]
lesson = '''
### Route tree có kiểu và dữ liệu theo URL
TanStack Router suy luận path params, search params và context từ route tree đã đăng ký. Khi cấu hình đúng, Link và navigate có thể báo lỗi sớm nếu truyền sai route hoặc thiếu param. File-based routing có thể sinh route tree; code-based routing khai báo route bằng API.

validateSearch chuẩn hoá và xác thực query string thành dữ liệu có kiểu; vì URL là input không đáng tin, cần xử lý giá trị thiếu hoặc sai. loader nhận params/search/context đã parse để tải trước dữ liệu, quyết định pending/error UI và hỗ trợ preload khi điều hướng.

| Vị trí | Dùng cho |
|---|---|
| Path params | Định danh resource như /posts/$postId |
| Search params | Bộ lọc, sort, page có thể chia sẻ qua URL |
| Loader | Nạp dữ liệu trước khi route render |

Ví dụ /posts/42?page=2 tách postId khỏi page; loader có thể lấy cả hai để gọi API. Lỗi thường gặp là để query string không validate, hoặc giữ bộ lọc chỉ trong component state khiến refresh/link chia sẻ mất trạng thái. Type-safe routing giúp phát hiện lỗi phía client, không thay thế xác thực ở server.
'''

[[modules]]
id = "nextjs-dv-authz"
title = "Authentication và bảo vệ dữ liệu"
description = "Phân biệt xác thực với phân quyền, bảo vệ Server Action và kiểm soát quyền theo resource ở phía server."
sources = ["nextjs/app/building-your-application/authentication", "nextjs/app/building-your-application/data-fetching/server-actions-and-mutations", "nextjs/app/building-your-application/configuring/environment-variables", "nextjs/app/building-your-application/configuring/content-security-policy", "nextjs/app/building-your-application/routing/middleware"]
lesson = '''
### Xác thực và kiểm tra quyền tại server
Authentication trả lời “request thuộc về ai”; authorization quyết định danh tính đó được làm gì trên resource cụ thể. App Router có thể đọc session trong Server Component, Route Handler hoặc Server Action, nhưng mỗi thao tác thay đổi dữ liệu vẫn phải kiểm tra quyền tại nơi xử lý. Server Action là điểm vào được gọi qua request, nên không nên dựa vào việc nút bị ẩn trong giao diện để bảo vệ dữ liệu.

| Lớp | Trách nhiệm | Ví dụ kiểm tra |
|---|---|---|
| UI | Trải nghiệm và điều hướng | Ẩn nút sửa khi người dùng không có quyền |
| Proxy/Middleware | Lọc hoặc chuyển hướng sớm | Đưa khách chưa đăng nhập tới trang đăng nhập |
| Server Action / Route Handler | Xác thực request và kiểm tra quyền | User có được sửa project này không? |
| Data access layer | Giới hạn dữ liệu trả về hoặc cập nhật | Chỉ truy vấn resource thuộc tenant được phép |

Ví dụ, action nhận `projectId` từ client phải lấy session ở server, tải project rồi so sánh chủ sở hữu hoặc vai trò; không tin `userId` do form gửi lên. Có thể gom kiểm tra vào hàm truy cập dữ liệu để các đường gọi khác nhau cùng dùng một chính sách. Cookie session thường cần cân nhắc `HttpOnly`, `Secure` và `SameSite`; biến môi trường có tiền tố `NEXT_PUBLIC_` được đưa ra client nên không chứa secret.

Lỗi hay gặp là coi middleware hoặc route guard là ranh giới bảo mật duy nhất, tin rằng type của form đã xác thực input, hay serialize toàn bộ object user có trường nhạy cảm sang Client Component. Hãy kiểm tra danh tính, quyền trên đúng resource và dữ liệu đầu vào ngay trong đường đọc/ghi phía server.
'''

[[modules]]
id = "nextjs-dv-query-ssr"
title = "TanStack Query: SSR và hydration"
description = "Prefetch dữ liệu phía server, chuyển cache an toàn sang client và tránh refetch hoặc rò dữ liệu giữa request."
sources = ["tanstack_query/framework/react/guides/ssr", "tanstack_query/framework/react/guides/advanced-ssr", "tanstack_query/framework/react/guides/prefetching"]
lesson = '''
### Chuyển cache query từ server sang trình duyệt
Server rendering với TanStack Query thường gồm ba bước: tạo `QueryClient` phù hợp với request hiện tại, prefetch các query cần cho route, rồi serialize trạng thái bằng `dehydrate`. Phía React bọc cây component bằng `HydrationBoundary` với state đó; `useQuery` trên client dùng lại cache thay vì bắt đầu từ trạng thái rỗng. `queryKey` và cách tạo query options phải nhất quán giữa chỗ prefetch và component đọc dữ liệu.

| Bước | Việc làm | Lưu ý |
|---|---|---|
| Server | Tạo QueryClient và `prefetchQuery` | Dữ liệu người dùng phải nằm trong cache của request đó |
| Chuyển trạng thái | Gọi `dehydrate(queryClient)` | Chỉ đưa dữ liệu an toàn và có thể serialize sang client |
| Client | Hydrate trong `HydrationBoundary` rồi gọi `useQuery` | Dùng cùng query key để tìm đúng cache entry |

Không dùng một `QueryClient` toàn cục cho server process lâu dài: request của hai người dùng có thể thấy cùng cache. `staleTime` quyết định khi nào dữ liệu được coi là cũ; mặc định bằng 0 có thể khiến query stale ngay khi hydrate và refetch lúc client mount. Chọn thời hạn fresh theo nghiệp vụ thay vì tắt refetch vô thời hạn. Với nhiều query độc lập, bắt đầu prefetch song song để giảm waterfall; query phụ thuộc kết quả query trước thì cần giữ thứ tự phụ thuộc đó.

Lỗi hay gặp là khác query key giữa server và client, chỉ truyền `initialData` nhưng bỏ mất metadata thời điểm cache, hoặc serialize object chứa secret/token. Hydration giúp nối tiếp dữ liệu đã tải, không thay thế kiểm soát quyền truy cập, chính sách cache của server hay xác thực ở API.
'''

[[modules]]
id = "nextjs-dv-router-auth"
title = "TanStack Router: context và route guard"
description = "Truyền dependency có kiểu qua route tree, chặn điều hướng trong beforeLoad và tổ chức authentication cho các nhánh route."
sources = ["tanstack_router/guide/authenticated-routes", "tanstack_router/guide/router-context", "tanstack_router/guide/data-loading", "tanstack_router/guide/preloading", "tanstack_router/how-to/setup-authentication"]
lesson = '''
### Context dùng chung và route được bảo vệ
TanStack Router cho phép truyền dependency dùng chung qua router context, ví dụ `queryClient` hoặc thông tin user đã xác thực. Có thể định nghĩa kiểu context ở root route để `beforeLoad`, loader và component route nhận hợp đồng có kiểu. Route có thể tạo context bổ sung; các route con kế thừa context tích luỹ từ nhánh cha, nhờ đó một layout được bảo vệ có thể dùng chung logic cho các màn hình bên dưới.

| Cơ chế | Thời điểm | Vai trò |
|---|---|---|
| Router context | Khi khởi tạo hoặc cập nhật router | Chia sẻ dependency như user hiện tại, client cache |
| `beforeLoad` | Trước loader của route | Kiểm tra điều kiện điều hướng, thêm route context hoặc ném redirect |
| Loader | Khi route cần dữ liệu | Nạp dữ liệu theo params, search và context đã có |
| Server/API | Khi đọc hoặc ghi dữ liệu | Xác thực lại danh tính và authorization thực sự |

Ví dụ, route cha `/app` có thể kiểm tra `context.auth.user`; nếu thiếu user thì ném redirect tới `/login`. Route con trong nhánh có thể dùng context đó để tải dữ liệu hoặc hiển thị giao diện phù hợp. Nếu user đăng nhập/đăng xuất làm context thay đổi, cập nhật context của router và invalidate route state khi cần để các guard/loaders chạy lại.

Route guard phía client chỉ cải thiện luồng điều hướng. Người dùng vẫn có thể gọi trực tiếp API, nên server phải thực thi quyền trên từng resource. Lỗi hay gặp là dùng React context ở một component nhưng loader không truy cập được dependency đó, giữ auth state cũ sau khi đăng nhập, hoặc tin rằng redirect đã thay thế kiểm tra quyền ở server.
'''

