[[questions]]
id = "next-031"
module = "tanstack-query"
type = "code"
difficulty = 3
title = "Stable hash và Mini QueryClient"
prompt = '''
Viết stableQueryKeyHash(key) và MiniQueryClient.
- Hash key dạng array bằng JSON sau khi sắp xếp đệ quy property của object; giữ nguyên thứ tự array.
- new MiniQueryClient({ staleTime }) lưu cache trong bộ nhớ.
- fetchQuery(queryKey, queryFn, { staleTime }) trả data cache nếu còn fresh. staleTime option ghi đè mặc định của client; tại đúng mốc staleTime, data đã stale.
- Cùng hash đang có request chưa hoàn tất phải dùng chung Promise và chỉ gọi queryFn một lần.
- getQueryData(key) đọc data; setQueryData(key, value) ghi data.
- invalidateQueries(prefix) đánh dấu stale mọi query key bắt đầu bằng prefix; lần fetch sau phải gọi queryFn mới. Prefix so sánh từng phần theo stable hash.

Đồng hồ kiểm tra dùng Date.now(); có thể dùng fake timers.
'''
starter = '''
function stableQueryKeyHash(key) {
  return JSON.stringify(key);
}
class MiniQueryClient {
  constructor() {
    this.cache = new Map();
  }
  async fetchQuery(queryKey, queryFn) {
    return null;
  }
  getQueryData(queryKey) {
    return undefined;
  }
  setQueryData(queryKey, value) {}
  invalidateQueries(prefix) {}
}
'''
solution = '''
function stableQueryKeyHash(key) {
  function normalize(value) {
    if (Array.isArray(value)) return value.map(normalize);
    if (value && typeof value === 'object') {
      const result = {};
      for (const name of Object.keys(value).sort()) result[name] = normalize(value[name]);
      return result;
    }
    return value;
  }
  return JSON.stringify(normalize(key));
}
function keyStartsWith(key, prefix) {
  if (!Array.isArray(key) || !Array.isArray(prefix) || prefix.length > key.length) return false;
  for (let i = 0; i < prefix.length; i++) {
    if (stableQueryKeyHash([key[i]]) !== stableQueryKeyHash([prefix[i]])) return false;
  }
  return true;
}
class MiniQueryClient {
  constructor({ staleTime = 0 } = {}) {
    this.defaultStaleTime = staleTime;
    this.cache = new Map();
    this.inflight = new Map();
  }
  fetchQuery(queryKey, queryFn, options = {}) {
    const hash = stableQueryKeyHash(queryKey);
    const entry = this.cache.get(hash);
    const staleTime = options.staleTime === undefined ? this.defaultStaleTime : options.staleTime;
    if (entry && !entry.invalidated && Date.now() - entry.updatedAt < staleTime) return Promise.resolve(entry.data);
    if (this.inflight.has(hash)) return this.inflight.get(hash);
    const request = Promise.resolve().then(queryFn).then((data) => {
      this.cache.set(hash, { queryKey, data, updatedAt: Date.now(), invalidated: false });
      return data;
    }).finally(() => {
      this.inflight.delete(hash);
    });
    this.inflight.set(hash, request);
    return request;
  }
  getQueryData(queryKey) {
    const entry = this.cache.get(stableQueryKeyHash(queryKey));
    return entry ? entry.data : undefined;
  }
  setQueryData(queryKey, value) {
    const hash = stableQueryKeyHash(queryKey);
    this.cache.set(hash, { queryKey, data: value, updatedAt: Date.now(), invalidated: false });
  }
  invalidateQueries(prefix) {
    for (const entry of this.cache.values()) {
      if (keyStartsWith(entry.queryKey, prefix)) entry.invalidated = true;
    }
  }
}
'''
tests = '''
test('object order ổn định nhưng array order có ý nghĩa', () => {
  expect(stableQueryKeyHash(['posts', { page: 2, tag: 'a' }])).toBe(stableQueryKeyHash(['posts', { tag: 'a', page: 2 }]));
  expect(stableQueryKeyHash(['posts', 1, 2])).not.toBe(stableQueryKeyHash(['posts', 2, 1]));
});
test('dùng fresh cache trong staleTime', async () => {
  const client = new MiniQueryClient({ staleTime: 100 });
  const queryFn = jest.fn(() => 7);
  expect(await client.fetchQuery(['count'], queryFn)).toBe(7);
  expect(await client.fetchQuery(['count'], queryFn)).toBe(7);
  expect(queryFn).toHaveBeenCalledTimes(1);
});
test('tại mốc staleTime chính xác thì query được tải lại', async () => {
  jest.useFakeTimers();
  const client = new MiniQueryClient({ staleTime: 100 });
  const queryFn = jest.fn(() => 1);
  await client.fetchQuery(['time'], queryFn);
  jest.advanceTimersByTime(100);
  await client.fetchQuery(['time'], queryFn);
  expect(queryFn).toHaveBeenCalledTimes(2);
  jest.useRealTimers();
});
test('dedupe request đang bay có cùng key', async () => {
  const client = new MiniQueryClient();
  let finish;
  const queryFn = jest.fn(() => new Promise((resolve) => { finish = resolve; }));
  const first = client.fetchQuery(['slow'], queryFn);
  const second = client.fetchQuery(['slow'], queryFn);
  await Promise.resolve();
  expect(queryFn).toHaveBeenCalledTimes(1);
  finish('ready');
  expect(await first).toBe('ready');
  expect(await second).toBe('ready');
});
test('invalidate theo prefix buộc query tải lại', async () => {
  const client = new MiniQueryClient({ staleTime: 1000 });
  let value = 1;
  const queryFn = () => value;
  await client.fetchQuery(['posts', { page: 1 }], queryFn);
  client.invalidateQueries(['posts']);
  value = 2;
  expect(await client.fetchQuery(['posts', { page: 1 }], queryFn)).toBe(2);
  expect(client.getQueryData(['posts', { page: 1 }])).toBe(2);
});
test('set và get dùng stable key hash', () => {
  const client = new MiniQueryClient();
  client.setQueryData(['user', { id: 4, view: 'full' }], { name: 'An' });
  expect(client.getQueryData(['user', { view: 'full', id: 4 }])).toEqual({ name: 'An' });
});
'''
hints = ["Chuẩn hoá key đệ quy: object sort key, array giữ nguyên thứ tự.", "Lưu queryKey gốc cùng cache entry để invalidation prefix; đăng ký inflight trước khi queryFn chạy."]
explanation = "Bài mô phỏng các ý cốt lõi của query cache: danh tính ổn định, freshness, dedupe và invalidation."
sources = ["tanstack_query/framework/react/guides/query-keys", "tanstack_query/framework/react/guides/caching", "tanstack_query/framework/react/guides/query-invalidation"]

[[questions]]
id = "next-032"
module = "tanstack-query"
type = "code"
difficulty = 3
title = "Optimistic update có rollback"
prompt = '''
Viết optimisticMutation(cache, key, update, mutation) với cache là Map.
- Chụp lại giá trị cũ và cập nhật cache ngay bằng update(previousValue).
- Nếu mutation resolve, trả kết quả mutation và giữ giá trị optimistic.
- Nếu mutation reject, phục hồi giá trị cũ rồi ném lại đúng lỗi.
- Nếu trước đó key chưa có trong Map và mutation lỗi, xoá key thay vì lưu undefined.

Đây là mô hình thuần JS cho snapshot trong onMutate, rollback trong onError; ứng dụng thật thường invalidate query sau khi settled.
'''
starter = '''
async function optimisticMutation(cache, key, update, mutation) {
  cache.set(key, update(cache.get(key)));
  return mutation();
}
'''
solution = '''
async function optimisticMutation(cache, key, update, mutation) {
  const hadValue = cache.has(key);
  const previous = cache.get(key);
  cache.set(key, update(previous));
  try {
    return await mutation();
  } catch (error) {
    if (hadValue) cache.set(key, previous);
    else cache.delete(key);
    throw error;
  }
}
'''
tests = '''
test('mutation thất bại khôi phục snapshot cũ và ném lại lỗi', async () => {
  const cache = new Map([['likes', 4]]);
  const failure = new Error('offline');
  try {
    await optimisticMutation(cache, 'likes', (n) => n + 1, () => Promise.reject(failure));
  } catch (error) {
    expect(error).toBe(failure);
  }
  expect(cache.get('likes')).toBe(4);
});
test('mutation thành công giữ optimistic value và trả kết quả server', async () => {
  const cache = new Map([['likes', 4]]);
  const result = await optimisticMutation(cache, 'likes', (n) => n + 1, () => Promise.resolve({ ok: true }));
  expect(cache.get('likes')).toBe(5);
  expect(result).toEqual({ ok: true });
});
test('rollback xoá key vốn chưa tồn tại', async () => {
  const cache = new Map();
  try {
    await optimisticMutation(cache, 'new', () => 'temporary', () => Promise.reject(new Error('failed')));
  } catch (error) {
    expect(error.message).toBe('failed');
  }
  expect(cache.has('new')).toBe(false);
});
test('hỗ trợ giá trị cũ là null', async () => {
  const cache = new Map([['profile', null]]);
  try {
    await optimisticMutation(cache, 'profile', () => ({ name: 'An' }), () => Promise.reject(new Error('failed')));
  } catch (error) {
    expect(error.message).toBe('failed');
  }
  expect(cache.has('profile')).toBe(true);
  expect(cache.get('profile')).toBeNull();
});
'''
hints = ["Phân biệt key không có với key có giá trị undefined bằng Map.has.", "Rollback trong catch rồi ném lại cùng lỗi để caller vẫn xử lý được."]
explanation = "Snapshot cho phép UI phản hồi ngay nhưng vẫn khôi phục trạng thái nhất quán khi request thất bại."
sources = ["tanstack_query/framework/react/guides/optimistic-updates", "tanstack_query/framework/react/guides/query-invalidation"]

