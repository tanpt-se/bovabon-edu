[[questions]]
id = "nextjs-dvc02"
module = "nextjs-dv-router-auth"
type = "code"
difficulty = 2
title = "Quyết định truy cập route"
lang = "javascript"
prompt = '''
Viết `getRouteAccess(context, requiredRole)` trả về một trong ba chuỗi: `"login"`, `"allow"`, `"forbidden"`.
- Nếu `context.user` không phải object có `id` là chuỗi không rỗng, trả về `"login"`.
- Nếu đã đăng nhập và `requiredRole` là `null` hoặc `undefined`, trả về `"allow"`.
- Nếu có role bắt buộc, chỉ trả về `"allow"` khi `context.user.roles` là mảng chứa role đó; nếu không thì trả `"forbidden"`.

Đây là mô hình quyết định cho `beforeLoad` phía client; API server vẫn cần kiểm tra quyền riêng.
'''
starter = '''
function getRouteAccess(context, requiredRole) {
  return 'allow';
}
'''
solution = '''
function getRouteAccess(context, requiredRole) {
  const user = context && context.user;
  if (!user || typeof user.id !== 'string' || user.id.length === 0) return 'login';
  if (requiredRole === null || requiredRole === undefined) return 'allow';
  if (Array.isArray(user.roles) && user.roles.includes(requiredRole)) return 'allow';
  return 'forbidden';
}
'''
tests = '''
test('khách chưa đăng nhập cần login', () => {
  expect(getRouteAccess({}, null)).toBe('login');
});
test('user không có id hợp lệ bị xem là chưa xác thực', () => {
  expect(getRouteAccess({ user: { id: '' } }, null)).toBe('login');
});
test('user đã đăng nhập được vào route không yêu cầu role', () => {
  expect(getRouteAccess({ user: { id: 'u1' } }, null)).toBe('allow');
});
