[[questions]]
id = "next-008"
module = "next-routing"
type = "code"
difficulty = 3
title = "Khớp mẫu route App Router"
prompt = '''
Viết matchesAppRoute(pathname, filePattern) trả về boolean.
- pathname và filePattern là đường dẫn có dấu / đầu; bỏ qua dấu / cuối.
- Segment (name) trong filePattern là route group và không chiếm segment URL.
- [id] khớp đúng một segment không rỗng.
- [...slug] ở cuối khớp ít nhất một segment; [[...slug]] ở cuối khớp không hoặc nhiều segment.
- Segment còn lại phải giống hệt. Không cần xử lý query string hoặc percent-encoding.

Ví dụ /products/42 khớp /(shop)/products/[id].
'''
starter = '''
function matchesAppRoute(pathname, filePattern) {
  return pathname === filePattern;
}
'''
solution = '''
function routeParts(path) {
  if (path === '/') return [];
  return path.split('/').filter(Boolean);
}
function matchesAppRoute(pathname, filePattern) {
  const pathParts = routeParts(pathname);
  const patternParts = routeParts(filePattern).filter((part) => !(/^\(.+\)$/).test(part));
  let i = 0;
  let j = 0;
  while (j < patternParts.length) {
    const part = patternParts[j];
    if (part === '[[...slug]]') return j === patternParts.length - 1;
    if (part === '[...slug]') return j === patternParts.length - 1 && i < pathParts.length;
    if (i >= pathParts.length) return false;
    if (!(/^\[.+\]$/).test(part) && part !== pathParts[i]) return false;
    i++;
    j++;
  }
  return i === pathParts.length;
}
'''
tests = '''
test('khớp route tĩnh và bỏ route group', () => {
  expect(matchesAppRoute('/products', '/(shop)/products')).toBe(true);
});
test('dynamic segment khớp đúng một phần', () => {
  expect(matchesAppRoute('/products/42', '/products/[id]')).toBe(true);
  expect(matchesAppRoute('/products/42/reviews', '/products/[id]')).toBe(false);
});
test('catch-all bắt buộc cần ít nhất một segment', () => {
  expect(matchesAppRoute('/docs/a/b', '/docs/[...slug]')).toBe(true);
  expect(matchesAppRoute('/docs', '/docs/[...slug]')).toBe(false);
});
test('optional catch-all chấp nhận rỗng hoặc nhiều segment', () => {
  expect(matchesAppRoute('/docs', '/docs/[[...slug]]')).toBe(true);
  expect(matchesAppRoute('/docs/a/b', '/docs/[[...slug]]')).toBe(true);
});
test('bỏ dấu slash cuối nhưng vẫn phân biệt route khác', () => {
  expect(matchesAppRoute('/about/', '/about')).toBe(true);
  expect(matchesAppRoute('/about/team', '/about')).toBe(false);
});
'''
hints = ["Bỏ các segment route group trước khi so sánh.", "Catch-all chỉ hợp lệ ở cuối pattern; optional catch-all có thể không tiêu thụ segment nào."]
explanation = "Bài mô phỏng quy tắc tên file của App Router và cho thấy route group không tác động đến URL."
sources = ["nextjs/app/building-your-application/routing/dynamic-routes", "nextjs/app/building-your-application/routing/route-groups"]

