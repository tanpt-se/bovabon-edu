[[questions]]
id = "next-016"
module = "next-render-cache"
type = "code"
difficulty = 3
tags = ["level:senior"]
title = "Revalidate cache theo tag"
prompt = '''
Viết revalidateByTag(entries, tag) cho mô hình cache thuần JavaScript. entries là mảng object có path, tags (mảng chuỗi) và các field khác.
- Với mỗi entry có tag, đặt stale thành true.
- Giữ nguyên các field còn lại và thứ tự phần tử.
- Trả về mảng path đã được đánh dấu, theo thứ tự ban đầu.
- Không sửa entry không chứa tag.

Bài tập mô phỏng invalidation theo tag: dữ liệu được đánh dấu stale để lần đọc tiếp theo revalidate.
'''
starter = '''
function revalidateByTag(entries, tag) {
  return [];
}
'''
solution = '''
function revalidateByTag(entries, tag) {
  const paths = [];
  for (const entry of entries) {
    if (entry.tags.includes(tag)) {
      entry.stale = true;
      paths.push(entry.path);
    }
  }
  return paths;
}
'''
tests = '''
test('đánh dấu mọi entry có tag và trả path theo thứ tự', () => {
  const entries = [
    { path: '/posts', tags: ['posts'], value: 1 },
    { path: '/about', tags: ['pages'], value: 2 },
    { path: '/posts/1', tags: ['posts', 'detail'], value: 3 }
  ];
  expect(revalidateByTag(entries, 'posts')).toEqual(['/posts', '/posts/1']);
  expect(entries[0].stale).toBe(true);
  expect(entries[1].stale).toBeUndefined();
  expect(entries[2].value).toBe(3);
});
test('tag không có kết quả không sửa entries', () => {
  const entry = { path: '/home', tags: ['home'] };
  expect(revalidateByTag([entry], 'posts')).toEqual([]);
  expect(entry.stale).toBeUndefined();
});
test('tag rỗng vẫn so khớp chính xác', () => {
  const entries = [{ path: '/x', tags: ['', 'x'] }];
  expect(revalidateByTag(entries, '')).toEqual(['/x']);
});
test('mảng rỗng trả kết quả rỗng', () => {
  expect(revalidateByTag([], 'posts')).toEqual([]);
});
'''
hints = ["Duyệt entries một lần và kiểm tra bằng includes.", "Chỉ sửa field stale ở entry thực sự có tag."]
explanation = "Trong ứng dụng thật, tag gắn với dữ liệu fetch/cache; revalidateTag đánh dấu nội dung tag là cũ theo profile."
sources = ["nextjs/app/api-reference/functions/revalidatetag"]

