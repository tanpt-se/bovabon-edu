[[questions]]
id = "next-040"
module = "tanstack-router"
type = "code"
difficulty = 3
tags = ["level:senior"]
title = "Validate search và gọi route loader"
prompt = '''
Viết loadPostRoute(input, fetchPost) để mô phỏng hợp đồng của một route:
- input có { params, search }, trong đó params.postId là chuỗi và search là object.
- search.page mặc định là 1. Chấp nhận số nguyên dương hoặc chuỗi số nguyên dương; giá trị khác ném Error('invalid page').
- search.q mặc định là chuỗi rỗng; nếu là string thì trim khoảng trắng, còn kiểu khác ném Error('invalid query').
- Gọi fetchPost(postId, { page, q }) và trả lại kết quả của nó. Thiếu hoặc không phải string postId ném Error('invalid post id').
- Có thể await fetchPost nếu trả Promise.
'''
starter = '''
async function loadPostRoute(input, fetchPost) {
  return fetchPost(input.params.postId, input.search);
}
'''
solution = '''
async function loadPostRoute(input, fetchPost) {
  const params = input && input.params;
  const search = input && input.search ? input.search : {};
  if (!params || typeof params.postId !== 'string' || params.postId.length === 0) {
    throw new Error('invalid post id');
  }
  const rawPage = search.page === undefined ? 1 : search.page;
  const page = typeof rawPage === 'number' ? rawPage : Number(rawPage);
  if (!Number.isInteger(page) || page < 1) throw new Error('invalid page');
  const rawQuery = search.q === undefined ? '' : search.q;
  if (typeof rawQuery !== 'string') throw new Error('invalid query');
  return await fetchPost(params.postId, { page, q: rawQuery.trim() });
}
'''
tests = '''
test('loader dùng mặc định và truyền post id', async () => {
  const fetchPost = jest.fn((id, search) => ({ id, search }));
  const result = await loadPostRoute({ params: { postId: '42' }, search: {} }, fetchPost);
  expect(result).toEqual({ id: '42', search: { page: 1, q: '' } });
});
test('loader parse page và trim query', async () => {
  const result = await loadPostRoute(
    { params: { postId: '42' }, search: { page: '3', q: '  router  ' } },
    (id, search) => [id, search]
  );
  expect(result).toEqual(['42', { page: 3, q: 'router' }]);
});
test('page không hợp lệ bị từ chối', async () => {
  try {
    await loadPostRoute({ params: { postId: '42' }, search: { page: '0' } }, () => null);
  } catch (error) {
    expect(error.message).toBe('invalid page');
  }
});
test('query sai kiểu và post id thiếu có lỗi riêng', async () => {
  try {
    await loadPostRoute({ params: { postId: '42' }, search: { q: 3 } }, () => null);
  } catch (error) {
    expect(error.message).toBe('invalid query');
  }
  try {
    await loadPostRoute({ params: {}, search: {} }, () => null);
  } catch (error) {
    expect(error.message).toBe('invalid post id');
  }
});
test('chờ kết quả async từ loader function', async () => {
  const result = await loadPostRoute(
    { params: { postId: 'x' }, search: { page: 2 } },
    async (id, search) => ({ id, page: search.page })
  );
  expect(result).toEqual({ id: 'x', page: 2 });
});
'''
hints = ["Validate params và search trước khi gọi fetch.", "Chuyển page sang number rồi kiểm tra integer dương; không ép kiểu q."]
explanation = "Route loader nên nhận params/search đã chuẩn hoá để việc tải dữ liệu theo URL có hành vi xác định."
