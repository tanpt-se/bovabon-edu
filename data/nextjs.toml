[[questions]]
id = "nextjs-dvc01"
module = "nextjs-dv-authz"
type = "code"
difficulty = 2
title = "Kiểm tra quyền sửa project"
lang = "javascript"
prompt = '''
Viết `canEditProject(user, project)` trả về boolean.
- `user` phải là object có `id` là chuỗi không rỗng; nếu thiếu hoặc sai kiểu thì từ chối.
- `project` phải là object có `ownerId` là chuỗi không rỗng; nếu thiếu hoặc sai kiểu thì từ chối.
- Cho phép nếu `user.id === project.ownerId` hoặc `user.roles` là mảng có phần tử `"admin"`.
- Các trường hợp khác trả về `false`.

Đây là phần kiểm tra quyền phía server; không dùng một `userId` do client tự khai báo thay cho danh tính đã xác thực.
'''
starter = '''
function canEditProject(user, project) {
  return Boolean(user && project);
}
'''
solution = '''
function canEditProject(user, project) {
  if (!user || typeof user.id !== 'string' || user.id.length === 0) return false;
  if (!project || typeof project.ownerId !== 'string' || project.ownerId.length === 0) return false;
  if (Array.isArray(user.roles) && user.roles.includes('admin')) return true;
  return user.id === project.ownerId;
}
'''
tests = '''
test('cho phép chủ sở hữu', () => {
  expect(canEditProject({ id: 'u1', roles: [] }, { ownerId: 'u1' })).toBe(true);
});
test('cho phép admin hợp lệ', () => {
  expect(canEditProject({ id: 'admin-1', roles: ['admin'] }, { ownerId: 'u2' })).toBe(true);
});
test('từ chối user không phải chủ sở hữu', () => {
  expect(canEditProject({ id: 'u1', roles: ['member'] }, { ownerId: 'u2' })).toBe(false);
});
test('từ chối khi thiếu user hoặc project', () => {
  expect(canEditProject(null, { ownerId: 'u1' })).toBe(false);
  expect(canEditProject({ id: 'u1' }, null)).toBe(false);
});
test('từ chối ownerId rỗng', () => {
  expect(canEditProject({ id: 'u1', roles: ['admin'] }, { ownerId: '' })).toBe(false);
});
'''
hints = ["Kiểm tra dữ liệu user và project trước khi đọc roles.", "Admin chỉ được chấp nhận khi roles là mảng có chứa đúng chuỗi `admin`."]
explanation = "Phân quyền phải dựa trên danh tính đã xác thực và resource thực tế, với từ chối mặc định khi dữ liệu cần thiết không hợp lệ."
sources = ["nextjs/app/building-your-application/authentication", "nextjs/app/building-your-application/data-fetching/server-actions-and-mutations"]

