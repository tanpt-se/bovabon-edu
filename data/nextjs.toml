[[questions]]
id = "next-024"
module = "next-route-platform"
type = "code"
difficulty = 3
title = "Mô phỏng middleware matcher"
prompt = '''
Viết matchesMiddleware(pathname, matcher) cho một tập con có chủ đích của matcher:
- matcher là một string hoặc mảng string; nếu là mảng, chỉ cần một mẫu khớp.
- Mẫu /dashboard khớp chính xác path đó.
- Segment :id khớp đúng một segment không rỗng.
- Segment cuối :path* khớp không hoặc nhiều segment.
- Bỏ dấu / cuối khi so sánh; không xử lý query string, regex hay locale prefix.

Ví dụ matchesMiddleware('/dashboard/users/2', '/dashboard/:path*') trả true.
'''
starter = '''
function matchesMiddleware(pathname, matcher) {
  return false;
}
'''
solution = '''
function parts(path) {
  if (path === '/') return [];
  return path.split('/').filter(Boolean);
}
function matchesOne(pathname, pattern) {
  const path = parts(pathname);
  const route = parts(pattern);
  let i = 0;
  let j = 0;
  while (j < route.length) {
    if (route[j] === ':path*') return j === route.length - 1;
    if (i >= path.length) return false;
    if (!(/^:[A-Za-z0-9_]+$/).test(route[j]) && route[j] !== path[i]) return false;
    i++;
    j++;
  }
  return i === path.length;
}
function matchesMiddleware(pathname, matcher) {
  const patterns = Array.isArray(matcher) ? matcher : [matcher];
  return patterns.some((pattern) => matchesOne(pathname, pattern));
}
'''
tests = '''
test('khớp path chính xác', () => {
  expect(matchesMiddleware('/dashboard', '/dashboard')).toBe(true);
  expect(matchesMiddleware('/dashboard/users', '/dashboard')).toBe(false);
});
test('dynamic segment khớp một phần', () => {
  expect(matchesMiddleware('/users/42', '/users/:id')).toBe(true);
  expect(matchesMiddleware('/users/42/edit', '/users/:id')).toBe(false);
});
test('wildcard cuối khớp rỗng hoặc nhiều phần con', () => {
  expect(matchesMiddleware('/dashboard', '/dashboard/:path*')).toBe(true);
  expect(matchesMiddleware('/dashboard/a/b', '/dashboard/:path*')).toBe(true);
});
test('mảng matcher là lựa chọn OR', () => {
  expect(matchesMiddleware('/settings/profile', ['/admin/:path*', '/settings/:path*'])).toBe(true);
});
test('bỏ slash cuối và không khớp segment tĩnh sai', () => {
  expect(matchesMiddleware('/settings/', '/settings')).toBe(true);
  expect(matchesMiddleware('/setting', '/settings')).toBe(false);
});
'''
hints = ["Chuẩn hoá path thành mảng segment trước khi so sánh.", "Xử lý :path* riêng vì nó chỉ hợp lệ ở cuối và có thể khớp 0 segment."]
explanation = "Đây là mô phỏng matcher cơ bản; matcher thực tế của Next.js còn hỗ trợ biểu thức và các tuỳ chọn cấu hình khác."
sources = ["nextjs/app/api-reference/file-conventions/middleware"]
