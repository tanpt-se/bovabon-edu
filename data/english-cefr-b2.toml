id = "cefr-b2-024"
module = "cefr-b2-functions"
type = "single"
difficulty = 2
prompt = "Your town is considering a free Saturday bus service. Which comment is the clearest attempt to persuade the council?"
options = ["You must do this because I like buses.", "A free Saturday service could help people reach the market, which may also support local shops.", "Buses are things that go on roads.", "I don't know. Perhaps something could happen."]
answer = [1]
explanation = "Đề xuất được hỗ trợ bằng lý do và lợi ích có thể thấy; cách diễn đạt không áp đặt kết luận tuyệt đối."

[[questions]]
id = "cefr-b2-025"
module = "cefr-b2-functions"
type = "single"
difficulty = 2
prompt = "A colleague says, 'We should reduce the support team's hours to save money.' Which response disagrees politely while recognising the concern?"
options = ["That's a terrible idea and you don't understand the problem.", "I see your point about costs. However, shorter hours could leave customers without help in the evening.", "No. I am not agree with you.", "You are completely right, so we should not discuss it."]
answer = [1]
explanation = "Câu trả lời công nhận mối quan tâm về chi phí rồi nêu một hệ quả cụ thể, giữ giọng điệu lịch sự."

[[questions]]
id = "cefr-b2-026"
module = "cefr-b2-functions"
type = "single"
difficulty = 2
prompt = "Two departments disagree about when to run a training session. One wants mornings; the other wants afternoons. What is the most constructive proposal?"
options = ["Let's ignore the other department and choose mornings.", "Could we run the first session in the morning and the next one in the afternoon, then compare attendance?", "There is no point in discussing this.", "I will decide for everyone without asking."]
answer = [1]
explanation = "Đề xuất thử cả hai lựa chọn và so sánh kết quả là một thoả hiệp có thể kiểm tra được."

[[questions]]
id = "cefr-b2-027"
module = "cefr-b2-functions"
type = "single"
difficulty = 1
prompt = "You have finished explaining the problem and are ready to discuss possible solutions. Which transition fits a presentation?"
options = ["Let me move on to some possible solutions.", "I have arrived at the solutions before the problem.", "Give to me your attention now.", "I am agree to change the subject."]
answer = [0]
explanation = "*Let me move on to…* là cụm báo hiệu chuyển sang phần tiếp theo một cách tự nhiên."

[[questions]]
id = "cefr-b2-028"
module = "cefr-b2-functions"
type = "multiple"
difficulty = 2
prompt = "You are chairing a discussion. Select the phrases that invite participation or help the group follow the discussion."
options = ["Could we hear from someone who hasn't spoken yet?", "So far, we seem to agree on the date.", "Your idea is boring; let's stop talking about it.", "Could you explain what you mean by 'low-cost option'?", "Only my view matters here."]
answer = [0, 1, 3]
explanation = "Các câu đúng mời thêm người tham gia, tóm tắt điểm đồng thuận và yêu cầu làm rõ."

[[questions]]
id = "cefr-b2-029"
module = "cefr-b2-functions"
type = "multiple"
difficulty = 3
prompt = "Select the responses that make a reasoned, tactful counterpoint."
options = ["I understand why you prefer the cheaper option; however, it may not last as long.", "I see your point. Could we also look at how much time each option takes?", "You are wrong, and there is nothing else to say.", "That is the only sensible idea, so I agree with everything.", "I agree that speed matters, but we should also check whether the new service is reliable."]
answer = [0, 1, 4]
explanation = "Các câu được chọn vừa công nhận ý kiến/ưu tiên của bên kia, vừa bổ sung lý do hoặc tiêu chí khác để cân nhắc."

[[questions]]
id = "cefr-b2-030"
module = "cefr-b2-functions"
type = "fill"
difficulty = 1
prompt = "Complete the polite request for clarification: *Could you {{blank}} how the new booking system works?*"
blanks = [["explain"]]
explanation = "*Could you explain…?* là cách lịch sự để yêu cầu người khác làm rõ thông tin."

[[questions]]
id = "cefr-b2-031"
module = "cefr-b2-functions"
type = "fill"
difficulty = 2
prompt = "Complete the negotiation phrase: *To find a solution that suits both teams, could we {{blank}}?*"
blanks = [["meet halfway"]]
explanation = "*Meet halfway* diễn đạt việc mỗi bên nhượng bộ một phần để đạt thoả thuận."

[[questions]]
id = "cefr-b2-032"
module = "cefr-b2-functions"
type = "fill"
difficulty = 2
prompt = "Complete the chair's sentence with a verb meaning 'give a short account of the main points': *Before we finish, let me {{blank}} what we have agreed.*"
blanks = [["summarise", "summarize"]]
explanation = "*Summarise/summarize* có nghĩa là tóm tắt. Cả cách viết Anh-Anh và Anh-Mỹ đều được chấp nhận."

[[questions]]
id = "cefr-b2-033"
module = "cefr-b2-functions"
type = "essay"
difficulty = 3
prompt = "A colleague wants to replace the weekly team meeting with email updates. Write two or three sentences that acknowledge one benefit, raise one concern, and suggest a compromise."
keywords = [["I understand", "I see your point", "I can see why"], ["however", "but", "although"], ["could we", "how about", "perhaps we could"]]
min_keywords = 2
model_answer = '''I understand that email updates can save time. However, they may not give everyone a chance to ask questions. Could we keep a short meeting every other week and use email in between?'''
explanation = "Câu trả lời thể hiện nhượng bộ, nêu mối lo ngại và đề xuất một phương án dung hoà."

[[modules]]
id = "cefr-b2-reading-writing"
title = "B2 · Đọc hiểu và viết văn bản rõ ràng"
description = "Tổ chức bài luận, báo cáo, bài đánh giá và thư trang trọng; kiểm soát register, cohesion và paraphrase."
lesson = '''
### Bài luận opinion và for-and-against
Bài luận opinion nêu chủ đề và quan điểm rõ ở phần mở đầu, sau đó phát triển từng lý do bằng giải thích hoặc ví dụ; kết luận nhắc lại lập trường bằng cách diễn đạt khác. Bài for-and-against trình bày cả lợi ích lẫn bất lợi trước khi kết luận. Mỗi đoạn nên có một câu chủ đề và các câu hỗ trợ cùng hướng. *Firstly*, *in addition*, *on the other hand* và *finally* giúp chỉ quan hệ giữa ý, nhưng không thay cho lập luận.

### Báo cáo, đánh giá và thư trang trọng
Báo cáo thường có tiêu đề hoặc các mục ngắn như *Purpose*, *Findings* và *Recommendations*. Tập trung vào kết quả, dùng câu rõ và giọng điệu trung tính: *The survey found that…*; *It is recommended that the opening hours be extended.* Bài đánh giá nên nêu tiêu chí, điểm mạnh, hạn chế và nhận xét cuối thay vì chỉ nói *It was good*. Trong thư trang trọng, dùng lời chào phù hợp (*Dear Ms Lee,*), nêu mục đích sớm (*I am writing to enquire about…*) và kết thư lịch sự (*Kind regards,*). Không dùng cách viết thân mật như *Hey*, *gonna* hay *send me this now* khi viết cho cơ quan hoặc khách hàng.

### Cohesion và paraphrase
Cohesion làm các câu nối với nhau nhờ đại từ quy chiếu rõ (*The library changed its hours. This decision…*), từ nối đúng quan hệ (*however* cho tương phản; *as a result* cho kết quả), và tránh lặp từ quá mức. Đại từ như *it/they/this* phải có đối tượng tham chiếu dễ nhận ra. Paraphrase giữ nguyên thông tin nhưng thay cấu trúc hoặc từ vựng phù hợp: *The council reduced fares* có thể diễn đạt là *Bus tickets became cheaper*. Không chỉ đổi một từ nếu làm lệch ý; không thêm kết luận mà nguồn không nói. Người Việt hay viết *In my opinion, I think* (lặp quan điểm), *regarding to* (dùng sai cụm), hoặc nối nhiều mệnh đề bằng dấu phẩy. Chọn *In my opinion* hoặc *I think*, viết *regarding the issue*, và tách câu hoặc dùng từ nối có dấu câu đúng.

### Đọc phản biện, tổng hợp và biên tập
Khi đọc bài nghị luận hoặc báo cáo, xác định luận điểm, lý do, bằng chứng và quan hệ giữa chúng; để ý từ chỉ mức độ chắc chắn như *may, likely, must* để không diễn giải quá mạnh. Phân biệt paraphrase với thay vài từ đồng nghĩa: cần đổi cấu trúc nhưng giữ đúng mức độ, điều kiện và tác giả của nhận định. Khi tổng hợp hai nguồn, nêu điểm chung trước rồi ghi rõ điểm khác nhau.
Báo cáo thường dùng tiêu đề hoặc mục rõ, tóm tắt kết quả trước khi đề xuất hành động. Bài for-and-against cần trình bày hai phía công bằng rồi kết luận theo lập trường. Sau khi viết, rà lại đại từ quy chiếu, từ nối, dấu phẩy trong mệnh đề không xác định, mạo từ và từ ghép có gạch nối trước danh từ. Trong mediation, viết lại thông tin cho người đọc mới mà không làm mất cảnh báo, con số hoặc điều kiện quan trọng.
'''

[[questions]]
id = "cefr-b2-034"
module = "cefr-b2-reading-writing"
type = "single"
difficulty = 1
prompt = "Which outline is most suitable for a short for-and-against essay about working from home?"
options = ["State the topic, discuss advantages, discuss disadvantages, then give a balanced conclusion.", "List unrelated facts and finish without a conclusion.", "Repeat the same advantage in every paragraph.", "Give only a personal story and do not explain the topic."]
answer = [0]
explanation = "Bài for-and-against nên triển khai cả hai phía rồi kết luận; các đoạn cần hỗ trợ một cấu trúc rõ ràng."

[[questions]]
id = "cefr-b2-035"
module = "cefr-b2-reading-writing"
type = "single"
difficulty = 2
prompt = "Which sentence works best as the topic sentence for a paragraph about the benefits of public parks?"
options = ["Public parks offer several benefits to people living in cities.", "I went to a park last Sunday with my cousin.", "There are many things in the world.", "In conclusion, public transport should be cheaper."]
answer = [0]
explanation = "Câu chủ đề giới thiệu đúng ý chính sẽ được phát triển: lợi ích của công viên đô thị."

[[questions]]
id = "cefr-b2-036"
module = "cefr-b2-reading-writing"
type = "single"
difficulty = 2
prompt = "A manager asks for a short report on staff training. Which sentence best suits the findings section?"
options = ["The survey found that most staff wanted more practice with the new booking system.", "Hey, everyone really wants more practice, I guess.", "I think training is nice and stuff.", "You should do what I say about training."]
answer = [0]
explanation = "Câu báo cáo trung tính, nêu kết quả cụ thể và phù hợp với phần findings."

[[questions]]
id = "cefr-b2-037"
module = "cefr-b2-reading-writing"
type = "single"
difficulty = 1
prompt = "You are emailing a company to ask about an advertised internship. Which opening is most appropriate?"
options = ["Dear Ms Brown, I am writing to enquire about the summer internship advertised on your website.", "Hey, tell me more about that job.", "Give me information fast.", "Hi mate, what is this internship thing?"]
answer = [0]
explanation = "Lời chào và câu mở đầu lịch sự nêu rõ mục đích, phù hợp với thư gửi công ty."

[[questions]]
id = "cefr-b2-038"
module = "cefr-b2-reading-writing"
type = "single"
difficulty = 2
prompt = "Which sentence uses a clear reference word to connect to the previous sentence? Previous sentence: *The council has extended the library's evening hours.*"
options = ["This change will make the library more useful to people who work late.", "It is very good and they are there.", "That has them doing it.", "The change, they, useful, later."]
answer = [0]
explanation = "*This change* có đối tượng tham chiếu rõ là việc kéo dài giờ mở cửa; các lựa chọn khác mơ hồ hoặc sai cấu trúc."

[[questions]]
id = "cefr-b2-039"
module = "cefr-b2-reading-writing"
type = "single"
difficulty = 3
prompt = "The source says: *After the city lowered bus fares, more residents used public transport.* Which sentence is the best paraphrase?"
options = ["More residents travelled by public transport after the city reduced bus fares.", "The city increased bus fares, so residents stopped travelling.", "Public transport is always the best way to travel.", "The city lowered fares because residents used public transport more."]
answer = [0]
explanation = "Câu đầu giữ nguyên quan hệ thời gian và kết quả, đồng thời thay đổi cấu trúc/từ ngữ. Các câu khác đổi nghĩa hoặc thêm ý."

[[questions]]
id = "cefr-b2-040"
module = "cefr-b2-reading-writing"
type = "multiple"
difficulty = 2
prompt = "Select the sentences that link ideas clearly and use correct punctuation and grammar."
options = ["The museum improved its website. As a result, more people booked online.", "The museum has a new website. It is easier to use than the old one.", "The website is clearer; however, some pages are still difficult to use.", "The website is clearer, because. Some pages are still difficult to use.", "The museum improved its website. This have helped visitors."]
answer = [0, 1, 2]
explanation = "Các câu được chọn dùng quan hệ kết quả, đại từ quy chiếu rõ hoặc từ nối tương phản với dấu câu phù hợp."

[[questions]]
id = "cefr-b2-041"
module = "cefr-b2-reading-writing"
type = "fill"
difficulty = 2
prompt = "Complete the sentence with a contrast clause linker: *{{blank}} the survey included only 40 people, the results showed similar preferences in both age groups.*"
blanks = [["although", "even though", "though"]]
explanation = "Các từ này nối một mệnh đề nhượng bộ với mệnh đề chính. Sau *despite* phải là danh từ hoặc V-ing, không phải mệnh đề hoàn chỉnh."

[[questions]]
id = "cefr-b2-042"
module = "cefr-b2-reading-writing"
type = "fill"
difficulty = 1
prompt = "Use a singular reference word for the whole previous statement: *The school received 200 applications. {{blank}} surprised the admissions team.*"
blanks = [["this"]]
explanation = "*This* có thể quy chiếu đến toàn bộ thông tin vừa nêu; chủ ngữ này cần động từ số ít *surprised*."

[[questions]]
id = "cefr-b2-043"
module = "cefr-b2-reading-writing"
type = "fill"
difficulty = 2
prompt = "Paraphrase the verb without changing the meaning: *According to the report, sales {{blank}} by 10% compared with last year.*"
blanks = [["increased", "rose"]]
explanation = "Cả *increased* và *rose* đều tự nhiên để nói doanh số tăng."

[[questions]]
id = "cefr-b2-044"
module = "cefr-b2-reading-writing"
type = "essay"
difficulty = 3
prompt = "Write three or four sentences in a formal register to evaluate a new online course for your team. Mention one strength, one limitation, and a recommendation."
keywords = [["easy to access", "easy to use", "accessible", "well organised", "well organized", "well-structured", "flexible", "strength"], ["however", "on the other hand", "although", "limitation", "drawback"], ["recommend", "it is advisable", "it would be advisable"]]
min_keywords = 2
model_answer = '''The course is easy to access and provides useful practice for new staff. However, some lessons are too short to explain difficult topics in detail. I recommend adding a short example to each lesson before the course is offered to the whole team.'''
explanation = "Bài đánh giá cân bằng nêu điểm mạnh, giới hạn và đề xuất bằng register phù hợp với báo cáo công việc."

[[questions]]
id = "cefr-b2-x001"
module = "cefr-b2-grammar-plus"
type = "single"
difficulty = 2
prompt = "You ______ have told us about the allergy; we could have prepared another meal."
options = ["should", "shouldn't", "must", "may"]
answer = [0]
explanation = "Should have + V3 diễn tả điều đáng lẽ nên làm trong quá khứ nhưng đã không làm."

[[questions]]
id = "cefr-b2-x002"
module = "cefr-b2-grammar-plus"
type = "single"
difficulty = 3
prompt = "If Nia had accepted the role, she ______ in Singapore now. Choose the form that emphasises an ongoing temporary situation."
options = ["would live", "would be living", "will be living", "had lived"]
answer = [1]
explanation = "Đây là điều kiện hỗn hợp: điều kiện quá khứ, kết quả hiện tại."

[[questions]]
id = "cefr-b2-x003"
module = "cefr-b2-grammar-plus"
type = "single"
difficulty = 3
prompt = "Only after the review ______ how much the original estimate had missed."
options = ["we understood", "did we understand", "we had understand", "had we understood"]
answer = [1]
explanation = "Cụm Only after đứng đầu câu kéo theo đảo trợ động từ: did + chủ ngữ + động từ nguyên mẫu."

[[questions]]
id = "cefr-b2-x004"
module = "cefr-b2-grammar-plus"
type = "single"
difficulty = 2
prompt = "He stopped ______ some water before continuing his walk."
options = ["drinking", "to drink", "drink", "drank"]
answer = [1]
explanation = "Stop to drink nghĩa là dừng hoạt động khác để uống nước; stop drinking nghĩa là ngừng uống."

[[questions]]
id = "cefr-b2-x005"
module = "cefr-b2-grammar-plus"
type = "single"
difficulty = 2
prompt = "The editor asked for a ______ report that would fit on four pages."
options = ["four pages", "four-page", "four-pages", "four-pages-long"]
answer = [1]
explanation = "Tính từ ghép đứng trước danh từ dùng gạch nối và số đo ở dạng số ít: four-page report."

[[questions]]
id = "cefr-b2-x006"
module = "cefr-b2-grammar-plus"
type = "multiple"
difficulty = 3
prompt = "Select the sentences with correct perfect modals or inversion."
options = ["You needn't have printed the form; a digital copy was enough.", "Rarely we have seen such a clear result.", "Had I known about the change, I would have booked earlier.", "The team may have taken the earlier train.", "Not only she explained the issue, but she also proposed a fix."]
answer = [0, 2, 3]
explanation = "Các câu đúng dùng modal + have + V3 hoặc đảo trợ động từ đúng sau cụm hạn định."

[[questions]]
id = "cefr-b2-x007"
module = "cefr-b2-grammar-plus"
type = "multiple"
difficulty = 2
prompt = "Select the sentences that use ellipsis or substitution naturally."
options = ["I prefer the first draft, and Maya does too.", "The blue folder is mine; take the blue one.", "I don't think so; the figures look incomplete.", "The first team completed the audit, and the second did so as well.", "We expected delays, and the delays we did."]
answer = [0, 1, 2, 3]
explanation = "So/neither, one và do so giúp tránh lặp nhưng phải khớp với ý câu trước."

[[questions]]
id = "cefr-b2-x008"
module = "cefr-b2-grammar-plus"
type = "multiple"
difficulty = 3
prompt = "Choose the sentences with correctly formed compound adjectives or noun phrases."
options = ["They submitted a four-page proposal.", "The company needs a long-term plan.", "We reviewed a two-hours meeting.", "She interviewed a well-known researcher.", "The team prepared a highly detailed report."]
answer = [0, 1, 3, 4]
explanation = "Four-page, long-term và well-known đứng trước danh từ dùng gạch nối; highly detailed đúng trạng từ; two-hours meeting sai dạng số nhiều."

[[questions]]
id = "cefr-b2-x009"
module = "cefr-b2-grammar-plus"
type = "fill"
difficulty = 3
prompt = "Complete the deductions or criticisms with a perfect modal.\n\n1. The lights are off and the office is empty. They {{blank}} already. (must / leave)\n2. The signed paper copy is still on my desk, so you {{blank}} it yesterday. (can't / send)\n3. We missed the deadline. We {{blank}} the dates earlier. (should / check)"
blanks = [["must have left"], ["can't have sent"], ["should have checked"]]
explanation = "Modal hoàn thành gồm modal + have + V3; must/can't biểu thị suy đoán, should have nêu việc đáng lẽ nên làm."

[[questions]]
id = "cefr-b2-x010"
module = "cefr-b2-grammar-plus"
type = "fill"
difficulty = 2
prompt = "Complete the future forms.\n\n1. By June, the council {{blank}} two new cycle paths. (build)\n2. At this time tomorrow, we {{blank}} to the conference. (travel)\n3. By the time the guests arrive, I {{blank}} the presentation. (finish)"
blanks = [["will have built"], ["will be travelling", "will be traveling"], ["will have finished"]]
explanation = "Future perfect nhấn việc hoàn tất trước mốc tương lai; future continuous diễn tả hành động đang diễn ra tại mốc đó."

[[questions]]
id = "cefr-b2-x011"
module = "cefr-b2-grammar-plus"
type = "fill"
difficulty = 3
prompt = "Complete each sentence with the form that matches the meaning.\n\n1. Please remember {{blank}} the signed copy today; it is still on your list. (send)\n2. I remember {{blank}} the new director at last year's conference. (meet)\n3. We stopped {{blank}} a map because we were lost. (buy)"
blanks = [["to send"], ["meeting"], ["to buy"]]
explanation = "Remember to do là nhớ việc cần làm; remember doing là nhớ đã làm; stop to buy là dừng để mua."

[[questions]]
id = "cefr-b2-x012"
module = "cefr-b2-grammar-plus"
type = "fill"
difficulty = 3
prompt = "Complete the sentences with a quantifier or article.\n\n1. {{blank}} of the evidence was checked twice, but only a {{blank}} of the figures were confirmed.\n2. Every applicant must bring {{blank}} identification.\n3. The more carefully we plan, {{blank}} the fewer problems we are likely to face."
blanks = [["much"], ["few"], ["no", "some"], ["the"]]
explanation = "Evidence và identification không đếm được; a few đi với danh từ số nhiều; every đi với danh từ số ít; the more..., the fewer..."

[[questions]]
id = "cefr-b2-x013"
module = "cefr-b2-grammar-plus"
type = "fill"
difficulty = 3
prompt = "Complete the formal structures.\n\n1. Only when the final figures arrived {{blank}} the scale of the problem. (we / understand)\n2. What the committee needs {{blank}} a clearer set of criteria. (be)\n3. It is widely {{blank}} that the old system costs too much. (believe)"
blanks = [["did we understand"], ["is"], ["believed"]]
explanation = "Only when ở đầu câu gây đảo did + chủ ngữ; What-clause làm chủ ngữ số ít; bị động khách quan dùng is believed."

[[questions]]
id = "cefr-b2-x014"
module = "cefr-b2-grammar-plus"
type = "essay"
difficulty = 3
prompt = "Write three or four sentences recommending a change to a public service. Include one cautious deduction, one concession and one structure referring to an earlier action."
keywords = [["may", "might"], ["although", "while"], ["should have", "could have"]]
min_keywords = 3
model_answer = "The long queues may have been caused by the reduced opening hours. Although the change saved money, it has made access more difficult. The council should have consulted regular users before closing the desk. A trial evening service could address both concerns."
explanation = "Bài mẫu có hedging, nhượng bộ và modal hoàn thành; bộ chấm chỉ so khớp từ khóa."

[[questions]]
id = "cefr-b2-x015"
module = "cefr-b2-vocab"
type = "single"
difficulty = 2
prompt = "The new security process could {{blank}} a risk if staff are not trained first."
options = ["pose", "do", "make", "reach"]
answer = [0]
explanation = "Pose a risk là collocation tự nhiên để nói tạo ra rủi ro."

[[questions]]
id = "cefr-b2-x016"
module = "cefr-b2-vocab"
type = "single"
difficulty = 2
prompt = "The report uses survey results to {{blank}} attention to the gap between the two groups."
options = ["draw", "make", "take", "put"]
answer = [0]
explanation = "Draw attention to là collocation chuẩn."

[[questions]]
id = "cefr-b2-x017"
module = "cefr-b2-vocab"
type = "single"
difficulty = 1
prompt = "The two departments need to get on the same {{blank}} before the launch."
options = ["page", "book", "paper", "line"]
answer = [0]
explanation = "On the same page là thành ngữ chỉ cùng hiểu biết hoặc cùng quan điểm."

[[questions]]
id = "cefr-b2-x018"
module = "cefr-b2-vocab"
type = "single"
difficulty = 2
prompt = "The company chose an {{blank}} design that uses less energy and fewer materials."
options = ["economic", "economical", "economics", "economically"]
answer = [1]
explanation = "Economical nói thiết kế tiết kiệm chi phí/tài nguyên; economic thường liên quan đến kinh tế."

[[questions]]
id = "cefr-b2-x019"
module = "cefr-b2-vocab"
type = "single"
difficulty = 2
prompt = "The website includes captions and keyboard navigation to improve {{blank}} for all users."
options = ["accessible", "accessibility", "accessibly", "access"]
answer = [1]
explanation = "Accessibility là danh từ chỉ mức độ dễ tiếp cận."

[[questions]]
id = "cefr-b2-x020"
module = "cefr-b2-vocab"
type = "multiple"
difficulty = 2
prompt = "Select the natural B2 collocations."
options = ["The campaign aims to raise awareness of road safety.", "We have to meet the deadline by Thursday.", "After two hours, both sides reached a compromise.", "The report contains strong evidence for the claim.", "The update may pose a risk to older devices."]
answer = [0, 1, 2, 3, 4]
explanation = "Raise awareness, meet a deadline, reach a compromise, strong evidence và pose a risk đều là collocation tự nhiên."

[[questions]]
id = "cefr-b2-x021"
module = "cefr-b2-vocab"
type = "multiple"
difficulty = 2
prompt = "Choose the phrases that fit a formal report better than an informal team chat."
options = ["We should investigate the cause of the delay.", "We need to sort this mess out ASAP.", "The findings raise a concern about data quality.", "The team reached a conclusion after reviewing the evidence.", "That new tool is a piece of cake."]
answer = [0, 2, 3]
explanation = "Investigate, raise a concern và reach a conclusion phù hợp register báo cáo; slang và idiom thân mật hơn."

[[questions]]
id = "cefr-b2-x022"
module = "cefr-b2-vocab"
type = "multiple"
difficulty = 3
prompt = "Select the sentences that use the phrasal verbs naturally."
options = ["A larger company took over the local supplier in March.", "She brought up the missing figures during the review.", "We put off the launch until the safety checks were complete.", "I came across an old photograph while sorting the files.", "He took over the meeting by postponing it until June."]
answer = [0, 1, 2, 3]
explanation = "Take over là tiếp quản; bring up là nêu vấn đề; put off là hoãn; come across có thể nghĩa tình cờ tìm thấy."

[[questions]]
id = "cefr-b2-x023"
module = "cefr-b2-vocab"
type = "fill"
difficulty = 3
prompt = "Complete each sentence with the correct form of the word in brackets.\n\n1. The system's long-term {{blank}} is essential for the service. (rely)\n2. The building is fully {{blank}} to wheelchair users. (access)\n3. They presented the results {{blank}} and clearly. (effective)"
blanks = [["reliability"], ["accessible"], ["effectively"]]
explanation = "Reliability là danh từ; accessible là tính từ; effectively là trạng từ bổ nghĩa presented."

[[questions]]
id = "cefr-b2-x024"
module = "cefr-b2-vocab"
type = "fill"
difficulty = 3
prompt = "Complete each sentence with the correct word form.\n\n1. The study found a small but {{blank}} difference between the groups. (significance)\n2. Better public transport can improve economic {{blank}} in rural areas. (grow)\n3. We need an {{blank}} review before publishing the report. (independence)"
blanks = [["significant"], ["growth"], ["independent"]]
explanation = "Significant là tính từ; growth là danh từ; independent là tính từ đứng trước review."

[[questions]]
id = "cefr-b2-x025"
module = "cefr-b2-vocab"
type = "fill"
difficulty = 2
prompt = "Complete each phrasal verb.\n\n1. The chair asked the speaker to {{blank}} up the safety concern.\n2. A new director will {{blank}} over the department in January.\n3. We had to put {{blank}} the workshop because the trainer was ill."
blanks = [["bring"], ["take"], ["off"]]
explanation = "Bring up là nêu ra; take over là tiếp quản; put off là hoãn."

[[questions]]
id = "cefr-b2-x026"
module = "cefr-b2-vocab"
type = "fill"
difficulty = 2
prompt = "Complete the collocations with the correct word.\n\n1. The team must {{blank}} a deadline without reducing quality.\n2. The campaign hopes to raise {{blank}} about online fraud.\n3. After discussion, they reached a {{blank}} on the meeting time."
blanks = [["meet"], ["awareness"], ["compromise"]]
explanation = "Meet a deadline, raise awareness và reach a compromise là các collocation chuẩn."

[[questions]]
id = "cefr-b2-x027"
module = "cefr-b2-vocab"
type = "fill"
difficulty = 3
prompt = "Complete the sentence with a word that keeps the meaning cautious.\n\nThe evidence is not conclusive, but it {{blank}} points to a problem with the older model."
blanks = [["tentatively", "probably", "likely"]]
explanation = "Tentatively diễn đạt kết luận có mức độ thận trọng."

[[questions]]
id = "cefr-b2-x028"
module = "cefr-b2-vocab"
type = "essay"
difficulty = 2
prompt = "Write three sentences for a formal proposal. Identify one risk, suggest one response and use one precise collocation or phrasal verb."
keywords = [["pose a risk"], ["mitigate", "reduce"], ["decision", "compromise"]]
min_keywords = 3
model_answer = "The lack of staff training may pose a risk to the new service. A short pilot could help mitigate the problem before the full launch. The committee should reach a decision after reviewing the results."
explanation = "Bài mẫu dùng pose a risk, mitigate và reach a decision; từ khóa không đánh giá register hay độ chính xác tổng thể."

[[questions]]
id = "cefr-b2-x029"
module = "cefr-b2-functions"
type = "single"
difficulty = 2
prompt = "The evidence is incomplete, but several customers report the same fault. Which response is appropriately cautious?"
options = ["The supplier definitely caused the fault.", "The fault may have started after the latest update.", "There is no possible connection.", "Everyone knows the update is unsafe."]
answer = [1]
explanation = "May have diễn đạt suy đoán hợp lý mà không khẳng định nguyên nhân đã chắc chắn."

[[questions]]
id = "cefr-b2-x030"
module = "cefr-b2-functions"
type = "single"
difficulty = 2
prompt = "Your colleague proposes cutting all evening support. You recognise the budget concern but disagree. Which response is most constructive?"
options = ["That is a terrible idea.", "I understand the budget pressure; however, removing all evening support could leave urgent users without help.", "You never listen to the team.", "We should stop discussing the budget."]
answer = [1]
explanation = "Câu đúng thừa nhận mối lo ngân sách rồi nêu một rủi ro cụ thể."

[[questions]]
id = "cefr-b2-x031"
module = "cefr-b2-functions"
type = "single"
difficulty = 2
prompt = "Two teams need the same meeting room. Which proposal offers a practical compromise?"
options = ["One team should cancel every meeting.", "Could we reserve mornings for Team A and afternoons for Team B for a month, then review usage?", "The room belongs to whoever books first forever.", "We should move all meetings online without asking."]
answer = [1]
explanation = "Chia sẻ thời gian theo nhu cầu và thử nghiệm lịch mới tạo phương án có thể thương lượng."

[[questions]]
id = "cefr-b2-x032"
module = "cefr-b2-functions"
type = "single"
difficulty = 1
prompt = "A discussion is dominated by two people. What can the chair say to invite another view?"
options = ["We have already heard enough.", "Sam, would you like to add a perspective before we decide?", "You must agree with the majority.", "Let's ignore the quieter people."]
answer = [1]
explanation = "Lời mời trực tiếp nhưng không gây áp lực giúp người khác có lượt nói."

[[questions]]
id = "cefr-b2-x033"
module = "cefr-b2-functions"
type = "single"
difficulty = 2
prompt = "You need to interrupt briefly and return to the speaker's point. Which phrase is suitable?"
options = ["Stop talking; I have a better idea.", "Could I come in briefly? I’ll return to your point in a moment.", "I will ignore what you said.", "That is not relevant."]
answer = [1]
explanation = "Cụm xin phép ngắt lời và hứa quay lại ý trước giúp giữ mạch trao đổi."

[[questions]]
id = "cefr-b2-x034"
module = "cefr-b2-functions"
type = "multiple"
difficulty = 2
prompt = "Select the phrases that help negotiate without sounding aggressive."
options = ["Could we test the smaller option first and review the results?", "You have to accept my plan.", "I take your point; one concern is the effect on weekend staff.", "What would both teams need in order to agree?", "If you disagree, we can end the meeting."]
answer = [0, 2, 3]
explanation = "Các lựa chọn đúng nêu điều kiện, thừa nhận ý hoặc tìm lợi ích chung thay vì ra lệnh."

[[questions]]
id = "cefr-b2-x035"
module = "cefr-b2-functions"
type = "multiple"
difficulty = 2
prompt = "Which phrases are useful for facilitating an online discussion?"
options = ["I’ll pause here and invite anyone who has not spoken to comment.", "Your microphone is bad, so your point does not count.", "Let me check that I understood the proposal correctly.", "We seem to agree on the goal but not the timeline.", "Please stop repeating yourself."]
answer = [0, 2, 3]
explanation = "Các lựa chọn đúng quản lý lượt nói, tóm tắt và mời làm rõ; đổ lỗi làm căng thẳng tăng."

[[questions]]
id = "cefr-b2-x036"
module = "cefr-b2-functions"
type = "multiple"
difficulty = 3
prompt = "A policy is written in technical language. Select mediation strategies that make it easier to act on."
options = ["Replace specialised terms with familiar words and give a short example.", "Remove the exception because it makes the policy longer.", "Keep the deadline and eligibility condition in the explanation.", "Ask the colleague to explain the next step in their own words.", "Translate every word literally even when the result is unclear."]
answer = [0, 2, 3]
explanation = "Giải thích lại thuật ngữ, nêu điều kiện quan trọng và kiểm tra hiểu biết hỗ trợ tiếp nhận; bỏ cảnh báo làm sai nghĩa."

[[questions]]
id = "cefr-b2-x037"
module = "cefr-b2-functions"
type = "fill"
difficulty = 2
prompt = "Complete the phrases for managing turns.\n\n1. Before we move on, could we hear {{blank}} Priya?\n2. May I come {{blank}} with one question?\n3. Let me finish the summary, and then we can open the {{blank}}."
blanks = [["from"], ["in"], ["floor"]]
explanation = "Hear from, come in và open the floor là cách diễn đạt tự nhiên trong cuộc họp."

[[questions]]
id = "cefr-b2-x038"
module = "cefr-b2-functions"
type = "fill"
difficulty = 3
prompt = "Complete the cautious statements.\n\n1. The figures {{blank}} to suggest that demand is increasing.\n2. One possible {{blank}} is that the survey missed younger users.\n3. We cannot {{blank}} out a delay in the supply chain."
blanks = [["seem"], ["explanation"], ["rule"]]
explanation = "Seem to suggest, possible explanation và rule out phù hợp để nêu suy đoán có giới hạn."

[[questions]]
id = "cefr-b2-x039"
module = "cefr-b2-functions"
type = "fill"
difficulty = 2
prompt = "Complete the meeting recap.\n\nWe agreed to test option B for one month, {{blank}} to approval from Finance. The team will then {{blank}} the results and {{blank}} a recommendation."
blanks = [["subject"], ["review"], ["make"]]
explanation = "Subject to approval nêu điều kiện; review the results và make a recommendation là bước tiếp theo hợp lý."

[[questions]]
id = "cefr-b2-x040"
module = "cefr-b2-functions"
type = "fill"
difficulty = 2
prompt = "Complete the compromise proposal.\n\nI understand why the team prefers a longer trial. {{blank}}, we could begin with four weeks and extend it if early results are positive."
blanks = [["however"]]
explanation = "However giới thiệu đề xuất cân bằng với ý trước."

[[questions]]
id = "cefr-b2-x041"
module = "cefr-b2-functions"
type = "fill"
difficulty = 2
prompt = "Complete the check for shared understanding.\n\nTo confirm, we will collect data for six weeks and then compare results. Have I understood that {{blank}}? Please {{blank}} me if I have missed a condition."
blanks = [["correctly"], ["correct"]]
explanation = "Cụm understood that correctly kiểm tra hiểu biết; correct me là mời sửa nếu có nhầm lẫn."

[[questions]]
id = "cefr-b2-x042"
module = "cefr-b2-functions"
type = "essay"
difficulty = 3
prompt = "Write a short meeting comment about a proposed change. Acknowledge one benefit, raise one evidence-based concern and suggest a compromise."
keywords = [["benefit", "advantage"], ["concern", "risk"], ["trial", "pilot"]]
min_keywords = 3
model_answer = "I can see the benefit of reducing support hours because it would lower costs. One concern is that the request data shows many users need help after six. Could we run a four-week pilot and review the results before making a permanent change?"
explanation = "Bài mẫu có concession, concern và đề xuất thử nghiệm; điểm từ khóa không đánh giá khả năng tương tác thực tế."

[[questions]]
id = "cefr-b2-x043"
module = "cefr-b2-reading-writing"
type = "single"
difficulty = 2
prompt = "Read the report extract: “Most participants completed the new form in under five minutes. However, users with screen readers reported difficulty locating the submission button.” What is the main conclusion?"
options = ["The form is unusable for everyone.", "The form is generally quick, but screen-reader access needs improvement.", "The submission button should be removed.", "The study measured only typing speed."]
answer = [1]
explanation = "Kết quả chung tích cực nhưng báo cáo nêu rõ một vấn đề tiếp cận cần xử lý."

[[questions]]
id = "cefr-b2-x044"
module = "cefr-b2-reading-writing"
type = "single"
difficulty = 2
prompt = "A writer says, “The figures may indicate a rise in demand, although the sample is small.” What is the writer's attitude?"
options = ["Certain that demand has risen sharply.", "Cautious because the evidence is limited.", "Angry about the survey.", "Uninterested in the result."]
answer = [1]
explanation = "May indicate và although the sample is small thể hiện nhận định thận trọng."

[[questions]]
id = "cefr-b2-x045"
module = "cefr-b2-reading-writing"
type = "single"
difficulty = 2
prompt = "Which paraphrase keeps both the meaning and the level of certainty? Source: “The change may reduce waiting times.”"
options = ["The change will eliminate waiting times.", "The change could make waiting times shorter.", "The change has already shortened every queue.", "The change cannot affect waiting times."]
answer = [1]
explanation = "May reduce cần được giữ ở mức có thể; will eliminate khẳng định mạnh hơn nguồn."

[[questions]]
id = "cefr-b2-x046"
module = "cefr-b2-reading-writing"
type = "single"
difficulty = 1
prompt = "You are sending a proposal to an external partner you have not met. Which opening best fits the register?"
options = ["Hey, here's our idea.", "Dear Ms Patel, I am writing to propose a short pilot of the new service.", "Listen, we need you to agree.", "Hi mate, check this out."]
answer = [1]
explanation = "Lời chào có tên/chức danh và mục đích rõ phù hợp thư chuyên nghiệp; hey thân mật quá mức."

[[questions]]
id = "cefr-b2-x047"
module = "cefr-b2-reading-writing"
type = "single"
difficulty = 2
prompt = "A report gives findings first, then discusses causes and recommendations. Which sentence belongs in the recommendation section?"
options = ["Forty-two per cent of users completed the form.", "The delay was most common on Mondays.", "We recommend testing the revised form with screen-reader users before launch.", "Some users may have missed the final page."]
answer = [2]
explanation = "Recommendation đề xuất hành động; các lựa chọn khác nêu dữ kiện hoặc giải thích."

[[questions]]
id = "cefr-b2-x048"
module = "cefr-b2-reading-writing"
type = "multiple"
difficulty = 2
prompt = "Two sources discuss a new cycle lane. Select the claims supported by the excerpts.\n\nSource A: “The lane reduced the average bus journey by two minutes on weekdays.”\nSource B: “Cyclist numbers rose, though the survey did not measure weekend use.”"
options = ["The average weekday bus journey became two minutes shorter.", "The sources prove that weekend cycling increased.", "Cyclist numbers rose according to Source B.", "The survey measured weekend use carefully.", "The lane had some measured weekday effect."]
answer = [0, 2, 4]
explanation = "Các lựa chọn đúng giữ nguyên dữ kiện và giới hạn đo lường của hai nguồn."

[[questions]]
id = "cefr-b2-x049"
module = "cefr-b2-reading-writing"
type = "multiple"
difficulty = 2
prompt = "Select the statements that distinguish fact, inference and opinion accurately.\n\nText: “The centre recorded 120 visits in June, up from 90 in May. The new evening hours may have contributed. Staff say the centre feels more welcoming.”"
options = ["There were 120 visits in June.", "Evening hours definitely caused the increase.", "The centre had 30 more visits than in May.", "The new hours may have contributed to the increase.", "Staff think the centre feels more welcoming."]
answer = [0, 2, 3, 4]
explanation = "Số lượt là fact; may have contributed là suy luận có giới hạn; welcoming là cảm nhận của nhân viên."

[[questions]]
id = "cefr-b2-x050"
module = "cefr-b2-reading-writing"
type = "multiple"
difficulty = 3
prompt = "Choose the sentences with clear cohesion and accurate reference."
options = ["The council extended library hours. This change helped evening students.", "The report lists three barriers. These include cost, travel time and limited opening hours.", "Although the sample was small, the results were useful.", "The school changed the timetable. It was very helpful. (no clear referent for it)", "The proposal was revised twice; the final version addresses the main concern."]
answer = [0, 1, 2, 4]
explanation = "Các câu đúng có đại từ quy chiếu rõ và connector phù hợp; it mơ hồ nếu không rõ chỉ điều gì."

[[questions]]
id = "cefr-b2-x051"
module = "cefr-b2-reading-writing"
type = "fill"
difficulty = 3
prompt = "Complete the paragraph with accurate linkers.\n\n{{blank}} the sample was small, both groups preferred the earlier opening time. The result is promising. {{blank}}, it should be checked with a larger group. {{blank}}, the team recommends a short pilot."
blanks = [["although"], ["however"], ["therefore"]]
explanation = "Although nhượng bộ; however báo hiệu hạn chế; therefore dẫn đến khuyến nghị."

[[questions]]
id = "cefr-b2-x052"
module = "cefr-b2-reading-writing"
type = "fill"
difficulty = 2
prompt = "Complete the synthesis with a clear reference word.\n\nThe first survey found that price was the main barrier. The second found that travel time was the main barrier. {{blank}} findings suggest that access has more than one cause."
blanks = [["these"]]
explanation = "These thay cho findings số nhiều được nhắc ở hai câu trước."

[[questions]]
id = "cefr-b2-x053"
module = "cefr-b2-reading-writing"
type = "fill"
difficulty = 2
prompt = "Paraphrase the claim without changing its certainty.\n\nSource: “The revised process may shorten approval times.”\n\nThe revised process {{blank}} reduce the time needed for approval."
blanks = [["could"]]
explanation = "Could paraphrases may while preserving the source's uncertainty."

[[questions]]
id = "cefr-b2-x054"
module = "cefr-b2-reading-writing"
type = "fill"
difficulty = 2
prompt = "Complete the report sentence with a precise attribution.\n\n{{blank}} the staff survey, several employees found the new booking system easier to use. The survey included 86 responses."
blanks = [["according to"]]
explanation = "According to the staff survey attributes the claim to its source rather than presenting it as unsupported fact."

[[questions]]
id = "cefr-b2-x055"
module = "cefr-b2-reading-writing"
type = "fill"
difficulty = 2
prompt = "Replace the informal idiom with a formal phrase.\n\nThe two teams are finally “on the same page” about the launch date.\n\nThe two teams now {{blank}} the same understanding of the launch date."
blanks = [["share"]]
explanation = "Share the same understanding truyền đạt ý tương đương với register trang trọng hơn."

[[questions]]
id = "cefr-b2-x056"
module = "cefr-b2-reading-writing"
type = "essay"
difficulty = 3
prompt = "Write a short synthesis of two viewpoints about a new workplace policy. State one point of agreement, one difference and a cautious recommendation."
keywords = [["both", "agree"], ["whereas", "while", "differ"], ["pilot", "trial", "review"]]
min_keywords = 3
model_answer = "Both groups agree that the current booking process is confusing. The support team wants a single online form, whereas the reception team is concerned about access for visitors without smartphones. A short pilot with a paper alternative may help the organisation review both needs before making a decision."
explanation = "Bài mẫu có điểm chung, khác biệt và recommendation có giới hạn; checker không đánh giá đầy đủ kỹ năng tổng hợp nguồn."
