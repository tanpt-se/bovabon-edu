blanks = [["heavy"]]
explanation = "Cụm cố định thông dụng là *heavy traffic* để nói đường đông xe."

[[questions]]
id = "cefr-b2-022"
module = "cefr-b2-vocab"
type = "essay"
difficulty = 2
prompt = "Write two or three sentences to persuade your local library to hold a monthly event for new residents. Use at least two suitable collocations or phrasal verbs."
keywords = [["break the ice", "help people meet", "meet new people"], ["raise awareness", "bring people together", "bring together"], ["take responsibility", "take over", "put off"]]
min_keywords = 2
model_answer = '''A monthly book evening could help new residents meet local people and break the ice. The library could also raise awareness of its free classes. I hope the organisers will take responsibility for arranging the first event.'''
explanation = "Câu trả lời thuyết phục nêu lợi ích cụ thể và dùng các cụm từ phù hợp với tình huống cộng đồng."

[[modules]]
id = "cefr-b2-functions"
title = "B2 · Thảo luận, thuyết phục và đàm phán"
description = "Diễn đạt mức độ chắc chắn, nêu lý do, phản biện lịch sự, tìm thoả hiệp, thuyết trình và điều phối lượt nói."
lesson = '''
### Suy đoán có căn cứ
Khi chưa biết chắc, hãy cho người nghe biết mức độ tự tin và lý do: *It might be a delivery delay; the roads are very busy.* Với bằng chứng mạnh hơn: *She must be on the train; she sent us a photo from the platform.* Nếu một khả năng gần như không thể: *That can't be the right room; the sign shows a different number.* Phân biệt điều mình biết với điều mình suy ra; tránh nói *definitely* khi chỉ có một manh mối.

### Thuyết phục và phản biện
Một lập luận rõ thường có đề xuất, lý do và lợi ích cụ thể: *We should extend the opening hours because many students finish work at six.* Có thể nhấn mạnh lợi ích thực tế: *This would give more people time to use the service.* Để phản biện mà vẫn lịch sự, công nhận một phần ý kiến rồi nêu giới hạn: *I see your point about cost. However, the current system also wastes staff time.* Tránh *You are wrong* hoặc *I agree, but…* nếu giọng điệu có thể bị hiểu là bác bỏ hoàn toàn; nêu dữ kiện hay hệ quả thay vì phán xét người nói.

### Đàm phán và điều phối
Thỏa thuận thường cần đề xuất lựa chọn, hỏi nhu cầu của bên kia và xác nhận phần đã thống nhất: *Could we try this for one month?* · *Would a later start work for you?* · *It sounds as if we agree on the date.* Có thể đề nghị gặp nhau ở giữa (*meet halfway*) hoặc thử phương án trong thời gian ngắn rồi đánh giá lại. Người điều phối giúp mọi người tham gia: *Could we hear from someone who hasn't spoken yet?*; làm rõ: *Could you explain what you mean by “flexible”?*; tóm tắt: *So far, we have agreed to…* và báo trước khi chuyển ý.

### Thuyết trình rõ ràng
Mở đầu bằng mục tiêu: *Today I'd like to explain…*; chuyển phần: *Let me move on to the next point*; đưa ví dụ: *For example…*; kết lại: *To sum up…*; mời câu hỏi: *Are there any questions?* Các cụm này giúp người nghe theo dõi cấu trúc, không cần dùng từ nối quá trang trọng. Trong văn bản và hội thoại, người Việt đôi khi dịch trực tiếp thành *I very agree* hoặc phản biện quá thẳng. Dùng *I completely agree* khi đồng tình; nếu không, thử *I understand your concern, although…* hoặc *Could we consider…?* để giữ trao đổi hợp tác.

### Đàm phán, điều phối và tương tác trực tuyến
Trong thảo luận B2, nêu lập trường kèm lý do, thừa nhận điểm hợp lý của phía kia và đề xuất phương án có điều kiện: *I understand the budget concern. Could we pilot the service for one month and review the figures?* Dùng hedging khi bằng chứng chưa chắc: *The figures seem to suggest…*; *One possible explanation is…* Không biến suy đoán thành sự thật.
Người điều phối mời người ít nói tham gia, kiểm tra sự đồng thuận và tóm tắt quyết định: *We have agreed to test option B, subject to approval from Finance.* Trong chat/họp trực tuyến, trích ý cần phản hồi, nói rõ nếu đang diễn đạt lại và tách vấn đề khỏi con người. Mediation ở B2 còn có thể là giải thích khái niệm cho đồng nghiệp bằng từ dễ hơn, giữ lại điều kiện và cảnh báo quan trọng. Bài văn bản không đo được lượt nói, ngữ điệu hoặc khả năng xử lý ngắt lời trong thời gian thực.
'''

[[questions]]
id = "cefr-b2-023"
module = "cefr-b2-functions"
type = "single"
difficulty = 1
prompt = "The train is ten minutes late, and the station is unusually quiet. Which reply expresses a cautious inference?"
options = ["It may have been delayed.", "It definitely left yesterday.", "It must be cancelled because all trains are cancelled in winter.", "It can't have any passengers."]
answer = [0]
explanation = "*May have been delayed* nêu một khả năng dựa trên thông tin hạn chế. Các lựa chọn khác khẳng định quá mức hoặc không có căn cứ."

