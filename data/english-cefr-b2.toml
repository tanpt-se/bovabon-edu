id = "cefr-b2-012"
module = "cefr-b2-vocab"
type = "single"
difficulty = 1
prompt = "The course helped me ______ a lot of progress in writing formal emails."
options = ["do", "make", "take", "reach"]
answer = [1]
explanation = "Collocation tự nhiên là *make progress*. Tránh dịch máy móc thành *do progress*."

[[questions]]
id = "cefr-b2-013"
module = "cefr-b2-vocab"
type = "single"
difficulty = 2
prompt = "At the end of the meeting, Jo ______ the problem of late deliveries, which started a useful discussion."
options = ["brought up", "brought about", "brought in", "brought out"]
answer = [0]
explanation = "*Bring up an issue* là nêu vấn đề để mọi người thảo luận."

[[questions]]
id = "cefr-b2-014"
module = "cefr-b2-vocab"
type = "single"
difficulty = 1
prompt = "The outdoor concert was ______ until Saturday because of the storm."
options = ["put off", "put out", "put up", "put through"]
answer = [0]
explanation = "*Put off* có nghĩa là hoãn một sự kiện hoặc kế hoạch."

[[questions]]
id = "cefr-b2-015"
module = "cefr-b2-vocab"
type = "single"
difficulty = 2
prompt = "The article describes the ______ effects of tourism on local jobs and prices."
options = ["economical", "economic", "economy", "economically"]
answer = [1]
explanation = "*Economic effects* là tác động liên quan đến nền kinh tế; *economical* thường nghĩa là tiết kiệm khi sử dụng."

[[questions]]
id = "cefr-b2-016"
module = "cefr-b2-vocab"
type = "single"
difficulty = 1
prompt = "The organiser started with a simple game to help people who had never met ______."
options = ["break the ice", "miss the boat", "cost an arm and a leg", "under the weather"]
answer = [0]
explanation = "*Break the ice* là làm giảm sự ngượng ngùng ban đầu để mọi người dễ bắt chuyện."

[[questions]]
id = "cefr-b2-017"
module = "cefr-b2-vocab"
type = "multiple"
difficulty = 2
prompt = "Select all sentences that use a strong collocation naturally."
options = ["The team made steady progress this month.", "We had heavy traffic near the bridge.", "Please do a decision before Friday.", "The campaign aims to raise awareness of road safety.", "She took a progress in her English class."]
answer = [0, 1, 3]
explanation = "Các cụm tự nhiên là *make progress*, *heavy traffic* và *raise awareness*. Dùng *make a decision*, còn *progress* không đi với *take* theo cách này."

[[questions]]
id = "cefr-b2-018"
module = "cefr-b2-vocab"
type = "multiple"
difficulty = 3
prompt = "Which sentences use the phrasal verb with the stated meaning shown by context?"
options = ["The new director took over the department in April. — became responsible for it", "We put off the meeting until Monday. — postponed it", "She brought up three children on her own. — raised them", "He turned down the music. — accepted it", "I found out the answer in the manual. — discovered it"]
answer = [0, 1, 2, 4]
explanation = "*Take over* là tiếp quản; *put off* là hoãn; *bring up* cũng có nghĩa nuôi dạy; *find out* là tìm ra thông tin. *Turn down the music* là giảm âm lượng, không phải chấp nhận."

[[questions]]
id = "cefr-b2-019"
module = "cefr-b2-vocab"
type = "fill"
difficulty = 1
prompt = "Choose the noun that completes the sentence: *The new timetable had a positive {{blank}} on attendance.*"
blanks = [["effect"]]
explanation = "Ở đây cần danh từ *effect*. *Affect* thường là động từ: *The timetable affected attendance.*"

[[questions]]
id = "cefr-b2-020"
module = "cefr-b2-vocab"
type = "fill"
difficulty = 2
prompt = "Complete the sentence with the correct form of *rely*: *The guide is clear and {{blank}}; visitors can use it without help.*"
blanks = [["reliable"]]
explanation = "Cần tính từ sau *is* để mô tả guide: *reliable*."

[[questions]]
id = "cefr-b2-021"
