id = "english-cefr-b2"
title = "Tiếng Anh B2 · Trung cao cấp"
icon = "B2"
color = "#16a34a"
group = "Tiếng Anh"
area = "english"
description = "Luyện tiếng Anh B2 qua ngữ pháp kể chuyện, từ vựng theo cụm, giao tiếp thuyết phục và văn bản nghị luận, báo cáo, đánh giá, thư trang trọng."

[[modules]]
id = "cefr-b2-grammar-plus"
title = "B2 · Ngữ pháp trong ngữ cảnh"
description = "Kể chuyện, tương lai trong quá khứ, verb patterns đổi nghĩa, lượng từ, cụm danh từ, nhấn mạnh và lược bỏ tự nhiên."
lesson = '''
### Kể chuyện và nhìn lại kế hoạch
| Cấu trúc | Dùng khi | Ví dụ |
|---|---|---|
| Past simple | sự kiện chính nối tiếp | *Mia opened the email and called her manager.* |
| Past continuous | bối cảnh hoặc việc đang diễn ra | *I was driving when the storm began.* |
| Past perfect | việc xảy ra trước một mốc quá khứ | *They had left before we arrived.* |
| Past perfect continuous | nhấn mạnh khoảng thời gian trước mốc quá khứ | *He had been waiting for an hour when the bus came.* |
| was/were going to; would | dự định hoặc tương lai nhìn từ quá khứ | *I was going to call, but I forgot.* / *She said she would help.* |

### Động từ theo sau bởi to V hoặc V-ing
Hình thức sau động từ có thể đổi nghĩa. *Remember to lock the door* là nhớ việc cần làm; *remember locking it* là nhớ đã làm. *Stop to answer the phone* nghĩa là dừng việc đang làm để trả lời; *stop answering calls* nghĩa là ngừng trả lời. *Try to restart the app* là cố gắng khởi động; *try restarting it* là thử cách đó. *Regret to say* thường báo tin không vui; *regret saying it* là hối tiếc lời đã nói. Hãy đọc cả ngữ cảnh thay vì học một danh sách máy móc.

### Lượng từ và cụm danh từ
| Cụm | Sắc thái | Ví dụ |
|---|---|---|
| few / little | hầu như không có, thường mang ý tiêu cực | *Few people noticed the change.* |
| a few / a little | có một ít, đủ để nói đến | *We have a few options and a little time.* |

Danh từ có thể bổ nghĩa cho danh từ khác: *a customer service team*, *a three-day trip*. Tính từ ghép thường có gạch nối trước danh từ: *a well-known author*, *a time-consuming task*. Thứ tự nhiều tính từ thường là ý kiến, kích thước/tuổi, màu sắc, nguồn gốc, chất liệu rồi đến danh từ; không cần xếp chuỗi dài nếu câu có thể viết gọn hơn.

### Nhấn mạnh, đánh giá và tránh lặp
*I do understand your concern* dùng *do/does/did + động từ nguyên mẫu* để nhấn mạnh lời khẳng định; không thêm *-s* hay *-ed* sau trợ động từ. *You should have checked the date* là lời phê bình/nuối tiếc về việc đã qua. *You needn't have brought food* cho biết người nghe đã mang nhưng việc đó không cần thiết; *You didn't need to bring food* chỉ nói không có nhu cầu, chưa khẳng định họ đã mang hay chưa. Khi tránh lặp, dùng *one/ones* cho danh từ đếm được (*the blue one*), *do so* thay một hành động vừa nêu, hoặc *so/not* sau các động từ như *think* (*I think so; I hope not*). Người Việt hay dùng *few* thay *a few*, giữ nguyên động từ sau *did*, hoặc viết *I am agree*; nhớ phân biệt lượng từ, dùng động từ nguyên mẫu sau *do*, và nói *I do agree* nếu cần nhấn mạnh.

### Modal hoàn thành, điều kiện và cấu trúc nhấn mạnh
Modal + have + V3 nhìn lại một tình huống: *You should have called* là lời khuyên hoặc nhận xét về việc đã qua; *They may have missed the train* là suy đoán; *You needn't have booked* nghĩa là đã đặt nhưng việc đó không cần thiết. Phân biệt với *didn't need to book*, vốn không cho biết người đó có đặt hay chưa.

Điều kiện hỗn hợp nối quá khứ với hiện tại: *If I had accepted the job, I would be living abroad now.* Cụm phủ định/hạn định ở đầu câu thường kéo theo đảo trợ động từ: *Rarely have we seen such a change*; *Only after the call did I understand*. Mệnh đề chẻ nhấn thông tin: *It was the delay that changed our plan*; *What we need is a clearer schedule*.

### Lược bỏ, thay thế và cụm danh từ
Dùng *so/neither* để tránh lặp (*I enjoyed the talk, and Sam did too*), *one/ones* thay danh từ (*the blue one*), và *do so* thay hành động. Bị động khách quan như *It is widely believed that…* hoặc *The report is expected to…* phù hợp khi muốn nhấn thông tin. Cụm danh từ dài cần có thứ tự rõ: *a recently approved regional transport plan*. Kiểm tra mạo từ, lượng từ và quan hệ bổ nghĩa để tránh chuỗi danh từ khó hiểu.
'''

[[questions]]
id = "cefr-b2-001"
module = "cefr-b2-grammar-plus"
type = "single"
difficulty = 1
prompt = "Choose the best words to complete the story: *While I ______ for the train, I noticed that I ______ my wallet at home.*"
options = ["waited / left", "was waiting / had left", "had waited / was leaving", "was waiting / leave"]
answer = [1]
explanation = "Past continuous tạo bối cảnh đang diễn ra; past perfect cho biết việc để quên ví xảy ra trước lúc nhận ra."

[[questions]]
id = "cefr-b2-002"
module = "cefr-b2-grammar-plus"
type = "single"
difficulty = 2
prompt = "At first, the team ______ launch the new website in May, but a delay changed the plan."
options = ["was going to", "would have", "had launched", "is going to"]
answer = [0]
explanation = "*Was going to* diễn đạt dự định trong quá khứ; mệnh đề sau cho biết kế hoạch đã thay đổi."

[[questions]]
id = "cefr-b2-003"
module = "cefr-b2-grammar-plus"
type = "single"
difficulty = 2
prompt = "The sign said 'No entry', so we stopped ______ the building."
options = ["to enter", "entering", "enter", "entered"]
answer = [1]
explanation = "*Stop + V-ing* nghĩa là ngừng hành động đó. *Stop to enter* sẽ có nghĩa dừng một việc khác để vào."

[[questions]]
id = "cefr-b2-004"
module = "cefr-b2-grammar-plus"
type = "single"
difficulty = 1
prompt = "The first bus was almost empty, so only ______ passengers got on."
options = ["a few", "few", "a little", "little"]
answer = [1]
explanation = "Danh từ *passengers* đếm được số nhiều. *Few* nhấn mạnh số lượng rất ít; *a few* có nghĩa là có một vài người."

[[questions]]
id = "cefr-b2-005"
module = "cefr-b2-grammar-plus"
type = "single"
difficulty = 2
prompt = "Your colleague doubts your experience. Which sentence most naturally adds emphasis to your positive reply?"
options = ["I do have experience with this kind of project.", "I am have experience with this kind of project.", "I does have experience with this kind of project.", "I did had experience with this kind of project."]
answer = [0]
explanation = "Trong câu khẳng định nhấn mạnh, dùng *do + động từ nguyên mẫu*: *I do have*. Không dùng *am* hoặc chia động từ sau *do/did*."

[[questions]]
id = "cefr-b2-006"
module = "cefr-b2-grammar-plus"
type = "multiple"
difficulty = 2
prompt = "Select the sentences in which the past perfect clearly places one event before another past event."
options = ["By the time we arrived, the film had started.", "She had finished dinner before her guests came.", "They had been at the café yesterday.", "I have met him before we moved here.", "When I called, he had already gone to bed."]
answer = [0, 1, 4]
explanation = "Các câu đúng dùng *had + past participle* cho sự việc xảy ra trước mốc quá khứ. Câu 3 không cần past perfect cho một trạng thái tại thời điểm cụ thể; câu 4 trộn present perfect với mốc quá khứ đã kết thúc."

[[questions]]
id = "cefr-b2-007"
module = "cefr-b2-grammar-plus"
type = "multiple"
difficulty = 3
prompt = "Which pairs correctly match the meaning of the verb pattern?"
options = ["I remembered to send the form. — I did not forget to send it.", "I remember sending the form. — I have a memory of doing it.", "She stopped to talk to Sam. — She ended her habit of talking to Sam.", "He tried restarting the computer. — He tested that as a possible solution.", "They regret to buy the tickets. — They are sorry they bought them."]
answer = [0, 1, 3]
explanation = "*Remember to do* là nhớ cần làm; *remember doing* nhớ đã làm. *Stop to talk* là dừng việc khác để nói chuyện. *Try doing* là thử một giải pháp. Câu cuối phải là *regret buying*."

[[questions]]
id = "cefr-b2-008"
module = "cefr-b2-grammar-plus"
type = "fill"
difficulty = 1
prompt = "Complete the sentence with the phrase that means there is some time, though not much: *We have {{blank}} time before the shop closes, so let's choose quickly.*"
blanks = [["a little"]]
explanation = "*Time* không đếm được; *a little* nói rằng còn một lượng nhỏ. *Little time* nhấn mạnh gần như không còn thời gian."

[[questions]]
id = "cefr-b2-009"
module = "cefr-b2-grammar-plus"
type = "fill"
difficulty = 2
prompt = "Complete the sentence with the earlier action: *When the teacher arrived, the students {{blank}} the classroom.* Use *leave* in the past perfect."
blanks = [["had left"]]
explanation = "Học sinh rời đi trước khi giáo viên đến, nên hành động sớm hơn dùng past perfect."

[[questions]]
id = "cefr-b2-010"
module = "cefr-b2-grammar-plus"
type = "fill"
difficulty = 2
prompt = "Complete the sentence with the correct form of *remember*: *Please {{blank}} the lights before you leave; we need to do it later.*"
blanks = [["remember to switch off", "remember to turn off"]]
explanation = "Yêu cầu nhắc ai làm việc về sau dùng *remember + to V*. Hai cách nói *switch off* và *turn off* đều tự nhiên trong ngữ cảnh này."

[[questions]]
id = "cefr-b2-011"
module = "cefr-b2-grammar-plus"
type = "essay"
difficulty = 2
prompt = "Write two or three sentences about a plan that changed. Include one background action, one event that had happened earlier, and the original plan."
keywords = [["was waiting", "were waiting", "was working", "were working", "was walking", "was driving", "was sitting"], ["had left", "had finished", "had missed", "had already", "had gone", "had been"], ["was going to", "were going to", "had planned", "planned to"]]
min_keywords = 2
model_answer = '''I was waiting at the station when I realised I had left my ticket at home. I was going to take the early train, but I bought another ticket for the next one.'''
explanation = "Đoạn trả lời có nền quá khứ tiếp diễn, sự việc sớm hơn ở past perfect, và kế hoạch ban đầu với *was going to*."

[[modules]]
id = "cefr-b2-vocab"
title = "B2 · Từ vựng theo cụm và sắc thái"
description = "Collocation, phrasal verb nhiều nghĩa, word formation, thành ngữ thông dụng và những cặp từ dễ nhầm."
lesson = '''
### Học từ theo cụm
Ở B2, biết nghĩa riêng của từng từ chưa đủ; cần nhớ các từ thường đi cùng nhau. Ví dụ: *make progress*, *heavy traffic*, *reach a decision*, *raise awareness*, *take responsibility*, *meet a deadline*. Tránh dịch từng từ từ tiếng Việt: không nói *do a progress* hay *strong rain* trong các cụm này. Khi ghi từ mới, lưu cả cụm và một câu có ngữ cảnh.

### Phrasal verbs: đọc ngữ cảnh để chọn nghĩa
| Cụm | Nghĩa thường gặp | Ví dụ |
|---|---|---|
| bring up | nêu một chủ đề; nuôi dạy | *She brought up the cost at the meeting.* |
| put off | hoãn | *They put off the trip until June.* |
| take over | tiếp quản; giành quyền kiểm soát | *A new manager took over the team.* |
| find out | tìm ra / biết được thông tin | *We found out why the bus was late.* |
| turn down | từ chối; giảm âm lượng | *He turned down the offer.* |

Các cụm có thể có nhiều nghĩa, nên xác định tân ngữ và tình huống trước khi dịch. Với đại từ làm tân ngữ, một số cụm tách được: *turn it down*, không nói *turn down it*.

### Tạo từ và cặp từ dễ nhầm
Tiền tố/hậu tố thay đổi loại từ hoặc nghĩa: *rely → reliable → reliability*; *decide → decision*; *success → successful → successfully*; *possible → impossible*. Nhìn vị trí trong câu để đoán loại từ cần điền: sau *a/an/the* thường là danh từ; trước danh từ thường là tính từ; sau động từ có thể cần trạng từ.

| Từ | Dùng thường gặp | Ví dụ |
|---|---|---|
| affect | động từ: tác động đến | *Noise can affect sleep.* |
| effect | danh từ: kết quả / tác động | *The change had little effect.* |
| economic | liên quan đến nền kinh tế | *economic growth* |
| economical | tiết kiệm khi sử dụng | *an economical car* |

Thành ngữ thông dụng nên dùng đúng tình huống, không chen vào thư trang trọng nếu nghe suồng sã: *break the ice* (giúp mọi người bắt đầu trò chuyện), *under the weather* (không khoẻ), *once in a while* (thỉnh thoảng). Người Việt thường nhầm *affect/effect*, dùng sai giới từ trong collocation, hoặc thay một từ trong thành ngữ. Mẹo là tra cả cụm, ghi từ loại và tự đặt câu mới; khi chưa chắc sắc thái, chọn cách nói trực tiếp, trung tính.

### Sắc thái, register và từ vựng theo lĩnh vực
Ở B2, chọn từ dựa trên collocation, sắc thái và tình huống. *Strong evidence* tự nhiên hơn *powerful evidence* trong nhiều báo cáo; *raise an issue* thường trung tính, còn *bring up a problem* thân mật hơn. Một số cụm phổ biến: *meet a deadline, pose a risk, reach a compromise, take responsibility, draw attention to*. Phrasal verb có thể mang nhiều nghĩa: *take over a company* là tiếp quản, *bring up a topic* là nêu ra, *put off a meeting* là hoãn.
Thành ngữ thường hợp hội thoại hơn văn bản báo cáo: *on the same page* có thể dùng trong nhóm đồng nghiệp thân quen; văn bản trang trọng có thể viết *share the same understanding*. Phân biệt từ gần nghĩa theo collocation: *economic growth* nói về nền kinh tế; *economical design* tiết kiệm chi phí. Hậu tố cũng giúp xác định từ loại: *rely → reliable / reliability*; *accessible* là tính từ, *accessibility* là danh từ. Khi làm bài, xác định register và từ loại cần có trước khi chọn đáp án.
'''

