[[questions]]
id = "cefr-a1-x040"
module = "cefr-a1-reading-writing"
type = "essay"
difficulty = 3
prompt = "Write a short postcard to a friend. Say where you are, what the weather is like, and one thing you do there."
keywords = [["i am in", "i’m in", "i am at", "i’m at"], ["it is sunny", "it’s sunny", "it is warm", "it’s warm", "it is rainy", "it’s rainy", "it is raining", "it’s raining", "it is cloudy", "it’s cloudy", "it is windy", "it’s windy", "it is hot", "it’s hot", "it is cold", "it’s cold"], ["i visit", "i go to", "i eat", "i swim", "i walk", "i play", "i see", "i take photos", "i am visiting", "i’m visiting", "i am swimming", "i’m swimming"]]
min_keywords = 3
model_answer = "Hi Mai, I am in Da Nang. It is sunny and warm. I visit the beach every day. See you soon!"
explanation = "Mẫu có đủ địa điểm, thời tiết và hoạt động; cả ba nội dung đều cần có trong bưu thiếp."
