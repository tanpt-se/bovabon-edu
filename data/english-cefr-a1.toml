[[modules]]
id = "cefr-a1-functions"
title = "Giao tiếp trong tình huống quen thuộc"
description = "Luyện chào hỏi, giới thiệu, gọi món, mua đồ, hỏi đường, xin nhắc lại, cảm ơn và xin lỗi."
lesson = '''
### Chào hỏi và giới thiệu
| Tình huống | Câu thường dùng |
|---|---|
| Gặp ai đó | *Hello. / Hi. / Good morning.* |
| Hỏi tên | *What's your name?* — *I'm Mai.* |
| Giới thiệu người | *This is my friend, Nam.* |
| Tạm biệt | *Goodbye. / See you later.* |
| Cảm ơn / đáp lại | *Thank you. / Thanks.* — *You're welcome.* |
| Xin lỗi | *I'm sorry.* — *That's OK.* |

Khi mới gặp, có thể hỏi *Where are you from?* và trả lời *I'm from Vietnam.* Nếu chưa nghe rõ, nói *Sorry, can you repeat that, please?* hoặc *Can you say that again?*; những câu này lịch sự và nói rõ mình cần người kia lặp lại.

### Gọi món, mua đồ và hỏi đường
Để gọi món lịch sự, dùng *Can I have a coffee, please?* hoặc *I'd like a sandwich, please.* Người phục vụ có thể trả lời *Here you are.* Khi mua đồ, hỏi *How much is this T-shirt?*; người bán có thể nói *It's ten dollars.*

Để hỏi đường, bắt đầu bằng *Excuse me,* rồi hỏi *Where is the bank?* Chỉ đường đơn giản bằng *Go straight. Turn left/right. It's next to the school.* Nhớ tên địa điểm rõ ràng, như *the bus stop* hay *the station*.

**Lỗi hay gặp:** dịch nguyên câu tiếng Việt làm mất trật tự từ; quên *please* khi yêu cầu; nói *How much this bag?* thay vì *How much is this bag?*; trả lời *Thank you* khi người khác vừa cảm ơn mình thay vì *You're welcome*; dùng *Sorry?* nhưng không nói rõ muốn nghe lại. Mẹo: ghi nhớ cả cụm câu theo tình huống. Mở đầu bằng *Excuse me* khi cần thu hút sự chú ý; kết thúc yêu cầu bằng *please*; đáp lại lời cảm ơn bằng *You're welcome* và lời xin lỗi bằng *That's OK*.

### Mẫu câu theo tình huống
- Gọi món: *Could I have a sandwich, please?* — *Of course.*
- Hỏi giá: *How much is this?* — *It’s five dollars.*
- Hỏi đường: *Where is the station?* — *Go straight and turn left.*
- Nhờ nhắc lại: *Sorry, can you repeat that?*
- Đáp lời cảm ơn/xin lỗi: *You’re welcome* / *That’s OK.*

Trong hội thoại, chọn phản hồi đúng mục đích: câu hỏi đường cần chỉ dẫn; lời cảm ơn cần lời đáp; lời xin nhắc lại cần nhắc chậm hoặc xác nhận.'''

