[[modules]]
id = "cefr-a1-be-pronouns"
title = "To be, đại từ và sở hữu"
description = "Dùng be, have got, đại từ nhân xưng, từ sở hữu, this/that và danh từ số ít, số nhiều."
lesson = '''
### Động từ *be*
| Chủ ngữ | Khẳng định | Phủ định | Câu hỏi |
|---|---|---|---|
| I | I am (I'm) | I am not (I'm not) | Am I…? |
| you / we / they | are (you're / we're / they're) | aren't | Are you…? |
| he / she / it | is (he's / she's / it's) | isn't | Is he…? |

Đặt *am/is/are* sau chủ ngữ để nói tên, tuổi, nghề hoặc nơi ở: *I'm 18. She is a student. They are at home.* Trong câu hỏi, đưa *be* lên trước: *Are you ready?* Trả lời ngắn bằng *Yes, I am* hoặc *No, she isn't*; không lặp cả câu.

### Đại từ và sở hữu
| Chủ ngữ | Tân ngữ | Từ sở hữu + danh từ |
|---|---|---|
| I / you | me / you | my / your |
| he / she / it | him / her / it | his / her / its |
| we / they | us / them | our / their |

Chủ ngữ làm người/vật thực hiện hành động: *He is my brother. I like him.* Từ sở hữu đứng trước danh từ: *This is her bag.* Dùng *'s* với người: *Anna's brother*. *Have got* nói về sở hữu: *I have got a bike; he has got two sisters.* Hỏi *Have you got a pen?*; phủ định *haven't got / hasn't got*.

### Chỉ đồ vật và danh từ số nhiều
*This/these* chỉ vật ở gần; *that/those* chỉ vật ở xa. Dùng *this/that* với một vật, *these/those* với nhiều vật: *This is a cup. Those are my shoes.* Danh từ thường thêm *-s* (*books*), thêm *-es* sau một số âm như *box → boxes*. Một vài dạng cần nhớ: *child → children, person → people, man → men, woman → women*.

**Lỗi hay gặp:** bỏ *be* (*She very nice* → *She is very nice*); chia sai theo chủ ngữ (*They is* → *They are*); dùng *have* thay *has* với *he/she/it*; nhầm *he* với *him* sau động từ; viết *two childs* thay vì *two children*. Mẹo: tìm chủ ngữ trước, chọn đúng *be/has*, rồi kiểm tra danh từ là một hay nhiều. Với tuổi, dùng *be*: *I am 20*, không dùng *I have 20*.
'''

