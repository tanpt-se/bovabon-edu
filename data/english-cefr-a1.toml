prompt = "Thêm dấu câu phù hợp cho câu hỏi: **How are you{{blank}}**"
blanks = [["?"]]
explanation = "Câu hỏi trực tiếp kết thúc bằng dấu hỏi."

[[questions]]
id = "cefr-a1-059"
module = "cefr-a1-reading-writing"
type = "single"
difficulty = 1
prompt = "Chọn câu đúng (đại từ chủ ngữ và động từ *be*)."
options = ["I am a student.", "Me am a student.", "I is a student.", "I are a student."]
answer = [0]
explanation = "Chủ ngữ là đại từ *I* (luôn viết hoa, kể cả giữa câu), không dùng tân ngữ *me*; đi với *I* là *am*, không phải *is/are*."

[[questions]]
id = "cefr-a1-060"
module = "cefr-a1-reading-writing"
type = "essay"
difficulty = 2
prompt = "Viết 3–5 câu ngắn bằng tiếng Anh để giới thiệu tên, thành phố/quê quán và việc học hoặc nghề của em. Viết hoa đầu câu và tên riêng, dùng dấu chấm."
keywords = [["my name", "name is"], ["i am from", "i'm from"], ["i live in"], ["i am a student", "i'm a student", "i am a teacher", "i'm a teacher"]]
min_keywords = 3
model_answer = '''Hello! My name is Linh. I am from Da Nang. I live in Da Nang. I am a student.'''
explanation = "Một đoạn giới thiệu A1 có thể dùng các câu ngắn riêng biệt để nêu tên, nơi ở và việc học/nghề. Kiểm tra chữ hoa ở tên riêng và dấu chấm cuối câu."
