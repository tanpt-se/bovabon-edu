[[modules]]
id = "cefr-a1-reading-writing"
title = "Đọc và viết ngắn"
description = "Đọc biển báo, menu, tin nhắn ngắn; điền thông tin vào form và viết câu giới thiệu với chữ hoa, dấu câu cơ bản."
lesson = '''
### Đọc văn bản rất ngắn
Ở bậc A1, tập tìm thông tin nhìn thấy trực tiếp: tên, địa điểm, giờ, giá và hành động cần làm. Với biển báo, đọc từ khóa chính: *NO ENTRY* (không vào), *OPEN* (mở cửa), *CLOSED* (đóng cửa), *KEEP LEFT* (đi bên trái). Trong menu, ghép tên món với giá; trong tin nhắn, tìm người gửi, nơi gặp và thời gian.

| Văn bản | Điều cần tìm | Ví dụ |
|---|---|---|
| Biển báo | việc được phép / không được làm | *No entry.* |
| Menu | món ăn, đồ uống, giá | *Tea — $2* |
| Tin nhắn | người, nơi, giờ | *Meet me at 6.* |
| Form | đúng loại thông tin | *First name: Lan* |

Đọc câu hỏi trước, rồi dò từ khóa trong nội dung. Không cần dịch từng từ nếu câu hỏi chỉ yêu cầu tìm giá hoặc giờ. Với form, *first/given name* là tên, *family/last name* là họ; *country* là quốc gia, *city* là thành phố.

### Viết vài câu rõ ràng
Một đoạn giới thiệu A1 có thể gồm 3–5 câu: *Hello! My name is Linh. I am from Da Nang. I live in Da Nang. I am a student.* Mỗi câu thường có chủ ngữ và động từ. Viết chữ hoa ở đầu câu, với *I*, tên người, thành phố, quốc gia và ngày trong tuần. Dùng dấu chấm cho câu kể, dấu hỏi cho câu hỏi, dấu phẩy sau lời chào ngắn như *Hello, Mai.*

**Lỗi hay gặp:** viết hoa sai tên riêng (*vietnam* → *Vietnam*); quên viết hoa *I*; dùng dấu chấm thay dấu hỏi; nối nhiều ý thành một câu dài; điền họ vào ô first name. Mẹo: sau khi viết, kiểm tra từng câu theo thứ tự: chữ đầu đã viết hoa chưa, có chủ ngữ và động từ chưa, cuối câu có dấu phù hợp chưa? Khi điền form, đối chiếu đúng nhãn của từng ô trước khi chép thông tin.

### Biểu mẫu và văn bản ngắn
Khi đọc biển báo, lịch, menu hoặc tin nhắn, tìm tên, ngày, giờ, giá và hành động được yêu cầu; chỉ trả lời điều văn bản thực sự nói. Trên biểu mẫu, phân biệt *first name* và *family name*, điền số điện thoại/email đúng trường. Tin nhắn 3–5 câu có thể gồm lời chào, thông tin chính và lời kết. Viết hoa tên/ngày; dùng dấu chấm cho câu kể và dấu hỏi cho câu hỏi. Đọc hội thoại bằng chữ không thay thế nghe/nói có âm thanh.'''

