[[modules]]
id = "cefr-a1-present-simple"
title = "Thói quen và hành động đang diễn ra"
description = "Dùng hiện tại đơn, trạng từ tần suất, can, câu mệnh lệnh, like + V-ing và hiện tại tiếp diễn cơ bản."
lesson = '''
### Hiện tại đơn: thói quen và điều thường đúng
| Chủ ngữ | Khẳng định | Phủ định | Câu hỏi |
|---|---|---|---|
| I / you / we / they | work | don't work | Do they work? |
| he / she / it | works | doesn't work | Does she work? |

Thêm **-s** với phần lớn động từ ở ngôi thứ ba số ít: *read → reads*. Thêm **-es** sau một số đuôi như *watch → watches, go → goes*; phụ âm + *y* đổi thành *-ies*: *study → studies*. Sau *does/doesn't*, động từ trở về nguyên mẫu: *Does he play? He doesn't play.*

### Tần suất, khả năng và yêu cầu
*Always, usually, often, sometimes, never* thường đứng trước động từ thường: *I usually walk to school.* Với *be*, trạng từ đứng sau: *She is always kind.* *Can* + động từ nguyên mẫu nói về khả năng hoặc xin phép: *I can swim. Can I sit here?* Không thêm *to* hay *-s*: *He can cook.* Mệnh lệnh dùng động từ nguyên mẫu: *Open the door, please.* Thêm *don't* để yêu cầu không làm: *Don't run.* Dùng *Let's + động từ* để rủ nhau: *Let's eat.*

### Sở thích và việc đang diễn ra
Sau *like/love/hate*, có thể dùng danh từ hoặc động từ *-ing*: *I like music. He likes cooking.* Hiện tại tiếp diễn nói về việc đang xảy ra: **am/is/are + V-ing** — *They are playing now.* Một số động từ đổi cách viết: *make → making, run → running*.

**Lỗi hay gặp:** quên *-s* (*She work* → *She works*); thêm *-s* sau *does* (*Does she works?* → *Does she work?*); dùng *am/is/are* cho mọi câu (*I am go*); đặt *usually* sai vị trí; nói *like read* thay vì *like reading*; bỏ *be* trong câu tiếp diễn. Mẹo: hỏi đây là thói quen hay việc đang xảy ra? Thói quen dùng hiện tại đơn; “now/look!” thường gợi ý hiện tại tiếp diễn. Sau *can*, *do/does*, *don't/doesn't* luôn dùng động từ nguyên mẫu.

### Khả năng, mệnh lệnh và sở thích
*Can/can’t + động từ nguyên mẫu* diễn tả khả năng hoặc xin phép: *Can I sit here?* — *Yes, you can.* Mệnh lệnh dùng động từ nguyên mẫu (*Please write your name*); phủ định dùng *Don’t + động từ*. *Let’s + động từ* rủ cùng làm. Sau *like/love/hate* có thể dùng danh từ hoặc V-ing (*I like music; I like reading*).

### Hiện tại tiếp diễn
Dùng *am/is/are + V-ing* cho việc đang diễn ra hoặc tình huống tạm thời: *She is talking now.* Đa số động từ trạng thái như *know* và *like* không dùng ở dạng này. Chọn đúng *be* theo chủ ngữ, rồi giữ động từ chính ở dạng *-ing*.'''

