[[modules]]
id = "cefr-a1-vocab-everyday"
title = "Từ vựng hằng ngày"
description = "Ôn số, ngày giờ, giá tiền, gia đình, nghề nghiệp, nhà cửa, đồ ăn, quần áo, địa điểm thành phố và đánh vần."
lesson = '''
### Thông tin số, ngày giờ và tiền
| Chủ đề | Mẫu / ví dụ |
|---|---|
| Số | one, two, three…; ten, twenty, thirty |
| Ngày | Monday, Tuesday…; *a week* có seven days |
| Giờ | 8:00 = eight o'clock; 8:15 = quarter past eight |
| Giá | $3 = three dollars; $3.50 = three dollars and fifty cents |
| Đánh vần | *book*: B-O-O-K; *name*: N-A-M-E |

Khi hỏi giá, dùng *How much is this bag?*; khi nói giá, có thể đọc cả đơn vị tiền. Đọc số điện thoại từng chữ số sẽ dễ nghe hơn đọc thành một số lớn. Khi hỏi tên, có thể nói *How do you spell your name?* rồi đọc từng chữ cái.

### Người, nhà cửa và sinh hoạt
Từ chỉ gia đình: *mother, father, sister, brother, grandmother, grandfather*. Nghề quen thuộc: *teacher, doctor, nurse, student, cook*. Trong nhà có *kitchen, bedroom, bathroom, living room*; *kitchen* là nơi nấu ăn. Đồ ăn cơ bản: *bread, rice, egg, apple, banana, water*. Quần áo: *shirt, T-shirt, coat, dress, shoes*. Nơi trong thành phố: *school, hospital, supermarket, bus stop, train station, bank*.

Ví dụ tự nhiên: *My sister is a nurse. She works at a hospital.* · *We have bread and eggs for breakfast.* · *The bus stop is near my house.* · *This coat is twenty dollars.*

**Lỗi hay gặp:** nhầm *thirteen* với *thirty* khi nghe/đọc; quên tên ngày trong tuần viết hoa; nhầm *teacher* (nghề) với *student* (người học); dùng *wear* cho thức ăn; nhầm *house* (ngôi nhà) với *home* (nơi ở). Mẹo: học từ theo nhóm nhỏ và đặt mỗi từ vào một câu về bản thân. Với giá, nhìn ký hiệu tiền trước; khi đánh vần, viết mỗi chữ cái bằng chữ hoa và ngăn cách để dễ kiểm tra.

### Số, ngày, tiền và liên lạc
Ôn số đếm và số thứ tự để nói tuổi, giá và ngày: *the first of May; fourteen dollars*. Đọc số điện thoại thành nhóm; khi đánh vần email, nói rõ từng chữ cái và từ *at*. Quốc gia là danh từ (*Japan*), quốc tịch thường là tính từ (*Japanese*). Mở rộng từ vựng gia đình, nghề nghiệp, quần áo, thời tiết, phương tiện và địa điểm trong thành phố. Học từ theo cụm gắn với tình huống thay vì danh sách rời.'''

