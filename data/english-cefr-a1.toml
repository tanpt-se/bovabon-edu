[[modules]]
id = "cefr-a1-nouns-articles"
title = "Danh từ, mạo từ và câu hỏi cơ bản"
description = "Dùng a/an/the, some/any, danh từ đếm được và không đếm được, there is/are, giới từ và từ để hỏi."
lesson = '''
### Danh từ và mạo từ
Danh từ đếm được có dạng số ít/số nhiều: *a chair, two chairs*. Danh từ không đếm được thường không thêm *-s*: *water, rice, money*. Với danh từ đếm được số ít, thường cần một từ đứng trước.

| Từ | Cách dùng đơn giản | Ví dụ |
|---|---|---|
| a | một vật, âm đầu là phụ âm | a bag, a university |
| an | một vật, âm đầu là nguyên âm | an apple, an hour |
| the | vật cụ thể đã biết | the door, the book on my desk |

Chọn *a/an* theo **âm**, không chỉ theo chữ cái: *an hour* bắt đầu bằng âm nguyên âm, còn *a university* bắt đầu bằng âm /y/. Dùng *some* thường trong câu khẳng định và *any* thường trong câu hỏi/phủ định: *There are some eggs. Are there any eggs?*; *There isn't any milk.*

### There is/are, nơi chốn và thời gian
| Mẫu câu | Ví dụ |
|---|---|
| There is + số ít / không đếm được | There is a shop. / There is some rice. |
| There are + số nhiều | There are two chairs. |
| at + giờ; on + thứ/ngày; in + tháng/năm | at 8; on Monday; in June |
| in / on / under / next to / between | in the room; on the table; under the bed |

*There is/are* giới thiệu thứ gì đó ở đâu hoặc có bao nhiêu. *How many* hỏi số lượng danh từ đếm được số nhiều (*How many books?*); *How much* hỏi lượng không đếm được hoặc giá (*How much water? How much is it?*). Các từ hỏi cơ bản: *what* (gì), *where* (ở đâu), *when* (khi nào), *who* (ai), *how* (như thế nào), *how old*, *what time*.

**Lỗi hay gặp:** bỏ *a/an* trước danh từ số ít (*I have cat*); chọn *a/an* theo chữ viết; nói *many money* hoặc *many rice*; dùng *there are* với *milk*; nhầm *in Monday* với *on Monday*. Mẹo: xem danh từ là một vật đếm được, nhiều vật hay chất không đếm được; sau đó kiểm tra số ít/số nhiều và chọn *is/are*. Nhớ cụm thời gian *at* giờ, *on* ngày, *in* tháng.

### Lượng từ và từ nối
Dùng *some* thường trong câu khẳng định, *any* trong câu hỏi/phủ định; *some* vẫn tự nhiên trong lời mời (*Would you like some tea?*). Hỏi số lượng bằng *how many* với danh từ đếm được và *how much* với danh từ không đếm được. Tính từ đứng trước danh từ (*a small room*). Dùng *and* để thêm ý, *but* để tương phản, *or* để đưa lựa chọn, *because* để nêu lý do.

### Mốc thời gian và quá khứ của *be*
Dùng *at* với giờ, *on* với ngày, *in* với tháng/buổi. Dùng *was/were* cho trạng thái hoặc vị trí trong quá khứ: *I was at home; they were at school*.'''

