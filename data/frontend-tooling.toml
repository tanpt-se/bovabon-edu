[[questions]]
id = "frontend-tooling-lvc01"
module = "frontend-tooling-lead"
type = "code"
lang = "javascript"
difficulty = 3
tags = ["level:lead", "monorepo"]
title = "Tìm package bị ảnh hưởng trong monorepo"
prompt = '''
Viết `affectedPackages(changedFiles, packages, deps)` mô phỏng lệnh "affected" của task runner monorepo.
- `changedFiles`: mảng đường dẫn file đã đổi, ví dụ `'packages/ui/button.ts'`.
- `packages`: object `{ tenPackage: 'thuMuc' }`, ví dụ `{ ui: 'packages/ui' }`. Một file thuộc package nếu đường dẫn bắt đầu bằng `thuMuc + '/'`.
- `deps`: object `{ tenPackage: [cacPackagePhuThuoc] }` (package nào không có key thì không phụ thuộc gì).
Trả về mảng tên package (sắp xếp tăng dần theo bảng chữ cái) gồm package chứa file đổi **và mọi package phụ thuộc trực tiếp hoặc gián tiếp vào chúng**. File không thuộc package nào thì bỏ qua.
'''
starter = '''
function affectedPackages(changedFiles, packages, deps) {
  return [];
}
'''
solution = '''
function affectedPackages(changedFiles, packages, deps) {
  const result = new Set();
  for (const file of changedFiles) {
    for (const [name, dir] of Object.entries(packages)) {
      if (file.startsWith(dir + '/')) result.add(name);
    }
  }
  const dependents = {};
  for (const [name, list] of Object.entries(deps)) {
    for (const d of list) {
      (dependents[d] = dependents[d] || []).push(name);
    }
  }
  const queue = [...result];
  while (queue.length) {
    const current = queue.shift();
    for (const parent of dependents[current] || []) {
      if (!result.has(parent)) { result.add(parent); queue.push(parent); }
    }
  }
  return [...result].sort();
}
'''
tests = '''
const packages = { ui: 'packages/ui', utils: 'packages/utils', web: 'apps/web', admin: 'apps/admin', docs: 'apps/docs' };
const deps = { ui: ['utils'], web: ['ui'], admin: ['ui', 'utils'], docs: [] };
test('đổi package lá kéo theo mọi package phụ thuộc gián tiếp', () => {
  expect(affectedPackages(['packages/utils/date.ts'], packages, deps)).toEqual(['admin', 'ui', 'utils', 'web']);
});
test('đổi app chỉ ảnh hưởng chính nó', () => {
  expect(affectedPackages(['apps/docs/index.md'], packages, deps)).toEqual(['docs']);
});
test('file ngoài package bị bỏ qua', () => {
  expect(affectedPackages(['README.md', 'packages/uikit/x.ts'], packages, deps)).toEqual([]);
});
test('nhiều file, không trùng lặp và sắp xếp', () => {
