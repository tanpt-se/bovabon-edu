[[modules]]
id = "tool-tailwind"
title = "Tailwind CSS"
description = "Utility-first, responsive/state variants, theme và arbitrary values."
sources = ["tailwindcss/hover-focus-and-other-states", "tailwindcss/responsive-design", "tailwindcss/theme", "tailwindcss/detecting-classes-in-source-files"]
lesson = '''
### Utility-first và variants
Tailwind ghép utility nhỏ ngay trên markup; `flex items-center gap-4` mô tả layout mà không cần tạo một selector riêng cho mỗi component. Variant thêm điều kiện cho utility: `hover:bg-sky-700`, `focus-visible:ring-2`, `md:grid-cols-2`. Breakpoint thường theo hướng mobile-first: lớp không có tiền tố áp dụng mặc định, còn `md:` ghi đè từ breakpoint đó trở lên.

| Nhu cầu | Ví dụ | Ý nghĩa |
|---|---|---|
| Trạng thái | `disabled:opacity-50` | chỉ áp dụng khi disabled |
| Kích thước màn hình | `lg:flex` | áp dụng từ breakpoint `lg` |
| Giá trị tuỳ ý | `w-[37rem]` | giá trị không có trong thang theme |

Trong Tailwind hiện đại, theme có thể khai báo trong CSS bằng `@theme`, ví dụ `@theme { --color-brand: #06b6d4; }`, rồi dùng utility tương ứng. Trình quét lớp cần nhìn thấy tên class hoàn chỉnh trong source; nối chuỗi như `bg-` + màu runtime có thể làm CSS không được sinh. Với giá trị động, ánh xạ dữ liệu sang các chuỗi class tĩnh hoặc khai báo nguồn đầy đủ. Lỗi hay gặp: dùng `sm:` như một chế độ riêng cho màn hình nhỏ, hoặc lạm dụng arbitrary values khiến hệ thống theme mất nhất quán.
'''

[[modules]]
id = "tool-sass"
title = "Sass và CSS modules"
description = "Biến, nesting, mixin, module bằng @use/@forward và function."
sources = ["sass/variables", "sass/style-rules/parent-selector", "sass/values/mixins", "sass/at-rules/use", "sass/at-rules/forward", "sass/at-rules/function"]
lesson = '''
### Sass có cấu trúc
Sass bổ sung cú pháp và phép trừu tượng cho CSS. Biến `$space: 1rem` lưu giá trị dùng lại; nesting biểu đạt quan hệ selector, nhưng nên giữ nông để tránh selector dài và độ đặc hiệu khó kiểm soát. Mixin phù hợp với một nhóm khai báo có thể tái sử dụng hoặc nhận tham số; function tính và trả về một giá trị để dùng trong biểu thức.

| Cơ chế | Dùng khi | Lưu ý |
|---|---|---|
| `$variable` | giá trị dùng lại | scope và thứ tự định nghĩa quan trọng |
| `@mixin` / `@include` | chèn nhóm khai báo | có thể nhận tham số |
| `@function` / `@return` | tính một giá trị | không thay thế selector |
| `@use` / `@forward` | tổ chức module | namespace rõ, API được chủ động xuất |

```scss
@use "tokens" as t;
.card { padding: t.$space; }
```

`@use` tải module với namespace để tránh biến toàn cục đụng nhau; `@forward` tạo điểm xuất chung cho API của một thư mục. Dự án mới nên dùng hệ module này thay vì `@import` Sass cũ. Lỗi thường gặp là nesting sâu theo cấu trúc HTML hoặc dùng mixin để sinh quá nhiều CSS giống nhau, làm stylesheet phình to.
'''

[[modules]]
id = "tool-bundlers"
title = "Vite, webpack và dependency graph"
description = "ESM dev server, HMR, production build, env, code splitting, loader và plugin."
sources = ["vite/guide/features", "vite/guide/env-and-mode", "vite/guide/build", "webpack~5/concepts/loaders", "webpack~5/concepts/plugins", "webpack~5/guides/code-splitting"]
lesson = '''
### Phát triển và đóng gói
Vite tận dụng ESM của trình duyệt trong development để phục vụ module theo yêu cầu; dependency có thể được tối ưu trước để tương thích và giảm số request. HMR thay phần module có thể cập nhật mà không tải lại toàn trang trong nhiều trường hợp. Production build phân tích dependency graph, gom và chia output thành các asset phù hợp; chi tiết bundler nội bộ phụ thuộc phiên bản Vite.

| Khái niệm | Vai trò | Ví dụ |
|---|---|---|
| HMR | cập nhật khi dev | sửa CSS không cần reload toàn trang |
| Env | cấu hình theo mode | chỉ biến có tiền tố `VITE_` được đưa tới client |
| Dynamic import | tạo ranh giới tải bất đồng bộ | `import('./editor.js')` |
| webpack loader | biến đổi một loại module | xử lý CSS hoặc TypeScript |
| webpack plugin | mở rộng vòng đời compiler | phân tích hoặc phát asset |

Không đưa secret vào biến frontend: mọi giá trị client truy cập đều có thể bị người dùng xem. webpack thường dùng `module.rules` để gắn loader, còn plugin làm việc ở cấp compiler/compilation. Lỗi hay gặp là nhầm dev server với production server, hoặc thêm quá nhiều điểm chia chunk khiến ứng dụng phát sinh nhiều request nhỏ và chậm do overhead.
'''

[[modules]]
id = "tool-quality"
title = "ESLint, Prettier và TypeScript ESLint"
description = "Flat config, rule, parser, plugin và phân biệt lint với format."
sources = ["eslint/use/configure/configuration-files", "eslint/use/configure/rules", "eslint/extend/custom-rules", "eslint/extend/custom-rule-tutorial", "eslint/rules/no-unused-vars"]
lesson = '''
### Kiểm tra mã và định dạng
ESLint flat config hiện dùng file như `eslint.config.js` hoặc `eslint.config.mjs`, thường xuất một mảng cấu hình. Mỗi phần tử có thể giới hạn bằng `files`, đặt `languageOptions`, khai báo `plugins` và bật `rules`; thứ tự cấu hình có ý nghĩa khi nhiều phần cùng khớp một file. Rule có mức `off`, `warn` hoặc `error`, và rule tự viết có thể báo lỗi từ AST.

| Công cụ | Trọng tâm | Ví dụ |
|---|---|---|
| ESLint | vấn đề đúng/sai, quy ước | biến chưa dùng, API nguy hiểm |
| Prettier | cách trình bày | khoảng trắng, dấu phẩy |
| typescript-eslint | cú pháp/ngữ nghĩa TypeScript | parser và các rule TS |

Có thể dùng cả ESLint và Prettier: tránh bật hai công cụ để tranh nhau định dạng cùng một quy tắc. Với TypeScript, cấu hình parser/plugin phù hợp để ESLint hiểu cú pháp và chọn rule tương thích. Khi viết rule, visitor nên nhắm đúng node cần kiểm tra và trả diagnostic ổn định. Lỗi hay gặp là áp dụng parser TypeScript cho mọi file hoặc đặt cấu hình bỏ qua ở sai cấp khiến file ngoài ý muốn không được lint.
'''

[[modules]]
id = "tool-performance"
title = "Hiệu năng và cache frontend"
description = "Tree shaking, lazy loading, bundle analysis, chunk sizing và cache busting."
sources = ["webpack~5/guides/tree-shaking", "webpack~5/guides/code-splitting", "webpack~5/guides/caching", "webpack~5/configuration/output", "vite/guide/build"]
lesson = '''
### Tối ưu theo bằng chứng
Tree shaking loại bỏ export không được dùng khi bundler có thể phân tích dependency tĩnh; ESM và khai báo side effects chính xác giúp việc này hiệu quả hơn. Lazy loading bằng `import()` trì hoãn phần chỉ cần ở một route hoặc tương tác. Bundle analyzer cho thấy module nào chiếm dung lượng để ưu tiên xử lý nguyên nhân thay vì đoán.

| Kỹ thuật | Tác dụng | Đánh đổi |
|---|---|---|
| Tree shaking | bỏ code không dùng | khó hiệu quả với side effect mơ hồ |
| Lazy load | giảm tải ban đầu | có thể thêm độ trễ lúc mở tính năng |
| Chunking | tách phần tải độc lập | chunk quá nhỏ tăng overhead |
| Content hash | đổi tên khi nội dung đổi | URL mới cần được tham chiếu trong HTML/manifest |

Tên asset có content hash cho phép đặt cache dài hạn vì nội dung đổi sẽ có tên mới; HTML thường cần cache ngắn hơn để trỏ tới manifest mới. Kích thước chunk nên cân đối với đường đi người dùng và khả năng cache, không chỉ tối ưu một con số tổng. Lỗi hay gặp là tách mỗi module thành một chunk, hoặc bật cache dài hạn cho HTML mà không có cơ chế cập nhật.
'''

[[modules]]
id = "frontend-tooling-dv-layout"
title = "Tailwind layout, spacing và typography"
description = "Kết hợp Flexbox, Grid, spacing, sizing và typography để xây bố cục responsive dễ duy trì."
sources = ["tailwindcss/flex", "tailwindcss/grid-template-columns", "tailwindcss/gap", "tailwindcss/padding", "tailwindcss/font-size"]
lesson = '''
### Dựng bố cục từ utility
Tailwind cung cấp utility cho các thuộc tính CSS nền tảng. Chọn `flex` khi quan hệ giữa các phần tử chạy theo một trục và cần căn chỉnh hoặc phân bố khoảng trống; chọn `grid` khi cần định nghĩa hàng, cột và quan hệ hai chiều. `items-*` căn chỉnh trên trục chéo của flex, còn `justify-*` phân bố theo trục chính; khi đổi `flex-row` thành `flex-col`, hai trục cũng đổi theo.

| Nhu cầu | Nhóm utility | Ví dụ |
|---|---|---|
| Cột co giãn | Flexbox | `flex items-center gap-3` |
| Lưới theo breakpoint | Grid | `grid grid-cols-1 md:grid-cols-3` |
| Khoảng cách đều | Gap | `gap-4` hoặc `gap-x-6` |
| Chiều rộng nội dung | Sizing | `w-full max-w-3xl` |
| Nhịp chữ | Typography | `text-sm leading-6` |

Ví dụ danh sách thẻ: `grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3`. Utility không có breakpoint đặt bố cục mặc định; breakpoint chỉ bổ sung thay đổi từ ngưỡng tương ứng. Ưu tiên thang spacing và sizing của theme để giao diện nhất quán, chỉ dùng giá trị tuỳ ý khi có yêu cầu đo được. Lỗi hay gặp là chỉ đặt `grid-cols-*` mà quên `grid`, nhầm `items-*` với `justify-*`, hoặc thêm breakpoint dựa trên tên thiết bị thay vì lúc nội dung thực sự cần đổi bố cục. Với con flex/grid bị tràn, kiểm tra kích thước tối thiểu của nội dung và giới hạn chiều rộng trước khi thêm `overflow-hidden` để che lỗi.
'''

[[modules]]
id = "frontend-tooling-dv-sass-flow"
title = "Sass control flow và collections"
description = "Dùng list, map và directives điều kiện/vòng lặp để sinh CSS có kiểm soát."
sources = ["sass/at-rules/control/each", "sass/at-rules/control/for", "sass/at-rules/control/if", "sass/values/maps", "sass/values/lists"]
lesson = '''
### Sinh CSS từ dữ liệu Sass
Sass control flow chạy trong lúc biên dịch stylesheet. List phù hợp với một dãy giá trị có thứ tự; map lưu cặp key/value như tên token và màu. `@each` duyệt từng phần tử của list hoặc map, `@for` lặp theo dải số, còn `@if` chọn nhánh theo giá trị Sass. Chúng hữu ích khi tạo một tập utility/token có quy luật, nhưng mỗi vòng lặp thường tạo thêm CSS đầu ra.

| Cấu trúc | Dùng khi | Lưu ý |
|---|---|---|
| List + `@each` | duyệt danh sách tên hoặc giá trị | phần tử được xử lý theo thứ tự |
| Map + `@each` | ghép key với value như token | dùng `map.get` khi cần tra cứu |
| `@for ... through` | sinh dải số có cả mốc cuối | `to` không bao gồm mốc cuối |
| `@if` / `@else` | chọn CSS theo điều kiện lúc build | không phải nhánh runtime trong trình duyệt |

```scss
@use "sass:map";
$palette: (brand: #087f8c, warning: #a85d00);

@each $name, $color in $palette {
  .text-#{$name} { color: $color; }
}
```

`#{$name}` nội suy biến vào selector; biến vẫn giữ kiểu Sass trước khi được chuyển thành CSS. Dùng module có namespace rõ ràng khi gọi hàm built-in, và tổ chức token trong một điểm xuất ổn định với `@use`/`@forward`. Lỗi hay gặp là lặp trên map nhưng chỉ nhận một biến nên mất key, quên nội suy trong tên selector, hoặc tạo hàng trăm selector từ một vòng lặp không giới hạn. Hãy xác định số utility thực sự cần và kiểm tra CSS biên dịch, vì mã Sass ngắn vẫn có thể sinh đầu ra rất lớn.
'''

[[modules]]
id = "frontend-tooling-dv-graph"
title = "Dependency graph, resolver và assets"
description = "Theo dấu entry, imports, quy tắc resolve và cách bundler biến source thành asset đầu ra."
sources = ["webpack~5/concepts/dependency-graph", "webpack~5/concepts/module-resolution", "webpack~5/configuration/resolve", "webpack~5/guides/asset-modules", "vite/guide/assets", "vite/guide/dep-pre-bundling"]
lesson = '''
### Từ entry tới asset đầu ra
Bundler bắt đầu từ một hoặc nhiều entry point rồi lần theo import để tạo dependency graph. Mỗi module là một nút; quan hệ import là cạnh. Resolver quyết định một specifier như `./panel` hay `library` trỏ tới file nào dựa trên đường dẫn, package metadata, alias và cấu hình extensions. Sau đó loader hoặc transform xử lý module; asset module như CSS, ảnh hay font cũng tham gia vào quá trình build theo quy tắc của công cụ.

| Khái niệm | Vai trò | Ví dụ |
|---|---|---|
| Entry | điểm bắt đầu duyệt graph | `./src/main.js` |
| Resolver | ánh xạ specifier sang file | `resolve.extensions` |
| Static import | cạnh biết được khi phân tích | `import './theme.css'` |
| Dynamic import | ranh giới tải bất đồng bộ | `import('./editor.js')` |
| Asset import | đưa file vào pipeline | `import logo from './logo.svg'` |

Vite phục vụ module qua ESM trong development và tối ưu dependency package khi cần; khi build, import tĩnh và dynamic import giúp xác định asset hoặc chunk đầu ra. Vite cũng xử lý asset được import và asset trong `public` theo các quy tắc khác nhau. webpack cấu hình entry, resolve, module rules và output riêng, nhưng vẫn xây graph từ các dependency. Lỗi hay gặp là cho rằng một file chỉ được đóng gói nếu nó xuất hiện trong HTML, quên rằng CSS có thể import ảnh/font, hoặc tạo đường dẫn import biến thiên mà bundler không thể phân tích. Khi debug file bị thiếu, lần theo entry → import → resolver → transform/output và kiểm tra cấu hình đúng môi trường dev hay production.
'''

