[[questions]]
id = "tool-009"
module = "tool-tailwind"
type = "code"
difficulty = 3
tags = ["level:senior"]
title = "Gộp class utility đơn giản"
prompt = '''
Viết `cn(...values)` theo phạm vi sau:
- Nhận chuỗi, số khác 0, mảng lồng nhau và object; object thêm key khi value truthy. Bỏ `null`, `undefined`, boolean và số 0.
- Tách chuỗi theo khoảng trắng.
- Gộp xung đột trong các nhóm `p`, `px`, `py`, `pt`, `pr`, `pb`, `pl`, `m`, `mx`, `my`, `mt`, `mr`, `mb`, `ml`. Hai utility cùng nhóm và cùng chuỗi variant trước dấu `:` xung đột; giữ utility xuất hiện sau. Ví dụ `p-2 p-4` thành `p-4`, còn `p-4 px-2` giữ cả hai.
- Utility không thuộc các nhóm trên chỉ bị bỏ nếu trùng nguyên văn. Giữ thứ tự xuất hiện của các utility còn lại.
'''
starter = '''
function cn(...values) {
  return values.filter(Boolean).join(' ');
}
'''
solution = '''
function cn(...values) {
  const tokens = [];
  function collect(value) {
    if (!value) return;
    if (typeof value === 'string' || typeof value === 'number') {
      String(value).trim().split(/\s+/).filter(Boolean).forEach((token) => tokens.push(token));
      return;
    }
    if (Array.isArray(value)) {
      value.forEach(collect);
      return;
    }
    if (typeof value === 'object') {
      Object.keys(value).forEach((key) => {
        if (value[key]) collect(key);
      });
    }
  }
  values.forEach(collect);
  const result = [];
  const conflictIndexes = new Map();
  const exactIndexes = new Map();
  for (const token of tokens) {
    const colon = token.lastIndexOf(':');
    const variant = colon === -1 ? '' : token.slice(0, colon);
    const utility = colon === -1 ? token : token.slice(colon + 1);
    const match = utility.match(/^(!?)(p[xytrbl]?|m[xytrbl]?)-/);
    if (match) {
      const key = variant + '|' + match[1] + '|' + match[2];
      if (conflictIndexes.has(key)) result[conflictIndexes.get(key)] = null;
      conflictIndexes.set(key, result.length);
      result.push(token);
    } else {
      if (exactIndexes.has(token)) result[exactIndexes.get(token)] = null;
      exactIndexes.set(token, result.length);
      result.push(token);
    }
  }
  return result.filter((token) => token !== null).join(' ');
}
'''
tests = '''
test('giữ utility padding cuối cùng cùng nhóm', () => {
  expect(cn('p-2 p-4')).toBe('p-4');
});
test('không gộp hai trục khác nhau', () => {
  expect(cn('p-4', 'px-2')).toBe('p-4 px-2');
});
test('flatten mảng và object có điều kiện', () => {
  expect(cn(['flex', ['p-2']], { hidden: false, block: true }, 'p-4')).toBe('flex block p-4');
});
test('variant có nhóm xung đột riêng', () => {
  expect(cn('hover:p-2 p-1 hover:p-4')).toBe('p-1 hover:p-4');
});
test('bỏ giá trị rỗng và khử trùng lặp utility khác', () => {
  expect(cn(null, undefined, false, 0, 'flex flex')).toBe('flex');
});
'''
hints = ["Tách chuỗi thành token rồi duyệt cả mảng lồng nhau và object.", "Tạo khóa xung đột từ variant và nhóm utility; đánh dấu vị trí cũ trước khi thêm token mới."]
explanation = "Đây là bộ gộp có phạm vi nhóm được nêu trong đề; bộ gộp Tailwind production cần hiểu nhiều nhóm và các quan hệ xung đột phức tạp hơn."
sources = ["tailwindcss/hover-focus-and-other-states"]

