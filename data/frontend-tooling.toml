[[questions]]
id = "tool-023"
module = "tool-bundlers"
type = "code"
difficulty = 3
title = "So khớp phiên bản semver đơn giản"
prompt = '''
Viết `satisfies(version, range)` trả về boolean. Hỗ trợ version chuẩn `major.minor.patch` bằng số nguyên không âm, không có leading zero (ngoại trừ `0`), prerelease hoặc build metadata. Hỗ trợ đúng ba dạng range: `^x.y.z`, `~x.y.z`, `>=x.y.z`; đầu vào sai hoặc range không hỗ trợ trả `false`.
- `^`: phiên bản từ mốc trở lên và nhỏ hơn phiên bản kế tiếp theo quy tắc caret: tăng major nếu major > 0; nếu major = 0 và minor > 0 thì tăng minor; nếu cả hai bằng 0 thì tăng patch.
- `~`: từ mốc trở lên nhưng nhỏ hơn `x.(y+1).0`.
- `>=`: từ mốc trở lên, không có cận trên.
'''
starter = '''
function satisfies(version, range) {
  return version === range;
}
'''
solution = '''
function satisfies(version, range) {
  function parse(value) {
    if (typeof value !== 'string' || !/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(value)) return null;
    return value.split('.').map(Number);
  }
  function compare(a, b) {
    for (let i = 0; i < 3; i++) {
      if (a[i] < b[i]) return -1;
      if (a[i] > b[i]) return 1;
    }
    return 0;
  }
  if (typeof range !== 'string') return false;
  const match = range.match(/^(\^|~|>=)(.+)$/);
  if (!match) return false;
  const current = parse(version);
  const floor = parse(match[2]);
  if (!current || !floor || compare(current, floor) < 0) return false;
  if (match[1] === '>=') return true;
  let ceiling;
  if (match[1] === '~') {
    ceiling = [floor[0], floor[1] + 1, 0];
  } else if (floor[0] > 0) {
    ceiling = [floor[0] + 1, 0, 0];
  } else if (floor[1] > 0) {
    ceiling = [0, floor[1] + 1, 0];
  } else {
    ceiling = [0, 0, floor[2] + 1];
  }
  return compare(current, ceiling) < 0;
}
'''
tests = '''
test('caret cho phép cập nhật minor trong major khác 0', () => {
  expect(satisfies('1.9.0', '^1.2.3')).toBe(true);
  expect(satisfies('2.0.0', '^1.2.3')).toBe(false);
});
test('caret theo quy tắc major zero', () => {
  expect(satisfies('0.2.9', '^0.2.3')).toBe(true);
  expect(satisfies('0.3.0', '^0.2.3')).toBe(false);
});
test('caret 0.0 chỉ cho phép thay patch', () => {
  expect(satisfies('0.0.4', '^0.0.3')).toBe(false);
  expect(satisfies('0.0.3', '^0.0.3')).toBe(true);
});
test('tilde giữ major và minor', () => {
  expect(satisfies('1.2.9', '~1.2.3')).toBe(true);
  expect(satisfies('1.3.0', '~1.2.3')).toBe(false);
});
test('>= không có cận trên', () => {
  expect(satisfies('3.0.0', '>=1.2.3')).toBe(true);
  expect(satisfies('1.2.2', '>=1.2.3')).toBe(false);
});
test('range và version lỗi trả false', () => {
  expect(satisfies('01.2.3', '^1.2.3')).toBe(false);
  expect(satisfies('1.2.3', '*')).toBe(false);
});
'''
hints = ["Tách hàm parse, so sánh ba thành phần và chọn ceiling theo operator.", "Cận trên của caret phụ thuộc vào thành phần khác 0 đầu tiên."]
explanation = "Đây là bộ so khớp con cho ba operator được nêu, không thay thế thư viện semver đầy đủ với prerelease, wildcard, union hoặc peer dependency."
sources = ["vite/guide/env-and-mode"]

[[questions]]
id = "tool-024"
module = "tool-bundlers"
type = "code"
difficulty = 3
title = "Sắp xếp đồ thị import"
prompt = '''
Viết `topoSort(graph)` để sắp xếp module theo thứ tự dependency trước importer. `graph` là object ánh xạ tên module tới mảng tên module mà nó import. Module chỉ xuất hiện ở danh sách import được xem là node lá không có dependency. Không cần giữ thứ tự từ điển nhưng kết quả phải ổn định theo thứ tự duyệt input. Bỏ import trùng trong cùng một danh sách. Nếu có chu trình, ném `Error('cycle')`.
Ví dụ `{ app: ['ui'], ui: ['tokens'], tokens: [] }` phải đặt `tokens` trước `ui`, và `ui` trước `app`.
'''
starter = '''
function topoSort(graph) {
  return Object.keys(graph);
}
'''
solution = '''
function topoSort(graph) {
  const nodes = Object.keys(graph);
  const known = new Set(nodes);
  for (const node of nodes) {
    const deps = Array.isArray(graph[node]) ? graph[node] : [];
    for (const dep of deps) {
      if (!known.has(dep)) {
        known.add(dep);
        nodes.push(dep);
      }
    }
  }
  const remaining = new Map();
  const dependents = new Map();
  for (const node of nodes) dependents.set(node, []);
  for (const node of nodes) {
    const deps = Array.isArray(graph[node]) ? Array.from(new Set(graph[node])) : [];
    remaining.set(node, deps.length);
    for (const dep of deps) dependents.get(dep).push(node);
  }
  const queue = nodes.filter((node) => remaining.get(node) === 0);
  const result = [];
  for (let i = 0; i < queue.length; i++) {
    const node = queue[i];
    result.push(node);
    for (const parent of dependents.get(node)) {
      const count = remaining.get(parent) - 1;
      remaining.set(parent, count);
      if (count === 0) queue.push(parent);
    }
  }
  if (result.length !== nodes.length) throw new Error('cycle');
  return result;
}
'''
tests = '''
test('dependency xuất hiện trước importer', () => {
  const order = topoSort({ app: ['ui'], ui: ['tokens'], tokens: [] });
  expect(order.indexOf('tokens') < order.indexOf('ui')).toBe(true);
  expect(order.indexOf('ui') < order.indexOf('app')).toBe(true);
});
test('node chỉ xuất hiện ở danh sách import được thêm vào kết quả', () => {
  const order = topoSort({ app: ['vendor'] });
  expect(order).toHaveLength(2);
  expect(order[0]).toBe('vendor');
});
test('import trùng chỉ tính một dependency', () => {
  expect(topoSort({ app: ['lib', 'lib'], lib: [] })).toEqual(['lib', 'app']);
});
test('đồ thị rỗng cho mảng rỗng', () => {
  expect(topoSort({})).toEqual([]);
});
test('phát hiện chu trình', () => {
  expect(() => topoSort({ a: ['b'], b: ['a'] })).toThrow('cycle');
});
'''
hints = ["Đếm dependency chưa được xử lý cho mỗi node.", "Xây danh sách importer của từng dependency rồi dùng queue các node không còn dependency."]
explanation = "Kahn's algorithm chạy trong O(V + E); nếu số node đã xuất không bằng tổng node thì phần còn lại có chu trình."
sources = ["webpack~5/concepts/dependency-graph"]

