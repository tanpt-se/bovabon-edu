[[questions]]
id = "frontend-tooling-lvc03"
module = "tool-bundlers"
type = "code"
lang = "javascript"
difficulty = 2
tags = ["level:middle", "env"]
title = "Lọc biến môi trường cho client"
prompt = '''
Viết `clientEnv(text, prefix = 'VITE_')` nhận nội dung file `.env` và trả về object chỉ gồm biến có tên bắt đầu bằng `prefix` (giữ nguyên tên).
Quy tắc phân tích mỗi dòng:
- Bỏ dòng trống và dòng bắt đầu bằng `#` (sau khi trim).
- Tách tại dấu `=` **đầu tiên**; trim cả tên và giá trị. Dòng không có `=` thì bỏ qua.
- Nếu giá trị được bọc trong cặp `"..."` hoặc `'...'` thì bỏ cặp ngoặc đó.
- Biến khai báo sau ghi đè biến trước.
'''
starter = '''
function clientEnv(text, prefix = 'VITE_') {
  return {};
}
'''
solution = '''
function clientEnv(text, prefix = 'VITE_') {
  const out = {};
  for (const raw of text.split('\n')) {
    const line = raw.trim();
    if (!line || line.startsWith('#')) continue;
    const i = line.indexOf('=');
    if (i === -1) continue;
    const key = line.slice(0, i).trim();
    let value = line.slice(i + 1).trim();
    if (value.length >= 2 && (value[0] === '"' || value[0] === "'") && value[value.length - 1] === value[0]) {
      value = value.slice(1, -1);
    }
    if (key.startsWith(prefix)) out[key] = value;
  }
  return out;
}
'''
tests = '''
test('chỉ giữ biến có tiền tố', () => {
  expect(clientEnv('VITE_API=https://api.test\nDB_PASSWORD=secret')).toEqual({ VITE_API: 'https://api.test' });
});
test('bỏ comment, dòng trống và dòng không có dấu bằng', () => {
  expect(clientEnv('# comment\n\nVITE_A=1\nVITE_BROKEN\n  # indent comment')).toEqual({ VITE_A: '1' });
});
test('tách tại dấu bằng đầu tiên và bỏ ngoặc', () => {
  expect(clientEnv('VITE_Q="a=b"\nVITE_S=\'x y\'')).toEqual({ VITE_Q: 'a=b', VITE_S: 'x y' });
});
test('biến sau ghi đè biến trước', () => {
  expect(clientEnv('VITE_MODE=dev\nVITE_MODE=prod')).toEqual({ VITE_MODE: 'prod' });
});
test('prefix tuỳ chỉnh', () => {
  expect(clientEnv('PUBLIC_X=1\nVITE_Y=2', 'PUBLIC_')).toEqual({ PUBLIC_X: '1' });
});
'''
hints = ["Dùng `indexOf('=')` thay vì `split('=')` để giữ được dấu bằng trong giá trị.", "Chỉ bỏ ngoặc khi ký tự đầu và cuối là cùng một loại ngoặc."]
explanation = "Lọc theo tiền tố là hàng rào để biến nhạy cảm không vô tình bị nhúng vào bundle client — thứ mà ai cũng có thể đọc."
sources = ["vite/guide/env-and-mode"]

[[questions]]
id = "frontend-tooling-lvc04"
module = "tool-quality"
type = "code"
lang = "javascript"
difficulty = 2
tags = ["level:middle", "dependency"]
title = "Kiểm tra caret range"
prompt = '''
Viết `satisfiesCaret(range, version)` kiểm tra phiên bản `x.y.z` có thoả range dạng `^a.b.c` không (theo quy ước semver của npm, bỏ qua pre-release):
- Nếu `a > 0`: thoả khi major bằng `a` và phiên bản ≥ `a.b.c`.
- Nếu `a === 0` và `b > 0`: thoả khi major = 0, minor bằng `b` và patch ≥ `c`.
- Nếu `a === 0` và `b === 0`: chỉ thoả khi đúng bằng `0.0.c`.
Trả về `true`/`false`.
'''
starter = '''
function satisfiesCaret(range, version) {
  return range.slice(1) === version;
}
'''
solution = '''
function satisfiesCaret(range, version) {
  const [a, b, c] = range.slice(1).split('.').map(Number);
  const [x, y, z] = version.split('.').map(Number);
  if (a > 0) {
    if (x !== a) return false;
    if (y !== b) return y > b;
    return z >= c;
  }
  if (b > 0) return x === 0 && y === b && z >= c;
  return x === 0 && y === 0 && z === c;
}
'''
tests = '''
test('major > 0 cho phép minor và patch cao hơn', () => {
  expect(satisfiesCaret('^1.2.3', '1.9.0')).toBe(true);
  expect(satisfiesCaret('^1.2.3', '1.2.10')).toBe(true);
});
test('major > 0 không cho major mới hoặc bản thấp hơn', () => {
  expect(satisfiesCaret('^1.2.3', '2.0.0')).toBe(false);
  expect(satisfiesCaret('^1.2.3', '1.2.2')).toBe(false);
  expect(satisfiesCaret('^1.2.3', '1.1.9')).toBe(false);
});
test('0.x khoá theo minor', () => {
  expect(satisfiesCaret('^0.3.1', '0.3.5')).toBe(true);
  expect(satisfiesCaret('^0.3.1', '0.4.0')).toBe(false);
});
test('0.0.x khoá đúng patch', () => {
  expect(satisfiesCaret('^0.0.4', '0.0.4')).toBe(true);
  expect(satisfiesCaret('^0.0.4', '0.0.5')).toBe(false);
});
test('so sánh số chứ không so sánh chuỗi', () => {
  expect(satisfiesCaret('^2.9.0', '2.10.0')).toBe(true);
});
'''
hints = ["Tách chuỗi thành số bằng `split('.').map(Number)` để `10 > 9` đúng.", "Xử lý ba trường hợp theo major/minor của range: `a > 0`, `a = 0, b > 0`, `a = b = 0`."]
explanation = "Hiểu caret range giúp đọc lockfile và giải thích vì sao một lần cài mới kéo về bản minor khác; với 0.x, npm coi minor là ranh giới có thể breaking."
sources = ["webpack~5/guides/dependency-management"]

