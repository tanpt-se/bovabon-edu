[[questions]]
id = "frontend-tooling-lvc02"
module = "tool-performance"
type = "code"
lang = "javascript"
difficulty = 3
tags = ["level:senior", "tree-shaking"]
title = "Tìm export không được dùng"
prompt = '''
Viết `unusedExports(modules, entry)` mô phỏng bước đánh dấu của tree-shaking.
- `modules`: object `{ ten: { exports: [...], imports: { tenModule: [cacTenImport] } } }`.
- Bắt đầu từ `entry`, một module **được dùng** nếu có thể đi tới từ entry qua `imports`. Một export là **đã dùng** nếu ít nhất một module được dùng import tên đó.
- Trả về object chỉ gồm các module được dùng (trừ entry) có export không dùng: `{ ten: [cacExportKhongDung] }`, giữ thứ tự trong `exports`. Module không đi tới được thì bỏ qua (sẽ bị loại toàn bộ). Module được dùng mà mọi export đều dùng thì không xuất hiện.
'''
starter = '''
function unusedExports(modules, entry) {
  return {};
}
'''
solution = '''
function unusedExports(modules, entry) {
  const reached = new Set();
  const used = {};
  const stack = [entry];
  while (stack.length) {
    const name = stack.pop();
    if (reached.has(name)) continue;
    reached.add(name);
    const imports = (modules[name] && modules[name].imports) || {};
    for (const [dep, names] of Object.entries(imports)) {
      (used[dep] = used[dep] || new Set());
      for (const n of names) used[dep].add(n);
      stack.push(dep);
    }
  }
  const result = {};
  for (const name of Object.keys(modules)) {
    if (name === entry || !reached.has(name)) continue;
    const set = used[name] || new Set();
    const unused = modules[name].exports.filter((e) => !set.has(e));
    if (unused.length) result[name] = unused;
  }
  return result;
}
'''
tests = '''
const modules = {
  main: { exports: [], imports: { utils: ['format'], ui: ['Button'] } },
  utils: { exports: ['format', 'parse', 'debounce'], imports: {} },
  ui: { exports: ['Button', 'Modal'], imports: { utils: ['debounce'] } },
  legacy: { exports: ['old'], imports: { utils: ['parse'] } },
};
test('đánh dấu export không dùng của module đi tới được', () => {
  expect(unusedExports(modules, 'main')).toEqual({ utils: ['parse'], ui: ['Modal'] });
});
test('import từ module không đi tới được không tính là dùng', () => {
  expect(unusedExports(modules, 'main').utils).toEqual(['parse']);
});
test('module dùng hết export không xuất hiện', () => {
  const m = { app: { exports: [], imports: { a: ['x'] } }, a: { exports: ['x'], imports: {} } };
  expect(unusedExports(m, 'app')).toEqual({});
});
test('entry khác thay đổi kết quả', () => {
  expect(unusedExports(modules, 'legacy')).toEqual({ utils: ['format', 'debounce'] });
});
test('chu trình import không lặp vô hạn', () => {
  const m = { app: { exports: [], imports: { a: ['x'] } }, a: { exports: ['x', 'y'], imports: { b: ['z'] } }, b: { exports: ['z', 'w'], imports: { a: ['x'] } } };
  expect(unusedExports(m, 'app')).toEqual({ a: ['y'], b: ['w'] });
});
'''
hints = ["Bước 1: duyệt từ entry để biết module nào đi tới được; đồng thời gom các tên được import cho từng module.", "Bước 2: với mỗi module đi tới được (trừ entry), lọc `exports` không nằm trong tập đã dùng; dùng tập `reached` để tránh lặp vô hạn."]
explanation = "Tree-shaking thật còn phải xét side effect và re-export, nhưng lõi là đánh dấu từ entry: module không đi tới được bị loại, export không ai import bị bỏ khi minify."
sources = ["webpack~5/guides/tree-shaking"]

