[[questions]]
id = "tool-031"
module = "tool-quality"
type = "code"
difficulty = 3
tags = ["level:senior"]
title = "Rule AST không dùng console.log"
prompt = '''
Viết `findConsoleLog(ast)` cho một AST object đơn giản. Node có thể chứa object con hoặc mảng node. Phát hiện mỗi `CallExpression` có `callee` là `MemberExpression` dạng `console.log`, trong đó `object` và `property` là `Identifier`, và `computed` không phải `true`. Trả về một diagnostic cho mỗi lần gọi, theo thứ tự duyệt preorder:
`{ ruleId: 'no-console-log', message: 'Avoid console.log', nodeType: 'CallExpression' }`.
Bỏ qua `parent`, `loc` và `tokens` khi duyệt vì chúng không thuộc cây cú pháp cần xét. Không sửa AST.
'''
starter = '''
function findConsoleLog(ast) {
  return [];
}
'''
solution = '''
function findConsoleLog(ast) {
  const diagnostics = [];
  const seen = new Set();
  function visit(value) {
    if (!value || typeof value !== 'object' || seen.has(value)) return;
    seen.add(value);
    if (Array.isArray(value)) {
      value.forEach(visit);
      return;
    }
    const callee = value.callee;
    if (
      value.type === 'CallExpression' &&
      callee && callee.type === 'MemberExpression' &&
      callee.computed !== true &&
      callee.object && callee.object.type === 'Identifier' && callee.object.name === 'console' &&
      callee.property && callee.property.type === 'Identifier' && callee.property.name === 'log'
    ) {
      diagnostics.push({ ruleId: 'no-console-log', message: 'Avoid console.log', nodeType: 'CallExpression' });
    }
    for (const key of Object.keys(value)) {
      if (key !== 'parent' && key !== 'loc' && key !== 'tokens') visit(value[key]);
    }
  }
  visit(ast);
  return diagnostics;
}
'''
tests = '''
const consoleCall = (name) => ({
  type: 'CallExpression',
  callee: {
    type: 'MemberExpression',
    computed: false,
    object: { type: 'Identifier', name: 'console' },
    property: { type: 'Identifier', name }
  },
  arguments: []
});
test('phát hiện console.log', () => {
  expect(findConsoleLog(consoleCall('log'))).toEqual([
    { ruleId: 'no-console-log', message: 'Avoid console.log', nodeType: 'CallExpression' }
  ]);
});
test('bỏ qua console.error và lời gọi log trực tiếp', () => {
  expect(findConsoleLog({ type: 'Program', body: [consoleCall('error'), { type: 'CallExpression', callee: { type: 'Identifier', name: 'log' } }] })).toEqual([]);
});
test('duyệt node lồng trong object và array', () => {
  const ast = { type: 'Program', body: [{ type: 'ExpressionStatement', expression: consoleCall('log') }] };
  expect(findConsoleLog(ast)).toHaveLength(1);
});
test('bỏ qua thuộc tính metadata', () => {
  const ast = { type: 'Program', body: [], loc: consoleCall('log') };
  expect(findConsoleLog(ast)).toEqual([]);
});
test('không lặp node được tham chiếu nhiều lần', () => {
  const call = consoleCall('log');
  expect(findConsoleLog({ type: 'Program', body: [call, call] })).toHaveLength(1);
});
'''
hints = ["Duyệt đệ quy object và array nhưng dùng Set để tránh node lặp.", "Kiểm tra cấu trúc callee qua các type Identifier và MemberExpression."]
explanation = "Rule thực tế của ESLint thường trả context.report trong visitor; bài này mô phỏng việc nhận diện AST và tạo diagnostic thuần để dễ kiểm thử."
sources = ["eslint/extend/custom-rules", "eslint/extend/custom-rule-tutorial"]

