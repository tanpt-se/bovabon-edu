[[questions]]
id = "frontend-tooling-lvc05"
module = "tool-performance"
type = "code"
lang = "javascript"
difficulty = 1
tags = ["level:junior", "cache-busting"]
title = "Gắn hash vào tên file"
prompt = '''
Viết `hashedName(fileName, hash)` chèn hash trước phần mở rộng **cuối cùng** của tên file, giống cách bundler đặt tên asset:
- `hashedName('app.js', 'a1b2')` → `'app.a1b2.js'`
- `hashedName('vendor.min.js', 'ff')` → `'vendor.min.ff.js'`
- File không có phần mở rộng: nối `.hash` vào cuối, ví dụ `hashedName('LICENSE', '9')` → `'LICENSE.9'`.
- Chỉ xét tên file (không có thư mục). Tên bắt đầu bằng dấu chấm như `.env` coi như không có phần mở rộng.
'''
starter = '''
function hashedName(fileName, hash) {
  return fileName;
}
'''
solution = '''
function hashedName(fileName, hash) {
  const i = fileName.lastIndexOf('.');
  if (i <= 0) return fileName + '.' + hash;
  return fileName.slice(0, i) + '.' + hash + fileName.slice(i);
}
'''
tests = '''
test('chèn hash trước phần mở rộng', () => {
  expect(hashedName('app.js', 'a1b2')).toBe('app.a1b2.js');
});
test('dùng phần mở rộng cuối cùng', () => {
  expect(hashedName('vendor.min.js', 'ff')).toBe('vendor.min.ff.js');
});
test('không có phần mở rộng', () => {
  expect(hashedName('LICENSE', '9')).toBe('LICENSE.9');
});
test('file ẩn bắt đầu bằng dấu chấm', () => {
  expect(hashedName('.env', 'x')).toBe('.env.x');
});
test('file CSS', () => {
  expect(hashedName('style.css', '3f9a')).toBe('style.3f9a.css');
});
'''
hints = ["`lastIndexOf('.')` cho vị trí dấu chấm cuối cùng.", "Vị trí 0 (file ẩn) hoặc -1 (không có dấu chấm) đều xử lý như không có phần mở rộng."]
explanation = "Content hash trong tên file là nền tảng của cache dài hạn: nội dung đổi thì tên đổi, trình duyệt tự tải bản mới."
sources = ["webpack~5/guides/caching", "webpack~5/configuration/output"]
