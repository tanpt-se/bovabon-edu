[[questions]]
id = "tool-023"
module = "tool-bundlers"
type = "code"
difficulty = 3
tags = ["level:senior"]
title = "So khớp phiên bản semver đơn giản"
prompt = '''
Viết `satisfies(version, range)` trả về boolean. Hỗ trợ version chuẩn `major.minor.patch` bằng số nguyên không âm, không có leading zero (ngoại trừ `0`), prerelease hoặc build metadata. Hỗ trợ đúng ba dạng range: `^x.y.z`, `~x.y.z`, `>=x.y.z`; đầu vào sai hoặc range không hỗ trợ trả `false`.
- `^`: phiên bản từ mốc trở lên và nhỏ hơn phiên bản kế tiếp theo quy tắc caret: tăng major nếu major > 0; nếu major = 0 và minor > 0 thì tăng minor; nếu cả hai bằng 0 thì tăng patch.
- `~`: từ mốc trở lên nhưng nhỏ hơn `x.(y+1).0`.
- `>=`: từ mốc trở lên, không có cận trên.
'''
starter = '''
function satisfies(version, range) {
  return version === range;
}
'''
solution = '''
function satisfies(version, range) {
  function parse(value) {
    if (typeof value !== 'string' || !/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(value)) return null;
    return value.split('.').map(Number);
  }
  function compare(a, b) {
    for (let i = 0; i < 3; i++) {
      if (a[i] < b[i]) return -1;
      if (a[i] > b[i]) return 1;
    }
    return 0;
  }
  if (typeof range !== 'string') return false;
  const match = range.match(/^(\^|~|>=)(.+)$/);
  if (!match) return false;
  const current = parse(version);
  const floor = parse(match[2]);
  if (!current || !floor || compare(current, floor) < 0) return false;
  if (match[1] === '>=') return true;
  let ceiling;
  if (match[1] === '~') {
    ceiling = [floor[0], floor[1] + 1, 0];
  } else if (floor[0] > 0) {
    ceiling = [floor[0] + 1, 0, 0];
  } else if (floor[1] > 0) {
    ceiling = [0, floor[1] + 1, 0];
  } else {
    ceiling = [0, 0, floor[2] + 1];
  }
  return compare(current, ceiling) < 0;
}
'''
tests = '''
test('caret cho phép cập nhật minor trong major khác 0', () => {
  expect(satisfies('1.9.0', '^1.2.3')).toBe(true);
  expect(satisfies('2.0.0', '^1.2.3')).toBe(false);
});
test('caret theo quy tắc major zero', () => {
  expect(satisfies('0.2.9', '^0.2.3')).toBe(true);
  expect(satisfies('0.3.0', '^0.2.3')).toBe(false);
});
test('caret 0.0 chỉ cho phép thay patch', () => {
  expect(satisfies('0.0.4', '^0.0.3')).toBe(false);
  expect(satisfies('0.0.3', '^0.0.3')).toBe(true);
});
test('tilde giữ major và minor', () => {
  expect(satisfies('1.2.9', '~1.2.3')).toBe(true);
  expect(satisfies('1.3.0', '~1.2.3')).toBe(false);
});
test('>= không có cận trên', () => {
  expect(satisfies('3.0.0', '>=1.2.3')).toBe(true);
  expect(satisfies('1.2.2', '>=1.2.3')).toBe(false);
});
test('range và version lỗi trả false', () => {
  expect(satisfies('01.2.3', '^1.2.3')).toBe(false);
  expect(satisfies('1.2.3', '*')).toBe(false);
});
'''
hints = ["Tách hàm parse, so sánh ba thành phần và chọn ceiling theo operator.", "Cận trên của caret phụ thuộc vào thành phần khác 0 đầu tiên."]
