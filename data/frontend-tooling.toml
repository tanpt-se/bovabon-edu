[[questions]]
id = "frontend-tooling-dvc01"
module = "frontend-tooling-dv-graph"
type = "code"
lang = "javascript"
difficulty = 3
tags = ["level:senior"]
title = "Sắp xếp module theo dependency"
prompt = '''
Viết `orderModules(graph)` với `graph` là object có dạng `{ moduleName: [dependencyName, ...] }`. Trả về mảng tên module theo thứ tự dependency xuất hiện trước module sử dụng nó. Duyệt các key gốc theo thứ tự trong object và dependency theo thứ tự trong mảng để kết quả ổn định; mỗi module chỉ xuất hiện một lần. Ví dụ `{ app: ['view'], view: ['utils'], utils: [] }` có thể trả `['utils', 'view', 'app']`.
Nếu một dependency không có key tương ứng trong graph, ném `Error` có thông điệp bắt đầu bằng `Unknown dependency`. Nếu graph có chu trình, ném `Error('Dependency cycle')`. Graph đầu vào có cấu trúc hợp lệ; không cần xử lý loại dữ liệu khác.
'''
starter = '''
function orderModules(graph) {
  return Object.keys(graph);
}
'''
solution = '''
function orderModules(graph) {
  const states = new Map();
  const order = [];
  function visit(name) {
    if (!Object.prototype.hasOwnProperty.call(graph, name)) {
      throw new Error('Unknown dependency: ' + name);
    }
    const state = states.get(name);
    if (state === 1) throw new Error('Dependency cycle');
    if (state === 2) return;
    states.set(name, 1);
    for (const dependency of graph[name]) visit(dependency);
    states.set(name, 2);
    order.push(name);
  }
  for (const name of Object.keys(graph)) visit(name);
  return order;
}
'''
tests = '''
test('dependency nằm trước module sử dụng nó', () => {
  expect(orderModules({ app: ['view'], view: ['utils'], utils: [] })).toEqual(['utils', 'view', 'app']);
});
test('giữ thứ tự ổn định cho các module độc lập', () => {
  expect(orderModules({ first: [], second: [], third: [] })).toEqual(['first', 'second', 'third']);
});
test('diamond dependency chỉ xuất hiện một lần', () => {
  expect(orderModules({ app: ['left', 'right'], left: ['shared'], right: ['shared'], shared: [] })).toEqual(['shared', 'left', 'right', 'app']);
});
test('graph rỗng trả mảng rỗng', () => {
  expect(orderModules({})).toEqual([]);
});
test('dependency không tồn tại báo lỗi', () => {
  expect(() => orderModules({ app: ['missing'] })).toThrow('Unknown dependency');
});
test('chu trình báo lỗi', () => {
  expect(() => orderModules({ a: ['b'], b: ['a'] })).toThrow('Dependency cycle');
});
'''
hints = ["Dùng DFS với ba trạng thái: chưa thăm, đang thăm và đã hoàn tất.", "Thêm module vào kết quả sau khi duyệt xong dependencies; trạng thái đang thăm giúp nhận ra chu trình."]
explanation = "Topological ordering mô phỏng một phần việc sắp xếp dependency trong bundler; build thực tế còn xử lý chunk, side effects và asset emit."
sources = ["webpack~5/concepts/dependency-graph", "webpack~5/concepts/module-resolution"]

