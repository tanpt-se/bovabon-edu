[[questions]]
id = "tool-036"
module = "tool-performance"
type = "code"
difficulty = 3
title = "Tên file theo content hash"
prompt = '''
Viết `hashedFileName(fileName, content)` thay phần cuối tên file bằng một hash 8 ký tự hex, giữ nguyên thư mục và extension cuối. Với tên không có extension, nối hash vào cuối. Dùng FNV-1a 32-bit trên từng UTF-16 code unit: khởi đầu `2166136261`; mỗi ký tự cập nhật `Math.imul(hash ^ charCode, 16777619) >>> 0`; định dạng hex chữ thường và thêm số 0 bên trái đủ 8 ký tự.
Ví dụ `hashedFileName('app.js', 'hello')` trả `app.4f9f2cab.js`. Đây là hash phục vụ bài học về tên asset, không phải hash mật mã.
'''
starter = '''
function hashedFileName(fileName, content) {
  return fileName;
}
'''
solution = '''
function hashedFileName(fileName, content) {
  let hash = 2166136261;
  for (let i = 0; i < content.length; i++) {
    hash = Math.imul(hash ^ content.charCodeAt(i), 16777619) >>> 0;
  }
  const hex = hash.toString(16).padStart(8, '0');
  const slash = fileName.lastIndexOf('/');
  let dot = fileName.lastIndexOf('.');
  if (dot <= slash + 1) dot = fileName.length;
  return fileName.slice(0, dot) + '.' + hex + fileName.slice(dot);
}
'''
tests = '''
test('hash FNV-1a cho hello và giữ extension', () => {
  expect(hashedFileName('app.js', 'hello')).toBe('app.4f9f2cab.js');
});
test('giữ đường dẫn thư mục và extension cuối', () => {
  expect(hashedFileName('assets/site.min.css', 'hello')).toBe('assets/site.min.4f9f2cab.css');
});
test('tên không extension được nối hash', () => {
  expect(hashedFileName('README', 'hello')).toBe('README.4f9f2cab');
});
test('cùng content cho tên ổn định', () => {
  expect(hashedFileName('a.js', 'same')).toBe(hashedFileName('a.js', 'same'));
});
test('content khác tạo hash khác trong fixture', () => {
  expect(hashedFileName('a.js', 'hello')).not.toBe(hashedFileName('a.js', 'world'));
});
'''
hints = ["Duyệt code unit bằng `charCodeAt` và cập nhật số nguyên 32-bit với `Math.imul`.", "Tìm dấu chấm cuối chỉ trong basename để không coi dấu chấm của thư mục là extension."]
explanation = "Trong production, bundler tạo content hash theo thuật toán và định dạng riêng; tên thay đổi khi nội dung đổi để hỗ trợ cache busting."
sources = ["webpack~5/guides/caching", "webpack~5/configuration/output"]

[[questions]]
id = "tool-037"
module = "tool-performance"
type = "code"
difficulty = 3
title = "Chia chunk theo giới hạn kích thước"
prompt = '''
Viết `chunkBySize(items, maxSize)` với `items` là mảng `{ id, size }`. Duyệt theo thứ tự đầu vào và gom tuần tự vào chunk hiện tại nếu tổng size không vượt `maxSize`; nếu vượt thì bắt đầu chunk mới. Một item lớn hơn giới hạn phải đứng một mình trong chunk. Trả về mảng các chunk, mỗi chunk là mảng `id`. Không tạo chunk rỗng. `maxSize` phải là số hữu hạn dương; `size` từng item phải hữu hạn và không âm, nếu sai thì ném `Error('invalid size')`.
'''
starter = '''
function chunkBySize(items, maxSize) {
  return items.map((item) => [item.id]);
}
'''
solution = '''
function chunkBySize(items, maxSize) {
  if (!Number.isFinite(maxSize) || maxSize <= 0) throw new Error('invalid size');
  const chunks = [];
  let current = [];
  let total = 0;
  for (const item of items) {
    if (!item || !Number.isFinite(item.size) || item.size < 0) throw new Error('invalid size');
    if (current.length > 0 && total + item.size > maxSize) {
      chunks.push(current.map((entry) => entry.id));
      current = [];
      total = 0;
    }
    current.push(item);
    total += item.size;
    if (item.size > maxSize) {
      chunks.push(current.map((entry) => entry.id));
      current = [];
      total = 0;
    }
  }
  if (current.length > 0) chunks.push(current.map((entry) => entry.id));
  return chunks;
}
'''
tests = '''
test('gom tuần tự cho tới giới hạn', () => {
  expect(chunkBySize([{ id: 'a', size: 2 }, { id: 'b', size: 3 }, { id: 'c', size: 4 }], 5)).toEqual([['a', 'b'], ['c']]);
});
test('item lớn hơn giới hạn đứng một mình', () => {
  expect(chunkBySize([{ id: 'large', size: 9 }, { id: 'small', size: 2 }], 5)).toEqual([['large'], ['small']]);
});
test('kích thước đúng giới hạn được giữ trong cùng chunk', () => {
  expect(chunkBySize([{ id: 'a', size: 2 }, { id: 'b', size: 3 }], 5)).toEqual([['a', 'b']]);
});
test('mảng rỗng không tạo chunk', () => {
  expect(chunkBySize([], 5)).toEqual([]);
});
test('giới hạn hoặc item sai thì báo lỗi', () => {
  expect(() => chunkBySize([], 0)).toThrow('invalid size');
  expect(() => chunkBySize([{ id: 'bad', size: -1 }], 5)).toThrow('invalid size');
});
'''
hints = ["Theo dõi tổng size của chunk hiện tại; flush trước khi thêm item làm vượt ngưỡng.", "Xử lý riêng item quá lớn để nó không bị ghép với item kế tiếp."]
explanation = "Đây là mô hình greedy giữ thứ tự input; bundler thực tế còn xét graph dependency, entry point, cache và request overhead."
sources = ["vite/guide/build", "webpack~5/guides/code-splitting"]
