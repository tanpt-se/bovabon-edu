id = "english-vocab"
title = "Từ vựng tiếng Anh IT theo chủ đề"
icon = "📖"
color = "#7c3aed"
group = "Ngoại ngữ"
description = "Học từ vựng tiếng Anh dùng trong phát triển phần mềm, vận hành, bảo mật và giao tiếp nơi công sở qua ngữ cảnh IT."

[[modules]]
id = "vocab-workflow"
title = "Quy trình phát triển phần mềm"
description = "Requirement, estimate, deadline, scope creep, backlog, deploy, rollback và hotfix."
lesson = '''
### Từ vựng trong một chu kỳ phát triển
| Từ | IPA | Loại từ | Nghĩa tiếng Việt | Ví dụ IT |
|---|---|---|---|---|
| requirement | /rɪˈkwaɪərmənt/ | danh từ | yêu cầu | We clarified the login requirements before coding. |
| estimate | /ˈestɪmeɪt/ | danh từ/động từ | ước tính; bản ước tính | The team estimated three days for the migration. |
| deadline | /ˈdedlaɪn/ | danh từ | hạn chót | We must meet the release deadline. |
| scope creep | /ˈskoʊp kriːp/ | danh từ | phạm vi công việc phình dần | New requests caused scope creep during the sprint. |
| backlog | /ˈbæklɔːɡ/ | danh từ | danh sách việc chờ xử lý | Move the bug to the product backlog. |
| deploy | /dɪˈplɔɪ/ | động từ | triển khai | We will deploy the patch after review. |
| rollback | /ˈroʊlbæk/ | danh từ/động từ | hoàn tác phiên bản triển khai | Roll back the release if checkout errors increase. |
| hotfix | /ˈhɑːtfɪks/ | danh từ | bản sửa khẩn cấp | A hotfix restored payment processing. |

### Phân biệt nhanh
Requirement mô tả điều cần đạt; estimate dự báo công sức hoặc thời gian; deadline là mốc phải hoàn tất. Deploy đưa thay đổi lên môi trường, còn rollback quay lại phiên bản trước. Hotfix thường xử lý lỗi nghiêm trọng đang ảnh hưởng người dùng.

### Lỗi hay gặp
- Dùng deadline để nói thời lượng: “The task takes two days” là thời lượng; “The deadline is Friday” là hạn chót.
- Nhầm rollback với roll out: rollback là quay lui, roll out là phát hành dần.
- Nhận mọi yêu cầu mới vào sprint mà không thương lượng; đó là một nguồn scope creep.
'''

[[modules]]
id = "vocab-frontend"
title = "Frontend và giao diện"
description = "Layout, responsive, accessibility, render, state, component và breakpoint."
lesson = '''
### Từ vựng giao diện
| Từ | IPA | Loại từ | Nghĩa tiếng Việt | Ví dụ IT |
|---|---|---|---|---|
| layout | /ˈleɪaʊt/ | danh từ | bố cục | The new layout keeps the form readable on small screens. |
| responsive | /rɪˈspɑːnsɪv/ | tính từ | thích ứng với kích thước màn hình | Make the dashboard responsive before launch. |
| accessibility | /əkˌsesəˈbɪləti/ | danh từ | khả năng tiếp cận | Accessibility includes keyboard and screen reader support. |
| render | /ˈrendər/ | động từ | hiển thị, kết xuất | The component renders a loading message first. |
| state | /steɪt/ | danh từ | trạng thái dữ liệu giao diện | Keep the selected tab in local state. |
| component | /kəmˈpoʊnənt/ | danh từ | thành phần giao diện | Reuse the button component across settings pages. |
| breakpoint | /ˈbreɪkpɔɪnt/ | danh từ | điểm ngắt bố cục theo màn hình | Add a breakpoint for the tablet layout. |

### Dùng từ đúng ngữ cảnh
Ta render một component, quản lý state, và thiết kế responsive layout. Accessibility không chỉ là màu sắc; điều hướng bàn phím, nhãn biểu mẫu và văn bản thay thế cũng quan trọng.

### Lỗi hay gặp
- Responsive mô tả giao diện thích ứng; không có nghĩa là trang tải nhanh.
- State là dữ liệu có thể thay đổi theo tương tác, không phải toàn bộ HTML.
- Accessible thường đứng trước danh từ: an accessible form. Accessibility là danh từ chỉ thuộc tính hoặc lĩnh vực.
'''

[[modules]]
id = "vocab-backend-data"
title = "Backend và dữ liệu"
description = "Endpoint, payload, latency, throughput, query, index, migration và schema."
lesson = '''
### Từ vựng API và cơ sở dữ liệu
| Từ | IPA | Loại từ | Nghĩa tiếng Việt | Ví dụ IT |
|---|---|---|---|---|
| endpoint | /ˈendpɔɪnt/ | danh từ | điểm cuối API | The endpoint returns the current user profile. |
| payload | /ˈpeɪloʊd/ | danh từ | phần dữ liệu được gửi | Validate the request payload before saving it. |
| latency | /ˈleɪtənsi/ | danh từ | độ trễ | Caching reduced the endpoint latency. |
| throughput | /ˈθruːpʊt/ | danh từ | thông lượng, lượng xử lý mỗi đơn vị thời gian | The service handles higher throughput after scaling. |
| query | /ˈkwɪri/ | danh từ/động từ | truy vấn; truy vấn dữ liệu | This query loads the latest invoices. |
| index | /ˈɪndeks/ | danh từ/động từ | chỉ mục; lập chỉ mục | Add an index to speed up searches by email. |
| migration | /maɪˈɡreɪʃən/ | danh từ | thay đổi schema có quản lý | Run the database migration before deploying the API. |
| schema | /ˈskiːmə/ | danh từ | cấu trúc dữ liệu | The schema requires an account identifier. |

### Latency và throughput
Latency đo thời gian chờ của một thao tác; throughput đo số thao tác hoàn thành trong một khoảng thời gian. Một hệ thống có thể phục vụ nhiều request mỗi giây nhưng mỗi request riêng lẻ vẫn có latency cao.

### Lỗi hay gặp
- Payload là dữ liệu của request/response, không phải toàn bộ kết nối mạng.
- Query là yêu cầu lấy hoặc thay đổi dữ liệu; index là cấu trúc giúp tìm kiếm, nhưng cũng làm tăng chi phí ghi.
- Migration cần có thứ tự và kế hoạch tương thích khi nhiều phiên bản ứng dụng cùng chạy.
'''

[[modules]]
id = "vocab-devops-cloud"
title = "DevOps và cloud"
description = "Pipeline, container, provision, scale out, outage, incident và postmortem."
lesson = '''
### Từ vựng vận hành
| Từ | IPA | Loại từ | Nghĩa tiếng Việt | Ví dụ IT |
|---|---|---|---|---|
| pipeline | /ˈpaɪplaɪn/ | danh từ | chuỗi bước tự động | The pipeline runs tests before deployment. |
| container | /kənˈteɪnər/ | danh từ | môi trường đóng gói ứng dụng | The worker runs in a container. |
| provision | /prəˈvɪʒən/ | động từ | cấp phát tài nguyên | Provision a database for the staging environment. |
| scale out | /skeɪl aʊt/ | cụm động từ | tăng số máy hoặc instance | We scaled out the API workers during the sale. |
| outage | /ˈaʊtɪdʒ/ | danh từ | sự cố gián đoạn dịch vụ | The outage lasted twelve minutes. |
| incident | /ˈɪnsɪdənt/ | danh từ | sự cố cần được xử lý | The on-call engineer declared an incident. |
| postmortem | /ˌpoʊstˈmɔːrtəm/ | danh từ | buổi/báo cáo phân tích sau sự cố | The postmortem identified a missing alert. |
| monitor | /ˈmɑːnɪtər/ | động từ/danh từ | giám sát; công cụ giám sát | Monitor error rates after the rollout. |

### Quy mô và sự cố
Scale out thêm instance để chia tải; scale up tăng tài nguyên của một máy. Incident là sự kiện cần phối hợp xử lý; outage là khoảng thời gian dịch vụ bị gián đoạn. Postmortem ghi lại nguyên nhân và việc cần làm để giảm khả năng tái diễn.

### Lỗi hay gặp
- Provision thường là cấp phát hoặc chuẩn bị tài nguyên; deploy là đưa phiên bản ứng dụng lên môi trường.
- Container giúp đóng gói môi trường chạy, nhưng không tự động bảo đảm ứng dụng có khả năng chịu lỗi.
- Postmortem hiệu quả tập trung vào hệ thống, quyết định và biện pháp cải thiện thay vì đổ lỗi cá nhân.
'''

[[modules]]
id = "vocab-security"
title = "Bảo mật phần mềm"
description = "Vulnerability, exploit, credential, leak, patch, least privilege và các động từ ứng phó."
lesson = '''
### Từ vựng bảo mật
| Từ | IPA | Loại từ | Nghĩa tiếng Việt | Ví dụ IT |
|---|---|---|---|---|
| vulnerability | /ˌvʌlnərəˈbɪləti/ | danh từ | lỗ hổng bảo mật | The scan found a vulnerability in an old dependency. |
| exploit | /ˈeksplɔɪt/ | danh từ/động từ | mã hoặc cách khai thác lỗ hổng; khai thác | The team confirmed that the exploit was blocked. |
| credential | /krəˈdenʃəl/ | danh từ | thông tin xác thực | Revoke the exposed credential immediately. |
| leak | /liːk/ | danh từ/động từ | rò rỉ; làm rò rỉ | A debug log caused a token leak. |
| patch | /pætʃ/ | danh từ/động từ | bản vá; vá lỗi | Install the security patch this afternoon. |
| least privilege | /liːst ˈprɪvəlɪdʒ/ | cụm danh từ | quyền tối thiểu cần thiết | Apply least privilege to service accounts. |
| revoke | /rɪˈvoʊk/ | động từ | thu hồi quyền hoặc thông tin xác thực | Revoke old keys after rotating the secret. |
| encrypt | /ɪnˈkrɪpt/ | động từ | mã hóa | Encrypt backups before storing them off-site. |

### Phản ứng an toàn
Khi phát hiện leak, hãy xác định credential bị ảnh hưởng, revoke hoặc rotate nó, điều tra phạm vi, rồi patch vulnerability. Least privilege giới hạn tác động nếu một tài khoản bị lộ.

### Lỗi hay gặp
- Vulnerability là điểm yếu; exploit là cách tận dụng điểm yếu đó.
- Credential là dữ liệu xác thực như token hoặc mật khẩu; không ghi chúng vào log hay mã nguồn.
- Patch cần được kiểm thử và triển khai có thứ tự, nhưng trì hoãn xử lý một lỗ hổng đang bị khai thác cũng tạo rủi ro.
'''

[[modules]]
id = "vocab-phrasal-verbs"
title = "Phrasal verbs trong công việc"
description = "Các cụm động từ thường gặp khi trao đổi, điều tra lỗi và phối hợp nhóm."
lesson = '''
### Cụm động từ thường dùng
| Từ | IPA | Loại từ | Nghĩa tiếng Việt | Ví dụ IT |
|---|---|---|---|---|
| roll out | /roʊl aʊt/ | cụm động từ | phát hành theo đợt | We will roll out the new editor to ten percent of users. |
| look into | /lʊk ˈɪntuː/ | cụm động từ | tìm hiểu, điều tra | I will look into the failed build. |
| figure out | /ˈfɪɡjər aʊt/ | cụm động từ | tìm ra cách hoặc nguyên nhân | We figured out why the cache was stale. |
| set up | /set ʌp/ | cụm động từ | thiết lập | Set up an alert for repeated login failures. |
| back up | /bæk ʌp/ | cụm động từ | sao lưu | Back up the database before the migration. |
| bring up | /brɪŋ ʌp/ | cụm động từ | nêu ra một vấn đề | She brought up a concern during review. |
| follow up | /ˈfɑːloʊ ʌp/ | cụm động từ | liên hệ hoặc xử lý tiếp | Please follow up with the vendor tomorrow. |
| run into | /rʌn ˈɪntuː/ | cụm động từ | gặp phải vấn đề | We ran into a permission issue in staging. |
| wrap up | /ræp ʌp/ | cụm động từ | hoàn tất | Let’s wrap up the incident review. |

### Dùng trong hội thoại
Phrasal verb thường thân mật và tự nhiên trong trao đổi nhóm. Có thể nói “look into the error” khi nhận việc điều tra, rồi “follow up with the team” sau khi có kết quả.

### Lỗi hay gặp
- Một từ đổi giới từ có thể đổi nghĩa: bring up là nêu vấn đề, back up là sao lưu.
- Roll out là phát hành; roll back là hoàn tác.
- Trong lộ trình này, nhận diện dạng từ được cho trong bảng; bài tập không yêu cầu đoán biến thể chia thì.
'''

[[modules]]
id = "vocab-workplace"
title = "Collocation và idiom nơi công sở"
description = "Kết hợp từ tự nhiên, thành ngữ công việc và một số cặp từ dễ nhầm."
lesson = '''
### Cụm từ thường đi cùng nhau
| Từ | IPA | Loại từ | Nghĩa tiếng Việt | Ví dụ IT |
|---|---|---|---|---|
| make a decision | /meɪk ə dɪˈsɪʒən/ | collocation | đưa ra quyết định | We need to make a decision about the database. |
| meet a deadline | /miːt ə ˈdedlaɪn/ | collocation | kịp hạn chót | The team met the deadline without skipping review. |
| raise a concern | /reɪz ə kənˈsɜːrn/ | collocation | nêu mối lo ngại | Raise a concern if the migration can lose data. |
| on the same page | /ɑːn ðə seɪm peɪdʒ/ | idiom | cùng hiểu/cùng thống nhất | Let’s confirm that product and engineering are on the same page. |
| ballpark figure | /ˈbɔːlbɑːrk ˈfɪɡjər/ | idiom | con số ước lượng sơ bộ | Give us a ballpark figure for the storage cost. |
| in the loop | /ɪn ðə luːp/ | idiom | được cập nhật thông tin | Keep support in the loop during the rollout. |

### Cặp từ dễ nhầm
| Cặp từ | Phân biệt | Ví dụ IT |
|---|---|---|
| affect / effect | affect thường là động từ “ảnh hưởng”; effect thường là danh từ “tác động” | The change may affect latency; the effect is visible in the chart. |
| ensure / insure | ensure là bảo đảm; insure là mua bảo hiểm | Ensure the backup works; insure the laptop against damage. |
| lose / loose | lose là làm mất; loose là lỏng hoặc không chặt | Users may lose data if a loose cable disconnects the drive. |
| fix / repair | fix thường sửa lỗi/vấn đề; repair thường khôi phục vật hoặc thiết bị bị hỏng | Fix the parsing bug; repair the damaged server fan. |

### Lỗi hay gặp
- Trong tiếng Anh, ta “make a decision” nhưng “meet a deadline”.
- Ballpark figure là ước lượng sơ bộ, không phải cam kết chính xác.
- Fix và repair đôi khi giao nhau; chọn từ theo đối tượng và cách diễn đạt tự nhiên của câu.
'''

[[modules]]
id = "vocab-word-formation"
title = "Word formation trong IT"
description = "Tiền tố re-, de-, un-; hậu tố -able, -ize, -ment và họ từ cùng gốc."
lesson = '''
### Tiền tố và hậu tố thường gặp
| Từ | IPA | Loại từ | Nghĩa tiếng Việt | Ví dụ IT |
|---|---|---|---|---|
| redeploy | /ˌriːdɪˈplɔɪ/ | động từ | triển khai lại | Redeploy the service after updating its configuration. |
| deprovision | /ˌdiːprəˈvɪʒən/ | động từ | thu hồi tài nguyên đã cấp | Deprovision the test account after the audit. |
| unavailable | /ˌʌnəˈveɪləbəl/ | tính từ | không sẵn sàng | The endpoint is unavailable during maintenance. |
| configurable | /kənˈfɪɡjərəbəl/ | tính từ | có thể cấu hình | The timeout is configurable per environment. |
| normalize | /ˈnɔːrməlaɪz/ | động từ | chuẩn hóa | Normalize user input before comparison. |
| deployment | /dɪˈplɔɪmənt/ | danh từ | việc triển khai | The deployment completed without errors. |
| secure / security / securely | /sɪˈkjʊr/ /sɪˈkjʊrəti/ /sɪˈkjʊrli/ | tính từ/danh từ/trạng từ | an toàn / bảo mật / một cách an toàn | Store the credential securely and review its security settings. |

### Nhận diện họ từ
Re- thường diễn tả làm lại; de- thường diễn tả gỡ bỏ hoặc đảo ngược; un- tạo nghĩa phủ định. Hậu tố -able thường tạo tính từ chỉ khả năng, -ize tạo động từ, còn -ment thường tạo danh từ chỉ hành động hoặc kết quả.

### Lỗi hay gặp
- Không phải từ nào cũng ghép được với mọi tiền tố hoặc hậu tố; hãy học theo từ điển và ngữ cảnh.
- Deployment là danh từ, deploy là động từ; configurable là tính từ, configure là động từ.
- Đừng đoán nghĩa chỉ từ hình thức: kiểm tra loại từ và collocation trong câu.
'''

