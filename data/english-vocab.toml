[[questions]]
id = "voc-c01"
module = "vocab-workflow"
type = "code"
difficulty = 3
lang = "javascript"
title = "Lập lịch ôn thẻ từ vựng"
prompt = '''
Viết hàm reviewCard(card, grade) cho lịch ôn tập đơn giản. card có dạng { interval, repetitions, easeFactor }; grade là số nguyên từ 0 đến 5.
- Nếu grade < 3: đặt repetitions = 0 và interval = 1.
- Nếu grade >= 3: tăng repetitions lên 1. Khi repetitions cũ là 0, interval mới là 1; khi repetitions cũ là 1, interval mới là 6; các lần sau lấy Math.round(interval cũ * easeFactor).
- Luôn cập nhật easeFactor theo công thức max(1.3, easeFactor + 0.1 - (5 - grade) * (0.08 + (5 - grade) * 0.02)).
- Trả về object mới có đủ ba trường, không sửa object đầu vào.
'''
starter = '''
function reviewCard(card, grade) {
  return { interval: 1, repetitions: 0, easeFactor: card.easeFactor };
}
'''
solution = '''
function reviewCard(card, grade) {
  const easeFactor = Math.max(1.3, card.easeFactor + 0.1 - (5 - grade) * (0.08 + (5 - grade) * 0.02));
  if (grade < 3) return { interval: 1, repetitions: 0, easeFactor };
  const interval = card.repetitions === 0 ? 1 : card.repetitions === 1 ? 6 : Math.round(card.interval * card.easeFactor);
  return { interval, repetitions: card.repetitions + 1, easeFactor };
}
'''
tests = '''
test('lần nhớ đúng đầu tiên được ôn sau một ngày', () => {
  expect(reviewCard({ interval: 0, repetitions: 0, easeFactor: 2.5 }, 4)).toEqual({ interval: 1, repetitions: 1, easeFactor: 2.5 });
});
test('lần nhớ đúng thứ hai dùng khoảng sáu ngày', () => {
  expect(reviewCard({ interval: 1, repetitions: 1, easeFactor: 2.5 }, 5).interval).toBe(6);
});
test('các lần sau nhân interval cũ với easeFactor', () => {
  expect(reviewCard({ interval: 6, repetitions: 2, easeFactor: 2.5 }, 5).interval).toBe(15);
});
test('trả lời sai đặt lại tiến độ và giảm easeFactor', () => {
  expect(reviewCard({ interval: 12, repetitions: 4, easeFactor: 2.5 }, 2)).toEqual({ interval: 1, repetitions: 0, easeFactor: 2.18 });
});
test('easeFactor không thấp hơn 1.3 và input không bị sửa', () => {
  const card = { interval: 4, repetitions: 2, easeFactor: 1.3 };
  reviewCard(card, 0);
  expect(card).toEqual({ interval: 4, repetitions: 2, easeFactor: 1.3 });
  expect(reviewCard(card, 0).easeFactor).toBe(1.3);
});
'''
hints = ["Tính easeFactor mới cho cả câu đúng và câu sai.", "Interval của lần đúng tiếp theo phụ thuộc repetitions cũ."]
explanation = '''Lịch ôn khoảng cách dùng chất lượng câu trả lời để quyết định lúc xem lại thẻ; đây là phiên bản rút gọn để luyện logic.'''

