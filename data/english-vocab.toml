[[questions]]
id = "voc-c05"
module = "vocab-phrasal-verbs"
type = "code"
difficulty = 3
lang = "javascript"
title = "Phát hiện phrasal verb trong câu"
prompt = '''
Viết findPhrasalVerbs(sentence, verbs). Trả về các cụm có mặt trong câu, không phân biệt hoa thường.
- verbs là mảng phrasal verb cần dò; kết quả chỉ chứa cụm khớp chính xác với dạng trong danh sách, không xử lý chia thì.
- Cho phép một hoặc nhiều khoảng trắng giữa các từ trong cụm.
- Chỉ khớp ranh giới từ để “set up” không khớp với “setup” hay một cụm nằm giữa từ dài hơn.
- Mỗi cụm chỉ xuất hiện một lần trong kết quả, theo thứ tự của verbs.
'''
starter = '''
function findPhrasalVerbs(sentence, verbs) {
  return [];
}
'''
solution = '''
function findPhrasalVerbs(sentence, verbs) {
  const found = [];
  const text = ' ' + sentence.toLowerCase().replace(/[^a-z0-9]+/g, ' ').replace(/ +/g, ' ').trim() + ' ';
  for (const verb of verbs) {
    const phrase = verb.trim().toLowerCase().replace(/ +/g, ' ');
    if (text.includes(' ' + phrase + ' ') && !found.includes(verb)) found.push(verb);
  }
  return found;
}
'''
tests = '''
const verbs = ['look into', 'set up', 'follow up', 'wrap up'];
test('tìm cụm không phân biệt hoa thường', () => {
  expect(findPhrasalVerbs('Please LOOK INTO the alert, then set up a dashboard.', verbs)).toEqual(['look into', 'set up']);
});
test('chấp nhận nhiều khoảng trắng', () => {
  expect(findPhrasalVerbs('We will follow   up tomorrow.', verbs)).toEqual(['follow up']);
});
test('chỉ khớp ranh giới từ', () => {
  expect(findPhrasalVerbs('The setup guide is ready.', ['set up'])).toEqual([]);
});
test('kết quả theo thứ tự danh sách và không lặp', () => {
  expect(findPhrasalVerbs('Wrap up, then look into it; wrap up later.', verbs)).toEqual(['look into', 'wrap up']);
});
test('không có cụm phù hợp', () => {
  expect(findPhrasalVerbs('The build is green.', verbs)).toEqual([]);
});
'''
hints = ["Chuẩn hóa khoảng trắng trong mỗi cụm thành biểu thức cho phép nhiều whitespace.", "Dùng ranh giới từ ở hai đầu và duyệt verbs để giữ thứ tự danh sách."]
explanation = '''Bộ dò nhỏ này hỗ trợ tra cụm trong ghi chú; nó không phân tích biến thể ngữ pháp hoặc ngữ cảnh nghĩa.'''

