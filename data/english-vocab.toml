[[questions]]
id = "voc-c02"
module = "vocab-frontend"
type = "code"
difficulty = 2
lang = "javascript"
title = "Tìm thẻ từ theo chủ đề"
prompt = '''
Viết searchTerms(terms, query, topic). Mỗi phần tử trong terms là object có word, meaning và topic.
- Nếu topic khác null, chỉ giữ các mục có topic bằng topic; so sánh topic chính xác.
- query được trim và so sánh không phân biệt hoa thường; nếu query rỗng thì không lọc theo từ khóa.
- Nếu query không rỗng, giữ mục mà word hoặc meaning chứa query như một chuỗi con.
- Giữ nguyên thứ tự và không sửa mảng đầu vào.
'''
starter = '''
function searchTerms(terms, query, topic) {
  return terms;
}
'''
solution = '''
function searchTerms(terms, query, topic) {
  const q = query.trim().toLowerCase();
  return terms.filter((item) => {
    if (topic !== null && item.topic !== topic) return false;
    if (!q) return true;
    return item.word.toLowerCase().includes(q) || item.meaning.toLowerCase().includes(q);
  });
}
'''
tests = '''
const terms = [
  { word: 'Endpoint', meaning: 'điểm cuối API', topic: 'backend' },
  { word: 'Responsive', meaning: 'thích ứng màn hình', topic: 'frontend' },
  { word: 'Payload', meaning: 'dữ liệu gửi đi', topic: 'backend' },
];
test('tìm không phân biệt hoa thường trong từ', () => {
  expect(searchTerms(terms, 'END', null).map((x) => x.word)).toEqual(['Endpoint']);
});
test('tìm trong nghĩa tiếng Việt', () => {
  expect(searchTerms(terms, 'dữ liệu', null).map((x) => x.word)).toEqual(['Payload']);
});
test('lọc đồng thời theo topic và query', () => {
  expect(searchTerms(terms, 'dữ liệu', 'frontend')).toEqual([]);
  expect(searchTerms(terms, 'api', 'backend').map((x) => x.word)).toEqual(['Endpoint']);
});
test('query rỗng chỉ lọc theo topic', () => {
  expect(searchTerms(terms, '  ', 'backend').map((x) => x.word)).toEqual(['Endpoint', 'Payload']);
});
test('không sửa mảng đầu vào và giữ thứ tự', () => {
  expect(searchTerms(terms, '', null)).toEqual(terms);
  expect(terms.map((x) => x.word)).toEqual(['Endpoint', 'Responsive', 'Payload']);
});
'''
hints = ["Chuẩn hóa query một lần bằng trim và toLowerCase.", "Thực hiện các điều kiện lọc trong một filter để giữ thứ tự."]
explanation = '''Tìm kiếm từ vựng theo chủ đề giúp giao diện flashcard hiển thị đúng nội dung mà không thay đổi dữ liệu gốc.'''

