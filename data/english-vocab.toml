Viết isFamilyMember(root, word, families). families là object ánh xạ từ gốc viết thường tới mảng các dạng từ cùng họ.
- Trả true khi root tồn tại trong families và word, sau khi trim và chuyển chữ thường, nằm trong mảng của root.
- So sánh không phân biệt hoa thường và bỏ khoảng trắng ở đầu/cuối của root, word.
- Trả false nếu root không tồn tại, word không thuộc họ từ hoặc dữ liệu tương ứng không phải mảng.
- Không tự suy diễn dạng từ; chỉ kiểm tra dữ liệu được cung cấp.
'''
starter = '''
function isFamilyMember(root, word, families) {
  return true;
}
'''
solution = '''
function isFamilyMember(root, word, families) {
  const key = root.trim().toLowerCase();
  const candidate = word.trim().toLowerCase();
  const forms = families[key];
  if (!Array.isArray(forms)) return false;
  return forms.some((form) => form.trim().toLowerCase() === candidate);
}
'''
tests = '''
const families = {
  secure: ['secure', 'security', 'securely'],
  deploy: ['deploy', 'deployment', 'deployed', 'deployable'],
  access: ['access', 'accessible', 'accessibility', 'inaccessible'],
};
test('tìm dạng từ cùng họ', () => {
  expect(isFamilyMember('secure', 'security', families)).toBe(true);
  expect(isFamilyMember('deploy', 'deployment', families)).toBe(true);
});
test('so sánh không phân biệt hoa thường', () => {
  expect(isFamilyMember(' ACCESS ', ' Accessible ', families)).toBe(true);
});
test('từ không cùng họ trả false', () => {
  expect(isFamilyMember('secure', 'security-related', families)).toBe(false);
});
test('root không có trong bảng trả false', () => {
  expect(isFamilyMember('patch', 'patched', families)).toBe(false);
});
test('dữ liệu không phải mảng trả false', () => {
  expect(isFamilyMember('query', 'queries', { query: 'query' })).toBe(false);
});
'''
hints = ["Chuẩn hóa root và word bằng trim().toLowerCase().", "Dùng Array.isArray trước khi gọi some."]
explanation = '''Bảng họ từ giúp quiz phân biệt danh từ, động từ và tính từ mà không đoán biến tố ngoài dữ liệu đã học.'''
