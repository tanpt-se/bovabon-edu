module = "vocab-devops-cloud"
type = "code"
difficulty = 3
lang = "javascript"
title = "Trộn đáp án quiz có seed"
prompt = '''
Viết seededShuffle(items, seed) trả về bản sao đã xáo trộn theo thứ tự giả ngẫu nhiên xác định.
- Cùng danh sách và seed phải luôn cho cùng thứ tự.
- Không sửa mảng đầu vào, không thêm hoặc mất phần tử.
- Hỗ trợ seed là số nguyên; seed 0 cũng phải hoạt động.
- Không cần tạo thứ tự ngẫu nhiên mật mã.
'''
starter = '''
function seededShuffle(items, seed) {
  return items.slice();
}
'''
solution = '''
function seededShuffle(items, seed) {
  const result = items.slice();
  let state = seed >>> 0;
  if (state === 0) state = 1831565813;
  function random() {
    state ^= state << 13;
    state ^= state >>> 17;
    state ^= state << 5;
    return (state >>> 0) / 4294967296;
  }
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(random() * (i + 1));
    const value = result[i];
    result[i] = result[j];
    result[j] = value;
  }
  return result;
}
'''
tests = '''
test('cùng seed cho cùng kết quả', () => {
  expect(seededShuffle(['a', 'b', 'c', 'd', 'e'], 42)).toEqual(seededShuffle(['a', 'b', 'c', 'd', 'e'], 42));
});
test('giữ đủ phần tử và không làm đổi input', () => {
  const input = ['a', 'b', 'c', 'd', 'e'];
  const result = seededShuffle(input, 7);
  expect(result.slice().sort()).toEqual(['a', 'b', 'c', 'd', 'e']);
  expect(input).toEqual(['a', 'b', 'c', 'd', 'e']);
  expect(seededShuffle([1, 2, 3, 4, 5], 42)).not.toEqual([1, 2, 3, 4, 5]);
});
test('seed 0 vẫn xử lý ổn định', () => {
  expect(seededShuffle([1, 2, 3, 4], 0)).toEqual(seededShuffle([1, 2, 3, 4], 0));
});
test('mảng rỗng và một phần tử', () => {
  expect(seededShuffle([], 4)).toEqual([]);
  expect(seededShuffle(['only'], 9)).toEqual(['only']);
});
test('trả về mảng mới', () => {
  const input = [1, 2, 3];
  expect(seededShuffle(input, 2) === input).toBe(false);
});
'''
hints = ["Dùng generator giả ngẫu nhiên có state bắt đầu từ seed.", "Fisher–Yates chọn một vị trí trong đoạn chưa trộn rồi đổi chỗ."]
explanation = '''Seed giúp quiz có thể tái tạo cùng thứ tự khi xem lại câu hỏi; thuật toán này không dùng cho bảo mật.'''

