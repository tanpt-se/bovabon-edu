[[questions]]
id = "voc-c03"
module = "vocab-backend-data"
type = "code"
difficulty = 3
lang = "javascript"
title = "Tra từ điển IT có stemming đơn giản"
prompt = '''
Viết lookup(word, dictionary), trong đó dictionary là object ánh xạ từ gốc viết thường tới nghĩa tiếng Việt.
- So khớp không phân biệt hoa thường; ưu tiên từ chính xác.
- Nếu không có từ chính xác, lần lượt thử các dạng gốc: đổi đuôi ies thành y; bỏ ing (thử cả dạng bỏ phụ âm kép cuối nếu có); bỏ ed (cũng thử bỏ phụ âm kép); bỏ es; bỏ s; bỏ ly.
- Chỉ trả nghĩa nếu dạng gốc có trong dictionary; nếu không tìm thấy, trả null.
- Không cần xử lý nhiều hậu tố cùng lúc.
'''
starter = '''
function lookup(word, dictionary) {
  return dictionary[word] || null;
}
'''
solution = '''
function lookup(word, dictionary) {
  const w = word.toLowerCase();
  if (dictionary[w] !== undefined) return dictionary[w];
  const candidates = [];
  if (w.endsWith('ies')) candidates.push(w.slice(0, -3) + 'y');
  if (w.endsWith('ing')) {
    const stem = w.slice(0, -3);
    candidates.push(stem);
    if (stem.length > 1 && stem[stem.length - 1] === stem[stem.length - 2]) candidates.push(stem.slice(0, -1));
  }
  if (w.endsWith('ed')) {
    const stem = w.slice(0, -2);
    candidates.push(stem);
    if (stem.length > 1 && stem[stem.length - 1] === stem[stem.length - 2]) candidates.push(stem.slice(0, -1));
  }
  if (w.endsWith('es')) candidates.push(w.slice(0, -2));
  if (w.endsWith('s')) candidates.push(w.slice(0, -1));
  if (w.endsWith('ly')) candidates.push(w.slice(0, -2));
  for (const candidate of candidates) {
    if (dictionary[candidate] !== undefined) return dictionary[candidate];
  }
  return null;
}
'''
tests = '''
const dictionary = { query: 'truy vấn', deploy: 'triển khai', run: 'chạy', fix: 'sửa', secure: 'bảo mật' };
test('ưu tiên khớp chính xác và không phân biệt hoa thường', () => {
  expect(lookup('QUERY', dictionary)).toBe('truy vấn');
});
test('ies trở về y và ing được bỏ', () => {
  expect(lookup('queries', dictionary)).toBe('truy vấn');
  expect(lookup('deploying', dictionary)).toBe('triển khai');
});
test('xử lý phụ âm kép trong running', () => {
  expect(lookup('running', dictionary)).toBe('chạy');
});
test('bỏ ed và es', () => {
  expect(lookup('fixed', dictionary)).toBe('sửa');
  expect(lookup('fixes', dictionary)).toBe('sửa');
});
test('bỏ ly và từ lạ trả null', () => {
  expect(lookup('securely', dictionary)).toBe('bảo mật');
  expect(lookup('unknown', dictionary)).toBeNull();
});
'''
hints = ["Tạo danh sách candidate theo đúng thứ tự đề bài rồi trả nghĩa của candidate đầu tiên có trong dictionary.", "Với running, sau khi bỏ ing cần thử cả runn và run."]
explanation = '''Stemming ở đây chỉ mô phỏng tìm dạng gốc cho bài học; nó không thay thế bộ phân tích ngôn ngữ hoàn chỉnh.'''

