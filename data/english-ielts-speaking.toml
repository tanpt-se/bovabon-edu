keywords = [["reason", "because", "since", "that's why", "the main"], ["example", "for example", "for instance", "last week", "last month", "take"], ["bus", "metro", "train", "public transport", "subway"], ["prefer", "rather", "enjoy", "keen", "not really", "to be honest"]]
min_keywords = 3
model_answer = "To be honest, I'm quite keen on it, at least for long journeys. The main reason is that I can read or answer messages instead of fighting the traffic on my motorbike. For instance, last week I took the metro across the city and finished a whole chapter of my book on the way. That said, I'd rather walk if the distance is short."
explanation = "Checklist tự chấm: (1) Fluency & Coherence: đủ Answer, Reason, Example và câu chốt *That said*; (2) Lexical Resource: cụm tự nhiên (*keen on, fighting the traffic*); (3) Grammar: trộn present simple, past simple, *I'd rather*; (4) Độ dài 3–4 câu, khoảng 25 giây khi nói. Ứng dụng chỉ chấm từ khoá; hãy đọc to và bấm giờ."

[[questions]]
id = "isp-027"
module = "isp-part1"
type = "single"
difficulty = 3
tags = ["band:7", "timing"]
prompt = "Your answer to *Do you like your neighbourhood?* lasted 50 seconds and covered its history, traffic and future plans. What is the best adjustment?"
options = ["Keep Part 1 answers to 2–4 focused sentences and save deeper analysis for Part 3.", "Make it even longer, since length shows fluency.", "Answer only *Yes* to save time.", "Ask the examiner how long you should speak."]
answer = [0]
explanation = "Part 1 cần câu trả lời gọn, đúng trọng tâm. Phân tích sâu (lịch sử, quy hoạch) hợp với Part 3. Trả lời quá dài khiến giám khảo ngắt, còn trả lời cụt thì mất điểm Fluency. Cân bằng là 15–30 giây."

[[questions]]
id = "isp-028"
module = "isp-part1"
type = "single"
difficulty = 3
tags = ["band:7", "extend-answer"]
prompt = "Examiner: *Do you like gardening?* You have no experience of it. Which answer is the best?"
options = ["Not really, to be honest. I live in a small flat with no balcony, so I've never had the chance. That said, my grandmother grows herbs and I can see why she finds it calming.", "I don't know anything about gardening.", "Yes, I love gardening very much. Gardening is very good.", "Gardening? Sorry, can you ask me another question?"]
answer = [0]
explanation = "Không có kinh nghiệm vẫn trả lời được: nói thật (*Not really*), giải thích lý do, rồi mở rộng bằng người khác (*my grandmother*). Câu hai và câu bốn bỏ cơ hội nói; câu ba nói dối và lặp từ, nghe thiếu tự nhiên."

[[questions]]
id = "isp-029"
module = "isp-part2-long-turn"
type = "single"
difficulty = 1
tags = ["band:5.5", "format"]
prompt = "What should you do during the one minute of preparation in Part 2?"
options = ["Write short notes with key words for each bullet point.", "Write the full answer word for word.", "Sit silently and wait.", "Ask the examiner to choose a different cue card."]
answer = [0]
explanation = "1 phút chỉ đủ ghi từ khoá: 2–3 từ cho mỗi gạch đầu dòng. Viết cả câu tốn thời gian và khiến bạn đọc lại thay vì nói. Thường bạn không được đổi cue card."

[[questions]]
id = "isp-030"
module = "isp-part2-long-turn"
type = "fill"
difficulty = 1
tags = ["band:5.5", "opening"]
prompt = "Complete the common Part 2 opening: *I'd {{blank}} to talk about a trip to Da Lat that I took last year.*"
blanks = [["like", "love"]]
explanation = "*I'd like to talk about...* là câu mở chuẩn, nêu đề tài trực tiếp. *I'd love to* cũng tự nhiên."

[[questions]]
id = "isp-031"
module = "isp-part2-long-turn"
type = "single"
difficulty = 1
tags = ["band:5.5", "tense"]
prompt = "You are describing a past event step by step (*we arrived, we checked in, we went to the market*). Which tense is the main one?"
options = ["Past simple", "Present simple", "Present continuous", "Future simple"]
answer = [0]
explanation = "Chuỗi sự kiện đã xảy ra dùng past simple. Nhảy sang hiện tại giữa câu chuyện là lỗi Grammar hay gặp ở Part 2."

[[questions]]
id = "isp-032"
module = "isp-part2-long-turn"
type = "single"
difficulty = 2
tags = ["band:6.5", "notes"]
prompt = "Cue card bullet: *where it was*. Which note is the most useful in one minute of preparation?"
options = ["Da Lat, mountain city, cool", "It was in Da Lat, which is a city in the mountains of Vietnam.", "Da Lat is a very famous city that many tourists visit every year because...", "(no note, I will remember)"]
answer = [0]
explanation = "Ghi chú tốt là từ khoá ngắn kèm một chi tiết cụ thể. Viết câu đầy đủ mất thời gian và dễ khiến bạn đọc ghi chú. Không ghi gì thì dễ quên ý khi đang nói."

[[questions]]
id = "isp-033"
module = "isp-part2-long-turn"
type = "fill"
difficulty = 2
tags = ["band:6.5", "tense"]
prompt = "Set the background with the past continuous: *It {{blank}} raining heavily when we finally reached the hotel.*"
blanks = [["was"]]
explanation = "Past continuous (*was raining*) tả bối cảnh đang diễn ra khi một sự kiện khác (*reached*, past simple) xảy ra."

[[questions]]
id = "isp-034"
module = "isp-part2-long-turn"
type = "fill"
difficulty = 2
tags = ["band:6.5", "tense"]
prompt = "Use the past perfect for something earlier than the story: *I {{blank}} never seen such a clear lake before that trip.*"
blanks = [["had"]]
explanation = "Past perfect (*had seen*) cho trải nghiệm trước mốc quá khứ của câu chuyện (*before that trip*). Dùng đúng thì này giúp tăng range ngữ pháp."

[[questions]]
id = "isp-035"
module = "isp-part2-long-turn"
type = "multiple"
difficulty = 2
tags = ["band:6.5", "extend"]
prompt = "You have covered all bullet points but only 70 seconds have passed. Select good ways to keep going."
options = ["Add a sensory detail, such as a sound or smell.", "Compare it with a similar experience.", "Report a short piece of dialogue from the event.", "Stop and wait for the examiner.", "Read the cue card aloud again.", "Start talking about a completely different topic."]
answer = [0, 1, 2]
explanation = "Chi tiết giác quan, so sánh và trích lời thoại ngắn đều mở rộng đúng chủ đề. Dừng hẳn làm mất điểm Fluency; đọc lại cue card không có giá trị; chuyển sang chủ đề khác là lạc đề."

[[questions]]
id = "isp-036"
module = "isp-part2-long-turn"
type = "single"
difficulty = 2
tags = ["band:6.5", "timing"]
prompt = "Which is the most common timing mistake in Part 2?"
options = ["Spending too long on the first bullet and running out of time before the *explain why* part.", "Speaking for 1 minute 45 seconds.", "Using notes while speaking.", "Starting with *I'd like to talk about...*"]
answer = [0]
explanation = "Nhiều người kể quá kỹ gạch đầu dòng đầu, rồi bị dừng trước dòng cuối *explain why*, nơi dễ thể hiện Lexical và Grammar nhất. 1:45, nhìn ghi chú và câu mở chuẩn đều là việc nên làm."

[[questions]]
id = "isp-037"
module = "isp-part2-long-turn"
type = "single"
difficulty = 2
tags = ["band:6.5", "timing"]
prompt = "What is a sensible target length for your Part 2 talk?"
options = ["About 1 minute 45 seconds, or until the examiner stops you", "Exactly 30 seconds", "About 45 seconds", "Five minutes"]
answer = [0]
explanation = "Đề yêu cầu 1–2 phút. Đặt mục tiêu khoảng 1:45 và cứ nói tới khi giám khảo dừng bạn. Dưới 1 phút là dấu hiệu Fluency yếu."

[[questions]]
id = "isp-038"
module = "isp-part2-long-turn"
type = "single"
difficulty = 2
tags = ["band:6.5", "signposting"]
prompt = "Which phrase moves smoothly from one bullet point to the next?"
options = ["As for what I did there, ...", "Firstly. Secondly. Thirdly.", "Next question is what I did.", "Point number three on the card says..."]
answer = [0]
explanation = "*As for...* dẫn sang ý mới một cách tự nhiên. Đánh số như bài viết hoặc đọc lại cue card (*Point number three...*) nghe máy móc và làm giảm Coherence."

[[questions]]
id = "isp-039"
module = "isp-part2-long-turn"
type = "essay"
difficulty = 3
tags = ["band:7", "long-turn"]
prompt = "Cue card: *Describe a teacher who influenced you. Say who this person was, when they taught you, what they taught you, and explain why they influenced you.* Write the first 4–5 sentences of your talk, using past tenses."
keywords = [["opening", "I'd like to talk about", "I'd like to describe", "the teacher I have in mind", "I want to talk about"], ["past tense", "was", "taught", "used to", "had"], ["reason", "because", "the reason", "that's why", "which is why"], ["impression", "influenced", "inspired", "changed", "lasting"]]
min_keywords = 3
model_answer = "I'd like to talk about Ms Lan, who taught me maths in grade ten. Before I joined her class, I had always believed I was simply bad at numbers. She used to start each lesson with a puzzle from real life, such as working out a fair way to split a restaurant bill. Because she treated mistakes as part of learning, I stopped being afraid of raising my hand. Looking back, she influenced not just my grades but the way I deal with problems today."
explanation = "Checklist tự chấm: (1) Fluency & Coherence: mở bài nêu đề tài, đi theo thứ tự who, when, what, why; (2) Lexical Resource: cụm như *treated mistakes as part of learning, looking back*; (3) Grammar: past simple, past perfect (*had always believed*), *used to*, mệnh đề quan hệ; (4) Có phần *why* cụ thể. Ứng dụng chỉ chấm từ khoá; hãy nói thành tiếng và bấm giờ xem có đủ 1:45 khi kể tiếp không."

[[questions]]
id = "isp-040"
module = "isp-part2-long-turn"
type = "single"
difficulty = 3
tags = ["band:7", "lexical"]
prompt = "Which sentence best handles the *explain why* part of a cue card about a memorable day?"
options = ["It left a lasting impression on me because it was the first time I had travelled completely on my own.", "It was very good and I was very happy.", "Why? Because it was memorable.", "I liked it, so it was a day that I liked."]
answer = [0]
explanation = "Câu đầu có collocation (*left a lasting impression*), lý do cụ thể và past perfect. Các câu khác lặp ý, không giải thích được vì sao, nên khó vượt band 6 ở Lexical và Coherence."

[[questions]]
id = "isp-041"
module = "isp-part2-long-turn"
type = "single"
difficulty = 3
tags = ["band:7", "paraphrase"]
prompt = "In the middle of your story you forget the word *lighthouse*. What is the best choice?"
options = ["Describe it briefly, for example *a tall tower by the sea with a light that guides ships*, and keep going.", "Stop and wait until you remember the word.", "Say the word in Vietnamese and continue.", "Apologise several times and change the story."]
answer = [0]
explanation = "Diễn đạt lại (circumlocution) giữ mạch nói và là kỹ năng được đánh giá trong Lexical Resource. Im lặng, dùng tiếng Việt hay xin lỗi liên tục đều làm giảm Fluency."

[[questions]]
id = "isp-042"
module = "isp-part3-discussion"
type = "single"
difficulty = 1
tags = ["band:5.5", "format"]
prompt = "How is Part 3 different from Part 1?"
options = ["Part 3 asks about society and general trends, not only about you.", "Part 3 is a second cue card with one minute of preparation.", "Part 3 only asks yes/no questions.", "Part 3 is written, not spoken."]
answer = [0]
explanation = "Part 3 là thảo luận trừu tượng: so sánh, giải thích, dự đoán, đánh giá về xã hội. Không có cue card hay thời gian chuẩn bị, và câu hỏi mở chứ không chỉ yes/no."

[[questions]]
id = "isp-043"
module = "isp-part3-discussion"
type = "fill"
difficulty = 1
tags = ["band:5.5", "past-present"]
prompt = "Compare the past and the present: *Back in my parents' day, people {{blank}} to write letters, but now they just send messages.*"
blanks = [["used"]]
explanation = "*used to + V* diễn tả thói quen trong quá khứ nay không còn, rất hợp với câu hỏi so sánh quá khứ và hiện tại ở Part 3."

[[questions]]
id = "isp-044"
module = "isp-part3-discussion"
type = "single"
difficulty = 1
tags = ["band:5.5", "timing"]
prompt = "What is a good length for a Part 3 answer?"
options = ["About 4–6 sentences, around 30–45 seconds", "One sentence", "Two full minutes", "Just *yes* or *no*"]
answer = [0]
explanation = "Part 3 cần dài hơn Part 1 để giải thích, ví dụ và cân nhắc hai mặt: khoảng 4–6 câu. Nói tới 2 phút thì giám khảo sẽ ngắt và mất thời gian cho câu khác."

[[questions]]
id = "isp-045"
module = "isp-part3-discussion"
type = "single"
difficulty = 2
tags = ["band:6.5", "hedging"]
prompt = "Which opening is an example of hedging?"
options = ["I'd say that, to some extent, it has become easier.", "It is 100% easier, no doubt.", "Everyone agrees it is easier.", "Easier. Next."]
answer = [0]
explanation = "Hedging (*I'd say, to some extent*) làm quan điểm mềm và chính xác hơn, phù hợp chủ đề trừu tượng. Khẳng định tuyệt đối (*100%, Everyone*) nghe thiếu tự nhiên và dễ sai về nội dung."

[[questions]]
id = "isp-046"
module = "isp-part3-discussion"
type = "single"
difficulty = 2
tags = ["band:6.5", "generalise"]
prompt = "Examiner: *Why do many young people leave their hometowns?* Which answer stays at the right level for Part 3?"
options = ["I suspect the main driver is work. Big cities tend to offer better-paid jobs, so many graduates move there even if living costs are higher.", "I never left my hometown because I like my family.", "My friend Nam left. He lives in Hanoi now.", "I don't know why, I'm not young people."]
answer = [0]
explanation = "Part 3 cần nói chung về xã hội: nguyên nhân, xu hướng (*many graduates, tend to*). Kinh nghiệm cá nhân chỉ nên là ví dụ minh hoạ, không thay cho câu trả lời. Câu cuối vừa né câu hỏi vừa sai ngữ pháp."

[[questions]]
id = "isp-047"
module = "isp-part3-discussion"
type = "fill"
difficulty = 2
tags = ["band:6.5", "conditional"]
prompt = "Second conditional for a hypothetical idea: *If cities {{blank}} designed for pedestrians, air quality would improve.*"
blanks = [["were"]]
explanation = "Câu điều kiện loại 2 (giả định hiện tại) dùng *If + past simple, would + V*; bị động là *were designed*. Đây là cấu trúc rất hữu ích cho câu hỏi đề xuất ở Part 3."

[[questions]]
id = "isp-048"
module = "isp-part3-discussion"
type = "multiple"
difficulty = 2
tags = ["band:6.5", "speculation"]
prompt = "Examiner: *Will people still use cash in twenty years?* Select natural phrases for speculating."
options = ["I suspect that...", "It's quite likely that...", "I wouldn't be surprised if...", "It is definitely sure that...", "According to me..."]
answer = [0, 1, 2]
explanation = "Ba cụm đầu là cách suy đoán tự nhiên cho câu hỏi tương lai. *definitely sure* là lặp nghĩa và quá tuyệt đối; *According to me* là lỗi dịch nghĩa đen, nên dùng *In my view*."

[[questions]]
id = "isp-049"
module = "isp-part3-discussion"
type = "single"
difficulty = 2
tags = ["band:6.5", "structure"]
prompt = "Which order follows the four-sentence structure for a Part 3 answer?"
options = ["Direct answer with hedging, main reason, example or comparison, qualification", "Example, example, example, conclusion", "Qualification, apology, direct answer, silence", "Reason only, repeated in different words"]
answer = [0]
explanation = "Khung 4 câu: trả lời trực tiếp (có hedging), lý do chính, ví dụ hoặc so sánh, câu nhận xét/điều kiện (*That said...*). Chỉ có ví dụ hoặc chỉ có lý do đều làm câu trả lời thiếu cân bằng."

[[questions]]
id = "isp-050"
module = "isp-part3-discussion"
type = "single"
difficulty = 2
tags = ["band:6.5", "hedging"]
prompt = "Improve this overgeneralisation: *Everyone uses smartphones all the time.*"
options = ["Most people, especially in cities, rely heavily on their smartphones.", "Absolutely everyone always uses smartphones.", "Everybody use smartphone always.", "Smartphones are used by all humans every second."]
answer = [0]
explanation = "*Most people, especially in cities, rely heavily on...* giới hạn phạm vi (hedging) và dùng collocation *rely heavily on*. Các lựa chọn khác vẫn tuyệt đối hoá hoặc sai hoà hợp chủ–vị (*Everybody use*)."

[[questions]]
id = "isp-051"
module = "isp-part3-discussion"
type = "single"
difficulty = 2
tags = ["band:6.5", "question-type"]
prompt = "Examiner: *What can governments do to reduce traffic congestion?* What type of Part 3 question is this?"
options = ["A suggestion/solution question", "A past-versus-present comparison", "A personal experience question", "A yes/no question about your hometown"]
answer = [0]
explanation = "*What can governments do...* yêu cầu đề xuất giải pháp: dùng *They should..., because...*, hoặc câu điều kiện *If they invested in..., ... would...*."

[[questions]]
id = "isp-052"
module = "isp-part3-discussion"
type = "essay"
difficulty = 3
tags = ["band:7", "discussion"]
prompt = "Answer this Part 3 question in 4–6 English sentences: *Do you think people will still read printed books in the future?* Use hedging, a reason, an example and a qualification."
keywords = [["hedging", "I'd say", "likely", "I suspect", "tend to", "probably", "to some extent"], ["reason", "because", "the main reason", "since", "that's why"], ["example", "for example", "for instance", "such as", "take"], ["contrast", "however", "that said", "on the other hand", "while", "although"]]
min_keywords = 3
model_answer = "I'd say printed books will survive, although they will probably become more of a niche product. The main reason is that many readers still enjoy the physical experience of turning pages and not staring at another screen. For example, in my city independent bookshops have actually become trendy places for young people to meet. That said, for textbooks and news, digital formats are likely to take over because they are cheaper and easier to update. So I suspect we will see a split rather than a complete replacement."
explanation = "Checklist tự chấm: (1) Fluency & Coherence: trả lời trực tiếp, lý do, ví dụ, cân nhắc (*That said*), kết luận; (2) Lexical Resource: *niche product, take over, a split rather than a complete replacement*; (3) Grammar: *will/likely to/probably*, mệnh đề *although*, *because*; (4) Nói chung về xã hội, ví dụ cá nhân chỉ minh hoạ. Ứng dụng chỉ chấm từ khoá; hãy nói thành tiếng trong khoảng 40 giây."

[[questions]]
id = "isp-053"
module = "isp-part3-discussion"
type = "single"
difficulty = 3
tags = ["band:7", "evaluate"]
prompt = "Examiner: *Is online learning better than classroom learning?* Which answer is most likely to reach band 7?"
options = ["It depends on the learner. Online courses are flexible and cheaper, which suits working adults, whereas younger students often need the discipline of a classroom. On balance, I'd say a blended approach works best.", "Online learning is better. It is very good and very convenient.", "Classroom learning is better because I like my teacher.", "Both are good and both are bad, I think."]
answer = [0]
explanation = "Câu đầu đánh giá hai mặt, so sánh bằng *whereas*, nêu đối tượng cụ thể và kết luận (*On balance*). Các lựa chọn khác một chiều, dựa vào cảm nhận cá nhân hoặc không có nội dung."

[[questions]]
id = "isp-054"
module = "isp-part3-discussion"
type = "single"
difficulty = 3
tags = ["band:7", "difficult-question"]
prompt = "Examiner: *What is the economic impact of space exploration?* You know very little about the topic. What is the best decision?"
options = ["Buy a moment, admit it is not your field, then reason from general ideas such as jobs, technology spin-offs and cost.", "Say *I have no idea* and stay silent.", "Ask the examiner for a different question.", "Change the subject to your favourite hobby."]
answer = [0]
explanation = "Giám khảo chấm ngôn ngữ, không chấm kiến thức. Nói *That's a tricky one, I'm no expert, but...* rồi lập luận từ ý chung vẫn thể hiện được Fluency và Lexical. Im lặng, xin đổi câu hay lạc đề đều mất điểm."

[[questions]]
id = "isp-055"
module = "isp-fluency-discourse"
type = "single"
difficulty = 1
tags = ["band:5.5", "fluency"]
prompt = "What does Fluency mean in IELTS Speaking?"
options = ["Speaking smoothly with ideas that connect logically, even at a moderate speed", "Speaking as fast as possible", "Never pausing for a single second", "Using as many long words as possible"]
answer = [0]
explanation = "Fluency & Coherence đánh giá độ liền mạch và tổ chức ý, không phải tốc độ. Nói chậm mà đều và mạch lạc tốt hơn nói nhanh rồi khựng lại."

[[questions]]
id = "isp-056"
module = "isp-fluency-discourse"
type = "fill"
difficulty = 1
tags = ["band:5.5", "discourse-marker"]
prompt = "Rephrase what you just said: *The meeting lasted three hours and nothing was decided. {{blank}} other words, it was a waste of time.*"
blanks = [["in"]]
explanation = "*In other words* dùng để diễn đạt lại hoặc tóm ý vừa nói, giúp câu trả lời mạch lạc."

[[questions]]
id = "isp-057"
module = "isp-fluency-discourse"
type = "single"
difficulty = 1
tags = ["band:5.5", "discourse-marker"]
prompt = "Which discourse marker introduces a contrast?"
options = ["That said, ...", "What's more, ...", "For instance, ...", "All in all, ..."]
answer = [0]
explanation = "*That said* (= tuy vậy) báo hiệu ý đối lập. *What's more* thêm ý, *For instance* đưa ví dụ, *All in all* tóm tắt."

[[questions]]
id = "isp-058"
module = "isp-fluency-discourse"
type = "single"
difficulty = 2
tags = ["band:6.5", "common-errors"]
prompt = "Which discourse marker is incorrect?"
options = ["In the other hand, ...", "On the other hand, ...", "Having said that, ...", "On top of that, ..."]
answer = [0]
explanation = "Cụm đúng là *On the other hand*. *In the other hand* là lỗi hay gặp do dịch nghĩa đen. Ba cụm còn lại đều đúng."

[[questions]]
id = "isp-059"
module = "isp-fluency-discourse"
type = "single"
difficulty = 2
tags = ["band:6.5", "self-correction"]
prompt = "You notice a tense mistake as you speak. Which self-correction is the most effective?"
options = ["*I go there yesterday... I mean, I went there yesterday, and...*", "*I go there yesterday. Sorry, sorry, I'm so sorry, my grammar is bad...*", "*I go there yesterday.* (stop for ten seconds)", "*I go there yesterday... can I start my answer again from the beginning?*"]
answer = [0]
explanation = "Sửa ngắn bằng *I mean* rồi nói tiếp cho thấy bạn kiểm soát ngữ pháp mà không làm gián đoạn. Xin lỗi nhiều, im lặng hoặc xin nói lại từ đầu đều làm Fluency giảm."

[[questions]]
id = "isp-060"
module = "isp-fluency-discourse"
type = "multiple"
difficulty = 2
tags = ["band:6.5", "paraphrase"]
prompt = "You cannot remember the word *stapler*. Select the useful ways to keep talking."
options = ["*It's the thing you use to join pieces of paper together.*", "*It's a kind of small office tool...*", "*The name escapes me, but it's on every office desk.*", "Switch to Vietnamese for that word.", "Stop and say nothing until the word comes back."]
answer = [0, 1, 2]
explanation = "Mô tả công dụng (*the thing you use to...*), phân loại (*a kind of...*) hoặc thừa nhận quên tên rồi mô tả đều giữ mạch nói. Chuyển sang tiếng Việt hoặc im lặng làm mất điểm Fluency và Lexical."

[[questions]]
id = "isp-061"
module = "isp-fluency-discourse"
type = "fill"
difficulty = 2
tags = ["band:6.5", "discourse-marker"]
prompt = "Add another point: *The new metro line is fast. On {{blank}} of that, tickets are surprisingly cheap.*"
blanks = [["top"]]
explanation = "*On top of that* (= thêm vào đó) là marker thêm ý tự nhiên khi nói, thay cho *and* lặp đi lặp lại."

[[questions]]
id = "isp-062"
module = "isp-fluency-discourse"
type = "single"
difficulty = 2
tags = ["band:6.5", "discourse-marker"]
prompt = "Why does *Firstly..., Secondly..., Finally...* often sound unnatural in a spoken answer?"
options = ["It sounds like a written essay; spoken alternatives like *The main thing is... Another thing is...* sound more natural.", "It is grammatically incorrect.", "Examiners are not allowed to give marks for numbered points.", "It makes the answer too short."]
answer = [0]
explanation = "Đánh số kiểu bài viết không sai ngữ pháp nhưng nghe cứng khi nói, nhất là trong câu trả lời ngắn. Văn nói tự nhiên dùng *The main thing is..., Another thing is..., On top of that...*."

[[questions]]
id = "isp-063"
module = "isp-fluency-discourse"
type = "single"
difficulty = 2
tags = ["band:6.5", "discourse-marker"]
prompt = "How often should you use discourse markers in a spoken answer?"
options = ["Roughly one every two or three sentences, where the link is real", "At the start of every single sentence", "Never, because they sound memorised", "Only at the very end of the test"]
answer = [0]
explanation = "Marker dùng vừa phải và đúng chức năng làm câu trả lời mạch lạc. Câu nào cũng mở bằng marker nghe như học thuộc; không dùng marker nào thì các ý rời rạc."

[[questions]]
id = "isp-064"
module = "isp-fluency-discourse"
type = "single"
difficulty = 2
tags = ["band:6.5", "discourse-marker"]
prompt = "What is the function of *What's more* in: *The flat is close to my office. What's more, the rent is reasonable.*?"
options = ["Adding a further point", "Showing contrast", "Giving an example", "Summarising"]
answer = [0]
explanation = "*What's more* (= hơn nữa) bổ sung một ý cùng chiều. Đối lập dùng *However/That said*, ví dụ dùng *For instance*, tóm tắt dùng *All in all*."

[[questions]]
id = "isp-065"
module = "isp-fluency-discourse"
type = "essay"
difficulty = 3
tags = ["band:7", "discourse-marker"]
prompt = "Rewrite this answer to *Do you like your job?* using varied discourse markers instead of *and*: *I like my job and it is interesting and I learn a lot and my colleagues are nice and sometimes it is stressful.* Write 3–4 sentences."
keywords = [["addition", "what's more", "on top of that", "besides", "also"], ["contrast", "however", "that said", "having said that", "although"], ["reason", "because", "since", "the reason"], ["example", "for instance", "for example", "take"]]
min_keywords = 3
model_answer = "Yes, I genuinely enjoy it, mainly because the work is interesting and I'm always learning something new. For instance, last month I picked up a new testing tool in just a few days. On top of that, my colleagues are really supportive. That said, it can get stressful when several deadlines land in the same week."
explanation = "Checklist tự chấm: (1) Fluency & Coherence: mỗi ý nối bằng marker đúng chức năng (lý do, ví dụ, thêm ý, đối lập) thay cho chuỗi *and*; (2) Lexical Resource: *genuinely enjoy, picked up, supportive*; (3) Grammar: câu phức với *because, when*; (4) Độ dài Part 1 (3–4 câu). Ứng dụng chỉ chấm từ khoá; đọc to để kiểm tra độ tự nhiên."

[[questions]]
id = "isp-066"
module = "isp-fluency-discourse"
type = "single"
difficulty = 3
tags = ["band:7", "fluency"]
prompt = "Which kind of pause is acceptable at band 7?"
options = ["*Hmm, it depends on whether we're talking about big cities or rural areas...* (pausing to organise ideas)", "A long silence while searching for a basic word like *expensive*", "Stopping mid-sentence and restarting three times", "Repeating *erm* five times before each sentence"]
answer = [0]
explanation = "Band 7 chấp nhận ngập ngừng để suy nghĩ về nội dung, đặc biệt khi bạn nói thành lời quá trình đó (*it depends on whether...*). Dừng để tìm từ cơ bản, bắt đầu lại nhiều lần hay lạm dụng *erm* là đặc điểm band 5–6."

[[questions]]
id = "isp-067"
module = "isp-fluency-discourse"
type = "single"
difficulty = 3
tags = ["band:7", "fillers"]
prompt = "Your recording shows you say *you know* and *erm* about ten times per minute. Which plan is the best trade-off?"
options = ["Slow down slightly and rotate three or four natural phrases (*Well, ...*, *Let me think...*, *Actually, ...*) so silence is filled with real language.", "Speak much faster so the fillers are less noticeable.", "Memorise complete answers so you never need to think.", "Remove all pauses by speaking without breathing breaks."]
answer = [0]
explanation = "Fillers thường xuất hiện khi bạn vội. Nói chậm lại một chút và thay bằng cụm có nghĩa giúp Fluency tốt hơn. Nói nhanh hơn làm lỗi nhiều hơn; học thuộc bị nhận ra; không ngắt nghỉ làm khó nghe và ảnh hưởng Pronunciation."

[[questions]]
id = "isp-068"
module = "isp-pronunciation-text"
type = "single"
difficulty = 1
tags = ["band:5.5", "ed-ending"]
prompt = "How is the *-ed* ending pronounced in *wanted*?"
options = ["/ɪd/ (an extra syllable)", "/t/", "/d/", "It is silent."]
answer = [0]
explanation = "Động từ kết thúc bằng âm /t/ hoặc /d/ thì *-ed* đọc là /ɪd/ và thêm một âm tiết: *wan-ted*, *nee-ded*."

[[questions]]
id = "isp-069"
module = "isp-pronunciation-text"
type = "single"
difficulty = 1
tags = ["band:5.5", "ed-ending"]
prompt = "How is the *-ed* ending pronounced in *worked*?"
options = ["/t/", "/ɪd/", "/d/", "It is silent."]
answer = [0]
explanation = "*work* kết thúc bằng âm vô thanh /k/, nên *-ed* đọc là /t/: *worked* chỉ có một âm tiết. Lỗi hay gặp là đọc *work-ed* hoặc bỏ hẳn âm cuối."

[[questions]]
id = "isp-070"
module = "isp-pronunciation-text"
type = "single"
difficulty = 1
tags = ["band:5.5", "s-ending"]
prompt = "How is the *-es* ending pronounced in *buses*?"
options = ["/ɪz/", "/s/", "/z/", "It is silent."]
answer = [0]
explanation = "Sau các âm /s, z, ʃ, tʃ, dʒ/, đuôi *-s/-es* đọc là /ɪz/ và thêm một âm tiết: *bus-es*, *watch-es*."

[[questions]]
id = "isp-071"
module = "isp-pronunciation-text"
type = "single"
difficulty = 2
tags = ["band:6.5", "word-stress"]
prompt = "Where is the main stress in *education*? (Capital letters = stressed syllable.)"
options = ["The third syllable: edu-CA-tion", "The first syllable: ED-u-ca-tion", "The last syllable: edu-ca-TION", "The second syllable: e-DU-ca-tion"]
answer = [0]
explanation = "Từ kết thúc bằng *-tion* nhấn vào âm tiết ngay trước hậu tố: *edu-CA-tion*. Quy tắc tương tự với *infor-MA-tion*, *popu-LA-tion*."

[[questions]]
id = "isp-072"
module = "isp-pronunciation-text"
type = "single"
difficulty = 2
tags = ["band:6.5", "word-stress"]
prompt = "In *I'd like to present my ideas*, *present* is a verb. Where is the stress?"
options = ["On the second syllable: pre-SENT", "On the first syllable: PRE-sent", "Both syllables equally", "It has no stress."]
answer = [0]
explanation = "Nhiều từ hai âm tiết đổi trọng âm theo loại từ: danh từ/tính từ nhấn âm đầu (*a PREsent*), động từ nhấn âm sau (*to preSENT*). Tương tự *REcord / reCORD*."

[[questions]]
id = "isp-073"
module = "isp-pronunciation-text"
type = "fill"
difficulty = 2
tags = ["band:6.5", "word-stress"]
prompt = "*PHOtograph* is stressed on the first syllable. In *photographer*, the stress moves to the {{blank}} syllable. (Write a word such as *first*, *second*, *third*.)"
blanks = [["second", "2nd", "2"]]
explanation = "Họ từ đổi trọng âm: *PHO-to-graph*, *pho-TO-gra-pher*, *pho-to-GRA-phic*. Từ có *-graphy/-grapher* nhấn âm tiết ngay trước hậu tố."

[[questions]]
id = "isp-074"
module = "isp-pronunciation-text"
type = "multiple"
difficulty = 2
tags = ["band:6.5", "ed-ending"]
prompt = "Select the verbs whose *-ed* ending is pronounced /d/."
options = ["played", "lived", "called", "stopped", "needed", "watched"]
answer = [0, 1, 2]
explanation = "Sau nguyên âm hoặc âm hữu thanh (*play, live, call*), *-ed* đọc /d/. *stopped, watched* kết thúc bằng âm vô thanh nên đọc /t/; *needed* kết thúc bằng /d/ nên đọc /ɪd/."

[[questions]]
id = "isp-075"
module = "isp-pronunciation-text"
type = "single"
difficulty = 2
tags = ["band:6.5", "sentence-stress"]
prompt = "In *I'd like to visit the museum tomorrow*, which words normally carry the stress?"
options = ["The content words: LIKE, VISit, MUseum, toMORrow", "The function words: I'D, TO, THE", "Every syllable equally", "Only the last word, tomorrow"]
answer = [0]
explanation = "Trong câu, từ nội dung (động từ chính, danh từ, trạng từ) được nhấn, còn từ chức năng (*to, the*) đọc nhẹ. Nhấn mọi âm tiết như nhau là lỗi \"nói đều giọng\" hay gặp của người Việt."

[[questions]]
id = "isp-076"
module = "isp-pronunciation-text"
type = "single"
difficulty = 2
tags = ["band:6.5", "intonation"]
prompt = "What usually happens to intonation at the end of a yes/no question like *Have you been to Hue?*"
options = ["It usually rises.", "It usually falls sharply.", "It stays completely flat.", "It depends only on the speaker's accent."]
answer = [0]
explanation = "Câu hỏi Yes/No thường lên giọng ở cuối; câu trần thuật và câu hỏi Wh- thường xuống giọng. Ngữ điệu phẳng làm câu nói khó hiểu ý."

[[questions]]
id = "isp-077"
module = "isp-pronunciation-text"
type = "single"
difficulty = 2
tags = ["band:6.5", "s-ending"]
prompt = "How is the final *-s* pronounced in *friends*?"
options = ["/z/", "/s/", "/ɪz/", "It is silent."]
answer = [0]
explanation = "*friend* kết thúc bằng âm hữu thanh /d/, nên *-s* đọc là /z/. Người Việt hay bỏ cả /d/ lẫn /z/; hãy giữ đủ cụm âm cuối /ndz/."

[[questions]]
id = "isp-078"
module = "isp-pronunciation-text"
type = "essay"
difficulty = 3
tags = ["band:7", "self-study"]
prompt = "In 3–4 English sentences, name three common pronunciation problems of Vietnamese learners and suggest one way to practise each without a teacher."
keywords = [["final consonants", "final consonant", "final sound", "ending sound", "final sounds"], ["word stress", "stress"], ["intonation", "flat", "monotone", "rhythm"], ["practise", "record", "shadowing", "shadow", "read aloud"]]
min_keywords = 3
model_answer = "The first problem is dropping final consonants, so words like *worked* or *friends* lose their endings; reading a short text aloud every day while exaggerating those sounds helps. The second is wrong word stress in word families such as *economy* and *economic*, which you can fix by checking a dictionary and recording ten words a day. The third is flat intonation, where every syllable sounds the same. Shadowing a natural speaker and copying their rhythm is an effective way to practise this."
explanation = "Checklist tự chấm: (1) Fluency & Coherence: ba vấn đề sắp xếp rõ (*The first, The second, The third*); (2) Lexical Resource: thuật ngữ đúng (*final consonants, word stress, intonation, shadowing*); (3) Grammar: mệnh đề quan hệ (*which, where*), câu phức; (4) Mỗi vấn đề có cách luyện cụ thể. Ứng dụng chỉ chấm từ khoá; hãy ghi âm đoạn này và nghe lại."

[[questions]]
id = "isp-079"
module = "isp-pronunciation-text"
type = "single"
difficulty = 3
tags = ["band:7", "word-stress"]
prompt = "Which pair shows the correct stress for both words in this word family?"
options = ["economy on the 2nd syllable (e-CO-no-my), economic on the 3rd (e-co-NO-mic)", "economy on the 1st syllable (E-co-no-my), economic on the 2nd (e-CO-no-mic)", "economy on the 3rd syllable (e-co-NO-my), economic on the 1st (E-co-no-mic)", "Both words on the 2nd syllable (e-CO-no-my, e-CO-no-mic)"]
answer = [0]
explanation = "*e-CO-no-my* nhấn âm tiết thứ hai; *e-co-NO-mic* nhấn âm ngay trước hậu tố *-ic*. Người học hay giữ nguyên trọng âm giữa hai từ, khiến giám khảo khó nhận ra từ."

[[questions]]
id = "isp-080"
module = "isp-pronunciation-text"
type = "single"
difficulty = 3
tags = ["band:7", "strategy"]
prompt = "You have two weeks before the test and want to move Pronunciation from 6 to 7. Which focus gives the best return?"
options = ["Clear final consonants, correct word stress and stressing content words in sentences", "Imitating a British or American accent perfectly", "Speaking much faster to sound more fluent", "Memorising the phonetic symbols for every vowel"]
answer = [0]
explanation = "Giọng địa phương không bị trừ điểm; giám khảo chấm độ dễ hiểu. Âm cuối, trọng âm từ và trọng âm câu là ba yếu tố ảnh hưởng nhiều nhất đến độ dễ nghe. Bắt chước giọng mất thời gian, nói nhanh làm lỗi tăng, học ký hiệu không tự động cải thiện cách nói."
