[[modules]]
id = "isp-format-descriptors"
title = "Định dạng bài thi và 4 tiêu chí chấm"
description = "Cấu trúc 3 phần, 4 tiêu chí, khác biệt giữa band 6 và band 7, cách tự luyện khi app chỉ có chữ."
lesson = '''
### Giới hạn của app và cách bù lại
App chỉ có chữ, không có ghi âm hay giám khảo. Vì vậy app luyện cho bạn **nội dung, khung câu trả lời, từ nối, ngữ pháp và lý thuyết phát âm**. Phần "nói thành tiếng" bạn phải tự làm ngoài app (xem mục cuối). Đừng bỏ qua phần này: người học chỉ đọc mà không nói thường kẹt ở band 5.5.

### Định dạng bài thi (11–14 phút, một giám khảo)
| Phần | Nội dung | Thời gian | Bạn làm gì |
|---|---|---|---|
| Part 1 | Giới thiệu bản thân, 2–3 chủ đề quen thuộc (home, work, hobbies...) | 4–5 phút | Trả lời 2–4 câu mỗi câu hỏi |
| Part 2 | Cue card: 1 phút chuẩn bị, nói liền 1–2 phút | 3–4 phút | Ghi chú, nói theo dàn ý, giám khảo sẽ dừng bạn |
| Part 3 | Thảo luận trừu tượng liên quan chủ đề Part 2 | 4–5 phút | Giải thích, so sánh, dự đoán, đánh giá |

### Bốn tiêu chí chấm (diễn giải)
| Tiêu chí | Band 6 | Band 7 |
|---|---|---|
| Fluency & Coherence | Nói khá dài nhưng đôi lúc ngập ngừng, lặp lại, tự sửa nhiều; từ nối còn đơn điệu | Nói dài không cần cố gắng, ngập ngừng chủ yếu để nghĩ ý chứ không phải tìm từ; từ nối đa dạng |
| Lexical Resource | Đủ từ cho chủ đề quen, diễn đạt lại được khi thiếu từ | Linh hoạt, có collocation và cụm ít phổ biến, biết dùng idiom đúng chỗ |
| Grammatical Range & Accuracy | Trộn câu đơn và câu phức, còn lỗi nhưng ít gây hiểu nhầm | Nhiều cấu trúc phức, đa số câu không lỗi |
| Pronunciation | Hiểu được phần lớn, còn lỗi âm cuối, trọng âm | Dễ nghe, nhấn trọng âm và ngữ điệu hợp lý, lỗi nhỏ không cản trở |

Band 6.5 nghĩa là bạn ổn định ở band 6 và chạm band 7 ở một hai tiêu chí. Thường dễ nâng nhất là Fluency (nhờ khung trả lời) và Lexical (nhờ collocation).

### Chiến lược chung
1. Trả lời thẳng câu hỏi trong câu đầu tiên, sau đó mới thêm lý do và ví dụ.
2. Không học thuộc bài mẫu: giám khảo nhận ra giọng "đọc thuộc" và hạ điểm Fluency.
3. Sai thì sửa nhanh (*I mean...*) rồi nói tiếp, không dừng hẳn.
4. Không có đúng/sai về quan điểm. Bịa ví dụ được, miễn là bạn nói trôi chảy.
5. Thiếu từ thì diễn đạt lại bằng từ đơn giản hơn.

### Lỗi hay gặp của người Việt
- Trả lời một câu cụt (*Yes, I do.*) rồi im lặng.
- Bỏ âm cuối (*work*, *looked*), nói *-ed* thành một âm tiết riêng.
- Dịch ý từ tiếng Việt sang, ví dụ *I very like*.
- Dùng *In my opinion, I think* (thừa một cụm).

### Tự luyện ngoài app
- **Tự ghi âm bằng điện thoại**: trả lời một câu Part 1 trong 20–30 giây, nghe lại, đếm số lần ngập ngừng và lỗi âm cuối, rồi ghi âm lại.
- **Bấm giờ Part 2**: đặt đồng hồ 1 phút chuẩn bị và tối thiểu 1 phút 30 giây nói. Nếu hết ý trước 1 phút, bạn cần thêm một ý ở dàn ý.
- **Shadowing**: nghe một đoạn nói tiếng Anh bình thường bạn tự chọn (podcast, bài giảng), nói lặp theo sau 1–2 giây, bắt chước nhịp và trọng âm. Không cần tài liệu cụ thể, chỉ cần giọng rõ.
- Nhờ một người bạn hỏi Part 3 bằng những câu họ tự nghĩ, để quen với việc không biết trước câu hỏi.
'''

[[modules]]
id = "isp-part1"
title = "Part 1: mở rộng câu trả lời"
description = "Khung trả lời, lý do, ví dụ cho các chủ đề quen thuộc; tránh câu cụt và bài học thuộc lòng."
lesson = '''
### Mục tiêu của Part 1
Part 1 kiểm tra khả năng nói tự nhiên về chủ đề quen. Câu hỏi đơn giản, nhưng điểm Fluency và Lexical phụ thuộc vào việc bạn mở rộng được bao nhiêu mà không lan man. Mỗi câu trả lời lý tưởng dài **2–4 câu, 15–30 giây**.

### Khung ARE: Answer, Reason, Example
| Bước | Việc làm | Mẫu câu |
|---|---|---|
| Answer | Trả lời thẳng | *Yes, quite often.* / *I'd say it's my favourite room.* |
| Reason | Giải thích vì sao | *The main reason is that...* / *That's because...* |
| Example | Một chi tiết hoặc ví dụ cụ thể | *For instance, last weekend I...* / *Take my sister, for example.* |

Ví dụ: *Do you like cooking?* Mẫu band 7: *Yes, I'm quite keen on it. It helps me relax after a long day of coding, and I like experimenting with new recipes. For instance, last Sunday I made a Thai curry from scratch and it turned out better than I expected.* Câu trả lời có trả lời, lý do và ví dụ cụ thể.

### Chủ đề thường gặp
home/hometown, work/study, hobbies, food, daily routine, weather, technology, transport, friends. Hãy chuẩn bị 5–6 từ cho mỗi chủ đề (collocation, không phải từ đơn): *a bustling neighbourhood*, *a tight deadline*, *to unwind after work*.

### Mẫu câu cho các loại câu hỏi
| Loại câu hỏi | Cách mở |
|---|---|
| Yes/No (*Do you...?*) | *Yes, I do, mainly because...* / *Not really. I'd rather...* |
| Thói quen (*How often...?*) | *Probably once or twice a week.* |
| Sở thích (*Why do you like...?*) | *What I enjoy most is...* |
| Quá khứ (*Did you... as a child?*) | *When I was little, I used to...* |
| So sánh (*Which do you prefer...?*) | *I'd go for... rather than... because...* |

### Lỗi hay gặp
- **Câu cụt**: *Yes.* hoặc *I like it.* rồi chờ câu tiếp theo.
- **Đọc thuộc**: câu trả lời quá trau chuốt không khớp câu hỏi (ví dụ câu hỏi về thói quen mà bạn trả lời về sở thích). Giám khảo sẽ đổi câu hỏi nếu nghi ngờ bạn học thuộc.
- **Lan man**: nói quá 40 giây khiến giám khảo phải ngắt.
- **Nhầm thì**: hỏi thói quen thì dùng present simple, hỏi quá khứ thì dùng past simple.
- **Lặp từ**: *very good*, *very nice* nhiều lần. Thay bằng *really enjoyable*, *genuinely helpful*.

### Mẹo thời gian
Bạn có 1–2 giây suy nghĩ trước khi trả lời, hãy dùng chúng. Nếu cần câu kéo thời gian: *That's an interesting question.*, *Let me think...*. Đừng dùng cùng một câu cho mọi câu hỏi.

### Tự luyện ngoài app
Chọn 10 câu hỏi Part 1 tự nghĩ và ghi âm câu trả lời. Nghe lại: có đủ ba thành phần không? Có câu nào dưới 10 giây không? Thử trả lời lại, thêm một ví dụ cá nhân thật. Luyện với đồng hồ để có cảm giác 20–30 giây.
'''

[[modules]]
id = "isp-part2-long-turn"
title = "Part 2: ghi chú và nói dài theo cue card"
description = "Dàn ý 1 phút chuẩn bị, kể chuyện bằng thì quá khứ, cách kéo dài 2 phút."
lesson = '''
### Part 2 là gì
Giám khảo đưa một cue card, bạn có **1 phút chuẩn bị** (được ghi chú) rồi nói **1–2 phút liên tục**. Giám khảo thường chỉ nói *Thank you* và hỏi một câu ngắn ở cuối. Đây là phần dễ lộ lỗi Fluency nhất vì không có người dẫn dắt.

### Cue card gồm những gì
Một đề tài (*Describe a place you visited...*) và 3–4 gạch đầu dòng gợi ý (*where it was, when you went, what you did, and explain why you liked it*). Dòng cuối thường yêu cầu giải thích cảm nghĩ, đó là chỗ để bạn nói dài nhất.

### Cách ghi chú trong 1 phút
Không viết câu đầy đủ. Mỗi gạch đầu dòng chỉ cần 2–3 từ khoá và một chi tiết cụ thể.
| Gợi ý trong cue card | Ghi chú mẫu |
|---|---|
| Where it was | Da Lat, mountain city |
| When you went | last year, with friends, 3 days |
| What you did | coffee farm, cycling, rain |
| Why you liked it | cool air, calm, escape deadlines |

Ghi thêm một "ý dự phòng" (một ví dụ hoặc cảm xúc) để dùng khi hết ý trước 1 phút 30 giây.

### Dàn ý kể chuyện
1. **Mở**: nêu đề tài trực tiếp: *I'd like to talk about a trip to Da Lat that I took last year.*
2. **Thân**: đi lần lượt theo từng gạch đầu dòng, mỗi ý 2–3 câu.
3. **Kết**: một câu cảm nghĩ hoặc kết luận: *All in all, it was exactly the break I needed.*

### Ngôn ngữ cần có
| Chức năng | Mẫu |
|---|---|
| Mở đầu | *I'd like to talk about...* / *The ... I have in mind is...* |
| Chuyển ý | *As for...*, *Another thing worth mentioning is...* |
| Thì quá khứ | past simple cho chuỗi sự kiện, past continuous cho bối cảnh (*It was raining when...*), past perfect cho việc xảy ra trước (*I had never seen...*) |
| Cảm xúc | *I was over the moon*, *It left a lasting impression on me* |
| Đóng bài | *That's pretty much it.* / *To sum up,...* |

### Lỗi hay gặp
- Nói dưới 1 phút vì chỉ trả lời từng gạch đầu dòng bằng một câu.
- Nhảy giữa quá khứ và hiện tại trong lúc kể.
- Nói quá nhiều thông tin thừa ở gạch đầu dòng đầu tiên, hết thời gian trước khi tới phần "why".
- Dừng lại im lặng khi quên từ thay vì diễn đạt lại.

### Mẹo thời gian
Mục tiêu 1 phút 45 giây. Nếu còn thời gian, thêm một chi tiết giác quan (âm thanh, mùi, màu sắc), một so sánh hoặc một đoạn hội thoại ngắn. Không cần tính chính xác, nhưng đừng ngừng ở 50 giây.

### Tự luyện ngoài app
- Chọn một cue card tự nghĩ, bấm giờ 1 phút ghi chú, ghi âm lần nói đầu tiên. Nghe lại xem có đủ mọi gạch đầu dòng không.
- Lặp lại với cùng đề nhưng nói chi tiết hơn ở phần "why". So sánh hai bản ghi âm.
- Luyện nói không nhìn ghi chú ở lượt thứ ba để tập tự tin.
'''

[[modules]]
id = "isp-part3-discussion"
title = "Part 3: thảo luận trừu tượng"
description = "So sánh quá khứ và hiện tại, dự đoán tương lai, đánh giá, đưa quan điểm có lý do."
lesson = '''
### Part 3 khác gì Part 1
Part 3 hỏi về xã hội và xu hướng chung, không phải bản thân bạn. Giám khảo muốn thấy bạn **giải thích, so sánh, suy đoán và đánh giá**. Đây là phần quyết định bạn chạm band 7 hay không. Câu trả lời tốt dài 4–6 câu (30–45 giây).

### Các dạng câu hỏi và khung trả lời
| Dạng | Ví dụ câu hỏi | Khung |
|---|---|---|
| So sánh quá khứ và hiện tại | *How has communication changed?* | Trước đây ... → Bây giờ ... → Vì ... |
| Dự đoán | *Will people travel more in future?* | Tôi nghĩ ... → vì ... → tuy nhiên ... |
| Nguyên nhân | *Why do people leave their hometown?* | Một lý do chính ... → thêm một lý do ... → ví dụ |
| Đánh giá lợi hại | *Is online learning a good thing?* | Mặt tích cực ... → mặt hạn chế ... → kết luận của tôi |
| Đề xuất | *What can governments do?* | Họ nên ... → vì ... |

### Ngôn ngữ cần có
- **Hedging** (chưa chắc chắn): *I'd say that...*, *It tends to be the case that...*, *In many cases...*, *to some extent*.
- **Suy đoán**: *I suspect that...*, *It's likely that...*, *I wouldn't be surprised if...*.
- **Quá khứ so với hiện tại**: *Back in my parents' day...*, *These days...*, *used to... but now...*.
- **Cân bằng hai mặt**: *On the one hand..., on the other hand...*, *While ... , I'd also argue that...*.
- **Câu điều kiện**: *If cities were designed for pedestrians, air quality would improve.*

### Cấu trúc 4 câu
1. Trả lời trực tiếp bằng hedging: *I'd say it has changed quite dramatically.*
2. Lý do chính: *The main reason is that...*
3. Ví dụ hoặc so sánh: *For example, ... whereas now...*
4. Nhận xét hoặc điều kiện: *That said, it isn't the same for everyone.*

### Lỗi hay gặp
- Trả lời bằng kinh nghiệm cá nhân thay vì nói chung (*I never use...* thay vì *Many people...*).
- Chỉ đưa lý do, không có ví dụ; hoặc chỉ ví dụ mà không giải thích.
- Dùng quá nhiều *I think* ở đầu mỗi câu.
- Khẳng định tuyệt đối (*Everyone*, *always*), nghe thiếu tự nhiên với chủ đề trừu tượng.
- Im lặng khi gặp câu hỏi khó. Hãy nói *That's a tricky one. Let me think...* rồi đi theo khung.

### Mẹo thời gian
Bạn không có thời gian chuẩn bị, vì vậy hãy ghi nhớ khung "trả lời, lý do, ví dụ, so sánh" như một danh sách trong đầu. Mỗi câu hỏi chỉ cần 3 ý, không phải 10.

### Tự luyện ngoài app
Chọn 8 câu hỏi trừu tượng (công nghệ, giáo dục, môi trường), nói mỗi câu 40 giây và ghi âm. Nghe lại để kiểm tra: có hedging không, có ví dụ không, có chuyển sang cá nhân không. Chép lại 3 cụm hay nhất vào sổ từ vựng.
'''

[[modules]]
id = "isp-fluency-discourse"
title = "Độ trôi chảy và discourse marker"
description = "Từ nối tự nhiên, câu kéo thời gian, tự sửa lỗi, paraphrase khi thiếu từ."
lesson = '''
### Fluency không có nghĩa là nói nhanh
Giám khảo đánh giá Fluency & Coherence dựa trên việc bạn nói liền mạch và các ý nối với nhau hợp lý. Nói chậm nhưng đều và có tổ chức tốt hơn nói nhanh rồi dừng khựng. Mục tiêu: ngập ngừng vì **nghĩ ý**, không phải vì tìm từ.

### Discourse marker theo chức năng
| Chức năng | Ví dụ |
|---|---|
| Thêm ý | *Besides, ...*, *On top of that, ...*, *What's more, ...* |
| Đối lập | *However, ...*, *That said, ...*, *Having said that, ...* |
| Nguyên nhân | *The reason is that...*, *That's why...* |
| Ví dụ | *For instance, ...*, *Take ... for example*, *such as* |
| Nhấn mạnh | *Actually, ...*, *To be honest, ...*, *Honestly, ...* |
| Tóm tắt | *All in all, ...*, *To sum up, ...* |
| Diễn đạt lại | *In other words, ...*, *What I mean is...* |

Dùng vừa phải. Cứ mỗi 2–3 câu một marker là tự nhiên; câu nào cũng có marker nghe như đọc thuộc.

### Câu kéo thời gian (không dùng *erm* liên tục)
*That's a good question.*, *Let me think for a second.*, *Well, it depends.*, *I've never really thought about it, but...*. Chọn 3–4 câu và luân phiên.

### Tự sửa lỗi
Khi nói sai, sửa ngắn và nói tiếp: *I go there yesterday... I mean, I went there yesterday.* Đừng xin lỗi hay dừng quá lâu. Một vài lần tự sửa tự nhiên là bình thường và còn cho thấy bạn kiểm soát ngữ pháp.

### Paraphrase khi thiếu từ
| Tình huống | Cách xử lý |
|---|---|
| Quên từ chính xác | Mô tả: *It's the thing you use to...*, *a kind of...* |
| Cần từ trừu tượng | Dùng từ rộng hơn: *a situation where...* |
| Quên tên | *What's it called...*, *the name escapes me* |
| Không biết nói thế nào | Đổi cấu trúc: *It was very noisy* thay vì từ chuyên biệt |

### Lỗi hay gặp
- Lặp *and... and... and...* nối mọi thứ, hoặc chỉ dùng *because* và *so*.
- Dùng *Firstly... Secondly... Finally...* như bài viết: nghe cứng khi nói.
- Dùng *erm* hoặc *you know* hơn 3–4 lần một câu trả lời.
- Dịch từ nối tiếng Việt nghĩa đen: *In the other hand*, *According to me*.

### Mẹo thời gian
Chuẩn bị một "hộp công cụ" gồm 2 marker mỗi chức năng. Khi luyện, thử dùng từng marker mới ít nhất 5 lần trong câu trả lời thật để chúng trở nên tự động.

### Tự luyện ngoài app
- Ghi âm 1 phút nói về chủ đề tuỳ ý, rồi nghe lại và gạch chân các chỗ ngập ngừng. Với mỗi chỗ, tự hỏi: mình đang tìm từ hay tìm ý?
- Chơi trò "no stopping": nói liên tục 90 giây về một vật bạn nhìn thấy trong phòng, không được dừng quá 2 giây.
- Shadowing: chọn đoạn nói tự nhiên, ghi lại các marker người nói dùng và dùng thử trong câu của mình.
'''

[[modules]]
id = "isp-pronunciation-text"
title = "Phát âm qua chữ: trọng âm, -ed, -s, ngữ điệu"
description = "Trọng âm từ và họ từ, cách đọc -ed và -s, âm cuối, trọng âm câu luyện qua mô tả chữ."
lesson = '''
### Pronunciation chiếm 25% điểm Speaking
Band 6 là hiểu được phần lớn lời bạn nói, band 7 là dễ nghe và kiểm soát tốt trọng âm, ngữ điệu. Người Việt thường mất điểm vì **bỏ âm cuối**, **sai trọng âm từ** và **nói đều giọng** (mỗi âm tiết một nhịp). App không có audio nên ta học quy tắc bằng chữ, còn thực hành bạn tự ghi âm.

### Trọng âm từ
Từ nhiều âm tiết có đúng một âm tiết mạnh nhất (đánh dấu ´ để minh hoạ). Quy tắc hữu ích:
| Quy tắc | Ví dụ |
|---|---|
| Danh từ và tính từ hai âm tiết thường nhấn âm đầu | *TAble, HAPpy, PREsent (n)* |
| Động từ hai âm tiết thường nhấn âm sau | *reLAX, deCIDE, preSENT (v)* |
| Từ kết thúc *-tion, -sion, -ic, -ical, -ity, -graphy* nhấn âm ngay trước hậu tố | *eduCAtion, ecoNOmic, uniVERsity, phoTOgraphy* |
| Họ từ đổi trọng âm | *PHOtograph, phoTOgrapher, photoGRAphic* |
| Danh từ ghép nhấn từ đầu | *BLACKboard, LAPtop* |

### Cách đọc -ed
| Âm cuối của động từ | Đọc -ed | Ví dụ |
|---|---|---|
| /t/ hoặc /d/ | /ɪd/ (thêm một âm tiết) | *wanted, needed* |
| Âm vô thanh (/p, k, f, s, ʃ, tʃ/) | /t/ | *worked, stopped, watched* |
| Âm hữu thanh và nguyên âm | /d/ | *played, lived, called* |

Lỗi hay gặp: đọc *worked* thành hai âm tiết (*work-ed*) hoặc bỏ hẳn âm cuối (*work*). Cách sửa: giữ lưỡi chạm nhẹ và bật âm /t/ ngắn.

### Cách đọc -s / -es
| Âm cuối | Đọc -s | Ví dụ |
|---|---|---|
| /s, z, ʃ, tʃ, dʒ/ | /ɪz/ | *buses, watches* |
| Âm vô thanh khác | /s/ | *books, stops* |
| Âm hữu thanh và nguyên âm | /z/ | *friends, plays* |

### Âm cuối và nối âm
Tiếng Việt ít âm cuối phụ âm, nên người học hay nuốt chúng. Hãy phát âm đủ /t/, /d/, /s/ trong *meets, mind, thanks*. Khi từ trước kết thúc bằng phụ âm và từ sau bắt đầu bằng nguyên âm, âm nối liền (*pick it up* nghe như *pi-ki-tup*).

### Trọng âm câu và ngữ điệu
Trong câu, từ nội dung (danh từ, động từ chính, tính từ, trạng từ) được nhấn; từ chức năng (*the, of, to, and*) đọc nhẹ. Ví dụ: *I'd LIKE to VISit the MUseum toMORrow.* Câu hỏi Yes/No thường lên giọng cuối câu, câu trần thuật xuống giọng. Khi liệt kê, lên giọng ở từng mục và xuống ở mục cuối.

### Lỗi hay gặp
- Nói tiếng Anh như đọc tiếng Việt: mỗi âm tiết đều nhau.
- Nhấn sai âm tiết của họ từ (*eCOnomy* đúng, *ecoNOmic* đúng; nhầm hai từ).
- Thêm nguyên âm vào cuối từ (*stop* thành *stop-uh*).

### Tự luyện ngoài app
- Ghi âm 10 từ có hậu tố *-tion, -ic, -ity* và nghe lại xem bạn nhấn âm nào. Tra từ điển có phiên âm để đối chiếu.
- Chọn một đoạn nói bạn thích, nghe lặp theo (shadowing), bắt chước nhịp và ngữ điệu, rồi ghi âm giọng mình để so sánh.
- Đọc to một đoạn văn 100 từ mỗi ngày, chú ý các âm cuối.
