[[questions]]
id = "go-008"
module = "go-basics"
type = "code"
lang = "go"
difficulty = 2
title = "Generic Map / Filter / GroupBy"
prompt = '''
Viết các hàm generic:

- `Map[T, U any](s []T, f func(T) U) []U`
- `Filter[T any](s []T, keep func(T) bool) []T` — luôn trả về slice **khác nil** (rỗng thì `[]T{}`)
- `GroupBy[T any, K comparable](s []T, key func(T) K) map[K][]T` — giữ thứ tự xuất hiện trong mỗi nhóm
'''
starter = '''
package main

func Map[T, U any](s []T, f func(T) U) []U {
	return nil
}

func Filter[T any](s []T, keep func(T) bool) []T {
	return nil
}

func GroupBy[T any, K comparable](s []T, key func(T) K) map[K][]T {
	return nil
}
'''
solution = '''
package main

func Map[T, U any](s []T, f func(T) U) []U {
	out := make([]U, 0, len(s))
	for _, v := range s {
		out = append(out, f(v))
	}
	return out
}

func Filter[T any](s []T, keep func(T) bool) []T {
	out := []T{}
	for _, v := range s {
		if keep(v) {
			out = append(out, v)
		}
	}
	return out
}

func GroupBy[T any, K comparable](s []T, key func(T) K) map[K][]T {
	out := make(map[K][]T)
	for _, v := range s {
		k := key(v)
		out[k] = append(out[k], v)
	}
	return out
}
'''
tests = '''
package main

import (
	"reflect"
	"strconv"
)

var _ = Test("Map int -> string", func(t *T) {
	got := Map([]int{1, 2, 3}, func(i int) string { return strconv.Itoa(i * 2) })
	if !reflect.DeepEqual(got, []string{"2", "4", "6"}) {
		t.Errorf("got %v", got)
	}
})

var _ = Test("Filter giữ số chẵn", func(t *T) {
	got := Filter([]int{1, 2, 3, 4}, func(i int) bool { return i%2 == 0 })
	if !reflect.DeepEqual(got, []int{2, 4}) {
		t.Errorf("got %v", got)
	}
})

var _ = Test("Filter rỗng trả về slice khác nil", func(t *T) {
	got := Filter([]int{1}, func(int) bool { return false })
	if got == nil || len(got) != 0 {
		t.Errorf("muốn []int{} khác nil, got %#v", got)
	}
})

var _ = Test("GroupBy theo độ dài chuỗi", func(t *T) {
	got := GroupBy([]string{"go", "js", "rust", "py", "java"}, func(s string) int { return len(s) })
	want := map[int][]string{2: {"go", "js", "py"}, 4: {"rust", "java"}}
	if !reflect.DeepEqual(got, want) {
		t.Errorf("got %v", got)
	}
})
'''
hints = ["`make([]U, 0, len(s))` cấp phát trước đủ dung lượng.", "Với map, `append(out[k], v)` hoạt động cả khi `out[k]` chưa có (nil slice)."]
explanation = "Từ Go 1.21 có sẵn `slices` và `maps`, nhưng tự viết giúp hiểu generics và nil vs empty slice."
sources = ["go/slices/index", "go/maps/index"]

[[questions]]
id = "go-009"
module = "go-basics"
type = "code"
lang = "go"
difficulty = 2
title = "Stack generic có kiểm tra rỗng"
prompt = '''
Cài đặt `Stack[T any]` với method (pointer receiver):
- `Push(v T)`
- `Pop() (T, bool)` — rỗng thì trả về zero value và `false`
- `Peek() (T, bool)`
- `Len() int`

Zero value `Stack[T]{}` phải dùng được ngay.
'''
starter = '''
package main

type Stack[T any] struct {
	items []T
}

func (s *Stack[T]) Push(v T) {}

func (s *Stack[T]) Pop() (T, bool) {
	var zero T
	return zero, false
}

func (s *Stack[T]) Peek() (T, bool) {
	var zero T
	return zero, false
}

func (s *Stack[T]) Len() int { return 0 }
'''
solution = '''
package main

type Stack[T any] struct {
	items []T
}

func (s *Stack[T]) Push(v T) { s.items = append(s.items, v) }

func (s *Stack[T]) Pop() (T, bool) {
	var zero T
	if len(s.items) == 0 {
		return zero, false
	}
	v := s.items[len(s.items)-1]
	s.items[len(s.items)-1] = zero
	s.items = s.items[:len(s.items)-1]
	return v, true
}

func (s *Stack[T]) Peek() (T, bool) {
	var zero T
	if len(s.items) == 0 {
		return zero, false
	}
	return s.items[len(s.items)-1], true
}

func (s *Stack[T]) Len() int { return len(s.items) }
'''
tests = '''
package main

var _ = Test("LIFO", func(t *T) {
	var s Stack[int]
	s.Push(1)
	s.Push(2)
	s.Push(3)
	for _, want := range []int{3, 2, 1} {
		v, ok := s.Pop()
		if !ok || v != want {
			t.Fatalf("Pop() = %d, %v; muốn %d", v, ok, want)
		}
	}
})

var _ = Test("Pop khi rỗng", func(t *T) {
	var s Stack[string]
	v, ok := s.Pop()
	if ok || v != "" {
		t.Errorf("muốn chuỗi rỗng, false; got %q, %v", v, ok)
	}
})

var _ = Test("Peek không xoá", func(t *T) {
	var s Stack[string]
	s.Push("go")
	v, ok := s.Peek()
	if !ok || v != "go" || s.Len() != 1 {
		t.Errorf("Peek sai: %q %v len=%d", v, ok, s.Len())
	}
})

var _ = Test("Len", func(t *T) {
	var s Stack[int]
	s.Push(1)
	s.Push(1)
	s.Pop()
	if s.Len() != 1 {
		t.Errorf("Len = %d", s.Len())
	}
})
'''
hints = ["Lấy phần tử cuối `s.items[len(s.items)-1]` rồi cắt slice `s.items[:len-1]`."]
explanation = "Gán zero value vào ô vừa pop giúp GC thu hồi đối tượng (quan trọng khi T là pointer)."

