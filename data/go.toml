prompt = '''
Phỏng vấn senior: giải thích cách `context.Context` lan truyền huỷ bỏ và deadline qua một chuỗi gọi (HTTP handler → service → DB/HTTP client). Nêu các quy tắc dùng context đúng và các lỗi thường gặp.
