[[questions]]
id = "go-dvc03"
module = "go-dv-io"
type = "code"
lang = "go"
difficulty = 3
title = "Đọc dòng từ io.Reader"
prompt = '''
Viết `ReadLines(r io.Reader) ([]string, error)` bằng thư viện chuẩn:
- Tách theo quy tắc dòng của `bufio.Scanner`: giữ dòng rỗng, bỏ `\n` và `\r` của CRLF, giữ dòng cuối không có newline.
- Input rỗng trả slice rỗng và `nil` error.
- Hỗ trợ dòng dài tối đa 1 MiB; nếu reader lỗi hoặc dòng vượt giới hạn, trả `nil, error`.
- Không đóng `r` vì hàm không sở hữu reader.
'''
starter = '''
package main

import "io"

func ReadLines(r io.Reader) ([]string, error) {
	return nil, nil
}
'''
solution = '''
package main

import (
	"bufio"
	"errors"
	"io"
)

func ReadLines(r io.Reader) ([]string, error) {
	scanner := bufio.NewScanner(r)
	scanner.Buffer(make([]byte, 64*1024), 1024*1024+2)
	lines := []string{}
	for scanner.Scan() {
		if len(scanner.Bytes()) > 1024*1024 {
			return nil, errors.New("line exceeds 1 MiB")
		}
		lines = append(lines, scanner.Text())
	}
	if err := scanner.Err(); err != nil {
		return nil, err
	}
	return lines, nil
}
'''
tests = '''
package main

import (
	"errors"
	"reflect"
	"strings"
)

type brokenReader struct{}

func (brokenReader) Read([]byte) (int, error) {
	return 0, errors.New("read failed")
}

var _ = Test("dòng thường, rỗng và CRLF", func(t *T) {
	got, err := ReadLines(strings.NewReader("alpha\r\n\r\nbeta\n"))
	if err != nil || !reflect.DeepEqual(got, []string{"alpha", "", "beta"}) {
		t.Errorf("got %#v, %v", got, err)
	}
})

var _ = Test("dòng cuối không có newline", func(t *T) {
	got, err := ReadLines(strings.NewReader("last line"))
	if err != nil || !reflect.DeepEqual(got, []string{"last line"}) {
		t.Errorf("got %#v, %v", got, err)
	}
})

var _ = Test("input rỗng trả slice rỗng", func(t *T) {
	got, err := ReadLines(strings.NewReader(""))
	if err != nil || !reflect.DeepEqual(got, []string{}) {
		t.Errorf("got %#v, %v", got, err)
	}
})

var _ = Test("đọc dòng dài hơn buffer mặc định", func(t *T) {
	line := strings.Repeat("x", 70*1024)
	got, err := ReadLines(strings.NewReader(line))
	if err != nil || len(got) != 1 || got[0] != line {
		t.Errorf("len=%d, err=%v", len(got), err)
	}
})

var _ = Test("chấp nhận dòng đúng 1 MiB và từ chối dài hơn", func(t *T) {
	line := strings.Repeat("x", 1024*1024)
	got, err := ReadLines(strings.NewReader(line + "\r\n"))
	if err != nil || len(got) != 1 || got[0] != line {
		t.Errorf("độ dài biên: got=%d err=%v", len(got), err)
	}
	got, err = ReadLines(strings.NewReader(line + "x"))
	if err == nil || got != nil {
		t.Errorf("dòng vượt giới hạn: got=%d err=%v", len(got), err)
	}
})

var _ = Test("trả lỗi từ reader", func(t *T) {
	got, err := ReadLines(brokenReader{})
	if err == nil || got != nil {
		t.Errorf("got %#v, %v", got, err)
	}
})
'''
hints = ["Dùng `bufio.Scanner` và cấu hình buffer tối đa 1 MiB.", "Luôn kiểm tra `scanner.Err()` sau khi `Scan` kết thúc."]
explanation = "Hàm xử lý một stream mượn từ caller, giữ quy tắc dòng rõ ràng và trả lỗi đọc thay vì âm thầm bỏ dữ liệu."
sources = ["go/bufio/index#NewScanner", "go/bufio/index#Scanner.Buffer", "go/bufio/index#Scanner.Err"]
