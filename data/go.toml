[[questions]]
id = "go-lv016"
module = "go-lead"
type = "essay"
difficulty = 3
tags = ["level:lead", "architecture"]
prompt = '''
Bạn là lead của một team 5 người sắp bắt đầu một service Go mới (REST API + Postgres + worker xử lý job nền), dự kiến sống nhiều năm. Hãy viết ADR ngắn về **layout dự án và ranh giới package**: phương án đã cân nhắc, quyết định, hệ quả và điều kiện xem lại.
'''
keywords = [["internal", "internal/"], ["domain", "theo tính năng", "feature"], ["interface"], ["cmd", "cmd/"], ["trade-off", "đánh đổi", "hệ quả", "nhược điểm"], ["test", "kiểm thử"]]
min_keywords = 4
model_answer = '''
**ADR-001: Layout service theo domain.**

- **Bối cảnh**: 5 dev, API + worker dùng chung logic, dự kiến sống lâu, có thể tách service sau này.
- **Phương án**: (1) phẳng một package — nhanh nhưng rối khi lớn; (2) theo tầng `handler/service/repo` — quen thuộc nhưng mỗi tính năng chạm nhiều package, dễ import vòng; (3) theo domain.
- **Quyết định**: chọn (3). `cmd/api` và `cmd/worker` là hai binary mỏng; logic nằm trong `internal/order`, `internal/billing`… để package bên ngoài không import được. Mỗi domain tự chứa handler, service, store. Interface nhỏ khai báo ở phía dùng; constructor trả struct cụ thể. Wiring dependency làm thủ công trong `main`.
- **Hệ quả / đánh đổi**: ranh giới rõ, dễ tách domain thành service; nhược điểm là cần kỷ luật để không gọi chéo nội bộ domain khác — chỉ qua API export của domain. Unit test dùng fake qua interface, integration test cho store với DB thật.
- **Xem lại** khi số domain > 10 hoặc khi một domain cần deploy độc lập.
'''
explanation = "ADR tốt nêu bối cảnh, các phương án và trade-off, quyết định cụ thể (cmd/, internal/, interface phía dùng), chiến lược test và điều kiện xem lại."
sources = ["go/go/build/index"]

[[questions]]
id = "go-lv017"
module = "go-lead"
type = "essay"
difficulty = 3
tags = ["level:lead", "incident"]
prompt = '''
Một service Go trên production có số goroutine tăng đều từ 2k lên 80k trong 3 ngày, memory tăng theo, cuối cùng bị restart. Hãy trình bày kế hoạch của lead: điều tra, khắc phục ngắn hạn, sửa gốc và biện pháp phòng ngừa cho cả team.
'''
keywords = [["pprof", "goroutine profile", "profile"], ["leak", "rò rỉ"], ["context", "timeout", "deadline"], ["metric", "alert", "cảnh báo", "dashboard"], ["postmortem", "hậu kiểm"], ["test", "goleak", "kiểm thử"]]
min_keywords = 4
model_answer = '''
**Điều tra**: lấy goroutine profile từ endpoint pprof nội bộ (`debug=2` để thấy stack), nhóm theo stack — thường một vài vị trí chiếm hầu hết, ví dụ goroutine kẹt ở gửi vào channel không ai đọc hoặc chờ HTTP call không có timeout. Đối chiếu thời điểm bắt đầu tăng với release.

**Ngắn hạn**: rollback release nghi vấn hoặc tạm restart định kỳ, đặt cảnh báo để không bị bất ngờ.

**Sửa gốc**: đảm bảo mọi goroutine có đường thoát — truyền context có timeout/deadline vào lời gọi downstream, dùng `select` với `ctx.Done()` khi gửi/nhận channel, dùng channel có buffer cho kết quả mà người nhận có thể bỏ đi. Đây là goroutine leak kinh điển.

**Phòng ngừa**: metric số goroutine + alert khi tăng tuyến tính; checklist review "mỗi goroutine có đường kết thúc"; test kiểm tra rò rỉ (đếm goroutine trước/sau hoặc dùng thư viện kiểu goleak); viết postmortem không đổ lỗi và chia sẻ cho team.
'''
explanation = "Câu trả lời tốt dùng dữ liệu (goroutine profile) thay vì đoán, tách khắc phục ngắn hạn và sửa gốc, và biến bài học thành cơ chế cho team: metric/alert, checklist review, test."
sources = ["go/runtime/pprof/index", "go/net/http/pprof/index", "go/context/index"]

