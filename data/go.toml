model_answer = '''
Error là giá trị khiến luồng lỗi **tường minh** trong chữ ký hàm, buộc người gọi xử lý, không có luồng nhảy ẩn như exception.

Best practice:
- Kiểm tra `if err != nil` ngay và **return sớm**, không bỏ qua lỗi (`_`).
- **Wrap** kèm ngữ cảnh bằng `fmt.Errorf("...: %w", err)`, chỉ log ở tầng trên cùng (tránh log trùng).
- Dùng **sentinel error** / kiểu lỗi riêng và kiểm tra bằng `errors.Is` / `errors.As`, không so sánh chuỗi.
- `panic` chỉ cho lỗi lập trình không phục hồi được; recover ở ranh giới (HTTP middleware).
'''
