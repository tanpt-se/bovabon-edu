model_answer = '''
Context tạo thành cây: `r.Context()` là gốc của request, mỗi `WithTimeout`/`WithCancel` tạo con. Khi cha bị huỷ (client ngắt, server shutdown) hoặc hết deadline, tín hiệu lan xuống mọi con; code chờ I/O lắng nghe `ctx.Done()` và trả `ctx.Err()`. Thư viện chuẩn như `database/sql` (`QueryContext`) và `http.NewRequestWithContext` tôn trọng context này.

Quy tắc: truyền ctx làm tham số đầu tiên, không lưu trong struct; luôn `defer cancel()` sau `WithTimeout` để giải phóng timer; timeout con nên nhỏ hơn deadline cha; `WithValue` chỉ cho dữ liệu phạm vi request (request_id, user) với key kiểu riêng, không dùng để truyền tham số tuỳ chọn.

Lỗi thường gặp: dùng `context.Background()` sâu trong request nên mất huỷ bỏ; quên `cancel` gây rò timer; vòng lặp/goroutine không kiểm tra `ctx.Done()` nên tiếp tục chạy sau khi request kết thúc; nuốt `context.Canceled` như lỗi thường và log ồn ào.
'''
