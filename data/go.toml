[[questions]]
id = "go-024"
module = "go-errors"
type = "essay"
difficulty = 2
prompt = "Vì sao Go dùng error là giá trị thay vì exception? Nêu best practice xử lý lỗi trong Go."
keywords = [
  ["tường minh", "explicit", "rõ ràng"],
  ["wrap", "%w", "ngữ cảnh", "context"],
  ["errors.is", "errors.as", "sentinel"],
  ["panic"],
  ["không bỏ qua", "if err != nil", "kiểm tra ngay", "return sớm"],
]
min_keywords = 3
model_answer = '''
Error là giá trị khiến luồng lỗi **tường minh** trong chữ ký hàm, buộc người gọi xử lý, không có luồng nhảy ẩn như exception.

Best practice:
- Kiểm tra `if err != nil` ngay và **return sớm**, không bỏ qua lỗi (`_`).
- **Wrap** kèm ngữ cảnh bằng `fmt.Errorf("...: %w", err)`, chỉ log ở tầng trên cùng (tránh log trùng).
- Dùng **sentinel error** / kiểu lỗi riêng và kiểm tra bằng `errors.Is` / `errors.As`, không so sánh chuỗi.
- `panic` chỉ cho lỗi lập trình không phục hồi được; recover ở ranh giới (HTTP middleware).
'''
explanation = "Go 1.20+ có `errors.Join` để gộp nhiều lỗi."

[[questions]]
id = "go-025"
module = "go-errors"
type = "code"
lang = "go"
difficulty = 3
title = "Sentinel error, custom error & wrapping"
prompt = '''
Một repository người dùng:

1. Khai báo sentinel `ErrNotFound = errors.New("not found")`
2. Kiểu lỗi `ValidationError{Field string}` có method `Error()` trả về `"invalid " + Field`
3. `FindUser(db map[int]string, id int) (string, error)`:
   - `id <= 0` → trả về `&ValidationError{Field: "id"}`
   - không có trong map → lỗi **wrap** `ErrNotFound` với ngữ cảnh: `fmt.Errorf("user %d: %w", id, ErrNotFound)`
   - có → trả về tên, `nil`
'''
starter = '''
package main

import "errors"

var ErrNotFound = errors.New("TODO")

type ValidationError struct {
	Field string
}

func (e *ValidationError) Error() string { return "" }

func FindUser(db map[int]string, id int) (string, error) {
	return "", nil
}
'''
solution = '''
package main

import (
	"errors"
	"fmt"
)

var ErrNotFound = errors.New("not found")

type ValidationError struct {
	Field string
}

func (e *ValidationError) Error() string { return "invalid " + e.Field }

func FindUser(db map[int]string, id int) (string, error) {
	if id <= 0 {
		return "", &ValidationError{Field: "id"}
	}
	name, ok := db[id]
	if !ok {
		return "", fmt.Errorf("user %d: %w", id, ErrNotFound)
	}
	return name, nil
}
'''
tests = '''
package main

import "errors"

var db = map[int]string{1: "An", 2: "Bình"}

var _ = Test("tìm thấy", func(t *T) {
	name, err := FindUser(db, 2)
	if err != nil || name != "Bình" {
		t.Errorf("got %q, %v", name, err)
	}
})

var _ = Test("không tìm thấy: errors.Is + message có ngữ cảnh", func(t *T) {
	_, err := FindUser(db, 9)
	if !errors.Is(err, ErrNotFound) {
		t.Fatalf("errors.Is(err, ErrNotFound) = false, err = %v", err)
	}
	if err.Error() != "user 9: not found" {
		t.Errorf("message = %q", err.Error())
	}
})

var _ = Test("id không hợp lệ: errors.As", func(t *T) {
	_, err := FindUser(db, 0)
	var ve *ValidationError
	if !errors.As(err, &ve) || ve.Field != "id" {
		t.Fatalf("muốn *ValidationError{id}, got %v", err)
	}
	if err.Error() != "invalid id" {
		t.Errorf("message = %q", err.Error())
	}
})

var _ = Test("id âm không hợp lệ", func(t *T) {
	_, err := FindUser(db, -1)
	var ve *ValidationError
	if !errors.As(err, &ve) || ve.Field != "id" {
		t.Fatalf("muốn *ValidationError{id}, got %v", err)
	}
})
'''
hints = ["Nhớ import `fmt` khi dùng `fmt.Errorf`.", "Dùng `%w` (không phải `%v`) để wrap."]
explanation = "Pattern chuẩn: tầng repository trả lỗi có ngữ cảnh, tầng handler dùng `errors.Is/As` để map sang HTTP status (404, 400)."
sources = ["go/errors/index#Is", "go/errors/index"]

