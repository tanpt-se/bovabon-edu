solution = '''
package main

import (
	"errors"
	"fmt"
)

var ErrNotFound = errors.New("not found")

type ValidationError struct {
	Field string
}

func (e *ValidationError) Error() string { return "invalid " + e.Field }

func FindUser(db map[int]string, id int) (string, error) {
	if id <= 0 {
		return "", &ValidationError{Field: "id"}
	}
	name, ok := db[id]
	if !ok {
		return "", fmt.Errorf("user %d: %w", id, ErrNotFound)
	}
	return name, nil
}
'''
tests = '''
package main

import "errors"

var db = map[int]string{1: "An", 2: "Bình"}

var _ = Test("tìm thấy", func(t *T) {
	name, err := FindUser(db, 2)
	if err != nil || name != "Bình" {
		t.Errorf("got %q, %v", name, err)
	}
})

var _ = Test("không tìm thấy: errors.Is + message có ngữ cảnh", func(t *T) {
	_, err := FindUser(db, 9)
	if !errors.Is(err, ErrNotFound) {
		t.Fatalf("errors.Is(err, ErrNotFound) = false, err = %v", err)
	}
	if err.Error() != "user 9: not found" {
		t.Errorf("message = %q", err.Error())
	}
})

var _ = Test("id không hợp lệ: errors.As", func(t *T) {
	_, err := FindUser(db, 0)
	var ve *ValidationError
	if !errors.As(err, &ve) || ve.Field != "id" {
		t.Fatalf("muốn *ValidationError{id}, got %v", err)
	}
	if err.Error() != "invalid id" {
		t.Errorf("message = %q", err.Error())
