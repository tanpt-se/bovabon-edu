[[questions]]
id = "go-lvc03"
module = "go-basics"
type = "code"
lang = "go"
difficulty = 1
tags = ["level:junior", "maps"]
title = "Đếm tần suất từ"
prompt = '''
Viết `func WordCount(s string) map[string]int` đếm số lần xuất hiện mỗi từ:

- Từ được tách theo khoảng trắng bất kỳ (space, tab, xuống dòng).
- Không phân biệt hoa thường: `"Go"` và `"go"` là một từ, key lưu dạng chữ thường.
- Chuỗi rỗng hoặc chỉ có khoảng trắng trả về map rỗng (khác nil).

Ví dụ: `WordCount("Go is fun go")` → `map[fun:1 go:2 is:1]`.
'''
starter = '''
package main

func WordCount(s string) map[string]int {
	return nil
}
'''
solution = '''
package main

import "strings"

func WordCount(s string) map[string]int {
	out := make(map[string]int)
	for _, w := range strings.Fields(s) {
		out[strings.ToLower(w)]++
	}
	return out
}
'''
tests = '''
package main

import "reflect"

var _ = Test("đếm cơ bản", func(t *T) {
	got := WordCount("a b a")
	if !reflect.DeepEqual(got, map[string]int{"a": 2, "b": 1}) {
		t.Errorf("got %v", got)
	}
})

var _ = Test("không phân biệt hoa thường", func(t *T) {
	got := WordCount("Go is fun go")
	want := map[string]int{"go": 2, "is": 1, "fun": 1}
	if !reflect.DeepEqual(got, want) {
		t.Errorf("got %v", got)
	}
})

var _ = Test("nhiều loại khoảng trắng", func(t *T) {
	got := WordCount("  x\ty\n\nx  ")
	if !reflect.DeepEqual(got, map[string]int{"x": 2, "y": 1}) {
		t.Errorf("got %v", got)
	}
})

var _ = Test("chuỗi rỗng trả map rỗng khác nil", func(t *T) {
	got := WordCount("   ")
	if got == nil || len(got) != 0 {
		t.Errorf("got %#v", got)
	}
})
'''
hints = ["`strings.Fields` tách theo mọi khoảng trắng và bỏ phần rỗng.", "`m[k]++` hoạt động cả khi key chưa có vì zero value là 0."]
explanation = "Bài tập luyện map, zero value và package `strings`. `make(map...)` đảm bảo kết quả khác nil để caller ghi thêm được."
sources = ["go/strings/index#Fields", "go/maps/index"]

