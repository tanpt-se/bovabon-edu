[[questions]]
id = "go-lvc02"
module = "go-concurrency"
type = "code"
lang = "go"
difficulty = 3
tags = ["level:senior", "rate-limit"]
title = "Token bucket an toàn đồng thời"
prompt = '''
Cài đặt rate limiter token bucket, thời gian được **inject** để test được:

```go
type Bucket struct { /* tự thiết kế */ }
func NewBucket(capacity int, refillPerSec float64, now func() time.Time) *Bucket
func (b *Bucket) Allow() bool
```

- Bucket bắt đầu **đầy** (`capacity` token).
- Token được nạp liên tục theo thời gian: sau `d` thời gian thêm `d.Seconds() * refillPerSec` token (cho phép phần lẻ), không vượt `capacity`.
- `Allow()` lấy 1 token nếu còn ≥ 1 và trả `true`; ngược lại trả `false`.
- Đồng hồ lấy từ `now()`, **không** gọi `time.Now()` trực tiếp.
- `Allow` phải an toàn khi gọi từ nhiều goroutine.
'''
starter = '''
package main

import "time"

type Bucket struct {
	now func() time.Time
}

func NewBucket(capacity int, refillPerSec float64, now func() time.Time) *Bucket {
	return &Bucket{now: now}
}

func (b *Bucket) Allow() bool {
	return true
}
'''
solution = '''
package main

import (
	"sync"
	"time"
)

type Bucket struct {
	mu     sync.Mutex
	cap    float64
	rate   float64
	tokens float64
	last   time.Time
	now    func() time.Time
}

func NewBucket(capacity int, refillPerSec float64, now func() time.Time) *Bucket {
	return &Bucket{cap: float64(capacity), rate: refillPerSec, tokens: float64(capacity), last: now(), now: now}
}

func (b *Bucket) Allow() bool {
	b.mu.Lock()
	defer b.mu.Unlock()
	t := b.now()
	if elapsed := t.Sub(b.last).Seconds(); elapsed > 0 {
		b.tokens += elapsed * b.rate
		if b.tokens > b.cap {
			b.tokens = b.cap
		}
		b.last = t
	}
	if b.tokens >= 1 {
		b.tokens--
		return true
	}
	return false
}
'''
tests = '''
package main

import (
	"sync"
	"sync/atomic"
	"time"
)

type fakeClock struct {
	mu sync.Mutex
	t  time.Time
}

func (c *fakeClock) Now() time.Time { c.mu.Lock(); defer c.mu.Unlock(); return c.t }
func (c *fakeClock) Add(d time.Duration) { c.mu.Lock(); c.t = c.t.Add(d); c.mu.Unlock() }

func newClock() *fakeClock { return &fakeClock{t: time.Unix(1000, 0)} }

var _ = Test("bắt đầu đầy và hết token thì từ chối", func(t *T) {
	c := newClock()
	b := NewBucket(3, 1, c.Now)
	for i := 0; i < 3; i++ {
		if !b.Allow() {
			t.Fatalf("lần %d phải được phép", i+1)
		}
	}
	if b.Allow() {
		t.Error("lần thứ 4 phải bị từ chối")
	}
})

var _ = Test("nạp lại theo thời gian", func(t *T) {
	c := newClock()
	b := NewBucket(2, 2, c.Now)
	b.Allow()
	b.Allow()
	c.Add(500 * time.Millisecond)
	if !b.Allow() {
		t.Error("sau 0.5s với 2 token/s phải có 1 token")
	}
	if b.Allow() {
		t.Error("chỉ có 1 token")
	}
})

var _ = Test("không vượt capacity", func(t *T) {
	c := newClock()
	b := NewBucket(2, 10, c.Now)
	c.Add(time.Hour)
	n := 0
	for i := 0; i < 5; i++ {
		if b.Allow() {
			n++
		}
	}
	if n != 2 {
		t.Errorf("được phép %d, muốn 2", n)
	}
})

var _ = Test("cộng dồn phần lẻ token", func(t *T) {
	c := newClock()
	b := NewBucket(1, 1, c.Now)
	b.Allow()
	c.Add(400 * time.Millisecond)
	if b.Allow() {
		t.Fatal("0.4 token chưa đủ")
	}
	c.Add(700 * time.Millisecond)
	if !b.Allow() {
		t.Error("0.4 + 0.7 = 1.1 token phải đủ")
	}
})

var _ = Test("an toàn đồng thời: đúng capacity lượt được phép", func(t *T) {
	c := newClock()
	b := NewBucket(50, 0, c.Now)
	var ok int32
	var wg sync.WaitGroup
	for i := 0; i < 200; i++ {
		wg.Add(1)
		go func() {
			defer wg.Done()
			if b.Allow() {
				atomic.AddInt32(&ok, 1)
			}
		}()
	}
	wg.Wait()
	if ok != 50 {
		t.Errorf("được phép %d, muốn 50", ok)
	}
})
'''
hints = ["Lưu `tokens float64` và thời điểm nạp cuối `last`; mỗi lần `Allow` tính thời gian trôi qua để cộng token.", "Bảo vệ toàn bộ đọc-sửa-ghi bằng `sync.Mutex`."]
explanation = "Token bucket cho phép burst tới `capacity` rồi giữ tốc độ trung bình. Nạp lười (lazy refill) khi gọi `Allow` tránh cần goroutine ticker; inject clock giúp test xác định, không phụ thuộc `time.Sleep`."
sources = ["go/sync/index#Mutex", "go/time/index#Duration"]

