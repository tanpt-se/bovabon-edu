[[questions]]
id = "go-046"
module = "go-concurrency"
type = "code"
lang = "go"
difficulty = 3
title = "Worker pool giữ thứ tự kết quả"
prompt = '''
Viết `ParallelMap(inputs []int, workers int, f func(int) int) []int`:
- Chạy `f` song song với **tối đa** `workers` goroutine
- Kết quả trả về **đúng thứ tự** của `inputs`
- `workers <= 0` coi như 1

Dùng channel jobs + `sync.WaitGroup`.
'''
starter = '''
package main

func ParallelMap(inputs []int, workers int, f func(int) int) []int {
	return nil
}
'''
solution = '''
package main

import "sync"

func ParallelMap(inputs []int, workers int, f func(int) int) []int {
	if workers <= 0 {
		workers = 1
	}
	results := make([]int, len(inputs))
	jobs := make(chan int)
	var wg sync.WaitGroup
	for w := 0; w < workers; w++ {
		wg.Add(1)
		go func() {
			defer wg.Done()
			for i := range jobs {
				results[i] = f(inputs[i])
			}
		}()
	}
	for i := range inputs {
		jobs <- i
	}
	close(jobs)
	wg.Wait()
	return results
}
'''
tests = '''
package main

import (
	"reflect"
	"sync"
	"sync/atomic"
	"time"
)

var _ = Test("đúng thứ tự", func(t *T) {
	got := ParallelMap([]int{1, 2, 3, 4, 5}, 3, func(x int) int {
		time.Sleep(time.Duration(6-x) * time.Millisecond)
		return x * x
	})
	if !reflect.DeepEqual(got, []int{1, 4, 9, 16, 25}) {
		t.Errorf("got %v", got)
	}
})

var _ = Test("không vượt quá số worker", func(t *T) {
	var cur, peak int64
	var mu sync.Mutex
	ParallelMap(make([]int, 20), 4, func(x int) int {
		n := atomic.AddInt64(&cur, 1)
		mu.Lock()
		if n > peak {
			peak = n
		}
		mu.Unlock()
		time.Sleep(3 * time.Millisecond)
		atomic.AddInt64(&cur, -1)
		return x
	})
	if peak > 4 || peak < 2 {
		t.Errorf("peak concurrency = %d, muốn 2..4", peak)
	}
})

var _ = Test("input rỗng", func(t *T) {
	got := ParallelMap(nil, 2, func(x int) int { return x })
	if len(got) != 0 {
		t.Errorf("got %v", got)
	}
})

var _ = Test("workers <= 0", func(t *T) {
	got := ParallelMap([]int{7}, 0, func(x int) int { return x + 1 })
	if !reflect.DeepEqual(got, []int{8}) {
		t.Errorf("got %v", got)
	}
})
'''
hints = ["Gửi **index** vào channel jobs, worker ghi vào `results[i]` — mỗi index chỉ một goroutine ghi nên không race.", "Nhớ `close(jobs)` để các worker thoát vòng `range`."]
explanation = "Worker pool giới hạn tài nguyên (số kết nối DB, CPU) — thực tế có thể dùng `errgroup.Group` với `SetLimit`."
sources = ["go/sync/index#WaitGroup"]

[[questions]]
id = "go-047"
module = "go-concurrency"
type = "code"
lang = "go"
difficulty = 3
title = "Gọi hàm có timeout bằng context"
prompt = '''
Viết `WithTimeout(ctx context.Context, d time.Duration, f func(ctx context.Context) (string, error)) (string, error)`:
- Tạo context con có timeout `d`, gọi `f` trong goroutine
- Nếu `f` xong trước → trả kết quả của `f`
- Nếu hết giờ / ctx cha bị huỷ trước → trả về `"", ctx.Err()` của context con (`context.DeadlineExceeded` hoặc `context.Canceled`)
- Không được rò rỉ goroutine bị chặn mãi (dùng channel có buffer 1)
'''
starter = '''
package main

import (
	"context"
	"time"
)

func WithTimeout(ctx context.Context, d time.Duration, f func(ctx context.Context) (string, error)) (string, error) {
	return f(ctx)
}
'''
solution = '''
package main

import (
	"context"
	"time"
)

func WithTimeout(ctx context.Context, d time.Duration, f func(ctx context.Context) (string, error)) (string, error) {
	ctx, cancel := context.WithTimeout(ctx, d)
	defer cancel()
	type result struct {
		v   string
		err error
	}
	ch := make(chan result, 1)
	go func() {
		v, err := f(ctx)
		ch <- result{v, err}
	}()
	select {
	case r := <-ch:
		return r.v, r.err
	case <-ctx.Done():
		return "", ctx.Err()
	}
}
'''
tests = '''
package main

import (
	"context"
	"errors"
	"time"
)

var _ = Test("xong trước timeout", func(t *T) {
	v, err := WithTimeout(context.Background(), 200*time.Millisecond, func(ctx context.Context) (string, error) {
		return "ok", nil
	})
	if v != "ok" || err != nil {
		t.Errorf("got %q, %v", v, err)
	}
})

var _ = Test("hết giờ trả DeadlineExceeded", func(t *T) {
	start := time.Now()
	_, err := WithTimeout(context.Background(), 30*time.Millisecond, func(ctx context.Context) (string, error) {
		time.Sleep(500 * time.Millisecond)
		return "late", nil
	})
	if !errors.Is(err, context.DeadlineExceeded) {
		t.Fatalf("err = %v", err)
	}
	if time.Since(start) > 300*time.Millisecond {
		t.Errorf("phải trả về ngay khi hết giờ, mất %v", time.Since(start))
	}
})

var _ = Test("ctx cha bị huỷ", func(t *T) {
	parent, cancel := context.WithCancel(context.Background())
	cancel()
	_, err := WithTimeout(parent, time.Second, func(ctx context.Context) (string, error) {
		<-ctx.Done()
		return "", ctx.Err()
	})
	if !errors.Is(err, context.Canceled) {
		t.Errorf("err = %v", err)
	}
})

var _ = Test("lỗi của f được trả về", func(t *T) {
	boom := errors.New("boom")
	_, err := WithTimeout(context.Background(), time.Second, func(ctx context.Context) (string, error) {
		return "", boom
	})
	if !errors.Is(err, boom) {
		t.Errorf("err = %v", err)
	}
})
'''
hints = ["`select` giữa channel kết quả và `ctx.Done()`.", "Buffer 1 giúp goroutine của `f` gửi được kết quả và kết thúc dù không còn ai nhận."]
explanation = "Pattern select + ctx.Done() là cốt lõi cho mọi I/O có timeout trong Go."
sources = ["go/context/index#WithTimeout"]

