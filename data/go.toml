[[questions]]
id = "go-064"
module = "go-web"
type = "code"
lang = "go"
difficulty = 3
title = "Middleware RequireAPIKey + handler JSON"
prompt = '''
Viết:

1. `RequireAPIKey(key string, next http.Handler) http.Handler` — nếu header `X-API-Key` khác `key` thì trả **401** với body JSON `{"error":"unauthorized"}`; ngược lại gọi `next`.
2. `HelloHandler` (kiểu `http.HandlerFunc`) — đọc query `name` (mặc định `"world"`), trả **200** JSON `{"message":"hello, <name>"}` với header `Content-Type: application/json`.

Test dùng `net/http/httptest`.
'''
starter = '''
package main

import "net/http"

func RequireAPIKey(key string, next http.Handler) http.Handler {
	return next
}

var HelloHandler = http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
})
'''
solution = '''
package main

import (
	"encoding/json"
	"net/http"
)

func writeJSON(w http.ResponseWriter, status int, v any) {
	w.Header().Set("Content-Type", "application/json")
	w.WriteHeader(status)
	_ = json.NewEncoder(w).Encode(v)
}

func RequireAPIKey(key string, next http.Handler) http.Handler {
	return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
		if r.Header.Get("X-API-Key") != key {
			writeJSON(w, http.StatusUnauthorized, map[string]string{"error": "unauthorized"})
			return
		}
		next.ServeHTTP(w, r)
	})
}

var HelloHandler = http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
	name := r.URL.Query().Get("name")
	if name == "" {
		name = "world"
	}
	writeJSON(w, http.StatusOK, map[string]string{"message": "hello, " + name})
})
'''
tests = '''
package main

import (
	"encoding/json"
	"net/http"
	"net/http/httptest"
)

func call(h http.Handler, url, key string) (*httptest.ResponseRecorder, map[string]string) {
	req := httptest.NewRequest("GET", url, nil)
	if key != "" {
		req.Header.Set("X-API-Key", key)
	}
	rec := httptest.NewRecorder()
	h.ServeHTTP(rec, req)
	var body map[string]string
	_ = json.Unmarshal(rec.Body.Bytes(), &body)
	return rec, body
}

var app = RequireAPIKey("secret", HelloHandler)

var _ = Test("thiếu API key → 401", func(t *T) {
	rec, body := call(app, "/hello", "")
	if rec.Code != 401 || body["error"] != "unauthorized" {
		t.Errorf("code=%d body=%v", rec.Code, body)
	}
})

var _ = Test("sai API key → 401", func(t *T) {
	rec, _ := call(app, "/hello", "wrong")
	if rec.Code != 401 {
		t.Errorf("code=%d", rec.Code)
	}
})

var _ = Test("đúng key + name", func(t *T) {
	rec, body := call(app, "/hello?name=Gopher", "secret")
	if rec.Code != 200 || body["message"] != "hello, Gopher" {
		t.Errorf("code=%d body=%v", rec.Code, body)
	}
	if ct := rec.Header().Get("Content-Type"); ct != "application/json" {
		t.Errorf("Content-Type = %q", ct)
	}
})

var _ = Test("name mặc định", func(t *T) {
	_, body := call(app, "/hello", "secret")
	if body["message"] != "hello, world" {
		t.Errorf("body=%v", body)
	}
})
'''
hints = ["Middleware trả về `http.HandlerFunc(func(w, r) { ... next.ServeHTTP(w, r) })`.", "Nhớ `return` sau khi ghi 401."]
explanation = "Middleware dạng `func(http.Handler) http.Handler` có thể xếp chồng: logging → auth → handler."
sources = ["go/net/http/index#Handler", "go/encoding/json/index"]

