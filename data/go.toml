[[modules]]
id = "go-basics"
title = "Cú pháp, kiểu & interface"
description = "Zero value, slice/map, struct, method, interface ngầm định, generics."
sources = ["go/builtin/index#append", "go/slices/index#Clone", "go/maps/index#Clone", "go/cmp/index#Ordered", "go/fmt/index#Stringer"]
lesson = '''
### Ý chính
- **Zero value**: biến khai báo không gán có giá trị mặc định (`0`, `""`, `false`, `nil`). Map `nil` đọc được nhưng **ghi sẽ panic**.
- **Slice** là view (pointer, len, cap) lên mảng nền; `append` có thể cấp phát mảng mới khi vượt `cap` → luôn gán lại `s = append(s, x)`.
- **Map** không có thứ tự duyệt cố định; không an toàn khi ghi đồng thời.
- **Method** với pointer receiver `func (u *User) Rename()` mới sửa được struct gốc.
- **Interface** được thoả mãn **ngầm định** (không có `implements`). Interface nhỏ là tốt (`io.Reader`, `fmt.Stringer`).
- **Generics** (Go 1.18+): `func Map[T, U any](s []T, f func(T) U) []U`; ràng buộc `cmp.Ordered`, `comparable`.
- Package `slices`, `maps` (1.21+) có `slices.Sort`, `slices.Contains`, `maps.Keys`…

> Bài code: viết code trong `package main` (không viết hàm `main`). Test dùng `var _ = Test("tên", func(t *T) { ... })` với `t.Errorf`/`t.Fatalf` giống `testing.T`.
'''

[[modules]]
id = "go-errors"
title = "Error handling"
description = "error là giá trị, wrapping với %w, errors.Is/As, sentinel error, panic/recover, defer."
sources = ["go/errors/index#New", "go/errors/index#Is", "go/errors/index#As", "go/fmt/index#Errorf", "go/builtin/index#panic", "go/builtin/index#recover"]
lesson = '''
### Ý chính
- Error là **giá trị**: hàm trả về `(T, error)`; kiểm tra `if err != nil` ngay.
- **Wrap** lỗi kèm ngữ cảnh: `fmt.Errorf("load user %d: %w", id, err)`.
- `errors.Is(err, ErrNotFound)` so sánh theo chuỗi wrap; `errors.As(err, &target)` lấy lỗi theo **kiểu**.
- **Sentinel error**: `var ErrNotFound = errors.New("not found")`.
- `defer` chạy khi hàm return, theo thứ tự **LIFO**; đối số của defer được **đánh giá ngay** lúc khai báo.
- `panic` cho lỗi không thể phục hồi (bug); `recover()` chỉ có tác dụng trong hàm được `defer`.
'''

[[modules]]
id = "go-concurrency"
title = "Concurrency"
description = "Goroutine, channel, select, sync.WaitGroup/Mutex, context, worker pool, race condition."
sources = ["go/sync/index#WaitGroup", "go/sync/index#Mutex", "go/context/index#Context", "go/context/index#WithCancel", "go/context/index#WithTimeout", "go/builtin/index#close"]
lesson = '''
### Ý chính
- **Goroutine** (`go f()`) rất nhẹ (vài KB stack), được Go runtime lập lịch M:N.
- **Channel**: unbuffered → gửi/nhận đồng bộ; buffered → gửi chặn khi đầy. Chỉ **bên gửi** nên `close(ch)`. Đọc từ channel đã đóng trả zero value ngay (`v, ok := <-ch`).
- `select` chờ nhiều channel; `default` để không chặn.
- `sync.WaitGroup` đợi nhóm goroutine; `sync.Mutex` bảo vệ dữ liệu chung; `sync.Once`.
- **context.Context**: truyền deadline/huỷ qua các tầng. Luôn `defer cancel()`. Tham số đầu tiên của hàm: `ctx context.Context`.
- "Don't communicate by sharing memory; share memory by communicating."
- Phát hiện race: `go test -race`.
'''

[[modules]]
id = "go-web"
title = "net/http & JSON"
description = "http.Handler, ServeMux pattern (Go 1.22), middleware, encoding/json, struct tag, graceful shutdown."
sources = ["go/net/http/index#Handler", "go/net/http/index#ServeMux", "go/net/http/index#Request.PathValue", "go/net/http/index#Server.Shutdown", "go/encoding/json/index#Decoder", "go/encoding/json/index#Encoder"]
lesson = '''
### Ý chính
- `http.Handler` là interface có `ServeHTTP(w http.ResponseWriter, r *http.Request)`; `http.HandlerFunc` biến hàm thành Handler.
- Go 1.22 `ServeMux` hỗ trợ method + wildcard: `mux.HandleFunc("GET /users/{id}", h)` → `r.PathValue("id")`.
- **Middleware**: `func(next http.Handler) http.Handler`.
- Gọi `w.WriteHeader(code)` **trước** `w.Write`; header phải set trước khi ghi body.
- JSON: `json.NewDecoder(r.Body).Decode(&v)`, `json.NewEncoder(w).Encode(v)`; struct tag `json:"name,omitempty"`; chỉ field **viết hoa** (exported) mới được encode.
- Server production: đặt `ReadTimeout`, `WriteTimeout`; graceful shutdown bằng `srv.Shutdown(ctx)`.
'''

[[modules]]
id = "go-dv-database"
title = "database/sql & giao dịch"
description = "Connection pool, truy vấn theo context, parameterized query, Rows và transaction."
sources = ["go/database/sql/index#DB", "go/database/sql/index#Open", "go/database/sql/index#DB.QueryContext", "go/database/sql/index#DB.QueryRowContext", "go/database/sql/index#DB.ExecContext", "go/database/sql/index#DB.BeginTx"]
lesson = '''
### `sql.DB` là connection pool
`*sql.DB` là handle an toàn cho nhiều goroutine và quản lý một pool kết nối; nó không đại diện cho một kết nối đơn. `sql.Open` thường chỉ kiểm tra cấu hình driver, chưa chắc đã kết nối được, nên ứng dụng cần `PingContext` khi muốn kiểm tra kết nối lúc khởi động. Hãy tạo một `DB` dùng lâu dài, cấu hình giới hạn pool theo tải và gọi `Close` khi ứng dụng dừng.

| API | Dùng khi | Kết quả cần xử lý |
|---|---|---|
| `QueryContext` | Truy vấn có thể trả nhiều hàng | `Rows`, rồi `Next`, `Scan`, `Err` |
| `QueryRowContext` | Kết quả tối đa một hàng | Gọi `Scan`; không có hàng sẽ là `sql.ErrNoRows` |
| `ExecContext` | INSERT/UPDATE/DELETE không cần đọc hàng | `sql.Result` và `RowsAffected` |

Truyền `context.Context` vào thao tác để timeout hoặc huỷ truy vấn theo request. Dữ liệu phải truyền qua placeholder và arguments, ví dụ `db.QueryContext(ctx, "SELECT id FROM users WHERE email = ?", email)`. Dấu placeholder phụ thuộc database driver; không nối input vào chuỗi SQL bằng `fmt.Sprintf`.

Khi dùng `Rows`, gọi `defer rows.Close()` ngay sau khi kiểm tra lỗi tạo rows; sau vòng `for rows.Next()` vẫn phải kiểm tra `rows.Err()`. Với thao tác nhiều bước cần tính nguyên tử, mở `tx` bằng `BeginTx`, defer `Rollback` để dọn dẹp mọi nhánh, rồi `Commit` khi tất cả bước thành công. Lỗi hay gặp là quên kiểm tra lỗi `Scan`, bỏ qua `Rows.Err`, hoặc gọi `db` thay vì `tx` giữa giao dịch khiến truy vấn chạy trên kết nối khác.
'''

[[modules]]
id = "go-dv-testing"
title = "Testing, benchmark & fuzzing"
description = "Unit test, table-driven subtest, cleanup, benchmark, fuzz test và kiểm tra race."
sources = ["go/testing/index#T", "go/testing/index#T.Run", "go/testing/index#T.Cleanup", "go/testing/index#T.TempDir", "go/testing/index#B", "go/testing/index#F.Add"]
lesson = '''
### Test có thể lặp lại
Go nhận diện test trong file `*_test.go` qua hàm `TestXxx(t *testing.T)`. Một test nên kiểm tra hành vi nhìn thấy được, có tên mô tả tình huống và không phụ thuộc thứ tự chạy. `t.Error` ghi nhận lỗi rồi tiếp tục test hiện tại; `t.Fatal` đánh dấu thất bại và dừng goroutine đang chạy test đó. Không gọi `Fatal` từ goroutine phụ; gửi lỗi về goroutine test hoặc đồng bộ trước.

| Công cụ | Mục tiêu | Dùng khi |
|---|---|---|
| Table-driven + `t.Run` | Chạy cùng quy tắc trên nhiều input | Biên, input sai, case thường |
| `t.Cleanup` / `t.TempDir` | Thu hồi tài nguyên sau test | File tạm, server giả, fixture |
| `BenchmarkXxx(*testing.B)` | Đo chi phí lặp lại | So sánh thay đổi hiệu năng |
| `FuzzXxx(*testing.F)` | Khám phá input bất thường | Parser, decoder, validator |

Ví dụ table-driven: khai báo các case gồm `name`, input và expected, rồi chạy `t.Run(tc.name, ...)`. Subtest giúp biết chính xác case lỗi. Dùng `t.Cleanup` để đóng tài nguyên; `TempDir` tự xoá thư mục khi test kết thúc. Tránh `time.Sleep` để chờ hệ thống và tránh dùng mạng thật vì làm test chậm, không ổn định.

Benchmark phải lặp theo `b.N`, không chọn số vòng cố định; đặt setup trước vòng đo hoặc gọi `b.ResetTimer`. Fuzz test thêm seed bằng `f.Add`, sau đó callback phải kiểm tra bất biến với mọi input. Chạy `go test ./...`, dùng `-race` để tìm data race, `-bench` để đo benchmark; một lần benchmark không tự chứng minh mọi tải production đều nhanh hơn. Lỗi hay gặp là chỉ test happy path, bỏ qua lỗi trả về, hoặc test phụ thuộc trạng thái global.
'''

[[modules]]
id = "go-dv-io"
title = "I/O, buffering & file handling"
description = "io.Reader/Writer, streaming, bufio.Scanner, file lifecycle và xử lý lỗi đọc."
sources = ["go/io/index#Reader", "go/io/index#Copy", "go/io/index#ReadAll", "go/bufio/index#NewScanner", "go/bufio/index#Scanner.Buffer", "go/os/index#ReadFile"]
lesson = '''
### Đọc theo stream
`io.Reader` và `io.Writer` là interface nhỏ giúp hàm làm việc với file, memory buffer, network hoặc test double mà không phụ thuộc nguồn cụ thể. `Read(p)` trả số byte đã đọc cùng lỗi; phải xử lý `n` byte trước khi xử lý `err`, vì một lần gọi có thể trả dữ liệu hợp lệ đồng thời với `io.EOF`. Không giả định một lần `Read` lấp đầy buffer.

| API | Cách dùng | Đánh đổi |
|---|---|---|
| `os.ReadFile` / `io.ReadAll` | Nạp toàn bộ nội dung vào memory | Đơn giản, không phù hợp dữ liệu lớn hoặc không giới hạn |
| `io.Copy(dst, src)` | Chuyển dữ liệu tuần tự giữa hai stream | Ít memory, phù hợp file lớn |
| `bufio.Scanner` | Tách input theo dòng hoặc token | Gọn, có giới hạn kích thước token cần cấu hình |
| `bufio.Reader` | Đọc từng phần, peek hoặc kiểm soát delimiter | Linh hoạt hơn, cần xử lý EOF rõ ràng |

Ví dụ đọc dòng: mở file bằng `os.Open`, defer `Close`, tạo `bufio.Scanner`, lặp `Scan` và sau vòng lặp kiểm tra `scanner.Err()`. Nếu dòng có thể dài hơn giới hạn mặc định, gọi `scanner.Buffer` với mức tối đa phù hợp; vượt mức đó vẫn là lỗi. `ScanLines` bỏ newline và carriage return trước newline, giữ dòng rỗng, đồng thời trả dòng cuối không có newline.

Chọn `ReadFile` cho cấu hình nhỏ đã biết kích thước; với upload hay log lớn hãy stream hoặc giới hạn bytes bằng `io.LimitReader`. Lỗi thường gặp là bỏ qua lỗi cuối của Scanner, gọi `ReadAll` trên input không tin cậy gây tốn RAM, không đóng file, hoặc coi `io.EOF` luôn có nghĩa là lần đọc không trả dữ liệu.
'''

[[modules]]
id = "go-lead"
title = "Góc nhìn Tech Lead"
description = "Layout dự án & ranh giới interface, quy ước error handling, logging/observability, profiling production, chiến lược concurrency cho team, review code Go, nâng version & dependency."
sources = ["go/log/slog/index", "go/net/http/pprof/index", "go/runtime/pprof/index", "go/runtime/debug/index#SetMemoryLimit", "go/errors/index#Join", "go/context/index"]
lesson = '''
### Vai trò Tech Lead trong một codebase Go
Go cố ý ít "phép màu": không có framework DI bắt buộc, không exception, không kế thừa. Vì vậy chất lượng codebase phụ thuộc rất nhiều vào **quy ước của team**. Lead không cần viết code khó nhất, mà phải giúp 5–10 người viết code **giống nhau, dễ đọc, dễ vận hành**.

### Khung ra quyết định
1. **Nêu ràng buộc**: số người, deadline, SLO, chi phí hạ tầng, mức kinh nghiệm Go của team.
2. **Liệt kê 2–3 phương án** và so theo tiêu chí cố định (độ phức tạp, rủi ro vận hành, khả năng đảo ngược).
3. **Chọn phương án đơn giản nhất đạt ràng buộc**, ghi lại bằng ADR ngắn, đặt điểm xem lại (vd. khi traffic x5).

### Bảng so sánh: tổ chức package
| Phương án | Ưu | Nhược | Hợp khi |
|---|---|---|---|
| Phẳng (`main` + vài file) | Nhanh, ít lễ nghi | Rối khi > ~5k dòng | CLI, PoC, service nhỏ |
| Theo tầng (`handler/`, `service/`, `repo/`) | Quen thuộc | Thay đổi 1 tính năng chạm nhiều package, dễ import vòng | Team mới từ Java/.NET, domain đơn giản |
| Theo domain (`order/`, `billing/`) + `internal/` | Ranh giới rõ, dễ tách service sau này | Cần kỷ luật đặt interface | Service sống lâu, nhiều người cùng sửa |

Nguyên tắc: **interface khai báo ở phía dùng** (consumer), nhỏ (1–3 method); trả về struct cụ thể ("accept interfaces, return structs"). Dùng `internal/` để chặn package khác import nhầm.

### Quy ước error handling cho team
- Luôn bọc lỗi bằng `%w` kèm ngữ cảnh thao tác (`"load order %d: %w"`), không log rồi lại return (log trùng).
- Sentinel/kiểu lỗi chỉ export khi caller **thật sự cần phân nhánh**; còn lại là lỗi mờ (opaque).
- Map lỗi domain → HTTP status ở **một chỗ** (tầng transport), không rải `http.Error` khắp service.
- Panic chỉ cho lỗi lập trình; middleware recover ở biên để một request lỗi không làm sập process.

### Observability & profiling production
- Log có cấu trúc bằng `log/slog`, gắn `request_id` qua context; metric RED (rate, errors, duration) cho mỗi endpoint.
- Bật `net/http/pprof` trên **cổng nội bộ riêng**, không phơi ra internet; lấy CPU/heap/goroutine profile khi có sự cố thay vì đoán.
- Đặt `GOMEMLIMIT` (hoặc `debug.SetMemoryLimit`) thấp hơn giới hạn container (ước lượng ~90%) để GC chạy sớm thay vì bị OOM-kill.
- Số goroutine tăng đều theo thời gian gần như luôn là **goroutine leak** — cảnh báo trên metric này.

### Checklist review code Go
- [ ] Mọi goroutine có đường kết thúc (context, close channel, WaitGroup)?
- [ ] I/O nhận `context.Context` làm tham số đầu, có timeout ở client HTTP/DB?
- [ ] Lỗi được kiểm tra, bọc ngữ cảnh, không nuốt `rows.Err()`/`Close()` quan trọng?
- [ ] Map/slice dùng chung có khoá hoặc chỉ một goroutine sở hữu?
- [ ] Test chạy với `-race` trong CI?
- [ ] Interface mới có thật sự cần (≥ 2 implementation hoặc cần fake trong test)?

### ADR mẫu (rút gọn)
> **ADR-007: Dùng `errgroup`-style fan-out có giới hạn cho gọi downstream.** Bối cảnh: endpoint gọi 4 service, p99 1.2s. Quyết định: gọi song song, giới hạn 4, huỷ cả nhóm khi một lỗi, timeout tổng 800ms. Hệ quả: p99 ước lượng ~400ms; tải downstream tăng đột biến → cần rate limit phía họ. Xem lại khi thêm service thứ 6.

### Anti-pattern ở quy mô team
- Package `utils`/`common` phình to, mọi thứ import nó → import vòng, khó tách.
- Interface "khổng lồ" định nghĩa sẵn cho mọi struct "để mock" → khó thay đổi, vô nghĩa.
- `go func()` rải rác không quản lý vòng đời; dùng `context.Background()` sâu trong request.
- Tự viết framework nội bộ (router, DI, ORM) khi thư viện chuẩn đủ dùng — chi phí bảo trì dồn lên team.
- Nâng Go version/dependency hàng loạt không có CI `-race`, không đọc release note (vd. thay đổi ngữ nghĩa biến vòng lặp ở Go 1.22).
'''

