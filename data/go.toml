[[questions]]
id = "go-lvc01"
module = "go-lead"
type = "code"
lang = "go"
difficulty = 3
tags = ["level:lead", "concurrency"]
title = "Fan-out có giới hạn và huỷ khi lỗi"
prompt = '''
Team quy ước mọi fan-out gọi downstream phải đi qua một helper chung. Viết:

```go
func RunAll(ctx context.Context, limit int, tasks []func(context.Context) error) error
```

Yêu cầu:
- Chạy các task **đồng thời**, nhưng không quá `limit` task cùng lúc (`limit <= 0` coi như 1).
- Mỗi task nhận một context con; khi **một task trả lỗi**, context con bị huỷ để các task khác dừng sớm.
- Trả về **lỗi đầu tiên** xảy ra (theo thời gian); `nil` nếu tất cả thành công.
- Task chưa bắt đầu khi đã có lỗi (hoặc khi `ctx` cha bị huỷ) thì **không được chạy**; nếu `ctx` cha bị huỷ và chưa có lỗi task nào, trả `ctx.Err()`.
- Hàm chỉ return sau khi mọi task đã bắt đầu đều kết thúc (không rò goroutine).
'''
starter = '''
package main

import "context"

func RunAll(ctx context.Context, limit int, tasks []func(context.Context) error) error {
	for _, t := range tasks {
		_ = t
	}
	return nil
}
'''
solution = '''
package main

import (
	"context"
	"sync"
)

func RunAll(ctx context.Context, limit int, tasks []func(context.Context) error) error {
	if limit <= 0 {
		limit = 1
	}
	cctx, cancel := context.WithCancel(ctx)
	defer cancel()

	var (
		wg       sync.WaitGroup
		once     sync.Once
		firstErr error
	)
	sem := make(chan struct{}, limit)
	for _, task := range tasks {
		select {
		case sem <- struct{}{}:
		case <-cctx.Done():
		}
		if cctx.Err() != nil {
			break
		}
		wg.Add(1)
		go func(task func(context.Context) error) {
			defer wg.Done()
			defer func() { <-sem }()
			if err := task(cctx); err != nil {
				once.Do(func() {
					firstErr = err
					cancel()
				})
			}
		}(task)
	}
	wg.Wait()
	if firstErr != nil {
		return firstErr
	}
	return ctx.Err()
}
'''
tests = '''
package main

import (
	"context"
	"errors"
	"sync"
	"sync/atomic"
	"time"
)

var _ = Test("tất cả thành công trả nil và chạy đủ task", func(t *T) {
	var n int32
	tasks := make([]func(context.Context) error, 10)
	for i := range tasks {
		tasks[i] = func(context.Context) error { atomic.AddInt32(&n, 1); return nil }
	}
	if err := RunAll(context.Background(), 3, tasks); err != nil {
		t.Fatalf("err = %v", err)
	}
	if n != 10 {
		t.Errorf("chạy %d task, muốn 10", n)
	}
})

var _ = Test("không vượt quá limit task đồng thời", func(t *T) {
	var cur, peak int32
	var mu sync.Mutex
	tasks := make([]func(context.Context) error, 12)
	for i := range tasks {
		tasks[i] = func(context.Context) error {
			c := atomic.AddInt32(&cur, 1)
			mu.Lock()
			if c > peak {
				peak = c
			}
			mu.Unlock()
			time.Sleep(10 * time.Millisecond)
			atomic.AddInt32(&cur, -1)
			return nil
		}
	}
	if err := RunAll(context.Background(), 3, tasks); err != nil {
		t.Fatalf("err = %v", err)
	}
	if peak > 3 || peak < 2 {
		t.Errorf("peak = %d, muốn 2..3 (song song nhưng <= limit)", peak)
	}
})

var _ = Test("lỗi đầu tiên huỷ các task khác và được trả về", func(t *T) {
	boom := errors.New("boom")
	var cancelled int32
	tasks := []func(context.Context) error{
		func(context.Context) error { time.Sleep(5 * time.Millisecond); return boom },
		func(ctx context.Context) error {
			select {
			case <-ctx.Done():
				atomic.AddInt32(&cancelled, 1)
				return ctx.Err()
			case <-time.After(2 * time.Second):
				return nil
			}
		},
	}
	start := time.Now()
	err := RunAll(context.Background(), 2, tasks)
	if !errors.Is(err, boom) {
		t.Fatalf("err = %v, muốn boom", err)
	}
	if cancelled != 1 || time.Since(start) > time.Second {
		t.Errorf("task chậm không bị huỷ sớm (cancelled=%d)", cancelled)
	}
})

var _ = Test("task chưa bắt đầu không chạy sau khi có lỗi", func(t *T) {
	var ran int32
	tasks := []func(context.Context) error{
		func(context.Context) error { return errors.New("fail") },
	}
	for i := 0; i < 5; i++ {
		tasks = append(tasks, func(context.Context) error { atomic.AddInt32(&ran, 1); return nil })
	}
	if err := RunAll(context.Background(), 1, tasks); err == nil {
		t.Fatal("muốn lỗi")
	}
	if ran != 0 {
		t.Errorf("%d task chạy sau lỗi, muốn 0", ran)
	}
})

var _ = Test("ctx cha đã huỷ trả ctx.Err và không chạy task", func(t *T) {
	ctx, cancel := context.WithCancel(context.Background())
	cancel()
	var ran int32
	tasks := []func(context.Context) error{
		func(context.Context) error { atomic.AddInt32(&ran, 1); return nil },
	}
	err := RunAll(ctx, 2, tasks)
	if !errors.Is(err, context.Canceled) || ran != 0 {
		t.Errorf("err=%v ran=%d", err, ran)
	}
})

var _ = Test("limit <= 0 vẫn chạy tuần tự", func(t *T) {
	var n int32
	tasks := []func(context.Context) error{
		func(context.Context) error { atomic.AddInt32(&n, 1); return nil },
		func(context.Context) error { atomic.AddInt32(&n, 1); return nil },
	}
	if err := RunAll(context.Background(), 0, tasks); err != nil || n != 2 {
		t.Errorf("err=%v n=%d", err, n)
	}
})
'''
hints = ["Dùng channel có buffer `limit` làm semaphore; lấy slot bằng `select` cùng `cctx.Done()`.", "`sync.Once` để ghi lỗi đầu tiên và gọi `cancel()` đúng một lần; `wg.Wait()` trước khi return."]
explanation = "Đây là pattern kiểu errgroup với `SetLimit`: semaphore giới hạn tải downstream, context con để huỷ dây chuyền, WaitGroup đảm bảo không rò goroutine. Gom vào một helper chung giúp cả team không tự viết lại (và viết sai) logic này."
sources = ["go/context/index#WithCancel", "go/sync/index#WaitGroup", "go/sync/index#Once"]

