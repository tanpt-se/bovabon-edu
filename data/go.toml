[[modules]]
id = "go-basics"
title = "Cú pháp, kiểu & interface"
description = "Zero value, slice/map, struct, method, interface ngầm định, generics."
sources = ["go/slices/index", "go/maps/index", "go/fmt/index"]
lesson = '''
### Ý chính
- **Zero value**: biến khai báo không gán có giá trị mặc định (`0`, `""`, `false`, `nil`). Map `nil` đọc được nhưng **ghi sẽ panic**.
- **Slice** là view (pointer, len, cap) lên mảng nền; `append` có thể cấp phát mảng mới khi vượt `cap` → luôn gán lại `s = append(s, x)`.
- **Map** không có thứ tự duyệt cố định; không an toàn khi ghi đồng thời.
- **Method** với pointer receiver `func (u *User) Rename()` mới sửa được struct gốc.
- **Interface** được thoả mãn **ngầm định** (không có `implements`). Interface nhỏ là tốt (`io.Reader`, `fmt.Stringer`).
- **Generics** (Go 1.18+): `func Map[T, U any](s []T, f func(T) U) []U`; ràng buộc `cmp.Ordered`, `comparable`.
- Package `slices`, `maps` (1.21+) có `slices.Sort`, `slices.Contains`, `maps.Keys`…

> Bài code: viết code trong `package main` (không viết hàm `main`). Test dùng `var _ = Test("tên", func(t *T) { ... })` với `t.Errorf`/`t.Fatalf` giống `testing.T`.
'''

[[modules]]
id = "go-errors"
title = "Error handling"
description = "error là giá trị, wrapping với %w, errors.Is/As, sentinel error, panic/recover, defer."
sources = ["go/errors/index", "go/errors/index#Is"]
lesson = '''
### Ý chính
- Error là **giá trị**: hàm trả về `(T, error)`; kiểm tra `if err != nil` ngay.
- **Wrap** lỗi kèm ngữ cảnh: `fmt.Errorf("load user %d: %w", id, err)`.
- `errors.Is(err, ErrNotFound)` so sánh theo chuỗi wrap; `errors.As(err, &target)` lấy lỗi theo **kiểu**.
- **Sentinel error**: `var ErrNotFound = errors.New("not found")`.
- `defer` chạy khi hàm return, theo thứ tự **LIFO**; đối số của defer được **đánh giá ngay** lúc khai báo.
- `panic` cho lỗi không thể phục hồi (bug); `recover()` chỉ có tác dụng trong hàm được `defer`.
'''

[[modules]]
id = "go-concurrency"
title = "Concurrency"
description = "Goroutine, channel, select, sync.WaitGroup/Mutex, context, worker pool, race condition."
sources = ["go/sync/index", "go/context/index", "go/sync/index#WaitGroup"]
lesson = '''
### Ý chính
- **Goroutine** (`go f()`) rất nhẹ (vài KB stack), được Go runtime lập lịch M:N.
- **Channel**: unbuffered → gửi/nhận đồng bộ; buffered → gửi chặn khi đầy. Chỉ **bên gửi** nên `close(ch)`. Đọc từ channel đã đóng trả zero value ngay (`v, ok := <-ch`).
- `select` chờ nhiều channel; `default` để không chặn.
- `sync.WaitGroup` đợi nhóm goroutine; `sync.Mutex` bảo vệ dữ liệu chung; `sync.Once`.
- **context.Context**: truyền deadline/huỷ qua các tầng. Luôn `defer cancel()`. Tham số đầu tiên của hàm: `ctx context.Context`.
- "Don't communicate by sharing memory; share memory by communicating."
- Phát hiện race: `go test -race`.
'''

[[modules]]
id = "go-web"
title = "net/http & JSON"
description = "http.Handler, ServeMux pattern (Go 1.22), middleware, encoding/json, struct tag, graceful shutdown."
sources = ["go/net/http/index", "go/net/http/index#Handler", "go/encoding/json/index"]
lesson = '''
### Ý chính
- `http.Handler` là interface có `ServeHTTP(w http.ResponseWriter, r *http.Request)`; `http.HandlerFunc` biến hàm thành Handler.
- Go 1.22 `ServeMux` hỗ trợ method + wildcard: `mux.HandleFunc("GET /users/{id}", h)` → `r.PathValue("id")`.
- **Middleware**: `func(next http.Handler) http.Handler`.
- Gọi `w.WriteHeader(code)` **trước** `w.Write`; header phải set trước khi ghi body.
- JSON: `json.NewDecoder(r.Body).Decode(&v)`, `json.NewEncoder(w).Encode(v)`; struct tag `json:"name,omitempty"`; chỉ field **viết hoa** (exported) mới được encode.
- Server production: đặt `ReadTimeout`, `WriteTimeout`; graceful shutdown bằng `srv.Shutdown(ctx)`.
'''

