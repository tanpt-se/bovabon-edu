[[questions]]
id = "go-dvc02"
module = "go-dv-testing"
type = "code"
lang = "go"
difficulty = 2
title = "Parse và xác thực port"
prompt = '''
Viết `ParsePort(input string) (int, bool)`:
- Bỏ khoảng trắng ở hai đầu.
- Chỉ chấp nhận một hoặc nhiều chữ số ASCII thập phân; không chấp nhận dấu `+`, dấu `-`, dấu chấm hay chuỗi rỗng.
- Giá trị phải nằm trong khoảng 1 đến 65535, bao gồm hai đầu.
- Nếu hợp lệ, trả số nguyên và `true`; nếu không hợp lệ hoặc bị overflow, trả `0, false`.

Ví dụ: `" 8080 "` trả `8080, true`; `"0"` và `"80x"` không hợp lệ.
'''
starter = '''
package main

func ParsePort(input string) (int, bool) {
	return 0, false
}
'''
solution = '''
package main

import (
	"strconv"
	"strings"
)

func ParsePort(input string) (int, bool) {
	input = strings.TrimSpace(input)
	if input == "" {
		return 0, false
	}
	for i := 0; i < len(input); i++ {
		if input[i] < '0' || input[i] > '9' {
			return 0, false
		}
	}
	value, err := strconv.Atoi(input)
	if err != nil || value < 1 || value > 65535 {
		return 0, false
	}
	return value, true
}
'''
tests = '''
package main

var _ = Test("port hợp lệ và có khoảng trắng", func(t *T) {
	got, ok := ParsePort(" 8080 ")
	if !ok || got != 8080 {
		t.Errorf("got %d, %v", got, ok)
	}
})

var _ = Test("hai biên hợp lệ", func(t *T) {
	low, lowOK := ParsePort("1")
	high, highOK := ParsePort("65535")
	if !lowOK || low != 1 || !highOK || high != 65535 {
		t.Errorf("got (%d, %v), (%d, %v)", low, lowOK, high, highOK)
	}
})

var _ = Test("từ chối ngoài miền", func(t *T) {
	for _, input := range []string{"0", "65536", "-1", "+80", "80.0", "", "   "} {
		if value, ok := ParsePort(input); ok || value != 0 {
			t.Errorf("ParsePort(%q) = %d, %v", input, value, ok)
		}
	}
})

var _ = Test("từ chối chữ và overflow", func(t *T) {
	for _, input := range []string{"80x", "999999999999999999999999999999999999"} {
		if value, ok := ParsePort(input); ok || value != 0 {
			t.Errorf("ParsePort(%q) = %d, %v", input, value, ok)
		}
	}
})
'''
