[[questions]]
id = "go-dvc01"
module = "go-dv-database"
type = "code"
lang = "go"
difficulty = 2
title = "Tạo truy vấn IN có tham số"
prompt = '''
Viết `BuildFindUsersQuery(statuses []string) (string, []any)` cho driver SQL dùng dấu `?`:
- Luôn bắt đầu bằng `SELECT id, name FROM users`.
- Nếu `statuses` rỗng, trả truy vấn gốc và danh sách arguments rỗng.
- Nếu có status, thêm ` WHERE status IN (?, ...)` với đúng một dấu `?` cho mỗi phần tử.
- Trả các status theo đúng thứ tự trong `[]any`; tuyệt đối không chèn giá trị vào chuỗi SQL.

Ví dụ `[]string{"active", "paused"}` cho truy vấn `SELECT id, name FROM users WHERE status IN (?, ?)` và arguments `[]any{"active", "paused"}`.
'''
starter = '''
package main

func BuildFindUsersQuery(statuses []string) (string, []any) {
	return "SELECT id, name FROM users", nil
}
'''
solution = '''
package main

func BuildFindUsersQuery(statuses []string) (string, []any) {
	query := "SELECT id, name FROM users"
	args := make([]any, len(statuses))
	if len(statuses) == 0 {
		return query, args
	}
	query += " WHERE status IN ("
	for i, status := range statuses {
		if i > 0 {
			query += ", "
		}
		query += "?"
		args[i] = status
	}
	query += ")"
	return query, args
}
'''
tests = '''
package main

import (
	"reflect"
)

var _ = Test("không lọc status", func(t *T) {
	query, args := BuildFindUsersQuery(nil)
	if query != "SELECT id, name FROM users" || len(args) != 0 {
		t.Errorf("got %q, %#v", query, args)
	}
})

var _ = Test("một status", func(t *T) {
	query, args := BuildFindUsersQuery([]string{"active"})
	if query != "SELECT id, name FROM users WHERE status IN (?)" {
		t.Errorf("query = %q", query)
	}
	if !reflect.DeepEqual(args, []any{"active"}) {
		t.Errorf("args = %#v", args)
	}
})

var _ = Test("nhiều status theo thứ tự", func(t *T) {
	query, args := BuildFindUsersQuery([]string{"active", "paused", "closed"})
	if query != "SELECT id, name FROM users WHERE status IN (?, ?, ?)" {
		t.Errorf("query = %q", query)
	}
	if !reflect.DeepEqual(args, []any{"active", "paused", "closed"}) {
		t.Errorf("args = %#v", args)
	}
})

var _ = Test("input trông giống SQL vẫn chỉ là argument", func(t *T) {
	value := "active') OR 1=1 --"
	query, args := BuildFindUsersQuery([]string{value})
	if query != "SELECT id, name FROM users WHERE status IN (?)" || !reflect.DeepEqual(args, []any{value}) {
		t.Errorf("query = %q, args = %#v", query, args)
	}
})
'''
