[[modules]]
id = "cefr-a2-reading-writing"
title = "Đọc và viết văn bản ngắn"
description = "Đọc email, tin nhắn, thông báo và truyện ngắn; viết email cá nhân với từ nối cơ bản."
lesson = '''
### Đọc để tìm thông tin
Email cá nhân thường cho biết người viết, lý do viết, thời gian hoặc việc cần người nhận trả lời. Tin nhắn và thông báo ngắn hay đặt thông tin quan trọng ở ngay đầu: giờ mở cửa, địa điểm, thay đổi kế hoạch hoặc việc cần làm. Đọc câu hỏi trước, rồi tìm tên, ngày, giờ và động từ liên quan trong văn bản. Ví dụ, *The shop closes at six. Please come before 5:30* nghĩa là cần đến trước 5:30, không phải đúng 6 giờ. Trong truyện ngắn, theo dõi ai làm gì và việc nào xảy ra trước; *then* thường báo bước tiếp theo.

### Viết email cá nhân 50–80 từ
| Phần | Nội dung gợi ý |
|---|---|
| Lời chào | *Hi Anna,* |
| Mục đích | *I'm writing to invite you…* |
| Chi tiết | ngày, giờ, nơi gặp hoặc lý do |
| Kết thư | *Hope you can come. See you soon!* |
| Tên | *Lan* |

Với email mời, nói rõ hoạt động, thời gian và nơi gặp. Email cảm ơn nên nêu điều bạn biết ơn; email xin lỗi cần nói điều đã xảy ra và một câu giải thích ngắn. Dùng câu đơn giản, xuống dòng hợp lý, viết hoa tên và đặt dấu chấm/phẩy. Đếm từ gần đúng để ở trong khoảng yêu cầu; đừng thêm câu dài chỉ để đạt số lượng.

### Nối ý rõ ràng
| Từ nối | Ý nghĩa | Ví dụ |
|---|---|---|
| and | thêm ý | *We had lunch and watched a film.* |
| but | tương phản | *I wanted to come, but I was ill.* |
| so | kết quả | *It was late, so we took a taxi.* |
| because | lý do | *I stayed home because I was tired.* |
| then | bước tiếp theo | *We ate dinner. Then we went home.* |

*Because* đứng trước lý do; *so* nối nguyên nhân với kết quả. Không đặt cả hai cho cùng một quan hệ theo mẫu ~~Because I was tired, so I slept~~; viết *Because I was tired, I slept* hoặc *I was tired, so I slept*. Người Việt cũng hay nối mọi câu bằng *and* hoặc quên dấu phẩy giữa hai mệnh đề. Hãy chọn từ nối theo quan hệ thật giữa hai ý, rồi đọc lại email để xem người nhận có hiểu kế hoạch và lời nhắn không.

### Đọc và viết văn bản ngắn
Đọc email, thông báo, quảng cáo và câu chuyện bằng cách tìm người gửi, thời gian, hành động và lý do. Với bài kể chuyện, theo dõi thứ tự bằng *before, after, then*; với giải thích, dùng *because* cho nguyên nhân và *so* cho kết quả. Một email cá nhân 50–80 từ có thể gồm lời chào, mục đích, chi tiết thiết yếu, câu hỏi/lời mời và lời kết. Nối ý bằng *and, but, so, because, then*; sau khi viết, kiểm tra thì quá khứ và dấu câu. Từ khóa đáp án mẫu không đánh giá đầy đủ độ dài, chính xác hay tính mạch lạc của email.
'''

