description = "Luyện tiếng Anh A2 qua ngữ pháp bổ sung, từ vựng đời sống, giao tiếp quen thuộc và đọc–viết văn bản ngắn."

[[modules]]
id = "cefr-a2-grammar-plus"
title = "Ngữ pháp A2 mở rộng"
description = "Quá khứ đơn và ago, các dạng tương lai, hiện tại hoàn thành, so sánh, modals, lượng từ, mệnh đề thời gian và đại từ bất định."
lesson = '''
### Trải nghiệm với hiện tại hoàn thành
Dùng **have/has + past participle (V3)** để hỏi hoặc kể một trải nghiệm tính đến hiện tại, thường đi với *ever* (đã từng) và *never* (chưa từng). Không nói rõ một thời điểm đã kết thúc trong quá khứ ở câu này.

| Mẫu | Ví dụ |
|---|---|
| Have/Has + chủ ngữ + ever + V3? | *Have you ever stayed in a hotel?* |
| Chủ ngữ + have/has never + V3 | *He has never tried sushi.* |
| Trải nghiệm có rồi | *We have visited Da Lat.* |

Nếu có mốc đã kết thúc như *last year*, dùng quá khứ đơn: *I went to Hue last year.* Tránh ghép *have* với động từ quá khứ đơn: ~~She has went~~ → *She has gone*. *Been to* thường nói đã đến rồi trở về; *gone to* nói người đó đã đi và hiện chưa ở đây.

### Động từ đi với to V hoặc V-ing
Một số động từ thường gặp chọn dạng theo sau cố định. Hãy học cả cụm: *want/need/hope/decide/plan + to V*; *enjoy/finish + V-ing*. Ví dụ: *I hope to see you soon.* / *They finished packing at six.* Không thêm *to* trước V-ing: ~~enjoy to play~~; cũng không bỏ *to* sau *decide*: ~~decided visit~~.

### Lượng từ, too và enough
| Cấu trúc | Ví dụ |
|---|---|
| a lot of + danh từ số nhiều / không đếm được | *a lot of bags / a lot of rain* |
| too many + danh từ đếm được số nhiều | *too many suitcases* |
| too much + danh từ không đếm được | *too much luggage* |
| too + tính từ | *too cold to swim* |
| tính từ + enough / enough + danh từ | *old enough; enough time* |

*Too* nghĩa là quá mức, thường gây vấn đề; *enough* là đủ. Vị trí khác nhau: *big enough*, nhưng *enough space*. Tránh ~~enough big~~ và ~~too much people~~.

### Mệnh đề thời gian, câu hỏi chủ ngữ và đại từ bất định
*When, before,* và *after* nối hai hành động: *Call me when you arrive.* Với ý tương lai, sau từ nối thời gian vẫn dùng hiện tại đơn, không dùng *will*: *I'll wait until the bus comes.* Trong câu hỏi chủ ngữ, *who/what* tự làm chủ ngữ nên không thêm *do*: *Who called you?* Nếu hỏi người nhận hành động, dùng *Who did you call?* Đại từ bất định gồm *someone/anyone/no one/everyone*, *something/anything/nothing*, và *somewhere/anywhere/nowhere/everywhere*. Dùng động từ số ít với *everyone/no one*; *everywhere* nghĩa là mọi nơi: *I looked everywhere.* Câu hỏi và phủ định thường dùng *any-*, còn câu khẳng định thường dùng *some-*.

**Mẹo nhớ:** học động từ theo cặp *decide to go*, *enjoy going*; kiểm tra danh từ đếm được trước *many*; và tìm chủ ngữ thật trước khi thêm trợ động từ. Người Việt hay dịch từng chữ thành ~~Who did come?~~ hoặc dùng *will* sau *when*.

### Dự định và sự sắp xếp tương lai
Dùng *be going to* cho dự định đã có hoặc dự đoán có dấu hiệu; dùng hiện tại tiếp diễn cho lịch hẹn đã sắp xếp; *will* thường dùng cho quyết định ngay lúc nói, lời hứa hoặc đề nghị. Một dấu hiệu thời gian như *tomorrow* không tự quyết định thì—hãy xét ý định và mức độ sắp xếp.

### Modal và lượng từ
*Mustn’t* là cấm; *don’t have to* là không cần thiết. *Should* đưa lời khuyên, *could* có thể diễn tả khả năng quá khứ hoặc lời nhờ lịch sự, *might/may* nói về khả năng. Dùng *a few* với danh từ đếm được số nhiều, *a little* với danh từ không đếm được; *too + adjective* là quá mức, còn *adjective + enough* là đủ mức.

### Câu hỏi và mệnh đề thời gian
Nếu từ hỏi là chủ ngữ, không thêm *do/did*: *Who called?* Nếu hỏi tân ngữ, dùng trợ động từ: *Who did you call?* Sau *when/before/after* khi nói tương lai, dùng hiện tại đơn: *I’ll call when I arrive*.

### Mốc quá khứ và so sánh
Dùng quá khứ đơn với *ago*: cụm thời gian đứng trước *ago*, như *two days ago* hoặc *five years ago*. Với tính từ ngắn, thêm *-er* và dùng *than* (*cheaper than*); với tính từ dài, dùng *more … than* (*more comfortable than*). Dạng bất quy tắc gồm *good → better → the best* và *bad → worse → the worst*. So sánh kém hơn dùng *not as + adjective + as*: *This bag is not as heavy as that one*.

### Khả năng trong quá khứ
Dùng *could + động từ nguyên mẫu* để nói về khả năng chung trong quá khứ: *When I was five, I could read simple books.* Dùng *could you…?* khi nhờ ai đó lịch sự; ý nghĩa phụ thuộc vào ngữ cảnh.
'''

