[[modules]]
id = "cefr-a2-vocab-daily"
title = "Từ vựng đời sống"
description = "Cụm từ thiết yếu về du lịch, sức khoẻ, mua sắm, công việc, giải trí, cảm xúc và phrasal verbs thông dụng."
lesson = '''
### Cụm từ theo tình huống
Học từ mới trong cụm và câu ngắn giúp nhớ cách dùng tự nhiên. Các từ dưới đây hữu ích khi đi lại, hỏi thăm sức khoẻ hoặc làm việc thường ngày.

| Chủ đề | Cụm từ A2 | Ví dụ |
|---|---|---|
| Du lịch | book a room, catch a bus, check in, luggage | *We booked a room near the station.* |
| Sức khoẻ | have a cold, have a headache, feel ill, see a doctor | *I have a sore throat, so I will see a doctor.* |
| Mua sắm | try on, pay by card, size, receipt | *Can I try on this jacket?* |
| Công việc | colleague, take a break, start work, finish work | *My colleague takes a short break at noon.* |
| Giải trí | go out, play tennis, watch a film, listen to music | *We go out with friends on Fridays.* |

### Cảm xúc: -ed và -ing
Tính từ tận cùng **-ed** thường mô tả cảm giác của người; tính từ **-ing** thường mô tả điều tạo ra cảm giác đó: *I am bored because the film is boring.* / *She is excited about the exciting trip.* Có thể nhớ: người **cảm thấy** (-ed), sự việc **gây ra** cảm giác (-ing). Tránh nói ~~I am boring~~ khi muốn nói “tôi thấy chán”; câu đó có nghĩa là “tôi làm người khác chán”.

### Phrasal verbs rất thông dụng
| Cụm | Nghĩa thường gặp | Ví dụ |
|---|---|---|
| get up | thức dậy, rời giường | *I get up at seven.* |
| turn on | bật thiết bị | *Please turn on the light.* |
| look for | tìm kiếm | *He is looking for his phone.* |
| put on | mặc / đội vào | *Put on your coat; it is cold.* |

Với *look for*, *for* là một phần của cụm; nói *look for my keys*, không bỏ *for*. Một số cụm có thể tách: *put on your coat* hoặc *put your coat on*. Với đại từ, đặt đại từ ở giữa: *put it on*, không nói ~~put on it~~. Tránh dịch sát tiếng Việt: *have a headache* là cụm tự nhiên, không phải ~~get a headache pain~~. Khi mua sắm, *try on* là mặc thử quần áo; *try* một món ăn là nếm thử. Hãy dựa vào vật đi cùng để chọn đúng cụm.

**Mẹo nhớ:** ghi theo cặp *bored/boring*, *excited/exciting*; luyện phrasal verb cùng một vật cụ thể; và dùng cụm từ thay vì dịch từng chữ. Các ví dụ đều dùng câu ngắn, thời hiện tại/quá khứ đơn và từ vựng quen thuộc ở A2.
'''

