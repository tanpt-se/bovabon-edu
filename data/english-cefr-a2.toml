[[questions]]
id = "cefr-a2-x065"
module = "cefr-a2-grammar-plus"
type = "single"
difficulty = 1
prompt = "I knocked on the door twice, but ___ answered."
options = ["nobody", "something", "everywhere", "anything"]
answer = [0]
explanation = "*Nobody* có nghĩa là không có người nào; nó hợp với câu phủ định ý nghĩa này mà không cần thêm *not*."

