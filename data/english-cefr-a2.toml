module = "cefr-a2-vocab-daily"
type = "single"
difficulty = 1
prompt = "You arrive at a hotel. You booked a room yesterday. What can you say at the desk?"
options = ["I have a reservation.", "I have a receipt for my headache.", "I want to try on a room.", "I am looking for my suitcase size."]
answer = [0]
explanation = "*Reservation* là việc đặt chỗ trước; đây là cụm phù hợp để báo với nhân viên khách sạn."

