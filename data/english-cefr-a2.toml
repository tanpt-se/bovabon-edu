type = "single"
difficulty = 2
prompt = "Of the three meals we tried, this one was the ___."
options = ["best", "better", "goodest", "more good"]
answer = [0]
explanation = "So sánh nhất bất quy tắc của *good* là *the best*."

[[questions]]
id = "cefr-a2-x061"
module = "cefr-a2-grammar-plus"
type = "single"
difficulty = 2
prompt = "The blue suitcase costs $80 and the red one costs $50. The red suitcase is ___ the blue one."
options = ["not as expensive as", "more expensive than", "the most expensive as", "as expensive than"]
answer = [0]
explanation = "Cấu trúc *not as + adjective + as* diễn tả mức độ thấp hơn; chiếc vali đỏ rẻ hơn chiếc xanh."

[[questions]]
id = "cefr-a2-x062"
module = "cefr-a2-grammar-plus"
type = "single"
difficulty = 2
prompt = "When I was six, I ___ ride a bike, but I could not swim."
options = ["could", "could to", "can", "must"]
answer = [0]
explanation = "Dùng *could + động từ nguyên mẫu* để nói về khả năng chung trong quá khứ."

[[questions]]
id = "cefr-a2-x063"
module = "cefr-a2-grammar-plus"
type = "multiple"
difficulty = 2
prompt = "Choose all the sentences that use *a little* or *a lot of* correctly."
options = ["We have a little time before the bus arrives.", "They bought a lot of oranges for the party.", "There is a few milk left.", "We don't have a little chairs.", "We had a lot of rain during the trip."]
answer = [0, 1, 4]
explanation = "Dùng *a little* với danh từ không đếm được; *a lot of* dùng được với danh từ đếm được số nhiều và không đếm được."

