[[modules]]
id = "cefr-a2-functions"
title = "Giao tiếp trong tình huống quen thuộc"
description = "Mời và đáp lời, gợi ý, nhờ giúp, đặt lịch, gọi điện, mô tả người/nơi và kể trải nghiệm ngắn."
lesson = '''
### Mời, nhận lời và từ chối lịch sự
| Mục đích | Cách nói tự nhiên |
|---|---|
| Mời | *Would you like to have lunch with us?* |
| Nhận lời | *I'd love to. What time?* |
| Từ chối nhẹ nhàng | *I'd love to, but I'm busy on Saturday.* |
| Gợi ý | *Why don't we meet at the café?* / *How about going by bus?* |

Có thể thêm lý do ngắn khi từ chối để lời đáp thân thiện. Sau *How about* dùng danh từ hoặc V-ing: *How about a walk? / How about walking?* Với *Why don't we*, dùng động từ nguyên mẫu: *Why don't we meet at six?* Tránh ~~Why we don't meet?~~ khi muốn đưa ra gợi ý.

### Yêu cầu, đề nghị giúp và hẹn lịch
*Could you help me with these bags, please?* là lời nhờ lịch sự; *Shall I carry one for you?* là đề nghị giúp. Khi đặt lịch, nêu hoạt động, ngày và giờ: *Can we meet on Friday at ten?* / *Are you free this afternoon?* Hỏi lại giờ nếu chưa rõ: *What time shall we meet?* *On* thường đi với thứ/ngày, còn *at* đi với giờ.

### Gọi điện thoại
| Tình huống | Câu mẫu |
|---|---|
| Xin gặp ai | *Hello, could I speak to Anna, please?* |
| Người đó không có đây | *I'm sorry, she's not here right now.* |
| Để lại lời nhắn | *Can I leave a message?* |
| Xin nói lại | *Sorry, could you say that again?* |

Nói tên người cần gặp sớm, phát âm rõ và dùng *please* khi nhờ. Nếu tín hiệu kém, có thể nói *I can't hear you very well* rồi xin người kia nhắc lại.

### Mô tả và kể trải nghiệm
Để mô tả người, nêu ngoại hình hoặc tính cách: *My brother is tall and friendly. He has short dark hair.* Dùng *be* với tính từ (*is friendly*) và *have* với tóc/mắt (*has brown eyes*). Để mô tả nơi chốn, nêu quy mô, cảm giác hoặc vị trí: *The town is small and quiet. It is near the sea.* Khi kể trải nghiệm, chọn 2–3 câu ngắn, thêm thời gian hoặc cảm nhận: *We visited a small market. I bought a scarf, and the people were kind.* Không cần dùng từ hoa mỹ; câu rõ và đúng tình huống sẽ giúp người nghe theo kịp.

**Lỗi hay gặp:** dịch thẳng “Bạn có thể giúp tôi?” thành câu thiếu lịch sự; dùng *How about we go* thay vì mẫu đang luyện *How about going*; quên *to* trong *speak to*; hoặc chỉ nói *He is hair short*. Mẹo là nhớ câu theo chức năng, rồi thay tên, hoạt động, ngày và giờ.
'''

