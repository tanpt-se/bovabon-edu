keywords = [["i'm sorry", "i am sorry", "sorry i missed", "sorry for missing"], ["the bus was late", "my bus was late", "my bus was delayed", "the bus was delayed", "the bus came late", "my bus came late", "the bus arrived late", "my bus arrived late"], ["on saturday", "on sunday", "on friday", "on monday", "on tuesday", "on wednesday", "on thursday", "next saturday", "next sunday", "next friday", "next monday", "next tuesday", "next wednesday", "next thursday"], ["at 1", "at 2", "at 3", "at 4", "at 5", "at 6", "at 7", "at 8", "at 9", "at 10", "at 11", "at 12", "at noon", "at midnight"], ["please let me know", "let me know", "write back", "reply", "get back to me"]]
