[[questions]]
id = "cefr-a2-043"
module = "cefr-a2-reading-writing"
type = "essay"
difficulty = 3
prompt = "Viết email 50–80 từ bằng tiếng Anh cảm ơn bạn đã mời bạn dự tiệc. Nói bạn đã vui thế nào, nêu một lý do và nhắc một chi tiết bạn muốn sắp xếp."
keywords = [["thank you", "thanks again"], ["had a great time", "enjoyed the party"], ["because", "as"], ["but", "however"], ["hope to see", "see you soon"]]
min_keywords = 4
model_answer = '''Hi Mia,

Thank you for inviting me to your birthday party. I had a great time because the food was delicious and the music was fun. I wanted to stay longer, but I had to catch the last bus. I left my blue scarf at your house. Could you bring it on Monday? Thanks again, and I hope to see you soon.

Best,
Lan'''
explanation = "Email có lời cảm ơn, cảm nhận, lý do, ý tương phản và lời kết thân mật; câu ngắn giúp người nhận dễ hiểu."
