2. Investigators believe that the server was compromised before the patch. → The server {{blank}} compromised before the patch.
'''
blanks = [["is expected to"], ["is believed to have been"]]
explanation = "Dùng is expected to + V cho dự đoán; hành động bị động xảy ra trước dùng is believed to have been + V3."

[[questions]]
id = "gr-x072"
module = "gr-b2-linking"
type = "essay"
difficulty = 3
prompt = '''
Viết 4 câu tiếng Anh làm release update. Dùng một câu concessive với although/despite, một câu đối chiếu với whereas, một mệnh đề quan hệ không xác định có dấu phẩy, và future perfect với by + mốc thời gian.
'''
keywords = [["although", "despite", "in spite of"], ["whereas"], [", which", ", who"], ["by friday", "by monday", "by the end"], ["will have"]]
min_keywords = 4
model_answer = '''
Although the test window was short, the team completed the security review. The release, which fixes the login issue, is ready for a staged rollout. The mobile client uses REST, whereas the internal analytics service uses gRPC. By Friday, we will have deployed the update to all regions.
'''
explanation = "Các cấu trúc được gắn với thông tin release cụ thể, giúp thể hiện nhượng bộ, tương phản, thông tin bổ sung và hạn hoàn thành."

