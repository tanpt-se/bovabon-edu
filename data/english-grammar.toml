3. Before release, we {{blank}} by an external specialist over the weekend. *(upgrade the database)*
'''
blanks = [["whether", "if"], ["had finished"], ["not to restart"], ["had the database upgraded", "got the database upgraded"]]
explanation = "Câu hỏi yes/no gián tiếp dùng if/whether và trật tự khẳng định; lời dặn phủ định dùng told + object + not to; have/get something done diễn đạt việc thuê người khác làm."

