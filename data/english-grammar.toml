module = "gr-c1"
type = "essay"
difficulty = 3
prompt = '''
Viết hai câu cho báo cáo sự cố. Dùng despite + cụm danh từ và cấu trúc have/get + tân ngữ + past participle để nói rằng nhà cung cấp đã kiểm tra API gateway. Câu thứ hai có mệnh đề quan hệ không xác định.
'''
keywords = [["despite"], ["had", "got"], ["reviewed", "checked"], ["which", "who"]]
