3. By June, I {{blank}} (work) here for five years. *(nhấn mạnh thời lượng đến mốc đó)*
'''
blanks = [["will be monitoring", "'ll be monitoring"], ["will have completed", "'ll have completed"], ["will have been working", "'ll have been working"]]
explanation = "Will be V-ing diễn tả việc đang diễn ra; will have V3 việc hoàn tất trước mốc; will have been V-ing nhấn mạnh thời lượng kéo dài."

[[questions]]
id = "gr-x070"
module = "gr-b2-linking"
type = "fill"
difficulty = 2
prompt = '''
Điền từ nối phù hợp với loại cấu trúc và ý tương phản:

1. {{blank}} the service was overloaded, the standby node stayed healthy. *(cần mệnh đề đầy đủ; nhượng bộ)*
2. {{blank}} the overload, the standby node stayed healthy. *(cần cụm danh từ; nhượng bộ)*
3. The front end uses REST, {{blank}} the internal service uses gRPC. *(đối chiếu hai sự thật)*
'''
blanks = [["although", "even though"], ["despite", "in spite of"], ["whereas"]]
explanation = "Although/even though + mệnh đề; despite/in spite of + cụm danh từ; whereas đối chiếu hai mệnh đề."

[[questions]]
id = "gr-x071"
module = "gr-b2-linking"
type = "fill"
difficulty = 3
prompt = '''
Hoàn thành các cấu trúc bị động khách quan:

