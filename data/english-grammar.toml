[[questions]]
id = "gr-b1-05"
module = "gr-b1-tenses"
type = "essay"
difficulty = 2
prompt = '''
Viết đoạn văn **5–7 câu** bằng tiếng Anh kể về một ngày đáng nhớ, sử dụng **quá khứ đơn**, **quá khứ tiếp diễn** (với *when/while*) và **quá khứ hoàn thành**. Có thể thêm một câu với *used to*.
'''
keywords = [
  ["was ", "were "],
  ["ing when", "while "],
  ["had "],
  ["ed ", "went", "saw", "took", "got", "came", "made"],
  ["used to"],
  ["before", "after", "already", "by the time"],
]
min_keywords = 4
model_answer = '''
Last Saturday **was** one of the best days of my life. I **was walking** along the beach **when** I **saw** an old friend from high school. We **hadn't met** for almost ten years, so we **talked** for hours. **While** we **were having** lunch, she told me that she **had moved** to Da Nang two years **before**. We **used to** sit next to each other in class, so we **laughed** about our old teachers. By the time I **got** home, the sun **had** already **set**.
'''
explanation = "Kết hợp các thì quá khứ giúp câu chuyện rõ trình tự: bối cảnh (QK tiếp diễn) → sự kiện (QK đơn) → việc xảy ra trước đó (QK hoàn thành)."

