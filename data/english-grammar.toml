# ============================================================ MODULES
[[modules]]
id = "gr-a2-tenses"
title = "A2 · Các thì cơ bản"
description = "Hiện tại đơn/tiếp diễn, quá khứ đơn, tương lai với will / be going to, động từ trạng thái."
lesson = '''
### Hiện tại đơn vs hiện tại tiếp diễn
| | Hiện tại đơn | Hiện tại tiếp diễn |
|---|---|---|
| Dùng cho | thói quen, sự thật, lịch trình | việc đang diễn ra, tạm thời, kế hoạch đã sắp xếp |
| Ví dụ | *She **works** in Hanoi.* | *She **is working** from home this week.* |
| Dấu hiệu | always, usually, every day | now, at the moment, this week |

- Ngôi thứ ba số ít thêm **-s/-es/-ies**: *works, watches, goes, studies* — *have → has*.
- **Động từ trạng thái** (know, like, want, need, believe, own, understand…) thường **không** dùng tiếp diễn: ~~I am knowing~~ → *I know*.

### Quá khứ đơn
Việc đã xong ở thời điểm xác định: *I **visited** Da Nang **last year**.* — Phủ định/nghi vấn dùng *did + V nguyên mẫu*: *Did you **see**…? I didn't **go**.*
Quy tắc thêm *-ed*: *like → liked, study → studied, stop → stopped, play → played*.

### Tương lai
- **will**: quyết định tức thời, dự đoán, lời hứa — *I'll help you.*
- **be going to**: dự định có từ trước, dự đoán có bằng chứng — *Look at those clouds! It's **going to** rain.*
- Hiện tại tiếp diễn cho kế hoạch đã sắp xếp: *I'm **meeting** the client at 3.*

### Công thức, dấu hiệu & câu hỏi
| Cấu trúc | Khẳng định | Phủ định | Nghi vấn |
|---|---|---|---|
| Hiện tại đơn | S + V(s/es) | S + don't/doesn't + V | Do/Does + S + V? |
| Hiện tại tiếp diễn | S + am/is/are + V-ing | S + am/is/are not + V-ing | Am/Is/Are + S + V-ing? |
| Quá khứ đơn | S + V2/ed | S + didn't + V | Did + S + V? |
| Tương lai với will | S + will + V | S + won't + V | Will + S + V? |
| Tương lai dự định | S + am/is/are going to + V | S + am/is/are not going to + V | Am/Is/Are + S + going to + V? |

**Dấu hiệu:** *usually/every sprint* thường đi với hiện tại đơn; *right now/this week* với tiếp diễn; *yesterday/last release* với quá khứ đơn. *This Friday* tự nó chưa quyết định thì: phân biệt dự định, quyết định tức thời hay lịch đã chốt.

**Dễ nhầm và lỗi thường gặp:** sau *does/doesn't/did/didn't* dùng động từ nguyên mẫu (*Does she work?*, không phải *Does she works?*). Không dùng *will* trong mệnh đề thời gian tương lai: *I'll call when the build finishes*. Người Việt hay bỏ *be* trong tiếp diễn và chia *be* sai theo chủ ngữ.

**Ngữ cảnh IT:** *The API returns JSON by default. The team is testing a patch now. We didn't deploy it yesterday. I'm going to review the logs, and I'll send you the results.*
'''

[[modules]]
id = "gr-a2-basics"
title = "A2 · Danh từ, mạo từ, so sánh & modal"
description = "Danh từ và lượng từ, đại từ & sở hữu, there is/are, a/an/the, so sánh, modal, giới từ thời gian và nơi chốn."
lesson = '''
### Danh từ & lượng từ
- Đếm được: *many, a few, a number of* — *many bugs, a few users*.
- Không đếm được: *much, a little, an amount of* — *much time, a little information*.
- *some* (khẳng định, lời mời) — *any* (phủ định, câu hỏi).

### Mạo từ
- **a/an** theo **âm** đầu: *an hour, an MBA, a university, a European*.
- **the** khi người nghe biết đó là cái nào / duy nhất: *the sun, the manager of our team*.
- Không mạo từ cho danh từ số nhiều/không đếm được nói chung: *Dogs are loyal. Water is important.*

### So sánh
| Tính từ | So sánh hơn | So sánh nhất |
|---|---|---|
| 1 âm tiết | fast**er**, larg**er**, big**ger** | the fast**est**, the big**gest** |
| 2 âm tiết tận cùng -y | happ**ier** | the happ**iest** |
| 2+ âm tiết khác | **more** modern | **the most** modern |
| Bất quy tắc | good → better → best, bad → worse → worst, far → farther/further | |

So sánh bằng: *as fast **as***; kém: *not as fast as / less expensive than*.

### Modal
*can* (khả năng/xin phép), *must* (bắt buộc từ người nói), *have to* (bắt buộc từ bên ngoài), *mustn't* (cấm) ≠ *don't have to* (không cần), *should* (lời khuyên).

### Giới từ thời gian
**at** + giờ / at night / at the weekend (BrE) · **on** + thứ, ngày · **in** + tháng, năm, mùa, buổi (in the morning).

### Đại từ, tồn tại & sở hữu
| Vai trò | Ngôi 1 số ít | Ngôi 3 số ít | Ngôi 1 số nhiều |
|---|---|---|---|
| Chủ ngữ | I | he / she / it | we |
| Tân ngữ | me | him / her / it | us |
| Tính từ sở hữu + danh từ | my | his / her / its | our |
| Đại từ sở hữu đứng độc lập | mine | his / hers / its | ours |

| Mẫu câu | Khẳng định | Phủ định | Nghi vấn |
|---|---|---|---|
| be | There is a server. / I am ready. | There isn't a server. / I'm not ready. | Is there a server? / Am I ready? |
| have (sở hữu) | She has access. | She doesn't have access. | Does she have access? |
| can / must | We can deploy. / You must log in. | We can't deploy. / You mustn't share keys. | Can we deploy? / Must I log in? |

Với danh từ đếm được số ít dùng *a/an*; số nhiều dùng *many/few*; không đếm được như *advice, information, software* dùng *much/little*. *Some* thường xuất hiện trong khẳng định và lời mời; *any* thường ở câu hỏi/phủ định, nhưng lời mời có thể dùng *some*: *Would you like some help?*

**Dấu hiệu và so sánh dễ nhầm:** *in* + tháng/năm/phòng (*in 2025, in the server room*), *on* + thứ/ngày/bề mặt (*on Monday, on the dashboard*), *at* + giờ/điểm cụ thể (*at 9, at the entrance*). *Mustn't* = bị cấm; *don't have to* = không bắt buộc. *There is* đi với danh từ số ít/không đếm được; *there are* đi với số nhiều.

**Lỗi thường gặp của người Việt:** dùng *he* thay *him* sau động từ/giới từ; nhầm *her* (tính từ sở hữu) với *hers*; nói *many information* thay vì *much information/a lot of information*; quên *a/an* trước danh từ đếm được số ít. So sánh nhất thường có *the*, còn so sánh hơn dùng *than*.

**Ngữ cảnh IT:** *There are two tickets on the board. One of them is mine. We have some time, but we don't have much information yet. The meeting is at 10 on Tuesday in the test room. You can restart the staging server, but you mustn't delete production data.*
'''

[[modules]]
id = "gr-b1-tenses"
title = "B1 · Hoàn thành & tường thuật quá khứ"
description = "Hiện tại hoàn thành (for/since/already/yet/just), quá khứ tiếp diễn, quá khứ hoàn thành, used to / would."
lesson = '''
### Hiện tại hoàn thành vs quá khứ đơn
- HTHT: kinh nghiệm, việc vừa xong, kéo dài tới hiện tại — *I **have worked** here **since** 2020 / **for** five years.* · *Have you **ever** been to Japan?* · *I've **just/already** sent it.* · *I haven't finished **yet**.*
- QKĐ: thời điểm xác định đã qua — *I **started** here **in** 2020.*
- **for** + khoảng thời gian; **since** + mốc thời gian.
- HTHT tiếp diễn nhấn mạnh quá trình: *I've **been waiting** for an hour.*

### Quá khứ tiếp diễn
Hành động đang diễn ra thì bị hành động khác xen vào: *I **was cooking** **when** the phone **rang**.* · Hai hành động song song: ***While** I was cooking, he was reading.*

### Quá khứ hoàn thành
Việc xảy ra **trước** một mốc quá khứ khác: *When I arrived, the meeting **had** already **started**.*

### used to / would
*I **used to** live in Hue.* (thói quen/trạng thái cũ, giờ không còn) · *would* chỉ cho **hành động** lặp lại: *We **would** play football every Sunday.* (~~I would live~~)
≠ *be used to + V-ing* (đã quen với): *I'm used to working late.*

### Công thức, dấu hiệu & cách phân biệt
| Cấu trúc | Khẳng định | Phủ định | Nghi vấn |
|---|---|---|---|
| Hiện tại hoàn thành | S + have/has + V3 | S + haven't/hasn't + V3 | Have/Has + S + V3? |
| Quá khứ tiếp diễn | S + was/were + V-ing | S + wasn't/weren't + V-ing | Was/Were + S + V-ing? |
| used to | S + used to + V | S + didn't use to + V | Did + S + use to + V? |
| Quá khứ hoàn thành | S + had + V3 | S + hadn't + V3 | Had + S + V3? |

**Dấu hiệu:** *since/for/ever/already/yet* thường gợi ý hiện tại hoàn thành; *at 8 yesterday/while* gợi ý quá khứ tiếp diễn; *by the time/before* thường làm rõ thứ tự quá khứ; *when* thường nối hành động đang diễn ra với một sự kiện xen vào.

**Dễ nhầm và lỗi thường gặp:** hiện tại hoàn thành nối quá khứ với hiện tại và không đi với thời điểm đã kết thúc như *last Monday*; quá khứ đơn kể việc đã xong ở mốc quá khứ. *For* + khoảng thời gian, *since* + mốc. Sau *didn't/did* viết *use to*, không phải *used to*. Người Việt hay dùng quá khứ đơn với *since* dù trạng thái vẫn tiếp tục.

**Ngữ cảnh IT:** *We have used this test suite since 2022. At 6 p.m. yesterday, the team was investigating an outage. The deployment had finished before the alert arrived. We didn't use to run these checks locally.*
'''

[[modules]]
id = "gr-b1-structures"
title = "B1 · Bị động, điều kiện, mệnh đề quan hệ"
description = "Câu bị động các thì, câu điều kiện loại 0/1/2, who/which/that/whose/where, V-ing vs to V, câu tường thuật cơ bản."
lesson = '''
### Bị động: be + V3
| Thì | Bị động |
|---|---|
| Hiện tại đơn | The room **is cleaned** every day. |
| Quá khứ đơn | The bridge **was built** in 1990. |
| HTHT | The tickets **have been sold**. |
| Tương lai | It **will be finished** tomorrow. |
| Modal | It **must be done** today. |
| Tiếp diễn | The road **is being repaired**. |

### Câu điều kiện
- Loại 0: *If you **heat** ice, it **melts**.*
- Loại 1: *If it **rains**, we **will stay** home.* (không dùng *will* sau *if*) — *unless* = if … not.
- Loại 2: *If I **had** more money, I **would travel**.* · *If I **were** you, I'd…*

### Mệnh đề quan hệ
*who* (người), *which* (vật), *that* (người/vật — chỉ trong mệnh đề **xác định**), *whose* (sở hữu), *where* (nơi chốn), *when* (thời gian).
Có thể bỏ đại từ khi nó là **tân ngữ**: *The book (that) I bought…*

### V-ing hay to V
- + V-ing: enjoy, finish, avoid, mind, suggest, consider, keep, practise
- + to V: want, decide, plan, hope, agree, promise, refuse, manage
- Đổi nghĩa: *stop **to** smoke* (dừng lại để hút) ≠ *stop smok**ing*** (bỏ hút); *remember **to** lock* (nhớ để làm) ≠ *remember lock**ing*** (nhớ đã làm).

### Tường thuật cơ bản
Lùi thì: *"I **am** tired" → She said (that) she **was** tired.* · *will → would*, *can → could*, đổi đại từ & trạng từ (*today → that day*, *tomorrow → the next day*).

### Công thức và tình huống dùng
| Cấu trúc | Khẳng định | Phủ định | Nghi vấn |
|---|---|---|---|
| Điều kiện loại 1 | If + hiện tại đơn, S + will + V | If + hiện tại đơn, S + won't + V | What will you do if + hiện tại đơn? |
| Điều kiện loại 2 | If + quá khứ đơn, S + would + V | If + quá khứ đơn, S + wouldn't + V | What would you do if + quá khứ đơn? |
| Bị động hiện tại | S + am/is/are + V3 | S + am/is/are not + V3 | Am/Is/Are + S + V3? |
| Bị động quá khứ | S + was/were + V3 | S + wasn't/weren't + V3 | Was/Were + S + V3? |
| Nghĩa vụ | S + must/have to + V | S + mustn't / don't have to + V | Must/Do + S + have to + V? |

**Dấu hiệu:** *if + hiện tại, tomorrow* thường nói điều kiện có thể xảy ra; *if + quá khứ, would* nói giả định hiện tại/tương lai; *by + agent* nêu người thực hiện trong bị động; *must/have to/should* lần lượt diễn đạt nghĩa vụ mạnh, yêu cầu/quy định và lời khuyên.

**Dễ nhầm và lỗi thường gặp:** không dùng *will* ngay sau *if* trong loại 1. *Mustn't* là cấm, *don't have to* là không cần. Bị động cần giữ đúng thì của *be* và dùng V3. Mệnh đề quan hệ xác định không có dấu phẩy; đại từ quan hệ làm tân ngữ có thể được lược, nhưng không lược khi làm chủ ngữ. Người Việt thường giữ trật tự câu hỏi trực tiếp trong reported speech; sau *asked where* dùng trật tự khẳng định.

**Ngữ cảnh IT:** *If the tests pass, we will merge the change. If we had a staging copy, we would test it there. The report is reviewed every Friday. The engineer who owns this service must update the runbook.*
'''

[[modules]]
id = "gr-b2-advanced"
title = "B2 · Điều kiện nâng cao, suy đoán & tường thuật"
description = "Điều kiện loại 3 & hỗn hợp, modal suy đoán (must/can't/might have V3), tường thuật câu hỏi/mệnh lệnh, wish / if only, have something done."
lesson = '''
### Điều kiện loại 3 & hỗn hợp
- Loại 3 (giả định quá khứ): *If I **had studied**, I **would have passed**.*
- Hỗn hợp (quá khứ → hiện tại): *If I **had taken** the job, I **would be** rich now.*
- Hỗn hợp (hiện tại → quá khứ): *If I **were** more careful, I **wouldn't have made** that mistake.*

### Modal suy đoán
| Mức độ | Hiện tại | Quá khứ |
|---|---|---|
| Chắc chắn đúng | must be | **must have** + V3 |
| Có thể | might / may / could be | might / may / could **have** + V3 |
| Chắc chắn không | can't / couldn't be | **can't have** + V3 |

*should have + V3* = lẽ ra nên (nhưng đã không). *needn't have + V3* = đã làm nhưng không cần.

### Tường thuật nâng cao
- Câu hỏi: *"Where **do you live**?" → He asked me where **I lived**.* (trật tự câu khẳng định, không trợ động từ do/did)
- Yes/No: *"Are you ready?" → She asked **if/whether** I was ready.*
- Mệnh lệnh/yêu cầu: *told/asked + O + (not) to V* — *He told me **not to touch** it.*
- Động từ tường thuật: *suggest + V-ing / that…*, *advise sb to V*, *apologise for V-ing*, *deny V-ing*, *admit V-ing*.

### wish / if only
- Hiện tại: *I wish I **knew** the answer.* · *I wish I **were** taller.*
- Quá khứ: *I wish I **had listened**.*
- Phàn nàn về người khác: *I wish you **would stop** talking.*

### Nhờ/khiến: have / get something done
*I **had my car repaired**.* · *She **got her hair cut**.* · Chủ động: *have sb do* / *get sb to do*.

### Công thức và dấu hiệu
| Cấu trúc | Khẳng định | Phủ định | Nghi vấn |
|---|---|---|---|
| Điều kiện loại 3 | If + had + V3, would have + V3 | If + hadn't + V3, wouldn't have + V3 | What would have happened if + had + V3? |
| Mixed: quá khứ → hiện tại | If + had + V3, would + V | If + hadn't + V3, wouldn't + V | What would you be doing now if…? |
| wish về hiện tại | S + wish + S + quá khứ đơn | S + wish + S + didn't + V | Do you wish + S + quá khứ đơn? |
| Causative | S + have/get + object + V3 | S + don't/doesn't have + object + V3 | Do/Does + S + have + object + V3? |

**Dấu hiệu:** *yesterday/last year* cùng kết quả trái thực tế gợi ý loại 3; *now/today* sau điều kiện quá khứ gợi ý mixed; *wish/if only* diễn tả điều trái với thực tế hoặc mong muốn thay đổi; *have/get something done* nhấn mạnh dịch vụ được thực hiện cho mình.

**Dễ nhầm và lỗi thường gặp:** trong mệnh đề *if* loại 3 dùng *had + V3*, không dùng *would have*. *Wish + past simple* nói điều hiện tại khác thực tế; *wish + past perfect* tiếc việc đã qua. Causative dùng V3, không dùng động từ nguyên mẫu. Người Việt dễ dịch từng chữ *I wish I will…*; chọn cấu trúc theo chủ thể và thời điểm.

**Ngữ cảnh IT:** *If we had added monitoring, we would have detected the outage sooner. If the team had documented the API, support would be easier now. We had the database migrated by a specialist, and I wish we had reviewed the rollback plan first.*
'''

[[modules]]
id = "gr-b2-linking"
title = "B2 · Liên kết câu, mệnh đề quan hệ & tương lai nâng cao"
description = "although/despite/however, mệnh đề quan hệ không xác định, tương lai tiếp diễn & hoàn thành, bị động khách quan (It is said that…)."
lesson = '''
### Từ nối tương phản & nguyên nhân
| + mệnh đề | + danh từ / V-ing | Đầu câu, ngăn cách bằng dấu phẩy |
|---|---|---|
| **although / even though / though** | **despite / in spite of** | **However, / Nevertheless,** |
| **because / since / as** | **because of / due to / owing to** | **Therefore, / As a result,** |

*Despite **being** tired, she finished.* · *In spite of **the fact that** it rained…* (~~despite it rained~~)

### Mệnh đề quan hệ không xác định
Thêm thông tin phụ, có **dấu phẩy**, **không** dùng *that*, không được lược đại từ:
*My brother, **who** lives in Sydney, is a nurse.* · *He passed the exam, **which** surprised everyone.* (which thay cho cả mệnh đề)
Giới từ + which/whom (trang trọng): *the person **to whom** I spoke*.

### Tương lai nâng cao
- Tương lai tiếp diễn: *This time tomorrow I **will be flying** to Paris.*
- Tương lai hoàn thành: *By 2030, we **will have finished** the project.*
- Tương lai hoàn thành tiếp diễn: *By June, I **will have been working** here for ten years.*

### Bị động khách quan
*People say that he is rich.* → ***It is said that** he is rich.* / *He **is said to be** rich.*
Quá khứ: *He **is believed to have left** the country.*

### Cấu trúc tương lai và liên kết
| Cấu trúc | Khẳng định | Phủ định | Nghi vấn |
|---|---|---|---|
| Tương lai tiếp diễn | S + will be + V-ing | S + won't be + V-ing | Will + S + be + V-ing? |
| Tương lai hoàn thành | S + will have + V3 | S + won't have + V3 | Will + S + have + V3? |
| Tương lai hoàn thành tiếp diễn | S + will have been + V-ing | S + won't have been + V-ing | Will + S + have been + V-ing? |
| Bị động khách quan | It is said that + mệnh đề | It isn't said that + mệnh đề | Is it said that + mệnh đề? |

**Dấu hiệu:** *this time tomorrow* thường dùng tương lai tiếp diễn; *by Friday/by 2030* thường dùng tương lai hoàn thành; *for ten years by June* nhấn mạnh thời lượng với tương lai hoàn thành tiếp diễn. Trong mệnh đề quan hệ không xác định, dấu phẩy cho biết thông tin bổ sung; *which* có thể quy chiếu cả mệnh đề trước.

**Dễ nhầm và lỗi thường gặp:** sau *although/whereas* là mệnh đề; sau *despite* là danh từ hoặc V-ing. *Whereas* đặt hai sự thật tương phản cạnh nhau, còn *although* nhượng bộ. Trong non-defining clause không dùng *that* và không lược đại từ quan hệ. Người Việt thường viết *Despite it rained*; sửa thành *Although it rained* hoặc *Despite the rain*.

**Ngữ cảnh IT:** *This time tomorrow, we will be migrating the database. By Friday, we will have completed the rollout. The new release, which fixes the login issue, will ship despite the short testing window, whereas the analytics update will wait.*
'''

[[modules]]
id = "gr-c1"
title = "C1 · Đảo ngữ, câu chẻ, giả định & mệnh đề phân từ"
description = "Đảo ngữ nhấn mạnh và điều kiện, cleft sentences, subjunctive, participle clauses, nominalisation, hedging, ellipsis, substitution và mạo từ nâng cao."
lesson = '''
### Đảo ngữ sau trạng từ phủ định / hạn chế (trợ động từ + chủ ngữ)
- ***Never have I*** seen such a mess. · ***Rarely/Seldom does*** he complain.
- ***Not only did*** she win, **but** she (also) broke the record.
- ***Hardly/Scarcely had*** I arrived **when** it started to rain. · ***No sooner had*** I arrived **than**…
- ***Only when/after*** I read the report ***did I*** understand. · ***Not until*** later ***did*** we realise…
- ***Under no circumstances should*** you share your password. · ***Little did*** they know…

### Đảo ngữ điều kiện (bỏ *if*)
- Loại 1: ***Should you*** need help, call me.
- Loại 2: ***Were I*** you, I would accept. · ***Were it not for*** your help…
- Loại 3: ***Had I known***, I would have come.

### Câu chẻ (cleft sentences) — nhấn mạnh
- ***It was*** Tom ***who*** broke the window. · ***It is*** the price ***that*** worries me.
- ***What*** I need ***is*** a holiday. · ***All*** I want ***is*** some sleep. · ***The reason why*** … ***is that*** …

### Giả định (subjunctive)
Sau *suggest, recommend, insist, demand, propose, it is essential/vital that*: động từ **nguyên mẫu không chia** —
*The doctor recommended that he **take** a break.* · *It is essential that every member **be** informed.*
*It's (high) time we **left**.* · *I'd rather you **didn't** smoke here.*

### Mệnh đề phân từ
- Chủ động: ***Walking*** down the street, I met an old friend. (cùng chủ ngữ!)
- Bị động: ***Written*** in 1950, the book is still popular.
- Hoàn thành: ***Having finished*** the report, she went home.
- Lỗi "dangling": ~~*Walking down the street, the rain started.*~~ (mưa không đi bộ)

### Lược bỏ & thay thế
*I hope **so** / I'm afraid **not**.* · *She can swim and **so can** I.* · *"Will you come?" "I'd like **to**."* · *I've got a red pen and two blue **ones**.*

### Nâng cấp diễn đạt cho văn bản kỹ thuật
| Mục đích | Mẫu khẳng định | Phủ định / nghi vấn | Dấu hiệu |
|---|---|---|---|
| Đảo ngữ nhấn mạnh | Never have we seen… | Under no circumstances should… | Trạng từ phủ định/hạn chế đứng đầu |
| Câu chẻ | It is the cache that… / What matters is… | It isn't the cache that… | Muốn làm rõ đúng phần thông tin |
| Subjunctive | We recommend that he be informed. | We recommend that he not be informed. | recommend/suggest/essential that + V nguyên mẫu |
| Hedging | The change may reduce latency. | The change may not reduce latency. | may, might, appears to, is likely to |

**Nominalisation** biến hành động thành danh từ để viết cô đọng (*we analysed the logs → our analysis of the logs*), nhưng dùng quá nhiều làm câu nặng. **Participle clause** rút gọn mệnh đề khi chủ thể ngầm giống chủ ngữ mệnh đề chính. **Ellipsis/substitution** tránh lặp: *The API is stable, and the client is too; the older version isn't.*

**Mạo từ nâng cao:** dùng *the* khi nhắc lại đối tượng đã xác định (*a request → the request*), với vật duy nhất trong ngữ cảnh (*the production database*), nhưng bỏ mạo từ khi nói khái quát (*Software requires testing; engineers need documentation*). Danh từ số ít đếm được thường cần từ hạn định (*a/the/this/each*).

**Lỗi thường gặp của người Việt:** đảo trợ động từ chỉ xảy ra khi cụm phủ định/hạn chế lên đầu; không đảo trong câu thường. Tránh viết *suggest someone to do* khi muốn dùng subjunctive (*suggest that someone do*) hoặc gerund (*suggest doing*). Hedging giúp phản ánh mức độ chứng cứ; tránh làm mọi kết luận thành *maybe*.

**Ngữ cảnh IT:** *Only after the rollback did we identify the faulty migration. What the logs show is a rise in retries. We recommend that the service be monitored for another week. The result suggests that caching may reduce latency, although further tests are required.*
'''

[[modules]]
id = "gr-a1-foundations"
title = "A1 · Câu cơ bản và danh từ"
description = "Câu với be, đại từ và sở hữu, have got, từ chỉ định, danh từ số ít/số nhiều, mạo từ, some/any, there is/are và câu hỏi wh-."
lesson = '''
### Câu với *be* và thông tin cá nhân
| Dạng | Công thức | Ví dụ |
|---|---|---|
| Khẳng định | S + am/is/are + thông tin | *I am a student. They are at home.* |
| Phủ định | S + am/is/are not | *She isn't from Hue.* |
| Câu hỏi | Am/Is/Are + S…? | *Are you ready?* — *Yes, I am.* |

Chọn *am* với *I*, *is* với he/she/it hoặc danh từ số ít, *are* với you/we/they và danh từ số nhiều. Câu hỏi đảo *be* lên trước chủ ngữ; không dùng *do* với *be*.

### Đại từ, sở hữu và chỉ định
*I/me/my/mine* lần lượt là đại từ chủ ngữ, tân ngữ, tính từ sở hữu và đại từ sở hữu. Tính từ sở hữu luôn đứng trước danh từ (*her phone*); đại từ sở hữu thay cả cụm (*The phone is hers*). Sở hữu cách dùng *'s*: *Mai's desk*. Dùng *this/these* cho vật gần và số ít/số nhiều; *that/those* cho vật xa. *Have got* diễn tả sở hữu: *I have got a desk; She has got two cousins*. Câu hỏi đặt *have/has* trước chủ ngữ: *Have you got…?*

### Danh từ và mạo từ
Danh từ đếm được có số ít/số nhiều: *box → boxes, city → cities, child → children*. Danh từ không đếm được như *water, advice, information* không thêm *-s* khi nói chung. Dùng *a/an* cho một danh từ đếm được số ít chưa xác định; lựa chọn dựa trên âm đầu: *an hour*, nhưng *a university*. Dùng *the* khi người nghe biết chính xác đối tượng hoặc đã nhắc trước.

### *Some/any* và *there is/are*
*Some* thường dùng trong câu khẳng định và lời mời; *any* thường dùng trong câu hỏi/phủ định. *There is* đi với danh từ số ít hoặc không đếm được; *there are* đi với danh từ số nhiều. Đưa *is/are* lên đầu để hỏi: *Are there any seats?*

### Câu hỏi wh-
Với *be*: từ hỏi + *be* + chủ ngữ (*Where is the station?*). Với động từ thường ở hiện tại đơn: từ hỏi + *do/does* + chủ ngữ + động từ nguyên mẫu (*Where does Lan work?*). Không thêm *do* vào câu hỏi có *be*.

**Lỗi người Việt thường gặp:** bỏ *be* (*She happy*), dùng *she* thay *her*, viết *informations*, dùng *an* theo chữ cái thay vì âm, và hỏi *Where the station is?* trong câu hỏi trực tiếp.
'''

[[modules]]
id = "gr-a1-actions"
title = "A1 · Thói quen, hành động và vị trí"
description = "Hiện tại đơn/tiếp diễn, trạng từ tần suất, can/can't, mệnh lệnh, let's, sở thích, would like, was/were và giới từ cơ bản."
lesson = '''
### Hiện tại đơn và thói quen
Dùng hiện tại đơn cho thói quen, sự thật và lịch cố định. Với he/she/it thêm *-s/-es*: *She works; he watches*. Phủ định/câu hỏi dùng *doesn't/does + động từ nguyên mẫu*: *Does he work? He doesn't work.* Với I/you/we/they dùng *do/don't*.

Trạng từ tần suất thường đứng trước động từ thường (*We usually walk*) nhưng sau *be* (*She is often busy*). Dùng *every day, on Mondays* để nói lịch lặp lại.

### Hiện tại tiếp diễn
Công thức là *am/is/are + V-ing*, cho hành động đang xảy ra hoặc tình huống tạm thời: *I am reading now; They are staying with us this week.* Thêm *-ing* theo quy tắc chính tả (*make → making, sit → sitting*). Động từ chỉ trạng thái như *know, want, need* thường không dùng ở tiếp diễn trong nghĩa cơ bản.

### Khả năng, yêu cầu và sở thích
Sau *can/can't* dùng động từ nguyên mẫu không *to*: *She can swim; Can I sit here?* Mệnh lệnh dùng động từ nguyên mẫu (*Open the window*); phủ định dùng *don't + verb* (*Don't touch it*). *Let's + verb* rủ cùng làm việc gì. Sau *like/love/hate* có thể dùng danh từ hoặc V-ing (*I like music; I like reading*). *Would like + noun/to V* diễn đạt mong muốn lịch sự (*I'd like some tea; I'd like to order*).

### *Was/were* và giới từ
Quá khứ của *be*: *I/he/she/it was*, *you/we/they were*. Dùng *at* với giờ (*at six*), *on* với ngày (*on Friday*), *in* với tháng/năm/buổi (*in June, in the morning*). Chỉ vị trí: *in* (bên trong), *on* (trên bề mặt), *under* (bên dưới), *next to* (cạnh), *between* (giữa hai vật).

**Lỗi người Việt thường gặp:** thêm *-s* sau *does*, bỏ *be* trong tiếp diễn, viết *can to swim*, đặt *usually* sau động từ chính, và dùng *in Monday* thay *on Monday*.
'''

[[modules]]
id = "gr-c2-precision"
title = "C2 · Ngữ pháp để nhấn ý và loại bỏ mơ hồ"
description = "Điều khiển trọng tâm bằng inversion, fronting, cleft, subjunctive, end-weight/end-focus, mệnh đề danh ngữ và cấu trúc song song."
lesson = '''
### Đảo ngữ và fronting có chủ đích
Khi cụm phủ định/hạn chế đứng đầu, đảo trợ động từ lên trước chủ ngữ: *Rarely have we seen this pattern; Only after the audit did the team notice the mismatch.* Không đảo nếu từ hạn chế bổ nghĩa cho chủ ngữ (*Only the lead engineer noticed it*). Fronting đưa thông tin đã biết hoặc tương phản lên đầu để nối mạch: *That assumption, we should test first.* Cấu trúc này phụ thuộc register và dấu câu.

### Cleft và mệnh đề danh ngữ
Câu chẻ *It was X that/who…* làm nổi bật một thành phần; *What matters is whether the result is reproducible* đặt mệnh đề danh ngữ làm chủ ngữ. Đảm bảo quan hệ giữa phần được nhấn và mệnh đề còn lại rõ ràng, không dùng *that* cho người trong câu chẻ trang trọng khi *who* phù hợp hơn.

### Subjunctive và động từ tình thái
Sau *recommend, insist, request* hoặc *it is essential that*, văn phong trang trọng có thể dùng động từ nguyên mẫu không *to*: *The panel recommended that the report be revised.* Một số biến thể Anh dùng *should + base form*. *Must have* diễn đạt suy luận mạnh về quá khứ; *may/might have* giảm độ chắc chắn. Chọn modal theo bằng chứng, không chỉ theo độ trang trọng.

### End-weight, end-focus và parallelism
Đặt chủ ngữ/mệnh đề dài về cuối để câu dễ xử lý: *It became clear that the first estimate excluded storage costs.* End-focus đặt thông tin mới hoặc tương phản ở cuối. Trong danh sách song song, giữ cùng loại cấu trúc: *The proposal aims to reduce cost, improve reliability, and shorten recovery time.* Nếu câu có thể được hiểu theo hai cách, viết lại với chủ thể và phạm vi rõ hơn thay vì chỉ thêm dấu phẩy.

### Mệnh đề rút gọn và quan hệ
Participle clause cần có chủ thể ngầm trùng với chủ ngữ mệnh đề chính: *Having reviewed the evidence, the panel changed its view.* Tránh dangling modifier (*Having reviewed the evidence, the conclusion changed*). Trong văn phong trang trọng, mệnh đề quan hệ có thể giữ giới từ trước đại từ (*the conditions under which the test ran*).

**Lỗi cần tránh:** đảo ở mọi câu có *only*, dùng subjunctive sai sau động từ tường thuật, tạo câu cleft không có tương phản thật, và rút gọn mệnh đề khiến người đọc không biết ai thực hiện hành động.
'''

[[modules]]
id = "gr-c2-register-control"
title = "C2 · Kiểm soát register và sắc thái cấu trúc"
description = "Chọn thì/thể, ellipsis, substitution, hedging, vague language, collocation và cấu trúc câu theo người đọc, mức độ chắc chắn và mục đích."
lesson = '''
### Thì và thể truyền tải thái độ
Hiện tại tiếp diễn với *always* có thể diễn đạt khó chịu (*You are always changing the scope*), khác với thói quen trung tính (*You always change the scope*). Quá khứ tiếp diễn/động từ quá khứ có thể làm yêu cầu mềm hơn: *I was wondering whether you could review this.* Chọn cấu trúc theo ý định giao tiếp, không chỉ theo mốc thời gian.

### Lược bỏ và thay thế
Lược bỏ phần đã rõ để tránh lặp: *The first team approved the change; the second team did too.* Dùng *do so* thay hành động đã nêu, *one/ones* thay danh từ đếm được, và *so/not* sau một số động từ (*I think so; I hope not*). Không lược bỏ thành phần khiến người đọc phải đoán chủ thể hoặc phạm vi.

### Hedging, độ chắc chắn và độ chính xác
*The results suggest/may indicate* thể hiện mức độ bằng chứng khác với *The results prove*. *Likely, arguably, to some extent* giúp giới hạn mệnh đề; dùng vừa đủ để không biến kết luận rõ ràng thành mơ hồ. Phân biệt *must have* (suy luận mạnh), *should have* (kỳ vọng/đánh giá) và *might have* (khả năng).

### Register và ngôn ngữ mơ hồ có kiểm soát
*Sort of, and things like that* có thể tự nhiên trong hội thoại thân mật nhưng thường quá mơ hồ trong báo cáo. Trong văn bản nghề nghiệp, nêu nhóm cụ thể thay vì *stuff*, dùng cách diễn đạt lịch sự thay cho mệnh lệnh trực tiếp, và giữ register nhất quán. Không xem mọi câu rút gọn là lỗi: hội thoại có thể dùng *Sounds good* khi chủ thể đã rõ.

### Biên tập độ rõ và collocation
Ngữ pháp chính xác vẫn cần collocation và quan hệ nghĩa tự nhiên: *raise a concern, draw a distinction, account for a variance*. Tách câu khi nhiều mệnh đề lồng nhau che khuất luận điểm. Kiểm tra đại từ quy chiếu, song song trong danh sách, mạo từ với danh từ số ít đếm được, và giới từ đi với cụm cố định.

**Lỗi cần tránh:** dùng từ giảm nhẹ để né trách nhiệm, lạm dụng danh hoá làm mất chủ thể, dùng vague language trong văn bản cần hành động rõ, và giữ một cấu trúc chỉ vì nó đúng ngữ pháp dù register không phù hợp.
'''

