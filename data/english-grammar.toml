answer = [0, 2, 3]
explanation = "Although và whereas theo sau bởi mệnh đề; despite cần danh từ hoặc V-ing; non-defining clause dùng which/who thay cho that."

[[questions]]
id = "gr-x069"
module = "gr-b2-linking"
