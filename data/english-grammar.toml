answer = [1]
explanation = "Theo sau là **cụm danh từ** (*the heavy rain*) → *despite / in spite of*. *Although/even though* + mệnh đề."

[[questions]]
id = "gr-b2-11"
module = "gr-b2-linking"
type = "multiple"
difficulty = 3
prompt = "Câu nào diễn đạt sự tương phản bằng từ nối đúng ngữ pháp? Chọn mọi câu đúng."
options = [
  "Despite feeling ill, she went to work.",
  "Despite she felt ill, she went to work.",
  "Although she felt ill, she went to work.",
  "She felt ill. However, she went to work.",
  "She felt ill, however she went to work.",
]
answer = [0, 2, 3]
explanation = "*despite* + V-ing/danh từ. *However* là trạng từ liên kết: đứng sau dấu chấm/chấm phẩy và có dấu phẩy theo sau, không nối hai mệnh đề bằng dấu phẩy."

[[questions]]
id = "gr-b2-12"
module = "gr-b2-linking"
type = "single"
difficulty = 3
prompt = "Câu nào là mệnh đề quan hệ **không xác định** viết đúng?"
options = [
  "My father, that is a teacher, loves music.",
  "My father who is a teacher loves music.",
  "My father, who is a teacher, loves music.",
  "My father, is a teacher, loves music.",
]
answer = [2]
explanation = "Mệnh đề không xác định có **dấu phẩy** và **không** dùng *that*. (Bạn chỉ có một người cha nên thông tin là phụ.)"

[[questions]]
id = "gr-b2-13"
module = "gr-b2-linking"
type = "fill"
difficulty = 3
prompt = '''
Tương lai nâng cao:

1. Don't call me at 8 tonight — I {{blank}} (watch) the final. *(đang diễn ra tại thời điểm tương lai)*
2. By the end of this year, we {{blank}} (launch) three new products. *(hoàn thành trước mốc tương lai)*
3. Next month I {{blank}} (work) here for ten years. *(nhấn mạnh quá trình kéo dài tới mốc tương lai)*
'''
blanks = [["will be watching", "'ll be watching"], ["will have launched", "'ll have launched"], ["will have been working", "'ll have been working"]]
explanation = "will be V-ing / will have V3 / will have been V-ing."

[[questions]]
id = "gr-b2-14"
module = "gr-b2-linking"
type = "single"
difficulty = 3
prompt = "*People believe that the thief escaped through the window.* → Bị động khách quan đúng:"
options = [
  "The thief is believed to escape through the window.",
  "The thief is believed to have escaped through the window.",
  "The thief believes to have escaped through the window.",
  "It is believed the thief to have escaped.",
]
answer = [1]
explanation = "Hành động (*escaped*) xảy ra **trước** thời điểm *believe* → *to have + V3*. Cách khác: *It is believed that the thief escaped…*"

[[questions]]
id = "gr-b2-15"
module = "gr-b2-linking"
type = "essay"
difficulty = 3
prompt = '''
Viết đoạn văn **6–8 câu** bằng tiếng Anh: *"Should students be allowed to use AI tools for homework?"* — dùng ít nhất **4 cấu trúc** sau: *although/even though*, *despite/in spite of*, *however/nevertheless*, mệnh đề quan hệ không xác định (*, which…*), câu điều kiện, *therefore/as a result*.
'''
keywords = [
  ["although", "even though"],
  ["despite", "in spite of"],
  ["however", "nevertheless", "on the other hand"],
  [", which", ", who"],
  ["if ", "unless", "provided that"],
  ["therefore", "as a result", "consequently"],
]
min_keywords = 4
model_answer = '''
AI tools have become part of everyday life, **which** means students will use them anyway. **Although** some teachers worry about cheating, these tools can explain difficult ideas in a personal way. **However**, students who copy answers without thinking will not develop their own skills. **Despite** this risk, banning AI completely seems unrealistic. **If** schools taught students how to use AI responsibly, homework could become more meaningful. Teachers could, for example, ask students to compare their own answer with an AI-generated one. **Therefore**, I believe AI should be allowed, but with clear rules.
'''
explanation = "Bài luận B2 cần lập luận hai chiều và từ nối đa dạng, không chỉ *and/but/because*."

# ============================================================ C1
[[questions]]
id = "gr-c1-01"
module = "gr-c1"
type = "single"
difficulty = 3
prompt = "*\"Never ______ such a beautiful sunset.\"*"
options = ["I have seen", "have I seen", "I saw", "did I saw"]
answer = [1]
explanation = "Trạng từ phủ định đứng đầu câu → **đảo trợ động từ lên trước chủ ngữ**: *Never have I seen…*"

[[questions]]
id = "gr-c1-02"
module = "gr-c1"
type = "fill"
difficulty = 3
prompt = '''
Hoàn thành câu đảo ngữ:

1. Not only {{blank}} she speak French, but she also speaks Arabic.
2. Hardly {{blank}} I sat down when the phone rang.
3. No sooner had we left {{blank}} it started to snow.
4. Only after the meeting {{blank}} I realise my mistake.
5. Under no circumstances {{blank}} you open this door. *(không được phép)*
'''
blanks = [["does"], ["had"], ["than"], ["did"], ["should", "must"]]
explanation = "*Hardly … when*, *No sooner … than*. Với *Only after/when + mệnh đề*, đảo ngữ ở **mệnh đề chính**."

[[questions]]
id = "gr-c1-03"
module = "gr-c1"
type = "multiple"
difficulty = 3
prompt = "Câu đảo ngữ điều kiện nào **đúng**?"
options = [
  "Had I known about the traffic, I would have left earlier.",
  "Should you need any help, please let me know.",
  "Were I in your position, I would accept the offer.",
  "If had I known, I would have come.",
  "Did I know the answer, I would tell you.",
]
answer = [0, 1, 2]
explanation = "Đảo ngữ điều kiện bỏ *if*: *Should you…* (loại 1), *Were I…* (loại 2), *Had I…* (loại 3). Không dùng *Did* cho loại 2."

[[questions]]
id = "gr-c1-04"
module = "gr-c1"
type = "single"
difficulty = 3
prompt = "Câu nào dùng **thức giả định** (subjunctive) đúng?"
options = [
  "The manager insisted that he arrives on time.",
  "The manager insisted that he arrive on time.",
  "The manager insisted that he arrived on time every day yesterday.",
  "The manager insisted him to arrive on time.",
]
answer = [1]
explanation = "Sau *insist / recommend / suggest / demand that*, động từ ở dạng **nguyên mẫu không chia** cho mọi ngôi: *he arrive*, *she be*. (Tiếng Anh–Anh cũng chấp nhận *should arrive*.)"

[[questions]]
id = "gr-c1-05"
module = "gr-c1"
type = "fill"
difficulty = 3
prompt = '''
Viết lại để **nhấn mạnh** (câu chẻ):

1. *Tom broke the window.* → It was Tom {{blank}} broke the window.
2. *I need a long holiday.* → {{blank}} I need is a long holiday.
3. *The price worries me, not the quality.* → It is the price {{blank}} worries me.
'''
blanks = [["who", "that"], ["What"], ["that", "which"]]
explanation = "*It + be + phần nhấn mạnh + who/that…* và *What + S + V + is…* (pseudo-cleft)."

[[questions]]
id = "gr-c1-06"
module = "gr-c1"
type = "single"
difficulty = 3
prompt = "Câu nào **không** mắc lỗi *dangling participle* (mệnh đề phân từ treo)?"
options = [
  "Walking into the room, the lights turned on automatically.",
  "Having finished the report, the computer was switched off.",
  "Having finished the report, she switched off the computer.",
  "Written in a hurry, I found many mistakes in the email.",
]
answer = [2]
explanation = "Chủ ngữ ngầm của mệnh đề phân từ phải trùng chủ ngữ mệnh đề chính: *she* đã hoàn thành báo cáo. Câu 4 đúng phải là *Written in a hurry, **the email** contained many mistakes.*"

[[questions]]
id = "gr-c1-07"
module = "gr-c1"
type = "multiple"
difficulty = 3
prompt = "Câu nào **đúng ngữ pháp**?"
options = [
  "It's high time we left — the last bus goes at 11.",
  "I'd rather you didn't tell anyone about this.",
  "It's essential that every candidate be present at 8 a.m.",
  "Little did they know what was about to happen.",
  "It's time we leave now, isn't it?",
]
answer = [0, 1, 2, 3]
explanation = "*It's (high) time + S + quá khứ đơn* (nghĩa hiện tại) — vì vậy câu cuối phải là *It's time we **left*** (hoặc *It's time **to leave***)."

[[questions]]
id = "gr-c1-08"
module = "gr-c1"
type = "fill"
difficulty = 2
prompt = '''
Lược bỏ & thay thế:

1. "Will it rain tomorrow?" — "I hope {{blank}}." *(mong là không)*
2. She can play the piano, and {{blank}} can I.
3. "Are you coming to the party?" — "I'd love {{blank}}, but I'm busy."
4. I don't like the red shoes; I prefer the black {{blank}}.
'''
blanks = [["not"], ["so"], ["to"], ["ones"]]
explanation = "*I hope so / I hope not*, *so + trợ động từ + S*, *to* thay cho cả cụm động từ, *one/ones* thay cho danh từ đếm được."

[[questions]]
id = "gr-c1-09"
module = "gr-c1"
type = "essay"
difficulty = 3
prompt = '''
Viết **5 câu** bằng tiếng Anh về chủ đề công nghệ hoặc học tập, mỗi câu dùng **một cấu trúc C1 khác nhau**: đảo ngữ phủ định, đảo ngữ điều kiện, câu chẻ, thức giả định, mệnh đề phân từ.
'''
keywords = [
  ["never have", "rarely", "seldom", "not only", "hardly had", "no sooner", "only when", "only after", "under no circumstances", "little did", "not until"],
  ["should you", "had i ", "had we ", "had they ", "were i ", "were it ", "were we "],
  ["it was ", "it is ", "what i ", "what we ", "what really", "what matters", "what helps", "all i ", "the reason why"],
  ["suggest", "recommend", "insist", "essential that", "vital that", "demand", "important that", "crucial that"],
  ["having ", "ing,", "ed,"],
]
min_keywords = 4
model_answer = '''
1. **Never have I** learned so much in such a short time as during my first coding bootcamp.
2. **Had I known** how useful English would be, I would have started studying it much earlier.
3. **What really helps me** remember new grammar **is** using it in real conversations.
4. My teacher **recommended that** every student **write** a short journal entry in English each day.
5. **Having practised** every morning for six months, I finally passed the IELTS exam with a 7.5.
'''
explanation = "Ở trình độ C1, mục tiêu là dùng các cấu trúc này **tự nhiên và đúng ngữ cảnh**, không nhồi nhét."

