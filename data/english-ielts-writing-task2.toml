options = ["Introduction, two body paragraphs, conclusion", "Introduction and one long body paragraph of 250 words", "Eight short paragraphs of one sentence each", "Introduction, five body paragraphs, conclusion"]
answer = [0]
explanation = "Khung 4 đoạn (mở, 2 thân, kết) cân bằng giữa độ dài và độ sâu. Một đoạn thân quá dài khó mạch lạc; đoạn 1 câu là chia đoạn sai; 5 thân bài trong 250 từ khiến mỗi ý không được phát triển."

[[questions]]
id = "iw2-028"
module = "iw2-structure-thesis"
type = "single"
difficulty = 3
tags = ["band:7", "thesis"]
prompt = "Prompt: *Some argue that space exploration is a waste of money when there are so many problems on Earth. To what extent do you agree?* The writer partly agrees. Which thesis expresses a partial position most precisely?"
options = ["Although funding for urgent social needs should take priority, I believe a modest space budget is justified by its scientific and technological returns.", "I partly agree and partly disagree with this statement.", "Space exploration has advantages and disadvantages.", "I totally agree, but space is also very useful."]
answer = [0]
explanation = "Lập trường một phần phải nói rõ *đồng ý ở mức nào và vì sao*. Câu 1 làm được điều đó. *I partly agree and partly disagree* không rõ ranh giới; câu 3 không trả lời *to what extent*; câu 4 tự mâu thuẫn (*totally agree* nhưng lại phản bác)."

[[questions]]
id = "iw2-029"
module = "iw2-structure-thesis"
type = "multiple"
difficulty = 3
tags = ["band:7", "paraphrase"]
prompt = "Prompt: *The gap between rich and poor is increasing.* Select all paraphrases that keep the original meaning."
options = ["Income inequality is widening.", "The divide between wealthy and low-income groups is growing.", "Rich people are becoming poor.", "Poverty has disappeared in many countries."]
answer = [0, 1]
explanation = "*Income inequality is widening* và *the divide between wealthy and low-income groups is growing* đều giữ nghĩa *khoảng cách giàu nghèo tăng*. Câu 3 và 4 đổi hẳn nghĩa: paraphrase sai nghĩa làm giảm Task Response."

[[questions]]
id = "iw2-030"
module = "iw2-structure-thesis"
type = "single"
difficulty = 3
tags = ["band:7", "conclusion"]
prompt = "Introduction thesis: *I believe that working from home benefits employees more than employers.* Which conclusion is the most effective?"
options = ["In conclusion, although companies gain from lower office costs, it is employees who benefit most, mainly through greater flexibility and the time saved on commuting.", "In conclusion, working from home has good and bad points for everyone.", "In conclusion, I now think employers benefit more than employees.", "In conclusion, working from home is popular. Another point is that it reduces pollution."]
answer = [0]
explanation = "Kết bài tốt nhắc lại lập trường bằng từ khác, ghi nhận phía còn lại và tóm tắt lý do chính. Câu 2 làm mờ lập trường; câu 3 đổi lập trường; câu 4 thêm ý mới (*pollution*) chưa được phát triển."

[[questions]]
id = "iw2-031"
module = "iw2-structure-thesis"
type = "fill"
difficulty = 3
tags = ["band:7", "thesis"]
prompt = "Complete the concessive thesis: *{{blank}} raising fuel taxes may be unpopular, it is the most effective way to cut car use.* (one word, meaning although)"
blanks = [["while", "although", "though", "whilst", "even though", "eventhough"]]
explanation = "Thesis nhượng bộ (*While/Although X, Y*) cho thấy bạn cân nhắc phía còn lại mà vẫn giữ lập trường, rất phù hợp band 7. Lưu ý không dùng *but* sau *although* (lỗi *Although…, but…* thường gặp của người Việt)."

[[questions]]
id = "iw2-032"
module = "iw2-idea-development"
type = "single"
difficulty = 1
tags = ["band:5.5", "paragraph-model"]
prompt = "What is the usual order of a body paragraph?"
options = ["Topic sentence → explanation → example → link back", "Example → conclusion → topic sentence", "Several ideas in a list with no explanation", "Explanation → new topic → topic sentence"]
answer = [0]
explanation = "Mô hình đoạn thân bài: câu chủ đề nêu ý chính, giải thích vì sao, ví dụ minh hoạ, rồi câu liên hệ lại với đề. Liệt kê nhiều ý mà không giải thích là lỗi phổ biến khiến bài dừng ở band 5–5.5."

[[questions]]
id = "iw2-033"
module = "iw2-idea-development"
type = "single"
difficulty = 1
tags = ["band:5.5", "topic-sentence"]
prompt = "Which sentence is the best topic sentence for a paragraph about why students should learn to cook?"
options = ["Learning to cook gives students an important life skill that supports their health.", "My mother cooks very well.", "Food is necessary for every human.", "There are many restaurants in my city."]
answer = [0]
explanation = "Câu chủ đề phải nêu ý chính của đoạn và gắn với đề. Câu 2 là ví dụ cá nhân, câu 3 quá chung, câu 4 không liên quan đến việc học nấu ăn."

[[questions]]
id = "iw2-034"
module = "iw2-idea-development"
type = "fill"
difficulty = 1
tags = ["band:5.5", "example"]
prompt = "Complete: *Public transport can reduce pollution. {{blank}} example, a full bus replaces dozens of private cars.* (one word)"
blanks = [["for"]]
explanation = "*For example* giới thiệu ví dụ minh hoạ. Không viết *For examples* hay *Example,* đứng một mình."

[[questions]]
id = "iw2-035"
module = "iw2-idea-development"
type = "single"
difficulty = 2
tags = ["band:6.5", "development"]
prompt = "Topic sentence: *Online courses make education more accessible.* Which follow-up sentence best EXPLAINS this idea?"
options = ["This is because learners in rural areas can study with top teachers without travelling or paying for accommodation.", "Online courses are very popular.", "Many universities are in big cities.", "I took an online course last year and it was good."]
answer = [0]
explanation = "Câu giải thích phải nói *vì sao* ý chính đúng (cơ chế). Câu 1 giải thích rõ *accessible* nghĩa là gì. Câu 2 lặp ý, câu 3 là thông tin rời rạc, câu 4 là trải nghiệm cá nhân không phân tích."

[[questions]]
id = "iw2-036"
module = "iw2-idea-development"
type = "single"
difficulty = 2
tags = ["band:6.5", "listing"]
prompt = "A body paragraph says: *Cities have many problems. There is traffic. There is pollution. Housing is expensive. Crime is also a problem.* What is the main weakness?"
options = ["It lists ideas without developing any of them", "It uses too many examples", "It is too academic", "It has no grammar mistakes"]
answer = [0]
explanation = "Đây là lỗi liệt kê: 4 ý nhưng không ý nào được giải thích hay minh hoạ. Band 6.5+ cần ít ý hơn nhưng mỗi ý được phát triển đầy đủ (Task Response: *extends and supports main ideas*)."

[[questions]]
id = "iw2-037"
module = "iw2-idea-development"
type = "multiple"
difficulty = 2
tags = ["band:6.5", "example"]
prompt = "Select all examples that are acceptable support in an IELTS essay."
options = ["A general, realistic situation: *a nurse working night shifts may struggle to find childcare*", "A hypothetical case: *if a city doubled parking fees, many drivers would switch to trains*", "An invented statistic presented as fact: *exactly 87.3% of people agree, according to a 2021 study*", "A one-word example with no connection: *e.g. money*"]
answer = [0, 1]
explanation = "Ví dụ tình huống thực tế hoặc giả định đều hợp lệ và an toàn. Bịa số liệu cụ thể như nghiên cứu thật dễ thiếu thuyết phục; ví dụ 1 từ không giải thích được ý."

[[questions]]
id = "iw2-038"
module = "iw2-idea-development"
type = "single"
difficulty = 2
tags = ["band:6.5", "link-back"]
prompt = "Prompt asks whether governments should fund the arts. After explaining and giving an example, which sentence best LINKS BACK to the question?"
options = ["Therefore, public funding for the arts is a worthwhile investment in a society's well-being.", "Art is very beautiful.", "Some artists are very rich.", "Next, I will talk about sport."]
answer = [0]
explanation = "Câu liên hệ lại tổng kết đoạn và nối về đề (*public funding for the arts*). Câu 2 và 3 không kết luận gì; câu 4 chuyển ý máy móc và không gắn đoạn với câu hỏi."

[[questions]]
id = "iw2-039"
module = "iw2-idea-development"
type = "fill"
difficulty = 2
tags = ["band:6.5", "development"]
prompt = "Complete to show a result: *Many young people cannot afford housing. {{blank}}, they delay starting a family.* (one word)"
blanks = [["consequently", "therefore", "thus", "hence", "asaresult"]]
explanation = "Dùng *Consequently/Therefore/As a result* để nối nguyên nhân và hệ quả, giúp đoạn văn phát triển theo chuỗi lập luận thay vì liệt kê."

[[questions]]
id = "iw2-040"
module = "iw2-idea-development"
type = "single"
difficulty = 2
tags = ["band:6.5", "relevance"]
prompt = "Topic sentence: *Banning junk food advertising would protect children's health.* Which example is most relevant?"
options = ["Children who see fewer adverts for sugary snacks are less likely to ask parents to buy them.", "Adults often watch the news in the evening.", "Fast food restaurants employ many teenagers.", "Some vegetables are expensive."]
answer = [0]
explanation = "Ví dụ phải chứng minh đúng câu chủ đề: quảng cáo → trẻ đòi mua → sức khoẻ. Các lựa chọn khác liên quan bề mặt (đồ ăn, TV) nhưng không chứng minh ý."

[[questions]]
id = "iw2-041"
module = "iw2-idea-development"
type = "essay"
difficulty = 2
tags = ["band:6.5", "paragraph-model"]
prompt = "Prompt: *Some people think that all teenagers should do unpaid community work in their free time. Do you agree?* Write one body paragraph (4–5 sentences) supporting this idea: topic sentence, explanation, example, link back."
keywords = [["community", "volunteer", "volunteering", "unpaid"], ["because", "since", "this is because", "as a result"], ["for example", "for instance", "such as"], ["therefore", "thus", "consequently", "this shows"]]
min_keywords = 3
model_answer = "Unpaid community work helps teenagers develop responsibility and empathy. This is because they see real problems in their neighbourhood and must work with people of different ages to solve them. For example, a student who volunteers at a food bank learns to organise tasks and to understand the difficulties faced by low-income families. Therefore, such work prepares young people to become active and caring citizens."
explanation = "Checklist: (1) Task Response: ý chính ủng hộ đề và được phát triển, không liệt kê; (2) Coherence: đủ 4 bước topic → explain → example → link back, từ nối đúng chức năng; (3) Lexical: *empathy, low-income, active citizens*; (4) Grammar: câu phức với *because*, mệnh đề quan hệ *who volunteers*."

[[questions]]
id = "iw2-042"
module = "iw2-idea-development"
type = "single"
difficulty = 3
tags = ["band:7", "development"]
prompt = "Which sentence develops an idea with the deepest reasoning (cause → effect → wider consequence)?"
options = ["Remote work reduces commuting, which cuts traffic at peak hours and, over time, lowers the pressure on governments to build new roads.", "Remote work is good because it is convenient.", "Remote work reduces commuting and commuting is bad.", "Remote work is popular, so many people like it."]
answer = [0]
explanation = "Câu 1 có chuỗi nhân quả nhiều tầng: ít đi lại → giảm kẹt xe giờ cao điểm → giảm áp lực làm đường. Đây là kiểu phát triển ý band 7. Các câu còn lại lập luận vòng tròn hoặc chỉ 1 bước nông."

[[questions]]
id = "iw2-043"
module = "iw2-idea-development"
type = "multiple"
difficulty = 3
tags = ["band:7", "overgeneralisation"]
prompt = "Select all sentences that avoid overgeneralisation."
options = ["Many elderly people may find online banking difficult to use.", "Social media tends to increase anxiety among some teenagers.", "All old people hate technology.", "Social media always destroys young people's lives."]
answer = [0, 1]
explanation = "Band 7 dùng ngôn ngữ thận trọng (*many, may, tends to, some*) để lập luận chính xác. *All… hate* và *always destroys* là khái quát quá mức, dễ bị phản bác và làm yếu Task Response."

[[questions]]
id = "iw2-044"
module = "iw2-idea-development"
type = "single"
difficulty = 3
tags = ["band:7", "relevance"]
prompt = "Prompt: *Should zoos be closed?* A writer plans two ideas against closing zoos. Which pair is best developed and distinct?"
options = ["(1) Zoos fund breeding programmes that save endangered species; (2) zoos educate children who would otherwise never see wild animals.", "(1) Zoos are good; (2) zoos are useful.", "(1) Zoos save animals; (2) zoos protect animals from extinction.", "(1) Zoos have animals; (2) many people visit zoos at weekends."]
answer = [0]
explanation = "Hai ý phải khác nhau rõ ràng và đủ sâu để viết một đoạn: bảo tồn và giáo dục. Cặp 2 quá mơ hồ, cặp 3 trùng ý (cứu = bảo vệ khỏi tuyệt chủng), cặp 4 là sự thật hiển nhiên không lập luận."

[[questions]]
id = "iw2-045"
module = "iw2-idea-development"
type = "single"
difficulty = 3
tags = ["band:7", "example"]
prompt = "Which example sentence is most effective in supporting the idea that *higher taxes on sugary drinks can change behaviour*?"
options = ["If a can of soda cost twice as much as bottled water, many families would choose the cheaper, healthier option without being told to.", "Sugar is sweet and people like it.", "Taxes are paid by everyone in a country.", "I sometimes drink soda when I am tired."]
answer = [0]
explanation = "Ví dụ giả định cụ thể (giá gấp đôi → chọn nước lọc) cho thấy cơ chế thay đổi hành vi, rất hữu ích khi không có số liệu. Các câu khác hoặc hiển nhiên, hoặc chung chung, hoặc là trải nghiệm cá nhân không chứng minh được gì."

[[questions]]
id = "iw2-046"
module = "iw2-cohesion-coherence"
type = "single"
difficulty = 1
tags = ["band:5.5", "linking-words"]
prompt = "Choose the correct linker: *Cars are convenient. ___, they cause serious air pollution.*"
options = ["However", "Moreover", "For example", "Therefore"]
answer = [0]
explanation = "Hai câu đối lập (tiện lợi ↔ gây ô nhiễm) nên dùng *However*. *Moreover* là bổ sung, *For example* là ví dụ, *Therefore* là kết quả: sai chức năng."

[[questions]]
id = "iw2-047"
module = "iw2-cohesion-coherence"
type = "fill"
difficulty = 1
tags = ["band:5.5", "linking-words"]
prompt = "Complete to add a second reason: *Exercise improves physical health. {{blank}}, it reduces stress.* (one word)"
blanks = [["moreover", "furthermore", "additionally", "also", "besides"]]
explanation = "*Moreover/Furthermore/Additionally* bổ sung ý cùng chiều. Không dùng *Besides that* quá nhiều, và tránh *Moreover* khi ý sau đối lập."

[[questions]]
id = "iw2-048"
module = "iw2-cohesion-coherence"
type = "single"
difficulty = 1
tags = ["band:5.5", "paragraphing"]
prompt = "When should you start a new paragraph in Task 2?"
options = ["When you move to a new main idea", "After every two sentences", "Only when the page is full", "Never; one paragraph is enough"]
answer = [0]
explanation = "Mỗi đoạn một ý chính. Chia đoạn theo số câu hay viết một khối liền mạch đều làm giảm điểm Coherence and Cohesion."

[[questions]]
id = "iw2-049"
module = "iw2-cohesion-coherence"
type = "single"
difficulty = 2
tags = ["band:6.5", "referencing"]
prompt = "*Many cities have introduced bike-sharing schemes. ___ schemes reduce short car journeys.* Which word avoids repeating *bike-sharing* and refers back correctly?"
options = ["Such", "This", "It", "That"]
answer = [0]
explanation = "*Such schemes* quy chiếu lại *bike-sharing schemes* (số nhiều). *This* và *That* đi với danh từ số ít; *It schemes* sai ngữ pháp. Dùng quy chiếu đúng giúp tránh lặp từ và tăng điểm Cohesion."

[[questions]]
id = "iw2-050"
module = "iw2-cohesion-coherence"
type = "single"
difficulty = 2
tags = ["band:6.5", "mechanical-linking"]
prompt = "Which paragraph shows MECHANICAL (overused) linking?"
options = ["Firstly, cars pollute. Secondly, moreover, they are noisy. Thirdly, furthermore, in addition, they are expensive.", "Cars pollute the air. They also create noise, which affects sleep in busy areas.", "Although cars are convenient, they pollute the air, and this harms residents' health.", "One drawback of cars is pollution. A related problem is noise."]
answer = [0]
explanation = "Câu 1 chồng nhiều từ nối (*Secondly, moreover*; *furthermore, in addition*) ở đầu mọi câu: đây là *mechanical linking*, band descriptor nêu rõ ở band 5–6. Các câu còn lại nối ý tự nhiên bằng quy chiếu và mệnh đề."

[[questions]]
id = "iw2-051"
module = "iw2-cohesion-coherence"
type = "fill"
difficulty = 2
tags = ["band:6.5", "referencing"]
prompt = "*Governments could tax plastic bags. {{blank}} measure would encourage shoppers to bring their own bags.* (one word referring back to the whole idea)"
blanks = [["this", "such a", "sucha", "that"]]
explanation = "*This measure* tóm lại cả ý *tax plastic bags* bằng một danh từ khái quát. Cấu trúc *this + danh từ tóm tắt* (measure, trend, approach) là cách liên kết tự nhiên của band 7."

[[questions]]
id = "iw2-052"
module = "iw2-cohesion-coherence"
type = "single"
difficulty = 2
tags = ["band:6.5", "linking-words"]
prompt = "Which linker is used INCORRECTLY?"
options = ["On the other hand, I like coffee and also tea.", "In contrast, rural areas have fewer job opportunities.", "As a result, traffic accidents have fallen.", "Nevertheless, many people still prefer cash."]
answer = [0]
explanation = "*On the other hand* dùng để đưa ra mặt đối lập, không dùng để bổ sung (*I like coffee and also tea*). Người Việt hay dùng nhầm *On the other hand* như *ngoài ra*. Các câu còn lại dùng đúng chức năng."

[[questions]]
id = "iw2-053"
module = "iw2-cohesion-coherence"
type = "multiple"
difficulty = 2
tags = ["band:6.5", "cohesive-devices"]
prompt = "Select all cohesive devices that are NOT linking words."
options = ["Pronouns such as *they* and *it*", "Synonyms, e.g. *vehicles* for *cars*", "Summary nouns like *this problem*", "*Firstly* and *secondly*"]
answer = [0, 1, 2]
explanation = "Liên kết không chỉ là từ nối: đại từ, từ đồng nghĩa và danh từ tóm tắt đều là phương tiện liên kết. *Firstly/secondly* là từ nối (sequencers). Band 7 kết hợp đa dạng các phương tiện này."

[[questions]]
id = "iw2-054"
module = "iw2-cohesion-coherence"
type = "single"
difficulty = 2
tags = ["band:6.5", "referencing"]
prompt = "*Teachers and parents both influence children. They spend more time with them at home.* What is the problem?"
options = ["*They* is ambiguous: it could mean teachers or parents", "*Children* should be *childs*", "*Influence* should be *influences*", "There is no problem"]
answer = [0]
explanation = "*They* có thể chỉ teachers hoặc parents nên người đọc bối rối. Sửa: *Parents spend more time with them at home*. Quy chiếu mơ hồ là lỗi Cohesion thường gặp."

[[questions]]
id = "iw2-055"
module = "iw2-cohesion-coherence"
type = "essay"
difficulty = 2
tags = ["band:6.5", "cohesive-devices"]
prompt = "Rewrite these choppy sentences as a cohesive mini-paragraph (3 sentences), using at least one linker, one pronoun or *this + noun*, and one synonym: *Fast food is cheap. Fast food is unhealthy. Fast food causes obesity. Children eat fast food.*"
keywords = [["however", "although", "while", "but", "yet"], ["this", "it", "such", "these"], ["junk food", "takeaway", "meals", "processed food", "convenience food"], ["obesity", "overweight", "weight gain"]]
min_keywords = 3
model_answer = "Although fast food is cheap, it is often high in fat and sugar. Children frequently eat such meals because they are quick and tasty. This habit contributes to obesity, so junk food should be limited in young people's diets."
explanation = "Checklist: (1) Task Response: giữ đủ ý gốc (rẻ, không lành mạnh, béo phì, trẻ em); (2) Coherence: từ nối đúng chức năng (*Although, because, so*), quy chiếu (*it, such meals, This habit*); (3) Lexical: đồng nghĩa (*meals, junk food*) thay vì lặp *fast food*; (4) Grammar: câu phức với mệnh đề nhượng bộ và nguyên nhân."

[[questions]]
id = "iw2-056"
module = "iw2-cohesion-coherence"
type = "single"
difficulty = 3
tags = ["band:7", "progression"]
prompt = "Which order of sentences creates the most logical progression?\n(A) As a result, they rely less on their parents.\n(B) Part-time jobs teach students to manage money.\n(C) For instance, a student working in a café learns to budget her weekly wages."
options = ["B → C → A", "A → B → C", "C → A → B", "A → C → B"]
answer = [0]
explanation = "Câu chủ đề (B) → ví dụ minh hoạ (C) → hệ quả (A, *As a result*). Bắt đầu bằng *As a result* khi chưa có nguyên nhân là phi logic. Thứ tự ý (progression) là trọng tâm của Coherence."

[[questions]]
id = "iw2-057"
module = "iw2-cohesion-coherence"
type = "single"
difficulty = 3
tags = ["band:7", "linking-words"]
prompt = "Which sentence uses *whereas* correctly?"
options = ["Urban schools often have modern facilities, whereas rural schools may lack basic equipment.", "Whereas, rural schools lack equipment.", "Urban schools are modern, whereas they are also expensive.", "Whereas students study hard, so they pass."]
answer = [0]
explanation = "*Whereas* nối hai mệnh đề đối lập trong cùng một câu. Không dùng *Whereas,* đứng đầu như trạng từ; câu 3 không đối lập thật; câu 4 sai cấu trúc (*whereas… so…*)."

[[questions]]
id = "iw2-058"
module = "iw2-cohesion-coherence"
type = "multiple"
difficulty = 3
tags = ["band:7", "coherence"]
prompt = "Select all changes that would improve the COHERENCE of an essay whose body paragraphs each contain three unrelated ideas."
options = ["Give each paragraph one central idea and move other ideas elsewhere or delete them", "Add a clear topic sentence to each paragraph", "Add more linking words at the start of every sentence", "Make the paragraphs longer without changing the ideas"]
answer = [0, 1]
explanation = "Coherence đến từ việc tổ chức ý: mỗi đoạn một ý trung tâm và câu chủ đề rõ ràng. Thêm từ nối không sửa được ý rời rạc (còn bị coi là mechanical); kéo dài đoạn chỉ làm vấn đề nặng hơn."

[[questions]]
id = "iw2-059"
module = "iw2-cohesion-coherence"
type = "fill"
difficulty = 3
tags = ["band:7", "linking-words"]
prompt = "Complete with a linker meaning *despite this*: *Electric cars are expensive. {{blank}}, sales have risen sharply.* (one word)"
blanks = [["nevertheless", "nonetheless", "however", "still", "yet"]]
explanation = "*Nevertheless/Nonetheless* thể hiện kết quả trái với dự đoán (đắt nhưng bán chạy). Đa dạng từ nối đối lập ngoài *However* giúp tăng Lexical Resource và Cohesion."

[[questions]]
id = "iw2-060"
module = "iw2-opinion-discussion"
type = "single"
difficulty = 1
tags = ["band:5.5", "opinion"]
prompt = "In an opinion essay, where should your opinion first appear?"
options = ["In the introduction, in the thesis statement", "Only in the last sentence of the essay", "Nowhere; IELTS essays must be neutral", "In the middle of the second body paragraph"]
answer = [0]
explanation = "Với dạng opinion, nêu lập trường ngay ở thesis trong mở bài và giữ nó đến kết bài. Để ý kiến đến cuối hoặc không nêu ý kiến khiến người chấm không thấy *clear position throughout*."

[[questions]]
id = "iw2-061"
module = "iw2-opinion-discussion"
type = "fill"
difficulty = 1
tags = ["band:5.5", "grammar-error"]
prompt = "Correct the common mistake *I am agree*: *I {{blank}} with this view.* (one word)"
blanks = [["agree"]]
explanation = "*Agree* là động từ, không dùng với *am*. Viết *I agree* hoặc *I do not agree*; lỗi *I am agree* là dịch từ tiếng Việt *tôi đồng ý*."

[[questions]]
id = "iw2-062"
module = "iw2-opinion-discussion"
type = "single"
difficulty = 1
tags = ["band:5.5", "discussion"]
prompt = "Prompt: *Some people prefer to live in the city, while others prefer the countryside. Discuss both views and give your opinion.* What should the body paragraphs do?"
options = ["One paragraph for each view, then your opinion clearly stated", "Only explain why you like the city", "Describe your hometown in detail", "Explain the history of cities"]
answer = [0]
explanation = "Dạng discussion cần cả hai quan điểm (mỗi đoạn một quan điểm) và ý kiến riêng. Chỉ viết một phía là thiếu phần; mô tả quê nhà hay lịch sử là lạc đề."

[[questions]]
id = "iw2-063"
module = "iw2-opinion-discussion"
type = "single"
difficulty = 2
tags = ["band:6.5", "concession"]
prompt = "Which sentence correctly concedes a point and then rebuts it?"
options = ["Admittedly, school uniforms can be expensive; however, they are cheaper overall than buying fashionable clothes for every day.", "School uniforms are expensive, and they are cheap.", "I totally disagree with uniforms and I also agree.", "Uniforms are expensive. The end."]
answer = [0]
explanation = "Mẫu nhượng bộ–phản biện: *Admittedly/It is true that X; however, Y*. Câu 1 thừa nhận chi phí nhưng phản bác bằng so sánh. Câu 2 và 3 tự mâu thuẫn, câu 4 không phản biện."

[[questions]]
id = "iw2-064"
module = "iw2-opinion-discussion"
type = "single"
difficulty = 2
tags = ["band:6.5", "consistency"]
prompt = "A writer's thesis says *I strongly support a four-day working week*, but the conclusion says *Overall, a five-day week is better*. Which criterion is most affected?"
options = ["Task Response (position not clear throughout)", "Lexical Resource only", "Grammatical Range only", "None; changing your mind shows flexibility"]
answer = [0]
explanation = "Band descriptor của Task Response yêu cầu *a clear position throughout*. Lập trường mâu thuẫn giữa mở bài và kết bài làm giảm điểm Task Response (và cả Coherence)."

[[questions]]
id = "iw2-065"
module = "iw2-opinion-discussion"
type = "fill"
difficulty = 2
tags = ["band:6.5", "discussion"]
prompt = "Introduce the first view without stating it as your own: *{{blank}} of this idea argue that tuition should be free.* (one word, meaning supporters)"
blanks = [["proponents", "supporters", "advocates", "defenders"]]
explanation = "*Proponents/Supporters/Advocates of this idea argue that…* giúp trình bày quan điểm của người khác một cách khách quan trong bài discussion, tách bạch với ý kiến của bạn."

[[questions]]
id = "iw2-066"
module = "iw2-opinion-discussion"
type = "single"
difficulty = 2
tags = ["band:6.5", "opinion"]
prompt = "Which phrase is most appropriate for giving your opinion in an academic essay?"
options = ["I would argue that…", "I think 100% that…", "In my opinion, I think that…", "Everybody knows that…"]
answer = [0]
explanation = "*I would argue that* là cách nêu ý kiến học thuật, mềm mà vẫn rõ. *In my opinion, I think* bị thừa; *I think 100%* quá khẩu ngữ; *Everybody knows* là khái quát hoá không có căn cứ."

[[questions]]
id = "iw2-067"
module = "iw2-opinion-discussion"
type = "multiple"
difficulty = 2
tags = ["band:6.5", "discussion"]
prompt = "Prompt: *Some believe that children should start school at age four; others think age seven is better. Discuss both views and give your opinion.* Select all elements a complete answer must include."
options = ["Reasons for starting at four", "Reasons for starting at seven", "The writer's own opinion", "A description of the writer's own first day at school"]
answer = [0, 1, 2]
explanation = "Đề discussion có 3 yêu cầu: quan điểm 1, quan điểm 2 và ý kiến riêng. Kể về ngày đầu đi học là chuyện cá nhân, không phát triển lập luận."

[[questions]]
id = "iw2-068"
module = "iw2-opinion-discussion"
type = "single"
difficulty = 2
tags = ["band:6.5", "opinion"]
prompt = "Prompt: *To what extent do you agree?* Which essay plan for a FULLY agree position is best?"
options = ["Body 1: main reason with example; Body 2: second reason, or a counter-argument followed by a rebuttal", "Body 1: reasons to agree; Body 2: reasons to disagree, no conclusion", "Body 1 and 2: background information only", "Body 1: agree; Body 2: disagree; conclusion: no opinion"]
answer = [0]
explanation = "Khi đồng ý hoàn toàn, cả hai thân bài phải phục vụ lập trường; có thể dùng một đoạn để phản biện quan điểm ngược lại. Viết cân bằng hai phía mà không kết luận làm lập trường mờ nhạt."

[[questions]]
id = "iw2-069"
module = "iw2-opinion-discussion"
type = "essay"
difficulty = 2
tags = ["band:6.5", "discussion"]
prompt = "Prompt: *Some people think that schools should teach children how to manage money, while others believe this is the parents' job. Discuss both views and give your opinion.* Write a short discussion paragraph (4 sentences) that presents ONE view objectively and then states your own position."
keywords = [["schools", "school", "teachers", "curriculum"], ["parents", "families", "home"], ["argue", "believe", "claim", "proponents", "supporters"], ["in my view", "i believe", "i would argue", "in my opinion"]]
min_keywords = 3
model_answer = "Supporters of financial education in schools argue that many parents lack the knowledge to teach budgeting and saving. A structured curriculum could give every child the same basic skills, regardless of family background. However, in my view, schools and parents should share this responsibility, because children learn best when lessons at school are reinforced by habits at home."
explanation = "Checklist: (1) Task Response: trình bày khách quan một quan điểm (*Supporters… argue*) và nêu ý kiến riêng rõ ràng; (2) Coherence: chuyển từ quan điểm người khác sang ý kiến mình bằng *However, in my view*; (3) Lexical: *financial education, budgeting, reinforced*; (4) Grammar: câu phức với *because, when, regardless of*."

[[questions]]
id = "iw2-070"
module = "iw2-opinion-discussion"
type = "single"
difficulty = 3
tags = ["band:7", "concession"]
prompt = "Which counter-argument paragraph opening is the most persuasive for a writer who supports banning cars from city centres?"
options = ["Critics claim that a ban would hurt local shops; yet evidence from pedestrianised streets suggests that foot traffic, and therefore spending, often increases.", "Some people disagree, but they are wrong.", "Shops are important, so I disagree with myself.", "There are no arguments against banning cars."]
answer = [0]
explanation = "Phản biện hiệu quả nêu đúng lý lẽ đối phương rồi bác bỏ bằng lập luận cụ thể. *They are wrong* không có lý do; câu 3 tự phá lập trường; câu 4 phủ nhận phía bên kia là thiếu tính thuyết phục."

[[questions]]
id = "iw2-071"
module = "iw2-opinion-discussion"
type = "single"
difficulty = 3
tags = ["band:7", "discussion"]
prompt = "In a discussion essay, a writer agrees with View B. Where is the most effective place to show this preference?"
options = ["Briefly in the thesis, then more fully in the View B paragraph and the conclusion", "Only in the View A paragraph", "In a sixth paragraph after the conclusion", "Nowhere, to stay neutral"]
answer = [0]
explanation = "Báo trước lập trường ở thesis, triển khai mạnh hơn ở đoạn quan điểm được ủng hộ và chốt ở kết bài: lập trường rõ xuyên suốt. Đặt ở đoạn View A gây khó hiểu; giữ trung lập là thiếu phần *give your opinion*."

[[questions]]
id = "iw2-072"
module = "iw2-opinion-discussion"
type = "multiple"
difficulty = 3
tags = ["band:7", "hedging"]
prompt = "Select all sentences that express a firm but academically cautious opinion."
options = ["It seems reasonable to conclude that flexible hours improve productivity for many workers.", "There is a strong case for making cycling lanes compulsory in new developments.", "Flexible hours definitely make everyone 100% more productive.", "Cycling lanes are the only solution to every transport problem."]
answer = [0, 1]
explanation = "*It seems reasonable to conclude* và *There is a strong case for* thể hiện lập trường rõ nhưng thận trọng, phù hợp văn học thuật. *Definitely… everyone 100%* và *the only solution to every* là khẳng định tuyệt đối thiếu căn cứ."

[[questions]]
id = "iw2-073"
module = "iw2-opinion-discussion"
type = "fill"
difficulty = 3
tags = ["band:7", "concession"]
prompt = "Complete the concession: *{{blank}} it is true that exams cause stress, they remain the fairest way to compare students.* (one word)"
blanks = [["while", "although", "though", "whilst", "eventhough", "even though"]]
explanation = "*While it is true that X, Y* là mẫu nhượng bộ trong một câu. Không thêm *but* ở mệnh đề sau (*Although…, but…* là lỗi)."

[[questions]]
id = "iw2-074"
module = "iw2-advantages-problem-solution"
type = "single"
difficulty = 1
tags = ["band:5.5", "advantages"]
prompt = "Prompt: *What are the advantages and disadvantages of studying abroad?* Which plan is correct?"
options = ["Body 1: advantages; Body 2: disadvantages", "Body 1: causes; Body 2: solutions", "Body 1: my opinion; Body 2: my friend's opinion", "Only advantages, because they are more interesting"]
answer = [0]
explanation = "Đề advantages/disadvantages cần cả hai mặt, mỗi mặt một đoạn. Kế hoạch nguyên nhân–giải pháp là của dạng khác; chỉ viết một mặt là thiếu phần."

[[questions]]
id = "iw2-075"
module = "iw2-advantages-problem-solution"
type = "fill"
difficulty = 1
tags = ["band:5.5", "solutions"]
prompt = "Complete the solution sentence: *The government {{blank}} build more affordable housing.* (one modal verb for a recommendation)"
blanks = [["should", "could", "must", "oughtto"]]
explanation = "Câu đề xuất giải pháp dùng modal *should/could* + động từ nguyên mẫu. Lỗi hay gặp: *should to build* hoặc *should builds*."

[[questions]]
id = "iw2-076"
module = "iw2-advantages-problem-solution"
type = "single"
difficulty = 2
tags = ["band:6.5", "problem-solution"]
prompt = "Problem: *Many young people leave rural areas for cities.* Which solution matches this problem most directly?"
options = ["Offer tax incentives to companies that create jobs in rural regions", "Build more shopping malls in big cities", "Increase the price of train tickets to the city", "Ban young people from moving"]
answer = [0]
explanation = "Giải pháp phải giải quyết nguyên nhân (thiếu việc làm ở nông thôn). Xây trung tâm thương mại ở thành phố làm vấn đề nặng thêm; tăng giá vé và cấm di chuyển không thực tế, không giải quyết gốc rễ."

[[questions]]
id = "iw2-077"
module = "iw2-advantages-problem-solution"
type = "single"
difficulty = 2
tags = ["band:6.5", "outweigh"]
prompt = "Prompt: *Do the advantages of social media outweigh the disadvantages?* What must the essay include that a simple advantages/disadvantages essay might not?"
options = ["A clear judgement about which side is greater", "A list of social media apps", "Only the disadvantages", "A personal story about using social media"]
answer = [0]
explanation = "Câu hỏi *outweigh* đòi hỏi kết luận mặt nào nặng hơn, nêu ở thesis và kết bài. Chỉ liệt kê hai mặt mà không đánh giá là trả lời thiếu."

[[questions]]
id = "iw2-078"
module = "iw2-advantages-problem-solution"
type = "fill"
difficulty = 2
tags = ["band:6.5", "advantages"]
prompt = "Complete: *One major {{blank}} of working from home is the lack of social contact.* (one word, meaning disadvantage)"
blanks = [["drawback", "disadvantage", "downside", "weakness", "shortcoming"]]
explanation = "Đa dạng từ cho *disadvantage*: *drawback, downside, shortcoming*. Tránh lặp *disadvantage* nhiều lần để tăng Lexical Resource."

[[questions]]
id = "iw2-079"
module = "iw2-advantages-problem-solution"
type = "single"
difficulty = 2
tags = ["band:6.5", "two-part"]
prompt = "Prompt: *Why do many people choose to buy second-hand clothes? Is this a positive development?* Which thesis answers BOTH questions?"
options = ["People increasingly buy second-hand clothes to save money and reduce waste, and I believe this is a largely positive trend.", "Second-hand clothes are cheap.", "I think this is positive.", "There are many shops selling clothes in my city."]
answer = [0]
explanation = "Thesis dạng two-part nên báo trước câu trả lời cho cả hai câu hỏi (lý do + đánh giá). Câu 2 chỉ trả lời câu 1 một phần; câu 3 chỉ trả lời câu 2; câu 4 lạc đề."

[[questions]]
id = "iw2-080"
module = "iw2-advantages-problem-solution"
type = "multiple"
difficulty = 2
tags = ["band:6.5", "problem-solution"]
prompt = "Prompt: *Noise pollution is increasing in cities. What are the causes, and what solutions can you suggest?* Select all on-topic causes."
options = ["Heavier road traffic at night", "Construction work in residential areas", "Rising house prices", "Lower birth rates"]
answer = [0, 1]
explanation = "Giao thông và công trình xây dựng trực tiếp gây tiếng ồn. Giá nhà và tỷ lệ sinh là vấn đề đô thị khác: liên quan bề mặt nhưng không phải nguyên nhân của ô nhiễm tiếng ồn."

[[questions]]
id = "iw2-081"
module = "iw2-advantages-problem-solution"
type = "single"
difficulty = 2
tags = ["band:6.5", "problem-solution"]
prompt = "Which solution is developed well enough for a band 6.5+ answer?"
options = ["Local councils could fund free coding workshops in libraries, so unemployed adults gain skills that are in demand without paying course fees.", "The government should do something.", "People should try harder.", "There are many solutions to this problem."]
answer = [0]
explanation = "Giải pháp tốt nêu ai làm, làm gì và vì sao hiệu quả. *Do something*, *try harder* quá mơ hồ; câu 4 không đưa ra giải pháp nào."

[[questions]]
id = "iw2-082"
module = "iw2-advantages-problem-solution"
type = "essay"
difficulty = 2
tags = ["band:6.5", "problem-solution"]
prompt = "Prompt: *In many cities, people throw away large amounts of food. What problems does this cause, and what can be done?* Write a short solution paragraph (3–4 sentences) proposing one solution and explaining how it works."
keywords = [["food waste", "waste", "leftover", "unsold food"], ["should", "could", "can"], ["because", "so that", "this would", "as a result"], ["supermarkets", "restaurants", "households", "governments", "councils"]]
min_keywords = 3
model_answer = "One effective solution is to require supermarkets to donate unsold food to charities instead of throwing it away. This would reduce waste because edible products would reach families who need them. Governments could also offer tax benefits to stores that donate, so that the policy is attractive to businesses as well."
explanation = "Checklist: (1) Task Response: giải pháp cụ thể, khớp vấn đề *food waste*; (2) Coherence: giải pháp → cơ chế → giải pháp bổ trợ, từ nối *also, so that*; (3) Lexical: *edible, donate, tax benefits*; (4) Grammar: *require sb to*, câu điều kiện ngầm *This would…*."

[[questions]]
id = "iw2-083"
module = "iw2-advantages-problem-solution"
type = "single"
difficulty = 2
tags = ["band:6.5", "advantages"]
prompt = "Prompt: *What are the advantages and disadvantages of online shopping for consumers?* Which sentence goes off-topic?"
options = ["Online shopping has caused many small shop owners to lose their businesses.", "Consumers can compare prices quickly online.", "Buyers cannot try clothes on before paying.", "Delivery delays can frustrate customers."]
answer = [0]
explanation = "Đề hỏi lợi/hại *for consumers*. Tác động lên chủ cửa hàng nhỏ là đúng chủ đề rộng nhưng sai đối tượng: lỗi lạc phạm vi rất hay gặp. Ba câu còn lại nói về người mua."

[[questions]]
id = "iw2-084"
module = "iw2-advantages-problem-solution"
type = "single"
difficulty = 3
tags = ["band:7", "outweigh"]
prompt = "A writer concludes that the disadvantages of tourism outweigh the advantages. Which body plan best supports this judgement?"
options = ["Body 1: acknowledge economic benefits briefly; Body 2: develop environmental and cultural costs in more depth, showing why they are more lasting", "Body 1: only advantages in detail; Body 2: one short sentence on disadvantages", "Two equal paragraphs with no evaluation", "Body 1: disadvantages; Body 2: a new topic about transport"]
answer = [0]
explanation = "Để thuyết phục rằng mặt hại nặng hơn, cần thừa nhận mặt lợi ngắn gọn rồi phát triển sâu mặt hại kèm tiêu chí đánh giá (*more lasting*). Phân bổ ngược hay cân bằng mà không đánh giá làm kết luận thiếu căn cứ."

[[questions]]
id = "iw2-085"
module = "iw2-advantages-problem-solution"
type = "multiple"
difficulty = 3
tags = ["band:7", "problem-solution"]
prompt = "A city's budget is limited. Select all criteria a band 7 essay might use to justify which solution to traffic congestion is BEST."
options = ["Cost compared with long-term benefit", "How quickly the measure can take effect", "How fashionable the idea sounds", "Whether the writer personally likes driving"]
answer = [0, 1]
explanation = "Band 7 đánh giá giải pháp theo tiêu chí có lý (chi phí–lợi ích, tốc độ hiệu quả, khả thi). Sở thích cá nhân hay mức độ *thời thượng* không phải lý lẽ học thuật."

[[questions]]
id = "iw2-086"
module = "iw2-advantages-problem-solution"
type = "single"
difficulty = 3
tags = ["band:7", "two-part"]
prompt = "Prompt: *More people are choosing to have children later in life. What are the reasons? What effects does this have on society?* A writer gives reasons in Body 1 and solutions in Body 2. What is the problem?"
options = ["The second question asks for effects, not solutions", "There should be three body paragraphs", "Reasons should come after effects", "Nothing; solutions are always expected"]
answer = [0]
explanation = "Câu hỏi thứ hai yêu cầu *effects* (tác động), không phải giải pháp. Viết giải pháp là trả lời sai câu hỏi, giảm mạnh Task Response dù bài viết hay."

[[questions]]
id = "iw2-087"
module = "iw2-advantages-problem-solution"
type = "fill"
difficulty = 3
tags = ["band:7", "outweigh"]
prompt = "Complete the evaluation: *Although the scheme is costly, its long-term benefits far {{blank}} its initial expense.* (one word)"
blanks = [["outweigh", "exceed", "surpass"]]
explanation = "*Far outweigh* là collocation nhấn mạnh mặt lợi lớn hơn hẳn. Lưu ý chia động từ theo chủ ngữ số nhiều *benefits outweigh*, không phải *outweighs*."

[[questions]]
id = "iw2-088"
module = "iw2-band-descriptors-editing"
type = "single"
difficulty = 1
tags = ["band:5.5", "criteria"]
prompt = "Which are the four criteria used to mark Task 2?"
options = ["Task Response; Coherence and Cohesion; Lexical Resource; Grammatical Range and Accuracy", "Spelling; Handwriting; Length; Speed", "Ideas; Vocabulary; Pronunciation; Fluency", "Introduction; Body; Conclusion; Title"]
answer = [0]
explanation = "Task 2 chấm theo 4 tiêu chí ngang nhau: TR, CC, LR, GRA. Pronunciation và Fluency là của Speaking; chính tả nằm trong Lexical Resource."

[[questions]]
id = "iw2-089"
module = "iw2-band-descriptors-editing"
type = "fill"
difficulty = 1
tags = ["band:5.5", "common-errors"]
prompt = "Correct the uncountable noun error: *Teachers give students a lot of useful {{blank}}.* (correct form of *advices*)"
blanks = [["advice"]]
explanation = "*Advice* là danh từ không đếm được, không thêm *-s*. Tương tự *information, equipment, furniture, knowledge*. Muốn đếm, dùng *a piece of advice*."

[[questions]]
id = "iw2-090"
module = "iw2-band-descriptors-editing"
type = "single"
difficulty = 2
tags = ["band:6.5", "editing"]
prompt = "Which version of the sentence is correct?"
options = ["Nowadays, the Internet plays an important role in education.", "Nowadays, Internet play important role in education.", "Nowadays, the Internet is play an important role in education.", "Nowadays, Internet plays a important role in the education."]
answer = [0]
explanation = "Câu đúng có mạo từ *the Internet*, *an important role*, động từ chia *plays*. Các phương án nhiễu chứa lỗi điển hình của người Việt: thiếu mạo từ, không chia động từ, *is play*, *a important*."

[[questions]]
id = "iw2-091"
module = "iw2-band-descriptors-editing"
type = "multiple"
difficulty = 2
tags = ["band:6.5", "common-errors"]
prompt = "Select all sentences that contain a grammar error."
options = ["Although it is expensive, but many people buy it.", "There are many informations online.", "People who exercise regularly tend to sleep better.", "If governments invested more, public hospitals would improve."]
answer = [0, 1]
explanation = "*Although…, but…* thừa liên từ (bỏ *but*); *informations* sai vì *information* không đếm được. Câu 3 và 4 đúng (mệnh đề quan hệ, câu điều kiện loại 2)."

[[questions]]
id = "iw2-092"
module = "iw2-band-descriptors-editing"
type = "single"
difficulty = 2
tags = ["band:6.5", "lexical"]
prompt = "Which upgrade of *Pollution is a very big problem* is the most natural for band 7?"
options = ["Pollution poses a serious threat to public health.", "Pollution is a extremely huge enormous problem.", "Pollution is a big big problem.", "Pollution is a problem which is very very big."]
answer = [0]
explanation = "*Poses a serious threat to* là collocation chính xác và cụ thể. Chồng tính từ (*extremely huge enormous*) hay lặp *very very* không nâng điểm Lexical Resource mà còn gây lỗi (*a extremely*)."

[[questions]]
id = "iw2-093"
module = "iw2-band-descriptors-editing"
type = "single"
difficulty = 2
tags = ["band:6.5", "criteria"]
prompt = "An essay has excellent vocabulary but only answers half of the question. Which criterion will mainly limit the score?"
options = ["Task Response", "Lexical Resource", "Grammatical Range and Accuracy", "None; vocabulary compensates"]
answer = [0]
explanation = "Trả lời thiếu một phần đề kéo Task Response xuống (thường ≤ band 5 ở tiêu chí này). Bốn tiêu chí được tính trung bình, nên từ vựng tốt không bù được hoàn toàn."

[[questions]]
id = "iw2-094"
module = "iw2-band-descriptors-editing"
type = "fill"
difficulty = 2
tags = ["band:6.5", "editing"]
prompt = "Correct the subject–verb agreement: *The number of students who study abroad {{blank}} increased.* (*have* or *has*)"
blanks = [["has"]]
explanation = "Chủ ngữ chính là *The number* (số ít) nên dùng *has*. So sánh: *A number of students have…* (nhiều sinh viên, số nhiều)."

[[questions]]
id = "iw2-095"
module = "iw2-band-descriptors-editing"
type = "single"
difficulty = 2
tags = ["band:6.5", "word-count"]
prompt = "What happens if a Task 2 essay is only 210 words?"
options = ["It is likely to lose marks, mainly in Task Response, because ideas are not fully developed", "Nothing; only quality matters", "The essay receives a score of zero", "It gets extra marks for being concise"]
answer = [0]
explanation = "Dưới 250 từ thường bị trừ điểm (chủ yếu Task Response) vì ý chưa đủ phát triển. Không bị 0 điểm, nhưng cũng không được cộng điểm vì ngắn gọn."

[[questions]]
id = "iw2-096"
module = "iw2-band-descriptors-editing"
type = "essay"
difficulty = 2
tags = ["band:6.5", "editing"]
prompt = "Edit this band 5.5 sentence group into accurate, more academic English (2–3 sentences): *Nowadays people is very busy. They don't have time for cook. So they eat fast food and it make them fat.*"
keywords = [["are", "lead", "have"], ["cook", "cooking", "prepare meals", "home-cooked"], ["fast food", "convenience food", "takeaway"], ["weight gain", "obesity", "overweight", "unhealthy"]]
min_keywords = 3
model_answer = "Many people today lead extremely busy lives and have little time for cooking. As a result, they often rely on fast food, which can contribute to weight gain and obesity."
explanation = "Checklist: (1) Task Response: giữ nguyên ý gốc; (2) Coherence: nối nhân quả bằng *As a result*, mệnh đề quan hệ *which* thay *and it*; (3) Lexical: *lead busy lives, rely on, contribute to*, tránh *fat* khẩu ngữ; (4) Grammar: sửa *people is* → *are*, *time for cook* → *time for cooking*, *it make* → *can contribute*."

[[questions]]
id = "iw2-097"
module = "iw2-band-descriptors-editing"
type = "single"
difficulty = 3
tags = ["band:7", "grammar-range"]
prompt = "Which sentence best demonstrates the grammatical range expected at band 7?"
options = ["Had the city invested in flood defences earlier, the damage, which cost millions, might have been avoided.", "The city did not invest. There was a flood. It cost a lot.", "The city is not invest so the flood is happen.", "Flood is bad and city is bad."]
answer = [0]
explanation = "Câu 1 kết hợp đảo ngữ điều kiện loại 3 (*Had… invested*) và mệnh đề quan hệ không xác định, chính xác về ngữ pháp. Câu 2 đúng nhưng đơn giản; câu 3 và 4 sai cấu trúc cơ bản."

[[questions]]
id = "iw2-098"
module = "iw2-band-descriptors-editing"
type = "single"
difficulty = 3
tags = ["band:7", "criteria"]
prompt = "A band 6 Coherence and Cohesion descriptor mentions cohesive devices used *effectively, but cohesion within and/or between sentences may be faulty or mechanical*. What is the most efficient way to move this criterion towards band 7?"
options = ["Use a range of devices (reference, substitution, summary nouns) and fewer sentence-initial linkers", "Add *Moreover* to the start of every sentence", "Write more paragraphs of one sentence each", "Replace all pronouns with repeated nouns"]
answer = [0]
explanation = "Band 7 cần liên kết đa dạng và tự nhiên (quy chiếu, thay thế, danh từ tóm tắt), không lạm dụng từ nối đầu câu. Thêm *Moreover* khắp nơi là mechanical; đoạn 1 câu và lặp danh từ làm Cohesion kém hơn."

[[questions]]
id = "iw2-099"
module = "iw2-band-descriptors-editing"
type = "multiple"
difficulty = 3
tags = ["band:7", "self-assessment"]
prompt = "During the final 5 minutes, which checks give the best return for raising your score?"
options = ["Check subject–verb agreement and articles in each sentence", "Check that every part of the question has been answered", "Rewrite the whole introduction with more difficult words", "Count every word one by one"]
answer = [0, 1]
explanation = "5 phút cuối nên soát lỗi lặp lại (chia động từ, mạo từ, số nhiều) và kiểm tra đã trả lời đủ đề. Viết lại mở bài dễ gây lỗi mới; đếm từng từ tốn thời gian (ước lượng theo số dòng là đủ)."

[[questions]]
id = "iw2-100"
module = "iw2-band-descriptors-editing"
type = "essay"
difficulty = 3
tags = ["band:7", "editing"]
prompt = "Rewrite this band 5.5 body paragraph as a band 7 paragraph (4–5 sentences): *Technology is good for old people. They can talk with family. Also they can buy things online. Also technology is good for health. So technology is good.* Keep one main idea and develop it."
keywords = [["elderly", "older people", "older adults", "senior"], ["for example", "for instance", "such as"], ["because", "since", "as a result", "which means"], ["isolation", "lonely", "loneliness", "contact"]]
min_keywords = 3
model_answer = "Technology can significantly improve the social lives of elderly people. Video-calling apps allow them to stay in regular contact with relatives who live far away, which means they are less likely to feel lonely. For example, a grandmother living alone can join a weekly family call and watch her grandchildren grow up. As a result, technology helps reduce isolation, one of the most serious problems faced by older adults."
explanation = "Checklist: (1) Task Response: giữ một ý chính (giảm cô lập) và phát triển sâu thay vì liệt kê 3 ý; (2) Coherence: topic → giải thích → ví dụ → liên hệ lại, bỏ *Also… Also… So*; (3) Lexical: *elderly, stay in regular contact, isolation*; (4) Grammar: mệnh đề quan hệ, *which means*, cụm phân từ *living alone*."
