id = "english-ielts-writing-task2"
title = "IELTS Writing Task 2"
icon = "W2"
color = "#b45309"
group = "Tiếng Anh"
area = "english"
description = "Bài luận IELTS Academic band 6.5: phân tích đề, mở bài và thesis, phát triển ý, liên kết mạch lạc, các dạng đề thường gặp và tự chấm theo 4 tiêu chí."

[[modules]]
id = "iw2-task-analysis"
title = "Phân tích đề và nhận dạng dạng bài"
description = "Nhận dạng 5 dạng đề, gạch chân yêu cầu, tránh lạc đề và trả lời thiếu phần."
lesson = '''
### Lưu ý về app
App chỉ có chữ và chấm essay bằng từ khoá. Cách chấm này chỉ kiểm tra được các *thành phần bắt buộc* (có thesis, có ví dụ, có từ nối...), không đánh giá được band. Vì vậy sau mỗi câu essay hãy đối chiếu bài của bạn với `model_answer` và checklist trong phần giải thích. Tốt nhất là nhờ giáo viên hoặc người có kinh nghiệm chấm bài thật.

### Task 2 là gì
Task 2 là bài luận tối thiểu 250 từ, làm trong khoảng 40 phút và có trọng số gấp đôi Task 1. Bạn chỉ có một đề duy nhất, nên cách đọc đề quyết định phần lớn điểm Task Response. Người Việt hay mất điểm không phải vì tiếng Anh kém mà vì **trả lời một câu hỏi khác** với câu đề hỏi.

### Năm dạng đề thường gặp
| Dạng | Dấu hiệu trong đề | Bạn phải làm |
|---|---|---|
| Opinion (agree/disagree) | *To what extent do you agree or disagree?* | Nêu lập trường rõ và bảo vệ nó xuyên suốt |
| Discussion | *Discuss both views and give your opinion.* | Trình bày cả hai quan điểm, rồi nêu ý kiến riêng |
| Advantages/disadvantages | *Do the advantages outweigh the disadvantages?* | Nêu cả hai mặt và kết luận bên nào nặng hơn |
| Problem–solution | *What problems... What solutions...?* | Một đoạn vấn đề, một đoạn giải pháp, giải pháp khớp vấn đề |
| Two-part question | Hai câu hỏi riêng biệt | Trả lời từng câu, mỗi câu một đoạn thân bài |

Một số đề kết hợp hai dạng (ví dụ vừa hỏi nguyên nhân vừa hỏi giải pháp). Khi đó phải trả lời đủ mọi phần.

### Gạch chân ba thứ trong 2 phút đầu
1. **Chủ đề** và phạm vi của nó (ví dụ *young people in cities*, không phải *everyone*).
2. **Từ chỉ lệnh**: agree, discuss, outweigh, cause, solution.
3. **Số phần cần trả lời**: đếm câu hỏi và dấu hỏi.

### Lạc đề và thiếu phần
- **Lạc đề**: đề hỏi về *tiền thưởng của nhân viên* mà bài viết về *lương nói chung*. Học thuộc bài mẫu cùng chủ đề rồi áp vào là nguyên nhân phổ biến nhất.
- **Thiếu phần**: đề hỏi *causes and solutions* mà chỉ nêu giải pháp. Task Response bị kéo xuống rất nhanh.
- **Không nêu quan điểm** ở dạng discussion khi đề yêu cầu *give your opinion*.

### Phạm vi và từ khoá giới hạn
Chú ý các từ như *some, many, most, should, only, always*. Nếu đề nói *Some people believe...* thì bạn không nên viết như thể đề nói *Everyone believes...*. Giữ nguyên phạm vi của đề trong thesis.

### Quy trình 5 phút
Đọc đề, xác định dạng, gạch chân yêu cầu, chọn lập trường, ghi 2 ý chính cho mỗi đoạn thân bài kèm ví dụ ngắn. Sau đó mới viết.

### Lỗi thường gặp
- Chép nguyên đề vào mở bài thay vì paraphrase.
- Viết mở bài dài 100 từ vì chưa có ý cho thân bài.
- Chọn lập trường *partly agree* mà không giải thích phần nào đồng ý, phần nào không.
'''

[[modules]]
id = "iw2-structure-thesis"
title = "Cấu trúc bài luận, mở bài và thesis"
description = "Paraphrase đề, viết thesis rõ ràng, kết bài, lập dàn ý và phân bổ thời gian."
lesson = '''
### Khung bốn đoạn
Khung an toàn cho band 6.5: **mở bài** (2–3 câu), **thân bài 1**, **thân bài 2**, **kết bài** (2 câu). Tổng khoảng 260–290 từ. Bài quá ngắn (dưới 250 từ) bị trừ điểm Task Response, nhưng viết 400 từ thường làm lỗi tăng lên mà không thêm điểm.

### Mở bài: hai việc
1. **Paraphrase đề**: đổi từ đồng nghĩa và đổi cấu trúc, giữ nguyên nghĩa. Ví dụ đề *Some people think children should start school early*, có thể viết *It is argued by some that formal education ought to begin at a young age*.
2. **Thesis statement**: một câu nêu quan điểm hoặc kế hoạch bài viết, ví dụ *This essay will argue that the drawbacks outweigh the benefits.*

Không cần câu dẫn chung chung như *In today's modern society...*. Những câu đó tốn từ và không có nội dung.

### Thesis tốt và thesis yếu
| Yếu | Tốt |
|---|---|
| *There are many opinions about this topic.* (không có lập trường) | *I partly agree: early schooling helps social skills, but formal lessons should wait until six.* |
| *I will talk about advantages and disadvantages.* (chỉ nói sẽ làm gì) | *While the advantages are real, the disadvantages are more serious in the long run.* |
| Lập trường đổi giữa bài | Lập trường giữ nhất quán |

Thesis phải **trả lời trực tiếp câu hỏi** của đề và khớp với nội dung hai đoạn thân bài.

### Kết bài
Kết bài nhắc lại lập trường bằng lời khác (không chép lại thesis) và tóm tắt ngắn hai lý do chính. Không đưa ý mới. Có thể thêm một dự đoán hoặc đề xuất ngắn nếu hợp.

### Dàn ý trong 5 phút
- Dòng 1: dạng đề và lập trường.
- Mỗi thân bài: 1 ý chính, 1 giải thích, 1 ví dụ.
- Không cần ghi cả câu, chỉ ghi từ khoá.

### Phân bổ 40 phút
| Việc | Thời gian |
|---|---|
| Đọc đề và lập dàn ý | 5 phút |
| Viết bài | 30 phút |
| Soát lỗi | 5 phút |

Khi soát lỗi hãy tìm theo thứ tự: lỗi chia thì, mạo từ, hoà hợp chủ–vị, dấu phẩy, rồi từ nối.

### Lỗi hay gặp của người Việt
- Dùng *I think that...* ở đầu mọi câu, nghe lặp và chủ quan.
- Thesis quá dài, nhồi 3–4 ý nhỏ, thân bài không đủ chỗ phát triển.
- Mở bài chép nguyên đề rồi thêm *in my opinion*.
- Kết bài mở ra ý mới không có thời gian giải thích.
'''

[[modules]]
id = "iw2-idea-development"
title = "Phát triển ý trong đoạn thân bài"
description = "Mô hình topic sentence, giải thích, ví dụ, liên hệ; tránh ý lan man hoặc không được phát triển."
lesson = '''
### Vì sao phát triển ý quan trọng
Task Response đánh giá việc bạn **phát triển** ý, không phải số lượng ý. Band 6 thường có ý liên quan nhưng chỉ nêu qua, ví dụ mơ hồ. Band 7 phát triển các ý chính khá đầy đủ và có ví dụ cụ thể. Hai ý được phát triển kỹ tốt hơn bốn ý nêu qua loa.

### Mô hình đoạn: TEEL
| Bước | Việc làm | Ví dụ |
|---|---|---|
| Topic sentence | Nêu ý chính của đoạn | *Remote work can improve employees' well-being.* |
| Explanation | Giải thích cơ chế | *Without a daily commute, workers gain time for sleep and family.* |
| Example | Dẫn ví dụ cụ thể | *For instance, several software companies reported lower burnout after adopting hybrid schedules.* |
| Link | Nối lại đề hoặc ý chính | *This shows why flexible arrangements are worth supporting.* |

Một đoạn thân bài band 6.5 thường gồm 4–6 câu theo mô hình này.

### Ví dụ tốt và ví dụ yếu
- Yếu: *For example, many people like this.* (mơ hồ, không kiểm chứng được)
- Yếu: kể chuyện cá nhân dài, lạc khỏi lập luận.
- Tốt: nêu một nhóm, một nơi, một tình huống hoặc con số hợp lý: *In Vietnam, cities such as Hanoi have introduced restrictions on motorbikes in some districts.* Bạn không cần số liệu thật chính xác, nhưng không nên bịa thống kê quá cụ thể.

### Các lỗi phát triển ý
1. **Liệt kê** (listing): *There are three reasons: money, time, health.* rồi sang đoạn khác.
2. **Lặp ý**: hai câu nói cùng một điều bằng lời khác.
3. **Ý lạc khỏi topic sentence**: nửa sau đoạn nói về chủ đề khác.
4. **Khái quát quá mức**: *All young people are lazy.*
5. **Ý hời hợt** như *Technology is good because it is useful.* (vòng tròn, không giải thích).

### Cách tìm ý nhanh
Hỏi ba câu: *Ai bị ảnh hưởng? Ảnh hưởng thế nào? Vì sao điều đó quan trọng?* Hoặc dùng các góc: cá nhân, gia đình, kinh tế, xã hội, môi trường.

### Độ dài đoạn
Mỗi đoạn thân bài khoảng 100–120 từ. Nếu đoạn chỉ có 2 câu thì ý chưa phát triển. Nếu đoạn trên 180 từ, hãy cân nhắc tách ý hoặc cắt chi tiết thừa.

### Tự kiểm tra
Với mỗi đoạn, hỏi: (1) topic sentence có trả lời đề không? (2) có phần *vì sao* không? (3) ví dụ có cụ thể và liên quan không? (4) câu cuối có nối lại lập luận không?
'''

[[modules]]
id = "iw2-cohesion-coherence"
title = "Liên kết và mạch lạc"
description = "Từ nối đúng chức năng, quy chiếu, chia đoạn và lỗi dùng từ nối máy móc."
lesson = '''
### Coherence và cohesion khác nhau
**Coherence** (mạch lạc) là bài có thứ tự ý hợp lý, mỗi đoạn một ý trung tâm. **Cohesion** (liên kết) là các phương tiện nối câu: từ nối, đại từ, từ thay thế, lặp từ có kiểm soát. Band 6 dùng từ nối nhưng đôi khi sai hoặc máy móc, band 7 dùng đa dạng và tự nhiên, kèm quy chiếu tốt.

### Từ nối theo chức năng
| Chức năng | Ví dụ |
|---|---|
| Bổ sung | *In addition, Moreover, Furthermore* |
| Đối lập | *However, On the other hand, In contrast* |
| Nhượng bộ | *Although, Even though, Despite* |
| Nguyên nhân – kết quả | *Because of, As a result, Consequently, Therefore* |
| Ví dụ | *For instance, For example, such as* |
| Kết luận | *In conclusion, To sum up, Overall* |

Chọn theo **quan hệ nghĩa**, không theo độ sang. *However* chỉ dùng khi hai ý trái ngược; dùng cho ý bổ sung là sai.

### Dấu câu quanh từ nối
- *However,* đứng đầu câu có dấu phẩy sau nó và dấu chấm trước: *Costs are high. However, benefits are clear.*
- Nối hai mệnh đề bằng *however* chỉ với dấu phẩy là lỗi comma splice. Dùng chấm phẩy hoặc tách câu.
- *Although* không đi với *but* trong cùng một câu.

### Quy chiếu và thay thế
Thay vì lặp lại danh từ, dùng *this trend, such measures, these changes, the former/the latter*. Đại từ phải có đối tượng rõ ràng. *This* một mình dễ mơ hồ, tốt hơn là *this approach*.

### Chia đoạn và câu mở đoạn
Mỗi đoạn có một ý trung tâm nêu ngay ở topic sentence. Dùng cụm dẫn nhập như *One major advantage is...* hay *Another factor to consider is...* để người đọc biết đang ở đâu. Không viết cả bài thành một khối, và không chia mỗi hai câu thành một đoạn.

### Lỗi máy móc
- Bắt đầu mọi câu bằng từ nối (*Firstly, Secondly, Thirdly, Moreover, Furthermore...*).
- Dùng *Moreover* ở đầu mọi đoạn.
- Dùng *On the contrary* khi chỉ muốn nói *however*.
- Lạm dụng *In my opinion* ở mọi đoạn.

### Mẹo
Dùng từ nối ít nhưng đúng. Một đoạn 5 câu thường chỉ cần 1–2 từ nối rõ ràng, còn lại dựa vào quy chiếu và thứ tự ý.
'''

[[modules]]
id = "iw2-opinion-discussion"
title = "Dạng opinion và discussion"
description = "Giữ lập trường nhất quán, nhượng bộ rồi phản biện, trình bày hai quan điểm và nêu ý kiến riêng."
lesson = '''
### Opinion essay
Đề dạng *To what extent do you agree or disagree?* cần một lập trường rõ ràng. Có ba lựa chọn: đồng ý hoàn toàn, không đồng ý, hoặc đồng ý một phần. Đồng ý một phần hợp lệ nếu bạn nói rõ *phần nào* và *vì sao*. Điều bị trừ điểm là lập trường mơ hồ hoặc đổi ý giữa bài.

### Cấu trúc gợi ý (opinion)
| Đoạn | Nội dung |
|---|---|
| Mở bài | Paraphrase đề + lập trường (*I strongly believe that...*) |
| Thân bài 1 | Lý do chính ủng hộ lập trường |
| Thân bài 2 | Lý do thứ hai, hoặc nhượng bộ rồi phản biện |
| Kết bài | Nhắc lại lập trường bằng lời khác |

### Nhượng bộ rồi phản biện
Kỹ thuật này giúp bài chín chắn: ghi nhận một ý đối lập, rồi giải thích vì sao nó yếu hơn. Ví dụ: *Admittedly, online courses lack face-to-face interaction. Nevertheless, this drawback is outweighed by flexibility, which allows working adults to study at their own pace.* Không dùng quá nhiều: một lần cho mỗi bài là đủ.

### Discussion essay
Đề dạng *Discuss both views and give your opinion.* có hai nhiệm vụ: trình bày cân bằng cả hai quan điểm, rồi nêu ý kiến riêng. Cấu trúc thường gặp: thân bài 1 viết quan điểm A, thân bài 2 viết quan điểm B kèm ý kiến của bạn (hoặc ý kiến nêu ở mở bài và nhắc lại ở kết bài). Không nên dành một đoạn cho quan điểm mà bạn không giải thích được.

### Ngôn ngữ nêu quan điểm
- Ý kiến cá nhân: *I firmly believe that..., From my perspective, ...*
- Quan điểm của người khác: *Supporters argue that..., Critics point out that..., It is often claimed that...*
- Nhấn mạnh có mức độ: *to a large extent, in most cases, tend to*.

### Giữ nhất quán
Nếu mở bài nói *I agree*, kết bài không được nói *I disagree*. Nếu thân bài có phần nhượng bộ thì kết bài vẫn phải nghiêng về một phía rõ ràng.

### Lỗi hay gặp
1. Nêu hai quan điểm nhưng quên nói ý kiến mình (thiếu phần đề yêu cầu).
2. Dùng *I* quá nhiều và ngôn ngữ cảm xúc (*I really hate...*).
3. Khái quát tuyệt đối (*everyone, nobody, always*).
4. Chọn *partly agree* nhưng thân bài chỉ ủng hộ một phía.
5. Viết đoạn A dài, đoạn B ngắn một cách mất cân đối.
'''

[[modules]]
id = "iw2-advantages-problem-solution"
title = "Advantages/disadvantages, problem–solution, two-part question"
description = "Ba dạng đề còn lại: cân nhắc lợi hại, cặp vấn đề và giải pháp, trả lời hai câu hỏi riêng."
lesson = '''
### Advantages and disadvantages
Có hai kiểu đề. Kiểu 1: *Discuss the advantages and disadvantages.* Kiểu 2: *Do the advantages outweigh the disadvantages?* Kiểu 2 đòi hỏi bạn **kết luận** bên nào nặng hơn, còn kiểu 1 chỉ cần trình bày cân đối. Cấu trúc phổ biến: thân bài 1 viết ưu điểm, thân bài 2 viết nhược điểm. Với kiểu 2, thesis nêu rõ nhược điểm hay ưu điểm quan trọng hơn và hai đoạn thân bài phải đỡ lập luận đó.

### Problem–solution
Đề hỏi các vấn đề (hoặc nguyên nhân) và giải pháp. Cấu trúc: thân bài 1 nêu 1–2 vấn đề kèm giải thích, thân bài 2 nêu giải pháp **tương ứng**. Lỗi phổ biến: giải pháp chung chung (*The government should do something*) và không khớp vấn đề đã nêu. Mỗi giải pháp nên nói *ai làm gì* và *vì sao hiệu quả*, ví dụ *Local councils could subsidise bus tickets, which would encourage commuters to leave cars at home.*

### Two-part question
Đề có hai câu hỏi độc lập, ví dụ *Why is this happening? Is it a positive or negative development?* Mỗi câu hỏi trả lời trong một đoạn thân bài, theo đúng thứ tự trong đề. Mở bài nêu hướng trả lời cho cả hai. Kết bài trả lời tóm tắt cả hai.

### Bảng gợi ý chọn cấu trúc
| Dạng | Thân bài 1 | Thân bài 2 |
|---|---|---|
| Adv/disadv (kiểu 1) | Ưu điểm | Nhược điểm |
| Adv/disadv (outweigh) | Mặt yếu hơn | Mặt mạnh hơn, kết luận |
| Problem–solution | Vấn đề | Giải pháp khớp vấn đề |
| Two-part | Trả lời câu 1 | Trả lời câu 2 |

### Mẫu câu hữu ích
- Lợi hại: *A key benefit is..., One significant drawback is..., The main downside lies in...*
- Vấn đề: *This has led to..., A major consequence of this trend is...*
- Giải pháp: *One effective measure would be to..., Governments could address this by...*
- Đánh giá: *On balance, ..., Overall, the advantages clearly outweigh...*

### Lỗi hay gặp
- Viết cả hai mặt nhưng không kết luận ở dạng outweigh.
- Giải pháp không liên quan đến vấn đề đã nêu.
- Chỉ nêu giải pháp mà bỏ vấn đề, hoặc ngược lại.
- Đảo thứ tự hai câu hỏi so với đề, khiến bài khó theo dõi.
- Ưu và nhược điểm không cân xứng về độ dài.
'''

[[modules]]
id = "iw2-band-descriptors-editing"
title = "Tự chấm theo 4 tiêu chí và nâng bài lên band 7"
description = "Task Response, Coherence & Cohesion, Lexical Resource, Grammatical Range & Accuracy; sửa câu band 5.5 thành band 7."
lesson = '''
### Bốn tiêu chí chấm Writing Task 2
Mỗi tiêu chí chiếm 25% điểm. Bài học này diễn giải bằng lời riêng, không chép bảng mô tả chính thức. Hãy tham khảo tài liệu chính thức của đơn vị tổ chức thi để biết chi tiết.

| Tiêu chí | Câu hỏi tự hỏi |
|---|---|
| Task Response | Tôi đã trả lời đủ mọi phần chưa? Lập trường có rõ và nhất quán không? Ý có được phát triển và có ví dụ không? |
| Coherence & Cohesion | Ý có theo thứ tự hợp lý không? Chia đoạn có hợp lý không? Từ nối có đúng chức năng và không máy móc không? |
| Lexical Resource | Từ vựng có đủ để diễn đạt chính xác không? Có collocation tự nhiên và một vài từ ít phổ biến đúng ngữ cảnh không? Có lỗi chính tả không? |
| Grammatical Range & Accuracy | Có trộn câu đơn và câu phức không? Có nhiều câu không lỗi không? Lỗi có làm khó hiểu không? |

### Band 6 so với band 7 (diễn giải)
- **Task Response**: band 6 trả lời đủ nhưng ý phát triển không đều, ví dụ còn chung chung. Band 7 trình bày lập trường rõ xuyên suốt và phát triển các ý chính khá đầy đủ, có ví dụ cụ thể.
- **Coherence & Cohesion**: band 6 sắp xếp ổn nhưng liên kết đôi khi máy móc hoặc thiếu quy chiếu. Band 7 có tiến trình ý rõ, dùng nhiều cách liên kết khá tự nhiên.
- **Lexical Resource**: band 6 đủ từ nhưng lặp, collocation đôi khi sai. Band 7 linh hoạt hơn, có từ ít phổ biến và ít lỗi.
- **Grammar**: band 6 trộn câu đơn và câu phức nhưng lỗi còn khá nhiều. Band 7 dùng đa dạng cấu trúc và có nhiều câu hoàn toàn đúng.

Band 6.5 là ổn định ở 6 và chạm 7 ở một vài tiêu chí.

### Nâng câu từ 5.5 lên 7
| Câu band 5.5 | Vấn đề | Câu band 7 |
|---|---|---|
| *Many people use car so air is very bad.* | Thiếu mạo từ, nguyên nhân thô | *Widespread car use has contributed to a serious deterioration in air quality.* |
| *Technology is good because it is useful.* | Vòng tròn, không phát triển | *Technology streamlines daily tasks, which frees up time for more meaningful activities.* |
| *I am agree with this idea.* | Sai ngữ pháp, lặp từ | *I largely agree with this view.* |

### Các kỹ thuật nâng band
1. Thay động từ chung (*get, do, make, have*) bằng động từ chính xác hơn.
2. Dùng danh hoá có kiểm soát (*the rise in unemployment*).
3. Thêm một mệnh đề quan hệ hoặc phân từ để gộp hai câu ngắn.
4. Dùng hedging: *tend to, may, is likely to*.
5. Cụ thể hoá ví dụ thay vì *many people*.

### Checklist tự chấm sau khi viết
1. Đã trả lời mọi phần đề chưa?
2. Lập trường có nhất quán từ mở bài tới kết bài không?
3. Mỗi thân bài có topic sentence, giải thích và ví dụ không?
4. Có ít nhất 3–4 từ nối khác nhau, dùng đúng chức năng không?
5. Có tối thiểu một nửa số câu không lỗi không?
6. Độ dài ≥ 250 từ chưa?

### Lỗi điển hình của người Việt
Thiếu mạo từ (*the, a*), nhầm số ít và nhiều với danh từ không đếm được (*informations, advices*), thiếu chủ ngữ, *I am agree*, và dịch từng chữ từ tiếng Việt.
