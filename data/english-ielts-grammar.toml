[[modules]]
id = "ig-tense-control"
title = "Kiểm soát thì trong Task 1 và Speaking"
description = "Chọn thì theo mốc thời gian của biểu đồ, dự báo tương lai, present perfect và kể chuyện ở Speaking Part 2."
lesson = '''
### Lộ trình học gợi ý
Khu IELTS dành cho người đã xong khoảng B1. Thứ tự hợp lý: học song song CEFR B2 với **Ngữ pháp IELTS** và **Từ vựng IELTS**, sau đó Reading và Listening, rồi Writing Task 1, Task 2 và cuối cùng Speaking. Cuối cùng dùng tính năng Thi thử cho tới khi đạt ít nhất 70% câu band 6.5. App chỉ có chữ: bạn cần tự luyện thêm với audio thật và tự ghi âm khi học Listening, Speaking.

### Nguyên tắc: thì đi theo mốc thời gian của dữ liệu
Trong Writing Task 1, bạn không chọn thì theo cảm giác mà theo **mốc thời gian được ghi trên biểu đồ**. Hãy nhìn trục thời gian trước khi viết câu đầu tiên.

| Mốc thời gian của dữ liệu | Thì nên dùng | Ví dụ |
|---|---|---|
| Hoàn toàn trong quá khứ (1990–2010) | Past simple | *Sales rose sharply between 1990 and 2000.* |
| Dự báo (2030, 2040) | will / is expected to / is projected to | *Demand is projected to reach 50 million by 2040.* |
| Không có mốc, dữ liệu chung | Present simple | *The chart shows how energy is used in homes.* |
| Từ quá khứ kéo đến hiện tại | Present perfect | *The number of users has doubled since 2015.* |
| Xảy ra trước một mốc quá khứ khác | Past perfect | *By 2005, the figure had already fallen to 12%.* |

### Present perfect và past simple
Dùng **past simple** khi có mốc đã kết thúc (*in 2008, last year*). Dùng **present perfect** khi có *since, for, so far, over the past decade* hoặc khi kết quả còn liên quan tới hiện tại. Lỗi người Việt hay gặp: viết *Since 2010, the number rose* (đúng là *has risen*) hoặc *The price has risen in 2012* (đúng là *rose*).

### Giữ nhất quán thì
Một đoạn mô tả dữ liệu quá khứ không nên nhảy sang hiện tại: ~~The figure fell to 8% in 2000 and then rises to 11%~~. Nhưng bạn được đổi thì khi nội dung đổi, ví dụ mô tả dữ liệu quá khứ rồi nêu dự báo: *Sales peaked in 2010 and are forecast to fall again by 2030.* Câu overview cũng theo cùng quy tắc: *Overall, car ownership increased throughout the period.*

### Speaking Part 2: kể chuyện bằng thì quá khứ
Khi kể một trải nghiệm trong cue card, dùng **past simple** cho chuỗi sự kiện chính, **past continuous** cho bối cảnh (*I was walking home when…*), **past perfect** cho việc xảy ra trước (*I had never met him before*). Chuyển về present khi nêu cảm nghĩ hiện tại: *Now I think it was the best decision I have ever made.* Đừng nhảy qua lại giữa quá khứ và hiện tại trong lúc kể.

### Lỗi hay gặp
- Quên chia thì vì tiếng Việt không chia động từ: ~~Last year I go to Da Nang~~.
- Dùng *will* cho mọi dự báo; band cao hơn dùng *is expected to, is likely to, is set to*.
- Dùng present perfect với mốc quá khứ xác định (*yesterday, in 2019*).

### Mẹo thời gian
Trước khi viết Task 1, gạch chân mốc thời gian trong đề và ghi sẵn một chữ "P" (past), "F" (future) hay "N" (now) lên đầu bài. Mất 10 giây nhưng tránh được lỗi thì kéo dài suốt bài.
'''

[[modules]]
id = "ig-complex-sentences"
title = "Câu phức và câu ghép đúng dấu câu"
description = "Mệnh đề trạng ngữ, liên từ đúng cặp, câu ghép và cách tránh run-on, fragment."
lesson = '''
### Vì sao câu phức quan trọng
Tiêu chí Grammatical Range & Accuracy yêu cầu trộn câu đơn và câu phức, và có nhiều câu không lỗi. Band 6 dùng câu phức nhưng còn lỗi; band 7 dùng đa dạng cấu trúc và phần lớn chính xác. Mục tiêu: mỗi đoạn có ít nhất 2 câu phức đúng, không cần ép 5 mệnh đề vào một câu.

### Liên từ theo chức năng
| Chức năng | Liên từ | Ví dụ |
|---|---|---|
| Nhượng bộ | although, though, even though | *Although the cost is high, many families still buy cars.* |
| Đối lập hai vế | whereas, while | *Urban areas are crowded, whereas rural areas are sparsely populated.* |
| Điều kiện | provided that, as long as, unless | *Cities will remain liveable provided that public transport improves.* |
| Mục đích | so that, in order to | *Schools should offer online options so that working adults can study.* |
| Nguyên nhân | because, since, as | *Since housing is expensive, young people stay with parents.* |
| Kết quả | so, so… that, such… that | *The fee was so high that few students applied.* |

### Dấu câu
Hai mệnh đề độc lập nối bằng liên từ đẳng lập cần dấu phẩy trước liên từ: *Prices rose, but wages stayed flat.* Mệnh đề phụ đứng đầu câu cần dấu phẩy sau nó: *Although prices rose, demand did not fall.* Nếu mệnh đề phụ đứng sau, thường không cần dấu phẩy: *Demand did not fall although prices rose.* Chấm phẩy (;) nối hai mệnh đề độc lập có nghĩa gần nhau: *Some people prefer cities; others choose the countryside.*

### Run-on và fragment
- **Run-on / comma splice:** ~~Many people use social media, it saves time.~~ Sửa: *Many people use social media because it saves time.*
- **Fragment:** ~~Because the roads were closed.~~ Đây chỉ là mệnh đề phụ; cần mệnh đề chính: *Because the roads were closed, the event was cancelled.*
- Câu ngắn thiếu động từ chính cũng là fragment: ~~The government, which has introduced new taxes.~~

### Lỗi điển hình của người Việt
1. **Although … but**: tiếng Việt nói *Mặc dù… nhưng…*, tiếng Anh chỉ dùng một trong hai: *Although it rained, we went out.*
2. **Because … so**: tương tự, chỉ dùng một liên từ.
3. Dùng *despite* và *in spite of* với mệnh đề: ~~Despite he was tired~~. Sau chúng là danh từ/V-ing hoặc *the fact that*.
4. *Whereas/while* thiếu dấu phẩy giữa hai vế đối lập.

### Quy trình tự kiểm tra
Với mỗi câu dài, hỏi: (1) có động từ chia thì chính chưa? (2) mỗi mệnh đề có chủ ngữ riêng không? (3) liên từ có đúng chức năng không? (4) dấu phẩy hợp lý chưa? Nếu không chắc, tách làm hai câu ngắn đúng còn hơn một câu dài sai.
'''

[[modules]]
id = "ig-relative-participle"
title = "Mệnh đề quan hệ và cụm phân từ"
description = "Which, who, that, whose; xác định và không xác định; rút gọn bằng phân từ và cụm phân từ đầu câu."
lesson = '''
### Mệnh đề quan hệ để nối ý gọn
Mệnh đề quan hệ giúp gộp hai câu thành một mà vẫn rõ ý, rất hữu ích trong Task 2 và Speaking Part 3. Chọn đại từ theo danh từ đứng trước.

| Đại từ | Thay cho | Ví dụ |
|---|---|---|
| who | người (chủ ngữ) | *Teachers who use technology engage students more.* |
| whom | người (tân ngữ, trang trọng) | *The experts whom we consulted disagreed.* |
| which | vật | *The scheme, which began in 2018, reduced waste.* |
| that | người/vật (chỉ xác định) | *The policy that was introduced last year failed.* |
| whose | sở hữu | *Students whose parents read to them tend to read earlier.* |
| where / when | nơi chốn / thời gian | *Cities where public transport is cheap have less traffic.* |

### Xác định và không xác định
- **Xác định (defining):** cần để biết đang nói tới ai/cái gì, không có dấu phẩy, dùng được *that*. *Workers who lack digital skills may lose their jobs.* (chỉ nhóm những người thiếu kỹ năng)
- **Không xác định (non-defining):** thông tin thêm, có dấu phẩy hai bên, **không** dùng *that*. *Automation, which is spreading quickly, will change many jobs.*
- Có thể dùng *which* để bình luận cả mệnh đề trước: *Fuel prices have doubled, which has forced many to cycle to work.*

### Rút gọn bằng phân từ
| Dạng đầy đủ | Rút gọn | Ghi chú |
|---|---|---|
| *students who study abroad* | *students studying abroad* | V-ing cho nghĩa chủ động |
| *a law that was passed in 2020* | *a law passed in 2020* | V3 cho nghĩa bị động |
| *Because he lacked funds, he cancelled it.* | *Lacking funds, he cancelled it.* | cụm phân từ đầu câu |
| *After they had analysed the data, the team…* | *Having analysed the data, the team…* | hoàn thành, hành động trước |

**Quy tắc vàng:** chủ ngữ của cụm phân từ đầu câu phải trùng chủ ngữ mệnh đề chính. ~~Walking down the street, the rain started.~~ (cơn mưa không đi bộ). Đúng: *Walking down the street, I felt the rain start.*

### Lỗi hay gặp
1. Thêm đại từ thừa: ~~The book which I bought it~~ → *The book which I bought*.
2. Dùng *that* sau dấu phẩy: ~~The film, that I saw~~.
3. Nhầm *who/which* với người và vật.
4. Dangling participle như trên.
5. Quên dấu phẩy ở mệnh đề không xác định, làm đổi nghĩa.

### Dùng cho band 7
Một câu như *Governments should invest in public transport, which reduces congestion and lowers emissions* nén hai ý thành một. Không lạm dụng: mỗi đoạn một đến hai mệnh đề quan hệ là đủ, nếu quá dày câu sẽ rối.
'''

[[modules]]
id = "ig-conditionals-hypothesis"
title = "Câu điều kiện và giả định"
description = "Điều kiện loại 0–3, hỗn hợp, unless, as long as, if governments were to... và mệnh đề giả định."
lesson = '''
### Bốn loại điều kiện cơ bản
| Loại | Cấu trúc | Dùng khi | Ví dụ |
|---|---|---|---|
| 0 | If + present, present | sự thật, quy luật | *If water reaches 100°C, it boils.* |
| 1 | If + present, will + V | khả năng thật ở tương lai | *If fares fall, more people will use buses.* |
| 2 | If + past, would + V | giả định không có thật hiện tại | *If I were the mayor, I would ban cars downtown.* |
| 3 | If + past perfect, would have + V3 | giả định về quá khứ | *If the city had invested earlier, congestion would have been lower.* |

Hỗn hợp: *If the government had taxed sugar earlier, obesity rates would be lower today.* (quá khứ → hiện tại).

### Trong Task 2
Điều kiện loại 1 và 2 rất tự nhiên khi đưa giải pháp hoặc dự đoán hậu quả. Dùng loại 1 khi bạn thấy khả năng thực tế: *If universities offer more online courses, access to education will improve.* Dùng loại 2 để bàn một thay đổi khó xảy ra: *If governments were to ban private cars, cities would become cleaner.* Cấu trúc *were to* và *should* trang trọng hơn: *If governments were to raise fuel tax… / Should the number of drivers continue to grow…*

### Từ thay cho if
| Từ | Nghĩa | Ví dụ |
|---|---|---|
| unless | nếu không (= if … not) | *Unless wages rise, families will struggle.* |
| as long as / provided (that) | miễn là | *Remote work is fine as long as productivity stays high.* |
| in case | phòng khi | *Carry a map in case your phone dies.* |
| otherwise | nếu không thì | *Cities must act now; otherwise, pollution will worsen.* |

Với *unless* không dùng thêm phủ định: ~~Unless it doesn't rain~~.

### Đảo ngữ điều kiện (band 7)
*Had the company trained its staff, the mistake would not have happened.* (= If the company had trained…). *Were people better informed, they would choose healthier food.* Chỉ dùng một hai lần, và phải đúng.

### Lỗi hay gặp của người Việt
1. Dùng *will* sau *if* ở mệnh đề điều kiện: ~~If it will rain~~. Đúng: *If it rains*.
2. Dùng *would* sau *if*: ~~If I would have money~~. Đúng: *If I had money, I would…*
3. Nhầm *was/were*: giả định trang trọng dùng *were* với mọi ngôi (*If she were…*).
4. Câu điều kiện loại 3 nhưng chia loại 2: ~~If he studied harder, he would pass last year~~.
5. Quên dấu phẩy khi mệnh đề *if* đứng đầu.

### Cách chọn loại
Hỏi hai câu: (1) việc này có thể xảy ra thật không? (2) mốc thời gian là hiện tại, tương lai hay quá khứ? Từ đó chọn loại, rồi kiểm tra từng mệnh đề độc lập.
'''

[[modules]]
id = "ig-passive-impersonal"
title = "Bị động và cấu trúc khách quan"
description = "Bị động trong mô tả quy trình, It is believed that..., X is said to..., và khi nào không nên dùng bị động."
lesson = '''
### Khi nào dùng bị động
Bị động hợp lý khi tác nhân không quan trọng hoặc không rõ, hoặc khi cần nhấn vào đối tượng chịu tác động. Trong **Task 1 process** (quy trình sản xuất, vòng tuần hoàn), gần như mọi bước đều ở bị động vì người đọc quan tâm tới nguyên liệu và công đoạn.

*First, the raw materials are collected and transported to the factory. Next, they are crushed and mixed with water.*

### Hình thức của bị động
| Thì | Cấu trúc | Ví dụ |
|---|---|---|
| Present simple | am/is/are + V3 | *The bricks are heated in a kiln.* |
| Past simple | was/were + V3 | *The data was collected in 2019.* |
| Present perfect | has/have been + V3 | *The road has been repaired.* |
| Future | will be + V3 | *More jobs will be created.* |
| Modal | modal + be + V3 | *Waste can be recycled.* |
| Continuous | is/are being + V3 | *The bridge is being rebuilt.* |

Để thêm tác nhân dùng *by*: *The water is filtered by a series of tanks.* Chỉ thêm khi tác nhân có ý nghĩa.

### Trình tự trong quy trình
Dùng từ chỉ thứ tự: *First, Next, Then, After that, Finally, Once the mixture has cooled…, At the same time, Subsequently*. Đừng lặp *then* ở mọi câu. Dùng mệnh đề *when/once/after* để nối hai bước: *Once the grapes have been picked, they are transported to the winery.*

### Cấu trúc khách quan
Dùng trong Task 2 để nêu quan điểm chung mà không tự nhận là của mình.
- *It is widely believed that technology improves learning.*
- *Young people are said to spend too much time online.*
- *It has been argued that tuition fees should be abolished.*
- *The policy is expected to reduce traffic.*

Dạng *S + is said/believed/thought to + V* và *It is said that + clause* có nghĩa như nhau; chọn dạng thứ hai khi mệnh đề dài. Với sự việc ở quá khứ hoặc hoàn thành dùng *to have + V3*: *The city is believed to have grown rapidly after 1990.*

### Khi không nên dùng bị động
- Khi tác nhân là nội dung chính: *Governments must act* tốt hơn ~~Action must be taken by governments~~.
- Với nội động từ không có bị động: ~~The accident was happened~~, ~~The price was risen~~ (*happen, rise, occur, appear, fall* đều không bị động).
- Khi cả bài toàn bị động làm văn phong nặng nề.

### Lỗi thường gặp
1. Thiếu *be*: ~~The water heated~~.
2. Dùng V-ing thay V3: ~~is produce~~, ~~is producing~~ (khi nghĩa bị động).
3. Quên V3 bất quy tắc: ~~was build~~, ~~were gave~~.
4. Sai chủ ngữ: ~~People are believed that~~.

### Mẹo
Trước khi viết một process, tự hỏi: "ai thực hiện?" Nếu là máy hay quy luật tự nhiên, dùng bị động; nếu có người ra quyết định (Task 2), ưu tiên chủ động.
'''

[[modules]]
id = "ig-nominalisation-noun-phrases"
title = "Danh hoá và cụm danh từ học thuật"
description = "Biến động từ, tính từ thành danh từ; cụm danh từ dài; the + so sánh hơn... the + so sánh hơn; văn phong học thuật."
lesson = '''
### Danh hoá là gì
Danh hoá (nominalisation) biến động từ hoặc tính từ thành danh từ để nén thông tin và tạo văn phong học thuật. So sánh:

- Nói thường: *Many people lose their jobs because machines can do more tasks.*
- Học thuật: *The increasing capability of machines is leading to job losses.*

Câu thứ hai gọn hơn, có chủ ngữ là một khái niệm thay vì người. Đây là một đặc điểm của band 7 trong Lexical Resource và Grammatical Range.

### Một số cặp hay dùng
| Động từ / tính từ | Danh từ | Ví dụ |
|---|---|---|
| decide | decision | *The decision to close the school was criticised.* |
| increase | increase | *A sharp increase in prices…* |
| develop | development | *Economic development brings new risks.* |
| fail | failure | *Failure to plan leads to waste.* |
| able | ability | *The ability to adapt is vital.* |
| important | importance | *The importance of sleep is often ignored.* |
| depend | dependence / dependency | *Dependence on foreign oil is risky.* |
| grow | growth | *Rapid growth strains housing.* |

### Cụm danh từ dài
Cấu trúc: *determiner + modifiers + head noun + post-modifiers*. Ví dụ: *the rapid expansion of low-cost airlines in Southeast Asia*. Phần sau danh từ chính thường là *of*, giới từ, mệnh đề quan hệ hoặc phân từ. Đọc chủ ngữ dài như vậy, tìm danh từ chính (*expansion*) để chia động từ: *The rapid expansion of airlines has/have…* → *has*.

### The + so sánh hơn
Cấu trúc *The + comparative, the + comparative* thể hiện hai thay đổi song song: *The more people use public transport, the fewer cars are on the road.* Không dùng ~~The more… more~~ (thiếu *the* thứ hai).

### Đổi câu nói thường thành học thuật
| Nói thường | Học thuật |
|---|---|
| *People are worried because prices keep going up.* | *Rising prices are a source of growing concern.* |
| *If we don't act, the problem will get worse.* | *Failure to act will exacerbate the problem.* |
| *Many students find it hard to concentrate.* | *Difficulty concentrating is common among students.* |

### Lỗi hay gặp
1. Danh hoá quá nhiều, câu như danh sách danh từ khó đọc. Cân bằng với động từ mạnh.
2. Sai loại từ: ~~The economic of the country~~ → *The economy*; ~~an important of~~ → *the importance of*.
3. Quên mạo từ trước danh từ đếm được số ít.
4. Dùng *of* quá nhiều: ~~the development of the growth of the economy of the country~~.
5. Nhầm chủ ngữ số ít/nhiều với cụm dài (xem module Accuracy).

### Cách luyện
Lấy một bài Task 2 band 6 của chính bạn, chọn 3 câu có "people + động từ" rồi viết lại thành câu có chủ ngữ là danh từ trừu tượng. Giữ lại bản nào đọc tự nhiên hơn.
'''

[[modules]]
id = "ig-comparison-data"
title = "So sánh và mô tả số liệu chính xác"
description = "So sánh hơn/nhất, twice as... as, tỉ lệ, compared with, while, và cách mô tả mức độ thay đổi."
lesson = '''
### So sánh cơ bản
| Dạng | Cấu trúc | Ví dụ |
|---|---|---|
| Hơn | adj-er / more + adj + than | *Rent was higher in London than in Leeds.* |
| Nhất | the adj-est / the most + adj | *Japan had the highest proportion of older people.* |
| Bằng | as + adj + as | *Spain's rate was as high as Italy's.* |
| Gấp bội | twice / three times as + adj + as | *Sales were twice as high as in 2010.* |
| Bội số | N times + as many/much as | *Women made up three times as many students as men.* |
| Gần bằng | roughly/almost the same as | *The figures were almost the same.* |

*Twice as many* dùng với danh từ đếm được; *twice as much* dùng với không đếm được: *twice as many cars*, *twice as much traffic*.

### Từ đối chiếu
Dùng *compared with / compared to*, *in contrast*, *whereas*, *while*, *by comparison*, *on the other hand*. Ví dụ: *Car use rose by 15%, whereas cycling fell slightly.* Ở đầu câu: *In contrast, rail travel remained stable.* Tránh liệt kê số theo kiểu ~~A is 20%, B is 30%, C is 15%~~ mà không so sánh.

### Tỉ lệ và mức độ
- *the highest / lowest proportion (percentage, share)*; *the largest number* (đếm được).
- Mức độ: *slightly, marginally, moderately, considerably, substantially, dramatically*.
- Xấp xỉ: *approximately, around, just over, nearly, roughly a third*.
- Phân số: *a quarter, three-fifths, one in ten*, *the majority*, *a small minority*.

### The number of và a number of
*The number of students has risen.* (chủ ngữ là *number*, số ít). *A number of students were absent.* (= vài, chủ ngữ số nhiều). Tương tự, *the proportion of* đi với động từ số ít: *The proportion of women is higher.*

### Giới từ đi với số liệu
*rise **by** 10%* (mức tăng), *rise **to** 50%* (điểm đến), *an increase **of** 5%*, *a figure **of** 12%*, *account **for** 40%*, *at 15%* (mức), *from 10% to 20%*, *between 2000 and 2010*, *in 2005*, *over the period*.

### Lỗi hay gặp
1. Nhầm *by* và *to*: ~~rose to 5% from 10%~~ khi ý là mức tăng.
2. ~~The number of cars is more than~~ → *higher than* (số liệu "cao/thấp", không "nhiều/ít" cho number).
3. Dùng *than* với *as…as*: ~~as high than~~.
4. Thiếu *the* với so sánh nhất: ~~highest percentage~~ → *the highest percentage*.
5. Dùng *more* với tính từ ngắn: ~~more high~~.
6. Dùng *less* với danh từ đếm được: ~~less people~~ → *fewer people*.

### Mẹo chọn số liệu
Trong Task 1 band 7 bạn không mô tả mọi số liệu, chỉ chọn điểm cao nhất, thấp nhất, thay đổi lớn và vài so sánh đáng chú ý, sau đó nhóm các hạng mục giống nhau. Giữ câu so sánh đúng hơn là chen thêm nhiều con số.
'''

[[modules]]
id = "ig-modals-hedging"
title = "Động từ khuyết thiếu và hedging"
description = "Mức chắc chắn, đề xuất, giảm độ tuyệt đối bằng may, tend to, it is essential that và tránh khẳng định quá mức."
lesson = '''
### Vì sao cần hedging
Trong Task 2, nêu mọi điều như sự thật tuyệt đối (*Technology destroys education*) làm lập luận yếu và dễ sai. Hedging là cách làm mềm mức độ chắc chắn, giúp bài nghe như văn học thuật. Band 7 dùng nhiều cách khác nhau chứ không chỉ *can*.

### Thang mức chắc chắn
| Mức | Cách diễn đạt | Ví dụ |
|---|---|---|
| Rất chắc | will, must, is certain to, undoubtedly | *Automation will transform manufacturing.* |
| Khá chắc | is likely to, is bound to, should | *Prices are likely to rise.* |
| Có thể | may, might, could, is possible that | *This may lead to unemployment.* |
| Xu hướng | tend to, often, in many cases, generally | *Teenagers tend to prefer online learning.* |
| Đề xuất yếu | seems/appears to, suggests that | *Research suggests that sleep affects memory.* |

*May* và *might* gần nhau, *might* hơi ít chắc hơn. *Could* có thể là khả năng hoặc năng lực; tùy ngữ cảnh.

### Danh từ và trạng từ hedging
- Trạng từ: *probably, possibly, perhaps, arguably, apparently, generally, typically, largely*.
- Danh từ: *a tendency, a possibility, the likelihood of*.
- Cụm: *to some extent, in most cases, it could be argued that…*.
- Tránh tuyệt đối: *all, every, always, never, nobody*. Thay bằng *most, many, a majority of, usually, rarely*.

### Đề xuất và nghĩa vụ
| Cấu trúc | Ví dụ |
|---|---|
| should / ought to | *Governments should invest in public transport.* |
| It is essential/vital/important that + (should) + V | *It is essential that schools teach financial skills.* |
| must / have to | *Employers must provide safe conditions.* |
| had better, need to | *Cities need to reduce emissions.* |
| be encouraged to, be required to | *Citizens should be encouraged to recycle.* |

Sau *It is essential that*, động từ ở dạng nguyên mẫu (giả định cách): *It is essential that he **attend**…* hoặc có *should*. Không thêm *-s*.

### Modal hoàn thành
*may have + V3* (có thể đã), *should have + V3* (đáng lẽ), *must have + V3* (chắc hẳn đã), *can't have + V3* (không thể đã). Ví dụ: *The government should have acted earlier.* Dùng trong Task 2 khi nhìn lại và phê bình chính sách.

### Lỗi hay gặp
1. Thêm *to* sau modal: ~~should to invest~~.
2. Thêm *-s* sau modal: ~~can makes~~.
3. Dùng hai modal liền: ~~will can~~ → *will be able to*.
4. Hedging thừa làm bài mơ hồ: ~~It may possibly perhaps be a problem~~. Dùng một dấu hiệu là đủ.
5. Khẳng định tuyệt đối với từ *all, always, never*.
6. Nhầm *must not* (cấm) với *don't have to* (không bắt buộc).

### Kết hợp với lập trường
Hedging không có nghĩa là lập trường mơ hồ. Bạn vẫn nêu rõ quan điểm ở mở bài rồi hedging ở các đoạn thân để lập luận có sắc thái: *I strongly believe that… This is likely to…*
'''

[[modules]]
id = "ig-accuracy-errors"
title = "Chính xác: mạo từ, số nhiều, hoà hợp chủ vị, dấu câu"
description = "Các lỗi người Việt hay mắc: mạo từ, danh từ không đếm được, hoà hợp chủ vị, there is/are, rise/raise, dấu phẩy."
lesson = '''
### Vì sao tập trung vào độ chính xác
Ở band 6.5, giám khảo chú ý tỉ lệ câu không lỗi. Một bài đa dạng nhưng có lỗi cơ bản ở mọi câu sẽ bị kìm ở band 6. Module này liệt kê các lỗi người Việt gặp thường xuyên nhất để bạn tự rà soát trước khi nộp.

### Mạo từ
| Tình huống | Quy tắc | Ví dụ |
|---|---|---|
| Nói chung, số nhiều/không đếm được | không mạo từ | *Cities face pollution.* |
| Đếm được số ít, nhắc lần đầu | a / an | *A new law was passed.* |
| Đã xác định, duy nhất | the | *The government should act.* |
| So sánh nhất, thứ tự | the | *the most serious problem* |
| Tên riêng nước | thường không the | *Vietnam, Japan*, nhưng *the UK, the US* |

Lỗi: ~~Government should…~~ (khi nói chính phủ cụ thể → *The government*); ~~The education is important~~ (nói chung → *Education is*); ~~a information~~.

### Danh từ không đếm được
*information, advice, research, equipment, furniture, traffic, knowledge, evidence, progress, homework, news, luggage* **không** có *-s* và không dùng *a*. Dùng *a piece of advice, a lot of research, much information*. Sai thường gặp: ~~informations, researches, advices, equipments~~. *Research* trong đa số nghĩa không có số nhiều; *studies* hoặc *research studies* cho nghĩa "nhiều nghiên cứu".

### Hoà hợp chủ vị
- *There is a problem / There are many problems* (theo danh từ sau). Tránh ~~There have many~~.
- *People* luôn số nhiều: ~~people is~~.
- *The number of cars **is*** … / *A number of cars **are*** …
- *Each / every / either / neither + số ít*: *Each student has*.
- Cụm giới từ chen giữa không đổi chủ ngữ: *The cost of these projects **is** high.*
- *Police, staff, family, government* có thể số ít hoặc số nhiều tùy cách xem tập thể.

### Từ dễ nhầm
*rise* (nội động từ, không tân ngữ) và *raise* (ngoại động từ): *Prices rise. The government raised taxes.* *affect* (động từ) và *effect* (danh từ): *Pollution affects health; the effect is serious.* *lose* và *loose*; *fewer* (đếm được) và *less*; *economic* và *economical*; *its* và *it's*.

### Dấu phẩy
- Sau mệnh đề phụ đứng đầu câu: *Although it is expensive, many people buy it.*
- Trước liên từ nối hai mệnh đề độc lập: *…, but…*
- Quanh mệnh đề quan hệ không xác định.
- Không đặt phẩy giữa chủ ngữ và động từ: ~~Students who study hard, succeed~~.
- Không nối hai mệnh đề độc lập chỉ bằng dấu phẩy.

### Lỗi cố định cần tránh
~~In my opinion, I think~~ (chọn một). ~~Many people they~~ (thừa đại từ). ~~I am agree~~ (*I agree*). ~~More and more people is~~.

### Quy trình rà soát 3 phút
Sau khi viết, đọc lần lượt: (1) chủ ngữ và động từ có hoà hợp? (2) danh từ có cần -s hoặc mạo từ? (3) mỗi câu có động từ chính? (4) dấu phẩy sau mệnh đề mở đầu? Lập "danh sách lỗi riêng" của bạn và rà đúng các mục đó, vì mỗi người thường lặp lại cùng vài lỗi.
'''

[[questions]]
id = "ig-001"
module = "ig-tense-control"
type = "single"
difficulty = 1
tags = ["band:5.5"]
prompt = "The chart shows the number of visitors to a museum from 2001 to 2010. Which sentence is correct?"
options = ["The number of visitors rise from 20,000 to 35,000.", "The number of visitors rose from 20,000 to 35,000.", "The number of visitors has rose from 20,000 to 35,000.", "The number of visitors is rose from 20,000 to 35,000."]
answer = [1]
explanation = "Mốc 2001–2010 đã kết thúc nên dùng past simple *rose*. Các phương án khác sai: thiếu chia thì (*rise*), sai dạng V3 (*has rose*), hoặc thêm *is* với động từ không có bị động."

[[questions]]
id = "ig-002"
module = "ig-tense-control"
type = "single"
difficulty = 1
tags = ["band:5.5"]
prompt = "Choose the correct sentence: *Since 2015, the number of members ______ steadily.*"
options = ["rose", "has risen", "is rised", "had rise"]
answer = [1]
explanation = "*Since 2015* nối quá khứ với hiện tại nên dùng present perfect *has risen*. *Rose* chỉ đúng với mốc quá khứ đã kết thúc."

[[questions]]
