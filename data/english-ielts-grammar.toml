answer = [0]
explanation = "Số liệu 2030 là dự báo nên dùng *is projected to* (hoặc *will*). Past simple, present perfect với mốc tương lai đều sai nghĩa."

[[questions]]
id = "ig-005"
module = "ig-tense-control"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "A chart covers 1990–2000. Which paragraph keeps the tense consistent?"
options = ["The figure fell to 8% in 1995 and then rises to 11% by 2000.", "The figure fell to 8% in 1995 and then rose to 11% by 2000.", "The figure has fallen to 8% in 1995 and then rose to 11% by 2000.", "The figure falls to 8% in 1995 and then rose to 11% by 2000."]
answer = [1]
explanation = "Cả hai vế đều thuộc quá khứ nên cùng dùng past simple: *fell … rose*. Các phương án còn lại nhảy giữa quá khứ và hiện tại hoặc dùng present perfect với mốc xác định (*in 1995*)."

[[questions]]
