module = "ig-tense-control"
type = "multiple"
difficulty = 2
tags = ["band:6.5"]
prompt = "Select all sentences that use the present perfect or past perfect correctly."
options = ["The population has grown rapidly since 1990.", "The price has risen in 2012.", "Over the past decade, internet use has doubled.", "In 2008, unemployment has peaked at 9%.", "By 2000, the figure had already fallen to 12%."]
answer = [0, 2, 4]
explanation = "Câu 1, 3 có *since / over the past decade* nên present perfect hợp lý. Câu 5 dùng past perfect cho việc xảy ra trước mốc 2000. Câu 2 và 4 có mốc quá khứ xác định (*in 2012, in 2008*), phải dùng past simple."

[[questions]]
id = "ig-007"
module = "ig-tense-control"
type = "fill"
difficulty = 2
tags = ["band:6.5"]
prompt = "Complete with *since* or *for*: *The number of tourists has grown {{blank}} 2012, and it has been the largest market {{blank}} five years.*"
blanks = [["since"], ["for"]]
explanation = "*Since* đi với mốc bắt đầu (2012). *For* đi với khoảng thời gian (five years). Cả hai đều đi với present perfect."

[[questions]]
id = "ig-008"
module = "ig-tense-control"
type = "fill"
difficulty = 2
tags = ["band:6.5"]
prompt = "Speaking Part 2. Complete with the past perfect of *start*: *When I reached the stadium, the match {{blank}} already {{blank}}.*"
blanks = [["had"], ["started"]]
explanation = "Trận đấu bắt đầu trước lúc tôi đến, nên dùng past perfect *had + V3*: *had already started*."

[[questions]]
id = "ig-009"
module = "ig-tense-control"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "Cue card: a trip. Choose the best continuation: *Last summer I went to Hue with my cousin. We ______ at a small hotel and ______ the old citadel on the first day.*"
options = ["stayed / visited", "stay / visit", "have stayed / visited", "were stay / visiting"]
answer = [0]
