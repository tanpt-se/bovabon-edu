difficulty = 3
tags = ["band:7"]
prompt = "Which sentence is correct? *Before the new tax was introduced in 2015, car ownership ______ steadily for a decade.*"
options = ["had been rising", "has been rising", "was rise", "is rising"]
answer = [0]
explanation = "Việc tăng kéo dài và hoàn tất trước mốc quá khứ 2015 nên dùng past perfect continuous *had been rising*. *Has been rising* gắn với hiện tại."

[[questions]]
id = "ig-012"
module = "ig-tense-control"
