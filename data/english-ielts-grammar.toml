answer = [0]
explanation = "Overview tách dữ liệu quá khứ (*rose*) khỏi dự báo (*is expected to continue*) và nêu xu hướng chung. Các lựa chọn khác sai thì hoặc dùng sai dạng động từ."

[[questions]]
