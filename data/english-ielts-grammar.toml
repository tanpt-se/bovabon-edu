blanks = [["as"]]
explanation = "Cấu trúc bằng nhau: *as + adj + as*. Không dùng *than*."

[[questions]]
id = "ig-088"
module = "ig-comparison-data"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "In 2010 sales were 20 million. In 2020 they were 40 million. Which sentence is correct?"
options = ["Sales in 2020 were twice as high as in 2010.", "Sales in 2020 were twice higher than in 2010.", "Sales in 2020 were twice as higher as in 2010.", "Sales in 2020 were twice more high than in 2010."]
answer = [0]
explanation = "Gấp đôi: *twice as + adj + as*. Các dạng *twice higher than* là lỗi hay gặp của người Việt."

[[questions]]
id = "ig-089"
module = "ig-comparison-data"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "Choose the correct verb: *A number of students ______ absent yesterday.*"
