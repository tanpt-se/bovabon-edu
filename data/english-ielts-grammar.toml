min_keywords = 3
model_answer = "Difficulty concentrating is common among students. The increasing use of smartphones in classrooms is a major source of distraction."
explanation = "Checklist: (1) chủ ngữ là danh từ trừu tượng; (2) danh hoá không làm câu rối; (3) mạo từ, giới từ đúng; (4) động từ hoà hợp; (5) giữ nghĩa gốc, không thêm ý ngoài đề."

[[questions]]
