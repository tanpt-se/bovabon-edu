difficulty = 2
tags = ["band:6.5"]
prompt = "Task 1. Exports of coffee were 40 tonnes in 2000 and 55 tonnes in 2010. A forecast says they will reach 70 tonnes in 2030. Write two sentences that describe this with correct tenses."
