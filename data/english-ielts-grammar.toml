min_keywords = 2
model_answer = "Coffee exports rose from 40 tonnes in 2000 to 55 tonnes in 2010. They are projected to reach 70 tonnes by 2030."
explanation = "Checklist: (1) mốc 2000–2010 dùng past simple; (2) dự báo 2030 dùng *is projected to / will*; (3) có đủ số liệu và đúng giới từ *from… to*, *by 2030*; (4) không bình luận nguyên nhân không có trong dữ liệu."

[[questions]]
id = "ig-011"
