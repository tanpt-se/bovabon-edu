answer = [0]
explanation = "*A number of + danh từ số nhiều* làm chủ ngữ số nhiều, nên động từ là *were*. Khác với *The number of students was…*."

[[questions]]
id = "ig-090"
module = "ig-comparison-data"
type = "multiple"
difficulty = 2
tags = ["band:6.5"]
prompt = "Select all correct sentences."
options = ["Women made up three times as many students as men.", "There were less people in 2000 than in 2010.", "Car use rose by 15%, whereas cycling fell slightly.", "The number of cars is more than in 1990.", "The proportion of women was higher than that of men."]
answer = [0, 2, 4]
explanation = "Câu 2 phải dùng *fewer people*. Câu 4 phải dùng *higher/greater*: *the number* không đi với *more than* theo cách này."

[[questions]]
id = "ig-091"
module = "ig-comparison-data"
type = "fill"
difficulty = 2
tags = ["band:6.5"]
prompt = "Complete with prepositions: *Prices rose {{blank}} 12%, reaching a peak {{blank}} $50 in 2015.*"
blanks = [["by"], ["of", "at"]]
explanation = "*Rise by 12%* chỉ mức tăng; *a peak of / at $50* chỉ đỉnh điểm. Không nhầm *by* với *to*."

[[questions]]
id = "ig-092"
module = "ig-comparison-data"
type = "fill"
difficulty = 2
tags = ["band:6.5"]
prompt = "Complete with the correct word: *Twice as {{blank}} cars were sold in 2020 as in 2010.*"
blanks = [["many"]]
explanation = "*Cars* là danh từ đếm được nên dùng *as many as*. Dùng *much* cho danh từ không đếm được."

[[questions]]
id = "ig-093"
module = "ig-comparison-data"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "Which sentence describes a proportion best?"
options = ["Tea accounted for 40% of total exports.", "Tea accounts 40% to total exports.", "Tea account for 40% from exports.", "Tea was accounted 40% of exports."]
answer = [0]
explanation = "*Account for* (không có bị động) đi với tỉ lệ: *accounted for 40% of…*. Không dùng *accounts to* hoặc *from*."

[[questions]]
id = "ig-094"
module = "ig-comparison-data"
type = "essay"
difficulty = 2
tags = ["band:6.5"]
prompt = "Table: percentage of households with internet. 2000: urban 20%, rural 5%. 2020: urban 90%, rural 60%. Write two sentences comparing urban and rural households."
keywords = [["urban"], ["rural"], ["whereas", "while", "compared with", "compared to", "in contrast", "higher", "lower", "more than", "less than", "than"]]
min_keywords = 3
model_answer = "In 2000, 20% of urban households had internet access, compared with only 5% of rural households. By 2020, the figure for urban areas had risen to 90%, whereas rural areas reached 60%."
explanation = "Checklist: (1) so sánh cả hai nhóm, có mốc 2000 và 2020; (2) từ so sánh/đối chiếu đúng (*compared with, whereas*); (3) giới từ số liệu đúng (*to, from, of*); (4) thì quá khứ nhất quán; (5) không bình luận nguyên nhân ngoài dữ liệu."

[[questions]]
id = "ig-095"
module = "ig-comparison-data"
type = "single"
difficulty = 3
tags = ["band:7"]
prompt = "Out of 200 respondents, 50 chose cycling. Which expression is the most precise?"
options = ["Around a quarter of respondents chose cycling.", "The majority of respondents chose cycling.", "A small minority chose cycling.", "Nearly half of respondents chose cycling."]
answer = [0]
explanation = "50/200 = 25% = *a quarter*. *Majority, nearly half* quá lớn; *small minority* quá nhỏ."

[[questions]]
id = "ig-096"
module = "ig-comparison-data"
type = "single"
difficulty = 3
tags = ["band:7"]
prompt = "Which sentence makes a logical comparison?"
options = ["The proportion of women in engineering was far lower than that in medicine.", "The proportion of women in engineering was far lower than medicine.", "The proportion of women in engineering was far lower than in medicine's.", "The proportion of women in engineering was far more low than that in medicine."]
answer = [0]
explanation = "So sánh phải cùng loại: tỉ lệ với tỉ lệ. Dùng *that in medicine* để thay *the proportion … in medicine*."

[[questions]]
id = "ig-097"
module = "ig-comparison-data"
type = "multiple"
difficulty = 3
tags = ["band:7"]
prompt = "Select all correct sentences."
options = ["The number of cars has doubled since 2000.", "A number of cars was sold in 2020.", "The proportion of women is higher than that of men.", "Fewer people cycled in 2020 than in 2010.", "Less students applied in 2020."]
answer = [0, 2, 3]
explanation = "Câu 2: *a number of* + động từ số nhiều (*were*). Câu 5: *students* đếm được, phải dùng *fewer*."

[[questions]]
id = "ig-098"
module = "ig-comparison-data"
type = "essay"
difficulty = 3
tags = ["band:7"]
prompt = "Bar chart: Country A used renewable energy for 12% of its power in 2000 and 24% in 2020. Country B had 20% in 2000 and 22% in 2020. Write two sentences comparing them with a multiple (*doubled / twice as…*) and a contrast linker."
keywords = [["doubled", "twice as", "double"], ["whereas", "while", "by contrast", "in contrast", "compared with"], ["slight", "marginal"]]
min_keywords = 3
model_answer = "The share in Country A doubled from 12% to 24% between 2000 and 2020, whereas Country B saw only a slight rise from 20% to 22%."
explanation = "Checklist: (1) bội số đúng (*doubled / twice as high as*); (2) liên từ đối chiếu có dấu phẩy; (3) giới từ đúng (*from … to …*, *by*); (4) mô tả mức độ (*slight*); (5) giữ thì quá khứ."

[[questions]]
id = "ig-099"
module = "ig-modals-hedging"
type = "single"
difficulty = 1
tags = ["band:5.5"]
prompt = "Choose the correct sentence."
options = ["Governments should invest in public transport.", "Governments should to invest in public transport.", "Governments should invests in public transport.", "Governments should investing in public transport."]
answer = [0]
explanation = "Sau modal dùng động từ nguyên mẫu không *to* và không thêm *-s*."

[[questions]]
id = "ig-100"
module = "ig-modals-hedging"
type = "single"
difficulty = 1
tags = ["band:5.5"]
prompt = "Which sentence is a safer, more academic claim?"
options = ["Prices are likely to rise.", "Prices will always rise.", "Everyone knows prices rise.", "Prices never fall."]
answer = [0]
explanation = "*Is likely to* làm mềm mức độ chắc chắn. *Always, everyone, never* là khẳng định tuyệt đối và dễ sai."

[[questions]]
id = "ig-101"
module = "ig-modals-hedging"
type = "fill"
difficulty = 1
tags = ["band:5.5"]
prompt = "Complete with a modal of possibility: *This {{blank}} lead to unemployment.* (one word, not *will*)"
blanks = [["may", "might", "could"]]
explanation = "*May, might, could* diễn tả khả năng, giảm độ chắc chắn. Sau modal dùng động từ nguyên mẫu."

[[questions]]
id = "ig-102"
module = "ig-modals-hedging"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "Which sentence correctly means *it is not necessary*?"
options = ["You don't have to wear a uniform.", "You must not wear a uniform.", "You can't to wear a uniform.", "You haven't wear a uniform."]
answer = [0]
explanation = "*Don't have to* nghĩa là không bắt buộc. *Must not* nghĩa là bị cấm — hai ý khác nhau."

[[questions]]
id = "ig-103"
module = "ig-modals-hedging"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "Choose the best hedge: *Teenagers ______ prefer online learning.*"
options = ["tend to", "tends to", "are tend to", "tendency"]
answer = [0]
explanation = "*Tend to + V* diễn tả xu hướng chung, chủ ngữ số nhiều nên không có *-s*. *Be tend to* sai ngữ pháp."

[[questions]]
id = "ig-104"
module = "ig-modals-hedging"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "Which sentence uses the subjunctive pattern correctly?"
options = ["It is essential that schools teach financial skills.", "It is essential that schools to teach financial skills.", "It is essential that schools teaching financial skills.", "It is essential schools must to teach financial skills."]
answer = [0]
explanation = "Sau *It is essential that* dùng động từ nguyên mẫu (hoặc *should + V*). Không thêm *to* hay V-ing."

[[questions]]
id = "ig-105"
module = "ig-modals-hedging"
type = "multiple"
difficulty = 2
tags = ["band:6.5"]
prompt = "Select all sentences that are suitable hedging in academic writing."
options = ["This may lead to higher unemployment.", "Research suggests that sleep affects memory.", "All teenagers are addicted to phones.", "In most cases, online courses are cheaper.", "Nobody likes homework."]
answer = [0, 1, 3]
explanation = "Câu 3 và 5 là khẳng định tuyệt đối bằng *all, nobody*. Các câu còn lại dùng may, suggests, in most cases để làm mềm."

[[questions]]
id = "ig-106"
module = "ig-modals-hedging"
type = "fill"
difficulty = 2
tags = ["band:6.5"]
prompt = "Complete with the correct form: *It is vital that employers {{blank}} safe working conditions.* (provide)"
blanks = [["provide", "should provide"]]
explanation = "Sau *It is vital that*, dùng dạng nguyên mẫu (*provide*) hoặc *should provide*. Không thêm *-s*."

[[questions]]
id = "ig-107"
module = "ig-modals-hedging"
type = "fill"
difficulty = 2
tags = ["band:6.5"]
prompt = "Complete with a modal perfect: *The government {{blank}} acted earlier. (criticism of the past, should + have + V3: write the two missing words)*"
blanks = [["should have"]]
explanation = "*Should have + V3* phê bình việc đáng lẽ nên làm trong quá khứ. Chỗ trống chỉ gồm *should have*."

[[questions]]
id = "ig-108"
module = "ig-modals-hedging"
type = "essay"
difficulty = 2
tags = ["band:6.5"]
prompt = "Write two sentences about a possible effect of remote work. Use *may/might/could* in one sentence and *tend to / is likely to* in the other."
keywords = [["may", "might", "could"], ["tend to", "tends to", "is likely to", "are likely to"]]
min_keywords = 2
model_answer = "Remote work may reduce traffic in large cities. Employees tend to be more productive when they can control their schedules."
explanation = "Checklist: (1) modal + động từ nguyên mẫu; (2) mức độ chắc chắn phù hợp, không tuyệt đối; (3) không dùng hai dấu hiệu hedging chồng nhau; (4) ý rõ, có thể phát triển thêm; (5) không dùng ngôn ngữ cảm xúc."

[[questions]]
id = "ig-109"
module = "ig-modals-hedging"
type = "single"
difficulty = 3
tags = ["band:7"]
prompt = "Which sentence is hedged most appropriately for a Task 2 claim?"
options = ["Social media may contribute to a decline in face-to-face communication.", "Social media will definitely destroy face-to-face communication.", "Social media possibly maybe contribute to decline.", "Social media is the only cause of poor communication."]
answer = [0]
explanation = "*May contribute to* nêu khả năng và quan hệ nguyên nhân một phần. Hedging chồng chất (*possibly maybe*) hoặc *only cause* đều yếu."

[[questions]]
id = "ig-110"
module = "ig-modals-hedging"
type = "single"
difficulty = 3
tags = ["band:7"]
prompt = "Which modal perfect fits: *The data is incomplete, so the researchers ______ the problem.*"
options = ["may have underestimated", "may underestimated", "must to have underestimate", "should underestimated"]
answer = [0]
explanation = "Suy đoán về quá khứ: *may have + V3*. Các dạng còn lại sai cấu trúc."

[[questions]]
id = "ig-111"
module = "ig-modals-hedging"
type = "multiple"
difficulty = 3
tags = ["band:7"]
prompt = "Select all sentences that are correct."
options = ["Employers must provide safe conditions.", "Cities need to reduce emissions.", "We will can solve this problem soon.", "Citizens should be encouraged to recycle.", "Teachers should to give less homework."]
answer = [0, 1, 3]
explanation = "Câu 3 dùng hai modal liền nhau (*will can*); phải là *will be able to*. Câu 5 thừa *to* sau *should*."

[[questions]]
id = "ig-112"
module = "ig-modals-hedging"
type = "essay"
difficulty = 3
tags = ["band:7"]
prompt = "Write three sentences giving a recommendation about urban air pollution. Use one modal of obligation or advice, one *It is essential/vital/important that…* clause, and one hedge (*may / is likely to / tend to*)."
keywords = [["should", "must", "ought to", "need to", "have to"], ["it is essential that", "it is vital that", "it is important that", "it is crucial that", "it is essential", "it is vital", "it is important", "it is crucial"], ["may", "might", "could", "is likely to", "are likely to", "tend to", "tends to"]]
min_keywords = 3
model_answer = "Governments should limit private cars in city centres. It is essential that public transport be improved at the same time. This may encourage people to leave their cars at home."
explanation = "Checklist: (1) *should/must* + V nguyên mẫu; (2) sau *It is essential that* dùng dạng nguyên mẫu hoặc *should*; (3) hedging vừa đủ; (4) giữ lập trường rõ; (5) không khẳng định tuyệt đối."

[[questions]]
id = "ig-113"
module = "ig-accuracy-errors"
type = "single"
difficulty = 1
tags = ["band:5.5"]
prompt = "Which sentence is correct?"
options = ["Information are important.", "Informations are important.", "Information is important.", "An information is important."]
answer = [2]
explanation = "*Information* là danh từ không đếm được: không có *-s*, không có *a/an*, động từ số ít."

[[questions]]
id = "ig-114"
module = "ig-accuracy-errors"
type = "single"
difficulty = 1
tags = ["band:5.5"]
prompt = "Choose the correct verb: *There ______ many problems in big cities.*"
options = ["is", "have", "are", "has"]
answer = [2]
explanation = "*There are* + danh từ số nhiều. ~~There have many~~ là lỗi dịch *Có nhiều*."

[[questions]]
id = "ig-115"
module = "ig-accuracy-errors"
type = "fill"
difficulty = 1
tags = ["band:5.5"]
prompt = "Complete with the correct verb: *People {{blank}} worried about rising prices.* (present simple of be)"
blanks = [["are"]]
explanation = "*People* luôn là số nhiều nên dùng *are*, không dùng *is*."

[[questions]]
id = "ig-116"
module = "ig-accuracy-errors"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "Which sentence uses articles correctly?"
options = ["The education is important for everyone.", "Education is important for everyone.", "An education is important for everyone.", "The educations is important for everyone."]
answer = [1]
explanation = "Nói chung về một khái niệm dùng danh từ không đếm được không mạo từ: *Education is…*."

[[questions]]
id = "ig-117"
module = "ig-accuracy-errors"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "Choose the correct pair: *Prices ______ sharply, and the government ______ taxes.*"
options = ["rose / raised", "raised / rose", "rose / rose", "raised / raised"]
answer = [0]
explanation = "*Rise* (nội động từ, không tân ngữ), *raise* (ngoại động từ, có tân ngữ *taxes*). Quá khứ: *rose / raised*."

[[questions]]
id = "ig-118"
module = "ig-accuracy-errors"
type = "multiple"
difficulty = 2
tags = ["band:6.5"]
prompt = "Select all correct sentences."
options = ["Research shows that sleep matters.", "Many researches show that sleep matters.", "She gave me useful advice.", "The company bought new equipments.", "Traffic is heavy in the city centre."]
answer = [0, 2, 4]
explanation = "*Research, advice, equipment, traffic* là danh từ không đếm được, không thêm *-s*."

[[questions]]
id = "ig-119"
module = "ig-accuracy-errors"
type = "fill"
difficulty = 2
tags = ["band:6.5"]
prompt = "Complete with *has* or *have*: *The number of cars {{blank}} increased, but a number of drivers {{blank}} switched to bikes.*"
blanks = [["has"], ["have"]]
explanation = "*The number of + N* là số ít (*has*). *A number of + N* nghĩa là vài, số nhiều (*have*)."

[[questions]]
id = "ig-120"
module = "ig-accuracy-errors"
type = "fill"
difficulty = 2
tags = ["band:6.5"]
prompt = "Complete with *affect/effect* in the right form: *Pollution {{blank}} people's health, and the {{blank}} can be serious.*"
blanks = [["affects"], ["effect", "effects"]]
explanation = "*Affect* là động từ (*affects*), *effect* là danh từ. Chủ ngữ số ít nên *affects*."

[[questions]]
id = "ig-121"
module = "ig-accuracy-errors"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "Which sentence is punctuated correctly?"
options = ["Students who study hard, succeed.", "Students who study hard succeed.", "Students, who study hard succeed.", "Students who study hard; succeed."]
answer = [1]
explanation = "Không đặt dấu phẩy giữa chủ ngữ và động từ; mệnh đề quan hệ xác định cũng không có dấu phẩy."

[[questions]]
id = "ig-122"
module = "ig-accuracy-errors"
type = "essay"
difficulty = 2
tags = ["band:6.5"]
prompt = "Correct the errors and rewrite in one sentence: *In my opinion, I think informations about health is very important and people is not aware.*"
keywords = [["information about health is", "information on health is", "health information is", "information regarding health is"], ["people are"], ["are not aware", "aren't aware", "are unaware", "are not fully aware", "are often unaware"]]
min_keywords = 3
model_answer = "I think information about health is very important, and people are not aware of it."
explanation = "Checklist: (1) bỏ lặp *In my opinion, I think*; (2) *information* không có -s, động từ số ít; (3) *people are*; (4) câu hoàn chỉnh, có dấu phẩy đúng; (5) không thêm lỗi mới."

[[questions]]
id = "ig-123"
module = "ig-accuracy-errors"
type = "single"
difficulty = 3
tags = ["band:7"]
prompt = "Which sentence has no error?"
options = ["Despite the cost, an increasing number of families are choosing electric cars.", "Despite of the cost, an increasing number of families is choosing electric cars.", "Despite the cost, an increasing number of families choosing electric cars.", "Despite the cost, increasing number of families are choosing electric cars."]
answer = [0]
explanation = "*Despite* không đi với *of*; *an increasing number of* + số nhiều; cần động từ chia thì (*are choosing*) và mạo từ *an*."

[[questions]]
id = "ig-124"
module = "ig-accuracy-errors"
type = "single"
difficulty = 3
tags = ["band:7"]
prompt = "Which sentence uses commas correctly?"
options = ["The report, which was published in May, criticised the policy.", "The report which was published in May, criticised the policy.", "The report, which was published in May criticised, the policy.", "The report which was published, in May criticised the policy."]
answer = [0]
explanation = "Mệnh đề không xác định đặt giữa hai dấu phẩy; không đặt dấu phẩy giữa chủ ngữ và động từ chính."

[[questions]]
id = "ig-125"
module = "ig-accuracy-errors"
type = "multiple"
difficulty = 3
tags = ["band:7"]
prompt = "Select all sentences that contain an error."
options = ["In my opinion, I think cars should be banned.", "Many people they prefer living in cities.", "I agree that governments should act.", "I am agree with this statement.", "Unemployment has risen sharply."]
answer = [0, 1, 3]
explanation = "Câu 1 lặp ý. Câu 2 thừa đại từ *they*. Câu 4 thừa *am*: *I agree*. Câu 3 và 5 đúng."

[[questions]]
id = "ig-126"
module = "ig-accuracy-errors"
type = "essay"
difficulty = 3
tags = ["band:7"]
prompt = "Write three sentences about education. Use one uncountable noun (*information, advice, research, knowledge, evidence*), one *the number of / a number of* structure and one form of *rise* or *raise*, all correctly."
keywords = [["information", "advice", "research", "knowledge", "equipment", "evidence", "progress"], ["the number of", "a number of"], ["raise", "rise", "rose", "raised", "rising", "raises"]]
min_keywords = 3
model_answer = "Research suggests that early education improves later results. The number of students who study abroad has risen sharply. Governments should raise teachers' salaries to attract talent."
explanation = "Checklist: (1) danh từ không đếm được không *-s* và động từ số ít; (2) *the number of* + động từ số ít, *a number of* + số nhiều; (3) *rise* không tân ngữ, *raise* có tân ngữ; (4) chủ vị hoà hợp; (5) dấu câu đúng."
