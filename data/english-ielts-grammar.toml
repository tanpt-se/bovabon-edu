prompt = "Complete with a condition expression: *Cities will stay liveable {{blank}} public transport improves.*"
blanks = [["provided that", "provided", "as long as", "so long as"]]
explanation = "*Provided that* và *as long as* đều có nghĩa *miễn là*, đi với mệnh đề ở thì hiện tại cho tương lai."

[[questions]]
id = "ig-022"
module = "ig-complex-sentences"
type = "fill"
difficulty = 2
tags = ["band:6.5"]
prompt = "Complete the result clause: *The fee was {{blank}} high that few students applied.*"
blanks = [["so"]]
explanation = "Cấu trúc *so + adj + that* diễn tả kết quả. *Such* cần danh từ: *such a high fee that…*."

[[questions]]
id = "ig-023"
module = "ig-complex-sentences"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "Choose the best way to join two ideas: *Remote work saves commuting time. It can reduce social contact.*"
options = ["Although remote work saves commuting time, it can reduce social contact.", "Remote work saves commuting time, it can reduce social contact.", "Although remote work saves commuting time, but it can reduce social contact.", "Remote work saves commuting time although, it can reduce social contact."]
answer = [0]
explanation = "Mệnh đề *although* đứng đầu, theo sau dấu phẩy và mệnh đề chính. Phương án 2 là comma splice, phương án 3 thừa *but*, phương án 4 sai vị trí dấu phẩy."

[[questions]]
id = "ig-024"
module = "ig-complex-sentences"
type = "essay"
difficulty = 2
tags = ["band:6.5"]
prompt = "Write two sentences about the benefits of online study. Use *although* in one sentence and *so that* in the other."
keywords = [["although", "though", "even though"], ["so that"]]
min_keywords = 2
model_answer = "Although online courses can feel isolating, they give adults access to education. Universities should record lectures so that students can study at any time."
explanation = "Checklist: (1) dùng đúng *although* và không thêm *but*; (2) *so that* + mệnh đề có chủ ngữ và động từ; (3) mỗi câu có dấu câu đúng; (4) ý rõ, không lặp từ."

[[questions]]
id = "ig-025"
module = "ig-complex-sentences"
type = "single"
difficulty = 3
tags = ["band:7"]
prompt = "Which sentence is correct?"
options = ["Despite the funding was limited, the project succeeded.", "Despite the fact that funding was limited, the project succeeded.", "Despite that funding was limited, the project succeeded.", "In spite funding was limited, the project succeeded."]
answer = [1]
explanation = "Sau *despite* cần danh từ, V-ing hoặc *the fact that + mệnh đề*. *In spite* phải đi với *of*."

[[questions]]
id = "ig-026"
module = "ig-complex-sentences"
type = "single"
difficulty = 3
tags = ["band:7"]
prompt = "Which sentence uses the semicolon correctly?"
options = ["Some people prefer cities; others choose the countryside.", "Some people prefer cities; because others choose the countryside.", "Although some prefer cities; others choose the countryside.", "Some people prefer; cities others choose the countryside."]
answer = [0]
explanation = "Chấm phẩy nối hai mệnh đề độc lập có quan hệ chặt. Không dùng sau liên từ phụ thuộc (*although*) hay trước *because*."

[[questions]]
id = "ig-027"
module = "ig-complex-sentences"
type = "multiple"
difficulty = 3
tags = ["band:7"]
prompt = "Select all sentences that contain a fragment or a run-on error."
options = ["The government, which has introduced new taxes.", "Many people use social media, it saves time.", "Since housing is expensive, young people often live with their parents.", "While some argue that cars are essential, others believe cycling is better.", "Because the exam was difficult."]
answer = [0, 1, 4]
explanation = "Câu 1 thiếu động từ chính. Câu 2 là comma splice. Câu 5 chỉ là mệnh đề phụ. Câu 3 và 4 hoàn chỉnh."

[[questions]]
id = "ig-028"
module = "ig-complex-sentences"
type = "essay"
difficulty = 3
tags = ["band:7"]
prompt = "Write a short paragraph (three sentences) on whether students should wear uniforms. Use one contrast clause (*although / whereas / while*), one purpose clause (*so that / in order to*) and one reason clause (*because / since*)."
keywords = [["although", "whereas", "while", "though"], ["so that", "in order to"], ["because", "since", "as"]]
min_keywords = 3
model_answer = "Although uniforms limit self-expression, they can reduce pressure about fashion. Schools should keep them in order to create a sense of equality. This is important because students from poorer families feel less embarrassed."
explanation = "Checklist: (1) mỗi mệnh đề phụ đúng liên từ và không dùng *but* thừa; (2) dấu phẩy sau mệnh đề mở đầu; (3) có lập trường rõ; (4) câu không run-on hay fragment; (5) từ nối đa dạng."

[[questions]]
id = "ig-029"
module = "ig-relative-participle"
type = "single"
difficulty = 1
tags = ["band:5.5"]
prompt = "Choose the correct relative pronoun: *Teachers ______ use technology often engage students more.*"
options = ["who", "which", "whose", "where"]
answer = [0]
explanation = "*Who* thay cho người làm chủ ngữ. *Which* dùng cho vật, *whose* cho sở hữu, *where* cho nơi chốn."

[[questions]]
id = "ig-030"
module = "ig-relative-participle"
type = "single"
difficulty = 1
tags = ["band:5.5"]
prompt = "Which sentence is correct?"
options = ["The book which I bought it was expensive.", "The book which I bought was expensive.", "The book who I bought was expensive.", "The book what I bought was expensive."]
answer = [1]
explanation = "Đại từ quan hệ đã thay cho tân ngữ nên không thêm *it*. *Who* dùng cho người; *what* không dùng làm đại từ quan hệ ở đây."

[[questions]]
id = "ig-031"
module = "ig-relative-participle"
type = "fill"
difficulty = 1
tags = ["band:5.5"]
prompt = "Complete with a relative pronoun: *Students {{blank}} parents read to them often learn to read earlier.*"
blanks = [["whose"]]
explanation = "*Whose parents* thể hiện sở hữu (cha mẹ của các học sinh đó)."

[[questions]]
id = "ig-032"
module = "ig-relative-participle"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "Which sentence has a correct non-defining relative clause?"
options = ["Automation, which is spreading quickly, will change many jobs.", "Automation, that is spreading quickly, will change many jobs.", "Automation which is spreading quickly, will change many jobs.", "Automation, which is spreading quickly will change many jobs."]
answer = [0]
explanation = "Mệnh đề không xác định có dấu phẩy ở cả hai đầu và không dùng *that*."

[[questions]]
id = "ig-033"
module = "ig-relative-participle"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "Choose the participle clause that has the same meaning as *students who study abroad*."
options = ["students studying abroad", "students studied abroad", "students to study abroad", "students have studied abroad"]
answer = [0]
explanation = "Nghĩa chủ động rút gọn bằng V-ing: *students studying abroad*. V3 mang nghĩa bị động."

[[questions]]
id = "ig-034"
module = "ig-relative-participle"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "Rewrite with a participle: *A law that was passed in 2020 reduced plastic waste.*"
options = ["A law passing in 2020 reduced plastic waste.", "A law passed in 2020 reduced plastic waste.", "A law to pass in 2020 reduced plastic waste.", "A law has passed in 2020 reduced plastic waste."]
answer = [1]
explanation = "Mệnh đề bị động *that was passed* rút gọn thành V3: *passed*."

[[questions]]
id = "ig-035"
module = "ig-relative-participle"
type = "multiple"
difficulty = 2
tags = ["band:6.5"]
prompt = "Select all sentences in which the relative clause or participle clause is correct."
options = ["Cities where public transport is cheap have less traffic.", "The film, that I saw last week, was boring.", "Workers who lack digital skills may lose their jobs.", "Walking down the street, the rain started.", "Fuel prices have doubled, which has forced many to cycle."]
answer = [0, 2, 4]
explanation = "Câu 2 sai vì *that* không dùng sau dấu phẩy (non-defining). Câu 4 là dangling participle: người đi bộ không phải *the rain*. Câu 5 dùng *which* để bình luận cả mệnh đề trước."

[[questions]]
id = "ig-036"
module = "ig-relative-participle"
type = "fill"
difficulty = 2
tags = ["band:6.5"]
prompt = "Complete with the participle of *have* used for an earlier action: *{{blank}} analysed the data, the team wrote the report.* (two words)"
blanks = [["having"]]
explanation = "Cụm phân từ hoàn thành *Having analysed the data…* cho thấy hành động phân tích xảy ra trước. Chỗ trống chỉ cần *having*."

[[questions]]
id = "ig-037"
module = "ig-relative-participle"
type = "fill"
difficulty = 2
tags = ["band:6.5"]
prompt = "Complete with a participle: *The scheme, {{blank}} in 2018, reduced waste.* (begin)"
blanks = [["which began", "begun", "launched"]]
explanation = "Có thể dùng mệnh đề đầy đủ *which began* hoặc rút gọn bằng V3 *begun*. Tuy nhiên *which began* tự nhiên nhất."

[[questions]]
id = "ig-038"
module = "ig-relative-participle"
type = "essay"
difficulty = 2
tags = ["band:6.5"]
prompt = "Write two sentences about public transport. Use one defining relative clause and one non-defining relative clause (with commas)."
keywords = [["who", "that", "where", "whose"], ["which"]]
min_keywords = 2
model_answer = "Commuters who rely on buses want cheaper tickets. The metro, which opened last year, has reduced congestion."
explanation = "Checklist: (1) mệnh đề xác định không có dấu phẩy; (2) mệnh đề không xác định có dấu phẩy và dùng *which/who*, không dùng *that*; (3) không thêm đại từ thừa; (4) động từ hoà hợp chủ ngữ."

[[questions]]
id = "ig-039"
module = "ig-relative-participle"
type = "single"
difficulty = 3
tags = ["band:7"]
prompt = "Which sentence avoids a dangling participle?"
options = ["Having lost his funding, the researcher stopped the experiment.", "Having lost his funding, the experiment was stopped.", "Lost his funding, the project ended unexpectedly.", "Losing his funding, the experiment stopped the researcher."]
answer = [0]
explanation = "Chủ ngữ của cụm phân từ phải trùng chủ ngữ mệnh đề chính: *the researcher* mất tiền tài trợ và dừng thí nghiệm."

[[questions]]
id = "ig-040"
module = "ig-relative-participle"
type = "single"
difficulty = 3
tags = ["band:7"]
prompt = "Which is the best way to combine these ideas? *Governments should invest in public transport. Public transport reduces congestion and lowers emissions.*"
options = ["Governments should invest in public transport, which reduces congestion and lowers emissions.", "Governments should invest in public transport, that reduces congestion and lowers emissions.", "Governments should invest in public transport it reduces congestion and lowers emissions.", "Governments should invest in public transport, what reduces congestion."]
answer = [0]
explanation = "Mệnh đề quan hệ không xác định *which* bổ nghĩa cho *public transport* và đứng sau dấu phẩy. *That* không dùng sau dấu phẩy; phương án 3 là câu ghép sai (run-on); *what* không làm đại từ quan hệ."

[[questions]]
id = "ig-041"
module = "ig-relative-participle"
type = "multiple"
difficulty = 3
tags = ["band:7"]
prompt = "Select all sentences that are correctly written."
options = ["The experts whom we consulted disagreed.", "Students whom study abroad gain independence.", "The report, published last month, criticises the policy.", "Given more time, the committee could have decided differently.", "Study hard, the exam was passed by Lan."]
answer = [0, 2, 3]
explanation = "Câu 2 phải dùng *who* (chủ ngữ). Câu 5 là cụm phân từ/mệnh lệnh không đi với chủ ngữ phù hợp. Câu 1 dùng *whom* (tân ngữ), câu 3 và 4 đúng cấu trúc rút gọn."

[[questions]]
id = "ig-042"
module = "ig-relative-participle"
type = "essay"
difficulty = 3
tags = ["band:7"]
prompt = "Write two or three sentences on urban housing. Use one participle clause and one relative clause with *which* or *whose*."
keywords = [["having", "being", "given", "faced", "built", "located", "rising", "growing", "increasing", "living", "lacking"], ["which", "whose"]]
min_keywords = 2
model_answer = "Faced with rising rents, many young people live with their parents. Governments could build more flats, which would make housing more affordable."
explanation = "Checklist: (1) chủ ngữ của cụm phân từ trùng chủ ngữ mệnh đề chính; (2) *which/whose* dùng đúng với dấu phẩy khi không xác định; (3) mỗi câu có động từ chính; (4) không lạm dụng quá nhiều mệnh đề trong một câu."

[[questions]]
id = "ig-043"
module = "ig-conditionals-hypothesis"
type = "single"
difficulty = 1
tags = ["band:5.5"]
prompt = "Choose the correct form: *If it ______ tomorrow, we will cancel the trip.*"
options = ["rains", "will rain", "rained", "would rain"]
answer = [0]
explanation = "Điều kiện loại 1: *If + present simple, will + V*. Không dùng *will* trong mệnh đề *if*."

[[questions]]
id = "ig-044"
module = "ig-conditionals-hypothesis"
type = "single"
difficulty = 1
tags = ["band:5.5"]
prompt = "Choose the correct form: *If I ______ the mayor, I would ban cars in the city centre.*"
options = ["were", "am", "will be", "would be"]
answer = [0]
explanation = "Điều kiện loại 2 (giả định không có thật): *If + past simple (were), would + V*. Không dùng *would* ở mệnh đề *if*."

[[questions]]
id = "ig-045"
module = "ig-conditionals-hypothesis"
type = "fill"
difficulty = 1
tags = ["band:5.5"]
prompt = "Complete with the correct form of *melt*: *If you heat ice, it {{blank}}.*"
blanks = [["melts"]]
explanation = "Điều kiện loại 0 (quy luật): *If + present simple, present simple*. Chủ ngữ *it* nên động từ thêm *-s*."

[[questions]]
id = "ig-046"
module = "ig-conditionals-hypothesis"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "Which sentence correctly talks about an unreal past situation?"
options = ["If the city had invested earlier, congestion would have been lower.", "If the city would have invested earlier, congestion would have been lower.", "If the city has invested earlier, congestion would be lower.", "If the city had invest earlier, congestion will be lower."]
answer = [0]
explanation = "Điều kiện loại 3: *If + past perfect, would have + V3*. Không dùng *would have* trong mệnh đề *if*."

[[questions]]
id = "ig-047"
module = "ig-conditionals-hypothesis"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "Choose the correct form: *______ wages rise, many families will struggle to pay rent.*"
options = ["Unless", "If not", "Unless not", "Except"]
answer = [0]
explanation = "*Unless* = *if … not*, tự nó đã có nghĩa phủ định. Không dùng thêm *not*: ~~Unless wages don't rise~~."

[[questions]]
id = "ig-048"
module = "ig-conditionals-hypothesis"
type = "multiple"
difficulty = 2
tags = ["band:6.5"]
prompt = "Select all correct sentences."
options = ["If universities offer more online courses, access to education will improve.", "If it will rain, the event will be cancelled.", "If I had more money, I would travel abroad.", "If I would have more money, I would travel abroad.", "Remote work is fine as long as productivity stays high."]
answer = [0, 2, 4]
explanation = "Câu 2 và 4 sai vì dùng *will/would* trong mệnh đề *if*. Câu 5 đúng: *as long as* + hiện tại cho tương lai."

[[questions]]
id = "ig-049"
module = "ig-conditionals-hypothesis"
type = "fill"
difficulty = 2
tags = ["band:6.5"]
prompt = "Complete with a linking word: *Cities must act now; {{blank}}, pollution will worsen.*"
blanks = [["otherwise"]]
explanation = "*Otherwise* nghĩa là *nếu không thì*, đứng giữa hai mệnh đề độc lập sau dấu chấm phẩy và có dấu phẩy sau nó."

[[questions]]
id = "ig-050"
module = "ig-conditionals-hypothesis"
type = "fill"
difficulty = 2
tags = ["band:6.5"]
prompt = "Complete the mixed conditional: *If the government had taxed sugar earlier, obesity rates {{blank}} lower today.*"
blanks = [["would be", "would now be"]]
explanation = "Điều kiện hỗn hợp: giả định ở quá khứ (*had taxed*) có kết quả ở hiện tại (*would be … today*). Chỗ trống đủ là *would be*."

[[questions]]
id = "ig-051"
module = "ig-conditionals-hypothesis"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "Choose the best sentence to talk about an unlikely policy."
options = ["If governments were to ban private cars, cities would become cleaner.", "If governments will ban private cars, cities become cleaner.", "If governments banned private cars, cities will become cleaner.", "If governments are to ban private cars, cities would became cleaner."]
answer = [0]
explanation = "*If … were to + V* diễn tả giả định ít khả năng, kết hợp với *would + V*. Các phương án khác lẫn thì giữa mệnh đề *if* và mệnh đề chính."

[[questions]]
id = "ig-052"
module = "ig-conditionals-hypothesis"
type = "essay"
difficulty = 2
tags = ["band:6.5"]
prompt = "Write two sentences about reducing traffic. Use a first conditional in one sentence and a second conditional in the other."
keywords = [["if "], ["will ", "'ll "], ["would "]]
min_keywords = 3
model_answer = "If the city lowers bus fares, more people will take buses. If I were the mayor, I would build more cycle lanes."
explanation = "Checklist: (1) câu loại 1: *if + present, will + V*; (2) câu loại 2: *if + were/past, would + V*; (3) không dùng *will* hoặc *would* trong mệnh đề *if*; (4) dấu phẩy sau mệnh đề *if* đứng đầu; (5) ý hợp lý, có thể thực hiện."

[[questions]]
id = "ig-053"
module = "ig-conditionals-hypothesis"
type = "single"
difficulty = 3
tags = ["band:7"]
prompt = "Which sentence has the same meaning as *If the company had trained its staff, the mistake would not have happened*?"
options = ["Had the company trained its staff, the mistake would not have happened.", "Have the company trained its staff, the mistake would not happen.", "If had the company trained its staff, the mistake would not have happened.", "Would the company have trained its staff, the mistake had not happened."]
answer = [0]
explanation = "Đảo ngữ điều kiện loại 3: *Had + S + V3, S + would have + V3*, bỏ *if*. Các phương án khác sai trật tự hoặc sai thì."

[[questions]]
id = "ig-054"
module = "ig-conditionals-hypothesis"
type = "single"
difficulty = 3
tags = ["band:7"]
prompt = "Which sentence uses *unless* correctly?"
options = ["Unless people change their habits, emissions will keep rising.", "Unless people don't change their habits, emissions will keep rising.", "Unless people will change their habits, emissions will keep rising.", "Unless people changed their habits, emissions will keep rising."]
answer = [0]
explanation = "*Unless* + hiện tại, kết hợp *will* ở mệnh đề chính. Không thêm *not* và không dùng *will* sau *unless*."

[[questions]]
id = "ig-055"
module = "ig-conditionals-hypothesis"
type = "multiple"
difficulty = 3
tags = ["band:7"]
prompt = "Select all correct conditional sentences."
options = ["Were people better informed, they would choose healthier food.", "Should the number of drivers continue to grow, new roads will be needed.", "Had he studied harder, he would pass last year's exam.", "If the government had taxed sugar earlier, obesity rates would be lower today.", "Unless it doesn't rain, the festival will go ahead."]
answer = [0, 1, 3]
explanation = "Câu 3 phải là *would have passed* vì nói về quá khứ. Câu 5 thừa phủ định sau *unless*. Câu 1, 2 là đảo ngữ trang trọng đúng, câu 4 là điều kiện hỗn hợp đúng."

[[questions]]
id = "ig-056"
module = "ig-conditionals-hypothesis"
type = "essay"
difficulty = 3
tags = ["band:7"]
prompt = "Write three sentences about renewable energy. Use one inverted or mixed conditional (for example *Had governments… / Were… / If… had…, … would be…*), one *as long as / provided that* clause, and one *unless* clause."
keywords = [["had ", "were ", "should "], ["as long as", "provided"], ["unless"]]
min_keywords = 3
model_answer = "Had governments invested in renewable energy earlier, electricity would be cheaper today. Households will switch to solar panels as long as the initial cost is reduced. Unless action is taken soon, emissions will keep rising."
explanation = "Checklist: (1) đảo ngữ hoặc điều kiện hỗn hợp đúng thì; (2) *as long as/provided that* + hiện tại; (3) *unless* không đi với phủ định; (4) thể hiện quan điểm rõ; (5) không dùng quá nhiều mệnh đề điều kiện liên tiếp."

[[questions]]
id = "ig-057"
module = "ig-passive-impersonal"
type = "single"
difficulty = 1
tags = ["band:5.5"]
prompt = "Task 1 process. Choose the correct sentence: *The bricks ______ in a kiln.*"
options = ["are heated", "heated", "are heating", "is heat"]
answer = [0]
explanation = "Quy trình dùng bị động: *are + V3*. Gạch không tự nung, và chủ ngữ số nhiều nên dùng *are*."

[[questions]]
id = "ig-058"
module = "ig-passive-impersonal"
type = "single"
difficulty = 1
tags = ["band:5.5"]
prompt = "Which sentence is correct?"
options = ["The price was risen last year.", "The price rose last year.", "The price was rose last year.", "The price has been rose last year."]
answer = [1]
explanation = "*Rise* là nội động từ nên không có bị động: *The price rose*. Đây là lỗi hay gặp do tiếng Việt dùng *bị/được* tự do."

[[questions]]
id = "ig-059"
module = "ig-passive-impersonal"
type = "fill"
difficulty = 1
tags = ["band:5.5"]
prompt = "Complete with the passive of *collect*: *The data {{blank}} in 2019.*"
blanks = [["was collected"]]
explanation = "Dữ liệu *được thu thập* trong quá khứ, chủ ngữ số ít: *was collected*."

[[questions]]
id = "ig-060"
module = "ig-passive-impersonal"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "Choose the best sentence to describe a process step: *Once the grapes ______, they are transported to the winery.*"
options = ["have been picked", "are picking", "picked", "have picked"]
answer = [0]
explanation = "Bước trước hoàn tất được diễn tả bằng present perfect bị động: *have been picked*. Chủ ngữ *grapes* là vật nên cần bị động."

[[questions]]
id = "ig-061"
module = "ig-passive-impersonal"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "Which sentence correctly expresses a general belief?"
options = ["It is widely believed that technology improves learning.", "It is widely believed technology to improve learning.", "Technology is widely believed that improves learning.", "People are believed that technology improves learning."]
answer = [0]
explanation = "Cấu trúc khách quan: *It is believed that + clause*. Ba phương án còn lại sai ngữ pháp (*believe + to V* cần chủ ngữ phù hợp)."

[[questions]]
id = "ig-062"
module = "ig-passive-impersonal"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "Rewrite using *is said to*: *People say that young people spend too much time online.*"
options = ["Young people are said to spend too much time online.", "Young people are said spending too much time online.", "Young people say to spend too much time online.", "It is said young people to spend too much time online."]
answer = [0]
explanation = "Cấu trúc *S + is/are said to + V* chuyển nghĩa của *People say that…*."

[[questions]]
id = "ig-063"
module = "ig-passive-impersonal"
type = "multiple"
difficulty = 2
tags = ["band:6.5"]
prompt = "Select the verbs that cannot be used in the passive."
options = ["happen", "rise", "build", "occur", "produce"]
answer = [0, 1, 3]
explanation = "*Happen, rise, occur* là nội động từ nên không có bị động. *Build* và *produce* là ngoại động từ."

[[questions]]
id = "ig-064"
module = "ig-passive-impersonal"
type = "fill"
difficulty = 2
tags = ["band:6.5"]
prompt = "Complete with a passive modal form: *Waste {{blank}} recycled if households sort it properly.* (can)"
blanks = [["can be"]]
explanation = "Bị động với modal: *modal + be + V3*. Chỗ trống cần *can be*."

[[questions]]
id = "ig-065"
module = "ig-passive-impersonal"
type = "fill"
difficulty = 2
tags = ["band:6.5"]
prompt = "Complete with the passive future: *If the policy succeeds, more jobs {{blank}} created.*"
blanks = [["will be"]]
explanation = "Tương lai bị động: *will be + V3*."

[[questions]]
id = "ig-066"
module = "ig-passive-impersonal"
type = "essay"
difficulty = 2
tags = ["band:6.5"]
prompt = "Task 1 process. Write three sentences describing how paper is made: logs are collected, they are cut into chips, and the chips are mixed with water to make pulp. Use the passive and sequence words."
keywords = [["first", "next", "then", "after that", "finally", "once"], ["are cut", "are collected", "are mixed", "is made", "are chipped", "are transported"], ["pulp"]]
min_keywords = 3
model_answer = "First, logs are collected and transported to the mill. Next, they are cut into small chips. Then the chips are mixed with water to make pulp."
explanation = "Checklist: (1) bị động đúng *are + V3*; (2) từ chỉ trình tự đa dạng (*first, next, then*), không lặp mãi *then*; (3) không dùng ngôi thứ nhất hay ý kiến; (4) bao gồm đủ ba công đoạn; (5) từ vựng đúng (*pulp, chips*)."

[[questions]]
id = "ig-067"
module = "ig-passive-impersonal"
type = "single"
difficulty = 3
tags = ["band:7"]
prompt = "Which sentence correctly refers to a past event with an impersonal structure?"
options = ["The city is believed to have grown rapidly after 1990.", "The city is believed to grow rapidly after 1990 in the past.", "The city believed to have grown rapidly after 1990.", "It is believed the city to have grown rapidly after 1990."]
answer = [0]
explanation = "Sự việc ở quá khứ so với lúc *believe* dùng *to have + V3*. Phương án 3 thiếu *is*."

[[questions]]
id = "ig-068"
module = "ig-passive-impersonal"
type = "single"
difficulty = 3
tags = ["band:7"]
prompt = "In which sentence is the passive a poor choice because the agent is the main point?"
options = ["Action must be taken by governments to cut emissions.", "The bottles are washed and then filled.", "The data was analysed in 2020.", "The bridge has been repaired."]
answer = [0]
explanation = "Khi tác nhân (*governments*) là ý chính, câu chủ động tốt hơn: *Governments must act to cut emissions.* Ba câu còn lại hợp lý vì tác nhân không quan trọng."

[[questions]]
id = "ig-069"
module = "ig-passive-impersonal"
type = "multiple"
difficulty = 3
tags = ["band:7"]
prompt = "Select all sentences that are correct and natural in an academic essay."
options = ["The policy is expected to reduce traffic.", "The accident was happened last night.", "It has been argued that tuition fees should be abolished.", "Cars are producing in this factory.", "Reforms are said to have improved results."]
answer = [0, 2, 4]
explanation = "Câu 2 dùng bị động với nội động từ. Câu 4 thiếu V3 (*are produced*). Ba câu còn lại dùng cấu trúc khách quan đúng."

[[questions]]
id = "ig-070"
module = "ig-passive-impersonal"
type = "essay"
difficulty = 3
tags = ["band:7"]
prompt = "Write two or three sentences for a Task 2 paragraph about online shopping. Use one impersonal structure (*It is believed/argued/said that…* or *X is said/thought to…*) and one passive."
keywords = [["it is believed", "it is argued", "it is said", "it is thought", "it is widely", "is said to", "is believed to", "is thought to", "are said to", "are believed to", "are thought to", "is expected to", "are expected to", "has been argued"], ["is ", "are ", "was ", "were ", "been ", "be "]]
min_keywords = 2
model_answer = "It is widely believed that online shopping has damaged local businesses. However, many small shops have been saved by offering delivery services."
explanation = "Checklist: (1) cấu trúc khách quan dùng đúng; (2) bị động có V3 và trợ động từ *be*; (3) không dùng bị động với nội động từ; (4) lập luận có phát triển (*However…*); (5) không lạm dụng bị động ở mọi câu."

[[questions]]
id = "ig-071"
module = "ig-nominalisation-noun-phrases"
type = "single"
difficulty = 1
tags = ["band:5.5"]
prompt = "Choose the correct word: *The ______ to close the school was criticised.*"
options = ["decide", "decision", "decisive", "deciding"]
answer = [1]
explanation = "Sau *the* và trước *to-V*, cần danh từ: *decision*. Họ từ: decide (v), decision (n), decisive (adj)."

[[questions]]
id = "ig-072"
module = "ig-nominalisation-noun-phrases"
type = "single"
difficulty = 1
tags = ["band:5.5"]
prompt = "Choose the correct phrase: *______ of sleep is often ignored.*"
options = ["Important", "The importance", "Importantly", "Importance to"]
answer = [1]
explanation = "Chủ ngữ cần danh từ có mạo từ: *The importance of sleep*. Tính từ *important* và trạng từ *importantly* không làm chủ ngữ."

[[questions]]
id = "ig-073"
module = "ig-nominalisation-noun-phrases"
type = "fill"
difficulty = 1
tags = ["band:5.5"]
prompt = "Complete with a noun from *grow*: *Rapid {{blank}} strains housing in big cities.*"
blanks = [["growth"]]
explanation = "*Growth* là danh từ của *grow*. Sau tính từ *rapid* cần danh từ."

[[questions]]
id = "ig-074"
module = "ig-nominalisation-noun-phrases"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "Which version uses nominalisation to sound more academic? (Original: *Many people lose their jobs because machines can do more tasks.*)"
options = ["The increasing capability of machines is leading to job losses.", "Machines can do more so people lose jobs.", "Because machines do more tasks, many people lose their jobs.", "People lose jobs because of machines doing tasks."]
answer = [0]
explanation = "Phương án đầu biến *machines can do more* thành cụm danh từ *the increasing capability of machines* và *lose jobs* thành *job losses*. Các lựa chọn còn lại vẫn là mệnh đề thông thường."

[[questions]]
id = "ig-075"
module = "ig-nominalisation-noun-phrases"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "Choose the correct structure: *The more people use public transport, ______ cars are on the road.*"
options = ["the fewer", "fewer", "the less", "more fewer"]
answer = [0]
explanation = "Cấu trúc *The + so sánh hơn, the + so sánh hơn*. *Cars* đếm được nên dùng *fewer*."

[[questions]]
id = "ig-076"
module = "ig-nominalisation-noun-phrases"
type = "multiple"
difficulty = 2
tags = ["band:6.5"]
prompt = "Select all correct sentences."
options = ["Failure to plan leads to waste.", "The economic of the country grew rapidly.", "Dependence on foreign oil is risky.", "The ability to adapt is vital.", "An important of exercise is clear."]
answer = [0, 2, 3]
explanation = "Câu 2 cần *economy* thay cho *economic*. Câu 5 cần *The importance of exercise*. Ba câu còn lại dùng danh từ đúng."

[[questions]]
id = "ig-077"
module = "ig-nominalisation-noun-phrases"
type = "fill"
difficulty = 2
tags = ["band:6.5"]
prompt = "Complete the comparative pattern: *{{blank}} more people cycle, the healthier the city becomes.*"
blanks = [["the"]]
explanation = "Mẫu *The + comparative … , the + comparative …*; cần *The* ở vế đầu."

[[questions]]
id = "ig-078"
module = "ig-nominalisation-noun-phrases"
type = "fill"
difficulty = 2
tags = ["band:6.5"]
prompt = "Complete with a noun meaning *worry*: *Rising prices are a source of growing {{blank}}.*"
blanks = [["concern", "anxiety", "worry"]]
explanation = "Sau tính từ *growing* cần danh từ trừu tượng. *Concern, anxiety, worry* đều phù hợp."

[[questions]]
id = "ig-079"
module = "ig-nominalisation-noun-phrases"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "Choose the correct verb: *The rapid expansion of low-cost airlines in Asia ______ travel cheaper for many families.*"
options = ["has made", "have made", "make", "are making"]
answer = [0]
explanation = "Danh từ chính là *expansion* (số ít), không phải *airlines*. Do đó dùng *has made*."

[[questions]]
id = "ig-080"
module = "ig-nominalisation-noun-phrases"
type = "essay"
difficulty = 2
tags = ["band:6.5"]
prompt = "Rewrite in a more academic style, using a noun phrase as the subject: *People are worried because prices keep going up.*"
keywords = [["rising prices", "increasing prices", "growing prices", "the rise in prices", "the increase in prices", "price rises", "price increases", "an increase in prices", "a rise in prices", "the rising cost", "rising costs"], ["concern", "worry", "anxiety", "fear"]]
min_keywords = 2
model_answer = "Rising prices are a source of growing concern."
explanation = "Checklist: (1) chủ ngữ là cụm danh từ (*rising prices*); (2) danh từ trừu tượng (*concern*); (3) câu ngắn gọn, không thêm ý mới; (4) động từ hoà hợp với chủ ngữ số nhiều; (5) mạo từ và giới từ đúng."

[[questions]]
id = "ig-081"
module = "ig-nominalisation-noun-phrases"
type = "single"
difficulty = 3
tags = ["band:7"]
prompt = "Which sentence is the best academic version of *If we don't act, the problem will get worse*?"
options = ["Failure to act will exacerbate the problem.", "Failing to acting will exacerbate the problem.", "Failure of act will exacerbate the problem.", "The failure act will exacerbate the problem."]
answer = [0]
explanation = "*Failure to + V* là danh hoá thường gặp, kết hợp động từ mạnh *exacerbate*. Các phương án còn lại sai cấu trúc."

[[questions]]
id = "ig-082"
module = "ig-nominalisation-noun-phrases"
type = "single"
difficulty = 3
tags = ["band:7"]
prompt = "Which sentence avoids excessive *of*-chains and is clearest?"
options = ["The development of the growth of the economy of the country is important.", "Economic growth is important for the country.", "The importance of the growth of the economy is important.", "The growth of the economy of the country’s development is important."]
answer = [1]
explanation = "Danh hoá quá nhiều làm câu nặng nề. Câu đơn giản với tính từ *economic* cho kết quả rõ nhất."

[[questions]]
id = "ig-083"
module = "ig-nominalisation-noun-phrases"
type = "multiple"
difficulty = 3
tags = ["band:7"]
prompt = "Select all sentences with correct agreement and structure."
options = ["The rapid expansion of airlines has lowered fares.", "The rapid expansion of airlines have lowered fares.", "A growing reliance on screens is affecting children's sleep.", "The reliance on screens are affecting children's sleep.", "Difficulty concentrating is common among students."]
answer = [0, 2, 4]
explanation = "Chủ ngữ là danh từ chính (*expansion, reliance, difficulty*), không phải danh từ trong cụm giới từ."

[[questions]]
id = "ig-084"
module = "ig-nominalisation-noun-phrases"
type = "essay"
difficulty = 3
tags = ["band:7"]
prompt = "Nominalise the idea in two sentences: *Many students find it hard to concentrate because they use phones in class.* Use *difficulty / distraction* and a noun phrase about phone use."
