type = "fill"
difficulty = 1
tags = ["band:5.5"]
prompt = "The graph shows sales between 1995 and 2005. Complete with the past simple of *fall*: *Sales {{blank}} sharply in 2000.*"
blanks = [["fell"]]
explanation = "Mốc *in 2000* đã kết thúc nên dùng past simple. *Fall* là động từ bất quy tắc: *fell*."

[[questions]]
id = "ig-004"
module = "ig-tense-control"
type = "single"
difficulty = 2
tags = ["band:6.5"]
prompt = "A table gives data for 2010–2020 and a forecast for 2030. Which sentence about 2030 is best?"
