[[questions]]
id = "iv-030"
module = "iv-education"
type = "single"
difficulty = 3
tags = ["band:7"]
prompt = "Which sentence best supports the idea that exams may be harmful?"
options = ["Exams put pressure on students and may encourage memorisation rather than understanding.", "Exams are held in schools and universities.", "Students take exams every year, so they are normal.", "Exams sometimes use paper."]
answer = [0]
explanation = "Câu đầu nêu hệ quả cụ thể (*pressure*, *memorisation rather than understanding*) — là luận điểm phát triển được. Các câu khác chỉ mô tả, không bảo vệ quan điểm."

[[questions]]
id = "iv-031"
module = "iv-education"
type = "single"
difficulty = 3
tags = ["band:7"]
prompt = "\"Rote learning\" is best described as:"
options = ["learning by repeating facts without deep understanding", "learning through practical projects", "learning online at your own pace", "learning from experienced teachers"]
answer = [0]
explanation = "*rote learning* = học vẹt. Thường đi với phê bình: *rote learning fails to develop critical thinking.*"

[[questions]]
id = "iv-032"
module = "iv-education"
type = "multiple"
difficulty = 3
tags = ["band:7"]
prompt = "Chọn **mọi** câu dùng từ chính xác."
options = ["Lifelong learning enables adults to adapt to a changing job market.", "Teachers should equip students with the skills needed in the workplace.", "The lecturer plagiarised during the exam.", "Vocational training fits students who prefer practical careers."]
answer = [0, 1, 3]
explanation = "Câu 3 dùng sai nghĩa: *plagiarise* là đạo văn; gian lận trong thi là *cheat*. Giáo viên/giảng viên cũng không *plagiarise* \"during the exam\"."

[[questions]]
id = "iv-033"
module = "iv-education"
type = "fill"
difficulty = 3
tags = ["band:7"]
prompt = "Điền hai từ: Compared with traditional lectures, e-learning offers greater {{blank}}, although it lacks {{blank}} interaction. (cụm: *face-to-face*; chỗ đầu: tính linh hoạt)"
blanks = [["flexibility"], ["face-to-face", "facetoface"]]
explanation = "*flexibility* (danh từ) và *face-to-face interaction*. Lưu ý chuẩn hoá bỏ khoảng trắng; chỉ cần gõ đúng cụm có gạch nối."

[[questions]]
id = "iv-034"
module = "iv-education"
type = "essay"
difficulty = 3
tags = ["band:7"]
prompt = "Viết **2–3 câu tiếng Anh** nêu một lợi ích và một hạn chế của việc học trực tuyến. Dùng ít nhất hai cụm: *flexibility / face-to-face / lack / self-discipline / access to*."
keywords = [["flexibility", "flexible"], ["face-to-face"], ["lack", "lacks", "lacking"], ["self-discipline", "motivation"], ["access to"]]
min_keywords = 2
model_answer = "Online learning offers greater flexibility and access to high-quality courses. However, it lacks face-to-face interaction, so students need strong self-discipline."
explanation = "Một câu nêu lợi ích, một câu nêu hạn chế bằng *However*. Checklist: (1) có luận điểm rõ; (2) có collocation học thuật (*access to*, *lack*); (3) từ nối đúng vị trí; (4) không lỗi mạo từ/số nhiều."

