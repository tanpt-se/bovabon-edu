keywords = [["unemployment"], ["unemployed", "replace", "replaced", "replacing"], ["automation", "machines", "technology", "because", "due to", "as a result"]]
min_keywords = 2
model_answer = "Unemployment is rising because machines are replacing human workers. As a result, a growing number of people are unemployed."
