# ─────────────────────────────────────────────────────────────
[[modules]]
id = "iv-paraphrase-word-formation"
title = "Họ từ & paraphrase"
description = "Họ từ (economy / economic / economical), paraphrase bằng từ đồng nghĩa, đổi loại từ, đổi cấu trúc; nhận ra paraphrase trong Reading và Listening."
lesson = '''
**Lộ trình gợi ý:** xong CEFR B1 → học song song CEFR B2 + Ngữ pháp IELTS + Từ vựng IELTS → Reading/Listening → Writing → Speaking. Module này là nền: hầu hết đề IELTS không lặp lại từ của câu hỏi, mà *paraphrase* nó. Giám khảo Writing/Speaking cũng chấm Lexical Resource dựa trên khả năng diễn đạt cùng một ý bằng nhiều cách.

### Ba cách paraphrase chính
| Cách | Ví dụ gốc | Ví dụ paraphrase |
|---|---|---|
| Từ đồng nghĩa / cụm tương đương | *increase* | *rise, go up, climb, grow* |
| Đổi loại từ (word formation) | *Many people are unemployed.* | *Unemployment affects many people.* |
| Đổi cấu trúc câu | *Young people spend more time online than before.* | *Time spent online by young people has grown.* |

Đổi loại từ hay đổi cấu trúc thường an toàn hơn đổi từng từ, vì từ đồng nghĩa hiếm khi trùng 100% về sắc thái và collocation.

### Họ từ hay gặp
| Danh từ | Động từ | Tính từ | Trạng từ |
|---|---|---|---|
| economy / economics | economise | economic / economical | economically |
| employment / employer / employee | employ | employed / unemployed | — |
| decision | decide | decisive / decided | decisively |
| analysis | analyse | analytical | analytically |
| reliance | rely (on) | reliable / reliant | reliably |
| strength | strengthen | strong | strongly |
| beneficiary / benefit | benefit | beneficial | beneficially |

### Cặp dễ nhầm (cùng gốc, khác nghĩa)
- **economic** (thuộc kinh tế: *economic growth*) và **economical** (tiết kiệm: *an economical car*).
- **historic** (có ý nghĩa lịch sử: *a historic victory*) và **historical** (thuộc lịch sử: *historical records*).
- **sensible** (khôn ngoan) và **sensitive** (nhạy cảm).
- **affect** (động từ: ảnh hưởng) và **effect** (danh từ: tác động): *Noise affects sleep* / *Noise has a negative effect on sleep.*
- **rise** (tự tăng, không tân ngữ) và **raise** (làm tăng, có tân ngữ): *Prices rose* / *The government raised taxes.*

### Paraphrase trong Reading / Listening
Câu hỏi: *The number of students studying abroad has risen sharply.* Đoạn văn có thể ghi: *There has been a dramatic growth in overseas enrolment.* Cặp tương ứng: *number of students studying abroad* ↔ *overseas enrolment*; *risen sharply* ↔ *dramatic growth*. Hãy tìm **cụm ý nghĩa** chứ đừng săn từ giống hệt.

### Cụm hữu ích cho Task 2 / Speaking
- *a growing number of people* thay vì *many people*;
- *play a key role in* / *have a significant impact on*;
- *the majority of* / *a minority of*;
- *This is largely due to…*

### Lỗi hay gặp của người Việt
- Dùng sai loại từ: ~~The economic of Vietnam~~ → *The economy of Vietnam*; ~~He is success~~ → *He is successful*.
- Thay từ đồng nghĩa nhưng phá collocation: ~~make a research~~ → *conduct research*.
- Viết ~~informations, advices, researches~~ (không đếm được).
- Paraphrase "quá đà" làm đổi nghĩa: *some* ≠ *most*, *may* ≠ *will*.

### Mẹo học
Mỗi từ mới, ghi cả họ từ và một collocation. Khi đọc Reading, gạch chân cặp paraphrase giữa câu hỏi và đoạn văn rồi tự lập bảng riêng.
'''

# ─────────────────────────────────────────────────────────────
[[modules]]
id = "iv-education"
title = "Giáo dục"
description = "Học tập suốt đời, học trực tuyến, thi cử, trường học và đại học; collocation và cụm dùng cho Task 2 / Speaking."
lesson = '''
Chủ đề giáo dục xuất hiện rất thường xuyên ở Task 2 (đại học miễn phí, học online, thi cử, môn học bắt buộc) và Speaking Part 1/3. Nắm chắc nhóm từ dưới đây để tránh lặp *study* và *school*.

### Collocation cốt lõi
| Kiểu | Cụm từ | Ví dụ |
|---|---|---|
| V + N | pursue / gain / obtain a degree | *She obtained a degree in nursing.* |
| V + N | sit / take / pass / fail an exam | *Students sit an exam* (AmE: *take*). |
| V + N | acquire / develop / master a skill | *Pupils develop critical thinking skills.* |
| V + N | enrol on / in a course (AmE *enroll in*) | *He enrolled in an evening course.* |
| Adj + N | compulsory / mandatory education | *Education is compulsory until sixteen.* |
| Adj + N | higher / tertiary / vocational education | *Vocational training fits practical careers.* |
| Adj + N | academic performance / achievement | *Class size can affect academic performance.* |
| N + N | tuition fees, student debt, scholarship | *Tuition fees put pressure on families.* |

### Cặp dễ nhầm
- **teach** (dạy ai/môn gì) và **learn** (học); **lecturer** (giảng viên đại học) và **teacher** (giáo viên phổ thông).
- **graduate from** a university (ra trường) — không dùng ~~graduate university~~.
- **a course** (khoá học) và **a subject** (môn học); **tuition** (học phí/giảng dạy) và **fee** (phí nói chung).
- **cheat** (gian lận) và **plagiarise** (đạo văn).
- **homework** là không đếm được; nói *a piece of homework*, không *~~homeworks~~*.

### Cụm dùng được cho Task 2
- *Education should equip students with the skills needed in the workplace.*
- *Rote learning (học vẹt) fails to encourage independent thinking.*
- *Lifelong learning enables adults to adapt to a changing job market.*
- *Online courses offer flexibility, but they lack face-to-face interaction.*
- *Exams put pressure on students and may encourage memorisation rather than understanding.*

### Cụm dùng cho Speaking Part 3
- *I'd say the biggest advantage of studying online is flexibility.*
- *In my experience, group projects teach teamwork better than lectures.*

### Lỗi hay gặp
- ~~The education~~ khi nói chung chung → *Education is important.*
- ~~Study abroad is useful~~ → *Studying abroad is useful.*
- ~~make an exam~~ (tạo ra đề thi) khi muốn nói *làm bài thi*: dùng *take / sit an exam*.
- ~~learn knowledge~~ → *gain knowledge*.

### Mẹo
Với một đề giáo dục, chuẩn bị 3 nhóm ý: lợi ích cho người học, tác động xã hội/kinh tế, và hạn chế. Gắn mỗi nhóm với 2–3 collocation ở trên.
'''

# ─────────────────────────────────────────────────────────────
[[modules]]
id = "iv-work-economy"
title = "Việc làm & kinh tế"
description = "Việc làm, thất nghiệp, tự động hoá, thu nhập, tiêu dùng; collocation, cặp từ dễ nhầm và cụm cho Task 2."
lesson = '''
Chủ đề việc làm và kinh tế thường gắn với các đề như làm việc từ xa, tự động hoá cướp việc, chênh lệch thu nhập, tiêu dùng quá mức. Từ vựng dưới đây giúp bạn nói chính xác thay vì chỉ dùng *job* và *money*.

### Collocation cốt lõi
| Kiểu | Cụm từ | Ví dụ |
|---|---|---|
| V + N | create / generate jobs | *New factories create jobs.* |
| V + N | earn a living / a salary | *She earns a living as a freelancer.* |
| V + N | climb the career ladder | *Many graduates hope to climb the career ladder quickly.* |
| V + N | make a profit / a loss | *The firm made a profit of ten per cent.* |
| Adj + N | full-time / part-time / temporary job | *Temporary jobs offer little security.* |
| Adj + N | job security, work–life balance | *Work–life balance matters more to younger staff.* |
| Adj + N | the cost of living, disposable income | *A rising cost of living reduces disposable income.* |
| N + N | labour market, workforce, unemployment rate | *The unemployment rate fell to five per cent.* |

### Cặp dễ nhầm
- **salary** (lương tháng/năm, nhân viên văn phòng) và **wage** (lương theo giờ/tuần, lao động phổ thông); **income** là tổng thu nhập.
- **job** (đếm được) và **work** (không đếm được): *a job* nhưng *some work*, ~~a work~~.
- **earn** (kiếm được do làm việc) và **win**; **employ** (thuê) và **employee** (người được thuê).
- **economic** và **economical** (xem module họ từ); **customer** (mua tại cửa hàng) và **consumer** (người tiêu dùng nói chung).
- **lend** (cho vay/mượn) và **borrow** (vay/mượn); **rise** và **raise**.

### Cụm dùng được cho Task 2
- *Automation may replace repetitive jobs, yet it also creates demand for new skills.*
- *Remote work gives employees greater flexibility but can blur the boundary between work and home.*
- *The gap between the rich and the poor has widened in recent decades.*
- *Consumer spending drives economic growth.*
- *Governments should invest in retraining programmes for displaced workers.*

### Cụm dùng cho Speaking
- *I'd like to work in a field where I can use my creativity.*
- *Nowadays, people tend to switch careers more often than their parents did.*

### Lỗi hay gặp
- ~~I have many works~~ → *I have a lot of work.*
- ~~The unemployment people~~ → *unemployed people* (tính từ) / *the unemployed*.
- ~~increase the salary~~ khi nói tự tăng: *Salaries rise*; *Employers raise salaries*.
- ~~economy growth~~ → *economic growth*.

### Mẹo
Gắn mỗi vấn đề với **nguyên nhân – hệ quả – giải pháp** bằng collocation: *high unemployment → social unrest → job-creation schemes.*
'''

# ─────────────────────────────────────────────────────────────
[[modules]]
id = "iv-technology-media"
title = "Công nghệ & truyền thông"
description = "Công nghệ, AI, mạng xã hội, quyền riêng tư, tin giả; collocation và cụm cho Task 2 / Speaking."
lesson = '''
Công nghệ và truyền thông là chủ đề "ruột" của Task 2: trẻ em dùng điện thoại, mạng xã hội, AI trong lớp học, quyền riêng tư dữ liệu. Với người học IT, từ vựng kỹ thuật dễ, nhưng collocation học thuật mới là chỗ mất điểm.

### Collocation cốt lõi
| Kiểu | Cụm từ | Ví dụ |
|---|---|---|
| V + N | rely on / depend on technology | *Many students rely on search engines.* |
| V + N | raise / spread awareness | *Campaigns raise awareness of online scams.* |
| V + N | spread misinformation | *Fake accounts spread misinformation quickly.* |
| V + N | protect / invade privacy | *Some apps invade users' privacy.* |
| Adj + N | cutting-edge / state-of-the-art technology | *Hospitals use cutting-edge technology.* |
| Adj + N | digital literacy, screen time | *Parents limit children's screen time.* |
| Adj + N | online harassment, data breach | *A data breach exposed millions of records.* |
| N + N | social media platform, news outlet, search engine | *News outlets compete for clicks.* |

### Cặp dễ nhầm
- **invent** (phát minh cái chưa từng có) và **discover** (tìm ra cái đã tồn tại); **innovation** (đổi mới) và **invention**.
- **download** (tải xuống) và **upload** (tải lên); **online** (tính từ/trạng từ, không cần *the*).
- **fake news** (không đếm được) và **a hoax** (một trò lừa); **information** (không đếm được).
- **device** (thiết bị, danh từ) và **devise** (nghĩ ra, động từ).
- **addicted to** + N/V-ing (nghiện) — *to* là giới từ.

### Cụm dùng được cho Task 2
- *Social media has transformed the way people communicate, for better and for worse.*
- *The rise of artificial intelligence raises ethical concerns about bias and accountability.*
- *Governments should regulate how companies collect and store personal data.*
- *People tend to trust headlines without checking their sources.*
- *Technology can bridge the gap between urban and rural schools.*

### Cụm dùng cho Speaking
- *I spend quite a lot of time on my phone, mostly for messaging and watching videos.*
- *On the plus side… / On the downside…*

### Lỗi hay gặp
- ~~informations~~, ~~softwares~~ → *information*, *software* (không đếm được).
- ~~The technology is developing~~ khi nói chung → *Technology is developing rapidly.*
- ~~use the social media~~ → *use social media*.
- ~~depend of~~ → *depend on*.

### Mẹo
Học luôn các động từ chỉ **tác động**: *transform, revolutionise, undermine, enhance, facilitate, hinder* — dùng được cho mọi đề công nghệ.
'''

# ─────────────────────────────────────────────────────────────
[[modules]]
id = "iv-environment-energy"
title = "Môi trường & năng lượng"
description = "Biến đổi khí hậu, năng lượng tái tạo, rác thải, đa dạng sinh học; collocation và cụm cho Task 2 / Speaking."
lesson = '''
Môi trường là chủ đề kinh điển: biến đổi khí hậu, ô nhiễm, nhựa dùng một lần, năng lượng sạch, bảo tồn động vật hoang dã. Đề thường hỏi *ai chịu trách nhiệm* (cá nhân hay chính phủ) và *giải pháp nào hiệu quả*.

### Collocation cốt lõi
| Kiểu | Cụm từ | Ví dụ |
|---|---|---|
| V + N | tackle / combat climate change | *Countries must combat climate change together.* |
| V + N | reduce / cut carbon emissions | *Taxes can cut carbon emissions.* |
| V + N | protect / preserve biodiversity | *Reserves preserve biodiversity.* |
| V + N | dispose of waste | *Factories must dispose of waste safely.* |
| Adj + N | renewable energy / fossil fuels | *Solar power is a renewable energy source.* |
| Adj + N | single-use plastic, greenhouse gas | *Single-use plastic pollutes oceans.* |
| Adj + N | endangered species, natural habitat | *Deforestation destroys natural habitats.* |
| N + N | global warming, carbon footprint, recycling scheme | *Flying increases your carbon footprint.* |

### Cặp dễ nhầm
- **weather** (thời tiết hằng ngày) và **climate** (khí hậu dài hạn); **climate change** (không phải ~~climate changing~~).
- **environment** (môi trường tự nhiên, thường có *the*) và **surroundings** (xung quanh).
- **waste** (rác thải/lãng phí, không đếm được) và **rubbish**/**litter**; **pollute** (động từ) và **pollution** (danh từ, không đếm được).
- **endangered** (có nguy cơ tuyệt chủng) và **extinct** (đã tuyệt chủng).
- **lose** và **loose**; **affect** và **effect** (*effects on the environment*).

### Cụm dùng được cho Task 2
- *Individuals should reduce their carbon footprint, but real change requires government action.*
- *Switching to renewable energy is essential to curb greenhouse gas emissions.*
- *Heavy fines would deter companies from polluting rivers.*
- *Recycling schemes are only effective if people sort waste correctly.*
- *If current trends continue, many species will face extinction.*

### Cụm dùng cho Speaking
- *Where I live, air pollution is a serious problem, especially during rush hour.*
- *I try to be eco-friendly by bringing my own bag.*

### Lỗi hay gặp
- ~~the global warming~~ → *global warming* (không mạo từ).
- ~~pollutions~~ → *pollution* thường không đếm được (hoặc *types of pollution*).
- ~~protect from the nature~~ → *protect nature*; ~~do harm to environment~~ → *harm the environment*.
- ~~the fossil fuel~~ → *fossil fuels* (số nhiều).

### Mẹo
Cặp nguyên nhân – hậu quả trong chủ đề này khá cố định: *deforestation → loss of habitat → declining biodiversity*. Học theo chuỗi để viết đoạn thân bài nhanh.
'''

# ─────────────────────────────────────────────────────────────
[[modules]]
id = "iv-health-lifestyle"
title = "Sức khoẻ & lối sống"
description = "Sức khoẻ, chế độ ăn, thể thao, y tế công cộng, già hoá dân số; collocation và cụm cho Task 2 / Speaking."
lesson = '''
Các đề thường gặp: béo phì ở trẻ em, thức ăn nhanh, người cao tuổi, chi phí y tế, vận động. Hãy dùng từ chính xác như *obesity, sedentary lifestyle, life expectancy* thay vì *fat, lazy, old*.

### Collocation cốt lõi
| Kiểu | Cụm từ | Ví dụ |
|---|---|---|
| V + N | maintain / adopt a healthy lifestyle | *Adopting a healthy lifestyle lowers risk.* |
| V + N | suffer from / develop a disease | *Many adults suffer from stress.* |
| V + N | take regular exercise | *Take regular exercise to stay fit.* |
| V + N | tackle obesity | *Schools can help tackle obesity.* |
| Adj + N | balanced diet, sedentary lifestyle | *A sedentary lifestyle harms the heart.* |
| Adj + N | processed food, life expectancy | *Life expectancy has risen worldwide.* |
| Adj + N | public health, mental health | *Public health campaigns reduce smoking.* |
| N + N | health care system, ageing population | *An ageing population strains health care.* |

### Cặp dễ nhầm
- **healthy** (khoẻ mạnh/lành mạnh) và **healthful** (có lợi cho sức khoẻ, ít gặp); **health** (danh từ).
- **sick** (ốm, nói chung) / **ill** (ốm, vị ngữ) / **disease** (bệnh cụ thể); **a sick person** nhưng *she is ill*.
- **diet** (chế độ ăn) và **go on a diet** (ăn kiêng); **nutrition** (dinh dưỡng).
- **cure** (chữa khỏi) và **treat** (điều trị); **prevent** (phòng ngừa).
- **elderly** (người cao tuổi, lịch sự) — dùng *the elderly*, không dùng ~~elders~~ nghĩa này.

### Cụm dùng được cho Task 2
- *Governments should encourage people to take regular exercise by building more sports facilities.*
- *Fast food is high in fat and sugar, which contributes to obesity.*
- *An ageing population puts pressure on pension systems and health care.*
- *Prevention is better than cure, so public health campaigns deserve more funding.*
- *Mental health problems are often overlooked.*

### Cụm dùng cho Speaking
- *I try to eat a balanced diet, although I do sometimes grab fast food.*
- *I'm not much of a gym person, but I enjoy cycling.*

### Lỗi hay gặp
- ~~do sport~~ khi nói chung → *play sport(s)* / *do exercise* / *take exercise*.
- ~~The health of people is~~ nhưng cũng cần *people's health*.
- ~~advices~~, ~~medicines for health~~ → *advice* (không đếm được).
- ~~suffer a disease~~ → *suffer from a disease*.

### Mẹo
Với đề so sánh "phòng bệnh hay chữa bệnh", chuẩn bị cặp *prevention* ↔ *treatment* và một ví dụ chi phí (*cost the state less in the long term*).
'''

# ─────────────────────────────────────────────────────────────
[[modules]]
id = "iv-society-urban"
title = "Xã hội & đô thị"
description = "Đô thị hoá, nhà ở, giao thông, tội phạm và pháp luật; collocation và cụm cho Task 2 / Speaking."
lesson = '''
Đô thị, nhà ở, giao thông công cộng và tội phạm là nhóm đề xã hội quen thuộc. Bạn cần từ vựng để mô tả *vấn đề* (congestion, overcrowding) và *giải pháp chính sách* (invest in, impose, enforce).

### Collocation cốt lõi
| Kiểu | Cụm từ | Ví dụ |
|---|---|---|
| V + N | ease / reduce traffic congestion | *Metro lines ease traffic congestion.* |
| V + N | commit a crime | *Young offenders commit minor crimes.* |
| V + N | impose a penalty / a fine | *Courts impose heavy fines.* |
| V + N | enforce a law | *Police enforce the law.* |
| Adj + N | affordable housing, public transport | *Affordable housing is scarce.* |
| Adj + N | rural-to-urban migration, urban sprawl | *Urban sprawl swallows farmland.* |
| Adj + N | juvenile delinquency, community service | *Community service can replace prison.* |
| N + N | crime rate, living standards, city centre | *The crime rate has fallen.* |

### Cặp dễ nhầm
- **crime** (tội phạm nói chung / một loại tội) và **criminal** (kẻ phạm tội, tính từ); **a crime** nhưng *crime is rising*.
- **steal** (lấy cắp *vật*) và **rob** (cướp *người/nơi*): *steal a phone*, *rob a bank*.
- **the police** luôn số nhiều: *The police are…*
- **rent** (thuê/cho thuê) và **lease**; **tenant** và **landlord**.
- **commute** (đi lại hằng ngày) và **travel**; **traffic** (không đếm được).

### Cụm dùng được cho Task 2
- *Rapid urbanisation puts enormous pressure on housing and public services.*
- *Investing in public transport is more effective than building more roads.*
- *Stricter punishments may deter crime, but addressing poverty tackles its root causes.*
- *Many young people move to cities in search of better job prospects.*
- *Community policing builds trust between residents and the authorities.*

### Cụm dùng cho Speaking
- *My hometown has changed a lot; it's become much busier and more crowded.*
- *The main drawback of living in a big city is the cost of housing.*

### Lỗi hay gặp
- ~~There are many traffics~~ → *There is heavy traffic.*
- ~~The police is~~ → *The police are*.
- ~~in the city centre there have~~ → *there are*.
- ~~make a crime~~ → *commit a crime*.

### Mẹo
Nhớ hai động từ chính sách: **impose** (áp đặt hình phạt/thuế) và **introduce** (đưa ra luật mới). Thử viết 2 câu giải pháp cho mỗi vấn đề xã hội.
'''

# ─────────────────────────────────────────────────────────────
[[modules]]
id = "iv-globalisation-culture"
title = "Toàn cầu hoá & văn hoá"
description = "Toàn cầu hoá, du lịch, văn hoá, ngôn ngữ, di cư; collocation và cụm cho Task 2 / Speaking."
lesson = '''
Chủ đề này xoay quanh việc mất bản sắc văn hoá, du lịch đại trà, ngôn ngữ toàn cầu và di cư. Điểm cộng đến từ việc dùng cặp từ trái nghĩa chính xác (*preserve* ↔ *erode*, *immigrant* ↔ *emigrant*).

### Collocation cốt lõi
| Kiểu | Cụm từ | Ví dụ |
|---|---|---|
| V + N | preserve / erode cultural identity | *Festivals preserve cultural identity.* |
| V + N | promote / boost tourism | *Heritage sites boost tourism.* |
| V + N | broaden / widen one's horizons | *Travel broadens your horizons.* |
| V + N | integrate into society | *Newcomers integrate into society faster with language support.* |
| Adj + N | cultural heritage, traditional customs | *Traditional customs are fading.* |
| Adj + N | mass tourism, cultural diversity | *Mass tourism damages fragile sites.* |
| Adj + N | foreign investment, global market | *Foreign investment creates jobs.* |
| N + N | language barrier, brain drain, culture shock | *Culture shock is common among new students.* |

### Cặp dễ nhầm
- **immigrant** (người nhập cư, đến) / **emigrant** (người xuất cư, đi) / **migrant** (chung chung); **immigrate to** / **emigrate from**.
- **foreigner** (có thể nghe hơi xa cách) và **expatriate / expat** (người sống xa quê); **tourist** (khách du lịch) và **traveller**.
- **custom** (phong tục) và **habit** (thói quen cá nhân); **culture** (văn hoá) và **civilisation** (nền văn minh).
- **globalisation** (toàn cầu hoá) và **globalised**; **native language** (tiếng mẹ đẻ) / **mother tongue**.
- **trip** (chuyến ngắn) / **journey** (hành trình) / **travel** (không đếm được).

### Cụm dùng được cho Task 2
- *Globalisation has made goods cheaper, yet it has also threatened local industries.*
- *Younger generations are drifting away from traditional customs.*
- *English acts as a lingua franca in international business.*
- *Countries should protect their cultural heritage while remaining open to outside influences.*
- *Migration can fill labour shortages but may strain public services.*

### Cụm dùng cho Speaking
- *If I could visit anywhere, I'd love to experience a completely different culture.*
- *I'd say my country is quite proud of its traditions.*

### Lỗi hay gặp
- ~~travel abroad is~~ → *travelling abroad is*.
- ~~informations about the culture~~ → *information*.
- ~~immigrate from~~ nghĩa nhập cư: *immigrate to*; *emigrate from*.
- ~~the tourists number~~ → *the number of tourists*.

### Mẹo
Mỗi đề văn hoá thường có hai phía: **lợi ích kinh tế** (tourism revenue) và **cái giá văn hoá** (loss of identity). Chuẩn bị sẵn 2 câu cho mỗi phía.
'''

# ─────────────────────────────────────────────────────────────
[[modules]]
id = "iv-government-science"
title = "Chính sách công & khoa học"
description = "Chính sách công, thuế, ngân sách, nghiên cứu khoa học, khám phá không gian; collocation và cụm cho Task 2."
lesson = '''
Nhóm đề "ai nên trả tiền" (chính phủ hay cá nhân), thuế, tài trợ nghiên cứu, thăm dò vũ trụ. Từ vựng ở đây tương đối trang trọng — vừa đủ để nâng Lexical Resource lên band 6.5–7.

### Collocation cốt lõi
| Kiểu | Cụm từ | Ví dụ |
|---|---|---|
| V + N | allocate / spend funding / a budget | *The state allocates funding to schools.* |
| V + N | levy / impose / raise taxes | *Governments levy taxes on tobacco.* |
| V + N | implement a policy / a scheme | *The city implemented a recycling scheme.* |
| V + N | conduct / carry out research | *Scientists conduct research.* |
| Adj + N | public spending, government subsidy | *A subsidy lowers the cost of solar panels.* |
| Adj + N | scientific breakthrough, ethical issues | *The breakthrough raised ethical issues.* |
| Adj + N | long-term benefits, short-term gains | *Research brings long-term benefits.* |
| N + N | tax revenue, research funding, space exploration | *Tax revenue pays for hospitals.* |

### Cặp dễ nhầm
- **research** (không đếm được) và **study / experiment** (đếm được): *a study*, ~~a research~~.
- **invent / discover / explore**; **experiment** (thí nghiệm) và **experience** (kinh nghiệm).
- **tax** (thuế bắt buộc) và **fee/fine** (phí/tiền phạt); **budget** (ngân sách) và **funds**.
- **law** (luật nói chung) và **regulation** (quy định cụ thể); **government** (chính phủ) và **authorities**.
- **theory** (lý thuyết) và **hypothesis** (giả thuyết); **evidence** (không đếm được).

### Cụm dùng được cho Task 2
- *Public money should be spent on basic needs such as health care before space exploration.*
- *Taxing sugary drinks could discourage unhealthy consumption.*
- *Scientific research often takes decades to produce practical benefits.*
- *Governments should offer subsidies to encourage private companies to invest in clean technology.*
- *Critics argue that space programmes divert resources from urgent problems on Earth.*

### Cụm dùng cho Speaking
- *I think the government should invest more in public libraries.*
- *To be honest, I'm not sure it's worth spending that much on space missions.*

### Lỗi hay gặp
- ~~do a research~~ → *conduct research* / *do some research*.
- ~~The government should to~~ → *should + V nguyên mẫu*.
- ~~spend for education~~ → *spend money on education*.
- ~~pay the tax to the government~~ chấp nhận được, nhưng thường nói *pay taxes*.

### Mẹo
Với đề "chính phủ hay cá nhân", chuẩn bị khung: *responsibility lies with… / it is the government's role to… / individuals also have a duty to…*
'''

# ─────────────────────────────────────────────────────────────
[[modules]]
id = "iv-academic-linking"
title = "Từ nối & từ học thuật"
description = "Từ nối học thuật theo chức năng (bổ sung, đối lập, nhân quả, ví dụ, kết luận) và từ vựng học thuật chung: analyse, significant, factor, ..."
lesson = '''
Từ nối giúp đoạn văn mạch lạc (Coherence & Cohesion), nhưng dùng sai hoặc dùng quá nhiều thì bị chấm thấp. Hãy chọn từ nối theo **chức năng** và để ý **vị trí, dấu câu** đi kèm.

### Từ nối theo chức năng
| Chức năng | Từ / cụm | Lưu ý ngữ pháp | Ví dụ |
|---|---|---|---|
| Bổ sung | in addition, moreover, furthermore | đầu câu, theo sau là dấu phẩy | *In addition, rents are rising.* |
| Đối lập | however, nevertheless, on the other hand | đầu câu, dấu phẩy | *However, costs are high.* |
| Nhượng bộ | although, while, even though | đi với mệnh đề, **không** thêm *but* | *Although it is cheap, it is unsafe.* |
| Nhân quả | therefore, as a result, consequently | đầu câu, dấu phẩy | *As a result, prices fell.* |
| Nguyên nhân | because, since, due to, owing to | *due to / owing to* + N | *Owing to the storm, flights stopped.* |
| Ví dụ | for instance, for example, such as | *such as* + N, không dùng đầu câu | *Cities such as Hanoi are crowded.* |
| Kết luận | in conclusion, to sum up, overall | đầu đoạn kết | *Overall, the benefits outweigh the costs.* |

### Từ vựng học thuật chung
| Từ | Nghĩa / dùng | Ví dụ |
|---|---|---|
| analyse (BrE) | phân tích | *Researchers analyse the data.* |
| significant | đáng kể | *a significant increase* |
| factor | yếu tố | *a key factor in success* |
| contribute to | góp phần | *Diet contributes to health.* |
| outweigh | vượt trội hơn | *Benefits outweigh drawbacks.* |
| consequence | hậu quả | *serious consequences* |
| undermine | làm suy yếu | *Fake news undermines trust.* |
| demonstrate / indicate | cho thấy | *The data indicate a decline.* |

### Cặp dễ nhầm
- **although / though / despite / in spite of**: *Although it rained* (mệnh đề) vs *Despite the rain* (danh từ).
- **however** (đầu câu mới, dấu phẩy) vs **but** (nối hai mệnh đề, không dấu phẩy trước *however*).
- **whereas / while** chỉ sự đối lập giữa hai vế; **in contrast** đầu câu.
- **lead to** (dẫn đến) vs **result from** (do bởi, chiều ngược lại).

### Lỗi hay gặp
- ~~Although it is expensive, but people buy it~~ → bỏ *but*.
- ~~Despite of~~ → *despite* / *in spite of*.
- ~~Firstly, Secondly, Thirdly~~ lặp máy móc trong mọi đoạn.
- ~~For example, such as~~ đứng cạnh nhau.
- Dấu phẩy nối hai câu độc lập (*comma splice*): ~~It is cheap, however it is unsafe.~~ → dùng dấu chấm phẩy hoặc chấm.

### Mẹo
Mỗi đoạn Task 2 chỉ cần 2–3 từ nối chọn lọc; phần còn lại nhờ **quy chiếu** (*this trend, such measures*). Đừng nhồi *moreover/furthermore* ở mọi câu.
'''

[[questions]]
id = "iv-001"
module = "iv-paraphrase-word-formation"
type = "single"
difficulty = 1
tags = ["band:5.5"]
prompt = "Which word correctly completes the sentence? \"___ in many countries has fallen over the last decade.\""
options = ["Unemployed", "Unemployment", "Unemploy", "Unemploying"]
answer = [1]
explanation = "Chủ ngữ cần danh từ: *Unemployment* (thất nghiệp). *Unemployed* là tính từ (người thất nghiệp), hai phương án còn lại không tồn tại."

[[questions]]
id = "iv-002"
module = "iv-paraphrase-word-formation"
type = "single"
difficulty = 1
tags = ["band:5.5"]
prompt = "Choose the word with the same meaning as *rise* in: \"The price of oil rose last year.\""
options = ["increased", "reduced", "remained", "dropped"]
answer = [0]
explanation = "*rise* ≈ *increase*. *reduced* và *dropped* mang nghĩa giảm; *remained* là giữ nguyên."

[[questions]]
id = "iv-003"
module = "iv-paraphrase-word-formation"
