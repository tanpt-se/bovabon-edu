difficulty = 1
tags = ["band:5.5"]
prompt = "Điền dạng đúng của từ trong ngoặc: Vietnam's {{blank}} (economy) has grown quickly in recent years."
blanks = [["economy"]]
explanation = "Sau sở hữu cách *Vietnam's* cần danh từ: *economy*. Tránh nhầm với tính từ *economic*."

[[questions]]
id = "iv-004"
module = "iv-paraphrase-word-formation"
type = "single"
difficulty = 1
tags = ["band:5.5"]
prompt = "Which sentence is correct?"
options = ["The government gave us many informations.", "The government gave us a lot of information.", "The government gave us many information.", "The government gave us a information."]
answer = [1]
explanation = "*information* là danh từ không đếm được: không thêm *-s*, không dùng *a/many*; dùng *a lot of / much*."

[[questions]]
id = "iv-005"
module = "iv-paraphrase-word-formation"
type = "single"
