[[questions]]
id = "frontend-dvc01"
module = "frontend-dv-forms"
type = "code"
difficulty = 2
title = "Validate dữ liệu đăng ký"
lang = "javascript"
prompt = '''
Viết `validateRegistration(values)` cho object có các trường `name`, `email`, `password`, `confirmPassword` (giá trị là chuỗi; trường thiếu được coi như chuỗi rỗng). Trả về object có đúng bốn key này, mỗi giá trị là thông báo lỗi hoặc `null` nếu hợp lệ.
- `name` và `email` được trim trước khi kiểm tra; tên rỗng báo `Name is required`.
- Email rỗng báo `Email is required`; email khác rỗng phải khớp dạng đơn giản `local@domain.tld`, nếu không báo `Email is invalid`.
- Mật khẩu rỗng báo `Password is required`; ít hơn 8 ký tự báo `Password must be at least 8 characters`.
- Xác nhận rỗng báo `Please confirm password`; nếu khác mật khẩu gốc báo `Passwords do not match`.
- Đây là kiểm tra hỗ trợ giao diện. Server vẫn phải xác thực dữ liệu.
'''
starter = '''
function validateRegistration(values) {
  return { name: null, email: null, password: null, confirmPassword: null };
}
'''
solution = '''
function validateRegistration(values) {
  const name = String(values.name ?? "").trim();
  const email = String(values.email ?? "").trim();
  const password = String(values.password ?? "");
  const confirmPassword = String(values.confirmPassword ?? "");
  const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  return {
    name: name ? null : "Name is required",
    email: !email ? "Email is required" : emailPattern.test(email) ? null : "Email is invalid",
    password: !password ? "Password is required" : password.length < 8 ? "Password must be at least 8 characters" : null,
    confirmPassword: !confirmPassword ? "Please confirm password" : confirmPassword !== password ? "Passwords do not match" : null,
  };
}
'''
tests = '''
test('accepts valid values', () => {
  expect(validateRegistration({ name: 'Lan', email: 'lan@example.com', password: 'strongpass', confirmPassword: 'strongpass' })).toEqual({ name: null, email: null, password: null, confirmPassword: null });
});
test('trims name and email', () => {
  expect(validateRegistration({ name: '  Lan  ', email: ' lan@example.com ', password: 'strongpass', confirmPassword: 'strongpass' }).email).toBe(null);
  expect(validateRegistration({ name: '   ', email: 'lan@example.com', password: 'strongpass', confirmPassword: 'strongpass' }).name).toBe('Name is required');
});
test('reports required fields', () => {
  expect(validateRegistration({}).name).toBe('Name is required');
  expect(validateRegistration({}).email).toBe('Email is required');
  expect(validateRegistration({}).password).toBe('Password is required');
  expect(validateRegistration({}).confirmPassword).toBe('Please confirm password');
});
test('rejects a malformed email', () => {
  expect(validateRegistration({ name: 'Lan', email: 'lan.example.com', password: 'strongpass', confirmPassword: 'strongpass' }).email).toBe('Email is invalid');
});
test('checks password length and confirmation', () => {
  const result = validateRegistration({ name: 'Lan', email: 'lan@example.com', password: 'short', confirmPassword: 'different' });
  expect(result.password).toBe('Password must be at least 8 characters');
  expect(result.confirmPassword).toBe('Passwords do not match');
});
'''
hints = ["Tạo chuỗi rỗng mặc định cho trường thiếu, rồi trim riêng `name` và `email`.", "Kiểm tra trường rỗng trước, sau đó mới kiểm tra định dạng hoặc độ dài."]
explanation = "Tách validation thành hàm thuần giúp kiểm thử dễ và tái sử dụng trong giao diện; server vẫn phải kiểm tra độc lập."

[[modules]]
id = "frontend-dv-motion"
title = "CSS Motion & Transitions"
description = "Transitions, keyframe animation, reduced motion, scroll-driven animation và View Transitions."
sources = ["css/properties/transition", "css/at-rules/@keyframes", "css/properties/animation", "css/at-rules/@media/prefers-reduced-motion", "css/properties/view-timeline", "css/at-rules/@view-transition"]
lesson = '''
### Chọn đúng cơ chế chuyển động
CSS có nhiều công cụ cho chuyển động, nhưng mỗi công cụ phù hợp với một loại tín hiệu khác nhau. Transition phản hồi khi một style đổi trạng thái, chẳng hạn nút từ bình thường sang hover hoặc focus. Animation dùng `@keyframes` khi cần nhiều mốc, lặp, hoặc chạy độc lập với tương tác trực tiếp. Scroll-driven animation ánh xạ tiến độ animation vào scroll hoặc vùng nhìn thấy của phần tử; View Transitions giúp trình duyệt chuyển giữa hai trạng thái hiển thị của trang.

| Cơ chế | Điều khiển bởi | Hợp với |
|---|---|---|
| `transition` | Thay đổi computed style | Hover, focus, mở/đóng một trạng thái |
| `@keyframes` + `animation` | Timeline theo thời gian | Chuỗi nhiều bước, lặp hoặc tự chạy |
| Scroll/view timeline | Vị trí cuộn hoặc mức độ xuất hiện | Tiến độ đọc, hiệu ứng gắn với nội dung trong viewport |
| View Transition | Hai snapshot giao diện | Chuyển cảnh giữa trạng thái hoặc trang |

Ví dụ: `.card { transition: transform 180ms ease; } .card:hover { transform: translateY(-2px); }` tạo chuyển động ngắn khi trạng thái đổi. Với animation, `animation-fill-mode: forwards` giữ style ở keyframe cuối sau khi hoàn tất; mặc định style animation không được giữ lâu dài. Transition chỉ tác động các thuộc tính phù hợp và thường cần giá trị đầu/cuối có thể nội suy. Tránh `transition: all` nếu một component có nhiều thuộc tính thay đổi ngoài dự kiến.

Tôn trọng lựa chọn giảm chuyển động của người dùng bằng `@media (prefers-reduced-motion: reduce)`: giảm khoảng cách, thời lượng hoặc bỏ chuyển động trang trí, nhưng vẫn giữ tín hiệu rõ ràng về trạng thái. Dùng transform/opacity thường giảm layout work, song cần đo trên trang thật vì hiệu ứng lọc, vùng lớn hoặc nhiều layer vẫn tốn tài nguyên. Với scroll-driven và View Transitions, cung cấp trạng thái tĩnh dễ hiểu khi tính năng không được hỗ trợ.

Lỗi hay gặp: chỉ gắn hiệu ứng vào `:hover` nên người dùng bàn phím không thấy phản hồi; nghĩ rằng `transition` có thể tự tạo nhiều bước như keyframes; quên `animation-fill-mode`; dùng chuyển động lớn để truyền đạt thông tin quan trọng; hoặc bỏ qua `prefers-reduced-motion`. Chuyển động nên giúp hiểu quan hệ và trạng thái, không làm giao diện chậm hoặc gây khó chịu.
'''

