# ============================================================ LEVEL EXPANSION (lv)
[[modules]]
id = "frontend-lead"
title = "Góc nhìn Tech Lead"
description = "Performance budget & Core Web Vitals làm KPI, chiến lược browser support/polyfill, design system & token, quy chuẩn a11y, quản trị third-party script, migration và review code ở quy mô team."
sources = ["dom/largestcontentfulpaint", "dom/layoutshift", "dom/performanceeventtiming", "dom/performanceobserver", "css/at-rules/@supports", "dom/cspviolationreport"]
lesson = '''
### Khung ra quyết định
Ở cấp Lead, câu hỏi hiếm khi là "API nào đúng" mà là "phương án nào hợp lý nhất **với ràng buộc của team**": số người, thời hạn, rủi ro, chi phí vận hành, khả năng đảo ngược. Một khung đơn giản:
1. **Nêu vấn đề bằng số liệu** (ví dụ: LCP p75 trên mobile là 3,8 s, mục tiêu ≤ 2,5 s).
2. **Liệt kê 2–4 phương án**, kể cả "không làm gì".
3. **Chấm theo tiêu chí**: tác động người dùng, công sức, rủi ro, khả năng quay lui, chi phí duy trì.
4. **Chọn, ghi ADR, đặt chỉ số theo dõi** và mốc xem lại.

| Phương án (ví dụ: CSS cho app SSR, team 8 người) | Công sức | Rủi ro runtime | Nhất quán | Đảo ngược |
|---|---|---|---|---|
| CSS Modules + design token (CSS variables) | Thấp | Thấp | Trung bình (cần lint) | Dễ |
| Utility-first (class tiện ích) | Trung bình | Thấp | Cao | Trung bình |
| CSS-in-JS runtime | Trung bình | Cao (chi phí lúc render, SSR phức tạp) | Cao | Khó |

### Performance budget làm KPI
- Đo **dữ liệu thực địa (RUM)** ở **p75** theo thiết bị/mạng; dữ liệu lab (Lighthouse) dùng để **chặn hồi quy trong CI**, không thay field data.
- Ngưỡng tham khảo của Core Web Vitals: LCP ≤ 2,5 s, INP ≤ 200 ms, CLS ≤ 0,1. Budget JS ban đầu (ước lượng): ~170 KB gzip cho route chính trên mobile tầm trung.
- Gắn mỗi budget với **chủ sở hữu** và quy trình khi vượt (chặn merge, hay cảnh báo + ticket).

### Browser support & polyfill
Quyết định dựa trên **analytics của chính sản phẩm**, ghi vào `browserslist` dùng chung cho build, lint và polyfill. Ưu tiên progressive enhancement (`@supports`), chỉ polyfill tính năng thực sự dùng, xem lại mỗi quý.

### Checklist review (rút gọn)
- Tự động hoá phần máy làm được: format, lint, type-check, test, bundle-size diff, axe.
- Người review tập trung: thiết kế API component, trạng thái lỗi/loading/rỗng, a11y bàn phím, bảo mật (HTML không tin cậy), tác động hiệu năng, khả năng rollback.

### ADR mẫu
```
ADR-012: Dùng CSS Modules + design token
Bối cảnh: SSR, 8 dev, 3 squad, INP đang sát ngưỡng.
Quyết định: CSS Modules, token qua CSS variables, cấm CSS-in-JS runtime cho code mới.
Hệ quả: + không tốn runtime; − cần stylelint để giữ nhất quán.
Xem lại: sau 2 quý hoặc khi đổi framework.
```

### Anti-pattern ở quy mô team
- Lấy điểm Lighthouse trên máy dev làm KPI.
- "Big bang rewrite" trong khi vẫn phải ra tính năng.
- Design system không có owner, không versioning → mỗi squad fork một bản.
- Coi a11y là việc audit cuối năm thay vì một phần của Definition of Done.
- Thêm tag marketing không qua review và không có budget.
'''

