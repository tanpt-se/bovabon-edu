prompt = "Viết một ADR ngắn chọn chiến lược CSS cho app SSR mới (team 8 người, 3 squad, INP đang sát ngưỡng): so sánh ít nhất CSS Modules, utility-first và CSS-in-JS runtime."
keywords = [
  ["bối cảnh", "context"],
  ["css modules", "css module"],
  ["utility", "tailwind"],
  ["runtime", "css-in-js"],
  ["token", "biến css", "custom propert"],
  ["hệ quả", "trade-off", "đánh đổi", "consequence"],
  ["xem lại", "review", "đánh giá lại"],
]
min_keywords = 4
model_answer = '''
**ADR-012: Chiến lược CSS cho app SSR**

**Bối cảnh:** SSR, 8 dev chia 3 squad, INP p75 đang ~190 ms, cần giao diện nhất quán và đổi theme.

**Phương án:**
- **CSS Modules + design token** (CSS custom properties): không tốn runtime, scope theo file, dễ SSR; nhất quán phụ thuộc lint.
- **Utility-first**: nhất quán cao, ít CSS chết; cần thời gian làm quen, markup dài.
- **CSS-in-JS runtime**: linh hoạt theo props nhưng tốn chi phí tính style khi render, SSR và streaming phức tạp hơn — rủi ro với INP.

**Quyết định:** CSS Modules + token; cho phép một số utility class do design system cung cấp; không dùng CSS-in-JS runtime cho code mới.

**Hệ quả:** + không có chi phí runtime, dễ debug; − cần stylelint và review để tránh giá trị hard-code (đánh đổi chấp nhận được).

**Xem lại:** sau 2 quý, dựa trên số lỗi UI không nhất quán và INP.
'''
