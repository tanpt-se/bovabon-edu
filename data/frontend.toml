[[questions]]
id = "fe-048"
module = "fe-browser"
type = "code"
difficulty = 2
title = "Phân tích query string"
prompt = '''
Viết `parseQuery(qs)` chuyển query string thành object:
- Bỏ ký tự `?` đầu nếu có
- Giải mã `decodeURIComponent`, dấu `+` là khoảng trắng
- Key lặp lại → mảng giá trị theo thứ tự
- Key không có `=` → giá trị `''`
- Bỏ qua đoạn rỗng (`a=1&&b=2`)
'''
starter = '''
function parseQuery(qs) {
  // TODO
}
'''
solution = '''
function parseQuery(qs) {
  const out = {};
  const s = qs.startsWith('?') ? qs.slice(1) : qs;
  for (const part of s.split('&')) {
    if (!part) continue;
    const i = part.indexOf('=');
    const rawK = i === -1 ? part : part.slice(0, i);
    const rawV = i === -1 ? '' : part.slice(i + 1);
    const dec = (x) => decodeURIComponent(x.replace(/\+/g, ' '));
    const k = dec(rawK), v = dec(rawV);
    if (Object.prototype.hasOwnProperty.call(out, k)) {
      out[k] = Array.isArray(out[k]) ? [...out[k], v] : [out[k], v];
    } else {
      out[k] = v;
    }
  }
  return out;
}
'''
tests = '''
test('cơ bản', () => expect(parseQuery('?a=1&b=hello')).toEqual({ a: '1', b: 'hello' }));
test('không có ?', () => expect(parseQuery('x=y')).toEqual({ x: 'y' }));
test('giải mã', () => expect(parseQuery('q=react%20native&city=H%C3%A0+N%E1%BB%99i')).toEqual({ q: 'react native', city: 'Hà Nội' }));
test('key lặp → mảng', () => expect(parseQuery('tag=a&tag=b&tag=c')).toEqual({ tag: ['a', 'b', 'c'] }));
test('key không có giá trị', () => expect(parseQuery('debug&x=1')).toEqual({ debug: '', x: '1' }));
test('bỏ đoạn rỗng', () => expect(parseQuery('a=1&&b=2&')).toEqual({ a: '1', b: '2' }));
test('chuỗi rỗng', () => expect(parseQuery('')).toEqual({}));
test('giá trị chứa =', () => expect(parseQuery('t=a=b')).toEqual({ t: 'a=b' }));
'''
hints = ["Chỉ tách tại dấu `=` **đầu tiên** (`indexOf`).", "Thay `+` trước khi `decodeURIComponent`."]
explanation = "Thực tế dùng `new URLSearchParams(qs)` — nhưng tự viết giúp hiểu encoding URL."

