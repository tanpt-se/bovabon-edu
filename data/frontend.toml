[[questions]]
id = "frontend-lv021"
module = "fe-js"
type = "essay"
difficulty = 3
tags = ["level:senior", "event-loop"]
prompt = "Phỏng vấn: giải thích event loop của trình duyệt (macrotask, microtask, rendering) và cách bạn tránh để một tác vụ nặng làm UI bị đơ."
keywords = [
  ["call stack", "stack"],
  ["microtask", "promise", "queuemicrotask"],
  ["macrotask", "task queue", "settimeout"],
  ["render", "paint", "frame"],
  ["chia nhỏ", "chunk", "yield", "nhường", "web worker", "worker"],
]
min_keywords = 3
model_answer = '''
JavaScript trên main thread chạy trên **call stack**. Mỗi vòng event loop lấy **một macrotask** (sự kiện, `setTimeout`, message), chạy xong thì xả **toàn bộ microtask** (`Promise.then`, `await`, `queueMicrotask`), sau đó trình duyệt có cơ hội **render** frame (style, layout, paint; `requestAnimationFrame` chạy ngay trước đó).

Vì render chỉ xảy ra giữa các task, một task dài (> 50 ms) hoặc chuỗi microtask không dứt sẽ làm UI đơ và INP xấu. Cách tránh: **chia nhỏ** công việc thành nhiều task và **nhường** main thread (`setTimeout`, `MessageChannel`, `scheduler.yield()`), cập nhật phản hồi UI trước khi làm việc nặng, ảo hoá danh sách dài, và chuyển tính toán thuần sang **Web Worker**.
'''
explanation = "Điểm cộng: nêu được thứ tự microtask trước render, vì sao microtask đệ quy chặn render, và đo bằng Long Tasks/INP."

