[[questions]]
id = "fe-087"
module = "fe-tooling"
type = "code"
difficulty = 3
title = "deepEqual cho test assertion"
prompt = '''
Viết `deepEqual(a, b)` (giống `toEqual`) so sánh sâu:
- primitive: `Object.is`
- mảng: cùng độ dài & từng phần tử deepEqual
- object thường: cùng tập key & giá trị deepEqual
- `Date`: so sánh `getTime()`
- mảng ≠ object (`[]` khác `{}`)
'''
starter = '''
function deepEqual(a, b) {
  // TODO
}
'''
solution = '''
function deepEqual(a, b) {
  if (Object.is(a, b)) return true;
  if (typeof a !== 'object' || typeof b !== 'object' || a === null || b === null) return false;
  if (a instanceof Date || b instanceof Date) {
    return a instanceof Date && b instanceof Date && a.getTime() === b.getTime();
  }
  if (Array.isArray(a) !== Array.isArray(b)) return false;
  const ka = Object.keys(a), kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  return ka.every((k) => Object.prototype.hasOwnProperty.call(b, k) && deepEqual(a[k], b[k]));
}
'''
tests = '''
test('primitive', () => {
  expect(deepEqual(1, 1)).toBe(true);
  expect(deepEqual('a', 'b')).toBe(false);
  expect(deepEqual(NaN, NaN)).toBe(true);
});
test('object lồng nhau', () => {
  expect(deepEqual({ a: { b: [1, 2, { c: 3 }] } }, { a: { b: [1, 2, { c: 3 }] } })).toBe(true);
  expect(deepEqual({ a: { b: [1, 2] } }, { a: { b: [1, 3] } })).toBe(false);
});
test('khác số key', () => expect(deepEqual({ a: 1 }, { a: 1, b: 2 })).toBe(false));
test('mảng khác object', () => expect(deepEqual([], {})).toBe(false));
test('null', () => {
  expect(deepEqual(null, null)).toBe(true);
  expect(deepEqual(null, {})).toBe(false);
});
test('Date', () => {
  expect(deepEqual(new Date(5), new Date(5))).toBe(true);
  expect(deepEqual(new Date(5), new Date(6))).toBe(false);
});
test('thứ tự key không quan trọng', () => expect(deepEqual({ a: 1, b: 2 }, { b: 2, a: 1 })).toBe(true));
'''
hints = ["Xử lý trường hợp cơ sở trước (Object.is, không phải object).", "Đệ quy trên từng key."]
explanation = "Đây là phần lõi của mọi thư viện assertion."

[[questions]]
id = "fe-088"
module = "fe-tooling"
type = "code"
difficulty = 2
title = "Escape HTML chống XSS"
prompt = '''
Viết `escapeHtml(str)` thay thế các ký tự nguy hiểm:
`&` → `&amp;`, `<` → `&lt;`, `>` → `&gt;`, `"` → `&quot;`, `'` → `&#39;`

Và `safeUrl(url)`: trả về `url` nếu protocol là `http:`, `https:`, `mailto:` hoặc là đường dẫn tương đối (bắt đầu bằng `/`, `./`, `#`); ngược lại (vd. `javascript:`, `data:`) trả về `'about:blank'`. Không phân biệt hoa thường và bỏ khoảng trắng đầu.
'''
starter = '''
function escapeHtml(str) {
  // TODO
}

function safeUrl(url) {
  // TODO
}
'''
solution = '''
function escapeHtml(str) {
  const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  return String(str).replace(/[&<>"']/g, (c) => map[c]);
}

function safeUrl(url) {
  const u = String(url).trim();
  if (/^(\/|\.\/|#)/.test(u)) return u;
  if (/^(https?:|mailto:)/i.test(u)) return u;
  return 'about:blank';
}
'''
tests = '''
test('escape thẻ script', () => {
  expect(escapeHtml('<script>alert("x")</script>')).toBe('&lt;script&gt;alert(&quot;x&quot;)&lt;/script&gt;');
});
test('escape & trước', () => expect(escapeHtml('a & <b>')).toBe('a &amp; &lt;b&gt;'));
test("escape '", () => expect(escapeHtml("It's")).toBe('It&#39;s'));
test('không escape 2 lần sai', () => expect(escapeHtml('&lt;')).toBe('&amp;lt;'));
test('safeUrl cho phép http/https/mailto', () => {
  expect(safeUrl('https://bovabon.edu')).toBe('https://bovabon.edu');
  expect(safeUrl('mailto:a@b.c')).toBe('mailto:a@b.c');
});
test('safeUrl cho phép đường dẫn tương đối', () => {
  expect(safeUrl('/courses')).toBe('/courses');
  expect(safeUrl('#top')).toBe('#top');
});
test('safeUrl chặn javascript:', () => {
  expect(safeUrl('javascript:alert(1)')).toBe('about:blank');
  expect(safeUrl('  JaVaScRiPt:alert(1)')).toBe('about:blank');
  expect(safeUrl('data:text/html,<b>x</b>')).toBe('about:blank');
});
'''
hints = ["Dùng 1 regex `/[&<>\"']/g` với hàm thay thế để không escape trùng.", "Allowlist an toàn hơn blocklist."]
explanation = "Nguyên tắc: escape theo ngữ cảnh đầu ra & dùng allowlist cho URL."

