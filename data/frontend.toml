sources = ["typescript/docs/handbook/utility-types", "typescript/docs/handbook/2/mapped-types", "typescript/docs/handbook/2/conditional-types", "typescript/docs/handbook/2/everyday-types", "typescript/docs/handbook/2/narrowing", "typescript/docs/handbook/2/generics"]
title = "TypeScript"
description = "Kiểu cơ bản, union/intersection, generic, narrowing, utility types, `unknown` vs `any`."
lesson = '''
### Ý chính
- `unknown` an toàn hơn `any`: phải **narrowing** trước khi dùng.
- `type` vs `interface`: interface có thể **declaration merging**, `extends`; type linh hoạt hơn (union, mapped, conditional).
- Narrowing: `typeof`, `instanceof`, `in`, **discriminated union** (`kind: 'a' | 'b'`), type guard `x is Foo`.
- Utility types: `Partial`, `Required`, `Readonly`, `Pick`, `Omit`, `Record`, `ReturnType`, `Parameters`, `Awaited`, `NonNullable`.
- `never` cho exhaustive check trong `switch`.
- `as const` giữ kiểu literal; `satisfies` kiểm tra kiểu mà không làm mất kiểu suy luận.
'''

[[modules]]
id = "fe-tooling"
sources = ["html/reference/attributes/rel/preload", "dom/performance", "html/reference/elements/script", "dom/window/fetch", "dom/cspviolationreport"]
title = "Tooling, Testing & Bảo mật"
description = "Bundler, tree-shaking, Vite, testing pyramid, XSS, CSRF, CORS, CSP."
lesson = '''
### Tooling
- **Bundler** (Vite/Rollup, webpack, esbuild, Rspack, Turbopack): gom module, **tree-shaking** (cần ES modules), code splitting, minify.
- Vite dev server dùng **native ESM** + esbuild pre-bundle → khởi động nhanh.
- **Transpiler** (Babel/SWC/TS) chuyển cú pháp mới → cú pháp cũ; **polyfill** thêm API còn thiếu.

### Testing
- Pyramid/Trophy: nhiều **unit/integration**, ít **E2E** (Playwright/Cypress).
- Jest/Vitest: `describe`, `test`, `expect`, mock (`vi.fn`/`jest.fn`), fake timers.

### Bảo mật
- **XSS**: chèn script qua dữ liệu chưa escape. React escape mặc định; cẩn thận `dangerouslySetInnerHTML`, `href="javascript:..."`.
- **CSRF**: lợi dụng cookie tự gửi kèm. Chống bằng `SameSite`, CSRF token.
- **CORS**: cơ chế **trình duyệt** cho phép server khai báo origin nào được đọc response (`Access-Control-Allow-Origin`). Preflight `OPTIONS` cho request "không đơn giản".
- **CSP**: header giới hạn nguồn script/style được phép chạy.
'''

