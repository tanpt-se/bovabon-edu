[[questions]]
id = "fe-dd09"
module = "fe-js"
type = "code"
difficulty = 2
title = "Polyfill Object.groupBy & Promise.allSettled"
prompt = '''
Viết hai hàm (không dùng bản có sẵn):

1. `groupBy(items, keyFn)` — giống `Object.groupBy`: trả về object **không có prototype** (`Object.create(null)`), key là kết quả `keyFn(item, index)` (ép sang chuỗi), value là mảng phần tử theo thứ tự gốc. Nhận mọi iterable.
2. `allSettled(promises)` — giống `Promise.allSettled`: nhận iterable (phần tử có thể không phải promise), resolve thành mảng `{ status: 'fulfilled', value }` / `{ status: 'rejected', reason }` **đúng thứ tự đầu vào**; mảng rỗng → `[]`.
'''
starter = '''
function groupBy(items, keyFn) {
  return {};
}

function allSettled(promises) {
  return Promise.all(promises);
}
'''
solution = '''
function groupBy(items, keyFn) {
  const out = Object.create(null);
  let i = 0;
  for (const item of items) {
    const k = String(keyFn(item, i++));
    (out[k] || (out[k] = [])).push(item);
  }
  return out;
}

function allSettled(promises) {
  return Promise.all(
    Array.from(promises, (p) =>
      Promise.resolve(p).then(
        (value) => ({ status: 'fulfilled', value }),
        (reason) => ({ status: 'rejected', reason }),
      ),
    ),
  );
}
'''
tests = '''
test('groupBy cơ bản', () => {
  const r = groupBy([1, 2, 3, 4, 5], (n) => (n % 2 ? 'odd' : 'even'));
  expect(r.odd).toEqual([1, 3, 5]);
  expect(r.even).toEqual([2, 4]);
  expect(Object.getPrototypeOf(r)).toBeNull();
});
test('groupBy nhận iterable & index', () => {
  const r = groupBy(new Set(['a', 'b', 'c']), (_, i) => i < 2);
  expect(r['true']).toEqual(['a', 'b']);
  expect(r['false']).toEqual(['c']);
});
test('allSettled giữ thứ tự & trạng thái', async () => {
  const pending = allSettled([
    new Promise((res) => setTimeout(() => res('chậm'), 50)),
    Promise.reject(new Error('lỗi')),
    42,
  ]);
  jest.advanceTimersByTime(60);
  const r = await pending;
  expect(r[0]).toEqual({ status: 'fulfilled', value: 'chậm' });
  expect(r[1].status).toBe('rejected');
  expect(r[1].reason.message).toBe('lỗi');
  expect(r[2]).toEqual({ status: 'fulfilled', value: 42 });
});
test('allSettled rỗng', async () => {
  expect(await allSettled([])).toEqual([]);
});
'''
hints = ["`Object.create(null)` tạo object không kế thừa `toString`, `__proto__`…", "Bọc mỗi phần tử bằng `Promise.resolve(p).then(onOk, onErr)` rồi `Promise.all`."]
explanation = "Object không prototype tránh va chạm với key như `constructor`. `Map.groupBy` dùng khi cần key không phải chuỗi."
sources = ["javascript/global_objects/object/groupby", "javascript/global_objects/promise/allsettled"]

[[modules]]
id = "frontend-dv-forms"
title = "HTML Forms & Validation"
description = "Form controls, native constraint validation, FormData, submit lifecycle và thiết kế lỗi dễ dùng."
sources = ["html/reference/elements/form", "html/reference/elements/input", "html/guides/constraint_validation", "html/reference/elements/label", "dom/htmlformelement", "dom/formdata"]
lesson = '''
### Form là hợp đồng dữ liệu
Một form tốt cho biết dữ liệu sẽ được gửi đi đâu, bằng cách nào và mỗi giá trị có tên gì. `action` xác định đích, `method="get"` phù hợp với truy vấn có thể chia sẻ, còn `method="post"` thường dùng khi gửi dữ liệu làm thay đổi trạng thái. Mỗi control cần `name` để trở thành cặp dữ liệu gửi đi; `id` chủ yếu giúp liên kết `<label for>` và không thay thế `name`.

| Cách kiểm tra | Vai trò | Giới hạn |
|---|---|---|
| HTML constraint (`required`, `type`, `min`, `pattern`) | Báo lỗi sớm theo ngữ nghĩa của control | Có thể bị bỏ qua hoặc sửa từ client |
| JavaScript phía client | Kiểm tra tương tác nhiều trường, hiển thị lỗi theo ngữ cảnh | Không phải ranh giới bảo mật |
| Server | Xác thực dữ liệu trước khi lưu hoặc thực hiện hành động | Luôn cần thiết với dữ liệu không đáng tin |

Ví dụ: `<label for="email">Email</label><input id="email" name="email" type="email" required>` vừa có nhãn đọc được, vừa có tên dữ liệu và kiểm tra định dạng cơ bản. `autocomplete` giúp trình duyệt gợi ý dữ liệu phù hợp. Với checkbox chưa chọn hoặc control bị `disabled`, giá trị thường không được gửi. `FormData` giữ các giá trị lặp lại; dùng `getAll("topic")` khi một tên có nhiều lựa chọn, còn `get()` chỉ lấy một giá trị.

Trong xử lý JavaScript, nghe sự kiện `submit` trên form để kiểm tra hoặc gửi bất đồng bộ. Gọi `event.preventDefault()` nếu ứng dụng chủ động thay hành vi submit mặc định. `requestSubmit()` đi qua constraint validation và phát sự kiện `submit`; `form.submit()` bỏ qua cả hai bước này. Hãy dùng `requestSubmit()` khi cần kích hoạt quy trình submit chuẩn.

Lỗi hay gặp: dùng placeholder thay cho label; quên `name`; nút phụ trong form không đặt `type="button"` nên vô tình submit; chỉ xác thực ở client; hoặc gọi `submit()` rồi thắc mắc vì sao handler không chạy. Khi tự hiển thị lỗi, gắn thông báo với control và giữ được thông tin lỗi bằng văn bản, không chỉ đổi màu viền.
'''

