# ============================================================ MODULES
[[modules]]
id = "fe-js"
sources = ["javascript/global_objects/promise/allsettled", "javascript/operators/optional_chaining", "javascript/global_objects/proxy", "javascript/operators/this", "javascript/statements/async_function", "javascript/classes"]
title = "JavaScript cốt lõi"
description = "Scope, closure, this, prototype, event loop, Promise/async, ES2015+."
lesson = '''
### Ý chính
- `var` có function scope và hoisting (giá trị `undefined`); `let`/`const` có block scope và **TDZ**.
- **Closure**: hàm "nhớ" biến của scope nơi nó được tạo.
- **this** phụ thuộc cách gọi: method `obj.f()` → `obj`; gọi trơn → `undefined` (strict) / global; `new` → object mới; arrow function **không có this riêng** (lấy từ scope ngoài); `call/apply/bind` gán tường minh.
- **Event loop**: call stack → hết sync code → chạy **toàn bộ microtask** (Promise `.then`, `queueMicrotask`, `await`) → render → **1 macrotask** (setTimeout, I/O, event)…
- `==` ép kiểu, `===` không. `Object.is(NaN, NaN) === true`.
- Promise: `all` (fail-fast), `allSettled`, `race`, `any`.
'''

[[modules]]
id = "fe-html-css"
sources = ["css/selectors/:has", "css/at-rules/@container", "css/at-rules/@layer", "html/reference/elements/dialog", "css/properties/box-sizing", "css/properties/position", "html/reference/elements/button"]
title = "HTML, CSS & Accessibility"
description = "Semantic HTML, box model, specificity, Flexbox/Grid, position, responsive, a11y."
lesson = '''
### CSS
- **Box model**: `content-box` (mặc định, width chỉ tính content) vs `border-box` (width gồm padding + border).
- **Specificity**: inline (1,0,0,0) > id (0,1,0,0) > class/attr/pseudo-class (0,0,1,0) > element/pseudo-element (0,0,0,1). `!important` vượt tất cả (trừ `!important` khác có specificity cao hơn).
- **Position**: `relative` (offset so với chính nó), `absolute` (so với tổ tiên positioned gần nhất), `fixed` (viewport), `sticky`.
- **Stacking context** tạo bởi `position + z-index`, `opacity < 1`, `transform`, `filter`…
- Flexbox: 1 chiều; Grid: 2 chiều.
- Đơn vị: `rem` (theo font-size root), `em` (theo phần tử cha/chính nó), `vh/vw`, `dvh`, `ch`, `%`.

### HTML & a11y
- Dùng thẻ ngữ nghĩa: `header`, `nav`, `main`, `article`, `section`, `button` (không dùng `div onclick`).
- Ảnh có `alt`; input có `<label for>`; tương phản màu tối thiểu **4.5:1** (WCAG AA, chữ thường).
- "No ARIA is better than bad ARIA" — ưu tiên thẻ native.
'''

[[modules]]
id = "fe-browser"
sources = ["dom/intersectionobserver", "dom/abortcontroller", "dom/window/requestanimationframe", "dom/performance", "html/reference/elements/script", "dom/window/localstorage", "dom/storage"]
title = "Trình duyệt & Hiệu năng Web"
description = "Critical rendering path, reflow/repaint, Core Web Vitals, cache HTTP, lưu trữ, event delegation."
lesson = '''
### Critical Rendering Path
HTML → **DOM**, CSS → **CSSOM** → **Render tree** → **Layout** (reflow) → **Paint** → **Composite**.
- CSS **chặn render**; `<script>` thường **chặn parse** HTML → dùng `defer` (chạy sau parse, theo thứ tự) hoặc `async` (chạy ngay khi tải xong, không theo thứ tự).
- Thay đổi `transform`/`opacity` chỉ cần composite → animation rẻ nhất.

### Core Web Vitals (2024+)
| Chỉ số | Đo | Tốt |
|---|---|---|
| **LCP** | tốc độ hiển thị nội dung lớn nhất | ≤ 2.5s |
| **INP** | độ phản hồi tương tác (thay FID) | ≤ 200ms |
| **CLS** | độ ổn định layout | ≤ 0.1 |

### Lưu trữ & cache
- `localStorage` (bền, ~5MB, đồng bộ), `sessionStorage` (theo tab), cookie (gửi kèm request, `HttpOnly`, `Secure`, `SameSite`), IndexedDB (lớn, bất đồng bộ).
- HTTP cache: `Cache-Control: max-age`, `no-cache` (phải revalidate), `no-store`, `ETag`/`If-None-Match` → `304`.
'''

