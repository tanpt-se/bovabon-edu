[[questions]]
id = "frontend-lvc02"
module = "frontend-lead"
type = "code"
difficulty = 3
tags = ["level:lead", "web-vitals"]
title = "Cổng kiểm tra performance budget (p75)"
prompt = '''
Viết `checkBudget(samples, budget)` dùng trong job CI/RUM hằng ngày để quyết định có cảnh báo team hay không.

- `samples`: object `{ LCP: number[], INP: number[], CLS: number[] , ... }` — mẫu đo từ người dùng thật.
- `budget`: object `{ LCP: 2500, INP: 200, CLS: 0.1 }` — ngưỡng tối đa cho phép.
- Với **mỗi metric trong `budget`** (giữ thứ tự key của `budget`), tính **p75** bằng phương pháp nearest-rank: sắp xếp tăng dần, lấy phần tử thứ `ceil(0.75 * n)` (đếm từ 1).
- Trả về `{ pass, report }`, trong đó `report` là mảng `{ metric, p75, limit, ok }` với `ok = p75 <= limit`.
- Metric không có mẫu (thiếu hoặc mảng rỗng) → `p75: null`, `ok: false` (thiếu dữ liệu cũng là tín hiệu xấu).
- `pass` là `true` khi mọi dòng `ok`.
- Không được sửa mảng mẫu đầu vào.
'''
starter = '''
function checkBudget(samples, budget) {
  // TODO
  return { pass: true, report: [] };
}
'''
solution = '''
function p75(values) {
  if (!Array.isArray(values) || values.length === 0) return null;
  const sorted = [...values].sort((a, b) => a - b);
  return sorted[Math.ceil(0.75 * sorted.length) - 1];
}

function checkBudget(samples, budget) {
  const report = Object.keys(budget).map((metric) => {
    const value = p75(samples[metric]);
    const limit = budget[metric];
    return { metric, p75: value, limit, ok: value !== null && value <= limit };
  });
  return { pass: report.every((r) => r.ok), report };
}
'''
tests = '''
test('tính p75 nearest-rank', () => {
  const r = checkBudget({ LCP: [4000, 1000, 2000, 3000] }, { LCP: 2500 });
  expect(r.report).toEqual([{ metric: 'LCP', p75: 3000, limit: 2500, ok: false }]);
  expect(r.pass).toBe(false);
});
test('đạt mọi budget', () => {
  const r = checkBudget(
    { LCP: [1800, 2100, 2400, 1500], INP: [120, 90, 150, 180], CLS: [0.01, 0.05, 0.02, 0.08] },
    { LCP: 2500, INP: 200, CLS: 0.1 }
  );
  expect(r.pass).toBe(true);
  expect(r.report.map((x) => x.metric)).toEqual(['LCP', 'INP', 'CLS']);
  expect(r.report[1].p75).toBe(150);
});
test('thiếu dữ liệu là không đạt', () => {
  const r = checkBudget({ LCP: [1000], INP: [] }, { LCP: 2500, INP: 200, CLS: 0.1 });
  expect(r.report[1]).toEqual({ metric: 'INP', p75: null, limit: 200, ok: false });
  expect(r.report[2].p75).toBe(null);
  expect(r.pass).toBe(false);
});
test('bằng ngưỡng vẫn đạt', () => {
  const r = checkBudget({ INP: [200, 200, 200, 200] }, { INP: 200 });
  expect(r.pass).toBe(true);
});
test('không sửa mảng mẫu', () => {
  const lcp = [3, 1, 2];
  checkBudget({ LCP: lcp }, { LCP: 5 });
