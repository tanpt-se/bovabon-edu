id = "frontend-dv-tsconfig"
title = "TypeScript Modules & Project Setup"
description = "ES modules, module resolution, compiler options, declaration files và project references."
sources = ["typescript/docs/handbook/modules/introduction", "typescript/docs/handbook/modules/guides/choosing-compiler-options", "typescript/docs/handbook/modules/reference", "typescript/tsconfig/index", "typescript/docs/handbook/project-references", "typescript/docs/handbook/declaration-files/consumption"]
lesson = '''
### Cấu hình TypeScript theo môi trường chạy
TypeScript kiểm tra và biến đổi mã, nhưng không tự quyết định mọi quy tắc của runtime. File có top-level `import` hoặc `export` được xử lý như module; file script không có chúng có thể làm khai báo rò rỉ vào scope toàn cục. Trong dự án hiện đại, nên dùng ES module syntax rõ ràng và cấu hình compiler theo runtime hoặc bundler thật sự đang chạy mã.

| Cấu hình | Ý nghĩa chính | Chọn theo |
|---|---|---|
| `target` | Mức cú pháp JavaScript được phát ra khi TypeScript emit | Runtime cần hỗ trợ |
| `lib` | Các khai báo API có sẵn để type-check, không thêm API vào runtime | Môi trường browser/server và polyfill thực tế |
| `module` | Dạng module được giữ lại hoặc phát ra | Cách ứng dụng được đóng gói/chạy |
| `moduleResolution` | Cách tìm file khi gặp import | Node.js hoặc bundler mà dự án dùng |

Ví dụ, app được đóng gói bằng bundler thường cần cách phân giải import phù hợp với bundler; mã Node.js nên dùng cấu hình Node hiện đại, tương thích với cách Node xử lý ESM và CommonJS. `module` và `moduleResolution` liên quan nhau, nên tránh chọn một giá trị chỉ để làm hết lỗi mà không kiểm tra runtime. `noEmit` phù hợp khi bundler khác chịu trách nhiệm tạo JavaScript; TypeScript vẫn có thể chạy kiểm tra kiểu.

Khi thư viện muốn công bố kiểu cho người dùng, `declaration` tạo file `.d.ts`; declaration mô tả API lúc biên dịch chứ không cung cấp implementation ở runtime. Dự án lớn có thể tách thành nhiều project dùng project references. Mỗi project tham chiếu có ranh giới build rõ, thường bật `composite`; `tsc --build` sắp xếp thứ tự và chỉ build phần cần thiết.

Lỗi hay gặp: nghĩ `lib` sẽ polyfill API trình duyệt; đặt `target` mà quên kiểm tra runtime; dùng `moduleResolution` không khớp Node hoặc bundler; coi `.d.ts` là JavaScript có thể chạy; hoặc tạo project references nhưng không cấu hình dependency build. Cấu hình tốt mô tả môi trường phát triển và triển khai, thay vì che lỗi import bằng tuỳ chọn ngẫu nhiên.
'''

[[questions]]
id = "frontend-dv016"
module = "frontend-dv-tsconfig"
type = "single"
difficulty = 2
prompt = "Trong `tsconfig`, khác biệt chính giữa `target` và `lib` là gì?"
options = ["`target` chọn cú pháp JavaScript đầu ra; `lib` cung cấp khai báo kiểu cho API môi trường", "Cả hai đều tự cài polyfill vào runtime", "`lib` chọn định dạng module; `target` chọn cách phân giải import", "`target` chỉ bật kiểm tra kiểu nghiêm ngặt"]
answer = [0]
explanation = "`lib` ảnh hưởng API được nhận diện khi type-check, còn `target` điều khiển mức cú pháp được emit; không thuộc tính nào tự cài polyfill runtime."
sources = ["typescript/tsconfig/index"]

