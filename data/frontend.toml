[[questions]]
id = "fe-011"
module = "fe-js"
type = "code"
difficulty = 2
title = "debounce"
prompt = '''
Viết `debounce(fn, wait)` trả về hàm mới chỉ gọi `fn` sau khi đã **ngừng gọi** `wait` ms.
- Giữ nguyên `this` và tham số của **lần gọi cuối cùng**
- Hàm trả về có thêm method `cancel()` huỷ lần gọi đang chờ

Test dùng fake timers (`jest.advanceTimersByTime`).
'''
starter = '''
function debounce(fn, wait) {
  // TODO
}
'''
solution = '''
function debounce(fn, wait) {
  let timer = null;
  function debounced(...args) {
    clearTimeout(timer);
    timer = setTimeout(() => {
      timer = null;
      fn.apply(this, args);
    }, wait);
  }
  debounced.cancel = () => { clearTimeout(timer); timer = null; };
  return debounced;
}
'''
tests = '''
test('chỉ gọi 1 lần sau khi ngừng', () => {
  const fn = jest.fn();
  const d = debounce(fn, 100);
  d(1); d(2); d(3);
  jest.advanceTimersByTime(99);
  expect(fn).toHaveBeenCalledTimes(0);
  jest.advanceTimersByTime(1);
  expect(fn).toHaveBeenCalledTimes(1);
  expect(fn).toHaveBeenCalledWith(3);
});
test('mỗi lần gọi reset timer', () => {
  const fn = jest.fn();
  const d = debounce(fn, 100);
  d(); jest.advanceTimersByTime(50);
  d(); jest.advanceTimersByTime(50);
  d(); jest.advanceTimersByTime(99);
  expect(fn).toHaveBeenCalledTimes(0);
  jest.advanceTimersByTime(1);
  expect(fn).toHaveBeenCalledTimes(1);
});
test('giữ this', () => {
  const obj = { v: 42, got: null, run: null };
  obj.run = debounce(function () { obj.got = this.v; }, 10);
  obj.run();
  jest.advanceTimersByTime(10);
  expect(obj.got).toBe(42);
});
test('cancel', () => {
  const fn = jest.fn();
  const d = debounce(fn, 100);
  d();
  d.cancel();
  jest.advanceTimersByTime(500);
  expect(fn).toHaveBeenCalledTimes(0);
});
test('gọi lại được sau khi đã chạy', () => {
  const fn = jest.fn();
  const d = debounce(fn, 10);
  d('a'); jest.advanceTimersByTime(10);
  d('b'); jest.advanceTimersByTime(10);
  expect(fn).toHaveBeenCalledTimes(2);
});
'''
hints = ["Dùng `function debounced(...args)` (không phải arrow) để nhận `this` của lời gọi.", "Arrow function trong `setTimeout` giữ được `this` của `debounced`."]
explanation = "Debounce dùng cho ô tìm kiếm, resize; throttle dùng cho scroll."

[[questions]]
id = "fe-012"
module = "fe-js"
type = "code"
difficulty = 2
title = "throttle"
prompt = '''
Viết `throttle(fn, wait)`: gọi `fn` **ngay lần đầu** (leading), sau đó trong khoảng `wait` ms các lần gọi bị bỏ qua, nhưng **lần gọi cuối cùng** trong khoảng đó được thực hiện khi hết `wait` (trailing) với tham số mới nhất.

Thời gian lấy bằng `Date.now()` hoặc timer (đều được fake).
'''
starter = '''
function throttle(fn, wait) {
  // TODO
}
'''
solution = '''
function throttle(fn, wait) {
  let last = -Infinity;
  let timer = null;
  let pendingArgs = null;
  let pendingThis = null;
  function invoke() {
    last = Date.now();
    timer = null;
    const args = pendingArgs, ctx = pendingThis;
    pendingArgs = pendingThis = null;
    fn.apply(ctx, args);
  }
  return function throttled(...args) {
    pendingArgs = args;
    pendingThis = this;
    const remaining = wait - (Date.now() - last);
    if (remaining <= 0) {
      clearTimeout(timer);
      invoke();
    } else if (!timer) {
      timer = setTimeout(invoke, remaining);
    }
  };
}
'''
tests = '''
test('leading: gọi ngay lần đầu', () => {
  const fn = jest.fn();
  const t = throttle(fn, 100);
  t(1);
  expect(fn).toHaveBeenCalledTimes(1);
  expect(fn).toHaveBeenCalledWith(1);
});
test('bỏ qua trong khoảng wait, trailing với tham số cuối', () => {
  const fn = jest.fn();
  const t = throttle(fn, 100);
  t(1); t(2); t(3);
  expect(fn).toHaveBeenCalledTimes(1);
  jest.advanceTimersByTime(100);
  expect(fn).toHaveBeenCalledTimes(2);
  expect(fn.mock.calls[1]).toEqual([3]);
});
test('tối đa 1 lần mỗi wait khi gọi liên tục', () => {
  const fn = jest.fn();
  const t = throttle(fn, 100);
  for (let i = 0; i < 50; i++) { t(i); jest.advanceTimersByTime(10); }
  expect(fn.mock.calls.length).toBeGreaterThan(4);
  expect(fn.mock.calls.length).toBeLessThan(7);
});
test('không trailing nếu chỉ gọi 1 lần', () => {
  const fn = jest.fn();
  const t = throttle(fn, 100);
  t();
  jest.advanceTimersByTime(1000);
  expect(fn).toHaveBeenCalledTimes(1);
});
'''
hints = ["Lưu thời điểm gọi gần nhất `last`.", "Nếu chưa hết wait và chưa có timer → đặt timer cho phần thời gian còn lại."]
explanation = "Throttle đảm bảo tần suất tối đa — phù hợp scroll, mousemove, resize."

[[questions]]
id = "fe-013"
module = "fe-js"
type = "code"
difficulty = 3
title = "Tự cài đặt Promise.all"
prompt = '''
Viết `promiseAll(iterable)` hành xử như `Promise.all`:
- Resolve mảng kết quả **đúng thứ tự** đầu vào (không phải thứ tự hoàn thành)
- Phần tử không phải promise được coi như đã resolve
- Reject ngay với lỗi đầu tiên
- Mảng rỗng → resolve `[]`
'''
starter = '''
function promiseAll(iterable) {
  // TODO
}
'''
solution = '''
function promiseAll(iterable) {
  return new Promise((resolve, reject) => {
    const items = Array.from(iterable);
    const results = new Array(items.length);
    let remaining = items.length;
    if (remaining === 0) return resolve([]);
    items.forEach((item, i) => {
      Promise.resolve(item).then(
        (v) => {
          results[i] = v;
          if (--remaining === 0) resolve(results);
        },
        reject
      );
    });
  });
}
'''
tests = '''
const delay = (v, ms, fail) => new Promise((res, rej) => setTimeout(() => (fail ? rej(v) : res(v)), ms));
test('giữ thứ tự đầu vào', async () => {
  const p = promiseAll([delay('a', 30), delay('b', 10), 'c']);
  jest.advanceTimersByTime(30);
  expect(await p).toEqual(['a', 'b', 'c']);
});
test('mảng rỗng', async () => {
  expect(await promiseAll([])).toEqual([]);
});
test('reject với lỗi đầu tiên', async () => {
  const p = promiseAll([delay(1, 50), delay('x', 10, true), delay('y', 20, true)]);
  jest.advanceTimersByTime(50);
  let err;
  try { await p; } catch (e) { err = e; }
  expect(err).toBe('x');
});
test('nhận iterable (Set)', async () => {
  expect(await promiseAll(new Set([1, Promise.resolve(2)]))).toEqual([1, 2]);
});
test('trả về Promise', () => {
  expect(promiseAll([1]) instanceof Promise).toBe(true);
});
'''
hints = ["Đếm số promise còn lại; ghi kết quả vào `results[i]`.", "`Promise.resolve(item)` chuẩn hoá giá trị thường thành promise."]
explanation = "Câu hỏi phỏng vấn kinh điển để kiểm tra hiểu biết về Promise."

[[questions]]
id = "fe-014"
module = "fe-js"
type = "code"
difficulty = 2
title = "EventEmitter"
prompt = '''
Viết class `EventEmitter` với các method:
- `on(event, listener)` → trả về hàm **unsubscribe**
- `off(event, listener)`
- `once(event, listener)` → chỉ gọi 1 lần
- `emit(event, ...args)` → gọi listener theo thứ tự đăng ký, trả về `true` nếu có listener, ngược lại `false`

Lưu ý: listener tự huỷ đăng ký trong lúc `emit` không được làm các listener khác bị bỏ sót.
'''
starter = '''
class EventEmitter {
  // TODO
}
'''
solution = '''
class EventEmitter {
  constructor() { this.events = new Map(); }
  on(event, listener) {
    if (!this.events.has(event)) this.events.set(event, []);
    this.events.get(event).push(listener);
    return () => this.off(event, listener);
  }
  off(event, listener) {
    const list = this.events.get(event);
    if (!list) return;
    const i = list.findIndex((l) => l === listener || l.__orig === listener);
    if (i !== -1) list.splice(i, 1);
  }
  once(event, listener) {
    const wrapper = (...args) => { this.off(event, wrapper); listener.apply(this, args); };
    wrapper.__orig = listener;
    return this.on(event, wrapper);
  }
  emit(event, ...args) {
    const list = this.events.get(event);
    if (!list || list.length === 0) return false;
    [...list].forEach((l) => l.apply(this, args));
    return true;
  }
}
'''
tests = '''
test('on + emit với tham số', () => {
  const e = new EventEmitter();
  const fn = jest.fn();
  e.on('msg', fn);
  expect(e.emit('msg', 1, 2)).toBe(true);
  expect(fn).toHaveBeenCalledWith(1, 2);
});
test('emit không có listener → false', () => {
  expect(new EventEmitter().emit('x')).toBe(false);
});
test('unsubscribe', () => {
  const e = new EventEmitter();
  const fn = jest.fn();
  const unsub = e.on('a', fn);
  unsub();
  e.emit('a');
  expect(fn).toHaveBeenCalledTimes(0);
});
test('off', () => {
  const e = new EventEmitter();
  const fn = jest.fn();
  e.on('a', fn);
  e.off('a', fn);
  e.emit('a');
  expect(fn).toHaveBeenCalledTimes(0);
});
test('once', () => {
  const e = new EventEmitter();
  const fn = jest.fn();
  e.once('a', fn);
  e.emit('a', 1); e.emit('a', 2);
  expect(fn).toHaveBeenCalledTimes(1);
  expect(fn).toHaveBeenCalledWith(1);
});
test('thứ tự & tự huỷ trong lúc emit', () => {
  const e = new EventEmitter();
  const order = [];
  e.once('a', () => order.push(1));
  e.on('a', () => order.push(2));
  e.emit('a');
  expect(order).toEqual([1, 2]);
});
'''
hints = ["Lưu listener bằng `Map<string, Function[]>`.", "Khi emit, duyệt trên **bản sao** của mảng listener."]
explanation = "Pub/sub là nền tảng của DOM events, Node.js EventEmitter, và nhiều state manager."

[[questions]]
id = "fe-015"
module = "fe-js"
type = "code"
difficulty = 2
title = "memoize"
prompt = '''
Viết `memoize(fn, resolver?)` cache kết quả theo tham số:
- Mặc định key = **tham số đầu tiên**
- Nếu có `resolver(...args)` thì key = kết quả resolver
- Hàm trả về có thuộc tính `cache` là một `Map`
- Giữ `this`
'''
starter = '''
function memoize(fn, resolver) {
  // TODO
}
'''
solution = '''
function memoize(fn, resolver) {
  function memoized(...args) {
    const key = resolver ? resolver.apply(this, args) : args[0];
    if (memoized.cache.has(key)) return memoized.cache.get(key);
    const value = fn.apply(this, args);
    memoized.cache.set(key, value);
    return value;
  }
  memoized.cache = new Map();
  return memoized;
}
'''
tests = '''
test('cache theo tham số đầu', () => {
  const fn = jest.fn((x) => x * 2);
  const m = memoize(fn);
  expect(m(2)).toBe(4);
  expect(m(2)).toBe(4);
  expect(fn).toHaveBeenCalledTimes(1);
});
test('resolver', () => {
  const fn = jest.fn((a, b) => a + b);
  const m = memoize(fn, (a, b) => a + ':' + b);
  m(1, 2); m(1, 2); m(1, 3);
  expect(fn).toHaveBeenCalledTimes(2);
});
test('cache là Map', () => {
  const m = memoize((x) => x);
  m('k');
  expect(m.cache instanceof Map).toBe(true);
  expect(m.cache.get('k')).toBe('k');
});
test('cache cả giá trị undefined', () => {
  const fn = jest.fn(() => undefined);
  const m = memoize(fn);
  m(1); m(1);
  expect(fn).toHaveBeenCalledTimes(1);
});
test('giữ this', () => {
  const obj = { base: 10, add: memoize(function (x) { return this.base + x; }) };
  expect(obj.add(5)).toBe(15);
});
'''
hints = ["Dùng `cache.has(key)` thay vì kiểm tra `cache.get(key) !== undefined`."]
explanation = "Giống `_.memoize` của lodash."

