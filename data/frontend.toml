keywords = [["target", "syntax output", "cú pháp đầu ra"], ["lib", "type declarations", "khai báo kiểu api"], ["moduleResolution", "bundler"], ["noEmit", "bundler emit"], ["project references", "composite", "build graph"]]
min_keywords = 3
model_answer = '''
Chọn `target` theo runtime được hỗ trợ và `lib` theo API thật sự có trong môi trường, nhớ rằng khai báo kiểu không phải polyfill. Chọn `moduleResolution` tương thích với bundler và phối hợp với `module`. Nếu bundler emit JavaScript thì `noEmit` có thể giữ `tsc` ở vai trò type-check. Project references và `composite` hữu ích khi chia monorepo thành các project có dependency build rõ ràng.
'''
explanation = "Cấu hình cần mô tả cả môi trường chạy lẫn pipeline build, không chỉ làm cho một lỗi import biến mất."
