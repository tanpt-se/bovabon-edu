[[questions]]
id = "cefr-c2-x054"
module = "cefr-c2-reading-writing"
type = "single"
difficulty = 3
prompt = '''
Read the literary extract:

At closing time, Mara returned to platform four. The station clock had stopped at 8:17. She knew the minute because it had rested there on every visit since her brother left, although the station had replaced the clock twice. The new one was accurate to the second; it was also silent.

A porter told her that no trains had been cancelled. Mara thanked him and folded the timetable along the line to Northbridge. The paper was new; the crease was old. She used to think that the town's name sounded like a promise. Now it seemed more like an instruction, something printed for people who already knew which way to go.

The loudspeaker announced the last service. A child asked whether the station was closing forever. Her father said only for the night. Mara watched them leave beneath the bright departure board. On it, every destination had a time, except Northbridge. She put the timetable in her coat and walked toward the exit, carrying no suitcase. Outside, the rain had stopped, but the pavement still held the shape of it.

Which interpretation is most strongly supported by the extract?
'''
options = ["The repeated attention to time and the old crease suggests that Mara’s visit is shaped by a past separation, though its exact cause is left unstated.", "The narrator confirms that Mara’s brother died at 8:17.", "The station clock is unreliable because it has been replaced twice.", "Mara is carrying a suitcase to move permanently to Northbridge."]
answer = [0]
explanation = "Các chi tiết lặp về thời gian, nếp gấp cũ và chuyến tàu vắng tạo hàm ý về một cuộc chia xa; văn bản không nói rõ nguyên nhân hay xác nhận người anh đã chết."

[[questions]]
id = "cefr-c2-x055"
module = "cefr-c2-reading-writing"
type = "multiple"
difficulty = 3
prompt = '''
Read the literary extract:

At closing time, Mara returned to platform four. The station clock had stopped at 8:17. She knew the minute because it had rested there on every visit since her brother left, although the station had replaced the clock twice. The new one was accurate to the second; it was also silent.

A porter told her that no trains had been cancelled. Mara thanked him and folded the timetable along the line to Northbridge. The paper was new; the crease was old. She used to think that the town's name sounded like a promise. Now it seemed more like an instruction, something printed for people who already knew which way to go.

The loudspeaker announced the last service. A child asked whether the station was closing forever. Her father said only for the night. Mara watched them leave beneath the bright departure board. On it, every destination had a time, except Northbridge. She put the timetable in her coat and walked toward the exit, carrying no suitcase. Outside, the rain had stopped, but the pavement still held the shape of it.

Select the readings supported by the wording and details of the extract.
'''
options = ["The new clock’s accuracy contrasts with the emotional significance Mara attaches to the old time.", "The brother’s exact destination and reason for leaving are stated directly.", "The final image allows the reader to infer that the rain has stopped while traces of it remain.", "The child’s question establishes that the station will close permanently.", "The passage withholds some biographical facts rather than resolving every implication."]
answer = [0, 2, 4]
explanation = "Câu 1 và 3 dựa trên đối lập, hình ảnh cụ thể; câu 5 nhận ra khoảng trống được giữ lại có chủ ý. Đoạn trích không nêu đích đến/lý do ra đi hay việc nhà ga đóng vĩnh viễn."

[[questions]]
id = "cefr-c2-x056"
module = "cefr-c2-mediation"
type = "essay"
difficulty = 3
prompt = '''
Source A — Two urban branches tested a new digital queue for three months. Average waiting time fell from 14 minutes to 9 minutes, and 67 of 90 staff respondents said routine requests were easier to process. The review did not use a comparison group; one branch also added a staff member during the pilot. The authors recommend testing the system for longer before expanding it.

Source B — A six-month observation at three rural branches found that waiting times fell during the first two weeks but returned to their previous level by month four. Staff interviews noted that some older visitors and people with limited internet access preferred assisted service. The report recommends retaining a staffed and paper-based route while testing any digital changes across a wider range of branches.

Write three sentences for a regional director. Preserve each source’s main finding, explain why results may differ by setting, and recommend a cautious next step without claiming that either study settles the issue.
'''
keywords = [["short-term gain", "waiting time fell", "fell from 14 minutes to 9"], ["no lasting change", "returned to their previous level", "no sustained reduction"], ["urban and rural", "different settings", "results differ by setting"], ["retain an assisted route", "keep a staffed route", "wider pilot", "test across branches"]]
min_keywords = 4
model_answer = "Source A reports a short-term gain: average waits at two urban branches fell from 14 to 9 minutes, although one branch added staff. Source B found no lasting change: waits at three rural branches returned to their previous level by month four, and some visitors preferred assisted service. The results differ by setting and method, so the director should retain an assisted route with staffed and paper options while testing the system in a longer, wider pilot."
explanation = "Bản tổng hợp nêu rõ kết quả và bối cảnh của từng nguồn, giải thích khác biệt có thể do địa điểm/phương pháp, rồi đề xuất bước tiếp theo thận trọng."
