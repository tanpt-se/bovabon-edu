[[questions]]
id = "php-laravel-lvc01"
module = "php-laravel-lead"
type = "code"
difficulty = 3
tags = ["level:lead", "release"]
lang = "php"
title = "Rollout theo phần trăm ổn định"
prompt = '''Viết `inRollout(string $key, int $percent): bool` quyết định một người dùng có nằm trong đợt rollout hay không.

- `$percent <= 0` luôn trả `false`; `$percent >= 100` luôn trả `true`.
- Ngược lại, tính bucket `crc32($key) % 100` và trả `true` khi bucket nhỏ hơn `$percent`.

Nhờ đó cùng một key luôn cho cùng kết quả và người đã được bật ở 10% vẫn được bật khi tăng lên 30%.'''
starter = '''function inRollout(string $key, int $percent): bool {
    return false;
}
'''
solution = '''function inRollout(string $key, int $percent): bool {
    if ($percent <= 0) {
        return false;
    }
    if ($percent >= 100) {
        return true;
    }
    return crc32($key) % 100 < $percent;
}
'''
tests = '''test('0 phan tram khong bat ai', function () {
    expect(inRollout('user-1', 0))->toBeFalse();
    expect(inRollout('user-2', -5))->toBeFalse();
});

test('100 phan tram bat tat ca', function () {
    expect(inRollout('user-1', 100))->toBeTrue();
    expect(inRollout('user-9', 150))->toBeTrue();
});

test('dung bucket crc32', function () {
    $b = crc32('user-42') % 100;
    expect(inRollout('user-42', $b + 1))->toBeTrue();
    expect(inRollout('user-42', $b))->toBeFalse();
});

test('tang phan tram khong loai nguoi da duoc bat', function () {
    $ok = true;
    for ($i = 0; $i < 200; $i++) {
        if (inRollout("u$i", 10) && !inRollout("u$i", 30)) {
            $ok = false;
        }
    }
    expect($ok)->toBeTrue();
});

test('ty le xap xi phan tram', function () {
    $n = 0;
    for ($i = 0; $i < 1000; $i++) {
        if (inRollout("member-$i", 30)) {
            $n++;
        }
    }
    expect($n)->toBeGreaterThan(200);
    expect($n)->toBeLessThan(400);
});
'''
hints = ["Xử lý hai biên 0 và 100 trước.", "Bucket cố định theo key nên tăng phần trăm chỉ thêm người, không bớt người."]
explanation = "Băm key vào bucket cố định cho kết quả ổn định giữa các request, là nền tảng của rollout dần và canary."
sources = ["laravel~11/docs/11.x/pennant"]

