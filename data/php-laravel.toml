[[questions]]
id = "php-laravel-dvc02"
module = "php-laravel-dv-api"
type = "code"
difficulty = 2
lang = "php"
title = "Phân trang danh sách kết quả"
prompt = '''Viết `paginateRecords(array $items, int $perPage, int $page): array`. Trả về mảng có `data` là lát cắt đúng trang và `meta` gồm `current_page`, `per_page`, `total`, `last_page`. `page` và `perPage` phải từ 1 trở lên, nếu không ném `InvalidArgumentException`. `last_page` tối thiểu là 1 kể cả danh sách rỗng. Nếu page lớn hơn last_page thì `data` là mảng rỗng và `current_page` vẫn là page được yêu cầu.'''
starter = '''function paginateRecords(array $items, int $perPage, int $page): array {
    return ['data' => [], 'meta' => []];
}
'''
solution = '''function paginateRecords(array $items, int $perPage, int $page): array {
    if ($perPage < 1 || $page < 1) {
        throw new InvalidArgumentException('Page and page size must be positive');
    }
    $total = count($items);
    $lastPage = max(1, (int) ceil($total / $perPage));
    $offset = ($page - 1) * $perPage;
    return [
        'data' => array_slice($items, $offset, $perPage),
        'meta' => [
            'current_page' => $page,
            'per_page' => $perPage,
            'total' => $total,
            'last_page' => $lastPage,
        ],
    ];
}
'''
tests = '''$items = ['a', 'b', 'c', 'd', 'e'];

test('trang dau co metadata', function () use ($items) {
    $result = paginateRecords($items, 2, 1);
    expect($result['data'])->toEqual(['a', 'b']);
    expect($result['meta'])->toEqual(['current_page' => 1, 'per_page' => 2, 'total' => 5, 'last_page' => 3]);
});

test('trang giua lay dung offset', function () use ($items) {
    expect(paginateRecords($items, 2, 2)['data'])->toEqual(['c', 'd']);
});

test('trang cuoi co it phan tu hon page size', function () use ($items) {
    expect(paginateRecords($items, 2, 3)['data'])->toEqual(['e']);
});

test('page vuot cuoi tra mang rong', function () use ($items) {
    expect(paginateRecords($items, 2, 9)['data'])->toEqual([]);
    expect(paginateRecords($items, 2, 9)['meta']['current_page'])->toBe(9);
});

test('danh sach rong van co mot last page', function () {
    expect(paginateRecords([], 10, 1)['meta']['last_page'])->toBe(1);
});

test('tu choi page hoac page size khong duong', function () use ($items) {
    expect(fn () => paginateRecords($items, 0, 1))->toThrow(InvalidArgumentException::class);
    expect(fn () => paginateRecords($items, 2, 0))->toThrow(InvalidArgumentException::class);
});
'''
hints = ["Tính offset từ page và perPage sau khi kiểm tra chúng.", "Tính last_page bằng ceil(total / perPage), rồi đảm bảo giá trị nhỏ nhất là 1."]
explanation = "Metadata phân trang là một phần của response contract; kiểm thử cả trang cuối và danh sách rỗng để tránh lỗi biên."
sources = ["laravel~11/docs/11.x/pagination", "laravel~11/docs/11.x/responses"]

[[modules]]
id = "php-laravel-dv-http-client"
title = "HTTP Client và tích hợp dịch vụ"
description = "Gọi dịch vụ ngoài có timeout, xử lý response rõ ràng và kiểm thử không cần mạng."
sources = ["laravel~11/docs/11.x/http-client", "laravel~11/docs/11.x/http-tests", "laravel~11/docs/11.x/rate-limiting", "laravel~11/docs/11.x/responses"]
lesson = '''
### Gọi HTTP có kiểm soát
Laravel HTTP Client cung cấp API fluent để đặt header, gửi payload và đọc response từ dịch vụ ngoài. Hãy đặt timeout tường minh để request không giữ worker vô hạn. HTTP status lỗi như 404 hoặc 503 thường vẫn trả về một response object; kiểm tra `successful`, `failed` hoặc gọi `throw()` khi muốn chuyển status 4xx/5xx thành exception. Lỗi kết nối và lỗi status là hai tình huống khác nhau, cần log và phản hồi theo chính sách riêng.

| Nhu cầu | Công cụ | Lưu ý |
|---|---|---|
| Giới hạn thời gian chờ | `timeout` | Chọn ngưỡng theo SLA của dependency |
| Thử lại lỗi tạm thời | `retry` | Giới hạn số lần và thời gian chờ |
| Xử lý status không thành công | `failed` hoặc `throw` | Không coi mọi response là thành công |
| Kiểm thử request | `Http::fake` và assertion | Không gọi dịch vụ thật trong test |

Ví dụ:
```php
$response = Http::timeout(3)->retry(2, 100)->get($url);
$response->throw();
```

Retry có thể tạo tác dụng phụ nếu request ghi dữ liệu đã được xử lý ở đầu bên kia. Với thao tác tạo giao dịch, chỉ retry khi thiết kế idempotent hoặc gửi khóa idempotency mà dịch vụ thực sự hỗ trợ. Nên retry lỗi tạm thời có giới hạn, tránh lặp vô tận hoặc retry mọi lỗi 4xx. Test có thể cấu hình `Http::fake` để mô phỏng status/body và xác nhận method, URL, header, payload; nhờ đó test ổn định và không phụ thuộc mạng. Lỗi hay gặp là quên timeout, bỏ qua status lỗi hoặc dùng fake sau khi request đã được gửi.
'''

