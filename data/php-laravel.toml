[[questions]]
id = "php-laravel-lvc02"
module = "laravel-services"
type = "code"
difficulty = 3
tags = ["level:senior", "queue"]
lang = "php"
title = "Exponential backoff có trần"
prompt = '''Viết `backoffSeconds(int $attempt, int $base, int $cap): int` tính thời gian chờ trước lần retry thứ `$attempt`.

- `$attempt <= 0` trả `0`.
- Ngược lại thời gian chờ là `$base * 2^($attempt - 1)` nhưng không vượt quá `$cap`.
- Không được tràn số với `$attempt` lớn (ví dụ 200).'''
starter = '''function backoffSeconds(int $attempt, int $base, int $cap): int {
    return 0;
}
'''
solution = '''function backoffSeconds(int $attempt, int $base, int $cap): int {
    if ($attempt <= 0) {
        return 0;
    }
    $delay = $base;
    for ($i = 1; $i < $attempt; $i++) {
        if ($delay >= $cap) {
            return $cap;
        }
        $delay *= 2;
    }
    return min($delay, $cap);
}
'''
tests = '''test('lan dau bang base', function () {
    expect(backoffSeconds(1, 10, 600))->toBe(10);
});

test('nhan doi moi lan', function () {
    expect(backoffSeconds(2, 10, 600))->toBe(20);
    expect(backoffSeconds(4, 10, 600))->toBe(80);
});

test('khong vuot tran', function () {
    expect(backoffSeconds(7, 10, 600))->toBe(600);
});

test('attempt lon khong tran so', function () {
    expect(backoffSeconds(200, 5, 3600))->toBe(3600);
});

test('attempt khong duong tra 0', function () {
    expect(backoffSeconds(0, 10, 600))->toBe(0);
    expect(backoffSeconds(-3, 10, 600))->toBe(0);
});
'''
hints = ["Nhân đôi trong vòng lặp và dừng sớm khi đã chạm trần.", "Kết quả phải là int; tránh dùng `**` với số mũ lớn vì có thể thành float."]
explanation = "Backoff tăng dần có trần giúp hệ thống phụ thuộc có thời gian hồi phục mà job không phải chờ vô hạn."
sources = ["laravel~11/docs/11.x/queues"]

