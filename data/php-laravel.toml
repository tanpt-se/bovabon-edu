[[questions]]
id = "php-037"
module = "laravel-services"
type = "code"
difficulty = 3
tags = ["level:senior"]
lang = "php"
title = "Validator rule cơ bản"
prompt = '''
Viết validateData(array $data, array $rules): array cho mỗi field có chuỗi rule phân tách bằng |. Hỗ trợ required, email và min:n. Trả mảng lỗi theo field; giá trị mỗi field là danh sách tên rule thất bại, theo thứ tự khai báo. required thất bại khi field thiếu, null hoặc chuỗi rỗng sau trim; nếu required thất bại thì bỏ qua rule còn lại của field. Field trống không required thì bỏ qua rule khác. email dùng filter_var với FILTER_VALIDATE_EMAIL. min:n chỉ chấp nhận string có strlen ít nhất n; kiểu khác thất bại. Rule không hỗ trợ được bỏ qua.
'''
starter = '''
function validateData(array $data, array $rules): array {
    return [];
}
'''
solution = '''
function validateData(array $data, array $rules): array {
    $errors = [];
    foreach ($rules as $field => $ruleString) {
        $fieldRules = explode('|', $ruleString);
        $present = array_key_exists($field, $data);
        $value = $present ? $data[$field] : null;
        $empty = !$present || $value === null || (is_string($value) && trim($value) === '');

        if (in_array('required', $fieldRules, true) && $empty) {
            $errors[$field] = ['required'];
            continue;
        }
        if ($empty) {
            continue;
        }

        foreach ($fieldRules as $rule) {
            if ($rule === 'required') {
                continue;
            }
            if ($rule === 'email') {
                if (!is_string($value) || filter_var($value, FILTER_VALIDATE_EMAIL) === false) {
                    $errors[$field][] = 'email';
                }
                continue;
            }
            if (str_starts_with($rule, 'min:')) {
                $minimum = (int) substr($rule, 4);
                if (!is_string($value) || strlen($value) < $minimum) {
                    $errors[$field][] = $rule;
                }
            }
        }
    }
    return $errors;
}
'''
tests = '''
test('du lieu hop le khong co loi', function () {
    expect(validateData(['email' => 'a@example.com', 'name' => 'Ana'], [
        'email' => 'required|email',
        'name' => 'required|min:3',
    ]))->toEqual([]);
});

test('required bat field thieu va chuoi trang', function () {
    expect(validateData(['name' => '   '], [
        'email' => 'required|email',
        'name' => 'required|min:3',
    ]))->toEqual(['email' => ['required'], 'name' => ['required']]);
});

test('email khong hop le duoc bao loi', function () {
    expect(validateData(['email' => 'not-an-email'], ['email' => 'required|email']))
        ->toEqual(['email' => ['email']]);
});

test('min dem do dai chuoi va giu rule name', function () {
    expect(validateData(['name' => 'Al'], ['name' => 'required|min:3']))
        ->toEqual(['name' => ['min:3']]);
});

test('field khong required va rong bo qua rule khac', function () {
    expect(validateData(['email' => ''], ['email' => 'email|min:3']))->toEqual([]);
});

test('min khong chap nhan gia tri khong phai string', function () {
    expect(validateData(['name' => 123], ['name' => 'min:3']))->toEqual(['name' => ['min:3']]);
});
'''
hints = ["Tách rule bằng dấu | và xác định trường hợp rỗng trước.", "required thất bại thì ghi lỗi rồi bỏ qua các rule khác của field đó."]
explanation = "Validator tách việc xác định trạng thái rỗng khỏi kiểm tra từng rule và trả lỗi có cấu trúc."
sources = ["laravel~11/docs/11.x/validation"]

[[modules]]
id = "php-laravel-dv-errors"
title = "PHP Errors và Exception"
description = "Phân biệt Error, Exception và Throwable; xử lý lỗi theo đúng ranh giới."
sources = ["php/language.errors", "php/language.exceptions", "php/class.throwable", "php/class.error", "php/class.exception"]
lesson = '''
### Mô hình lỗi trong PHP
Trong PHP, `Throwable` là giao diện gốc mà cả `Error` lẫn `Exception` triển khai. `Exception` thường biểu diễn tình huống nghiệp vụ hoặc đầu vào không hợp lệ mà chương trình dự kiến có thể xử lý; `Error` thường báo lỗi thực thi hoặc lỗi lập trình như `TypeError`. Vì vậy `catch (Exception $e)` không bắt được mọi lỗi có thể ném ra.

| Nhóm | Ví dụ | Cách xử lý thường gặp |
|---|---|---|
| `Exception` | `InvalidArgumentException` | Bắt gần nơi có thể báo lỗi đầu vào hoặc đổi luồng nghiệp vụ |
| `Error` | `TypeError` | Sửa nguyên nhân; chỉ bắt ở ranh giới cần ghi nhận hoặc dọn dẹp |
| `Throwable` | cả hai nhóm | Dùng khi tầng ranh giới thật sự cần quan sát mọi lỗi rồi chuyển tiếp |

Ví dụ:
```php
function requirePositiveId(int $id): int {
    if ($id <= 0) {
        throw new InvalidArgumentException('ID must be positive');
    }
    return $id;
}
```

Các `catch` được xét theo thứ tự, nên nhánh cụ thể phải đứng trước nhánh rộng. `finally` phù hợp để giải phóng tài nguyên hoặc hoàn tất dọn dẹp dù khối `try` thành công hay ném lỗi. Lỗi hay gặp là bắt `Throwable` ở mọi nơi rồi trả `null`, làm mất nguyên nhân và khiến trạng thái sai khó truy vết; hãy bắt loại lỗi mà tầng hiện tại có thể xử lý, còn lỗi không biết cách phục hồi thì chuyển tiếp.
'''

