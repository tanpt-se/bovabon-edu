[[questions]]
id = "php-laravel-dvc03"
module = "php-laravel-dv-http-client"
type = "code"
difficulty = 2
tags = ["level:middle"]
lang = "php"
title = "Tính backoff có giới hạn"
prompt = '''Viết `retryDelayMs(int $attempt, int $baseMs, int $maxMs): int` cho backoff lũy thừa. Lần thử bắt đầu từ 1; độ trễ lần đầu là `baseMs`, mỗi lần tiếp theo gấp đôi, nhưng không vượt quá `maxMs`. `attempt` phải trong khoảng 1 đến 20, `baseMs` và `maxMs` không âm; dữ liệu ngoài giới hạn phải ném `InvalidArgumentException`.'''
starter = '''function retryDelayMs(int $attempt, int $baseMs, int $maxMs): int {
    return 0;
}
'''
solution = '''function retryDelayMs(int $attempt, int $baseMs, int $maxMs): int {
    if ($attempt < 1 || $attempt > 20 || $baseMs < 0 || $maxMs < 0) {
        throw new InvalidArgumentException('Invalid retry settings');
    }
    $delay = $baseMs;
    for ($i = 1; $i < $attempt; $i++) {
        if ($delay >= $maxMs) {
            return $maxMs;
        }
        if ($delay > intdiv($maxMs, 2)) {
            return $maxMs;
        }
        $delay *= 2;
    }
    return min($delay, $maxMs);
}
'''
tests = '''test('lan thu nhat dung base delay', function () {
    expect(retryDelayMs(1, 100, 1000))->toBe(100);
});

test('nhan doi theo lan thu', function () {
    expect(retryDelayMs(4, 100, 1000))->toBe(800);
});

test('khong vuot qua max', function () {
    expect(retryDelayMs(5, 100, 700))->toBe(700);
});

test('max nho hon base thi dung max', function () {
    expect(retryDelayMs(1, 1000, 300))->toBe(300);
});

test('base bang zero van bang zero', function () {
    expect(retryDelayMs(10, 0, 500))->toBe(0);
});

test('tu choi attempt ngoai gioi han', function () {
    expect(fn () => retryDelayMs(0, 100, 1000))->toThrow(InvalidArgumentException::class);
    expect(fn () => retryDelayMs(21, 100, 1000))->toThrow(InvalidArgumentException::class);
});

test('tu choi do tre am', function () {
    expect(fn () => retryDelayMs(1, -1, 1000))->toThrow(InvalidArgumentException::class);
    expect(fn () => retryDelayMs(1, 10, -1))->toThrow(InvalidArgumentException::class);
});
'''
hints = ["Kiểm tra giới hạn đầu vào trước khi tính.", "Dừng sớm khi delay đã chạm max hoặc phép nhân tiếp theo có thể vượt max."]
explanation = "Backoff có giới hạn giảm retry dồn dập; khi triển khai thật cần ghép với timeout và phân loại lỗi tạm thời."
sources = ["laravel~11/docs/11.x/http-client", "laravel~11/docs/11.x/rate-limiting"]

[[modules]]
id = "php-laravel-dv-events"
title = "Events, Notifications và Mail"
description = "Tách domain events khỏi side effects và gửi thông báo qua kênh phù hợp."
sources = ["laravel~11/docs/11.x/events", "laravel~11/docs/11.x/notifications", "laravel~11/docs/11.x/mail", "laravel~11/docs/11.x/queues", "laravel~11/docs/11.x/broadcasting", "laravel~11/docs/11.x/testing"]
lesson = '''
### Tách sự kiện khỏi việc gửi thông báo
Domain event diễn đạt một việc đã xảy ra, chẳng hạn `OrderPaid`; listener phản ứng với sự kiện đó bằng cách cập nhật projection, gửi email hoặc đẩy thông tin sang hệ thống khác. Cách này giúp controller không phải biết mọi side effect. Event mô tả sự kiện nghiệp vụ, còn notification chọn người nhận và kênh như mail, database hoặc broadcast. Mail phù hợp khi cần tạo nội dung email cụ thể; Notification hữu ích khi cùng một thông điệp có thể đi qua nhiều channel.

| Công cụ | Trách nhiệm | Ví dụ |
|---|---|---|
| Event | Mô tả sự việc đã xảy ra | `OrderPaid` |
| Listener | Phản ứng với event | tạo biên nhận |
| Notification | Chọn nội dung, người nhận và channel | mail + database |
| Queue | Chuyển việc chậm sang worker | gửi email ngoài request |

Ví dụ gửi notification tới nhiều người dùng:
```php
Notification::send($users, new InvoicePaid($invoice));
```

Listener hoặc notification triển khai `ShouldQueue` khi công việc chậm cần chạy nền; queue vẫn cần retry có giới hạn và xử lý lỗi cuối cùng. Nếu event gắn với dữ liệu trong transaction, dispatch sau commit để listener không đọc bản ghi chưa được commit. Trong test, `Notification::fake` và `Event::fake` kiểm tra việc phát sinh thông báo hoặc event mà không gửi thật. Lỗi hay gặp là gửi email đồng bộ trong request, phát event trước khi transaction commit, hoặc coi retry là bảo đảm không có side effect trùng lặp.
'''

[[questions]]
id = "php-laravel-dv022"
