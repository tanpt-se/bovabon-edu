[[questions]]
id = "php-026"
module = "laravel-data"
type = "code"
difficulty = 3
lang = "php"
title = "Collection mini fluent"
prompt = '''
Viết MiniCollection nhận array và cung cấp map(callable), filter(?callable), pluck(string $key), groupBy(string|callable) và all(). Các thao tác trả MiniCollection mới và giữ key gốc khi phù hợp. map callback nhận (item, key); filter callback nhận (item, key), còn filter không callback giữ truthy item. pluck đọc field từ array hoặc public property của object; field thiếu thành null. groupBy nhận tên field hoặc callback (item, key), tạo nhóm theo giá trị scalar và giữ key gốc trong từng nhóm.
'''
starter = '''
class MiniCollection {
    public function __construct(array $items) {}
    public function map(callable $callback): self { return $this; }
    public function filter(?callable $callback = null): self { return $this; }
    public function pluck(string $key): self { return $this; }
    public function groupBy(string|callable $selector): self { return $this; }
    public function all(): array { return []; }
}
'''
solution = '''
class MiniCollection {
    private array $items;

    public function __construct(array $items) {
        $this->items = $items;
    }

    public function map(callable $callback): self {
        $result = [];
        foreach ($this->items as $key => $item) {
            $result[$key] = $callback($item, $key);
        }
        return new self($result);
    }

    public function filter(?callable $callback = null): self {
        $result = [];
        foreach ($this->items as $key => $item) {
            $keep = $callback === null ? (bool) $item : (bool) $callback($item, $key);
            if ($keep) {
                $result[$key] = $item;
            }
        }
        return new self($result);
    }

    private function valueFrom(mixed $item, string $key): mixed {
        if (is_array($item)) {
            return $item[$key] ?? null;
        }
        if (is_object($item)) {
            $values = get_object_vars($item);
            return array_key_exists($key, $values) ? $values[$key] : null;
        }
        return null;
    }

    public function pluck(string $key): self {
        $result = [];
        foreach ($this->items as $itemKey => $item) {
            $result[$itemKey] = $this->valueFrom($item, $key);
        }
        return new self($result);
    }

    public function groupBy(string|callable $selector): self {
        $groups = [];
        foreach ($this->items as $key => $item) {
            $group = is_callable($selector)
                ? $selector($item, $key)
                : $this->valueFrom($item, $selector);
            if ($group === null) {
                $group = '';
            } elseif (is_bool($group)) {
                $group = (int) $group;
            } elseif (!is_int($group) && !is_string($group)) {
                $group = (string) $group;
            }
            $groups[$group][$key] = $item;
        }
        return new self($groups);
    }

    public function all(): array {
        return $this->items;
    }
}
'''
tests = '''
test('map giu key va nhan item va key', function () {
    $result = (new MiniCollection([4 => 2, 7 => 3]))
        ->map(fn ($item, $key) => $item * $key)
        ->all();
    expect($result)->toEqual([4 => 8, 7 => 21]);
});

test('filter voi callback va mac dinh', function () {
    expect((new MiniCollection([1, 2, 3, 4]))->filter(fn ($n) => $n % 2 === 0)->all())->toEqual([1 => 2, 3 => 4]);
    expect((new MiniCollection([0, 'x', '', 2]))->filter()->all())->toEqual([1 => 'x', 3 => 2]);
});

test('pluck doc array va object va giu key', function () {
    $object = (object) ['name' => 'Bo'];
    $items = new MiniCollection([3 => ['name' => 'An'], 8 => $object, 9 => []]);
    expect($items->pluck('name')->all())->toEqual([3 => 'An', 8 => 'Bo', 9 => null]);
});

test('groupBy theo field giu key item', function () {
    $items = new MiniCollection([
        5 => ['role' => 'admin', 'name' => 'An'],
        8 => ['role' => 'user', 'name' => 'Bo'],
        9 => ['role' => 'admin', 'name' => 'Chi'],
    ]);
    expect($items->groupBy('role')->all())->toEqual([
        'admin' => [5 => ['role' => 'admin', 'name' => 'An'], 9 => ['role' => 'admin', 'name' => 'Chi']],
        'user' => [8 => ['role' => 'user', 'name' => 'Bo']],
    ]);
});

test('cac phep bien doi chain duoc', function () {
    $result = (new MiniCollection([
        ['name' => 'An', 'active' => true],
        ['name' => 'Bo', 'active' => false],
        ['name' => 'Chi', 'active' => true],
    ]))->filter(fn ($item) => $item['active'])->pluck('name')->map(fn ($name) => strtoupper($name))->all();
    expect($result)->toEqual([0 => 'AN', 2 => 'CHI']);
});

test('groupBy chap nhan callback', function () {
    $result = (new MiniCollection([1, 2, 3, 4]))->groupBy(fn ($n) => $n % 2 ? 'odd' : 'even')->all();
    expect($result)->toEqual(['odd' => [0 => 1, 2 => 3], 'even' => [1 => 2, 3 => 4]]);
});
'''
hints = ["Viết mỗi phép biến đổi bằng vòng lặp để chủ động giữ key.", "Dùng get_object_vars để chỉ đọc public property của object."]
explanation = "Collection fluent đóng gói thao tác trên mảng và trả collection mới để chain."
sources = ["laravel~11/docs/11.x/collections"]

[[questions]]
id = "php-027"
module = "laravel-data"
type = "code"
difficulty = 3
lang = "php"
title = "Phát hiện query dạng N+1"
prompt = '''
Viết detectNPlusOne(array $queryLog, int $threshold = 3): array. Log là danh sách SQL query dạng string. Chuẩn hóa chữ thường, khoảng trắng, dấu chấm phẩy cuối và literal số hoặc chuỗi nháy đơn thành dấu ?. Chỉ xét câu SELECT; nhóm query theo SQL đã chuẩn hóa. Trả associative array normalized SQL => số lần xuất hiện cho những nhóm có count >= threshold, theo thứ tự nhóm xuất hiện đầu tiên. Đây là heuristic phát hiện cùng shape query lặp, không cần phân tích SQL đầy đủ.
'''
starter = '''
function detectNPlusOne(array $queryLog, int $threshold = 3): array {
    return [];
}
'''
solution = '''
function detectNPlusOne(array $queryLog, int $threshold = 3): array {
    $counts = [];
    foreach ($queryLog as $sql) {
        if (!is_string($sql)) {
            continue;
        }
        $normalized = strtolower(trim($sql));
        $normalized = preg_replace('/;\\s*$/', '', $normalized);
        $normalized = preg_replace('/\\s+/', ' ', $normalized);
        $normalized = preg_replace("/'[^']*'/", '?', $normalized);
        $normalized = preg_replace('/\\b[0-9]+(?:\\.[0-9]+)?\\b/', '?', $normalized);
        $normalized = preg_replace('/\\s*=\\s*/', ' = ', $normalized);
        if (!preg_match('/^select\\b/', $normalized)) {
            continue;
        }
        $counts[$normalized] = ($counts[$normalized] ?? 0) + 1;
    }

    $repeated = [];
    foreach ($counts as $query => $count) {
        if ($count >= $threshold) {
            $repeated[$query] = $count;
        }
    }
    return $repeated;
}
'''
tests = '''
test('nhom select theo shape va thay literal bang dau hoi', function () {
    $queries = [
        "SELECT * FROM posts WHERE user_id = 1;",
        "select *  from posts where user_id=2",
        "SELECT * FROM posts WHERE user_id = 3",
    ];
    expect(detectNPlusOne($queries))->toEqual(['select * from posts where user_id = ?' => 3]);
});

test('mac dinh khong tra nhom it hon ba lan', function () {
    $queries = [
        'select * from posts where user_id = 1',
        'select * from posts where user_id = 2',
    ];
    expect(detectNPlusOne($queries))->toEqual([]);
});

test('threshold tuy chinh', function () {
    $queries = [
        "select * from users where email = 'a@example.com'",
        "select * from users where email = 'b@example.com'",
    ];
    expect(detectNPlusOne($queries, 2))->toEqual(['select * from users where email = ?' => 2]);
});

test('bo qua query khong phai select', function () {
    $queries = [
        'update posts set title = 1',
        'insert into posts (title) values (2)',
        'delete from posts where id = 3',
    ];
    expect(detectNPlusOne($queries, 1))->toEqual([]);
});

test('giu thu tu nhom theo lan xuat hien dau tien', function () {
    $queries = [
        'select * from comments where post_id = 1',
        'select * from posts where user_id = 1',
        'select * from comments where post_id = 2',
        'select * from posts where user_id = 2',
        'select * from posts where user_id = 3',
        'select * from comments where post_id = 3',
    ];
    expect(array_keys(detectNPlusOne($queries)))->toEqual([
        'select * from comments where post_id = ?',
        'select * from posts where user_id = ?',
    ]);
});

test('dau nhay don va chuoi nhieu khoang trang duoc chuan hoa', function () {
    $queries = [
        "SELECT name FROM users WHERE name = 'An Le'",
        "select  name from users where name = 'Bo Tran'",
        "SELECT name FROM users WHERE name = 'Chi'",
    ];
    expect(detectNPlusOne($queries))->toEqual(['select name from users where name = ?' => 3]);
});
'''
hints = ["Chuẩn hóa query trước, rồi mới đếm theo chuỗi chuẩn hóa.", "Giữ mảng đếm có thứ tự và lọc theo threshold sau khi duyệt log."]
explanation = "N+1 thường tạo nhiều query cùng cấu trúc nhưng khác literal khóa liên kết."
sources = ["laravel~11/docs/11.x/eloquent-relationships"]

