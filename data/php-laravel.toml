[[questions]]
id = "php-laravel-dvc04"
module = "php-laravel-dv-events"
type = "code"
difficulty = 2
lang = "php"
title = "Khử trùng người nhận thông báo"
prompt = '''Viết `uniqueRecipientIds(array $ids): array`. Chỉ giữ các ID là integer dương, loại bỏ ID trùng lặp và giữ thứ tự xuất hiện đầu tiên. Giá trị không phải integer dương phải bị bỏ qua; không ép chuỗi số thành integer.'''
starter = '''function uniqueRecipientIds(array $ids): array {
    return [];
}
'''
solution = '''function uniqueRecipientIds(array $ids): array {
    $unique = [];
    foreach ($ids as $id) {
        if (!is_int($id) || $id < 1) {
            continue;
        }
        if (!in_array($id, $unique, true)) {
            $unique[] = $id;
        }
    }
    return $unique;
}
'''
tests = '''test('loai id trung va giu thu tu dau tien', function () {
    expect(uniqueRecipientIds([7, 2, 7, 4, 2]))->toEqual([7, 2, 4]);
});

test('bo qua id khong duong', function () {
    expect(uniqueRecipientIds([0, -1, 3]))->toEqual([3]);
});

test('bo qua gia tri sai kieu khong ep kieu', function () {
    expect(uniqueRecipientIds(['3', true, 3.0, 5]))->toEqual([5]);
});

test('danh sach rong tra rong', function () {
    expect(uniqueRecipientIds([]))->toEqual([]);
});

test('khong lam thay doi mang dau vao', function () {
    $ids = [8, 8, 9];
    uniqueRecipientIds($ids);
    expect($ids)->toEqual([8, 8, 9]);
});
'''
hints = ["Duyệt một lần và thêm ID hợp lệ vào mảng kết quả.", "Dùng so sánh strict khi kiểm tra ID đã tồn tại để không gộp giá trị khác kiểu."]
explanation = "Khử trùng danh sách người nhận giúp tránh gửi thông báo lặp khi cùng user xuất hiện từ nhiều nguồn."
sources = ["laravel~11/docs/11.x/notifications", "laravel~11/docs/11.x/events"]

