[[questions]]
id = "php-laravel-dvc04"
module = "php-laravel-dv-events"
type = "code"
difficulty = 2
tags = ["level:middle"]
lang = "php"
title = "Khử trùng người nhận thông báo"
prompt = '''Viết `uniqueRecipientIds(array $ids): array`. Chỉ giữ các ID là integer dương, loại bỏ ID trùng lặp và giữ thứ tự xuất hiện đầu tiên. Giá trị không phải integer dương phải bị bỏ qua; không ép chuỗi số thành integer.'''
starter = '''function uniqueRecipientIds(array $ids): array {
    return [];
}
'''
solution = '''function uniqueRecipientIds(array $ids): array {
    $unique = [];
    foreach ($ids as $id) {
        if (!is_int($id) || $id < 1) {
            continue;
        }
        if (!in_array($id, $unique, true)) {
            $unique[] = $id;
        }
    }
    return $unique;
}
'''
tests = '''test('loai id trung va giu thu tu dau tien', function () {
    expect(uniqueRecipientIds([7, 2, 7, 4, 2]))->toEqual([7, 2, 4]);
});

test('bo qua id khong duong', function () {
    expect(uniqueRecipientIds([0, -1, 3]))->toEqual([3]);
});

test('bo qua gia tri sai kieu khong ep kieu', function () {
    expect(uniqueRecipientIds(['3', true, 3.0, 5]))->toEqual([5]);
});

test('danh sach rong tra rong', function () {
    expect(uniqueRecipientIds([]))->toEqual([]);
});

test('khong lam thay doi mang dau vao', function () {
    $ids = [8, 8, 9];
    uniqueRecipientIds($ids);
    expect($ids)->toEqual([8, 8, 9]);
});
'''
hints = ["Duyệt một lần và thêm ID hợp lệ vào mảng kết quả.", "Dùng so sánh strict khi kiểm tra ID đã tồn tại để không gộp giá trị khác kiểu."]
explanation = "Khử trùng danh sách người nhận giúp tránh gửi thông báo lặp khi cùng user xuất hiện từ nhiều nguồn."
sources = ["laravel~11/docs/11.x/notifications", "laravel~11/docs/11.x/events"]


[[modules]]
id = "php-laravel-lead"
title = "Góc nhìn Tech Lead"
description = "Ra quyết định kiến trúc cho ứng dụng Laravel ở quy mô team: tách module/domain, Octane, chiến lược queue & Horizon, nâng version framework."
sources = ["laravel~11/docs/11.x/structure", "laravel~11/docs/11.x/providers", "laravel~11/docs/11.x/packages", "laravel~11/docs/11.x/octane", "laravel~11/docs/11.x/horizon", "laravel~11/docs/11.x/queues", "laravel~11/docs/11.x/upgrade", "laravel~11/docs/11.x/pennant", "laravel~11/docs/11.x/deployment"]
lesson = '''
### Khung ra quyết định
Ở cấp Tech Lead, câu hỏi hiếm khi là "API này dùng thế nào" mà là "nên chọn phương án nào, chấp nhận đánh đổi gì, và làm sao rút lui nếu sai". Một khung đơn giản gồm năm bước:

1. **Nêu vấn đề bằng số liệu**: p95 latency, số job tồn đọng, số conflict merge mỗi tuần, thời gian onboard dev mới.
2. **Liệt kê ràng buộc**: quy mô team, ngân sách hạ tầng, SLA, kỹ năng hiện có, deadline kinh doanh.
3. **So sánh ít nhất hai phương án**, kể cả phương án "không làm gì".
4. **Chọn bước nhỏ nhất có thể đảo ngược** (feature flag, canary, chạy song song).
5. **Ghi lại bằng ADR** để người đến sau hiểu vì sao.

### Bảng so sánh các quyết định hay gặp
| Quyết định | Khi nên làm | Khi chưa nên | Rủi ro chính |
|---|---|---|---|
| Modular monolith (thư mục theo domain) | Team > 6 người, conflict nhiều ở `app/Models` | App nhỏ, một người bảo trì | Ranh giới module bị phá ngầm qua Eloquent relation |
| Tách microservice | Domain có vòng đời triển khai và tải khác hẳn | Ranh giới domain còn mờ | Giao dịch phân tán, vận hành phức tạp |
| Laravel Octane | Bootstrap chiếm phần lớn thời gian request, đã đo | Nút thắt là DB hoặc API ngoài | Rò rỉ state giữa request, memory leak |
| Tách queue theo mức ưu tiên + Horizon | Job chậm làm trễ job quan trọng | Lượng job rất thấp | Cấu hình worker sai làm đói queue |
| Package Composer nội bộ | Nhiều app dùng chung, chu kỳ phát hành khác nhau | Chỉ một app dùng | Chi phí semver và phát hành |

### Checklist review ở quy mô team
- Job mới có idempotent không? Có `tries`, `backoff`, `failed()` rõ ràng không?
- Truy vấn mới có eager loading, có index phù hợp chưa?
- Có state nào lưu trong singleton/static có thể rò rỉ giữa request (quan trọng nếu chạy Octane)?
- Migration có an toàn khi deploy không downtime (thêm cột nullable trước, xóa cột sau)?
- Thay đổi có feature flag hoặc đường rollback không?
- Code style và phân tích tĩnh được CI kiểm tra, không để reviewer bắt lỗi định dạng bằng tay.

### ADR mẫu ngắn
```text
ADR-007: Tách queue theo SLA
Bối cảnh: email reset mật khẩu trễ 20 phút vì job xuất báo cáo chiếm queue default.
Quyết định: 3 queue high/default/reports, Horizon supervisor riêng, balance auto.
Phương án khác: tăng số worker chung (không giải quyết ưu tiên).
Hệ quả: thêm cấu hình Horizon; cần cảnh báo khi queue reports tồn đọng.
```

### Nâng version framework
Đọc upgrade guide, nâng dependency trước (`composer outdated`), sửa deprecation trong các PR nhỏ có test, chạy staging với dữ liệu gần thật, rồi mới phát hành; luôn chuẩn bị đường rollback (giữ artifact build cũ).

### Anti-pattern ở quy mô team
- Mỗi dev tự đặt cấu trúc thư mục, không có quy ước chung.
- Controller hàng nghìn dòng chứa toàn bộ nghiệp vụ.
- Job có retry nhưng không idempotent, gây trừ tiền hai lần.
- Bật Octane hay tách microservice vì "nghe nói nhanh hơn" mà không có số đo.
- Nâng major version trong một PR khổng lồ, không ai review nổi.
'''

