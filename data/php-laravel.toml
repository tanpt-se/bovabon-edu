id = "php-laravel"
title = "PHP & Laravel"
icon = "🐘"
color = "#777bb4"
group = "Backend"
docs = ["php", "laravel~11"]
description = "PHP hiện đại và các nền tảng thực hành Laravel 11: từ kiểu dữ liệu, OOP, request lifecycle đến Eloquent, validation, queue, cache và testing."

[[modules]]
id = "php-modern"
title = "PHP hiện đại"
description = "Type declarations, enum, readonly, match, named arguments, nullsafe operator và first-class callable."
sources = ["php/language.types.declarations", "php/language.enumerations.basics", "php/language.oop5.properties", "php/control-structures.match", "php/functions.arguments", "php/functions.first_class_callable_syntax", "php/language.operators"]
lesson = '''
### Kiểu và cú pháp hiện đại
Type declaration trên tham số, property và giá trị trả về giúp hợp đồng hàm rõ hơn. PHP hỗ trợ union types; enum có thể là pure hoặc backed enum. Readonly property chỉ khởi tạo một lần; readonly class có từ PHP 8.2. Match so sánh nghiêm ngặt và phải khớp một nhánh, nếu không sẽ ném UnhandledMatchError.

| Cú pháp | Dùng khi |
|---|---|
| int|string | chấp nhận một trong các kiểu |
| Status::Paid | trạng thái hữu hạn, có tên |
| match ($value) | ánh xạ một biểu thức thành kết quả |
| send(to: $email) | lời gọi dễ đọc với nhiều tham số |

Ví dụ:
    $label = match ($status) {
        'paid' => 'Complete',
        'pending' => 'Waiting',
        default => 'Unknown',
    };
    $handler = $service->handle(...);

Nullsafe operator ?. trả null khi vế trái null; nó không thay thế kiểm tra quyền truy cập hay validation. Named arguments gắn theo tên tham số và có thể bỏ tham số tùy chọn. First-class callable dùng cú pháp ... để tạo Closure có thể truyền đi. Lỗi thường gặp: nhầm match với switch về so sánh lỏng, hoặc cho rằng readonly làm object bất biến sâu.
'''

[[modules]]
id = "php-oop"
title = "OOP, Composer và PSR"
description = "Encapsulation, interface, trait, autoload và quy ước PSR-4 trong dự án PHP."
sources = ["php/language.oop5.basic", "php/language.oop5.interfaces", "php/language.oop5.traits", "php/language.oop5.autoload"]
lesson = '''
### Tổ chức mã PHP
Class gom trạng thái và hành vi; interface mô tả hợp đồng mà nhiều class có thể thực hiện. Trait chia sẻ implementation theo chiều ngang, nhưng lạm dụng nhiều trait có thể khiến nguồn gốc hành vi khó theo dõi. Composer quản lý dependency và tạo autoloader từ cấu hình composer.json.

| Thành phần | Vai trò | Ví dụ |
|---|---|---|
| interface | hợp đồng phương thức | PaymentGateway |
| trait | chia sẻ hành vi | LogsActivity |
| PSR-4 | ánh xạ namespace sang thư mục | App\\Services\\ → app/Services/ |

Composer thường được chạy bằng composer dump-autoload sau khi đổi cấu hình autoload. Namespace và tên file nên tuân theo ánh xạ PSR-4 để class được tìm tự động. Trong package, khai báo dependency và phiên bản có ràng buộc rõ ràng; không commit thư mục vendor như mã nguồn ứng dụng. Lỗi hay gặp là lệch chữ hoa thường giữa namespace, tên class và đường dẫn; vấn đề này có thể chỉ lộ ra trên filesystem phân biệt hoa thường.
'''

[[modules]]
id = "laravel-core"
title = "Laravel căn bản"
description = "Routing, controller, request lifecycle, middleware onion và Blade."
sources = ["laravel~11/docs/11.x/routing", "laravel~11/docs/11.x/controllers", "laravel~11/docs/11.x/lifecycle", "laravel~11/docs/11.x/middleware", "laravel~11/docs/11.x/blade", "laravel~11/docs/11.x/container"]
lesson = '''
### Từ request đến response
Trong Laravel 11, public/index.php nạp ứng dụng qua bootstrap/app.php; ứng dụng xử lý request, chạy middleware, khớp route, gọi controller và gửi response. Middleware có thể kiểm tra hoặc biến đổi request trước next, rồi xử lý response khi lời gọi next trả về — đây là cấu trúc onion.

| Thành phần | Trách nhiệm |
|---|---|
| Route | ghép method và URI với handler |
| Controller | điều phối xử lý cho một nhóm endpoint |
| Middleware | kiểm tra hoặc bổ sung xử lý quanh request |
| Blade | render view phía server |

Ví dụ route có thể trỏ tới [UserController::class, 'show']; tham số {user} có thể được route model binding phân giải. Blade dùng {{ $name }} để escape HTML; cú pháp {!! !!} xuất HTML thô và chỉ phù hợp với nội dung đã tin cậy. Trong Laravel 11, cấu hình middleware thường đặt trong bootstrap/app.php. Lỗi thường gặp: coi middleware chỉ chạy trước controller, hoặc xuất dữ liệu người dùng bằng cú pháp Blade không escape.
'''

[[modules]]
id = "laravel-data"
title = "Eloquent và database"
description = "Model, relationship, eager loading, migrations, query builder và vấn đề N+1."
sources = ["laravel~11/docs/11.x/eloquent", "laravel~11/docs/11.x/eloquent-relationships", "laravel~11/docs/11.x/migrations", "laravel~11/docs/11.x/queries", "laravel~11/docs/11.x/collections"]
lesson = '''
### Truy vấn và quan hệ dữ liệu
Eloquent model ánh xạ bảng; relationship mô tả liên kết như hasMany và belongsTo. Khi lặp qua nhiều model rồi đọc relationship chưa tải, mỗi lần đọc có thể phát sinh thêm query — đó là N+1. Eager loading bằng with('posts') tải quan hệ theo lô và thường giảm số query đáng kể.

| Nhu cầu | Công cụ |
|---|---|
| thay đổi schema có lịch sử | migration |
| truy vấn kiểu model | Eloquent |
| truy vấn linh hoạt không cần model | Query Builder |
| đọc quan hệ cho danh sách | with / load |

Ví dụ:
    $users = User::with('posts')->get();
    $recent = DB::table('orders')->where('status', 'paid')->get();

Migration nên có thao tác up/down phù hợp để thay đổi schema có thể kiểm soát. Query Builder bind giá trị an toàn, nhưng tên cột động không thể bind như value; whitelist cột sort từ input. Collection của Eloquent có API xử lý dữ liệu sau truy vấn, khác với việc xây query SQL. Lỗi thường gặp: bật eager loading nhưng truy cập một relationship khác, hoặc tạo query trong vòng lặp.
'''

[[modules]]
id = "laravel-services"
title = "Validation, auth và vận hành"
description = "Validation, authentication/authorization, queue, cache và kiểm thử ứng dụng."
sources = ["laravel~11/docs/11.x/validation", "laravel~11/docs/11.x/authentication", "laravel~11/docs/11.x/authorization", "laravel~11/docs/11.x/queues", "laravel~11/docs/11.x/cache", "laravel~11/docs/11.x/testing", "laravel~11/docs/11.x/database-testing", "laravel~11/docs/11.x/mocking"]
lesson = '''
### Các dịch vụ ứng dụng
Validation kiểm tra input ở ranh giới request; dữ liệu được validate mới nên chuyển vào nghiệp vụ. Authentication xác định danh tính, còn authorization quyết định người đó được làm gì. Queue phù hợp việc chậm như gửi email; job cần cân nhắc retry và tính idempotent. Cache giảm công việc lặp, nhưng phải xác định key, thời hạn và cách invalidation.

| Tác vụ | Gợi ý |
|---|---|
| xác thực input | Form Request hoặc Validator |
| kiểm soát quyền | policy hoặc gate |
| công việc nền | queue job và retry |
| giảm truy vấn lặp | cache có TTL rõ ràng |
| kiểm chứng hành vi | feature test và database test |

Ví dụ:
    $validated = $request->validate(['email' => ['required', 'email']]);
    SendReceipt::dispatch($order);

Laravel testing có thể kiểm tra response HTTP, database và queue bằng assertion hoặc fake tương ứng. Unit test phù hợp logic thuần; feature test kiểm tra nhiều thành phần cùng hoạt động. Lỗi thường gặp: nhầm đăng nhập thành được phép truy cập, cache dữ liệu quyền quá lâu, hoặc retry job gây tác dụng phụ trùng lặp.
'''

