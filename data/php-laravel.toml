[[questions]]
id = "php-laravel-dvc01"
module = "php-laravel-dv-errors"
type = "code"
difficulty = 2
tags = ["level:middle"]
lang = "php"
title = "Phân tích số nguyên dương an toàn"
prompt = '''Viết `positiveInt(mixed $value): int`. Hàm nhận một số nguyên dương hoặc chuỗi chỉ gồm chữ số thập phân; chuỗi có thể có khoảng trắng ở hai đầu và số 0 ở đầu. Trả về số nguyên đã chuẩn hóa. Với số 0, số âm, boolean, float, chuỗi có ký tự khác chữ số hoặc giá trị lớn hơn `PHP_INT_MAX`, ném `InvalidArgumentException`.'''
starter = '''function positiveInt(mixed $value): int {
    return 1;
}
'''
solution = '''function positiveInt(mixed $value): int {
    if (is_int($value)) {
        if ($value > 0) {
            return $value;
        }
        throw new InvalidArgumentException('Expected a positive integer');
    }
    if (!is_string($value)) {
        throw new InvalidArgumentException('Expected an integer or digit string');
    }
    $digits = trim($value);
    if ($digits === '' || !preg_match('/\\A[0-9]+\\z/', $digits)) {
        throw new InvalidArgumentException('Expected decimal digits');
    }
    $digits = ltrim($digits, '0');
    if ($digits === '') {
        throw new InvalidArgumentException('Expected a positive integer');
    }
    $maximum = (string) PHP_INT_MAX;
    if (strlen($digits) > strlen($maximum) || (strlen($digits) === strlen($maximum) && strcmp($digits, $maximum) > 0)) {
        throw new InvalidArgumentException('Integer is out of range');
    }
    return (int) $digits;
}
'''
tests = '''test('nhan integer duong', function () {
    expect(positiveInt(42))->toBe(42);
});

test('trim va bo so khong dau chuoi', function () {
    expect(positiveInt('  00042  '))->toBe(42);
});

test('tu choi zero', function () {
    expect(fn () => positiveInt('000'))->toThrow(InvalidArgumentException::class);
});

test('tu choi boolean va float', function () {
    expect(fn () => positiveInt(true))->toThrow(InvalidArgumentException::class);
    expect(fn () => positiveInt(2.5))->toThrow(InvalidArgumentException::class);
});

test('tu choi ky tu khong phai chu so', function () {
    expect(fn () => positiveInt('-12'))->toThrow(InvalidArgumentException::class);
    expect(fn () => positiveInt('12x'))->toThrow(InvalidArgumentException::class);
});

test('tu choi tran gioi han integer', function () {
    expect(fn () => positiveInt(str_repeat('9', strlen((string) PHP_INT_MAX) + 1)))->toThrow(InvalidArgumentException::class);
});
'''
hints = ["Xác nhận kiểu dữ liệu trước khi trim hoặc so khớp chuỗi.", "So độ dài và thứ tự từ điển của chuỗi chữ số với PHP_INT_MAX trước khi ép kiểu."]
explanation = "Kiểm tra biểu diễn trước khi ép kiểu tránh chấp nhận dữ liệu sai và tránh tràn số khi chuyển chuỗi sang integer."
sources = ["php/language.exceptions", "php/class.exception"]

[[modules]]
id = "php-laravel-dv-api"
title = "API Resources và phân trang"
description = "Thiết kế JSON response ổn định và chọn chiến lược phân trang phù hợp."
sources = ["laravel~11/docs/11.x/eloquent-resources", "laravel~11/docs/11.x/pagination", "laravel~11/docs/11.x/requests", "laravel~11/docs/11.x/responses"]
lesson = '''
### Response contract cho API
Eloquent Resource tạo một lớp trình bày riêng giữa model và JSON response. Thay vì trả nguyên model với mọi thuộc tính đang có, resource chọn rõ field công khai, đổi tên field khi cần và có thể định dạng dữ liệu lồng nhau. Nhờ vậy thay đổi schema nội bộ không vô tình phá hợp đồng của client. Với quan hệ, dùng cách kiểm tra đã được tải như `whenLoaded` để response không âm thầm kích hoạt thêm query.

| Chiến lược | Tổng số bản ghi | Hợp với | Điểm cần cân nhắc |
|---|---|---|---|
| `paginate` | Có | UI cần số trang và tổng số | Cần đếm tổng; có thể tốn kém trên tập lớn |
| `simplePaginate` | Không | Nút trước/sau đơn giản | Không có tổng số trang |
| `cursorPaginate` | Không | Bảng lớn, duyệt liên tục theo thứ tự | Cần thứ tự ổn định và cột cursor phù hợp |

Ví dụ:
```php
return UserResource::collection(User::with('profile')->paginate(25));
```

Laravel tạo response phân trang với `data`, `links` và `meta`; hãy kiểm tra cấu trúc mà client cần thay vì tự lắp metadata không nhất quán. Offset pagination tiện khi nhảy tới một trang bất kỳ, nhưng dữ liệu chèn/xóa giữa các lần tải có thể làm bản ghi lặp hoặc bị bỏ qua. Cursor pagination tiếp tục sau giá trị sắp xếp, thường ổn định và hiệu quả hơn cho danh sách lớn, nhưng không phù hợp khi cần nhảy thẳng đến trang 40. Lỗi hay gặp là phân trang không có `orderBy` ổn định hoặc Resource truy cập relationship chưa eager load.
'''

[[questions]]
id = "php-laravel-dv008"
module = "php-laravel-dv-api"
type = "single"
difficulty = 1
