min_keywords = 3
model_answer = '''Tôi đặt timeout theo SLA để worker không chờ vô hạn. Retry chỉ có số lần giới hạn và nhắm tới lỗi tạm thời. Vì timeout có thể xảy ra sau khi đối tác đã tạo giao dịch, thao tác cần idempotent hoặc dùng idempotency key được hai bên hỗ trợ. Trong test, tôi dùng Http::fake để mô phỏng response thành công, lỗi và kiểm tra request mà không gọi mạng thật.'''
explanation = "Câu trả lời cần xem timeout là kết quả chưa chắc chắn và bảo vệ thao tác ghi khỏi bị thực hiện lặp."
