[[questions]]
id = "php-018"
module = "laravel-core"
type = "code"
difficulty = 3
tags = ["level:senior"]
lang = "php"
title = "Service container tối giản"
prompt = '''
Viết class MiniContainer với bind(string $id, callable $factory), singleton(string $id, callable $factory) và resolve(string $id): mixed. Factory nhận container hiện tại làm tham số. bind tạo instance mới mỗi lần resolve; singleton chỉ gọi factory lần đầu rồi trả lại đúng instance đó. Đăng ký lại một id phải thay binding và xóa instance singleton cũ. Resolve id chưa đăng ký ném InvalidArgumentException.
'''
starter = '''
class MiniContainer {
    public function bind(string $id, callable $factory): void {}
    public function singleton(string $id, callable $factory): void {}
    public function resolve(string $id): mixed { return null; }
}
'''
solution = '''
class MiniContainer {
    private array $bindings = [];
    private array $instances = [];

    private function register(string $id, callable $factory, bool $singleton): void {
        $this->bindings[$id] = [
            'factory' => Closure::fromCallable($factory),
            'singleton' => $singleton,
        ];
        unset($this->instances[$id]);
    }

    public function bind(string $id, callable $factory): void {
        $this->register($id, $factory, false);
    }

    public function singleton(string $id, callable $factory): void {
        $this->register($id, $factory, true);
    }

    public function resolve(string $id): mixed {
        if (!array_key_exists($id, $this->bindings)) {
            throw new InvalidArgumentException('Unbound service: ' . $id);
        }
        $binding = $this->bindings[$id];
        if (!$binding['singleton']) {
            return ($binding['factory'])($this);
        }
        if (!array_key_exists($id, $this->instances)) {
            $this->instances[$id] = ($binding['factory'])($this);
        }
        return $this->instances[$id];
    }
}
'''
tests = '''
test('bind tao instance moi cho moi lan resolve', function () {
    $container = new MiniContainer();
    $container->bind('token', fn () => new stdClass());
    expect($container->resolve('token') === $container->resolve('token'))->toBeFalse();
});

test('singleton giu cung instance', function () {
    $container = new MiniContainer();
    $container->singleton('token', fn () => new stdClass());
    expect($container->resolve('token') === $container->resolve('token'))->toBeTrue();
});

test('factory nhan container de resolve dependency', function () {
    $container = new MiniContainer();
    $container->singleton('prefix', fn () => 'api');
    $container->bind('service', fn ($c) => $c->resolve('prefix') . '-service');
    expect($container->resolve('service'))->toBe('api-service');
});

test('dang ky lai xoa singleton cu', function () {
    $container = new MiniContainer();
    $container->singleton('value', fn () => 'old');
    expect($container->resolve('value'))->toBe('old');
    $container->singleton('value', fn () => 'new');
    expect($container->resolve('value'))->toBe('new');
});

test('id chua dang ky nem exception', function () {
    expect(fn () => (new MiniContainer())->resolve('missing'))->toThrow(InvalidArgumentException::class);
});
'''
hints = ["Lưu mỗi binding cùng factory và cờ singleton.", "Dùng array_key_exists để phân biệt instance đã cache với giá trị null."]
explanation = "Container giải quyết dependency qua factory; singleton là chính sách vòng đời của binding."
sources = ["laravel~11/docs/11.x/container"]

[[questions]]
id = "php-019"
module = "laravel-core"
type = "code"
difficulty = 3
tags = ["level:senior"]
lang = "php"
title = "Middleware onion pipeline"
prompt = '''
Viết runPipeline(array $middlewares, callable $destination, mixed $request): mixed. Mỗi middleware là callable nhận (request, next). Middleware đầu tiên trong mảng là lớp ngoài cùng; next chuyển request xuống lớp kế, response quay ngược qua các lớp. Middleware có thể short-circuit bằng cách không gọi next. Giữ thứ tự before/after đúng và trả response cuối cùng.
'''
starter = '''
function runPipeline(array $middlewares, callable $destination, mixed $request): mixed {
    return $destination($request);
}
'''
solution = '''
function runPipeline(array $middlewares, callable $destination, mixed $request): mixed {
    $next = static fn (mixed $value): mixed => $destination($value);
    foreach (array_reverse($middlewares) as $middleware) {
        $downstream = $next;
        $next = static fn (mixed $value): mixed => $middleware($value, $downstream);
    }
    return $next($request);
}
'''
tests = '''
test('middleware boc theo thu tu va response quay nguoc', function () {
    $events = [];
    $a = function ($request, $next) use (&$events) {
        $events[] = 'A before';
        $response = $next($request . 'A');
        $events[] = 'A after';
        return $response . 'a';
    };
    $b = function ($request, $next) use (&$events) {
        $events[] = 'B before';
        $response = $next($request . 'B');
        $events[] = 'B after';
        return $response . 'b';
    };
    $result = runPipeline([$a, $b], function ($request) use (&$events) {
        $events[] = 'destination';
        return 'done:' . $request;
    }, 'x');
    expect($result)->toBe('done:xABba');
    expect($events)->toEqual(['A before', 'B before', 'destination', 'B after', 'A after']);
});

test('pipeline rong goi thang destination', function () {
    expect(runPipeline([], fn ($request) => $request . '!', 'ok'))->toBe('ok!');
});

test('middleware co the short circuit', function () {
    $called = false;
    $stop = fn ($request, $next) => 'blocked';
    $destination = function ($request) use (&$called) {
        $called = true;
        return $request;
    };
    expect(runPipeline([$stop], $destination, 'x'))->toBe('blocked');
    expect($called)->toBeFalse();
});

test('request duoc truyen xuong va response duoc bien doi', function () {
    $middleware = fn ($request, $next) => strtoupper($next($request));
    expect(runPipeline([$middleware], fn ($request) => 'hello ' . $request, 'world'))->toBe('HELLO WORLD');
});
'''
hints = ["Bắt đầu bằng destination rồi bọc middleware theo thứ tự ngược.", "Mỗi lớp gọi next để nhận response downstream rồi mới biến đổi response."]
explanation = "Cấu trúc onion cho phép middleware xử lý cả request đi vào lẫn response đi ra."
sources = ["laravel~11/docs/11.x/middleware"]

[[questions]]
id = "php-020"
module = "laravel-core"
type = "code"
difficulty = 3
tags = ["level:senior"]
lang = "php"
title = "Khớp route động"
prompt = '''
Viết matchRoute(string $pattern, string $path): ?array cho route dạng /users/{id} và segment tùy chọn như /posts/{slug?}. Trả về mảng tên tham số sang giá trị chuỗi; trả null nếu không khớp. Segment tùy chọn chỉ được bỏ qua khi nó là toàn bộ segment cuối; bỏ segment thì không có key tương ứng. So khớp chính xác, chấp nhận slash cuối bằng cách bỏ slash biên. Input chỉ là path, không có query string.
'''
starter = '''
function matchRoute(string $pattern, string $path): ?array {
    return null;
}
'''
solution = '''
function matchRoute(string $pattern, string $path): ?array {
    $patternParts = $pattern === '/' ? [] : explode('/', trim($pattern, '/'));
    $pathParts = $path === '/' ? [] : explode('/', trim($path, '/'));
    $params = [];
    $pathIndex = 0;

    foreach ($patternParts as $segment) {
        if (preg_match('/^\\{([A-Za-z_][A-Za-z0-9_]*)(\\?)?\\}$/', $segment, $matches)) {
            $name = $matches[1];
            $optional = isset($matches[2]) && $matches[2] === '?';
            if (!array_key_exists($pathIndex, $pathParts)) {
                if ($optional) {
                    continue;
                }
                return null;
            }
            $params[$name] = $pathParts[$pathIndex];
            $pathIndex++;
            continue;
        }

        if (!array_key_exists($pathIndex, $pathParts) || $pathParts[$pathIndex] !== $segment) {
            return null;
        }
        $pathIndex++;
    }

    return $pathIndex === count($pathParts) ? $params : null;
}
'''
tests = '''
test('khop parameter bat buoc', function () {
    expect(matchRoute('/users/{id}', '/users/42'))->toEqual(['id' => '42']);
});

test('segment tuy chon co gia tri', function () {
    expect(matchRoute('/posts/{slug?}', '/posts/hello-world'))->toEqual(['slug' => 'hello-world']);
});

test('segment tuy chon co the vang mat', function () {
    expect(matchRoute('/posts/{slug?}', '/posts'))->toEqual([]);
});

test('khong khop literal hoac con du segment', function () {
    expect(matchRoute('/users/{id}', '/teams/42'))->toBeNull();
    expect(matchRoute('/users/{id}', '/users/42/edit'))->toBeNull();
});

test('ho tro nhieu parameter va slash cuoi', function () {
    expect(matchRoute('/users/{id}/posts/{slug?}', '/users/7/posts/intro/'))->toEqual(['id' => '7', 'slug' => 'intro']);
});

test('root route', function () {
    expect(matchRoute('/', '/'))->toEqual([]);
});
'''
hints = ["Tách pattern và path thành segment sau khi trim slash ở hai đầu.", "Dùng regex nhận diện segment {name} và {name?}; không ghép chuỗi regex cho cả route."]
explanation = "Khớp segment riêng giúp giữ literal an toàn và xử lý tùy chọn rõ ràng."
sources = ["laravel~11/docs/11.x/routing"]

