[[questions]]
id = "php-018"
module = "laravel-core"
type = "code"
difficulty = 3
lang = "php"
title = "Service container tối giản"
prompt = '''
Viết class MiniContainer với bind(string $id, callable $factory), singleton(string $id, callable $factory) và resolve(string $id): mixed. Factory nhận container hiện tại làm tham số. bind tạo instance mới mỗi lần resolve; singleton chỉ gọi factory lần đầu rồi trả lại đúng instance đó. Đăng ký lại một id phải thay binding và xóa instance singleton cũ. Resolve id chưa đăng ký ném InvalidArgumentException.
'''
starter = '''
class MiniContainer {
    public function bind(string $id, callable $factory): void {}
    public function singleton(string $id, callable $factory): void {}
    public function resolve(string $id): mixed { return null; }
}
'''
solution = '''
class MiniContainer {
    private array $bindings = [];
    private array $instances = [];

    private function register(string $id, callable $factory, bool $singleton): void {
        $this->bindings[$id] = [
            'factory' => Closure::fromCallable($factory),
            'singleton' => $singleton,
        ];
        unset($this->instances[$id]);
    }

    public function bind(string $id, callable $factory): void {
        $this->register($id, $factory, false);
    }

    public function singleton(string $id, callable $factory): void {
        $this->register($id, $factory, true);
    }

    public function resolve(string $id): mixed {
        if (!array_key_exists($id, $this->bindings)) {
            throw new InvalidArgumentException('Unbound service: ' . $id);
        }
        $binding = $this->bindings[$id];
        if (!$binding['singleton']) {
            return ($binding['factory'])($this);
        }
        if (!array_key_exists($id, $this->instances)) {
            $this->instances[$id] = ($binding['factory'])($this);
        }
        return $this->instances[$id];
    }
}
'''
tests = '''
test('bind tao instance moi cho moi lan resolve', function () {
    $container = new MiniContainer();
    $container->bind('token', fn () => new stdClass());
    expect($container->resolve('token') === $container->resolve('token'))->toBeFalse();
});

test('singleton giu cung instance', function () {
    $container = new MiniContainer();
    $container->singleton('token', fn () => new stdClass());
    expect($container->resolve('token') === $container->resolve('token'))->toBeTrue();
});

test('factory nhan container de resolve dependency', function () {
    $container = new MiniContainer();
    $container->singleton('prefix', fn () => 'api');
    $container->bind('service', fn ($c) => $c->resolve('prefix') . '-service');
    expect($container->resolve('service'))->toBe('api-service');
});

test('dang ky lai xoa singleton cu', function () {
    $container = new MiniContainer();
    $container->singleton('value', fn () => 'old');
    expect($container->resolve('value'))->toBe('old');
    $container->singleton('value', fn () => 'new');
    expect($container->resolve('value'))->toBe('new');
});

test('id chua dang ky nem exception', function () {
    expect(fn () => (new MiniContainer())->resolve('missing'))->toThrow(InvalidArgumentException::class);
});
'''
hints = ["Lưu mỗi binding cùng factory và cờ singleton.", "Dùng array_key_exists để phân biệt instance đã cache với giá trị null."]
