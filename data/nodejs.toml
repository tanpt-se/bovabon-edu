Node dùng mô hình **I/O không chặn (non-blocking)** điều phối bởi **event loop**. Khi gặp I/O (mạng, file), Node giao cho hệ điều hành (epoll/kqueue/IOCP) hoặc **thread pool của libuv**, rồi tiếp tục xử lý request khác. Khi I/O xong, **callback/promise** được đưa vào hàng đợi và event loop thực thi.

Vì phần lớn thời gian của web server là chờ I/O, một thread JS phục vụ được hàng nghìn kết nối. Điểm yếu: tác vụ **CPU nặng** chặn event loop → cần worker_threads hoặc tách service.
'''
