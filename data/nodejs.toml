keywords = [["trust proxy", "trusted proxy", "proxy tin cậy"], ["forwarded headers", "x-forwarded-for", "x-forwarded-proto"], ["readiness", "not-ready"], ["liveness"], ["sigterm", "graceful shutdown", "shutdown"], ["drain", "in-flight requests", "request đang chạy"], ["close database", "đóng pool"]]
