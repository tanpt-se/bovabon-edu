[[questions]]
id = "nodejs-lv073"
module = "node-core"
type = "code"
difficulty = 2
tags = ["level:middle", "concurrency"]
title = "Giới hạn số tác vụ song song"
prompt = '''
Viết `limitConcurrency(tasks, limit)`: `tasks` là mảng hàm trả Promise. Chạy tối đa `limit` tác vụ cùng lúc, trả Promise mảng kết quả **theo đúng thứ tự** của `tasks`. Nếu một tác vụ reject thì promise tổng reject với lỗi đó.
'''
starter = '''
async function limitConcurrency(tasks, limit) {
  // TODO
}
'''
solution = '''
async function limitConcurrency(tasks, limit) {
  const results = new Array(tasks.length);
  let next = 0;
  async function worker() {
    while (next < tasks.length) {
      const i = next++;
      results[i] = await tasks[i]();
    }
  }
  const n = Math.min(limit, tasks.length);
  await Promise.all(Array.from({ length: n }, worker));
  return results;
}
'''
tests = '''
test('kết quả đúng thứ tự', async () => {
  const tasks = [3, 1, 2].map((v) => () => Promise.resolve(v * 10));
  expect(await limitConcurrency(tasks, 2)).toEqual([30, 10, 20]);
});
test('không vượt quá limit', async () => {
  let running = 0, peak = 0;
  const mk = (v) => async () => {
    running++; peak = Math.max(peak, running);
    await Promise.resolve(); await Promise.resolve();
    running--; return v;
  };
  const out = await limitConcurrency([1, 2, 3, 4, 5].map(mk), 2);
  expect(out).toEqual([1, 2, 3, 4, 5]);
  expect(peak).toBe(2);
});
test('mảng rỗng', async () => {
  expect(await limitConcurrency([], 3)).toEqual([]);
});
test('reject khi một tác vụ lỗi', async () => {
  const tasks = [() => Promise.resolve(1), () => Promise.reject(new Error('bad')), () => Promise.resolve(3)];
  let err;
  try { await limitConcurrency(tasks, 2); } catch (e) { err = e; }
  expect(err.message).toBe('bad');
});
'''
hints = ["Dùng chỉ số chung `next` và `limit` worker lặp lấy việc.", "`Promise.all` trên các worker."]
explanation = "Giới hạn đồng thời là kỹ năng thường dùng để tránh cạn socket/kết nối database."
