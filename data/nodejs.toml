[[questions]]
id = "nodejs-lv039"
module = "node-core"
type = "code"
difficulty = 3
tags = ["level:senior", "concurrency"]
title = "Serializer theo key"
prompt = '''
Viết `createKeyedSerializer()` trả về hàm `run(key, task)`: các task cùng `key` chạy tuần tự theo thứ tự gọi (task sau chỉ bắt đầu khi task trước đã xong, kể cả khi task trước reject), task khác key chạy song song. `run` trả Promise với kết quả/lỗi của task. Không rò rỉ: khi hàng đợi một key rỗng thì giải phóng key khỏi Map.
'''
starter = '''
function createKeyedSerializer() {
  // TODO: return function run(key, task)
}
'''
solution = '''
function createKeyedSerializer() {
  const tails = new Map();
  return function run(key, task) {
    const prev = tails.get(key) || Promise.resolve();
    const result = prev.then(() => task());
    const tail = result.then(() => {}, () => {});
    tails.set(key, tail);
    tail.then(() => {
      if (tails.get(key) === tail) tails.delete(key);
    });
    return result;
  };
}
'''
tests = '''
function deferred() { let resolve, reject; const p = new Promise((a, b) => { resolve = a; reject = b; }); return { p, resolve, reject }; }
test('cùng key chạy tuần tự', async () => {
  const run = createKeyedSerializer();
  const log = [];
  const d1 = deferred();
  const p1 = run('a', async () => { log.push('start1'); await d1.p; log.push('end1'); return 1; });
  const p2 = run('a', async () => { log.push('start2'); return 2; });
  await Promise.resolve(); await Promise.resolve();
  expect(log).toEqual(['start1']);
  d1.resolve();
  expect(await p1).toBe(1);
  expect(await p2).toBe(2);
  expect(log).toEqual(['start1', 'end1', 'start2']);
});
test('khác key chạy song song', async () => {
  const run = createKeyedSerializer();
  const log = [];
  const d = deferred();
  const p1 = run('a', async () => { log.push('a'); await d.p; });
  const p2 = run('b', async () => { log.push('b'); });
  await p2;
  expect(log).toEqual(['a', 'b']);
  d.resolve();
  await p1;
});
test('task reject không chặn task sau', async () => {
  const run = createKeyedSerializer();
  const p1 = run('k', () => Promise.reject(new Error('boom')));
  const p2 = run('k', () => Promise.resolve('ok'));
  let err;
  try { await p1; } catch (e) { err = e; }
  expect(err.message).toBe('boom');
  expect(await p2).toBe('ok');
});
test('trả đúng kết quả của từng task', async () => {
  const run = createKeyedSerializer();
  const rs = await Promise.all([run('x', () => 1), run('x', () => 2), run('y', () => 3)]);
  expect(rs).toEqual([1, 2, 3]);
});
'''
hints = ["Giữ Map key → promise cuối hàng đợi (đã nuốt lỗi).", "Nối task mới bằng `prev.then(() => task())`.", "Xóa key khi tail hiện tại vẫn là tail mới nhất."]
explanation = "Mẫu này dùng để tuần tự hóa thao tác theo tài khoản/đơn hàng trong một process mà không khóa toàn cục."

