[[questions]]
id = "nodejs-dvc02"
module = "nodejs-dv-http"
type = "code"
lang = "javascript"
difficulty = 2
tags = ["level:middle"]
title = "Gộp Vary header"
prompt = '''Viết mergeVary(current, field). current là giá trị Vary hiện tại (chuỗi hoặc undefined); field là một tên header đơn hợp lệ. Trả về chuỗi Vary mới:
- Tách danh sách hiện tại theo dấu phẩy, bỏ khoảng trắng thừa và giữ thứ tự ban đầu.
- Thêm field chỉ khi chưa có tên tương đương, so sánh không phân biệt hoa thường.
- Nếu current đã chứa * hoặc field là *, kết quả là *.
- Nếu danh sách rỗng, trả về field.

Không cần kiểm tra cú pháp tên header.'''
starter = '''function mergeVary(current, field) {
  return current || field;
}'''
solution = '''function mergeVary(current, field) {
  const fields = (current || '').split(',').map((value) => value.trim()).filter(Boolean);
  if (field.trim() === '*' || fields.includes('*')) return '*';
  if (!fields.some((value) => value.toLowerCase() === field.trim().toLowerCase())) fields.push(field.trim());
  return fields.join(', ');
}'''
tests = '''test('thêm vào header rỗng', () => {
  expect(mergeVary(undefined, 'Accept')).toBe('Accept');
});
test('giữ danh sách hiện tại', () => {
  expect(mergeVary('Accept-Encoding', 'Origin')).toBe('Accept-Encoding, Origin');
});
test('không thêm trùng khác hoa thường', () => {
  expect(mergeVary('Accept-Encoding', 'accept-encoding')).toBe('Accept-Encoding');
});
test('chuẩn hóa khoảng trắng', () => {
  expect(mergeVary(' Accept-Encoding , Origin ', 'origin')).toBe('Accept-Encoding, Origin');
});
test('wildcard hiện tại thay thế danh sách', () => {
  expect(mergeVary('Accept, *', 'Origin')).toBe('*');
});
test('wildcard mới thay thế danh sách', () => {
  expect(mergeVary('Accept', '*')).toBe('*');
});'''
hints = ["Tách current theo dấu phẩy, trim từng tên và so sánh bằng chữ thường.", "Xử lý wildcard trước khi ghép các tên khác."]
explanation = "Vary mô tả request headers ảnh hưởng tới representation được cache; wildcard có ý nghĩa riêng và không nên ghép như một header thông thường."
sources = ["express/index#res.vary"]


[[modules]]
id = "nodejs-dv-express-prod"
title = "Express production boundaries & readiness"
description = "Cấu hình reverse proxy đáng tin, hardening ứng dụng, health checks và shutdown có drain."
sources = ["express/advanced/security-updates", "express/advanced/best-practice-security", "express/advanced/best-practice-performance", "express/advanced/healthcheck-graceful-shutdown", "express/guide/behind-proxies", "express/index#req.ip"]
lesson = '''
### Tin đúng reverse proxy và dừng ứng dụng có kiểm soát
Khi Express đứng sau load balancer hoặc reverse proxy, các header X-Forwarded-* có thể cung cấp IP client, protocol và hostname ban đầu. Express chỉ dùng thông tin này theo cấu hình trust proxy. Nếu tin tất cả kết nối nhưng ứng dụng vẫn có thể truy cập trực tiếp từ Internet, client có thể tự gửi header giả để làm sai req.ip, req.protocol hoặc req.hostname. Hãy giới hạn nguồn tin vào proxy do mình kiểm soát và cấu hình proxy biên để ghi đè header do client gửi.

| Mối quan tâm | Cách xử lý | Điều cần tránh |
|---|---|---|
| Proxy identity | trust proxy theo subnet/hop đúng topology | Bật true mà không kiểm soát đường vào |
| Liveness | Trả lời ứng dụng/process còn sống | Phụ thuộc vào mọi dịch vụ ngoài |
| Readiness | Ngừng nhận traffic khi đang shutdown hoặc dependency thiết yếu lỗi | Trả chi tiết lỗi nội bộ ra Internet |
| SIGTERM | Báo not-ready, đóng listener, drain request, rồi đóng pool | Thoát ngay và cắt request đang chạy |

Ví dụ cấu hình theo mạng triển khai: app.set('trust proxy', ['loopback', '10.0.0.0/8']). Danh sách phải khớp hạ tầng thực tế; không sao chép nguyên xi nếu subnet của proxy khác. Liveness chỉ xác nhận process còn phục vụ được; readiness kiểm tra khả năng nhận việc mới. Khi nhận SIGTERM, trước tiên đánh dấu readiness thất bại, sau đó đóng HTTP server để ngừng nhận kết nối và chờ request đang chạy, cuối cùng đóng database/message-broker pool. Thêm deadline để supervisor có thể kết thúc process nếu drain bị kẹt.

Hardening production còn gồm cập nhật Express/dependency được hỗ trợ, TLS ở proxy hoặc ứng dụng, Helmet/security headers, giới hạn body, validate input và rate limit theo rủi ro. Theo dõi latency, lỗi và saturation; không dùng log chứa token hoặc dữ liệu nhạy cảm. Lỗi hay gặp là trust proxy=true theo hướng dẫn sao chép, dùng một readiness endpoint phụ thuộc vào quá nhiều dịch vụ, hoặc đóng DB pool trước khi request đang chạy hoàn tất.
'''

