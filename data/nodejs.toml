[[questions]]
id = "nodejs-lv062"
module = "node-core"
type = "code"
difficulty = 1
tags = ["level:junior", "config"]
title = "Đọc số nguyên từ biến môi trường"
prompt = '''
Viết `readIntEnv(env, name, fallback)`: đọc biến môi trường `name` từ object `env` và trả số nguyên. Nếu thiếu, rỗng, hoặc không phải số nguyên hợp lệ (vd. 'abc', '12.5', '3000x') thì trả `fallback`. Chấp nhận số âm. Bỏ khoảng trắng đầu/cuối.
'''
starter = '''
function readIntEnv(env, name, fallback) {
  // TODO
}
'''
solution = '''
function readIntEnv(env, name, fallback) {
  const raw = env[name];
  if (typeof raw !== 'string') return fallback;
  const v = raw.trim();
  if (!/^-?\d+$/.test(v)) return fallback;
  return Number(v);
}
'''
tests = '''
test('đọc số hợp lệ', () => {
  expect(readIntEnv({ PORT: '3000' }, 'PORT', 8080)).toBe(3000);
});
test('thiếu hoặc rỗng thì dùng fallback', () => {
  expect(readIntEnv({}, 'PORT', 8080)).toBe(8080);
  expect(readIntEnv({ PORT: '' }, 'PORT', 8080)).toBe(8080);
});
test('không phải số nguyên thì dùng fallback', () => {
  expect(readIntEnv({ PORT: 'abc' }, 'PORT', 1)).toBe(1);
  expect(readIntEnv({ PORT: '12.5' }, 'PORT', 1)).toBe(1);
  expect(readIntEnv({ PORT: '3000x' }, 'PORT', 1)).toBe(1);
});
test('số âm và khoảng trắng', () => {
  expect(readIntEnv({ N: ' -7 ' }, 'N', 0)).toBe(-7);
});
'''
hints = ["Kiểm tra bằng regex `^-?\\\\d+$` sau khi trim.", "`parseInt` chấp nhận '3000x' nên không phù hợp."]
explanation = "Parse cấu hình chặt chẽ tránh lỗi âm thầm như parseInt('3000x') === 3000."

