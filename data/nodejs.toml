[[questions]]
id = "nodejs-lv019"
module = "nodejs-lead"
type = "code"
difficulty = 3
tags = ["level:lead", "resilience"]
title = "Circuit breaker có đồng hồ tiêm vào"
prompt = '''
Viết `createCircuitBreaker({ failureThreshold, cooldownMs, now })` trả về hàm `exec(fn)` (fn trả Promise). Khi số lần lỗi liên tiếp đạt `failureThreshold`, breaker MỞ: `exec` từ chối ngay với `Error('circuit open')` mà không gọi `fn`. Sau `cooldownMs` (đo bằng `now()` được truyền vào) breaker cho thử một lần (half-open): thành công thì đóng và reset, thất bại thì mở lại. Thành công làm reset bộ đếm lỗi.
'''
starter = '''
function createCircuitBreaker({ failureThreshold, cooldownMs, now }) {
  // TODO
}
'''
solution = '''
function createCircuitBreaker({ failureThreshold, cooldownMs, now }) {
  let failures = 0;
  let openedAt = null;
  return async function exec(fn) {
    if (openedAt !== null) {
      if (now() - openedAt < cooldownMs) throw new Error('circuit open');
    }
    try {
      const result = await fn();
      failures = 0;
      openedAt = null;
      return result;
    } catch (e) {
      failures += 1;
      if (openedAt !== null || failures >= failureThreshold) openedAt = now();
      throw e;
    }
  };
}
'''
tests = '''
async function fails(fn) { try { await fn(); } catch (e) { return e; } return null; }
test('mở sau N lỗi liên tiếp và không gọi fn', async () => {
  let t = 0, calls = 0;
  const exec = createCircuitBreaker({ failureThreshold: 2, cooldownMs: 100, now: () => t });
  const bad = () => { calls++; return Promise.reject(new Error('down')); };
  await fails(() => exec(bad));
  await fails(() => exec(bad));
  const e = await fails(() => exec(bad));
  expect(e.message).toBe('circuit open');
  expect(calls).toBe(2);
});
test('thành công reset bộ đếm lỗi', async () => {
  let t = 0;
  const exec = createCircuitBreaker({ failureThreshold: 2, cooldownMs: 100, now: () => t });
  await fails(() => exec(() => Promise.reject(new Error('x'))));
  expect(await exec(() => Promise.resolve('ok'))).toBe('ok');
  await fails(() => exec(() => Promise.reject(new Error('x'))));
  expect(await exec(() => Promise.resolve('still closed'))).toBe('still closed');
});
test('half-open thành công thì đóng lại', async () => {
  let t = 0;
  const exec = createCircuitBreaker({ failureThreshold: 1, cooldownMs: 100, now: () => t });
  await fails(() => exec(() => Promise.reject(new Error('x'))));
  t = 150;
  expect(await exec(() => Promise.resolve(1))).toBe(1);
  expect(await exec(() => Promise.resolve(2))).toBe(2);
});
test('half-open thất bại thì mở lại và đếm cooldown mới', async () => {
  let t = 0, calls = 0;
  const exec = createCircuitBreaker({ failureThreshold: 1, cooldownMs: 100, now: () => t });
  const bad = () => { calls++; return Promise.reject(new Error('x')); };
  await fails(() => exec(bad));
  t = 150;
  const e1 = await fails(() => exec(bad));
  expect(e1.message).toBe('x');
  t = 200;
  const e2 = await fails(() => exec(bad));
  expect(e2.message).toBe('circuit open');
  expect(calls).toBe(2);
});
'''
hints = ["Lưu `openedAt` (thời điểm mở) và `failures`.", "Nếu đang mở mà chưa hết cooldown thì ném `circuit open` trước khi gọi fn.", "Thất bại ở half-open phải đặt lại `openedAt = now()`."]
explanation = "Circuit breaker giúp tránh retry storm: ngừng gọi dependency đang hỏng, cho nó thời gian hồi phục, rồi thăm dò nhẹ."

