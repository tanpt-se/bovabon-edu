'''
options = ["Timeout ngắn + backoff mũ có jitter + retry budget + circuit breaker", "Tăng số lần retry lên 10 để chắc chắn thành công", "Retry cách đều đúng 1 giây cho mọi client", "Bỏ timeout để chờ nhà cung cấp phản hồi"]
