'''
keywords = [["strangler", "tách dần", "từng bước"], ["ranh giới", "boundary", "api nội bộ", "contract"], ["feature flag", "cờ tính năng", "canary"], ["metric", "đo", "slo", "latency"], ["rollback", "đường lui", "quay lui"], ["dữ liệu", "database", "schema", "dual write"]]
min_keywords = 4
model_answer = '''
Trước hết tôi xác định lý do tách bằng số liệu (nhịp release, tải, rủi ro) và ghi ADR. Tôi làm rõ ranh giới và contract của module thanh toán trong monolith, rồi áp dụng strangler: chuyển từng luồng sang service mới sau một facade, dùng feature flag/canary để tăng dần lưu lượng. Dữ liệu được tách có kế hoạch (dual write hoặc outbox, không chia sẻ bảng lâu dài). Tôi theo dõi metric như latency, error rate và SLO của hai bên; nếu vượt ngưỡng thì rollback bằng cách tắt flag. Chỉ khi ổn định mới dọn code cũ.
'''
explanation = "Câu trả lời tốt đi từ lý do đo được, tách dần qua ranh giới/API, chạy song song, và có rollback; không big-bang."

