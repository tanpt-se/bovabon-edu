[[questions]]
id = "node-024"
module = "node-io"
type = "code"
difficulty = 2
title = "Xử lý dữ liệu theo chunk (line splitter)"
prompt = '''
Mô phỏng Transform stream tách dòng. Viết `createLineSplitter(onLine)` trả về object:
- `write(chunk: string)` — dữ liệu đến theo **chunk bất kỳ** (một dòng có thể bị cắt giữa 2 chunk); gọi `onLine(line)` cho mỗi dòng **hoàn chỉnh** (kết thúc bằng `\n`, bỏ `\r` cuối nếu có)
- `end()` — nếu còn phần dư chưa có `\n` và khác rỗng → gọi `onLine` cho nó
'''
starter = '''
function createLineSplitter(onLine) {
  return {
    write(chunk) {},
    end() {},
  };
}
'''
solution = '''
function createLineSplitter(onLine) {
  let buf = '';
  const emit = (line) => onLine(line.endsWith('\r') ? line.slice(0, -1) : line);
  return {
    write(chunk) {
      buf += chunk;
      let i;
      while ((i = buf.indexOf('\n')) !== -1) {
        emit(buf.slice(0, i));
        buf = buf.slice(i + 1);
      }
    },
    end() {
      if (buf.length) emit(buf);
      buf = '';
    },
  };
}
'''
tests = '''
function collect(chunks) {
  const lines = [];
  const s = createLineSplitter((l) => lines.push(l));
  chunks.forEach((c) => s.write(c));
  s.end();
  return lines;
}
test('một chunk nhiều dòng', () => expect(collect(['a\nb\nc\n'])).toEqual(['a', 'b', 'c']));
test('dòng bị cắt giữa chunk', () => expect(collect(['GET /us', 'ers 200\nPOST', ' /login 401\n'])).toEqual(['GET /users 200', 'POST /login 401']));
test('phần dư khi end', () => expect(collect(['x\ny'])).toEqual(['x', 'y']));
test('CRLF', () => expect(collect(['a\r\nb\r', '\n'])).toEqual(['a', 'b']));
test('dòng rỗng giữa', () => expect(collect(['a\n\nb\n'])).toEqual(['a', '', 'b']));
test('chỉ gọi khi đủ dòng', () => {
  const lines = [];
  const s = createLineSplitter((l) => lines.push(l));
  s.write('abc');
  expect(lines).toEqual([]);
  s.write('\n');
  expect(lines).toEqual(['abc']);
});
'''
hints = ["Giữ buffer phần dư giữa các lần `write`.", "Chỉ cắt tại vị trí `\\n`, phần sau giữ lại."]
explanation = "Đây là logic bên trong `readline` và các parser log/NDJSON chạy trên stream."
sources = ["node/stream"]

