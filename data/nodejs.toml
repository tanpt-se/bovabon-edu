[[questions]]
id = "node-007"
module = "node-core"
type = "code"
difficulty = 2
title = "promisify callback-style API"
prompt = '''
Viết `promisify(fn)` giống `util.promisify`: chuyển hàm dạng callback **error-first** `fn(...args, (err, value) => {})` thành hàm trả về Promise.
- Giữ `this`
- `err` truthy → reject; ngược lại resolve `value`
- Nếu `fn` ném lỗi đồng bộ → reject
'''
starter = '''
function promisify(fn) {
  // TODO
}
'''
solution = '''
function promisify(fn) {
  return function (...args) {
    return new Promise((resolve, reject) => {
      try {
        fn.call(this, ...args, (err, value) => (err ? reject(err) : resolve(value)));
      } catch (e) {
        reject(e);
      }
    });
  };
}
'''
tests = '''
function readUser(id, cb) {
  if (id < 0) return cb(new Error('invalid id'));
  cb(null, { id, name: 'An' });
}
test('resolve', async () => {
  expect(await promisify(readUser)(1)).toEqual({ id: 1, name: 'An' });
});
test('reject error-first', async () => {
  let err;
  try { await promisify(readUser)(-1); } catch (e) { err = e; }
  expect(err.message).toBe('invalid id');
});
test('giữ this', async () => {
  const db = { prefix: 'u:', get(k, cb) { cb(null, this.prefix + k); } };
  db.getAsync = promisify(db.get);
  expect(await db.getAsync('7')).toBe('u:7');
});
test('lỗi đồng bộ → reject', async () => {
  const bad = promisify(() => { throw new Error('sync boom'); });
  let err;
  try { await bad(); } catch (e) { err = e; }
  expect(err.message).toBe('sync boom');
});
'''
hints = ["Trả về `function (...args)` (không phải arrow) để giữ `this`.", "Thêm callback vào cuối danh sách tham số."]
explanation = "Node hiện đại có sẵn bản promise cho hầu hết API (`fs/promises`, `timers/promises`)."
sources = ["node/util#utilpromisifyoriginal"]

