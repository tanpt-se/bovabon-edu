id = "nodejs"
title = "Node.js & Express"
icon = "🟩"
color = "#16a34a"
group = "Backend"
docs = ["node", "express"]
description = "Event loop của Node, module ESM/CJS, stream & buffer, Express middleware/routing/error handling, hiệu năng và vận hành."

[[modules]]
id = "node-core"
title = "Runtime & Event loop"
description = "libuv, các phase của event loop, nextTick vs microtask vs setImmediate, worker_threads, cluster."
sources = ["node/process#processnexttickcallback-args", "node/globals#setimmediatecallback-args", "node/cluster", "node/worker_threads#worker_threadsgetenvironmentdatakey", "node/modules", "node/esm", "node/packages"]
lesson = '''
### Ý chính
- Node chạy JS trên **một thread** (V8) + **libuv** (thread pool 4 luồng mặc định cho fs, dns.lookup, crypto, zlib).
- Event loop phases: **timers** → pending callbacks → poll (I/O) → **check** (`setImmediate`) → close callbacks.
- Sau **mỗi callback**: chạy hết queue `process.nextTick` rồi tới **Promise microtask**.
- Trong callback I/O: `setImmediate` luôn chạy trước `setTimeout(fn, 0)`.
- Việc nặng CPU chặn event loop → dùng **worker_threads**; tận dụng nhiều core cho server → **cluster** hoặc nhiều process (PM2, container).
- **ESM** (`import`, `"type": "module"`, top-level await) vs **CommonJS** (`require`, `module.exports`).
- Bản mới có sẵn: `fetch`, `node:test`, `--watch`, `--env-file`, `AbortSignal.timeout()`.
'''

[[modules]]
id = "node-io"
title = "Stream, Buffer & I/O"
description = "Readable/Writable/Transform, backpressure, pipeline, Buffer, fs/promises, EventEmitter."
sources = ["node/stream", "node/stream#streampipelinestreams-options", "node/buffer", "node/events", "node/fs"]
lesson = '''
### Ý chính
- **Stream** xử lý dữ liệu theo từng chunk → bộ nhớ ổn định với file lớn.
- 4 loại: Readable, Writable, Duplex, Transform.
- **Backpressure**: `write()` trả `false` khi buffer đầy → đợi sự kiện `drain`. `stream.pipeline()` tự xử lý backpressure + lỗi + dọn dẹp (tốt hơn `.pipe()`).
- **Buffer**: dữ liệu nhị phân ngoài heap V8 (`Buffer.from('hi')`, `buf.toString('base64')`).
- `EventEmitter`: sự kiện `'error'` không có listener sẽ **ném lỗi làm crash process**.
- Dùng `fs/promises` + `async/await`; tránh `fs.readFileSync` trong request handler.
'''

[[modules]]
id = "node-express"
title = "Express & kiến trúc API"
description = "Middleware, router, error-handling middleware, async error, validation, cấu trúc project."
sources = ["express/guide/using-middleware", "express/guide/error-handling", "express/guide/routing", "express/index#express.router", "express/index#express.json", "express/advanced/best-practice-security"]
lesson = '''
### Ý chính
- **Middleware** `(req, res, next)` chạy theo thứ tự đăng ký; phải gọi `next()` hoặc kết thúc response.
- **Error-handling middleware** có **4 tham số** `(err, req, res, next)`, đăng ký **sau cùng**.
- Express 5: lỗi/promise reject trong handler `async` được tự chuyển tới error middleware. Express 4 phải bọc `asyncHandler` hoặc gọi `next(err)`.
- `express.json()` parse body JSON; `express.Router()` chia module.
- Phân tầng: route → controller → service → repository; validate input (zod/joi) ở biên.
- Bảo mật: `helmet`, rate limit, giới hạn kích thước body, không trả stack trace ở production.
'''

[[modules]]
id = "node-ops"
title = "Hiệu năng & Vận hành"
description = "Cache, rate limit, retry/backoff, graceful shutdown, logging, biến môi trường."
sources = ["node/errors", "node/process", "node/environment_variables#processenv", "express/advanced/best-practice-performance", "express/advanced/healthcheck-graceful-shutdown"]
lesson = '''
### Ý chính
- **Cache**: in-memory (LRU) cho dữ liệu nóng; Redis khi nhiều instance.
- **Rate limiting**: token bucket / sliding window, lưu Redis khi scale ngang.
- **Retry** với **exponential backoff + jitter** chỉ cho lỗi tạm thời và thao tác idempotent.
- **Graceful shutdown**: bắt `SIGTERM` → `server.close()` → đóng DB pool → `process.exit`.
- Lỗi chưa bắt: `process.on('unhandledRejection'|'uncaughtException')` → log rồi **thoát** (để process manager khởi động lại), không cố chạy tiếp.
- Log có cấu trúc (pino), cấu hình qua biến môi trường (12-factor).
'''

[[modules]]
id = "nodejs-lead"
title = "Góc nhìn Tech Lead"
description = "Ra quyết định kiến trúc và vận hành Node.js ở quy mô team: ADR, đánh đổi, rollout, sự cố, chi phí."
sources = ["node/process", "node/worker_threads", "node/cluster", "node/diagnostics_channel"]
lesson = '''
### Tech Lead không chọn "công nghệ tốt nhất" mà chọn phương án chịu được ràng buộc của team

Một quyết định tốt trả lời được bốn câu hỏi: **ràng buộc là gì** (số người, thời gian, ngân sách, mức rủi ro chấp nhận), **phương án nào khả thi**, **đánh đổi từng phương án**, và **làm sao biết ta sai để quay lui**. Câu trả lời "dùng X vì X hiện đại" gần như luôn thiếu phần ràng buộc.

#### Khung ra quyết định

1. Viết rõ vấn đề và tiêu chí (latency P99, thời gian delivery, chi phí vận hành, kỹ năng team).
2. Liệt kê 2–3 phương án, gồm cả "không làm gì" hoặc "làm nhỏ nhất".
3. Chấm theo tiêu chí, ghi rủi ro và cách giảm rủi ro.
4. Chọn, ghi ADR, đặt mốc xem lại.
5. Rollout nhỏ, có metric và đường lui.

| Tình huống | Phương án thường bị chọn sai | Phương án hợp lý hơn trong ngữ cảnh nhỏ |
|---|---|---|
| Team 5 người, MVP 3 tháng | Microservice từ đầu | Modular monolith, ranh giới module rõ, một pipeline deploy |
| API CPU-bound làm chặn event loop | Viết lại sang ngôn ngữ khác | Tách việc nặng sang worker pool hoặc queue, đo trước |
| Downstream chập chờn | Retry vô hạn, không jitter | Timeout + retry có budget + backoff jitter + circuit breaker |
| Nâng Node major cho nhiều service | Nâng đồng loạt một đêm | Canary từng service, chạy CI trên 2 phiên bản, có rollback |

#### ADR mẫu ngắn

```md
# ADR-014: Gửi email hóa đơn qua queue
Trạng thái: Chấp nhận (2026-03)
Bối cảnh: gọi SMTP đồng bộ làm P99 /checkout 4s khi nhà cung cấp chậm.
Quyết định: ghi outbox trong cùng transaction, worker gửi bất đồng bộ, idempotency key = invoiceId.
Hệ quả: thêm một thành phần vận hành; email có thể trễ vài phút; cần dead-letter queue và cảnh báo.
Xem lại: sau 2 quý hoặc khi volume > 10k/ngày.
```

#### Checklist review ở mức team

- Có timeout cho mọi cuộc gọi ra ngoài? Có giới hạn kích thước body và số kết nối?
- Lỗi được phân loại (có thể retry / không) và log có correlation id, không chứa secret?
- Thay đổi có tương thích ngược (additive), có feature flag và cách rollback?
- Có metric cho luồng mới (rate, error, duration) và cảnh báo gắn với runbook?
- Test bao phủ nhánh lỗi, không chỉ happy path?

#### Anti-pattern thường gặp ở quy mô team

- **Resume-driven architecture**: chọn công nghệ để học thay vì để giải quyết vấn đề.
- **Hero culture**: một người giữ mọi kiến thức vận hành; không có runbook.
- **Big-bang migration**: viết lại toàn bộ, không có điểm kiểm tra giữa chừng.
- **Alert fatigue**: cảnh báo không hành động được khiến người trực bỏ qua cảnh báo thật.
- **Tối ưu trước khi đo**: tốn tuần làm việc cho chỗ không phải nút cổ chai.

Khi nghi vấn, hãy nhớ: quyết định đảo ngược được thì quyết nhanh; quyết định khó đảo ngược (schema dữ liệu, hợp đồng API công khai, ranh giới service) thì dành thời gian viết ADR và xin review.
'''

