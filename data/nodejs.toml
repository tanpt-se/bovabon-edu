explanation = "Câu trả lời nên thể hiện trust boundary và thứ tự shutdown rõ ràng, đồng thời tách readiness khỏi liveness."
sources = ["express/guide/behind-proxies", "express/advanced/healthcheck-graceful-shutdown"]

