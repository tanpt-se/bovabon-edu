[[questions]]
id = "node-045"
module = "node-express"
type = "code"
difficulty = 3
title = "compose middleware (mô hình onion)"
prompt = '''
Viết `compose(middlewares)` giống `koa-compose`: trả về hàm `(ctx) => Promise`.
- Mỗi middleware có dạng `async (ctx, next) => {}`; gọi `await next()` để chạy middleware kế tiếp, code sau `await next()` chạy khi chiều về (mô hình **onion**)
- Lỗi ở bất kỳ middleware nào → Promise bị reject (để middleware phía ngoài `try/catch` được)
- Gọi `next()` **2 lần** trong một middleware → reject với `Error('next() called multiple times')`
'''
starter = '''
function compose(middlewares) {
  return async function (ctx) {
    for (const mw of middlewares) await mw(ctx, async () => {});
  };
}
'''
solution = '''
function compose(middlewares) {
  return function (ctx) {
    let index = -1;
    function dispatch(i) {
      if (i <= index) return Promise.reject(new Error('next() called multiple times'));
      index = i;
      const fn = middlewares[i];
      if (!fn) return Promise.resolve();
      try {
        return Promise.resolve(fn(ctx, () => dispatch(i + 1)));
      } catch (err) {
        return Promise.reject(err);
      }
    }
    return dispatch(0);
  };
}
'''
tests = '''
test('thứ tự onion', async () => {
  const log = [];
  const app = compose([
    async (ctx, next) => { log.push('a1'); await next(); log.push('a2'); },
    async (ctx, next) => { log.push('b1'); await next(); log.push('b2'); },
    async (ctx) => { log.push('handler'); },
  ]);
  await app({});
  expect(log).toEqual(['a1', 'b1', 'handler', 'b2', 'a2']);
});
test('middleware ngoài bắt lỗi trong', async () => {
  const ctx = {};
  const app = compose([
    async (ctx, next) => { try { await next(); } catch (e) { ctx.status = 500; ctx.body = e.message; } },
    async () => { throw new Error('db down'); },
  ]);
  await app(ctx);
  expect(ctx).toEqual({ status: 500, body: 'db down' });
});
test('đo thời gian kiểu logger', async () => {
  const ctx = { t: [] };
  await compose([
    async (ctx, next) => { ctx.t.push('start'); await next(); ctx.t.push('end:' + ctx.body); },
    async (ctx) => { ctx.body = 'ok'; },
  ])(ctx);
  expect(ctx.t).toEqual(['start', 'end:ok']);
});
test('không gọi next thì dừng chuỗi', async () => {
  const hit = jest.fn();
  await compose([async (ctx) => { ctx.x = 1; }, hit])({});
  expect(hit).toHaveBeenCalledTimes(0);
});
test('next() hai lần → lỗi', async () => {
  let err;
  try { await compose([async (ctx, next) => { await next(); await next(); }])({}); } catch (e) { err = e; }
  expect(err && err.message).toBe('next() called multiple times');
});
'''
hints = ["Viết hàm đệ quy `dispatch(i)` gọi middleware thứ i với `next = () => dispatch(i + 1)`.", "Lưu `index` của middleware đã chạy gần nhất để phát hiện gọi next 2 lần."]
explanation = "Koa dùng đúng mô hình này; Express dùng callback `next` tương tự nhưng không có chiều về bằng await."
sources = ["express/guide/using-middleware", "express/guide/error-handling"]

[[questions]]
id = "node-046"
module = "node-express"
type = "code"
difficulty = 2
title = "Mini router Express với params"
prompt = '''
Viết `createRouter()` trả về `{ get(path, handler), post(path, handler), handle(method, url) }`:
- path có thể chứa tham số `:name` (vd. `/users/:id/posts/:postId`)
- `handle(method, url)`: bỏ query string, tìm route **đầu tiên** khớp method + path, gọi `handler(req)` với `req = { method, path, params, query }` và trả về kết quả handler
- `query` parse từ query string (`a=1&b=x` → `{ a: '1', b: 'x' }`, giá trị là chuỗi, đã decode)
- Không khớp path nào → `{ status: 404 }`; khớp path nhưng sai method → `{ status: 405 }`
'''
starter = '''
function createRouter() {
  return {
    get(path, handler) {},
    post(path, handler) {},
    handle(method, url) { return { status: 404 }; },
  };
}
'''
solution = '''
function createRouter() {
  const routes = [];
  const add = (method) => (path, handler) => {
    const keys = [];
    const re = new RegExp('^' + path.replace(/\/:([A-Za-z_]\w*)/g, (_, k) => { keys.push(k); return '/([^/]+)'; }) + '/?$');
    routes.push({ method, re, keys, handler });
  };
  return {
    get: add('GET'),
    post: add('POST'),
    handle(method, url) {
      const [path, qs = ''] = url.split('?');
      const query = {};
      for (const part of qs.split('&')) {
        if (!part) continue;
        const [k, v = ''] = part.split('=');
        query[decodeURIComponent(k)] = decodeURIComponent(v.replace(/\+/g, ' '));
      }
      let pathMatched = false;
      for (const r of routes) {
        const m = r.re.exec(path);
        if (!m) continue;
        pathMatched = true;
        if (r.method !== method) continue;
        const params = {};
        r.keys.forEach((k, i) => { params[k] = decodeURIComponent(m[i + 1]); });
        return r.handler({ method, path, params, query });
      }
      return { status: pathMatched ? 405 : 404 };
    },
  };
}
'''
tests = '''
const r = createRouter();
r.get('/users', (req) => ({ status: 200, body: 'list', q: req.query }));
r.get('/users/:id', (req) => ({ status: 200, body: 'user ' + req.params.id }));
r.post('/users', () => ({ status: 201 }));
r.get('/users/:id/posts/:postId', (req) => ({ status: 200, params: req.params }));

test('route tĩnh', () => expect(r.handle('GET', '/users').body).toBe('list'));
test('params', () => expect(r.handle('GET', '/users/42').body).toBe('user 42'));
test('nhiều params', () => expect(r.handle('GET', '/users/7/posts/99').params).toEqual({ id: '7', postId: '99' }));
test('query string', () => expect(r.handle('GET', '/users?page=2&q=an').q).toEqual({ page: '2', q: 'an' }));
test('POST', () => expect(r.handle('POST', '/users')).toEqual({ status: 201 }));
test('404', () => expect(r.handle('GET', '/nope')).toEqual({ status: 404 }));
test('405 sai method', () => expect(r.handle('POST', '/users/1')).toEqual({ status: 405 }));
test('param không ăn qua /', () => expect(r.handle('GET', '/users/1/2')).toEqual({ status: 404 }));
'''
hints = ["Chuyển `/users/:id` thành regex `^/users/([^/]+)/?$` và nhớ thứ tự tên tham số.", "Theo dõi biến `pathMatched` để phân biệt 404 và 405."]
explanation = "Express dùng `path-to-regexp` để biên dịch route tương tự."
sources = ["express/guide/routing"]

