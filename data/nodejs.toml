[[questions]]
id = "node-062"
module = "node-ops"
type = "code"
difficulty = 3
title = "Rate limiter token bucket"
prompt = '''
Viết `createRateLimiter({ capacity, refillPerSec, now })`:
- Mỗi **key** (vd. IP) có một bucket riêng, ban đầu đầy `capacity` token
- Token hồi theo thời gian: `refillPerSec` token/giây (có thể là số thực), không vượt `capacity`
- `take(key)` → `{ allowed, remaining, retryAfterMs }`:
  - còn ≥ 1 token → trừ 1, `allowed: true`, `retryAfterMs: 0`
  - hết → `allowed: false`, `retryAfterMs` = thời gian (ms, làm tròn lên) tới khi có đủ 1 token
- `remaining` = số token nguyên còn lại (`Math.floor`)
- `now()` trả về thời gian hiện tại (ms) — dùng để test
'''
starter = '''
function createRateLimiter({ capacity, refillPerSec, now = Date.now }) {
  return {
    take(key) {
      return { allowed: true, remaining: capacity, retryAfterMs: 0 };
    },
  };
}
'''
solution = '''
function createRateLimiter({ capacity, refillPerSec, now = Date.now }) {
  const buckets = new Map();
  return {
    take(key) {
      const t = now();
      let b = buckets.get(key);
      if (!b) { b = { tokens: capacity, last: t }; buckets.set(key, b); }
      b.tokens = Math.min(capacity, b.tokens + ((t - b.last) / 1000) * refillPerSec);
      b.last = t;
      if (b.tokens >= 1) {
        b.tokens -= 1;
        return { allowed: true, remaining: Math.floor(b.tokens), retryAfterMs: 0 };
      }
      return { allowed: false, remaining: 0, retryAfterMs: Math.ceil(((1 - b.tokens) / refillPerSec) * 1000) };
    },
  };
}
'''
tests = '''
function setup(opts) {
  let t = 0;
  const lim = createRateLimiter({ ...opts, now: () => t });
  return { lim, advance: (ms) => { t += ms; } };
}
test('cho phép tới capacity rồi chặn', () => {
  const { lim } = setup({ capacity: 3, refillPerSec: 1 });
  expect([1, 2, 3, 4].map(() => lim.take('ip').allowed)).toEqual([true, true, true, false]);
});
test('remaining giảm dần', () => {
  const { lim } = setup({ capacity: 3, refillPerSec: 1 });
  expect(lim.take('a').remaining).toBe(2);
  expect(lim.take('a').remaining).toBe(1);
});
test('retryAfterMs', () => {
  const { lim } = setup({ capacity: 1, refillPerSec: 2 });
  lim.take('a');
  expect(lim.take('a')).toEqual({ allowed: false, remaining: 0, retryAfterMs: 500 });
});
test('hồi token theo thời gian', () => {
  const { lim, advance } = setup({ capacity: 2, refillPerSec: 1 });
  lim.take('a'); lim.take('a');
  expect(lim.take('a').allowed).toBe(false);
  advance(1000);
  expect(lim.take('a').allowed).toBe(true);
  expect(lim.take('a').allowed).toBe(false);
});
test('không vượt capacity', () => {
  const { lim, advance } = setup({ capacity: 2, refillPerSec: 10 });
  advance(60000);
  expect([1, 2, 3].map(() => lim.take('a').allowed)).toEqual([true, true, false]);
});
test('mỗi key độc lập', () => {
  const { lim } = setup({ capacity: 1, refillPerSec: 1 });
  expect(lim.take('ip1').allowed).toBe(true);
  expect(lim.take('ip2').allowed).toBe(true);
  expect(lim.take('ip1').allowed).toBe(false);
});
'''
hints = ["Lưu `{ tokens, last }` cho mỗi key; mỗi lần take, cộng token theo thời gian trôi qua.", "Token có thể là số thực — chỉ floor khi trả `remaining`."]
explanation = "Khi API trả 429, đặt header `Retry-After` từ `retryAfterMs`. Ở nhiều instance cần lưu bucket trong Redis (script Lua nguyên tử)."
sources = ["express/guide/using-middleware"]

[[questions]]
id = "node-063"
module = "node-ops"
type = "code"
difficulty = 3
title = "LRU cache có TTL"
prompt = '''
Viết class `LRUCache` với `constructor(max, { ttlMs = Infinity, now = Date.now } = {})`:
- `get(key)` → giá trị hoặc `undefined`; truy cập làm key thành **mới dùng gần nhất**; key hết hạn (`now() - setAt >= ttlMs`) bị xoá và trả `undefined`
- `set(key, value)` → nếu vượt `max` thì xoá key **ít dùng gần đây nhất**
- `has(key)` (không cập nhật thứ tự, nhưng tôn trọng TTL), `delete(key)`, thuộc tính `size`

Gợi ý: `Map` giữ thứ tự chèn.
'''
starter = '''
class LRUCache {
  constructor(max, opts = {}) {
    this.map = new Map();
  }
  get(key) { return this.map.get(key); }
  set(key, value) { this.map.set(key, value); return this; }
  has(key) { return this.map.has(key); }
  delete(key) { return this.map.delete(key); }
  get size() { return this.map.size; }
}
'''
solution = '''
class LRUCache {
  constructor(max, { ttlMs = Infinity, now = Date.now } = {}) {
    this.max = max;
    this.ttlMs = ttlMs;
    this.now = now;
    this.map = new Map();
  }
  _fresh(key) {
    const e = this.map.get(key);
    if (!e) return null;
    if (this.now() - e.at >= this.ttlMs) { this.map.delete(key); return null; }
    return e;
  }
  get(key) {
    const e = this._fresh(key);
    if (!e) return undefined;
    this.map.delete(key);
    this.map.set(key, e);
    return e.value;
  }
  set(key, value) {
    this.map.delete(key);
    this.map.set(key, { value, at: this.now() });
    while (this.map.size > this.max) this.map.delete(this.map.keys().next().value);
    return this;
  }
  has(key) { return !!this._fresh(key); }
  delete(key) { return this.map.delete(key); }
  get size() { return this.map.size; }
}
'''
tests = '''
test('get/set cơ bản', () => {
  const c = new LRUCache(2);
  c.set('a', 1);
  expect(c.get('a')).toBe(1);
  expect(c.get('x')).toBeUndefined();
});
test('xoá key ít dùng nhất', () => {
  const c = new LRUCache(2);
  c.set('a', 1); c.set('b', 2);
  c.get('a');
  c.set('c', 3);
  expect(c.has('b')).toBe(false);
  expect(c.has('a')).toBe(true);
  expect(c.size).toBe(2);
});
test('set lại key cập nhật thứ tự', () => {
  const c = new LRUCache(2);
  c.set('a', 1); c.set('b', 2); c.set('a', 10); c.set('c', 3);
  expect(c.get('a')).toBe(10);
  expect(c.has('b')).toBe(false);
});
test('TTL hết hạn', () => {
  let t = 0;
  const c = new LRUCache(5, { ttlMs: 100, now: () => t });
  c.set('k', 'v');
  t = 99;
  expect(c.get('k')).toBe('v');
  t = 100;
  expect(c.get('k')).toBeUndefined();
  expect(c.size).toBe(0);
});
test('has không làm mới thứ tự', () => {
  const c = new LRUCache(2);
  c.set('a', 1); c.set('b', 2);
  c.has('a');
  c.set('c', 3);
  expect(c.has('a')).toBe(false);
});
test('lưu được giá trị falsy', () => {
  const c = new LRUCache(2);
  c.set('z', 0);
  expect(c.get('z')).toBe(0);
  expect(c.has('z')).toBe(true);
});
'''
hints = ["`map.delete(key); map.set(key, v)` đưa key lên cuối (mới nhất).", "Key cũ nhất là `map.keys().next().value`."]
explanation = "Thư viện `lru-cache` được npm dùng rộng rãi cài đặt ý tưởng này (tối ưu hơn)."
