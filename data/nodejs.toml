[[questions]]
id = "nodejs-dvc01"
module = "nodejs-dv-modules"
type = "code"
lang = "javascript"
difficulty = 2
tags = ["level:middle"]
title = "Phân tích bare package specifier"
prompt = '''Viết parsePackageSpecifier(specifier) cho một bare package specifier của Node. Trả về { packageName, subpath }, trong đó package root có subpath: ".", còn subpath như pkg/fs/read có subpath: "./fs/read". Hỗ trợ package scoped như @team/logger và @team/logger/json.

Trả về null nếu input không phải chuỗi hợp lệ theo bài này: chuỗi rỗng, có whitespace, là đường dẫn tương đối/tuyệt đối, bắt đầu bằng node:, có backslash, ?, #, thiếu scope hoặc package name, có path segment rỗng, . hay ... Không cần giải quyết package trên filesystem hoặc áp dụng exports.'''
starter = '''function parsePackageSpecifier(specifier) {
  return null;
}'''
solution = '''function parsePackageSpecifier(specifier) {
  if (typeof specifier !== 'string' || !specifier || /\s/.test(specifier) || specifier.startsWith('.') || specifier.startsWith('/') || specifier.startsWith('node:') || specifier.includes('\\') || specifier.includes('?') || specifier.includes('#')) return null;
  const parts = specifier.split('/');
  let packageName;
  let subpathParts;
  if (specifier.startsWith('@')) {
    if (parts.length < 2 || parts[0].length < 2 || !parts[1]) return null;
    packageName = parts.slice(0, 2).join('/');
    subpathParts = parts.slice(2);
  } else {
    if (!parts[0]) return null;
    packageName = parts[0];
    subpathParts = parts.slice(1);
  }
  if (subpathParts.some((part) => !part || part === '.' || part === '..')) return null;
  return { packageName, subpath: subpathParts.length ? './' + subpathParts.join('/') : '.' };
}'''
tests = '''test('package root', () => {
  expect(parsePackageSpecifier('express')).toEqual({ packageName: 'express', subpath: '.' });
});
test('unscoped subpath', () => {
  expect(parsePackageSpecifier('pkg/fs/read')).toEqual({ packageName: 'pkg', subpath: './fs/read' });
});
test('scoped root and subpath', () => {
  expect(parsePackageSpecifier('@team/logger/json')).toEqual({ packageName: '@team/logger', subpath: './json' });
});
test('rejects relative and builtin specifiers', () => {
  expect(parsePackageSpecifier('./local.js')).toBeNull();
  expect(parsePackageSpecifier('node:fs')).toBeNull();
});
test('rejects malformed scoped or empty segments', () => {
  expect(parsePackageSpecifier('@team')).toBeNull();
  expect(parsePackageSpecifier('pkg//internal')).toBeNull();
  expect(parsePackageSpecifier('pkg/../private')).toBeNull();
});'''
hints = ["Tách các segment bằng /; package scoped chiếm hai segment đầu.", "Kiểm tra segment rỗng hoặc ./.. trước khi ghép subpath."]
explanation = "Bài tập mô hình hóa cách tách tên package và subpath; việc resolve target thực tế còn phụ thuộc package.json, exports và filesystem."
sources = ["node/packages", "node/esm"]


[[modules]]
id = "nodejs-dv-http"
title = "HTTP server, client & headers"
description = "Node http/https/http2, luồng request-response, socket reuse, timeout và xử lý header đúng vòng đời."
sources = ["node/http", "node/https", "node/http2", "node/net"]
lesson = '''
### HTTP là một luồng request-response
Module node:http cung cấp API cấp thấp để nhận và gửi HTTP/1.1. Callback của createServer nhận IncomingMessage (Readable) và ServerResponse (Writable); body đến theo chunk, không tự biến thành JSON. Gọi write() có thể gửi nhiều chunk, còn end() kết thúc response. Headers phải được đặt trước khi chúng được gửi; headersSent giúp tránh cố ghi status/header lần nữa.

| Nhu cầu | API | Lưu ý |
|---|---|---|
| Server HTTP/1.1 | http.createServer() | Nhận req và res dạng stream |
| Server TLS | https.createServer() | Cấu hình certificate/key theo hạ tầng |
| HTTP/2 | http2.createServer() hoặc createSecureServer() | API/session khác HTTP/1.1; TLS thường dùng trên Internet |
| Client outbound | http.request() / https.request() | Agent có thể tái sử dụng và giới hạn socket |

Ví dụ: http.createServer((req, res) => { res.writeHead(200, {'content-type':'application/json'}); res.end(JSON.stringify({ok:true})); }).listen(3000).

Với file lớn, đừng gom toàn bộ body vào một chuỗi hoặc Buffer không giới hạn; xử lý stream và giữ backpressure. Hãy giới hạn kích thước request và cấu hình headersTimeout/requestTimeout theo nhu cầu endpoint. headersTimeout giới hạn việc nhận headers, còn requestTimeout giới hạn việc nhận toàn bộ request; socket timeout là khái niệm khác. Client có thể ngắt kết nối, nên code cần xử lý lỗi/close và không tiếp tục ghi response đã kết thúc.

Lỗi hay gặp là gọi writeHead() sau write(), dimenticare end(), xem request body như object JSON tự động, hoặc tin rằng timeout socket tự giới hạn kích thước body. Express thêm routing và middleware lên trên HTTP server, nhưng vòng đời stream, socket và response vẫn cần hiểu.
'''

