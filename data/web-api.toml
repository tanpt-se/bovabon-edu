[[questions]]
id = "api-041"
module = "api-caching"
type = "single"
difficulty = 2
prompt = "Response chứa dữ liệu riêng của người dùng (`/me`) nên dùng `Cache-Control` nào để CDN **không** cache?"
options = ["`public, max-age=3600`", "`private, max-age=60` (hoặc `no-store` nếu nhạy cảm)", "`s-maxage=3600`", "`immutable`"]
answer = [1]
