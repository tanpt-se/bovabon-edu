[[questions]]
id = "web-api-lvc02"
module = "web-api-lead"
type = "code"
lang = "javascript"
difficulty = 3
tags = ["level:lead", "versioning"]
title = "Chính sách deprecation theo phiên bản"
prompt = '''
Viết `resolveVersion(headers, policy, now)` để quyết định cách phục vụ một request:
- `headers` có thể chứa `x-api-version` (khoá viết thường); nếu thiếu dùng `policy.default`
- `policy.versions` là object, ví dụ `{ '1': { sunset: Date.UTC(2026,5,1) }, '2': {} }`; `sunset` là mốc timestamp (ms) hoặc không có
- `now` là timestamp hiện tại (ms)
- Phiên bản không có trong `policy.versions` → `{ status: 400, error: 'unsupported version' }`
- Phiên bản có `sunset` đã qua (`now >= sunset`) → `{ status: 410, error: 'version sunset' }`
- Phiên bản có `sunset` chưa tới → `{ status: 200, version, headers: { Deprecation: 'true', Sunset: <chuỗi dạng new Date(sunset).toUTCString()> } }`
- Phiên bản không có `sunset` → `{ status: 200, version, headers: {} }`
'''
starter = '''
function resolveVersion(headers, policy, now) {
  return { status: 200, version: policy.default, headers: {} };
}
'''
solution = '''
function resolveVersion(headers, policy, now) {
  const version = headers['x-api-version'] !== undefined ? String(headers['x-api-version']) : String(policy.default);
  const info = policy.versions[version];
  if (!info) return { status: 400, error: 'unsupported version' };
  if (info.sunset !== undefined) {
    if (now >= info.sunset) return { status: 410, error: 'version sunset' };
    return { status: 200, version, headers: { Deprecation: 'true', Sunset: new Date(info.sunset).toUTCString() } };
  }
  return { status: 200, version, headers: {} };
}
'''
tests = '''
const sunset = Date.UTC(2026, 5, 1);
const policy = { default: '1', versions: { '1': { sunset }, '2': {} } };
const before = Date.UTC(2026, 0, 1);
test('mặc định dùng default và gắn header deprecation', () => {
  const r = resolveVersion({}, policy, before);
  expect(r.status).toBe(200);
  expect(r.version).toBe('1');
  expect(r.headers.Deprecation).toBe('true');
  expect(r.headers.Sunset).toBe(new Date(sunset).toUTCString());
});
test('v2 không có header', () => {
  expect(resolveVersion({ 'x-api-version': '2' }, policy, before)).toEqual({ status: 200, version: '2', headers: {} });
});
test('phiên bản lạ trả 400', () => {
  expect(resolveVersion({ 'x-api-version': '9' }, policy, before)).toEqual({ status: 400, error: 'unsupported version' });
});
test('quá hạn sunset trả 410', () => {
  expect(resolveVersion({}, policy, sunset)).toEqual({ status: 410, error: 'version sunset' });
});
test('header số được chuẩn hoá về chuỗi', () => {
  expect(resolveVersion({ 'x-api-version': 2 }, policy, before).version).toBe('2');
});
'''
hints = ["Chuyển version về chuỗi trước khi tra `policy.versions`.", "Kiểm tra `sunset` đã qua trước khi trả header cảnh báo."]
explanation = "Phản hồi 410 Gone sau mốc sunset cho client biết tài nguyên đã bị gỡ có chủ ý; header Deprecation/Sunset cho họ tín hiệu máy đọc được từ trước."

