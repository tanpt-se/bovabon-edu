min_keywords = 4
model_answer = '''
HTTP/1.1 thường xử lý response theo thứ tự trên một kết nối, còn HTTP/2 multiplex nhiều stream trên cùng một kết nối TCP và nén header bằng HPACK. Vì TCP vẫn truyền byte có thứ tự, mất gói có thể làm chậm dữ liệu của nhiều stream, dù mỗi stream là độc lập ở tầng HTTP. HTTP/3 dùng QUIC để cô lập tiến triển stream tốt hơn qua mất gói ở stream khác; QUIC vẫn điều khiển congestion và HTTP/3 dùng QPACK. Khi điều tra, đo handshake, retransmission, thời gian từng stream và phiên bản giao thức thực tế ở cả client, proxy lẫn upstream.
'''
explanation = "Phỏng vấn tốt sẽ phân biệt multiplexing ở tầng HTTP với thứ tự truyền tải của TCP và nêu được cách quan sát thực tế."
sources = ["http/rfc9112#section-9", "http/rfc9113#section-9", "http/rfc9114#section-3"]

[[questions]]
id = "web-api-dvc02"
module = "web-api-dv-framing"
type = "code"
difficulty = 2
tags = ["level:middle"]
title = "Quyết định tái sử dụng kết nối HTTP/1.x"
lang = "javascript"
prompt = '''
Viết `canReuseHttp1(version, connectionHeader, responseComplete)`:
- `version` là `'1.0'` hoặc `'1.1'`; giá trị khác trả `false`.
- Chỉ có thể tái sử dụng sau khi response body đã được đọc hết (`responseComplete === true`).
- Với HTTP/1.1, kết nối được giữ mặc định trừ khi danh sách token trong `Connection` có token `close`.
- Với HTTP/1.0, chỉ tái sử dụng khi danh sách token có `keep-alive` và không có `close`.
- `connectionHeader` có thể thiếu; token phân cách bằng dấu phẩy, bỏ khoảng trắng và không phân biệt hoa thường. So khớp cả token, không so khớp chuỗi con.
'''
starter = '''
function canReuseHttp1(version, connectionHeader, responseComplete) {
  return true;
}
'''
solution = '''
function canReuseHttp1(version, connectionHeader, responseComplete) {
  if (responseComplete !== true || (version !== '1.0' && version !== '1.1')) return false;
  const tokens = String(connectionHeader || '').split(',').map((token) => token.trim().toLowerCase());
  if (tokens.includes('close')) return false;
  if (version === '1.1') return true;
  return tokens.includes('keep-alive');
}
'''
tests = '''
test('HTTP/1.1 mặc định tái sử dụng khi đã đọc hết body', () => {
  expect(canReuseHttp1('1.1', null, true)).toBe(true);
});
test('token close đóng kết nối, không phân biệt hoa thường', () => {
  expect(canReuseHttp1('1.1', 'upgrade, CLOSE', true)).toBe(false);
});
test('HTTP/1.0 cần keep-alive tường minh', () => {
  expect(canReuseHttp1('1.0', 'keep-alive', true)).toBe(true);
  expect(canReuseHttp1('1.0', null, true)).toBe(false);
});
test('body chưa đọc hết thì không trả connection về pool', () => {
  expect(canReuseHttp1('1.1', '', false)).toBe(false);
});
test('chỉ so khớp nguyên token và từ chối version khác', () => {
  expect(canReuseHttp1('1.0', 'x-keep-alive-extra', true)).toBe(false);
  expect(canReuseHttp1('2', 'keep-alive', true)).toBe(false);
});
'''
hints = ["Tách `Connection` thành token bằng dấu phẩy, trim và chuyển chữ thường.", "Kiểm tra `close` trước quy tắc mặc định của HTTP/1.1."]
explanation = "Không đưa connection vào pool khi body chưa được tiêu thụ hết vì byte còn lại có thể thuộc response hiện tại."
sources = ["http/rfc9112#section-9"]

