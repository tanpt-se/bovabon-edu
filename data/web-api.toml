[[questions]]
id = "api-084"
module = "api-styles"
type = "essay"
difficulty = 3
tags = ["level:senior"]
prompt = "Khi nào nên chọn GraphQL thay vì REST, và ngược lại?"
keywords = [
  ["over-fetching", "under-fetching", "thừa", "thiếu dữ liệu", "chọn field"],
  ["nhiều client", "mobile", "nhiều màn hình", "frontend"],
  ["cache", "http cache", "cdn"],
  ["đơn giản", "public api", "phổ biến"],
  ["schema", "type"],
]
min_keywords = 3
model_answer = '''
**GraphQL** phù hợp khi có **nhiều client** (web, mobile) với nhu cầu dữ liệu khác nhau, màn hình cần gộp nhiều resource lồng nhau — client chọn đúng field cần, tránh **over/under-fetching**, có **schema** mạnh kiểu và introspection.

**REST** phù hợp khi API **đơn giản/CRUD**, **public API** cho bên thứ ba, cần tận dụng **HTTP cache/CDN**, upload file, hoặc đội ngũ muốn vận hành đơn giản. GraphQL đòi hỏi xử lý thêm: N+1 (DataLoader), giới hạn độ sâu/độ phức tạp query, cache phía client.
'''
explanation = "Nhiều hệ thống dùng cả hai: REST cho public/webhook, GraphQL (BFF) cho frontend."

