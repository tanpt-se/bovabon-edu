[[questions]]
id = "web-api-lvc01"
module = "web-api-lead"
type = "code"
lang = "javascript"
difficulty = 3
tags = ["level:lead", "rate-limit"]
title = "Rate limiter theo gói của tenant"
prompt = '''
Viết `createLimiter(plans, now)` trả về hàm `check(tenant)` (cửa sổ cố định 60 giây):
- `plans` là `{ free: 3, pro: 10 }` (số request/phút); `tenant = { id, plan }`; plan lạ dùng giới hạn của `free`
- `now()` trả thời gian hiện tại theo mili giây
- Mỗi tenant có bộ đếm riêng; cửa sổ bắt đầu ở request đầu tiên của tenant và kéo dài 60.000 ms, sau đó bộ đếm reset
- `check` trả `{ allowed: true, remaining }` (remaining sau khi trừ), hoặc khi vượt quota `{ allowed: false, status: 429, retryAfter }` với `retryAfter` là số giây (làm tròn lên) tới khi cửa sổ kết thúc
'''
starter = '''
function createLimiter(plans, now) {
  return function check(tenant) {
    return { allowed: true, remaining: 0 };
  };
}
'''
solution = '''
function createLimiter(plans, now) {
  const state = new Map();
  return function check(tenant) {
    const limit = plans[tenant.plan] !== undefined ? plans[tenant.plan] : plans.free;
    const t = now();
    let s = state.get(tenant.id);
    if (!s || t - s.start >= 60000) {
      s = { start: t, count: 0 };
      state.set(tenant.id, s);
    }
    if (s.count >= limit) {
      return { allowed: false, status: 429, retryAfter: Math.ceil((s.start + 60000 - t) / 1000) };
    }
    s.count++;
    return { allowed: true, remaining: limit - s.count };
  };
}
'''
tests = '''
let clock = 0;
const plans = { free: 3, pro: 10 };
const mk = () => { clock = 0; return createLimiter(plans, () => clock); };
test('trừ dần remaining', () => {
  const check = mk();
  expect(check({ id: 'a', plan: 'free' })).toEqual({ allowed: true, remaining: 2 });
  expect(check({ id: 'a', plan: 'free' }).remaining).toBe(1);
});
test('vượt quota trả 429 và retryAfter', () => {
  const check = mk();
  for (let i = 0; i < 3; i++) check({ id: 'a', plan: 'free' });
  clock = 20500;
  expect(check({ id: 'a', plan: 'free' })).toEqual({ allowed: false, status: 429, retryAfter: 40 });
});
test('reset sau 60 giây', () => {
  const check = mk();
  for (let i = 0; i < 4; i++) check({ id: 'a', plan: 'free' });
  clock = 60000;
  expect(check({ id: 'a', plan: 'free' })).toEqual({ allowed: true, remaining: 2 });
});
test('tenant độc lập và plan pro', () => {
  const check = mk();
  for (let i = 0; i < 3; i++) check({ id: 'a', plan: 'free' });
  expect(check({ id: 'b', plan: 'pro' })).toEqual({ allowed: true, remaining: 9 });
  expect(check({ id: 'a', plan: 'free' }).allowed).toBe(false);
});
test('plan lạ dùng giới hạn free', () => {
  const check = mk();
  expect(check({ id: 'c', plan: 'unknown' }).remaining).toBe(2);
});
'''
hints = ["Lưu `{ start, count }` cho mỗi tenant trong một `Map`.", "retryAfter = ceil((start + 60000 - now) / 1000)."]
explanation = "Đây là fixed window theo tenant. Hệ thống thật đặt counter ở Redis (INCR + EXPIRE) và có thể dùng token bucket để mượt hơn ở ranh giới cửa sổ."

