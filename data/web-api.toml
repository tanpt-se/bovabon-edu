Đầu tiên gửi `Content-Security-Policy-Report-Only` cùng cấu hình reporting để thống kê nguồn script và kết nối đang dùng mà chưa chặn. Sau khi dọn nguồn không cần thiết, áp dụng policy thực thi với `default-src 'none'` hoặc baseline phù hợp, khai báo `script-src` rõ ràng và dùng nonce ngẫu nhiên mới cho mỗi response hoặc hash cho script tĩnh. Hạn chế `'unsafe-inline'`, khai báo `connect-src` cho API cần thiết và `frame-ancestors` theo chính sách nhúng. CSP giới hạn hành vi/tài nguyên trang; CORS kiểm soát việc browser cho phép JavaScript đọc response cross-origin, nên cần chẩn đoán header và console theo từng cơ chế.
