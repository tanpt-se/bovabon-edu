[[questions]]
id = "web-api-dv021"
module = "web-api-dv-csp"
type = "essay"
difficulty = 3
prompt = "Bạn cần triển khai CSP cho một ứng dụng lâu năm có nhiều script bên thứ ba. Trình bày cách rollout, cách cho phép script tin cậy và cách phân biệt lỗi CSP với CORS."
keywords = [["report-only", "chỉ báo cáo"], ["nonce", "hash"], ["script-src"], ["unsafe-inline"], ["cors"], ["connect-src"], ["frame-ancestors"]]
min_keywords = 4
model_answer = '''
Đầu tiên gửi `Content-Security-Policy-Report-Only` cùng cấu hình reporting để thống kê nguồn script và kết nối đang dùng mà chưa chặn. Sau khi dọn nguồn không cần thiết, áp dụng policy thực thi với `default-src 'none'` hoặc baseline phù hợp, khai báo `script-src` rõ ràng và dùng nonce ngẫu nhiên mới cho mỗi response hoặc hash cho script tĩnh. Hạn chế `'unsafe-inline'`, khai báo `connect-src` cho API cần thiết và `frame-ancestors` theo chính sách nhúng. CSP giới hạn hành vi/tài nguyên trang; CORS kiểm soát việc browser cho phép JavaScript đọc response cross-origin, nên cần chẩn đoán header và console theo từng cơ chế.
'''
explanation = "Rollout quan sát giúp phát hiện dependency hợp lệ trước khi bật enforcement; nonce/hash giảm nhu cầu cho phép inline script rộng."
sources = ["http/reference/headers/content-security-policy", "http/reference/headers/content-security-policy-report-only", "http/reference/headers/content-security-policy/script-src"]

