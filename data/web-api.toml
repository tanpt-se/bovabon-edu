[[questions]]
id = "api-043"
module = "api-caching"
type = "code"
difficulty = 3
title = "Conditional GET với ETag"
prompt = '''
Viết:
1. `etagOf(body)` — tạo **strong ETag** dạng `"<hash>"` (có dấu ngoặc kép) từ `JSON.stringify(body)` bằng hàm băm FNV-1a 32-bit, in hex 8 ký tự (đệm 0):
   `h = 0x811c9dc5`; với mỗi mã ký tự `c`: `h ^= c; h = Math.imul(h, 0x01000193) >>> 0`
2. `conditionalGet(req, body)` → response:
   - header `If-None-Match` (không phân biệt hoa thường) chứa ETag hiện tại (danh sách cách nhau bởi dấu phẩy, chấp nhận dạng weak `W/"..."`, hoặc `*`) → `{ status: 304, headers: { ETag } }`
   - ngược lại `{ status: 200, headers: { ETag, 'Cache-Control': 'no-cache' }, body }`
'''
starter = '''
function etagOf(body) {
  return '"0"';
}

function conditionalGet(req, body) {
  return { status: 200, headers: {}, body };
}
'''
solution = '''
function etagOf(body) {
  const s = JSON.stringify(body);
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return '"' + h.toString(16).padStart(8, '0') + '"';
}

function conditionalGet(req, body) {
  const etag = etagOf(body);
  let inm;
  for (const k of Object.keys(req.headers || {})) if (k.toLowerCase() === 'if-none-match') inm = req.headers[k];
  if (inm) {
    const tags = inm.split(',').map((t) => t.trim().replace(/^W\//, ''));
    if (tags.includes('*') || tags.includes(etag)) return { status: 304, headers: { ETag: etag } };
  }
  return { status: 200, headers: { ETag: etag, 'Cache-Control': 'no-cache' }, body };
}
'''
tests = '''
const body = { id: 1, name: 'Bovabon' };
test('etag ổn định & đúng định dạng', () => {
  const e = etagOf(body);
  expect(e).toMatch(/^"[0-9a-f]{8}"$/);
  expect(etagOf({ id: 1, name: 'Bovabon' })).toBe(e);
  expect(etagOf({ id: 2 })).not.toBe(e);
});
test('FNV-1a đúng thuật toán', () => {
  // JSON.stringify(1) === "1" → FNV-1a 32-bit của "1" = 0x340ca71c
  expect(etagOf(1)).toBe('"340ca71c"');
});
test('lần đầu → 200 + ETag', () => {
  const r = conditionalGet({ headers: {} }, body);
  expect(r.status).toBe(200);
  expect(r.body).toEqual(body);
  expect(r.headers['Cache-Control']).toBe('no-cache');
});
test('ETag khớp → 304', () => {
  const tag = conditionalGet({ headers: {} }, body).headers.ETag;
  const r = conditionalGet({ headers: { 'If-None-Match': tag } }, body);
  expect(r).toEqual({ status: 304, headers: { ETag: tag } });
});
test('danh sách + weak + hoa thường header', () => {
  const tag = etagOf(body);
  expect(conditionalGet({ headers: { 'if-none-match': '"x", W/' + tag } }, body).status).toBe(304);
});
test('dữ liệu đổi → 200', () => {
  const old = etagOf(body);
  expect(conditionalGet({ headers: { 'If-None-Match': old } }, { ...body, name: 'New' }).status).toBe(200);
});
test('* luôn khớp', () => {
  expect(conditionalGet({ headers: { 'If-None-Match': '*' } }, body).status).toBe(304);
});
'''
hints = ["`Math.imul` nhân 32-bit; `>>> 0` đưa về số không dấu.", "Bỏ tiền tố `W/` trước khi so sánh (weak comparison cho GET)."]
explanation = "Express tự sinh ETag (weak) cho `res.send`; với API lớn nên tính ETag từ version/updated_at thay vì băm cả body."
sources = ["http/rfc9110#section-8.8.3", "http/rfc9110#section-15.4.5"]

