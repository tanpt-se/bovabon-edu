[[questions]]
id = "web-api-dvc01"
module = "web-api-dv-representations"
type = "code"
difficulty = 2
title = "Phản hồi byte range đơn"
lang = "javascript"
prompt = '''
Viết `rangeResponse(data, rangeHeader)` cho dữ liệu ASCII trong chuỗi `data` và tối đa một byte range:
- Không có header, unit không phải `bytes`, cú pháp sai hoặc nhiều range: bỏ qua header và trả `{ status: 200, headers: { 'Accept-Ranges': 'bytes', 'Content-Length': '<độ dài>' }, body: data }`.
- Chấp nhận dạng `bytes=start-end`, `bytes=start-` và `bytes=-suffixLength`; hai đầu mút của range là bao gồm.
- Range hợp lệ: trả `206`, body là phần được chọn, có `Content-Range: bytes start-end/total` và `Content-Length` đúng độ dài body. Nếu end vượt quá cuối chuỗi thì giới hạn về byte cuối.
- Range hợp lệ nhưng không có byte nào thỏa mãn (ví dụ start vượt quá độ dài hoặc suffix bằng 0): trả `416`, `Content-Range: bytes */total`, `Content-Length: '0'`, body rỗng.
- Luôn có `Accept-Ranges: bytes`. Vì dữ liệu là ASCII, mỗi ký tự tương ứng một byte.
'''
starter = '''
function rangeResponse(data, rangeHeader) {
  return { status: 200, headers: { 'Accept-Ranges': 'bytes' }, body: data };
}
'''
solution = '''
function rangeResponse(data, rangeHeader) {
  const total = data.length;
  const full = () => ({ status: 200, headers: { 'Accept-Ranges': 'bytes', 'Content-Length': String(total) }, body: data });
  const unsatisfiable = () => ({ status: 416, headers: { 'Accept-Ranges': 'bytes', 'Content-Range': 'bytes */' + total, 'Content-Length': '0' }, body: '' });
  if (typeof rangeHeader !== 'string' || !rangeHeader.startsWith('bytes=') || rangeHeader.slice(6).includes(',')) return full();
  const match = /^(\d*)-(\d*)$/.exec(rangeHeader.slice(6));
  if (!match || (match[1] === '' && match[2] === '')) return full();
  let start;
  let end;
  if (match[1] === '') {
    const suffix = Number(match[2]);
    if (!Number.isSafeInteger(suffix)) return full();
    if (suffix <= 0 || total === 0) return unsatisfiable();
    start = Math.max(0, total - suffix);
    end = total - 1;
  } else {
    start = Number(match[1]);
    end = match[2] === '' ? total - 1 : Number(match[2]);
    if (!Number.isSafeInteger(start) || !Number.isSafeInteger(end)) return full();
    if (total === 0 || start >= total || start > end) return unsatisfiable();
    end = Math.min(end, total - 1);
  }
  const body = data.slice(start, end + 1);
  return { status: 206, headers: { 'Accept-Ranges': 'bytes', 'Content-Range': 'bytes ' + start + '-' + end + '/' + total, 'Content-Length': String(body.length) }, body };
}
'''
tests = '''
test('không có range → toàn bộ nội dung', () => {
  expect(rangeResponse('abcdef', null)).toEqual({ status: 200, headers: { 'Accept-Ranges': 'bytes', 'Content-Length': '6' }, body: 'abcdef' });
});
test('range có hai đầu mút bao gồm', () => {
  expect(rangeResponse('abcdef', 'bytes=1-3')).toEqual({ status: 206, headers: { 'Accept-Ranges': 'bytes', 'Content-Range': 'bytes 1-3/6', 'Content-Length': '3' }, body: 'bcd' });
});
test('range mở tới cuối chuỗi', () => {
  expect(rangeResponse('abcdef', 'bytes=4-').body).toBe('ef');
});
test('suffix range lấy các byte cuối', () => {
  expect(rangeResponse('abcdef', 'bytes=-2').body).toBe('ef');
});
test('end vượt quá độ dài được giới hạn', () => {
  expect(rangeResponse('abcdef', 'bytes=4-99').headers['Content-Range']).toBe('bytes 4-5/6');
});
test('range vượt quá nội dung → 416', () => {
  expect(rangeResponse('abcdef', 'bytes=6-8')).toEqual({ status: 416, headers: { 'Accept-Ranges': 'bytes', 'Content-Range': 'bytes */6', 'Content-Length': '0' }, body: '' });
});
test('cú pháp không hỗ trợ và nhiều range bị bỏ qua', () => {
  expect(rangeResponse('abcdef', 'items=1-2').status).toBe(200);
  expect(rangeResponse('abcdef', 'bytes=0-1,4-5').status).toBe(200);
});
test('suffix không dương và dữ liệu rỗng không tạo range', () => {
  expect(rangeResponse('abcdef', 'bytes=-0').status).toBe(416);
  expect(rangeResponse('', 'bytes=0-0').status).toBe(416);
});
'''
hints = ["Tách hai trường hợp suffix và start/end; nhớ range có cả hai đầu mút.", "Với range sai cú pháp, trả toàn bộ response; với range hợp lệ nhưng không thỏa mãn, trả 416."]
explanation = "Byte range thường dùng cho media và resume download; trong production hãy giới hạn số range và tổng chi phí xử lý."
sources = ["http/rfc9110#section-14", "http/reference/headers/range", "http/reference/headers/content-range"]

