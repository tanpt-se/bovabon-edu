[[questions]]
id = "web-api-lvc04"
module = "api-caching"
type = "code"
lang = "javascript"
difficulty = 2
tags = ["level:middle", "caching"]
title = "Parse Cache-Control"
prompt = '''
Viết `parseCacheControl(header)` trả về object mô tả directive:
- Tách theo dấu `,`, bỏ khoảng trắng thừa, tên directive chuyển chữ thường
- Directive không có giá trị → `true` (ví dụ `public` → `{ public: true }`)
- Directive dạng `max-age=300` → số `300`; `s-maxage` và `stale-while-revalidate` cũng chuyển thành số
- Directive khác có giá trị thì giữ nguyên chuỗi, bỏ dấu nháy kép bao quanh nếu có
- `header` là `null`, `undefined` hoặc rỗng → `{}`
'''
starter = '''
function parseCacheControl(header) {
  return {};
}
'''
solution = '''
function parseCacheControl(header) {
  const out = {};
  if (!header) return out;
  const numeric = ['max-age', 's-maxage', 'stale-while-revalidate'];
  for (const part of header.split(',')) {
    const p = part.trim();
    if (!p) continue;
    const i = p.indexOf('=');
    if (i === -1) {
      out[p.toLowerCase()] = true;
      continue;
    }
    const name = p.slice(0, i).trim().toLowerCase();
    let value = p.slice(i + 1).trim();
    if (numeric.includes(name)) {
      out[name] = Number(value);
    } else {
      if (value.length >= 2 && value[0] === '"' && value[value.length - 1] === '"') value = value.slice(1, -1);
      out[name] = value;
    }
  }
  return out;
}
'''
tests = '''
test('directive đơn giản', () => {
  expect(parseCacheControl('public, max-age=300')).toEqual({ public: true, 'max-age': 300 });
});
test('khoảng trắng và hoa thường', () => {
  expect(parseCacheControl(' No-Cache ,  S-MaxAge=60 ')).toEqual({ 'no-cache': true, 's-maxage': 60 });
});
test('stale-while-revalidate là số', () => {
  expect(parseCacheControl('max-age=10, stale-while-revalidate=30')['stale-while-revalidate']).toBe(30);
});
test('giá trị có nháy kép', () => {
  expect(parseCacheControl('private="Set-Cookie"')).toEqual({ private: 'Set-Cookie' });
});
test('đầu vào rỗng', () => {
  expect(parseCacheControl(null)).toEqual({});
  expect(parseCacheControl('')).toEqual({});
  expect(parseCacheControl(undefined)).toEqual({});
});
'''
hints = ["Tách bằng `split(',')` rồi `trim()` từng phần.", "Dùng `indexOf('=')` để phân biệt directive có giá trị."]
explanation = "Proxy, CDN và client HTTP đều phải parse header này để biết có được cache và trong bao lâu."

