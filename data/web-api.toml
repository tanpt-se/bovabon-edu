[[questions]]
id = "web-api-lv045"
module = "api-rest"
type = "essay"
difficulty = 2
tags = ["level:middle", "pagination"]
prompt = "So sánh offset pagination và cursor pagination. Khi nào nên chọn mỗi loại?"
keywords = [
  ["offset"],
  ["cursor", "keyset"],
  ["ổn định", "lặp", "sót", "chèn", "stable"],
  ["index", "hiệu năng", "chậm", "performance"],
  ["nhảy trang", "trang bất kỳ", "random access", "đếm tổng"],
]
min_keywords = 3
model_answer = '''
- **Offset**: `LIMIT n OFFSET m`, đơn giản, nhảy tới trang bất kỳ và hiển thị tổng số trang dễ. Nhược điểm: dữ liệu bị chèn/xoá khiến trang lặp hoặc sót; offset lớn thì chậm vì DB phải bỏ qua nhiều dòng.
- **Cursor/keyset**: dùng giá trị khoá của bản ghi cuối (`WHERE id > :last`), hiệu năng ổn định nhờ index, kết quả ổn định khi dữ liệu thay đổi. Nhược điểm: không nhảy trang tuỳ ý, cần khoá sắp xếp ổn định, khó đếm tổng.
- Chọn **offset** cho bảng nhỏ/admin cần nhảy trang; chọn **cursor** cho feed, dữ liệu lớn hoặc thay đổi liên tục.
'''
explanation = "Câu trả lời tốt nêu cả hai mặt: tiện lợi của offset và tính ổn định/hiệu năng của cursor."

