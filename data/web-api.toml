[[questions]]
id = "web-api-lvc05"
module = "api-http"
type = "code"
lang = "javascript"
difficulty = 3
tags = ["level:senior", "retry"]
title = "Tính độ trễ retry"
prompt = '''
Viết `retryDelay(attempt, response, opts)` trả về số mili giây cần chờ trước lần thử tiếp theo hoặc `null` nếu không nên retry:
- `attempt` bắt đầu từ 1 (lần thất bại đầu tiên)
- `response = { status, headers }` (header key viết thường); `opts = { base, cap, maxAttempts, random }` với `random()` trả số trong `[0, 1)`
- Chỉ retry khi status là 429, 502, 503 hoặc 504; status khác → `null`
- `attempt >= maxAttempts` → `null`
- Nếu có header `retry-after` dạng số giây → trả `seconds * 1000` (không áp dụng jitter, nhưng không vượt `cap`; vượt cap thì trả `cap`)
- Ngược lại dùng exponential backoff với **full jitter**: `Math.floor(random() * Math.min(cap, base * 2 ** (attempt - 1)))`
'''
starter = '''
function retryDelay(attempt, response, opts) {
  return null;
}
'''
solution = '''
function retryDelay(attempt, response, opts) {
  const retryable = [429, 502, 503, 504];
  if (!retryable.includes(response.status)) return null;
  if (attempt >= opts.maxAttempts) return null;
  const ra = response.headers && response.headers['retry-after'];
  if (ra !== undefined && ra !== null && ra !== '' && !Number.isNaN(Number(ra))) {
    return Math.min(opts.cap, Number(ra) * 1000);
  }
  const ceiling = Math.min(opts.cap, opts.base * 2 ** (attempt - 1));
  return Math.floor(opts.random() * ceiling);
}
'''
tests = '''
const opts = (r) => ({ base: 100, cap: 5000, maxAttempts: 4, random: () => r });
test('status không retry được', () => {
  expect(retryDelay(1, { status: 400, headers: {} }, opts(0.5))).toBeNull();
  expect(retryDelay(1, { status: 500, headers: {} }, opts(0.5))).toBeNull();
});
test('hết số lần thử', () => {
  expect(retryDelay(4, { status: 503, headers: {} }, opts(0.5))).toBeNull();
});
test('full jitter theo lần thử', () => {
  expect(retryDelay(1, { status: 503, headers: {} }, opts(0.5))).toBe(50);
  expect(retryDelay(3, { status: 502, headers: {} }, opts(0.5))).toBe(200);
});
test('retry-after được ưu tiên và bị chặn bởi cap', () => {
  expect(retryDelay(1, { status: 429, headers: { 'retry-after': '2' } }, opts(0.9))).toBe(2000);
  expect(retryDelay(1, { status: 429, headers: { 'retry-after': '120' } }, opts(0.9))).toBe(5000);
});
test('cap giới hạn ceiling của backoff', () => {
  const o = { base: 1000, cap: 3000, maxAttempts: 10, random: () => 0.999 };
  expect(retryDelay(5, { status: 504, headers: {} }, o)).toBe(2997);
});
'''
hints = ["Kiểm tra status và số lần thử trước.", "Ceiling = min(cap, base * 2^(attempt-1)), rồi nhân với random()."]
explanation = "Full jitter phân tán thời điểm retry của nhiều client để tránh retry đồng bộ; tôn trọng `Retry-After` để không chống lại chỉ dẫn của server."

