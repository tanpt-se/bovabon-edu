[[questions]]
id = "web-api-lvc06"
module = "api-caching"
type = "code"
lang = "javascript"
difficulty = 3
tags = ["level:senior", "caching"]
title = "Xử lý conditional GET"
prompt = '''
Viết `handleConditionalGet(req, resource)` với `req = { headers }` (khoá viết thường) và `resource = { body, etag }` (`etag` đã có dấu nháy, ví dụ `'"v1"'`):
- Nếu không có `if-none-match` → `{ status: 200, headers: { ETag: resource.etag }, body: resource.body }`
- `if-none-match` có thể là `*` hoặc danh sách ETag phân tách bằng dấu phẩy; so sánh **yếu** (bỏ tiền tố `W/` ở cả hai phía)
- Có khớp → `{ status: 304, headers: { ETag: resource.etag } }` (không có `body`)
- Không khớp → như trường hợp 200 ở trên
'''
starter = '''
function handleConditionalGet(req, resource) {
  return { status: 200, headers: { ETag: resource.etag }, body: resource.body };
}
'''
solution = '''
function handleConditionalGet(req, resource) {
  const strip = (t) => t.trim().replace(/^W\//, '');
  const inm = req.headers['if-none-match'];
  if (inm) {
    const wanted = strip(resource.etag);
    const tags = inm.split(',').map(strip);
    if (tags.includes('*') || tags.includes(wanted)) {
      return { status: 304, headers: { ETag: resource.etag } };
    }
  }
  return { status: 200, headers: { ETag: resource.etag }, body: resource.body };
}
'''
tests = '''
const res = { body: 'hello', etag: '"v1"' };
test('không có điều kiện → 200', () => {
  expect(handleConditionalGet({ headers: {} }, res)).toEqual({ status: 200, headers: { ETag: '"v1"' }, body: 'hello' });
});
test('khớp → 304 không có body', () => {
  const r = handleConditionalGet({ headers: { 'if-none-match': '"v1"' } }, res);
  expect(r.status).toBe(304);
  expect(r.body).toBeUndefined();
  expect(r.headers.ETag).toBe('"v1"');
});
test('so sánh yếu bỏ tiền tố W/', () => {
  expect(handleConditionalGet({ headers: { 'if-none-match': 'W/"v1"' } }, res).status).toBe(304);
});
test('danh sách và dấu *', () => {
  expect(handleConditionalGet({ headers: { 'if-none-match': '"a", "v1"' } }, res).status).toBe(304);
  expect(handleConditionalGet({ headers: { 'if-none-match': '*' } }, res).status).toBe(304);
});
test('không khớp → 200', () => {
  expect(handleConditionalGet({ headers: { 'if-none-match': '"v2"' } }, res).status).toBe(200);
});
'''
hints = ["Tách `if-none-match` bằng dấu phẩy và chuẩn hoá từng phần.", "304 không kèm body nhưng vẫn gửi lại ETag."]
explanation = "Conditional GET tiết kiệm băng thông: client giữ bản cache và chỉ tải lại khi ETag đổi. Với GET dùng so sánh yếu theo RFC 9110."

[[questions]]
id = "web-api-lv062"
module = "api-caching"
type = "single"
difficulty = 3
tags = ["level:senior", "caching"]
prompt = "API trả danh sách sản phẩm dùng chung cho mọi người, nhưng response có thêm trường `isFavorite` tính theo user đang đăng nhập. Header cache nào hợp lý nhất?"
options = [
  "`Cache-Control: public, max-age=300` vì danh sách sản phẩm ít thay đổi",
  "`Cache-Control: private, max-age=60` (hoặc tách phần cá nhân hoá sang endpoint riêng để phần chung được cache public)",
  "`Cache-Control: no-store` cho mọi response để tránh mọi rủi ro",
  "`Vary: *` cùng `public, max-age=300` để CDN tự phân biệt theo user",
]
answer = [1]
explanation = "Response có dữ liệu riêng từng user thì CDN/proxy dùng chung không được lưu (`private`). Cách tốt hơn ở cấp senior là tách phần cá nhân hoá ra để phần chung vẫn cache `public` được. `no-store` an toàn nhưng bỏ phí cache trình duyệt; `Vary: *` khiến response gần như không cache được."
sources = ["http/reference/headers/cache-control"]
