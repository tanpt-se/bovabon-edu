[[questions]]
id = "web-api-lvc03"
module = "api-rest"
type = "code"
lang = "javascript"
difficulty = 1
tags = ["level:junior", "rest"]
title = "Dựng query string"
prompt = '''
Viết `buildQuery(params)` nhận object phẳng và trả về query string (không có dấu `?` đầu):
- Bỏ qua giá trị `null` hoặc `undefined`
- Mã hoá key và value bằng `encodeURIComponent`
- Các cặp nối bằng `&`, giữ thứ tự khoá như trong object
- Object rỗng (hoặc toàn giá trị bị bỏ) → chuỗi rỗng `''`
'''
starter = '''
function buildQuery(params) {
  return '';
}
'''
solution = '''
function buildQuery(params) {
  return Object.keys(params)
    .filter((k) => params[k] !== null && params[k] !== undefined)
    .map((k) => encodeURIComponent(k) + '=' + encodeURIComponent(params[k]))
    .join('&');
}
'''
tests = '''
test('cơ bản', () => {
  expect(buildQuery({ page: 2, q: 'abc' })).toBe('page=2&q=abc');
});
test('bỏ null và undefined', () => {
  expect(buildQuery({ a: 1, b: null, c: undefined, d: 0 })).toBe('a=1&d=0');
});
test('mã hoá ký tự đặc biệt', () => {
  expect(buildQuery({ q: 'a b&c' })).toBe('q=a%20b%26c');
});
test('object rỗng', () => {
  expect(buildQuery({})).toBe('');
});
test('giá trị boolean và chuỗi rỗng', () => {
  expect(buildQuery({ ok: false, s: '' })).toBe('ok=false&s=');
});
'''
hints = ["Lọc các giá trị null/undefined trước khi map.", "Nhớ mã hoá cả key lẫn value."]
explanation = "Giá trị 0, false hay chuỗi rỗng vẫn hợp lệ nên chỉ loại null/undefined. Mã hoá bằng `encodeURIComponent` ngăn ký tự như `&` làm vỡ cấu trúc query."

