[[modules]]
id = "api-http"
title = "HTTP căn bản"
description = "Method, tính an toàn & idempotent, status code, header quan trọng, HTTP/2 & HTTP/3."
sources = ["http/reference/methods", "http/reference/status"]
lesson = '''
### Method
| Method | Safe | Idempotent | Dùng cho |
|---|---|---|---|
| GET | ✓ | ✓ | đọc |
| HEAD | ✓ | ✓ | như GET nhưng không body |
| PUT | ✗ | ✓ | thay thế toàn bộ |
| DELETE | ✗ | ✓ | xoá |
| POST | ✗ | ✗ | tạo mới / hành động |
| PATCH | ✗ | không đảm bảo | sửa một phần |

### Status code
- **2xx**: 200 OK, 201 Created (+ header `Location`), 204 No Content
- **3xx**: 301/308 chuyển vĩnh viễn, 302/307 tạm thời, **304 Not Modified**
- **4xx**: 400 Bad Request, **401** chưa xác thực, **403** không có quyền, 404, 405, 409 Conflict, 422 dữ liệu không hợp lệ, **429** Too Many Requests
- **5xx**: 500, 502 Bad Gateway, 503 Service Unavailable, 504 Gateway Timeout

HTTP/2: multiplexing nhiều request trên 1 kết nối, nén header (HPACK). HTTP/3 chạy trên **QUIC** (UDP), tránh head-of-line blocking của TCP.
'''

[[modules]]
id = "api-rest"
title = "Thiết kế REST API"
description = "Resource & URL, versioning, phân trang, lọc/sắp xếp, idempotency key, định dạng lỗi."
sources = ["http/reference/status"]
lesson = '''
### Nguyên tắc
- URL là **danh từ số nhiều** chỉ resource: `GET /users/42/orders`, không phải `/getUserOrders`.
- Hành động bằng method; status code đúng ngữ nghĩa.
- **Versioning**: `/v1/...` hoặc header; không phá vỡ client cũ (chỉ thêm field).
- **Phân trang**: offset/limit (đơn giản, chậm & lệch khi dữ liệu thay đổi) vs **cursor** (ổn định, hiệu quả với dữ liệu lớn).
- Lọc/sắp xếp: `?status=paid&sort=-created_at`.
- **Idempotency-Key** cho POST quan trọng (thanh toán): server lưu kết quả theo key, retry trả lại đúng kết quả cũ.
- Định dạng lỗi thống nhất, ví dụ **RFC 9457 Problem Details** (`application/problem+json`: `type`, `title`, `status`, `detail`).
- Tài liệu hoá bằng **OpenAPI**.
'''

[[modules]]
id = "api-caching"
title = "Caching & Hiệu năng"
description = "Cache-Control, ETag/If-None-Match, CDN, nén, rate limit header."
sources = ["http/rfc9111#section-5.2", "http/rfc9110#section-8.8.3", "http/rfc9110#section-15.4.5"]
lesson = '''
### Ý chính
- `Cache-Control: max-age=60` (trình duyệt), `s-maxage` (CDN/shared cache), `private` (chỉ trình duyệt), `no-cache` (phải revalidate), `no-store` (không lưu), `stale-while-revalidate`.
- **ETag** + `If-None-Match` → server trả **304** không body nếu không đổi. Tương tự `Last-Modified` + `If-Modified-Since`.
- Strong vs weak ETag (`W/"..."`).
- `Vary: Accept-Encoding, Authorization` để cache phân biệt biến thể.
- Nén `br`/`gzip` qua `Accept-Encoding`/`Content-Encoding`.
- Rate limit: trả 429 + `Retry-After`.
'''

[[modules]]
id = "api-auth"
title = "Xác thực, phân quyền & bảo mật"
description = "Session cookie vs token, JWT, OAuth2 / OIDC, PKCE, CORS, CSRF, OWASP API Top 10."
sources = ["http/guides/cors", "http/reference/headers/set-cookie", "http/reference/headers/content-security-policy", "http/reference/headers/strict-transport-security", "http/reference/headers/authorization", "http/reference/headers/www-authenticate"]
lesson = '''
### Ý chính
- **Authentication** (bạn là ai) ≠ **Authorization** (bạn được làm gì).
- **Session cookie**: server lưu phiên, cookie `HttpOnly; Secure; SameSite`. Dễ thu hồi.
- **JWT access token** ngắn hạn + **refresh token** (xoay vòng, lưu an toàn). JWT khó thu hồi trước hạn.
- **OAuth 2.0**: uỷ quyền truy cập; luồng **Authorization Code + PKCE** cho SPA/mobile; Client Credentials cho service-to-service. **OIDC** thêm `id_token` để xác thực.
- **CORS** do trình duyệt thực thi; preflight `OPTIONS` cho request có header/method đặc biệt.
- **OWASP API Top 10**: BOLA (Broken Object Level Authorization — luôn kiểm tra quyền sở hữu resource!), broken auth, lộ dữ liệu quá mức, thiếu rate limit, SSRF…
- Luôn dùng HTTPS + `Strict-Transport-Security`.
'''

[[modules]]
id = "api-styles"
title = "REST, GraphQL, gRPC & Realtime"
description = "So sánh kiểu API, WebSocket, SSE, webhook, message queue."
sources = ["http/guides/protocol_upgrade_mechanism", "http/rfc9110#section-7.8", "http/reference/headers/upgrade", "http/reference/headers/connection"]
lesson = '''
| | REST | GraphQL | gRPC |
|---|---|---|---|
| Truyền tải | HTTP + JSON | HTTP (thường POST 1 endpoint) | HTTP/2 + Protobuf |
| Ưu | đơn giản, cache HTTP tốt | client chọn field, gộp nhiều resource | nhanh, type-safe, streaming |
| Nhược | over/under-fetching | cache khó, N+1 (dùng DataLoader) | khó gọi trực tiếp từ trình duyệt |

### Realtime
- **Polling** → đơn giản, tốn tài nguyên.
- **SSE** (Server-Sent Events): server → client một chiều qua HTTP, tự reconnect.
- **WebSocket**: hai chiều, full-duplex.
- **Webhook**: server gọi ngược tới URL của bạn khi có sự kiện — xác minh chữ ký HMAC, xử lý idempotent, trả 2xx nhanh.
'''

[[modules]]
id = "web-api-dv-representations"
title = "Content negotiation & range requests"
description = "Chọn định dạng biểu diễn, xử lý byte range và tiếp tục tải nội dung lớn."
sources = ["http/rfc9110#section-12", "http/rfc9110#section-14", "http/reference/headers/accept", "http/reference/headers/content-type", "http/reference/headers/range", "http/reference/headers/content-range"]
lesson = '''
### Chọn biểu diễn và tải một phần tài nguyên

Một resource có thể được biểu diễn ở nhiều định dạng. Client mô tả định dạng có thể nhận qua `Accept`; server mô tả định dạng thực tế của body bằng `Content-Type`. Request body lại có `Content-Type` riêng, vì vậy không nên dùng hai header này thay cho nhau. Nếu server không hỗ trợ kiểu dữ liệu request, thường trả `415 Unsupported Media Type`; nếu không thể tạo representation nào client chấp nhận, có thể trả `406 Not Acceptable`. Khi nội dung response thay đổi theo `Accept`, cache cần biết biến thể này qua `Vary: Accept`.

| Tình huống | Header / status | Ý nghĩa |
|---|---|---|
| Client chọn JSON | `Accept: application/json` | Định dạng mong muốn |
| Server trả JSON | `Content-Type: application/json` | Định dạng body thực tế |
| Tải một phần | `Range: bytes=100-199` | Yêu cầu khoảng byte |
| Server chấp nhận range | `206 Partial Content` | Body chỉ chứa phần được chọn |
| Range không thỏa mãn | `416 Range Not Satisfiable` | Không có byte nào trong khoảng hợp lệ |

Range hữu ích khi tải video, file lớn hoặc tiếp tục tải sau khi mất kết nối. Response `206` thường có `Content-Range: bytes 100-199/1000`, trong đó mẫu số là tổng độ dài representation. `Accept-Ranges: bytes` quảng bá hỗ trợ này. `If-Range` cho phép client gửi range khi validator còn khớp; nếu nội dung đã đổi, server gửi toàn bộ representation với `200` để tránh ghép các phần thuộc hai phiên bản khác nhau.

Ví dụ: client yêu cầu `Range: bytes=0-99`, server trả `206`, `Content-Range: bytes 0-99/1000` và đúng 100 byte đầu. Lỗi thường gặp là nhầm `406` (không chọn được response) với `415` (không đọc được request), trả `200` nhưng chỉ kèm một phần body, hoặc quên giới hạn số range và kích thước tải để tránh tiêu hao tài nguyên. Với dữ liệu thay đổi thường xuyên, kiểm tra validator trước khi nối các đoạn tải.
'''

[[modules]]
id = "web-api-dv-framing"
title = "Message framing & connection"
description = "Cách HTTP xác định biên body, tái sử dụng kết nối và khác biệt giữa các phiên bản."
sources = ["http/rfc9112#section-2.1", "http/rfc9112#section-6", "http/rfc9112#section-9", "http/rfc9110#section-7.2", "http/rfc9113#section-9", "http/rfc9114#section-3"]
lesson = '''
### Message framing và vòng đời kết nối

HTTP/1.1 truyền message trên một kết nối TCP dạng byte stream, nên hai đầu phải thống nhất nơi body kết thúc. `Content-Length` nêu số octet của body; `Transfer-Encoding: chunked` cho phép gửi các chunk khi chưa biết tổng độ dài trước. Khi request có framing mơ hồ, chẳng hạn `Content-Length` mâu thuẫn với `Transfer-Encoding`, reverse proxy và ứng dụng có thể hiểu khác nhau về ranh giới request. Đây là dấu hiệu cần từ chối và chuẩn hóa ở biên tin cậy; không tự viết parser HTTP đơn giản.

| Phiên bản | Giao thức truyền tải | Đơn vị ghép kênh | Điểm cần nhớ |
|---|---|---|---|
| HTTP/1.1 | TCP | Một request/response đang dùng kết nối theo thứ tự | Kết nối thường được tái sử dụng; framing body phải rõ |
| HTTP/2 | TCP | Nhiều stream trên một kết nối | Binary framing, HPACK; mất gói TCP có thể chặn tiến triển các stream |
| HTTP/3 | QUIC trên UDP | Nhiều stream QUIC | QPACK; mất gói ở một stream không nhất thiết chặn stream khác |

HTTP/1.1 yêu cầu `Host` để server chọn authority đích; kết nối mặc định có thể tồn tại qua nhiều request nếu body trước đã được đọc hết và không có chỉ thị đóng. `Connection: close` ngăn tái sử dụng; HTTP/1.0 cần cơ chế keep-alive riêng. Không được quyết định pool chỉ từ status code: body chưa đọc xong thì byte còn lại có thể bị hiểu nhầm là response kế tiếp.

Lỗi hay gặp là cho rằng HTTP/2 chạy trên UDP hoặc HTTP/3 chỉ là HTTP/2 nhanh hơn. HTTP/2 vẫn kế thừa thứ tự byte của TCP; HTTP/3 dùng QUIC để cô lập tiến triển stream tốt hơn, nhưng vẫn chịu giới hạn băng thông và congestion control. Với proxy, ưu tiên server/library đã được cập nhật, giới hạn kích thước header/body và kiểm tra log giao thức đầu-cuối thay vì suy ra phiên bản từ một header ứng dụng.
'''

[[modules]]
id = "web-api-dv-csp"
title = "CSP & browser security headers"
description = "Giảm bề mặt tấn công nội dung trong trình duyệt bằng CSP và các header phòng thủ."
sources = ["http/reference/headers/content-security-policy", "http/reference/headers/content-security-policy/default-src", "http/reference/headers/content-security-policy/script-src", "http/reference/headers/content-security-policy/frame-ancestors", "http/reference/headers/content-security-policy/connect-src", "http/reference/headers/content-security-policy-report-only"]
lesson = '''
### Content Security Policy

Content Security Policy (CSP) là lớp phòng thủ do browser thực thi dựa trên policy server gửi qua response header. CSP giúp giới hạn nơi trang được tải script, ảnh, style, kết nối mạng và frame; nó giảm tác động của một số lỗi injection nhưng không thay thế encode output, kiểm tra input hay sửa XSS trong ứng dụng.

| Directive | Phạm vi | Ghi nhớ |
|---|---|---|
| `default-src` | Fallback cho một số fetch directive chưa khai báo riêng | Không thay thế `base-uri`, `form-action` hay `frame-ancestors` |
| `script-src` | Nguồn script, nonce hoặc hash được chấp nhận | Tránh cho phép inline script rộng bằng `'unsafe-inline'` |
| `connect-src` | Kết nối do trang khởi tạo như fetch/XHR/WebSocket | Giới hạn endpoint mà mã trang có thể gọi |
| `frame-ancestors` | Những site được phép nhúng trang này | `'none'` cấm embedding; khác `frame-src` |

Ví dụ policy ban đầu: `default-src 'none'; script-src 'self' 'nonce-<random-per-response>'; connect-src 'self' https://api.example; img-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'`. Nonce phải khó đoán, được tạo mới cho mỗi response và gắn đúng vào script được server tin cậy. Hash phù hợp với inline script tĩnh có nội dung ổn định. Tránh bật `'unsafe-inline'` chỉ để làm policy hết báo lỗi.

Khi triển khai trên ứng dụng cũ, bắt đầu với `Content-Security-Policy-Report-Only` và cấu hình reporting để quan sát vi phạm; policy này chỉ báo cáo, không chặn. Sau khi dọn nguồn script/kết nối hợp lệ, chuyển dần sang `Content-Security-Policy` thực thi. Lỗi thường gặp là nghĩ `default-src` khóa mọi hành vi, nhầm `frame-src` (trang tải frame nào) với `frame-ancestors` (ai được nhúng trang), hoặc coi CSP là CORS: CORS kiểm soát việc browser cho phép trang đọc response cross-origin, còn CSP giới hạn hành vi/tài nguyên của trang.

Các header khác giải quyết lớp riêng: `Strict-Transport-Security` yêu cầu browser dùng HTTPS sau khi nhận policy an toàn; `X-Content-Type-Options: nosniff` ngăn một số suy đoán MIME. Thiết lập header đúng giúp giảm rủi ro, nhưng cần kiểm tra trên trang thật để tránh vô tình chặn tài nguyên ứng dụng.
'''

[[modules]]
id = "web-api-lead"
title = "Góc nhìn Tech Lead"
description = "Quyết định thiết kế API cho cả team: versioning & deprecation, rate limit/quota, caching ở CDN, bảo mật, observability, ADR và review API."
sources = ["http/reference/status", "http/rfc9111#section-5.2", "http/guides/cors", "http/reference/headers/authorization"]
lesson = '''
### Tư duy của Tech Lead khi thiết kế API

Một API công khai là **hợp đồng dài hạn**: sau khi có consumer bên ngoài, mọi thay đổi đều có chi phí phối hợp. Tech Lead không chọn "cách đúng nhất" mà chọn **cách rẻ nhất để sửa sai** trong ràng buộc về team, thời gian, chi phí và rủi ro.

| Quyết định | Phương án | Khi nào hợp lý | Rủi ro chính |
|---|---|---|---|
| Versioning | URL `/v2` | Public API, nhiều consumer không kiểm soát được | Nhân đôi bề mặt bảo trì |
| Versioning | Header/media type | Team hiểu HTTP, consumer là SDK | Khó debug bằng trình duyệt, khó cache nếu quên `Vary` |
| Versioning | Chỉ thêm field (additive) | API nội bộ, consumer chịu được field lạ | Không sửa được lỗi thiết kế cũ |
| Rate limit | Theo IP | Endpoint công khai chưa đăng nhập | Sai khi nhiều user chung NAT |
| Rate limit | Theo API key/tenant | B2B, có gói dịch vụ | Cần lưu counter chia sẻ (Redis) |
| Cache | `private`, không CDN | Dữ liệu cá nhân | Tải dồn về origin |
| Cache | `public, s-maxage` + purge | Catalog, nội dung dùng chung | Phải có cơ chế invalidate |

### Checklist review một thay đổi API

1. Thay đổi có **breaking** không (xoá/đổi tên field, đổi kiểu, siết validation, đổi ý nghĩa status code)?
2. Retry có an toàn không: method nào idempotent, ghi nào cần `Idempotency-Key`?
3. Lỗi trả theo một định dạng thống nhất (RFC 9457) và không lộ chi tiết nội bộ?
4. Có giới hạn kích thước body, số phần tử trang, độ sâu query, timeout?
5. Authz kiểm tra ở **từng object** (chống BOLA/IDOR), không chỉ ở route?
6. Có metric theo endpoint: tỉ lệ 4xx/5xx, p95/p99, tỉ lệ 429, và log có `request id` để truy vết?
7. Consumer cũ có kế hoạch chuyển đổi và mốc tắt rõ ràng không?

### ADR mẫu (ngắn)

- **Bối cảnh**: 40 đối tác tích hợp, không ép họ nâng cấp đồng loạt; team 5 người.
- **Quyết định**: giữ `/v1` thêm field mới theo kiểu additive, ra `/v2` chỉ khi có thay đổi phá vỡ; công bố `Sunset` header trước 6 tháng (ước lượng, tuỳ hợp đồng).
- **Hệ quả**: tốn công duy trì hai bản trong giai đoạn chuyển; bù lại không có sự cố "đối tác gãy đêm khuya".

### Anti-pattern ở quy mô team

- **Vá nóng contract**: sửa response mà không báo, vì "chỉ là đổi nhỏ".
- **Một giới hạn cho tất cả**: rate limit cứng như nhau cho client nội bộ và đối tác trả tiền.
- **Cache cho response có `Set-Cookie` hoặc dữ liệu cá nhân** qua CDN chung.
- **Retry không backoff** ở client: khi server chậm, retry khuếch đại thành thảm hoạ (retry storm).
- **Thiếu owner**: API không ai chịu trách nhiệm, deprecation không bao giờ kết thúc.
- **Quyết định không ghi lại**: sau 6 tháng không ai nhớ vì sao chọn phương án đó.
'''

