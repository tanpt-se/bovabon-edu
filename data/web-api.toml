[[questions]]
id = "api-066"
module = "api-auth"
type = "code"
difficulty = 2
title = "Kiểm tra CORS"
prompt = '''
Viết `corsHeaders(req, { origins, methods, credentials })` trả về object header cho response (hoặc `{}` nếu không cho phép):
- `req = { method, headers }` (header lowercase: `origin`, `access-control-request-method`)
- Origin không nằm trong `origins` (mảng; `'*'` nghĩa là mọi origin) → `{}`
- Cho phép → luôn có `Access-Control-Allow-Origin` và `Vary: 'Origin'`
  - nếu `credentials` true → giá trị là **chính origin** (không bao giờ `*`) và thêm `Access-Control-Allow-Credentials: 'true'`
  - nếu `credentials` false và `origins` chứa `'*'` → `'*'`, ngược lại là origin
- Preflight (`method === 'OPTIONS'` và có `access-control-request-method`): nếu method yêu cầu không thuộc `methods` → `{}`; ngược lại thêm `Access-Control-Allow-Methods: methods.join(', ')`
'''
starter = '''
function corsHeaders(req, { origins, methods, credentials }) {
  return { 'Access-Control-Allow-Origin': '*' };
}
'''
solution = '''
function corsHeaders(req, { origins, methods, credentials }) {
  const origin = req.headers.origin;
  if (!origin) return {};
  const any = origins.includes('*');
  if (!any && !origins.includes(origin)) return {};
  const h = { Vary: 'Origin' };
  if (credentials) {
    h['Access-Control-Allow-Origin'] = origin;
    h['Access-Control-Allow-Credentials'] = 'true';
  } else {
    h['Access-Control-Allow-Origin'] = any ? '*' : origin;
  }
  const reqMethod = req.headers['access-control-request-method'];
  if (req.method === 'OPTIONS' && reqMethod) {
    if (!methods.includes(reqMethod)) return {};
    h['Access-Control-Allow-Methods'] = methods.join(', ');
  }
  return h;
}
'''
tests = '''
const cfg = { origins: ['https://app.bovabon.edu'], methods: ['GET', 'POST'], credentials: true };
test('origin được phép + credentials', () => {
  expect(corsHeaders({ method: 'GET', headers: { origin: 'https://app.bovabon.edu' } }, cfg)).toEqual({
    Vary: 'Origin',
    'Access-Control-Allow-Origin': 'https://app.bovabon.edu',
    'Access-Control-Allow-Credentials': 'true',
  });
});
test('origin lạ → không header', () => {
  expect(corsHeaders({ method: 'GET', headers: { origin: 'https://evil.com' } }, cfg)).toEqual({});
});
test('wildcard không credentials', () => {
  const h = corsHeaders({ method: 'GET', headers: { origin: 'https://x.dev' } }, { origins: ['*'], methods: ['GET'], credentials: false });
  expect(h['Access-Control-Allow-Origin']).toBe('*');
});
test('wildcard + credentials không bao giờ trả *', () => {
  const h = corsHeaders({ method: 'GET', headers: { origin: 'https://x.dev' } }, { origins: ['*'], methods: ['GET'], credentials: true });
  expect(h['Access-Control-Allow-Origin']).toBe('https://x.dev');
});
test('preflight hợp lệ', () => {
  const h = corsHeaders({ method: 'OPTIONS', headers: { origin: 'https://app.bovabon.edu', 'access-control-request-method': 'POST' } }, cfg);
  expect(h['Access-Control-Allow-Methods']).toBe('GET, POST');
});
test('preflight method không cho phép', () => {
  expect(corsHeaders({ method: 'OPTIONS', headers: { origin: 'https://app.bovabon.edu', 'access-control-request-method': 'DELETE' } }, cfg)).toEqual({});
});
test('không có Origin (same-origin / server-to-server)', () => {
  expect(corsHeaders({ method: 'GET', headers: {} }, cfg)).toEqual({});
});
'''
hints = ["Kiểm tra origin trước, rồi mới xét preflight.", "`Vary: Origin` để cache không trộn response giữa các origin."]
explanation = "Hiểu logic CORS giúp debug lỗi \"blocked by CORS policy\" nhanh hơn — và nhớ CORS không phải cơ chế xác thực."
sources = ["http/guides/cors"]

