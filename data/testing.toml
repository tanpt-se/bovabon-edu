[[questions]]
id = "tst-015"
module = "testing-unit"
type = "code"
difficulty = 2
lang = "javascript"
title = "Tạo spy ghi lại lời gọi"
prompt = '''
Viết `createSpy(implementation)` trả về một hàm spy:
- Mỗi lần gọi, thêm danh sách đối số của lần gọi đó vào `spy.calls`.
- Nếu `implementation` là hàm, gọi nó với các đối số nhận được và trả về kết quả; nếu không, trả về `undefined`.
- `spy.calls` ban đầu là mảng rỗng và giữ thứ tự lời gọi.

Ví dụ: `const add = createSpy((a, b) => a + b)`; `add(2, 3)` trả `5` và `add.calls` là `[[2, 3]]`.
'''
starter = '''
function createSpy(implementation) {
  return (...args) => undefined;
}
'''
solution = '''
function createSpy(implementation) {
  const spy = (...args) => {
    spy.calls.push(args);
    if (typeof implementation === 'function') return implementation(...args);
    return undefined;
  };
  spy.calls = [];
  return spy;
}
'''
tests = '''
test('ghi lại một lời gọi và trả kết quả của implementation', () => {
  const add = createSpy((a, b) => a + b);
  expect(add(2, 3)).toBe(5);
  expect(add.calls).toEqual([[2, 3]]);
});

test('ghi lại nhiều lời gọi theo thứ tự', () => {
  const spy = createSpy();
  spy('first');
  spy(2, true);
  expect(spy.calls).toEqual([['first'], [2, true]]);
});

test('implementation vắng mặt trả undefined', () => {
  const spy = createSpy();
  expect(spy('x')).toBeUndefined();
  expect(spy.calls).toEqual([['x']]);
});

test('không dùng giá trị implementation không phải hàm', () => {
  const spy = createSpy(42);
  expect(spy()).toBeUndefined();
});
'''
hints = ["Khởi tạo mảng calls một lần khi tạo spy.", "Ghi lại args trước khi gọi implementation."]
explanation = "Spy vừa giữ lịch sử đối số vừa chuyển tiếp lời gọi tới implementation nếu có."

[[questions]]
id = "tst-016"
module = "testing-unit"
type = "code"
difficulty = 3
lang = "javascript"
title = "Mini expect với deepEqual"
prompt = '''
Viết `miniExpect(actual)` trả về object có matcher `toEqual(expected)`.
- `toEqual` trả về `undefined` khi hai giá trị deep-equal.
- Nếu không bằng nhau, ném `Error`.
- Hỗ trợ primitive, `null`, array và plain object lồng nhau; object được so sánh theo tập key và value, không theo thứ tự khai báo key.
- Không cần xử lý object có chu trình hoặc prototype đặc biệt.

Ví dụ: `miniExpect({ a: [1] }).toEqual({ a: [1] })` không ném lỗi.
'''
starter = '''
function miniExpect(actual) {
  return { toEqual(expected) {} };
}
'''
solution = '''
function deepEqual(a, b) {
  if (Object.is(a, b)) return true;
  if (a === null || b === null || typeof a !== 'object' || typeof b !== 'object') return false;
  if (Array.isArray(a) !== Array.isArray(b)) return false;
  const keysA = Object.keys(a);
  const keysB = Object.keys(b);
  if (keysA.length !== keysB.length) return false;
  return keysA.every((key) => Object.prototype.hasOwnProperty.call(b, key) && deepEqual(a[key], b[key]));
}

function miniExpect(actual) {
  return {
    toEqual(expected) {
      if (!deepEqual(actual, expected)) throw new Error('Values are not deeply equal');
    }
  };
}
'''
tests = '''
test('so sánh primitive và array lồng nhau', () => {
  expect(miniExpect([1, { ok: true }]).toEqual([1, { ok: true }])).toBeUndefined();
});

test('không phụ thuộc thứ tự key của object', () => {
  expect(miniExpect({ a: 1, b: { c: 2 } }).toEqual({ b: { c: 2 }, a: 1 })).toBeUndefined();
});

test('phân biệt array với object có key số', () => {
  expect(() => miniExpect([1]).toEqual({ 0: 1 })).toThrow();
});

test('ném lỗi khi giá trị lồng nhau khác', () => {
  expect(() => miniExpect({ a: [1, 2] }).toEqual({ a: [1, 3] })).toThrow();
});
'''
hints = ["So sánh primitive trước khi duyệt key.", "Array phải được phân biệt với object thường."]
explanation = "Deep equality đi đệ quy trên key và value; `Object.is` xử lý primitive, cùng identity và một số trường hợp như NaN."

[[modules]]
id = "testing-components"
title = "Test component và hook"
description = "Ưu tiên hành vi người dùng, truy vấn theo role/name và kiểm tra hook trong ngữ cảnh phù hợp."
sources = ["vitest/guide/browser/component-testing", "react/reference/react/act", "playwright/locators"]
lesson = '''
### Kiểm tra điều người dùng quan sát
Component test nên tương tác và xác minh nội dung, trạng thái hoặc callback có ý nghĩa, thay vì phụ thuộc vào tên class nội bộ hay cấu trúc implementation. Với Testing Library, truy vấn theo role và accessible name thường diễn đạt đúng mục đích: ví dụ tìm button có tên “Lưu” rồi kích hoạt nó.

| Cách truy vấn | Mức ưu tiên thường gặp | Lý do |
|---|---|---|
| Role và accessible name | Cao | Gần với semantic HTML và cách công nghệ hỗ trợ nhận diện |
| Label hoặc nội dung hiển thị | Cao | Gắn với nội dung người dùng thấy |
| Test id | Khi cần | Ít phụ thuộc CSS nhưng không tự kiểm tra semantics |
| Class hoặc selector cấu trúc sâu | Thấp | Dễ hỏng khi refactor giao diện |

Hook thường được kiểm tra thông qua component sử dụng hook để xác minh luồng người dùng. `renderHook` hữu ích cho hook tái sử dụng độc lập; cập nhật state từ tương tác cần được đồng bộ với cơ chế `act` của renderer. Component test trong browser có thể kiểm tra semantics thực tế hơn test chỉ render mô phỏng.

Lỗi thường gặp: chọn node bằng class nội bộ, gọi hook ngoài ngữ cảnh React, hoặc assert state private mà không kiểm tra kết quả hiển thị. Mô hình role/name là một phần của accessible query; tên truy cập thực tế còn tuân theo quy tắc accessibility của nền tảng.
'''

[[questions]]
id = "tst-017"
module = "testing-components"
type = "single"
