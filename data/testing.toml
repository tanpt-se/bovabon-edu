tags = ["level:lead", "strategy"]
prompt = "Bạn vừa nhận vai trò Lead cho một team 5 người, sản phẩm SaaS chưa có chiến lược test (vài unit test rời rạc, QA test tay trước mỗi release 2 ngày). Trình bày kế hoạch 90 ngày về chiến lược test: ưu tiên gì trước, quality gate nào, đo thành công ra sao."
keywords = [["rủi ro", "risk"], ["luồng cốt lõi", "critical path", "smoke"], ["integration"], ["quality gate", "required check", "CI"], ["metric", "đo", "lead time", "lỗi lọt"]]
min_keywords = 3
model_answer = "Tháng 1: xem bug report và postmortem để lập bản đồ rủi ro, chọn 5 luồng cốt lõi (đăng nhập, thanh toán, tạo dự án…) và viết smoke E2E ổn định cho chúng; đưa lint, type check và test hiện có vào CI làm quality gate. Tháng 2: thêm integration test ở mức feature với network mock cho khu vực hay lỗi, gate diff coverage cho code mới, thống nhất checklist review test. Tháng 3: song song hoá/shard CI để PR dưới 15 phút, chính sách flaky có owner, chuyển QA từ test hồi quy tay sang exploratory test. Đo bằng metric: số lỗi lọt production, thời gian pipeline, flaky rate và thời gian chuẩn bị release giảm từ 2 ngày."
explanation = "Câu trả lời cần ưu tiên theo rủi ro, bắt đầu từ luồng cốt lõi, có quality gate trong CI, hình dạng bộ test phù hợp và chỉ số đo lường cụ thể."
