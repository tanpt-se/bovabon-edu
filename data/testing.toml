[[questions]]
id = "tst-028"
module = "testing-e2e"
type = "code"
difficulty = 3
tags = ["level:senior"]
lang = "javascript"
title = "waitFor có timeout"
prompt = '''
Viết `waitFor(check, options)` trả về Promise:
- `check` được gọi ngay lập tức và sau đó mỗi `interval` ms.
- Nếu `check` trả giá trị truthy, resolve với giá trị đó.
- Nếu `check` trả falsy hoặc ném lỗi, thử lại.
- Khi hết `timeout` ms mà chưa thành công, reject với `Error` có message `Timed out`.
- Mặc định `timeout` là 1000 và `interval` là 50; bài tập giả định các giá trị là số hợp lệ, `timeout >= 0`, `interval > 0`.

Ví dụ: `waitFor(() => ready, { timeout: 100, interval: 10 })` resolve khi `ready` thành truthy trước hoặc tại lần kiểm tra cuối.
'''
starter = '''
function waitFor(check, options = {}) {
  return Promise.resolve(null);
}
'''
solution = '''
function waitFor(check, options = {}) {
  const timeout = options.timeout === undefined ? 1000 : options.timeout;
  const interval = options.interval === undefined ? 50 : options.interval;
  return new Promise((resolve, reject) => {
    const start = Date.now();
    function poll() {
      let value;
      try {
        value = check();
      } catch (error) {
        value = false;
      }
      if (value) {
        resolve(value);
        return;
      }
      const elapsed = Date.now() - start;
      if (elapsed >= timeout) {
        reject(new Error('Timed out'));
        return;
      }
      setTimeout(poll, Math.min(interval, timeout - elapsed));
    }
    poll();
  });
}
'''
tests = '''
test('resolve ngay khi check đã truthy', async () => {
  jest.useFakeTimers();
  const pending = waitFor(() => 'ready', { timeout: 40, interval: 10 });
  expect(await pending).toBe('ready');
  jest.useRealTimers();
});

test('thử lại cho đến khi check truthy', async () => {
  jest.useFakeTimers();
  let ready = false;
  const pending = waitFor(() => ready ? 'done' : false, { timeout: 100, interval: 20 });
  jest.advanceTimersByTime(40);
  ready = true;
  jest.advanceTimersByTime(20);
  expect(await pending).toBe('done');
  jest.useRealTimers();
});

test('reject đúng message khi hết timeout', async () => {
  jest.useFakeTimers();
  const pending = waitFor(() => false, { timeout: 30, interval: 10 }).catch((error) => error.message);
  jest.advanceTimersByTime(30);
  expect(await pending).toBe('Timed out');
  jest.useRealTimers();
});

test('retry khi check tạm thời ném lỗi', async () => {
  jest.useFakeTimers();
  let calls = 0;
  const pending = waitFor(() => {
    calls++;
    if (calls === 1) throw new Error('not ready');
    return calls === 3 ? 'ok' : false;
  }, { timeout: 50, interval: 10 });
  jest.advanceTimersByTime(20);
  expect(await pending).toBe('ok');
  expect(calls).toBe(3);
  jest.useRealTimers();
});
'''
hints = ["Dùng Date.now() để tính phần timeout còn lại.", "Gọi check trước khi lên lịch timer đầu tiên."]
explanation = "Polling ngay lập tức rồi dùng fake timers trong test giúp xác minh cả lần thử lại lẫn timeout mà không đợi đồng hồ thật."
sources = ["vitest/guide/learn/async", "playwright/test-assertions"]

[[modules]]
id = "testing-strategy"
title = "Chiến lược và độ tin cậy"
description = "Coverage, flaky test, CI và vòng lặp TDD."
sources = ["vitest/guide/coverage", "vitest/config/coverage", "vitest/config/retry", "playwright/test-retries", "vitest/guide/learn/writing-tests"]
lesson = '''
### Coverage và flaky test
Line coverage là tỉ lệ dòng executable được chạy trên tổng dòng executable đã đưa vào báo cáo: `covered lines / total lines × 100%`. Nó cho biết phạm vi đã chạy, không chứng minh assertion bắt đúng lỗi; coverage cao vẫn có thể đi cùng test yếu hoặc thiếu nhánh quan trọng.

Flaky test cho kết quả không ổn định giữa các lần chạy dù code và điều kiện dự kiến không đổi. Nguyên nhân thường gặp gồm race condition, dùng chung dữ liệu, phụ thuộc thứ tự, clock thật, mạng hoặc môi trường CI khác biệt. Hãy lưu log/trace, cô lập test và tìm điều kiện không xác định. Retry có thể giúp phát hiện hoặc phân loại lỗi chập chờn nhưng không thay thế việc sửa nguyên nhân.

| Thực hành | Mục tiêu |
|---|---|
| Chạy test độc lập và dữ liệu riêng | Giảm ảnh hưởng chéo |
| Chờ điều kiện thay vì sleep | Giảm race và thời gian chờ dư |
| Chạy suite trên CI ổn định | Phát hiện hồi quy trong cùng điều kiện |
| TDD: Red → Green → Refactor | Tạo test cho hành vi trước khi hoàn thiện implementation |

Lỗi thường gặp: đặt ngưỡng coverage cao rồi tối ưu con số thay vì rủi ro, retry vô hạn để làm CI xanh, hoặc chỉ chạy test trên máy cá nhân. Một CI tốt còn cần phản hồi đủ nhanh và báo rõ test nào thất bại.
'''

