[[questions]]
id = "testing-lvc01"
module = "testing-lead"
type = "code"
difficulty = 3
tags = ["level:lead", "ci"]
lang = "javascript"
title = "Cân bằng shard theo thời gian chạy"
prompt = '''Để giảm thời gian pipeline, bạn chia test file ra `n` shard dựa trên thời gian chạy lần trước. Viết `balanceShards(tests, n)`:
- `tests` là mảng `{ name, ms }`; trả về mảng gồm `n` mảng tên file.
- Thuật toán tham lam: sắp test theo `ms` giảm dần (bằng nhau thì theo `name` tăng dần), lần lượt gán mỗi test vào shard có tổng `ms` nhỏ nhất hiện tại (bằng nhau thì shard có chỉ số nhỏ nhất).
- Shard không có test là mảng rỗng. Không sửa mảng đầu vào.

Ví dụ `balanceShards([{name:'a',ms:5},{name:'b',ms:3},{name:'c',ms:3}], 2)` → `[['a'], ['b','c']]`.
'''
starter = '''
function balanceShards(tests, n) {
  return [];
}
'''
solution = '''
function balanceShards(tests, n) {
  const shards = [];
  const totals = [];
  for (let i = 0; i < n; i++) { shards.push([]); totals.push(0); }
  const sorted = tests.slice().sort((x, y) => y.ms - x.ms || (x.name < y.name ? -1 : x.name > y.name ? 1 : 0));
  for (const t of sorted) {
    let best = 0;
    for (let i = 1; i < n; i++) if (totals[i] < totals[best]) best = i;
    shards[best].push(t.name);
    totals[best] += t.ms;
  }
  return shards;
}
'''
tests = '''
test('ví dụ trong đề', () => {
  expect(balanceShards([{ name: 'a', ms: 5 }, { name: 'b', ms: 3 }, { name: 'c', ms: 3 }], 2)).toEqual([['a'], ['b', 'c']]);
});

test('gán vào shard nhẹ nhất, hòa thì chỉ số nhỏ', () => {
  const tests = [{ name: 'x', ms: 10 }, { name: 'y', ms: 7 }, { name: 'z', ms: 6 }, { name: 'w', ms: 4 }];
  expect(balanceShards(tests, 3)).toEqual([['x'], ['y'], ['z', 'w']]);
});

test('thời gian bằng nhau sắp theo tên', () => {
  expect(balanceShards([{ name: 'b', ms: 2 }, { name: 'a', ms: 2 }], 2)).toEqual([['a'], ['b']]);
});

test('shard thừa là mảng rỗng', () => {
  expect(balanceShards([{ name: 'only', ms: 1 }], 3)).toEqual([['only'], [], []]);
});

test('không sửa đầu vào', () => {
  const tests = [{ name: 'b', ms: 1 }, { name: 'a', ms: 9 }];
  balanceShards(tests, 2);
  expect(tests.map(t => t.name)).toEqual(['b', 'a']);
});
'''
hints = ["Sao chép mảng bằng `slice()` trước khi sort.", "Giữ một mảng `totals` song song với `shards` để tìm shard nhẹ nhất."]
explanation = "Chia theo thời gian (longest-processing-time first) cân bằng shard tốt hơn chia theo số file, giúp thời gian pipeline bằng shard chậm nhất được rút ngắn."
sources = ["playwright/test-sharding"]

