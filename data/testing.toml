[[modules]]
id = "testing-unit"
title = "Unit test với Vitest và Jest"
description = "Matcher, mock function và module, fake timers, snapshot, kiểm tra bất đồng bộ."
sources = ["vitest/api/expect", "vitest/guide/mocking", "jest/expect", "jest/mock-function-api"]
lesson = '''
### Assertion và cách ly phụ thuộc
| Nhu cầu | Matcher hoặc kỹ thuật thường dùng |
|---|---|
| So sánh primitive | `toBe` thường kiểm tra cùng giá trị hoặc identity |
| So sánh cấu trúc | `toEqual` so sánh sâu các field |
| Kiểm tra lời gọi | mock/spy cùng matcher về số lần hoặc tham số |
| Thời gian | fake timers thay timer thật để test có thể điều khiển |

Vitest và Jest có nhiều API tương tự, nhưng cấu hình và chi tiết mock module không hoàn toàn giống nhau. Mock module hữu ích để cô lập ranh giới như thư viện ngoài hoặc I/O; tránh mock những phần logic nội bộ chỉ để test khớp cấu trúc hiện tại.

Fake timers làm cho timeout, interval và thời gian giả lập chạy có thể kiểm soát; sau test cần khôi phục clock và trạng thái mock. Với code bất đồng bộ, luôn return hoặc await Promise để runner biết khi nào test hoàn tất.

Snapshot lưu biểu diễn đầu ra để đối chiếu lần sau. Dùng snapshot nhỏ, ổn định và xem xét diff trước khi cập nhật. Snapshot lớn, nhiều dữ liệu ngẫu nhiên hoặc cập nhật hàng loạt mà không đọc diff dễ che khuất hồi quy. Lỗi hay gặp: nhầm `toBe` với deep equality, để mock state rò sang test kế tiếp, và chờ bằng sleep thật làm suite chậm.
'''

