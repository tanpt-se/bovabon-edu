[[questions]]
id = "testing-dvc02"
module = "testing-dv-state"
type = "code"
difficulty = 1
tags = ["level:junior"]
lang = "javascript"
title = "Ghép dữ liệu fixture mà không mutate"
prompt = '''Viết `mergeTestData(defaults, overrides)` để tạo object fixture cho một test.
- Sao chép các property của hai plain object ở mức nông.
- Giá trị trong `overrides` ghi đè property cùng tên trong `defaults`.
- Trả về object mới và không mutate hai input.
- Không cần clone các object lồng nhau.

Ví dụ: `mergeTestData({ role: 'member', active: true }, { role: 'admin' })` trả `{ role: 'admin', active: true }`.
'''
starter = '''
function mergeTestData(defaults, overrides) {
  return defaults;
}
'''
solution = '''
function mergeTestData(defaults, overrides) {
  return { ...defaults, ...overrides };
}
'''
tests = '''
test('giữ field mặc định và thêm field mới', () => {
  expect(mergeTestData({ role: 'member' }, { active: true })).toEqual({ role: 'member', active: true });
});

test('giá trị override thắng giá trị mặc định', () => {
  expect(mergeTestData({ role: 'member', active: false }, { role: 'admin' })).toEqual({ role: 'admin', active: false });
});

test('không mutate input và trả object mới', () => {
  const defaults = { role: 'member' };
  const overrides = { active: true };
  const result = mergeTestData(defaults, overrides);
  expect(result).not.toBe(defaults);
  expect(defaults).toEqual({ role: 'member' });
  expect(overrides).toEqual({ active: true });
});

test('hai object rỗng tạo fixture rỗng mới', () => {
  const result = mergeTestData({}, {});
  expect(result).toEqual({});
});
'''
hints = ["Spread object theo đúng thứ tự: mặc định trước, override sau.", "Tạo một object literal mới để tránh sửa input."]
explanation = "Fixture ghép ở mức nông giúp tùy biến dữ liệu theo test mà không làm thay đổi object mặc định dùng chung."
sources = ["playwright/test-fixtures", "cypress/api/commands/fixture"]

[[modules]]
id = "testing-dv-projects"
title = "Project matrix và môi trường chạy"
description = "Tổ chức nhiều cấu hình test trong một suite để kiểm tra browser, runtime hoặc package với lựa chọn rõ ràng."
sources = ["vitest/config/projects", "vitest/config/environment", "jest/configuration#projects-arraystring--projectconfig", "playwright/test-projects", "playwright/test-configuration", "cypress/api/plugins/configuration-api"]
lesson = '''
### Một suite, nhiều project có chủ đích
Project gom một cấu hình chạy với tên và tùy chọn riêng. Chúng hữu ích khi cùng test cần chạy trên nhiều browser, runtime, package hoặc bộ biến cấu hình. Project matrix làm rõ những tổ hợp được kiểm tra và cho phép chọn subset trong lúc phát triển; mỗi project cũng có thể cần setup và dữ liệu phù hợp.

| Công cụ | Cách tổ chức | Hữu ích khi |
|---|---|---|
| Vitest | Khai báo `test.projects` với cấu hình con | Monorepo hoặc test nhiều môi trường |
| Jest | Khai báo `projects` trong config | Nhiều package hoặc cấu hình suite trong một lần chạy |
| Playwright | `projects` có `name` và `use` riêng | Chạy cùng test trên browser/device hoặc cấu hình khác |
| Cypress | Cấu hình project và Node event hooks | Tùy biến lifecycle, task hoặc cấu hình runner |

Ví dụ Playwright có project `chromium` và `firefox`, mỗi project đặt browser option riêng nhưng dùng chung spec; có thể chọn một project khi debug, rồi chạy ma trận cần thiết trên CI. `testEnvironment` trong Jest hoặc `environment` trong Vitest quyết định API runtime như `window`, nên một test cần DOM không thể mặc định chạy như test thuần Node. Môi trường là một chiều của cấu hình, còn project là cách đóng gói nhiều chiều cấu hình thành các lần chạy có tên.

### Lỗi hay gặp
- Tạo mọi tổ hợp browser × locale × role dù không thêm giá trị, khiến CI chậm và khó tìm lỗi.
- Tưởng khai báo nhiều project tự chứng minh mọi browser đã được chạy; phải xem lệnh và filter CI thực tế.
- Chạy test DOM trong Node environment rồi nhầm lỗi thiếu global với lỗi ứng dụng.
- Dùng một test data hoặc account mutable chung cho các project chạy song song.
- Để project config lệch nhau về timeout, setup hoặc base URL mà không biết khác biệt đó có chủ ý hay không.
'''

