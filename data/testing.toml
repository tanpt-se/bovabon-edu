[[questions]]
id = "tst-022"
module = "testing-components"
type = "code"
difficulty = 2
lang = "javascript"
title = "Tìm node theo role và name"
prompt = '''
Viết `getByRole(tree, role, name)` để tìm đúng một node trong cây giả lập. Mỗi node là object có thể có `role`, `name`, `ariaLabel`, `text` và `children` (mảng node con).
- Duyệt depth-first từ node gốc.
- Accessible name trong mô hình này là `ariaLabel`, nếu đó không phải string thì dùng `name`, rồi đến `text`; nếu cả ba không phải string thì là chuỗi rỗng.
- Role và name phải khớp chính xác.
- Trả về object node khi có đúng một kết quả; ném `Error` nếu không có hoặc có nhiều hơn một kết quả.
- `tree` có thể thiếu hoặc là null; khi đó không tìm thấy kết quả.

Đây là mô hình đơn giản hoá, không cần triển khai đầy đủ quy tắc tính accessible name của trình duyệt.
'''
starter = '''
function getByRole(tree, role, name) {
  return null;
}
'''
solution = '''
function getByRole(tree, role, name) {
  const matches = [];
  function visit(node) {
    if (!node || typeof node !== 'object') return;
    const accessibleName = typeof node.ariaLabel === 'string'
      ? node.ariaLabel
      : typeof node.name === 'string'
        ? node.name
        : typeof node.text === 'string'
          ? node.text
          : '';
    if (node.role === role && accessibleName === name) matches.push(node);
    if (Array.isArray(node.children)) node.children.forEach(visit);
  }
  visit(tree);
  if (matches.length === 0) throw new Error('No matching element');
  if (matches.length > 1) throw new Error('Multiple matching elements');
  return matches[0];
}
'''
tests = '''
test('tìm node con theo name', () => {
  const button = { role: 'button', name: 'Save' };
  const tree = { role: 'main', children: [{ role: 'section', children: [button] }] };
  expect(getByRole(tree, 'button', 'Save')).toBe(button);
});

test('ariaLabel được ưu tiên hơn name', () => {
  const button = { role: 'button', name: 'Old', ariaLabel: 'Save' };
  expect(getByRole(button, 'button', 'Save')).toBe(button);
});

test('nếu không có kết quả thì ném lỗi', () => {
  expect(() => getByRole(null, 'button', 'Save')).toThrow();
});

test('nếu trùng kết quả thì ném lỗi', () => {
  const tree = { children: [{ role: 'button', text: 'Save' }, { role: 'button', name: 'Save' }] };
  expect(() => getByRole(tree, 'button', 'Save')).toThrow();
});
'''
hints = ["Tích luỹ node khớp thay vì trả ngay kết quả đầu tiên.", "Duyệt children chỉ khi đó là mảng."]
explanation = "Truy vấn getByRole kiểu get-by phải phát hiện cả trường hợp thiếu và mơ hồ; mô hình này cố ý chỉ hỗ trợ cây object được mô tả."
sources = ["vitest/guide/browser/component-testing", "playwright/locators"]

[[modules]]
id = "testing-e2e"
title = "E2E với Playwright và Cypress"
description = "Locator, auto-wait, web-first assertion, fixture, trace và khác biệt retry trong Cypress."
sources = ["playwright/locators", "playwright/test-assertions", "playwright/test-fixtures", "playwright/trace-viewer", "cypress/api/commands/get", "cypress/api/commands/should"]
lesson = '''
### Locator và chờ điều kiện
Playwright locator mô tả cách tìm phần tử và được đánh giá lại khi dùng; action như click tự chờ các điều kiện khả dụng trước khi tương tác. Web-first assertion như `toBeVisible()` sẽ retry trong giới hạn timeout để chờ trạng thái mong muốn. Tránh sleep cố định vì vừa làm test chậm vừa không bảo đảm trạng thái đã sẵn sàng.

| Công cụ | Pattern | Ghi nhớ |
|---|---|---|
| Playwright | `getByRole('button', { name: 'Save' })` | Ưu tiên semantics; assertion web-first có retry |
| Cypress | `cy.get(...).should(...)` | Chain và assertion có cơ chế retry phù hợp |
| Fixture | Tạo context hoặc dữ liệu cho test | Chọn scope rõ để tránh chia sẻ state ngoài ý muốn |
| Trace | Xem timeline, ảnh chụp và thông tin hành động | Hữu ích để điều tra lỗi CI khó tái hiện |

Fixture của Playwright cho phép chia sẻ setup có kiểm soát theo scope và tự quản lý vòng đời. Trace Viewer giúp xem lại hành động và ngữ cảnh khi lỗi xảy ra; bật trace trên mọi lần chạy có thể tăng chi phí lưu trữ.

Lỗi hay gặp: giữ element handle cũ sau khi DOM thay đổi, dùng selector phụ thuộc cấu trúc sâu, assert tức thời thay vì web-first assertion, hoặc dùng `waitForTimeout` để che race condition. Cypress cũng retry query/assertion theo mô hình command chain; không nên suy diễn rằng mọi Promise hay side effect tuỳ ý đều tự retry.
'''

