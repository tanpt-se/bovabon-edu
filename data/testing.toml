```'''
options = ["`vi.mock` được hoist lên đầu file và không được đặt trong khối điều kiện/hàm; factory tham chiếu biến cục bộ nên không hoạt động như mong đợi", "`vi.mock` chỉ chạy được trong `beforeAll`", "`vi.mock` chỉ mock được package trong node_modules", "Phải gọi `vi.mock` sau khi import để có hiệu lực"]
