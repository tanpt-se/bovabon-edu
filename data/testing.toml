[[questions]]
id = "testing-lvc02"
module = "testing-strategy"
type = "code"
difficulty = 3
tags = ["level:senior", "flaky"]
lang = "javascript"
title = "Phân loại test flaky từ lịch sử chạy"
prompt = '''CI chạy lại cùng một commit nhiều lần. Viết `classifyRuns(runs)` với `runs` là mảng `{ test, passed }`:
- Test có cả lần pass và lần fail → `flaky`; chỉ fail → `failing`; chỉ pass → `passing`.
- Trả về `{ flaky, failing, passing }`, mỗi mảng chứa tên test không trùng, sắp xếp tăng dần.
- `runs` rỗng → cả ba mảng rỗng.

Ví dụ `classifyRuns([{test:'a',passed:true},{test:'a',passed:false},{test:'b',passed:true}])` → `{ flaky: ['a'], failing: [], passing: ['b'] }`.
'''
starter = '''
function classifyRuns(runs) {
  return { flaky: [], failing: [], passing: [] };
}
'''
solution = '''
function classifyRuns(runs) {
  const seen = {};
  for (const r of runs) {
    if (!seen[r.test]) seen[r.test] = { pass: false, fail: false };
    if (r.passed) seen[r.test].pass = true; else seen[r.test].fail = true;
  }
  const out = { flaky: [], failing: [], passing: [] };
  for (const name of Object.keys(seen).sort()) {
    const s = seen[name];
    if (s.pass && s.fail) out.flaky.push(name);
    else if (s.fail) out.failing.push(name);
    else out.passing.push(name);
  }
  return out;
}
'''
tests = '''
test('ví dụ trong đề', () => {
  expect(classifyRuns([{ test: 'a', passed: true }, { test: 'a', passed: false }, { test: 'b', passed: true }])).toEqual({ flaky: ['a'], failing: [], passing: ['b'] });
});

test('test chỉ fail là failing', () => {
  expect(classifyRuns([{ test: 'x', passed: false }, { test: 'x', passed: false }]).failing).toEqual(['x']);
});

test('kết quả sắp xếp và không trùng', () => {
  const runs = [{ test: 'c', passed: true }, { test: 'a', passed: true }, { test: 'c', passed: true }, { test: 'b', passed: false }, { test: 'b', passed: true }];
  expect(classifyRuns(runs)).toEqual({ flaky: ['b'], failing: [], passing: ['a', 'c'] });
});

test('đầu vào rỗng', () => {
  expect(classifyRuns([])).toEqual({ flaky: [], failing: [], passing: [] });
});

test('nhiều nhóm cùng lúc', () => {
  const runs = [{ test: 'z', passed: false }, { test: 'y', passed: true }, { test: 'y', passed: false }, { test: 'w', passed: true }];
  expect(classifyRuns(runs)).toEqual({ flaky: ['y'], failing: ['z'], passing: ['w'] });
});
'''
hints = ["Gom theo tên test: ghi nhận đã từng pass và đã từng fail.", "Sort danh sách tên trước khi phân loại để kết quả có thứ tự."]
explanation = "Phân biệt flaky với failing là bước đầu của chính sách quarantine: failing cần sửa ngay, flaky cần điều tra nguồn không xác định."
sources = ["playwright/test-retries", "vitest/config/retry"]

