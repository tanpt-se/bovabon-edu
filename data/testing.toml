min_keywords = 3
model_answer = "Bối cảnh: pipeline PR 45 phút, dev gộp PR lớn, flaky khoảng 5%. Phương án cân nhắc: chỉ tăng runner (đắt, không xử lý flaky), chỉ chạy test liên quan file đổi (nhanh nhưng có thể bỏ sót), tách tầng. Quyết định: PR chạy lint, type check, unit/integration và smoke E2E cho 5 luồng cốt lõi, shard song song trên 4 máy; full E2E và cross-browser chạy ở merge queue và nightly; test flaky được quarantine có owner và hạn sửa. Hệ quả: phản hồi PR dưới 15 phút; một số lỗi chỉ bị bắt ở merge queue nên cần người trực; theo dõi metric thời gian pipeline, flaky rate và số lỗi lọt production hằng tháng để điều chỉnh."
