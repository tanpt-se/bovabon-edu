[[questions]]
id = "tst-035"
module = "testing-strategy"
type = "code"
difficulty = 2
tags = ["level:middle"]
lang = "javascript"
title = "Phát hiện test flaky từ lịch sử"
prompt = '''
Viết `findFlakyTests(history)` nhận mảng các object `{ id, runs }`, trong đó `runs` là mảng chuỗi trạng thái `pass`, `fail` hoặc `skip`.
- Trả về danh sách `id` theo thứ tự đầu vào.
- Một test được xem là flaky nếu trong lịch sử có ít nhất một `pass` và ít nhất một `fail`.
- Test luôn pass, luôn fail, chỉ skip hoặc không có lần chạy không được xem là flaky.
- Mỗi phần tử đầu vào đại diện cho một test duy nhất.
'''
starter = '''
function findFlakyTests(history) {
  return [];
}
'''
solution = '''
function findFlakyTests(history) {
  return history
    .filter((test) => test.runs.includes('pass') && test.runs.includes('fail'))
    .map((test) => test.id);
}
'''
tests = '''
test('lấy test có cả pass và fail theo thứ tự đầu vào', () => {
  const history = [
    { id: 'a', runs: ['pass', 'fail'] },
    { id: 'b', runs: ['pass', 'pass'] },
    { id: 'c', runs: ['fail', 'pass', 'fail'] }
  ];
  expect(findFlakyTests(history)).toEqual(['a', 'c']);
});

test('không xem test luôn fail là flaky', () => {
  expect(findFlakyTests([{ id: 'broken', runs: ['fail', 'fail'] }])).toEqual([]);
});

test('bỏ qua skip và lịch sử rỗng', () => {
  const history = [
    { id: 'skipped', runs: ['skip', 'skip'] },
    { id: 'empty', runs: [] }
  ];
  expect(findFlakyTests(history)).toEqual([]);
});

test('trả mảng rỗng khi history rỗng', () => {
  expect(findFlakyTests([])).toEqual([]);
});
'''
hints = ["Chỉ giữ test có cả hai trạng thái pass và fail.", "Map kết quả đã lọc sang id để giữ thứ tự."]
explanation = "Lịch sử kết hợp pass và fail là tín hiệu không ổn định; test luôn fail cần sửa nhưng chưa đủ dữ liệu để gọi là flaky."
sources = ["vitest/config/retry", "playwright/test-retries"]

[[questions]]
id = "tst-036"
module = "testing-strategy"
type = "code"
difficulty = 2
tags = ["level:middle"]
lang = "javascript"
title = "Tính line coverage"
prompt = '''
Viết `lineCoverage(totalLines, coveredLines)` trả về phần trăm line coverage từ 0 đến 100.
- Đầu vào là số dòng executable tổng cộng và số dòng đã chạy; giả định cả hai là số nguyên không âm, `coveredLines <= totalLines`.
- Nếu `totalLines` bằng 0, trả về 0.
- Làm tròn kết quả đến hai chữ số thập phân.

Ví dụ: `lineCoverage(8, 6)` trả `75`; `lineCoverage(3, 2)` trả `66.67`.
'''
starter = '''
function lineCoverage(totalLines, coveredLines) {
  return 0;
}
'''
solution = '''
function lineCoverage(totalLines, coveredLines) {
  if (totalLines === 0) return 0;
  return Math.round((coveredLines / totalLines) * 10000) / 100;
}
'''
tests = '''
test('tính phần trăm coverage nguyên', () => {
  expect(lineCoverage(8, 6)).toBe(75);
});

test('làm tròn đến hai chữ số thập phân', () => {
  expect(lineCoverage(3, 2)).toBe(66.67);
});

test('coverage đầy đủ bằng 100', () => {
  expect(lineCoverage(5, 5)).toBe(100);
});

test('không có dòng executable trả 0', () => {
  expect(lineCoverage(0, 0)).toBe(0);
});
'''
hints = ["Tính tỉ lệ covered chia total rồi nhân 100.", "Nhân thêm 100 trước Math.round để làm tròn 2 chữ số phần trăm."]
explanation = "Line coverage là phần trăm dòng executable đã chạy; nó không đồng nghĩa mọi hành vi hoặc nhánh đều được xác minh."
sources = ["vitest/guide/coverage"]

[[modules]]
id = "testing-dv-network"
title = "Kiểm soát network trong test"
description = "Mock request ở đúng ranh giới, giả lập response ổn định và xác minh hành vi UI khi API thành công hoặc lỗi."
sources = ["vitest/guide/mocking/requests", "jest/manual-mocks", "playwright/network", "playwright/mock", "cypress/api/commands/intercept"]
lesson = '''
### Giữ request có thể dự đoán
Test có network thật dễ chập chờn vì phụ thuộc dịch vụ ngoài, dữ liệu thay đổi, quota và thời gian phản hồi. Thay vì chờ một số mili giây cố định, hãy kiểm soát response ở ranh giới HTTP và đồng bộ với request hoặc trạng thái UI cần kiểm tra.

| Nhu cầu | Cách thường dùng | Phần vẫn được kiểm tra |
|---|---|---|
| Unit test code gọi API client | Mock module hoặc dependency | Nhánh xử lý của consumer |
| Kiểm tra request qua ứng dụng | MSW ở request boundary | Code tạo request, parse response và cập nhật state |
| E2E trình duyệt với response giả | Playwright `page.route` hoặc Cypress `cy.intercept` | Luồng UI khi nhận response đã kiểm soát |

Ví dụ với Playwright: `await page.route('**/api/orders', (route) => route.fulfill({ status: 503, body: '{"message":"Unavailable"}' }));`. Đăng ký route trước khi điều hướng, sau đó kiểm tra thông báo lỗi mà người dùng nhìn thấy. Với Cypress, `cy.intercept('GET', '/api/orders', { fixture: 'orders.json' }).as('orders')` có thể stub response; bỏ response handler để chỉ quan sát request. Jest manual mock hữu ích khi unit test cần thay module API, nhưng không xác minh giao thức HTTP thực.

### Lỗi hay gặp
- Gọi `wait(2000)` thay vì chờ alias, locator hoặc assertion có điều kiện.
- Đăng ký route sau khi request đã phát ra, hoặc dùng URL pattern không khớp query/path thật.
- Chỉ assert request đã gửi mà không kiểm tra UI xử lý thành công, lỗi, loading và dữ liệu rỗng.
- Mock mọi tầng khiến test xanh dù URL, header hoặc chuyển đổi response trong code thật bị sai.
- Dùng chung handler có state thay đổi giữa các test mà không reset lại.
'''

