[[questions]]
id = "testing-lvc03"
module = "testing-unit"
type = "code"
difficulty = 1
tags = ["level:junior"]
lang = "javascript"
title = "Tổng hợp kết quả test"
prompt = '''Viết `summarize(statuses)` nhận mảng chuỗi `'passed' | 'failed' | 'skipped'` và trả `{ passed, failed, skipped }` là số lượng mỗi loại.
Ví dụ `summarize(['passed', 'failed', 'passed'])` → `{ passed: 2, failed: 1, skipped: 0 }`.
'''
starter = '''
function summarize(statuses) {
  return { passed: 0, failed: 0, skipped: 0 };
}
'''
solution = '''
function summarize(statuses) {
  const out = { passed: 0, failed: 0, skipped: 0 };
  for (const s of statuses) out[s]++;
  return out;
}
'''
tests = '''
test('ví dụ trong đề', () => {
  expect(summarize(['passed', 'failed', 'passed'])).toEqual({ passed: 2, failed: 1, skipped: 0 });
});

test('đếm skipped', () => {
  expect(summarize(['skipped', 'skipped'])).toEqual({ passed: 0, failed: 0, skipped: 2 });
});

test('mảng rỗng', () => {
  expect(summarize([])).toEqual({ passed: 0, failed: 0, skipped: 0 });
});

test('đủ ba loại', () => {
  expect(summarize(['failed', 'skipped', 'passed', 'failed'])).toEqual({ passed: 1, failed: 2, skipped: 1 });
});
'''
hints = ["Khởi tạo object đếm với ba khoá bằng 0.", "Duyệt mảng và tăng khoá tương ứng."]
explanation = "Một vòng lặp với object đếm là cách đơn giản để tổng hợp kết quả như reporter của test runner."
sources = ["vitest/config/reporters"]

