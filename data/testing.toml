[[questions]]
id = "testing-dvc01"
module = "testing-dv-network"
type = "code"
difficulty = 2
lang = "javascript"
title = "Chọn response stub theo request"
prompt = '''Viết `findStub(request, stubs)` để tìm response stub đầu tiên khớp với request.
- `request` có `method` và `url`; mỗi stub có `method`, `url`, `status`, `body`.
- So sánh method không phân biệt chữ hoa/thường, nhưng URL phải khớp chính xác.
- Trả về object mới chỉ gồm `status` và `body` của stub khớp đầu tiên; nếu không có thì trả `null`.
- Không thay đổi request hoặc mảng stubs.

Ví dụ: request `GET /api/items` khớp stub `get /api/items` và trả `{ status: 200, body: [] }`.
'''
starter = '''
function findStub(request, stubs) {
  return null;
}
'''
solution = '''
function findStub(request, stubs) {
  const match = stubs.find((stub) =>
    stub.method.toUpperCase() === request.method.toUpperCase() && stub.url === request.url
  );
  return match ? { status: match.status, body: match.body } : null;
}
'''
tests = '''
test('khớp method không phân biệt hoa thường', () => {
  expect(findStub({ method: 'GET', url: '/api/items' }, [{ method: 'get', url: '/api/items', status: 200, body: [] }])).toEqual({ status: 200, body: [] });
});

test('URL phải khớp chính xác', () => {
  const stubs = [{ method: 'GET', url: '/api/items', status: 200, body: [] }];
  expect(findStub({ method: 'GET', url: '/api/items?page=2' }, stubs)).toBeNull();
});

test('chọn stub đầu tiên khi có nhiều stub cùng route', () => {
  const stubs = [
    { method: 'POST', url: '/api/items', status: 201, body: { id: 1 } },
    { method: 'post', url: '/api/items', status: 202, body: { id: 2 } }
  ];
  expect(findStub({ method: 'POST', url: '/api/items' }, stubs)).toEqual({ status: 201, body: { id: 1 } });
});

test('không khớp method hoặc danh sách rỗng thì trả null', () => {
  expect(findStub({ method: 'DELETE', url: '/api/items' }, [{ method: 'GET', url: '/api/items', status: 200, body: [] }])).toBeNull();
  expect(findStub({ method: 'GET', url: '/api/items' }, [])).toBeNull();
});
'''
hints = ["Dùng `find` để giữ thứ tự và chỉ lấy phần tử khớp đầu tiên.", "Tạo object kết quả mới để không trả cả metadata của stub."]
explanation = "Chọn response theo method và URL mô phỏng ranh giới request có kiểm soát; test vẫn cần xác minh ứng dụng dùng response đúng cách."
sources = ["vitest/guide/mocking/requests", "playwright/network"]

[[modules]]
id = "testing-dv-state"
title = "Fixture, dữ liệu và trạng thái xác thực"
description = "Quản lý vòng đời test fixture, dữ liệu tái lập và trạng thái đăng nhập mà không tạo phụ thuộc giữa các test."
sources = ["playwright/test-fixtures", "playwright/auth", "cypress/api/commands/session", "cypress/api/commands/fixture", "vitest/config/setupfiles", "jest/configuration#setupfiles-array"]
lesson = '''
### Tách dữ liệu, setup và trạng thái đăng nhập
Fixture cung cấp tài nguyên hoặc dữ liệu cho test theo một vòng đời xác định. Fixture của Playwright có thể được giới hạn theo test hoặc worker; fixture built-in như `page` được chuẩn bị trước test và đóng gọn sau đó. Cypress `cy.fixture` đọc dữ liệu tĩnh từ file, còn `cy.session` lưu và khôi phục cookie cùng web storage theo session key. Hai khái niệm này giải quyết nhu cầu khác nhau: dữ liệu đầu vào không đồng nghĩa với phiên đăng nhập.

| Nhu cầu | Cơ chế | Ranh giới cần nhớ |
|---|---|---|
| Dữ liệu mẫu ít thay đổi | Playwright fixture hoặc Cypress `cy.fixture` | Không sửa object dùng chung giữa test |
| Đăng nhập nhanh cho E2E | Playwright `storageState` hoặc Cypress `cy.session` | Key phải phân biệt user/role/tenant; tạo state bằng quy trình đáng tin cậy |
| Matcher hoặc setup chung | Vitest/Jest setup file | Chạy trước test file; không phải kho dữ liệu riêng cho từng test |
| Tài nguyên cần đóng | Fixture có teardown | Dọn sau test hoặc sau worker theo đúng scope |

Ví dụ Playwright: cấu hình `use: { storageState: 'playwright/.auth/member.json' }` để test bắt đầu ở trạng thái đã đăng nhập. Test vẫn nên tạo đơn hàng riêng hoặc dùng seed có thể lặp lại, vì session dùng chung không cô lập dữ liệu backend. Trong Jest, `setupFiles` chạy trước khi framework test được cài đặt; `setupFilesAfterEnv` chạy sau, phù hợp đăng ký matcher hoặc hook chung.

### Lỗi hay gặp
- Dùng một fixture có thể mutate cho nhiều test rồi phụ thuộc thứ tự chạy.
- Dùng chung user hoặc tenant khiến test tranh chấp record khi chạy song song.
- Dùng session cache với key thiếu role/tenant, khiến test vô tình nhận state của user khác.
- Đặt seed data từng test trong global setup nhưng không có cơ chế dọn hoặc tạo mới.
- Coi `setupFiles` là setup một lần cho toàn bộ suite; setup thường gắn với từng test file.
'''

