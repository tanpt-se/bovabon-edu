[[questions]]
id = "testing-dvc03"
module = "testing-dv-projects"
type = "code"
difficulty = 2
tags = ["level:middle"]
lang = "javascript"
title = "Tạo project matrix có thứ tự"
prompt = '''Viết `buildProjectMatrix(browsers, locales)` để tạo các cấu hình cho mọi cặp browser-locale.
- Mỗi phần tử có dạng `{ name, browser, locale }`, với `name` bằng `browser + '-' + locale`.
- Duyệt browsers theo thứ tự đầu vào; bên trong mỗi browser duyệt locales theo thứ tự đầu vào.
- Nếu một đầu vào rỗng, trả mảng rỗng.
- Không thay đổi hai mảng đầu vào.

Ví dụ `buildProjectMatrix(['chromium'], ['en', 'vi'])` trả hai project `chromium-en` và `chromium-vi`.
'''
starter = '''
function buildProjectMatrix(browsers, locales) {
  return [];
}
'''
solution = '''
function buildProjectMatrix(browsers, locales) {
  const projects = [];
  for (const browser of browsers) {
    for (const locale of locales) {
      projects.push({ name: browser + '-' + locale, browser, locale });
    }
  }
  return projects;
}
'''
tests = '''
test('tạo tích Descartes theo đúng thứ tự đầu vào', () => {
  expect(buildProjectMatrix(['chromium', 'firefox'], ['en', 'vi'])).toEqual([
    { name: 'chromium-en', browser: 'chromium', locale: 'en' },
    { name: 'chromium-vi', browser: 'chromium', locale: 'vi' },
    { name: 'firefox-en', browser: 'firefox', locale: 'en' },
    { name: 'firefox-vi', browser: 'firefox', locale: 'vi' }
  ]);
});

test('một cặp tạo một project', () => {
  expect(buildProjectMatrix(['webkit'], ['ja'])).toEqual([{ name: 'webkit-ja', browser: 'webkit', locale: 'ja' }]);
});

test('đầu vào rỗng tạo danh sách rỗng', () => {
  expect(buildProjectMatrix([], ['en'])).toEqual([]);
  expect(buildProjectMatrix(['chromium'], [])).toEqual([]);
});

test('không sửa các mảng đầu vào', () => {
  const browsers = ['chromium'];
  const locales = ['en', 'vi'];
  buildProjectMatrix(browsers, locales);
  expect(browsers).toEqual(['chromium']);
  expect(locales).toEqual(['en', 'vi']);
});
'''
hints = ["Dùng vòng lặp lồng nhau để giữ thứ tự browser trước locale.", "Khởi tạo mảng kết quả mới, không push vào input."]
explanation = "Sinh matrix có thứ tự giúp cấu hình chạy nhất quán và làm rõ số tổ hợp mà suite sẽ kiểm tra."
sources = ["playwright/test-projects", "vitest/config/projects"]

[[modules]]
id = "testing-lead"
title = "Góc nhìn Tech Lead"
description = "Chiến lược test cho team: pyramid/trophy, quality gate trong CI, chọn luồng E2E, môi trường và dữ liệu test, flaky policy, thời gian pipeline."
sources = ["playwright/ci", "playwright/test-sharding", "playwright/test-retries", "vitest/guide/coverage", "vitest/guide/improving-performance", "jest/cli#--changedsince"]
lesson = '''
### Câu hỏi của Lead không phải "viết test thế nào" mà "đầu tư test vào đâu"
Ở quy mô team, test là một khoản đầu tư có chi phí (thời gian viết, thời gian CI, công sửa flaky) và lợi ích (bắt lỗi sớm, tự tin refactor, release nhanh). Quyết định tốt luôn gắn với rủi ro sản phẩm: luồng nào mất tiền, mất dữ liệu hoặc mất người dùng khi hỏng thì được bảo vệ dày nhất.

### Khung ra quyết định: chọn hình dạng bộ test
| Tiêu chí | Pyramid (nhiều unit) | Trophy (nhiều integration) | Nhiều E2E |
|---|---|---|---|
| Hợp với | Domain logic phức tạp, thư viện, backend | Frontend gọi API, UI ghép nhiều component | Ít khi là lựa chọn chính |
| Tốc độ phản hồi | Rất nhanh | Nhanh–vừa | Chậm |
| Độ tin cậy khi refactor | Dễ vỡ nếu test chi tiết triển khai | Tốt vì test hành vi | Tốt nhưng tốn công giữ ổn định |
| Chi phí bảo trì | Thấp nếu test hàm thuần | Vừa | Cao (selector, dữ liệu, môi trường) |

Không có tỉ lệ đúng cho mọi team; hình dạng phải phản ánh nơi lỗi thật sự xảy ra (xem lại postmortem và bug report vài tháng gần nhất).

### Quality gate trong CI (ước lượng tham khảo, cần đo lại cho dự án của bạn)
- **Trên PR (mục tiêu ≤ 10–15 phút):** lint, type check, unit + integration, smoke E2E cho 3–5 luồng cốt lõi, có sharding.
- **Trên merge queue hoặc nightly:** full E2E, cross-browser matrix, visual/a11y check.
- **Coverage:** gate theo *diff coverage* (dòng mới/sửa) và ngưỡng riêng cho module trọng yếu; tránh ép một con số toàn cục cao khiến team viết test không assert gì.
- **Check bắt buộc phải xác định (deterministic):** check hay flaky không nên là required check, vì team sẽ học cách bấm "re-run" thay vì đọc lỗi.

### Chiến lược E2E
1. Chọn luồng theo tác động × tần suất × lịch sử lỗi (đăng nhập, thanh toán, đăng ký…), không tự động hoá mọi biến thể UI.
2. Môi trường: preview/ephemeral environment theo PR khi có thể; dịch vụ bên thứ ba (payment, email) thay bằng sandbox hoặc mock ở ranh giới mạng.
3. Dữ liệu: mỗi test tự tạo dữ liệu qua API/seed, không dùng chung một tài khoản; dọn dẹp hoặc dùng tenant riêng.
4. Quan sát: lưu trace/video khi retry hoặc fail để điều tra không cần chạy lại.

### Checklist review test (dùng trong PR)
- Test kiểm tra hành vi người dùng/hợp đồng, không phải chi tiết nội bộ?
- Không có `sleep`/timeout cố định; dùng assertion tự chờ hoặc fake timer?
- Dữ liệu độc lập, chạy song song và theo thứ tự bất kỳ đều đúng?
- Tên test mô tả kịch bản và kết quả mong đợi?
- Mock đặt ở ranh giới (network, clock, random), không mock module nội bộ tràn lan?

### ADR mẫu ngắn
**Bối cảnh:** pipeline PR mất 42 phút, flaky rate E2E ~6% (ước lượng từ 30 ngày CI). **Quyết định:** PR chạy unit/integration + smoke E2E shard 4 máy; full E2E chạy trên merge queue; test flaky bị quarantine có owner và hạn sửa 5 ngày làm việc. **Hệ quả:** phản hồi PR nhanh hơn; một số lỗi chỉ bị bắt ở merge queue nên cần người trực xử lý trong ngày.

### Anti-pattern ở quy mô team
- Retry mặc định 3 lần để "xanh CI", che giấu race condition thật.
- Coverage 90% toàn cục làm KPI cá nhân → test rỗng, snapshot khổng lồ.
- Một môi trường staging dùng chung cho mọi team chạy E2E song song.
- Không ai sở hữu test flaky; danh sách quarantine chỉ tăng không giảm.
'''

