prompt = "Viết một ADR ngắn để giảm thời gian pipeline PR từ 45 phút xuống dưới 15 phút cho team 8 người mà không làm tăng lỗi lọt lên production. Nêu bối cảnh, phương án đã cân nhắc, quyết định và hệ quả."
