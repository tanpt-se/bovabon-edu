[[questions]]
id = "testing-dvc03"
module = "testing-dv-projects"
type = "code"
difficulty = 2
lang = "javascript"
title = "Tạo project matrix có thứ tự"
prompt = '''Viết `buildProjectMatrix(browsers, locales)` để tạo các cấu hình cho mọi cặp browser-locale.
- Mỗi phần tử có dạng `{ name, browser, locale }`, với `name` bằng `browser + '-' + locale`.
- Duyệt browsers theo thứ tự đầu vào; bên trong mỗi browser duyệt locales theo thứ tự đầu vào.
- Nếu một đầu vào rỗng, trả mảng rỗng.
- Không thay đổi hai mảng đầu vào.

Ví dụ `buildProjectMatrix(['chromium'], ['en', 'vi'])` trả hai project `chromium-en` và `chromium-vi`.
'''
starter = '''
function buildProjectMatrix(browsers, locales) {
  return [];
}
'''
solution = '''
function buildProjectMatrix(browsers, locales) {
  const projects = [];
  for (const browser of browsers) {
    for (const locale of locales) {
      projects.push({ name: browser + '-' + locale, browser, locale });
    }
  }
  return projects;
}
'''
tests = '''
test('tạo tích Descartes theo đúng thứ tự đầu vào', () => {
  expect(buildProjectMatrix(['chromium', 'firefox'], ['en', 'vi'])).toEqual([
    { name: 'chromium-en', browser: 'chromium', locale: 'en' },
    { name: 'chromium-vi', browser: 'chromium', locale: 'vi' },
    { name: 'firefox-en', browser: 'firefox', locale: 'en' },
    { name: 'firefox-vi', browser: 'firefox', locale: 'vi' }
  ]);
});

test('một cặp tạo một project', () => {
  expect(buildProjectMatrix(['webkit'], ['ja'])).toEqual([{ name: 'webkit-ja', browser: 'webkit', locale: 'ja' }]);
});

test('đầu vào rỗng tạo danh sách rỗng', () => {
  expect(buildProjectMatrix([], ['en'])).toEqual([]);
  expect(buildProjectMatrix(['chromium'], [])).toEqual([]);
});

test('không sửa các mảng đầu vào', () => {
  const browsers = ['chromium'];
  const locales = ['en', 'vi'];
  buildProjectMatrix(browsers, locales);
  expect(browsers).toEqual(['chromium']);
  expect(locales).toEqual(['en', 'vi']);
});
'''
hints = ["Dùng vòng lặp lồng nhau để giữ thứ tự browser trước locale.", "Khởi tạo mảng kết quả mới, không push vào input."]
explanation = "Sinh matrix có thứ tự giúp cấu hình chạy nhất quán và làm rõ số tổ hợp mà suite sẽ kiểm tra."
sources = ["playwright/test-projects", "vitest/config/projects"]
