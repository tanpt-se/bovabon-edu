id = "testing"
title = "Testing: Vitest, Jest, Playwright"
icon = "🧪"
color = "#729b1b"
group = "Frontend"
docs = ["vitest", "jest", "playwright", "cypress"]
description = "Thiết kế unit, component và E2E test bằng Vitest, Jest, Playwright và Cypress; kiểm soát độ tin cậy, coverage và test flaky."

[[modules]]
id = "testing-principles"
title = "Nguyên lý kiểm thử"
description = "Testing pyramid, AAA và cách chọn test double phù hợp."
sources = ["vitest/guide/learn/testing-in-practice", "vitest/guide/learn/writing-tests"]
lesson = '''
### Chọn mức kiểm thử
| Mức | Phạm vi | Đặc điểm |
|---|---|---|
| Unit | Một hàm hoặc đơn vị nhỏ | Nhanh, lỗi thường dễ khoanh vùng |
| Integration | Nhiều thành phần phối hợp | Bắt lỗi ở ranh giới như DB, router hoặc component |
| E2E | Luồng người dùng qua ứng dụng | Gần thực tế nhưng chậm và tốn công giữ ổn định |

Testing pyramid là một gợi ý để có nhiều test nhỏ, đủ integration test và ít E2E test trọng yếu; đây không phải tỉ lệ cứng cho mọi sản phẩm. Mỗi test nên độc lập, có kết quả xác định và kiểm tra hành vi có ý nghĩa.

### AAA và test double
AAA chia test thành **Arrange** (dựng dữ liệu), **Act** (thực hiện hành động) và **Assert** (kiểm tra kết quả). Theo cách dùng trong lộ trình này, stub trả dữ liệu đã định trước, mock ghi nhận lời gọi để kiểm tra tương tác, spy quan sát hàm thật hoặc bọc hàm, còn fake là triển khai đơn giản có hành vi hoạt động như một subsystem.

Ví dụ: test tính tổng giỏ hàng có thể dùng dữ liệu cố định và assert tổng tiền; test gửi email có thể thay dịch vụ email bằng mock ở ranh giới side effect. Lỗi hay gặp: mock mọi hàm nội bộ, kiểm tra chi tiết triển khai thay vì kết quả, hoặc dùng chung state khiến test phụ thuộc thứ tự chạy.
'''

