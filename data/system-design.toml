  "Chuyển sang NoSQL để tự động scale",
  "Không làm gì cho tới khi DB sập",
]
answer = [1]
explanation = "800 ghi/s và 1,5 TB vẫn nằm trong khả năng một Postgres leader được tối ưu; tải chủ yếu là **đọc** → replica + cache giải quyết đúng chỗ. Sharding lúc này tiêu tốn nhiều tháng của team 4 người và đe doạ cam kết với khách. Chuẩn bị rẻ (truy vấn luôn có tenant_id, ngưỡng kích hoạt rõ ràng) giữ được lựa chọn cho tương lai. Đổi sang NoSQL là migration rủi ro cao không giải quyết vấn đề đọc; chờ sập là không chấp nhận được."

