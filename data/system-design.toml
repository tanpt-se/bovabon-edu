# ===================== sd-fundamentals =====================

[[questions]]
id = "sd-001"
module = "sd-fundamentals"
type = "single"
difficulty = 1
tags = ["level:junior", "latency"]
prompt = "Phân biệt **latency** và **throughput**. Câu nào đúng?"
options = [
  "Latency là thời gian một request hoàn tất; throughput là số request xử lý được trong một đơn vị thời gian",
  "Latency và throughput là hai tên gọi của cùng một chỉ số",
  "Throughput là thời gian chờ trong hàng đợi; latency là số CPU core",
  "Tăng throughput luôn làm giảm latency",
]
answer = [0]
explanation = "Latency đo **một request mất bao lâu** (ms); throughput đo **khả năng xử lý** (RPS). Hai chỉ số liên quan nhưng không đồng nhất: gom batch có thể tăng throughput nhưng làm từng request chờ lâu hơn (latency tăng), nên câu \"tăng throughput luôn giảm latency\" sai."

[[questions]]
id = "sd-002"
module = "sd-fundamentals"
type = "single"
difficulty = 1
tags = ["level:junior", "estimation"]
prompt = "Một ngày có khoảng bao nhiêu giây (giá trị hay dùng khi ước lượng nhanh)?"
options = ["~10^3 (1.000)", "~10^5 (86.400)", "~10^7", "~3,6 × 10^3"]
answer = [1]
explanation = "1 ngày = 24 × 3.600 = 86.400 s ≈ 10^5. Nhờ vậy 10 triệu request/ngày ≈ 10^7 / 10^5 ≈ 100 RPS (chính xác ~115). 3.600 là số giây trong **một giờ**."

[[questions]]
id = "sd-003"
module = "sd-fundamentals"
