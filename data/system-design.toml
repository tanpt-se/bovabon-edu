[[questions]]
id = "sd-c01"
module = "sd-fundamentals"
type = "code"
lang = "python"
difficulty = 1
tags = ["level:junior", "estimation"]
title = "Ước lượng QPS và dung lượng"
prompt = '''
Viết `estimate(dau, actions_per_user, peak_factor, bytes_per_action)` trả về `dict`:
- `total = dau * actions_per_user` (số request mỗi ngày), một ngày = `86400` giây
- `"avg_rps"`: `total / 86400` làm tròn **2 chữ số** (`round(x, 2)`)
- `"peak_rps"`: `total / 86400 * peak_factor` **làm tròn lên** thành số nguyên (`math.ceil`) — hệ thống phải chịu được đỉnh
- `"storage_gb_per_day"`: `total * bytes_per_action / 10**9` làm tròn 2 chữ số
- Nếu `dau < 0`, `actions_per_user < 0` hoặc `peak_factor < 1` → `raise ValueError("invalid input")`

Ví dụ: `estimate(1_000_000, 10, 3, 500)` → `{"avg_rps": 115.74, "peak_rps": 348, "storage_gb_per_day": 5.0}`.
'''
starter = '''
import math

def estimate(dau, actions_per_user, peak_factor, bytes_per_action):
    return {"avg_rps": 0, "peak_rps": 0, "storage_gb_per_day": 0}
'''
solution = '''
import math

def estimate(dau, actions_per_user, peak_factor, bytes_per_action):
    if dau < 0 or actions_per_user < 0 or peak_factor < 1:
        raise ValueError("invalid input")
    total = dau * actions_per_user
    per_sec = total / 86400
    return {
        "avg_rps": round(per_sec, 2),
        "peak_rps": math.ceil(per_sec * peak_factor),
        "storage_gb_per_day": round(total * bytes_per_action / 10**9, 2),
    }
'''
tests = '''
@test("ví dụ trong đề")
def _():
    expect(estimate(1_000_000, 10, 3, 500)).to_equal({"avg_rps": 115.74, "peak_rps": 348, "storage_gb_per_day": 5.0})

@test("peak làm tròn lên")
def _():
    expect(estimate(86400, 1, 1.5, 1000)["peak_rps"]).to_equal(2)
    expect(estimate(86400, 1, 1, 1000)["avg_rps"]).to_equal(1.0)

@test("không có người dùng")
def _():
    expect(estimate(0, 5, 2, 100)).to_equal({"avg_rps": 0.0, "peak_rps": 0, "storage_gb_per_day": 0.0})

@test("dung lượng lớn")
def _():
    expect(estimate(50_000_000, 20, 4, 2000)["storage_gb_per_day"]).to_equal(2000.0)

@test("đầu vào sai")
def _():
    expect(lambda: estimate(-1, 1, 2, 1)).to_raise(ValueError, match="invalid input")
    expect(lambda: estimate(10, 1, 0.5, 1)).to_raise(ValueError, match="invalid input")
'''
hints = ["Tính `per_sec = total / 86400` một lần rồi dùng lại.", "`math.ceil(per_sec * peak_factor)` cho peak."]
explanation = "Back-of-the-envelope giúp chọn kiến trúc đúng bậc: ~350 RPS peak thì một cụm nhỏ đủ, ~35.000 RPS thì phải nghĩ tới cache, sharding. Thiết kế theo **peak** chứ không theo trung bình."

