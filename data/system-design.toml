[[questions]]
id = "sd-c02"
module = "sd-fundamentals"
type = "code"
lang = "python"
difficulty = 2
tags = ["level:middle", "latency", "metrics"]
title = "Tính percentile latency"
prompt = '''
Viết `percentile(values, p)` theo phương pháp **nearest-rank**:
- sắp xếp tăng dần; `rank = ceil(p / 100 * n)`; trả `sorted_values[rank - 1]`
- `p == 0` → trả phần tử nhỏ nhất; `p` ngoài `[0, 100]` → `raise ValueError("bad p")`
- `values` rỗng → `raise ValueError("empty")`
- **không** sửa list đầu vào

Và `summarize(values)` trả `{"p50": ..., "p95": ..., "p99": ..., "max": ...}`.

Ví dụ: `percentile([5, 1, 3, 2, 4], 50)` → `3`; với 100 giá trị `1..100`, `p95` → `95`.
'''
starter = '''
import math

def percentile(values, p):
    return sum(values) / len(values)

def summarize(values):
    return {"p50": 0, "p95": 0, "p99": 0, "max": 0}
'''
solution = '''
import math

def percentile(values, p):
    if not values:
        raise ValueError("empty")
    if p < 0 or p > 100:
        raise ValueError("bad p")
    s = sorted(values)
    if p == 0:
        return s[0]
    rank = math.ceil(p / 100 * len(s))
    return s[rank - 1]

def summarize(values):
    return {
        "p50": percentile(values, 50),
        "p95": percentile(values, 95),
        "p99": percentile(values, 99),
        "max": max(values),
    }
'''
tests = '''
@test("trung vị")
def _():
    expect(percentile([5, 1, 3, 2, 4], 50)).to_equal(3)

@test("1..100")
def _():
    vals = list(range(100, 0, -1))
    expect(percentile(vals, 95)).to_equal(95)
    expect(percentile(vals, 99)).to_equal(99)
    expect(percentile(vals, 100)).to_equal(100)
    expect(percentile(vals, 0)).to_equal(1)
    expect(vals[0]).to_equal(100)

@test("tail latency bị mean che mất")
def _():
    vals = [10] * 98 + [2000, 3000]
    r = summarize(vals)
    expect(r["p50"]).to_equal(10)
    expect(r["p99"]).to_equal(2000)
    expect(r["max"]).to_equal(3000)

@test("lỗi đầu vào")
def _():
    expect(lambda: percentile([], 50)).to_raise(ValueError, match="empty")
    expect(lambda: percentile([1], 101)).to_raise(ValueError, match="bad p")
'''
hints = ["`sorted(values)` trả list mới, không sửa list gốc.", "Rank tính từ 1 nên phần tử là `s[rank - 1]`."]
explanation = "Percentile là cách đúng để nói về latency. Lưu ý thực tế: không thể lấy trung bình các p99 của nhiều instance; cần gộp **histogram** rồi tính percentile trên dữ liệu gộp."

