prompt = '''
PostgreSQL leader replicate **bất đồng bộ** sang 1 follower. Leader chết đột ngột, hệ thống tự promote follower. Rủi ro chính cần nói với stakeholder là gì?
'''
options = [
  "Không có rủi ro, follower có đủ dữ liệu",
  "Các transaction đã commit (đã trả OK cho client) nhưng chưa kịp replicate sẽ mất — RPO > 0; nếu leader cũ quay lại còn có nguy cơ split-brain",
  "Follower không thể nhận ghi sau khi promote",
  "Toàn bộ dữ liệu sẽ bị rollback về bản backup gần nhất",
]
answer = [1]
explanation = "Async replication xác nhận ghi trước khi follower nhận → khi failover có thể mất vài giây ghi cuối (RPO > 0). Cần fencing để leader cũ không tiếp tục nhận ghi (split-brain). Nếu dữ liệu không được phép mất (thanh toán), dùng synchronous replication cho ít nhất một replica và chấp nhận latency ghi cao hơn."

