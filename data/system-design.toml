[[questions]]
id = "sd-c09"
module = "sd-reliability"
type = "code"
lang = "javascript"
difficulty = 2
tags = ["level:middle", "retry", "backoff"]
title = "Retry với exponential backoff + full jitter"
prompt = '''
Cài `retry(op, { retries, baseMs, maxMs, random = Math.random }, done)`:
- Gọi `op()` **ngay lập tức** (đồng bộ). `op` trả giá trị hoặc ném lỗi.
- Thành công → gọi `done(null, value)`.
- Lỗi lần thứ `n` (n = 1, 2, …): nếu `err.retryable === false` hoặc đã dùng hết `retries` lần thử lại → `done(err)` (lỗi cuối cùng). Ngược lại hẹn giờ `setTimeout` thử lại sau
  `delay = Math.floor(random() * Math.min(maxMs, baseMs * 2 ** (n - 1)))` (full jitter).
- Tổng số lần gọi `op` tối đa là `retries + 1`. `done` chỉ được gọi **đúng một lần**.

Ví dụ: `baseMs = 100`, `random = () => 0.5` → các lần chờ là 50, 100, 200 ms…
'''
starter = '''
function retry(op, { retries, baseMs, maxMs, random = Math.random }, done) {
  try {
    done(null, op());
  } catch (err) {
    done(err);
  }
}
'''
solution = '''
function retry(op, { retries, baseMs, maxMs, random = Math.random }, done) {
  let failures = 0;
  const attempt = () => {
    let value;
    try {
      value = op();
    } catch (err) {
      failures++;
      if (err && err.retryable === false || failures > retries) {
        done(err);
        return;
      }
      const cap = Math.min(maxMs, baseMs * 2 ** (failures - 1));
      setTimeout(attempt, Math.floor(random() * cap));
      return;
    }
    done(null, value);
  };
  attempt();
}
'''
tests = '''
const half = () => 0.5;
function failing(times, value) {
  let calls = 0;
  return jest.fn(() => {
    calls++;
    if (calls <= times) throw new Error('fail ' + calls);
    return value;
  });
}
test('thành công ngay lần đầu', () => {
  const op = jest.fn(() => 'ok');
  const done = jest.fn();
  retry(op, { retries: 3, baseMs: 100, maxMs: 1000, random: half }, done);
  expect(op).toHaveBeenCalledTimes(1);
  expect(done.mock.calls).toEqual([[null, 'ok']]);
});
test('chờ backoff rồi thành công', () => {
  const op = failing(2, 'ok');
  const done = jest.fn();
  retry(op, { retries: 3, baseMs: 100, maxMs: 1000, random: half }, done);
  expect(op).toHaveBeenCalledTimes(1);
  jest.advanceTimersByTime(49);
  expect(op).toHaveBeenCalledTimes(1);
  jest.advanceTimersByTime(1);
  expect(op).toHaveBeenCalledTimes(2);
  jest.advanceTimersByTime(99);
  expect(op).toHaveBeenCalledTimes(2);
  jest.advanceTimersByTime(1);
  expect(op).toHaveBeenCalledTimes(3);
  expect(done.mock.calls).toEqual([[null, 'ok']]);
});
test('hết lượt retry thì trả lỗi cuối', () => {
  const op = failing(10, 'never');
  const done = jest.fn();
  retry(op, { retries: 2, baseMs: 10, maxMs: 1000, random: half }, done);
  jest.advanceTimersByTime(1000);
  expect(op).toHaveBeenCalledTimes(3);
  expect(done).toHaveBeenCalledTimes(1);
  expect(done.mock.calls[0][0].message).toBe('fail 3');
});
test('delay bị chặn bởi maxMs', () => {
  const op = failing(3, 'ok');
  const done = jest.fn();
  retry(op, { retries: 5, baseMs: 100, maxMs: 300, random: half }, done);
  jest.advanceTimersByTime(299);
  expect(op).toHaveBeenCalledTimes(3);
  jest.advanceTimersByTime(1);
  expect(op).toHaveBeenCalledTimes(4);
  expect(done.mock.calls).toEqual([[null, 'ok']]);
});
test('lỗi không retry được thì dừng ngay', () => {
  const op = jest.fn(() => { const e = new Error('bad request'); e.retryable = false; throw e; });
  const done = jest.fn();
  retry(op, { retries: 5, baseMs: 100, maxMs: 1000, random: half }, done);
  jest.advanceTimersByTime(5000);
  expect(op).toHaveBeenCalledTimes(1);
  expect(done.mock.calls[0][0].message).toBe('bad request');
});
'''
hints = ["Đếm số lần lỗi `failures`; điều kiện dừng là `failures > retries`.", "Delay lần lỗi thứ n: `Math.floor(random() * Math.min(maxMs, baseMs * 2 ** (n - 1)))`."]
explanation = "Full jitter phân tán thời điểm retry của hàng nghìn client, tránh chúng cùng đập vào dependency đúng một nhịp. Chặn bằng `maxMs` để thời gian chờ không tăng vô hạn; lỗi không tạm thời (4xx) thì không retry."

[[questions]]
id = "sd-c10"
module = "sd-reliability"
type = "code"
lang = "python"
difficulty = 3
tags = ["level:senior", "circuit-breaker"]
title = "Circuit breaker ba trạng thái"
prompt = '''
Cài `class CircuitBreaker(failure_threshold, reset_timeout, clock)` — `clock()` trả thời gian hiện tại (giây, số thực):
- `call(fn)`: gọi `fn()` và trả kết quả, theo trạng thái:
  - **closed**: gọi bình thường. `fn` ném lỗi → tăng bộ đếm lỗi liên tiếp rồi ném lại lỗi; khi bộ đếm đạt `failure_threshold` → chuyển **open** (ghi thời điểm mở). Thành công → đặt bộ đếm về 0.
  - **open**: nếu chưa qua `reset_timeout` giây kể từ lúc mở → **không gọi** `fn`, ném `CircuitOpenError`. Nếu đã qua (`clock() - opened_at >= reset_timeout`) → coi là **half_open**.
  - **half_open**: cho **một** lời gọi thử. Thành công → **closed**, bộ đếm = 0. Lỗi → **open** lại với thời điểm mở mới, ném lại lỗi.
- Thuộc tính `state` trả `"closed"`, `"open"` hoặc `"half_open"` (open đã hết cool-down thì báo `"half_open"`).
'''
starter = '''
class CircuitOpenError(Exception):
    pass

class CircuitBreaker:
    def __init__(self, failure_threshold, reset_timeout, clock):
        self.failure_threshold = failure_threshold
        self.reset_timeout = reset_timeout
        self.clock = clock

    @property
    def state(self):
        return "closed"

    def call(self, fn):
        return fn()
'''
solution = '''
class CircuitOpenError(Exception):
    pass

class CircuitBreaker:
    def __init__(self, failure_threshold, reset_timeout, clock):
        self.failure_threshold = failure_threshold
        self.reset_timeout = reset_timeout
        self.clock = clock
        self.failures = 0
        self.opened_at = None

    @property
    def state(self):
        if self.opened_at is None:
            return "closed"
        if self.clock() - self.opened_at >= self.reset_timeout:
            return "half_open"
        return "open"

    def call(self, fn):
        st = self.state
        if st == "open":
            raise CircuitOpenError("circuit open")
        try:
            result = fn()
        except Exception:
            if st == "half_open":
                self.opened_at = self.clock()
            else:
                self.failures += 1
                if self.failures >= self.failure_threshold:
                    self.opened_at = self.clock()
            raise
        self.failures = 0
        self.opened_at = None
        return result
'''
tests = '''
class Clock:
    def __init__(self):
        self.t = 0.0
    def __call__(self):
        return self.t

def boom():
    raise ConnectionError("down")

def make():
    c = Clock()
    return c, CircuitBreaker(3, 10, c)

@test("mở sau đủ số lỗi liên tiếp")
def _():
    c, cb = make()
    for _ in range(3):
        expect(lambda: cb.call(boom)).to_raise(ConnectionError)
    expect(cb.state).to_equal("open")
    calls = []
    expect(lambda: cb.call(lambda: calls.append(1))).to_raise(CircuitOpenError)
    expect(calls).to_equal([])

@test("thành công giữa chừng thì reset bộ đếm")
def _():
    c, cb = make()
    expect(lambda: cb.call(boom)).to_raise(ConnectionError)
    expect(lambda: cb.call(boom)).to_raise(ConnectionError)
    expect(cb.call(lambda: "ok")).to_equal("ok")
    expect(lambda: cb.call(boom)).to_raise(ConnectionError)
    expect(lambda: cb.call(boom)).to_raise(ConnectionError)
    expect(cb.state).to_equal("closed")

@test("half_open thành công thì đóng lại")
def _():
    c, cb = make()
    for _ in range(3):
        expect(lambda: cb.call(boom)).to_raise(ConnectionError)
    c.t = 9.9
    expect(cb.state).to_equal("open")
    c.t = 10.0
    expect(cb.state).to_equal("half_open")
    expect(cb.call(lambda: 42)).to_equal(42)
    expect(cb.state).to_equal("closed")

@test("half_open lỗi thì mở lại với thời điểm mới")
def _():
    c, cb = make()
    for _ in range(3):
        expect(lambda: cb.call(boom)).to_raise(ConnectionError)
    c.t = 12.0
    expect(lambda: cb.call(boom)).to_raise(ConnectionError)
    expect(cb.state).to_equal("open")
    c.t = 21.0
    expect(cb.state).to_equal("open")
    c.t = 22.0
    expect(cb.state).to_equal("half_open")
'''
hints = ["Chỉ cần lưu `failures` và `opened_at`; `state` suy ra từ `opened_at` và `clock()`.", "Ở half_open, một lỗi là đủ để mở lại — không cần đếm tới threshold."]
explanation = "Circuit breaker giúp **fail fast** khi dependency chết: phía gọi không phí thread chờ timeout, dependency có thời gian hồi phục. Half-open chỉ cho một (hoặc vài) request thử để tránh dồn tải ngay khi vừa hồi."

[[questions]]
id = "sd-061"
