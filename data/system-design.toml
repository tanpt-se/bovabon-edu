[[questions]]
id = "sd-029"
module = "sd-scaling-data"
type = "essay"
difficulty = 3
tags = ["level:senior", "scaling"]
prompt = "DB PostgreSQL chính đang ở 85% CPU vào giờ cao điểm, traffic dự kiến tăng gấp 3 trong 6 tháng. Trình bày lộ trình mở rộng tầng dữ liệu theo thứ tự bạn sẽ làm và lý do."
keywords = [
  ["query", "index", "explain", "truy vấn chậm"],
  ["cache", "redis"],
  ["read replica", "replica", "read/write split"],
  ["connection pool", "pgbouncer", "pool"],
  ["partition", "phân vùng", "tách bảng"],
  ["shard", "sharding"],
  ["đo", "metric", "profil", "pg_stat_statements"],
]
min_keywords = 4
model_answer = '''
1. **Đo trước**: dùng `pg_stat_statements`/metric để tìm top query tốn CPU; thường 20% query gây 80% tải.
2. **Tối ưu query & index**: thêm index thiếu, sửa N+1, bỏ `SELECT *`, xem `EXPLAIN ANALYZE`. Rẻ nhất và hay đem lại nhiều nhất.
3. **Connection pool** (PgBouncer): giảm chi phí hàng nghìn kết nối.
4. **Cache** dữ liệu đọc nhiều (Redis, cache-aside với TTL) để giảm tải đọc.
5. **Read replica + read/write split** cho truy vấn chấp nhận replication lag (báo cáo, danh sách), giữ đọc-sau-ghi ở leader.
6. **Partition** bảng lớn theo thời gian, lưu trữ dữ liệu cũ; tách theo chức năng (bảng log/analytics sang hệ khác).
7. Chỉ khi ghi vẫn vượt khả năng một leader mới **shard**, vì sharding thay đổi mô hình truy vấn, transaction và vận hành — quyết định khó đảo ngược.
Song song: nâng cấp vertical tạm thời để có thời gian, và đặt ngưỡng cảnh báo dung lượng.
'''
explanation = "Câu trả lời tốt đi từ rẻ & dễ đảo ngược tới đắt & khó đảo ngược, luôn bắt đầu bằng đo đạc. Nhảy thẳng vào sharding là dấu hiệu thiếu kinh nghiệm vận hành."

