[[questions]]
id = "sd-c11"
module = "sd-api-design"
type = "code"
lang = "python"
difficulty = 1
tags = ["level:junior", "pagination", "cursor"]
title = "Cursor pagination (keyset)"
prompt = '''
Viết `paginate(items, limit, cursor=None)` cho danh sách `items` gồm các dict có khoá `"id"` (số nguyên, duy nhất, **chưa sắp xếp**):
- Sắp xếp theo `id` tăng dần (không sửa list đầu vào).
- `cursor is None` → bắt đầu từ đầu; ngược lại `cursor` là chuỗi do `encode_cursor(last_id)` tạo ra → chỉ lấy các item có `id > last_id`.
- Trả `{"data": <tối đa limit item>, "next_cursor": encode_cursor(id cuối trang) hoặc None nếu không còn item nào sau trang này}`.
- `limit` ngoài khoảng `1..100` → `raise ValueError("bad limit")`.

Hàm `encode_cursor` / `decode_cursor` (base64, opaque với client) có sẵn trong starter.
'''
starter = '''
import base64

def encode_cursor(last_id):
    return base64.urlsafe_b64encode(str(last_id).encode()).decode()

def decode_cursor(cursor):
    return int(base64.urlsafe_b64decode(cursor.encode()).decode())

def paginate(items, limit, cursor=None):
    return {"data": items[:limit], "next_cursor": None}
'''
solution = '''
import base64

def encode_cursor(last_id):
    return base64.urlsafe_b64encode(str(last_id).encode()).decode()

def decode_cursor(cursor):
    return int(base64.urlsafe_b64decode(cursor.encode()).decode())

def paginate(items, limit, cursor=None):
    if limit < 1 or limit > 100:
        raise ValueError("bad limit")
    rows = sorted(items, key=lambda it: it["id"])
    if cursor is not None:
        last_id = decode_cursor(cursor)
        rows = [it for it in rows if it["id"] > last_id]
    page = rows[:limit]
    has_more = len(rows) > limit
    return {"data": page, "next_cursor": encode_cursor(page[-1]["id"]) if has_more else None}
'''
tests = '''
def ids(page):
    return [it["id"] for it in page["data"]]

@test("trang đầu và next_cursor")
def _():
    items = [{"id": i} for i in [5, 1, 4, 2, 3]]
    p = paginate(items, 2)
    expect(ids(p)).to_equal([1, 2])
    expect(decode_cursor(p["next_cursor"])).to_equal(2)
    expect([it["id"] for it in items]).to_equal([5, 1, 4, 2, 3])

@test("đi hết các trang")
def _():
    items = [{"id": i} for i in range(1, 8)]
    p1 = paginate(items, 3)
    p2 = paginate(items, 3, p1["next_cursor"])
    p3 = paginate(items, 3, p2["next_cursor"])
    expect(ids(p2)).to_equal([4, 5, 6])
    expect(ids(p3)).to_equal([7])
    expect(p3["next_cursor"]).to_be_none()

@test("xoá bản ghi giữa chừng không làm lệch trang")
def _():
    items = [{"id": i} for i in range(1, 11)]
    p1 = paginate(items, 3)
    items = [it for it in items if it["id"] != 2]
    p2 = paginate(items, 3, p1["next_cursor"])
    expect(ids(p2)).to_equal([4, 5, 6])

@test("trang vừa khít thì không còn cursor")
def _():
    items = [{"id": i} for i in range(1, 5)]
    expect(paginate(items, 4)["next_cursor"]).to_be_none()
    expect(paginate([], 10)).to_equal({"data": [], "next_cursor": None})

@test("limit không hợp lệ")
def _():
    expect(lambda: paginate([], 0)).to_raise(ValueError)
    expect(lambda: paginate([], 101)).to_raise(ValueError)
'''
hints = ["`sorted(items, key=...)` trả list mới, không đụng tới list gốc.", "Còn trang sau khi số item sau cursor lớn hơn `limit`."]
explanation = "Keyset pagination lọc theo giá trị của item cuối (`WHERE id > :last_id ORDER BY id LIMIT n`) nên không bị lệch khi có bản ghi bị xoá/chèn và chạy nhanh nhờ index, khác với OFFSET phải đọc bỏ qua toàn bộ phần trước. Cursor opaque cho phép server đổi cách mã hoá mà client không phải sửa."

