[[questions]]
id = "sd-062"
module = "sd-reliability"
type = "essay"
difficulty = 3
tags = ["level:senior", "resilience", "interview"]
prompt = "Phỏng vấn: \"Service checkout của bạn gọi 4 dependency (inventory, pricing, payment, recommendation). Hãy thiết kế để checkout vẫn đáng tin cậy khi một dependency chậm hoặc chết.\" Trình bày các cơ chế và cách bạn phân biệt dependency quan trọng với không quan trọng."
keywords = [
  ["timeout", "deadline"],
  ["retry", "backoff", "jitter"],
  ["circuit breaker", "ngắt mạch"],
  ["bulkhead", "pool riêng", "cô lập"],
  ["idempot", "idempotency key"],
  ["degrad", "fallback", "rút gọn", "ẩn"],
]
min_keywords = 4
model_answer = '''
1. **Phân loại dependency**: payment và inventory là quan trọng (thiếu thì không thể chốt đơn), pricing quan trọng nhưng có thể dùng giá cache ngắn hạn, recommendation là phụ.
2. **Timeout + deadline**: checkout có deadline tổng (ví dụ 2 s — ước lượng), truyền xuống; timeout mỗi dependency theo p99 của nó; recommendation timeout rất ngắn (~100 ms).
3. **Retry có kiểm soát**: chỉ retry lỗi tạm thời, exponential backoff + jitter, retry budget; payment chỉ retry với **idempotency key** để không trừ tiền hai lần.
4. **Circuit breaker** cho từng dependency để fail fast khi nó chết, **bulkhead** (pool/semaphore riêng) để recommendation chậm không ăn hết tài nguyên của payment.
5. **Graceful degradation / fallback**: recommendation lỗi → ẩn khối; pricing lỗi → giá cache còn hạn hoặc báo thử lại; payment lỗi kéo dài → cho phép đặt đơn "chờ thanh toán" và xử lý bất đồng bộ nếu nghiệp vụ chấp nhận.
6. **Quan sát**: metric theo dependency (lỗi, latency, trạng thái breaker), alert theo SLO của checkout.
'''
explanation = "Câu trả lời tốt không chỉ liệt kê pattern mà gắn từng pattern với mức độ quan trọng của dependency, và nhắc idempotency cho thanh toán khi retry."

