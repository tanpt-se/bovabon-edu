  "p99 latency của API đăng nhập vượt SLO liên tục 15 phút",
  "Ổ đĩa DB chính dự báo đầy trong 2 giờ tới",
  "Một job báo cáo nội bộ hàng tuần chạy chậm hơn thường lệ",
]
answer = [0, 2, 3]
explanation = "Page khi có **tác động người dùng** hoặc sắp có sự cố cần hành động ngay (đĩa đầy trong 2 giờ). CPU cao trong autoscaling là bình thường; job nội bộ chậm thì tạo ticket xử lý giờ hành chính. Alert không actionable gây alert fatigue."

[[questions]]
id = "sd-079"
module = "sd-observability"
type = "single"
difficulty = 2
tags = ["level:middle", "metrics", "percentile"]
prompt = "Có 10 instance, mỗi instance báo p99 latency của riêng mình. Cách nào cho **p99 toàn hệ thống** đúng?"
options = [
  "Lấy trung bình 10 giá trị p99",
  "Lấy giá trị p99 lớn nhất",
  "Thu latency dưới dạng **histogram** (bucket) ở mỗi instance, cộng các bucket lại rồi tính percentile từ histogram tổng",
  "Lấy p99 của instance có nhiều request nhất",
]
answer = [2]
explanation = "Percentile không cộng/trung bình được. Histogram thì cộng được (đếm theo bucket), nên tính percentile từ histogram gộp là cách đúng (sai số theo độ rộng bucket). Trung bình các p99 có thể sai rất xa khi tải các instance không đều."

[[questions]]
id = "sd-080"
module = "sd-observability"
type = "essay"
difficulty = 2
tags = ["level:middle", "incident", "postmortem"]
prompt = "Deploy lúc 14:00 làm 30% request thanh toán lỗi trong 25 phút. Mô tả cách bạn xử lý sự cố khi đang diễn ra và nội dung postmortem sau đó."
keywords = [
  ["rollback", "hoàn tác", "feature flag", "tắt"],
  ["incident commander", "điều phối", "vai trò"],
  ["timeline", "dòng thời gian"],
  ["status page", "thông báo", "stakeholder", "khách hàng"],
  ["blameless", "không đổ lỗi"],
  ["action item", "hành động", "người chịu trách nhiệm"],
]
min_keywords = 4
model_answer = '''
**Khi đang diễn ra**
1. Tuyên bố incident, chỉ định **incident commander** (điều phối) và người liên lạc; mở kênh riêng, ghi **timeline**.
2. Ưu tiên **giảm tác động**: deploy là thay đổi gần nhất → **rollback** (hoặc tắt feature flag) trước, tìm root cause sau.
3. Xác nhận hồi phục bằng metric (tỉ lệ lỗi thanh toán về mức bình thường), kiểm tra đơn hàng/thanh toán dở dang cần đối soát.
4. Cập nhật **status page** và stakeholder theo nhịp cố định.

**Postmortem (blameless)**
- Tác động: 25 phút, ~30% thanh toán lỗi, số đơn/doanh thu ảnh hưởng (ước lượng).
- Timeline: deploy, lúc phát hiện, lúc rollback, lúc hồi phục — đo MTTD, MTTR.
- Nguyên nhân gốc và các yếu tố góp phần (vì sao test/canary không bắt được, vì sao phát hiện mất X phút).
- **Không đổ lỗi** cá nhân; tập trung vào hệ thống.
- **Action item** cụ thể có người chịu trách nhiệm và hạn: thêm canary + rollback tự động theo tỉ lệ lỗi, test cho case gây lỗi, alert burn rate.
'''
explanation = "Hai ý quan trọng nhất: khôi phục trước khi tìm nguyên nhân, và postmortem không đổ lỗi với action item có chủ sở hữu."

[[questions]]
id = "sd-081"
module = "sd-observability"
type = "single"
difficulty = 3
tags = ["level:senior", "slo", "burn-rate"]
prompt = '''
SLO 99,9% trong 30 ngày. Trong 1 giờ qua, tỉ lệ lỗi là 1,44%. Burn rate là bao nhiêu và nếu giữ nguyên tốc độ này thì error budget 30 ngày cạn sau khoảng bao lâu?
'''
options = [
  "Burn rate 1,44; cạn sau ~21 ngày",
  "Burn rate 14,4; cạn sau ~2 ngày (≈ 50 giờ)",
  "Burn rate 144; cạn sau ~5 giờ",
  "Burn rate 0,144; không bao giờ cạn",
]
answer = [1]
explanation = "Burn rate = tỉ lệ lỗi / budget = 1,44% / 0,1% = 14,4. Budget đủ cho 30 ngày ở burn rate 1, nên ở 14,4 sẽ cạn sau 30/14,4 ≈ 2,08 ngày ≈ 50 giờ. Đây chính là ngưỡng thường dùng cho cảnh báo khẩn trong cửa sổ 1 giờ (tiêu ~2% budget mỗi giờ)."

[[questions]]
id = "sd-082"
module = "sd-observability"
type = "single"
difficulty = 3
tags = ["level:senior", "tracing", "sampling"]
prompt = "Hệ thống 50.000 request/s; lưu 100% trace quá đắt. Bạn muốn vẫn luôn có trace của các request **lỗi** hoặc **rất chậm**. Chiến lược sampling nào phù hợp?"
options = [
  "Head-based sampling 1% ngẫu nhiên tại gateway",
  "Tail-based sampling: collector giữ tạm span của cả trace, quyết định giữ sau khi trace kết thúc (giữ mọi trace lỗi/chậm, chỉ giữ một tỉ lệ nhỏ trace bình thường)",
  "Tắt tracing, chỉ dùng log",
  "Mỗi service tự sample ngẫu nhiên độc lập",
]
answer = [1]
explanation = "Head-based quyết định từ đầu nên bỏ lỡ phần lớn trace lỗi hiếm. Tail-based quyết định khi đã biết kết quả, đổi lại collector phải giữ span tạm trong bộ nhớ (tốn tài nguyên). Sample độc lập ở từng service làm trace bị đứt đoạn."

[[questions]]
id = "sd-083"
module = "sd-observability"
type = "single"
difficulty = 3
tags = ["level:lead", "slo", "error-budget", "decision"]
prompt = '''
Service đặt vé đã tiêu 110% error budget tháng này do 2 sự cố. Product muốn phát hành tính năng lớn tuần tới cho chiến dịch đã quảng cáo. Theo chính sách error budget team đã thống nhất, bạn đề xuất gì?
'''
options = [
  "Phát hành bình thường, error budget chỉ là con số tham khảo",
  "Đóng băng mọi thay đổi trong 3 tháng",
  "Tạm dừng phát hành tính năng không khẩn, ưu tiên các action item độ tin cậy; với tính năng chiến dịch thì đàm phán phát hành sau feature flag + canary nhỏ + kế hoạch rollback, có sự đồng ý rõ ràng của product và ghi nhận ngoại lệ",
  "Hạ SLO xuống 99% để có thêm budget",
]
answer = [2]
explanation = "Error budget là **công cụ thoả thuận** giữa tốc độ và độ ổn định; bỏ qua nó làm chính sách mất giá trị, còn đóng băng cứng thì bỏ qua cam kết kinh doanh. Lead tìm cách giảm rủi ro (flag, canary, rollback) và làm ngoại lệ minh bạch. Hạ SLO chỉ hợp lý khi SLO thật sự không phản ánh nhu cầu người dùng, không phải để lách."

# ===================== sd-security =====================

[[questions]]
id = "sd-084"
module = "sd-security"
type = "single"
difficulty = 1
tags = ["level:junior", "authz"]
prompt = "Người dùng A đăng nhập hợp lệ, đổi URL từ `/api/invoices/1001` thành `/api/invoices/1002` và xem được hoá đơn của người B. Đây là lỗi gì?"
options = [
  "Lỗi authentication: A đăng nhập sai",
  "IDOR (Insecure Direct Object Reference) — thiếu kiểm tra **authorization** trên từng tài nguyên",
  "SQL injection",
  "Lỗi CORS",
]
answer = [1]
explanation = "A đã được xác thực đúng, nhưng server không kiểm tra A có quyền với hoá đơn 1002 hay không. Mọi truy cập tài nguyên phải kiểm tra quyền ở server (ví dụ `WHERE id = ? AND owner_id = ?`); dùng id khó đoán chỉ là lớp phụ, không thay thế authz."

[[questions]]
id = "sd-085"
module = "sd-security"
type = "single"
difficulty = 1
tags = ["level:junior", "password"]
prompt = "Cách lưu mật khẩu người dùng nào đúng?"
options = [
  "Mã hoá AES với một key chung để có thể giải mã khi người dùng quên",
  "Băm SHA-256 một lần, không salt",
  "Băm bằng thuật toán chậm có salt như Argon2id hoặc bcrypt",
  "Lưu nguyên văn nhưng chỉ admin được đọc bảng",
]
answer = [2]
explanation = "Mật khẩu chỉ cần **kiểm tra**, không cần giải mã, nên dùng hash một chiều. Hash nhanh (SHA-256) bị dò bằng GPU rất nhanh; Argon2id/bcrypt cố ý chậm và có salt riêng từng mật khẩu để chống rainbow table. Quên mật khẩu thì cho đặt lại, không gửi lại mật khẩu cũ."

[[questions]]
id = "sd-086"
module = "sd-security"
type = "fill"
difficulty = 1
tags = ["level:junior", "least-privilege"]
prompt = "Nguyên tắc chỉ cấp cho mỗi người dùng/service **quyền tối thiểu** cần để làm việc gọi là least **{{blank}}**."
blanks = [["privilege"]]
explanation = "Least privilege giới hạn thiệt hại khi một tài khoản hay service bị chiếm: service báo cáo chỉ cần quyền đọc DB thì không được có quyền ghi/xoá."

[[questions]]
id = "sd-087"
module = "sd-security"
type = "multiple"
difficulty = 2
tags = ["level:middle", "jwt"]
prompt = "Service nhận access token JWT từ client. Những kiểm tra nào **bắt buộc** phải làm?"
options = [
  "Xác minh chữ ký với key/thuật toán được cấu hình sẵn (không tin trường `alg` tuỳ ý, từ chối `none`)",
  "Kiểm tra `exp` (hết hạn)",
  "Kiểm tra `aud` và `iss` khớp với service/IdP mong đợi",
  "Chỉ cần decode base64 payload để đọc `user_id`",
  "Lưu toàn bộ JWT vào localStorage của server",
]
answer = [0, 1, 2]
explanation = "JWT chỉ đáng tin khi chữ ký hợp lệ, còn hạn và được phát cho đúng service (`aud`) bởi đúng IdP (`iss`). Decode payload không kiểm tra chữ ký nghĩa là ai cũng tự tạo token được."

[[questions]]
id = "sd-088"
module = "sd-security"
type = "single"
difficulty = 2
tags = ["level:middle", "secrets"]
prompt = "Một dev lỡ commit AWS access key vào repo public, phát hiện sau 10 phút và đã force-push xoá commit. Việc **đầu tiên** cần làm là gì?"
options = [
  "Không cần làm gì vì commit đã bị xoá",
  "Thu hồi/vô hiệu hoá key ngay, tạo key mới qua secret manager, rồi kiểm tra log hoạt động của key trong khoảng bị lộ",
  "Đổi repo sang private",
  "Gửi email nhắc nhở dev",
]
answer = [1]
explanation = "Bot quét repo public trong vài giây; xoá commit không thu hồi được bản đã bị sao chép. Phải coi key là **đã lộ**: revoke, xoay vòng, kiểm tra audit log (CloudTrail…) để phát hiện lạm dụng. Sau đó mới tới biện pháp phòng ngừa (secret scanning pre-commit, credential ngắn hạn)."

[[questions]]
id = "sd-089"
module = "sd-security"
type = "single"
difficulty = 2
tags = ["level:middle", "service-to-service", "mtls"]
prompt = "30 service nội bộ hiện gọi nhau bằng **một API key chung** để trong biến môi trường. Thay thế nào cải thiện bảo mật nhiều nhất?"
options = [
  "Đổi API key mỗi năm một lần",
  "Mỗi service có danh tính riêng (mTLS qua service mesh hoặc token workload ngắn hạn) và chính sách cho phép ai được gọi ai",
  "Đặt tất cả service trong cùng VPC là đủ an toàn",
  "Mã hoá API key bằng base64",
]
answer = [1]
explanation = "Key dùng chung không cho biết **ai** gọi, không giới hạn được phạm vi, và lộ một chỗ là lộ hết. Danh tính riêng cho từng workload + authz giữa service (zero trust) giới hạn thiệt hại. Base64 không phải mã hoá; tin mạng nội bộ là trái nguyên tắc zero trust."

[[questions]]
id = "sd-090"
module = "sd-security"
type = "multiple"
difficulty = 2
tags = ["level:middle", "threat-modeling", "stride"]
prompt = "Tính năng mới: người dùng tải ảnh đại diện lên. Theo STRIDE, ghép đúng mối đe doạ với biện pháp (chọn các cặp **đúng**):"
options = [
  "Denial of service (tải file 5 GB) → giới hạn kích thước, rate limit theo người dùng",
  "Tampering (file chứa mã độc giả dạng ảnh) → kiểm tra magic bytes, xử lý/re-encode ảnh ở môi trường cô lập, quét virus",
  "Information disclosure (ảnh chứa metadata GPS) → xoá EXIF khi xử lý",
  "Elevation of privilege → tăng dung lượng bucket",
  "Spoofing (tải ảnh lên tài khoản người khác) → kiểm tra quyền chủ sở hữu ở API cấp pre-signed URL",
]
answer = [0, 1, 2, 4]
explanation = "Threat modeling giúp liệt kê có hệ thống. Tăng dung lượng bucket không liên quan tới leo thang đặc quyền; biện pháp cho E là least privilege (ví dụ worker xử lý ảnh không có quyền đọc dữ liệu khác)."

[[questions]]
id = "sd-091"
module = "sd-security"
type = "single"
difficulty = 3
tags = ["level:senior", "multi-tenant"]
prompt = '''
SaaS B2B dùng chung một DB PostgreSQL, mỗi bảng có cột `tenant_id`. Một bug quên `WHERE tenant_id = ?` từng làm lộ dữ liệu chéo tenant. Biện pháp nào **giảm rủi ro một cách hệ thống** mà không phải tách DB cho từng tenant?
'''
options = [
  "Nhắc team review kỹ hơn",
  "Bật Row-Level Security với policy theo `tenant_id` lấy từ biến session do tầng truy cập dữ liệu đặt cho mỗi request, cộng test tự động thử truy cập chéo tenant",
  "Mã hoá cột `tenant_id`",
  "Đổi `tenant_id` sang UUID",
]
answer = [1]
explanation = "RLS đưa điều kiện tenant xuống DB nên một truy vấn quên filter cũng không đọc được dữ liệu tenant khác (defense in depth). Cần cẩn thận: role của app không được bypass RLS, và connection pool phải đặt lại biến session mỗi request. Review thủ công không phải biện pháp hệ thống."

[[questions]]
id = "sd-092"
module = "sd-security"
type = "single"
difficulty = 3
tags = ["level:senior", "session", "jwt"]
prompt = "Yêu cầu: khi admin khoá tài khoản bị chiếm, mọi phiên của tài khoản đó phải mất hiệu lực **trong vòng 1 phút**. Hệ thống dùng JWT access token stateless TTL 24 giờ. Thiết kế nào đáp ứng hợp lý?"
options = [
  "Giữ TTL 24 giờ, tin rằng kẻ tấn công không dùng lâu",
  "Rút access token xuống ~5 phút + refresh token lưu server-side có thể thu hồi, và một danh sách chặn (theo `jti`/user, lưu Redis) được kiểm tra cho tới khi token cũ hết hạn",
  "Đổi secret ký JWT mỗi khi khoá một tài khoản",
  "Xoá cookie phía trình duyệt của kẻ tấn công",
]
answer = [1]
explanation = "JWT stateless khó thu hồi; cách phổ biến là TTL ngắn + refresh token kiểm soát ở server, cộng denylist ngắn hạn cho yêu cầu thu hồi gần như tức thì. Đổi signing key làm **mọi** người dùng bị đăng xuất. Server không thể xoá cookie trên máy kẻ tấn công."

[[questions]]
id = "sd-093"
module = "sd-security"
type = "single"
difficulty = 3
tags = ["level:lead", "multi-tenant", "decision"]
prompt = '''
SaaS có 2.000 tenant nhỏ dùng chung DB. Một khách hàng ngân hàng (chiếm 25% doanh thu dự kiến) yêu cầu dữ liệu tách biệt vật lý, khoá mã hoá riêng và có thể đặt ở region riêng. Team 8 người. Bạn đề xuất gì?
'''
options = [
  "Chuyển cả 2.000 tenant sang DB riêng cho đồng nhất",
  "Từ chối khách hàng vì làm phức tạp kiến trúc",
  "Mô hình lai: giữ pool chung cho tenant nhỏ, thêm tầng \"silo\" (DB/cluster riêng, KMS key riêng, region tuỳ chọn) cho tenant cao cấp, định tuyến theo tenant ở tầng truy cập dữ liệu; tính chi phí vận hành vào giá gói và tự động hoá việc tạo silo",
  "Hứa đáp ứng nhưng vẫn để chung DB, chỉ thêm mã hoá cột",
]
answer = [2]
explanation = "Mô hình **pool + silo** là cách phổ biến: chi phí thấp cho số đông, cô lập mạnh cho số ít trả tiền cho nó. Quyết định cần đi kèm tự động hoá (provisioning, migration chạy trên nhiều DB) và mô hình giá để không thành gánh nặng. Hứa suông vi phạm cam kết hợp đồng; chuyển toàn bộ sang silo nhân chi phí vận hành lên hàng nghìn lần."

# ===================== sd-case-studies =====================

[[questions]]
id = "sd-094"
module = "sd-case-studies"
type = "single"
difficulty = 1
tags = ["level:junior", "interview", "requirements"]
prompt = "Người phỏng vấn nói: \"Hãy thiết kế một URL shortener.\" Bước đầu tiên nên làm là gì?"
options = [
  "Vẽ ngay sơ đồ với Kafka, Kubernetes và Cassandra",
  "Hỏi làm rõ yêu cầu: tính năng cần có (custom alias, hết hạn, analytics), quy mô (số link/tháng, tỉ lệ đọc/ghi), yêu cầu latency/availability",
  "Viết code hàm sinh mã base62",
  "Chọn ngay database SQL hay NoSQL",
]
answer = [1]
explanation = "Không có yêu cầu thì không có cơ sở để đánh đổi. Vài phút làm rõ functional và non-functional quyết định toàn bộ thiết kế phía sau (ví dụ đọc ≫ ghi → tối ưu đường đọc bằng cache)."

[[questions]]
id = "sd-095"
module = "sd-case-studies"
type = "fill"
difficulty = 1
tags = ["level:junior", "url-shortener", "estimation"]
prompt = "Mã rút gọn dùng bảng chữ **base{{blank}}** gồm `a–z`, `A–Z`, `0–9`; với 7 ký tự sẽ có khoảng 3,5 nghìn tỉ mã."
blanks = [["62"]]
explanation = "26 + 26 + 10 = 62 ký tự; 62^7 ≈ 3,5 × 10^12 mã, đủ cho hàng chục năm ở mức 100 triệu link/tháng (ước lượng)."

[[questions]]
id = "sd-096"
module = "sd-case-studies"
type = "single"
difficulty = 2
tags = ["level:middle", "url-shortener"]
prompt = "URL shortener cần đếm **chính xác mọi lượt click** để làm analytics. Nên trả redirect loại nào?"
options = [
  "301 Moved Permanently vì trình duyệt cache được, giảm tải server",
  "302 Found (hoặc 307) để mỗi lượt click đều đi qua server và được ghi nhận",
  "200 kèm nội dung trang đích",
  "404 rồi dùng JavaScript chuyển trang",
]
answer = [1]
explanation = "301 được trình duyệt cache, các lần click sau đi thẳng tới đích nên **mất số liệu**. 302 đổi lại tải server cao hơn — chấp nhận được vì đường redirect rất nhẹ (tra cache key → URL). Ghi click nên đẩy vào queue để không làm chậm redirect."

[[questions]]
id = "sd-097"
module = "sd-case-studies"
type = "single"
difficulty = 2
tags = ["level:middle", "chat"]
prompt = "Ứng dụng chat 1-1 và nhóm. Cách chọn **partition key** cho bảng tin nhắn hợp lý nhất để đọc lịch sử hội thoại nhanh và giữ thứ tự là gì?"
options = [
  "Partition theo `message_id` ngẫu nhiên để phân bố đều",
  "Partition theo `conversation_id`, sắp xếp trong partition theo id tăng dần theo thời gian (ví dụ Snowflake/ULID)",
  "Partition theo ngày gửi",
  "Partition theo `sender_id`",
]
answer = [1]
explanation = "Truy vấn chính là \"lấy N tin mới nhất của hội thoại X\" → cùng partition, đã sắp xếp, chỉ một lần đọc. Partition theo ngày tạo hot partition; theo người gửi phải gom từ nhiều partition. Nhóm rất lớn có thể cần chia thêm theo khoảng thời gian (bucket)."

[[questions]]
id = "sd-098"
module = "sd-case-studies"
type = "multiple"
difficulty = 2
tags = ["level:middle", "file-upload"]
prompt = "Thiết kế upload video (tối đa 5 GB) cho ứng dụng di động. Chọn các quyết định **hợp lý**:"
options = [
  "Server cấp pre-signed URL, client tải thẳng lên object storage",
  "Dùng multipart upload để tải lại từng phần khi mạng chập chờn",
  "Gửi toàn bộ file qua app server rồi app server mới đẩy lên storage",
  "Sự kiện upload hoàn tất đẩy vào queue để worker transcode bất đồng bộ",
  "Lưu file video trong cột BLOB của DB chính",
]
answer = [0, 1, 3]
explanation = "Đi thẳng tới object storage giảm băng thông/bộ nhớ của app server; multipart cho phép resume; transcode chậm nên xử lý bất đồng bộ qua queue. File lớn trong DB chính làm phình backup, replication và cache của DB."

[[questions]]
id = "sd-099"
module = "sd-case-studies"
type = "single"
difficulty = 3
tags = ["level:senior", "news-feed", "fan-out"]
prompt = '''
Mạng xã hội: người dùng trung bình có 200 follower, nhưng có ~1.000 tài khoản nổi tiếng với 10–50 triệu follower. Đọc feed rất nhiều. Chiến lược tạo feed nào hợp lý?
'''
options = [
  "Fan-out on write cho mọi người, kể cả tài khoản nổi tiếng",
  "Fan-out on read cho mọi người",
  "Hybrid: push (fan-out on write) bài của người thường vào feed cache của follower; bài của tài khoản nổi tiếng được pull lúc đọc rồi trộn vào",
  "Mỗi lần đọc feed thì quét toàn bộ bảng bài viết",
]
answer = [2]
explanation = "Push cho người nổi tiếng nghĩa là một bài đăng sinh 50 triệu lượt ghi; pull cho tất cả làm mỗi lần đọc phải gom từ hàng trăm nguồn. Hybrid dùng push ở nơi rẻ và pull ở nơi fan-out quá lớn — đây là trade-off kinh điển khi tải lệch (skew)."

[[questions]]
id = "sd-100"
module = "sd-case-studies"
type = "single"
difficulty = 3
tags = ["level:senior", "notification"]
prompt = '''
Hệ thống notification gửi ~5 triệu push/email trong 10 phút khi có khuyến mãi. Nhà cung cấp email giới hạn 1.000 email/s, worker đôi khi crash giữa chừng. Thiết kế nào tránh **gửi trùng** và **vượt giới hạn**?
'''
options = [
  "Một vòng lặp gửi tuần tự trong cron job",
  "Queue theo kênh; worker lấy batch, kiểm tra/ghi `notification_id` vào bảng dedupe trước khi gửi (idempotency), rate limiter token bucket theo nhà cung cấp, retry có backoff và DLQ",
  "Gửi song song không giới hạn cho nhanh",
  "Gửi cùng lúc qua hai nhà cung cấp để chắc chắn tới nơi",
]
answer = [1]
explanation = "Queue + worker scale ngang; dedupe theo id giúp worker crash rồi chạy lại không gửi trùng (at-least-once + idempotent); token bucket giữ đúng hạn mức nhà cung cấp; DLQ giữ lại phần lỗi vĩnh viễn để xử lý. Lưu ý: 5 triệu email ở 1.000/s cần ~83 phút — phải báo lại product hoặc thêm hạn mức, không thể \"10 phút\"."

[[questions]]
id = "sd-101"
module = "sd-case-studies"
type = "essay"
difficulty = 3
tags = ["level:senior", "rate-limiter", "interview"]
prompt = "Phỏng vấn: \"Thiết kế rate limiter phân tán cho API gateway, 100.000 request/s, giới hạn theo API key và route.\" Trình bày thuật toán, nơi lưu trạng thái, xử lý khi kho trạng thái lỗi, và phản hồi cho client."
keywords = [
  ["token bucket", "sliding window", "leaky bucket"],
  ["redis"],
  ["nguyên tử", "atomic", "lua", "script"],
  ["429", "retry-after"],
  ["fail-open", "fail-closed", "fail open", "fail closed"],
  ["cục bộ", "local", "từng instance", "xấp xỉ"],
]
min_keywords = 4
model_answer = '''
1. **Yêu cầu**: giới hạn theo `(api_key, route)`, cho phép burst ngắn, độ trễ thêm < 1–2 ms (ước lượng), chấp nhận sai số nhỏ.
2. **Thuật toán**: token bucket (dung lượng = burst, tốc độ nạp = quota trung bình) hoặc sliding window counter; tránh fixed window vì có thể gấp đôi quota ở mép cửa sổ.
3. **Lưu trạng thái**: Redis cluster, key `rl:{api_key}:{route}`, cập nhật bằng **script Lua nguyên tử** (đọc token, nạp theo thời gian, trừ, đặt TTL) để không race giữa các gateway. 100.000 req/s chia trên nhiều shard theo key.
4. **Giảm tải Redis**: với key rất nóng, mỗi gateway giữ bộ đếm **cục bộ** và đồng bộ theo lô (chấp nhận sai số xấp xỉ).
5. **Khi Redis lỗi**: chọn theo rủi ro endpoint — **fail-open** cho đọc thông thường, **fail-closed**/giới hạn cục bộ chặt cho endpoint tốn tiền hoặc nhạy cảm; có alert.
6. **Phản hồi**: **429** + `Retry-After`, header `RateLimit-Remaining`; tài liệu quota cho khách hàng.
'''
explanation = "Điểm cộng: dùng thao tác nguyên tử, nêu sai số chấp nhận được, và có chính sách rõ ràng khi chính rate limiter bị lỗi."

[[questions]]
id = "sd-102"
module = "sd-case-studies"
type = "essay"
difficulty = 3
tags = ["level:lead", "interview", "migration"]
prompt = "Phỏng vấn vị trí Tech Lead: \"Monolith đặt vé hiện xử lý 500 đơn/phút, kinh doanh dự kiến gấp 10 lần trong 12 tháng. CTO muốn tách microservices ngay.\" Bạn sẽ đánh giá và đề xuất lộ trình thế nào?"
keywords = [
  ["đo", "profil", "nút cổ chai", "bottleneck", "số liệu"],
  ["strangler", "tách dần", "từng phần"],
  ["rủi ro", "risk", "rollback"],
  ["năng lực team", "team", "vận hành"],
  ["adr", "trade-off", "đánh đổi"],
  ["modular", "module hoá", "ranh giới", "bounded context"],
]
min_keywords = 4
model_answer = '''
1. **Đo trước khi quyết**: 10× = ~5.000 đơn/phút ≈ 85 đơn/s (ước lượng) — không phải tải lớn. Profile để tìm **nút cổ chai** thật (DB khoá ghế, truy vấn chậm, gọi payment đồng bộ).
2. **Sửa đúng chỗ trước**: index/truy vấn, cache dữ liệu đọc nhiều (lịch chiếu), read replica, đưa việc chậm (email, xuất vé PDF) sang queue, scale ngang monolith stateless.
3. **Module hoá trong monolith**: vạch ranh giới theo bounded context (booking, payment, catalog), tách schema logic, cấm gọi chéo trực tiếp.
4. **Tách dần (strangler fig)** chỉ những phần có lý do rõ: cần scale độc lập (search/catalog), hoặc team riêng, hoặc chu kỳ phát hành khác. Mỗi bước có feature flag, chạy song song và kế hoạch **rollback**.
5. **Năng lực team & vận hành**: microservices cần tracing, CI/CD, on-call; nếu chưa có thì đó là chi phí lớn nhất — đưa vào kế hoạch.
6. **Trình bày cho CTO** bằng ADR: các phương án, trade-off, chi phí, rủi ro và mốc đo (nếu sau bước 2 vẫn không đạt mục tiêu thì tách tiếp phần nào).
'''
explanation = "Câu trả lời Lead tốt dựa trên số liệu, chọn phương án dễ đảo ngược trước, tính tới năng lực team và trình bày trade-off cho người ra quyết định — không phản đối hay đồng ý theo cảm tính."

[[questions]]
id = "sd-103"
module = "sd-case-studies"
type = "single"
difficulty = 3
tags = ["level:lead", "interview", "scope"]
prompt = '''
Còn 15 phút trong buổi phỏng vấn thiết kế hệ thống đặt xe; bạn mới xong high-level design. Người phỏng vấn hỏi: "Bạn muốn đi sâu vào phần nào?" Lựa chọn nào thể hiện tư duy tốt nhất?
'''
options = [
  "Đi sâu vào việc chọn framework frontend",
  "Chọn phần rủi ro/khó nhất của bài: ghép tài xế–khách theo vị trí thời gian thực (geo-index, cập nhật vị trí tần suất cao) và tránh một tài xế bị gán hai chuyến; nói rõ vì sao chọn phần đó",
  "Liệt kê thêm mọi công nghệ có thể dùng",
  "Nói về cách viết unit test cho API",
]
answer = [1]
explanation = "Deep dive nên vào phần **quyết định thành bại** của hệ thống và giải thích lý do ưu tiên — đó là kỹ năng phân bổ thời gian và nhận diện rủi ro mà vị trí Lead cần. Liệt kê công nghệ không cho thấy khả năng đánh đổi."

# ===================== system-design-lead =====================

[[questions]]
id = "sd-104"
module = "system-design-lead"
type = "single"
difficulty = 1
tags = ["level:junior", "adr"]
prompt = "**ADR** (Architecture Decision Record) dùng để làm gì?"
