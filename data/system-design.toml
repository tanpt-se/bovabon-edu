solution = '''
import sqlite3

class PaymentConsumer:
    def __init__(self, conn):
        self.conn = conn
        with conn:
            conn.execute("CREATE TABLE IF NOT EXISTS processed (message_id TEXT PRIMARY KEY)")
            conn.execute("CREATE TABLE IF NOT EXISTS balances (account TEXT PRIMARY KEY, amount INTEGER NOT NULL)")

    def handle(self, msg):
        try:
            with self.conn:
                self.conn.execute("INSERT INTO processed(message_id) VALUES (?)", (msg["id"],))
                amount = msg["amount"]
                if not isinstance(amount, int) or isinstance(amount, bool) or amount <= 0:
                    raise ValueError("bad amount")
                self.conn.execute(
                    "INSERT INTO balances(account, amount) VALUES (?, ?) "
                    "ON CONFLICT(account) DO UPDATE SET amount = amount + excluded.amount",
                    (msg["account"], amount),
                )
        except sqlite3.IntegrityError:
            return False
        return True

    def balance(self, account):
        row = self.conn.execute("SELECT amount FROM balances WHERE account = ?", (account,)).fetchone()
        return row[0] if row else 0
'''
tests = '''
import sqlite3

def make():
    return PaymentConsumer(sqlite3.connect(":memory:"))

@test("xử lý bình thường")
def _():
    c = make()
    expect(c.handle({"id": "m1", "account": "A", "amount": 100})).to_be_true()
    expect(c.handle({"id": "m2", "account": "A", "amount": 50})).to_be_true()
    expect(c.balance("A")).to_equal(150)
    expect(c.balance("B")).to_equal(0)

@test("message trùng không cộng hai lần")
def _():
    c = make()
    m = {"id": "m1", "account": "A", "amount": 100}
    expect(c.handle(m)).to_be_true()
    expect(c.handle(m)).to_be_false()
    expect(c.handle(dict(m))).to_be_false()
    expect(c.balance("A")).to_equal(100)

@test("lỗi giữa chừng thì không ghi nhận id")
def _():
    c = make()
    expect(lambda: c.handle({"id": "m9", "account": "A", "amount": -5})).to_raise(ValueError, match="bad amount")
    expect(c.balance("A")).to_equal(0)
    expect(c.handle({"id": "m9", "account": "A", "amount": 5})).to_be_true()
    expect(c.balance("A")).to_equal(5)

@test("nhiều tài khoản")
def _():
    c = make()
    for i in range(10):
        c.handle({"id": f"x{i}", "account": "A" if i % 2 else "B", "amount": 10})
    c.handle({"id": "x3", "account": "A", "amount": 10})
    expect(c.balance("A")).to_equal(50)
    expect(c.balance("B")).to_equal(50)
'''
hints = ["`with conn:` mở transaction, tự commit khi không lỗi và rollback khi có exception.", "Chèn `message_id` vào bảng có PRIMARY KEY: trùng thì `sqlite3.IntegrityError`."]
explanation = "Ghi nhận id đã xử lý và thay đổi nghiệp vụ trong **cùng một transaction** là điều kiện để đạt hiệu quả \"exactly-once\" trên nền at-least-once. Nếu hai việc nằm ở hai hệ thống khác nhau (ví dụ Redis + DB) thì vẫn có cửa sổ lỗi."

