description = "Thiết kế hệ thống phân tán từ nền tảng tới quyết định kiến trúc: ước lượng, dữ liệu, cache, messaging, độ tin cậy, API, observability, bảo mật, case study phỏng vấn và góc nhìn Tech Lead."

[[modules]]
id = "sd-fundamentals"
title = "Nền tảng System Design"
description = "Latency vs throughput, ước lượng dung lượng (back-of-the-envelope), CAP/PACELC, các consistency model."
lesson = '''
### Latency, throughput và percentile
- **Latency**: thời gian một request đi hết hệ thống (đo bằng ms). **Throughput**: số việc xử lý được trên một đơn vị thời gian (RPS, QPS, MB/s).
- Đừng dùng trung bình (mean) để nói về latency: một vài request chậm bị "che" đi. Dùng **percentile**: p50 (trung vị), **p95**, **p99**. Người dùng gọi 1 trang cần 20 request backend sẽ "gặp" p99 khá thường xuyên — gọi là **tail latency**.
- **Little's Law**: `L = λ × W` — số request đang xử lý đồng thời = tốc độ đến × thời gian xử lý. Ví dụ 2.000 RPS, mỗi request 50 ms → khoảng 100 request "trong hệ thống" cùng lúc, cần pool kết nối/worker tương ứng.

### Bảng độ trễ tham khảo (bậc độ lớn, ước lượng)
| Thao tác | Bậc độ lớn |
|---|---|
| Đọc RAM | ~100 ns |
| Đọc SSD ngẫu nhiên | ~100 µs |
| Round-trip trong cùng data center | ~0,5 ms |
| Seek ổ HDD | ~10 ms |
| Round-trip liên lục địa | ~100–150 ms |

Ý nghĩa: gọi mạng đắt hơn đọc bộ nhớ hàng nghìn lần → gom request (batch), cache gần nơi dùng, tránh "chatty" giữa các service.

### Back-of-the-envelope
Quy tắc nhanh: 1 ngày ≈ **86.400 s ≈ 10^5 s**. 10 triệu request/ngày ≈ **~115 RPS** trung bình; peak thường lấy ×2–×5.
Ví dụ (ước lượng): 1 triệu bài đăng/ngày × 1 KB = 1 GB/ngày ≈ 365 GB/năm; ×3 bản sao ≈ 1,1 TB/năm. Mục tiêu là **đúng bậc độ lớn** để chọn kiến trúc (1 máy hay cluster), không cần chính xác.

### CAP và PACELC
- **CAP**: khi có **network partition (P)**, hệ thống phải chọn **C** (consistency — từ chối/đợi để không trả dữ liệu cũ) hoặc **A** (availability — vẫn trả lời, có thể dữ liệu cũ). Partition không phải thứ "chọn bỏ" được trong hệ phân tán.
- **PACELC**: nếu Partition thì chọn A hoặc C; **Else** (bình thường) vẫn phải đánh đổi **Latency** vs **Consistency** (ví dụ chờ quorum ghi đồng bộ làm tăng latency).

### Consistency model (từ mạnh tới yếu)
| Model | Đảm bảo | Ví dụ dùng |
|---|---|---|
| Linearizable (strong) | mọi đọc thấy ghi mới nhất theo thời gian thực | số dư, khoá phân tán |
| Sequential / causal | giữ thứ tự nhân quả (trả lời sau câu hỏi) | comment, chat |
| Read-your-writes | người ghi luôn thấy ghi của chính mình | sửa profile |
| Eventual | cuối cùng các bản sao hội tụ | đếm like, feed |

### Lỗi hay gặp
- Thiết kế cho "trung bình" mà quên peak và tail latency.
- Nói "chọn CA" cho hệ phân tán — partition luôn có thể xảy ra.
- Đòi strong consistency cho mọi thứ → chậm và đắt; nên chọn theo **từng loại dữ liệu**.
- Quên đơn vị (bit vs byte, ms vs µs) khi ước lượng.
'''

[[modules]]
id = "sd-scaling-data"
title = "Mở rộng tầng dữ liệu"
description = "Replication, partitioning/sharding, consistent hashing, read/write split, hot key."
lesson = '''
### Scale up vs scale out
- **Vertical scaling** (máy to hơn): đơn giản, không đổi code, nhưng có trần và là một điểm lỗi.
- **Horizontal scaling** (thêm máy): gần như không trần, nhưng phải xử lý phân phối dữ liệu, consistency, rebalancing.
Thứ tự hợp lý thường là: tối ưu query/index → cache → read replica → partition theo chức năng → shard.

### Replication
| Kiểu | Ưu | Nhược |
|---|---|---|
| Leader–follower (single-leader) | đơn giản, ghi có thứ tự | ghi dồn vào leader, **replication lag** khi đọc từ follower |
| Multi-leader | ghi ở nhiều region | xung đột ghi phải giải quyết (LWW, CRDT…) |
| Leaderless (quorum) | chịu lỗi tốt | phải chọn N, W, R; đọc có thể cũ nếu `W + R ≤ N` |

Quorum: với N bản sao, chọn **W + R > N** thì tập ghi và tập đọc giao nhau → đọc thấy bản ghi mới nhất (trong điều kiện bình thường). Ví dụ N=3, W=2, R=2.
**Sync vs async replication**: đồng bộ thì an toàn hơn nhưng tăng latency ghi; bất đồng bộ thì có thể mất dữ liệu đã xác nhận khi leader chết (RPO > 0).

### Read/write split và replication lag
Đọc từ replica giúp tăng throughput đọc, nhưng người dùng vừa ghi có thể đọc lại dữ liệu cũ. Cách xử lý: đọc từ leader trong vài giây sau khi ghi (read-your-writes), hoặc gắn version/LSN và chỉ đọc replica đã bắt kịp.

### Partitioning / sharding
| Chiến lược | Ưu | Nhược |
|---|---|---|
| Range (theo khoảng key) | range query hiệu quả | dễ **hot partition** (key tăng dần như thời gian) |
| Hash (`hash(key) % N`) | phân bố đều | đổi N làm **di chuyển gần hết** key; mất range query |
| Consistent hashing | thêm/bớt node chỉ dời ~1/N key | cần **virtual node** để cân bằng |
| Directory/lookup | linh hoạt tuyệt đối | thêm một dịch vụ tra cứu phải HA |

**Shard key** là quyết định khó đảo ngược: chọn key có **cardinality cao**, phân bố đều và khớp truy vấn phổ biến (ví dụ `tenant_id` cho SaaS, `user_id` cho dữ liệu cá nhân). Query không chứa shard key sẽ thành **scatter-gather** tới mọi shard.

### Hot key
Một key nhận quá nhiều traffic (người nổi tiếng, sản phẩm flash sale). Xử lý: cache cục bộ, nhân bản key đọc nhiều, **key salting** (chia `counter:42` thành `counter:42#0..9` rồi cộng lại khi đọc), gom ghi (batch).

### Lỗi hay gặp
- Shard quá sớm khi một instance với index tốt vẫn đủ (độ phức tạp vận hành tăng mạnh).
- Dùng `% N` rồi phải thêm node giữa mùa cao điểm.
- Join/transaction xuyên shard làm mất lợi ích sharding.
- Quên đo replication lag; đọc replica cho luồng thanh toán.
'''

[[modules]]
id = "sd-caching"
title = "Caching"
description = "Cache-aside, write-through, write-back, TTL & invalidation, cache stampede, CDN, eviction."
lesson = '''
### Vì sao cache
Cache đặt dữ liệu nóng gần nơi dùng để giảm latency và tải cho nguồn (DB, service). Hiệu quả đo bằng **hit ratio**. Ví dụ (ước lượng): DB chịu 2.000 QPS, hit ratio 95% → chỉ còn ~100 QPS chạm DB; nếu hit ratio rơi xuống 80% thì tải DB tăng gấp 4 (400 QPS) — cache chết là sự cố DB.

### Các pattern
| Pattern | Cách làm | Ưu | Nhược |
|---|---|---|---|
| Cache-aside (lazy loading) | app đọc cache, miss thì đọc DB rồi ghi cache | đơn giản, chỉ cache thứ được đọc | miss đầu chậm, dễ stale |
| Read-through | thư viện/cache tự nạp khi miss | code app gọn | phụ thuộc cache provider |
| Write-through | ghi cache và DB đồng bộ | cache luôn mới | ghi chậm hơn, cache cả dữ liệu ít đọc |
| Write-back (write-behind) | ghi cache, flush DB sau | ghi rất nhanh, gom ghi | **mất dữ liệu** nếu cache chết trước khi flush |
| Write-around | ghi thẳng DB, không ghi cache | tránh làm bẩn cache | đọc ngay sau ghi bị miss |

### Invalidation và TTL
- "Xoá cache khi ghi" (delete thay vì update) thường an toàn hơn update vì tránh race hai lần ghi đè nhau với giá trị cũ.
- **TTL** là lưới an toàn: kể cả khi invalidation bị sót, dữ liệu cũ chỉ tồn tại tối đa TTL. Thêm **jitter** vào TTL để các key không hết hạn cùng lúc.
- Với dữ liệu quan trọng, dùng version trong key (`user:42:v7`) để chuyển phiên bản nguyên tử.

### Cache stampede (thundering herd)
Key nóng hết hạn → hàng nghìn request cùng miss và cùng đập vào DB. Cách chống:
- **Request coalescing / single-flight**: chỉ một request nạp lại, các request khác chờ kết quả đó.
- **Lock/lease** trên key khi nạp lại.
- **Stale-while-revalidate**: trả bản cũ trong lúc làm mới nền.
- Làm mới sớm theo xác suất trước khi hết hạn.

### Eviction
LRU (ít dùng gần đây nhất), LFU (ít dùng nhất), FIFO, TTL. LRU cài bằng hash map + danh sách liên kết đôi cho O(1).

### CDN
CDN cache nội dung tĩnh (và cả API công khai) ở edge gần người dùng. Điều khiển bằng `Cache-Control` (`max-age`, `s-maxage`, `stale-while-revalidate`), **cache key** (URL + header được vary) và purge. Asset nên đặt tên có hash (`app.3f9a.js`) để cache lâu và không cần purge.

### Lỗi hay gặp
- Cache dữ liệu cá nhân trên shared cache/CDN (lộ dữ liệu giữa người dùng).
- Không có TTL → dữ liệu cũ vĩnh viễn khi quên invalidate.
- Cache cả kết quả lỗi/rỗng quá lâu, hoặc không cache kết quả rỗng nên bị **cache penetration** (truy vấn key không tồn tại liên tục).
- Xem cache như nguồn sự thật duy nhất.
'''

[[modules]]
id = "sd-async-messaging"
title = "Xử lý bất đồng bộ & Messaging"
description = "Queue vs log (Kafka-style), delivery semantics, idempotent consumer, outbox, saga, backpressure."
lesson = '''
### Vì sao bất đồng bộ
Tách việc chậm hoặc không cần trả lời ngay (gửi email, resize ảnh, tính điểm) ra khỏi request: giảm latency, **làm phẳng đỉnh tải** (queue hấp thụ burst), cô lập lỗi giữa service.

### Queue vs log
| | Message queue (RabbitMQ, SQS) | Log phân vùng (Kafka-style) |
|---|---|---|
| Mô hình | message bị xoá sau khi ack | message giữ theo retention, consumer tự giữ **offset** |
| Đọc lại (replay) | không (trừ DLQ) | có, đọc lại từ offset cũ |
| Thứ tự | thường không đảm bảo khi nhiều consumer | đảm bảo **trong một partition** |
| Mở rộng consumer | thêm worker cạnh tranh | tối đa số consumer trong group = số partition |
| Hợp với | task/job | event stream, nhiều consumer độc lập, event sourcing |

Thứ tự theo thực thể: dùng **partition key** (ví dụ `order_id`) để mọi event của một đơn hàng vào cùng partition.

### Delivery semantics
- **At-most-once**: có thể mất, không trùng.
- **At-least-once**: không mất nhưng **có thể trùng** — phổ biến nhất.
- **Exactly-once** đầu-cuối là bài toán khó; thực tế đạt "hiệu quả như exactly-once" bằng **at-least-once + idempotent consumer**.

### Idempotent consumer
Lưu `message_id` đã xử lý (bảng có unique constraint) **trong cùng transaction** với thay đổi nghiệp vụ, hoặc thiết kế thao tác tự nhiên idempotent (`SET status = 'paid'` thay vì `balance = balance + 10`).

### Dual-write và Transactional Outbox
Ghi DB rồi publish message là **dual write**: crash giữa hai bước → DB có đơn mà không có event (hoặc ngược lại). **Outbox**: trong cùng transaction, ghi dữ liệu nghiệp vụ và một dòng vào bảng `outbox`; một **relay** (polling hoặc CDC) đọc outbox, publish rồi đánh dấu đã gửi. Relay có thể publish trùng → consumer phải idempotent.

### Saga
Transaction trải trên nhiều service không dùng 2PC: chuỗi bước cục bộ, mỗi bước có **compensating action** (hoàn tiền, nhả kho). Hai kiểu: **orchestration** (một điều phối viên ra lệnh — dễ theo dõi) và **choreography** (service phản ứng theo event — ít phụ thuộc trung tâm nhưng khó nhìn toàn cục).

### Backpressure, retry và DLQ
- Theo dõi **consumer lag** (độ trễ so với đầu log) và độ dài queue — tín hiệu scale worker.
- Message lỗi lặp lại (poison message) → sau N lần chuyển vào **dead-letter queue** để không chặn cả hàng.

### Lỗi hay gặp
- Giả định không bao giờ nhận trùng.
- Tăng consumer quá số partition rồi thắc mắc vì sao không nhanh hơn.
- Ack trước khi xử lý xong (mất message khi crash).
- Dùng queue để che một service luôn quá tải — queue chỉ hoãn vấn đề, lag sẽ tăng mãi.
'''

[[modules]]
id = "sd-reliability"
title = "Độ tin cậy & Khả năng chịu lỗi"
description = "Timeout, retry + exponential backoff + jitter, circuit breaker, bulkhead, rate limiting, load shedding, graceful degradation."
lesson = '''
### Mọi lời gọi mạng đều có thể chậm hoặc lỗi
Thiết kế theo giả định dependency sẽ lỗi. Bộ công cụ cơ bản:

### Timeout
Mọi lời gọi ra ngoài phải có timeout. Không có timeout → thread/connection bị giữ mãi, lỗi lan ngược (cascading failure). Đặt timeout theo latency thực tế của dependency (ví dụ cao hơn p99 một chút) và theo **deadline** tổng của request (truyền deadline xuống các tầng dưới).

### Retry, exponential backoff và jitter
- Chỉ retry lỗi **tạm thời** (timeout, 503, 429) và thao tác **idempotent** (hoặc có idempotency key).
- Backoff mũ: chờ `base × 2^attempt` (giới hạn bởi `max`). **Jitter** (ngẫu nhiên hoá thời gian chờ) tránh hàng nghìn client retry cùng nhịp.
- Retry ở nhiều tầng nhân lên: 3 tầng × 3 lần = tới 27 lần gọi vào dependency đang ốm → **retry storm**. Chỉ retry ở một tầng, dùng **retry budget** (ví dụ tối đa 10% request là retry).

### Circuit breaker
| Trạng thái | Hành vi |
|---|---|
| Closed | gọi bình thường, đếm lỗi |
| Open | từ chối ngay (fail fast) trong một khoảng cool-down |
| Half-open | cho vài request thử; thành công → Closed, lỗi → Open |
Mục đích: cho dependency thời gian hồi phục và giải phóng tài nguyên phía gọi.

### Bulkhead
Chia tài nguyên (pool thread/connection) theo dependency hoặc theo loại khách hàng, để một phần hỏng không ăn hết tài nguyên của phần còn lại.

### Rate limiting
| Thuật toán | Đặc điểm |
|---|---|
| Token bucket | cho phép burst tới dung lượng bucket, tốc độ trung bình = tốc độ nạp |
| Leaky bucket | đầu ra đều, làm mượt burst |
| Fixed window | đơn giản, nhưng có thể gấp đôi quota ở mép cửa sổ |
| Sliding window log/counter | chính xác hơn, tốn bộ nhớ hơn (log) |
Trả **429** kèm `Retry-After`. Rate limit phân tán thường dùng Redis (thao tác nguyên tử) hoặc chấp nhận xấp xỉ theo từng node.

### Load shedding và graceful degradation
- **Load shedding**: khi quá tải, chủ động từ chối sớm request ít quan trọng để giữ phần quan trọng (thanh toán > gợi ý sản phẩm).
- **Graceful degradation**: dependency phụ lỗi thì trả kết quả rút gọn (ẩn khối gợi ý, dùng dữ liệu cache cũ) thay vì lỗi cả trang.

### Redundancy và failover
Loại bỏ **single point of failure**, chạy nhiều AZ; health check + tự động failover. Nhớ: thêm bản sao chỉ giúp nếu lỗi **độc lập** (cùng bản deploy lỗi thì mọi bản sao cùng chết).

### Lỗi hay gặp
- Timeout phía client dài hơn timeout của load balancer/gateway.
- Retry thao tác không idempotent (trừ tiền hai lần).
- Không có jitter; circuit breaker dùng chung cho mọi endpoint của dependency.
'''

[[modules]]
id = "sd-api-design"
title = "Thiết kế API"
description = "REST vs gRPC vs GraphQL, pagination, versioning, idempotency key, webhook, backward compatibility."
lesson = '''
### Chọn kiểu API
| | REST/JSON | gRPC (HTTP/2 + Protobuf) | GraphQL |
|---|---|---|---|
| Hợp với | API công khai, đơn giản, cache HTTP | service-to-service, latency thấp, streaming | client cần ghép dữ liệu linh hoạt (mobile, nhiều màn) |
| Ưu | dễ dùng, công cụ phổ biến, CDN cache | schema chặt, codegen, nhỏ gọn, streaming 2 chiều | một request lấy đúng dữ liệu cần, tránh over/under-fetching |
| Nhược | over-fetching, nhiều round-trip | khó gọi từ trình duyệt (cần gRPC-Web), khó debug bằng mắt | cache HTTP khó, query đắt (cần giới hạn độ sâu/độ phức tạp), N+1 ở resolver |

### Pagination
- **Offset/limit**: dễ nhảy trang, nhưng `OFFSET 100000` chậm (DB vẫn đọc qua) và lệch khi có bản ghi mới chèn vào.
- **Cursor (keyset)**: `WHERE (created_at, id) < (:c_time, :c_id) ORDER BY created_at DESC, id DESC LIMIT 20` — ổn định, dùng index; cursor nên **opaque** (mã hoá base64) để server tự do đổi cách cài.

### Versioning và tương thích ngược
- Thay đổi **an toàn**: thêm field tuỳ chọn, thêm endpoint, thêm giá trị enum (nếu client được dặn bỏ qua giá trị lạ).
- Thay đổi **phá vỡ**: đổi tên/xoá field, đổi kiểu, đổi ngữ nghĩa, thêm field bắt buộc ở request.
- Cách version: URL (`/v2/`), header, hoặc ngày phiên bản. Có **chính sách deprecation**: thông báo, header `Deprecation`/`Sunset`, theo dõi ai còn gọi bản cũ trước khi tắt.
- Với Protobuf: không tái sử dụng số field đã xoá (`reserved`).

### Idempotency key
POST tạo thanh toán: client gửi header `Idempotency-Key: <uuid>`. Server lưu `(key → trạng thái, response, hash của body)`: request trùng key trả lại response cũ; trùng key nhưng body khác → lỗi 422/409; request đang xử lý → 409 để client thử lại sau. Key có thời hạn (ví dụ 24 giờ — ước lượng tuỳ nghiệp vụ).

### Webhook
- Ký payload bằng **HMAC** với secret riêng từng khách hàng, kèm timestamp để chống replay.
- Giao **at-least-once** với retry + backoff; bên nhận phải idempotent theo `event_id`, trả 2xx nhanh rồi xử lý bất đồng bộ.
- Thứ tự không đảm bảo → gửi kèm version/thời điểm, hoặc bên nhận gọi lại API lấy trạng thái mới nhất.

### Lỗi và hợp đồng
Định dạng lỗi thống nhất (ví dụ Problem Details – RFC 9457), mã lỗi ổn định cho máy đọc, `request_id` để tra log. Mô tả API bằng OpenAPI/Protobuf và kiểm tra tương thích trong CI (contract test).

### Lỗi hay gặp
- Dùng GET cho hành động có side effect.
- Trả 200 kèm `{"error": ...}`.
- Đổi kiểu field "nhỏ thôi" và làm hỏng app mobile bản cũ không thể ép cập nhật.
'''

[[modules]]
id = "sd-observability"
title = "Observability & Vận hành"
description = "Log/metric/trace, SLI/SLO/error budget, alert tốt, incident response, postmortem không đổ lỗi."
lesson = '''
### Ba trụ cột
| Tín hiệu | Trả lời câu hỏi | Lưu ý |
|---|---|---|
| Metric | "có vấn đề không, bao nhiêu?" | rẻ, tổng hợp; cẩn thận **cardinality** của label (đừng gắn `user_id`) |
| Log | "chuyện gì đã xảy ra ở request này?" | log có cấu trúc (JSON), kèm `trace_id`; không log secret/PII |
| Trace | "thời gian đi đâu qua các service?" | **distributed tracing** truyền context (W3C `traceparent`), sampling |
OpenTelemetry là chuẩn mở phổ biến để thu cả ba.

### Phương pháp chọn metric
- **RED** cho service: Rate, Errors, Duration.
- **USE** cho tài nguyên: Utilization, Saturation, Errors.
- **Four golden signals**: latency, traffic, errors, saturation.
Latency nên đo bằng **histogram** để tính percentile; không thể lấy trung bình của các p99 từ nhiều instance.

### SLI, SLO, SLA, error budget
- **SLI**: chỉ số đo được, ví dụ "tỉ lệ request thành công trả lời dưới 300 ms".
- **SLO**: mục tiêu nội bộ cho SLI trong một cửa sổ, ví dụ 99,9% trong 30 ngày.
- **SLA**: cam kết với khách hàng, có hậu quả (bồi thường) — thường lỏng hơn SLO.
- **Error budget** = 1 − SLO. 99,9% trong 30 ngày ≈ **43 phút** "được phép lỗi"; 99,99% ≈ 4,3 phút. Còn budget → được phát hành nhanh; hết budget → ưu tiên độ ổn định.

### Alert tốt
- Alert theo **triệu chứng người dùng thấy** (SLO bị đốt), không theo nguyên nhân lặt vặt (CPU 80%).
- **Burn rate**: tốc độ tiêu error budget. Burn rate 1 = tiêu vừa hết budget đúng cuối cửa sổ. Kiểu phổ biến: cảnh báo khẩn khi burn rate cao trong cửa sổ ngắn (ví dụ ~14 trong 1 giờ), cảnh báo chậm khi burn rate thấp kéo dài.
- Mỗi alert phải **actionable** và có **runbook**. Alert vô nghĩa gây **alert fatigue**.

### Incident response
Vai trò rõ: **Incident Commander** (điều phối), người xử lý kỹ thuật, người liên lạc (status page, stakeholder). Ưu tiên **giảm thiểu tác động** (rollback, tắt feature flag, chuyển traffic) trước khi tìm root cause. Ghi timeline trong lúc xử lý.
Chỉ số: **MTTD** (phát hiện), **MTTR** (khôi phục).

### Postmortem không đổ lỗi (blameless)
Tập trung vào hệ thống và quy trình đã cho phép lỗi xảy ra, không vào cá nhân. Nội dung: tác động, timeline, nguyên nhân (thường nhiều yếu tố), điều đã làm tốt, **action item có người chịu trách nhiệm và hạn**.

### Lỗi hay gặp
- Dashboard đầy biểu đồ nhưng không ai biết SLO là gì.
- Label metric chứa id người dùng → bùng nổ chi phí lưu trữ.
- Postmortem kết luận "do người A bất cẩn" — không có cải tiến hệ thống.
'''

[[modules]]
id = "sd-security"
title = "Bảo mật trong kiến trúc"
description = "Authn/authz ở cấp kiến trúc, quản lý secrets, threat modeling, least privilege, multi-tenant isolation."
lesson = '''
### Authentication vs authorization
- **Authentication (authn)**: bạn là ai (đăng nhập, token, mTLS giữa service).
- **Authorization (authz)**: bạn được làm gì. Kiểm tra quyền phải ở **server**, trên **từng tài nguyên** (chống IDOR: `GET /invoices/123` của người khác).
Mô hình quyền: **RBAC** (theo vai trò), **ABAC** (theo thuộc tính: phòng ban, khu vực), **ReBAC** (theo quan hệ, kiểu "người được chia sẻ tài liệu").

### Kiến trúc xác thực phổ biến
- Người dùng: OIDC/OAuth 2.0 qua Identity Provider; app web dùng session cookie `HttpOnly; Secure; SameSite` hoặc access token ngắn hạn + refresh token xoay vòng.
- JWT tiện vì stateless nhưng **khó thu hồi** → TTL ngắn; luôn kiểm tra chữ ký, `exp`, `aud`, `iss`, không chấp nhận `alg: none`.
- Service-to-service: **mTLS** (thường qua service mesh) + danh tính workload, thay vì API key dùng chung.

### Secrets
Không để secret trong code, image, biến log. Dùng secret manager (Vault, cloud KMS/Secrets Manager), cấp quyền đọc tối thiểu, **xoay vòng** định kỳ và khi nghi lộ, ưu tiên credential **ngắn hạn** cấp động. Quét secret trong CI (pre-commit, repo scanning).

### Threat modeling
Làm sớm khi thiết kế: vẽ data flow, xác định **trust boundary**, liệt kê mối đe doạ theo **STRIDE**:
| Chữ | Mối đe doạ | Biện pháp ví dụ |
|---|---|---|
| S | Spoofing (giả danh) | xác thực mạnh, mTLS |
| T | Tampering (sửa dữ liệu) | chữ ký, checksum, TLS |
| R | Repudiation (chối bỏ) | audit log bất biến |
| I | Information disclosure | mã hoá, phân quyền |
| D | Denial of service | rate limit, quota |
| E | Elevation of privilege | least privilege, kiểm tra authz |

### Least privilege và defense in depth
Mỗi service/người chỉ có quyền tối thiểu cần thiết (IAM role riêng, DB user riêng chỉ có quyền cần). **Defense in depth**: nhiều lớp (WAF, authn, authz, mã hoá, network policy) để một lớp hỏng không thành thảm hoạ. **Zero trust**: không tin mạng nội bộ mặc định.

### Multi-tenant isolation
| Mô hình | Cô lập | Chi phí |
|---|---|---|
| Shared DB, cột `tenant_id` | thấp nhất (dựa vào code/RLS) | rẻ nhất |
| Schema riêng mỗi tenant | trung bình | trung bình |
| DB/cluster riêng (silo) | cao nhất | đắt, vận hành nhiều |
Với shared DB: ép `tenant_id` ở tầng truy cập dữ liệu, dùng **Row-Level Security**, test tự động chống truy cập chéo tenant; chú ý **noisy neighbor** (quota theo tenant).

### Mã hoá
Encryption **in transit** (TLS) và **at rest** (KMS, envelope encryption). Mật khẩu người dùng: hash chậm có salt (Argon2id, bcrypt), không bao giờ mã hoá hai chiều.

### Lỗi hay gặp
- Chỉ ẩn nút trên UI mà không kiểm tra quyền ở API.
- Một API key "admin" dùng chung cho mọi service.
- Log chứa token/mật khẩu.
'''

[[modules]]
id = "sd-case-studies"
title = "Case study phỏng vấn"
description = "Thiết kế URL shortener, news feed, chat, rate limiter, notification, file upload — từng bước."
lesson = '''
### Khung trả lời một bài system design (~45 phút)
1. **Làm rõ yêu cầu** (5 phút): functional (làm gì) và non-functional (latency, availability, consistency, quy mô). Hỏi số người dùng, tỉ lệ đọc/ghi.
2. **Ước lượng** (5 phút): QPS, dung lượng, băng thông — đúng bậc độ lớn.
3. **API & data model**: các endpoint chính, bảng/collection, key truy cập.
4. **High-level design**: client → LB → service → cache/DB/queue.
5. **Deep dive** 1–2 phần khó nhất (thường là phần người phỏng vấn quan tâm).
6. **Trade-off, điểm lỗi, mở rộng**: nói rõ đã đánh đổi gì.

### URL shortener (ví dụ số liệu ước lượng)
100 triệu link mới/tháng, đọc:ghi ≈ 100:1 → ghi ~40/s, đọc ~4.000/s trung bình. Mã 7 ký tự base62 → 62^7 ≈ 3,5 nghìn tỉ mã. Sinh mã: bộ đếm/ID phân tán rồi base62 (không trùng, nhưng đoán được) hoặc hash + kiểm tra trùng. Đọc nhiều → cache (key nóng), redirect **301** (trình duyệt cache, giảm tải nhưng mất analytics) vs **302** (đếm được mọi click).

### News feed
- **Fan-out on write (push)**: khi đăng, ghi id bài vào feed của từng follower → đọc nhanh, nhưng người có hàng triệu follower làm ghi bùng nổ.
- **Fan-out on read (pull)**: đọc thì gom bài từ người mình theo dõi → ghi rẻ, đọc đắt.
- **Hybrid**: push cho người thường, pull cho tài khoản nổi tiếng rồi trộn khi đọc.

### Chat
Kết nối lâu dài (WebSocket) tới gateway; một registry ghi người dùng đang nối vào gateway nào; tin nhắn lưu theo `conversation_id` (partition key) với id tăng dần trong hội thoại để giữ thứ tự; trạng thái đã nhận/đã đọc; người offline nhận qua push notification.

### Rate limiter
Đặt ở gateway; token bucket theo `(api_key, route)` lưu trên Redis với thao tác nguyên tử (script); trả 429 + `Retry-After`; khi Redis lỗi phải chọn **fail-open** (cho qua) hay **fail-closed** (chặn) tuỳ rủi ro.

### Notification
API nhận yêu cầu → queue → worker theo kênh (email, SMS, push) → nhà cung cấp bên ngoài. Cần: tôn trọng tuỳ chọn người dùng, dedupe theo idempotency key, retry + DLQ, rate limit theo nhà cung cấp, template.

### File upload
Client xin **pre-signed URL** rồi tải thẳng lên object storage (không đi qua app server), file lớn dùng **multipart upload** có thể tiếp tục; sự kiện "upload xong" kích hoạt xử lý bất đồng bộ (quét virus, tạo thumbnail); phục vụ qua CDN.

### Lỗi hay gặp khi phỏng vấn
- Nhảy ngay vào vẽ Kafka/Kubernetes khi chưa hỏi yêu cầu.
- Không nêu trade-off, chỉ liệt kê công nghệ.
- Bỏ qua điểm lỗi, dữ liệu nóng, và cách hệ thống hành xử khi dependency chết.
'''

[[modules]]
id = "system-design-lead"
title = "Góc nhìn Tech Lead"
description = "ADR, đánh giá trade-off, ước lượng & quản lý rủi ro, code review, nợ kỹ thuật, mentoring, giao tiếp với stakeholder."
lesson = '''
### Ra quyết định kiến trúc
Không có kiến trúc "tốt nhất", chỉ có kiến trúc **phù hợp ràng buộc**: quy mô thật (không phải tưởng tượng), năng lực team, thời hạn, ngân sách, rủi ro chấp nhận được. Ưu tiên phương án **dễ đảo ngược** khi chưa chắc ("two-way door"); dành phân tích kỹ cho quyết định khó đảo ngược ("one-way door": chọn DB chính, shard key, hợp đồng API công khai).

### Ma trận so sánh phương án (ví dụ)
| Tiêu chí (trọng số) | Monolith module hoá | Microservices |
|---|---|---|
| Tốc độ ra tính năng với team 6 người (3) | cao | thấp (chi phí hạ tầng, contract) |
| Scale độc lập từng phần (2) | trung bình | cao |
| Độ phức tạp vận hành (3) | thấp | cao (tracing, deploy, network) |
| Cô lập lỗi (2) | trung bình | cao nếu thiết kế đúng |
Chấm điểm giúp **lộ giả định** để thảo luận, không phải để máy móc chọn số lớn nhất.

### ADR (Architecture Decision Record)
Tài liệu ngắn, lưu cùng repo, **bất biến** (quyết định mới thì viết ADR mới "supersedes"):
```
# ADR-012: Dùng transactional outbox cho event đơn hàng
Status: Accepted (2026-03-10)
Context: dual-write DB + broker đã gây mất event 3 lần/tháng.
Decision: ghi outbox cùng transaction, relay polling 1 s.
Alternatives: CDC (Debezium) — mạnh hơn nhưng team chưa vận hành Kafka Connect.
Consequences: +1 bảng, độ trễ event ~1–2 s (ước lượng), consumer phải idempotent.
```

### Ước lượng và rủi ro
- Chia nhỏ việc, ước lượng theo khoảng (tốt/xấu/khả dĩ), nêu rõ giả định. Phần chưa biết → **spike** có timebox.
- Sổ rủi ro: xác suất × tác động, người theo dõi, biện pháp giảm thiểu. Làm phần rủi ro nhất **sớm** (de-risk).
- Rollout an toàn: feature flag, canary, dark launch, có kế hoạch rollback và tiêu chí dừng rõ ràng.

### Code review ở quy mô team
- Mục tiêu: chất lượng + chia sẻ kiến thức, không phải gác cổng cá nhân. PR nhỏ (vài trăm dòng), mô tả rõ "vì sao".
- Tự động hoá phần máy làm được (lint, format, test, security scan) để người review tập trung vào thiết kế, tính đúng, khả năng vận hành.
- Checklist: xử lý lỗi & timeout, idempotency, migration tương thích ngược, log/metric, bảo mật (authz, input), test cho case biên.

### Nợ kỹ thuật
Nợ có chủ đích (đi nhanh có ghi lại) khác nợ do cẩu thả. Quản lý: liệt kê trong backlog kèm **chi phí lãi** (sự cố, thời gian chậm lại), dành ngân sách cố định (ví dụ 15–20% mỗi sprint — tham khảo), gắn trả nợ với tính năng chạm vào vùng đó. Viết lại toàn bộ ("big rewrite") hiếm khi là lựa chọn tốt; ưu tiên **strangler fig** thay dần.

### Mentoring và giao tiếp
- Giao việc vừa sức cao hơn một chút, pairing, để người khác dẫn thiết kế có review.
- Với stakeholder: nói bằng **tác động kinh doanh** (rủi ro mất đơn, thời gian ra mắt, chi phí), đưa 2–3 phương án kèm đánh đổi thay vì một câu "không làm được".

### Anti-pattern ở quy mô team
- Resume-driven development (chọn công nghệ để học chứ không để giải quyết vấn đề).
- Một người duy nhất hiểu hệ thống (bus factor = 1).
- Quyết định trong tin nhắn riêng, không ai biết vì sao 6 tháng sau.
'''

