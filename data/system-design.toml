[[questions]]
id = "sd-c06"
module = "sd-caching"
type = "code"
lang = "javascript"
difficulty = 3
tags = ["level:senior", "stampede", "single-flight"]
title = "Single-flight chống cache stampede"
prompt = '''
Cài `class SingleFlightCache`:
- `constructor()` — cache trong bộ nhớ (không cần TTL)
- `async get(key, loader)`:
  - nếu key đã có giá trị trong cache → trả giá trị đó, **không** gọi `loader`
  - nếu đang có một lần nạp key đó chưa xong → dùng chung promise đó (**không** gọi `loader` lần nữa)
  - ngược lại gọi `loader()` (trả Promise) đúng một lần; thành công thì lưu cache; **thất bại thì không lưu** và lần gọi sau được nạp lại; mọi người đang chờ nhận cùng lỗi
- `inflight()`: số key đang được nạp
'''
starter = '''
class SingleFlightCache {
  constructor() { this.cache = new Map(); }
  async get(key, loader) {
    const v = await loader();
    this.cache.set(key, v);
    return v;
  }
  inflight() { return 0; }
}
'''
solution = '''
class SingleFlightCache {
  constructor() { this.cache = new Map(); this.pending = new Map(); }
  get(key, loader) {
    if (this.cache.has(key)) return Promise.resolve(this.cache.get(key));
    if (this.pending.has(key)) return this.pending.get(key);
    const p = Promise.resolve()
      .then(() => loader())
      .then(
        (v) => { this.cache.set(key, v); this.pending.delete(key); return v; },
        (e) => { this.pending.delete(key); throw e; }
      );
    this.pending.set(key, p);
    return p;
  }
  inflight() { return this.pending.size; }
}
'''
tests = '''
test('nhiều lời gọi đồng thời chỉ nạp một lần', async () => {
  const c = new SingleFlightCache();
  const loader = jest.fn(() => Promise.resolve(42));
  const ps = [c.get('k', loader), c.get('k', loader), c.get('k', loader)];
  expect(c.inflight()).toBe(1);
  const vals = await Promise.all(ps);
  expect(vals).toEqual([42, 42, 42]);
  expect(loader).toHaveBeenCalledTimes(1);
  expect(c.inflight()).toBe(0);
});
test('đã có trong cache thì không gọi loader', async () => {
  const c = new SingleFlightCache();
  await c.get('k', () => Promise.resolve('v'));
  const loader = jest.fn(() => Promise.resolve('other'));
  const v = await c.get('k', loader);
  expect(v).toBe('v');
  expect(loader).toHaveBeenCalledTimes(0);
});
test('lỗi không được cache, lần sau nạp lại', async () => {
  const c = new SingleFlightCache();
  let failed = 0;
  const bad = () => Promise.reject(new Error('db down'));
  const p1 = c.get('k', bad);
  const p2 = c.get('k', bad);
  try { await p1; } catch (e) { failed++; expect(e.message).toBe('db down'); }
  try { await p2; } catch (e) { failed++; }
  expect(failed).toBe(2);
  expect(c.inflight()).toBe(0);
  const v = await c.get('k', () => Promise.resolve('ok'));
  expect(v).toBe('ok');
});
test('các key khác nhau nạp độc lập', async () => {
  const c = new SingleFlightCache();
  const loader = jest.fn((x) => Promise.resolve(x));
  const a = c.get('a', () => loader('A'));
  const b = c.get('b', () => loader('B'));
  expect(c.inflight()).toBe(2);
  expect(await a).toBe('A');
  expect(await b).toBe('B');
  expect(loader).toHaveBeenCalledTimes(2);
});
'''
hints = ["Lưu promise đang chạy vào một `Map` riêng (`pending`) **trước** khi await.", "Xoá khỏi `pending` cả khi thành công lẫn thất bại; chỉ ghi `cache` khi thành công."]
explanation = "Đây là ý tưởng của `singleflight` trong Go và request coalescing ở CDN. Lưu ý đừng cache lỗi (hoặc chỉ cache lỗi rất ngắn), nếu không một sự cố thoáng qua sẽ bị \"đóng băng\" trong cache."

