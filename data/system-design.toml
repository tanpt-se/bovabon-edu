[[questions]]
id = "sd-016"
module = "sd-fundamentals"
type = "essay"
difficulty = 3
tags = ["level:senior", "estimation", "interview"]
prompt = "Phỏng vấn: \"Hãy ước lượng dung lượng lưu trữ và băng thông cho một dịch vụ chia sẻ ảnh có 10 triệu người dùng hoạt động mỗi ngày.\" Trình bày cách bạn tiếp cận (giả định, công thức, kết luận ảnh hưởng tới kiến trúc)."
keywords = [
  ["giả định", "assumption", "giả sử"],
  ["86400", "86.400", "10^5", "giây mỗi ngày"],
  ["peak", "đỉnh", "cao điểm"],
  ["replica", "bản sao", "replication", "x3", "×3"],
  ["băng thông", "bandwidth", "egress"],
  ["cdn", "object storage", "s3"],
]
min_keywords = 4
model_answer = '''
1. **Nêu giả định** rõ ràng: 10 triệu DAU, 10% đăng ảnh mỗi ngày → 1 triệu ảnh/ngày; ảnh sau nén ~500 KB, thêm 2 thumbnail ~50 KB; mỗi người xem ~50 ảnh/ngày (số liệu ước lượng).
2. **Lưu trữ**: 1 triệu × ~600 KB ≈ 600 GB/ngày ≈ 220 TB/năm; nhân **replica ×3** (hoặc erasure coding ~1,5×) → hàng trăm TB/năm → phải dùng **object storage** (S3-like), không để trong DB; DB chỉ giữ metadata (~1 KB/ảnh).
3. **QPS**: upload 1 triệu/86400 ≈ 12/s trung bình, **peak** ×3–5 ≈ 50/s; xem 500 triệu lượt/ngày ≈ 6.000/s, peak ~20.000/s.
4. **Băng thông** đọc: 6.000/s × ~100 KB (đa số xem thumbnail/bản vừa) ≈ 600 MB/s ≈ ~5 Gbps trung bình → bắt buộc **CDN** để giảm egress từ origin.
5. **Kết luận kiến trúc**: đọc ≫ ghi → tối ưu đường đọc (CDN, cache metadata); upload trực tiếp lên object storage bằng pre-signed URL; xử lý thumbnail bất đồng bộ qua queue.
'''
explanation = "Điểm chính: nêu giả định, tính đúng bậc độ lớn, tính cả bản sao và peak, và **rút ra hệ quả kiến trúc** (object storage + CDN, đọc ≫ ghi). Con số tuyệt đối không quan trọng bằng lập luận."

