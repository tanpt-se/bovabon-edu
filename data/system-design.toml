[[questions]]
id = "sd-c03"
module = "sd-scaling-data"
type = "code"
lang = "javascript"
difficulty = 3
tags = ["level:senior", "consistent-hashing"]
title = "Consistent hashing ring với virtual node"
prompt = '''
Cài `class HashRing` với `constructor(vnodes = 100)`:
- `addNode(name)`: thêm node, tạo `vnodes` điểm trên vòng, điểm thứ `i` có vị trí `hash32(name + '#' + i)` (hàm `hash32` có sẵn trong starter, trả số nguyên 32-bit không dấu)
- `removeNode(name)`: bỏ mọi điểm của node đó
- `getNode(key)`: tính `h = hash32(key)`, trả tên node của **điểm đầu tiên có vị trí ≥ h** theo chiều tăng; nếu không có thì quay vòng về điểm nhỏ nhất. Vòng rỗng → `null`
- Thêm/bớt node chỉ được làm dời các key liên quan tới node đó (đặc tính của consistent hashing)

Gợi ý hiệu năng: giữ mảng điểm đã sắp xếp và tìm kiếm nhị phân.
'''
starter = '''
function hash32(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b) >>> 0;
  h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35) >>> 0;
  h ^= h >>> 16;
  return h >>> 0;
}

class HashRing {
  constructor(vnodes = 100) { this.vnodes = vnodes; this.nodes = []; }
  addNode(name) { this.nodes.push(name); }
  removeNode(name) { this.nodes = this.nodes.filter((n) => n !== name); }
  getNode(key) {
    if (this.nodes.length === 0) return null;
    return this.nodes[hash32(key) % this.nodes.length];
  }
}
'''
solution = '''
function hash32(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b) >>> 0;
  h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35) >>> 0;
  h ^= h >>> 16;
  return h >>> 0;
}

class HashRing {
  constructor(vnodes = 100) { this.vnodes = vnodes; this.points = []; }
  addNode(name) {
    for (let i = 0; i < this.vnodes; i++) this.points.push({ pos: hash32(name + '#' + i), node: name });
    this.points.sort((a, b) => a.pos - b.pos);
  }
  removeNode(name) { this.points = this.points.filter((p) => p.node !== name); }
  getNode(key) {
    const pts = this.points;
    if (pts.length === 0) return null;
    const h = hash32(key);
    let lo = 0, hi = pts.length;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (pts[mid].pos >= h) hi = mid; else lo = mid + 1;
    }
    return pts[lo === pts.length ? 0 : lo].node;
  }
}
'''
tests = '''
const keys = Array.from({ length: 2000 }, (_, i) => 'user:' + i);
function owners(ring) { return keys.map((k) => ring.getNode(k)); }

test('vòng rỗng trả null, một node nhận mọi key', () => {
  const r = new HashRing(10);
  expect(r.getNode('x')).toBeNull();
  r.addNode('a');
  expect(r.getNode('x')).toBe('a');
  expect(r.getNode('y')).toBe('a');
});
test('thêm node chỉ dời khoảng 1/N key và chỉ sang node mới', () => {
  const r = new HashRing(100);
  ['a', 'b', 'c'].forEach((n) => r.addNode(n));
  const before = owners(r);
  r.addNode('d');
  const after = owners(r);
  let moved = 0;
  for (let i = 0; i < keys.length; i++) {
    if (before[i] !== after[i]) { moved++; expect(after[i]).toBe('d'); }
  }
  expect(moved).toBeGreaterThan(200);
  expect(moved).toBeLessThan(800);
});
test('bỏ node không làm dời key của node khác', () => {
  const r = new HashRing(100);
  ['a', 'b', 'c', 'd'].forEach((n) => r.addNode(n));
  const before = owners(r);
  r.removeNode('b');
  const after = owners(r);
  for (let i = 0; i < keys.length; i++) {
    if (before[i] !== 'b') expect(after[i]).toBe(before[i]);
    else expect(after[i]).not.toBe('b');
  }
});
test('virtual node giúp phân bố tương đối đều', () => {
  const r = new HashRing(100);
  ['a', 'b', 'c', 'd'].forEach((n) => r.addNode(n));
  const count = {};
  owners(r).forEach((o) => { count[o] = (count[o] || 0) + 1; });
  ['a', 'b', 'c', 'd'].forEach((n) => {
    expect(count[n]).toBeGreaterThan(250);
    expect(count[n]).toBeLessThan(750);
  });
});
'''
hints = ["Lưu các điểm `{ pos, node }` rồi sort theo `pos`.", "Tìm vị trí đầu tiên `pos >= h` bằng binary search; nếu vượt cuối mảng thì lấy phần tử 0."]
explanation = "Consistent hashing đặt node và key trên cùng một vòng băm; thêm node chỉ \"cướp\" các đoạn vòng liền trước điểm của nó, nên chỉ ~1/N key dời. Virtual node chia mỗi node thành nhiều điểm để cân bằng tải và để khi một node rời đi, phần của nó rải đều cho các node còn lại."

