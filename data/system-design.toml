]
answer = [1]
explanation = "Cache-aside (lazy loading): ứng dụng tự quản lý — đọc cache, miss thì đọc nguồn rồi đặt vào cache. Lần đọc sau sẽ hit. \"Cache tự nạp\" là read-through."

