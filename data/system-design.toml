'''
solution = '''
import json
import sqlite3

def setup(conn):
    conn.execute("CREATE TABLE IF NOT EXISTS orders (id TEXT PRIMARY KEY, total INTEGER)")
    conn.execute("CREATE TABLE IF NOT EXISTS outbox (seq INTEGER PRIMARY KEY AUTOINCREMENT, topic TEXT, payload TEXT, sent INTEGER DEFAULT 0)")
    conn.commit()

def create_order(conn, order_id, total):
    with conn:
        conn.execute("INSERT INTO outbox(topic, payload) VALUES (?, ?)",
                     ("order.created", json.dumps({"id": order_id, "total": total})))
        conn.execute("INSERT INTO orders(id, total) VALUES (?, ?)", (order_id, total))

def relay(conn, publish, batch_size=100):
    rows = conn.execute(
        "SELECT seq, topic, payload FROM outbox WHERE sent = 0 ORDER BY seq LIMIT ?", (batch_size,)
    ).fetchall()
    count = 0
    for seq, topic, payload in rows:
        try:
            publish(topic, json.loads(payload))
        except Exception:
            break
        with conn:
            conn.execute("UPDATE outbox SET sent = 1 WHERE seq = ?", (seq,))
        count += 1
    return count
'''
tests = '''
import sqlite3

def fresh():
    conn = sqlite3.connect(":memory:")
    setup(conn)
    return conn

@test("publish theo thứ tự và không gửi lại")
def _():
    conn = fresh()
    for i, t in enumerate([10, 20, 30]):
        create_order(conn, f"o{i}", t)
    got = []
    expect(relay(conn, lambda topic, p: got.append((topic, p["id"], p["total"])))).to_equal(3)
    expect(got).to_equal([("order.created", "o0", 10), ("order.created", "o1", 20), ("order.created", "o2", 30)])
    expect(relay(conn, lambda topic, p: got.append(p))).to_equal(0)

@test("broker lỗi thì dừng và lần sau tiếp tục đúng chỗ")
def _():
    conn = fresh()
    for i in range(3):
        create_order(conn, f"o{i}", i)
    got = []
    def flaky(topic, p):
        if p["id"] == "o1":
            raise ConnectionError("broker down")
        got.append(p["id"])
    expect(relay(conn, flaky)).to_equal(1)
    expect(got).to_equal(["o0"])
    expect(relay(conn, lambda t, p: got.append(p["id"]))).to_equal(2)
    expect(got).to_equal(["o0", "o1", "o2"])

@test("tạo đơn lỗi thì không có event mồ côi")
def _():
    conn = fresh()
    create_order(conn, "o1", 5)
    expect(lambda: create_order(conn, "o1", 99)).to_raise(sqlite3.IntegrityError)
    expect(conn.execute("SELECT COUNT(*) FROM outbox").fetchone()[0]).to_equal(1)
    expect(conn.execute("SELECT COUNT(*) FROM orders").fetchone()[0]).to_equal(1)

@test("tôn trọng batch_size")
def _():
    conn = fresh()
    for i in range(5):
        create_order(conn, f"o{i}", i)
    got = []
    expect(relay(conn, lambda t, p: got.append(p["id"]), batch_size=2)).to_equal(2)
    expect(relay(conn, lambda t, p: got.append(p["id"]), batch_size=2)).to_equal(2)
    expect(got).to_equal(["o0", "o1", "o2", "o3"])
'''
hints = ["`with conn:` gói nhiều lệnh thành một transaction và rollback khi có exception.", "Trong relay, bắt exception của `publish` rồi `break` để giữ thứ tự."]
explanation = "Relay có thể crash **sau** khi publish nhưng **trước** khi đánh dấu `sent` → event bị gửi lại; vì thế outbox luôn đi kèm consumer idempotent. Ở quy mô lớn, thay polling bằng CDC (đọc WAL/binlog)."

