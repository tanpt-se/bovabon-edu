[[questions]]
id = "sd-c05"
module = "sd-caching"
type = "code"
lang = "javascript"
difficulty = 1
tags = ["level:junior", "caching", "ttl"]
title = "Cache có TTL"
prompt = '''
Cài `class TtlCache` với `constructor(ttlMs)`:
- `set(key, value)`: lưu value, hết hạn sau `ttlMs` mili-giây tính từ lúc `set` (dùng `Date.now()`)
- `get(key)`: trả value nếu còn hạn; nếu không có hoặc đã hết hạn (`Date.now() >= thời điểm hết hạn`) → trả `undefined` và xoá mục đó
- `size()`: số mục **còn hạn** hiện tại
- `set` lại cùng key thì ghi đè value và tính lại thời hạn
'''
starter = '''
class TtlCache {
  constructor(ttlMs) { this.ttlMs = ttlMs; this.map = new Map(); }
  set(key, value) { this.map.set(key, value); }
  get(key) { return this.map.get(key); }
  size() { return this.map.size; }
}
'''
solution = '''
class TtlCache {
  constructor(ttlMs) { this.ttlMs = ttlMs; this.map = new Map(); }
  set(key, value) { this.map.set(key, { value, expiresAt: Date.now() + this.ttlMs }); }
  get(key) {
    const e = this.map.get(key);
    if (!e) return undefined;
    if (Date.now() >= e.expiresAt) { this.map.delete(key); return undefined; }
    return e.value;
  }
  size() {
    const now = Date.now();
    for (const [k, e] of this.map) if (now >= e.expiresAt) this.map.delete(k);
    return this.map.size;
  }
}
'''
tests = '''
test('đọc trong hạn', () => {
  const c = new TtlCache(1000);
  c.set('a', 1);
  jest.advanceTimersByTime(999);
  expect(c.get('a')).toBe(1);
});
test('hết hạn đúng thời điểm', () => {
  const c = new TtlCache(1000);
  c.set('a', 1);
  jest.advanceTimersByTime(1000);
  expect(c.get('a')).toBeUndefined();
});
test('set lại thì gia hạn', () => {
  const c = new TtlCache(1000);
  c.set('a', 1);
  jest.advanceTimersByTime(800);
  c.set('a', 2);
  jest.advanceTimersByTime(800);
  expect(c.get('a')).toBe(2);
});
test('size chỉ đếm mục còn hạn', () => {
  const c = new TtlCache(500);
  c.set('a', 1);
  jest.advanceTimersByTime(300);
  c.set('b', 2);
  expect(c.size()).toBe(2);
  jest.advanceTimersByTime(300);
  expect(c.size()).toBe(1);
  expect(c.get('missing')).toBeUndefined();
});
'''
hints = ["Lưu `{ value, expiresAt }` thay vì chỉ value.", "So sánh `Date.now() >= expiresAt` khi đọc."]
explanation = "Đây là cơ chế lazy expiration (kiểm tra khi đọc). Redis kết hợp lazy expiration với quét ngẫu nhiên định kỳ để dọn key hết hạn không ai đọc."

