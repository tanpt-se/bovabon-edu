  "Ghi lại một quyết định kiến trúc: bối cảnh, quyết định, các phương án đã cân nhắc và hệ quả",
  "Danh sách task của sprint",
  "Tài liệu hướng dẫn cài đặt môi trường dev",
  "Báo cáo sự cố production",
]
answer = [0]
explanation = "ADR ngắn, lưu cùng repo, giúp người đến sau hiểu **vì sao** hệ thống như hiện tại. Quyết định thay đổi thì viết ADR mới thay thế (supersedes), không sửa ADR cũ."

[[questions]]
id = "sd-105"
module = "system-design-lead"
type = "single"
difficulty = 2
tags = ["level:middle", "code-review"]
prompt = "PR 2.400 dòng gộp refactor, tính năng mới và đổi format code. Cách góp ý hữu ích nhất của reviewer là gì?"
options = [
  "Approve vì quá dài để đọc",
  "Đề nghị tách thành các PR nhỏ (format riêng, refactor riêng, tính năng riêng) để review được thiết kế và tính đúng",
  "Để lại 200 comment về đặt tên biến",
  "Tự viết lại PR theo cách của mình",
]
answer = [1]
explanation = "PR lớn trộn nhiều loại thay đổi làm review hời hợt và rollback khó. PR nhỏ, một mục đích, cho phép người review tập trung vào thiết kế; format nên để công cụ tự động xử lý."

[[questions]]
id = "sd-106"
module = "system-design-lead"
type = "single"
difficulty = 3
tags = ["level:senior", "tech-debt"]
prompt = "Module tính giá 8 năm tuổi, không có test, mỗi lần sửa gây trung bình 1 sự cố/tháng. Cách tiếp cận nào hợp lý nhất?"
options = [
  "Viết lại toàn bộ trong 6 tháng, đóng băng tính năng",
  "Không động vào nữa",
  "Viết characterization test cho hành vi hiện tại ở các đường quan trọng, rồi tách và thay dần từng phần (strangler) khi có tính năng chạm vào, đo số sự cố để chứng minh hiệu quả",
  "Thêm comment cảnh báo ở đầu file",
]
answer = [2]
explanation = "Big rewrite rủi ro cao (mất hành vi ẩn, kéo dài). Characterization test \"đóng băng\" hành vi hiện có để sửa an toàn; thay dần gắn với công việc thật giúp trả nợ mà vẫn ra tính năng. Số sự cố/tháng là \"lãi\" của nợ — dùng để thuyết phục stakeholder."

[[questions]]
id = "sd-107"
module = "system-design-lead"
type = "single"
difficulty = 3
tags = ["level:lead", "decision", "reversibility"]
prompt = "Quyết định nào là **one-way door** (khó đảo ngược), đáng dành nhiều thời gian phân tích nhất?"
options = [
  "Chọn thư viện log cho một service nội bộ",
  "Chọn shard key cho bảng đơn hàng hàng tỉ dòng và định dạng id công khai trong API của đối tác",
  "Đổi màu nút trên trang quản trị",
  "Thử một cấu hình cache TTL mới sau feature flag",
]
answer = [1]
explanation = "Shard key và hợp đồng API công khai rất tốn kém để đổi (migrate dữ liệu khổng lồ, đối tác phải sửa). Các quyết định còn lại dễ đảo ngược — nên quyết nhanh, thử và đo, thay vì họp kéo dài."

[[questions]]
id = "sd-108"
module = "system-design-lead"
type = "multiple"
difficulty = 3
tags = ["level:lead", "risk", "rollout"]
prompt = "Bạn dẫn dắt việc chuyển DB thanh toán từ MySQL sang PostgreSQL. Những việc nào **giảm rủi ro** đáng kể?"
options = [
  "Làm phần rủi ro nhất sớm: spike có timebox để kiểm tra khác biệt kiểu dữ liệu/collation và hiệu năng truy vấn chính",
  "Dual-write hoặc CDC sang DB mới, chạy so sánh dữ liệu (shadow read) trước khi chuyển đọc",
  "Chuyển 100% traffic trong một đêm, không có đường quay lại để team tập trung",
  "Chuyển dần theo tỉ lệ traffic/tenant với tiêu chí dừng và kế hoạch rollback đã diễn tập",
  "Giữ kế hoạch trong đầu lead để tránh tranh luận",
]
answer = [0, 1, 3]
explanation = "De-risk sớm, kiểm chứng bằng dữ liệu thật, rollout từng bước có tiêu chí dừng và rollback đã tập. Big-bang không đường lui và kế hoạch không chia sẻ (bus factor = 1) làm rủi ro tăng vọt."

[[questions]]
id = "sd-109"
module = "system-design-lead"
type = "single"
difficulty = 3
tags = ["level:lead", "stakeholder", "communication"]
prompt = '''
Product yêu cầu tính năng "xuất báo cáo realtime toàn bộ dữ liệu" trong 2 tuần. Team ước lượng cần 2 tháng nếu làm đúng (tránh làm sập DB chính). Bạn phản hồi thế nào?
'''
options = [
  "\"Không làm được.\"",
  "Nhận lời 2 tuần và cho team làm thêm giờ",
  "Hỏi rõ nhu cầu thật (ai dùng, độ trễ chấp nhận được), rồi đưa 2–3 phương án kèm đánh đổi: ví dụ báo cáo trễ 15 phút từ read replica trong 2 tuần; realtime đầy đủ qua pipeline riêng trong 2 tháng",
  "Tự làm một mình cuối tuần",
]
answer = [2]
explanation = "Lead chuyển xung đột thành lựa chọn có thông tin: làm rõ mục tiêu kinh doanh, nói bằng tác động (rủi ro sập DB, thời gian), đưa phương án thay vì từ chối hay hứa suông. Thường \"realtime\" thực ra là \"đủ mới\"."

[[questions]]
id = "sd-110"
module = "system-design-lead"
type = "single"
difficulty = 3
tags = ["level:lead", "mentoring", "bus-factor"]
prompt = "Chỉ một senior hiểu hệ thống billing; người đó sắp nghỉ phép 1 tháng. Hành động nào giảm rủi ro bền vững nhất?"
options = [
  "Huỷ phép của người đó",
  "Cấm deploy billing trong tháng đó và hy vọng không có sự cố",
  "Lên kế hoạch chuyển giao: pairing cho 2 người khác xử lý vài việc thật, viết runbook cho các sự cố hay gặp, cho họ trực on-call có senior dự phòng trước khi nghỉ",
  "Yêu cầu người đó viết tài liệu 100 trang trong một tuần",
]
answer = [2]
explanation = "Bus factor = 1 là rủi ro tổ chức. Kiến thức chuyển giao tốt nhất qua **làm việc thật** (pairing, on-call có hỗ trợ) kèm runbook ngắn có thể hành động. Tài liệu dài viết vội ít người đọc; đóng băng chỉ hoãn vấn đề."

[[questions]]
id = "sd-111"
module = "system-design-lead"
type = "essay"
difficulty = 3
tags = ["level:lead", "adr", "decision"]
prompt = "Team tranh luận giữa giữ PostgreSQL (đang dùng) hay chuyển sang một NoSQL document DB cho dịch vụ catalog sản phẩm mới. Viết dàn ý một ADR và mô tả cách bạn dẫn dắt team ra quyết định."
keywords = [
  ["context", "bối cảnh", "vấn đề"],
  ["phương án", "alternative", "lựa chọn"],
  ["tiêu chí", "trọng số", "criteria"],
  ["trade-off", "đánh đổi", "hệ quả", "consequence"],
  ["spike", "prototype", "đo", "benchmark"],
  ["vận hành", "năng lực team", "kinh nghiệm"],
]
min_keywords = 4
model_answer = '''
**Dàn ý ADR**
- Tiêu đề, trạng thái (Proposed/Accepted), ngày.
- **Context**: yêu cầu catalog (thuộc tính sản phẩm thay đổi theo ngành hàng, đọc ≫ ghi, cần tìm kiếm/lọc), quy mô ước lượng, ràng buộc team.
- **Phương án**: (1) PostgreSQL + JSONB cho thuộc tính động, (2) document DB, (3) Postgres + search engine riêng cho lọc/tìm kiếm.
- **Tiêu chí có trọng số**: phù hợp mô hình dữ liệu, hiệu năng truy vấn chính, **vận hành** (backup, giám sát, kinh nghiệm team), chi phí, khả năng đảo ngược.
- **Quyết định** và **hệ quả / trade-off**: điều chấp nhận đánh đổi, rủi ro, việc phải làm thêm.

**Dẫn dắt**
1. Thống nhất vấn đề và tiêu chí **trước** khi bàn công nghệ, để tranh luận về giả định chứ không về sở thích.
2. Với giả định chưa chắc (JSONB có đủ nhanh?), làm **spike/benchmark** có timebox bằng dữ liệu giống thật.
3. Mời người phản biện viết phần "alternatives"; ghi rõ lý do bác bỏ.
4. Ra quyết định đúng hạn (disagree and commit), lưu ADR trong repo, đặt mốc xem lại khi điều kiện thay đổi.
'''
explanation = "Lead tách vấn đề khỏi công nghệ, dùng tiêu chí và dữ liệu để quyết định, cân nhắc chi phí vận hành với năng lực team, và ghi lại để tổ chức không mất trí nhớ."

[[questions]]
id = "sd-c12"
module = "system-design-lead"
type = "code"
lang = "python"
difficulty = 3
tags = ["level:lead", "rollout", "canary"]
title = "Cổng quyết định canary"
prompt = '''
Team bạn thống nhất tự động hoá quyết định canary. Viết `decide(baseline, canary, policy)` trả về tuple `(decision, reason)`.
`baseline`/`canary`: dict `{"requests": int, "errors": int, "p99_ms": float}`.
`policy`: dict `{"min_requests": int, "max_error_rate": float, "max_error_delta": float, "max_p99_ms": float, "max_p99_ratio": float}`.

Error rate = `errors / requests` (requests = 0 → 0). Xét **theo đúng thứ tự**:
1. Canary error rate > `max_error_rate` **và** canary có ít nhất 10 lỗi → `("rollback", "error_rate")` (lỗi rõ ràng thì dừng ngay, không chờ đủ traffic)
2. `canary["requests"] < policy["min_requests"]` → `("wait", "insufficient_traffic")`
3. Canary error rate > `max_error_rate` → `("rollback", "error_rate")`
4. Canary error rate − baseline error rate > `max_error_delta` → `("rollback", "regression_vs_baseline")`
5. Canary p99 > `max_p99_ms` **hoặc** canary p99 > baseline p99 × `max_p99_ratio` → `("rollback", "latency")`
6. Còn lại → `("promote", "ok")`
'''
starter = '''
def decide(baseline, canary, policy):
    return ("promote", "ok")
'''
solution = '''
def rate(m):
    return m["errors"] / m["requests"] if m["requests"] else 0.0

def decide(baseline, canary, policy):
    cr, br = rate(canary), rate(baseline)
    if cr > policy["max_error_rate"] and canary["errors"] >= 10:
        return ("rollback", "error_rate")
    if canary["requests"] < policy["min_requests"]:
        return ("wait", "insufficient_traffic")
    if cr > policy["max_error_rate"]:
        return ("rollback", "error_rate")
    if cr - br > policy["max_error_delta"]:
        return ("rollback", "regression_vs_baseline")
    if canary["p99_ms"] > policy["max_p99_ms"] or canary["p99_ms"] > baseline["p99_ms"] * policy["max_p99_ratio"]:
        return ("rollback", "latency")
    return ("promote", "ok")
'''
tests = '''
P = {"min_requests": 1000, "max_error_rate": 0.02, "max_error_delta": 0.005, "max_p99_ms": 800, "max_p99_ratio": 1.3}
BASE = {"requests": 20000, "errors": 40, "p99_ms": 400}

def m(req, err, p99):
    return {"requests": req, "errors": err, "p99_ms": p99}

@test("chưa đủ traffic thì chờ")
def _():
    expect(decide(BASE, m(300, 1, 390), P)).to_equal(("wait", "insufficient_traffic"))
    expect(decide(BASE, m(0, 0, 0), P)).to_equal(("wait", "insufficient_traffic"))

@test("lỗi rõ ràng thì rollback dù ít traffic")
def _():
    expect(decide(BASE, m(200, 30, 390), P)).to_equal(("rollback", "error_rate"))
    expect(decide(BASE, m(200, 5, 390), P)).to_equal(("wait", "insufficient_traffic"))

@test("vượt ngưỡng lỗi tuyệt đối hoặc so với baseline")
def _():
    expect(decide(BASE, m(2000, 9, 390) | {"requests": 400}, P)).to_equal(("wait", "insufficient_traffic"))
    expect(decide(BASE, m(2000, 50, 390), P)).to_equal(("rollback", "error_rate"))
    expect(decide(BASE, m(2000, 16, 390), P)).to_equal(("rollback", "regression_vs_baseline"))

@test("latency tuyệt đối và tương đối")
def _():
    expect(decide(BASE, m(2000, 4, 900), P)).to_equal(("rollback", "latency"))
    expect(decide(BASE, m(2000, 4, 530), P)).to_equal(("rollback", "latency"))
    expect(decide(BASE, m(2000, 4, 510), P)).to_equal(("promote", "ok"))

@test("baseline không có request")
def _():
    expect(decide(m(0, 0, 400), m(2000, 2, 400), P)).to_equal(("promote", "ok"))
'''
hints = ["Viết hàm phụ `rate(m)` xử lý `requests == 0`.", "Thứ tự kiểm tra là một phần của chính sách — bước 1 là \"cầu dao khẩn\" trước khi chờ đủ mẫu."]
explanation = "Cổng canary biến chính sách rollout của team thành code có thể review và test: chờ đủ mẫu để không quyết định theo nhiễu, nhưng vẫn dừng ngay khi lỗi rõ ràng; so sánh với baseline cùng thời điểm để loại ảnh hưởng của traffic chung. Ở lớp Lead, phần khó là thống nhất các ngưỡng này với product và on-call."

