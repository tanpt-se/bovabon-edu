type = "single"
difficulty = 3
tags = ["level:senior", "retry", "retry-storm"]
prompt = '''
Chuỗi gọi: Mobile → API Gateway → Order Service → Inventory Service. Mỗi tầng retry tối đa 3 lần (tổng 4 lần gọi) khi tầng dưới lỗi. Inventory chết hẳn. Một request của người dùng có thể sinh tối đa bao nhiêu lời gọi vào Inventory, và nên sửa thế nào?
'''
options = [
  "4 lời gọi; không cần sửa",
  "12 lời gọi; tăng số lần retry ở tầng cuối",
  "64 lời gọi (4×4×4); chỉ retry ở một tầng (gần lỗi nhất), các tầng khác fail fast, thêm retry budget và circuit breaker",
