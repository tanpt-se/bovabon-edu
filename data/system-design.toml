[[questions]]
id = "sd-041"
module = "sd-caching"
type = "essay"
difficulty = 3
tags = ["level:senior", "caching", "interview"]
prompt = "Phỏng vấn: trang chi tiết sản phẩm của một sàn TMĐT đọc 20.000 RPS, giá và tồn kho thay đổi thường xuyên. Bạn thiết kế caching thế nào (tầng nào cache gì, invalidation, các rủi ro)?"
keywords = [
  ["cdn", "edge"],
  ["redis", "cache-aside", "cache phân tán"],
  ["ttl"],
  ["invalidat", "xoá cache", "purge", "event"],
  ["tồn kho", "inventory", "stock", "giá"],
  ["stampede", "single-flight", "coalesc", "thundering"],
  ["hot key", "key nóng", "local cache", "in-process"],
]
min_keywords = 4
model_answer = '''
- **Tách dữ liệu theo tốc độ thay đổi**: mô tả, ảnh, thông số (ít đổi) khác với **giá và tồn kho** (đổi liên tục).
- **CDN/edge**: ảnh và asset tĩnh cache lâu (tên file có hash); phần HTML/JSON khung sản phẩm cache ngắn với `stale-while-revalidate`.
- **Redis (cache-aside)** cho dữ liệu sản phẩm, **TTL** vài phút + jitter; khi sản phẩm được sửa thì phát **event** để xoá key (invalidation) và purge CDN nếu cần.
- **Giá/tồn kho**: cache TTL rất ngắn (vài giây) hoặc lấy riêng qua API nhẹ; hiển thị "còn hàng" có thể xấp xỉ, nhưng **khi đặt hàng luôn kiểm tra lại ở DB** bằng thao tác nguyên tử (không tin cache).
- **Rủi ro**: stampede khi key sản phẩm nóng hết hạn → single-flight/lock + phục vụ bản cũ; **hot key** trong flash sale → thêm local cache in-process vài giây; cache penetration với id rác → negative caching; cache chết → DB phải chịu được hoặc có rate limit/fallback.
- Đo hit ratio, latency, số lần nạp lại theo key để tinh chỉnh.
'''
explanation = "Ý quan trọng: không cache mọi thứ cùng một kiểu; dữ liệu ảnh hưởng tiền/tồn kho chỉ được cache để **hiển thị**, quyết định cuối luôn ở nguồn sự thật."

