- **Choreography**: mỗi service phản ứng theo event (`OrderCreated` → Inventory giữ hàng → `StockReserved` → Payment trừ tiền…). Ưu: ít coupling vào một trung tâm, dễ thêm consumer mới; nhược: luồng bị rải khắp nơi, khó biết một đơn đang ở đâu, dễ sinh vòng lặp event.
- Cả hai đều cần **compensating action** (hoàn tiền, nhả kho), message/command **idempotent**, timeout và lưu trạng thái saga.
- Chọn: luồng nghiệp vụ quan trọng, nhiều bước, cần kiểm soát và báo cáo (đặt hàng, thanh toán) → orchestration; phản ứng đơn giản 1–2 bước, nhiều bên quan tâm (gửi thông báo, cập nhật analytics) → choreography. Có thể kết hợp.
'''
explanation = "Câu trả lời tốt nêu được trade-off về coupling và khả năng quan sát, đồng thời nhắc compensation và idempotency vì đó là điều kiện để mọi saga chạy đúng."

