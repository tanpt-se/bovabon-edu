explanation = "Hash theo tenant không chia nhỏ được **một** tenant — tăng số shard không giúp tenant lớn. Directory-based placement cho phép đặt tenant lớn ở hạ tầng riêng (cô lập noisy neighbor, có thể bán gói enterprise) mà không động tới tenant nhỏ. Shard theo user_id phá vỡ truy vấn theo tenant và cô lập dữ liệu; từ chối khách là quyết định kinh doanh, không phải kỹ thuật."

