[[questions]]
id = "sd-c04"
module = "sd-caching"
type = "code"
lang = "javascript"
difficulty = 2
tags = ["level:middle", "lru"]
title = "LRU cache O(1)"
prompt = '''
Cài `class LRUCache` với `constructor(capacity)` (capacity ≥ 1):
- `get(key)`: trả value hoặc `undefined`; một lần `get` trúng làm key thành **mới dùng gần nhất**
- `put(key, value)`: thêm hoặc cập nhật (cập nhật cũng tính là dùng gần nhất). Nếu vượt `capacity` → loại key **ít được dùng gần đây nhất**
- `keys()`: mảng key theo thứ tự **từ cũ nhất tới mới nhất**
- `get`/`put` phải O(1) trung bình (gợi ý: `Map` giữ thứ tự chèn, hoặc hash map + danh sách liên kết đôi)
'''
starter = '''
class LRUCache {
  constructor(capacity) { this.capacity = capacity; this.map = new Map(); }
  get(key) { return this.map.get(key); }
  put(key, value) {
    this.map.set(key, value);
    if (this.map.size > this.capacity) this.map.delete([...this.map.keys()].pop());
  }
  keys() { return [...this.map.keys()]; }
}
'''
solution = '''
class LRUCache {
  constructor(capacity) { this.capacity = capacity; this.map = new Map(); }
  get(key) {
    if (!this.map.has(key)) return undefined;
    const v = this.map.get(key);
    this.map.delete(key);
    this.map.set(key, v);
    return v;
  }
  put(key, value) {
    if (this.map.has(key)) this.map.delete(key);
    this.map.set(key, value);
    if (this.map.size > this.capacity) {
      const oldest = this.map.keys().next().value;
      this.map.delete(oldest);
    }
  }
  keys() { return [...this.map.keys()]; }
}
'''
tests = '''
test('loại key ít dùng gần đây nhất', () => {
  const c = new LRUCache(2);
  c.put('a', 1); c.put('b', 2); c.put('c', 3);
  expect(c.get('a')).toBeUndefined();
  expect(c.keys()).toEqual(['b', 'c']);
});
test('get làm mới thứ tự', () => {
  const c = new LRUCache(2);
  c.put('a', 1); c.put('b', 2);
  expect(c.get('a')).toBe(1);
  c.put('c', 3);
  expect(c.get('b')).toBeUndefined();
  expect(c.keys()).toEqual(['a', 'c']);
});
test('put cập nhật cũng làm mới và không vượt capacity', () => {
  const c = new LRUCache(2);
  c.put('a', 1); c.put('b', 2); c.put('a', 10); c.put('c', 3);
  expect(c.get('a')).toBe(10);
  expect(c.get('b')).toBeUndefined();
  expect(c.keys()).toHaveLength(2);
});
test('capacity 1 và key không tồn tại', () => {
  const c = new LRUCache(1);
  c.put('x', 1); c.put('y', 2);
  expect(c.keys()).toEqual(['y']);
  expect(c.get('nope')).toBeUndefined();
});
'''
hints = ["`Map` của JS giữ thứ tự chèn: xoá rồi set lại để đưa key về cuối.", "Key cũ nhất là `map.keys().next().value`."]
explanation = "LRU kinh điển dùng hash map + danh sách liên kết đôi; `Map` của JS làm sẵn cả hai. Redis dùng LRU **xấp xỉ** (lấy mẫu vài key) để tiết kiệm bộ nhớ thay vì giữ danh sách đầy đủ."

