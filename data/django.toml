[[questions]]
id = "dj-008"
module = "django-project"
type = "code"
difficulty = 2
tags = ["level:middle"]
title = "Mô phỏng URL resolver"
lang = "python"
prompt = '''
Viết hàm resolve(path, patterns) cho bộ URL patterns dạng danh sách tuple (route, view_name). Cả route và path không có dấu / ở đầu; dấu / cuối phải khớp chính xác.
Hàm hỗ trợ đoạn tĩnh và hai converter: <int:pk> chỉ nhận chữ số rồi chuyển thành int; <slug:slug> nhận chữ cái ASCII, số, dấu gạch ngang và gạch dưới. Trả về dict {"view": view_name, "kwargs": dict_tham_so} cho pattern đầu tiên khớp; trả về None nếu không có pattern khớp.
Ví dụ route articles/<int:pk>/ khớp articles/42/ và trả pk là số 42; articles/nope/ không khớp.
'''
starter = '''
def resolve(path, patterns):
    return None
'''
solution = '''
import re

def resolve(path, patterns):
    for route, view_name in patterns:
        if route.endswith("/") != path.endswith("/"):
            continue
        route_parts = route.rstrip("/").split("/") if route else []
        path_parts = path.rstrip("/").split("/") if path else []
        if len(route_parts) != len(path_parts):
            continue
        regex_parts = []
        converters = []
        for part in route_parts:
            match = re.fullmatch(r"<(int|slug):([A-Za-z_]\w*)>", part)
            if match:
                converter, name = match.groups()
                converters.append((name, converter))
                regex_parts.append(r"([0-9]+)" if converter == "int" else r"([-a-zA-Z0-9_]+)")
            else:
                regex_parts.append(re.escape(part))
        matched = re.fullmatch("/".join(regex_parts), "/".join(path_parts))
        if matched:
            kwargs = {}
            for (name, converter), value in zip(converters, matched.groups()):
                kwargs[name] = int(value) if converter == "int" else value
            return {"view": view_name, "kwargs": kwargs}
    return None
'''
tests = '''
@test("chuyển int và giữ đúng view")
def _():
    routes = [("articles/<int:pk>/", "detail")]
    assert resolve("articles/42/", routes) == {"view": "detail", "kwargs": {"pk": 42}}

@test("slug có dấu gạch ngang và gạch dưới")
def _():
    routes = [("tags/<slug:slug>/", "tag")]
    assert resolve("tags/django_6-rocks/", routes) == {"view": "tag", "kwargs": {"slug": "django_6-rocks"}}

@test("converter int từ chối chữ")
def _():
    assert resolve("articles/abc/", [("articles/<int:pk>/", "detail")]) is None

@test("slug từ chối dấu chấm")
def _():
    assert resolve("tags/a.b/", [("tags/<slug:slug>/", "tag")]) is None

@test("dấu slash cuối phải khớp")
def _():
    assert resolve("articles/12", [("articles/<int:pk>/", "detail")]) is None

@test("trả None khi không có route")
def _():
    assert resolve("missing/", [("articles/<int:pk>/", "detail")]) is None
'''
hints = ["Tách route và path theo dấu /, rồi so từng đoạn tương ứng.", "Dùng re.fullmatch để bảo đảm toàn bộ đoạn URL khớp converter."]
explanation = "URL resolver vừa xác nhận cấu trúc path vừa chuyển dữ liệu converter thành kiểu phù hợp trước khi gọi view."
sources = ["django~6.0/topics/http/urls"]

