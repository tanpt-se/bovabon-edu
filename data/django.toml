[[questions]]
id = "django-lvc04"
module = "django-forms"
type = "code"
difficulty = 2
tags = ["level:middle", "pagination"]
title = "Phân trang như Paginator.get_page"
lang = "python"
prompt = '''
Viết paginate(items, page, per_page) mô phỏng Paginator.get_page:
- num_pages = số trang cần để chứa items (làm tròn lên), tối thiểu 1 kể cả khi items rỗng.
- page có thể là int hoặc chuỗi; nếu không chuyển được sang int thì dùng trang 1; nếu nhỏ hơn 1 thì dùng 1; nếu lớn hơn num_pages thì dùng trang cuối.
- Trả dict {"items": list phần tử của trang, "number": số trang, "num_pages": ..., "has_next": bool, "has_previous": bool}.
per_page luôn là số nguyên dương.
'''
starter = '''
def paginate(items, page, per_page):
    return {"items": list(items[:per_page]), "number": 1, "num_pages": 1, "has_next": False, "has_previous": False}
'''
solution = '''
def paginate(items, page, per_page):
    items = list(items)
    num_pages = max(1, -(-len(items) // per_page))
    try:
        number = int(page)
    except (TypeError, ValueError):
        number = 1
    number = min(max(number, 1), num_pages)
    start = (number - 1) * per_page
    return {
        "items": items[start:start + per_page],
        "number": number,
        "num_pages": num_pages,
        "has_next": number < num_pages,
        "has_previous": number > 1,
    }
'''
tests = '''
@test("trang giữa")
def _():
    r = paginate(list(range(1, 11)), 2, 3)
    expect(r).to_equal({"items": [4, 5, 6], "number": 2, "num_pages": 4, "has_next": True, "has_previous": True})

@test("chuỗi số và trang cuối không đầy")
def _():
    r = paginate(list(range(10)), "4", 3)
    expect(r["items"]).to_equal([9])
    expect(r["has_next"]).to_be(False)

@test("trang không hợp lệ về trang 1")
def _():
    expect(paginate([1, 2, 3], "abc", 2)["number"]).to_be(1)
    expect(paginate([1, 2, 3], None, 2)["number"]).to_be(1)
    expect(paginate([1, 2, 3], -5, 2)["number"]).to_be(1)

@test("vượt quá về trang cuối")
def _():
    r = paginate([1, 2, 3], 99, 2)
    expect(r["number"]).to_be(2)
    expect(r["items"]).to_equal([3])

@test("danh sách rỗng vẫn có 1 trang")
def _():
    expect(paginate([], 1, 5)).to_equal({"items": [], "number": 1, "num_pages": 1, "has_next": False, "has_previous": False})
'''
hints = ["Làm tròn lên bằng -(-n // k) hoặc math.ceil.", "Bắt TypeError và ValueError khi int(page)."]
explanation = "Paginator.get_page xử lý mềm trang lỗi để URL người dùng sửa tay không gây 404; page() thì ném EmptyPage/PageNotAnInteger."
sources = ["django~6.0/ref/paginator"]
