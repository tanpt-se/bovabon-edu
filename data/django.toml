title = "Form validation và lỗi theo field"
lang = "python"
prompt = '''
Mô phỏng RegistrationForm nhận dict có email, password và confirm_password. is_valid() chuẩn hóa email bằng strip/lower, yêu cầu email có ký tự @, password dài ít nhất 8 ký tự, confirm_password không rỗng và phải bằng password.
Hàm trả True chỉ khi hợp lệ. Kết quả đã làm sạch nằm trong cleaned_data; errors là dict ánh xạ tên field tới danh sách thông báo. Lỗi password không khớp phải gắn vào confirm_password. Mỗi lần gọi is_valid() phải tính lại trạng thái.
'''
starter = '''
class RegistrationForm:
    def __init__(self, data):
        self.data = data
        self.cleaned_data = {}
        self.errors = {}

    def is_valid(self):
        return True
'''
solution = '''
class RegistrationForm:
    def __init__(self, data):
        self.data = dict(data)
        self.cleaned_data = {}
        self.errors = {}

    def add_error(self, field, message):
        self.errors.setdefault(field, []).append(message)
        self.cleaned_data.pop(field, None)

    def clean_email(self, value):
        email = str(value or "").strip().lower()
        if not email or "@" not in email:
            raise ValueError("Enter a valid email.")
        return email

    def clean_password(self, value):
        password = str(value or "")
        if len(password) < 8:
            raise ValueError("Password must be at least 8 characters.")
        return password

    def clean_confirm_password(self, value):
        confirmation = str(value or "")
        if not confirmation:
            raise ValueError("This field is required.")
        return confirmation

    def clean(self):
        password = self.cleaned_data.get("password")
        confirmation = self.cleaned_data.get("confirm_password")
        if password is not None and confirmation is not None and password != confirmation:
            self.add_error("confirm_password", "Passwords do not match.")

    def is_valid(self):
        self.cleaned_data = {}
        self.errors = {}
        cleaners = {
            "email": self.clean_email,
            "password": self.clean_password,
            "confirm_password": self.clean_confirm_password,
        }
        for field, cleaner in cleaners.items():
            try:
                self.cleaned_data[field] = cleaner(self.data.get(field, ""))
            except ValueError as error:
                self.add_error(field, str(error))
        self.clean()
        return not self.errors
'''
tests = '''
@test("chuẩn hóa dữ liệu hợp lệ")
def _():
    form = RegistrationForm({"email": "  USER@Example.com ", "password": "long-pass", "confirm_password": "long-pass"})
    assert form.is_valid() is True
    assert form.cleaned_data["email"] == "user@example.com"
    assert form.errors == {}

@test("email sai có lỗi đúng field")
def _():
    form = RegistrationForm({"email": "bad", "password": "long-pass", "confirm_password": "long-pass"})
    assert form.is_valid() is False
    assert "email" in form.errors
    assert "password" not in form.errors

@test("password ngắn có lỗi đúng field")
def _():
    form = RegistrationForm({"email": "a@b.test", "password": "short", "confirm_password": "short"})
    assert form.is_valid() is False
    assert "password" in form.errors

@test("password không khớp gắn lỗi vào xác nhận")
def _():
    form = RegistrationForm({"email": "a@b.test", "password": "long-pass", "confirm_password": "other-pass"})
    assert form.is_valid() is False
    assert "confirm_password" in form.errors

@test("thiếu xác nhận được báo theo field")
def _():
    form = RegistrationForm({"email": "a@b.test", "password": "long-pass"})
    assert form.is_valid() is False
    assert "confirm_password" in form.errors
'''
