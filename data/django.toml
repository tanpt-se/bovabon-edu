[[questions]]
id = "django-dvc02"
module = "django-dv-files"
type = "code"
difficulty = 2
tags = ["level:middle"]
title = "Kiểm tra metadata upload"
lang = "python"
prompt = '''
Viết validate_upload(metadata, max_bytes, allowed_extensions, allowed_types). metadata là dict có name, size và content_type. Trả True khi tên file là chuỗi không rỗng và không chứa / hoặc \\, phần mở rộng (không phân biệt hoa thường) nằm trong allowed_extensions, size là số nguyên dương không vượt max_bytes, và MIME type (bỏ phần tham số sau dấu ;) nằm trong allowed_types. Nếu metadata sai kiểu hoặc thiếu trường thì trả False. Đây chỉ là kiểm tra metadata; không khẳng định nội dung bytes đã an toàn.
'''
starter = '''
def validate_upload(metadata, max_bytes, allowed_extensions, allowed_types):
    return True
'''
solution = '''
def validate_upload(metadata, max_bytes, allowed_extensions, allowed_types):
    if not isinstance(metadata, dict):
        return False
    name = metadata.get("name")
    size = metadata.get("size")
    content_type = metadata.get("content_type")
    if not isinstance(name, str) or not name or "/" in name or "\\\\" in name:
        return False
    if type(size) is not int or size <= 0 or type(max_bytes) is not int or size > max_bytes:
        return False
    if not isinstance(content_type, str):
        return False
    if "." not in name:
        return False
    extension = "." + name.rsplit(".", 1)[1].lower()
    normalized_extensions = {item.lower() for item in allowed_extensions if isinstance(item, str)}
    if extension not in normalized_extensions:
        return False
    mime_type = content_type.split(";", 1)[0].strip().lower()
    normalized_types = {item.lower() for item in allowed_types if isinstance(item, str)}
    return mime_type in normalized_types
'''
tests = '''
@test("metadata pdf hợp lệ")
def _():
    meta = {"name": "report.PDF", "size": 120, "content_type": "Application/PDF"}
    assert validate_upload(meta, 1000, {".pdf"}, {"application/pdf"}) is True

@test("từ chối file lớn hơn giới hạn")
def _():
    meta = {"name": "report.pdf", "size": 1001, "content_type": "application/pdf"}
    assert validate_upload(meta, 1000, {".pdf"}, {"application/pdf"}) is False

@test("từ chối extension không allowlist")
def _():
    meta = {"name": "script.exe", "size": 10, "content_type": "application/pdf"}
    assert validate_upload(meta, 1000, {".pdf"}, {"application/pdf"}) is False

@test("từ chối đường dẫn trong tên file")
def _():
    meta = {"name": "../report.pdf", "size": 10, "content_type": "application/pdf"}
    assert validate_upload(meta, 1000, {".pdf"}, {"application/pdf"}) is False

@test("từ chối MIME type không allowlist")
def _():
    meta = {"name": "report.pdf", "size": 10, "content_type": "text/html; charset=utf-8"}
    assert validate_upload(meta, 1000, {".pdf"}, {"application/pdf"}) is False

@test("từ chối size dạng bool")
def _():
    meta = {"name": "report.pdf", "size": True, "content_type": "application/pdf"}
    assert validate_upload(meta, 1000, {".pdf"}, {"application/pdf"}) is False
'''
hints = ["Xác thực metadata và giới hạn trước khi so sánh phần mở rộng.", "Chuẩn hóa phần mở rộng và MIME type về chữ thường; MIME client vẫn không chứng minh bytes an toàn."]
explanation = "Allowlist metadata là bước đầu của policy upload; ứng dụng vẫn cần xác thực nội dung thật và kiểm soát cách phục vụ file."
sources = ["django~6.0/ref/files/uploads", "django~6.0/ref/files/storage", "django~6.0/topics/security"]

[[modules]]
id = "django-lead"
title = "Góc nhìn Tech Lead"
description = "Ra quyết định cho team Django: cấu trúc dự án lớn, migration không downtime, scaling worker và kết nối DB, observability, chiến lược test/release, nâng version LTS."
sources = ["django~6.0/howto/deployment/checklist", "django~6.0/howto/writing-migrations", "django~6.0/ref/migration-operations", "django~6.0/topics/migrations", "django~6.0/ref/databases", "django~6.0/topics/performance", "django~6.0/topics/logging", "django~6.0/topics/testing/advanced", "django~6.0/topics/cache"]
lesson = '''
### Vai trò của Tech Lead trong dự án Django
Ở cấp Lead, câu hỏi không còn là "API nào đúng" mà là "phương án nào hợp lý nhất với ràng buộc của team": số người, thời hạn, traffic, chi phí hạ tầng, rủi ro khi sự cố. Một quyết định tốt luôn ghi rõ bối cảnh, các phương án đã cân nhắc và lý do loại bỏ chúng.

### Khung ra quyết định
1. **Bối cảnh & ràng buộc**: traffic hiện tại/dự kiến, SLA, quy mô team, deadline.
2. **Phương án**: tối thiểu 2–3 lựa chọn, kể cả "giữ nguyên".
3. **Tiêu chí**: độ phức tạp vận hành, rủi ro, chi phí, khả năng đảo ngược (reversible).
4. **Quyết định + điều kiện xem lại**: khi nào cần đánh giá lại (ví dụ traffic x5).

### Bảng so sánh: tổ chức codebase
| Phương án | Ưu | Nhược | Hợp khi |
|---|---|---|---|
| Monolith một app lớn | Đơn giản, deploy một lần | Ranh giới mờ, xung đột merge | Team ≤ 3, sản phẩm mới |
| Modular monolith (nhiều app có ranh giới rõ) | Một deploy, ranh giới domain rõ, refactor dần | Cần kỷ luật import giữa app | Team 4–15 người, đa số dự án |
| Tách microservice | Scale/deploy độc lập | Chi phí vận hành, giao dịch phân tán | Nhiều team, nhu cầu scale khác hẳn nhau |

### Migration không downtime (expand/contract)
Khi deploy cuốn chiếu (rolling), code cũ và mới chạy song song trên cùng schema. Quy tắc:
- **Expand**: thêm cột nullable hoặc có default, thêm bảng mới, thêm index đồng thời (trên PostgreSQL dùng `AddIndexConcurrently` với migration `atomic = False`).
- **Migrate dữ liệu**: backfill theo batch, tách khỏi migration schema; `RunPython` nên có hàm reverse.
- **Contract**: chỉ xoá/đổi tên cột sau khi không còn code nào đọc nó (ít nhất một release sau).
- Đặt `lock_timeout`/`statement_timeout` để migration không khoá bảng quá lâu.

### Scaling worker và kết nối DB
Số kết nối ≈ số pod × worker mỗi pod × thread (ước lượng). Khi scale ngang, database thường cạn kết nối trước CPU. Dùng connection pooler (PgBouncer hoặc pool của backend), tách queue Celery/task theo mức ưu tiên để job chậm không chặn job quan trọng.

### Checklist review PR (gợi ý)
- Migration có an toàn với rolling deploy không? Có reverse không?
- Có query trong vòng lặp (N+1) không? Đã có test đếm query cho endpoint nóng chưa?
- Side effect (email, webhook) có chạy sau `transaction.on_commit` không?
- Secret, `DEBUG`, `ALLOWED_HOSTS` có lấy từ biến môi trường? CI chạy `check --deploy` và `makemigrations --check`?
- Log có đủ ngữ cảnh (request id, user id) nhưng không lộ dữ liệu nhạy cảm?

### ADR mẫu (ngắn)
> **ADR-012: Tách queue task theo mức ưu tiên.** Bối cảnh: email marketing (100k job/đêm) làm webhook thanh toán chậm 20 phút. Quyết định: 3 queue `critical`, `default`, `bulk`, worker riêng cho `critical`. Hệ quả: thêm cấu hình deploy; cần cảnh báo độ dài queue. Xem lại khi số job x3.

### Anti-pattern ở quy mô team
- Dùng signal để nối logic nghiệp vụ cốt lõi giữa các app (luồng ẩn, khó debug, không chạy với `bulk_create`/`update`).
- Migration vừa đổi schema vừa backfill hàng triệu dòng trong một transaction.
- Mỗi người tự cấu hình settings, không có nguồn sự thật chung.
- Tối ưu theo cảm tính thay vì đo (APM, query count, p95).
- Nâng Django nhảy nhiều phiên bản một lần mà không xử lý deprecation warning trước.

Số liệu trong bài là ước lượng tham khảo; luôn đo trên hệ thống thật trước khi quyết định.
'''

