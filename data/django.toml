[[questions]]
id = "dj-040"
module = "django-api-security"
type = "code"
difficulty = 2
tags = ["level:middle"]
title = "Quyền dựa trên group"
lang = "python"
prompt = '''
Viết has_permission(user, permission, group_permissions). user là dict có is_active, permissions và groups. group_permissions ánh xạ tên group tới tập hoặc danh sách permission.
Trả True nếu user active và permission có trong quyền trực tiếp của user hoặc trong quyền của ít nhất một group user tham gia. User inactive luôn bị từ chối. is_staff không tự cấp quyền trong mô phỏng này.
'''
starter = '''
def has_permission(user, permission, group_permissions):
    return False
'''
solution = '''
def has_permission(user, permission, group_permissions):
    if not user.get("is_active", False):
        return False
    if permission in user.get("permissions", ()):
        return True
    for group in user.get("groups", ()):
        if permission in group_permissions.get(group, ()):
            return True
    return False
'''
tests = '''
@test("quyền được cấp qua group")
def _():
    user = {"is_active": True, "permissions": [], "groups": ["Editors"]}
    groups = {"Editors": {"articles.change_article"}}
    assert has_permission(user, "articles.change_article", groups) is True

@test("user inactive bị từ chối dù group có quyền")
def _():
    user = {"is_active": False, "permissions": [], "groups": ["Editors"]}
    groups = {"Editors": {"articles.change_article"}}
    assert has_permission(user, "articles.change_article", groups) is False

@test("quyền trực tiếp được chấp nhận")
def _():
    user = {"is_active": True, "permissions": {"articles.view_article"}, "groups": []}
    assert has_permission(user, "articles.view_article", {}) is True

@test("staff không tự có permission")
def _():
    user = {"is_active": True, "is_staff": True, "permissions": [], "groups": []}
    assert has_permission(user, "articles.delete_article", {}) is False

@test("group khác không cấp quyền")
def _():
    user = {"is_active": True, "permissions": [], "groups": ["Readers"]}
    groups = {"Editors": {"articles.change_article"}}
    assert has_permission(user, "articles.change_article", groups) is False
'''
hints = ["Từ chối user inactive trước khi xét các nguồn quyền.", "Duyệt từng group của user và kiểm tra permission trong mapping."]
explanation = "Group là một nguồn cấp model permission; quyền truy cập vẫn cần kiểm tra trong từng request."
sources = ["django~6.0/topics/auth/default", "django~6.0/ref/contrib/auth"]

