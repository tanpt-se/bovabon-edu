[[questions]]
id = "django-dvc01"
module = "django-dv-testing"
type = "code"
difficulty = 2
tags = ["level:middle"]
title = "Kiểm tra hợp đồng response"
lang = "python"
prompt = '''
Viết hàm response_issues(status, body, expected_status, required_fields) cho test API. Hàm trả về danh sách chuỗi lỗi theo đúng thứ tự: thêm "status" nếu status khác expected_status; sau đó với mỗi field thiếu trong required_fields, thêm "missing:<tên-field>" theo thứ tự đầu vào. body có thể không phải dict; khi đó mọi field bắt buộc đều được xem là thiếu. Không thêm lỗi khác.
Ví dụ response_issues(200, {"id": 4}, 200, ["id", "name"]) trả ["missing:name"].
'''
starter = '''
def response_issues(status, body, expected_status, required_fields):
    return []
'''
solution = '''
def response_issues(status, body, expected_status, required_fields):
    issues = []
    if status != expected_status:
        issues.append("status")
    for field in required_fields:
        if not isinstance(body, dict) or field not in body:
            issues.append(f"missing:{field}")
    return issues
'''
tests = '''
@test("response hợp lệ không có issue")
def _():
    assert response_issues(200, {"id": 4, "name": "A"}, 200, ["id", "name"]) == []

@test("status sai được báo trước field thiếu")
def _():
    assert response_issues(404, {}, 200, ["id"]) == ["status", "missing:id"]

@test("field thiếu giữ thứ tự yêu cầu")
def _():
    assert response_issues(200, {"id": 4}, 200, ["name", "email"]) == ["missing:name", "missing:email"]

@test("body không phải dict khiến các field đều thiếu")
def _():
    assert response_issues(200, None, 200, ["id"]) == ["missing:id"]

@test("không bắt buộc field nào")
def _():
    assert response_issues(204, [], 204, []) == []
'''
hints = ["Tạo danh sách lỗi rỗng rồi so sánh status trước.", "Duyệt required_fields và kiểm tra body là dict có chứa từng key."]
explanation = "Một helper assertion nhỏ giúp test endpoint nhất quán mà vẫn giữ thông báo lỗi theo thứ tự dễ đọc."
sources = ["django~6.0/topics/testing/tools", "django~6.0/topics/testing/overview"]

