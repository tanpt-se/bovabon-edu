[[questions]]
id = "dj-017"
module = "django-orm"
type = "code"
difficulty = 3
title = "QuerySet lazy tối giản"
lang = "python"
prompt = '''
Tạo class QuerySet(rows, metrics=None) hỗ trợ filter(**criteria), exclude(**criteria), order_by(*fields) và lặp qua kết quả. Mỗi hàm chaining trả về QuerySet mới, không sửa object cũ. Các filter/exclude chỉ hỗ trợ so sánh bằng chính xác theo tên field; order_by nhận tên field tăng dần hoặc tiền tố - để giảm dần.
Truy vấn chỉ được thực thi khi bắt đầu lặp. Mỗi lần lặp tăng metrics["executions"] đúng một lần; nếu metrics không được truyền, khởi tạo dict với executions bằng 0. Các order_by nối tiếp thay thế thứ tự trước đó.
'''
starter = '''
class QuerySet:
    def __init__(self, rows, metrics=None):
        self.rows = rows
        self.metrics = metrics if metrics is not None else {"executions": 0}

    def filter(self, **criteria):
        return self

    def exclude(self, **criteria):
        return self

    def order_by(self, *fields):
        return self

    def __iter__(self):
        return iter([])
'''
solution = '''
class QuerySet:
    def __init__(self, rows, metrics=None, filters=None, ordering=()):
        self.rows = rows
        self.metrics = metrics if metrics is not None else {"executions": 0}
        self.filters = list(filters or [])
        self.ordering = tuple(ordering)

    def filter(self, **criteria):
        return QuerySet(self.rows, self.metrics, self.filters + [("include", criteria)], self.ordering)

    def exclude(self, **criteria):
        return QuerySet(self.rows, self.metrics, self.filters + [("exclude", criteria)], self.ordering)

    def order_by(self, *fields):
        return QuerySet(self.rows, self.metrics, self.filters, fields)

    @staticmethod
    def matches(row, criteria):
        return all(row.get(field) == value for field, value in criteria.items())

    def __iter__(self):
        self.metrics["executions"] = self.metrics.get("executions", 0) + 1
        result = list(self.rows)
        for mode, criteria in self.filters:
            if mode == "include":
                result = [row for row in result if self.matches(row, criteria)]
            else:
                result = [row for row in result if not self.matches(row, criteria)]
        for field in reversed(self.ordering):
            reverse = field.startswith("-")
            key = field[1:] if reverse else field
            result.sort(key=lambda row: row.get(key), reverse=reverse)
        return iter(result)
'''
tests = '''
@test("chaining chưa chạy query cho tới khi lặp")
def _():
    metrics = {"executions": 0}
    rows = [{"status": "live", "name": "B"}, {"status": "draft", "name": "A"}]
    qs = QuerySet(rows, metrics).filter(status="live").order_by("name")
    assert metrics["executions"] == 0
    assert list(qs) == [{"status": "live", "name": "B"}]
    assert metrics["executions"] == 1

@test("filter có thể nối nhiều điều kiện")
def _():
    rows = [{"team": "red", "active": True}, {"team": "red", "active": False}, {"team": "blue", "active": True}]
    assert list(QuerySet(rows).filter(team="red", active=True)) == [{"team": "red", "active": True}]

@test("exclude loại các hàng khớp")
def _():
    rows = [{"state": "open"}, {"state": "closed"}, {"state": "open"}]
    assert list(QuerySet(rows).exclude(state="open")) == [{"state": "closed"}]

@test("order_by hỗ trợ giảm dần")
def _():
    rows = [{"rank": 2}, {"rank": 5}, {"rank": 1}]
    assert list(QuerySet(rows).order_by("-rank")) == [{"rank": 5}, {"rank": 2}, {"rank": 1}]

@test("order_by sau cùng thay thứ tự cũ")
def _():
    rows = [{"name": "A", "id": 2}, {"name": "B", "id": 1}]
    result = list(QuerySet(rows).order_by("name").order_by("-id"))
    assert [row["id"] for row in result] == [2, 1]
'''
hints = ["Lưu các điều kiện dưới dạng operation để áp dụng khi __iter__ chạy.", "Tạo QuerySet mới cho mỗi method và chia sẻ cùng metrics dict."]
explanation = "Mô phỏng tính lazy của QuerySet: chaining mô tả truy vấn, còn vòng lặp mới thực thi."
sources = ["django~6.0/topics/db/queries", "django~6.0/ref/models/querysets"]

