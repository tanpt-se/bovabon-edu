[[questions]]
id = "django-lvc03"
module = "django-project"
type = "code"
difficulty = 1
tags = ["level:junior", "utils"]
title = "Tự viết slugify đơn giản"
lang = "python"
prompt = '''
Viết slugify(text) tạo slug cho URL:
- Bỏ dấu bằng unicodedata.normalize("NFKD", ...) rồi loại các ký tự không phải ASCII.
- Chuyển chữ thường.
- Mỗi chuỗi liên tiếp các ký tự không phải chữ a-z hoặc số 0-9 thay bằng một dấu gạch ngang.
- Bỏ dấu gạch ngang ở đầu và cuối. Chuỗi rỗng trả "".
Ví dụ: "Học Django 6!" -> "hoc-django-6".
'''
starter = '''
def slugify(text):
    return text.lower()
'''
solution = '''
import re
import unicodedata

def slugify(text):
    ascii_text = unicodedata.normalize("NFKD", text).encode("ascii", "ignore").decode("ascii")
    return re.sub(r"[^a-z0-9]+", "-", ascii_text.lower()).strip("-")
'''
tests = '''
@test("bỏ dấu và thay khoảng trắng")
def _():
    expect(slugify("Học Django 6!")).to_be("hoc-django-6")

@test("gộp nhiều ký tự đặc biệt")
def _():
    expect(slugify("Hello,   World -- 2026")).to_be("hello-world-2026")

@test("bỏ gạch ngang đầu cuối")
def _():
    expect(slugify("  --Xin chào--  ")).to_be("xin-chao")

@test("chuỗi rỗng")
def _():
    expect(slugify("")).to_be("")

@test("đã là slug giữ nguyên")
def _():
    expect(slugify("abc-123")).to_be("abc-123")
'''
hints = ["encode('ascii', 'ignore') sau NFKD sẽ bỏ dấu.", "re.sub(r'[^a-z0-9]+', '-', ...) rồi strip('-')."]
explanation = "Django có sẵn django.utils.text.slugify; tự viết giúp hiểu cách chuẩn hoá Unicode và regex. Lưu ý chữ đ không phân rã nên bị loại."
sources = ["django~6.0/ref/utils"]

