id = "django"
title = "Django"
icon = "🎸"
color = "#0c4b33"
group = "Backend"
docs = ["django~6.0"]
description = "Xây dựng ứng dụng web với Django: cấu trúc project, URLconf, ORM, form, template, phân quyền, API, bảo mật và triển khai."

[[modules]]
id = "django-project"
title = "Project, app, settings & URLconf"
description = "Cấu trúc project/app, cấu hình settings, URL resolver, FBV và CBV."
sources = ["django~6.0/intro/tutorial01", "django~6.0/intro/tutorial02", "django~6.0/topics/settings", "django~6.0/topics/http/urls", "django~6.0/topics/http/views", "django~6.0/ref/class-based-views/base"]
lesson = '''
### Project và app
| Thành phần | Vai trò |
|---|---|
| Project | Cấu hình và kết nối các app của một website |
| App | Một vùng chức năng có thể tái sử dụng, như blog hoặc billing |
| settings.py | Cấu hình app đã cài, database, middleware và bảo mật |
| urls.py | Khai báo bảng URL patterns và chuyển tiếp tới view |

Một project thường có manage.py và package cấu hình chứa settings.py, urls.py, asgi.py, wsgi.py. App được tạo riêng, khai báo trong INSTALLED_APPS và có thể có models.py, views.py, urls.py. URLconf cấp project thường dùng include() để chuyển nhánh URL sang app.

~~~python
urlpatterns = [
    path("articles/<int:pk>/", views.detail, name="article-detail"),
    path("news/", include("news.urls")),
]
~~~

URL patterns được xét theo thứ tự; converter int truyền pk vào view dưới dạng số nguyên. FBV là hàm nhận request và trả response. CBV gom hành vi theo class; as_view() tạo callable để router gọi và dispatch theo HTTP method.

Lỗi hay gặp: quên thêm app vào INSTALLED_APPS, đặt URL tổng quát trước URL cụ thể, hoặc gọi CBV trực tiếp thay vì dùng as_view(). Không đưa secret key vào mã nguồn.
'''

[[modules]]
id = "django-orm"
title = "Model, migration & QuerySet"
description = "Schema qua model/migration, truy vấn lười, tối ưu quan hệ, biểu thức và transaction."
sources = ["django~6.0/topics/db/models", "django~6.0/topics/migrations", "django~6.0/topics/db/queries", "django~6.0/ref/models/querysets", "django~6.0/ref/models/expressions", "django~6.0/topics/db/optimization", "django~6.0/topics/db/aggregation", "django~6.0/topics/db/transactions"]
lesson = '''
### Mô hình và truy vấn
Model mô tả dữ liệu, field và quan hệ; migration là lịch sử thay đổi schema. makemigrations tạo migration từ khác biệt model, còn migrate áp dụng chúng lên database. QuerySet mô tả truy vấn và thường chưa đọc dữ liệu cho tới khi được đánh giá, chẳng hạn khi lặp hoặc chuyển thành list.

| Nhu cầu | Công cụ |
|---|---|
| FK hoặc OneToOne, lấy cùng hàng | select_related |
| ManyToMany hoặc quan hệ ngược | prefetch_related |
| So sánh/ cập nhật bằng giá trị ở DB | F |
| Ghép điều kiện phức tạp, gồm OR | Q |
| Giá trị trên từng object | annotate |
| Một kết quả tổng hợp | aggregate |
| Gom nhiều thao tác thành một đơn vị | transaction.atomic |

~~~python
active = Article.objects.filter(published=True).order_by("-created_at")
~~~

Các thao tác QuerySet có thể nối tiếp và thông thường vẫn chưa chạy SQL ngay. Tối ưu quan hệ giúp tránh N+1; hãy đo truy vấn trước khi thêm tối ưu. Dùng transaction.atomic cho thay đổi cần thành công hoặc rollback cùng nhau.

Lỗi hay gặp: nhầm makemigrations với migrate, gọi prefetch_related cho FK đơn, hoặc lấy từng quan hệ trong vòng lặp mà không kiểm tra số truy vấn.
'''

[[modules]]
id = "django-forms"
title = "Template, Form & phân trang"
description = "Render HTML an toàn, làm sạch dữ liệu theo field và toàn form, chia trang kết quả."
sources = ["django~6.0/topics/templates", "django~6.0/ref/templates/language", "django~6.0/ref/templates/builtins", "django~6.0/topics/forms/index", "django~6.0/ref/forms/api", "django~6.0/ref/forms/validation", "django~6.0/ref/paginator"]
lesson = '''
### Hiển thị và nhận dữ liệu
Django template tách phần trình bày khỏi view. Autoescape được bật mặc định cho biến trong HTML, giúp dữ liệu người dùng không bị diễn giải thành markup; tránh đánh dấu dữ liệu không tin cậy là safe. Với POST dùng session/cookie, form cần token CSRF và view cần kiểm tra dữ liệu server-side.

Quy trình validation của Form gồm làm sạch từng field, gọi clean_<field>(), sau đó gọi clean() cho quy tắc giữa nhiều field. is_valid() kích hoạt quy trình; cleaned_data chứa giá trị đã chuẩn hóa, errors lưu theo field và lỗi chung có thể nằm ở __all__. Chỉ dùng dữ liệu đã validate để cập nhật model.

| Công việc | Cách dùng |
|---|---|
| Kiểm tra một field | Field.clean() hoặc clean_<field>() |
| So sánh nhiều field | Form.clean() |
| Hiển thị lỗi | form.errors hoặc field.errors |
| Chia kết quả | Paginator(queryset, per_page).get_page(number) |

Paginator dùng số trang bắt đầu từ 1. get_page() xử lý số trang sai theo cách thân thiện; page() phù hợp khi muốn InvalidPage rõ ràng.

Lỗi hay gặp: chỉ dựa vào validation phía trình duyệt, quên token CSRF, tắt autoescape tùy tiện, hoặc giả định trang đầu có số 0.
'''

[[modules]]
id = "django-request"
title = "Admin, auth, middleware & signals"
description = "Quản trị nội bộ, xác thực và quyền nhóm, chuỗi middleware, tín hiệu."
sources = ["django~6.0/ref/contrib/admin/index", "django~6.0/topics/auth/default", "django~6.0/ref/contrib/auth", "django~6.0/ref/middleware", "django~6.0/topics/http/middleware", "django~6.0/topics/signals"]
lesson = '''
### Quyền và vòng đời request
Admin tạo giao diện quản trị từ model đã đăng ký; người dùng cần được xác thực, active và có quyền truy cập admin. is_staff quyết định quyền vào admin, nhưng không thay thế permission kiểm soát thao tác trên model. Group có thể cấp quyền model cho nhiều user; kiểm tra quyền bằng user.has_perm() thay vì tự tin vào tên nhóm ở view.

Middleware là các lớp bọc quanh request/response. Middleware đầu tiên trong settings.MIDDLEWARE nhận request trước; response quay ngược qua các middleware. Factory nhận get_response và trả callable. Thứ tự ảnh hưởng tới session, authentication, CSRF và response.

| Thành phần | Mục đích |
|---|---|
| authenticate() | Xác minh thông tin đăng nhập |
| login() | Gắn user đã xác thực vào session |
| Group / Permission | Chia sẻ quyền và kiểm soát hành động |
| Signal | Thông báo sự kiện giữa các thành phần |

Signals có thể giúp tích hợp các app, nhưng luồng nghiệp vụ cốt lõi thường dễ hiểu hơn khi gọi service một cách tường minh. Đăng ký receiver ở AppConfig.ready() và tránh đăng ký lặp.

Lỗi hay gặp: nhầm đăng nhập với phân quyền, coi is_staff là quyền sửa mọi model, hoặc dùng signal ẩn đi side effect quan trọng.
'''

[[modules]]
id = "django-api-security"
title = "API, caching, bảo mật & deploy"
description = "Khái niệm DRF, cache, CSRF/XSS/SQL injection và cấu hình triển khai."
sources = ["django~6.0/topics/http/views", "django~6.0/topics/cache", "django~6.0/topics/security", "django~6.0/howto/csrf", "django~6.0/howto/deployment/checklist", "django~6.0/howto/deployment/wsgi/gunicorn", "django~6.0/howto/deployment/asgi/index"]
lesson = '''
### API và vận hành
Django REST Framework là thư viện riêng dùng cùng Django, không thuộc core Django. Serializer chuyển đổi và validate dữ liệu; APIView/ViewSet xử lý request; router có thể tạo URL; authentication xác định danh tính, permission quyết định quyền, throttling giới hạn tần suất.

Cache có thể đặt ở mức site, view hoặc dữ liệu. Chọn cache key và thời hạn dựa trên dữ liệu thực tế; nội dung cá nhân hóa cần được phân biệt theo user hoặc không đưa vào shared cache. Cache invalidation cần đi cùng cập nhật dữ liệu.

| Rủi ro | Biện pháp |
|---|---|
| CSRF | Dùng token cho request thay đổi trạng thái dựa trên cookie/session |
| XSS | Giữ autoescape, không đánh dấu HTML không tin cậy là safe |
| SQL injection | Dùng ORM hoặc parameter binding, không nối input vào SQL |
| Lộ cấu hình | DEBUG=False, secret từ môi trường, đặt ALLOWED_HOSTS |

Production cần HTTPS, static files được thu thập/phục vụ phù hợp, log không chứa bí mật, và chạy check --deploy. Chọn WSGI hoặc ASGI cùng server production phù hợp với ứng dụng.

Lỗi hay gặp: cho rằng CSRF thay thế authorization, cache response riêng tư công khai, hoặc triển khai development server với DEBUG=True.
'''

[[modules]]
id = "django-dv-testing"
title = "Kiểm thử ứng dụng Django"
description = "Chọn test case phù hợp, kiểm tra request/response, cơ sở dữ liệu và view cô lập."
sources = ["django~6.0/topics/testing/index", "django~6.0/topics/testing/tools", "django~6.0/topics/testing/advanced", "django~6.0/topics/testing/overview"]
lesson = '''
### Kiểm thử hành vi ở đúng ranh giới
Django cung cấp các lớp test dựa trên unittest, test database riêng và công cụ mô phỏng request. Nên kiểm tra hành vi quan sát được: status, redirect, dữ liệu đã lưu, quyền truy cập và số truy vấn quan trọng. Mỗi test nên thiết lập dữ liệu cần thiết, thực hiện một hành động và kiểm tra kết quả có ý nghĩa với người dùng.

| Công cụ | Phạm vi | Dùng khi |
|---|---|---|
| `SimpleTestCase` | Không dùng database | Logic thuần, template, response |
| `TestCase` | Database test được cô lập bằng transaction/rollback | Hầu hết kiểm thử model và view |
| `TransactionTestCase` | Kiểm tra commit, rollback hoặc hành vi transaction thực | Mã phụ thuộc ranh giới commit |
| `Client` | Đi qua URL resolver và middleware trong test | Kiểm thử luồng HTTP tích hợp |
| `RequestFactory` | Tạo request để gọi trực tiếp một view | Cô lập logic của view; middleware không tự chạy |

Ví dụ: dùng `self.client.post()` để gửi form, rồi xác nhận status, redirect và trạng thái database. `setUpTestData()` tạo dữ liệu dùng chung cho các test trong class hiệu quả hơn khi dữ liệu không bị sửa; dùng `setUp()` cho trạng thái thay đổi riêng từng test. `AsyncClient` phù hợp khi cần gọi endpoint bất đồng bộ.

Để phát hiện hồi quy hiệu năng, đo số truy vấn trên đoạn code cụ thể bằng `assertNumQueries`, thay vì giả định truy vấn tối ưu. Có thể thay thế phụ thuộc ngoài như cổng thanh toán bằng mock, nhưng vẫn cần test riêng cho hợp đồng tích hợp.

Lỗi hay gặp: dùng `RequestFactory` rồi tưởng session, authentication và middleware đã chạy; chia sẻ object mutable giữa test; chỉ kiểm tra status mà bỏ qua tác động dữ liệu; hoặc dùng `TransactionTestCase` cho mọi test khiến suite chậm hơn cần thiết.
'''

[[modules]]
id = "django-dv-files"
title = "Upload và storage"
description = "Nhận file qua form, xử lý UploadedFile và lưu qua storage backend an toàn."
sources = ["django~6.0/ref/files/uploads", "django~6.0/ref/files/storage", "django~6.0/howto/custom-file-storage", "django~6.0/ref/files/file"]
lesson = '''
### Luồng nhận và lưu file
Form upload HTML phải dùng `method="post"` và `enctype="multipart/form-data"`; form Django cần có field phù hợp và template POST cần token CSRF. Khi request được parse, file nằm trong `request.FILES`. Nên để Form/ModelForm kiểm tra dữ liệu trước khi lưu model, rồi xử lý tiếp bằng UploadedFile hoặc storage API.

| Thành phần | Trách nhiệm | Lưu ý |
|---|---|---|
| `UploadedFile` | Đại diện file nhận từ request | Có thể nằm trong memory hoặc temporary file |
| `chunks()` | Đọc lần lượt từng phần | Phù hợp hơn `read()` với file lớn |
| `FileField` | Lưu tham chiếu file trên model | Database thường giữ tên/path do storage trả về |
| `Storage` | Lưu và truy xuất nội dung file | Backend local, cloud hoặc custom có thể khác nhau |
| `staticfiles` | Tài nguyên phát hành cùng ứng dụng | Khác file do người dùng tải lên |

Trong môi trường local, `MEDIA_ROOT` và `MEDIA_URL` thường cấu hình nơi lưu/phục vụ media; static assets có quy trình riêng như collectstatic. Không giả định storage luôn nằm trên filesystem: `.path()` có thể không khả dụng ở backend từ xa, còn `.url()` phụ thuộc cấu hình truy cập.

Tên file, phần mở rộng, kích cỡ và `content_type` từ client đều là input không đáng tin. Đặt giới hạn kích thước, allowlist loại file theo nhu cầu, kiểm tra nội dung thực bằng parser phù hợp, dùng key lưu trữ do server kiểm soát, và giới hạn quyền đọc. File không tin cậy không nên được phục vụ như mã thực thi từ cùng origin nhạy cảm.

Lỗi hay gặp: quên `multipart/form-data`, chỉ kiểm tra phần mở rộng do client gửi, đọc toàn bộ file lớn vào RAM, nối tên file vào đường dẫn tùy ý, hoặc dùng `FileField.path` với storage không phải filesystem.
'''

[[modules]]
id = "django-dv-tasks"
title = "Async support và task framework"
description = "Phân biệt async view với công việc chạy nền, khai báo task và theo dõi kết quả."
sources = ["django~6.0/topics/tasks", "django~6.0/ref/tasks", "django~6.0/topics/async", "django~6.0/topics/db/transactions"]
lesson = '''
### Async request và công việc nền
Async view hữu ích khi request chờ nhiều thao tác I/O có thể chờ đồng thời và toàn bộ middleware/đường gọi hỗ trợ async. Nó vẫn chạy trong vòng đời request: tác vụ dài chưa tự động chuyển thành background job. Django 6.0 bổ sung task framework chuẩn hóa cách khai báo, xếp hàng và đọc kết quả công việc nền thông qua backend.

| Nhu cầu | Cơ chế | Đặc điểm |
|---|---|---|
| Chờ nhiều I/O trong một request | Async view | Response vẫn phụ thuộc thời gian hoàn thành view |
| Gửi email hoặc tạo báo cáo sau response | Task và `.enqueue()` | Backend/worker xử lý ngoài request |
| Đảm bảo enqueue sau khi lưu transaction | `transaction.on_commit()` | Callback chỉ chạy sau commit thành công |
| Theo dõi tiến trình/kết quả | `TaskResult` | Trạng thái và khả năng lưu kết quả tùy backend |

Task được định nghĩa bằng decorator `@task`; gọi `.enqueue()` để gửi yêu cầu thực thi qua backend. Framework cung cấp API và hợp đồng backend, nhưng Django core không tự cung cấp worker production để chạy queue. Cần chọn backend/worker phù hợp môi trường và xác nhận backend hỗ trợ tính năng như priority hay kết quả nếu ứng dụng phụ thuộc.

Payload task nên đủ để worker đọc lại dữ liệu bền vững; thường truyền ID thay vì object model đang nằm trong memory. Task có thể được thử lại hoặc gửi lặp tùy hệ thống vận hành, vì vậy thao tác có side effect nên idempotent. Khi task phụ thuộc một bản ghi vừa tạo, enqueue trong `transaction.on_commit()` để worker không đọc trước khi transaction commit.

Lỗi hay gặp: xem async view như queue, thực hiện công việc dài trước khi trả response, cho rằng `.enqueue()` có nghĩa task đã hoàn thành, giả định mọi backend chạy task ngay, hoặc bỏ qua việc thiết kế retry và side effect lặp.
'''

