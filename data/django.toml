[[questions]]
id = "dj-025"
module = "django-forms"
type = "code"
difficulty = 2
title = "Phân trang danh sách"
lang = "python"
prompt = '''
Viết paginate(items, page, per_page) cho danh sách Python. page bắt đầu từ 1 và per_page phải là số nguyên dương. Trả về dict gồm items (các phần tử của trang), number, num_pages, has_next và has_previous. Danh sách rỗng vẫn có một trang rỗng.
Ném ValueError nếu page hoặc per_page không hợp lệ, hoặc page vượt phạm vi. Không sửa danh sách đầu vào.
'''
starter = '''
def paginate(items, page, per_page):
    return {"items": [], "number": page, "num_pages": 1, "has_next": False, "has_previous": False}
'''
solution = '''
def paginate(items, page, per_page):
    if not isinstance(page, int) or isinstance(page, bool) or page < 1:
        raise ValueError("invalid page")
    if not isinstance(per_page, int) or isinstance(per_page, bool) or per_page < 1:
        raise ValueError("invalid page size")
    num_pages = max(1, (len(items) + per_page - 1) // per_page)
    if page > num_pages:
        raise ValueError("page out of range")
    start = (page - 1) * per_page
    return {
        "items": items[start:start + per_page],
        "number": page,
        "num_pages": num_pages,
        "has_next": page < num_pages,
        "has_previous": page > 1,
    }
'''
tests = '''
@test("trang đầu có next")
def _():
    result = paginate([1, 2, 3, 4, 5], 1, 2)
    assert result == {"items": [1, 2], "number": 1, "num_pages": 3, "has_next": True, "has_previous": False}

@test("trang cuối có phần tử còn lại")
def _():
    result = paginate([1, 2, 3, 4, 5], 3, 2)
    assert result["items"] == [5]
    assert result["has_next"] is False
    assert result["has_previous"] is True

@test("empty list có một trang rỗng")
def _():
    result = paginate([], 1, 10)
    assert result["items"] == []
    assert result["num_pages"] == 1

@test("từ chối page ngoài phạm vi")
def _():
    try:
        paginate([1], 2, 1)
    except ValueError:
        assert True
    else:
        assert False

@test("từ chối page size bằng không")
def _():
    try:
        paginate([1], 1, 0)
    except ValueError:
        assert True
    else:
        assert False
'''
hints = ["Tính num_pages bằng phép chia làm tròn lên, nhưng tối thiểu là 1.", "Vị trí bắt đầu của trang là (page - 1) * per_page."]
explanation = "Phân trang cho người dùng dùng số trang từ 1; kiểm tra phạm vi trước khi cắt danh sách."
sources = ["django~6.0/ref/paginator"]

