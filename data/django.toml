[[questions]]
id = "dj-032"
module = "django-request"
type = "code"
difficulty = 2
tags = ["level:middle"]
title = "Chuỗi middleware"
lang = "python"
prompt = '''
Viết build_chain(middlewares, view). Mỗi middleware là factory nhận get_response và trả callable nhận request. Hàm phải lồng middleware theo thứ tự danh sách: middleware đầu tiên bọc các middleware sau cùng và view.
Kết quả là callable nhận request. Middleware mẫu có thể gọi get_response(request), rồi xử lý response trước khi trả về.
'''
starter = '''
def build_chain(middlewares, view):
    return view
'''
solution = '''
def build_chain(middlewares, view):
    handler = view
    for middleware in reversed(middlewares):
        handler = middleware(handler)
    return handler
'''
tests = '''
@test("request đi xuôi và response quay ngược")
def _():
    events = []
    def wrap(name):
        def middleware(get_response):
            def handler(request):
                events.append(name + "-in")
                response = get_response(request)
                events.append(name + "-out")
                return response
            return handler
        return middleware
    def view(request):
        events.append("view")
        return {"ok": request}
    response = build_chain([wrap("A"), wrap("B")], view)("req")
    assert events == ["A-in", "B-in", "view", "B-out", "A-out"]
    assert response == {"ok": "req"}

@test("không có middleware vẫn gọi view")
def _():
    view = lambda request: request + "!"
    assert build_chain([], view)("hello") == "hello!"

@test("một middleware có thể sửa response")
def _():
    def middleware(get_response):
        def handler(request):
            response = get_response(request)
            return response + "-wrapped"
        return handler
    assert build_chain([middleware], lambda request: request)("ok") == "ok-wrapped"

@test("request được truyền nguyên vẹn")
def _():
    marker = {"id": 7}
    seen = []
    def middleware(get_response):
        def handler(request):
            seen.append(request)
            return get_response(request)
        return handler
    assert build_chain([middleware], lambda request: "done")(marker) == "done"
    assert seen == [marker]
'''
hints = ["Khởi tạo handler bằng view.", "Duyệt middleware từ cuối lên để middleware đầu tiên trở thành lớp ngoài cùng."]
explanation = "Cấu trúc middleware là chuỗi wrapper lồng nhau: request đi vào từ ngoài, response quay về phía ngoài."
sources = ["django~6.0/topics/http/middleware", "django~6.0/ref/middleware"]

