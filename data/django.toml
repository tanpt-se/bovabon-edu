[[questions]]
id = "django-lvc01"
module = "django-lead"
type = "code"
difficulty = 3
tags = ["level:lead", "migration"]
title = "Gác cổng migration không downtime"
lang = "python"
prompt = '''
Team quyết định CI tự đánh giá migration theo chính sách rolling deploy. Viết review_migration(ops), ops là list dict, mỗi dict có khoá "op" (tên thao tác) và có thể có "null", "default", "concurrently", "reverse".
Quy tắc cho từng thao tác:
- "unsafe": AddField khi null không phải True và không có khoá "default"; hoặc op là RemoveField, RenameField, RenameModel, DeleteModel.
- "review": AlterField; AddIndex khi concurrently không phải True; RunPython khi reverse không phải True.
- "safe": mọi trường hợp còn lại.
Trả về dict {"verdict": v, "issues": [...]}. issues là list dict {"index": i, "op": tên_op, "level": mức} cho các thao tác không safe, theo thứ tự xuất hiện. verdict là mức nặng nhất (unsafe > review > safe); list rỗng thì verdict là "safe".
'''
starter = '''
def review_migration(ops):
    return {"verdict": "safe", "issues": []}
'''
solution = '''
UNSAFE_OPS = {"RemoveField", "RenameField", "RenameModel", "DeleteModel"}
RANK = {"safe": 0, "review": 1, "unsafe": 2}

def _level(op):
    name = op.get("op")
    if name == "AddField":
        if op.get("null") is not True and "default" not in op:
            return "unsafe"
        return "safe"
    if name in UNSAFE_OPS:
        return "unsafe"
    if name == "AlterField":
        return "review"
    if name == "AddIndex" and op.get("concurrently") is not True:
        return "review"
    if name == "RunPython" and op.get("reverse") is not True:
        return "review"
    return "safe"

def review_migration(ops):
    verdict = "safe"
    issues = []
    for index, op in enumerate(ops):
        level = _level(op)
        if level != "safe":
            issues.append({"index": index, "op": op.get("op"), "level": level})
            if RANK[level] > RANK[verdict]:
                verdict = level
    return {"verdict": verdict, "issues": issues}
'''
tests = '''
@test("migration rỗng là safe")
def _():
    expect(review_migration([])).to_equal({"verdict": "safe", "issues": []})

@test("AddField nullable hoặc có default là safe")
def _():
    ops = [{"op": "AddField", "null": True}, {"op": "AddField", "default": 0}, {"op": "CreateModel"}]
    expect(review_migration(ops)).to_equal({"verdict": "safe", "issues": []})

@test("AddField NOT NULL không default là unsafe")
def _():
    r = review_migration([{"op": "AddField", "null": False}])
    expect(r["verdict"]).to_be("unsafe")
    expect(r["issues"]).to_equal([{"index": 0, "op": "AddField", "level": "unsafe"}])

@test("index thường và RunPython không reverse cần review")
def _():
    ops = [{"op": "AddIndex"}, {"op": "AddIndex", "concurrently": True}, {"op": "RunPython", "reverse": True}, {"op": "RunPython"}]
    r = review_migration(ops)
    expect(r["verdict"]).to_be("review")
    expect([i["index"] for i in r["issues"]]).to_equal([0, 3])

@test("verdict lấy mức nặng nhất")
def _():
    ops = [{"op": "AlterField"}, {"op": "RenameField"}, {"op": "AddIndex"}]
    r = review_migration(ops)
    expect(r["verdict"]).to_be("unsafe")
    expect([i["level"] for i in r["issues"]]).to_equal(["review", "unsafe", "review"])

@test("RemoveField và DeleteModel là unsafe")
def _():
    r = review_migration([{"op": "RemoveField"}, {"op": "DeleteModel"}])
    expect([i["level"] for i in r["issues"]]).to_equal(["unsafe", "unsafe"])
'''
hints = ["Viết hàm phụ trả mức cho một thao tác, rồi gộp kết quả.", "Dùng bảng thứ hạng safe < review < unsafe để tính verdict."]
explanation = "Tự động hoá chính sách migration biến kinh nghiệm của Lead thành quality gate cho cả team; review con người tập trung vào trường hợp được đánh dấu."
sources = ["django~6.0/ref/migration-operations", "django~6.0/howto/writing-migrations"]

