[[questions]]
id = "django-lvc02"
module = "django-orm"
type = "code"
difficulty = 3
tags = ["level:senior", "concurrency"]
title = "Optimistic locking bằng cột version"
lang = "python"
prompt = '''
Mô phỏng optimistic locking như filter(pk=pk, version=v).update(...). store là dict pk -> dict dữ liệu, mỗi bản ghi có khoá "version" (int).
1. update_if_version(store, pk, expected_version, changes): nếu pk tồn tại và version hiện tại bằng expected_version thì cập nhật các field trong changes, tăng version thêm 1 và trả 1 (số hàng bị ảnh hưởng); ngược lại không đổi gì và trả 0. changes không được ghi đè trực tiếp khoá "version" (bỏ qua nếu có).
2. save_with_retry(store, pk, mutate, attempts=3): lặp tối đa attempts lần: đọc bản sao bản ghi hiện tại, gọi mutate(bản_sao) trả về dict changes, thử update_if_version với version đã đọc. Thành công trả True; hết lượt trả False. pk không tồn tại trả False ngay.
'''
starter = '''
def update_if_version(store, pk, expected_version, changes):
    store[pk].update(changes)
    return 1

def save_with_retry(store, pk, mutate, attempts=3):
    return True
'''
solution = '''
def update_if_version(store, pk, expected_version, changes):
    row = store.get(pk)
    if row is None or row.get("version") != expected_version:
        return 0
    for key, value in changes.items():
        if key != "version":
            row[key] = value
    row["version"] = expected_version + 1
    return 1

def save_with_retry(store, pk, mutate, attempts=3):
    for _ in range(attempts):
        row = store.get(pk)
        if row is None:
            return False
        snapshot = dict(row)
        changes = mutate(snapshot)
        if update_if_version(store, pk, snapshot["version"], changes) == 1:
            return True
    return False
'''
tests = '''
@test("cập nhật khi đúng version và tăng version")
def _():
    store = {1: {"title": "a", "version": 3}}
    expect(update_if_version(store, 1, 3, {"title": "b"})).to_be(1)
    expect(store[1]).to_equal({"title": "b", "version": 4})

@test("sai version thì không đổi")
def _():
    store = {1: {"title": "a", "version": 3}}
    expect(update_if_version(store, 1, 2, {"title": "b"})).to_be(0)
    expect(store[1]).to_equal({"title": "a", "version": 3})

@test("không cho changes ghi đè version")
def _():
    store = {1: {"n": 0, "version": 1}}
    update_if_version(store, 1, 1, {"n": 5, "version": 99})
    expect(store[1]).to_equal({"n": 5, "version": 2})

@test("pk không tồn tại")
def _():
    expect(update_if_version({}, 9, 1, {"x": 1})).to_be(0)
    expect(save_with_retry({}, 9, lambda r: {"x": 1})).to_be(False)

@test("retry thành công sau một lần xung đột")
def _():
    store = {1: {"n": 0, "version": 1}}
    calls = []
    def mutate(row):
        calls.append(row["version"])
        if len(calls) == 1:
            store[1]["n"] = 10
            store[1]["version"] = 2
        return {"n": row["n"] + 1}
    expect(save_with_retry(store, 1, mutate)).to_be(True)
    expect(store[1]).to_equal({"n": 11, "version": 3})
    expect(calls).to_equal([1, 2])

@test("hết lượt thử trả False")
def _():
    store = {1: {"n": 0, "version": 1}}
    def mutate(row):
        store[1]["version"] += 1
        return {"n": 1}
    expect(save_with_retry(store, 1, mutate, attempts=2)).to_be(False)
    expect(store[1]["n"]).to_be(0)
'''
hints = ["update_if_version chỉ ghi khi version khớp; trả số hàng bị ảnh hưởng.", "Trong vòng retry, đọc lại bản ghi mới nhất ở mỗi lượt rồi tính changes từ bản sao đó."]
explanation = "Pattern này tương ứng với filter(pk=..., version=...).update(...) và kiểm tra số hàng trả về; hợp khi xung đột hiếm và không muốn giữ khoá lâu."
sources = ["django~6.0/ref/models/querysets", "django~6.0/ref/models/expressions"]

