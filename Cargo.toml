[package]
name = "bovabon_edu"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
boa_engine = "0.22.0"
pulldown-cmark = "0.13.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
tower-http = { version = "0.7.1", features = ["compression-gzip"] }

# App desktop (cửa sổ WebView gốc). Build: cargo build --release --features desktop --bin bovabon-desktop
muda = { version = "0.20.0", optional = true }
tao = { version = "0.37.2", optional = true }
wry = { version = "0.57.2", optional = true }

[features]
desktop = ["dep:muda", "dep:tao", "dep:wry"]

[[bin]]
name = "bovabon_edu"
path = "src/main.rs"

[[bin]]
name = "bovabon-desktop"
path = "src/bin/desktop.rs"
required-features = ["desktop"]

[profile.release]
strip = true
