# Điều phối model Codex theo loại job (đọc bởi scripts/codex-run.sh mỗi lần gọi job).
# Dòng đầu tiên khớp tên job (glob bash) được dùng. Cột: <mẫu tên job> <model> <reasoning effort>
# Ghi đè tạm thời cho mọi job: CODEX_MODEL=… CODEX_EFFORT=… ./scripts/codex-handoff.sh
#
# Chế độ TIẾT KIỆM (mặc định):
#  - gpt-6-luna (nhanh, rẻ): dịch, sửa lỗi, soạn theo khuôn rõ (ngữ pháp, từ vựng, nghe, nói, CEFR).
#  - gpt-6.2-sol / medium: phần cần suy luận (câu Senior/Lead + bài code, system design,
#    IELTS Reading/Writing). Chất lượng đủ dùng nhờ check + bank-stats chặn lỗi.
#  - Không dùng gpt-6.2-astra và effort high/max/ultra trừ khi cần chất lượng cao hơn
#    (đổi tạm: CODEX_MODEL=gpt-6.2-astra CODEX_EFFORT=high).

fix-*               gpt-6-luna      low
en-*                gpt-6-luna      low
ui-*                gpt-6.2-sol     medium
system-design       gpt-6.2-sol     medium
lvl-*               gpt-6.2-sol     medium
ielts-reading       gpt-6.2-sol     medium
ielts-writing-*     gpt-6.2-sol     medium
ielts-*             gpt-6-luna      medium
devdocs-*           gpt-6-luna      medium
cefr-*              gpt-6-luna      medium
*                   gpt-6-luna      medium
